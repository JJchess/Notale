<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{position:relative;overflow:hidden}

.kicker{position:absolute;left:68px;top:44px;font-size:var(--fs-label)}
h1{position:absolute;left:68px;top:66px;right:120px;font-size:var(--fs-h2);line-height:1.18;letter-spacing:-.02em}
.lead{position:absolute;left:68px;top:150px;right:120px;font-size:var(--fs-lead);line-height:1.5;color:var(--muted)}
.lead b{color:var(--text);font-weight:600}

/* sentence strip */
.sentence{position:absolute;left:68px;top:222px;display:flex;gap:10px;align-items:baseline}
.tok{font-size:var(--fs-body);padding:4px 10px;border:1px solid var(--line);border-radius:2px;color:var(--muted)}
.tok[data-role="query"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.tok[data-role="key"]{color:var(--text)}
.tok .idx{font-size:var(--fs-tick);color:var(--muted);margin-right:6px}

/* main evidence stage */
.evidence{position:absolute;left:68px;top:266px;right:68px;bottom:112px;display:grid;grid-template-columns:300px 1fr 300px;column-gap:0}
.col{position:relative;display:flex;flex-direction:column;justify-content:center}
.col-title{position:absolute;top:0;left:0;font-size:var(--fs-label);color:var(--muted);letter-spacing:.02em}

/* query column */
.qv-block{margin-top:44px}
.vec-label{font-size:var(--fs-label);color:var(--muted);margin-bottom:6px}
.vec-label .who{color:var(--accent);font-weight:600}
.vec{display:flex;gap:6px}
.vc{width:52px;height:40px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:var(--fs-tick)}
.vc.q{border-color:var(--accent);color:var(--accent)}

.kv-row{display:flex;flex-direction:column;gap:26px;margin-top:6px}
.kv-item .vec-label .who{color:var(--stable)}
.kv-item .vc.k{border-color:var(--stable);color:var(--stable)}
.kv-item .vc.v{border-color:var(--text);color:var(--text)}
.kv-item .vec+.vec-label{margin-top:8px}

/* middle: dot product -> softmax -> weight bars */
.mid-svg{width:100%;height:100%}
.readout-block{margin-top:0}

.formula-row{position:absolute;left:68px;bottom:44px;right:68px;display:flex;align-items:baseline;gap:28px;border-top:1px solid var(--line);padding-top:14px}
.formula-row .eq{font-size:var(--fs-body)}
.formula-row .note{font-size:var(--fs-label);color:var(--muted);flex:1}
.formula-row .caveat{font-size:var(--fs-label);color:var(--accent);font-weight:600}

text{font-family:var(--font-sans)}
.axlabel{fill:var(--muted)}
</style>
</head>
<body data-page="NN" data-total="44">
<div id="stage">
  <div class="kicker nt-kicker">注意力机制 · 内容寻址</div>
  <h1 class="nt-title">查询与键决定相关性，权重加权值；位置信息不在其中</h1>
  <p class="lead nt-body">同一个词向量分别投影出查询 <b>q</b>、键 <b>k</b>、值 <b>v</b> 三个角色。查询与每个键做点积再归一化，得到的权重只由内容相似度决定——把词打乱顺序输入，这套计算会给出完全相同的结果。</p>

  <div class="sentence" id="sentence"></div>

  <div class="evidence">
    <div class="col" id="col-q">
      <div class="col-title nt-label">查询（当前词）</div>
      <div class="qv-block">
        <div class="vec-label nt-label"><span class="who">q</span>&nbsp;来自 “电影”</div>
        <div class="vec"><div class="vc q">0.9</div><div class="vc q">0.1</div><div class="vc q">0.2</div></div>
      </div>
    </div>
    <div class="col" id="col-mid">
      <svg class="mid-svg" viewBox="0 0 900 480" id="midsvg"></svg>
    </div>
    <div class="col" id="col-out">
      <div class="col-title nt-label">读出（加权求和）</div>
      <div class="readout-block" id="readout"></div>
    </div>
  </div>

  <div class="formula-row">
    <span class="eq nt-mono" id="eqline">softmax(q·k₁, q·k₂, q·k₃) → 权重 → Σ 权重·v</span>
    <span class="note nt-body">权重来自 q 与 k 的相似度，与词出现在句中第几位无关。</span>
    <span class="caveat">位置信息需另行注入</span>
  </div>
</div>
<script src="assets/base.js"></script>
<script>
(function(){
  // ---- fixed teaching data (hand-traceable, 3-dim) ----
  const words = ["这部", "电影", "很", "无聊", "但", "音效", "惊艳"];
  const queryIdx = 1; // "电影"
  const keyIdx = [3, 5, 6]; // "无聊" "音效" "惊艳" as candidate keys to weigh against
  const q = [0.9, 0.1, 0.2];
  // k, v pairs for the three candidate words (teaching-simplified, fixed)
  const items = [
    { word:"无聊", k:[-0.8, 0.6, 0.1], v:[-1.0, 0.2, 0.0] },
    { word:"音效", k:[0.7, 0.2, 0.6], v:[0.1, 0.9, 0.3] },
    { word:"惊艳", k:[0.85, -0.1, 0.4], v:[0.8, 0.7, 0.2] }
  ];

  function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
  const scores = items.map(it => dot(q, it.k));
  const mx = Math.max(...scores);
  const exps = scores.map(s => Math.exp(s - mx));
  const sumExp = exps.reduce((a,b)=>a+b,0);
  const weights = exps.map(e => e/sumExp);
  const readout = [0,0,0];
  items.forEach((it, i) => { readout[0]+=weights[i]*it.v[0]; readout[1]+=weights[i]*it.v[1]; readout[2]+=weights[i]*it.v[2]; });

  // ---- sentence strip ----
  const sentenceEl = document.getElementById("sentence");
  words.forEach((w, i) => {
    const isQuery = i === queryIdx;
    const isKey = keyIdx.includes(i);
    const span = document.createElement("span");
    span.className = "tok";
    span.setAttribute("data-role", isQuery ? "query" : (isKey ? "key" : "other"));
    span.innerHTML = '<span class="idx">'+(i+1)+'</span>' + w;
    sentenceEl.appendChild(span);
  });

  // ---- key/value column (rendered into col-q via extra block appended after query, but spec says col split q|mid|out) ----
  // Build kv list inside the middle-left area is not right per layout; instead render kv rows under query column? 
  // Correction: keys/values sit conceptually beside query -> but grid has 3 cols (q, mid, out). Put k/v labels into mid svg's left zone instead.

  const svg = document.getElementById("midsvg");
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs){
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function text(x,y,str,cls,size){
    const t = el("text", {x:x, y:y, class:cls||"", "font-size":size||16, "text-anchor":"middle"});
    t.textContent = str;
    return t;
  }

  const rowY = [70, 240, 410];
  const kx = 70, dotx = 330, wx = 520, barx0 = 620, barx1 = 860;

  // column headers
  svg.appendChild(text(kx, 24, "键 k（候选词）", "axlabel nt-label", 15));
  svg.appendChild(text(dotx, 24, "q·k", "axlabel nt-label", 15));
  svg.appendChild(text(wx, 24, "softmax 权重", "axlabel nt-label", 15));
  svg.appendChild(text((barx0+barx1)/2, 460, "权重条", "axlabel nt-label", 14));

  items.forEach((it, i) => {
    const y = rowY[i];
    const stableColor = "var(--stable)";
    // key vector box group
    const g = el("g", {});
    // word label
    g.appendChild(text(kx, y-34, it.word, "nt-label", 15));
    // k vector cells
    it.k.forEach((val, ci) => {
      const cx = kx - 54 + ci*54;
      const rect = el("rect", {x:cx-24, y:y-14, width:46, height:32, fill:"none", stroke:"var(--stable)", "stroke-width":1});
      g.appendChild(rect);
      g.appendChild(text(cx, y+7, val.toFixed(1), "", 13));
    });

    // connector to dot line
    const path1 = el("path", {d:`M ${kx+72} ${y} L ${dotx-40} ${y}`, class:"nt-diagram-line", fill:"none"});
    g.appendChild(path1);
    g.appendChild(text(dotx, y+5, scores[i].toFixed(2), "nt-mono", 20));

    // connector to weight
    const path2 = el("path", {d:`M ${dotx+40} ${y} L ${wx-46} ${y}`, class:"nt-diagram-line", fill:"none"});
    g.appendChild(path2);
    g.appendChild(text(wx, y+5, weights[i].toFixed(2), "nt-mono", 20));
    g.getElementsByTagName ? null : null;
    // make weight number colored by magnitude via accent when dominant
    const wnode = g.lastChild;
    wnode.setAttribute("fill", i === weights.indexOf(Math.max(...weights)) ? "var(--accent)" : "var(--text)");

    // bar
    const barMaxW = barx1 - barx0;
    const barRect = el("rect", {x:barx0, y:y-12, width: Math.max(2, barMaxW*weights[i]), height:24,
      fill: i === weights.indexOf(Math.max(...weights)) ? "var(--accent)" : "var(--stable)"});
    g.appendChild(barRect);
    const barFrame = el("rect", {x:barx0, y:y-12, width:barMaxW, height:24, fill:"none", stroke:"var(--line)"});
    g.appendChild(barFrame);

    svg.appendChild(g);
  });

  // ---- readout column ----
  const readoutEl = document.getElementById("readout");
  let html = '<div class="vec-label nt-body">加权和 = Σ 权重ᵢ · vᵢ</div>';
  items.forEach((it,i) => {
    html += `<div style="display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px;color:var(--muted)">
      <span style="width:44px;color:${i===weights.indexOf(Math.max(...weights))?'var(--accent)':'var(--muted)'};font-weight:${i===weights.indexOf(Math.max(...weights))?'600':'400'}">${weights[i].toFixed(2)}</span>
      <span>×</span>
      <span class="nt-mono">[${it.v.map(x=>x.toFixed(1)).join(', ')}]</span>
      <span style="margin-left:auto">${it.word}</span>
    </div>`;
  });
  html += `<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">
    <div class="vec-label nt-label">读出向量</div>
    <div class="vec">
      <div class="vc" style="border-color:var(--accent);color:var(--accent)">${readout[0].toFixed(2)}</div>
      <div class="vc" style="border-color:var(--accent);color:var(--accent)">${readout[1].toFixed(2)}</div>
      <div class="vc" style="border-color:var(--accent);color:var(--accent)">${readout[2].toFixed(2)}</div>
    </div>
  </div>`;
  readoutEl.innerHTML = html;

  Deck.init({ index: 38, total: 44 });
})();
</script>
</body>
</html>
