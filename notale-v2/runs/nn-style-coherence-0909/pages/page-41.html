<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{padding:56px 64px 40px;display:flex;flex-direction:column;gap:0}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
.head .nt-kicker{margin-bottom:6px}
.head h1{font-size:var(--fs-h2);margin:0}
.head p{max-width:640px;text-align:right;color:var(--muted);font-size:var(--fs-label);line-height:1.5}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;flex:1;min-height:0}
.task{
  display:flex;flex-direction:column;gap:0;min-height:0;
  border-top:2px solid var(--line);padding-top:14px
}
.task-head{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.task-name{font-size:var(--fs-sec);font-weight:700;line-height:1.25}
.task-desc{font-size:var(--fs-label);color:var(--muted);line-height:1.4}

.trait-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.trait{display:flex;align-items:baseline;gap:8px;font-size:var(--fs-label)}
.trait .k{color:var(--muted);flex:0 0 auto;white-space:nowrap}
.trait .v{font-weight:600}

.arch-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.arch-btn{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px;border:1px solid var(--line);background:none;
  font-family:var(--font-sans);font-size:var(--fs-label);color:var(--text);
  cursor:pointer;text-align:left
}
.arch-btn:hover{border-color:var(--accent)}
.arch-btn[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, transparent)}
.arch-btn .score{
  font-family:var(--font-sans);font-weight:700;font-size:var(--fs-tick);
  min-width:2.6em;text-align:right;color:var(--muted)
}
.arch-btn[data-band="strong"] .score{color:var(--accent)}
.arch-btn[data-band="weak"] .score{color:var(--stable)}

.verdict{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.verdict .tag{align-self:flex-start}
.verdict-body{font-size:var(--fs-label);line-height:1.5}
.verdict-body b{font-weight:700}
.verdict-body .miss{color:var(--stable)}
.verdict-body .hit{color:var(--accent)}
.placeholder{font-size:var(--fs-label);color:var(--muted);line-height:1.5}

.foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:baseline;gap:24px}
.foot .nt-note{flex:1;max-width:900px}
.total{font-family:var(--font-sans);font-size:var(--fs-tick);color:var(--muted);white-space:nowrap}
.total b{color:var(--text);font-size:var(--fs-sec);font-weight:700}
</style>
</head>
<body data-page="NN" data-total="44">
<div id="stage">

  <div class="head">
    <div>
      <div class="nt-kicker">架构诊断</div>
      <h1 class="nt-title" style="font-size:var(--fs-h2)">四个任务，四次选择：结构假设对不对？</h1>
    </div>
    <p class="nt-body">为每个任务选一种起点架构。判定依据任务的真实数据结构——空间局部性、顺序依赖、排列不变性、样本独立性，不是猜答案。</p>
  </div>

  <div class="board" id="board"></div>

  <div class="foot">
    <div class="nt-note" id="footNote">选完全部四个任务，查看匹配总分与逐项理由。</div>
    <div class="total">匹配总分 <b id="totalScore">—</b> / 20</div>
  </div>

</div>
<script src="assets/base.js"></script>
<script>
(() => {
"use strict";

// ---- canonical task/architecture model ---------------------------------

const ARCHS = [
  { id:"mlp",  label:"MLP（全连接）" },
  { id:"cnn",  label:"CNN（卷积）" },
  { id:"rnn",  label:"RNN/LSTM（循环）" },
  { id:"attn", label:"注意力" }
];

// score(0-5) + reason per (task, arch), derived from stated structural traits.
// 5 = 结构假设吻合；3 = 可用但错配代价明显；1 = 结构假设直接冲突。
const TASKS = [
  {
    id:"image", name:"图像分类", desc:"28×28 手写数字，单张独立图片。",
    traits:[
      ["空间结构","相邻像素强相关，局部图案有意义"],
      ["位置意义","数字可能出现在图内不同位置"],
      ["样本关系","图片之间互相独立，无先后顺序"]
    ],
    scores:{
      mlp:{v:2, why:"把像素拉成一维向量，丢弃邻域关系；同一图案换个位置要重新学一组权重。"},
      cnn:{v:5, why:"局部连接+权重共享正对应“邻近像素相关、图案可能出现在不同位置”。参数量也远低于全连接。"},
      rnn:{v:1, why:"图片没有天然的时间顺序，把像素强行按行展开成序列，等于给模型加了一条不存在的因果链。"},
      attn:{v:3, why:"可行（ViT 式做法），但把图切成块再建模全局关系，对这种小图规模是过度设计，训练数据需求也更高。"}
    }
  },
  {
    id:"sentiment", name:"情感判断", desc:"一句话，词的顺序影响含义。",
    traits:[
      ["顺序依赖","“不好”和“好不”意义相反，词序改变含义"],
      ["长度可变","句子长短不一"],
      ["上下文范围","否定词、转折词可能影响很远的词"]
    ],
    scores:{
      mlp:{v:1, why:"要求固定长度输入，且丢弃词序——page-03 已展示词序打乱后全连接网络的判断不变，这正是问题所在。"},
      cnn:{v:3, why:"用小窗口卷积能抓住局部短语，但窗口外的长距离修饰（如句首否定影响句尾）需要堆很深才能覆盖。"},
      rnn:{v:4, why:"按词序递推，天然处理可变长度和顺序依赖；但长距离否定要跨很多步保留，容易被后续词冲淡（对照 page-32）。"},
      attn:{v:5, why:"任意两个词可以直接建立权重连接，不管相隔多远；对短句情感中的远距离修饰词效果最直接。"}
    }
  },
  {
    id:"sensor", name:"传感器时间序列", desc:"设备振动读数，等间隔采样，用于故障预警。",
    traits:[
      ["时间因果","当前状态由过去演化而来，不能看到未来"],
      ["趋势与周期","异常常表现为渐变趋势或周期性偏移"],
      ["流式输入","新数据点持续到达，需要在线更新判断"]
    ],
    scores:{
      mlp:{v:2, why:"必须先固定一个时间窗口再摊平，窗口边界之外的趋势看不到，也不能自然地逐点更新。"},
      cnn:{v:3, why:"1D 卷积能捕捉局部周期和短时模式，是常见工程起点，但对覆盖整段历史的慢趋势需要很大感受野。"},
      rnn:{v:5, why:"逐时间步更新隐藏状态，天然满足因果顺序和在线更新；这正是循环结构为“流式、有先后”数据设计的场景。"},
      attn:{v:3, why:"需要限制只看过去（因果掩码）才不会偷看未来，且对等间隔连续信号不像离散词那样有清晰的“查询对象”。"}
    }
  },
  {
    id:"tabular", name:"表格分类", desc:"每行是一个客户的固定字段：年龄、收入、地区等。",
    traits:[
      ["特征独立","各列含义不同，交换两列顺序不改变每行含义"],
      ["无空间/时间结构","字段之间没有邻近或先后关系"],
      ["样本独立","每行是独立个体，互不影响"]
    ],
    scores:{
      mlp:{v:5, why:"固定长度特征向量、无空间或时序假设，正是全连接层的适用前提；这也是表格数据最常见的起点。"},
      cnn:{v:1, why:"卷积假设“相邻位置相关”，但把年龄放在收入旁边纯属列的排列顺序，不存在真实邻域关系可共享。"},
      rnn:{v:1, why:"字段之间没有先后依赖，硬套循环结构等于假设了一条不存在的因果链，还会引入多余的训练难度。"},
      attn:{v:2, why:"可以把每个字段当 token 做特征间注意力（表格 Transformer 思路），但对少量固定字段通常不比简单 MLP 更值。"}
    }
  }
];

function band(v){ return v>=4 ? "strong" : v<=2 ? "weak" : "mid"; }

// ---- state ---------------------------------------------------------------

function createInitialState(){
  return { picks: Object.fromEntries(TASKS.map(t => [t.id, null])) };
}
let state = createInitialState();

function totalScore(){
  return TASKS.reduce((sum,t) => {
    const pick = state.picks[t.id];
    return sum + (pick ? t.scores[pick].v : 0);
  }, 0);
}

// ---- render ---------------------------------------------------------------

const board = document.getElementById("board");

function renderBoard(){
  board.innerHTML = TASKS.map(t => {
    const traitsHtml = t.traits.map(([k,v]) =>
      `<div class="trait"><span class="k">${k}</span><span class="v">${v}</span></div>`
    ).join("");

    const pick = state.picks[t.id];

    const archHtml = ARCHS.map(a => {
      const pressed = pick === a.id;
      const entry = t.scores[a.id];
      const showScore = pick ? true : false;
      const dataBand = pick ? band(entry.v) : "";
      return `<button class="arch-btn" data-task="${t.id}" data-arch="${a.id}"
        aria-pressed="${pressed}" data-band="${dataBand}">
        <span>${a.label}</span>
        <span class="score">${showScore ? entry.v + "/5" : ""}</span>
      </button>`;
    }).join("");

    let verdictHtml;
    if (!pick){
      verdictHtml = `<div class="placeholder">选一种架构作为这个任务的起点。</div>`;
    } else {
      const entry = t.scores[pick];
      const tagWord = entry.v>=4 ? "匹配" : entry.v<=2 ? "错配" : "可用但勉强";
      verdictHtml = `
        <span class="nt-tag">${tagWord} · ${entry.v}/5</span>
        <div class="verdict-body">${entry.why}</div>`;
    }

    return `<div class="task" id="task-${t.id}">
      <div class="task-head">
        <div class="task-name">${t.name}</div>
        <div class="task-desc">${t.desc}</div>
      </div>
      <div class="trait-list">${traitsHtml}</div>
      <div class="arch-row">${archHtml}</div>
      <div class="verdict">${verdictHtml}</div>
    </div>`;
  }).join("");
}

function renderFoot(){
  const allPicked = TASKS.every(t => state.picks[t.id]);
  document.getElementById("totalScore").textContent = allPicked ? totalScore() : "—";
  const footNote = document.getElementById("footNote");
  if (!allPicked){
    footNote.textContent = "选完全部四个任务，查看匹配总分与逐项理由。";
  } else {
    const s = totalScore();
    if (s >= 18) footNote.textContent = "四组选择都贴合各任务的数据结构——20 分是四个 5/5 的上限，说明每个起点都对应了真实的归纳偏置。";
    else if (s >= 12) footNote.textContent = "整体可用，但至少一项选择让架构的结构假设和任务实际不完全对应，付出了可避免的训练代价。";
    else footNote.textContent = "多项选择的结构假设和任务冲突：架构选错不是训练不够，是先验假设本身就不适配这类数据。";
  }
}

function render(){
  renderBoard();
  renderFoot();
}

function dispatch(taskId, archId){
  state.picks[taskId] = state.picks[taskId] === archId ? null : archId;
  render();
}

board.addEventListener("click", e => {
  const btn = e.target.closest(".arch-btn");
  if (!btn) return;
  dispatch(btn.dataset.task, btn.dataset.arch);
});

render();
Deck.init({ index:41, total:44 });
})();
</script>
</body>
</html>
