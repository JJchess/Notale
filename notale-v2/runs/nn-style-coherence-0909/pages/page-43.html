<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{ position:relative; background:var(--bg); color:var(--text); font-family:var(--font-sans); overflow:hidden; }

.kicker{ position:absolute; left:64px; top:44px; }
h1.nt-title{ position:absolute; left:64px; top:74px; width:1472px; margin:0; font-size:var(--fs-h2); line-height:1.18; }
.subhead{ position:absolute; left:64px; top:150px; width:1300px; }

/* 主图区域 */
#chain-wrap{ position:absolute; left:64px; top:224px; width:1472px; height:548px; }
svg#chain{ width:100%; height:100%; display:block; overflow:visible; }

/* 底部结语 */
.closing{ position:absolute; left:64px; top:806px; width:1472px; border-top:1px solid var(--line); padding-top:14px; display:flex; justify-content:space-between; align-items:baseline; }
.closing .nt-note{ margin:0; max-width:1040px; }
.closing .nt-tag{ white-space:nowrap; }

text.tier-label{ font-family:var(--font-sans); }
text.node-title{ font-family:var(--font-sans); font-weight:700; }
text.node-body{ font-family:var(--font-sans); }
text.mono{ font-family:var(--font-mono, ui-monospace, monospace); }
</style>
</head>
<body data-page="NN" data-total="44">
<div id="stage">

  <p class="nt-kicker kicker">收束 · 06</p>
  <h1 class="nt-title">结构决定偏置，偏置约束参数，证据决定取信</h1>
  <p class="subhead nt-lead">全课每个例子都在回答同一条因果链上的四个问题——把 MLP、CNN、RNN、注意力放回这条链，看它们各自怎样填。</p>

  <div id="chain-wrap"><svg id="chain" viewBox="0 0 1472 566" preserveAspectRatio="xMidYMid meet"></svg></div>

  <div class="closing">
    <p class="nt-note">四条支线在“归纳偏置”一格分岔，在“训练证据”一格重新汇合——结构不同，但都要靠验证集和部署条件说话，没有一种结构天生免检。</p>
    <p class="nt-tag">下一页：离堂检验</p>
  </div>

</div>
<script src="assets/base.js"></script>
<script>
(function(){
  "use strict";
  const svg = document.getElementById("chain");
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  const text = (x, y, str, cls, anchor) => {
    const t = el("text", { x, y, class: cls || "", "text-anchor": anchor || "start" });
    t.textContent = str;
    return t;
  };
  const tspans = (x, y, lines, cls, lh) => {
    const t = el("text", { x, y, class: cls || "" });
    lines.forEach((line, i) => {
      const s = el("tspan", { x, dy: i === 0 ? 0 : lh });
      s.textContent = line;
      t.appendChild(s);
    });
    return t;
  };

  // ---- 主干四环：输入结构 / 归纳偏置 / 可学习参数 / 训练证据 ----
  const TIERS = [
    { key: "input",  cx: 130, label: "输入结构" },
    { key: "bias",   cx: 486, label: "归纳偏置" },
    { key: "param",  cx: 842, label: "可学习参数" },
    { key: "proof",  cx: 1198, label: "训练证据" }
  ];
  const trunkY = 40;

  // ---- 四条支线：MLP / CNN / RNN / 注意力 ----
  const LANES = [
    {
      key: "mlp", y: 150, color: "var(--muted)",
      input: "任意向量，位置无先验",
      bias: ["全连接：不假设结构", "每个输入独立加权"],
      param: "每层 O(n·m) 权重",
      proof: "XOR 边界、训练/验证曲线"
    },
    {
      key: "cnn", y: 268, color: "var(--accent)",
      input: "图像，邻近像素相关",
      bias: ["局部连接 + 权重共享", "平移等变，非不变"],
      param: "每个卷积核跨位置复用",
      proof: "特征图响应、参数量对照"
    },
    {
      key: "rnn", y: 386, color: "var(--stable)",
      input: "序列，顺序携带信息",
      bias: ["递推压缩历史到隐藏态", "同一组参数逐步复用"],
      param: "跨时间步共享的权重矩阵",
      proof: "隐藏态轨迹、长程遗忘现象"
    },
    {
      key: "attn", y: 504, color: "#8a5a3b",
      input: "序列，位置需另行编码",
      bias: ["按内容直接连接位置", "Q/K/V 计算相关性权重"],
      param: "线性投影矩阵 Q、K、V",
      proof: "权重分布随查询变化"
    }
  ];

  const laneLabelX = 40;
  const nodeW = { input: 176, bias: 216, param: 196, proof: 216 };

  function draw() {
    svg.innerHTML = "";
    const defs = el("defs");
    const arrow = el("marker", { id: "arrow", viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
    const arrowPath = el("path", { d: "M0,0 L10,5 L0,10 Z" });
    arrowPath.setAttribute("fill", Deck.token("--muted"));
    arrow.appendChild(arrowPath);
    defs.appendChild(arrow);
    svg.appendChild(defs);

    const gGuides = el("g", { class: "guides" });
    const gTrunk = el("g", { class: "trunk" });
    const gLanes = el("g", { class: "lanes" });
    svg.appendChild(gGuides);
    svg.appendChild(gLanes);
    svg.appendChild(gTrunk);

    // 纵向引导线：贯穿四层，标出主干环节
    TIERS.forEach(t => {
      const line = el("line", { x1: t.cx, y1: 10, x2: t.cx, y2: 556, stroke: "var(--line)", "stroke-width": 1, "stroke-dasharray": "2 6" });
      gGuides.appendChild(line);
    });

    // 主干标签环（顶部）
    TIERS.forEach((t, i) => {
      const ring = el("circle", { cx: t.cx, cy: trunkY, r: 30, fill: "var(--bg)", stroke: "var(--text)", "stroke-width": 1.6 });
      gTrunk.appendChild(ring);
      gTrunk.appendChild(text(t.cx, trunkY + 5, String(i + 1), "mono node-title", "middle"));
      gTrunk.appendChild(text(t.cx, trunkY + 52, t.label, "nt-label tier-label", "middle"));
      if (i < TIERS.length - 1) {
        const next = TIERS[i + 1];
        gTrunk.appendChild(el("line", {
          x1: t.cx + 34, y1: trunkY, x2: next.cx - 34, y2: trunkY,
          stroke: "var(--text)", "stroke-width": 1.6, "marker-end": "url(#arrow)"
        }));
      }
    });

    // 每条支线：左侧架构名 + 四个节点框 + 连接
    LANES.forEach(lane => {
      const g = el("g", { class: "lane" });
      gLanes.appendChild(g);

      // 架构名
      const nameLabel = { mlp: "MLP", cnn: "CNN", rnn: "RNN", attn: "注意力" }[lane.key];
      const nameNode = text(laneLabelX, lane.y + 5, nameLabel, "node-title", "start");
      nameNode.setAttribute("fill", lane.color);
      nameNode.style.fontSize = "18px";
      g.appendChild(nameNode);

      const rowY = lane.y;
      const boxH = 76;
      const boxY = rowY - boxH / 2;

      const cells = [
        { tier: "input", cx: TIERS[0].cx, w: nodeW.input, content: [lane.input] },
        { tier: "bias", cx: TIERS[1].cx, w: nodeW.bias, content: lane.bias },
        { tier: "param", cx: TIERS[2].cx, w: nodeW.param, content: [lane.param] },
        { tier: "proof", cx: TIERS[3].cx, w: nodeW.proof, content: [lane.proof] }
      ];

      cells.forEach((cell, ci) => {
        const x = cell.cx - cell.w / 2;
        const rect = el("rect", {
          x, y: boxY, width: cell.w, height: boxH, rx: 3,
          fill: "var(--bg)", stroke: lane.color, "stroke-width": ci === 1 ? 2 : 1.1
        });
        g.appendChild(rect);
        const lines = cell.content;
        const lh = 19;
        const startY = rowY - ((lines.length - 1) * lh) / 2 + 5;
        const t = tspans(cell.cx, startY, lines, "nt-label node-body", lh);
        t.setAttribute("text-anchor", "middle");
        t.setAttribute("fill", "var(--text)");
        g.appendChild(t);

        if (ci < cells.length - 1) {
          const nextCell = cells[ci + 1];
          const x1 = cell.cx + cell.w / 2;
          const x2 = nextCell.cx - nextCell.w / 2;
          g.appendChild(el("line", {
            x1, y1: rowY, x2, y2: rowY,
            stroke: lane.color, "stroke-width": 1.3, opacity: 0.75,
            "marker-end": "url(#arrow)"
          }));
        }
      });
    });

    // 分岔/汇合指示：在归纳偏置环下方，用一条弱化的合流线暗示"同源分岔、同处验证"
    const mergeNote = text(TIERS[3].cx, 40, "", "nt-label", "middle");
    svg.appendChild(mergeNote);
  }

  draw();
  Deck.onResize(draw);
})();
</script>
</body>
</html>
