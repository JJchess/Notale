<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
:root{--fs-cover:96px;--fs-cover-en:26px;--fs-cover-claim:24px;}
.page-main{position:static!important;}
.cover-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:0;z-index:0;}
.cover-shade{position:absolute;inset:0;z-index:1;background:linear-gradient(100deg,rgba(8,7,6,.94) 0%,rgba(8,7,6,.80) 42%,rgba(8,7,6,.15) 78%);}
.cover{position:absolute;z-index:2;left:92px;top:50%;width:760px;transform:translateY(-39%);display:flex;flex-direction:column;align-items:flex-start;}
.eyebrow{margin:0 0 17px;color:var(--text-3);font-size:var(--fs-label);line-height:1.4;letter-spacing:.18em;font-weight:600;}
.cover-title{margin:0;white-space:nowrap;font-size:var(--fs-cover);font-weight:700;line-height:1.05;letter-spacing:-.035em;text-shadow:0 2px 22px rgba(0,0,0,.34);}
.cover-title .gene{color:var(--gene)}
.cover-title .cult{color:var(--cult)}
.cover-title .word{display:inline-block;}
.cover-en{margin:13px 0 20px;color:var(--text-3);font-size:var(--fs-cover-en);line-height:1.35;letter-spacing:.06em;font-weight:400;}
.cover .axisline{width:420px;flex:0 0 2px;opacity:.9;transform-origin:left center;}
.cover-claim{max-width:640px;margin-top:25px;border-left:4px solid var(--gene);padding:2px 0 2px 18px;font-size:var(--fs-cover-claim);line-height:1.45;font-weight:500;color:var(--text);}
.cover-claim strong{font-weight:700;color:var(--text);}
.cover-supports{margin:20px 0 0 22px;display:grid;gap:8px;position:relative;max-width:680px;}
.cover-supports .support{position:relative;padding-left:22px;font-size:var(--fs-sec);color:var(--text-2);line-height:1.5;}
.cover-supports .support::before{content:"";position:absolute;left:6px;top:.7em;width:9px;height:1px;background:var(--gene);opacity:.75;}
.cover-supports .trunk{position:absolute;left:6px;top:0;bottom:0;width:1px;background:var(--line);}
@media (prefers-reduced-motion:no-preference){
  .cover-title .gene{animation:word-in .6s cubic-bezier(.2,.75,.25,1) both;}
  .cover-title .cult{animation:word-in .6s .18s cubic-bezier(.2,.75,.25,1) both;}
  .cover .axisline{animation:line-in .62s .35s cubic-bezier(.2,.75,.25,1) both;}
  .cover-claim,.cover-supports{animation:fade-in .48s .67s ease-out both;}
}
@keyframes word-in{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes line-in{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body data-page="01" data-total="44">
<div id="stage"><main id="main">
  <img class="cover-bg" src="assets/img/illus-savanna.png" alt="非洲草原上直立行走的早期人族剪影" title="生成插画（非真实照片）：非洲草原上直立行走的早期人族剪影">
  <div class="cover-shade" aria-hidden="true"></div>
  <section class="cover" aria-labelledby="cover-title">
    <p class="eyebrow">通识课 · 90 分钟</p>
    <h1 class="cover-title" id="cover-title"><span>从</span><span class="word gene">猿人</span><span>到</span><span class="word cult">太空人</span></h1>
    <p class="cover-en" lang="en">From Apeman to Spaceman</p>
    <div class="axisline" aria-hidden="true"></div>
    <div class="cover-claim"><strong>演化没有给我们任何一项太空适应。</strong>366 万年里这具身体几乎没变，变的是信息传下去的方式。</div>
    <div class="cover-supports">
      <i class="trunk" aria-hidden="true"></i>
      <div class="support">六幕 · 44 页</div>
      <div class="support">幕 I 讲身体，幕 II–IV 讲身体之外的东西，幕 V–VI 讲两者对不上</div>
      <div class="support">方向键翻页</div>
    </div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:0, title:null, bleed:true, foot:null });
</script>
</body></html>
