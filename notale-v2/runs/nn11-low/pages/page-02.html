<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>两个脚印</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:12px}
.photo-pair{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.photo-pair figure{height:242px;display:flex;flex-direction:column}
.photo-pair .photo{height:214px;flex:0 0 214px;overflow:hidden;border-radius:var(--r);background:var(--panel)}
.photo-pair img{object-fit:cover;object-position:center}
.photo-pair figcaption{margin-top:6px;font-size:var(--fs-label);color:var(--text-2)}
.cmp{grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);gap:0 18px;flex:1;align-content:stretch}
.cmp .hdr{padding:5px 12px 7px}
.cmp .hdr.gene{color:var(--gene)}
.cmp .hdr.cult{color:var(--cult)}
.cmp .dim,.cmp .cell{padding:6px 12px;line-height:1.35}
.cmp .cell{font-size:var(--fs-sec)}
.cmp .dim{padding-left:0}
.cmp .focus{background:var(--panel);padding-top:7px;padding-bottom:7px}
.cmp .focus.dim{border-radius:8px 0 0 8px}
.cmp .focus.end{border-radius:0 8px 8px 0}
.cmp .same{color:var(--gene-2);font-weight:700}
.cmp .outside{color:var(--cult-2);font-weight:700}
.close{margin:0;padding:2px 0 4px 168px;font-size:var(--fs-lead);line-height:1.4;color:var(--text-2)}
.close strong{color:var(--text)}
</style>
</head>
<body data-page="02" data-total="44">
<div id="stage"><main id="main">
  <section class="photo-pair" aria-label="两处脚印照片对照">
    <div aria-hidden="true"></div>
    <figure class="min0">
      <div class="photo"><img src="assets/img/laetoli-trackway.jpg" alt="Laetoli 一串古人类足迹" title="Laetoli 足迹复制品（日本国立科学博物馆） · Momotarou2012 · CC BY-SA 3.0"></div>
      <figcaption>坦桑尼亚 Laetoli，约 366 万年前</figcaption>
    </figure>
    <figure class="min0">
      <div class="photo"><img src="assets/img/moon-bootprint.jpg" alt="月面上的 Apollo 11 靴印" title="Apollo 11 靴印，1969 年 7 月 · NASA/JSC · 公有领域"></div>
      <figcaption>月球静海，1969 年 7 月 20 日</figcaption>
    </figure>
  </section>

  <section class="cmp" aria-label="两个脚印在六个共同维度上的比较">
    <div class="dim hdr">同一维度</div><div class="hdr gene">LAETOLI 足迹</div><div class="hdr cult">月面靴印</div>

    <div class="dim">时间</div><div class="cell num">约 366 万年前</div><div class="cell num">1969 年 7 月 20 日</div>
    <div class="rowline"></div>
    <div class="dim">地点</div><div class="cell">坦桑尼亚，Laetoli</div><div class="cell">月球，静海</div>
    <div class="rowline"></div>
    <div class="dim">留下者</div><div class="cell">南方古猿阿法种（很可能）</div><div class="cell">Neil Armstrong 与 Buzz Aldrin</div>
    <div class="rowline"></div>
    <div class="dim">为什么留得住</div><div class="cell">火山灰落下，一场雨，然后再一层灰盖住</div><div class="cell">没有风，没有水，没有生物</div>
    <div class="rowline"></div>
    <div class="dim focus">这只脚</div><div class="cell focus same">有足弓，拇趾不外张，重心从脚跟推到前掌</div><div class="cell focus same end">同上</div>
    <div class="rowline"></div>
    <div class="dim focus">脚外面</div><div class="cell focus">什么都没有</div><div class="cell focus outside end">21 层的月面靴，一整套生命保障系统</div>
  </section>

  <p class="close"><strong>中间这 366 万年，身体几乎没动。</strong>动的是脚外面那层东西。</p>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:0, title:'两个脚印', sub:'相隔 366 万年，同一个动作：一只脚压进松软的地面。', foot:'这两个脚印的脚，解剖学上几乎是同一只。差的全在脚外面。' });
</script>
</body></html>
