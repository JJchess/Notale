<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:14px}
.readout{flex:0 0 auto;display:grid;grid-template-columns:1.05fr .62fr 1.8fr;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0 14px;gap:26px}
.readout>div{min-width:0}
.metric{border-right:1px solid var(--line-soft);padding-right:22px}
.k{display:block;font-size:var(--fs-label);color:var(--text-3);letter-spacing:.06em;margin-bottom:4px}
.v{display:block;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:26px;line-height:1.2;color:var(--gene-2)}
.world .v{font-family:var(--font-sans);font-size:var(--fs-lead);color:var(--text);font-weight:650;letter-spacing:0}
.ruler{flex:1 1 auto;min-height:0;border:1px solid var(--line-soft);background:linear-gradient(180deg,rgba(34,27,22,.72),rgba(15,13,12,.38));cursor:crosshair;touch-action:none}
.ruler:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.hint{flex:0 0 auto;justify-content:flex-end;padding-bottom:2px}
</style>
</head>
<body data-page="04" data-total="44">
<div id="stage"><main id="main">
  <section class="readout" aria-live="polite">
    <div class="metric"><span class="k">距今</span><strong class="v" id="ago">—</strong></div>
    <div class="metric"><span class="k">7 米尺上的位置</span><strong class="v"><span id="mm">—</span> <span class="unit">mm</span></strong></div>
    <div class="world"><span class="k">当时的世界</span><strong class="v" id="world">—</strong></div>
  </section>
  <div class="cvbox ruler no-pan min0" id="ruler" role="slider" tabindex="0" aria-label="从700万年前到今天的时间尺" aria-valuemin="0" aria-valuemax="7000000" aria-valuenow="3660000">
    <canvas class="cv-fill" id="cv"></canvas>
  </div>
  <div class="hint">在尺子上拖动，看那个时刻发生了什么</div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:1, title:'700 万年有多长', sub:'把它换成一段看得见的长度：7 米的尺子，1 毫米 = 1000 年。', foot:'尺子的最后 5 毫米里挤着全部有文字的历史。先看这 7 米前面发生了什么。' });

var events=[
 [7000000,'人族与黑猩猩的谱系分开'],[4400000,'地猿：已有部分直立特征'],[3660000,'Laetoli 的那串脚印'],
 [3300000,'已知最早的石器（肯尼亚 Lomekwi 3）'],[2600000,'奥杜威石器'],[1900000,'直立人出现'],
 [1000000,'用火的确证（南非 Wonderwerk 洞）'],[300000,'智人最早化石（摩洛哥 Jebel Irhoud）'],
 [65000,'智人到达澳大利亚'],[12000,'农业开始'],[5200,'最早的文字（乌鲁克）'],[123,'第一次动力飞行'],[57,'阿波罗 11 号']
];
var t=3660000, dragging=false, cv=document.getElementById('cv'), box=document.getElementById('ruler');
var ago=document.getElementById('ago'), mm=document.getElementById('mm'), world=document.getElementById('world');
function nearest(v){return events.reduce(function(a,b){return Math.abs(b[0]-v)<Math.abs(a[0]-v)?b:a},events[0]);}
function update(){
 var pos=(7000000-t)/7000000*7000, n=nearest(t);
 ago.textContent=Chrome.ago(t); mm.textContent=pos<6990?pos.toFixed(0):pos.toFixed(2); world.textContent=n[1];
 box.setAttribute('aria-valuenow',Math.round(t)); box.setAttribute('aria-valuetext',Chrome.ago(t)+'，'+n[1]); draw();
}
function setFromEvent(e){var p=Deck.pt(cv,e), pad=58, w=cv.offsetWidth-pad*2; t=Deck.clamp(7000000-(p.x-pad)/w*7000000,0,7000000);update();}
box.addEventListener('pointerdown',function(e){dragging=true;box.setPointerCapture(e.pointerId);setFromEvent(e)});
box.addEventListener('pointermove',function(e){if(dragging)setFromEvent(e)});
box.addEventListener('pointerup',function(){dragging=false});
box.addEventListener('keydown',function(e){var d=e.shiftKey?100000:10000;if(e.key==='ArrowRight'){t=Math.max(0,t-d);update();e.preventDefault()}if(e.key==='ArrowLeft'){t=Math.min(7000000,t+d);update();e.preventDefault()}});
function draw(){
 var c=Deck.fit(cv), W=cv.offsetWidth,H=cv.offsetHeight, pad=58, x0=pad,x1=W-pad,y=Math.round(H*.48), axis=x1-x0;
 c.clearRect(0,0,W,H); c.lineCap='round';
 c.strokeStyle=Deck.token('--line');c.lineWidth=2;c.beginPath();c.moveTo(x0,y);c.lineTo(x1,y);c.stroke();
 c.fillStyle=Deck.token('--text-2');c.beginPath();c.moveTo(x1+10,y);c.lineTo(x1-3,y-7);c.lineTo(x1-3,y+7);c.fill();
 c.font='13px '+Deck.token('--font-num');c.textBaseline='top';c.fillStyle=Deck.token('--text-3');
 for(var i=0;i<=7;i++){var x=x0+axis*i/7;c.strokeStyle=Deck.token('--line');c.lineWidth=1;c.beginPath();c.moveTo(x,y-9);c.lineTo(x,y+10);c.stroke();c.textAlign=i===0?'left':i===7?'right':'center';c.fillText((7-i)+'00 万年',x,y+17)}
 c.font='15px '+Deck.token('--font-sans');c.textBaseline='bottom';
 events.slice(0,8).forEach(function(e,j){var x=x0+(7000000-e[0])/7000000*axis, top=j%2===0;yoff=top?-48:58;c.strokeStyle=Deck.rgba('--gene',.55);c.beginPath();c.moveTo(x,y);c.lineTo(x,y+(top?-18:18));c.stroke();c.fillStyle=Deck.token('--gene');c.beginPath();c.arc(x,y,4,0,Math.PI*2);c.fill();c.fillStyle=Deck.token('--text-2');c.textAlign=x>x1-130?'right':x<x0+80?'left':'center';c.fillText(e[1].split('（')[0],x,y+yoff)});
 var cx=x0+(7000000-t)/7000000*axis;c.strokeStyle=Deck.token('--cult');c.lineWidth=2;c.beginPath();c.moveTo(cx,34);c.lineTo(cx,H-32);c.stroke();c.fillStyle=Deck.token('--cult');c.beginPath();c.moveTo(cx,y-13);c.lineTo(cx-7,y-25);c.lineTo(cx+7,y-25);c.fill();
 // 最后 10 mm 的局部放大窗
 var iw=430,ih=118,ix=W-iw-68,iy=30;c.fillStyle='rgba(8,7,6,.94)';c.strokeStyle=Deck.token('--cult-dim');c.lineWidth=1;Deck.rr(c,ix,iy,iw,ih,8);c.fill();c.stroke();
 c.fillStyle=Deck.token('--text-3');c.font='15px '+Deck.token('--font-sans');c.textAlign='left';c.textBaseline='top';c.fillText('最后 10 mm 放大',ix+16,iy+12);
 var ax0=ix+18,ax1=ix+iw-18,ay=iy+78;c.strokeStyle=Deck.token('--line');c.beginPath();c.moveTo(ax0,ay);c.lineTo(ax1,ay);c.stroke();
 [[5200,'文字'],[123,'飞机'],[57,'登月']].forEach(function(e,k){var mmv=(7000000-e[0])/7000000*7000,x=ax0+(mmv-6990)/10*(ax1-ax0);c.strokeStyle=Deck.token('--cult');c.beginPath();c.moveTo(x,ay-9);c.lineTo(x,ay+9);c.stroke();c.fillStyle=Deck.token('--text');c.font='15px '+Deck.token('--font-sans');c.textAlign=k===0?'center':k===1?'right':'left';c.fillText(e[1],x+(k===2?3:k===1?-3:0),iy+45+(k===0?0:k===1?-18:18));});
 c.fillStyle=Deck.token('--cult-2');c.font='16px '+Deck.token('--font-sans');c.textAlign='right';c.fillText('三者全部挤在最后 5.2 mm',ix+iw-16,iy+12);
}
Deck.autofit(cv,draw);update();
</script>
</body></html>
