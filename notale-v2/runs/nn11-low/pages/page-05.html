<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:10px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;flex:1;min-height:0}.chartwrap{min-height:0;display:flex;flex-direction:column;border:1px solid var(--line-soft);border-radius:var(--r);background:rgba(25,21,18,.66);padding:8px 12px 10px}.chartwrap svg{width:100%;height:100%;display:block;min-height:0}.side{display:flex;flex-direction:column;gap:12px;min-height:0}.detail{flex:1;display:flex;flex-direction:column;justify-content:center}.detail .latin{font-size:var(--fs-h2);font-style:italic;color:var(--gene-2);line-height:1.3;margin:4px 0 14px}.detail h2{font-size:var(--fs-h2);margin:0;line-height:1.3}.facts{display:grid;grid-template-columns:82px 1fr;gap:9px 8px;font-size:var(--fs-sec)}.facts .k{color:var(--text-3)}.facts .v{color:var(--text)}.feature{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line-soft);font-size:var(--fs-sec);line-height:1.5;color:var(--text-2)}.peak{flex:0 0 auto;border-left:3px solid var(--gene);padding:8px 0 8px 14px;font-size:var(--fs-sec);line-height:1.45;color:var(--text-2)}.peak b{color:var(--gene-2)}.hint{flex:0 0 auto}.axis text,.ticktext{font-family:var(--font-num);font-size:var(--fs-tick);fill:var(--text-3)}.axis path,.axis line{stroke:var(--line)}.group-label{font-size:var(--fs-label);font-weight:700;fill:var(--text-2)}.species-label{font-size:var(--fs-label);fill:var(--text-2)}.count-label{font-size:var(--fs-sec);fill:var(--text-2)}.species{cursor:pointer;outline:none}.species:focus-visible .life,.species:hover .life{stroke:var(--text);stroke-width:2}.life{transition:opacity .12s,stroke-width .12s}.selected .life{stroke:#fff;stroke-width:2.5}.selected .species-label{fill:#fff;font-weight:700}
</style>
</head>
<body data-page="05" data-total="44">
<div id="stage"><main id="main">
  <div class="layout min0">
    <section class="chartwrap min0" aria-label="人族各属及物种存续时间图">
      <svg id="tree" role="img" aria-label="按属分组的人族物种时间条，以及同时存在的物种数曲线"></svg>
    </section>
    <aside class="side min0">
      <section class="panel detail" aria-live="polite">
        <div class="ttl gene">当前物种</div><h2 id="cn"></h2><div class="latin" id="latin"></div>
        <div class="facts"><span class="k">存续区间</span><span class="v num" id="range"></span><span class="k">脑容量</span><span class="v num" id="brain"></span><span class="k">归属</span><span class="v" id="genus"></span></div>
        <p class="feature" id="feature"></p>
      </section>
      <div class="peak"><b>190 万年前</b>，地球上至少有五种人族同时活着。今天只剩一种——这才是不正常的那一年。</div>
      <div class="hint">点任意一条，看它是谁</div>
    </aside>
  </div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
Chrome.mount({ act:1, title:'是一丛灌木，不是一条直线', sub:'教科书插图上那排越站越直的猿人，把真实情况画反了。', foot:'既然不是一条直线，那"我们从黑猩猩变来的"这句话错在哪？' });
const data=[
 {g:'Sahelanthropus',s:'tchadensis',cn:'乍得沙赫人',a:7.2,b:6.8,brain:'~360',f:'已知最早期的人族候选之一。'},
 {g:'Ardipithecus',s:'ramidus',cn:'始祖地猿',a:4.5,b:4.3,brain:'~350',f:'仍善于攀爬，也有直立行走的线索。'},
 {g:'Australopithecus',s:'anamensis',cn:'湖畔种',a:4.2,b:3.8,brain:'~370',f:'早期南方古猿，生活在东非。'},
 {g:'Australopithecus',s:'afarensis',cn:'阿法种',a:3.9,b:2.9,brain:'~450',f:'Laetoli 脚印所处时代的人族；默认选中，承接那串脚印。'},
 {g:'Australopithecus',s:'africanus',cn:'非洲种',a:3.3,b:2.1,brain:'~460',f:'生活在南部非洲，面部与牙齿较纤细。'},
 {g:'Australopithecus',s:'sediba',cn:'sediba',a:2.0,b:1.9,brain:'~420',f:'保留古老特征，也呈现若干较晚近特征。'},
 {g:'Paranthropus',s:'boisei',cn:'鲍氏傍人',a:2.3,b:1.2,brain:'~510',f:'颌骨和臼齿粗壮，是旁支而非直线台阶。'},
 {g:'Paranthropus',s:'robustus',cn:'粗壮傍人',a:2.0,b:1.2,brain:'~530',f:'南部非洲的粗壮型旁支。'},
 {g:'Homo',s:'habilis',cn:'能人',a:2.4,b:1.65,brain:'~610',f:'早期 Homo，与其他属长期共存。'},
 {g:'Homo',s:'erectus',cn:'直立人',a:1.9,b:.11,brain:'~950',f:'存续很久、分布很广的 Homo 成员。'},
 {g:'Homo',s:'heidelbergensis',cn:'海德堡人',a:.7,b:.2,brain:'~1200',f:'中更新世 Homo；内部谱系关系仍有争议。'},
 {g:'Homo',s:'neanderthalensis',cn:'尼安德特人',a:.43,b:.04,brain:'~1450',f:'曾与智人在欧亚大陆同时存在。'},
 {g:'Homo',s:'naledi',cn:'naledi',a:.335,b:.236,brain:'~510',f:'年代很晚，却保留较小脑容量。'},
 {g:'Homo',s:'floresiensis',cn:'弗洛勒斯人',a:.10,b:.05,brain:'~420',f:'直到很晚仍生活在弗洛勒斯岛。'},
 {g:'Homo',s:'sapiens',cn:'智人',a:.31,b:0,brain:'~1350',f:'今天唯一存活的人族物种。'},
 {g:'Pan',s:'troglodytes',cn:'黑猩猩',a:1.0,b:0,brain:'~400',f:'参照组：这里不把它列作人族。'}
];
const groups=[['早期','Sahelanthropus','Ardipithecus'],['Australopithecus','Australopithecus'],['Paranthropus','Paranthropus'],['Homo','Homo'],['Pan 黑猩猩','Pan']];
const svg=d3.select('#tree'), W=1120,H=548, left=180,right=895,chartTop=34,rowH=25;
svg.attr('viewBox',`0 0 ${W} ${H}`);
const x=d3.scaleLinear().domain([7.2,0]).range([left,right]);
const axis=d3.axisTop(x).tickValues([7,6,5,4,3,2,1,0]).tickFormat(d=>d===0?'今天':d+' Ma').tickSize(5);
svg.append('g').attr('class','axis').attr('transform',`translate(0,${chartTop-7})`).call(axis);
let y=chartTop+4; const positions=[];
groups.forEach(gr=>{const members=data.filter(d=>gr.slice(1).includes(d.g));const y0=y;members.forEach(d=>{positions.push({d,y});y+=rowH});const y1=y-5;svg.append('line').attr('x1',10).attr('x2',10).attr('y1',y0).attr('y2',y1).attr('stroke',gr[0].startsWith('Pan')?'var(--line)':'var(--gene-dim)').attr('stroke-width',2);svg.append('text').attr('class','group-label').attr('x',22).attr('y',(y0+y1)/2+5).text(gr[0]);y+=5});
const rows=svg.selectAll('.species').data(positions).join('g').attr('class','species').attr('tabindex',0).attr('role','button').attr('aria-label',p=>p.d.cn).attr('transform',p=>`translate(0,${p.y})`).on('click keydown',function(e,p){if(e.type==='click'||e.key==='Enter'||e.key===' '){e.preventDefault();select(p.d)}});
rows.append('line').attr('x1',p=>x(p.d.a)).attr('x2',p=>x(p.d.b)).attr('y1',9).attr('y2',9).attr('class','life').attr('stroke',p=>p.d.g==='Homo'?'var(--gene-2)':p.d.g==='Pan'?'var(--text-3)':'var(--gene-dim)').attr('stroke-width',10).attr('stroke-linecap','round');
rows.append('text').attr('class','species-label').attr('x',p=>Math.min(x(p.d.b)+9,900)).attr('y',14).text(p=>p.d.s+(p.d.cn===p.d.s?'':' '+p.d.cn));
const curveTop=y+7, curveH=48; svg.append('text').attr('class','count-label').attr('x',10).attr('y',curveTop+22).text('同时存在的人族物种数');
const samples=d3.range(7.2,-.001,-.05).map(t=>({t,n:data.filter(d=>d.g!=='Pan'&&d.a>=t&&d.b<=t).length}));
const cy=d3.scaleLinear().domain([0,d3.max(samples,d=>d.n)]).range([curveTop+curveH,curveTop]);
svg.append('path').datum(samples).attr('d',d3.area().x(d=>x(d.t)).y0(curveTop+curveH).y1(d=>cy(d.n)).curve(d3.curveStepAfter)).attr('fill','rgba(224,145,58,.18)');
svg.append('path').datum(samples).attr('d',d3.line().x(d=>x(d.t)).y(d=>cy(d.n)).curve(d3.curveStepAfter)).attr('fill','none').attr('stroke','var(--gene)').attr('stroke-width',2);
svg.append('line').attr('x1',x(1.9)).attr('x2',x(1.9)).attr('y1',curveTop-3).attr('y2',curveTop+curveH).attr('stroke','var(--gene-2)').attr('stroke-dasharray','3 3');
svg.append('text').attr('class','ticktext').attr('x',x(1.9)+6).attr('y',curveTop+10).attr('fill','var(--gene-2)').text('1.9 Ma');
function fmt(v){return v===0?'今天':(Number.isInteger(v)?v:v.toFixed(3).replace(/0+$/,'').replace(/\.$/,''))+' Ma'}
function select(d){rows.classed('selected',p=>p.d===d);document.getElementById('cn').textContent=d.cn;document.getElementById('latin').textContent=d.g+' '+d.s;document.getElementById('range').textContent=fmt(d.a)+' — '+fmt(d.b);document.getElementById('brain').textContent=d.brain+' cc';document.getElementById('genus').textContent=d.g;document.getElementById('feature').textContent=d.f}
select(data.find(d=>d.s==='afarensis'));
</script>
</body></html>
