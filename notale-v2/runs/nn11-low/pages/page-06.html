<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:14px}
.controls{display:flex;align-items:center;justify-content:space-between;gap:18px;flex:0 0 auto}
.model{flex:1 1 auto;min-height:0;position:relative;border:1px solid var(--line-soft);border-radius:var(--r);background:linear-gradient(180deg,rgba(34,27,22,.62),rgba(15,13,12,.25));overflow:hidden}
.model svg{display:block;width:100%;height:100%}
.edge{fill:none;stroke:var(--text-3);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.edge.wrong{stroke:var(--warn)}
.node circle{fill:var(--panel-2);stroke:var(--text-3);stroke-width:2}
.node text{fill:var(--text);font-family:var(--font-sans);font-size:var(--fs-body);font-weight:700;text-anchor:middle;dominant-baseline:middle}
.node .subtxt{fill:var(--text-2);font-size:var(--fs-sec);font-weight:400}
.branch-label{fill:var(--gene-2);font-family:var(--font-num);font-size:var(--fs-sec);text-anchor:middle}
.cross{stroke:var(--warn);stroke-width:8;stroke-linecap:round}
.ancestor-note{position:absolute;left:76px;bottom:18px;width:380px;padding:10px 14px;border-left:3px solid var(--text-3);background:rgba(15,13,12,.88);font-size:var(--fs-sec);line-height:1.4;color:var(--text-2);opacity:0;transform:translateY(8px);pointer-events:none}
.ancestor-note b{color:var(--text)}
.facts{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:4px}
.fact{min-width:0;border-top:1px solid var(--line);padding:10px 14px 0 28px;position:relative;font-size:var(--fs-sec);line-height:1.45;color:var(--text-2)}
.fact::before{content:attr(data-n);position:absolute;left:0;top:9px;color:var(--acc);font-family:var(--font-num);font-weight:700}
.fact strong{color:var(--text)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-page="06" data-total="44">
<div id="stage"><main id="main">
  <div class="controls min0">
    <div class="btns" role="group" aria-label="关系模型">
      <button class="btn lg" id="common" aria-pressed="true">常见的说法</button>
      <button class="btn lg" id="actual" aria-pressed="false">实际的关系</button>
    </div>
    <div class="hint">按一下，看这两句话的结构差在哪</div>
  </div>

  <section class="model min0" aria-label="黑猩猩与人类关系模型">
    <svg viewBox="0 0 1488 345" role="img" aria-labelledby="diagram-title diagram-desc">
      <title id="diagram-title">常见直线模型与实际分叉模型</title>
      <desc id="diagram-desc">常见说法把黑猩猩、猿人、直立人和现代人连成一条链；实际关系是共同祖先分叉为黑猩猩和智人两支。</desc>
      <path id="e1" class="edge wrong" d="M250 172 L510 172"/>
      <path id="e2" class="edge wrong" d="M590 172 L850 172"/>
      <path id="e3" class="edge wrong" d="M930 172 L1190 172"/>
      <path id="yb1" class="edge" opacity="0" d="M340 172 C570 172 620 88 850 88"/>
      <path id="yb2" class="edge" opacity="0" d="M340 172 C570 172 620 258 850 258"/>
      <g id="n-chimp" class="node" transform="translate(190 172)"><circle r="59"/><text y="-7">黑猩猩</text><text class="subtxt" y="20">（今天）</text></g>
      <g id="n-ape" class="node" transform="translate(550 172)"><circle r="53"/><text>猿人</text></g>
      <g id="n-erect" class="node" transform="translate(890 172)"><circle r="53"/><text>直立人</text></g>
      <g id="n-human" class="node" transform="translate(1250 172)"><circle r="59"/><text y="-7">现代人</text><text class="subtxt" y="20">（今天）</text></g>
      <g id="n-ancestor" class="node" transform="translate(260 172)" opacity="0"><circle r="70"/><text y="-12">共同祖先</text><text class="subtxt" y="17">约 700 万年前</text></g>
      <g id="branch-top" opacity="0"><text class="branch-label" x="665" y="66">700 万年演化 · 约 28 万代 →</text></g>
      <g id="branch-bottom" opacity="0"><text class="branch-label" x="665" y="292">700 万年演化 · 约 28 万代 →</text></g>
      <g id="bad-cross"><line class="cross" x1="720" y1="128" x2="770" y2="216"/><line class="cross" x1="770" y1="128" x2="720" y2="216"/></g>
    </svg>
    <div class="ancestor-note" id="ancestorNote"><b>没有化石能确指它。</b>它既不是黑猩猩，也不是人。</div>
  </section>

  <div class="facts min0" aria-label="三个要点">
    <div class="fact" data-n="1">黑猩猩和我们分开之后，<strong>它那一支也演化了同样长的时间</strong>。它不是“没变的我们”。</div>
    <div class="fact" data-n="2">“猿人”不是一个物种，是一个通俗说法。真正的名字见上一页那丛灌木。</div>
    <div class="fact" data-n="3">我们和黑猩猩的 DNA 差异约 <strong class="num">1.2%</strong>（单碱基替换口径）。这 <span class="num">1.2%</span> 里没有一条是“太空适应”。</div>
  </div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/anime.min.js"></script>
<script>
Chrome.mount({ act:1, title:'我们不是从黑猩猩变来的', sub:'黑猩猩不是我们的祖先，是我们的表亲——而且它也演化了 700 万年。', foot:'那丛灌木里，我们这一支最先变的不是脑子，是走路的方式。' });
var common=document.getElementById('common'), actual=document.getElementById('actual');
var nodes={chimp:document.getElementById('n-chimp'),ape:document.getElementById('n-ape'),erect:document.getElementById('n-erect'),human:document.getElementById('n-human'),ancestor:document.getElementById('n-ancestor')};
var pos={chimp:{x:190,y:172},ape:{x:550,y:172},erect:{x:890,y:172},human:{x:1250,y:172},ancestor:{x:260,y:172}};
function place(){Object.keys(nodes).forEach(function(k){nodes[k].setAttribute('transform','translate('+pos[k].x+' '+pos[k].y+')')})}
function setModel(real){
  common.setAttribute('aria-pressed',String(!real)); actual.setAttribute('aria-pressed',String(real));
  anime.remove(Object.values(pos));
  var target=real?{chimp:[1080,88],human:[1080,258],ancestor:[270,172]}:{chimp:[190,172],human:[1250,172],ancestor:[260,172]};
  ['chimp','human','ancestor'].forEach(function(k){anime({targets:pos[k],x:target[k][0],y:target[k][1],duration:Deck.reduced()?0:700,easing:'easeInOutCubic',update:place})});
  anime({targets:['#n-ape','#n-erect','#e1','#e2','#e3','#bad-cross'],opacity:real?0:1,duration:Deck.reduced()?0:350,easing:'linear'});
  anime({targets:['#n-ancestor','#yb1','#yb2','#branch-top','#branch-bottom','#ancestorNote'],opacity:real?1:0,duration:Deck.reduced()?0:350,delay:real?300:0,easing:'linear'});
}
common.addEventListener('click',function(){setModel(false)}); actual.addEventListener('click',function(){setModel(true)});
place();
</script>
</body></html>
