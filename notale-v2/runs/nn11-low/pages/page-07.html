<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:10px}
.phase{display:grid;grid-template-columns:34.3% 1fr;gap:8px;flex:0 0 auto;margin-left:120px;margin-right:360px}
.phase>div{position:relative;padding:7px 14px;border-radius:7px;font-size:var(--fs-label);font-weight:700;line-height:1.25}
.phase .early{color:var(--gene-2);background:rgba(224,145,58,.10);border:1px solid var(--gene-dim)}
.phase .late{color:var(--cult-2);background:rgba(95,200,216,.09);border:1px solid var(--cult-dim)}
.phase>div::after{content:"→";position:absolute;right:10px;color:currentColor;font-size:var(--fs-body)}
.chart-wrap{flex:1 1 auto;min-height:0;position:relative;border:1px solid var(--line-soft);border-radius:var(--r);background:rgba(15,13,12,.45);overflow:hidden}
#chart{position:absolute;inset:0}
.readout{position:absolute;right:18px;top:14px;z-index:3;width:310px;padding:12px 15px;background:rgba(15,13,12,.92);border:1px solid var(--line);border-radius:8px;pointer-events:none;font-size:var(--fs-sec);line-height:1.45}
.readout .time{font-family:var(--font-num);font-size:var(--fs-lead);color:var(--text);margin-bottom:5px}
.readout .line{display:flex;justify-content:space-between;gap:12px;color:var(--text-2)}
.readout b{font-weight:600;color:var(--text)}
.control-row{flex:0 0 auto;display:grid;grid-template-columns:1fr auto;align-items:center;gap:22px}
.ctl{min-width:0}.ctl input{direction:rtl}.hint{white-space:nowrap}
.claimline{flex:0 0 auto;border-left:4px solid var(--gene);padding:5px 14px;font-size:var(--fs-lead);line-height:1.35;color:var(--text-2)}
.claimline b{color:var(--gene-2)}
</style>
</head>
<body data-page="07" data-total="44">
<div id="stage"><main id="main">
  <div class="phase" aria-label="时间过程的两个相位">
    <div class="early">4.4–2.0 Ma　直立已确立，脑容量几乎不动</div>
    <div class="late">2.0 Ma–今　脑容量三倍化</div>
  </div>
  <section class="chart-wrap min0 no-pan" aria-label="人族颅容量随时间变化的散点图">
    <div id="chart"></div>
    <div class="readout" aria-live="polite">
      <div class="time" id="rTime"></div>
      <div class="line"><span>活着的人族</span><b id="rSpecies"></b></div>
      <div class="line"><span>最大颅容量</span><b id="rBrain"></b></div>
      <div class="line"><span>直立</span><b id="rWalk"></b></div>
      <div class="line"><span>石器</span><b id="rTool"></b></div>
    </div>
  </section>
  <div class="control-row min0">
    <label class="ctl min0"><span class="cl">时间游标</span><input id="cursor" type="range" min="0" max="7" step="0.01" value="3" aria-label="距今百万年"><span class="cv" id="cursorVal">3.00 Ma</span></label>
    <div class="hint">拖动竖线，读那个时刻的世界</div>
  </div>
  <div class="claimline">直立比大脑早了 <b>240 万年</b>——大约 <b>10 万代人</b>。这两件事之间没有“因为所以”。</div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
Chrome.mount({ act:1, title:'先直立，两百万年后才变大脑', sub:'顺序本身就是证据：不是"因为聪明所以站起来"，是先站起来，很久以后脑子才开始长。', foot:'既然站起来在前，那站起来先解决的一定不是聪明的问题。是什么问题？' });
var points=[
 {value:[7.0,360,'乍得沙赫人'],label:{position:'right',formatter:'乍得沙赫人'}},[4.4,350,'始祖地猿'],[4.1,370,'湖畔种'],[3.2,450,'阿法种'],
 [2.8,460,'非洲种'],[2.3,510,'鲍氏傍人'],[2.0,610,'能人'],[1.8,850,'直立人（早）'],
 [0.5,1000,'直立人（晚）'],[0.5,1200,'海德堡人'],[0.1,1450,'尼安德特人'],[0.0,1350,'智人']
];
var intervals=[
 ['乍得沙赫人',7.0,6.0,360],['始祖地猿',4.4,4.2,350],['湖畔种',4.2,3.9,370],
 ['阿法种',3.9,2.9,450],['非洲种',3.3,2.1,460],['鲍氏傍人',2.3,1.2,510],
 ['能人',2.4,1.4,610],['直立人',1.9,0.1,1000],['海德堡人',0.7,0.2,1200],
 ['尼安德特人',0.4,0.04,1450],['智人',0.3,0,1350]
];
var chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
var gene=getComputedStyle(document.documentElement).getPropertyValue('--gene').trim();
var cult=getComputedStyle(document.documentElement).getPropertyValue('--cult').trim();
var option={
 animation:false,textStyle:{fontFamily:getComputedStyle(document.documentElement).getPropertyValue('--font-sans'),fontSize:16,color:'#ece7df'},
 grid:{left:120,right:360,top:48,bottom:58},
 xAxis:{type:'value',min:0,max:7,inverse:true,name:'距今（百万年）',nameLocation:'middle',nameGap:38,nameTextStyle:{fontSize:16,color:'#b9ada0'},axisLabel:{fontSize:14,color:'#b9ada0'},axisLine:{lineStyle:{color:'#594b40'}},splitLine:{lineStyle:{color:'#2a231e'}}},
 yAxis:{type:'value',min:0,max:1600,interval:400,name:'颅容量（cc）',nameTextStyle:{fontSize:16,color:'#b9ada0'},axisLabel:{fontSize:14,color:'#b9ada0'},axisLine:{show:true,lineStyle:{color:'#594b40'}},splitLine:{lineStyle:{color:'#2a231e'}}},
 tooltip:{trigger:'item',textStyle:{fontSize:16},formatter:function(p){var d=p.value;return d[2]+'<br>'+d[0]+' Ma · '+d[1]+' cc';}},
 series:[
  {name:'人族',type:'scatter',data:points,symbolSize:11,itemStyle:{color:gene},label:{show:true,formatter:function(p){return p.value[2];},position:'top',distance:6,fontSize:15,color:'#ece7df'},labelLayout:{hideOverlap:true},
   markLine:{silent:true,symbol:['none','none'],label:{show:true,fontSize:14,color:'#ece7df',backgroundColor:'rgba(15,13,12,.82)',padding:[3,6]},lineStyle:{type:'dashed',width:1.5,color:gene},data:[{xAxis:4.4,label:{formatter:'4.4 Ma 地猿已有直立特征',position:'insideStartTop'}},{xAxis:3.66,label:{formatter:'3.66 Ma Laetoli 足迹确证直立',position:'insideStartTop'}}]},
   markArea:{silent:true,label:{show:true,fontSize:15,fontWeight:'bold',position:'insideBottom',color:'#f0b874'},data:[[{name:'直立已确立，脑容量 240 万年几乎没动',xAxis:4.4,itemStyle:{color:'rgba(224,145,58,.12)'}},{xAxis:2.0}],[{name:'脑容量在这段里翻了近三倍',xAxis:2.0,itemStyle:{color:'rgba(95,200,216,.10)'},label:{color:'#9de3ee'}},{xAxis:0}]]}},
  {name:'黑猩猩参照',type:'scatter',data:[[0,400,'黑猩猩（参照）']],symbolSize:10,itemStyle:{color:'#8b8078'},label:{show:true,formatter:'黑猩猩（参照）',position:'left',fontSize:15,color:'#8b8078'}}
 ]
};
chart.setOption(option);
var slider=document.getElementById('cursor');
function update(){
 var t=+slider.value, alive=intervals.filter(function(d){return t<=d[1]&&t>=d[2];});
 var species=alive.map(function(d){return d[0];}).join('、')||'尚无本页记录';
 var brain=alive.length?Math.max.apply(null,alive.map(function(d){return d[3];}))+' cc':'—';
 document.getElementById('cursorVal').textContent=t.toFixed(2)+' Ma';
 document.getElementById('rTime').textContent='距今 '+t.toFixed(2)+' 百万年';
 document.getElementById('rSpecies').textContent=species;
 document.getElementById('rBrain').textContent=brain;
 document.getElementById('rWalk').textContent=t<=3.66?'确证':(t<=4.4?'部分直立':'未确证');
 document.getElementById('rTool').textContent=t<=3.3?'已有':'尚无证据';
 var x=chart.convertToPixel({xAxisIndex:0},t);
 chart.setOption({graphic:[{id:'cursorLine',type:'line',silent:true,z:20,shape:{x1:x,y1:48,x2:x,y2:chart.getHeight()-58},style:{stroke:'#ffffff',lineWidth:2,shadowBlur:8,shadowColor:cult}},{id:'cursorDot',type:'circle',silent:true,z:21,shape:{cx:x,cy:48,r:5},style:{fill:cult}}]});
}
slider.addEventListener('input',update);chart.on('finished',function(){if(!chart.__ready){chart.__ready=true;update();}});window.addEventListener('resize',function(){chart.resize();update();});update();
</script>
</body></html>
