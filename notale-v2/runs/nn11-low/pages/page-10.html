<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大脑的账单</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:24px;align-items:stretch}
.budget{display:flex;flex-direction:column;gap:14px;padding:18px 22px 16px}
.scale{display:grid;grid-template-columns:132px 1fr;align-items:end;gap:14px}
.ticks{height:28px;position:relative;border-bottom:1px solid var(--line)}
.tick{position:absolute;bottom:5px;transform:translateX(-50%);font:var(--fs-tick)/1 var(--font-num);color:var(--text-3)}
.tick:first-child{transform:none}.tick:last-child{transform:translateX(-100%)}
.tick::after{content:"";position:absolute;left:50%;top:16px;width:1px;height:7px;background:var(--line)}
.brow{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.rowname{font-size:var(--fs-sec);color:var(--text-2);line-height:1.35;text-align:right}
.rowname b{display:block;font-size:var(--fs-body)}
.stack{height:82px;display:flex;position:relative;overflow:visible;border-radius:8px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line-soft)}
.seg{height:100%;display:flex;align-items:center;justify-content:center;min-width:0;border-right:1px solid rgba(15,13,12,.55);transition:width .08s linear;color:#130f0c;font-size:var(--fs-label);font-weight:700;line-height:1.15;text-align:center;overflow:hidden}
.seg:last-child{border-right:0}.seg span{pointer-events:none}.seg small{display:block;font:var(--fs-tick)/1.2 var(--font-num);color:inherit;margin-top:4px}
.brain{background:#e0913a}.liver{background:#b9ada0}.heart{background:#8f8479}.kidney{background:#a89a8e}.muscle{background:#d0b486}.gut{background:#a8713d}.other{background:#756b63;color:var(--text)}
.drag{position:absolute;z-index:4;top:-7px;width:18px;height:96px;transform:translateX(-9px);cursor:ew-resize;touch-action:none;outline:none}
.drag::before{content:"";position:absolute;left:7px;top:0;width:4px;height:100%;border-radius:3px;background:var(--cult);box-shadow:0 0 0 2px var(--bg),0 0 14px rgba(95,200,216,.5)}
.drag::after{content:"↔";position:absolute;left:-5px;top:28px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--cult);color:#10100f;font:700 var(--fs-label)/1 var(--font-sans)}
.drag:focus-visible::after{outline:3px solid var(--text);outline-offset:3px}
.legend{padding-top:4px;justify-content:center}.legend .sw{border-radius:2px}
.readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
.read{border-top:1px solid var(--line);padding:10px 8px 0;text-align:center}.read .v{font:600 28px/1.1 var(--font-num);color:var(--text)}.read .k{font-size:var(--fs-label);color:var(--text-3);margin-top:4px}.read.alert .v{color:var(--warn)}
.status{min-height:26px;text-align:center;color:var(--warn);font-size:var(--fs-sec);font-weight:600}
.controls{display:flex;align-items:center;justify-content:space-between;gap:14px}.hint{margin:0}.btn{flex:0 0 auto}
.aside{display:flex;flex-direction:column;gap:14px}
.bill{flex:1;display:flex;flex-direction:column;justify-content:center;border-color:var(--gene-dim);background:linear-gradient(145deg,rgba(224,145,58,.12),var(--panel) 60%)}
.bill .big{color:var(--gene);margin:7px 0}.bill p{margin:5px 0 0;font-size:var(--fs-sec);color:var(--text-2);line-height:1.5}.bill strong{color:var(--gene-2)}
.hyp{padding:16px 18px}.hyp p{margin:6px 0 0;font-size:var(--fs-sec);line-height:1.5;color:var(--text-2)}
.badge{display:inline-block;color:var(--text-3);font-size:var(--fs-label);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
</style>
</head>
<body data-page="10" data-total="44">
<div id="stage"><main id="main">
  <section class="panel budget min0" aria-label="典型灵长类与人类静息能量预算比较">
    <div class="scale"><div class="rowname">静息能量预算</div><div class="ticks" aria-hidden="true"><span class="tick" style="left:0">0%</span><span class="tick" style="left:25%">25%</span><span class="tick" style="left:50%">50%</span><span class="tick" style="left:75%">75%</span><span class="tick" style="left:100%">100%</span></div></div>
    <div class="brow"><div class="rowname"><b>典型灵长类</b>同体重外推</div><div class="stack" id="primate"></div></div>
    <div class="brow"><div class="rowname"><b>人类</b>可拖动预算</div><div class="stack no-pan" id="human"><div class="drag" id="drag" role="slider" tabindex="0" aria-label="人类大脑静息能量占比" aria-valuemin="8" aria-valuemax="30" aria-valuenow="20"></div></div></div>
    <div class="legend" id="legend"></div>
    <div class="readouts">
      <div class="read"><div class="v" id="brainPct">20.0%</div><div class="k">大脑占比</div></div>
      <div class="read"><div class="v" id="kcal">320 kcal</div><div class="k">大脑每天</div></div>
      <div class="read" id="gutRead"><div class="v" id="gutPct">10.0%</div><div class="k">胃肠道占比</div></div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="controls"><p class="hint">拖大脑那一段的边界，看这笔钱从谁那里出</p><button class="btn gene" id="reset" type="button">重置到人类实际</button></div>
  </section>
  <aside class="aside min0">
    <section class="panel bill">
      <div class="ttl gene">最贵的器官</div>
      <div><span class="big">1.4</span><span class="unit">kg</span></div>
      <p>约占体重的 <strong>2%</strong>，却吃掉静息能量的 <strong>20%</strong>。</p>
      <p><strong>每天约 320 kcal</strong>，相当于一整天不吃不动的能量的五分之一。</p>
    </section>
    <section class="panel hyp">
      <span class="badge">量级估计 · 一个假说</span>
      <p>人的胃肠道质量，比同体重哺乳动物的预期<strong>小约 40%</strong>。昂贵组织假说认为：大脑的账，部分从消化道挪来。</p>
    </section>
  </aside>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:1, title:'大脑的账单', sub:'2% 的体重，20% 的能量。这笔钱必须从别的地方挪。', foot:'人类的挪法不是压缩别的器官，而是把食物先在体外处理一遍。' });
const organs=[
 {n:'大脑',c:'brain'},{n:'肝',c:'liver'},{n:'心',c:'heart'},{n:'肾',c:'kidney'},
 {n:'骨骼肌',c:'muscle'},{n:'胃肠道',c:'gut'},{n:'其余',c:'other'}
];
const primate=[8,22,9,8,22,17,14], actual=[20,21,9,8,20,10,12];
const human=document.getElementById('human'), drag=document.getElementById('drag');
function makeStack(el,vals,interactive){
 organs.forEach((o,i)=>{const d=document.createElement('div');d.className='seg '+o.c;d.dataset.i=i;d.style.width=vals[i]+'%';d.innerHTML='<span>'+o.n+'<small>'+vals[i].toFixed(0)+'%</small></span>'; if(interactive) el.insertBefore(d,drag); else el.appendChild(d)});
}
makeStack(document.getElementById('primate'),primate,false);makeStack(human,actual,true);
document.getElementById('legend').innerHTML=organs.map(o=>'<span class="li"><i class="sw '+o.c+'"></i>'+o.n+'</span>').join('');
let brain=20, dragging=false;
function update(v){
 brain=Deck.clamp(v,8,30); const ratio=(100-brain)/80; const vals=[brain,...actual.slice(1).map(x=>x*ratio)];
 human.querySelectorAll('.seg').forEach((d,i)=>{d.style.width=vals[i]+'%';d.querySelector('small').textContent=vals[i].toFixed(1)+'%'});
 drag.style.left=brain+'%';drag.setAttribute('aria-valuenow',brain.toFixed(1));
 document.getElementById('brainPct').textContent=brain.toFixed(1)+'%';document.getElementById('kcal').textContent=Math.round(1600*brain/100)+' kcal';
 const gut=vals[5];document.getElementById('gutPct').textContent=gut.toFixed(1)+'%';
 const low=gut<8;document.getElementById('gutRead').classList.toggle('alert',low);document.getElementById('status').textContent=low?'这样的消化道处理不了生的植物性食物':'';
}
function pointerValue(e){const p=Deck.pt(human,e);return p.x/human.offsetWidth*100}
drag.addEventListener('pointerdown',e=>{dragging=true;drag.setPointerCapture(e.pointerId);update(pointerValue(e))});
drag.addEventListener('pointermove',e=>{if(dragging)update(pointerValue(e))});
drag.addEventListener('pointerup',()=>dragging=false);drag.addEventListener('pointercancel',()=>dragging=false);
drag.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();update(brain-1)}if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();update(brain+1)}if(e.key==='Home'){e.preventDefault();update(8)}if(e.key==='End'){e.preventDefault();update(30)}});
document.getElementById('reset').addEventListener('click',()=>update(20));update(20);
</script>
</body></html>
