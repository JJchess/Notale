<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:14px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;flex:0 0 auto}
.mode{display:flex;align-items:center;gap:14px}
.mode-label{font-size:var(--fs-label);color:var(--text-3);letter-spacing:.06em}
.chart-wrap{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px}
.chart-panel{position:relative;min-height:0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
#chart{position:absolute;inset:0}
.readout{display:flex;flex-direction:column;justify-content:center;gap:22px;padding:20px 0 20px 24px;border-left:1px solid var(--line)}
.readout .eyebrow{font-size:var(--fs-label);color:var(--text-3);letter-spacing:.08em}
.delta{color:var(--gene-2)}
.delta-line{display:flex;align-items:baseline;gap:7px;margin-top:7px}
.explain{font-size:var(--fs-body);line-height:1.5;color:var(--text-2);margin:0}
.year{color:var(--text);font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700}
.body-note{padding-top:18px;border-top:1px solid var(--line-soft);font-size:var(--fs-sec);line-height:1.55;color:var(--text-2)}
.body-note b{color:var(--gene-2)}
.dispute{display:block;margin-top:7px;color:var(--text-3);font-size:var(--fs-label)}
.source{position:absolute;right:12px;bottom:8px;color:var(--text-3);font-size:var(--fs-label);z-index:2}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-page="11" data-total="44">
<div id="stage"><main id="main">
  <div class="toolbar min0">
    <div class="mode">
      <span class="mode-label">人类这一行</span>
      <div class="btns" role="group" aria-label="切换人类进食时间">
        <button id="expected" class="btn gene" type="button" aria-pressed="true">按体重该有的</button>
        <button id="actual" class="btn gene" type="button" aria-pressed="false">实际的</button>
      </div>
    </div>
    <div class="hint">按一下，看人类实际用掉多少时间</div>
  </div>
  <div class="chart-wrap min0">
    <section class="chart-panel min0" aria-label="各物种进食时间占清醒活动时间的比例">
      <div id="chart" role="img" aria-label="大猩猩、红毛猩猩、黑猩猩和人类共用零到百分之五十的横轴比较"></div>
      <span class="source">Organ 等, 2011</span>
    </section>
    <aside class="readout min0" aria-live="polite">
      <div>
        <div class="eyebrow">应该 − 实际</div>
        <div class="delta-line"><span id="daily" class="big delta">0.0</span><span class="unit">小时 / 天</span></div>
        <p class="explain">一年约 <span id="yearly" class="year">0</span> 小时，可以拿去做别的事。</p>
      </div>
      <div class="body-note">
        牙齿和咀嚼肌也跟着缩了：人类的咀嚼肌基因 <b>MYH16</b> 已失活，臼齿面积比同体重灵长类小约 <b>40%</b>。
        <span class="dispute">与用火的年代关系尚有争议</span>
      </div>
    </aside>
  </div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
Chrome.mount({ act:1, title:'谁来付账：把咀嚼时间还回来', sub:'其他大猿一天有三分之一到一半的时间在嚼东西。人类只用 4.7%。', foot:'把嚼东西的时间从五小时压到二十分钟，靠的不是牙齿，是火。' });

var awakeHours = 14;
var expectedHuman = 48;
var actualHuman = 4.7;
var species = ['大猩猩','红毛猩猩','黑猩猩','人类'];
var baseValues = [48,40,37];
var chart = echarts.init(document.getElementById('chart'), null, {renderer:'svg'});
var gene = Deck.token('--gene');
var gene2 = Deck.token('--gene-2');
var text = Deck.token('--text');
var text2 = Deck.token('--text-2');
var text3 = Deck.token('--text-3');
var line = Deck.token('--line');

function hoursFromPercent(p){ return p / 100 * awakeHours; }
function optionFor(humanValue){
  var values = baseValues.concat(humanValue);
  return {
    animationDuration: Deck.reduced() ? 0 : 650,
    animationDurationUpdate: Deck.reduced() ? 0 : 650,
    animationEasingUpdate:'cubicOut',
    textStyle:{fontFamily:Deck.token('--font-sans'),fontSize:16,color:text2},
    grid:{left:142,right:92,top:24,bottom:62,containLabel:false},
    xAxis:{
      type:'value',min:0,max:50,interval:10,
      name:'清醒活动时间中用于进食的比例',nameLocation:'middle',nameGap:42,
      nameTextStyle:{fontSize:16,color:text2},
      axisLine:{show:true,lineStyle:{color:line}},axisTick:{show:false},
      splitLine:{show:true,lineStyle:{color:line,opacity:.5}},
      axisLabel:{fontSize:14,color:text3,formatter:'{value}%'}
    },
    yAxis:{
      type:'category',inverse:true,data:species,
      axisLine:{show:false},axisTick:{show:false},
      axisLabel:{fontSize:16,color:function(value){return value==='人类'?gene2:text2},margin:18,fontWeight:function(value){return value==='人类'?700:400}}
    },
    series:[{
      type:'bar',data:values.map(function(v,i){return {value:v,itemStyle:{color:i===3?gene:gene2,opacity:i===3?1:.55}}}),
      barWidth:34,showBackground:true,backgroundStyle:{color:'rgba(224,145,58,.07)'},
      label:{show:true,position:'right',distance:10,fontSize:16,color:text,formatter:function(p){return p.value+'%  ·  约 '+hoursFromPercent(p.value).toFixed(1)+' 小时';}},
      emphasis:{disabled:true}
    }]
  };
}

function setMode(actual){
  document.getElementById('expected').setAttribute('aria-pressed',String(!actual));
  document.getElementById('actual').setAttribute('aria-pressed',String(actual));
  chart.setOption(optionFor(actual ? actualHuman : expectedHuman),true);
  var savedDaily = actual ? hoursFromPercent(expectedHuman-actualHuman) : 0;
  document.getElementById('daily').textContent = savedDaily.toFixed(1);
  document.getElementById('yearly').textContent = actual ? Math.round(savedDaily*365/100)*100 : '0';
}
document.getElementById('expected').addEventListener('click',function(){setMode(false)});
document.getElementById('actual').addEventListener('click',function(){setMode(true)});
Deck.onResize(function(){chart.resize()});
setMode(false);
</script>
</body></html>
