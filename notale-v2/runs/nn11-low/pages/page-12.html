<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:14px}
.scene{position:relative;flex:1 1 auto;min-height:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line-soft);background:var(--panel)}
.fire-bg{position:absolute;inset:0;margin:0}
.fire-bg img{width:100%;height:100%;object-fit:cover;object-position:center 54%;filter:brightness(.48) saturate(.82)}
.fire-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,7,6,.94) 0%,rgba(8,7,6,.76) 48%,rgba(8,7,6,.28) 78%,rgba(8,7,6,.08) 100%)}
.story{position:absolute;inset:22px 24px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.flowline{display:grid;grid-template-columns:1fr 44px 1fr 44px 1.45fr 44px 1.2fr 44px 1fr 44px 1.18fr;align-items:center;gap:0}
.node{position:relative;min-width:0;min-height:112px;padding:15px 14px;border:1px solid var(--line);border-radius:var(--r);background:rgba(15,13,12,.82);backdrop-filter:blur(4px);display:flex;flex-direction:column;justify-content:center;opacity:1;transform:translateY(0)}
.node .k{font-size:var(--fs-h2);line-height:1.25;font-weight:700;color:var(--text)}
.node .d{margin-top:7px;font-size:var(--fs-label);line-height:1.4;color:var(--text-2)}
.node.gene{border-color:var(--gene-dim);box-shadow:inset 0 3px 0 var(--gene)}
.node.cult{border-color:var(--cult-dim);box-shadow:inset 0 3px 0 var(--cult)}
.node.bridge{border-color:var(--cult-dim);box-shadow:inset 0 3px 0 transparent;background:linear-gradient(135deg,rgba(224,145,58,.16),rgba(95,200,216,.16)),rgba(15,13,12,.84)}
.node.bridge::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(90deg,var(--gene),var(--cult))}
.arrow{position:relative;height:2px;background:var(--text-3);opacity:1}
.arrow::after{content:"";position:absolute;right:-1px;top:50%;width:9px;height:9px;border-top:2px solid var(--text-2);border-right:2px solid var(--text-2);transform:translateY(-50%) rotate(45deg)}
.evidence{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.dates{max-width:875px;padding:13px 16px;border-left:3px solid var(--gene);background:rgba(15,13,12,.76);font-size:var(--fs-sec);line-height:1.55;color:var(--text-2)}
.dates b{color:var(--gene-2)}
.dates .num{white-space:nowrap}
.hyp{margin-top:7px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.controls{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-right:138px;margin-bottom:5px}
.status{font-size:var(--fs-label);color:var(--text-2)}
.node.pulse{box-shadow:0 0 0 1px currentColor,0 0 28px rgba(95,200,216,.23)}
@media (prefers-reduced-motion:reduce){.node,.arrow{transition:none!important}}
</style>
</head>
<body data-page="12" data-total="44">
<div id="stage"><main id="main">
  <section class="scene min0" aria-label="火把消化过程搬到体外的因果链">
    <figure class="fire-bg"><img src="assets/img/illus-fire.png" alt="夜间岩棚下，火塘旁正在烹煮食物的场景" title="生成插画（非真实照片）：夜间岩棚下的火塘与烹煮"></figure>
    <div class="story">
      <div class="flowline" role="list" aria-label="生食经过火和体外预消化，最终为大脑释放能量">
        <div class="node gene" role="listitem"><div class="k">生食</div><div class="d">消化主要在体内完成</div></div><div class="arrow" aria-hidden="true"></div>
        <div class="node cult" role="listitem"><div class="k">火</div><div class="d">先在身体外加热</div></div><div class="arrow" aria-hidden="true"></div>
        <div class="node cult" role="listitem"><div class="k">体外预消化</div><div class="d">淀粉糊化 · 蛋白变性<br>纤维软化 · 病原减少</div></div><div class="arrow" aria-hidden="true"></div>
        <div class="node" role="listitem"><div class="k">净能量 ↑</div><div class="d">咀嚼时间 ↓</div></div><div class="arrow" aria-hidden="true"></div>
        <div class="node gene" role="listitem"><div class="k">肠道可缩小</div><div class="d">身体少付一笔账</div></div><div class="arrow" aria-hidden="true"></div>
        <div class="node bridge" role="listitem"><div class="k">能量给大脑</div><div class="d">身体功能开始外移</div></div>
      </div>
      <div class="evidence">
        <div class="dates">
          考古确证：Wonderwerk 洞约 <b class="num">100 万年前</b>；Gesher Benot Ya'aqov 约 <b class="num">79 万年前</b>；常态化用火的普遍证据约 <b class="num">40 万年前</b>。
          <div class="hyp"><span class="tag warn">假说，有争议</span><span>Wrangham 将烹饪推至约 <span class="num">190 万年前</span>，但目前没有那么早的考古确证。</span></div>
        </div>
        <div class="controls">
          <button id="replay" class="btn cult" type="button">重播</button>
          <div class="hint">重播这条约 6 秒的因果链</div>
        </div>
      </div>
    </div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/anime.min.js"></script>
<script>
Chrome.mount({ act:1, title:'火：把消化搬到体外', sub:'加热让淀粉糊化、蛋白变性。食物在进嘴之前就被处理了一半。', foot:'这是第一次把身体的一项功能挪到身体外面。后面还会有第二次、第三次。' });
var nodes=Array.from(document.querySelectorAll('.node'));
var arrows=Array.from(document.querySelectorAll('.arrow'));
var replay=document.getElementById('replay');
var running=null;
function showAll(){
  anime.remove(nodes.concat(arrows));
  anime.set(nodes,{opacity:1,translateY:0});
  anime.set(arrows,{opacity:1,scaleX:1,transformOrigin:'0% 50%'});
}
function play(){
  if(running) running.pause();
  anime.remove(nodes.concat(arrows));
  anime.set(nodes,{opacity:.28,translateY:7});
  anime.set(arrows,{opacity:.18,scaleX:.15,transformOrigin:'0% 50%'});
  replay.disabled=true;
  running=anime.timeline({easing:'easeOutCubic',complete:function(){replay.disabled=false;}});
  nodes.forEach(function(node,i){
    running.add({targets:node,opacity:1,translateY:0,duration:430,begin:function(){node.classList.add('pulse')},complete:function(){node.classList.remove('pulse')}},i*920);
    if(arrows[i]) running.add({targets:arrows[i],opacity:1,scaleX:1,duration:330},i*920+470);
  });
}
showAll();
replay.addEventListener('click',play);
</script>
</body></html>
