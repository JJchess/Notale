<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:14px;padding-bottom:10px;}
.claim{flex:0 0 auto;max-width:1440px;}
.scene{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:41% 59%;position:relative;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);overflow:hidden;}
.figure-zone{position:relative;min-width:0;min-height:0;overflow:hidden;}
.savanna{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:.18;filter:saturate(.65) contrast(1.08);border-radius:0;}
.figure-zone::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,7,6,.52),rgba(8,7,6,.2) 62%,var(--bg) 100%);}
.body-map{position:absolute;inset:8px 12px 8px 18px;width:calc(100% - 30px);height:calc(100% - 16px);z-index:2;overflow:visible;}
.sil{fill:rgba(224,145,58,.06);stroke:var(--gene-2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.bone{fill:none;stroke:rgba(240,184,116,.76);stroke-width:3;stroke-linecap:round;}
.call{fill:none;stroke:var(--line);stroke-width:1.5;}
.hot{fill:var(--bg-deep);stroke:var(--gene);stroke-width:3;transition:.15s;}
.hot-core{fill:var(--gene);opacity:.55;transition:.15s;}
.hot.active{stroke:var(--cult);stroke-width:5;filter:drop-shadow(0 0 7px rgba(95,200,216,.7));}
.hot-core.active{fill:var(--cult);opacity:1;}
.figure-label{position:absolute;left:18px;bottom:14px;z-index:3;font-size:var(--fs-label);color:var(--text-3);letter-spacing:.05em;}
.evidence{min-width:0;min-height:0;padding:12px 4px 12px 24px;display:flex;flex-direction:column;justify-content:center;gap:8px;}
.supports{gap:8px;}
.support{padding:5px 10px 5px 28px;border-radius:6px;transition:background .15s;color:var(--text-2);}
.support:hover,.support:focus-visible{background:rgba(224,145,58,.08);outline:none;}
.support::before{left:6px;top:1.15em;width:13px;}
.trunk{top:10px;bottom:10px;}
.support-title{display:block;color:var(--text);font-size:var(--fs-body);font-weight:700;line-height:1.28;}
.support-note{display:block;margin-top:2px;color:var(--text-2);font-size:var(--fs-label);line-height:1.35;}
.num{color:var(--gene-2);}
.hint{margin:3px 0 0 6px;}
.closer{flex:0 0 auto;margin:0;padding:4px 0 2px 18px;border-left:4px solid var(--cult);font-size:var(--fs-lead);line-height:1.45;color:var(--cult);}
.closer strong{color:var(--cult-2);}
</style>
</head>
<body data-page="13" data-total="44">
<div id="stage"><main id="main">
  <div class="claim">你今天这具身体的每一项关键特征，都是在非洲草原上、为解决草原上的问题而定型的。<br>它从来没有为别的环境做过准备。</div>

  <section class="scene min0" aria-label="草原身体的五项特征与依据">
    <figure class="figure-zone min0">
      <img class="savanna" src="assets/img/illus-savanna.png" alt="非洲草原氛围插画" title="生成插画（非真实照片）：非洲草原">
      <svg class="body-map" viewBox="0 0 560 390" role="img" aria-label="简笔人形，五个标注点分别指向腿、皮肤、大脑、骨盆与消化区域">
        <path class="sil" d="M220 67 C220 40 239 22 264 22 C289 22 308 40 308 67 C308 92 291 108 264 108 C237 108 220 92 220 67 Z"/>
        <path class="sil" d="M231 113 C210 139 201 183 207 232 L220 274 L308 274 L321 232 C327 183 318 139 297 113 C278 126 250 126 231 113 Z"/>
        <path class="bone" d="M224 136 L171 199 L139 268 M304 136 L357 199 L389 268 M239 271 L219 327 L206 376 M289 271 L309 327 L322 376"/>
        <path class="bone" d="M223 261 Q264 288 305 261 M242 128 Q264 145 286 128"/>
        <path class="call" d="M264 55 H445"/><path class="call" d="M313 152 H445"/><path class="call" d="M270 226 H445"/><path class="call" d="M281 270 H445"/><path class="call" d="M217 335 H445"/>
        <g data-hot="2"><circle class="hot" cx="264" cy="55" r="10"/><circle class="hot-core" cx="264" cy="55" r="4"/></g>
        <g data-hot="1"><circle class="hot" cx="313" cy="152" r="10"/><circle class="hot-core" cx="313" cy="152" r="4"/></g>
        <g data-hot="4"><circle class="hot" cx="270" cy="226" r="10"/><circle class="hot-core" cx="270" cy="226" r="4"/></g>
        <g data-hot="3"><circle class="hot" cx="281" cy="270" r="10"/><circle class="hot-core" cx="281" cy="270" r="4"/></g>
        <g data-hot="0"><circle class="hot" cx="217" cy="335" r="10"/><circle class="hot-core" cx="217" cy="335" r="4"/></g>
      </svg>
      <figcaption class="figure-label">草原环境塑造的身体</figcaption>
    </figure>

    <div class="evidence min0">
      <div class="supports">
        <div class="trunk" aria-hidden="true"></div>
        <div class="support" tabindex="0" data-index="0"><span class="support-title">直立行走</span><span class="support-note">走同样的路只花四分之一的能量：<span class="num">0.20 vs 0.75 mL O₂/kg/m</span></span></div>
        <div class="support" tabindex="0" data-index="1"><span class="support-title">裸皮与二百多万个汗腺</span><span class="support-note">白天在开阔地长时间移动而不中暑；代价是离开 <span class="num">27 °C</span> 就得靠衣服</span></div>
        <div class="support" tabindex="0" data-index="2"><span class="support-title">一颗很贵的大脑</span><span class="support-note"><span class="num">2%</span> 的体重，消耗 <span class="num">20%</span> 的静息能量</span></div>
        <div class="support" tabindex="0" data-index="3"><span class="support-title">提前出生的婴儿</span><span class="support-note">产道装不下更大的头，换来的是长期抚养和群体协作</span></div>
        <div class="support" tabindex="0" data-index="4"><span class="support-title">把处理食物挪到体外</span><span class="support-note">火与烹煮省下每天约 <span class="num">6 小时</span></span></div>
      </div>
      <div class="hint">悬停一条依据，定位这具身体上的对应部位</div>
    </div>
  </section>

  <p class="closer">注意：上面五条里没有一条是“天生会打石器”“天生会说话”“天生会造火箭”。<strong>那些不在这具身体里。</strong></p>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:1, title:'一具草原上的身体', sub:'幕 I 收束。', foot:'这些本事没有一样写在基因里能直接用——它们要靠学。下一幕讲这个。' });
(function(){
  var supports = Array.from(document.querySelectorAll('.support'));
  var groups = Array.from(document.querySelectorAll('[data-hot]'));
  function setActive(index){
    groups.forEach(function(g){
      var on = g.getAttribute('data-hot') === String(index);
      g.querySelector('.hot').classList.toggle('active',on);
      g.querySelector('.hot-core').classList.toggle('active',on);
    });
  }
  supports.forEach(function(el){
    el.addEventListener('mouseenter',function(){setActive(el.dataset.index);});
    el.addEventListener('mouseleave',function(){setActive(-1);});
    el.addEventListener('focus',function(){setActive(el.dataset.index);});
    el.addEventListener('blur',function(){setActive(-1);});
  });
})();
</script>
</body></html>
