<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:12px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;flex:0 0 246px}
.tool{position:relative;display:grid;grid-template-rows:184px auto;gap:8px;transition:opacity .18s,border-color .18s;background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:10px}
.tool img{width:100%;height:100%;display:block;object-fit:contain;background:var(--panel);border-radius:7px}
.tool .cap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:var(--fs-sec);line-height:1.35}
.tool .cap b{font-size:var(--fs-body)}
.tool .cap span{color:var(--text-3);font-family:var(--font-num);font-size:var(--fs-label)}
.tool.active{border-color:var(--cult);box-shadow:0 0 0 1px rgba(95,200,216,.22) inset}
.tool.dim{opacity:.35}
.readout{display:grid;grid-template-columns:230px 230px 1fr;align-items:center;gap:20px;min-height:54px;padding:7px 16px;background:rgba(95,200,216,.06);border-left:3px solid var(--cult)}
.when{font-family:var(--font-num);font-size:var(--fs-h2);color:var(--cult-2);font-variant-numeric:tabular-nums}
.tech{font-weight:700;font-size:var(--fs-lead)}
.steps{font-size:var(--fs-sec);color:var(--text-2)}
.timeline{position:relative;flex:1 1 auto;min-height:190px;padding:22px 24px 10px;background:rgba(25,21,18,.55);border:1px solid var(--line-soft);border-radius:var(--r)}
.axis{position:relative;height:132px;margin:0 6px}
.direction{position:absolute;left:0;right:0;top:78px;height:2px;background:var(--line)}
.direction:after{content:"";position:absolute;right:-2px;top:-5px;border-left:10px solid var(--cult);border-top:6px solid transparent;border-bottom:6px solid transparent}
.seg{position:absolute;height:13px;border-radius:3px;background:var(--cult-dim);border:1px solid rgba(95,200,216,.5)}
.seg span{position:absolute;left:3px;top:-24px;white-space:nowrap;font-size:var(--fs-label);color:var(--text-2)}
.seg.lom{top:58px}.seg.old{top:42px}.seg.ach{top:26px;background:rgba(95,200,216,.42);border-color:var(--cult)}.seg.lev{top:10px}
.seg.ach span{color:var(--cult-2);font-weight:700}
.stair{position:absolute;inset:0;width:100%;height:82px;overflow:visible;pointer-events:none}
.stair polyline{fill:none;stroke:var(--text-3);stroke-width:2;stroke-dasharray:5 5;opacity:.62}
.stair text{fill:var(--text-3);font:15px var(--font-sans)}
.tick{position:absolute;top:85px;transform:translateX(-50%);font-family:var(--font-num);font-size:var(--fs-tick);color:var(--text-3);white-space:nowrap}
.tick.first{transform:none}.tick.last{transform:translateX(-100%)}
.cursor{position:absolute;top:2px;bottom:25px;width:2px;background:var(--cult);pointer-events:none;filter:drop-shadow(0 0 5px rgba(95,200,216,.7))}
.cursor:before{content:"";position:absolute;left:-7px;top:72px;width:16px;height:16px;border-radius:50%;background:var(--cult);border:3px solid var(--bg)}
.scrub{position:absolute;left:0;right:0;top:67px;width:100%;height:26px;opacity:0;cursor:ew-resize;margin:0;z-index:3}
.timeline-bottom{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:2px}
.claimline{font-size:var(--fs-sec);color:var(--text-2);line-height:1.4}
.claimline b{color:var(--cult-2)}
.hint{flex:0 0 auto}
</style>
</head>
<body data-page="14" data-total="44">
<div id="stage"><main id="main">
  <section class="tools min0" aria-label="三种石器技术的实物照片">
    <figure class="tool min0" data-tech="奥杜威">
      <img src="assets/img/tool-oldowan.jpg" alt="奥杜威型砍砸器" title="奥杜威型砍砸器 · 图卢兹自然史博物馆藏 · Didier Descouens · CC BY-SA 4.0">
      <figcaption class="cap"><b>奥杜威</b><span>260万—170万年前</span></figcaption>
    </figure>
    <figure class="tool min0 active" data-tech="阿舍利">
      <img src="assets/img/tool-acheulean.jpg" alt="两面对称的阿舍利手斧" title="阿舍利手斧，Montières（法国）· 图卢兹自然史博物馆 · Didier Descouens · CC BY-SA 4.0">
      <figcaption class="cap"><b>阿舍利手斧</b><span>176万—13万年前</span></figcaption>
    </figure>
    <figure class="tool min0" data-tech="勒瓦娄哇">
      <img src="assets/img/tool-levallois.jpg" alt="经过预制的勒瓦娄哇石核" title="勒瓦娄哇石核 · Portable Antiquities Scheme / 大英博物馆 · CC BY 2.0">
      <figcaption class="cap"><b>勒瓦娄哇石核</b><span>30万—4万年前</span></figcaption>
    </figure>
  </section>

  <section class="readout min0" aria-live="polite">
    <div class="when" id="when">距今 100 万年</div>
    <div class="tech" id="tech">阿舍利</div>
    <div class="steps" id="steps">做一件需要 30–50 次连续打击</div>
  </section>

  <section class="timeline no-pan min0" aria-label="从330万年前到今天的石器技术时间轴">
    <div class="axis" id="axis">
      <svg class="stair" viewBox="0 0 1400 82" preserveAspectRatio="none" aria-hidden="true">
        <polyline points="0,72 297,72 297,56 653,56 653,35 1273,35 1273,14 1400,14"/>
        <text x="5" y="20">复杂度上升</text>
      </svg>
      <div class="seg lom" style="left:0%;width:21.21%"><span>洛梅奎型 · 1–2 步</span></div>
      <div class="seg old" style="left:21.21%;width:27.27%"><span>奥杜威 · 2–5 步</span></div>
      <div class="seg ach" style="left:46.67%;width:49.39%"><span>阿舍利 · 30–50 步</span></div>
      <div class="seg lev" style="left:90.91%;width:7.88%"><span>勒瓦娄哇 · 先规划，再执行</span></div>
      <div class="direction"></div>
      <span class="tick first" style="left:0">330万年前</span>
      <span class="tick" style="left:21.21%">260万</span>
      <span class="tick" style="left:46.67%">176万</span>
      <span class="tick" style="left:90.91%">30万</span>
      <span class="tick last" style="left:100%">今天 →</span>
      <div class="cursor" id="cursor" style="left:69.7%"></div>
      <input class="scrub" id="scrub" type="range" dir="rtl" min="0" max="3300" value="1000" step="10" aria-label="选择距今年代，单位万年">
    </div>
    <div class="timeline-bottom">
      <div class="claimline">阿舍利手斧从 <b>176 万年前</b>用到 <b>13 万年前</b>——<b>163 万年，约 6.5 万代人，形制基本没变</b>。它比后面全部技术加起来还长。</div>
      <div class="hint">拖游标，看那个时刻最好的工具长什么样</div>
    </div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:2, title:'三件石器，三百万年', sub:'第一件真正被存到身体之外的信息：怎么打一块石头。', foot:'阿舍利手斧一百六十万年没变——棘轮一开始几乎不转。它是怎么转起来的？' });
(function(){
  var scrub=document.getElementById('scrub'), cursor=document.getElementById('cursor');
  var when=document.getElementById('when'), tech=document.getElementById('tech'), steps=document.getElementById('steps');
  var tools=[].slice.call(document.querySelectorAll('.tool'));
  function state(age){
    if(age>2600) return {name:'洛梅奎型',step:'做一件只需 1–2 步：砸开石头，取锋利边',photo:null};
    if(age>1760) return {name:'奥杜威',step:'做一件需要 2–5 步：单面打击',photo:'奥杜威'};
    if(age>300) return {name:'阿舍利',step:'做一件需要 30–50 次连续打击',photo:'阿舍利'};
    if(age>=40) return {name:'勒瓦娄哇',step:'做一件需要先规划石核，再一击执行',photo:'勒瓦娄哇'};
    return {name:'本页所列技术之后',step:'4 万年前以后，时间轴进入下一段历史',photo:null};
  }
  function update(){
    var age=+scrub.value, s=state(age);
    cursor.style.left=((3300-age)/3300*100)+'%';
    when.textContent=age===0?'今天':'距今 '+(age>=10000?(age/10000).toFixed(1)+' 亿年':age+' 万年');
    tech.textContent=s.name; steps.textContent=s.step;
    tools.forEach(function(el){
      var on=el.dataset.tech===s.photo;
      el.classList.toggle('active',on);
      el.classList.toggle('dim',s.photo ? !on : true);
    });
  }
  scrub.addEventListener('input',update); update();
})();
</script>
</body></html>
