<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:12px}
.micro-flow{display:grid;grid-template-columns:1fr 42px 1fr 42px 1fr;align-items:center;flex:0 0 auto;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:8px 12px}
.micro-flow .step{display:flex;align-items:center;gap:10px;justify-content:center;font-size:var(--fs-sec);color:var(--text-2)}
.micro-flow .step b{font-family:var(--font-num);color:var(--cult);font-size:var(--fs-label)}
.micro-flow .arw{text-align:center;color:var(--cult);font-size:var(--fs-h2)}
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px}
.chart-panel{min-width:0;min-height:0;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(95,200,216,.045),transparent 48%);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px 16px 8px}
.chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex:0 0 auto}
.verdict{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.verdict .dz{font:600 28px/1 var(--font-num);color:var(--cult)}
.verdict.negative .dz,.verdict.negative .state{color:var(--warn)}
.verdict .state{font-weight:700;color:var(--cult);font-size:var(--fs-body)}
.formula{font:var(--fs-sec)/1.4 var(--font-num);color:var(--text-2)}
#chart{flex:1;min-height:0;width:100%}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
.controls{padding:14px 16px;display:flex;flex-direction:column;gap:11px}
.ctl{display:grid;grid-template-columns:94px minmax(0,1fr) 66px}
.ctl .cv{text-align:right}
.fixed{font-size:var(--fs-label);color:var(--text-3);margin:0}.fixed .num{color:var(--text-2)}
.btns{gap:7px}.btn{padding:8px 11px}.btn.wide{flex:1}
.hint{margin-top:1px}
.insight{padding:12px 16px;border-left:3px solid var(--cult);background:rgba(95,200,216,.055)}
.insight p{margin:0;font-size:var(--fs-sec);line-height:1.48;color:var(--text-2)}
.insight strong{color:var(--cult-2)}
.case{padding:12px 16px;flex:1;min-height:0}
.case .ttl{margin-bottom:6px}.case p{margin:0;font-size:var(--fs-sec);line-height:1.45;color:var(--text-2)}
.case .debate{display:block;margin-top:6px;color:var(--text-3);font-size:var(--fs-label)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-page="15" data-total="44">
<div id="stage"><main id="main">
  <div class="micro-flow" aria-label="每代文化传承过程">
    <div class="step"><b>01</b><span>选上一代最好的榜样</span></div><div class="arw">→</div>
    <div class="step"><b>02</b><span>全群体模仿</span></div><div class="arw">→</div>
    <div class="step"><b>03</b><span>误差中偶尔有人做得更好</span></div>
  </div>
  <div class="workspace min0">
    <section class="chart-panel min0" aria-label="技能水平随代际变化曲线">
      <div class="chart-head">
        <div><div class="ttl cult">棘轮 · 200 代</div><div class="formula">Δz ≈ β·(ln N + 0.5772) − α</div></div>
        <div class="verdict" id="verdict"><span class="dz" id="delta">+0.00</span><span class="state" id="state">每代累积</span></div>
      </div>
      <div id="chart" role="img" aria-label="横轴为代数，纵轴为每一代最高技能水平"></div>
    </section>
    <aside class="side min0">
      <section class="panel controls">
        <div class="ctl"><label class="cl" for="nRange">群体规模 N</label><input class="no-pan" id="nRange" type="range" min="0" max="1000" value="567"><output class="cv" id="nVal">150</output></div>
        <div class="ctl"><label class="cl" for="aRange">模仿损失 α</label><input class="no-pan" id="aRange" type="range" min="10" max="300" value="100"><output class="cv" id="aVal">1.0</output></div>
        <p class="fixed">发挥差异固定为 <span class="num">β = 0.5</span></p>
        <div class="btns"><button class="btn wide" id="tas">塔斯马尼亚 · N=15</button><button class="btn wide" id="mainland">大陆 · N=1500</button><button class="btn" id="rerun">重跑</button></div>
        <div class="hint">拖两个滑块，看棘轮什么时候开始倒转</div>
      </section>
      <section class="insight">
        <p>阈值只跟 <strong>ln N</strong> 有关。<span class="num">10 → 100</span> 人只增加一个常数；但 <span class="num">10 → 3</span> 人，技能会开始净损失。</p>
      </section>
      <section class="panel case">
        <div class="ttl">一次真实的隔离</div>
        <p>约 1 万年前海平面上升，塔斯马尼亚与澳洲大陆隔开。之后当地人群丢失了骨器、渔网、御寒衣物。<br><b>不是变笨了，是有效传承群体变小了。</b><span class="debate">这个案例在学界仍有讨论。</span></p>
      </section>
    </aside>
  </div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
Chrome.mount({ act:2, title:'一个人学不会', sub:'把你扔到旷野里，一辈子也造不出一把阿舍利手斧。技能不在个体里，在群体的传承里。', foot:'棘轮能不能转，取决于两个量：群体有多大，学得有多准。' });
(function(){
  var beta=.5, runIndex=0;
  var nRange=document.getElementById('nRange'), aRange=document.getElementById('aRange');
  var nVal=document.getElementById('nVal'), aVal=document.getElementById('aVal');
  var deltaEl=document.getElementById('delta'), stateEl=document.getElementById('state'), verdict=document.getElementById('verdict');
  var chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
  function sliderToN(v){return Math.round(2*Math.pow(1000,v/1000));}
  function nToSlider(n){return Math.round(1000*Math.log(n/2)/Math.log(1000));}
  function simulate(N,alpha){
    var rng=new Math.seedrandom('page-15-'+runIndex), z=0, data=[[0,0]];
    for(var g=1;g<=200;g++){
      var best=-Infinity;
      for(var i=0;i<N;i++){
        var u=Math.max(1e-12,Math.min(1-1e-12,rng()));
        var zi=z-alpha+beta*(-Math.log(-Math.log(u)));
        if(zi>best) best=zi;
      }
      z=best; data.push([g,z]);
    }
    return data;
  }
  function render(){
    var N=sliderToN(+nRange.value), alpha=(+aRange.value)/100;
    nVal.textContent=N.toLocaleString('zh-CN'); aVal.textContent=alpha.toFixed(1);
    var delta=beta*(Math.log(N)+.5772)-alpha, positive=delta>=0;
    deltaEl.textContent=(delta>=0?'+':'')+delta.toFixed(2);
    stateEl.textContent=positive?'每代累积':'每代退化'; verdict.classList.toggle('negative',!positive);
    var data=simulate(N,alpha), color=positive?'#5fc8d8':'#e0574a';
    chart.setOption({animation:false,textStyle:{fontFamily:'Noto Sans SC, sans-serif',fontSize:16,color:'#b9ada0'},grid:{left:66,right:22,top:18,bottom:50},xAxis:{type:'value',min:0,max:200,name:'代',nameTextStyle:{fontSize:14,color:'#8b8078'},axisLabel:{fontSize:14,color:'#8b8078'},axisLine:{lineStyle:{color:'#3d342c'}},splitLine:{show:false}},yAxis:{type:'value',name:'最高技能水平',nameTextStyle:{fontSize:14,color:'#8b8078',padding:[0,0,5,0]},axisLabel:{fontSize:14,color:'#8b8078'},axisLine:{show:true,lineStyle:{color:'#3d342c'}},splitLine:{lineStyle:{color:'#2a231e'}}},series:[{type:'line',data:data,showSymbol:false,sampling:'lttb',lineStyle:{width:3,color:color},areaStyle:{color:positive?'rgba(95,200,216,.11)':'rgba(224,87,74,.10)'},markLine:{silent:true,symbol:'none',label:{show:false},lineStyle:{color:'#594e45',type:'dashed'},data:[{yAxis:0}]}}],tooltip:{trigger:'axis',textStyle:{fontSize:16},formatter:function(p){var d=p[0].data;return '第 '+d[0]+' 代<br>技能 '+d[1].toFixed(1);}}},true);
  }
  nRange.addEventListener('input',render); aRange.addEventListener('input',render);
  document.getElementById('tas').addEventListener('click',function(){nRange.value=nToSlider(15);render();});
  document.getElementById('mainland').addEventListener('click',function(){nRange.value=nToSlider(1500);render();});
  document.getElementById('rerun').addEventListener('click',function(){runIndex++;render();});
  Deck.onResize(function(){chart.resize();}); render();
})();
</script>
</body></html>
