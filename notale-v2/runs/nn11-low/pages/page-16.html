<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:10px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex:0 0 auto}
.board{display:grid;grid-template-columns:245px 350px 350px minmax(0,1fr);grid-template-rows:34px repeat(4,minmax(55px,1fr));column-gap:12px;flex:1 1 auto;min-height:0;border-top:1px solid var(--line)}
.board>*{min-width:0;min-height:0}
.hdr{display:flex;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);font-size:var(--fs-label);font-weight:700;letter-spacing:.05em;color:var(--text-3)}
.hdr.gene{color:var(--gene)}.hdr.cult{color:var(--cult)}
.dim{display:flex;align-items:center;padding:8px 14px 8px 0;border-bottom:1px solid var(--line-soft);font-size:var(--fs-sec);line-height:1.4;color:var(--text-2);text-align:right;justify-content:flex-end}
.slot{appearance:none;width:100%;height:calc(100% - 12px);align-self:center;padding:7px 10px;border:1px dashed #51453b;border-radius:8px;background:rgba(255,255,255,.015);color:var(--text-3);font:var(--fs-sec)/1.35 var(--font-sans);text-align:left;transition:border-color .14s,background .14s,box-shadow .14s;cursor:pointer}
.slot::before{content:"放到这里"}.slot.filled::before{content:none}.slot.gene.filled{border-style:solid;border-color:var(--gene);background:rgba(224,145,58,.09);color:var(--text)}.slot.cult.filled{border-style:solid;border-color:var(--cult);background:rgba(95,200,216,.09);color:var(--text)}
.slot.target{box-shadow:0 0 0 2px var(--focus);border-color:var(--focus)}
.slot.wrong{border-color:var(--warn)!important;background:rgba(224,87,74,.16)!important;animation:shake .24s linear}
.comment{display:flex;align-items:center;padding:7px 4px 7px 12px;border-bottom:1px solid var(--line-soft);font-size:var(--fs-label);line-height:1.35;color:var(--text-2);opacity:0;transform:translateX(8px);transition:.22s}
.comment.on{opacity:1;transform:none}
.candidates{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;min-height:92px;padding:8px;border:1px solid var(--line-soft);border-radius:var(--r);background:rgba(25,21,18,.72)}
.card{appearance:none;min-width:0;padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);color:var(--text);font:var(--fs-sec)/1.35 var(--font-sans);text-align:left;cursor:grab;touch-action:none;user-select:none;transition:.14s}
.card:hover,.card.selected{border-color:var(--cult);background:#29231e}.card.selected{box-shadow:0 0 0 2px rgba(95,200,216,.25)}.card.dragging{opacity:.3}
.drag-ghost{position:fixed;z-index:50;width:330px;padding:9px 12px;border:1px solid var(--cult);border-radius:7px;background:#29231e;color:var(--text);font:var(--fs-sec)/1.35 var(--font-sans);pointer-events:none;box-shadow:0 12px 35px rgba(0,0,0,.45)}
.summary{display:none;flex:0 0 auto;padding:9px 15px;border-left:3px solid var(--cult);background:rgba(95,200,216,.08);font-size:var(--fs-lead);line-height:1.4;color:var(--text-2)}.summary.on{display:block}.summary strong{color:var(--cult-2)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
</head>
<body data-page="16" data-total="44">
<div id="stage"><main id="main">
  <div class="toolbar min0"><div class="hint">把下面八张卡片拖进对应的格子</div><button class="btn" id="reset" type="button">重来</button></div>
  <section class="board min0" aria-label="基因通道与体外通道对照表">
    <div class="hdr">要解决的同一个问题</div><div class="hdr gene">基因通道</div><div class="hdr cult">体外通道</div><div class="hdr">两格都对后</div>
    <div class="dim">成年后还能消化牛奶</div><button class="slot gene" data-row="0" data-kind="gene" aria-label="牛奶问题的基因通道答案"></button><button class="slot cult" data-row="0" data-kind="cult" aria-label="牛奶问题的体外通道答案"></button><div class="comment" data-comment="0">基因那一格用了约 7500 年才在欧洲铺开；奶酪的做法，一个下午就能教会。</div>
    <div class="dim">挡住强紫外线</div><button class="slot gene" data-row="1" data-kind="gene" aria-label="紫外线问题的基因通道答案"></button><button class="slot cult" data-row="1" data-kind="cult" aria-label="紫外线问题的体外通道答案"></button><div class="comment" data-comment="1">肤色的变化以万年计；防晒霜 1936 年才有，今天全世界都在用。</div>
    <div class="dim">在高原上缺氧还能干活</div><button class="slot gene" data-row="2" data-kind="gene" aria-label="高原缺氧问题的基因通道答案"></button><button class="slot cult" data-row="2" data-kind="cult" aria-label="高原缺氧问题的体外通道答案"></button><div class="comment" data-comment="2">EPAS1 的变异只在少数人群里；氧气瓶谁都能背。</div>
    <div class="dim">让新生儿活下来</div><button class="slot gene" data-row="3" data-kind="gene" aria-label="新生儿问题的基因通道答案"></button><button class="slot cult" data-row="3" data-kind="cult" aria-label="新生儿问题的体外通道答案"></button><div class="comment" data-comment="3">反射写在基因里，一出生就有；背带写在别人身上，得学。</div>
  </section>
  <div class="candidates min0 no-pan" id="candidates" aria-label="待分类卡片"></div>
  <div class="summary" id="summary">右边这一列有一个基因通道<strong>永远做不到</strong>的性质：<strong>你这辈子学会的东西，可以原样传给下一代。</strong> 基因不行——你练出的肌肉、学会的语言，一个都不会写回你的 DNA。</div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
Chrome.mount({ act:2, title:'两条通道', sub:'同一个生存问题，可以走基因，也可以走身体之外。这一页你自己分一遍。', foot:'右边那一列有一个基因永远做不到的性质：学到的东西可以直接教出去。' });
(function(){
  var data=[
    {id:'g0',row:0,kind:'gene',text:'乳糖酶持续表达的等位基因'},
    {id:'c0',row:0,kind:'cult',text:'把奶做成奶酪和酸奶，让细菌先分解乳糖'},
    {id:'g1',row:1,kind:'gene',text:'皮肤里的黑色素含量随纬度变化'},
    {id:'c1',row:1,kind:'cult',text:'涂防晒、戴帽子、待在屋檐下'},
    {id:'g2',row:2,kind:'gene',text:'藏族人群的 EPAS1 变异（来自丹尼索瓦人渐渗）'},
    {id:'c2',row:2,kind:'cult',text:'背一个氧气瓶'},
    {id:'g3',row:3,kind:'gene',text:'抓握反射、吸吮反射'},
    {id:'c3',row:3,kind:'cult',text:'襁褓、背带、婴儿床、接生的人'}
  ];
  var rng=new Math.seedrandom('page-16'), selected=null, drag=null;
  var tray=document.getElementById('candidates'), summary=document.getElementById('summary');
  function shuffled(){var a=data.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function makeCard(d){var b=document.createElement('button');b.type='button';b.className='card';b.textContent=d.text;b.dataset.id=d.id;b.setAttribute('aria-label','答案卡片：'+d.text);b.addEventListener('click',function(){choose(b);});b.addEventListener('pointerdown',startDrag);return b;}
  function choose(card){if(selected===card){card.classList.remove('selected');selected=null;return;}if(selected)selected.classList.remove('selected');selected=card;card.classList.add('selected');document.querySelectorAll('.slot:not(.filled)').forEach(function(s){s.classList.add('target');});}
  function clearChoice(){if(selected)selected.classList.remove('selected');selected=null;document.querySelectorAll('.slot').forEach(function(s){s.classList.remove('target');});}
  function place(card,slot){var d=data.find(function(x){return x.id===card.dataset.id;});if(!d||slot.classList.contains('filled'))return;if(+slot.dataset.row===d.row&&slot.dataset.kind===d.kind){slot.textContent=d.text;slot.classList.add('filled');slot.dataset.id=d.id;card.remove();clearChoice();check();}else{slot.classList.remove('wrong');void slot.offsetWidth;slot.classList.add('wrong');setTimeout(function(){slot.classList.remove('wrong');},330);}}
  document.querySelectorAll('.slot').forEach(function(slot){slot.addEventListener('click',function(){if(selected)place(selected,slot);});});
  function check(){var n=document.querySelectorAll('.slot.filled').length;for(var r=0;r<4;r++){var done=document.querySelectorAll('.slot[data-row="'+r+'"].filled').length===2;document.querySelector('[data-comment="'+r+'"]').classList.toggle('on',done);}summary.classList.toggle('on',n===8);}
  function startDrag(e){if(e.button!==0)return;var card=e.currentTarget;drag={card:card,ghost:card.cloneNode(true),dx:18,dy:18};drag.ghost.className='drag-ghost';document.body.appendChild(drag.ghost);card.classList.add('dragging');moveDrag(e);card.setPointerCapture(e.pointerId);card.addEventListener('pointermove',moveDrag);card.addEventListener('pointerup',endDrag,{once:true});card.addEventListener('pointercancel',endDrag,{once:true});}
  function moveDrag(e){if(!drag)return;drag.ghost.style.left=(e.clientX+drag.dx)+'px';drag.ghost.style.top=(e.clientY+drag.dy)+'px';}
  function endDrag(e){if(!drag)return;var card=drag.card, hit=document.elementFromPoint(e.clientX,e.clientY);var slot=hit&&hit.closest('.slot');drag.ghost.remove();card.classList.remove('dragging');card.removeEventListener('pointermove',moveDrag);drag=null;if(slot)place(card,slot);}
  function reset(){rng=new Math.seedrandom('page-16');clearChoice();document.querySelectorAll('.slot').forEach(function(s){s.textContent='';s.classList.remove('filled','wrong');delete s.dataset.id;});document.querySelectorAll('.comment').forEach(function(c){c.classList.remove('on');});summary.classList.remove('on');tray.innerHTML='';shuffled().forEach(function(d){tray.appendChild(makeCard(d));});}
  document.getElementById('reset').addEventListener('click',reset);reset();
})();
</script>
</body></html>
