<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:12px}
.controls{display:flex;align-items:center;gap:18px;flex:0 0 auto}
.controls .hint{margin-left:auto}
.sim{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px}
.chain{position:relative;display:grid;grid-template-columns:176px minmax(0,1fr) 186px;align-items:stretch;background:rgba(25,21,18,.74);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;transition:border-color .15s,background .15s}
.chain.active.gene{border-color:var(--gene);background:rgba(224,145,58,.055)}
.chain.active.cult{border-color:var(--cult);background:rgba(95,200,216,.055)}
.chain-head{display:flex;flex-direction:column;justify-content:center;padding:14px 18px;border-right:1px solid var(--line-soft)}
.chain-head strong{font-size:var(--fs-h2);line-height:1.25}
.chain-head .subline{font-size:var(--fs-label);color:var(--text-3);margin-top:7px;line-height:1.4}
.chain-head.gene strong{color:var(--gene-2)}
.chain-head.cult strong{color:var(--cult-2)}
.cvbox{min-height:0;border-radius:0;background:linear-gradient(90deg,rgba(255,255,255,.012),transparent)}
.metric{display:flex;flex-direction:column;justify-content:center;padding:12px 15px;border-left:1px solid var(--line-soft)}
.metric .ml{font-size:var(--fs-label);color:var(--text-3);line-height:1.35}
.metric .mv{font-family:var(--font-num);font-size:var(--fs-h1);font-variant-numeric:tabular-nums;line-height:1.2;margin-top:5px;color:var(--text-2)}
.chain.active.gene .mv{color:var(--gene-2)}.chain.active.cult .mv{color:var(--cult-2)}
.takeaway{flex:0 0 auto;display:grid;grid-template-columns:1.18fr .82fr;gap:12px}
.takeaway>div{padding:11px 16px;border-left:3px solid var(--cult-dim);background:rgba(95,200,216,.035);font-size:var(--fs-sec);line-height:1.45;color:var(--text-2)}
.takeaway strong{color:var(--text)}
.takeaway .arch{border-left-color:var(--line);background:transparent;color:var(--text-3)}
.takeaway .arch .num{color:var(--text-2)}
</style>
</head>
<body data-page="17" data-total="44">
<div id="stage"><main id="main">
  <div class="controls min0">
    <div class="btns" role="group" aria-label="比较传递方式">
      <button class="btn gene" id="imitate" aria-pressed="false">只靠模仿</button>
      <button class="btn cult" id="language" aria-pressed="false">加上语言</button>
      <button class="btn" id="rerun">重跑</button>
    </div>
    <div class="hint">按一下比较两种传递方式，或重跑换一批随机误差</div>
  </div>
  <section class="sim min0" aria-label="两种方式传递十二代后的误差模拟">
    <div class="chain gene min0" id="imitateChain">
      <div class="chain-head gene"><strong>只靠模仿</strong><span class="subline">复制结果 · 连续误差累积</span></div>
      <div class="cvbox min0"><canvas id="cvImitate" class="cv-fill"></canvas></div>
      <div class="metric"><span class="ml">第 12 代与原型的偏差</span><span class="mv" id="imitateMetric">—</span></div>
    </div>
    <div class="chain cult min0" id="languageChain">
      <div class="chain-head cult"><strong>加上语言</strong><span class="subline">切成词 · 误差吸附回档位</span></div>
      <div class="cvbox min0"><canvas id="cvLanguage" class="cv-fill"></canvas></div>
      <div class="metric"><span class="ml">第 12 代与原型的偏差</span><span class="mv" id="languageMetric">—</span></div>
    </div>
  </section>
  <div class="takeaway min0">
    <div><strong>模仿传结果，语言还能传为什么：</strong>“这里要薄，不然一敲就断。”一句为什么，可以反复纠正同一种错。</div>
    <div class="arch">语言本身不留化石，年代只能间接推断：Blombos 刻纹赭石约 <span class="num">7.7 万年前</span>；贝壳串珠可早到 <span class="num">10 万年前</span>。</div>
  </div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
Chrome.mount({ act:2, title:'语言：把经验压缩成可以传的东西', sub:'光看着别人做，误差会一代一代累积。语言把连续的动作切成可以纠错的词。', foot:'保真度上去了，人也铺开了——接下来六万年，智人走遍了整颗行星。' });
(function(){
  var proto=[.75,.5,.75,.5,.75,.5], runNo=0, data;
  var ci=document.getElementById('cvImitate'), cl=document.getElementById('cvLanguage');
  function gauss(rng){var u=0,v=0;while(!u)u=rng();while(!v)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
  function clamp(v){return Math.max(0,Math.min(1,v))}
  function run(){
    var rng=new Math.seedrandom(runNo?'page-17-'+runNo:'page-17'), noise=[];
    for(var g=1;g<12;g++){noise[g]=[];for(var p=0;p<6;p++)noise[g][p]=gauss(rng)*.16}
    var a=[proto.slice()],b=[proto.slice()];
    for(var i=1;i<12;i++){
      a.push(a[i-1].map(function(v,p){return clamp(v+noise[i][p])}));
      b.push(b[i-1].map(function(v,p){return clamp(Math.round((v+noise[i][p])*4)/4)}));
    }
    data={a:a,b:b}; drawAll(); clearChoice();
  }
  function dist(arr){return Math.sqrt(arr.reduce(function(s,v,i){return s+(v-proto[i])*(v-proto[i])},0))}
  function polygon(ctx,x,y,r,vals,color,fill){
    ctx.beginPath();vals.forEach(function(v,i){var q=-Math.PI/2+i*Math.PI/3,rr=r*(.3+.7*v),px=x+Math.cos(q)*rr,py=y+Math.sin(q)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
  }
  function draw(cv,arr,color){
    var ctx=Deck.fit(cv),w=cv.offsetWidth,h=cv.offsetHeight, fs=parseFloat(Deck.token('--fs-tick'))||13;
    ctx.clearRect(0,0,w,h);var pad=42,step=(w-pad*2)/11,y=h*.53,r=Math.min(27,h*.22);
    ctx.strokeStyle=Deck.rgba('--text-3',.34);ctx.fillStyle=Deck.token('--text-3');ctx.lineWidth=1.5;
    for(var i=0;i<11;i++){var x1=pad+i*step+r*.72,x2=pad+(i+1)*step-r*.72;Deck.arrow(ctx,x1,y,x2,y,5)}
    arr.forEach(function(v,i){var x=pad+i*step;polygon(ctx,x,y,r,v,color,i===0?Deck.rgba('--text',.06):(color===Deck.token('--cult')?Deck.rgba('--cult',.11):Deck.rgba('--gene',.11)));ctx.font=fs+'px '+Deck.token('--font-num');ctx.textAlign='center';ctx.fillStyle=i===0?Deck.token('--text-2'):Deck.token('--text-3');ctx.fillText(String(i+1),x,h-12)});
    ctx.font=fs+'px '+Deck.token('--font-sans');ctx.textAlign='left';ctx.fillStyle=Deck.token('--text-3');ctx.fillText('代',6,h-12);
  }
  function drawAll(){draw(ci,data.a,Deck.token('--gene'));draw(cl,data.b,Deck.token('--cult'))}
  function clearChoice(){
    ['imitate','language'].forEach(function(id){document.getElementById(id).setAttribute('aria-pressed','false')});
    document.getElementById('imitateChain').classList.remove('active');document.getElementById('languageChain').classList.remove('active');
    document.getElementById('imitateMetric').textContent='—';document.getElementById('languageMetric').textContent='—';
  }
  function choose(which){clearChoice();var im=which==='imitate';document.getElementById(which).setAttribute('aria-pressed','true');document.getElementById(which+'Chain').classList.add('active');document.getElementById(which+'Metric').textContent=dist(im?data.a[11]:data.b[11]).toFixed(2)}
  document.getElementById('imitate').addEventListener('click',function(){choose('imitate')});
  document.getElementById('language').addEventListener('click',function(){choose('language')});
  document.getElementById('rerun').addEventListener('click',function(){runNo++;run()});
  Deck.onResize(drawAll);run();
})();
</script>
</body></html>
