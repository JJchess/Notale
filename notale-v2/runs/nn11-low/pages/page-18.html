<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>走出非洲</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:10px}
.map-shell{position:relative;flex:1 1 auto;min-height:0;border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;background:radial-gradient(ellipse at 52% 44%,rgba(95,200,216,.035),transparent 63%)}
#map{display:block;width:100%;height:100%}
.land{fill:#241d18;stroke:var(--line);stroke-width:1}
.route{fill:none;stroke:var(--cult);stroke-width:2.2;stroke-opacity:.62;marker-end:url(#arrow)}
.site{stroke:var(--bg);stroke-width:2;transition:fill .15s,r .15s}
.site.off{fill:var(--line)}.site.on{fill:var(--cult)}
.site.here{fill:var(--cult-2);stroke:var(--cult);stroke-width:4}
.map-label{fill:var(--text-2);font-size:var(--fs-label);paint-order:stroke;stroke:var(--bg-deep);stroke-width:5;stroke-linejoin:round}
.map-age{fill:var(--cult-2);font-family:var(--font-num);font-size:var(--fs-tick);paint-order:stroke;stroke:var(--bg-deep);stroke-width:4}
.readout{position:absolute;left:18px;top:18px;width:258px;padding:14px 16px;background:rgba(15,13,12,.88);border:1px solid var(--line);border-radius:8px;backdrop-filter:blur(5px)}
.readout .ttl{margin-bottom:6px}.now{color:var(--cult-2);font-family:var(--font-num);font-size:var(--fs-h2);font-weight:700;line-height:1.15}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft)}
.metric span{display:block;color:var(--text-3);font-size:var(--fs-label)}.metric b{font-family:var(--font-num);font-size:var(--fs-sec);color:var(--text)}
.event-card{position:absolute;right:18px;bottom:18px;width:370px;padding:13px 15px;background:rgba(15,13,12,.9);border-left:3px solid var(--cult);border-radius:4px}
.event-name{font-size:var(--fs-body);font-weight:700;color:var(--text)}.event-note{font-size:var(--fs-sec);line-height:1.45;color:var(--text-2);margin-top:3px}
.australia{position:absolute;left:18px;bottom:18px;width:430px;padding:12px 15px;background:rgba(15,13,12,.9);border:1px solid var(--cult-dim);border-radius:8px;font-size:var(--fs-sec);line-height:1.45;color:var(--text-2)}
.australia b{color:var(--cult-2)}
.moon-note{position:absolute;right:22px;top:20px;display:none;align-items:center;gap:11px;color:var(--cult-2);font-size:var(--fs-sec)}
.moon-note.show{display:flex}.moon-dot{width:14px;height:14px;border-radius:50%;background:var(--cult-2);box-shadow:0 0 18px var(--cult)}
.controls{flex:0 0 auto;padding:9px 14px 5px}.controls .ctl{gap:15px}.controls .cl{font-weight:700;color:var(--text)}
.controls .cv{width:118px;text-align:right;color:var(--cult-2)}.ends{display:flex;justify-content:space-between;margin:0 119px 0 78px;color:var(--text-3);font-family:var(--font-num);font-size:var(--fs-tick);line-height:1}
.hint{margin-top:3px}
</style>
</head>
<body data-page="18" data-total="44">
<div id="stage"><main id="main">
  <section class="map-shell min0" aria-label="智人扩散的时间驱动世界地图">
    <svg id="map" role="img" aria-label="随时间推进点亮站点并绘出从非洲向世界各地扩散的路线"></svg>
    <div class="readout">
      <div class="ttl cult">时间游标</div><div class="now" id="now">距今 65,000 年</div>
      <div class="metrics"><div class="metric"><span>已到达站点</span><b id="count">5 / 11</b></div><div class="metric"><span>纬度跨度</span><b id="span">12.4°S—32.7°N</b></div></div>
    </div>
    <div class="moon-note" id="moon"><i class="moon-dot"></i><div><b>月球 · 静海</b><br>扩散没有停在海岸线上。</div></div>
    <div class="australia" id="australia">到达澳大利亚要跨过<b>至少 90 公里的开阔海面</b>——6.5 万年前就有人做到了。<br>那需要船，而船不是长出来的。</div>
    <div class="event-card"><div class="event-name" id="eventName">澳大利亚 Madjedbebe · 65,000 年前</div><div class="event-note" id="eventNote">到达澳洲——中途必须渡海</div></div>
  </section>
  <section class="controls no-pan">
    <div class="ctl"><span class="cl">距今年份</span><input id="time" type="range" min="0" max="1000" step="1" aria-label="选择距今年份"><output class="cv" id="value">65,000 年前</output></div>
    <div class="ends"><span>320,000 年前</span><span>现在 →</span></div>
    <div class="hint">拖时间滑块，看这颗行星是怎么被铺满的</div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/data/land-110m.js"></script>
<script>
Chrome.mount({ act:2, title:'走出非洲', sub:'六万年，从东非铺满一整颗行星。靠的不是新器官，是会造衣服、船和地图的头脑。', foot:'这条扩散曲线的最后一个点，不在地球上。' });
const sites=[
 {ago:315000,name:'摩洛哥 Jebel Irhoud',p:[-8.9,31.9],note:'已知最早的智人化石'},
 {ago:233000,name:'埃塞俄比亚 Omo Kibish',p:[35.9,5.4],note:'东非的早期智人'},
 {ago:185000,name:'以色列 Misliya 洞',p:[35.0,32.7],note:'一次早期的外出，没有留下后代'},
 {ago:100000,name:'以色列 Skhul / Qafzeh',p:[35.3,32.7],note:'又一次早期外出'},
 {ago:65000,name:'澳大利亚 Madjedbebe',p:[132.9,-12.4],note:'到达澳洲——中途必须渡海'},
 {ago:63000,name:'苏门答腊 Lida Ajer',p:[100.9,-0.5],note:'东南亚的热带雨林'},
 {ago:45000,name:'保加利亚 Bacho Kiro',p:[25.4,42.9],note:'进入欧洲'},
 {ago:32000,name:'西伯利亚 Yana RHS',p:[135.5,71.0],note:'北极圈内，需要缝制衣物'},
 {ago:15000,name:'智利 Monte Verde',p:[-73.2,-41.5],note:'已经到达南美南部'},
 {ago:3000,name:'汤加 / 萨摩亚',p:[-175.2,-21.1],note:'远洋航行进入太平洋深处'},
 {ago:750,name:'新西兰 Aotearoa',p:[174.8,-41.3],note:'最后一片大陆级陆地被人踏上'}
];
const svg=d3.select('#map'), box=document.querySelector('.map-shell');
let proj,path,gRoutes,gSites,gLabels,W,H;
function arc(a,b){const it=d3.geoInterpolate(a,b), pts=d3.range(31).map(i=>proj(it(i/30)));return d3.line()(pts)}
function draw(){W=box.clientWidth;H=box.clientHeight;svg.attr('viewBox',`0 0 ${W} ${H}`).selectAll('*').remove();
 const defs=svg.append('defs');defs.append('marker').attr('id','arrow').attr('viewBox','0 -4 8 8').attr('refX',7).attr('markerWidth',5).attr('markerHeight',5).attr('orient','auto').append('path').attr('d','M0,-4L8,0L0,4').attr('fill','#5fc8d8');
 proj=d3.geoNaturalEarth1().fitExtent([[28,18],[W-28,H-18]],LAND110);path=d3.geoPath(proj);
 svg.append('g').selectAll('path').data(LAND110.features).join('path').attr('class','land').attr('d',path);
 gRoutes=svg.append('g');gSites=svg.append('g');gLabels=svg.append('g');update(currentAgo);
}
function fmt(n){return n.toLocaleString('en-US')}
let currentAgo=65000;
function update(ago){currentAgo=ago;const active=sites.filter(d=>d.ago>=ago), latest=active.length?active[active.length-1]:null;
 gRoutes.selectAll('path').data(active.slice(1),(d)=>d.name).join('path').attr('class','route').attr('d',(d,i)=>arc(active[i].p,d.p));
 gSites.selectAll('circle').data(sites,d=>d.name).join('circle').attr('class',d=>'site '+(d.ago>=ago?'on':'off')+(latest===d?' here':'')) .attr('cx',d=>proj(d.p)[0]).attr('cy',d=>proj(d.p)[1]).attr('r',d=>latest===d?7:4.5).append('title').text(d=>`${d.name} · ${fmt(d.ago)} 年前\n${d.note}`);
 gLabels.selectAll('*').remove();if(latest){const q=proj(latest.p),anchor=q[0]>W*.72?'end':'start',dx=anchor==='end'?-11:11;gLabels.append('text').attr('class','map-label').attr('x',q[0]+dx).attr('y',q[1]-8).attr('text-anchor',anchor).text(latest.name);gLabels.append('text').attr('class','map-age').attr('x',q[0]+dx).attr('y',q[1]+10).attr('text-anchor',anchor).text(fmt(latest.ago)+' 年前')}
 document.querySelector('#now').textContent=ago<=0?'现在':`距今 ${fmt(ago)} 年`;document.querySelector('#value').textContent=ago<=0?'现在':`${fmt(ago)} 年前`;document.querySelector('#count').textContent=`${active.length} / ${sites.length}`;
 const lats=active.map(d=>d.p[1]);document.querySelector('#span').textContent=lats.length?`${Math.abs(Math.min(...lats)).toFixed(1)}°${Math.min(...lats)<0?'S':'N'}—${Math.abs(Math.max(...lats)).toFixed(1)}°${Math.max(...lats)<0?'S':'N'}`:'—';
 document.querySelector('#eventName').textContent=latest?`${latest.name} · ${fmt(latest.ago)} 年前`:'尚未到达第一个站点';document.querySelector('#eventNote').textContent=latest?latest.note:'把游标向右拖，时间开始推进。';
 document.querySelector('#australia').style.display=ago<=65000?'block':'none';document.querySelector('#moon').classList.toggle('show',ago<=57);
}
const slider=document.querySelector('#time');function posFromAgo(a){return Math.round(1000*(1-Math.log(a+1)/Math.log(320001)))}function agoFromPos(v){return Math.max(0,Math.round(Math.exp(Math.log(320001)*(1-v/1000))-1))}slider.value=posFromAgo(65000);slider.addEventListener('input',()=>update(agoFromPos(+slider.value)));
new ResizeObserver(draw).observe(box);
</script>
</body></html>
