<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>不长毛也能住北极</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:26px;height:100%;padding-bottom:12px}
.calc{display:flex;flex-direction:column;gap:12px;height:100%}
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:14px 18px}
.slider-wrap{min-width:0}.ctl{width:100%}.ctl .cl{font-weight:700;color:var(--cult)}
.anchors{display:flex;justify-content:space-between;margin:2px 52px 0 96px;color:var(--text-3);font-size:var(--fs-tick);font-family:var(--font-num)}
.mode{display:flex;gap:7px}.mode .btn{min-width:72px}
.readout{display:flex;align-items:baseline;gap:13px;white-space:nowrap}.readout .big{color:var(--cult-2)}
.readout .small{color:var(--text-2)}
.thermo{position:relative;flex:1;min-height:0;border:1px solid var(--line-soft);border-radius:var(--r);background:linear-gradient(180deg,rgba(224,145,58,.05),rgba(95,200,216,.05));overflow:hidden}
.axis{position:absolute;left:126px;right:28px;top:34px;bottom:42px;border-left:2px solid var(--line);border-right:1px solid var(--line-soft)}
.tick{position:absolute;left:0;right:0;border-top:1px solid var(--line-soft)}
.tick span{position:absolute;right:calc(100% + 12px);top:-11px;color:var(--text-3);font:var(--fs-tick)/1 var(--font-num);white-space:nowrap}
.zone{position:absolute;left:0;right:0;top:0;background:linear-gradient(180deg,rgba(224,145,58,.12),rgba(95,200,216,.14));border-bottom:2px solid var(--cult);transition:height .12s}
.limit{position:absolute;left:0;right:0;height:0;border-top:3px solid var(--cult);transition:top .12s;filter:drop-shadow(0 0 5px rgba(95,200,216,.45))}
.limit-label{position:absolute;right:10px;bottom:8px;background:var(--cult);color:#102025;padding:4px 9px;border-radius:5px;font:700 var(--fs-label)/1.2 var(--font-num);white-space:nowrap}
.place{position:absolute;left:12px;display:flex;align-items:center;gap:7px;transform:translateY(-50%);font-size:var(--fs-label);color:var(--text-2);white-space:nowrap}
.place:before{content:"";width:12px;height:2px;background:var(--text-3)}
.offscale{position:absolute;left:138px;bottom:9px;font-size:var(--fs-label);color:var(--text-3)}
.hint{padding-left:4px}
.side{display:flex;flex-direction:column;gap:14px;height:100%}
.side figure{flex:1;min-height:0;display:flex;flex-direction:column}
.side figure img{min-height:0;flex:1;object-position:center 30%}
.idea{border-left:4px solid var(--cult);padding:10px 0 10px 16px;font-size:var(--fs-lead);line-height:1.5;color:var(--text-2)}
.idea strong{color:var(--cult-2)}
</style>
</head>
<body data-page="19" data-total="44">
<div id="stage"><main id="main">
  <section class="calc min0">
    <div class="controls panel min0">
      <div class="slider-wrap min0">
        <div class="ctl"><span class="cl">衣物隔热量</span><input id="clo" class="no-pan" type="range" min="0" max="10" step="0.1" value="0" aria-label="衣物隔热量"><output id="cloVal" class="cv">0.0 clo</output></div>
        <div class="anchors"><span>0 裸体</span><span>1 衬衫长裤</span><span>4 驯鹿皮双层衣</span><span>8.5 极地装备</span></div>
      </div>
      <div class="mode" aria-label="活动状态"><button class="btn" data-mode="sit" aria-pressed="true">静坐</button><button class="btn" data-mode="walk" aria-pressed="false">行走</button></div>
    </div>
    <div class="readout"><span id="temp" class="big sm num">27.0 °C</span><span class="small">可居住气温下限 · 衣物 + 裸皮空气层共同保温</span></div>
    <div class="thermo min0" aria-label="共同气温轴，从零上40摄氏度到零下60摄氏度">
      <div class="axis" id="axis">
        <div class="zone" id="zone"></div><div class="limit" id="limit"><span class="limit-label" id="limitLabel">裸体 27.0 °C</span></div>
        <div class="tick" style="top:0%"><span>+40 °C</span></div><div class="tick" style="top:20%"><span>+20</span></div><div class="tick" style="top:40%"><span>0</span></div><div class="tick" style="top:60%"><span>−20</span></div><div class="tick" style="top:80%"><span>−40</span></div><div class="tick" style="top:100%"><span>−60 °C</span></div>
        <div class="place" style="top:43.1%">北京一月均温 <span class="num">−3.1 °C</span></div>
        <div class="place" style="top:58.4%">哈尔滨一月均温 <span class="num">−18.4 °C</span></div>
        <div class="place" style="top:75%">北极冬季 <span class="num">−35 °C</span></div>
      </div>
      <div class="offscale">↓ 南极最低 <span class="num">−89.2 °C</span>（轴外）</div>
    </div>
    <div class="hint">拖滑块加衣服，看能住到多冷的地方</div>
  </section>
  <aside class="side min0">
    <figure class="min0"><img src="assets/img/inuit-parka.jpg" alt="因纽特人双层皮衣" title="因纽特人皮衣 · 斯德哥尔摩民族学博物馆藏 · Daderot · CC0"><figcaption>双层缝制、毛面朝内朝外各一层，之间留一层不流动的空气。</figcaption></figure>
    <div class="idea">北极的人没有长出毛。<strong>他们发明的是“两层皮之间夹一层不流动的空气”这个想法</strong>——一个可以在一个冬天里教会全村人的想法。</div>
  </aside>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:2, title:'不长毛也能住北极', sub:'裸着的人只能待在 27 °C 以上。往北一步都得靠体外的东西。', foot:'到这一步，身体已经不再是那个决定"能住在哪里"的东西了。' });
(function(){
  var clo=document.getElementById('clo'), cloVal=document.getElementById('cloVal'), temp=document.getElementById('temp');
  var limit=document.getElementById('limit'), zone=document.getElementById('zone'), label=document.getElementById('limitLabel');
  var mode='sit';
  function calc(){
    var c=Number(clo.value), flux=mode==='sit'?55.6:167;
    var t=33-(c+0.7)*0.155*flux;
    var pos=Math.max(0,Math.min(100,(40-t)));
    cloVal.textContent=c.toFixed(1)+' clo'; temp.textContent=t.toFixed(1)+' °C';
    limit.style.top=pos+'%'; zone.style.height=pos+'%';
    label.textContent=(c===0?'裸体 · ':'')+t.toFixed(1)+' °C'+(t < -60?' · 低于轴范围':'');
  }
  clo.addEventListener('input',calc);
  document.querySelectorAll('[data-mode]').forEach(function(btn){btn.addEventListener('click',function(){mode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(function(b){b.setAttribute('aria-pressed',String(b===btn));});calc();});});
  calc();
})();
</script>
</body></html>
