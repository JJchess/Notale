<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:14px}
.workspace{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:22px}
.tree,.detail{min-width:0;min-height:0}
.tree{display:flex;flex-direction:column;padding:16px 18px;background:linear-gradient(145deg,rgba(224,145,58,.07),transparent 52%);border:1px solid var(--line-soft);border-radius:var(--r)}
.root{display:flex;align-items:center;gap:11px;font-size:var(--fs-h2);font-weight:700;color:var(--gene-2);padding:4px 0 16px;border-bottom:1px solid var(--gene-dim)}
.root::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--gene);box-shadow:0 0 0 5px rgba(224,145,58,.12)}
.branches{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px;flex:1 1 auto;min-height:0}
.branch{min-width:0;display:flex;flex-direction:column}
.branch-title{font-size:var(--fs-sec);line-height:1.4;font-weight:700;color:var(--text);margin-bottom:9px}
.branch-title .tag{margin-bottom:5px}
.branch-title small{display:block;font-size:var(--fs-label);font-weight:400;color:var(--text-3)}
.case-list{display:flex;flex-direction:column;gap:7px}
.case-btn{position:relative;width:100%;text-align:left;border:1px solid var(--line-soft);border-radius:7px;background:rgba(15,13,12,.5);color:var(--text-2);font:600 var(--fs-sec)/1.35 var(--font-sans);padding:14px 11px 14px 27px;cursor:pointer;transition:.14s}
.case-btn::before{content:"";position:absolute;left:11px;top:50%;width:7px;height:7px;border-radius:50%;background:var(--gene);transform:translateY(-50%)}
.case-btn:hover{border-color:var(--gene-dim);color:var(--text);background:rgba(224,145,58,.06)}
.case-btn[aria-pressed="true"]{border-color:var(--gene);color:#fff;background:rgba(224,145,58,.13)}
.branch.cultural{border-color:var(--cult-dim)}
.branch.environment{border-color:var(--line)}
.tree .hint{margin-top:auto;padding-top:10px}
.detail{border:1px solid var(--gene-dim);border-radius:var(--r);padding:18px 22px;background:linear-gradient(160deg,rgba(224,145,58,.11),var(--panel) 38%);display:flex;flex-direction:column}
.detail-kicker{font-size:var(--fs-label);letter-spacing:.08em;color:var(--gene);font-weight:700}
.detail h2{font-size:var(--fs-h2);line-height:1.25;margin:5px 0 12px;color:#fff}
.facts{display:grid;grid-template-columns:96px 1fr;gap:0;margin:0}
.facts dt,.facts dd{margin:0;padding:14px 0;border-top:1px solid var(--line-soft);line-height:1.45}
.facts dt{font-size:var(--fs-label);color:var(--text-3)}
.facts dd{font-size:var(--fs-sec);color:var(--text)}
.facts .culture{color:var(--cult-2)}
.summary{flex:0 0 auto;font-size:var(--fs-lead);line-height:1.45;padding:16px 19px;border-left:4px solid var(--warn);background:rgba(224,87,74,.07);border-radius:0 var(--r) var(--r) 0}
.summary strong{color:var(--warn)}
</style>
</head>
<body data-page="20" data-total="44">
<div id="stage"><main id="main">
  <section class="workspace min0" aria-label="近一万年的人类基因适应分类树">
    <div class="tree hier min0">
      <div class="root">近一万年的人类基因适应</div>
      <div class="branches min0">
        <section class="branch cultural lv cult min0">
          <div class="branch-title"><span class="tag cult">由文化触发</span><small>先有生活方式，后有选择压力</small></div>
          <div class="case-list">
            <button class="case-btn" data-id="lactase" aria-pressed="true">乳糖酶持续</button>
            <button class="case-btn" data-id="amy1" aria-pressed="false">淀粉酶 AMY1 拷贝数</button>
            <button class="case-btn" data-id="hbb" aria-pressed="false">疟疾区的血红蛋白变异</button>
          </div>
        </section>
        <section class="branch environment lv min0">
          <div class="branch-title"><span class="tag">由环境直接触发</span><small>纬度或海拔直接给出压力</small></div>
          <div class="case-list">
            <button class="case-btn" data-id="skin" aria-pressed="false">皮肤色素（SLC24A5 等）</button>
            <button class="case-btn" data-id="epas" aria-pressed="false">高原低氧（EPAS1）</button>
          </div>
        </section>
      </div>
      <div class="hint">点任意一项看细节</div>
    </div>
    <aside class="detail min0" aria-live="polite">
      <div class="detail-kicker">基因案例</div>
      <h2 id="case-title"></h2>
      <dl class="facts">
        <dt>何时</dt><dd id="when"></dd>
        <dt>哪些人群</dt><dd id="who"></dd>
        <dt>涉及什么</dt><dd id="what"></dd>
        <dt>文化前提</dt><dd id="culture" class="culture"></dd>
      </dl>
    </aside>
  </section>
  <div class="summary">一万年，<strong>几个位点</strong>。同一段时间里，另一条通道造出了文字、青铜、抗生素、集成电路和火箭。</div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:2, title:'基因也没闲着', sub:'一万年里人类确实变了一些基因。看清楚变了多少，才知道另一条通道有多快。', foot:'这些变化都有一个共同点：先有文化，后有基因。' });
var cases={
  lactase:{title:'乳糖酶持续',when:'欧洲约 7500 年前；东非独立起源另有变异',who:'北欧成人 >90%，东亚 <5%',what:'MCM6/LCT 上游的单个碱基（−13910 C→T）',culture:'先驯化了牛羊、先会挤奶'},
  amy1:{title:'淀粉酶 AMY1',when:'农业以来',who:'高淀粉饮食人群拷贝数明显更多',what:'基因拷贝数变化，不是单点突变',culture:'先有了农业和熟食'},
  hbb:{title:'血红蛋白变异（如镰刀型）',when:'数千年',who:'疟疾流行区',what:'HBB 等',culture:'先有了定居和农田积水，疟疾才成为强选择压'},
  skin:{title:'皮肤色素',when:'约 6000–12000 年（欧洲的 SLC24A5 扫荡）',who:'高纬人群',what:'若干色素相关位点',culture:'无（纬度直接给的）'},
  epas:{title:'高原低氧',when:'估计约 3000–8000 年（区间有分歧）',who:'藏族人群',what:'EPAS1，来自丹尼索瓦人的渐渗片段',culture:'无（海拔直接给的）'}
};
function showCase(id){
  var d=cases[id];
  document.getElementById('case-title').textContent=d.title;
  document.getElementById('when').textContent=d.when;
  document.getElementById('who').textContent=d.who;
  document.getElementById('what').textContent=d.what;
  document.getElementById('culture').textContent=d.culture;
  document.querySelectorAll('.case-btn').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.id===id));});
}
document.querySelectorAll('.case-btn').forEach(function(b){b.addEventListener('click',function(){showCase(b.dataset.id);});});
showCase('lactase');
</script>
</body></html>
