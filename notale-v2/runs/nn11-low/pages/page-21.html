<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>基因—文化协同演化</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:22px;padding-top:8px;padding-bottom:16px}
.thesis{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;align-items:center;gap:38px;padding:25px 30px;border:1px solid var(--line-soft);border-radius:var(--r);background:linear-gradient(105deg,rgba(95,200,216,.07),rgba(25,21,18,.72) 42%,rgba(224,145,58,.05))}
.claim{border-left-color:var(--cult);padding-left:26px;font-size:26px}
.claim .line2{display:block;margin-top:8px;font-size:var(--fs-lead);font-weight:500;color:var(--text-2)}
.gene{color:var(--gene-2)}
.cult{color:var(--cult-2)}
.loopmark{position:relative;height:108px;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.loopmark .node{position:absolute;top:34px;font-size:var(--fs-sec);font-weight:700;letter-spacing:.08em}
.loopmark .node.c{left:8px;color:var(--cult-2)}
.loopmark .node.g{right:8px;color:var(--gene-2)}
.loopmark svg{width:100%;height:100%;overflow:visible}
.bodygrid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(390px,.85fr);gap:34px;align-items:stretch}
.evidence{min-height:0;padding:20px 26px;display:flex;align-items:center;background:rgba(25,21,18,.72);border:1px solid var(--line-soft);border-radius:var(--r)}
.supports{width:100%;gap:18px}
.support{padding-left:31px;font-size:var(--fs-sec);line-height:1.55;color:var(--text-2)}
.support::before{left:6px;width:14px;background:var(--cult)}
.trunk{background:linear-gradient(to bottom,var(--cult),var(--gene));opacity:.7}
.support b{font-weight:650}
.limit{min-height:0;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,rgba(224,87,74,.11),rgba(25,21,18,.88));border:1px solid rgba(224,87,74,.48);border-left:5px solid var(--warn);border-radius:var(--r);padding:24px 28px}
.limit .ttl{color:var(--warn);margin-bottom:15px}
.limit p{margin:0;font-size:var(--fs-sec);line-height:1.62;color:var(--text-2)}
.limit p+p{margin-top:12px}
.limit strong{color:#fff}
.limit .break{color:#f0968c;font-weight:700}
</style>
</head>
<body data-page="21" data-total="44">
<div id="stage"><main id="main">
  <section class="thesis min0" aria-label="核心主张">
    <div class="claim min0">
      <span class="cult">文化</span>不是<span class="gene">基因</span>的产物，是<span class="gene">基因</span>的环境。
      <span class="line2">人先改变自己的活法，活法再改变选择压力，<span class="gene">基因</span>才跟着变。</span>
    </div>
    <div class="loopmark min0" aria-hidden="true">
      <span class="node c">活法</span><span class="node g">基因</span>
      <svg viewBox="0 0 330 108">
        <defs>
          <marker id="ac" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5fc8d8"/></marker>
          <marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e0913a"/></marker>
        </defs>
        <path d="M74 37 C126 2 207 2 255 37" fill="none" stroke="#5fc8d8" stroke-width="2" marker-end="url(#ac)" opacity=".85"/>
        <path d="M255 70 C207 105 126 105 74 70" fill="none" stroke="#e0913a" stroke-width="2" marker-end="url(#ag)" opacity=".85"/>
        <text x="165" y="25" text-anchor="middle" fill="#8b8078" font-size="15">改变选择压力</text>
        <text x="165" y="98" text-anchor="middle" fill="#8b8078" font-size="15">反过来塑造</text>
      </svg>
    </div>
  </section>

  <div class="bodygrid min0">
    <section class="evidence min0" aria-label="四条支撑">
      <div class="supports">
        <span class="trunk" aria-hidden="true"></span>
        <div class="support">先<span class="cult">驯化牛羊、先会挤奶</span> → 才有了<b class="gene">乳糖酶持续</b>的选择压力</div>
        <div class="support">先有<span class="cult">农业和熟食</span> → 才有了<b class="gene">淀粉酶拷贝数</b>的选择压力</div>
        <div class="support">先<span class="cult">定居、先有积水的农田</span> → 疟疾才成为强选择压 → <b class="gene">血红蛋白变异</b></div>
        <div class="support">先能<span class="cult">在高原定居</span> → <b class="gene">EPAS1</b> 才有意义</div>
      </div>
    </section>

    <aside class="limit min0" aria-label="关键限定">
      <div class="ttl">但有一个前提</div>
      <p><strong>基因得跟得上。</strong></p>
      <p>上面四个例子的共同点是——那些活法<strong>持续了几千年没怎么变</strong>，基因才有时间跟。</p>
      <p class="break">一旦活法变得比几千年快得多，回路就断了。</p>
    </aside>
  </div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:2, title:'基因—文化协同演化', sub:'幕 II 收束。', foot:'两条通道都在跑，但速度差得离谱。下一页把这个差量算出来。' })
</script>
</body></html>
