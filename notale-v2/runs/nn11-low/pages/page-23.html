<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:10px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex:0 0 auto}
.mode{display:flex;align-items:center;gap:10px}
.mode-label{font-size:var(--fs-label);color:var(--text-3);margin-right:4px}
.chart-panel{flex:1 1 auto;min-height:0;position:relative;border:1px solid var(--line-soft);border-radius:var(--r);background:rgba(25,21,18,.55);overflow:hidden}
#chart{position:absolute;inset:0}
.takeaways{display:grid;grid-template-columns:1fr 1fr;gap:22px;flex:0 0 auto}
.take{min-width:0;border-left:3px solid var(--line);padding:7px 15px;font-size:var(--fs-sec);line-height:1.45;color:var(--text-2);background:rgba(25,21,18,.45)}
.take strong{font-size:var(--fs-lead)}
.take[data-mode="linear"]{border-color:var(--text-3)}
.take[data-mode="log"]{border-color:var(--acc)}
.take.active{background:rgba(95,200,216,.07)}
</style>
</head>
<body data-page="23" data-total="44">
<div id="stage"><main id="main">
  <div class="toolbar min0">
    <div class="mode" role="group" aria-label="纵轴模式">
      <span class="mode-label">纵轴</span>
      <button class="btn" id="linearBtn" aria-pressed="true">线性纵轴</button>
      <button class="btn" id="logBtn" aria-pressed="false">对数纵轴</button>
    </div>
    <div class="hint">换成对数纵轴，看这条曲线的真实形状</div>
  </div>
  <section class="chart-panel min0" aria-label="公元前一万年至2025年的世界人口曲线">
    <div id="chart"></div>
  </section>
  <div class="takeaways">
    <div class="take active" data-mode="linear"><strong>线性轴：像一堵墙。</strong> 一万两千年几乎贴着零，最后两百年突然立起来。不是曲线变了，是眼睛只能看见最后一段。</div>
    <div class="take" data-mode="log"><strong>对数轴：纯指数应是一条直线。</strong> 曲线却向上弯：1800 年后增长率本身还在变大；到 1970 年前后才拐头。</div>
  </div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
Chrome.mount({ act:3, title:'人口曲线', sub:'指数长什么样——以及为什么这条曲线比指数还凶。', foot:'人多了，每个人手上的能量也多了。下一页看那笔账。' });
var raw=[[-10000,4],[-5000,5],[-3000,14],[-1000,50],[1,200],[1000,265],[1500,460],[1700,610],[1800,990],[1850,1260],[1900,1650],[1950,2536],[1970,3700],[2000,6143],[2025,8200]];
var doubles=[[1800,1000,'10 亿'],[1927,2000,'20 亿'],[1974,4000,'40 亿'],[2022,8000,'80 亿']];
var chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
var mode='value';
function yearLabel(v){if(v<0)return '公元前 '+Math.abs(v);return String(v)}
function option(){
  var lineColor='#5fc8d8', text='#b9ada0', weak='#8b8078', grid='#2a231e';
  return {
    animationDuration:650, animationEasing:'cubicOut',
    textStyle:{fontFamily:'Noto Sans SC, Microsoft YaHei, sans-serif',fontSize:16,color:text},
    tooltip:{trigger:'axis',backgroundColor:'#191512',borderColor:'#3d342c',textStyle:{fontSize:16,color:'#ece7df'},formatter:function(p){var d=p[0].data;return yearLabel(d[0])+'<br><b>'+d[1].toLocaleString()+' 百万人</b>'}},
    grid:[{left:74,right:34,top:24,bottom:116},{left:'60%',right:42,height:48,bottom:34}],
    xAxis:[
      {type:'value',min:-10000,max:2025,axisLine:{lineStyle:{color:'#66594f'}},axisTick:{show:false},splitLine:{show:false},axisLabel:{fontSize:14,color:weak,formatter:yearLabel,hideOverlap:true}},
      {type:'value',gridIndex:1,min:1800,max:2022,axisLine:{lineStyle:{color:'#66594f'}},axisTick:{show:false},splitLine:{show:false},axisLabel:{fontSize:14,color:weak,formatter:function(v){return Math.round(v)},hideOverlap:true},name:'最后 222 年：翻倍跨度在缩短 →',nameLocation:'start',nameGap:22,nameTextStyle:{fontSize:14,color:text,align:'left'}}
    ],
    yAxis:[
      {type:mode,min:mode==='log'?1:0,max:mode==='log'?10000:9000,logBase:10,name:'世界人口（百万人）',nameTextStyle:{fontSize:14,color:text,padding:[0,0,8,0]},axisLine:{show:false},axisTick:{show:false},splitLine:{lineStyle:{color:grid}},axisLabel:{fontSize:14,color:weak,formatter:function(v){return v>=1000?(v/1000)+'k':v}}},
      {type:'value',gridIndex:1,min:0,max:1,show:false}
    ],
    series:[
      {name:'世界人口',type:'line',data:raw,showSymbol:true,symbolSize:6,smooth:.18,lineStyle:{width:4,color:lineColor},itemStyle:{color:lineColor},areaStyle:{color:'rgba(95,200,216,.10)'},markPoint:{symbol:'circle',symbolSize:13,itemStyle:{color:'#ece7df',borderColor:lineColor,borderWidth:3},label:{show:true,fontSize:14,color:'#ece7df',backgroundColor:'#191512',borderColor:'#3d342c',borderWidth:1,borderRadius:4,padding:[4,7],formatter:function(p){return p.data.name}},data:doubles.map(function(d){return{name:d[2],coord:[d[0],d[1]]}})}},
      {type:'line',xAxisIndex:1,yAxisIndex:1,data:doubles.map(function(d){return[d[0],.5]}),symbolSize:11,lineStyle:{color:lineColor,width:3},itemStyle:{color:'#ece7df',borderColor:lineColor,borderWidth:3},label:{show:true,position:'top',distance:8,fontSize:14,color:'#ece7df',formatter:function(p){return doubles[p.dataIndex][2]}},markArea:{silent:true,itemStyle:{color:'rgba(95,200,216,.08)'},label:{show:true,position:'insideBottom',fontSize:14,color:'#9de3ee'},data:[[{name:'127 年',xAxis:1800},{xAxis:1927}],[{name:'47 年',xAxis:1927},{xAxis:1974}],[{name:'48 年',xAxis:1974},{xAxis:2022}]]}}
    ]
  };
}
function setMode(next){mode=next;chart.setOption(option(),true);document.getElementById('linearBtn').setAttribute('aria-pressed',next==='value');document.getElementById('logBtn').setAttribute('aria-pressed',next==='log');document.querySelectorAll('.take').forEach(function(el){el.classList.toggle('active',el.dataset.mode===(next==='value'?'linear':'log'))})}
document.getElementById('linearBtn').onclick=function(){setMode('value')};
document.getElementById('logBtn').onclick=function(){setMode('log')};
setMode('value');
Deck.onResize(function(){chart.resize()});
</script>
</body></html>
