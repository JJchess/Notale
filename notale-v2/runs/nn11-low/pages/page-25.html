<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:14px}
.scene{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px}
.diagram{position:relative;min-width:0;min-height:0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:26px 18px 12px 126px}
.lane-label{position:absolute;left:0;width:105px;text-align:right}
.lane-label.oral{top:87px}.lane-label.written{top:283px}
.lane-label b{display:block;font-size:var(--fs-h2);line-height:1.25}.lane-label span{display:block;font-size:var(--fs-label);line-height:1.4;color:var(--text-3);margin-top:5px}
.lane-label.oral b{color:var(--gene-2)}.lane-label.written b{color:var(--cult-2)}
.process-svg{display:block;width:100%;height:100%;overflow:visible}
.process-svg text{font-family:var(--font-sans)}
.process-svg .label{font-size:var(--fs-sec);fill:var(--text-2)}
.process-svg .smalltxt{font-size:var(--fs-label);fill:var(--text-3)}
.process-svg .ticktxt{font:var(--fs-tick) var(--font-num);fill:var(--text-3)}
.process-svg .brain{fill:#211a15;stroke:var(--gene);stroke-width:2}
.process-svg .brain.written{fill:#132126;stroke:var(--cult)}
.process-svg .brain-mark{fill:none;stroke-width:2;stroke-linecap:round}
.process-svg .arrow{fill:none;stroke-width:2;marker-end:url(#arrowGene)}
.process-svg .arrow.cult{marker-end:url(#arrowCult)}
.process-svg .stable{stroke:var(--cult);stroke-width:4;stroke-linecap:round}
.process-svg .axis{stroke:var(--line);stroke-width:1}
.process-svg .tick{stroke:var(--line);stroke-width:1}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.origin{flex:1 1 auto;padding:20px 22px;background:linear-gradient(145deg,rgba(95,200,216,.08),transparent 62%);border-left:2px solid var(--cult-dim)}
.origin .year{font-family:var(--font-num);font-size:var(--fs-h2);color:var(--cult-2);margin:0 0 8px}
.origin p{margin:0;color:var(--text-2);font-size:var(--fs-sec);line-height:1.55}
.origin strong{color:var(--text)}
.transfer{padding:16px 20px;border-left:4px solid var(--cult);background:rgba(95,200,216,.06);font-size:var(--fs-lead);line-height:1.45}
.transfer .count{color:var(--cult-2);font-weight:700}
.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:48px}
.hint{margin:0}
@media (prefers-reduced-motion:reduce){.pulse{animation:none!important}}
</style>
</head>
<body data-page="25" data-total="44">
<div id="stage"><main id="main">
  <section class="scene min0" aria-label="口传与文字的传承过程">
    <div class="diagram min0">
      <div class="lane-label oral"><b>口传</b><span>必须经过活人</span></div>
      <div class="lane-label written"><b>文字</b><span>记忆离开身体</span></div>
      <svg class="process-svg" viewBox="0 0 980 445" role="img" aria-label="口传每一代都衰减并可能中断；文字写入载体后跨越很多年，再被很多人读取">
        <defs>
          <marker id="arrowGene" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e0913a"/></marker>
          <marker id="arrowCult" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5fc8d8"/></marker>
        </defs>
        <line class="axis" x1="28" y1="410" x2="946" y2="410"/>
        <g><line class="tick" x1="55" y1="404" x2="55" y2="418"/><text class="ticktxt" x="55" y="439" text-anchor="middle">当下</text></g>
        <g><line class="tick" x1="300" y1="404" x2="300" y2="418"/><text class="ticktxt" x="300" y="439" text-anchor="middle">一代后</text></g>
        <g><line class="tick" x1="565" y1="404" x2="565" y2="418"/><text class="ticktxt" x="565" y="439" text-anchor="middle">很多年后</text></g>
        <g><line class="tick" x1="920" y1="404" x2="920" y2="418"/><text class="ticktxt" x="920" y="439" text-anchor="middle">更多读者</text></g>

        <g id="oralLane">
          <g class="oral-node" transform="translate(55 92)"><circle class="brain" r="32"/><path class="brain-mark" stroke="#f0b874" d="M-15,-5 C-20,-21 2,-24 1,-9 C15,-19 23,-3 13,6 C22,20 -1,25 -3,10 C-17,19 -25,2 -15,-5"/></g>
          <path class="arrow oral-arrow" stroke="#e0913a" d="M92 92 H248"/>
          <g class="oral-node" transform="translate(285 92)" opacity=".72"><circle class="brain" r="28"/><path class="brain-mark" stroke="#f0b874" d="M-13,-4 C-17,-18 2,-20 1,-7 C13,-16 19,-2 11,5 C18,16 -1,20 -2,8 C-14,15 -20,2 -13,-4"/></g>
          <path class="arrow oral-arrow" stroke="#e0913a" opacity=".65" d="M320 92 H462"/>
          <g class="oral-node" transform="translate(497 92)" opacity=".42"><circle class="brain" r="24"/><path class="brain-mark" stroke="#f0b874" d="M-11,-3 C-15,-15 1,-17 1,-6 C11,-13 16,-2 9,4 C15,14 -1,17 -2,7 C-12,13 -17,1 -11,-3"/></g>
          <path class="oral-arrow" stroke="#e0574a" stroke-width="2" stroke-dasharray="7 8" d="M528 92 H654"/>
          <g class="break" transform="translate(682 92)"><path stroke="#e0574a" stroke-width="4" d="M-10,-16 L1,-4 L-7,5 L8,18"/><text class="label" fill="#e0574a" x="0" y="49" text-anchor="middle">链断了，信息消失</text></g>
          <text class="smalltxt" x="383" y="42" text-anchor="middle">遗忘 · 走样 · 随人死去</text>
        </g>

        <g id="writtenLane">
          <g class="write-node" transform="translate(55 286)"><circle class="brain written" r="32"/><path class="brain-mark" stroke="#9de3ee" d="M-15,-5 C-20,-21 2,-24 1,-9 C15,-19 23,-3 13,6 C22,20 -1,25 -3,10 C-17,19 -25,2 -15,-5"/></g>
          <path class="arrow cult write-arrow" stroke="#5fc8d8" d="M92 286 H218"/>
          <g class="tablet" transform="translate(270 286)"><path d="M-35,-42 Q-42,-35 -40,-24 L-34,37 Q-33,45 -22,44 L31,40 Q40,39 39,28 L35,-34 Q34,-43 23,-44 Z" fill="#273134" stroke="#5fc8d8" stroke-width="2"/><path d="M-23,-22 h18 m10,0 h18 m-45,15 h12 m9,0 h23 m-42,15 h20 m10,0 h12 m-39,15 h15 m10,0 h14" stroke="#9de3ee" stroke-width="2" stroke-linecap="round" opacity=".8"/></g>
          <line class="stable" x1="314" y1="286" x2="718" y2="286"/>
          <path class="arrow cult write-arrow" stroke="#5fc8d8" d="M718 286 H786"/>
          <g class="readers">
            <g transform="translate(824 265) scale(.62)"><circle class="brain written" r="29"/><path class="brain-mark" stroke="#9de3ee" d="M-13,-4 C-17,-18 2,-20 1,-7 C13,-16 19,-2 11,5 C18,16 -1,20 -2,8 C-14,15 -20,2 -13,-4"/></g>
            <g transform="translate(873 292) scale(.62)"><circle class="brain written" r="29"/><path class="brain-mark" stroke="#9de3ee" d="M-13,-4 C-17,-18 2,-20 1,-7 C13,-16 19,-2 11,5 C18,16 -1,20 -2,8 C-14,15 -20,2 -13,-4"/></g>
            <g transform="translate(922 265) scale(.62)"><circle class="brain written" r="29"/><path class="brain-mark" stroke="#9de3ee" d="M-13,-4 C-17,-18 2,-20 1,-7 C13,-16 19,-2 11,5 C18,16 -1,20 -2,8 C-14,15 -20,2 -13,-4"/></g>
          </g>
          <text class="label" x="516" y="253" text-anchor="middle" fill="#9de3ee">很多年 · 不衰减</text>
          <text class="smalltxt" x="270" y="351" text-anchor="middle">载体</text>
          <text class="smalltxt" x="875" y="351" text-anchor="middle">很多脑</text>
        </g>
      </svg>
    </div>

    <aside class="side min0">
      <div class="origin">
        <p class="ttl cult">最早的文字</p>
        <p class="year">约公元前 3200 年</p>
        <p><strong>两河流域 · 乌鲁克</strong></p>
        <p style="margin-top:14px">最早的一批泥板记的不是史诗，而是<strong>账</strong>：多少袋大麦、多少头羊、谁欠谁。</p>
      </div>
      <div class="transfer"><span class="count">第二次</span>，把身体的功能挪到体外。<br><span class="small">第一次是火：把消化搬到体外。第三次是计算，第四次是……</span></div>
    </aside>
  </section>
  <div class="controls">
    <p class="hint">重播这条信息如何离开一个人的身体</p>
    <button id="replay" class="btn cult" type="button">重播</button>
  </div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/anime.min.js"></script>
<script>
Chrome.mount({ act:3, title:'文字：把记忆搬到体外', sub:'第一次，信息可以不经过任何一个活人而存活下去。', foot:'消化搬到体外，记忆搬到体外——每搬一次，那条通道就宽一截。' });
var replay=document.getElementById('replay');
function finishState(){
  anime.set(['#oralLane > *','#writtenLane > *'],{opacity:1});
  anime.set('.oral-node',{scale:1}); anime.set('.write-node,.tablet,.readers',{scale:1});
  anime.set('.oral-arrow,.write-arrow,.stable',{strokeDashoffset:0});
}
function play(){
  anime.remove(['#oralLane > *','#writtenLane > *','.oral-node','.write-node','.tablet','.readers','.oral-arrow','.write-arrow','.stable']);
  var lines=document.querySelectorAll('.oral-arrow,.write-arrow,.stable');
  lines.forEach(function(el){var len=el.getTotalLength();el.style.strokeDasharray=len;el.style.strokeDashoffset=len});
  anime.set('#oralLane > *,#writtenLane > *',{opacity:0});
  anime.set('.oral-node,.write-node,.tablet,.readers',{scale:.82,transformOrigin:'center'});
  var tl=anime.timeline({easing:'easeOutQuad'});
  tl.add({targets:'#oralLane .oral-node:nth-of-type(1)',opacity:1,scale:1,duration:350})
    .add({targets:'#oralLane .oral-arrow:nth-of-type(2)',opacity:1,strokeDashoffset:0,duration:500})
    .add({targets:'#oralLane .oral-node:nth-of-type(3)',opacity:.72,scale:1,duration:350},'-=80')
    .add({targets:'#oralLane .oral-arrow:nth-of-type(4)',opacity:.65,strokeDashoffset:0,duration:500})
    .add({targets:'#oralLane .oral-node:nth-of-type(5)',opacity:.42,scale:1,duration:350},'-=80')
    .add({targets:'#oralLane .oral-arrow:nth-of-type(6)',opacity:1,strokeDashoffset:0,duration:450})
    .add({targets:'#oralLane .break,#oralLane text',opacity:1,duration:350})
    .add({targets:'.write-node',opacity:1,scale:1,duration:350},'+=100')
    .add({targets:'#writtenLane .write-arrow:first-of-type',opacity:1,strokeDashoffset:0,duration:450})
    .add({targets:'.tablet',opacity:1,scale:1,duration:400},'-=60')
    .add({targets:'.stable',opacity:1,strokeDashoffset:0,duration:900})
    .add({targets:'#writtenLane .write-arrow:last-of-type',opacity:1,strokeDashoffset:0,duration:350})
    .add({targets:'.readers',opacity:1,scale:[.82,1],duration:450})
    .add({targets:'#writtenLane text',opacity:1,duration:350});
}
replay.addEventListener('click',play);
finishState();
if(Deck.reduced()) replay.disabled=true;
</script>
</body></html>
