<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:28px;padding-bottom:10px}
.chart{display:flex;flex-direction:column;min-height:0}
.axis{display:grid;grid-template-columns:310px minmax(0,1fr) 112px;gap:14px;align-items:end;margin-bottom:5px}
.axis-title{font-size:var(--fs-label);color:var(--text-3);text-align:right;padding-right:2px}
.scale{position:relative;height:27px;border-bottom:1px solid var(--line)}
.tick{position:absolute;bottom:-2px;transform:translate(-50%,100%);font:var(--fs-tick)/1 var(--font-num);color:var(--text-3)}
.tick::before{content:"";position:absolute;left:50%;bottom:14px;width:1px;height:8px;background:var(--line)}
.rows{display:grid;grid-template-rows:repeat(13,minmax(0,1fr));gap:3px;flex:1;min-height:0;margin-top:15px}
.epoch{display:grid;grid-template-columns:310px minmax(0,1fr) 112px;gap:14px;align-items:center;border-radius:6px;border:0;background:transparent;color:inherit;padding:0;cursor:pointer;text-align:left;transition:background .16s}
.epoch:hover,.epoch:focus-visible,.epoch.on{background:rgba(95,200,216,.07)}
.pair{font-size:var(--fs-sec);line-height:1.2;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.track{height:18px;position:relative;background:linear-gradient(90deg,transparent 0,transparent 99.8%,var(--line-soft) 100%)}
.track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--line-soft) 0 1px,transparent 1px 20%);opacity:.38;pointer-events:none}
.interval{height:100%;width:var(--w);transform-origin:left center;background:linear-gradient(90deg,var(--cult-dim),var(--cult));border-radius:3px;position:relative;z-index:1;transition:filter .15s,opacity .15s}
.epoch.on .interval{filter:brightness(1.35);box-shadow:0 0 14px rgba(95,200,216,.25)}
.years{font:var(--fs-sec)/1 var(--font-num);color:var(--cult-2);white-space:nowrap}
.side{display:flex;flex-direction:column;gap:14px;min-height:0}
.controls{display:flex;align-items:center;gap:12px}
.readout{flex:1;display:flex;flex-direction:column;justify-content:center;border-left:3px solid var(--cult);padding:16px 0 16px 20px}
.read-label{font-size:var(--fs-label);color:var(--text-3);margin-bottom:8px}
.read-main{font-size:var(--fs-h2);line-height:1.35;font-weight:700}
.read-main .num{font-size:36px;color:var(--cult-2)}
.ratio{font-size:var(--fs-sec);color:var(--text-2);margin-top:8px;min-height:25px}
.statement{border-top:1px solid var(--line);padding-top:16px;font-size:var(--fs-lead);line-height:1.55;color:var(--text-2)}
.statement b{color:var(--text)}
.statement .fast{color:var(--cult-2)}
.hint{margin-top:auto}
@media (prefers-reduced-motion:reduce){.interval{transition:none!important}}
</style>
</head>
<body data-page="26" data-total="44">
<div id="stage"><main id="main">
  <section class="chart min0" aria-label="十三段技术里程碑间隔的对数长度比较">
    <div class="axis">
      <div class="axis-title">相邻里程碑</div>
      <div class="scale" aria-hidden="true">
        <span class="tick" style="left:0%">10年</span><span class="tick" style="left:20%">100年</span><span class="tick" style="left:40%">1千年</span><span class="tick" style="left:60%">1万年</span><span class="tick" style="left:80%">10万年</span><span class="tick" style="left:100%">100万年</span>
      </div>
      <div class="axis-title" style="text-align:left">间隔</div>
    </div>
    <div class="rows" id="rows"></div>
  </section>
  <aside class="side min0">
    <div class="controls"><button class="btn lg cult" id="play">播放</button><button class="btn" id="replay">重播</button></div>
    <div class="readout" aria-live="polite">
      <div class="read-label" id="readLabel">从飞机到月球</div>
      <div class="read-main">这一步花了<br><span class="num" id="readYears">66 年</span></div>
      <div class="ratio" id="ratio">是上一步的 1/1.9</div>
    </div>
    <div class="statement">从石器到手斧用了 <b>84 万年</b>。<br>从飞机到月球用了 <b class="fast">66 年</b>。<br><br>中间没有任何一次是因为哪一代人突然变聪明了——<b>每一代人的脑子都差不多。</b></div>
    <div class="hint">按播放，或点任意一段看它花了多久</div>
  </aside>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:3, title:'下一步来得越来越快', sub:'把相邻两个里程碑之间的间隔一段段量出来，间隔本身在坍缩。', foot:'加速不是因为人变聪明了。下一页说清楚它到底来自哪里。' });
var milestones=[
 ['Laetoli 足迹',3660000],['最早石器',3300000],['奥杜威石器',2600000],['阿舍利手斧',1760000],['用火确证',1000000],['智人出现',300000],['走出非洲',65000],['农业开始',12000],['最早文字',5200],['活字印刷',576],['蒸汽机',250],['动力飞行',123],['登上月球',57],['今天',0]
];
var intervals=milestones.slice(0,-1).map(function(m,i){return {from:m[0],to:milestones[i+1][0],years:m[1]-milestones[i+1][1]};});
var rows=document.getElementById('rows'), timers=[];
function fmtYears(v){return v>=10000?(v/10000).toLocaleString('zh-CN',{maximumFractionDigits:1})+'万年':v.toLocaleString('zh-CN')+'年'}
intervals.forEach(function(d,i){
 var b=document.createElement('button'); b.className='epoch'; b.type='button';
 var pct=Math.max(0,Math.min(100,(Math.log10(d.years)-1)/5*100));
 b.innerHTML='<span class="pair">'+d.from+' → '+d.to+'</span><span class="track"><i class="interval" style="--w:'+pct+'%"></i></span><span class="years">'+fmtYears(d.years)+'</span>';
 b.addEventListener('click',function(){select(i)}); rows.appendChild(b);
});
function select(i){
 [].forEach.call(rows.children,function(r,j){r.classList.toggle('on',j===i)});
 var d=intervals[i]; document.getElementById('readLabel').textContent='从'+d.from+'到'+d.to;
 document.getElementById('readYears').textContent=fmtYears(d.years).replace('年',' 年');
 document.getElementById('ratio').textContent=i===0?'第一段：作为比较起点':'是上一步的 1/'+(intervals[i-1].years/d.years).toFixed(1);
}
function stop(){timers.forEach(clearTimeout);timers=[]}
function play(){
 stop(); var bars=rows.querySelectorAll('.interval');
 bars.forEach(function(x){x.style.transition='none';x.style.transform='scaleX(0)';x.style.opacity='.18'});
 void rows.offsetWidth;
 intervals.forEach(function(d,i){timers.push(setTimeout(function(){var x=bars[i];x.style.transition='transform 350ms cubic-bezier(.2,.8,.2,1), opacity 180ms ease-out';x.style.transform='scaleX(1)';x.style.opacity='1';select(i)},i*350));});
}
document.getElementById('play').addEventListener('click',play);
document.getElementById('replay').addEventListener('click',play);
select(11);
</script>
</body></html>
