<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:20px;padding-top:4px}
.claim{flex:0 0 auto;border-left-color:var(--cult);max-width:1390px;padding-left:22px}
.claim .key{color:var(--cult-2)}
.claim .cycle{display:block;margin-top:7px;font-size:var(--fs-lead);line-height:1.45;font-weight:500;color:var(--text-2)}
.model{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:42px;align-items:stretch;position:relative;padding:2px 0}
.supports{gap:0;padding:2px 0 2px 30px;grid-template-rows:repeat(4,1fr)}
.supports .trunk{left:8px;background:linear-gradient(180deg,var(--cult-dim),var(--cult));width:2px}
.support{display:grid;grid-template-columns:170px minmax(0,1fr) 44px;align-items:center;gap:18px;padding:9px 0 9px 28px;border-bottom:1px solid var(--line-soft);background:linear-gradient(90deg,rgba(95,200,216,.055),rgba(95,200,216,.012) 74%,transparent);font-size:var(--fs-body);color:var(--text-2)}
.support:last-child{border-bottom:0}
.support::before{left:8px;top:50%;width:29px;background:var(--cult);opacity:.8}
.factor{font-size:var(--fs-h2);font-weight:700;color:var(--text);letter-spacing:.02em}
.factor b{color:var(--cult-2)}
.evidence{font-size:var(--fs-sec);line-height:1.5;color:var(--text-2)}
.times{font-family:var(--font-num);font-size:26px;line-height:1;text-align:center;color:var(--cult);font-weight:700}
.output{min0:0;display:flex;align-items:center;position:relative}
.output::before{content:"";position:absolute;left:-42px;top:10%;bottom:10%;width:42px;border-top:1px solid var(--cult);border-right:1px solid var(--cult);border-bottom:1px solid var(--cult);opacity:.65}
.result{width:100%;position:relative;border-left:4px solid var(--cult);padding:34px 18px 34px 24px;background:linear-gradient(90deg,rgba(95,200,216,.1),rgba(95,200,216,.025))}
.result::before{content:"→";position:absolute;left:-48px;top:50%;transform:translateY(-52%);font-size:26px;color:var(--cult);background:var(--bg);padding:5px 0}
.result-label{font-size:var(--fs-label);letter-spacing:.1em;color:var(--text-3);margin-bottom:10px}
.result-main{font-size:var(--fs-h2);line-height:1.4;font-weight:700;color:var(--cult-2)}
.result-sub{margin-top:9px;font-size:var(--fs-sec);line-height:1.45;color:var(--text-2)}
.closing{flex:0 0 auto;margin:0;padding:13px 18px;border-top:1px solid rgba(224,87,74,.42);font-size:var(--fs-lead);line-height:1.45;color:var(--warn);text-align:center}
.closing b{color:#f0968c}
</style>
</head>
<body data-page="27" data-total="44">
<div id="stage"><main id="main">
  <section class="claim min0" aria-label="核心主张">
    加速不是因为人变聪明了，是因为<span class="key">存量本身在参与生产</span>。
    <span class="cycle">每一代人手上可用的体外信息越多，他们能造出来的就越多——而造出来的又变成下一代的存量。</span>
  </section>

  <section class="model min0" aria-label="四个互相放大的因子">
    <div class="supports min0">
      <div class="trunk" aria-hidden="true"></div>
      <div class="support min0">
        <div class="factor"><b>累积</b></div>
        <div class="evidence">棘轮不回退。学会的东西写在体外，不随人死去（p14、p25）</div>
        <div class="times" aria-hidden="true">×</div>
      </div>
      <div class="support min0">
        <div class="factor"><b>组合</b></div>
        <div class="evidence">新东西多半是旧东西的重组。存量翻倍，可能的组合远不止翻倍</div>
        <div class="times" aria-hidden="true">×</div>
      </div>
      <div class="support min0">
        <div class="factor"><b>人数与连接</b></div>
        <div class="evidence">阈值只跟 <span class="num">ln N</span> 有关，但 <span class="num">N</span> 本身在指数增长（p15、p23）</div>
        <div class="times" aria-hidden="true">×</div>
      </div>
      <div class="support min0">
        <div class="factor"><b>能量</b></div>
        <div class="evidence">每个人手上从 <span class="num">1</span> 个当量人变成几十个（p24）</div>
        <div class="times" aria-hidden="true">×</div>
      </div>
    </div>
    <div class="output min0" aria-label="四个因子共同导向加速">
      <div class="result">
        <div class="result-label">互相放大</div>
        <div class="result-main">更多存量<br>生产更多存量</div>
        <div class="result-sub">增长开始推动<br>下一轮增长</div>
      </div>
    </div>
  </section>

  <p class="closing">注意这四个因子里，<b>没有一个在基因里</b>。它们全都在身体外面。</p>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:3, title:'加速的形状', sub:'幕 III 收束。', foot:'这条通道最终把一个七十公斤的哺乳动物送到了每秒 7.7 公里。下一幕算那笔账。' })
</script>
</body></html>
