<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>难的不是“上去”</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:12px}
.work{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px}
.plot-panel{min-width:0;min-height:0;display:flex;flex-direction:column;padding:14px 18px 12px}
.plot-top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:8px}
.plot-top .ctl{flex:1;max-width:710px}.plot-top input{--acc:var(--gene)}
.plot-top .cv{color:var(--gene-2);min-width:92px;text-align:right}
.legend{flex:0 0 auto}
.chart{flex:1 1 auto;min-height:0;background:linear-gradient(180deg,rgba(95,200,216,.035),rgba(15,13,12,.12));border:1px solid var(--line-soft)}
.readout{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
.readout .panel{padding:13px 16px}
.metric{display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px}
.metric .lab{font-size:var(--fs-sec);color:var(--text-2);line-height:1.35}
.metric .big{font-size:36px;color:var(--text)}
.metric .big.gene{color:var(--gene-2)}.metric .big.cult{color:var(--cult-2)}
.metric .unit{margin-left:2px}
.gapbox{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:center;border-color:var(--line)}
.factor{text-align:center}.factor+.factor{border-left:1px solid var(--line-soft)}
.factor .big{font-size:36px;color:var(--gene-2)}
.factor .small{margin-top:6px;color:var(--text-2)}
.hint{margin-top:auto}
.takeaway{flex:0 0 auto;border-left:4px solid var(--cult);padding:9px 16px;background:linear-gradient(90deg,rgba(95,200,216,.1),transparent 72%);font-size:var(--fs-lead);line-height:1.45}
.takeaway .gene{color:var(--gene-2)}.takeaway .cult{color:var(--cult-2)}.takeaway .warn{color:#f0968c;font-weight:700}
</style>
</head>
<body data-page="28" data-total="44">
<div id="stage"><main id="main">
  <section class="work min0" aria-label="竖直上抛与圆轨道速度比较">
    <div class="plot-panel panel min0">
      <div class="plot-top">
        <div class="ctl min0">
          <label class="cl" for="speed">竖直初速</label>
          <input id="speed" class="no-pan" type="range" min="0" max="11.5" step="0.05" value="1.4">
          <output id="speedOut" class="cv">1.40 km/s</output>
        </div>
        <div class="legend" aria-hidden="true">
          <span class="li"><i class="sw" style="background:var(--gene)"></i>扔上去</span>
          <span class="li"><i class="sw line" style="background:var(--cult)"></i>圆轨道</span>
        </div>
      </div>
      <div class="chart cvbox min0"><canvas id="chart" class="cv-fill"></canvas></div>
    </div>
    <aside class="readout min0">
      <div class="panel metric"><span class="lab">上到</span><span><b id="heightVal" class="big gene">101.5</b><i class="unit">km</i></span></div>
      <div class="panel metric"><span class="lab">留在这个高度需要</span><span><b id="orbitVal" class="big cult">7.85</b><i class="unit">km/s</i></span></div>
      <div class="panel gapbox">
        <div class="factor"><div id="ratioVal" class="big">5.6×</div><div class="small">速度差</div></div>
        <div class="factor"><div id="energyVal" class="big">31×</div><div class="small">能量差</div></div>
      </div>
      <div class="hint">拖滑块给它一个向上的初速，看它能上多高</div>
    </aside>
  </section>
  <div class="takeaway">1.4 km/s 就能摸到太空，但那只是<span class="gene">扔上去再掉回来</span>。要留在 400 km 上，需要 <span class="cult num">7.67 km/s</span> —— 速度只差 <span class="num">5.5 倍</span>，<span class="warn">能量差 30 倍</span>。</div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:4, title:'难的不是"上去"', sub:'到太空只要 1.4 km/s。留在太空要 7.7 km/s。差的那一截才是全部的难处。', foot:'那么"留在上面"到底是什么意思？牛顿三百年前就想清楚了。' });
var GM=3.986e14, R=6.371e6;
var slider=document.getElementById('speed'), speedOut=document.getElementById('speedOut');
var heightVal=document.getElementById('heightVal'), orbitVal=document.getElementById('orbitVal');
var ratioVal=document.getElementById('ratioVal'), energyVal=document.getElementById('energyVal');
var cv=document.getElementById('chart');
function physics(vkm){
  var v=vkm*1000, escape=Math.sqrt(2*GM/R), h;
  if(v>=escape) h=Infinity;
  else h=1/(1/R-v*v/(2*GM))-R;
  var shown=Math.min(h,500000), vc=Math.sqrt(GM/(R+shown))/1000;
  return {h:h,shown:shown,vc:vc,escape:v>=escape};
}
function draw(){
  var ctx=Deck.fit(cv), w=cv.offsetWidth, h=cv.offsetHeight;
  var L=76,Rt=42,T=22,B=48, pw=w-L-Rt, ph=h-T-B;
  var gene=Deck.token('--gene'), cult=Deck.token('--cult'), text2=Deck.token('--text-2'), text3=Deck.token('--text-3'), line=Deck.token('--line');
  var v=+slider.value, p=physics(v);
  function X(s){return L+s/8.5*pw} function Y(k){return T+ph-k/500*ph}
  ctx.clearRect(0,0,w,h); ctx.font='13px '+getComputedStyle(document.documentElement).getPropertyValue('--font-num');
  ctx.textAlign='right';ctx.textBaseline='middle';
  [0,100,200,300,400,500].forEach(function(k){var y=Y(k);ctx.strokeStyle=k===100||k===400?Deck.rgba('--text-2',.35):Deck.rgba('--line',.6);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(w-Rt,y);ctx.stroke();ctx.fillStyle=text3;ctx.fillText(k+' km',L-10,y)});
  ctx.save();ctx.translate(18,T+ph/2);ctx.rotate(-Math.PI/2);ctx.fillStyle=text2;ctx.font='15px '+getComputedStyle(document.documentElement).getPropertyValue('--font-sans');ctx.textAlign='center';ctx.fillText('高度（共同基准）',0,0);ctx.restore();
  ctx.textAlign='left';ctx.font='15px '+getComputedStyle(document.documentElement).getPropertyValue('--font-sans');ctx.fillStyle=text2;ctx.fillText('卡门线',L+8,Y(100)-12);ctx.fillText('国际空间站',L+8,Y(400)-12);
  ctx.textAlign='center';ctx.textBaseline='top';ctx.font='13px '+getComputedStyle(document.documentElement).getPropertyValue('--font-num');
  [0,2,4,6,8].forEach(function(s){ctx.fillStyle=text3;ctx.fillText(s,L+s/8.5*pw,T+ph+9)});ctx.font='15px '+getComputedStyle(document.documentElement).getPropertyValue('--font-sans');ctx.fillStyle=text2;ctx.fillText('速度（km/s，共同基准）',L+pw/2,h-18);
  ctx.strokeStyle=cult;ctx.lineWidth=4;ctx.beginPath();for(var k=0;k<=500;k+=4){var vc=Math.sqrt(GM/(R+k*1000))/1000;var x=X(vc),y=Y(k);if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();
  var ky=p.shown/1000, y=Y(ky), vx=Math.min(v,8.5), ox=Math.sqrt(GM/(R+p.shown))/1000;
  ctx.setLineDash([7,7]);ctx.strokeStyle=Deck.rgba('--text',.5);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(vx),y);ctx.lineTo(X(ox),y);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=gene;ctx.shadowColor=gene;ctx.shadowBlur=14;ctx.beginPath();ctx.arc(X(vx),y,9,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle=cult;ctx.beginPath();ctx.arc(X(ox),y,7,0,Math.PI*2);ctx.fill();
  ctx.font='15px '+getComputedStyle(document.documentElement).getPropertyValue('--font-sans');ctx.textBaseline='bottom';ctx.textAlign='right';ctx.fillStyle=gene;ctx.fillText(p.escape?'逃逸':('初速 '+v.toFixed(2)),X(vx)-10,y-9);ctx.textAlign='left';ctx.fillStyle=cult;ctx.fillText('留住 '+ox.toFixed(2),X(ox)+10,y-9);
}
function update(){
  var v=+slider.value,p=physics(v);speedOut.textContent=v.toFixed(2)+' km/s';
  heightVal.textContent=p.escape?'逃逸':p.h>500000?'> 500':(p.h/1000).toFixed(1);
  var vc=p.vc, ratio=v>0?vc/v:Infinity;orbitVal.textContent=vc.toFixed(2);
  ratioVal.textContent=isFinite(ratio)?ratio.toFixed(1)+'×':'—';energyVal.textContent=isFinite(ratio)?Math.round(ratio*ratio)+'×':'—';draw();
}
slider.addEventListener('input',update);Deck.onResize(draw);update();
</script>
</body></html>
