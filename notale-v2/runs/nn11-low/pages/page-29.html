<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:12px}
.scene{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(390px,.75fr);gap:18px;min-height:0}
.orbit{background:radial-gradient(circle at 50% 52%,#18252a 0,#101315 34%,#0a0908 72%);border:1px solid var(--line-soft)}
.orbit canvas{z-index:1}.orbit-label{position:absolute;left:18px;top:14px;z-index:2;color:var(--text-3);font-size:var(--fs-label)}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}.readout{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;flex:1}
.metric{padding:10px 0;border-bottom:1px solid var(--line-soft)}.metric.wide{grid-column:1/-1}.ml{font-size:var(--fs-label);color:var(--text-3);margin-bottom:3px}.mv{font-family:var(--font-num);font-size:var(--fs-lead);font-variant-numeric:tabular-nums}.state{font-family:var(--font-sans);font-size:var(--fs-h2);font-weight:700}
.insight{border-left:4px solid var(--cult);padding:11px 14px;background:rgba(95,200,216,.06);font-size:var(--fs-sec);line-height:1.55}.insight span{display:block}.insight b{color:var(--cult-2)}
.control{flex:0 0 auto;padding:13px 18px 12px}.states{display:grid;grid-template-columns:auto 28px auto 28px auto 28px auto 28px auto;align-items:center;margin-bottom:8px}.phase{text-align:center;font-size:var(--fs-label);color:var(--text-3);padding:4px 7px;border:1px solid transparent;border-radius:7px}.phase.on{color:var(--text);border-color:currentColor;background:rgba(255,255,255,.04);font-weight:700}.go{text-align:center;color:var(--line);font-size:var(--fs-body)}
.sliderrow{display:grid;grid-template-columns:120px 1fr 105px;gap:14px;align-items:center}.speedlabel{font-size:var(--fs-label);color:var(--text-2)}.speedval{text-align:right;font-family:var(--font-num);font-size:var(--fs-lead);color:var(--text)}.trackwrap{position:relative;padding-bottom:27px}.trackwrap input{width:100%;display:block}.marks{position:absolute;left:9px;right:9px;top:23px;height:22px}.mark{position:absolute;transform:translateX(-50%);font-family:var(--font-num);font-size:var(--fs-tick);color:var(--text-3);white-space:nowrap}.mark::before{content:"";display:block;width:1px;height:6px;background:var(--line);margin:0 auto 2px}.mark.edge0{transform:none}.mark.edge1{transform:translateX(-100%)}.below{display:flex;justify-content:space-between;align-items:center;margin-top:2px}.hint{margin:0}.calc{font-size:var(--fs-label);color:var(--text-3)}
</style>
</head>
<body data-page="29" data-total="44">
<div id="stage"><main id="main">
  <section class="scene min0">
    <div class="cvbox orbit no-pan min0"><div class="orbit-label">数值积分 · 每步 1 秒</div><canvas id="orbitCv" class="cv-fill" aria-label="地球与从北极上方发射的轨道积分图"></canvas></div>
    <aside class="side min0">
      <div class="panel readout">
        <div class="metric wide"><div class="ml">当前状态</div><div class="mv state" id="state">落回地面</div></div>
        <div class="metric"><div class="ml">初速</div><div class="mv" id="vout">6.00 km/s</div></div>
        <div class="metric"><div class="ml">飞行</div><div class="mv" id="flight">—</div></div>
        <div class="metric"><div class="ml">近地点高度</div><div class="mv" id="peri">—</div></div>
        <div class="metric"><div class="ml">远地点高度</div><div class="mv" id="apo">—</div></div>
        <div class="metric wide"><div class="ml">周期</div><div class="mv" id="period">—</div></div>
      </div>
      <div class="insight"><span>圆轨道上的航天器<b>一直在自由下落</b>——</span><span>它每秒往下掉 <b>4.9 米</b>，地球表面也弯下去 4.9 米。</span><span><b>它永远追不上地面。</b></span></div>
    </aside>
  </section>
  <section class="panel control">
    <div class="states" aria-label="速度增加时的状态迁移">
      <span class="phase" data-kind="impact">落回</span><span class="go">→</span><span class="phase" data-kind="low">椭圆·近地点在对面</span><span class="go">→</span><span class="phase" data-kind="circle">圆</span><span class="go">→</span><span class="phase" data-kind="high">椭圆·远地点在对面</span><span class="go">→</span><span class="phase" data-kind="escape">逃逸</span>
    </div>
    <div class="sliderrow"><label class="speedlabel" for="speed">发射速度</label><div class="trackwrap"><input id="speed" type="range" min="4" max="12" step="0.01" value="6" aria-label="发射速度，单位千米每秒"><div class="marks"><span class="mark edge0" style="left:0">4.00</span><span class="mark" style="left:47.35%">7.79 圆轨道</span><span class="mark" style="left:87.68%">11.01 逃逸</span><span class="mark edge1" style="left:100%">12.00</span></div></div><output class="speedval" id="speedval">6.00 km/s</output></div>
    <div class="below"><p class="hint">拖滑块改变初速，轨迹会重新算一遍</p><span class="calc">GM = 3.986×10¹⁴ m³/s² · h = 200 km</span></div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:4, title:'牛顿的大炮', sub:'轨道不是"飞出去"。轨道是一直在往下掉，而地面一直在躲开。', foot:'既然要 7.8 km/s，那就得问：这个速度从哪儿来？' });
const GM=3.986e14,R=6.371e6,H=2e5,r0=R+H,vc=Math.sqrt(GM/r0),ve=vc*Math.SQRT2;
const cv=document.getElementById('orbitCv'), slider=document.getElementById('speed'); let result;
function acc(x,y){const r=Math.hypot(x,y),k=-GM/(r*r*r);return [k*x,k*y]}
function integrate(vkm){let x=0,y=-r0,vx=vkm*1000,vy=0,dt=1,pts=[],min=r0,max=r0,hit=false,escaped=false,returnT=null,prevAngle=Math.atan2(y,x),turn=0,t=0;
 for(let i=0;i<20000;i++){if(i%5===0)pts.push([x,y]);let a=acc(x,y);x+=vx*dt+.5*a[0]*dt*dt;y+=vy*dt+.5*a[1]*dt*dt;let a2=acc(x,y);vx+=.5*(a[0]+a2[0])*dt;vy+=.5*(a[1]+a2[1])*dt;t+=dt;let r=Math.hypot(x,y);min=Math.min(min,r);max=Math.max(max,r);let ang=Math.atan2(y,x),da=ang-prevAngle;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;turn+=da;prevAngle=ang;if(r<R){hit=true;break}if(Math.abs(turn)>=2*Math.PI-.004&&returnT===null){returnT=t;break}if(r>6*r0&&vx*x+vy*y>0){escaped=true;break}}
 let kind,color,label;if(hit){kind='impact';color='--warn';label='落回地面'}else if(vkm*1000>=ve){kind='escape';color='--cult-2';label='逃逸'}else if(Math.abs(vkm*1000-vc)<35){kind='circle';color='--cult';label='圆轨道'}else if(vkm*1000<vc){kind='low';color='--gene';label='椭圆 · 近地点在对面'}else{kind='high';color='--gene';label='椭圆 · 远地点在对面'}return {pts,min,max,hit,escaped,returnT,t,kind,color,label}}
function fmtH(r){return r<R?'低于地面':Math.round((r-R)/1000).toLocaleString('zh-CN')+' km'}
function update(){const v=+slider.value;result=integrate(v);document.getElementById('vout').textContent=v.toFixed(2)+' km/s';document.getElementById('speedval').textContent=v.toFixed(2)+' km/s';const st=document.getElementById('state');st.textContent=result.label;st.style.color=Deck.token(result.color);document.getElementById('peri').textContent=fmtH(result.min);document.getElementById('apo').textContent=result.hit?'—':(result.kind==='escape'?'不断升高':fmtH(result.max));document.getElementById('flight').textContent=result.hit?'撞地，'+(result.t/60).toFixed(1)+' 分钟':result.kind==='escape'?'持续远离':'未撞地';document.getElementById('period').textContent=result.returnT?(result.returnT/60).toFixed(1)+' 分钟':result.kind==='escape'?'无':'积分中未完成一圈';document.querySelectorAll('.phase').forEach(e=>{e.classList.toggle('on',e.dataset.kind===result.kind);e.style.color=e.dataset.kind===result.kind?Deck.token(result.color):''});draw()}
function draw(){if(!result)return;const ctx=Deck.fit(cv),w=cv.offsetWidth,h=cv.offsetHeight;ctx.clearRect(0,0,w,h);const cx=w*.49,cy=h*.52,maxAbs=result.pts.reduce((m,p)=>Math.max(m,Math.abs(p[0]),Math.abs(p[1])),r0);let scale=Math.min(h*.41/R,w*.43/Math.max(R,Math.min(maxAbs,3.2*R)));scale=Math.min(scale,h*.41/R);ctx.save();ctx.translate(cx,cy);ctx.beginPath();ctx.arc(0,0,R*scale,0,Math.PI*2);let g=ctx.createRadialGradient(-R*scale*.3,-R*scale*.35,R*scale*.08,0,0,R*scale);g.addColorStop(0,'#39748a');g.addColorStop(.52,'#173d4b');g.addColorStop(1,'#0b2028');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=Deck.rgba('--cult',.32);ctx.lineWidth=1.5;ctx.stroke();ctx.beginPath();result.pts.forEach((p,i)=>{const X=p[0]*scale,Y=p[1]*scale;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.strokeStyle=Deck.token(result.color);ctx.lineWidth=3;ctx.shadowColor=Deck.token(result.color);ctx.shadowBlur=10;ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=Deck.token('--text');ctx.beginPath();ctx.arc(0,-r0*scale,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle=Deck.token('--text-2');ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-8,-r0*scale);ctx.lineTo(15,-r0*scale);ctx.stroke();ctx.restore()}
slider.addEventListener('input',update);Deck.onResize(draw);update();
</script>
</body></html>
