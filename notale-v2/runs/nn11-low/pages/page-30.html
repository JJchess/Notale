<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:12px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:0 0 auto}
.pick{font:600 var(--fs-label)/1.2 var(--font-sans);color:var(--text-2);background:transparent;border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer}
.pick[aria-pressed="true"]{border-color:var(--cult);color:var(--cult-2);background:rgba(95,200,216,.09)}
.controls .hint{margin-left:auto}
.race{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:18px}
.track-panel{display:flex;flex-direction:column;min-height:0;padding:16px 20px}
.clockline{display:flex;align-items:baseline;justify-content:space-between;gap:18px;margin-bottom:8px}
.clock{font-family:var(--font-num);font-size:36px;line-height:1;font-variant-numeric:tabular-nums;color:var(--cult-2)}
.scale{font-size:var(--fs-label);color:var(--text-3)}
.lanes{display:flex;flex-direction:column;justify-content:space-evenly;gap:7px;flex:1;min-height:0}
.lane{display:grid;grid-template-columns:112px minmax(0,1fr) 116px;align-items:center;gap:12px;min-height:42px}
.lname{font-size:var(--fs-sec);color:var(--text-2)}
.road{height:18px;position:relative;border-left:2px solid var(--text-3);border-right:2px solid var(--cult);background:linear-gradient(90deg,rgba(185,173,160,.05),rgba(95,200,216,.12));overflow:visible}
.road:after{content:"上海";position:absolute;right:-2px;top:-22px;font-size:var(--fs-tick);color:var(--text-3)}
.runner{position:absolute;left:0;top:50%;width:15px;height:15px;border-radius:50%;transform:translate(-50%,-50%);background:var(--text-2);box-shadow:0 0 0 3px var(--bg)}
.lane.orbit .runner{background:var(--cult);box-shadow:0 0 12px rgba(95,200,216,.65),0 0 0 3px var(--bg)}
.lane.orbit .lname,.lane.orbit .result{color:var(--cult-2);font-weight:700}
.result{text-align:right;font-family:var(--font-num);font-size:var(--fs-label);color:var(--text-2);font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.times{flex:1 1 auto;padding:14px 18px}
.times table td,.times table th{padding-top:5px;padding-bottom:5px}
.times .orb td{color:var(--cult-2);font-weight:700}
.insight{flex:0 0 auto;padding:14px 18px}
.orbitfact{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
.orbitfact .big{color:var(--cult-2)}
.warning{border-left:3px solid var(--warn);padding-left:13px;font-size:var(--fs-sec);line-height:1.45;color:var(--text-2)}
.warning b{color:#f0968c}
</style>
</head>
<body data-page="30" data-total="44">
<div id="stage"><main id="main">
  <div class="controls min0" aria-label="选择参照物">
    <button class="pick" data-id="walk" aria-pressed="false">步行</button>
    <button class="pick" data-id="rail" aria-pressed="true">高铁</button>
    <button class="pick" data-id="plane" aria-pressed="false">客机</button>
    <button class="pick" data-id="sound" aria-pressed="false">声速</button>
    <button class="pick" data-id="bullet" aria-pressed="false">步枪子弹</button>
    <button class="pick" data-id="orbit" aria-pressed="true">近地轨道</button>
    <button id="go" class="btn cult lg">开始</button>
    <div class="hint">选几个对手，按开始</div>
  </div>
  <section class="race min0">
    <div class="panel track-panel min0">
      <div class="clockline"><div><span class="ttl">同一条 1084 km 赛道 · 同时起跑</span></div><div class="clock" id="clock">00:00</div><div class="scale">动画 1 秒 = 现实 60 秒</div></div>
      <div class="lanes" id="lanes"></div>
    </div>
    <aside class="side min0">
      <div class="panel times min0">
        <div class="ttl">同一距离的实际用时</div>
        <table class="t"><thead><tr><th>参照</th><th>速度</th><th>用时</th></tr></thead><tbody id="tbody"></tbody></table>
      </div>
      <div class="panel insight">
        <div class="orbitfact"><span class="big sm num" id="lap">92.4</span><span class="unit">分钟 / 绕地球一圈</span></div>
        <p class="note">400 km 高度。一堂课的时间里，空间站会绕地球一圈。</p>
        <div class="warning"><b>这个速度不能一点点加上去</b>——空气会把你烧掉；必须在很短的时间里、在很稀薄的地方把它加完。</div>
      </div>
    </aside>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:4, title:'7.7 km/s 有多快', sub:'换成一段你走过的路：北京到上海，直线 1084 公里。', foot:'这个速度不是渐渐加上去的。它有一道非常硬的账要算。' });
var distance=1084000;
var items=[
 {id:'walk',name:'步行',speed:1.4,speedText:'1.4 m/s'},
 {id:'rail',name:'高铁',speed:350000/3600,speedText:'350 km/h'},
 {id:'plane',name:'客机巡航',speed:900000/3600,speedText:'900 km/h'},
 {id:'sound',name:'声速',speed:343,speedText:'343 m/s'},
 {id:'bullet',name:'步枪子弹',speed:900,speedText:'900 m/s'},
 {id:'orbit',name:'近地轨道',speed:7673,speedText:'7,673 m/s'}
];
items.forEach(function(d){d.seconds=distance/d.speed});
function duration(s){if(s>=86400)return (s/86400).toFixed(2)+' 天';if(s>=3600){var h=Math.floor(s/3600),m=Math.round((s-h*3600)/60);return h+' 小时 '+m+' 分';}var m=Math.floor(s/60),sec=Math.round(s-m*60);return m+' 分 '+String(sec).padStart(2,'0')+' 秒'}
document.getElementById('tbody').innerHTML=items.map(function(d){return '<tr class="'+(d.id==='orbit'?'orb':'')+'"><td>'+d.name+'</td><td class="n">'+d.speedText+'</td><td class="n">'+duration(d.seconds)+'</td></tr>'}).join('');
var selected=new Set(['rail','orbit']), running=false, stopLoop=null, elapsed=0;
function renderLanes(){var lanes=document.getElementById('lanes');lanes.innerHTML=items.filter(function(d){return selected.has(d.id)}).map(function(d){return '<div class="lane '+(d.id==='orbit'?'orbit':'')+'" data-id="'+d.id+'"><div class="lname">'+d.name+'</div><div class="road"><i class="runner"></i></div><div class="result">'+duration(d.seconds)+'</div></div>'}).join('');draw(0)}
function draw(realSeconds){elapsed=realSeconds;document.getElementById('clock').textContent=String(Math.floor(realSeconds/60)).padStart(2,'0')+':'+String(Math.floor(realSeconds%60)).padStart(2,'0');document.querySelectorAll('.lane').forEach(function(el){var d=items.find(function(x){return x.id===el.dataset.id});var p=Math.min(1,realSeconds/d.seconds);el.querySelector('.runner').style.left=(p*100)+'%';el.querySelector('.result').textContent=p>=1?'到达 · '+duration(d.seconds):duration(d.seconds)});}
document.querySelectorAll('.pick').forEach(function(b){b.addEventListener('click',function(){if(running)return;var id=b.dataset.id;if(selected.has(id)){if(selected.size===1)return;selected.delete(id);b.setAttribute('aria-pressed','false')}else{selected.add(id);b.setAttribute('aria-pressed','true')}renderLanes()})});
document.getElementById('go').addEventListener('click',function(){if(running){if(stopLoop)stopLoop();running=false;this.textContent='开始';draw(0);return}running=true;this.textContent='重来';var start=performance.now();stopLoop=Deck.loop(function(){var real=(performance.now()-start)/1000*60;draw(real);var max=Math.max.apply(null,items.filter(function(d){return selected.has(d.id)}).map(function(d){return d.seconds}));if(real>=max){draw(max);if(stopLoop)stopLoop();running=false;document.getElementById('go').textContent='重来'}})});
var R=6371000,h=400000,vc=7673;document.getElementById('lap').textContent=(2*Math.PI*(R+h)/vc/60).toFixed(1);
renderLanes();
</script>
</body></html>
