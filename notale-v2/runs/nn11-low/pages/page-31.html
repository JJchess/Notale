<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<link rel="stylesheet" href="assets/lib/katex.min.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:12px}
.formula-flow{display:grid;grid-template-columns:1fr 52px 1fr 52px 1.12fr;align-items:stretch;gap:0;flex:0 0 auto}
.formula-flow .step{min-width:0;border:1px solid var(--line-soft);background:rgba(25,21,18,.72);border-radius:var(--r);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.formula-flow .arw{display:flex;align-items:center;justify-content:center;color:var(--cult);font-size:24px}.formula-flow .arw::before{content:'→'}
.klabel{font-size:var(--fs-label);color:var(--text-3);white-space:nowrap}.kval{font-family:var(--font-num);font-size:var(--fs-lead);color:var(--cult-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.output{border-color:var(--cult-dim)!important;background:rgba(95,200,216,.07)!important}.output .big{color:var(--cult-2)}
.workspace{display:grid;grid-template-columns:480px minmax(0,1fr);gap:14px;flex:1 1 auto;min-height:0}
.controls{display:flex;flex-direction:column;gap:12px;padding:16px 18px;min-height:0}.formula{font-size:22px;min-height:42px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line-soft);padding-bottom:10px}
.ctlblock{display:flex;flex-direction:column;gap:5px}.ctl{gap:10px}.ctl .cl{width:120px}.ctl .cv{width:72px;text-align:right;color:var(--cult-2)}
.scale-note{padding-left:130px;font-size:var(--fs-label);color:var(--text-3);line-height:1.35}
.target{font-size:var(--fs-sec);line-height:1.4;color:var(--text-2);border-left:3px solid var(--warn);padding-left:11px}.target b{color:#f0968c;font-family:var(--font-num)}
.explain{margin-top:auto;border-top:1px solid var(--line-soft);padding-top:10px;font-size:var(--fs-sec);line-height:1.45;color:var(--text-2)}
.explain strong{display:block;color:var(--text);font-size:var(--fs-lead);line-height:1.42;margin-bottom:5px}.explain strong em{color:var(--cult-2)}
.chart-panel{display:flex;flex-direction:column;min-height:0;padding:12px 14px 10px;box-sizing:border-box}.chart-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:0 0 auto}.chart-head .ttl{margin:0}.chart-note{font-size:var(--fs-label);color:var(--text-3)}#chart{flex:1 1 auto;min-height:0;width:calc(100% - 12px)}.hint{flex:0 0 auto}
</style>
</head>
<body data-page="31" data-total="44">
<div id="stage"><main id="main">
  <section class="formula-flow" aria-label="火箭方程的输入输出关系">
    <div class="step"><span class="klabel">喷气速度 v<sub>e</sub></span><span class="kval" id="veTop">3,432.3 m/s</span></div>
    <div class="arw" aria-hidden="true"></div>
    <div class="step"><span class="klabel">质量比 m₀/m₁</span><span class="kval" id="ratioTop">15.00</span></div>
    <div class="arw" aria-hidden="true"></div>
    <div class="step output"><span class="klabel">得到速度增量</span><span class="big sm"><span id="dvTop">9,293</span><span class="unit">m/s</span></span></div>
  </section>
  <section class="workspace min0">
    <div class="panel controls min0">
      <div class="formula" id="formula" aria-label="德尔塔 v 等于喷气速度乘以初始质量与最终质量之比的自然对数"></div>
      <div class="ctlblock">
        <div class="ctl"><label class="cl" for="isp">比冲 I<sub>sp</sub></label><input class="no-pan" id="isp" type="range" min="250" max="460" step="1" value="350"><output class="cv" id="ispVal">350 s</output></div>
        <div class="scale-note">液氧煤油 ≈ 310 · 液氧液氢 ≈ 450</div>
      </div>
      <div class="ctlblock">
        <div class="ctl"><label class="cl" for="ratio">质量比 m₀/m₁</label><input class="no-pan" id="ratio" type="range" min="0" max="3.401197382" step="0.001" value="2.708050201"><output class="cv" id="ratioVal">15.00</output></div>
        <div class="scale-note">对数刻度 · 1.0 → 30</div>
      </div>
      <div class="target">到近地轨道需要约 <b>9,400 m/s</b><br>（含重力损失与气动损失）</div>
      <div class="explain"><strong>每让 Δv 多出一个 vₑ，质量比就要再乘一次 e（约 2.72）。</strong>不是加，是乘。要 3 倍的 vₑ，起飞质量就得是最后质量的 20 倍。<br>因为你扔掉的燃料，前一秒还得被你带着一起加速。越到后面，火箭越轻，同样多的燃料能加更多速——这就是对数的来源。</div>
      <div class="hint">拖两个滑块，看 Δv 怎么变</div>
    </div>
    <div class="panel chart-panel min0">
      <div class="chart-head"><div class="ttl cult">Δv 随质量比增长</div><div class="chart-note">每跨一级，横轴都要 × e</div></div>
      <div id="chart" role="img" aria-label="速度增量与质量比的实时对数曲线，标出了 e、e平方、e立方三个台阶"></div>
    </div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/katex.min.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
Chrome.mount({ act:4, title:'火箭方程（不用微积分）', sub:'火箭往后扔东西才能往前走。扔得越快、扔得越多，走得越快——但关系是对数的。', foot:'对数是个很凶的东西。下一页看它凶到什么程度。' });
var g0=9.80665, isp=document.getElementById('isp'), ratio=document.getElementById('ratio');
katex.render('\\Delta v = v_e\\,\\ln\\!\\left(\\frac{m_0}{m_1}\\right),\\qquad v_e=I_{sp}g_0',document.getElementById('formula'),{throwOnError:false});
var chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
function comma(n,d){return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
function update(){
  var I=+isp.value, r=Math.exp(+ratio.value), ve=I*g0, dv=ve*Math.log(r), data=[];
  for(var i=0;i<=160;i++){var x=Math.exp(Math.log(30)*i/160);data.push([x,ve*Math.log(x)])}
  document.getElementById('ispVal').textContent=I+' s'; document.getElementById('ratioVal').textContent=r.toFixed(2);
  document.getElementById('veTop').textContent=comma(ve,1)+' m/s'; document.getElementById('ratioTop').textContent=r.toFixed(2); document.getElementById('dvTop').textContent=comma(Math.round(dv),0);
  var ep=[Math.E,Math.exp(2),Math.exp(3)];
  chart.setOption({animation:false,textStyle:{fontFamily:getComputedStyle(document.documentElement).getPropertyValue('--font-sans'),fontSize:16,color:'#b9ada0'},grid:{left:82,right:32,top:34,bottom:58},tooltip:{trigger:'axis',textStyle:{fontSize:16},formatter:function(p){var q=p[0].value;return '质量比 '+q[0].toFixed(2)+'<br>Δv '+comma(Math.round(q[1]),0)+' m/s'}},xAxis:{type:'log',logBase:Math.E,min:1,max:30,name:'质量比  m₀/m₁',nameLocation:'middle',nameGap:34,nameTextStyle:{fontSize:16,color:'#b9ada0'},axisLine:{lineStyle:{color:'#5b5047'}},splitLine:{show:false},axisLabel:{fontSize:14,color:'#b9ada0',formatter:function(v){if(Math.abs(v-Math.E)<.02)return 'e';if(Math.abs(v-Math.exp(2))<.05)return 'e²';if(Math.abs(v-Math.exp(3))<.1)return 'e³';return v===1?'1':''}}},yAxis:{type:'value',min:0,max:Math.max(12000,ve*3.35),name:'Δv  (m/s)',nameTextStyle:{fontSize:16,color:'#b9ada0'},axisLabel:{fontSize:14,color:'#b9ada0',formatter:function(v){return comma(v,0)}},axisLine:{show:true,lineStyle:{color:'#5b5047'}},splitLine:{lineStyle:{color:'#2a231e'}}},series:[{type:'line',data:data,showSymbol:false,lineStyle:{width:4,color:'#5fc8d8'},markLine:{silent:true,symbol:'none',lineStyle:{type:'dashed',color:'#6c6055',width:1},label:{fontSize:14,color:'#ece7df',backgroundColor:'#191512',padding:[2,5]},data:[{yAxis:9400,label:{formatter:'近地轨道 9,400',color:'#f0968c'},lineStyle:{color:'#e0574a',width:2}},{xAxis:ep[0],label:{formatter:'e → 1×vₑ'}},{xAxis:ep[1],label:{formatter:'e² → 2×vₑ'}},{xAxis:ep[2],label:{formatter:'e³ → 3×vₑ'}}]}},{type:'scatter',data:[[r,dv]],symbolSize:18,itemStyle:{color:'#ece7df',borderColor:'#5fc8d8',borderWidth:5},z:5} ]},true);
}
isp.addEventListener('input',update);ratio.addEventListener('input',update);update();Deck.onResize(function(){chart.resize()});
</script>
</body></html>
