<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:18px}
.controls{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end}
.slider-wrap{position:relative;padding-bottom:34px}
.ctl{gap:16px}.ctl .cl{font-size:var(--fs-body);color:var(--text)}.ctl .cv{min-width:118px;text-align:right;font-size:var(--fs-lead);color:var(--cult-2)}
.anchors{position:absolute;left:112px;right:134px;bottom:0;height:27px;color:var(--text-3);font-size:var(--fs-tick);font-family:var(--font-num)}
.anchor{position:absolute;transform:translateX(-50%);white-space:nowrap}.anchor::before{content:"";display:block;width:1px;height:7px;background:var(--line);margin:0 auto 2px}
.anchor.a4{left:20%}.anchor.a94{left:74%}.anchor.a12{left:100%;transform:translateX(-100%)}
.anchor.a12::before{margin-right:0}
.epsilon{display:flex;align-items:center;gap:12px;padding-bottom:34px}.epsilon-label{font-size:var(--fs-label);color:var(--text-2);white-space:nowrap}.epsilon .btn{padding:8px 13px}
.mass-panel{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 28px;overflow:visible}
.bar-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.bar-head .ttl{margin:0}.formula{font-size:var(--fs-label);color:var(--text-3)}
.mass-shell{position:relative;margin:18px 0 14px;height:210px;overflow:visible}
.mass-bar{height:100%;display:flex;position:relative;border:1px solid #54483d;background:var(--panel-2);border-radius:8px;overflow:hidden}
.seg{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;min-width:0;transition:width .18s ease}.seg b{font-size:var(--fs-label);font-weight:600}.seg .pct{font-family:var(--font-num);font-size:var(--fs-h2);line-height:1.25;font-variant-numeric:tabular-nums}
.prop{background:rgba(95,200,216,.72);color:#071416}.prop b,.prop .pct{color:#071416}.struct{background:var(--gene);color:#1a0e04}.struct b,.struct .pct{color:#1a0e04}.payload{background:var(--ok);color:#101508}.payload b,.payload .pct{color:#101508}
.deficit{position:absolute;right:0;top:-18px;height:246px;border:3px solid var(--warn);border-right:0;background:rgba(224,87,74,.16);transform:translateX(100%);display:none}
.deficit::after{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:repeating-linear-gradient(135deg,var(--warn) 0 3px,transparent 3px 7px)}
.scale{display:flex;justify-content:space-between;font-family:var(--font-num);font-size:var(--fs-tick);color:var(--text-3);border-top:1px solid var(--line);padding-top:5px}
.readout{display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:38px}.status{font-size:var(--fs-lead);font-weight:700}.status.bad{color:#f0968c}.status.good{color:var(--ok)}
.legend{flex-wrap:nowrap}.legend .sw.prop{background:var(--cult)}.legend .sw.struct{background:var(--gene)}.legend .sw.payload{background:var(--ok)}
.bottom{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}.limit{border-left:4px solid var(--warn);padding:5px 0 5px 18px;font-size:var(--fs-lead);line-height:1.45}.limit .num{color:#fff;font-weight:700}.given{text-align:right;font-size:var(--fs-sec);color:var(--text-2);line-height:1.5}.hint{margin-top:-4px}
</style>
</head>
<body data-page="32" data-total="44">
<div id="stage"><main id="main">
  <section class="controls min0">
    <div class="slider-wrap min0 no-pan">
      <div class="ctl"><label class="cl" for="dv">目标 Δv</label><input id="dv" type="range" min="2000" max="12000" step="50" value="9400"><output class="cv" id="dvOut">9,400 m/s</output></div>
      <div class="anchors" aria-hidden="true"><span class="anchor a4">4,000 探空火箭</span><span class="anchor a94">9,400 近地轨道</span><span class="anchor a12">12,000 地月转移</span></div>
    </div>
    <div class="epsilon"><span class="epsilon-label">结构系数 ε</span><div class="btns" role="group" aria-label="结构系数"><button class="btn" data-e="0.06" aria-pressed="false">0.06</button><button class="btn" data-e="0.09" aria-pressed="true">0.09</button><button class="btn" data-e="0.12" aria-pressed="false">0.12</button></div></div>
  </section>

  <section class="panel mass-panel min0" aria-label="起飞总质量百分比分解">
    <div class="bar-head"><p class="ttl">共同基准 · 起飞总质量 = 100%</p><span class="formula num">fₚ = 1 − e<sup>−Δv/vₑ</sup>　 fₛ = εfₚ　 fᴸ = 1 − fₚ − fₛ</span></div>
    <div class="mass-shell">
      <div class="mass-bar">
        <div class="seg prop" id="prop"><b>推进剂</b><span class="pct" id="propPct"></span></div>
        <div class="seg struct" id="struct"><b>结构</b><span class="pct" id="structPct"></span></div>
        <div class="seg payload" id="payload"><b>载荷</b><span class="pct" id="payloadPct"></span></div>
      </div>
      <div class="deficit" id="deficit" aria-hidden="true"></div>
    </div>
    <div class="scale"><span>0%</span><span>起飞总质量</span><span>100%</span></div>
    <div class="readout"><div id="status" class="status" aria-live="polite"></div><div class="legend"><span class="li"><i class="sw prop"></i>推进剂</span><span class="li"><i class="sw struct"></i>结构</span><span class="li"><i class="sw payload"></i>有效载荷</span></div></div>
  </section>

  <div class="bottom min0">
    <div class="limit">在 ε = 0.09 时，单级火箭的 Δv 上限约 <span class="num">8,561 m/s</span>——离入轨还差约 <span class="num">840 m/s</span>。所以从来没有一枚单级火箭把有效载荷送进过轨道。</div>
    <div class="given"><span class="num">vₑ = 3,432.3 m/s</span><br>I<sub>sp</sub> = 350 s；结构约为推进剂的 9%（典型值）</div>
  </div>
  <div class="hint">拖 Δv 到 9400（近地轨道），看载荷比会怎么样</div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:4, title:'为什么火箭几乎全是燃料', sub:'把结构和载荷一起算进去，单级火箭连轨道都上不了——载荷比会变成负数。', foot:'解决办法只有一个：把用完的壳子扔掉。' });
(function(){
  var ve=3432.3, eps=.09;
  var dv=document.getElementById('dv'), out=document.getElementById('dvOut');
  var prop=document.getElementById('prop'), structure=document.getElementById('struct'), payload=document.getElementById('payload'), deficit=document.getElementById('deficit'), status=document.getElementById('status');
  function pct(x){return (x*100).toFixed(1)+'%'}
  function render(){
    var d=Number(dv.value), fp=1-Math.exp(-d/ve), fs=eps*fp, fl=1-fp-fs;
    out.textContent=Chrome.n(d)+' m/s';
    prop.style.width=(fp*100)+'%'; structure.style.width=(fs*100)+'%';
    payload.style.width=(Math.max(0,fl)*100)+'%'; payload.style.display=fl>0?'flex':'none';
    document.getElementById('propPct').textContent=pct(fp); document.getElementById('structPct').textContent=pct(fs); document.getElementById('payloadPct').textContent=pct(fl);
    if(fl<0){
      deficit.style.display='block'; deficit.style.width=(Math.abs(fl)*100)+'%';
      status.className='status bad'; status.textContent='载荷比 '+pct(fl)+'：这枚火箭连自己都送不上去';
    }else{
      deficit.style.display='none'; status.className='status good'; status.textContent='载荷比 '+pct(fl)+'：还能留下 '+pct(fl)+' 给有效载荷';
    }
  }
  dv.addEventListener('input',render);
  document.querySelectorAll('[data-e]').forEach(function(b){b.addEventListener('click',function(){eps=Number(b.dataset.e);document.querySelectorAll('[data-e]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});render()})});
  render();
})();
</script>
</body></html>
