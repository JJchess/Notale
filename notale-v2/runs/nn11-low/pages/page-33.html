<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:12px}
.work{display:grid;grid-template-columns:350px minmax(0,1fr) 300px;gap:18px;flex:1;min-height:0}
.photo{display:flex;flex-direction:column;min-height:0}
.photo img{min-height:0;flex:1;object-position:55% 50%;filter:saturate(.82) contrast(1.06)}
.photo figcaption{display:flex;justify-content:space-between;gap:12px;color:var(--text-2)}
.map-panel{display:flex;flex-direction:column;min-height:0;padding:14px 16px 12px;background:rgba(25,21,18,.76);border:1px solid var(--line-soft);border-radius:var(--r)}
.map-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}
.map-head .base{font-size:var(--fs-label);color:var(--text-2)}
.map-head .base b{font-family:var(--font-num);color:var(--text)}
.massmap{flex:1;min-height:0;position:relative;border:1px solid #574b41;background:#120f0d;border-radius:7px;overflow:hidden}
.massmap svg{display:block;width:100%;height:100%}
.massmap .piece{cursor:pointer;stroke:#0f0d0c;stroke-width:2;vector-effect:non-scaling-stroke;transition:opacity .16s,filter .16s}
.massmap .piece:hover,.massmap .piece.selected{filter:brightness(1.35)}
.massmap .piece.selected{stroke:#fff;stroke-width:3}
.massmap.only-return .piece:not([data-id="return"]){opacity:.12}
.massmap text{pointer-events:none;font-family:var(--font-sans);fill:#f5eee6;font-size:16px;font-weight:650}
.massmap .micro{font-size:14px;font-weight:500;fill:#d5c9bc}
.map-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.readout{flex:1;display:flex;flex-direction:column;justify-content:center;border-left:3px solid var(--cult);padding:10px 0 10px 18px}
.readout .name{font-size:var(--fs-h2);line-height:1.35;font-weight:700;margin-bottom:20px}
.metric{margin:8px 0;color:var(--text-2);font-size:var(--fs-sec)}
.metric b{display:block;font-family:var(--font-num);font-size:28px;line-height:1.2;margin-top:3px;color:var(--text)}
.ratio b{color:var(--cult-2)}
.sums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum{padding:10px;border-top:1px solid var(--line);font-size:var(--fs-label);color:var(--text-3)}
.sum b{display:block;color:var(--text);font-family:var(--font-num);font-size:var(--fs-body)}
.punch{flex:0 0 auto;padding:11px 18px;border:1px solid var(--cult-dim);border-radius:var(--r);background:rgba(95,200,216,.07);font-size:var(--fs-lead);line-height:1.4;text-align:center}
.punch b{font-family:var(--font-num);font-size:26px;color:var(--cult-2)}
.btn{white-space:nowrap}
</style>
</head>
<body data-page="33" data-total="44">
<div id="stage"><main id="main">
  <div class="work">
    <figure class="photo min0">
      <img src="assets/img/saturn-v-launch.jpg" alt="阿波罗 11 号的土星五号升空" title="土星五号 / 阿波罗 11 号发射，1969 年 7 月 16 日 · NASA · 公有领域">
      <figcaption><span>110.6 米高</span><span>起飞推力 3,400 万牛</span></figcaption>
    </figure>

    <section class="map-panel min0" aria-label="土星五号质量比例图">
      <div class="map-head"><span class="base">共同基准：起飞总质量 <b>2,970,000 kg = 100%</b></span><span class="tag cult">面积严格按质量</span></div>
      <div class="massmap no-pan" id="massmap"><svg id="treemap" viewBox="0 0 800 470" preserveAspectRatio="none" role="img" aria-label="各部分按起飞总质量所占面积切分"></svg></div>
      <div class="map-foot"><span class="hint">点任意一块看它占多少</span><button class="btn cult" id="only" type="button" aria-pressed="false">只留下回来的那部分</button></div>
    </section>

    <aside class="side min0">
      <section class="readout" aria-live="polite">
        <div class="ttl cult">当前选中</div>
        <div class="name" id="selName"></div>
        <div class="metric">质量<b id="selMass"></b></div>
        <div class="metric">占起飞总质量<b id="selPct"></b></div>
        <div class="metric ratio">相当于总质量<b id="selRatio"></b></div>
      </section>
      <div class="sums">
        <div class="sum">推进剂合计<b id="fuelSum"></b></div>
        <div class="sum">结构合计<b id="drySum"></b></div>
      </div>
    </aside>
  </div>
  <div class="punch">每 <b>1 公斤</b> 回到地球的东西，要在发射台上放 <b id="returnRatio"></b> 公斤。上一页那条对数曲线，就是这个比例的来源。</div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:4, title:'土星五号的质量账', sub:'2970 吨在发射台上，48.6 吨飞向月球，5.6 吨回到地球。', foot:'把这 5.6 吨里的三个人放回幕 I 的那具身体——他们在上面怎么样？' });

const total=2970000;
const parts=[
 {id:'s1fuel',name:'第一级 S-IC 推进剂',mass:2145000,color:'#875827'},
 {id:'s1dry',name:'第一级 S-IC 干重',mass:131000,color:'#65584e'},
 {id:'s2fuel',name:'第二级 S-II 推进剂',mass:456100,color:'#95642f'},
 {id:'s2dry',name:'第二级 S-II 干重',mass:36000,color:'#74665b'},
 {id:'s3fuel',name:'第三级 S-IVB 推进剂',mass:106600,color:'#a9783c'},
 {id:'s3dry',name:'第三级 S-IVB 干重 + 仪器舱',mass:13500,color:'#85766a'},
 {id:'ship',name:'送往月球的飞船',mass:48600,color:'#287f8d'},
 {id:'other',name:'其余起飞质量',mass:33200,color:'#3c342e'}
];
const svg=document.getElementById('treemap'), map=document.getElementById('massmap');
const NS='http://www.w3.org/2000/svg', W=800,H=470;
function el(n,a,p=svg){const x=document.createElementNS(NS,n);Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));p.appendChild(x);return x}
const first=parts[0], leftW=W*first.mass/total;
function addPiece(p,x,y,w,h,label){
 const g=el('g',{'data-group':p.id});
 const r=el('rect',{x,y,width:w,height:h,fill:p.color,class:'piece','data-id':p.id,tabindex:'0',role:'button','aria-label':p.name},g);
 r.addEventListener('click',()=>select(p.id)); r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(p.id)}});
 if(label){const t=el('text',{x:x+14,y:y+28},g);t.textContent=label;const s=el('tspan',{x:x+14,dy:22,class:'micro'},t);s.textContent=(p.mass/total*100).toFixed(p.id==='s3dry'?2:1)+'%';}
 return {g,r};
}
addPiece(first,0,0,leftW,H,'第一级推进剂');
let y=0; parts.slice(1).forEach(p=>{const h=H*p.mass/(total-first.mass);const label=h>27?(p.id==='s2fuel'?'第二级推进剂':p.id==='s1dry'?'第一级干重':p.id==='s3fuel'?'第三级推进剂':p.id==='ship'?'飞船':null):null;addPiece(p,leftW,y,W-leftW,h,label);y+=h});
// 指令舱嵌在“送往月球的飞船”中；面积仍以同一个总质量为基准
const shipIndex=parts.slice(1).findIndex(p=>p.id==='ship');
const before=parts.slice(1,shipIndex+1).reduce((s,p)=>s+p.mass,0);
const sy=H*before/(total-first.mass), sh=H*48600/(total-first.mass), rw=(W-leftW)*5560/48600;
const ret={id:'return',name:'最终溅落回地球的指令舱',mass:5560,color:'#5fc8d8'};
const rr=addPiece(ret,leftW,sy,rw,sh,null); rr.r.setAttribute('stroke','#baf4fb'); rr.r.setAttribute('stroke-width','2');
function select(id){
 const p=id==='return'?ret:parts.find(d=>d.id===id); if(!p)return;
 svg.querySelectorAll('.piece').forEach(n=>n.classList.toggle('selected',n.dataset.id===id));
 document.getElementById('selName').textContent=p.name;
 document.getElementById('selMass').textContent=Chrome.n(p.mass)+' kg';
 const pct=p.mass/total*100; document.getElementById('selPct').textContent=pct.toFixed(pct<1?2:1)+'%';
 document.getElementById('selRatio').textContent='约 1 / '+Math.round(total/p.mass);
}
document.getElementById('only').addEventListener('click',function(){const on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',String(on));map.classList.toggle('only-return',on);if(on)select('return')});
const fuel=2145000+456100+106600, dry=131000+36000+13500;
document.getElementById('fuelSum').textContent=Chrome.n(fuel)+' kg · '+(fuel/total*100).toFixed(1)+'%';
document.getElementById('drySum').textContent=Chrome.n(dry)+' kg · '+(dry/total*100).toFixed(1)+'%';
document.getElementById('returnRatio').textContent=Math.round(total/5560);
select('ship');
</script>
</body></html>
