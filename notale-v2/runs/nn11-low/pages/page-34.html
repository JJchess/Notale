<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:16px}
.timeline{position:relative;flex:1 1 auto;min-height:0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);overflow:hidden}
.photo{position:absolute;top:14px;width:300px;height:190px;border-radius:var(--r);overflow:hidden;background:var(--panel)}
.photo.start{left:0}.photo.end{right:0}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(8,7,6,.92) 100%)}
.photo-copy{position:absolute;z-index:2;left:16px;right:14px;bottom:12px;line-height:1.25}
.photo-copy .year{font:700 28px/1 var(--font-num);color:var(--cult-2)}
.photo-copy .name{font-size:var(--fs-sec);font-weight:700;color:var(--text);margin-top:5px}
.photo-copy .desc{font-size:var(--fs-label);color:var(--text-2);margin-top:3px}
.axis{position:absolute;left:0;right:0;top:250px;height:2px;background:linear-gradient(90deg,var(--line) 0%,var(--cult) 100%)}
.axis::before{content:"";position:absolute;left:0;right:0;top:-27px;height:56px;background:linear-gradient(90deg,rgba(95,200,216,.025),rgba(95,200,216,.11));clip-path:polygon(0 32%,97% 32%,97% 12%,100% 50%,97% 88%,97% 68%,0 68%)}
.axis::after{content:"";position:absolute;right:-1px;top:-6px;border-left:12px solid var(--cult);border-top:7px solid transparent;border-bottom:7px solid transparent}
.endpoint{position:absolute;top:-34px;font:var(--fs-tick)/1 var(--font-num);color:var(--text-3)}
.endpoint.a{left:0}.endpoint.b{right:0}
.event{position:absolute;left:var(--x);top:250px}
.dot{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--cult);border:3px solid var(--bg);transform:translate(-50%,-6px);box-shadow:0 0 0 1px var(--cult-dim)}
.stem{position:absolute;left:-1px;width:1px;background:var(--cult-dim)}
.event.up .stem{height:42px;bottom:6px}.event.down .stem{height:47px;top:6px}
.event-card{position:absolute;width:230px;line-height:1.3}
.event.up .event-card{bottom:51px;transform:translateX(-50%);text-align:center}
.event.down .event-card{top:57px;transform:translateX(-50%);text-align:center}
.event.y1957 .event-card{transform:translateX(-100%);text-align:right;padding-right:12px}
.event.y1961 .event-card{transform:translateX(-25%);text-align:left;padding-left:12px}
.event-card .year{font:700 var(--fs-h2)/1 var(--font-num);color:var(--cult-2)}
.event-card .name{font-size:var(--fs-sec);font-weight:700;color:var(--text);margin-top:5px}
.event-card .desc{font-size:var(--fs-label);color:var(--text-2);margin-top:4px}
.connector{position:absolute;top:204px;width:1px;height:46px;background:var(--line)}
.connector.left{left:var(--x1903)}.connector.right{left:var(--x1969)}
.gap{position:absolute;top:261px;transform:translateX(-50%);font:var(--fs-tick)/1 var(--font-num);color:var(--text-3);white-space:nowrap;padding:3px 7px;background:var(--bg)}
.message{flex:0 0 auto;display:grid;grid-template-columns:210px 1fr;align-items:center;gap:24px;padding:18px 22px;background:linear-gradient(90deg,rgba(95,200,216,.10),rgba(25,21,18,.78) 42%,rgba(25,21,18,.46));border:1px solid var(--line-soft);border-radius:var(--r)}
.message .age{font:700 54px/.95 var(--font-num);color:var(--cult)}
.message .age small{display:block;font:var(--fs-label)/1.3 var(--font-sans);color:var(--text-3);margin-top:8px;letter-spacing:.08em}
.message .claimline{border-left:3px solid var(--cult);padding-left:22px;font-size:var(--fs-lead);line-height:1.55;color:var(--text-2)}
.message strong{color:var(--text)}
.message .gene{color:var(--gene-2)}
.message .culture{color:var(--cult-2);font-weight:700}
</style>
</head>
<body data-page="34" data-total="44">
<div id="stage"><main id="main">
  <section class="timeline min0" id="timeline" aria-label="1900 到 1970 年的航空航天时间线">
    <figure class="photo start">
      <img src="assets/img/wright-1903.jpg" alt="莱特飞行者号首次动力飞行" title="莱特飞行者号首飞，1903 年 12 月 17 日，摄影 John T. Daniels · 公有领域">
      <figcaption class="photo-copy"><div class="year">1903</div><div class="name">莱特兄弟首次动力飞行</div><div class="desc">12 秒，36.5 米，离地约 3 米</div></figcaption>
    </figure>
    <figure class="photo end">
      <img src="assets/img/moon-bootprint.jpg" alt="阿波罗 11 号宇航员留在月面的靴印" title="Apollo 11 靴印，1969 年 7 月 · NASA/JSC · 公有领域">
      <figcaption class="photo-copy"><div class="year">1969</div><div class="name">阿波罗 11 号</div><div class="desc">第一次有人踩在另一个天体上</div></figcaption>
    </figure>
    <div class="axis" aria-hidden="true"><span class="endpoint a">1900</span><span class="endpoint b">1970</span></div>
    <div class="connector left" aria-hidden="true"></div><div class="connector right" aria-hidden="true"></div>
    <div id="events"></div><div id="gaps"></div>
  </section>
  <section class="message min0">
    <div class="age">66 岁<small>一个人的一生</small></div>
    <div class="claimline">1903 年出生的人，<strong>66 岁那年</strong>在电视上看见了这只靴印。<br>这 66 年里，人类的<span class="gene">基因组</span>没有发生任何与飞行有关的变化。<span class="culture">变的全是图纸、材料和算法。</span></div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:4, title:'66 年', sub:'1903 年 12 月 17 日，一架帆布飞机离地 12 秒。1969 年 7 月 20 日，一只靴子踩进月尘。', foot:'一个人的一生，装得下这两件事。而基因在这 66 年里什么也没做。' });
(function(){
  var events=[
    {year:1903,name:'莱特兄弟首次动力飞行',desc:'12 秒，36.5 米，离地约 3 米'},
    {year:1926,name:'戈达德的第一枚液体火箭',desc:'飞了 2.5 秒，12.5 米高',side:'down'},
    {year:1942,name:'V-2 首次越过 100 km',desc:'人造物体第一次进入太空',side:'up'},
    {year:1957,name:'斯普特尼克 1 号',desc:'第一颗人造卫星，绕地球 96 分钟一圈',side:'down'},
    {year:1961,name:'加加林',desc:'第一个进入轨道的人，绕地一圈 108 分钟',side:'down'},
    {year:1969,name:'阿波罗 11 号',desc:'第一次有人踩在另一个天体上'}
  ];
  function pct(y){return ((y-1900)/(1970-1900)*100)+'%'}
  var timeline=document.getElementById('timeline');
  timeline.style.setProperty('--x1903',pct(1903));
  timeline.style.setProperty('--x1969',pct(1969));
  document.getElementById('events').innerHTML=events.slice(1,-1).map(function(e){
    return '<article class="event '+e.side+' y'+e.year+'" style="--x:'+pct(e.year)+'"><i class="dot"></i><i class="stem"></i><div class="event-card"><div class="year">'+e.year+'</div><div class="name">'+e.name+'</div><div class="desc">'+e.desc+'</div></div></article>';
  }).join('');
  document.getElementById('gaps').innerHTML=events.slice(1).map(function(e,i){
    var prev=events[i], years=e.year-prev.year, mid=(e.year+prev.year)/2;
    return '<span class="gap" style="left:'+pct(mid)+'">'+years+' 年</span>';
  }).join('');
})();
</script>
</body></html>
