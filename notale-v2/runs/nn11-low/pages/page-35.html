<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:14px}
.learning-field{display:grid;grid-template-columns:470px 1fr;gap:24px;flex:1 1 auto;min-height:0}
.body-map{position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(224,145,58,.035),rgba(224,145,58,.01));border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
.body-map::before{content:"1 g 校准的人体";position:absolute;left:18px;top:14px;color:var(--text-3);font-size:var(--fs-label);letter-spacing:.08em}
.body-map svg{width:86%;height:90%;display:block}
.body-line{fill:none;stroke:var(--text-3);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.48;transition:opacity .18s,stroke .18s,stroke-width .18s}
.zone{fill:rgba(224,145,58,.035);stroke:var(--line);stroke-width:2;transition:opacity .18s,fill .18s,stroke .18s}
.zone.active{fill:rgba(224,145,58,.17);stroke:var(--gene);stroke-width:3}
.zone-label{font-family:var(--font-sans);font-size:var(--fs-label);fill:var(--text-3);transition:fill .18s}
.zone-label.active{fill:var(--gene-2);font-weight:700}
.guide{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 6}
.tree-wrap{display:flex;flex-direction:column;min-height:0;gap:8px}
.root{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.root-node{border:1px solid var(--gene-dim);background:rgba(224,145,58,.08);border-radius:8px;padding:8px 15px;font-size:var(--fs-h2);font-weight:700;color:var(--gene-2)}
.root-line{height:2px;background:linear-gradient(90deg,var(--gene-dim),var(--line));flex:1}
.system-tree{display:grid;gap:8px;min-height:0}
.branch{border:1px solid var(--line-soft);border-left:3px solid var(--line);border-radius:8px;background:rgba(25,21,18,.72);overflow:hidden;transition:border-color .16s,background .16s}
.branch.active{border-left-color:var(--gene);border-top-color:var(--gene-dim);border-right-color:var(--gene-dim);border-bottom-color:var(--gene-dim);background:rgba(224,145,58,.055)}
.branch-head{width:100%;display:grid;grid-template-columns:24px 176px 1fr 22px;align-items:center;gap:10px;padding:10px 14px;color:var(--text);background:transparent;border:0;text-align:left;cursor:pointer;font:inherit}
.branch-head:focus-visible{outline:2px solid var(--focus);outline-offset:-3px}
.branch-mark{font-family:var(--font-num);color:var(--text-3);font-size:var(--fs-label)}
.branch-title{font-size:var(--fs-lead);font-weight:700}
.branch-why{font-size:var(--fs-sec);color:var(--text-2);line-height:1.4}
.chev{color:var(--gene);font-size:var(--fs-body);transform:rotate(0);transition:transform .16s}
.branch.active .chev{transform:rotate(90deg)}
.children{display:none;margin:0 16px 12px 48px;padding:3px 0 2px 18px;border-left:2px solid var(--gene-dim)}
.branch.active .children{display:grid;gap:7px}
.child{position:relative;color:var(--text-2);font-size:var(--fs-sec);line-height:1.42}
.child::before{content:"";position:absolute;left:-19px;top:.72em;width:12px;height:1px;background:var(--gene)}
.child .num{color:var(--warn);font-weight:700}
.bottom-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;flex:0 0 auto}
.rule-claim{border-left:4px solid var(--gene);padding:8px 16px;background:linear-gradient(90deg,rgba(224,145,58,.09),transparent 78%);font-size:var(--fs-lead);line-height:1.45;color:var(--text-2)}
.rule-claim strong{color:var(--text)}
.hint{white-space:nowrap}
</style>
</head>
<body data-page="35" data-total="44">
<div id="stage"><main id="main">
  <section class="learning-field min0" aria-label="失重影响的人体系统分类">
    <figure class="body-map min0" aria-label="人体系统位置示意，当前高亮结构负荷系统">
      <svg viewBox="0 0 320 500" role="img" aria-labelledby="human-title human-desc">
        <title id="human-title">失重影响的人体区域</title>
        <desc id="human-desc">头部代表姿态与感觉，躯干代表流体分布，骨骼与肌肉代表结构负荷。</desc>
        <path class="body-line" d="M160 91 C129 91 109 114 109 149 L113 260 88 383 M113 260 L160 280 207 260 232 383 M211 149 L207 260 M112 157 59 265 M208 157 261 265"/>
        <circle class="body-line" cx="160" cy="57" r="35"/>
        <path class="body-line" d="M145 46 Q160 35 175 46 M146 65 Q160 75 174 65 M132 128 Q160 145 188 128 M129 190 Q160 207 191 190 M122 245 Q160 264 198 245"/>
        <path class="body-line" d="M88 383 69 463 M232 383 251 463 M69 463 48 468 M251 463 272 468"/>
        <ellipse id="zone-sense" class="zone" cx="160" cy="57" rx="52" ry="48"/>
        <ellipse id="zone-fluid" class="zone" cx="160" cy="184" rx="68" ry="88"/>
        <path id="zone-load" class="zone active" d="M101 125 L91 263 62 374 81 383 117 277 160 296 203 277 239 383 258 374 229 263 219 125 197 120 194 249 160 267 126 249 123 120 Z"/>
        <path class="guide" d="M108 55 H34 M94 184 H20 M102 338 H28"/>
        <text id="label-sense" class="zone-label" x="18" y="49">姿态与感觉</text>
        <text id="label-fluid" class="zone-label" x="18" y="178">流体分布</text>
        <text id="label-load" class="zone-label active" x="18" y="332">结构负荷</text>
      </svg>
    </figure>

    <div class="tree-wrap min0">
      <div class="root"><div class="root-node">重力被拿掉</div><div class="root-line"></div></div>
      <div class="system-tree hier" id="tree">
        <section class="branch active" data-zone="load">
          <button class="branch-head" type="button" aria-expanded="true">
            <span class="branch-mark">01</span><span class="branch-title">结构负荷类</span>
            <span class="branch-why">骨、肌、脊柱：存在理由就是对抗 <span class="num">1 g</span></span><span class="chev">›</span>
          </button>
          <div class="children">
            <div class="child">承重骨每月流失 <span class="num">1–1.5%</span></div>
            <div class="child">抗重力肌 <span class="num">5–11 天</span>可失去约 <span class="num">20%</span> 的质量</div>
            <div class="child">脊柱伸长 <span class="num">3–5 cm</span>，返回后腰痛与椎间盘突出风险升高</div>
          </div>
        </section>
        <section class="branch" data-zone="fluid">
          <button class="branch-head" type="button" aria-expanded="false">
            <span class="branch-mark">02</span><span class="branch-title">流体分布类</span>
            <span class="branch-why">心血管、颅内、眼：校准前提是“站着”</span><span class="chev">›</span>
          </button>
          <div class="children">
            <div class="child">约 <span class="num">2 升</span>体液从下肢移向胸腔和头部</div>
            <div class="child">血浆容量下降 <span class="num">10–15%</span>，心脏后负荷下降</div>
            <div class="child">SANS：视盘水肿、远视漂移；长期任务中报告率超过 <span class="num">60%</span></div>
          </div>
        </section>
        <section class="branch" data-zone="sense">
          <button class="branch-head" type="button" aria-expanded="false">
            <span class="branch-mark">03</span><span class="branch-title">姿态与感觉类</span>
            <span class="branch-why">前庭、本体感觉、视觉：靠重力定“哪边是下”</span><span class="chev">›</span>
          </button>
          <div class="children">
            <div class="child">太空适应综合征：入轨头两三天约 <span class="num">70%</span> 的人头晕、呕吐</div>
            <div class="child">返回后立位耐受不良：站起来就晕，需要数天到数周恢复</div>
          </div>
        </section>
      </div>
    </div>
  </section>
  <div class="bottom-row min0">
    <div class="rule-claim">这三类没有一类是“太空病”。<strong>它们都是这具身体在正确地执行为地球写的规则</strong>——规则没错，环境换了。</div>
    <div class="hint">点任一类展开</div>
  </div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:5, title:'拿掉重力之后', sub:'这具身体的很多部件，是把"永远有 1 g 向下"当成前提设计的。', foot:'先把最贵的那一项拆开看：骨头。' });
(function(){
  var branches=Array.prototype.slice.call(document.querySelectorAll('.branch'));
  function select(branch){
    branches.forEach(function(b){
      var on=b===branch;
      b.classList.toggle('active',on);
      b.querySelector('button').setAttribute('aria-expanded',String(on));
      var z=b.getAttribute('data-zone');
      document.getElementById('zone-'+z).classList.toggle('active',on);
      document.getElementById('label-'+z).classList.toggle('active',on);
    });
  }
  branches.forEach(function(b){b.querySelector('button').addEventListener('click',function(){select(b);});});
})();
</script>
</body></html>
