<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:12px}
.workspace{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 398px;gap:18px}
.chart-panel{min-width:0;min-height:0;border:1px solid var(--line-soft);border-radius:var(--r);background:rgba(25,21,18,.72);padding:12px 14px 6px;display:flex;flex-direction:column}
#chart{flex:1 1 auto;min-height:0;width:100%}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
.readout{padding:14px 18px;border-left:4px solid var(--warn);background:var(--panel);border-radius:0 var(--r) var(--r) 0}
.readout .kicker{font-size:var(--fs-label);color:var(--text-3);letter-spacing:.06em}
.readout .big{color:var(--warn);margin:5px 0 4px}
.loss{font-size:var(--fs-sec);color:var(--text-2)}
.equiv{font-size:var(--fs-lead);line-height:1.4;margin-top:7px;color:var(--text)}
.equiv b{color:var(--gene-2)}
.mini-compare{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline;font-size:var(--fs-sec);padding-top:9px;margin-top:9px;border-top:1px solid var(--line-soft)}
.mini-compare .name{color:var(--text-2)}
.mini-compare .val{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.mini-compare .cult{color:var(--cult-2)}
.mini-compare .ground{color:var(--text-2)}
figure.training{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:148px 1fr;gap:12px;align-items:center;padding:10px;border:1px solid var(--line-soft);border-radius:var(--r);background:rgba(25,21,18,.6)}
figure.training img{height:112px;object-position:center}
figure.training figcaption{margin:0;font-size:var(--fs-label);color:var(--text-2)}
.takeaway{font-size:var(--fs-sec);line-height:1.48;color:var(--text-2);padding:10px 14px;border:1px solid var(--cult-dim);border-radius:var(--r);background:rgba(95,200,216,.06)}
.takeaway b{color:var(--cult-2)}
.control{flex:0 0 auto;padding:10px 16px 8px;border:1px solid var(--line-soft);border-radius:var(--r);background:var(--panel)}
.ctl{gap:14px}.ctl .cl{font-size:var(--fs-body);color:var(--text)}.ctl .cv{min-width:68px;color:var(--cult-2);font-size:var(--fs-lead)}
.anchor-row{position:relative;height:24px;margin:0 74px 0 96px;font-size:var(--fs-label);color:var(--text-3)}
.anchor{position:absolute;top:1px;transform:translateX(-50%);white-space:nowrap}
.anchor::before{content:"";display:block;width:1px;height:6px;background:var(--line);margin:0 auto 2px}
.anchor.a6{left:16.666%}.anchor.a12{left:33.333%}.anchor.a30{left:83.333%}
.hint{margin-top:1px}
</style>
</head>
<body data-page="36" data-total="44">
<div id="stage"><main id="main">
  <section class="workspace min0" aria-label="骨密度随时间变化的共同坐标比较">
    <div class="chart-panel min0"><div id="chart" role="img" aria-label="同一时间轴上比较无对抗、有对抗和地面骨质疏松的剩余骨密度曲线"></div></div>
    <aside class="side min0">
      <div class="readout">
        <div class="kicker">无对抗措施 · 剩余骨密度</div>
        <div><span class="big" id="bmdBig">91.3</span><span class="unit">%</span></div>
        <div class="loss">已流失 <span class="num" id="loss">8.7</span>%</div>
        <div class="equiv">相当于在地面上老化 <b><span class="num" id="years">9</span> 年</b></div>
        <div class="mini-compare">
          <span class="name">ARED 抗阻训练 + 药物</span><span class="val cult" id="ared">98.2%</span>
          <span class="name">地面骨质疏松</span><span class="val ground" id="ground">99.5%</span>
        </div>
      </div>
      <figure class="training">
        <img src="assets/img/iss-treadmill.jpg" title="国际空间站上的跑步机训练 · NASA · 公有领域" alt="国际空间站宇航员使用跑步机训练">
        <figcaption>每天两小时抗阻与有氧训练，是把那条红线压成蓝线的全部办法。</figcaption>
      </figure>
      <div class="takeaway">6 个月不锻炼，骨密度掉 8.7%——相当于在地面上老了 9 年。空间站上每天必须花两小时锻炼。<b>这两小时不是健身，是维持。</b></div>
    </aside>
  </section>
  <section class="control no-pan" aria-label="任务时长控制">
    <div class="ctl"><label class="cl" for="months">任务时长</label><input id="months" type="range" min="0" max="36" step="1" value="6"><output class="cv" id="monthOut">6 个月</output></div>
    <div class="anchor-row" aria-hidden="true"><span class="anchor a6">6 一次空间站任务</span><span class="anchor a12">12</span><span class="anchor a30">30 火星往返（含地表）</span></div>
    <div class="hint">拖任务时长，看骨头掉到什么程度</div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
Chrome.mount({ act:5, title:'骨量：每月 1–1.5%', sub:'地面上骨质疏松是一年掉 1%。轨道上是一个月。', foot:'骨头还能靠跑步机救回来。下一样救不回来。' });
var rates={none:.015,ared:.003,ground:.00083};
function bmd(r,t){return 100*Math.pow(1-r,t)}
var xs=Array.from({length:37},function(_,i){return i});
function seriesData(r){return xs.map(function(t){return [t,+bmd(r,t).toFixed(3)]})}
var chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
var marker=6;
var option={
  animation:false,
  textStyle:{fontFamily:getComputedStyle(document.documentElement).getPropertyValue('--font-sans'),fontSize:16,color:'#ece7df'},
  grid:{left:74,right:24,top:54,bottom:58},
  legend:{top:4,right:12,itemWidth:26,itemHeight:3,textStyle:{fontSize:14,color:'#b9ada0'},data:['微重力，无对抗','微重力，ARED + 药物','地面，绝经后骨质疏松']},
  tooltip:{show:false},
  xAxis:{type:'value',min:0,max:36,interval:6,name:'任务时长（月）',nameLocation:'middle',nameGap:35,nameTextStyle:{fontSize:16,color:'#b9ada0'},axisLabel:{fontSize:14,color:'#b9ada0'},axisLine:{lineStyle:{color:'#5a4c41'}},axisTick:{lineStyle:{color:'#5a4c41'}},splitLine:{lineStyle:{color:'#2a231e'}}},
  yAxis:{type:'value',min:40,max:100,interval:10,name:'剩余骨密度 %',nameTextStyle:{fontSize:16,color:'#b9ada0',padding:[0,0,8,0]},axisLabel:{fontSize:14,color:'#b9ada0'},axisLine:{show:true,lineStyle:{color:'#5a4c41'}},axisTick:{show:true},splitLine:{lineStyle:{color:'#2a231e'}}},
  series:[
    {name:'微重力，无对抗',type:'line',showSymbol:false,data:seriesData(rates.none),lineStyle:{width:4,color:'#e0574a'},itemStyle:{color:'#e0574a'},markLine:{silent:true,symbol:'none',label:{show:true,formatter:'{c} 个月',fontSize:14,color:'#ece7df',position:'insideEndTop'},lineStyle:{color:'#ece7df',width:2,type:'dashed'},data:[{xAxis:marker}]}},
    {name:'微重力，ARED + 药物',type:'line',showSymbol:false,data:seriesData(rates.ared),lineStyle:{width:4,color:'#5fc8d8'},itemStyle:{color:'#5fc8d8'}},
    {name:'地面，绝经后骨质疏松',type:'line',showSymbol:false,data:seriesData(rates.ground),lineStyle:{width:3,color:'#b9ada0',type:'dotted'},itemStyle:{color:'#b9ada0'}}
  ]
};
chart.setOption(option);
var input=document.getElementById('months');
function update(){
  var t=+input.value; marker=t;
  var n=bmd(rates.none,t),a=bmd(rates.ared,t),g=bmd(rates.ground,t),loss=100-n;
  document.getElementById('monthOut').textContent=t+' 个月';
  document.getElementById('bmdBig').textContent=n.toFixed(1);
  document.getElementById('loss').textContent=loss.toFixed(1);
  document.getElementById('years').textContent=Math.round(loss);
  document.getElementById('ared').textContent=a.toFixed(1)+'%';
  document.getElementById('ground').textContent=g.toFixed(1)+'%';
  chart.setOption({series:[{markLine:{data:[{xAxis:t}]}}]});
}
input.addEventListener('input',update);
Deck.onResize(function(){chart.resize()});
update();
</script>
</body></html>
