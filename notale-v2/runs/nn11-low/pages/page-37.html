<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:26px;height:100%;}
.visual{position:relative;display:flex;flex-direction:column;min-height:0;border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;background:radial-gradient(circle at 43% 42%,rgba(224,145,58,.10),transparent 43%),rgba(25,21,18,.58)}
.cvbox{flex:1;min-height:0}
.visual-top{position:absolute;left:20px;right:20px;top:16px;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.volume{color:var(--gene-2)}
.volume .big{font-size:52px}.volume .unit{color:var(--text-2)}
.names{text-align:right;font-size:var(--fs-sec);line-height:1.55;color:var(--text-2)}
.names b{color:var(--gene-2)}
.controls{position:absolute;left:18px;right:18px;bottom:15px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:18px}
.controls .hint{background:rgba(15,13,12,.78);padding:6px 10px;border-radius:7px}
.chain{display:flex;flex-direction:column;min-height:0;height:100%;gap:11px}
.flow.v{flex:1;min-height:0;justify-content:center}
.flow.v .step{flex:0 0 auto;border-left:3px solid var(--line);padding:8px 13px;background:linear-gradient(90deg,rgba(255,255,255,.025),transparent);border-radius:0 7px 7px 0;font-size:var(--fs-sec);line-height:1.4;color:var(--text-2)}
.flow.v .step strong{display:block;font-size:var(--fs-body);line-height:1.3;color:var(--text)}
.flow.v .step.origin{border-color:var(--gene);}.flow.v .step.effect{border-color:var(--warn)}
.flow.v .arw{flex-basis:20px;color:var(--warn)}
.permanent{margin:0;padding:13px 16px;border:1px solid var(--gene-dim);border-radius:var(--r);background:rgba(224,145,58,.07);font-size:var(--fs-lead);line-height:1.45;color:var(--text-2)}
.permanent b{color:var(--gene-2)}
.bottomfacts{display:grid;grid-template-columns:1fr 1.2fr;gap:10px}
.fact{padding:10px 12px;border-top:1px solid var(--line-soft);font-size:var(--fs-sec);line-height:1.42;color:var(--text-2)}
.fact strong{color:var(--warn)}
.fact .tag{margin-bottom:5px}
</style>
</head>
<body data-page="37" data-total="44">
<div id="stage"><main id="main">
  <section class="visual min0" aria-label="体液从下肢向胸腔和头部迁移的动画">
    <div class="visual-top">
      <div class="volume"><span class="big">≈ 2</span><span class="unit">升向上迁移</span></div>
      <div class="names"><b>puffy face</b> 月亮脸<br><b>bird legs</b> 鸟腿</div>
    </div>
    <div class="cvbox min0"><canvas id="bodyCanvas" class="cv-fill"></canvas></div>
    <div class="controls"><div class="hint">动画显示体液重新分布</div><button id="replay" class="btn gene" type="button">重播</button></div>
  </section>
  <section class="chain min0">
    <div class="flow v min0" aria-label="失重导致视力改变的因果链">
      <div class="step origin"><strong>失重</strong>循环系统失去“脚在下、头在上”的参照</div>
      <div class="arw"></div>
      <div class="step origin"><strong>约 2 升体液上移</strong>脸肿、腿变细、颈静脉扩张</div>
      <div class="arw"></div>
      <div class="step effect"><strong>头部静脉压与颅内压升高</strong>眼球后极受压变平、视盘水肿</div>
      <div class="arw"></div>
      <div class="step effect"><strong>远视漂移（SANS）</strong>长期任务报告率超过 <span class="num">60%</span>；部分人返回后不能完全恢复</div>
    </div>
    <p class="permanent">地面上躺一晚，早上脸也会肿。<br><b>失重就是那一晚永远不结束。</b></p>
    <div class="bottomfacts">
      <div class="fact"><span class="tag gene">最初几天</span><br>身体误判“血太多”，排水后血浆容量下降 <strong class="num">10–15%</strong></div>
      <div class="fact"><span class="tag warn">尚无成熟方案</span><br>下体负压装置、颈部套囊都还在试验阶段</div>
    </div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:5, title:'两升体液往上跑', sub:'循环系统是按"站着"校准的。躺平了还好说，永远失重就不一样了。', foot:'骨和血还能调。下一样是身体根本挡不住的。' });
var cv=document.getElementById('bodyCanvas'), replay=document.getElementById('replay');
var stopLoop=null;
function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
function draw(ms){
  var ctx=Deck.fit(cv),w=cv.offsetWidth,h=cv.offsetHeight;
  ctx.clearRect(0,0,w,h);
  var p=ease(Math.max(0,Math.min(1,ms/6000)));
  var cx=w*.46, top=h*.16, base=h*.84, scale=Math.min(w/760,h/570);
  ctx.save();ctx.translate(cx,0);
  // silhouette: completed state makes face round and calves narrow
  ctx.strokeStyle=Deck.rgba('--text-2',.72);ctx.lineWidth=5*scale;ctx.lineCap='round';ctx.lineJoin='round';
  var headR=(38+9*p)*scale, hy=top+55*scale;
  ctx.beginPath();ctx.arc(0,hy,headR,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,hy+headR);ctx.lineTo(0,top+240*scale);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,top+112*scale);ctx.lineTo(-105*scale,top+210*scale);ctx.moveTo(0,top+112*scale);ctx.lineTo(105*scale,top+210*scale);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,top+240*scale);ctx.lineTo(-48*scale,base);ctx.moveTo(0,top+240*scale);ctx.lineTo(48*scale,base);ctx.stroke();
  // fluid reservoirs
  ctx.fillStyle=Deck.rgba('--gene',.22+.28*p);
  ctx.beginPath();ctx.ellipse(0,top+165*scale,(48+12*p)*scale,(70+13*p)*scale,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(0,hy,(22+15*p)*scale,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=Deck.rgba('--gene',.52-.34*p);
  ctx.beginPath();ctx.ellipse(-34*scale,top+350*scale,(25-9*p)*scale,100*scale,-.08,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(34*scale,top+350*scale,(25-9*p)*scale,100*scale,.08,0,Math.PI*2);ctx.fill();
  // upward moving droplets
  ctx.fillStyle=Deck.token('--gene-2');
  for(var i=0;i<9;i++){var q=(p*1.35+i/9)%1, side=i%2?-1:1;var y=base-q*(base-hy-25*scale);var x=side*(38-30*q)*scale;ctx.globalAlpha=.2+.7*Math.sin(Math.PI*q);ctx.beginPath();ctx.arc(x,y,5*scale,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;
  // arrow direction
  ctx.strokeStyle=Deck.token('--gene-2');ctx.fillStyle=Deck.token('--gene-2');ctx.lineWidth=3*scale;Deck.arrow(ctx,-140*scale,base-15*scale,-140*scale,hy+30*scale,12*scale);
  ctx.restore();
}
function begin(){if(stopLoop)stopLoop();stopLoop=Deck.loop(function(t){draw(Math.min(6000,t));},{still:6000});}
Deck.autofit(cv,function(){draw(6000)});
draw(6000);
replay.addEventListener('click',begin);
</script>
</body></html>
