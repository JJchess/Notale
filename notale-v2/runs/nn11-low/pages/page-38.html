<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:12px}
.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.controls .btns{flex:1 1 auto}.hint{flex:0 0 auto}
.custom{display:none;grid-template-columns:1fr 1fr;gap:26px;padding:8px 16px;background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r)}
.custom.on{display:grid}
.dose-panel{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:170px 1fr;grid-template-rows:auto repeat(6,1fr);column-gap:16px;position:relative;padding:12px 16px 12px 0}
.axis-title{grid-column:1;grid-row:1;text-align:right;color:var(--text-3);font-size:var(--fs-label);padding-right:2px}
.axis{grid-column:2;grid-row:1;position:relative;height:34px;border-bottom:1px solid var(--line)}
.tick{position:absolute;bottom:5px;transform:translateX(-50%);font:var(--fs-tick)/1 var(--font-num);color:var(--text-3)}
.tick:first-child{transform:none}.tick:last-child{transform:translateX(-100%)}
.gridline{position:absolute;top:45px;bottom:12px;width:1px;background:var(--line-soft);pointer-events:none}
.ref{position:absolute;top:34px;bottom:8px;width:2px;background:var(--warn);opacity:.72;z-index:2}
.ref span{position:absolute;top:0;left:7px;white-space:nowrap;font-size:var(--fs-label);color:#f0968c;background:var(--bg);padding:1px 5px;border-radius:3px}
.ref.life span{top:25px;left:auto;right:7px}
.rlabel{display:flex;justify-content:flex-end;align-items:center;text-align:right;font-size:var(--fs-sec);color:var(--text-2);line-height:1.25}
.rlabel strong{display:block;font-size:var(--fs-label)}
.track{align-self:center;height:24px;background:#211c18;border-radius:4px;position:relative;overflow:visible}
.fill{height:100%;min-width:2px;border-radius:4px;background:var(--cult);box-shadow:0 0 16px rgba(95,200,216,.16)}
.fill.neutral{background:var(--text-3);box-shadow:none}.fill.total{background:var(--warn);box-shadow:0 0 18px rgba(224,87,74,.22)}
.val{position:absolute;top:50%;transform:translate(9px,-50%);font:var(--fs-label)/1 var(--font-num);color:var(--text);white-space:nowrap}
.summary{display:grid;grid-template-columns:1.15fr repeat(3,1fr) 2.35fr;gap:10px}
.metric{min-width:0;padding:11px 14px;background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r)}
.metric .k{font-size:var(--fs-label);color:var(--text-3);margin-bottom:3px}.metric .v{font:600 26px/1.15 var(--font-num);font-variant-numeric:tabular-nums;color:var(--text)}
.metric.primary{border-color:#6b2a24}.metric.primary .v,.metric.limit .v{color:#f0968c}
.metric.limit{border-color:#6b2a24;background:rgba(224,87,74,.07)}
.metric.limit .k{color:#d88b83}.metric.limit .v{font-family:var(--font-sans);font-size:var(--fs-lead);line-height:1.35}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-page="38" data-total="44">
<div id="stage"><main id="main">
  <section class="controls min0" aria-label="任务设置">
    <div class="btns" id="missions">
      <button class="btn" data-mode="iss180" aria-pressed="false">空间站 6 个月</button>
      <button class="btn" data-mode="iss365" aria-pressed="false">空间站 1 年</button>
      <button class="btn" data-mode="mars" aria-pressed="true">火星往返（巡航 360 天 + 地表 500 天）</button>
      <button class="btn" data-mode="custom" aria-pressed="false">自定义</button>
    </div>
    <div class="hint">选一个任务，或自己定天数</div>
  </section>
  <section class="custom min0" id="customCtl">
    <label class="ctl"><span class="cl">巡航天数</span><input id="cruise" type="range" min="0" max="500" value="360"><output class="cv" id="cruiseOut">360 天</output></label>
    <label class="ctl"><span class="cl">地表/在轨天数</span><input id="surface" type="range" min="0" max="600" value="500"><output class="cv" id="surfaceOut">500 天</output></label>
  </section>
  <section class="dose-panel panel min0" id="chart" aria-label="共同对数剂量轴上的剂量比较">
    <div class="axis-title">累计剂量 / mSv</div><div class="axis" id="axis"></div>
  </section>
  <section class="summary min0" aria-live="polite">
    <div class="metric primary"><div class="k">累计剂量</div><div class="v" id="total">982.4 mSv</div></div>
    <div class="metric"><div class="k">胸部 CT</div><div class="v" id="cts">140 次</div></div>
    <div class="metric"><div class="k">地面本底</div><div class="v" id="years">409 年</div></div>
    <div class="metric"><div class="k">NASA 生涯上限</div><div class="v" id="pct">164%</div></div>
    <div class="metric limit"><div class="k">一次火星往返</div><div class="v">一辈子的额度用掉 164%。但没有已知材料能在可发射的质量内挡住银河宇宙射线。</div></div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:5, title:'没有磁层的日子', sub:'地球有一层大气和一个磁场替我们挡射线。出了这两层，什么都没有。', foot:'骨、血、DNA 都靠不住。剩下的办法只有一个：把地球的条件随身带着。' });
(function(){
  var max=2000, min=.5, chart=document.getElementById('chart'), axis=document.getElementById('axis');
  function pos(v){return Math.max(0,Math.min(100,(Math.log10(v)-Math.log10(min))/(Math.log10(max)-Math.log10(min))*100));}
  [0.5,1,2,5,10,20,50,100,200,600,1000,2000].forEach(function(v){
    var t=document.createElement('span');t.className='tick';t.style.left=pos(v)+'%';t.textContent=v>=1000?(v/1000)+'k':v;axis.appendChild(t);
    var g=document.createElement('i');g.className='gridline';g.style.left='calc(170px + 16px + (100% - 202px) * '+(pos(v)/100)+')';chart.appendChild(g);
  });
  [{v:20,c:'work',s:'放射工作人员年限值 20 mSv'},{v:600,c:'life',s:'NASA 职业生涯上限 600 mSv'}].forEach(function(x){var r=document.createElement('i');r.className='ref '+x.c;r.style.left='calc(170px + 16px + (100% - 202px) * '+(pos(x.v)/100)+')';r.innerHTML='<span>'+x.s+'</span>';chart.appendChild(r)});
  var rows=[];
  function addRow(label,sub,neutral){var l=document.createElement('div');l.className='rlabel';l.innerHTML='<div><strong>'+label+'</strong>'+sub+'</div>';chart.appendChild(l);var tr=document.createElement('div');tr.className='track';var f=document.createElement('div');f.className='fill '+(neutral?'neutral':'');var val=document.createElement('span');val.className='val';tr.appendChild(f);tr.appendChild(val);chart.appendChild(tr);rows.push({l:l,f:f,val:val});}
  addRow('地面天然本底','全球平均 / 年',true);addRow('一次胸部 CT','单次',true);addRow('国际空间站','0.72 mSv / 天');addRow('深空巡航','1.84 mSv / 天');addRow('火星地表','0.64 mSv / 天');addRow('任务累计','各段相加');rows[5].f.className='fill total';
  function setRow(v,i){rows[i].f.style.width=pos(Math.max(v,min))+'%';rows[i].f.style.opacity=v===0?'.15':'1';rows[i].val.textContent=v===0?'0 mSv':(Math.round(v*10)/10)+' mSv';rows[i].val.style.left=pos(Math.max(v,min))+'%';}
  var mode='mars';
  function update(){var orbit=0,cr=0,su=0;if(mode==='iss180')orbit=180;else if(mode==='iss365')orbit=365;else if(mode==='mars'){cr=360;su=500}else if(mode==='custom'){cr=+cruise.value;su=+surface.value}
    var vals=[2.4,7,.72*orbit,1.84*cr,.64*su],sum=vals[2]+vals[3]+vals[4];vals.push(sum);vals.forEach(setRow);
    total.textContent=(Math.round(sum*10)/10)+' mSv';cts.textContent=Math.round(sum/7)+' 次';years.textContent=Math.round(sum/2.4)+' 年';pct.textContent=Math.round(sum/600*100)+'%';cruiseOut.textContent=cruise.value+' 天';surfaceOut.textContent=surface.value+' 天';
  }
  missions.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;mode=b.dataset.mode;missions.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});customCtl.classList.toggle('on',mode==='custom');update()});
  cruise.addEventListener('input',update);surface.addEventListener('input',update);update();
})();
</script>
</body></html>
