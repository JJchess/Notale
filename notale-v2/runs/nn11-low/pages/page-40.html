<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:12px}
.controls{display:grid;grid-template-columns:1fr 1.45fr;gap:14px;flex:0 0 auto}
.sliders,.scheme{padding:13px 18px}
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.ctl{flex-wrap:wrap}.ctl .cl{width:100%;font-size:var(--fs-label)}.ctl .cv{min-width:74px;text-align:right;color:var(--cult-2)}
.scheme{display:flex;align-items:center;gap:16px}.scheme .ttl{margin:0;flex:0 0 auto}.scheme .btns{flex-wrap:nowrap}.scheme .btn{white-space:nowrap}
.work{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(360px,.75fr);gap:14px;flex:1 1 auto;min-height:0}
.chart{display:flex;flex-direction:column;padding:14px 20px 15px;min-height:0}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:20px}.chart-head .ttl{margin:0}.estimate{font-size:var(--fs-label);color:var(--text-3)}
.legend{margin-top:5px}.legend .o{background:var(--cult)}.legend .w{background:#8cb7bd}.legend .f{background:var(--gene)}
.axis{margin:10px 0 2px 138px;display:grid;grid-template-columns:repeat(5,1fr);font:var(--fs-tick)/1 var(--font-num);color:var(--text-3)}
.axis span:last-child{text-align:right}.axis span:not(:first-child):not(:last-child){text-align:center}
.compare{display:grid;grid-template-columns:124px 1fr;gap:13px 14px;align-items:center;flex:1}
.rowlabel{text-align:right;color:var(--text-2);font-size:var(--fs-sec);line-height:1.3}.rowlabel b{display:block;font:600 var(--fs-body)/1.2 var(--font-num)}
.track{height:82px;position:relative;border-radius:6px;background:repeating-linear-gradient(90deg,var(--line-soft) 0,var(--line-soft) 1px,transparent 1px,transparent 25%);border-left:1px solid var(--line);display:flex;overflow:visible}
.seg{height:100%;min-width:0;position:relative;transition:width .2s ease}.seg.oxygen{background:var(--cult)}.seg.water{background:#8cb7bd}.seg.food{background:var(--gene)}
.seg:first-child{border-radius:5px 0 0 5px}.seg:last-of-type{border-radius:0 5px 5px 0}
.seg span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:600 var(--fs-label)/1 var(--font-num);color:#10100f;white-space:nowrap}
.totalmark{position:absolute;left:calc(var(--total) * 1%);top:-6px;bottom:-6px;border-right:2px solid var(--text);pointer-events:none}.totalmark i{position:absolute;right:-2px;top:-26px;font:600 var(--fs-label)/1 var(--font-num);color:var(--text);white-space:nowrap;font-style:normal}
.insight{margin:6px 0 0 138px;padding-top:9px;border-top:1px solid var(--line-soft);font-size:var(--fs-sec);color:var(--text-2);line-height:1.45}.insight b{color:var(--gene-2)}
.results{display:flex;flex-direction:column;gap:10px;padding:15px 18px;min-height:0}.results .ttl{margin:0}.massline{color:var(--cult-2)}.massline .unit{font-size:var(--fs-sec)}
.tonnes{font:var(--fs-sec)/1.3 var(--font-num);color:var(--text-2);margin-top:4px}
.metrics{display:grid;gap:7px}.metric{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:7px;border-top:1px solid var(--line-soft);font-size:var(--fs-sec);color:var(--text-2)}.metric b{font-family:var(--font-num);font-size:var(--fs-lead);white-space:nowrap}.assumption{font-size:var(--fs-label);color:var(--text-3);line-height:1.35}
.hint{margin-top:auto}.takeaway{flex:0 0 auto;border-left:3px solid var(--gene);padding:5px 14px;font-size:var(--fs-sec);line-height:1.45;color:var(--text-2)}.takeaway b{color:var(--gene-2)}
</style>
</head>
<body data-page="40" data-total="44">
<div id="stage"><main id="main">
  <section class="controls min0">
    <div class="panel sliders min0">
      <label class="ctl min0"><span class="cl">乘员数</span><input id="crew" type="range" min="1" max="6" value="6"><output class="cv" id="crewV">6 人</output></label>
      <label class="ctl min0"><span class="cl">任务天数（对数刻度）</span><input id="days" type="range" min="0" max="1000" value="752"><output class="cv" id="daysV">180 天</output></label>
    </div>
    <div class="panel scheme min0"><div class="ttl">回收方案</div><div class="btns" role="group" aria-label="回收方案">
      <button class="btn" data-mode="none" aria-pressed="false">不回收</button>
      <button class="btn" data-mode="iss" aria-pressed="true">国际空间站现行（水 98% + 氧 50%）</button>
      <button class="btn" data-mode="water" aria-pressed="false">只回收水</button>
    </div></div>
  </section>
  <section class="work min0">
    <div class="panel chart min0">
      <div class="chart-head"><div class="ttl">共同质量轴 · 每人每天</div><div class="estimate">设计口径估计</div></div>
      <div class="legend"><span class="li"><i class="sw o"></i>氧气</span><span class="li"><i class="sw w"></i>水</span><span class="li"><i class="sw f"></i>食物</span></div>
      <div class="axis"><span>0</span><span>2 kg</span><span>4 kg</span><span>6 kg</span><span>8 kg</span></div>
      <div class="compare">
        <div class="rowlabel">不回收基准<b>7.64 kg</b></div><div class="track" id="baseTrack"></div>
        <div class="rowlabel" id="modeLabel">ISS 现行<b id="dailyTotal">2.32 kg</b></div><div class="track" id="modeTrack"></div>
      </div>
      <div class="insight">水可回收 <b>98%</b>，氧可再生 <b>50%</b>；食物不能回收。回收越充分，吃的越成为大头。</div>
    </div>
    <aside class="panel results min0">
      <div class="ttl">任务总补给质量</div>
      <div><div class="big massline" id="mass">2,506<span class="unit">kg</span></div><div class="tonnes" id="tonnes">≈ 2.51 吨</div></div>
      <div class="metrics">
        <div class="metric"><span>货运飞船</span><b id="ships">1.1 次</b></div>
        <div class="assumption">按每次约 2,500 kg 上行货物</div>
        <div class="metric"><span>送到近地轨道</span><b id="cost">752 万美元</b></div>
        <div class="assumption">按 3,000 美元/kg，量级估计</div>
        <div class="metric"><span>食物占比</span><b id="foodShare">77.6%</b></div>
      </div>
      <div class="hint">调乘员数和天数，再切换回收方案</div>
    </aside>
  </section>
  <div class="takeaway">水可以回收到 98%，氧可以电解一半回来，<b>食物一克也回收不了</b>。所以长期任务最后剩下的最大一块是吃的——所有长期方案都绕回同一个词：<b>种地</b>。</div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:5, title:'一个人一天要多少', sub:'氧气 0.84 公斤，水 5 公斤，食物 1.8 公斤。一天 7.6 公斤，一样都不能少。', foot:'这些数字全部指向同一件事——去写幕 VI 的那句结论。' });
(function(){
  var rates={none:[.84,5,1.8],iss:[.42,.10,1.8],water:[.84,.10,1.8]}, names={none:'不回收',iss:'ISS 现行',water:'只回收水'};
  var crew=document.getElementById('crew'),days=document.getElementById('days'),mode='iss';
  function dayFromSlider(){return Math.max(1,Math.round(Math.pow(1000,Number(days.value)/1000)))}
  function segments(el,vals){el.innerHTML='';vals.forEach(function(v,i){var s=document.createElement('div');s.className='seg '+['oxygen','water','food'][i];s.style.width=(v/8*100)+'%';if(v>=.35)s.innerHTML='<span>'+v.toFixed(v<1?2:1)+'</span>';el.appendChild(s)});var total=vals.reduce(function(a,b){return a+b},0),m=document.createElement('div');m.className='totalmark';m.style.setProperty('--total',total/8*100);m.innerHTML='<i>'+total.toFixed(2)+' kg</i>';el.appendChild(m)}
  function update(){var c=+crew.value,d=dayFromSlider(),r=rates[mode],daily=r.reduce(function(a,b){return a+b},0),mass=c*d*daily,food=c*d*r[2];document.getElementById('crewV').textContent=c+' 人';document.getElementById('daysV').textContent=d+' 天';document.getElementById('modeLabel').childNodes[0].nodeValue=names[mode];document.getElementById('dailyTotal').textContent=daily.toFixed(2)+' kg';document.getElementById('mass').innerHTML=Chrome.n(Math.round(mass))+'<span class="unit">kg</span>';document.getElementById('tonnes').textContent='≈ '+(mass/1000).toFixed(2)+' 吨';document.getElementById('ships').textContent=(mass/2500).toFixed(1)+' 次';document.getElementById('cost').textContent=Chrome.cn(Math.round(mass*3000))+'美元';document.getElementById('foodShare').textContent=(food/mass*100).toFixed(1)+'%';segments(document.getElementById('modeTrack'),r)}
  segments(document.getElementById('baseTrack'),rates.none);crew.addEventListener('input',update);days.addEventListener('input',update);document.querySelectorAll('[data-mode]').forEach(function(b){b.addEventListener('click',function(){mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});update()})});update();
})();
</script>
</body></html>
