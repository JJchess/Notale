<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:22px;padding-top:4px;padding-bottom:12px}
.thesis{flex:0 0 auto;max-width:1370px;background:linear-gradient(90deg,rgba(224,145,58,.08),transparent 72%)}
.thesis .gene-word{color:var(--gene-2)}
.thesis .cult-word{color:var(--cult-2)}
.evidence{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column;padding:14px 18px 10px 46px;background:rgba(25,21,18,.72);border:1px solid var(--line-soft);border-radius:var(--r)}
.evidence>.trunk{left:52px;top:56px;bottom:28px;background:linear-gradient(180deg,var(--gene-dim),var(--cult-dim))}
.cols,.support-row{display:grid;grid-template-columns:1.03fr .92fr 1.28fr;column-gap:30px;align-items:center}
.cols{flex:0 0 auto;padding:0 20px 10px 24px;border-bottom:1px solid var(--line)}
.colhead{font-size:var(--fs-label);font-weight:700;letter-spacing:.06em;color:var(--text-3)}
.colhead:first-child{color:var(--gene)}
.colhead:last-child{color:var(--cult)}
.supports{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:repeat(5,1fr);gap:0}
.support-row{position:relative;padding:8px 20px 8px 24px;border-bottom:1px solid var(--line-soft);font-size:var(--fs-sec);line-height:1.4;color:var(--text-2)}
.support-row::before{content:"";position:absolute;left:6px;top:50%;width:11px;height:1px;background:var(--acc);opacity:.85}
.support-row:last-child{border-bottom:0}
.cell{min-width:0}
.calibration{color:var(--gene-2)}
.failure{color:var(--text)}
.solution{color:var(--cult-2);font-weight:600}
.solution.warn{color:#f0968c}
.solution.warn strong{color:var(--warn)}
.num{white-space:nowrap}
.arrow{color:var(--text-3);margin:0 5px}
</style>
</head>
<body data-page="41" data-total="44">
<div id="stage"><main id="main">
  <section class="claim thesis min0">
    从 <span class="gene-word num">366 万年前</span>到今天，这具身体没有为太空做过任何一项准备。<br>
    它在轨道上出的每一个问题，<span class="cult-word">解法都不在身体里。</span>
  </section>

  <section class="evidence min0" aria-label="五条支撑证据">
    <div class="trunk" aria-hidden="true"></div>
    <div class="cols" aria-hidden="true">
      <div class="colhead">身体按什么校准</div>
      <div class="colhead">在太空里</div>
      <div class="colhead">解法：全部在体外</div>
    </div>
    <div class="supports min0">
      <div class="support-row min0">
        <div class="cell calibration">骨骼按 <span class="num">1 g</span> 的受力重塑</div>
        <div class="cell failure">每月流失 <span class="num">1–1.5%</span></div>
        <div class="cell solution">一台跑步机、一套抗阻器械、双膦酸盐</div>
      </div>
      <div class="support-row min0">
        <div class="cell calibration">循环系统按站立姿势校准</div>
        <div class="cell failure"><span class="num">2 升</span>体液上移，视力受损</div>
        <div class="cell solution warn">下体负压装置——<strong>还在试验阶段</strong></div>
      </div>
      <div class="support-row min0">
        <div class="cell calibration">皮肤和 DNA 靠大气与磁层挡射线</div>
        <div class="cell failure">火星往返 <span class="num">982 mSv</span></div>
        <div class="cell solution warn"><strong>目前没有可行的屏蔽方案</strong></div>
      </div>
      <div class="support-row min0">
        <div class="cell calibration">体温调节靠对流和蒸发</div>
        <div class="cell failure">真空里两者都不存在</div>
        <div class="cell solution"><span class="num">14</span> 层的服装 + <span class="num">90 米</span>水冷管</div>
      </div>
      <div class="support-row min0">
        <div class="cell calibration">每天要 <span class="num">7.6 kg</span> 物质流过身体</div>
        <div class="cell failure">那里什么都没有</div>
        <div class="cell solution">整套再生生保系统</div>
      </div>
    </div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:6, title:'一项太空适应都没有', sub:'把幕 V 的五件事并排放一下，会看到同一个句式。', foot:'但这不是太空的特殊问题。' })
</script>
</body></html>
