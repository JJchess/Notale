<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:12px}
.compare-sheet{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:210px minmax(0,1fr) minmax(0,1fr);grid-template-rows:150px repeat(5,minmax(45px,auto));column-gap:20px;align-content:stretch}
.corner-label{align-self:end;padding:0 18px 12px 0;text-align:right;color:var(--text-3);font-size:var(--fs-label);letter-spacing:.08em;border-bottom:1px solid var(--line)}
.photo-head{position:relative;min-width:0;overflow:hidden;border-radius:var(--r) var(--r) 0 0;border-bottom:1px solid var(--line)}
.photo-head img{width:100%;height:100%;display:block;object-fit:cover;filter:saturate(.78) contrast(1.05)}
.photo-head::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(8,7,6,.86) 100%);pointer-events:none}
.photo-name{position:absolute;z-index:1;left:18px;bottom:12px;font-size:var(--fs-h2);font-weight:700;color:var(--text);text-shadow:0 2px 10px #000}
.dim,.cell{min-width:0;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;line-height:1.4}
.dim{justify-content:flex-end;text-align:right;padding:8px 18px 8px 0;color:var(--text-3);font-size:var(--fs-label);font-weight:600}
.cell{padding:8px 18px;font-size:var(--fs-sec);color:var(--text-2);background:rgba(255,255,255,.012)}
.cell.left{border-left:1px solid var(--line-soft)}
.cell.right{border-right:1px solid var(--line-soft)}
.gene-focus{color:var(--gene-2);font-weight:700;background:rgba(224,145,58,.07)}
.cult-focus{color:var(--cult-2);font-weight:650;background:rgba(95,200,216,.065)}
.closing{flex:0 0 auto;margin:1px 0 2px;text-align:center;font-size:var(--fs-lead);line-height:1.45;color:var(--text-2)}
.closing strong{color:var(--text);font-weight:700}
</style>
</head>
<body data-page="43" data-total="44">
<div id="stage"><main id="main">
  <section class="compare-sheet" aria-label="Laetoli 足迹与月面靴印的五个维度对照">
    <div class="corner-label min0">同一动作 · 两种信息世界</div>
    <figure class="photo-head min0">
      <img src="assets/img/laetoli-trackway.jpg" alt="Laetoli 古人类足迹" title="Laetoli 足迹复制品（日本国立科学博物馆） · Momotarou2012 · CC BY-SA 3.0">
      <figcaption class="photo-name">Laetoli 足迹</figcaption>
    </figure>
    <figure class="photo-head min0">
      <img src="assets/img/moon-bootprint.jpg" alt="月面上的宇航员靴印">
      <figcaption class="photo-name">月面靴印</figcaption>
    </figure>

    <div class="dim min0">留下它的那具身体</div>
    <div class="cell left min0">直立、足弓、汗腺、一颗 <span class="num">450 cc</span> 的脑</div>
    <div class="cell right min0">直立、足弓、汗腺、一颗 <span class="num">1350 cc</span> 的脑</div>

    <div class="dim min0">这具身体的基因改动</div>
    <div class="cell left min0">—</div>
    <div class="cell right gene-focus min0">在 <span class="num">366 万年</span>里，没有一处是为太空准备的</div>

    <div class="dim min0">身体之外的东西</div>
    <div class="cell left min0">无</div>
    <div class="cell right cult-focus min0"><span class="num">145 kg</span> 的服装、<span class="num">2970 吨</span>的火箭、一整个再生生保系统</div>

    <div class="dim min0">让这一切成立的信息，存在哪</div>
    <div class="cell left min0">在活着的个体身上，随人死去</div>
    <div class="cell right cult-focus min0">在图纸、手册、代码和几百万人的脑子里</div>

    <div class="dim min0">那份信息的量级</div>
    <div class="cell left min0">一个人一生能学会的全部</div>
    <div class="cell right cult-focus min0">阿波罗计划：<span class="num">40 万人，10 年</span></div>
  </section>
  <p class="closing"><strong>这 366 万年里，身体走了很短的一段。</strong>剩下的全部路程，是身体之外的东西走的。</p>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:6, title:'回到两个脚印', sub:'同一张对照，第二次看。', foot:'最后三个问题，没有标准答案。' })
</script>
</body></html>
