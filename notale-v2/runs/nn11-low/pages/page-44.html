<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:12px}
.closing-claim{flex:0 0 auto;max-width:1420px}
.closing-claim .gene{color:var(--gene-2)}
.closing-claim .cult{color:var(--cult-2)}
.question-trunk{position:relative;flex:1 1 auto;min-height:0;padding-top:18px}
.question-trunk::before{content:"";position:absolute;left:18px;right:18px;top:5px;height:1px;background:var(--line)}
.question-trunk::after{content:"";position:absolute;left:18px;top:5px;width:1px;height:18px;background:var(--line)}
.questions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;height:100%}
.qbranch{position:relative;padding-top:9px;display:flex;min-height:0}
.qbranch::before{content:"";position:absolute;left:18px;top:-13px;width:1px;height:22px;background:var(--line)}
.qcard{width:100%;padding:15px 16px 14px;background:rgba(25,21,18,.72);border:1px solid var(--line-soft);border-radius:var(--r);display:flex;flex-direction:column;gap:9px}
.qhead{font-size:var(--fs-body);line-height:1.45;font-weight:700;color:var(--text);min-height:76px}
.qno{display:block;color:var(--acc);font-family:var(--font-num);font-size:var(--fs-label);letter-spacing:.06em;margin-bottom:3px}
.quiz{display:flex;flex-direction:column;gap:7px}
.quiz .opt{font-size:var(--fs-body);line-height:1.4;padding:10px 12px;min-height:46px}
.quiz .opt[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--panel));box-shadow:inset 3px 0 0 var(--acc)}
.quiz .fb{margin-top:2px;padding:10px 11px;border-left:2px solid var(--acc);background:rgba(255,255,255,.025);border-radius:0 6px 6px 0;min-height:82px}
.quiz .fb[hidden]{display:none}
.bottomline{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;color:var(--text-2);font-size:var(--fs-lead);padding:0 2px 2px}
.bottomline .hint{font-size:var(--fs-label)}
</style>
</head>
<body data-page="44" data-total="44">
<div id="stage"><main id="main">
  <div class="claim sm closing-claim">这堂课只讲了一件事：<span class="cult">信息换了一条通道</span>，<span class="gene">身体没跟上</span>。<br>剩下的三个问题，答案要靠你们这一代给。</div>

  <section class="question-trunk min0" aria-label="三个开放问题">
    <div class="questions min0">
      <article class="qbranch min0">
        <div class="qcard min0">
          <div class="qhead"><span class="qno">Q1</span>第一个在火星上出生的孩子，长大后和地球人最大的差别会来自哪里？</div>
          <div class="quiz" data-q="1">
            <button class="opt" type="button" data-fb="突变是随机的，几乎全是有害的，而且一代人根本不够。这条太慢。">A　基因（在辐射下发生的突变）</button>
            <button class="opt" type="button" data-fb="这一条我们整堂课都没讲——因为没人知道答案。人类从未在 1 g 之外发育过一个胚胎。这是第三条通道：不是基因，也不是文化，是发育可塑性。">B　发育（在 0.38 g 下长骨头、长心脏、长内耳）</button>
            <button class="opt" type="button" data-fb="很可能是最大的那一项，但它和地球上任何一个封闭小社会没有本质区别。真正新的是 B。">C　文化（在一个封闭的小社会里长大）</button>
            <div class="fb" aria-live="polite" hidden></div>
          </div>
        </div>
      </article>

      <article class="qbranch min0">
        <div class="qcard min0">
          <div class="qhead"><span class="qno">Q2</span>如果体外通道断了——所有存储被抹掉，会用它的人也不在了——人类要多久回到今天？</div>
          <div class="quiz" data-q="2">
            <button class="opt" type="button" data-fb="回想第 15 页。一个人学不会。“原理还在”和“有足够多的人同时掌握它”是两回事。">A　一两代人，因为原理还在人脑子里</button>
            <button class="opt" type="button" data-fb="有一个新的障碍：容易开采的浅层煤和石油已经被我们用掉了。第二次工业革命没有第一次的燃料。">B　几千年，相当于重走一遍农业到工业</button>
            <button class="opt" type="button" data-fb="可能太悲观。但塔斯马尼亚的例子说明，退化是真的会发生的，而且不需要任何灾难，只需要人变少。">C　永远回不来</button>
            <div class="fb" aria-live="polite" hidden></div>
          </div>
        </div>
      </article>

      <article class="qbranch min0">
        <div class="qcard min0">
          <div class="qhead"><span class="qno">Q3</span>两到三个数量级的错配，该让身体追上去，还是让环境慢下来？</div>
          <div class="quiz" data-q="3">
            <button class="opt" type="button" data-fb="那等于把身体也变成体外通道的一部分——变化速度会和技术一样快。你确定那是“追上”，还是“放弃了那把慢的尺子”？">A　让身体追上去（基因编辑、器械增强）</button>
            <button class="opt" type="button" data-fb="人类历史上没有任何一次成功地让技术慢下来过。而且慢下来的代价通常由最穷的人先付。">B　让环境慢下来</button>
            <button class="opt" type="button" data-fb="这大概是现实的答案，但“学会”本身也是一项要靠体外通道传下去的技能——它得被教。比如，被这样一堂课教。">C　两个都不选，学会带着错配生活</button>
            <div class="fb" aria-live="polite" hidden></div>
          </div>
        </div>
      </article>
    </div>
  </section>

  <div class="bottomline"><div>谢谢。</div><div class="hint">每题选一个，看看我的回应</div></div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:6, title:'留给你们的问题', sub:'三个问题，都没有标准答案。选一个，然后看看我的回应。', foot:null });
document.querySelectorAll('.quiz').forEach(function(quiz){
  var buttons=quiz.querySelectorAll('.opt');
  var fb=quiz.querySelector('.fb');
  buttons.forEach(function(button){
    button.setAttribute('aria-pressed','false');
    button.addEventListener('click',function(){
      buttons.forEach(function(other){other.setAttribute('aria-pressed','false');});
      button.setAttribute('aria-pressed','true');
      fb.textContent=button.dataset.fb;
      fb.hidden=false;
    });
  });
});
</script>
</body></html>
