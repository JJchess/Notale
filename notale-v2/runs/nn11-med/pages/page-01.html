<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
:root{
  --fs-cover:96px;
  --fs-cover-sub:26px;
  --fs-cover-claim:24px;
}
#main{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  height:100%;
  min-height:0;
  overflow:hidden;
}
.cover-art,
.cover-shade{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
.cover-art{
  display:block;
  object-fit:cover;
  object-position:center center;
}
.cover-shade{
  background:linear-gradient(100deg,rgba(8,7,6,.94) 0%,rgba(8,7,6,.80) 42%,rgba(8,7,6,.15) 78%);
}
.cover-copy{
  position:relative;
  z-index:1;
  width:880px;
  max-width:55%;
  margin-right:auto;
  padding:60px 0 0 92px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:100%;
  box-sizing:border-box;
  text-shadow:0 2px 18px rgba(0,0,0,.34);
}
.eyebrow{
  margin:0 0 12px;
  color:var(--text-3);
  font-size:var(--fs-label);
  line-height:1.4;
  font-weight:600;
  letter-spacing:.18em;
}
.cover-title{
  margin:0;
  color:var(--text);
  font-size:var(--fs-cover);
  line-height:1.05;
  font-weight:700;
  letter-spacing:-.045em;
  white-space:nowrap;
}
.cover-title .gene{color:var(--gene);display:inline-block;}
.cover-title .cult{color:var(--cult);display:inline-block;}
.cover-sub{
  margin:10px 0 20px;
  color:var(--text-3);
  font-size:var(--fs-cover-sub);
  line-height:1.35;
  font-weight:400;
  letter-spacing:.06em;
}
.cover-axis{
  width:420px;
  max-width:100%;
  margin-bottom:24px;
  transform-origin:left center;
  opacity:.9;
}
.cover-claim{
  max-width:640px;
  margin:0;
  border-left-color:var(--gene);
  padding-left:18px;
  color:var(--text);
  font-size:var(--fs-cover-claim);
  line-height:1.45;
  font-weight:500;
}
.cover-claim strong{font-weight:700;}
.cover-supports{
  width:700px;
  max-width:calc(100% - 8px);
  margin:18px 0 0 13px;
  gap:7px;
}
.cover-supports .support{
  padding-left:23px;
  color:var(--text-2);
  font-size:var(--fs-sec);
  line-height:1.45;
}
.cover-supports .support::before{
  background:linear-gradient(90deg,var(--gene),var(--cult));
}
.cover-supports .trunk{
  background:linear-gradient(180deg,var(--gene-dim),var(--line) 48%,var(--cult-dim));
}
.motion-ready .word-in,
.motion-ready .claim-in{opacity:0;}
.motion-ready .word-in{transform:translateY(40px);}
.motion-ready .cover-axis{transform:scaleX(0);}
@media (prefers-reduced-motion:reduce){
  .motion-ready .word-in,
  .motion-ready .claim-in{opacity:1;transform:none;}
  .motion-ready .cover-axis{transform:scaleX(1);}
}
</style>
</head>
<body data-page="01" data-total="44">
<div id="stage">
  <main id="main">
    <img class="cover-art" src="assets/img/illus-savanna.png" alt="非洲草原上直立行走的早期人族剪影" title="生成插画（非真实照片）：非洲草原上直立行走的早期人族剪影">
    <div class="cover-shade" aria-hidden="true"></div>
    <section class="cover-copy min0" aria-labelledby="cover-title">
      <p class="eyebrow">通识课 · 90 分钟</p>
      <h1 class="cover-title" id="cover-title">从<span class="gene word-in">猿人</span>到<span class="cult word-in">太空人</span></h1>
      <p class="cover-sub" lang="en">From Apeman to Spaceman</p>
      <div class="axisline cover-axis" aria-hidden="true"></div>
      <p class="claim cover-claim claim-in"><strong>演化没有给我们任何一项太空适应。</strong>366 万年里这具身体几乎没变，变的是信息传下去的方式。</p>
      <div class="supports cover-supports" aria-label="课程支撑信息">
        <span class="trunk" aria-hidden="true"></span>
        <div class="support">六幕 · 44 页</div>
        <div class="support">幕 I 讲身体，幕 II–IV 讲身体之外的东西，幕 V–VI 讲两者对不上</div>
        <div class="support">方向键翻页</div>
      </div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/anime.min.js"></script>
<script>
Chrome.mount({ act:0, title:null, bleed:true, foot:null });

(function () {
  var stage = document.getElementById('stage');
  if (Deck.reduced()) return;
  stage.classList.add('motion-ready');
  anime.timeline({ easing:'easeOutCubic' })
    .add({ targets:'.cover-title .gene', translateY:[40,0], opacity:[0,1], duration:600 }, 0)
    .add({ targets:'.cover-title .cult', translateY:[40,0], opacity:[0,1], duration:600 }, 180)
    .add({ targets:'.cover-axis', scaleX:[0,1], duration:600, easing:'easeOutQuart' }, 400)
    .add({ targets:'.claim-in', opacity:[0,1], duration:500, easing:'linear' }, 560);
}());
</script>
</body>
</html>
