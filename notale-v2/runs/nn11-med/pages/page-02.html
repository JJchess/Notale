<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:12px;}
.footprints{
  grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);
  column-gap:18px;
  row-gap:0;
  align-content:start;
}
.photo-spacer{grid-column:1;}
.photo{
  height:242px;
  min-width:0;
  overflow:visible;
}
.photo img{
  width:100%;
  height:214px;
  object-fit:cover;
  object-position:center;
  border-radius:var(--r);
  filter:saturate(.82) contrast(1.04);
}
.photo figcaption{
  margin-top:6px;
  font-size:var(--fs-label);
  color:var(--text-2);
}
.photo.laetoli{grid-column:2;}
.photo.moon{grid-column:3;}
.table-head{
  padding-top:8px;
  padding-bottom:6px;
  border-bottom:1px solid var(--line);
}
.table-head.dim{color:var(--text-3);}
.table-head.object{font-size:var(--fs-label);font-weight:700;letter-spacing:.06em;color:var(--text-2);}
.rowline{margin:0;}
.rowcell{
  padding:5px 10px 5px 0;
  font-size:var(--fs-sec);
  line-height:1.4;
  min-width:0;
}
.rowcell.dim{
  padding-right:2px;
  color:var(--text-3);
  font-size:var(--fs-label);
}
.focus{
  background:var(--panel);
  padding-top:7px;
  padding-bottom:7px;
}
.focus.dim{padding-right:10px;border-radius:var(--r) 0 0 var(--r);}
.focus.last{border-radius:0 var(--r) var(--r) 0;}
.body-same{color:var(--gene-2);font-weight:700;}
.body-desc{color:var(--gene-2);}
.culture-gap{color:var(--cult-2);font-weight:700;}
.conclusion{
  margin:0;
  padding:1px 0 0 168px;
  font-size:var(--fs-lead);
  line-height:1.45;
  color:var(--text-2);
}
.conclusion strong{color:var(--text);}
</style>
</head>
<body data-page="02" data-total="44">
<div id="stage"><main id="main">
  <section class="cmp footprints min0" aria-label="Laetoli 足迹与月面靴印逐维度比较">
    <div class="photo-spacer" aria-hidden="true"></div>
    <figure class="photo laetoli min0">
      <img src="assets/img/laetoli-trackway.jpg" alt="Laetoli 足迹复制品中一串压入地面的脚印" title="Laetoli 足迹复制品（日本国立科学博物馆） · Momotarou2012 · CC BY-SA 3.0">
      <figcaption>坦桑尼亚 Laetoli · 约 366 万年前</figcaption>
    </figure>
    <figure class="photo moon min0">
      <img src="assets/img/moon-bootprint.jpg" alt="阿波罗十一号宇航员留在月面尘土中的靴印" title="Apollo 11 靴印，1969 年 7 月 · NASA/JSC · 公有领域">
      <figcaption>月球静海 · 1969 年 7 月 20 日</figcaption>
    </figure>

    <div class="table-head dim">比较维度</div>
    <div class="table-head object">LAETOLI 足迹</div>
    <div class="table-head object">月面靴印</div>

    <div class="rowcell dim">时间</div>
    <div class="rowcell num">约 366 万年前</div>
    <div class="rowcell num">1969 年 7 月 20 日</div>
    <div class="rowline"></div>

    <div class="rowcell dim">地点</div>
    <div class="rowcell">坦桑尼亚，Laetoli</div>
    <div class="rowcell">月球，静海</div>
    <div class="rowline"></div>

    <div class="rowcell dim">留下者</div>
    <div class="rowcell">南方古猿阿法种（很可能）</div>
    <div class="rowcell">Neil Armstrong 与 Buzz Aldrin</div>
    <div class="rowline"></div>

    <div class="rowcell dim">为什么留得住</div>
    <div class="rowcell">火山灰落下，一场雨，然后再一层灰盖住</div>
    <div class="rowcell">没有风，没有水，没有生物</div>
    <div class="rowline"></div>

    <div class="rowcell dim focus">这只脚</div>
    <div class="rowcell focus body-desc">有足弓，拇趾不外张，重心从脚跟推到前掌</div>
    <div class="rowcell focus last body-same">同上</div>
    <div class="rowline"></div>

    <div class="rowcell dim focus">脚外面</div>
    <div class="rowcell focus">什么都没有</div>
    <div class="rowcell focus last culture-gap">21 层的月面靴，一整套生命保障系统</div>
  </section>

  <p class="conclusion"><strong>中间这 366 万年，身体几乎没动。</strong>动的是脚外面那层东西。</p>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:0, title:'两个脚印', sub:'相隔 366 万年，同一个动作：一只脚压进松软的地面。', foot:'这两个脚印的脚，解剖学上几乎是同一只。差的全在脚外面。' });
</script>
</body></html>
