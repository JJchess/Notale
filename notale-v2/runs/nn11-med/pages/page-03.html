<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.route{
  position:relative;
  flex:0 1 auto;
  padding-top:112px;
}
.route::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:80px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--line) 8%,var(--line) 92%,transparent);
}
.flow.route-flow{
  position:relative;
  align-items:stretch;
}
.route-flow .step{
  position:relative;
  min-height:360px;
  padding:28px 16px 22px;
  display:flex;
  flex-direction:column;
  border-top:3px solid var(--line);
  border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
}
.route-flow .step:first-child{border-radius:var(--r) 0 0 var(--r);}
.route-flow .step:last-child{border-radius:0 var(--r) var(--r) 0;}
.route-flow .step.gene{border-top-color:var(--gene);background:linear-gradient(180deg,#2a1d12,var(--panel));}
.route-flow .step.cult{border-top-color:var(--cult);background:linear-gradient(180deg,#152529,var(--panel));}
.route-flow .step.neutral{border-top-color:var(--text-3);}
.act-id{
  font-size:var(--fs-label);
  line-height:1;
  letter-spacing:.09em;
  color:var(--text-3);
  font-weight:700;
  margin-bottom:15px;
}
.step.gene .act-id{color:var(--gene);}
.step.cult .act-id{color:var(--cult);}
.act-name{
  min-height:62px;
  margin-top:32px;
  font-size:var(--fs-h2);
  line-height:1.35;
  font-weight:700;
  color:var(--text);
  display:flex;
  align-items:flex-start;
}
.act-copy{
  margin:auto 0 0;
  font-size:var(--fs-sec);
  line-height:1.55;
  color:var(--text-2);
}
.route-flow .arw{
  position:relative;
  flex-basis:42px;
  color:var(--text-3);
  z-index:2;
}
.route-flow .arw::before{
  display:block;
  color:var(--cult);
  font-size:24px;
  transform:translateY(-1px);
}
.route-flow .arw:nth-of-type(2)::before,
.route-flow .arw:nth-of-type(4)::before{color:var(--gene);}
.bridge-q{
  position:absolute;
  left:50%;
  bottom:calc(100% + 29px);
  width:190px;
  transform:translateX(-50%);
  font-size:var(--fs-label);
  line-height:1.45;
  color:var(--text-3);
  text-align:center;
  font-weight:500;
}
.bridge-q::after{
  content:"";
  position:absolute;
  left:50%;
  top:calc(100% + 8px);
  width:1px;
  height:16px;
  background:var(--line);
}
.axis-wrap{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:14px;
  margin-top:30px;
}
.axis-wrap .axisline{height:3px;opacity:.8;}
.axis-cap{
  font-size:var(--fs-label);
  line-height:1;
  letter-spacing:.06em;
  font-weight:700;
}
.axis-cap.gene{color:var(--gene);}
.axis-cap.cult{color:var(--cult);}
</style>
</head>
<body data-page="03" data-total="44">
<div id="stage">
  <main id="main">
    <section class="route min0" aria-label="全课六幕的论证链">
      <div class="flow route-flow min0">
        <article class="step neutral min0">
          <div class="act-id">序</div>
          <div class="act-name">两个脚印</div>
          <p class="act-copy"><span class="num">366</span> 万年，同一个动作；身体没变。</p>
        </article>

        <div class="arw" aria-hidden="true"><span class="bridge-q">那具身体是怎么来的？</span></div>

        <article class="step gene min0">
          <div class="act-id">I</div>
          <div class="act-name">一具草原上的身体</div>
          <p class="act-copy">直立、大脑、育儿，都在草原定型。</p>
        </article>

        <div class="arw" aria-hidden="true"><span class="bridge-q">一个人一辈子攒不出这些本事，它们怎么传下去？</span></div>

        <article class="step cult min0">
          <div class="act-id">II</div>
          <div class="act-name">第二条遗传通道</div>
          <p class="act-copy">信息第一次被存到身体之外。</p>
        </article>

        <div class="arw" aria-hidden="true"><span class="bridge-q">为什么越到后面越快？</span></div>

        <article class="step cult min0">
          <div class="act-id">III</div>
          <div class="act-name">加速</div>
          <p class="act-copy">人口、能量、信息一起进入指数。</p>
        </article>

        <div class="arw" aria-hidden="true"><span class="bridge-q">快到什么程度才够离开地球？</span></div>

        <article class="step cult min0">
          <div class="act-id">IV</div>
          <div class="act-name">离开地面</div>
          <p class="act-copy"><span class="num">7.7 km/s</span> 的账，由体外通道付。</p>
        </article>

        <div class="arw" aria-hidden="true"><span class="bridge-q">上去的是谁？</span></div>

        <article class="step gene min0">
          <div class="act-id">V</div>
          <div class="act-name">草原的身体在轨道上</div>
          <p class="act-copy">上去的，仍是那具草原身体。</p>
        </article>

        <div class="arw" aria-hidden="true"><span class="bridge-q">那么这中间差了多少？</span></div>

        <article class="step neutral min0">
          <div class="act-id">VI</div>
          <div class="act-name">收束</div>
          <p class="act-copy">两条通道差两到三个数量级。</p>
        </article>
      </div>

      <div class="axis-wrap" aria-hidden="true">
        <span class="axis-cap gene">身体</span>
        <div class="axisline"></div>
        <span class="axis-cap cult">体外通道</span>
      </div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:0, title:'这堂课怎么走', sub:'六幕，一条论证链。每一幕负责证明上一幕留下的那个问题。', foot:'先回到起点：700 万年到底有多长。' });
</script>
</body>
</html>
