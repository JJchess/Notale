<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:12px;}
.readout{flex:0 0 auto;display:grid;grid-template-columns:1.08fr .72fr 1.65fr;align-items:center;gap:0;padding:14px 18px;background:linear-gradient(90deg,rgba(224,145,58,.09),rgba(25,21,18,.92) 42%,rgba(25,21,18,.92));}
.readout>div{min-width:0;padding:0 18px;border-left:1px solid var(--line-soft);}
.readout>div:first-child{border-left:0;padding-left:0;}
.readout .k{display:block;font-size:var(--fs-label);color:var(--text-3);letter-spacing:.06em;margin-bottom:3px;}
.readout .v{font-family:var(--font-num);font-size:var(--fs-h2);font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap;}
.readout .world{font-size:var(--fs-lead);line-height:1.4;color:var(--gene-2);}
.ruler{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:10px 16px 8px;background:rgba(25,21,18,.72);border:1px solid var(--line-soft);border-radius:var(--r);}
.ruler-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:0 0 auto;}
.ruler-head .scale{font-size:var(--fs-sec);color:var(--text-2);}
.ruler-head strong{font-family:var(--font-num);color:var(--gene-2);}
#timeline{display:block;width:100%;height:100%;min-height:230px;cursor:ew-resize;touch-action:none;outline:none;}
#timeline:focus-visible{outline:2px solid var(--focus);outline-offset:-3px;border-radius:6px;}
.axis{stroke:var(--text-2);stroke-width:2;}
.axis-arrow{fill:var(--text-2);}
.major{stroke:var(--line);stroke-width:1;}
.ticktext{fill:var(--text-3);font-family:var(--font-num);font-size:var(--fs-tick);}
.eventmark{stroke:var(--gene);stroke-width:2;}
.eventdot{fill:var(--gene-2);}
.eventlabel{fill:var(--text-2);font-size:var(--fs-sec);}
.eventage{fill:var(--gene-2);font-family:var(--font-num);font-size:var(--fs-tick);}
.cluster{fill:rgba(95,200,216,.09);stroke:var(--cult-dim);stroke-width:1;}
.clusterlabel{fill:var(--cult-2);font-size:var(--fs-label);}
.cursorline{stroke:var(--cult);stroke-width:2;}
.cursorcap{fill:var(--cult);stroke:var(--bg);stroke-width:3;}
.inset{flex:0 0 auto;display:grid;grid-template-columns:1fr 2.25fr;gap:18px;align-items:stretch;padding:12px 16px;}
.inset-copy{min-width:0;display:flex;flex-direction:column;justify-content:center;}
.inset-copy .ttl{margin-bottom:5px;color:var(--cult);}
.inset-copy .statement{font-size:var(--fs-lead);line-height:1.4;margin:0;color:var(--text);}
.inset-copy .statement b{font-family:var(--font-num);color:var(--cult-2);}
.inset-copy .small{margin:5px 0 0;}
.inset-viz{min-width:0;display:flex;align-items:center;}
#zoom{display:block;width:100%;height:112px;overflow:visible;}
.zoomaxis{stroke:var(--cult);stroke-width:2;}
.zoomtick{stroke:var(--cult-2);stroke-width:2;}
.zoomlead{stroke:var(--line);stroke-width:1.5;fill:none;}
.zoomlabel{fill:var(--text-2);font-size:var(--fs-label);}
.zoomage{fill:var(--cult-2);font-family:var(--font-num);font-size:var(--fs-tick);}
.hair{stroke:var(--warn);stroke-width:1.5;}
.hairlabel{fill:#f0968c;font-size:var(--fs-label);}
.hint{flex:0 0 auto;margin-left:2px;}
@media (prefers-reduced-motion:reduce){#timeline{cursor:default;}}
</style>
</head>
<body data-page="04" data-total="44">
<div id="stage"><main id="main">
  <section class="readout panel" aria-live="polite">
    <div><span class="k">距今</span><span class="v" id="ago">3.66 百万年前</span></div>
    <div><span class="k">7 米尺上的位置</span><span class="v"><span id="mm">3340.0</span> mm</span></div>
    <div><span class="k">当时的世界 · 最近事件</span><span class="world" id="world">Laetoli 的那串脚印</span></div>
  </section>

  <section class="ruler no-pan min0" aria-label="从七百万年前到今天的线性时间尺">
    <div class="ruler-head">
      <span class="scale">线性时间尺 · 左边更早，向右走向今天</span>
      <span class="scale"><strong>7 m</strong> · 1 mm = 1000 年</span>
    </div>
    <svg id="timeline" viewBox="0 0 1420 270" role="slider" tabindex="0" aria-label="时间游标" aria-valuemin="0" aria-valuemax="7000000" aria-valuenow="3660000"></svg>
  </section>

  <section class="inset panel hi min0" aria-label="最后十毫米的局部放大">
    <div class="inset-copy">
      <p class="ttl">右端局部放大 · 最后 10 mm</p>
      <p class="statement">文字、飞机、登月，全挤在最后 <b>5.2 mm</b>。</p>
      <p class="small">飞机到登月只隔 0.066 mm，比一根头发还窄。</p>
    </div>
    <div class="inset-viz min0"><svg id="zoom" viewBox="0 0 900 112" aria-hidden="true"></svg></div>
  </section>
  <div class="hint">在尺子上拖动，看那个时刻发生了什么</div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:1, title:'700 万年有多长', sub:'把它换成一段看得见的长度：7 米的尺子，1 毫米 = 1000 年。', foot:'尺子的最后 5 毫米里挤着全部有文字的历史。先看这 7 米前面发生了什么。' });

(function(){
  var events = [
    {t:7000000, e:'人族与黑猩猩的谱系分开'},
    {t:4400000, e:'地猿：已有部分直立特征'},
    {t:3660000, e:'Laetoli 的那串脚印'},
    {t:3300000, e:'已知最早的石器（肯尼亚 Lomekwi 3）'},
    {t:2600000, e:'奥杜威石器'},
    {t:1900000, e:'直立人出现'},
    {t:1000000, e:'用火的确证（南非 Wonderwerk 洞）'},
    {t:300000, e:'智人最早化石（摩洛哥 Jebel Irhoud）'},
    {t:65000, e:'智人到达澳大利亚'},
    {t:12000, e:'农业开始'},
    {t:5200, e:'最早的文字（乌鲁克）'},
    {t:123, e:'第一次动力飞行'},
    {t:57, e:'阿波罗 11 号'}
  ];
  var svg = document.getElementById('timeline');
  var NS = 'http://www.w3.org/2000/svg';
  var x0=38, x1=1382, y=142, W=x1-x0;
  function el(name, attrs, text){
    var n=document.createElementNS(NS,name);
    Object.keys(attrs||{}).forEach(function(k){n.setAttribute(k,attrs[k]);});
    if(text!==undefined)n.textContent=text;
    svg.appendChild(n); return n;
  }
  function xFor(t){return x0+(7000000-t)/7000000*W;}
  el('line',{x1:x0,y1:y,x2:x1+1,y2:y,class:'axis'});
  el('path',{d:'M '+(x1+1)+' '+y+' l -11 -6 v 12 z',class:'axis-arrow'});
  for(var m=7;m>=0;m--){
    var xx=xFor(m*1000000);
    el('line',{x1:xx,y1:126,x2:xx,y2:158,class:'major'});
    var label=m===0?'现在':(m===7?'700万年前':m+'00万');
    el('text',{x:xx,y:177,'text-anchor':m===7?'start':(m===0?'end':'middle'),class:'ticktext'},label);
  }
  el('rect',{x:xFor(300000),y:112,width:x1-xFor(300000),height:61,rx:5,class:'cluster'});
  el('text',{x:xFor(300000)-8,y:103,'text-anchor':'end',class:'clusterlabel'},'最后 300 mm：事件开始挤在右端');

  var shown=[0,1,2,3,4,5,6];
  var shortNames=['谱系分开','地猿','Laetoli 脚印','最早石器','奥杜威石器','直立人','用火确证'];
  shown.forEach(function(idx){
    var d=events[idx], xx=xFor(d.t), top=idx%2===0;
    var y2=top?66:218;
    el('line',{x1:xx,y1:y-12,x2:xx,y2:top?88:190,class:'eventmark'});
    el('circle',{cx:xx,cy:y,r:4,class:'eventdot'});
    el('text',{x:xx,y:y2,'text-anchor':idx===0?'start':'middle',class:'eventlabel'},shortNames[idx]);
    el('text',{x:xx,y:y2+19,'text-anchor':idx===0?'start':'middle',class:'eventage'},Chrome.ago(d.t));
  });
  events.slice(7).forEach(function(d,i){
    var xx=xFor(d.t);
    el('line',{x1:xx,y1:y-(8+i%3*3),x2:xx,y2:y+(8+i%3*3),class:'eventmark'});
    el('circle',{cx:xx,cy:y,r:3,class:'eventdot'});
  });
  el('path',{d:'M '+xFor(300000)+' 236 H '+x1+' M '+xFor(300000)+' 230 v 12 M '+x1+' 230 v 12',class:'zoomlead'});
  el('text',{x:(xFor(300000)+x1)/2,y:260,'text-anchor':'middle',class:'clusterlabel'},'30 万年前 → 今天 · 300 mm');

  var cursor=el('g',{'aria-hidden':'true'});
  var line=document.createElementNS(NS,'line'); line.setAttribute('class','cursorline'); line.setAttribute('y1','36'); line.setAttribute('y2','205'); cursor.appendChild(line);
  var cap=document.createElementNS(NS,'circle'); cap.setAttribute('class','cursorcap');cap.setAttribute('cy',y);cap.setAttribute('r','7');cursor.appendChild(cap);
  var ago=document.getElementById('ago'), mm=document.getElementById('mm'), world=document.getElementById('world');
  var current=3660000;
  function setTime(t){
    current=Math.max(0,Math.min(7000000,t));
    var xx=xFor(current);
    line.setAttribute('x1',xx);line.setAttribute('x2',xx);cap.setAttribute('cx',xx);
    ago.textContent=current===0?'今天':Chrome.ago(current);
    mm.textContent=((7000000-current)/7000000*7000).toFixed(1);
    var nearest=events.reduce(function(a,b){return Math.abs(b.t-current)<Math.abs(a.t-current)?b:a;});
    world.textContent=nearest.e;
    svg.setAttribute('aria-valuenow',Math.round(current));
    svg.setAttribute('aria-valuetext',(current===0?'今天':Chrome.ago(current))+'，'+nearest.e);
  }
  function fromPointer(e){
    var p=Deck.pt(svg,e), vx=p.x/svg.offsetWidth*1420;
    setTime(7000000-(vx-x0)/W*7000000);
  }
  var dragging=false;
  svg.addEventListener('pointerdown',function(e){dragging=true;svg.setPointerCapture(e.pointerId);fromPointer(e);});
  svg.addEventListener('pointermove',function(e){if(dragging)fromPointer(e);});
  svg.addEventListener('pointerup',function(e){dragging=false;if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);});
  svg.addEventListener('pointercancel',function(){dragging=false;});
  svg.addEventListener('keydown',function(e){
    var step=e.shiftKey?100000:10000;
    if(e.key==='ArrowLeft'){setTime(current+step);e.preventDefault();}
    if(e.key==='ArrowRight'){setTime(current-step);e.preventDefault();}
    if(e.key==='Home'){setTime(7000000);e.preventDefault();}
    if(e.key==='End'){setTime(0);e.preventDefault();}
  });
  setTime(3660000);

  var z=document.getElementById('zoom');
  function ze(name,attrs,text){var n=document.createElementNS(NS,name);Object.keys(attrs||{}).forEach(function(k){n.setAttribute(k,attrs[k]);});if(text!==undefined)n.textContent=text;z.appendChild(n);return n;}
  var zx0=25,zx1=875,zy=60,zW=zx1-zx0;
  function zx(t){return zx0+(10000-t)/10000*zW;}
  ze('line',{x1:zx0,y1:zy,x2:zx1,y2:zy,class:'zoomaxis'});
  ze('path',{d:'M '+zx1+' '+zy+' l -10 -6 v 12 z',class:'axis-arrow'});
  [10000,5000,0].forEach(function(t){var xx=zx(t);ze('line',{x1:xx,y1:zy-7,x2:xx,y2:zy+8,class:'zoomtick'});ze('text',{x:xx,y:104,'text-anchor':t===10000?'start':(t===0?'end':'middle'),class:'ticktext'},t===0?'现在':(t/1000)+' mm前');});
  var zd=[events[10],events[11],events[12]];
  var labelX=[zx(5200),735,855], labelY=[18,18,40];
  zd.forEach(function(d,i){
    var xx=zx(d.t);
    ze('line',{x1:xx,y1:zy-12,x2:xx,y2:zy+12,class:'zoomtick'});
    ze('path',{d:'M '+xx+' '+(zy-12)+' L '+labelX[i]+' '+(labelY[i]+5),class:'zoomlead'});
    ze('text',{x:labelX[i],y:labelY[i],'text-anchor':i===0?'middle':'end',class:'zoomlabel'},d.e.replace('（乌鲁克）',''));
    ze('text',{x:labelX[i],y:labelY[i]+17,'text-anchor':i===0?'middle':'end',class:'zoomage'},d.t+' 年前');
  });
  var xf=zx(123),xm=zx(57);
  ze('line',{x1:xf,y1:82,x2:xm,y2:82,class:'hair'});
  ze('line',{x1:xf,y1:77,x2:xf,y2:87,class:'hair'});ze('line',{x1:xm,y1:77,x2:xm,y2:87,class:'hair'});
  ze('text',{x:(xf+xm)/2-5,y:102,'text-anchor':'end',class:'hairlabel'},'0.066 mm');
})();
</script>
</body></html>
