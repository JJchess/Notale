<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:10px}
.lineage-layout{display:grid;grid-template-columns:minmax(0,1fr) 314px;gap:18px;flex:1 1 auto;min-height:0}
.viz-shell{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
#lineage{display:block;width:100%;height:100%;min-height:0;overflow:visible}
.chart-axis text{fill:var(--text-3);font-family:var(--font-num);font-size:var(--fs-tick);font-variant-numeric:tabular-nums}
.chart-axis path,.chart-axis line{stroke:var(--line)}
.grid-line{stroke:var(--line-soft);stroke-width:1}
.group-zone{fill:rgba(255,255,255,.014);stroke:var(--line-soft);stroke-width:1}
.group-rule{stroke:var(--gene-dim);stroke-width:3}
.group-rule.pan{stroke:#58534e}
.genus-label{fill:var(--text-2);font-size:var(--fs-body);font-weight:650}
.genus-note{fill:var(--text-3);font-size:var(--fs-label)}
.species-label{fill:var(--text-2);font-size:var(--fs-label)}
.species-bar{cursor:pointer;transition:filter .14s,opacity .14s}
.species-hit{cursor:pointer;outline:none}
.species-hit:hover .species-bar,.species-hit:focus .species-bar{filter:brightness(1.28)}
.species-hit:focus-visible .species-focus{stroke:var(--focus);stroke-width:2;fill:none}
.species-hit.selected .species-label{fill:var(--text);font-weight:700}
.species-hit.selected .species-bar{filter:brightness(1.45)}
.count-area{fill:rgba(224,145,58,.12)}
.count-line{fill:none;stroke:var(--gene-2);stroke-width:2}
.count-baseline{stroke:var(--line);stroke-width:1}
.count-label{fill:var(--text-3);font-size:var(--fs-label)}
.count-num{fill:var(--gene-2);font-size:var(--fs-tick);font-family:var(--font-num)}
.peak-guide{stroke:var(--gene-2);stroke-width:1;stroke-dasharray:3 4;opacity:.72}
.peak-dot{fill:var(--gene-2)}
.detail{display:flex;flex-direction:column;min-height:0;padding:18px 20px;border-left:2px solid var(--gene-dim);background:linear-gradient(135deg,rgba(224,145,58,.075),rgba(25,21,18,.72) 48%);border-radius:0 var(--r) var(--r) 0}
.detail-kicker{margin:0 0 15px;color:var(--gene);font-size:var(--fs-label);font-weight:700;letter-spacing:.08em}
.detail-cn{margin:0;color:var(--text);font-size:var(--fs-h2);line-height:1.28}
.detail-latin{margin:5px 0 18px;color:var(--gene-2);font-size:var(--fs-sec);font-style:italic;line-height:1.35}
.detail dl{display:grid;grid-template-columns:74px 1fr;gap:8px 10px;margin:0;padding:14px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);font-size:var(--fs-sec)}
.detail dt{color:var(--text-3)}
.detail dd{margin:0;color:var(--text);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.detail-feature{margin:18px 0 0;color:var(--text-2);font-size:var(--fs-sec);line-height:1.55}
.detail .hint{margin-top:auto;padding-top:16px}
.takeaway{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:7px 14px 8px;border-left:3px solid var(--gene);background:rgba(224,145,58,.065);font-size:var(--fs-sec);line-height:1.4;color:var(--text-2)}
.takeaway .mark{flex:0 0 auto;color:var(--gene-2);font-family:var(--font-num);font-size:var(--fs-h2)}
.takeaway strong{color:var(--text)}
</style>
</head>
<body data-page="05" data-total="44">
<div id="stage"><main id="main">
  <section class="lineage-layout min0" aria-label="人族物种按属分组的存续时间">
    <div class="viz-shell min0">
      <svg id="lineage" role="img" aria-labelledby="chart-title chart-desc">
        <title id="chart-title">700万年来人族各属与种的共存时间</title>
        <desc id="chart-desc">物种按属分组排列，横条显示存续区间；下方曲线显示同一时期同时存在的人族物种数。</desc>
      </svg>
    </div>
    <aside class="detail min0" aria-live="polite">
      <p class="detail-kicker">当前点选</p>
      <h2 class="detail-cn" id="detail-cn"></h2>
      <p class="detail-latin" id="detail-latin"></p>
      <dl>
        <dt>存续区间</dt><dd id="detail-range"></dd>
        <dt>脑容量</dt><dd id="detail-brain"></dd>
      </dl>
      <p class="detail-feature" id="detail-feature"></p>
      <div class="hint">点任意一条，看它是谁</div>
    </aside>
  </section>
  <div class="takeaway"><span class="mark">≥5</span><span><strong>190 万年前，地球上至少有五种人族同时活着。</strong>今天只剩一种——这才是不正常的那一年。</span></div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
Chrome.mount({ act:1, title:'是一丛灌木，不是一条直线', sub:'教科书插图上那排越站越直的猿人，把真实情况画反了。', foot:'既然不是一条直线，那"我们从黑猩猩变来的"这句话错在哪？' });

const species = [
  {group:'early',genus:'Sahelanthropus',key:'tchadensis',name:'tchadensis 乍得沙赫人',cn:'乍得沙赫人',start:7.2,end:6.8,brain:'~360 cc',feature:'已知最早的人族候选之一；是否直立行走仍有争议。'},
  {group:'early',genus:'Ardipithecus',key:'ramidus',name:'ramidus 始祖地猿',cn:'始祖地猿',start:4.5,end:4.3,brain:'~350 cc',feature:'生活在林地与疏林镶嵌环境，身体仍保留攀爬特征。'},
  {group:'australo',genus:'Australopithecus',key:'anamensis',name:'anamensis 湖畔种',cn:'湖畔种',start:4.2,end:3.8,brain:'~370 cc',feature:'较早的南方古猿，腿骨与胫骨留下直立行走线索。'},
  {group:'australo',genus:'Australopithecus',key:'afarensis',name:'afarensis 阿法种',cn:'阿法种',start:3.9,end:2.9,brain:'~450 cc',feature:'Laetoli 脚印与“露西”都属于它生活的时代。'},
  {group:'australo',genus:'Australopithecus',key:'africanus',name:'africanus 非洲种',cn:'非洲种',start:3.3,end:2.1,brain:'~460 cc',feature:'发现于南部非洲，面部与牙齿比阿法种更轻巧。'},
  {group:'australo',genus:'Australopithecus',key:'sediba',name:'sediba',cn:'塞迪巴种',start:2.0,end:1.9,brain:'~420 cc',feature:'骨骼把南方古猿式与人属式特征混在同一身体里。'},
  {group:'paranth',genus:'Paranthropus',key:'boisei',name:'boisei 鲍氏傍人',cn:'鲍氏傍人',start:2.3,end:1.2,brain:'~510 cc',feature:'宽脸、巨大的臼齿与强壮咀嚼肌是它的醒目标志。'},
  {group:'paranth',genus:'Paranthropus',key:'robustus',name:'robustus 粗壮傍人',cn:'粗壮傍人',start:2.0,end:1.2,brain:'~530 cc',feature:'南部非洲的强壮型旁支，拥有适合重负荷咀嚼的颌骨。'},
  {group:'homo',genus:'Homo',key:'habilis',name:'habilis 能人',cn:'能人',start:2.4,end:1.65,brain:'~610 cc',feature:'常与早期奥杜威石器一同被讨论，但归类仍有争议。'},
  {group:'homo',genus:'Homo',key:'erectus',name:'erectus 直立人',cn:'直立人',start:1.9,end:0.11,brain:'~950 cc',feature:'存续近两百万年，并成为较早走出非洲的人属成员。'},
  {group:'homo',genus:'Homo',key:'heidelbergensis',name:'heidelbergensis 海德堡人',cn:'海德堡人',start:0.7,end:0.2,brain:'~1200 cc',feature:'这是一个边界有争议的分类名，常用于多地中更新世化石。'},
  {group:'homo',genus:'Homo',key:'neanderthalensis',name:'neanderthalensis 尼安德特人',cn:'尼安德特人',start:0.43,end:0.04,brain:'~1450 cc',feature:'曾广布欧亚西部，与智人在时间和地域上重叠。'},
  {group:'homo',genus:'Homo',key:'naledi',name:'naledi',cn:'纳莱迪人',start:0.335,end:0.236,brain:'~510 cc',feature:'在很晚的年代仍保留一组看起来更古老的身体特征。'},
  {group:'homo',genus:'Homo',key:'floresiensis',name:'floresiensis 弗洛勒斯人',cn:'弗洛勒斯人',start:0.10,end:0.05,brain:'~420 cc',feature:'在弗洛勒斯岛演化出矮小身体，直到很晚才消失。'},
  {group:'homo',genus:'Homo',key:'sapiens',name:'sapiens 智人',cn:'智人',start:0.31,end:0,brain:'~1350 cc',feature:'约31万年前出现；今天是唯一仍存活的人族物种。'},
  {group:'pan',genus:'Pan',key:'troglodytes',name:'troglodytes 黑猩猩',cn:'黑猩猩',start:1.0,end:0,brain:'~400 cc',feature:'作为参照列在这里；它属于黑猩猩属，不属于人族物种计数。'}
];

const groups = [
  {id:'early',label:['Sahelanthropus /','Ardipithecus（早期）'],note:'',pan:false},
  {id:'australo',label:['Australopithecus'],note:'南方古猿属',pan:false},
  {id:'paranth',label:['Paranthropus'],note:'傍人属',pan:false},
  {id:'homo',label:['Homo'],note:'人属',pan:false},
  {id:'pan',label:['Pan 黑猩猩（参照）'],note:'',pan:true}
];

const svg = d3.select('#lineage');
const W = 1140, H = 568;
svg.attr('viewBox',`0 0 ${W} ${H}`).attr('preserveAspectRatio','xMidYMid meet');
const plotL=220, plotR=900, axisY=29, rowTop=51, rowH=24, groupGap=9;
const x=d3.scaleLinear().domain([7.3,0]).range([plotL,plotR]);
let cursor=rowTop;
groups.forEach(g=>{
  g.items=species.filter(d=>d.group===g.id);
  g.y0=cursor-5;
  g.items.forEach(d=>{d.y=cursor;cursor+=rowH;});
  g.y1=cursor-3;
  cursor+=groupGap;
});
const barsBottom=cursor-groupGap;

svg.append('g').attr('class','chart-axis').attr('transform',`translate(0,${axisY})`)
  .call(d3.axisTop(x).tickValues([7,6,5,4,3,2,1,0]).tickFormat(d=>d));
svg.append('text').attr('x',25).attr('y',14).attr('class','count-label').text('距今（百万年）');
svg.append('g').selectAll('line').data([7,6,5,4,3,2,1,0]).join('line')
  .attr('class','grid-line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',axisY).attr('y2',barsBottom);

const zones=svg.append('g');
groups.forEach(g=>{
  zones.append('rect').attr('class','group-zone').attr('x',4).attr('y',g.y0).attr('width',W-8).attr('height',g.y1-g.y0).attr('rx',7);
  zones.append('line').attr('class','group-rule'+(g.pan?' pan':'')).attr('x1',12).attr('x2',12).attr('y1',g.y0+5).attr('y2',g.y1-5);
  const label=zones.append('text').attr('class','genus-label').attr('x',25).attr('y',g.y0+23);
  g.label.forEach((line,i)=>label.append('tspan').attr('x',25).attr('dy',i?20:0).text(line));
  if(g.note) zones.append('text').attr('class','genus-note').attr('x',25).attr('y',g.y1-8).text(g.note);
});

function barColor(d){return d.group==='homo'?'var(--gene-2)':d.group==='pan'?'#77716b':'var(--gene-dim)';}
const rows=svg.append('g').selectAll('g.species-hit').data(species,d=>d.key).join('g')
  .attr('class','species-hit').attr('role','button').attr('tabindex',0)
  .attr('aria-label',d=>`${d.cn}，存续于距今${d.start}至${d.end}百万年`)
  .on('click',(event,d)=>selectSpecies(d))
  .on('keydown',(event,d)=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectSpecies(d);}});
rows.append('rect').attr('class','species-focus').attr('x',d=>x(d.start)-3).attr('y',d=>d.y-8).attr('width',d=>Math.max(7,x(d.end)-x(d.start))+6).attr('height',16).attr('rx',4);
rows.append('rect').attr('class','species-bar').attr('x',d=>x(d.start)).attr('y',d=>d.y-5).attr('width',d=>Math.max(4,x(d.end)-x(d.start))).attr('height',10).attr('rx',5).attr('fill',barColor);
rows.append('circle').attr('cx',d=>x(d.start)).attr('cy',d=>d.y).attr('r',3).attr('fill',barColor).attr('pointer-events','none');
rows.append('text').attr('class','species-label').attr('x',d=>x(d.end)+8).attr('y',d=>d.y+5).text(d=>d.name);

const countTop=barsBottom+25, countBottom=H-18;
const times=d3.range(7.3,-0.001,-0.05).map(t=>({t,count:species.filter(d=>d.group!=='pan'&&t<=d.start&&t>=d.end).length}));
const yCount=d3.scaleLinear().domain([0,d3.max(times,d=>d.count)]).range([countBottom,countTop]);
svg.append('line').attr('class','count-baseline').attr('x1',plotL).attr('x2',plotR).attr('y1',countBottom).attr('y2',countBottom);
svg.append('path').datum(times).attr('class','count-area').attr('d',d3.area().x(d=>x(d.t)).y0(countBottom).y1(d=>yCount(d.count)).curve(d3.curveStepAfter));
svg.append('path').datum(times).attr('class','count-line').attr('d',d3.line().x(d=>x(d.t)).y(d=>yCount(d.count)).curve(d3.curveStepAfter));
svg.append('text').attr('class','count-label').attr('x',25).attr('y',countTop+5).text('同时存在的人族物种数');
[0,2,4].forEach(n=>svg.append('text').attr('class','count-num').attr('x',plotL-12).attr('y',yCount(n)+4).attr('text-anchor','end').text(n));
const peakT=1.9, peakCount=species.filter(d=>d.group!=='pan'&&peakT<=d.start&&peakT>=d.end).length;
svg.append('line').attr('class','peak-guide').attr('x1',x(peakT)).attr('x2',x(peakT)).attr('y1',yCount(peakCount)).attr('y2',countBottom);
svg.append('circle').attr('class','peak-dot').attr('cx',x(peakT)).attr('cy',yCount(peakCount)).attr('r',4);
svg.append('text').attr('class','count-num').attr('x',x(peakT)+8).attr('y',yCount(peakCount)-6).text(`${peakCount} 种 · 1.9 Ma`);

function fmtMa(v){
  if(v===0)return '现在';
  return (v<0.1?v.toFixed(3).replace(/0+$/,'').replace(/\.$/,''):String(v))+' Ma';
}
function selectSpecies(d){
  rows.classed('selected',r=>r.key===d.key).attr('aria-pressed',r=>r.key===d.key?'true':'false');
  document.getElementById('detail-cn').textContent=d.cn;
  document.getElementById('detail-latin').textContent=d.genus+' '+d.key;
  document.getElementById('detail-range').textContent=fmtMa(d.start)+' — '+fmtMa(d.end);
  document.getElementById('detail-brain').textContent=d.brain;
  document.getElementById('detail-feature').textContent=d.feature;
}
selectSpecies(species.find(d=>d.key==='afarensis'));
</script>
</body></html>
