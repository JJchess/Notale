<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:12px;}
.model-tools{display:flex;align-items:center;justify-content:space-between;gap:22px;flex:0 0 auto;}
.model-tools .hint{white-space:nowrap;}
.graph{position:relative;flex:1 1 auto;min-height:292px;border:1px solid var(--line-soft);border-radius:var(--r);background:linear-gradient(180deg,rgba(34,27,22,.74),rgba(15,13,12,.36));overflow:hidden;}
.graph::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(185,173,160,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(185,173,160,.035) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;}
.links{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.link{fill:none;stroke:var(--text-3);stroke-width:2;vector-effect:non-scaling-stroke;}
.link.bad{stroke:var(--warn);}
.node{position:absolute;transform:translate(-50%,-50%);min-width:164px;padding:12px 18px;border:1px solid var(--line);border-radius:9px;background:#1b1714;text-align:center;color:var(--text);font-size:var(--fs-body);line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.22);will-change:left,top,opacity;}
.node.today{border-color:var(--gene-dim);background:linear-gradient(180deg,rgba(224,145,58,.13),rgba(25,21,18,.96));}
.node.ancestor{width:322px;border-color:#665b52;background:#201b17;}
.node .when{display:block;margin-top:5px;color:var(--text-3);font-size:var(--fs-label);}
.node .uncertain{display:block;margin-top:7px;padding-top:7px;border-top:1px solid var(--line-soft);color:var(--text-2);font-size:var(--fs-sec);line-height:1.4;text-align:left;}
.branch-label{position:absolute;transform:translate(-50%,-50%);padding:5px 10px;border-radius:16px;background:rgba(15,13,12,.92);color:var(--gene-2);font:600 var(--fs-label)/1.25 var(--font-sans);white-space:nowrap;opacity:0;will-change:left,top,opacity;}
.branch-label .num{color:var(--text-2);font-size:var(--fs-label);font-weight:400;margin-left:6px;}
.bad-cross{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%);color:var(--warn);font-size:52px;line-height:1;font-weight:700;text-shadow:0 0 20px rgba(224,87,74,.3);will-change:opacity;}
.bad-caption{position:absolute;left:50%;top:13%;transform:translateX(-50%);color:#f0968c;font-size:var(--fs-label);font-weight:700;letter-spacing:.08em;will-change:opacity;}
.insight{flex:0 0 auto;display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start;padding:2px 2px 0;}
.insight>.min0{min-width:0;min-height:0;}
.insight .claim{font-size:var(--fs-h2);line-height:1.35;}
.supports{grid-template-columns:1.16fr 1fr 1.08fr;gap:18px;}
.support{font-size:var(--fs-sec);line-height:1.45;padding:2px 0 2px 20px;}
.support::before{top:.7em;}
.support b{color:var(--gene-2);}
@media (prefers-reduced-motion:reduce){.node,.branch-label,.bad-cross,.bad-caption{will-change:auto;}}
</style>
</head>
<body data-page="06" data-total="44">
<div id="stage"><main id="main">
  <section class="model-tools min0" aria-label="模型切换">
    <div class="btns" role="group" aria-label="选择关系模型">
      <button class="btn lg" id="btn-common" type="button" aria-pressed="true">常见的说法</button>
      <button class="btn lg" id="btn-real" type="button" aria-pressed="false">实际的关系</button>
    </div>
    <div class="hint">按一下，看这两句话的结构差在哪</div>
  </section>

  <section class="graph min0" id="graph" aria-live="polite" aria-label="人类与黑猩猩关系模型：当前为常见的线性说法">
    <svg class="links" viewBox="0 0 1000 320" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <marker id="arrow-neutral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#8b8078"/></marker>
      </defs>
      <path class="link" id="link1" marker-end="url(#arrow-neutral)"></path>
      <path class="link" id="link2" marker-end="url(#arrow-neutral)"></path>
      <path class="link" id="link3" marker-end="url(#arrow-neutral)"></path>
    </svg>
    <div class="bad-caption" id="bad-caption">错误的祖先链</div>
    <div class="bad-cross" id="bad-cross" aria-hidden="true">×</div>

    <div class="node ancestor" id="node-ancestor">
      <strong>共同祖先</strong><span class="when num">约 700 万年前</span>
      <span class="uncertain"><b>没有化石能确指它。</b><br>它既不是黑猩猩，也不是人。</span>
    </div>
    <div class="node today" id="node-chimp"><strong>黑猩猩</strong><span class="when" id="chimp-time"></span></div>
    <div class="node" id="node-apeman"><strong>猿人</strong></div>
    <div class="node" id="node-erectus"><strong>直立人</strong></div>
    <div class="node today" id="node-human"><strong id="human-name">现代人</strong><span class="when" id="human-time"></span></div>

    <div class="branch-label" id="label-top">700 万年演化 <span class="num">约 28 万代</span></div>
    <div class="branch-label" id="label-bottom">700 万年演化 <span class="num">约 28 万代</span></div>
  </section>

  <section class="insight min0" aria-label="结论与三条说明">
    <div class="claim min0">共同祖先，<br>不是祖先。</div>
    <div class="supports min0">
      <div class="support">黑猩猩和我们分开之后，<b>它那一支也演化了同样长的时间</b>。它不是“没变的我们”。</div>
      <div class="support">“猿人”不是一个物种，是一个通俗说法。真正的名字见上一页那丛灌木。</div>
      <div class="support">我们和黑猩猩的 DNA 差异约 <b class="num">1.2%</b>（单碱基替换口径）。这 <b class="num">1.2%</b> 里没有一条是“太空适应”。</div>
    </div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/anime.min.js"></script>
<script>
Chrome.mount({ act:1, title:'我们不是从黑猩猩变来的', sub:'黑猩猩不是我们的祖先，是我们的表亲——而且它也演化了 700 万年。', foot:'那丛灌木里，我们这一支最先变的不是脑子，是走路的方式。' });

(function(){
  var graph=document.getElementById('graph');
  var btnCommon=document.getElementById('btn-common');
  var btnReal=document.getElementById('btn-real');
  var nodes={
    ancestor:document.getElementById('node-ancestor'), chimp:document.getElementById('node-chimp'),
    apeman:document.getElementById('node-apeman'), erectus:document.getElementById('node-erectus'), human:document.getElementById('node-human')
  };
  var labels=[document.getElementById('label-top'),document.getElementById('label-bottom')];
  var paths=[document.getElementById('link1'),document.getElementById('link2'),document.getElementById('link3')];
  var cross=document.getElementById('bad-cross'), badCaption=document.getElementById('bad-caption');
  var humanName=document.getElementById('human-name');
  var chimpTime=document.getElementById('chimp-time'), humanTime=document.getElementById('human-time');
  var mode='common';
  var layouts={
    common:{ancestor:[22,50,0],chimp:[12,55,1],apeman:[37,55,1],erectus:[63,55,1],human:[88,55,1]},
    real:{ancestor:[22,50,1],chimp:[79,23,1],apeman:[49,44,0],erectus:[49,66,0],human:[79,77,1]}
  };
  var state={};
  Object.keys(nodes).forEach(function(k){state[k]={x:layouts.common[k][0],y:layouts.common[k][1],o:layouts.common[k][2]};});

  function place(){
    Object.keys(nodes).forEach(function(k){var s=state[k],el=nodes[k];el.style.left=s.x+'%';el.style.top=s.y+'%';el.style.opacity=s.o;el.style.pointerEvents=s.o>.5?'auto':'none';});
    var w=1000,h=320;
    function p(k){return {x:state[k].x*w/100,y:state[k].y*h/100};}
    if(mode==='common'){
      var order=['chimp','apeman','erectus','human'];
      for(var i=0;i<3;i++){var a=p(order[i]),b=p(order[i+1]);paths[i].setAttribute('d','M '+(a.x+65)+' '+a.y+' L '+(b.x-65)+' '+b.y);paths[i].style.opacity=Math.min(state[order[i]].o,state[order[i+1]].o);}
    }else{
      var a0=p('ancestor'),c=p('chimp'),hu=p('human'),joint={x:480,y:a0.y};
      paths[0].setAttribute('d','M '+(a0.x+105)+' '+a0.y+' L '+joint.x+' '+a0.y+' L '+(c.x-80)+' '+c.y);
      paths[1].setAttribute('d','M '+(a0.x+105)+' '+a0.y+' L '+joint.x+' '+a0.y+' L '+(hu.x-80)+' '+hu.y);
      paths[2].setAttribute('d','');
      paths[0].style.opacity=Math.min(state.ancestor.o,state.chimp.o);
      paths[1].style.opacity=Math.min(state.ancestor.o,state.human.o);
      paths[2].style.opacity=0;
    }
  }

  function setMode(next,animate){
    mode=next;
    var real=next==='real';
    btnCommon.setAttribute('aria-pressed',String(!real));
    btnReal.setAttribute('aria-pressed',String(real));
    graph.setAttribute('aria-label',real?'人类与黑猩猩关系模型：共同祖先分成两个同级分支':'人类与黑猩猩关系模型：常见但错误的线性祖先链');
    humanName.textContent=real?'智人（今天）':'现代人';
    chimpTime.textContent=real?'今天':'';
    humanTime.textContent='';
    anime.remove([state.ancestor,state.chimp,state.apeman,state.erectus,state.human,cross,badCaption].concat(labels));
    var duration=animate&&!Deck.reduced()?700:0;
    Object.keys(nodes).forEach(function(k){
      var t=layouts[next][k];
      anime({targets:state[k],x:t[0],y:t[1],o:t[2],duration:duration,easing:'easeInOutCubic',update:place});
    });
    anime({targets:[cross,badCaption],opacity:real?0:1,duration:duration,easing:'easeInOutQuad'});
    labels.forEach(function(el,i){
      el.style.left='59%';el.style.top=(i===0?'27%':'73%');
      anime({targets:el,opacity:real?1:0,duration:duration,easing:'easeInOutQuad'});
    });
    if(!duration) place();
  }
  btnCommon.addEventListener('click',function(){setMode('common',true);});
  btnReal.addEventListener('click',function(){setMode('real',true);});
  setMode('common',false);
})();
</script>
</body></html>
