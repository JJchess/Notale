<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:12px}
.work{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}
.viz{min-height:0;display:flex;flex-direction:column;background:rgba(25,21,18,.58);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
.phase-rail{flex:0 0 auto;display:grid;grid-template-columns:37.14% 34.29% 28.57%;align-items:stretch;border-bottom:1px solid var(--line-soft);min-height:70px}
.before{display:flex;align-items:center;padding-left:22px;color:var(--text-3);font-size:var(--fs-label);letter-spacing:.05em}
.phase{position:relative;display:flex;flex-direction:column;justify-content:center;padding:9px 24px 9px 16px;border-left:1px solid var(--line)}
.phase::after{content:"→";position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:var(--fs-h2)}
.phase.gene{background:linear-gradient(90deg,rgba(224,145,58,.18),rgba(224,145,58,.05));color:var(--gene-2)}
.phase.gene::after{color:var(--gene)}
.phase.cult{background:linear-gradient(90deg,rgba(95,200,216,.17),rgba(95,200,216,.04));color:var(--cult-2)}
.phase.cult::after{color:var(--cult)}
.phase b{font-size:var(--fs-sec);line-height:1.25;color:inherit}
.phase span{font-size:var(--fs-label);line-height:1.3;color:var(--text-2);margin-top:3px}
.chart-wrap{position:relative;flex:1 1 auto;min-height:0}
#chart{position:absolute;inset:0}
.readout{min-height:0;display:flex;flex-direction:column;padding:18px 20px;background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r)}
.time-now{font-family:var(--font-num);font-size:36px;line-height:1;color:var(--cult-2);font-variant-numeric:tabular-nums;margin:2px 0 17px}
.time-now small{font-family:var(--font-sans);font-size:var(--fs-label);color:var(--text-3);margin-left:5px}
.read-list{display:grid;gap:0;margin:0}
.read-row{padding:12px 0;border-top:1px solid var(--line-soft)}
.read-row dt{font-size:var(--fs-label);color:var(--text-3);margin:0 0 4px}
.read-row dd{font-size:var(--fs-sec);line-height:1.4;color:var(--text);margin:0}
.read-row dd.num{color:var(--gene-2);font-size:var(--fs-body)}
.statuses{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.statuses .tag{font-size:var(--fs-label)}
.readout .hint{margin-top:auto;padding-top:13px;border-top:1px solid var(--line-soft)}
.takeaway{flex:0 0 auto;display:flex;align-items:center;gap:16px;min-height:58px;padding:10px 18px;border-left:4px solid var(--gene);background:linear-gradient(90deg,rgba(224,145,58,.10),transparent 68%);font-size:var(--fs-lead);line-height:1.4}
.takeaway strong{color:var(--gene-2)}
.takeaway .sep{color:var(--text-3)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body data-page="07" data-total="44">
<div id="stage"><main id="main">
  <section class="work min0" aria-label="直立与脑容量的时间关系">
    <div class="viz min0">
      <div class="phase-rail" aria-label="从过去到现在的两个阶段">
        <div class="before">7 Ma　过去 → 现在</div>
        <div class="phase gene"><b>4.4–2.0 Ma</b><span>直立已确立；脑容量几乎不动</span></div>
        <div class="phase cult"><b>2.0 Ma–今</b><span>脑容量翻了近三倍</span></div>
      </div>
      <div class="chart-wrap min0 no-pan"><div id="chart" role="img" aria-label="距今七百万年至今的人族颅容量散点图；直立先于脑容量增长约二百四十万年"></div></div>
    </div>
    <aside class="readout min0" aria-live="polite">
      <p class="ttl">游标处的世界</p>
      <div class="time-now"><span id="timeVal">3.0</span><small>Ma 前</small></div>
      <dl class="read-list">
        <div class="read-row"><dt>活着的人族</dt><dd id="speciesVal">阿法种、非洲种</dd></div>
        <div class="read-row"><dt>最大的颅容量</dt><dd class="num"><span id="brainVal">460</span> cc</dd></div>
        <div class="read-row"><dt>关键能力</dt><dd class="statuses"><span class="tag gene" id="uprightVal">直立：确证</span><span class="tag" id="toolVal">石器：已有</span></dd></div>
      </dl>
      <div class="hint">拖动竖线，读那个时刻的世界</div>
    </aside>
  </section>
  <div class="takeaway"><span>直立比大脑早了 <strong>240 万年</strong>——大约 <strong>10 万代人</strong>。</span><span class="sep">这两件事之间没有'因为所以'。</span></div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
Chrome.mount({ act:1, title:'先直立，两百万年后才变大脑', sub:'顺序本身就是证据：不是"因为聪明所以站起来"，是先站起来，很久以后脑子才开始长。', foot:'既然站起来在前，那站起来先解决的一定不是聪明的问题。是什么问题？' });

var gene=getComputedStyle(document.documentElement).getPropertyValue('--gene').trim();
var gene2=getComputedStyle(document.documentElement).getPropertyValue('--gene-2').trim();
var cult=getComputedStyle(document.documentElement).getPropertyValue('--cult').trim();
var cult2=getComputedStyle(document.documentElement).getPropertyValue('--cult-2').trim();
var text=getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
var text2=getComputedStyle(document.documentElement).getPropertyValue('--text-2').trim();
var text3=getComputedStyle(document.documentElement).getPropertyValue('--text-3').trim();
var line=getComputedStyle(document.documentElement).getPropertyValue('--line').trim();

var points=[
 {value:[7.0,360],name:'乍得沙赫人',label:{position:'top'}},
 {value:[4.4,350],name:'始祖地猿',label:{position:'left'}},
 {value:[4.1,370],name:'湖畔种',label:{position:'right'}},
 {value:[3.2,450],name:'阿法种',label:{position:'top'}},
 {value:[2.8,460],name:'非洲种',label:{position:'bottom'}},
 {value:[2.3,510],name:'鲍氏傍人',label:{position:'left'}},
 {value:[2.0,610],name:'能人',label:{position:'top'}},
 {value:[1.8,850],name:'直立人（早）',label:{position:'right'}},
 {value:[0.5,1000],name:'直立人（晚）',label:{position:'left'}},
 {value:[0.5,1200],name:'海德堡人',label:{position:'left'}},
 {value:[0.1,1450],name:'尼安德特人',label:{position:'left'}},
 {value:[0.0,1350],name:'智人',label:{position:'left'}},
 {value:[0.0,400],name:'黑猩猩（参照）',label:{position:'left'},itemStyle:{color:text3},symbol:'diamond'}
];
var lives=[
 {name:'乍得沙赫人',from:7.0,to:6.0,cc:360},
 {name:'始祖地猿',from:4.4,to:4.0,cc:350},
 {name:'湖畔种',from:4.2,to:3.9,cc:370},
 {name:'阿法种',from:3.9,to:2.9,cc:450},
 {name:'非洲种',from:3.3,to:2.1,cc:460},
 {name:'鲍氏傍人',from:2.3,to:1.2,cc:510},
 {name:'能人',from:2.4,to:1.4,cc:610},
 {name:'直立人',from:1.9,to:0.1,cc:1000},
 {name:'海德堡人',from:0.7,to:0.2,cc:1200},
 {name:'尼安德特人',from:0.4,to:0.04,cc:1450},
 {name:'智人',from:0.3,to:0,cc:1350}
];
var chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
var cursor=3.0;
var option={
 animation:false,
 textStyle:{fontFamily:'Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif',fontSize:16,color:text2},
 grid:{left:78,right:42,top:42,bottom:58},
 tooltip:{show:false},
 xAxis:{type:'value',min:0,max:7,inverse:true,name:'距今（百万年）',nameLocation:'middle',nameGap:36,nameTextStyle:{fontSize:14,color:text2},axisLine:{lineStyle:{color:line}},axisTick:{show:false},axisLabel:{fontSize:14,color:text2,formatter:function(v){return v;}},splitLine:{lineStyle:{color:'rgba(61,52,44,.45)'}}},
 yAxis:{type:'value',min:0,max:1600,interval:400,name:'颅容量（cc）',nameLocation:'middle',nameGap:52,nameTextStyle:{fontSize:14,color:text2},axisLine:{show:false},axisTick:{show:false},axisLabel:{fontSize:14,color:text2},splitLine:{lineStyle:{color:'rgba(61,52,44,.55)'}}},
 series:[{
   type:'scatter',name:'人族颅容量',data:points,symbolSize:11,z:4,
   itemStyle:{color:gene,borderColor:'#0f0d0c',borderWidth:2},
   label:{show:true,formatter:'{b}',fontSize:15,color:text,distance:7},
   labelLayout:{hideOverlap:true,moveOverlap:'shiftY'},
   markArea:{silent:true,z:0,label:{show:true,fontSize:15,color:text2,position:'insideTop'},data:[
     [{name:'直立已确立，脑容量 240 万年几乎没动',xAxis:4.4,itemStyle:{color:'rgba(224,145,58,.12)'}},{xAxis:2.0}],
     [{name:'脑容量在这段里翻了近三倍',xAxis:2.0,itemStyle:{color:'rgba(95,200,216,.09)'}},{xAxis:0}]
   ]},
   markLine:{silent:true,symbol:['none','none'],label:{show:true,fontSize:14,color:text2,formatter:'{b}',position:'insideEndTop',distance:4},lineStyle:{width:1,type:'dashed',color:gene},data:[
     {name:'4.4 Ma  地猿已有直立特征',xAxis:4.4},
     {name:'3.66 Ma  Laetoli 足迹确证直立',xAxis:3.66}
   ]}
 }],
 graphic:[]
};
chart.setOption(option);

function updateReadout(t){
 cursor=Math.max(0,Math.min(7,t));
 var active=lives.filter(function(s){return cursor<=s.from && cursor>=s.to;});
 document.getElementById('timeVal').textContent=cursor.toFixed(1);
 document.getElementById('speciesVal').textContent=active.length?active.map(function(s){return s.name;}).join('、'):'尚无表中人族';
 var max=active.reduce(function(m,s){return Math.max(m,s.cc);},0);
 document.getElementById('brainVal').textContent=max?String(max):'—';
 var up=document.getElementById('uprightVal');
 if(cursor<=3.66){up.textContent='直立：确证';up.className='tag gene';}
 else if(cursor<=4.4){up.textContent='直立：部分特征';up.className='tag gene';}
 else{up.textContent='直立：未确证';up.className='tag';}
 var tool=document.getElementById('toolVal');
 if(cursor<=3.3){tool.textContent='石器：已有';tool.className='tag cult';}
 else{tool.textContent='石器：未见';tool.className='tag';}
 drawCursor();
}
function drawCursor(){
 var x=chart.convertToPixel({xAxisIndex:0},cursor);
 var top=chart.convertToPixel({yAxisIndex:0},1600);
 var bottom=chart.convertToPixel({yAxisIndex:0},0);
 if(!isFinite(x)||!isFinite(top)||!isFinite(bottom))return;
 chart.setOption({graphic:[
   {id:'cursorHit',type:'rect',shape:{x:x-13,y:top,width:26,height:bottom-top},style:{fill:'rgba(95,200,216,.001)'},z:98,cursor:'ew-resize'},
   {id:'cursorLine',type:'line',shape:{x1:x,y1:top,x2:x,y2:bottom},style:{stroke:cult,lineWidth:3,shadowBlur:8,shadowColor:cult},z:99,silent:true},
   {id:'cursorTop',type:'polygon',shape:{points:[[x-7,top],[x+7,top],[x,top+10]]},style:{fill:cult2},z:100,silent:true}
 ]});
}
function setFromPixel(px){
 var value=chart.convertFromPixel({xAxisIndex:0},px);
 if(isFinite(value))updateReadout(Math.round(value*10)/10);
}
var dragging=false;
chart.getZr().on('mousedown',function(e){
 var y0=chart.convertToPixel({yAxisIndex:0},1600), y1=chart.convertToPixel({yAxisIndex:0},0);
 if(e.offsetY>=y0&&e.offsetY<=y1){dragging=true;setFromPixel(e.offsetX);}
});
chart.getZr().on('mousemove',function(e){if(dragging)setFromPixel(e.offsetX);});
chart.getZr().on('mouseup',function(){dragging=false;});
chart.getZr().on('globalout',function(){dragging=false;});
chart.on('finished',function(){if(!chart.__cursorReady){chart.__cursorReady=true;drawCursor();}});
Deck.onResize(function(){chart.resize();setTimeout(drawCursor,0);});
updateReadout(3.0);
</script>
</body></html>
