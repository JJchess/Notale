<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:14px}
.energy-chart{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:118px minmax(0,1fr);grid-template-rows:auto 1fr 1fr auto;column-gap:18px;row-gap:11px;padding:16px 20px 13px;background:linear-gradient(180deg,rgba(34,27,22,.72),rgba(25,21,18,.44));border:1px solid var(--line-soft);border-radius:var(--r)}
.axis-name{grid-column:2;align-self:end;font-size:var(--fs-label);color:var(--text-3);letter-spacing:.03em}
.row-name{align-self:center;text-align:right;font-size:var(--fs-label);line-height:1.35;color:var(--text-2)}
.row-name.human{color:var(--gene-2)}
.lane{position:relative;align-self:stretch;min-height:70px;border-left:1px solid var(--line);background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),var(--line-soft) calc(25% - 1px),var(--line-soft) 25%);border-radius:0 7px 7px 0;overflow:visible}
.fill{position:absolute;left:0;top:13px;bottom:13px;width:0;border-radius:0 6px 6px 0;transition:width .18s ease;box-shadow:inset 0 1px rgba(255,255,255,.14)}
.fill.human{background:linear-gradient(90deg,var(--gene-dim),var(--gene))}
.fill.chimp{background:linear-gradient(90deg,#3b3632,#8b8078)}
.endval{position:absolute;top:50%;left:0;transform:translate(calc(-100% - 10px),-50%);font-family:var(--font-num);font-size:var(--fs-label);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text);text-shadow:0 1px 4px var(--bg-deep);transition:left .18s ease}
.endval.out{transform:translate(10px,-50%);text-shadow:none}
.scale{grid-column:2;position:relative;height:29px;border-top:1px solid var(--line)}
.tick{position:absolute;top:0;transform:translateX(-50%);font-family:var(--font-num);font-size:var(--fs-tick);line-height:1;color:var(--text-3);padding-top:9px;white-space:nowrap}
.tick::before{content:"";position:absolute;left:50%;top:-1px;width:1px;height:6px;background:var(--line)}
.tick.first{transform:none}.tick.first::before{left:0}.tick.last{transform:translateX(-100%)}.tick.last::before{left:100%}
.lower{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px}
.readout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:stretch;padding:16px 20px}
.control-block{display:flex;flex-direction:column;justify-content:center;gap:10px}
.control-block .ctl{flex-wrap:wrap}
.control-block .ctl input{flex-basis:100%}
.control-block .ctl .cv{margin-left:auto;color:var(--gene-2)}
.delta{display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line-soft);padding-left:20px}
.delta .eyebrow{font-size:var(--fs-label);color:var(--text-3);letter-spacing:.06em}
.delta .big{color:var(--gene-2);margin:4px 0 7px}
.delta .equiv{display:flex;gap:18px;flex-wrap:wrap;font-size:var(--fs-sec);line-height:1.4;color:var(--text-2)}
.delta .equiv span::before{content:"≈";color:var(--gene);margin-right:6px}
.mathbox{display:flex;flex-direction:column;justify-content:center}
.mathbox .ttl{margin-bottom:7px}
.mathline{font-size:var(--fs-label);line-height:1.55;color:var(--text-2)}
.mathline .num{color:var(--text)}
.source{margin-top:5px;font-size:var(--fs-label);color:var(--text-3)}
.takeaway{flex:0 0 auto;display:flex;align-items:center;gap:13px;padding:10px 16px;border-left:4px solid var(--gene);background:rgba(224,145,58,.075);border-radius:0 var(--r) var(--r) 0;font-size:var(--fs-lead);line-height:1.4;color:var(--text-2)}
.takeaway strong{color:var(--gene-2)}
@media (prefers-reduced-motion:reduce){.fill,.endval{transition:none}}
</style>
</head>
<body data-page="08" data-total="44">
<div id="stage"><main id="main">
  <section class="energy-chart min0" aria-label="人类与黑猩猩走相同距离的累计能耗比较">
    <div class="axis-name">同一段距离上的累计能耗（kcal）</div>
    <div class="row-name human">人<br>（直立行走）</div>
    <div class="lane min0"><div id="humanBar" class="fill human"></div><span id="humanValue" class="endval">—</span></div>
    <div class="row-name">黑猩猩<br>（四足）</div>
    <div class="lane min0"><div id="chimpBar" class="fill chimp"></div><span id="chimpValue" class="endval">—</span></div>
    <div id="scale" class="scale" aria-hidden="true"></div>
  </section>

  <section class="lower min0">
    <div class="panel readout min0">
      <div class="control-block min0">
        <div class="ctl">
          <label class="cl" for="distance">每天走多远</label>
          <output id="distanceValue" class="cv" for="distance">10 km</output>
          <input class="no-pan" id="distance" type="range" min="0" max="20" step="0.5" value="10" aria-label="每天行走距离，公里">
        </div>
        <div class="hint">拖滑块，改变每天走的距离</div>
      </div>
      <div class="delta min0" aria-live="polite">
        <div class="eyebrow">直立行走省下的差额</div>
        <div><span id="difference" class="big">—</span><span class="unit">kcal / 天</span></div>
        <div class="equiv"><span id="basal">—</span><span id="tuber">—</span></div>
      </div>
    </div>
    <aside class="panel q mathbox min0">
      <div class="ttl">这个数字怎么来的</div>
      <div class="mathline">运输代价 COT：人 <span class="num">0.20</span>；黑猩猩 <span class="num">0.75</span> mL O₂·kg⁻¹·m⁻¹</div>
      <div class="mathline">体重假设：<span class="num">45 kg</span>（早期人族的量级）</div>
      <div class="mathline"><span class="num">1 L O₂ ≈ 4.8 kcal</span></div>
      <div class="source">Sockol 等，2007</div>
    </aside>
  </section>

  <div id="takeaway" class="takeaway" aria-live="polite"></div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:1, title:'直立省了多少能量', sub:'走同样一段路，人用掉的氧气大约是黑猩猩的四分之一。', foot:'省下来的能量后来去了哪里——先看它被花在了什么地方。' });

(function(){
  var COT_HUMAN = 0.20;
  var COT_CHIMP = 0.75;
  var MASS_KG = 45;
  var KCAL_PER_L_O2 = 4.8;
  var MAX_DISTANCE_KM = 20;
  var BASAL_KCAL = 1584;
  var TUBER_KCAL_PER_KG = 500;

  var slider = document.getElementById('distance');
  var humanBar = document.getElementById('humanBar');
  var chimpBar = document.getElementById('chimpBar');
  var humanValue = document.getElementById('humanValue');
  var chimpValue = document.getElementById('chimpValue');
  var distanceValue = document.getElementById('distanceValue');
  var difference = document.getElementById('difference');
  var basal = document.getElementById('basal');
  var tuber = document.getElementById('tuber');
  var takeaway = document.getElementById('takeaway');
  var scale = document.getElementById('scale');

  function kcal(cot, distanceKm){
    var litresO2 = cot * MASS_KG * distanceKm * 1000 / 1000;
    return litresO2 * KCAL_PER_L_O2;
  }

  var axisMax = kcal(COT_CHIMP, MAX_DISTANCE_KM);
  for(var i=0;i<=4;i++){
    var tick = document.createElement('span');
    tick.className = 'tick' + (i===0?' first':'') + (i===4?' last':'');
    tick.style.left = (i*25) + '%';
    tick.textContent = Chrome.n(axisMax*i/4, 0);
    scale.appendChild(tick);
  }

  function setBar(bar, label, value){
    var pct = value / axisMax * 100;
    bar.style.width = pct + '%';
    label.style.left = pct + '%';
    label.textContent = Chrome.n(value, 0) + ' kcal';
    label.classList.toggle('out', pct < 76);
  }

  function fractionWords(ratio){
    if(Math.abs(ratio - .75) < .015) return '一个成年人一天基础代谢的 3/4';
    return '一个成年人一天基础代谢的 ' + Math.round(ratio*100) + '%';
  }

  function render(){
    var d = Number(slider.value);
    var h = kcal(COT_HUMAN, d);
    var c = kcal(COT_CHIMP, d);
    var saved = c - h;
    var yearly = saved * 365;
    distanceValue.textContent = Chrome.n(d, d%1 ? 1 : 0) + ' km';
    setBar(humanBar, humanValue, h);
    setBar(chimpBar, chimpValue, c);
    difference.textContent = Chrome.n(saved, 0);
    basal.textContent = fractionWords(saved / BASAL_KCAL);
    tuber.textContent = Chrome.n(saved / TUBER_KCAL_PER_KG, 1) + ' kg 野生块茎';
    takeaway.innerHTML = saved === 0
      ? '距离是 <strong>0 km</strong>，两种步态都还没有产生行走能耗。把距离往右拉。'
      : '省下的不是零头。<strong>每天 ' + Chrome.n(saved,0) + ' kcal，一年就是 ' + Chrome.cn(yearly) + ' kcal</strong>——够多养活一个孩子到能自己走路。';
  }

  slider.addEventListener('input', render);
  render();
})();
</script>
</body></html>
