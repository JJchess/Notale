<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:14px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex:0 0 auto}
.mode-wrap{display:flex;align-items:center;gap:14px}
.mode-label{font-size:var(--fs-label);color:var(--text-3)}
.btns{flex-wrap:nowrap}
.btn{min-width:142px;white-space:nowrap}
.btn.expected[aria-pressed="true"]{--acc:var(--gene)}
.source{font-size:var(--fs-label);color:var(--text-3);white-space:nowrap}
.content{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px}
.chart-panel{min-height:0;display:flex;flex-direction:column;padding:14px 18px 12px;background:rgba(25,21,18,.72)}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:18px;flex:0 0 auto;padding:0 4px 5px}
.axis-title{font-size:var(--fs-label);color:var(--text-2)}
.axis-title b{color:var(--text);font-weight:600}
.legend{flex-wrap:nowrap}
.legend .sw.ape{background:#8b8078}
.legend .sw.expected{background:transparent;border:2px solid var(--gene);opacity:.72}
.legend .sw.actual{background:var(--cult)}
#chart{flex:1 1 auto;min-height:0;width:100%}
.side{min-height:0;display:flex;flex-direction:column;gap:12px}
.delta{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:20px 22px;border-left:3px solid var(--cult);background:linear-gradient(110deg,rgba(95,200,216,.10),rgba(25,21,18,.72) 68%)}
.delta-kicker{font-size:var(--fs-label);font-weight:700;letter-spacing:.06em;color:var(--cult);margin-bottom:9px}
.delta .big{color:var(--cult-2)}
.delta .big .unit{font-size:var(--fs-body);color:var(--text-2)}
.delta-flow{display:flex;align-items:baseline;gap:9px;margin:15px 0 8px;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.delta-flow .from{color:var(--gene-2);font-size:var(--fs-h2)}
.delta-flow .arrow{color:var(--text-3);font-size:var(--fs-h2)}
.delta-flow .to{color:var(--cult-2);font-size:var(--fs-h2)}
.year{margin-top:3px;font-size:var(--fs-lead);line-height:1.45;color:var(--text)}
.year strong{font-family:var(--font-num);color:var(--cult-2)}
.bio{flex:0 0 auto;padding:16px 18px;background:transparent;border-color:var(--gene-dim)}
.bio .ttl{margin-bottom:7px}
.bio p{margin:0;font-size:var(--fs-sec);line-height:1.5;color:var(--text-2)}
.bio b{color:var(--gene-2)}
.dispute{display:block;margin-top:7px;color:var(--text-3);font-size:var(--fs-label)}
.hint{flex:0 0 auto;justify-content:flex-start;padding-left:3px}
</style>
</head>
<body data-page="11" data-total="44">
<div id="stage"><main id="main">
  <div class="toolbar min0">
    <div class="mode-wrap min0" role="group" aria-label="切换人类进食时间">
      <span class="mode-label">人类这一行</span>
      <div class="btns">
        <button id="expectedBtn" class="btn expected" type="button" aria-pressed="true">按体重该有的</button>
        <button id="actualBtn" class="btn cult" type="button" aria-pressed="false">实际的</button>
      </div>
    </div>
    <div class="source">数据：Organ 等, 2011 · 按清醒活动 <span class="num">14</span> 小时换算</div>
  </div>

  <div class="content min0">
    <section class="panel chart-panel min0" aria-label="跨物种进食时间占比比较">
      <div class="chart-head min0">
        <div class="axis-title"><b>共同基准</b>：清醒活动时间中用于进食的比例（<span class="num">0–50%</span>）</div>
        <div class="legend" aria-label="图例">
          <span class="li"><i class="sw ape"></i>其他大猿</span>
          <span class="li"><i class="sw expected"></i>人类应有值</span>
          <span class="li"><i class="sw actual"></i>人类实际值</span>
        </div>
      </div>
      <div id="chart" role="img" aria-label="大猩猩、红毛猩猩、黑猩猩与人类进食时间占比的横向条形图"></div>
    </section>

    <aside class="side min0">
      <section class="panel delta">
        <div class="delta-kicker">人类拿回来的时间</div>
        <div class="big"><span id="dayGap">6.1</span><span class="unit">小时 / 天</span></div>
        <div class="delta-flow" aria-label="从每天六点八小时降到四十分钟">
          <span class="from" id="expectedHours">6.8 小时</span>
          <span class="arrow">→</span>
          <span class="to" id="actualMinutes">40 分钟</span>
        </div>
        <div class="year">一年约 <strong id="yearGap">2,200</strong> 小时<br>可以拿去做别的事。</div>
      </section>
      <section class="panel bio">
        <div class="ttl gene">身体也留下了痕迹</div>
        <p>咀嚼肌基因 <b>MYH16</b> 已失活；人类臼齿面积比同体重灵长类小约 <b>40%</b>。</p>
        <span class="dispute">与用火年代的关系尚有争议。</span>
      </section>
      <div class="hint">按一下，看人类实际用掉多少时间</div>
    </aside>
  </div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
Chrome.mount({ act:1, title:'谁来付账：把咀嚼时间还回来', sub:'其他大猿一天有三分之一到一半的时间在嚼东西。人类只用 4.7%。', foot:'把嚼东西的时间从五小时压到二十分钟，靠的不是牙齿，是火。' });

var awakeHours = 14;
var species = ['大猩猩','红毛猩猩','黑猩猩','人类'];
var apeValues = [48,40,37,null];
var humanExpected = 48;
var humanActual = 4.7;
var currentMode = 'expected';
var chart = echarts.init(document.getElementById('chart'), null, {renderer:'svg'});

function durationLabel(percent){
  var hours = awakeHours * percent / 100;
  if(hours < 1) return Math.round(hours * 60) + ' 分钟';
  return hours.toFixed(1) + ' 小时';
}

function humanValue(){ return currentMode === 'expected' ? humanExpected : humanActual; }

function option(){
  var gene = Deck.token('--gene');
  var cult = Deck.token('--cult');
  var text = Deck.token('--text');
  var text2 = Deck.token('--text-2');
  var text3 = Deck.token('--text-3');
  var line = Deck.token('--line');
  var active = currentMode === 'expected' ? gene : cult;
  return {
    animationDuration: 700,
    animationDurationUpdate: 760,
    animationEasingUpdate: 'cubicOut',
    textStyle:{fontFamily:Deck.token('--font-sans'),fontSize:16,color:text},
    grid:{left:118,right:126,top:25,bottom:42,containLabel:false},
    xAxis:{
      type:'value',min:0,max:50,interval:10,
      name:'进食时间占比',nameLocation:'middle',nameGap:30,
      nameTextStyle:{fontSize:14,color:text3},
      axisLine:{show:true,lineStyle:{color:line}},
      axisTick:{show:false},
      axisLabel:{fontSize:14,color:text3,formatter:'{value}%'},
      splitLine:{show:true,lineStyle:{color:line,opacity:.55}}
    },
    yAxis:{
      type:'category',inverse:true,data:species,
      axisLine:{show:false},axisTick:{show:false},
      axisLabel:{fontSize:14,color:function(value){return value === '人类' ? active : text2},fontWeight:function(value){return value === '人类' ? 700 : 400},margin:18}
    },
    series:[
      {
        name:'按体重外推应有',type:'bar',barWidth:34,barGap:'-100%',silent:true,z:1,
        data:[null,null,null,humanExpected],
        itemStyle:{color:'rgba(224,145,58,.06)',borderColor:gene,borderWidth:2,borderType:'dashed',borderRadius:[0,5,5,0]},
        label:{show:currentMode === 'actual',position:'insideRight',distance:10,color:gene,fontSize:14,fontWeight:600,formatter:'应有 48%'}
      },
      {
        name:'其他大猿',type:'bar',barWidth:34,z:2,
        data:apeValues,
        itemStyle:{color:'#776d65',borderRadius:[0,5,5,0]},
        label:{show:true,position:'right',distance:10,color:text2,fontSize:14,formatter:function(p){return p.value + '%  ·  ' + durationLabel(p.value)}}
      },
      {
        name:'人类',type:'bar',barWidth:34,barGap:'-100%',z:3,
        data:[null,null,null,humanValue()],
        itemStyle:{color:active,borderRadius:[0,5,5,0]},
        label:{show:true,position:'right',distance:10,color:active,fontSize:14,fontWeight:700,formatter:function(p){return p.value + '%  ·  ' + durationLabel(p.value)}}
      }
    ]
  };
}

function setMode(mode){
  currentMode = mode;
  document.getElementById('expectedBtn').setAttribute('aria-pressed', String(mode === 'expected'));
  document.getElementById('actualBtn').setAttribute('aria-pressed', String(mode === 'actual'));
  chart.setOption(option(), {notMerge:true});
}

document.getElementById('expectedBtn').addEventListener('click', function(){setMode('expected')});
document.getElementById('actualBtn').addEventListener('click', function(){setMode('actual')});

var expectedH = awakeHours * humanExpected / 100;
var actualH = awakeHours * humanActual / 100;
var gapH = expectedH - actualH;
document.getElementById('dayGap').textContent = gapH.toFixed(1);
document.getElementById('expectedHours').textContent = expectedH.toFixed(1) + ' 小时';
document.getElementById('actualMinutes').textContent = Math.round(actualH * 60) + ' 分钟';
document.getElementById('yearGap').textContent = (Math.round(gapH * 365 / 100) * 100).toLocaleString('en-US');

chart.setOption(option());
Deck.onResize(function(){chart.resize()});
</script>
</body></html>
