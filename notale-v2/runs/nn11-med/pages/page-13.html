<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.claim{flex:0 0 auto;max-width:1420px;border-left-color:var(--gene);background:linear-gradient(90deg,rgba(224,145,58,.09),transparent 62%);padding-top:8px;padding-bottom:8px}
.model{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:540px minmax(0,1fr);gap:32px;position:relative}
.body-map{position:relative;min-width:0;min-height:0;overflow:hidden;border-radius:var(--r);border:1px solid var(--line-soft);background:#100d0b}
.body-map .savanna{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.18;filter:saturate(.55) contrast(1.05)}
.body-map::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,7,6,.68),rgba(8,7,6,.42) 62%,rgba(8,7,6,.86)),linear-gradient(0deg,rgba(8,7,6,.48),transparent 36%);pointer-events:none}
.body-map svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.silhouette{fill:rgba(224,145,58,.07);stroke:var(--gene-2);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.anatomy{fill:none;stroke:rgba(240,184,116,.36);stroke-width:1.4;stroke-linecap:round}
.guide{fill:none;stroke:rgba(185,173,160,.52);stroke-width:1.25;stroke-dasharray:4 5;transition:stroke .15s,stroke-width .15s}
.hot{fill:#100d0b;stroke:var(--gene-2);stroke-width:2.4;transition:fill .15s,stroke-width .15s,filter .15s}
.hot.active{fill:var(--gene);stroke-width:3.2;filter:drop-shadow(0 0 7px rgba(224,145,58,.8))}
.guide.active{stroke:var(--gene-2);stroke-width:2}
.map-label{position:absolute;left:20px;top:16px;z-index:2;color:var(--gene-2);font-size:var(--fs-label);font-weight:700;letter-spacing:.08em}
.map-hint{position:absolute;left:20px;bottom:16px;z-index:2}
.supports{height:100%;align-content:space-between;gap:7px;padding:3px 0}
.supports .trunk{left:6px;background:linear-gradient(180deg,transparent,var(--gene-dim) 7%,var(--gene-dim) 93%,transparent)}
.support{padding:7px 14px 7px 28px;border-radius:7px;cursor:default;transition:background .15s,transform .15s;color:var(--text-2);outline:none}
.support::before{left:6px;top:1.22em;width:14px;background:var(--gene)}
.support:hover,.support:focus-visible{background:rgba(224,145,58,.09);transform:translateX(3px)}
.support:focus-visible{box-shadow:inset 0 0 0 1px var(--gene-dim)}
.support strong{display:block;font-size:var(--fs-body);line-height:1.3;color:var(--text)}
.support .evidence{display:block;margin-top:2px;font-size:var(--fs-label);line-height:1.38;color:var(--text-2)}
.support .num{color:var(--gene-2)}
.closer{flex:0 0 auto;margin:0;border-top:1px solid var(--cult-dim);padding:10px 14px 0 18px;font-size:var(--fs-lead);line-height:1.4;color:var(--cult)}
.closer strong{color:var(--cult-2)}
</style>
</head>
<body data-page="13" data-total="44">
<div id="stage"><main id="main">
  <section class="claim" aria-label="中心主张">你今天这具身体的每一项关键特征，都是在非洲草原上、为解决草原上的问题而定型的。<br>它从来没有为别的环境做过准备。</section>

  <section class="model min0" aria-label="身体特征与支撑依据">
    <figure class="body-map min0">
      <img class="savanna" src="assets/img/illus-savanna.png" alt="" title="生成插画（非真实照片）：非洲草原">
      <div class="map-label">草原身体 · 五处定型</div>
      <svg viewBox="0 0 540 390" role="img" aria-label="简笔人形的五个身体标注点，分别连接直立行走、散热、大脑、产道与体外烹煮">
        <path class="silhouette" d="M221 91 C205 107 201 132 206 155 L199 213 C196 235 205 255 213 272 L197 356 M241 91 C257 108 261 132 256 155 L264 213 C267 235 258 255 250 272 L267 356 M205 157 L157 239 M257 157 L303 239 M213 272 C224 278 239 278 250 272"/>
        <circle class="silhouette" cx="231" cy="63" r="31"/>
        <path class="anatomy" d="M212 61 C219 45 244 45 251 61 M220 72 C228 78 238 78 245 72 M216 181 C226 190 238 190 248 181 M215 242 C228 234 242 234 255 242"/>
        <path class="guide g1" d="M257 333 C333 333 361 52 530 52"/>
        <path class="guide g2" d="M184 187 C325 187 364 123 530 123"/>
        <path class="guide g3" d="M231 56 C332 56 370 194 530 194"/>
        <path class="guide g4" d="M233 249 C326 249 374 265 530 265"/>
        <path class="guide g5" d="M231 180 C330 180 378 336 530 336"/>
        <circle class="hot p1" cx="257" cy="333" r="6"/>
        <circle class="hot p2" cx="184" cy="187" r="6"/>
        <circle class="hot p3" cx="231" cy="56" r="6"/>
        <circle class="hot p4" cx="233" cy="249" r="6"/>
        <circle class="hot p5" cx="231" cy="180" r="6"/>
      </svg>
      <div class="hint map-hint">悬停右侧结论，定位身体上的对应点</div>
    </figure>

    <div class="supports min0" aria-label="五条支撑">
      <i class="trunk" aria-hidden="true"></i>
      <div class="support" data-key="1" tabindex="0">
        <strong>直立行走</strong>
        <span class="evidence">走同样的路只花四分之一的能量：<span class="num">0.20 vs 0.75 mL O₂/kg/m</span></span>
      </div>
      <div class="support" data-key="2" tabindex="0">
        <strong>裸皮与二百多万个汗腺</strong>
        <span class="evidence">白天在开阔地长时间移动而不中暑；代价是离开 <span class="num">27 °C</span> 就得靠衣服</span>
      </div>
      <div class="support" data-key="3" tabindex="0">
        <strong>一颗很贵的大脑</strong>
        <span class="evidence"><span class="num">2%</span> 的体重，消耗 <span class="num">20%</span> 的静息能量</span>
      </div>
      <div class="support" data-key="4" tabindex="0">
        <strong>提前出生的婴儿</strong>
        <span class="evidence">产道装不下更大的头，换来的是长期抚养和群体协作</span>
      </div>
      <div class="support" data-key="5" tabindex="0">
        <strong>把处理食物挪到体外</strong>
        <span class="evidence">火与烹煮省下每天约 <span class="num">6 小时</span></span>
      </div>
    </div>
  </section>

  <p class="closer">注意：上面五条里没有一条是“天生会打石器”“天生会说话”“天生会造火箭”。<strong>那些不在这具身体里。</strong></p>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:1, title:'一具草原上的身体', sub:'幕 I 收束。', foot:'这些本事没有一样写在基因里能直接用——它们要靠学。下一幕讲这个。' });
(function(){
  var items=document.querySelectorAll('.support');
  function setActive(key,on){
    document.querySelector('.p'+key).classList.toggle('active',on);
    document.querySelector('.g'+key).classList.toggle('active',on);
  }
  items.forEach(function(item){
    var key=item.dataset.key;
    item.addEventListener('mouseenter',function(){setActive(key,true)});
    item.addEventListener('mouseleave',function(){setActive(key,false)});
    item.addEventListener('focus',function(){setActive(key,true)});
    item.addEventListener('blur',function(){setActive(key,false)});
  });
})();
</script>
</body></html>
