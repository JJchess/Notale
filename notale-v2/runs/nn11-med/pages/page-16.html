<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:18px;flex:0 0 auto}
.topline .hint{color:var(--text-2)}
.topline .status{margin-left:auto;font-size:var(--fs-label);color:var(--text-3);white-space:nowrap}
.compare-board{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:252px minmax(0,1fr) minmax(0,1fr);grid-template-rows:42px repeat(4,minmax(66px,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:rgba(25,21,18,.56)}
.compare-board .hdr{display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);font-size:var(--fs-label);font-weight:700;letter-spacing:.06em;background:rgba(34,27,22,.7)}
.compare-board .hdr.gene{color:var(--gene);border-left:1px solid var(--line-soft)}
.compare-board .hdr.cult{color:var(--cult);border-left:1px solid var(--line-soft)}
.problem{display:flex;align-items:center;justify-content:flex-end;text-align:right;padding:8px 16px 8px 8px;color:var(--text-2);font-size:var(--fs-sec);line-height:1.35;border-bottom:1px solid var(--line-soft)}
.answer-cell{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:6px 10px;border-left:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.compare-board>:nth-last-child(-n+3){border-bottom:0}
.drop-slot{width:100%;min-height:42px;display:flex;align-items:center;padding:6px 10px;border:1px dashed #55483e;border-radius:7px;background:rgba(8,7,6,.36);color:var(--text-3);font-size:var(--fs-sec);line-height:1.35;transition:border-color .16s,background .16s,box-shadow .16s}
.drop-slot::before{content:"拖到这里";font-size:var(--fs-label);color:var(--text-3)}
.drop-slot.filled::before{content:"";display:none}
.drop-slot.filled.gene{border-style:solid;border-color:var(--gene);background:rgba(224,145,58,.08);box-shadow:inset 3px 0 0 var(--gene)}
.drop-slot.filled.cult{border-style:solid;border-color:var(--cult);background:rgba(95,200,216,.08);box-shadow:inset 3px 0 0 var(--cult)}
.drop-slot.target{border-color:var(--text-2);background:rgba(255,255,255,.035)}
.drop-slot.bad{animation:badflash .42s ease}
.row-note{min-height:18px;font-size:var(--fs-label);line-height:1.25;color:var(--text-2);opacity:0;transform:translateY(2px);transition:.2s}
.row-note.show{opacity:1;transform:none}
.pool-wrap{flex:0 0 auto;border-top:1px solid var(--line-soft);padding-top:8px}
.pool{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;min-height:104px}
.choice{min-width:0;min-height:48px;display:flex;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text);font:500 var(--fs-sec)/1.3 var(--font-sans);text-align:left;cursor:grab;touch-action:none;user-select:none;transition:border-color .12s,background .12s,transform .12s,opacity .12s}
.choice:hover,.choice.selected{border-color:#746355;background:var(--panel-2)}
.choice.selected{box-shadow:0 0 0 2px rgba(95,200,216,.22)}
.choice:active{cursor:grabbing}
.choice.locked{cursor:default;background:transparent;border:0;padding:0;min-height:0;box-shadow:none}
.choice.returning{animation:returnshake .38s ease}
.drag-ghost{position:fixed;z-index:30;pointer-events:none;width:330px;min-height:48px;opacity:.94;box-shadow:0 14px 34px rgba(0,0,0,.45);transform:rotate(-1deg)}
.summary{flex:0 0 auto;min-height:58px;display:flex;align-items:center;padding:7px 16px;border-left:3px solid var(--cult);background:rgba(95,200,216,.07);font-size:var(--fs-lead);line-height:1.4;color:var(--text-2);opacity:0;visibility:hidden;transition:.25s}
.summary.show{opacity:1;visibility:visible}
.summary b{color:var(--cult-2)}
@keyframes badflash{0%,100%{border-color:#55483e;background:rgba(8,7,6,.36)}35%{border-color:var(--warn);background:rgba(224,87,74,.15);box-shadow:0 0 0 2px rgba(224,87,74,.16)}}
@keyframes returnshake{0%,100%{transform:translateX(0)}30%{transform:translateX(-7px);border-color:var(--warn)}65%{transform:translateX(6px);border-color:var(--warn)}}
@media (prefers-reduced-motion:reduce){.drop-slot,.row-note,.choice,.summary{transition:none}.drop-slot.bad,.choice.returning{animation:none}}
</style>
</head>
<body data-page="16" data-total="44">
<div id="stage"><main id="main">
  <div class="topline min0">
    <div class="hint">把下面八张卡片拖进对应的格子</div>
    <div class="status" id="status" aria-live="polite"></div>
    <button class="btn" id="reset" type="button">重来</button>
  </div>

  <section class="compare-board cmp min0" aria-label="基因通道与体外通道对照表">
    <div class="hdr dim">要解决的同一个问题</div>
    <div class="hdr gene">基因通道</div>
    <div class="hdr cult">体外通道</div>

    <div class="problem">成年后还能消化牛奶</div>
    <div class="answer-cell min0"><div class="drop-slot no-pan" data-answer="milk-g" data-channel="gene" tabindex="0" role="button" aria-label="牛奶问题的基因通道答案"></div></div>
    <div class="answer-cell min0"><div class="drop-slot no-pan" data-answer="milk-c" data-channel="cult" tabindex="0" role="button" aria-label="牛奶问题的体外通道答案"></div><div class="row-note" data-row="milk">基因那一格用了约 7500 年才在欧洲铺开；奶酪的做法，一个下午就能教会。</div></div>

    <div class="problem">挡住强紫外线</div>
    <div class="answer-cell min0"><div class="drop-slot no-pan" data-answer="uv-g" data-channel="gene" tabindex="0" role="button" aria-label="紫外线问题的基因通道答案"></div></div>
    <div class="answer-cell min0"><div class="drop-slot no-pan" data-answer="uv-c" data-channel="cult" tabindex="0" role="button" aria-label="紫外线问题的体外通道答案"></div><div class="row-note" data-row="uv">肤色的变化以万年计；防晒霜 1936 年才有，今天全世界都在用。</div></div>

    <div class="problem">在高原上缺氧还能干活</div>
    <div class="answer-cell min0"><div class="drop-slot no-pan" data-answer="alt-g" data-channel="gene" tabindex="0" role="button" aria-label="高原缺氧问题的基因通道答案"></div></div>
    <div class="answer-cell min0"><div class="drop-slot no-pan" data-answer="alt-c" data-channel="cult" tabindex="0" role="button" aria-label="高原缺氧问题的体外通道答案"></div><div class="row-note" data-row="alt">EPAS1 的变异只在少数人群里；氧气瓶谁都能背。</div></div>

    <div class="problem">让新生儿活下来</div>
    <div class="answer-cell min0"><div class="drop-slot no-pan" data-answer="baby-g" data-channel="gene" tabindex="0" role="button" aria-label="新生儿问题的基因通道答案"></div></div>
    <div class="answer-cell min0"><div class="drop-slot no-pan" data-answer="baby-c" data-channel="cult" tabindex="0" role="button" aria-label="新生儿问题的体外通道答案"></div><div class="row-note" data-row="baby">反射写在基因里，一出生就有；背带写在别人身上，得学。</div></div>
  </section>

  <div class="pool-wrap min0"><div class="pool" id="pool" aria-label="候选答案"></div></div>
  <div class="summary" id="summary" aria-live="polite">右边这一列有一个基因通道<b>永远做不到</b>的性质：<b>你这辈子学会的东西，可以原样传给下一代。</b>基因不行——你练出的肌肉、学会的语言，一个都不会写回你的 DNA。</div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
Chrome.mount({ act:2, title:'两条通道', sub:'同一个生存问题，可以走基因，也可以走身体之外。这一页你自己分一遍。', foot:'右边那一列有一个基因永远做不到的性质：学到的东西可以直接教出去。' });

(function(){
  var items = [
    {id:'milk-g',row:'milk',text:'乳糖酶持续表达的等位基因'},
    {id:'milk-c',row:'milk',text:'把奶做成奶酪和酸奶，让细菌先分解乳糖'},
    {id:'uv-g',row:'uv',text:'皮肤里的黑色素含量随纬度变化'},
    {id:'uv-c',row:'uv',text:'涂防晒、戴帽子、待在屋檐下'},
    {id:'alt-g',row:'alt',text:'藏族人群的 EPAS1 变异（来自丹尼索瓦人渐渗）'},
    {id:'alt-c',row:'alt',text:'背一个氧气瓶'},
    {id:'baby-g',row:'baby',text:'抓握反射、吸吮反射'},
    {id:'baby-c',row:'baby',text:'襁褓、背带、婴儿床、接生的人'}
  ];
  var pool = document.getElementById('pool');
  var slots = Array.prototype.slice.call(document.querySelectorAll('.drop-slot'));
  var selected = null;
  var rng = new Math.seedrandom('page-16');
  var order = items.slice();
  for(var i=order.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}

  function makeCard(item){
    var b=document.createElement('button');
    b.type='button'; b.className='choice no-pan'; b.textContent=item.text;
    b.dataset.id=item.id; b.dataset.row=item.row;
    b.setAttribute('aria-label','候选答案：'+item.text);
    bindCard(b); return b;
  }
  function clearSelection(){
    if(selected) selected.classList.remove('selected');
    selected=null;
  }
  function rowReady(row){
    return slots.filter(function(s){return s.dataset.answer.indexOf(row+'-')===0;}).every(function(s){return s.classList.contains('filled');});
  }
  function updateState(row){
    var note=document.querySelector('.row-note[data-row="'+row+'"]');
    if(note) note.classList.toggle('show',rowReady(row));
    var done=slots.every(function(s){return s.classList.contains('filled');});
    document.getElementById('summary').classList.toggle('show',done);
    if(done) document.getElementById('status').textContent='全部正确。右边这一列能把一生中学会的东西直接教给下一代。';
  }
  function wrong(card,slot){
    if(slot){slot.classList.remove('bad');void slot.offsetWidth;slot.classList.add('bad');}
    card.classList.remove('returning');void card.offsetWidth;card.classList.add('returning');
    document.getElementById('status').textContent='不在这一格，再试一次。';
    setTimeout(function(){card.classList.remove('returning');},420);
  }
  function place(card,slot){
    if(!card || !slot || slot.classList.contains('filled')) return;
    if(card.dataset.id!==slot.dataset.answer){wrong(card,slot);clearSelection();return;}
    slot.appendChild(card); slot.classList.add('filled',slot.dataset.channel);
    card.classList.remove('selected'); card.classList.add('locked'); card.disabled=true;
    document.getElementById('status').textContent='放对了。'; selected=null;
    updateState(card.dataset.row);
  }
  function bindCard(card){
    var sx=0,sy=0,drag=false,ghost=null,suppressClick=false;
    card.addEventListener('click',function(){
      if(suppressClick){suppressClick=false;return;}
      if(card.disabled)return;
      if(selected===card)clearSelection();else{clearSelection();selected=card;card.classList.add('selected');document.getElementById('status').textContent='已选中答案，再选择一个空格。';}
    });
    card.addEventListener('pointerdown',function(e){
      if(card.disabled)return; sx=e.clientX;sy=e.clientY;drag=false;card.setPointerCapture(e.pointerId);
    });
    card.addEventListener('pointermove',function(e){
      if(!card.hasPointerCapture(e.pointerId))return;
      if(!drag && Math.hypot(e.clientX-sx,e.clientY-sy)>6){
        drag=true;clearSelection();ghost=card.cloneNode(true);ghost.className='choice drag-ghost';document.body.appendChild(ghost);card.style.opacity='.25';
      }
      if(drag){ghost.style.left=(e.clientX-165)+'px';ghost.style.top=(e.clientY-24)+'px';
        slots.forEach(function(s){var r=s.getBoundingClientRect();s.classList.toggle('target',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom&&!s.classList.contains('filled'));});}
    });
    card.addEventListener('pointerup',function(e){
      if(drag){
        suppressClick=true;
        var hit=slots.find(function(s){var r=s.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom&&!s.classList.contains('filled');});
        if(ghost)ghost.remove();card.style.opacity='';slots.forEach(function(s){s.classList.remove('target');});
        if(hit)place(card,hit);else wrong(card,null);
      }
    });
    card.addEventListener('pointercancel',function(){if(ghost)ghost.remove();card.style.opacity='';slots.forEach(function(s){s.classList.remove('target');});});
  }
  slots.forEach(function(slot){
    slot.addEventListener('click',function(){if(selected)place(selected,slot);});
    slot.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&selected){e.preventDefault();place(selected,slot);}});
  });
  function reset(){
    clearSelection();
    slots.forEach(function(slot){slot.className='drop-slot no-pan';slot.innerHTML='';});
    document.querySelectorAll('.row-note').forEach(function(n){n.classList.remove('show');});
    document.getElementById('summary').classList.remove('show');
    pool.innerHTML='';order.forEach(function(item){pool.appendChild(makeCard(item));});
    document.getElementById('status').textContent='已重置。';
  }
  document.getElementById('reset').addEventListener('click',reset);
  reset();
})();
</script>
</body></html>
