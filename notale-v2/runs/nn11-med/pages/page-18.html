<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:12px}
.story{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px}
.map-wrap{position:relative;min-height:0;border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;background:radial-gradient(80% 100% at 48% 50%,rgba(95,200,216,.035),transparent 70%)}
#map{display:block;width:100%;height:100%}
.land{fill:#241d18;stroke:var(--line);stroke-width:.7;vector-effect:non-scaling-stroke}
.route{fill:none;stroke:var(--cult);stroke-width:1.8;stroke-opacity:.7;vector-effect:non-scaling-stroke}
.site-dot{stroke:var(--bg);stroke-width:2;vector-effect:non-scaling-stroke}
.site-label{font-family:var(--font-sans);font-size:var(--fs-label);paint-order:stroke;stroke:var(--bg);stroke-width:4;stroke-linejoin:round;fill:var(--text-2)}
.site-age{font-family:var(--font-num);font-size:var(--fs-tick);fill:var(--cult-2);font-variant-numeric:tabular-nums}
.moon-label{font-family:var(--font-sans);font-size:var(--fs-sec);fill:var(--cult-2);font-weight:700}
.moon-note{font-family:var(--font-sans);font-size:var(--fs-sec);fill:var(--text-2)}
.origin-tag{font-family:var(--font-sans);font-size:var(--fs-label);fill:var(--text-3)}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.metric{padding:11px 0;min-width:0}
.metric:nth-child(odd){padding-right:14px;border-right:1px solid var(--line-soft)}
.metric:nth-child(even){padding-left:14px}
.metric:nth-child(n+3){border-top:1px solid var(--line-soft)}
.metric .k{font-size:var(--fs-label);color:var(--text-3);margin-bottom:3px}
.metric .v{font-family:var(--font-num);font-size:var(--fs-h2);line-height:1.2;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.event{flex:1 1 auto;min-height:0;padding:16px 18px;border-left:3px solid var(--cult);background:linear-gradient(90deg,rgba(95,200,216,.08),transparent 75%);display:flex;flex-direction:column;justify-content:center}
.event .when{font-family:var(--font-num);font-size:var(--fs-label);color:var(--cult);margin-bottom:5px}
.event .where{font-size:var(--fs-h2);font-weight:700;line-height:1.28;color:var(--text)}
.event .desc{font-size:var(--fs-sec);line-height:1.45;color:var(--text-2);margin-top:7px}
.sea-note{padding:14px 16px;border:1px solid var(--cult-dim);border-radius:var(--r);font-size:var(--fs-sec);line-height:1.48;color:var(--text-2)}
.sea-note b{color:var(--cult-2)}
.sea-note .last{display:block;margin-top:4px;color:var(--text)}
.timebox{flex:0 0 auto;padding:10px 16px 8px;border-top:1px solid var(--line);background:rgba(25,21,18,.55)}
.time-head{display:flex;align-items:center;gap:18px;margin-bottom:3px}
.time-head .hint{flex:1}
.time-head .range-read{font-family:var(--font-num);font-size:var(--fs-sec);color:var(--cult-2);font-variant-numeric:tabular-nums}
.ctl{gap:14px}
.ctl .cl{width:78px;color:var(--text-2)}
.ctl .cv{width:92px;text-align:right}
.tickrow{position:relative;height:20px;margin-left:92px;margin-right:106px;color:var(--text-3);font-family:var(--font-num);font-size:var(--fs-tick)}
.tickrow span{position:absolute;top:1px;transform:translateX(-50%);white-space:nowrap}
.tickrow span:first-child{transform:none}
.tickrow span:last-child{transform:translateX(-100%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-page="18" data-total="44">
<div id="stage"><main id="main">
  <section class="story min0" aria-label="智人扩散地图与当前读数">
    <div class="map-wrap min0">
      <svg id="map" viewBox="0 0 1120 455" role="img" aria-labelledby="map-title map-desc">
        <title id="map-title">智人从非洲向全球扩散的时间地图</title>
        <desc id="map-desc">滑块控制距今年份，站点依到达年代点亮，带箭头的大圆弧显示扩散方向。</desc>
      </svg>
    </div>
    <aside class="side min0" aria-live="polite">
      <div class="metrics">
        <div class="metric"><div class="k">当前年代</div><div class="v" id="era">65,000 年前</div></div>
        <div class="metric"><div class="k">已到达站点</div><div class="v"><span id="count">5</span> / 12</div></div>
        <div class="metric"><div class="k">最北</div><div class="v" id="north">32.7°N</div></div>
        <div class="metric"><div class="k">最南</div><div class="v" id="south">12.4°S</div></div>
      </div>
      <div class="event" id="eventBox">
        <div class="when" id="eventWhen">65,000 年前</div>
        <div class="where" id="eventWhere">澳大利亚 Madjedbebe</div>
        <div class="desc" id="eventDesc">到达澳洲——中途必须渡海</div>
      </div>
      <div class="sea-note">到达澳大利亚要<b>跨过至少 90 公里的开阔海面</b>——6.5 万年前就有人做到了。<span class="last">那需要船，而船不是长出来的。</span></div>
    </aside>
  </section>
  <section class="timebox no-pan" aria-label="扩散时间轴">
    <div class="time-head"><div class="hint">拖时间滑块，看这颗行星是怎么被铺满的</div><div class="range-read">距今 32 万年 → 0</div></div>
    <div class="ctl">
      <label class="cl" for="timeRange">时间向前</label>
      <input id="timeRange" type="range" min="0" max="1000" step="any" aria-label="距今年份，对数刻度">
      <output class="cv" id="timeOut" for="timeRange">65,000 年前</output>
    </div>
    <div class="tickrow" aria-hidden="true">
      <span style="left:0%">32万</span><span style="left:12.5%">6.5万</span><span style="left:24%">1.5万</span><span style="left:36.8%">3,000</span><span style="left:48%">750</span><span style="left:68%">57</span><span style="left:100%">现在</span>
    </div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/data/land-110m.js"></script>
<script>
Chrome.mount({ act:2, title:'走出非洲', sub:'六万年，从东非铺满一整颗行星。靠的不是新器官，是会造衣服、船和地图的头脑。', foot:'这条扩散曲线的最后一个点，不在地球上。' });

(function(){
  var sites = [
    {age:315000,name:'摩洛哥 Jebel Irhoud',short:'Jebel Irhoud',lon:-8.9,lat:31.9,desc:'已知最早的智人化石',parent:null,dx:-8,dy:-11,anchor:'end'},
    {age:233000,name:'埃塞俄比亚 Omo Kibish',short:'Omo Kibish',lon:35.9,lat:5.4,desc:'东非的早期智人',parent:null,dx:9,dy:16,anchor:'start'},
    {age:185000,name:'以色列 Misliya 洞',short:'Misliya 洞',lon:35.0,lat:32.7,desc:'一次早期的外出，没有留下后代',parent:1,dx:8,dy:-13,anchor:'start'},
    {age:100000,name:'以色列 Skhul / Qafzeh',short:'Skhul / Qafzeh',lon:35.3,lat:32.7,desc:'又一次早期外出',parent:1,dx:8,dy:19,anchor:'start'},
    {age:65000,name:'澳大利亚 Madjedbebe',short:'Madjedbebe',lon:132.9,lat:-12.4,desc:'到达澳洲——中途必须渡海',parent:3,dx:8,dy:17,anchor:'start'},
    {age:63000,name:'苏门答腊 Lida Ajer',short:'Lida Ajer',lon:100.9,lat:-0.5,desc:'东南亚的热带雨林',parent:3,dx:-8,dy:-10,anchor:'end'},
    {age:45000,name:'保加利亚 Bacho Kiro',short:'Bacho Kiro',lon:25.4,lat:42.9,desc:'进入欧洲',parent:3,dx:-8,dy:-12,anchor:'end'},
    {age:32000,name:'西伯利亚 Yana RHS',short:'Yana RHS',lon:135.5,lat:71.0,desc:'北极圈内，需要缝制衣物',parent:6,dx:8,dy:17,anchor:'start'},
    {age:15000,name:'智利 Monte Verde',short:'Monte Verde',lon:-73.2,lat:-41.5,desc:'已经到达南美南部',parent:7,dx:-8,dy:18,anchor:'end'},
    {age:3000,name:'汤加 / 萨摩亚',short:'汤加 / 萨摩亚',lon:-175.2,lat:-21.1,desc:'远洋航行进入太平洋深处',parent:4,dx:9,dy:-10,anchor:'start'},
    {age:750,name:'新西兰 Aotearoa',short:'Aotearoa',lon:174.8,lat:-41.3,desc:'最后一片大陆级陆地被人踏上',parent:9,dx:-8,dy:19,anchor:'end'}
  ];
  var moon={age:57,name:'月球 · 静海',desc:'不在这张地图上'};
  var W=1120,H=455;
  var svg=d3.select('#map');
  var defs=svg.append('defs');
  defs.append('marker').attr('id','arrowCult').attr('viewBox','0 0 10 10').attr('refX',8).attr('refY',5).attr('markerWidth',5).attr('markerHeight',5).attr('orient','auto-start-reverse').append('path').attr('d','M 0 0 L 10 5 L 0 10 z').attr('fill','var(--cult)');
  var proj=d3.geoNaturalEarth1().fitExtent([[24,18],[W-24,H-18]],LAND110);
  var geoPath=d3.geoPath(proj);
  svg.append('g').selectAll('path').data(LAND110.features).join('path').attr('class','land').attr('d',geoPath);
  var routeG=svg.append('g');
  var pointG=svg.append('g');
  var moonG=svg.append('g').attr('transform','translate(930,35)').style('display','none');
  moonG.append('circle').attr('r',7).attr('fill','var(--cult-2)').attr('stroke','var(--bg)').attr('stroke-width',3);
  moonG.append('circle').attr('r',14).attr('fill','none').attr('stroke','var(--cult)').attr('stroke-opacity',.35);
  moonG.append('text').attr('class','moon-label').attr('x',20).attr('y',2).text('月球 · 静海 · 57 年前');
  moonG.append('text').attr('class','moon-note').attr('x',20).attr('y',25).text('扩散没有停在海岸线上。');

  function arcPath(a,b){
    var interp=d3.geoInterpolate([a.lon,a.lat],[b.lon,b.lat]);
    var pts=d3.range(0,1.001,.025).map(function(t){return proj(interp(t));});
    return d3.line().curve(d3.curveBasis)(pts);
  }
  sites.forEach(function(d,i){
    if(d.parent!==null){
      routeG.append('path').datum(d).attr('class','route').attr('d',arcPath(sites[d.parent],d)).attr('marker-end','url(#arrowCult)');
    }
    var p=proj([d.lon,d.lat]);
    var g=pointG.append('g').datum(d).attr('transform','translate('+p[0]+','+p[1]+')');
    g.append('circle').attr('class','site-dot').attr('r',5);
    var label=g.append('text').attr('class','site-label').attr('x',d.dx).attr('y',d.dy).attr('text-anchor',d.anchor);
    label.append('tspan').text(d.short);
    label.append('tspan').attr('class','site-age').attr('x',d.dx).attr('dy','1.15em').text(Chrome.n(d.age)+' 年前');
  });
  var omo=proj([35.9,5.4]);
  svg.append('text').attr('class','origin-tag').attr('x',omo[0]+9).attr('y',omo[1]-10).text('东非出发');

  var range=document.getElementById('timeRange');
  var logMax=Math.log(320001);
  function posFromAge(age){return 1000*(1-Math.log(age+1)/logMax);}
  function ageFromPos(pos){return Math.max(0,Math.round(Math.exp(logMax*(1-pos/1000))-1));}
  range.value=posFromAge(65000);

  function fmtAge(n){return n<=0?'现在':Chrome.n(n)+' 年前';}
  function coordText(v,isNorth){
    if(v===null)return '—';
    var hemi=v>=0?(isNorth?'N':'N'):'S';
    return Math.abs(v).toFixed(1)+'°'+hemi;
  }
  function update(){
    var age=ageFromPos(+range.value);
    var reached=sites.filter(function(d){return d.age>=age;});
    var moonReached=age<=moon.age;
    var count=reached.length+(moonReached?1:0);
    var lats=reached.map(function(d){return d.lat;});
    var north=lats.length?d3.max(lats):null;
    var south=lats.length?d3.min(lats):null;
    document.getElementById('era').textContent=fmtAge(age);
    document.getElementById('timeOut').textContent=fmtAge(age);
    document.getElementById('count').textContent=count;
    document.getElementById('north').textContent=north===null?'—':Math.abs(north).toFixed(1)+'°'+(north>=0?'N':'S');
    document.getElementById('south').textContent=south===null?'—':Math.abs(south).toFixed(1)+'°'+(south>=0?'N':'S');
    routeG.selectAll('.route').attr('stroke-opacity',function(d){return d.age>=age?.78:.08;}).attr('marker-end',function(d){return d.age>=age?'url(#arrowCult)':null;});
    pointG.selectAll('g').each(function(d){
      var on=d.age>=age;
      d3.select(this).select('circle').attr('fill',on?'var(--cult)':'var(--line)').attr('r',on?5.5:4);
      d3.select(this).select('text').style('display',on?null:'none');
    });
    moonG.style('display',moonReached?null:'none');
    var latest=null;
    if(moonReached) latest=moon;
    else if(reached.length) latest=reached.reduce(function(a,b){return a.age<b.age?a:b;});
    if(latest){
      document.getElementById('eventWhen').textContent=fmtAge(latest.age);
      document.getElementById('eventWhere').textContent=latest.name;
      document.getElementById('eventDesc').textContent=latest.desc;
    }else{
      document.getElementById('eventWhen').textContent='32 万年前';
      document.getElementById('eventWhere').textContent='扩散尚未开始';
      document.getElementById('eventDesc').textContent='把时间向前推，第一批站点会依次点亮。';
    }
  }
  range.addEventListener('input',update);
  update();
})();
</script>
</body></html>
