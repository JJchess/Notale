<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:14px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:26px;flex:1;min-height:0}
.calc{display:flex;flex-direction:column;gap:14px;min-height:0}
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:start;padding:14px 18px 12px;background:rgba(25,21,18,.72);border:1px solid var(--line-soft);border-radius:var(--r)}
.slider-wrap{min-width:0}
.ctl{gap:14px}.ctl .cl{font-weight:700;color:var(--text)}
.ctl .cv{min-width:82px;text-align:right;color:var(--cult-2);font-weight:700}
.anchors{position:relative;height:29px;margin:2px 44px 0 88px;color:var(--text-3);font-size:var(--fs-tick);font-family:var(--font-num)}
.anchor{position:absolute;top:2px;transform:translateX(-50%);white-space:nowrap}
.anchor::before{content:"";position:absolute;left:50%;top:-7px;width:1px;height:6px;background:var(--line)}
.anchor.first{transform:none}.anchor.first::before{left:0}
.anchor.last{transform:translateX(-100%)}.anchor.last::before{left:100%}
.modes{display:flex;gap:8px;align-items:center}
.chart{position:relative;flex:1;min-height:300px;padding:15px 18px 13px;background:linear-gradient(90deg,rgba(224,145,58,.055),rgba(95,200,216,.025));border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}
.result{display:flex;align-items:baseline;gap:9px}
.result-label{font-size:var(--fs-label);color:var(--text-3)}
#result{font-family:var(--font-num);font-size:36px;line-height:1;color:var(--gene-2);font-weight:700;font-variant-numeric:tabular-nums}
.result-note{font-size:var(--fs-sec);color:var(--text-2)}
.axis-area{position:relative;height:238px;margin-left:154px;margin-right:20px}
.axis{position:absolute;left:0;right:0;top:46px;height:2px;background:linear-gradient(90deg,var(--gene),var(--cult));opacity:.8}
.tick{position:absolute;top:36px;width:1px;height:13px;background:var(--line)}
.tick span{position:absolute;top:-29px;left:0;transform:translateX(-50%);font:var(--fs-tick)/1 var(--font-num);color:var(--text-3);white-space:nowrap}
.ref{position:absolute;top:43px;width:1px;height:181px;background:var(--line);opacity:.7}
.ref span{position:absolute;top:10px;left:7px;font-size:var(--fs-label);line-height:1.25;color:var(--text-2);white-space:nowrap;writing-mode:vertical-rl}
.ref.arctic{background:var(--cult);opacity:.9}.ref.arctic span{color:var(--cult-2)}
.offscale{position:absolute;right:0;top:-43px;font-size:var(--fs-label);line-height:1.3;color:var(--text-3);text-align:right}
.gear-row{position:absolute;left:0;right:0;height:29px;display:flex;align-items:center}
.gear-row .name{position:absolute;right:calc(100% + 14px);width:140px;text-align:right;font-size:var(--fs-label);color:var(--text-2);white-space:nowrap}
.gear-row .range{position:absolute;left:0;height:8px;border-radius:5px;background:rgba(95,200,216,.2);border-right:2px solid var(--cult)}
.gear-row .val{position:absolute;transform:translateX(7px);font:var(--fs-tick)/1 var(--font-num);color:var(--cult-2);white-space:nowrap}
.current{position:absolute;top:39px;bottom:8px;width:2px;background:var(--gene);box-shadow:0 0 12px rgba(224,145,58,.7);z-index:4;transition:left .12s ease}
.current::before{content:"";position:absolute;top:-1px;left:-5px;width:12px;height:12px;border-radius:50%;background:var(--gene)}
.current-tag{position:absolute;top:50px;transform:translateX(-50%);padding:3px 8px;border-radius:5px;background:var(--gene);color:#17110b;font-size:var(--fs-label);font-weight:700;white-space:nowrap;z-index:5;transition:left .12s ease}
.statement{margin:0;padding:12px 16px;border-left:3px solid var(--cult);font-size:var(--fs-lead);line-height:1.45;background:rgba(95,200,216,.055)}
.statement strong{color:var(--cult-2)}
.photo-col{display:flex;flex-direction:column;gap:12px;min-height:0}
.photo-col figure{flex:1;min-height:0;display:flex;flex-direction:column}
.photo-col figure img{flex:1;min-height:0;object-position:center 38%}
.photo-col figcaption{flex:0 0 auto;color:var(--text-2)}
.photo-tag{position:absolute;left:14px;top:14px;z-index:2;background:rgba(8,7,6,.76);border:1px solid var(--cult-dim);color:var(--cult-2);padding:5px 10px;border-radius:18px;font-size:var(--fs-label)}
.hint{flex:0 0 auto}
@media (prefers-reduced-motion:reduce){.current,.current-tag{transition:none}}
</style>
</head>
<body data-page="19" data-total="44">
<div id="stage"><main id="main">
  <div class="layout min0">
    <section class="calc min0" aria-label="保温量计算器">
      <div class="controls min0">
        <div class="slider-wrap min0">
          <div class="ctl">
            <label class="cl" for="clo">衣物隔热量</label>
            <input class="no-pan" id="clo" type="range" min="0" max="10" step="0.1" value="0">
            <output class="cv" id="cloVal" for="clo">0.0 clo</output>
          </div>
          <div class="anchors" aria-hidden="true">
            <span class="anchor first" style="left:0%">0 裸体</span>
            <span class="anchor" style="left:10%">1 衬衫长裤</span>
            <span class="anchor" style="left:40%">4 驯鹿皮双层衣</span>
            <span class="anchor" style="left:85%">8.5 极地远征装备</span>
            <span class="anchor last" style="left:100%">10</span>
          </div>
        </div>
        <div class="modes" role="group" aria-label="活动状态">
          <button class="btn" id="sit" type="button" aria-pressed="true">静坐</button>
          <button class="btn" id="walk" type="button" aria-pressed="false">行走</button>
        </div>
      </div>

      <div class="chart min0">
        <div class="chart-head">
          <div class="result"><span class="result-label">可居住下限</span><strong id="result">27.0 °C</strong><span class="result-note" id="power">静坐 · 约 100 W</span></div>
        </div>
        <div class="axis-area" id="axisArea" aria-label="共同气温轴，从零上40摄氏度到零下60摄氏度">
          <div class="axis"></div>
          <div id="ticks"></div>
          <div id="refs"></div>
          <div class="offscale">轴外：南极最低 <span class="num">−89.2 °C</span> →</div>
          <div id="gearRows"></div>
          <div class="current" id="needle"></div>
          <div class="current-tag" id="needleTag">裸体</div>
        </div>
      </div>
      <div class="hint">拖滑块加衣服，看能住到多冷的地方</div>
      <p class="statement">北极的人没有长出毛。<strong>他们发明的是“两层皮之间夹一层不流动的空气”这个想法</strong>——一个可以在一个冬天里教会全村人的想法。</p>
    </section>

    <aside class="photo-col min0">
      <figure>
        <span class="photo-tag">体外的解法</span>
        <img src="assets/img/inuit-parka.jpg" alt="因纽特人双层皮衣" title="因纽特人皮衣 · 斯德哥尔摩民族学博物馆藏 · Daderot · CC0">
        <figcaption>双层缝制、毛面朝内朝外各一层，之间留一层不流动的空气。</figcaption>
      </figure>
    </aside>
  </div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:2, title:'不长毛也能住北极', sub:'裸着的人只能待在 27 °C 以上。往北一步都得靠体外的东西。', foot:'到这一步，身体已经不再是那个决定"能住在哪里"的东西了。' });

(function(){
  var slider=document.getElementById('clo');
  var cloVal=document.getElementById('cloVal');
  var result=document.getElementById('result');
  var power=document.getElementById('power');
  var sit=document.getElementById('sit');
  var walk=document.getElementById('walk');
  var needle=document.getElementById('needle');
  var needleTag=document.getElementById('needleTag');
  var ticks=document.getElementById('ticks');
  var refs=document.getElementById('refs');
  var gearRows=document.getElementById('gearRows');
  var mode='sit';
  var MIN=-60, MAX=40;
  var presets=[
    {clo:0,name:'裸体'},
    {clo:1,name:'衬衫长裤'},
    {clo:4,name:'驯鹿皮双层衣'},
    {clo:8.5,name:'极地远征装备'}
  ];
  var places=[
    {t:-3.1,name:'北京一月均温 −3.1 °C'},
    {t:-18.4,name:'哈尔滨一月均温 −18.4 °C'},
    {t:-35,name:'北极冬季 −35 °C',arctic:true}
  ];
  function pos(t){return Deck.clamp((MAX-t)/(MAX-MIN)*100,0,100);}
  function tmin(clo){
    var flux=mode==='sit'?55.6:167;
    return 33-(clo+0.7)*0.155*flux;
  }
  function fmt(t){return (t<0?'−':'')+Math.abs(t).toFixed(1)+' °C';}
  function buildAxis(){
    ticks.innerHTML=''; refs.innerHTML='';
    [40,20,0,-20,-40,-60].forEach(function(t){
      var el=document.createElement('div'); el.className='tick'; el.style.left=pos(t)+'%';
      el.innerHTML='<span>'+(t>0?'+':'')+t+'°</span>'; ticks.appendChild(el);
    });
    places.forEach(function(p){
      var el=document.createElement('div'); el.className='ref'+(p.arctic?' arctic':''); el.style.left=pos(p.t)+'%';
      el.innerHTML='<span>'+p.name+'</span>'; refs.appendChild(el);
    });
  }
  function drawRows(){
    gearRows.innerHTML='';
    presets.forEach(function(p,i){
      var t=tmin(p.clo), x=pos(t);
      var row=document.createElement('div'); row.className='gear-row'; row.style.top=(91+i*34)+'px';
      row.innerHTML='<span class="name">'+p.name+' · <span class="num">'+p.clo+' clo</span></span><span class="range" style="width:'+x+'%"></span><span class="val" style="left:'+x+'%">'+(t<MIN?'＜ −60 °C':fmt(t))+'</span>';
      gearRows.appendChild(row);
    });
  }
  function update(){
    var c=Number(slider.value), t=tmin(c), x=pos(t);
    cloVal.textContent=c.toFixed(1)+' clo';
    result.textContent=fmt(t);
    power.textContent=mode==='sit'?'静坐 · 约 100 W':'行走 · 约 300 W';
    needle.style.left=x+'%'; needleTag.style.left=x+'%';
    needleTag.textContent=t<MIN?'低于轴下限':(c===0?'裸体':c.toFixed(1)+' clo');
    drawRows();
  }
  function setMode(next){
    mode=next;
    sit.setAttribute('aria-pressed',String(mode==='sit'));
    walk.setAttribute('aria-pressed',String(mode==='walk'));
    update();
  }
  slider.addEventListener('input',update);
  sit.addEventListener('click',function(){setMode('sit');});
  walk.addEventListener('click',function(){setMode('walk');});
  buildAxis(); update();
})();
</script>
</body></html>
