<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;}
.lesson{height:100%;display:flex;flex-direction:column;gap:14px;}
.workspace{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:26px;align-items:stretch;}
.tree-panel,.detail-panel{min-width:0;min-height:0;}
.tree-panel{padding:16px 18px 14px;display:flex;flex-direction:column;background:rgba(25,21,18,.72);}
.tree-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px;}
.tree-head .ttl{margin:0;}
.hier{flex:1 1 auto;min-height:0;border-color:var(--gene-dim);padding:16px 15px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;}
.root-label{display:flex;align-items:center;gap:10px;color:var(--gene-2);font-size:var(--fs-body);font-weight:700;line-height:1.3;}
.root-mark{width:10px;height:10px;border-radius:50%;background:var(--gene);box-shadow:0 0 0 5px rgba(224,145,58,.1);flex:0 0 auto;}
.hier>.lv{margin-left:5px;padding-left:17px;display:flex;flex-direction:column;gap:7px;}
.group-title{font-size:var(--fs-sec);line-height:1.35;font-weight:700;color:var(--text-2);display:flex;align-items:center;gap:8px;}
.group-title .tag{font-weight:500;letter-spacing:0;}
.case-list{display:grid;gap:5px;padding-left:7px;border-left:1px solid var(--line-soft);margin-left:3px;}
.case-btn{width:100%;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--text-2);font:600 var(--fs-sec)/1.25 var(--font-sans);text-align:left;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:9px;transition:background .14s,border-color .14s,color .14s;}
.case-btn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gene-dim);flex:0 0 auto;}
.case-btn:hover{background:var(--panel-2);color:var(--text);}
.case-btn[aria-pressed="true"]{background:rgba(224,145,58,.11);border-color:var(--gene-dim);color:var(--gene-2);}
.case-btn[aria-pressed="true"]::before{background:var(--gene);box-shadow:0 0 0 3px rgba(224,145,58,.12);}
.detail-panel{position:relative;padding:19px 24px 18px;border-color:var(--gene-dim);background:linear-gradient(135deg,rgba(34,27,22,.96),rgba(20,17,15,.9));display:flex;flex-direction:column;}
.detail-panel::before{content:"";position:absolute;left:-27px;top:50%;width:27px;height:1px;background:linear-gradient(90deg,var(--line),var(--gene));}
.detail-kicker{font-size:var(--fs-label);letter-spacing:.08em;color:var(--gene);font-weight:700;margin-bottom:4px;}
.detail-title{font-size:var(--fs-h2);line-height:1.25;margin:0 0 13px;color:var(--text);}
.facts{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:118px 1fr;grid-template-rows:repeat(4,1fr);align-items:center;gap:0 16px;border-top:1px solid var(--line);}
.fact-label,.fact-value{padding:11px 0;border-bottom:1px solid var(--line-soft);line-height:1.42;}
.fact-label{font-size:var(--fs-label);color:var(--text-3);letter-spacing:.04em;}
.fact-value{font-size:var(--fs-sec);color:var(--text);}
.fact-value.culture{color:var(--cult-2);}
.detail-note{margin-top:auto;padding-top:13px;display:flex;gap:9px;align-items:flex-start;font-size:var(--fs-sec);line-height:1.45;color:var(--text-2);}
.detail-note .arr{color:var(--cult);font-weight:700;}
.takeaway{flex:0 0 auto;border-left:4px solid var(--warn);padding:10px 16px;background:rgba(224,87,74,.065);font-size:var(--fs-lead);line-height:1.45;color:var(--text-2);}
.takeaway strong{color:var(--warn);}
@media (prefers-reduced-motion:reduce){.case-btn{transition:none;}}
</style>
</head>
<body data-page="20" data-total="44">
<div id="stage"><main id="main">
  <div class="lesson">
    <section class="workspace min0" aria-label="近一万年的人类基因适应分类与案例详情">
      <div class="tree-panel panel min0">
        <div class="tree-head">
          <div class="ttl gene">两层归属</div>
          <div class="hint">点任意一项看细节</div>
        </div>
        <div class="hier box min0">
          <div class="root-label"><span class="root-mark"></span>近一万年的人类基因适应</div>

          <div class="lv cult">
            <div class="group-title">由文化触发的 <span class="tag cult">生活方式先出现</span></div>
            <div class="case-list">
              <button class="case-btn" type="button" data-case="lactase" aria-pressed="true">乳糖酶持续</button>
              <button class="case-btn" type="button" data-case="amy1" aria-pressed="false">淀粉酶 AMY1 拷贝数</button>
              <button class="case-btn" type="button" data-case="hbb" aria-pressed="false">疟疾区的血红蛋白变异</button>
            </div>
          </div>

          <div class="lv gene">
            <div class="group-title">由环境直接触发的 <span class="tag gene">环境直接施压</span></div>
            <div class="case-list">
              <button class="case-btn" type="button" data-case="skin" aria-pressed="false">皮肤色素（SLC24A5 等）</button>
              <button class="case-btn" type="button" data-case="epas1" aria-pressed="false">高原低氧（EPAS1）</button>
            </div>
          </div>
        </div>
      </div>

      <aside class="detail-panel panel min0" aria-live="polite">
        <div class="detail-kicker" id="detailKind">由文化触发</div>
        <h2 class="detail-title" id="detailTitle">乳糖酶持续</h2>
        <div class="facts">
          <div class="fact-label">何时</div><div class="fact-value num" id="detailWhen">欧洲约 7500 年前；东非独立起源另有变异</div>
          <div class="fact-label">哪些人群</div><div class="fact-value" id="detailWho">北欧成人 &gt;90%，东亚 &lt;5%</div>
          <div class="fact-label">涉及什么</div><div class="fact-value" id="detailWhat"><span class="num">MCM6/LCT</span> 上游的单个碱基（<span class="num">−13910 C→T</span>）</div>
          <div class="fact-label">文化前提</div><div class="fact-value culture" id="detailCulture">先驯化了牛羊、先会挤奶</div>
        </div>
        <div class="detail-note"><span class="arr">文化 → 选择压力 → 基因</span><span id="detailNote">先有生活方式，基因变化才变得有利。</span></div>
      </aside>
    </section>

    <div class="takeaway">一万年，<strong>几个位点</strong>。同一段时间里，另一条通道造出了文字、青铜、抗生素、集成电路和火箭。</div>
  </div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:2, title:'基因也没闲着', sub:'一万年里人类确实变了一些基因。看清楚变了多少，才知道另一条通道有多快。', foot:'这些变化都有一个共同点：先有文化，后有基因。' });

var cases = {
  lactase: {
    kind:'由文化触发', title:'乳糖酶持续',
    when:'欧洲约 7500 年前；东非独立起源另有变异',
    who:'北欧成人 >90%，东亚 <5%',
    what:'<span class="num">MCM6/LCT</span> 上游的单个碱基（<span class="num">−13910 C→T</span>）',
    culture:'先驯化了牛羊、先会挤奶', cultural:true
  },
  amy1: {
    kind:'由文化触发', title:'淀粉酶 AMY1',
    when:'农业以来',
    who:'高淀粉饮食人群拷贝数明显更多',
    what:'基因<strong>拷贝数</strong>变化，不是单点突变',
    culture:'先有了农业和熟食', cultural:true
  },
  hbb: {
    kind:'由文化触发', title:'血红蛋白变异（如镰刀型）',
    when:'数千年',
    who:'疟疾流行区',
    what:'<span class="num">HBB</span> 等',
    culture:'先有了定居和农田积水，疟疾才成为强选择压', cultural:true
  },
  skin: {
    kind:'由环境直接触发', title:'皮肤色素',
    when:'约 6000–12000 年（欧洲的 SLC24A5 扫荡）',
    who:'高纬人群',
    what:'若干色素相关位点',
    culture:'无（纬度直接给的）', cultural:false
  },
  epas1: {
    kind:'由环境直接触发', title:'高原低氧',
    when:'估计约 3000–8000 年（区间有分歧）',
    who:'藏族人群',
    what:'<span class="num">EPAS1</span>，来自丹尼索瓦人的渐渗片段',
    culture:'无（海拔直接给的）', cultural:false
  }
};

var buttons = Array.prototype.slice.call(document.querySelectorAll('.case-btn'));
var kind = document.getElementById('detailKind');
var title = document.getElementById('detailTitle');
var when = document.getElementById('detailWhen');
var who = document.getElementById('detailWho');
var what = document.getElementById('detailWhat');
var culture = document.getElementById('detailCulture');
var note = document.getElementById('detailNote');

function showCase(key){
  var d = cases[key];
  buttons.forEach(function(btn){ btn.setAttribute('aria-pressed', btn.dataset.case === key ? 'true' : 'false'); });
  kind.textContent = d.kind;
  kind.style.color = d.cultural ? 'var(--cult)' : 'var(--gene)';
  title.textContent = d.title;
  when.textContent = d.when;
  who.textContent = d.who;
  what.innerHTML = d.what;
  culture.textContent = d.culture;
  culture.classList.toggle('culture', d.cultural);
  note.textContent = d.cultural ? '先有生活方式，基因变化才变得有利。' : '这里没有文化前提，选择压力来自环境本身。';
}
buttons.forEach(function(btn){ btn.addEventListener('click', function(){ showCase(btn.dataset.case); }); });
</script>
</body></html>
