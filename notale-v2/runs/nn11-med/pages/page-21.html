<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.argument{
  width:min(1320px,100%);
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:30px;
}
.claim{
  max-width:1240px;
  padding:18px 24px 19px 18px;
  border-left-color:var(--cult);
  background:linear-gradient(90deg,#132023,#171512 68%,#151210);
}
.claim .thesis{
  display:block;
  margin-bottom:8px;
}
.claim .gene{color:var(--gene-2);}
.claim .cult{color:var(--cult-2);}
.claim .explain{
  display:block;
  color:var(--text-2);
  font-size:var(--fs-lead);
  font-weight:500;
  line-height:1.5;
}
.supports{
  gap:0;
  margin-left:20px;
  padding:10px 20px;
  border:1px solid var(--line-soft);
  border-radius:var(--r);
  background:var(--panel);
}
.supports .trunk{
  left:6px;
  top:14px;
  bottom:14px;
  background:linear-gradient(180deg,var(--cult-dim),var(--line) 45%,var(--gene-dim));
}
.support{
  min-height:64px;
  display:flex;
  align-items:center;
  padding-top:7px;
  padding-bottom:7px;
  border-bottom:1px solid var(--line-soft);
}
.support:last-child{border-bottom:0;}
.support::before{
  top:50%;
  background:var(--text-3);
}
.support .from{color:var(--cult-2);}
.support .to{color:var(--gene-2);}
.support .pressure{color:var(--text-2);}
.limit{
  position:relative;
  margin-left:20px;
  padding:22px 22px 22px 26px;
  border:1px solid rgba(224,87,74,.42);
  border-left:5px solid var(--warn);
  border-radius:var(--r);
  background:linear-gradient(90deg,#241412,#1d1513 58%,#181311);
  font-size:var(--fs-sec);
  line-height:1.55;
  color:var(--text-2);
}
.limit strong{color:#fff;}
.limit .break{color:#f0968c;font-weight:700;}
</style>
</head>
<body data-page="21" data-total="44">
<div id="stage">
  <main id="main">
    <section class="argument min0" aria-label="基因与文化协同演化的主张和支撑">
      <div class="claim min0">
        <span class="thesis"><span class="cult">文化</span>不是<span class="gene">基因</span>的产物，是<span class="gene">基因</span>的环境。</span>
        <span class="explain">人先改变自己的活法，活法再改变选择压力，基因才跟着变。</span>
      </div>

      <div class="supports min0" aria-label="四条支撑">
        <span class="trunk" aria-hidden="true"></span>
        <div class="support"><span><span class="from">先驯化牛羊、先会挤奶</span> → <span class="to">才有了乳糖酶持续的选择压力</span></span></div>
        <div class="support"><span><span class="from">先有农业和熟食</span> → <span class="to">才有了淀粉酶拷贝数的选择压力</span></span></div>
        <div class="support"><span><span class="from">先定居、先有积水的农田</span> → <span class="pressure">疟疾才成为强选择压</span> → <span class="to">血红蛋白变异</span></span></div>
        <div class="support"><span><span class="from">先能在高原定居</span> → <span class="to">EPAS1 才有意义</span></span></div>
      </div>

      <aside class="limit min0">
        但这条回路有一个前提：<strong>基因得跟得上。</strong><br>
        上面四个例子的共同点是——那些活法<strong>持续了几千年没怎么变</strong>，基因才有时间跟。<br>
        <span class="break">一旦活法变得比几千年快得多，回路就断了。</span>
      </aside>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>

Chrome.mount({ act:2, title:'基因—文化协同演化', sub:'幕 II 收束。', foot:'两条通道都在跑，但速度差得离谱。下一页把这个差量算出来。' });
</script>
</body></html>
