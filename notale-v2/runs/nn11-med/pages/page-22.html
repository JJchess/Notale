<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:12px}
.work{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 302px;gap:18px}
.chart-shell{min-width:0;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--line);border-bottom:1px solid var(--line-soft);padding-top:8px}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 8px 3px 124px}
.axis-caption{font-size:var(--fs-label);color:var(--text-3)}
.legend{flex-wrap:nowrap}
#chart{flex:1 1 auto;min-height:0;width:100%}
.readout{min-width:0;min-height:0;display:flex;flex-direction:column;padding:17px 19px 15px;background:linear-gradient(180deg,rgba(224,145,58,.09),rgba(25,21,18,.96));border:1px solid var(--gene-dim);border-radius:var(--r)}
.readout .ttl{margin-bottom:13px}
.metric{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:8px;padding:9px 0;border-top:1px solid rgba(224,145,58,.18)}
.metric:first-of-type{border-top:0}
.metric .k{font-size:var(--fs-sec);color:var(--text-2)}
.metric .v{font-family:var(--font-num);font-size:var(--fs-h2);font-variant-numeric:tabular-nums;color:var(--gene-2);white-space:nowrap}
.metric.ratio{margin-top:5px;padding-top:13px}
.metric.ratio .v{font-size:36px;color:var(--text)}
.readout .note{margin-top:auto;padding-top:11px;border-top:1px solid var(--line);line-height:1.45}
.control-row{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) 302px;gap:18px;align-items:center}
.control-wrap{min-width:0;padding:8px 14px 7px;border:1px solid var(--line-soft);border-radius:var(--r);background:rgba(25,21,18,.72)}
.control-wrap .ctl{--acc:var(--gene)}
.control-wrap .cl{color:var(--gene-2);font-weight:700}
.control-wrap .hint{margin-top:3px}
.scale-ends{display:flex;justify-content:space-between;margin:0 58px 0 117px;font-family:var(--font-num);font-size:var(--fs-tick);line-height:1.2;color:var(--text-3)}
.punch{min-width:0;display:flex;align-items:center;border-left:4px solid var(--gene);padding:5px 0 5px 17px;font-size:var(--fs-sec);line-height:1.45;color:var(--text-2)}
.punch strong{color:var(--gene-2)}
.punch .cult-word{color:var(--cult-2);font-weight:700}
</style>
</head>
<body data-page="22" data-total="44">
<div id="stage"><main id="main">
  <section class="work min0" aria-label="基因适应与技术普及所需时间的共同对数轴比较">
    <div class="chart-shell min0">
      <div class="chart-head">
        <div class="axis-caption">同一基准：从 1% 到 90% 所需时间</div>
        <div class="legend" aria-label="图例">
          <span class="li"><i class="sw" style="background:var(--gene)"></i>基因 / 身体</span>
          <span class="li"><i class="sw" style="background:var(--cult)"></i>技术 / 体外传承</span>
        </div>
      </div>
      <div id="chart" role="img" aria-label="所有案例共用从一年到十万年的对数横轴。基因案例集中在数千到数万年，技术案例集中在十到七十年，两簇完全不重叠。"></div>
    </div>
    <aside class="readout min0" aria-live="polite">
      <div class="ttl gene">当前选择模型</div>
      <div class="metric"><span class="k">选择系数 s</span><span class="v" id="out-s">0.020</span></div>
      <div class="metric"><span class="k">需要</span><span class="v" id="out-gen">340 代</span></div>
      <div class="metric"><span class="k">约合</span><span class="v" id="out-year">8,500 年</span></div>
      <div class="metric ratio"><span class="k">技术簇中位数的</span><span class="v" id="out-ratio">309 倍</span></div>
      <p class="note"><span class="num">s = 0.02</span> 已经是很强的选择；多数位点远小于它。</p>
    </aside>
  </section>

  <section class="control-row min0">
    <div class="control-wrap min0">
      <label class="ctl" for="sel">
        <span class="cl">选择系数 s</span>
        <input id="sel" class="no-pan" type="range" min="0" max="1000" step="any" value="588.5919101" aria-label="选择系数 s，从 0.002 到 0.10，对数刻度">
        <span class="cv" id="slider-v">0.020</span>
      </label>
      <div class="scale-ends"><span>0.002</span><span>对数刻度</span><span>0.10</span></div>
      <div class="hint">拖选择系数，看基因那一根条能跑多快</div>
    </div>
    <div class="punch"><span>即使 <strong>s = 0.10</strong>：<strong>68 代、约 1,700 年</strong>，仍比智能手机普及慢 <strong>170 倍</strong>。而体外通道可以<span class="cult-word">同时固定成千上万项</span>。</span></div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
Chrome.mount({ act:2, title:'速度的分岔', sub:'固定一项新适应要多久？两条通道的答案差两到三个数量级。', foot:'快的那条一旦启动，就不只是快一点——它会把整条曲线的形状换掉。' });

(function(){
  var p1=0.01, p2=0.90, generationYears=25;
  var oddsLog=Math.log((p2/(1-p2))/(p1/(1-p1)));
  var techYears=[60,60,70,30,25,20,15,10];
  var techMedian=27.5;
  var rows=[
    '选择模型（当前）','乳糖酶持续','欧洲肤色扫荡','EPAS1',
    '电力','汽车','电话','冰箱','电视','移动电话','互联网','智能手机'
  ];
  var values=[8500,7500,9000,5500,60,60,70,30,25,20,15,10];
  var labels=['','约 7,500 年','约 6,000–12,000 年','约 3,000–8,000 年','约 60 年','约 60 年','约 70 年','约 30 年','约 25 年','约 20 年','约 15 年','约 10 年'];
  var chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
  var gene=Deck.token('--gene'), gene2=Deck.token('--gene-2'), geneDim=Deck.token('--gene-dim');
  var cult=Deck.token('--cult'), cult2=Deck.token('--cult-2');
  var text=Deck.token('--text'), text2=Deck.token('--text-2'), text3=Deck.token('--text-3');
  var line=Deck.token('--line'), soft=Deck.token('--line-soft');

  function seriesData(){
    return values.map(function(v,i){
      return {
        value:v,
        itemStyle:{
          color:i===0?gene:(i<4?geneDim:cult),
          borderColor:i===0?gene2:(i<4?gene:cult2),
          borderWidth:i===0?1:0,
          borderRadius:[0,3,3,0]
        },
        label:{
          show:true,
          position:'right',
          distance:8,
          color:i<4?gene2:cult2,
          fontSize:14,
          formatter:i===0?formatYear(v):labels[i]
        }
      };
    });
  }
  function displayYears(n){ return n>=1000?Math.round(n/100)*100:Math.round(n); }
  function formatYear(n){ return '约 '+displayYears(n).toLocaleString('zh-CN')+' 年'; }
  function axisFmt(v){
    if(v===1)return '1 年'; if(v===10)return '10'; if(v===100)return '100';
    if(v===1000)return '1,000'; if(v===10000)return '1 万'; if(v===100000)return '10 万年'; return '';
  }
  function option(){ return {
    animationDuration:220,
    textStyle:{fontFamily:Deck.token('--font-sans'),fontSize:16,color:text2},
    grid:{left:124,right:148,top:7,bottom:43,containLabel:false},
    tooltip:{show:false},
    xAxis:{
      type:'log',logBase:10,min:1,max:100000,
      axisLine:{lineStyle:{color:line,width:1}},axisTick:{show:true,lineStyle:{color:line}},
      minorTick:{show:false},minorSplitLine:{show:false},
      splitLine:{show:true,lineStyle:{color:soft,type:'dashed'}},
      axisLabel:{color:text3,fontSize:14,margin:12,formatter:axisFmt}
    },
    yAxis:{
      type:'category',inverse:true,data:rows,
      axisLine:{show:false},axisTick:{show:false},
      axisLabel:{color:function(_,i){return i<4?gene2:cult2;},fontSize:14,margin:12,width:112,overflow:'truncate'},
      splitLine:{show:false}
    },
    series:[{
      type:'bar',barWidth:13,data:seriesData(),silent:true,
      markLine:{
        silent:true,symbol:'none',
        label:{show:true,position:'insideStartTop',fontSize:14,color:text3,formatter:'基因锚点 ↑   技术普及 ↓'},
        lineStyle:{color:line,width:1},
        data:[{yAxis:3.5}]
      }
    }]
  };}
  chart.setOption(option());

  var slider=document.getElementById('sel');
  var outS=document.getElementById('out-s'), outGen=document.getElementById('out-gen');
  var outYear=document.getElementById('out-year'), outRatio=document.getElementById('out-ratio');
  var sliderV=document.getElementById('slider-v');
  function sliderToS(raw){
    return Math.exp(Math.log(0.002)+(raw/1000)*Math.log(0.10/0.002));
  }
  function update(){
    var s=sliderToS(+slider.value);
    var gens=oddsLog/s;
    var years=gens*generationYears;
    values[0]=years;
    outS.textContent=s.toFixed(s<0.01?3:2);
    sliderV.textContent=outS.textContent;
    outGen.textContent=Math.round(gens).toLocaleString('zh-CN')+' 代';
    outYear.textContent=displayYears(years).toLocaleString('zh-CN')+' 年';
    outRatio.textContent=Math.round(years/techMedian).toLocaleString('zh-CN')+' 倍';
    chart.setOption({series:[{data:seriesData()}]});
  }
  slider.addEventListener('input',update);
  update();
  Deck.onResize(function(){chart.resize();});
})();
</script>
</body></html>
