<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:12px;}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;flex:0 0 auto;}
.toolbar .hint{margin-left:auto;}
.mode{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto;}
.mode .btn{border:0;border-radius:0;min-width:116px;}
.mode .btn+.btn{border-left:1px solid var(--line);}
.mode .btn[aria-pressed="true"]{background:var(--text);color:var(--bg-deep);}
.viz{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) 118px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);}
.chart-wrap{position:relative;min-height:0;}
#chart{position:absolute;inset:0;}
.zoom-link{position:absolute;right:74px;bottom:10px;width:1px;height:28px;background:linear-gradient(var(--text-3),transparent);opacity:.6;pointer-events:none;}
.doubling{display:grid;grid-template-columns:186px minmax(0,1fr);align-items:center;gap:22px;padding:10px 68px 8px 12px;border-top:1px dashed var(--line);background:linear-gradient(90deg,rgba(236,231,223,.025),transparent 70%);}
.dbl-head{align-self:start;padding-top:3px;}
.dbl-head strong{display:block;font-size:var(--fs-sec);font-weight:650;}
.dbl-head span{display:block;font-size:var(--fs-label);color:var(--text-3);margin-top:3px;}
.dbl-track{position:relative;height:82px;min-width:0;}
.dbl-axis{position:absolute;left:0;right:0;top:39px;height:1px;background:var(--line);}
.dpt{position:absolute;top:28px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--text);z-index:2;}
.dpt::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--text);}
.dlab{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;font:600 var(--fs-label)/1.2 var(--font-sans);color:var(--text);}
.dlab .num{font-size:var(--fs-sec);}
.span{position:absolute;top:53px;height:20px;border-top:2px solid var(--text-2);color:var(--text-2);text-align:center;font:600 var(--fs-label)/1.2 var(--font-num);}
.span::before{content:"";position:absolute;left:0;top:-5px;width:1px;height:8px;background:var(--text-2);}
.span::after{content:"›";position:absolute;right:-2px;top:-13px;font:700 var(--fs-h2)/1 var(--font-sans);color:var(--text);}
.span b{position:relative;top:3px;background:var(--bg);padding:0 7px;color:var(--text);font-weight:650;}
.insight{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:28px;}
.reading{display:flex;align-items:flex-start;gap:13px;padding:8px 14px 7px 0;min-width:0;}
.reading+.reading{border-left:1px solid var(--line-soft);padding-left:24px;}
.reading .mode-tag{flex:0 0 auto;font-size:var(--fs-label);font-weight:700;color:var(--text-3);border:1px solid var(--line);border-radius:20px;padding:3px 10px;white-space:nowrap;}
.reading p{margin:0;font-size:var(--fs-sec);line-height:1.5;color:var(--text-2);}
.reading strong{color:var(--text);}
.reading.active .mode-tag{color:var(--text);border-color:var(--text-2);}
.reading:not(.active){opacity:.54;}
@media (prefers-reduced-motion:reduce){.mode .btn{transition:none;}}
</style>
</head>
<body data-page="23" data-total="44">
<div id="stage"><main id="main">
  <div class="toolbar min0">
    <div class="hint">换成对数纵轴，看这条曲线的真实形状</div>
    <div class="mode" role="group" aria-label="纵轴尺度">
      <button class="btn" id="linearBtn" type="button" aria-pressed="true">线性纵轴</button>
      <button class="btn" id="logBtn" type="button" aria-pressed="false">对数纵轴</button>
    </div>
  </div>

  <section class="viz min0" aria-label="从公元前一万年至2025年的世界人口曲线">
    <div class="chart-wrap min0">
      <div id="chart" role="img" aria-label="世界人口从公元前一万年的四百万人增长到2025年的八十二亿人，最近两百年曲线陡升"></div>
      <div class="zoom-link" aria-hidden="true"></div>
    </div>
    <div class="doubling min0" aria-label="人口翻倍所需时间">
      <div class="dbl-head">
        <strong>曲线末端放大</strong>
        <span>翻倍所需时间在缩短</span>
      </div>
      <div class="dbl-track min0">
        <div class="dbl-axis"></div>
        <div class="dlab" style="left:0%"><span class="num">10</span> 亿<br><span class="num">1800</span></div>
        <div class="dlab" style="left:57.21%"><span class="num">20</span> 亿<br><span class="num">1927</span></div>
        <div class="dlab" style="left:78.38%"><span class="num">40</span> 亿<br><span class="num">1974</span></div>
        <div class="dlab" style="left:100%"><span class="num">80</span> 亿<br><span class="num">2022</span></div>
        <i class="dpt" style="left:0%"></i><i class="dpt" style="left:57.21%"></i><i class="dpt" style="left:78.38%"></i><i class="dpt" style="left:100%"></i>
        <div class="span" style="left:0%;width:57.21%"><b>127 年</b></div>
        <div class="span" style="left:57.21%;width:21.17%"><b>47 年</b></div>
        <div class="span" style="left:78.38%;width:21.62%"><b>48 年</b></div>
      </div>
    </div>
  </section>

  <div class="insight min0" aria-live="polite">
    <div class="reading active" id="linearRead">
      <span class="mode-tag">线性轴</span>
      <p>它像<strong>一堵墙</strong>：一万两千年里几乎贴着零，最后两百年突然立起。不是曲线变了，是眼睛只能看见最后一段。</p>
    </div>
    <div class="reading" id="logRead">
      <span class="mode-tag">对数轴</span>
      <p>纯指数应该是一条直线；这里却<strong>向上弯</strong>。1800 年后增长率本身还在变大——超指数，直到 1970 年前后才拐头。</p>
    </div>
  </div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
Chrome.mount({ act:3, title:'人口曲线', sub:'指数长什么样——以及为什么这条曲线比指数还凶。', foot:'人多了，每个人手上的能量也多了。下一页看那笔账。' });

var population = [
  [-10000,4],[-5000,5],[-3000,14],[-1000,50],[1,200],[1000,265],
  [1500,460],[1700,610],[1800,990],[1850,1260],[1900,1650],[1950,2536],
  [1970,3700],[2000,6143],[2025,8200]
];
var chart = echarts.init(document.getElementById('chart'), null, {renderer:'svg'});
var isLog = false;

function yearLabel(value){
  if(value < 0) return '前 ' + Math.abs(value) + ' 年';
  return String(Math.round(value));
}
function option(){
  return {
    animationDuration: Deck.reduced() ? 0 : 650,
    animationDurationUpdate: Deck.reduced() ? 0 : 650,
    animationEasingUpdate:'cubicInOut',
    textStyle:{fontFamily:getComputedStyle(document.documentElement).getPropertyValue('--font-sans'),fontSize:16,color:'#b9ada0'},
    grid:{left:76,right:38,top:24,bottom:58,containLabel:false},
    tooltip:{show:false},
    xAxis:{
      type:'value',min:-10000,max:2025,interval:2000,
      name:'时间（年）',nameLocation:'end',nameGap:12,
      nameTextStyle:{fontSize:14,color:'#8b8078'},
      axisLine:{lineStyle:{color:'#594d43'}},axisTick:{lineStyle:{color:'#594d43'}},
      axisLabel:{fontSize:14,color:'#9f9389',formatter:yearLabel,hideOverlap:true},
      splitLine:{show:false}
    },
    yAxis:{
      type:isLog?'log':'value',logBase:10,min:isLog?1:0,max:isLog?10000:9000,
      name:'世界人口（百万人）',nameLocation:'end',nameGap:10,
      nameTextStyle:{fontSize:14,color:'#8b8078',align:'left'},
      axisLine:{show:true,lineStyle:{color:'#594d43'}},axisTick:{show:false},
      axisLabel:{fontSize:14,color:'#9f9389',formatter:function(v){
        if(isLog) return v>=1000?(v/1000)+'k':String(v);
        return v===0?'0':(v/1000)+'k';
      }},
      splitLine:{lineStyle:{color:'#2a231e',type:'dashed'}}
    },
    series:[{
      name:'世界人口',type:'line',data:population,showSymbol:true,symbol:'circle',symbolSize:6,
      smooth:false,clip:true,
      lineStyle:{width:4,color:'#ece7df'},itemStyle:{color:'#0f0d0c',borderColor:'#ece7df',borderWidth:2},
      areaStyle:isLog?undefined:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(236,231,223,.18)'},{offset:1,color:'rgba(236,231,223,0)'}]}},
      markLine:{silent:true,symbol:['none','none'],label:{show:true,fontSize:14,color:'#b9ada0',formatter:'1970 前后\n增长率拐头',position:'insideStartTop'},lineStyle:{color:'#8b8078',type:'dashed',width:1},data:[{xAxis:1970}]},
      markPoint:{silent:true,symbol:'circle',symbolSize:10,label:{show:false},itemStyle:{color:'#ece7df',borderColor:'#0f0d0c',borderWidth:2},data:[
        {coord:[1800,1000]},{coord:[1927,2000]},{coord:[1974,4000]},{coord:[2022,8000]}
      ]}
    }]
  };
}
function setMode(log){
  isLog = log;
  document.getElementById('linearBtn').setAttribute('aria-pressed',String(!log));
  document.getElementById('logBtn').setAttribute('aria-pressed',String(log));
  document.getElementById('linearRead').classList.toggle('active',!log);
  document.getElementById('logRead').classList.toggle('active',log);
  chart.setOption(option(),true);
}
document.getElementById('linearBtn').addEventListener('click',function(){setMode(false);});
document.getElementById('logBtn').addEventListener('click',function(){setMode(true);});
setMode(false);
Deck.onResize(function(){chart.resize();});
</script>
</body></html>
