<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:13px}
.era-control{flex:0 0 auto;padding:12px 18px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line-soft)}
.era-control .ctl{gap:16px}
.era-control .cl{font-weight:700;color:var(--text)}
.era-control input{--acc:var(--cult)}
.tick-labels{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:4px 4px 0 86px;color:var(--text-3);font-size:var(--fs-tick);line-height:1.25;text-align:center}
.tick-labels span.on{color:var(--cult-2);font-weight:700}
.workbench{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1.9fr) minmax(390px,.9fr);gap:18px}
.viz{display:flex;flex-direction:column;gap:10px;min-height:0;padding:15px 20px 14px;background:linear-gradient(145deg,rgba(34,27,22,.72),rgba(18,15,13,.5));border:1px solid var(--line-soft);border-radius:var(--r)}
.viz-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
.era-name{font-size:var(--fs-h2);font-weight:700;line-height:1.25}
.estimate{font-size:var(--fs-label);color:var(--text-3);border:1px solid var(--line);border-radius:20px;padding:3px 10px;white-space:nowrap}
.energy-chart{flex:0 0 auto}
.axis{position:relative;height:31px;margin-left:104px;border-bottom:1px solid var(--line)}
.axis::before{content:"kcal / 天";position:absolute;right:0;top:-5px;color:var(--text-3);font-size:var(--fs-tick)}
.axis-tick{position:absolute;bottom:-6px;width:1px;height:8px;background:var(--line)}
.axis-tick span{position:absolute;top:10px;left:0;transform:translateX(-50%);font-family:var(--font-num);font-size:var(--fs-tick);color:var(--text-3);white-space:nowrap}
.axis-tick:last-child span{transform:translateX(-100%)}
.bar-row{display:grid;grid-template-columns:94px minmax(0,1fr);align-items:center;gap:10px;margin-top:22px}
.bar-label{font-size:var(--fs-label);color:var(--text-2);text-align:right}
.energy-track{height:44px;position:relative;background:#27211c;border-radius:4px;overflow:visible}
.energy-bar{height:100%;min-width:2px;background:linear-gradient(90deg,var(--cult-dim),var(--cult));border-radius:4px;transition:width .24s ease;box-shadow:0 0 18px rgba(95,200,216,.12)}
.food-mark{position:absolute;left:0.869565%;top:-7px;bottom:-7px;width:2px;background:var(--gene);z-index:2}
.food-mark span{position:absolute;left:8px;top:-2px;color:var(--gene-2);font-size:var(--fs-tick);white-space:nowrap}
.icon-zone{flex:1 1 auto;min-height:0;border-top:1px solid var(--line-soft);padding-top:10px;display:flex;flex-direction:column}
.icon-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:7px}
.icon-title{font-family:var(--font-num);font-size:var(--fs-h2);font-weight:700;line-height:1.25;color:var(--text)}
.icon-title .divide{color:var(--text-3);font-size:var(--fs-sec);font-family:var(--font-sans);font-weight:400}
.icon-key{font-size:var(--fs-label);color:var(--cult-2);font-weight:700}
.people{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:52px;gap:6px 10px;align-content:center;padding:4px 12px;border-left:2px solid var(--gene-dim)}
.person{width:100%;height:50px;color:var(--cult);filter:drop-shadow(0 0 3px rgba(95,200,216,.12))}
.person.partial{opacity:.45}
.readout{min-height:0;display:flex;flex-direction:column;gap:12px}
.read-panel{flex:0 0 auto;padding:16px 18px;border:1px solid var(--cult-dim);border-radius:var(--r);background:rgba(30,77,86,.1)}
.read-panel .ttl{color:var(--cult);margin-bottom:8px}
.metric{padding:9px 0;border-bottom:1px solid var(--line-soft)}
.metric:last-child{border-bottom:0}
.metric .k{font-size:var(--fs-label);color:var(--text-3)}
.metric .v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:var(--fs-h2);font-weight:700;line-height:1.25;color:var(--text)}
.metric.primary .v{font-size:36px;color:var(--cult-2)}
.china-claim{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:16px 18px;border-left:4px solid var(--cult);background:linear-gradient(90deg,rgba(95,200,216,.1),transparent)}
.china-claim strong{font-size:var(--fs-lead);line-height:1.45;color:var(--text)}
.china-claim .num36{font-family:var(--font-num);font-size:36px;color:var(--cult-2)}
.china-claim p{margin:8px 0 0;color:var(--text-2);font-size:var(--fs-sec);line-height:1.5}
.bottomline{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.method{font-size:var(--fs-label);color:var(--text-3)}
@media (prefers-reduced-motion:reduce){.energy-bar{transition:none}}
</style>
</head>
<body data-page="24" data-total="44">
<div id="stage"><main id="main">
  <section class="era-control no-pan" aria-label="时代选择">
    <div class="ctl">
      <span class="cl">选时代</span>
      <input id="era" type="range" min="0" max="8" step="1" value="6" aria-label="选择时代">
      <span class="cv" id="eraShort">今天·全球</span>
    </div>
    <div class="tick-labels" id="tickLabels" aria-hidden="true"></div>
  </section>

  <section class="workbench min0">
    <div class="viz min0">
      <div class="viz-top">
        <div class="era-name" id="eraName">全球平均</div>
        <div class="estimate">数量级估计</div>
      </div>

      <div class="energy-chart" aria-label="各时代共用的每日能耗刻度">
        <div class="axis" id="axis"></div>
        <div class="bar-row">
          <div class="bar-label">人均能耗</div>
          <div class="energy-track">
            <div class="food-mark"><span>1 个人的食物 = 2,000</span></div>
            <div class="energy-bar" id="energyBar"></div>
          </div>
        </div>
      </div>

      <div class="icon-zone min0">
        <div class="icon-head">
          <span class="icon-title" id="equation">51,700 <span class="divide">÷ 2,000 kcal / 天 =</span> 26 人</span>
          <span class="icon-key" id="iconKey">1 个图标 = 1 人</span>
        </div>
        <div class="people min0" id="people" aria-label="能量当量人图标阵列"></div>
      </div>
    </div>

    <aside class="readout min0">
      <div class="read-panel">
        <div class="ttl">同一换算单位</div>
        <div class="metric"><div class="k">人均能耗</div><div class="v" id="kcalValue">51,700 kcal / 天</div></div>
        <div class="metric primary"><div class="k">能量当量人</div><div class="v" id="peopleValue">26 人</div></div>
        <div class="metric"><div class="k">相对原始人</div><div class="v" id="relativeValue">26 倍</div></div>
      </div>
      <div class="china-claim">
        <strong>今天一个中国人的生活，相当于有 <span class="num36">36</span> 个人全天候只为你一个人干活。</strong>
        <p>这 36 个“人”不吃饭、不睡觉、也不领工资——他们是煤、石油、天然气和铀。</p>
      </div>
    </aside>
  </section>

  <div class="bottomline">
    <div class="hint">拖动选时代，看有多少“人”在替你干活</div>
    <div class="method">当量人 = kcal / 天 ÷ 2,000；现代锚点按一次能源口径换算</div>
  </div>

  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <symbol id="personSymbol" viewBox="0 0 28 48">
      <circle cx="14" cy="7" r="5" fill="currentColor"/>
      <path d="M9 14 Q14 11 19 14 L22 29 L18 30 L17 22 L17 45 L12.5 45 L12.5 31 L10.5 45 L6 45 L10 22 L9 30 L5 29 Z" fill="currentColor"/>
    </symbol>
  </svg>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:3, title:'有多少人在替你干活', sub:'把人均能耗除以一个人一天的食物热量，得到的数就是"能量当量人"。', foot:'人口和能量都进了指数。剩下的问题是：为什么会加速？' });

(function(){
  var GJ_TO_KCAL_DAY = 1e9 / 365 / 4184;
  var data = [
    {name:'原始人（只有食物，无火）', short:'原始人', kcal:2000},
    {name:'狩猎采集（用火）', short:'狩猎采集', kcal:5000},
    {name:'早期农业', short:'早期农业', kcal:12000},
    {name:'发达农业', short:'发达农业', kcal:26000},
    {name:'工业社会（19 世纪）', short:'工业社会', kcal:77000},
    {name:'技术社会（1970 年代美国）', short:'1970s 美国', kcal:230000},
    {name:'全球平均', short:'今天·全球', gj:79},
    {name:'中国', short:'今天·中国', gj:111},
    {name:'美国', short:'今天·美国', gj:280}
  ];
  data.forEach(function(d){
    if (d.gj) d.kcal = d.gj * GJ_TO_KCAL_DAY;
    d.eq = d.kcal / 2000;
  });

  var maxKcal = 230000;
  var range = document.getElementById('era');
  var axis = document.getElementById('axis');
  var labels = document.getElementById('tickLabels');
  var people = document.getElementById('people');
  var NS = 'http://www.w3.org/2000/svg';
  [0,50000,100000,150000,200000,230000].forEach(function(v){
    var t = document.createElement('i');
    t.className = 'axis-tick';
    t.style.left = (v/maxKcal*100) + '%';
    var s = document.createElement('span');
    s.textContent = v === 0 ? '0' : (v/1000) + 'k';
    t.appendChild(s); axis.appendChild(t);
  });
  data.forEach(function(d){
    var s = document.createElement('span'); s.textContent = d.short.replace('今天·',''); labels.appendChild(s);
  });

  function fmtEq(v, modern){
    if (modern) return String(Math.round(v));
    return Number.isInteger(v) ? String(v) : v.toFixed(1);
  }
  function drawPeople(eq){
    people.innerHTML = '';
    var unit = eq > 40 ? 5 : 1;
    var exactCount = eq / unit;
    var count = Math.ceil(exactCount);
    document.getElementById('iconKey').textContent = unit === 5 ? '1 个图标 = 5 人（已压缩）' : '1 个图标 = 1 人';
    for (var i=0;i<count;i++){
      var svg = document.createElementNS(NS,'svg');
      svg.setAttribute('class','person' + (i === count-1 && exactCount % 1 > 0 ? ' partial' : ''));
      svg.setAttribute('viewBox','0 0 28 48');
      var use = document.createElementNS(NS,'use');
      use.setAttribute('href','#personSymbol');
      svg.appendChild(use); people.appendChild(svg);
    }
  }
  function update(){
    var i = Number(range.value), d = data[i];
    document.getElementById('eraShort').textContent = d.short;
    document.getElementById('eraName').textContent = d.name;
    document.getElementById('energyBar').style.width = Math.min(100,d.kcal/maxKcal*100) + '%';
    var kcalShown = Math.round(d.kcal/100)*100;
    document.getElementById('kcalValue').textContent = Chrome.n(kcalShown) + ' kcal / 天';
    document.getElementById('peopleValue').textContent = fmtEq(d.eq, !!d.gj) + ' 人';
    document.getElementById('relativeValue').textContent = fmtEq(d.eq, !!d.gj) + ' 倍';
    document.getElementById('equation').innerHTML = Chrome.n(kcalShown) + ' <span class="divide">÷ 2,000 kcal / 天 =</span> ' + fmtEq(d.eq, !!d.gj) + ' 人';
    Array.prototype.forEach.call(labels.children,function(el,j){ el.classList.toggle('on',j===i); });
    drawPeople(d.eq);
  }
  range.addEventListener('input',update);
  update();
})();
</script>
</body></html>
