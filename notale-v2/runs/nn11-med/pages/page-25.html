<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:14px;padding-bottom:8px}
.storyboard{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:1fr 1fr auto;gap:10px;padding:14px 20px 10px;background:rgba(25,21,18,.62);border:1px solid var(--line-soft);border-radius:var(--r)}
.lane{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:stretch;min-height:0}
.lane-name{display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line);padding-right:18px}
.lane-name strong{font-size:var(--fs-h2);line-height:1.2}
.lane-name span{margin-top:7px;font-size:var(--fs-label);line-height:1.35;color:var(--text-3)}
.lane.oral .lane-name strong{color:var(--gene-2)}
.lane.writing .lane-name strong{color:var(--cult-2)}
.diagram{width:100%;height:100%;display:block;overflow:visible}
.diagram text{font-family:var(--font-sans)}
.diagram .label{font-size:var(--fs-label);fill:var(--text-2)}
.diagram .micro{font-size:var(--fs-tick);fill:var(--text-3)}
.diagram .brain{fill:#211b17;stroke:var(--gene);stroke-width:2}
.diagram .brain.cult{stroke:var(--cult)}
.diagram .person{fill:var(--text-2)}
.diagram .route{fill:none;stroke:var(--gene);stroke-width:2.5;stroke-linecap:round;marker-end:url(#arrow-gene)}
.diagram .route.cult{stroke:var(--cult);marker-end:url(#arrow-cult)}
.diagram .fade1{opacity:.78}.diagram .fade2{opacity:.52}.diagram .fade3{opacity:.25}
.diagram .break{stroke:var(--warn);stroke-width:2.5;stroke-dasharray:7 7}
.diagram .carrier{fill:rgba(95,200,216,.08);stroke:var(--cult);stroke-width:2.5}
.diagram .tablet-line{stroke:var(--cult-2);stroke-width:2;opacity:.8}
.diagram .stable{stroke:var(--cult);stroke-width:3.5}
.diagram .warntext{fill:var(--warn);font-size:var(--fs-label);font-weight:700}
.axis{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center}
.axis-track{position:relative;height:30px;margin:0 54px 0 42px;border-top:1px solid var(--line)}
.axis-track::after{content:"";position:absolute;right:-1px;top:-5px;border-left:9px solid var(--text-3);border-top:5px solid transparent;border-bottom:5px solid transparent}
.axis-labels{position:absolute;inset:7px 0 0;display:flex;justify-content:space-between;color:var(--text-3);font-size:var(--fs-tick);font-family:var(--font-num)}
.axis-title{text-align:right;padding-right:18px;color:var(--text-3);font-size:var(--fs-label)}
.bottomline{flex:0 0 auto;display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center;min-height:88px}
.key{border-left:4px solid var(--cult);padding:5px 0 5px 18px;font-size:var(--fs-lead);line-height:1.45}
.key b{color:var(--cult-2)}
.key .after{font-size:var(--fs-sec);color:var(--text-3)}
.controls{display:flex;align-items:center;gap:12px}
.controls .hint{white-space:nowrap}
.btn svg{width:16px;height:16px;vertical-align:-3px;margin-right:7px;fill:currentColor}
@media (prefers-reduced-motion:reduce){.diagram *{transition:none!important}}
</style>
</head>
<body data-page="25" data-total="44">
<div id="stage"><main id="main">
  <section class="storyboard min0" aria-label="口传与文字两条信息传递过程">
    <div class="lane oral min0">
      <div class="lane-name"><strong>口传</strong><span>每一跳都经过一个活人</span></div>
      <svg class="diagram" viewBox="0 0 1280 190" role="img" aria-label="信息从一个脑传到下一个脑，每一代逐渐衰减，最后因传承链中断而消失">
        <defs>
          <marker id="arrow-gene" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0913a"/></marker>
          <marker id="arrow-cult" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fc8d8"/></marker>
        </defs>
        <g class="oral-unit" transform="translate(70 38)"><circle class="brain" cx="48" cy="48" r="36"/><path class="person" d="M37 42c0-12 20-17 28-7 9 10 1 27-12 27H41c-8 0-12-12-4-20z"/><text class="micro" x="48" y="107" text-anchor="middle">原话</text></g>
        <path class="route oral-route" d="M170 86H310"/>
        <g class="oral-unit fade1" transform="translate(330 38)"><circle class="brain" cx="48" cy="48" r="36"/><path class="person" d="M37 42c0-12 20-17 28-7 9 10 1 27-12 27H41c-8 0-12-12-4-20z"/></g>
        <path class="route oral-route fade1" d="M430 86H570"/>
        <g class="oral-unit fade2" transform="translate(590 38)"><circle class="brain" cx="48" cy="48" r="36"/><path class="person" d="M37 42c0-12 20-17 28-7 9 10 1 27-12 27H41c-8 0-12-12-4-20z"/></g>
        <path class="route oral-route fade2" d="M690 86H830"/>
        <g class="oral-unit fade3" transform="translate(850 38)"><circle class="brain" cx="48" cy="48" r="36"/><path class="person" d="M37 42c0-12 20-17 28-7 9 10 1 27-12 27H41c-8 0-12-12-4-20z"/></g>
        <path class="break" d="M968 86H1082"/>
        <g class="break-mark"><path d="M1100 60l-16 52m37-52l-16 52" stroke="#e0574a" stroke-width="4"/><text class="warntext" x="1170" y="82" text-anchor="middle">链断了</text><text class="label" x="1170" y="108" text-anchor="middle">信息随人消失</text></g>
        <text class="label" x="520" y="24" text-anchor="middle">遗忘 · 走样</text>
      </svg>
    </div>

    <div class="lane writing min0">
      <div class="lane-name"><strong>文字</strong><span>信息先进入体外载体</span></div>
      <svg class="diagram" viewBox="0 0 1280 190" role="img" aria-label="一个脑把信息写入泥板，泥板经过很多年仍无衰减，再把同一信息传给很多脑">
        <g class="write-brain" transform="translate(70 38)"><circle class="brain cult" cx="48" cy="48" r="36"/><path class="person" d="M37 42c0-12 20-17 28-7 9 10 1 27-12 27H41c-8 0-12-12-4-20z"/></g>
        <path class="route cult write-route" d="M170 86H310"/>
        <g class="tablet" transform="translate(330 20)">
          <path class="carrier" d="M8 11Q8 0 19 0h113q12 0 12 12v126q0 12-12 12H19Q8 150 8 138z"/>
          <path class="tablet-line" d="M31 32h72M31 51h91M31 70h58M31 89h84M31 108h65"/>
          <text class="micro" x="76" y="174" text-anchor="middle">泥板：账</text>
        </g>
        <path class="route cult stable" d="M500 86H868"/>
        <text class="label stable-label" x="684" y="55" text-anchor="middle" fill="#9de3ee">很多年 · 无衰减</text>
        <path class="route cult fan" d="M882 86C945 86 949 33 1005 33"/>
        <path class="route cult fan" d="M882 86H1005"/>
        <path class="route cult fan" d="M882 86C945 86 949 139 1005 139"/>
        <g class="readers">
          <g transform="translate(1020 4)"><circle class="brain cult" cx="30" cy="29" r="25"/><path class="person" d="M22 25c0-9 14-12 20-5 6 7 0 19-9 19h-8c-6 0-9-8-3-14z"/></g>
          <g transform="translate(1020 57)"><circle class="brain cult" cx="30" cy="29" r="25"/><path class="person" d="M22 25c0-9 14-12 20-5 6 7 0 19-9 19h-8c-6 0-9-8-3-14z"/></g>
          <g transform="translate(1020 110)"><circle class="brain cult" cx="30" cy="29" r="25"/><path class="person" d="M22 25c0-9 14-12 20-5 6 7 0 19-9 19h-8c-6 0-9-8-3-14z"/></g>
          <text class="label" x="1125" y="91">很多脑</text>
        </g>
        <text class="label origin" x="404" y="18" text-anchor="middle" fill="#9de3ee">约公元前 3200 年 · 两河流域乌鲁克</text>
      </svg>
    </div>

    <div class="axis" aria-hidden="true"><div class="axis-title">同一时间方向</div><div class="axis-track"><div class="axis-labels"><span>当下</span><span>一代</span><span>两代</span><span>很多年后</span></div></div></div>
  </section>

  <div class="bottomline min0">
    <div class="key">这是<b>第二次</b>把身体的功能挪到体外：第一次是火把消化搬出去，这一次是文字把记忆搬出去。<br><span class="after">第三次是计算，第四次是……</span></div>
    <div class="controls"><span class="hint">重看信息如何穿过时间</span><button id="replay" class="btn cult" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.3 4H9V7H2l2.1 2.1A9 9 0 1 0 12 3v2z"/></svg>重播</button></div>
  </div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/anime.min.js"></script>
<script>
Chrome.mount({ act:3, title:'文字：把记忆搬到体外', sub:'第一次，信息可以不经过任何一个活人而存活下去。', foot:'消化搬到体外，记忆搬到体外——每搬一次，那条通道就宽一截。' });

var timeline;
function buildTimeline(){
  if(timeline) timeline.pause();
  anime.set('.oral-unit,.oral-route,.break-mark,.write-brain,.write-route,.tablet,.stable,.stable-label,.fan,.readers,.origin',{opacity:0});
  timeline=anime.timeline({autoplay:false,easing:'easeOutQuad'});
  timeline
    .add({targets:'.oral-unit',opacity:function(el,i){return [1,.78,.52,.25][i]},scale:[.9,1],delay:anime.stagger(260),duration:500})
    .add({targets:'.oral-route',opacity:function(el,i){return [1,.78,.52][i]},duration:450,delay:anime.stagger(220)},'-=900')
    .add({targets:'.break-mark',opacity:[0,1],duration:450},'-=80')
    .add({targets:'.write-brain',opacity:[0,1],scale:[.9,1],duration:420},'+=160')
    .add({targets:'.write-route',opacity:[0,1],duration:380},'-=120')
    .add({targets:'.tablet,.origin',opacity:[0,1],translateY:[8,0],duration:520},'-=80')
    .add({targets:'.stable,.stable-label',opacity:[0,1],duration:760},'+=120')
    .add({targets:'.fan',opacity:[0,1],duration:420,delay:anime.stagger(100)},'-=120')
    .add({targets:'.readers',opacity:[0,1],scale:[.92,1],duration:500},'-=220');
}
function showFinal(){buildTimeline();timeline.seek(timeline.duration);}
showFinal();
document.getElementById('replay').addEventListener('click',function(){
  buildTimeline();
  if(Deck.reduced()) timeline.seek(timeline.duration); else timeline.play();
});
</script>
</body></html>
