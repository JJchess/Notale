<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:12px}
.toolbar{flex:0 0 auto;display:flex;align-items:center;gap:16px;min-height:42px}
.toolbar .hint{margin-right:auto}
.readout{display:grid;grid-template-columns:auto 1px auto;align-items:baseline;gap:15px;padding:7px 16px;border:1px solid var(--line-soft);border-radius:var(--r);background:rgba(25,21,18,.72)}
.readout .route{font-size:var(--fs-sec);color:var(--text-2);max-width:290px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout .sep{align-self:stretch;background:var(--line-soft)}
.readout .value{font-size:var(--fs-body);color:var(--text)}
.readout .ratio{font-size:var(--fs-sec);color:var(--text-2);white-space:nowrap}
.readout strong{color:var(--cult-2);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.chart-shell{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:7px 0 3px}
.scale-title{flex:0 0 auto;margin-left:264px;font-size:var(--fs-label);color:var(--text-3);letter-spacing:.025em}
#chart{flex:1 1 auto;min-height:0;width:100%}
.takeaway{flex:0 0 auto;display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;gap:24px;padding:10px 18px 12px;border-left:3px solid var(--cult);background:linear-gradient(90deg,rgba(95,200,216,.08),rgba(95,200,216,.015) 65%,transparent)}
.takeaway .contrast{font-size:var(--fs-lead);line-height:1.42;color:var(--text-2)}
.takeaway .contrast b{color:var(--text)}
.takeaway .contrast .num{color:var(--cult-2)}
.takeaway .divider{align-self:stretch;background:var(--line-soft)}
.takeaway .brain{font-size:var(--fs-body);line-height:1.45;color:var(--text-2)}
.takeaway .brain b{color:var(--text)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body data-page="26" data-total="44">
<div id="stage"><main id="main">
  <div class="toolbar min0">
    <button id="play" class="btn cult" type="button">播放</button>
    <div class="hint">按播放，或点任意一段看它花了多久</div>
    <div class="readout min0" aria-live="polite">
      <span id="route" class="route">动力飞行 → 登上月球</span>
      <span class="sep" aria-hidden="true"></span>
      <span id="value" class="value">这一步花了 <strong>66 年</strong></span>
      <span id="ratio" class="ratio">是上一步的 <strong>1/1.9</strong></span>
    </div>
  </div>

  <section class="chart-shell min0" aria-labelledby="scale-title">
    <div id="scale-title" class="scale-title">共同基准 · 相邻里程碑的间隔（对数年尺）</div>
    <div id="chart" role="img" aria-label="十三段相邻里程碑的时间间隔，共用一根对数年尺；早期间隔为数十万年，近代缩至几十年。"></div>
  </section>

  <aside class="takeaway min0">
    <div class="contrast">从石器到手斧用了 <b class="num">84 万年</b>。从飞机到月球用了 <b class="num">66 年</b>。</div>
    <div class="divider" aria-hidden="true"></div>
    <div class="brain">中间没有任何一次是因为哪一代人突然变聪明了——<b>每一代人的脑子都差不多。</b></div>
  </aside>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
Chrome.mount({ act:3, title:'下一步来得越来越快', sub:'把相邻两个里程碑之间的间隔一段段量出来，间隔本身在坍缩。', foot:'加速不是因为人变聪明了。下一页说清楚它到底来自哪里。' });

(function(){
  var milestones = [
    ['Laetoli 足迹（直立确证）',3660000],
    ['最早石器（Lomekwi 3）',3300000],
    ['奥杜威石器',2600000],
    ['阿舍利手斧',1760000],
    ['用火确证（Wonderwerk）',1000000],
    ['智人出现（Jebel Irhoud）',300000],
    ['走出非洲的主要扩散',65000],
    ['农业开始',12000],
    ['最早的文字（乌鲁克）',5200],
    ['活字印刷（谷登堡 1450）',576],
    ['蒸汽机（瓦特 1776）',250],
    ['动力飞行（1903）',123],
    ['登上月球（1969）',57],
    ['今天（2026）',0]
  ];
  var intervals = milestones.slice(0,-1).map(function(d,i){
    return {
      from:d[0],
      to:milestones[i+1][0],
      value:d[1]-milestones[i+1][1]
    };
  });
  var labels = [
    '足迹 → 最早石器','最早石器 → 奥杜威','奥杜威 → 手斧','手斧 → 用火确证',
    '用火 → 智人','智人 → 主要扩散','扩散 → 农业','农业 → 文字',
    '文字 → 活字印刷','印刷 → 蒸汽机','蒸汽机 → 飞机','飞机 → 月球','月球 → 今天'
  ];
  var selected = 11;
  var visible = intervals.map(function(d){return d.value;});
  var chart = echarts.init(document.getElementById('chart'), null, {renderer:'svg'});
  var routeEl = document.getElementById('route');
  var valueEl = document.getElementById('value');
  var ratioEl = document.getElementById('ratio');
  var playBtn = document.getElementById('play');
  var timers = [];
  var playing = false;

  function shortName(s){ return s.replace(/（[^）]+）/g,''); }
  function fmtYears(n){ return n>=10000 ? (n/10000).toLocaleString('zh-CN',{maximumFractionDigits:1})+' 万年' : n.toLocaleString('zh-CN')+' 年'; }
  function updateReadout(i){
    selected=i;
    var d=intervals[i];
    routeEl.textContent=shortName(d.from)+' → '+shortName(d.to);
    valueEl.innerHTML='这一步花了 <strong>'+fmtYears(d.value)+'</strong>';
    if(i===0){
      ratioEl.textContent='第一段：从这里开始比较';
    }else{
      var n=intervals[i-1].value/d.value;
      ratioEl.innerHTML='是上一步的 <strong>1/'+n.toLocaleString('zh-CN',{maximumFractionDigits: n<10?1:0})+'</strong>';
    }
  }
  function option(){
    return {
      animation:true,
      animationDuration:280,
      animationDurationUpdate:280,
      animationEasing:'cubicOut',
      animationEasingUpdate:'cubicOut',
      textStyle:{fontFamily:'Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif',fontSize:16,color:'#ece7df'},
      grid:{left:264,right:76,top:5,bottom:34},
      tooltip:{show:false},
      xAxis:{
        type:'log',logBase:10,min:10,max:1000000,
        axisLine:{show:true,lineStyle:{color:'#594b40',width:1}},
        axisTick:{show:true,lineStyle:{color:'#594b40'}},
        splitLine:{show:true,lineStyle:{color:'#2a231e',width:1}},
        axisLabel:{color:'#8b8078',fontSize:14,margin:9,formatter:function(v){
          var m={10:'10 年',100:'100 年',1000:'1 千年',10000:'1 万年',100000:'10 万年',1000000:'100 万年'};
          return m[v]||'';
        }}
      },
      yAxis:{
        type:'category',inverse:true,data:labels,
        axisLine:{show:false},axisTick:{show:false},
        axisLabel:{color:'#b9ada0',fontSize:14,margin:18,width:230,overflow:'truncate',align:'right',lineHeight:18}
      },
      series:[{
        type:'bar',data:visible,barWidth:14,barMinHeight:2,
        itemStyle:{
          borderRadius:[0,4,4,0],
          color:function(p){return p.dataIndex===selected?'#5fc8d8':'#756a60';},
          opacity:.8
        },
        emphasis:{itemStyle:{color:'#9de3ee',opacity:1}},
        label:{show:true,position:'right',distance:8,color:'#b9ada0',fontSize:14,fontFamily:'ui-monospace, SFMono-Regular, Menlo, monospace',formatter:function(p){return p.value==null?'':fmtYears(p.value);}}
      }]
    };
  }
  function render(){ chart.setOption(option(),false); }
  function clearTimers(){timers.forEach(clearTimeout);timers=[];}
  function play(){
    clearTimers(); playing=true; playBtn.disabled=true; playBtn.textContent='播放中…';
    visible=intervals.map(function(){return null;});
    render();
    intervals.forEach(function(d,i){
      timers.push(setTimeout(function(){
        visible[i]=d.value;
        updateReadout(i);
        render();
        if(i===intervals.length-1){
          playing=false;playBtn.disabled=false;playBtn.textContent='重播';
        }
      },80+i*350));
    });
  }
  playBtn.addEventListener('click',play);
  chart.on('click',function(p){
    if(p.seriesType!=='bar'||p.value==null)return;
    clearTimers();playing=false;playBtn.disabled=false;playBtn.textContent='重播';
    visible=intervals.map(function(d){return d.value;});
    updateReadout(p.dataIndex);render();
  });
  window.addEventListener('resize',function(){chart.resize();});
  if(Deck.reduced()){playBtn.textContent='重播';}
  updateReadout(selected);
  render();
})();
</script>
</body></html>
