<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{
  display:flex;
  flex-direction:column;
  height:100%;
  gap:18px;
}
.claim{
  flex:0 0 auto;
  border-left-color:var(--cult);
  max-width:1400px;
  padding-top:4px;
  padding-bottom:4px;
}
.claim .key{color:var(--cult-2);}
.factor-field{
  flex:1 1 auto;
  min-height:0;
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  padding:20px 0 8px;
}
.factor-field::before{
  content:"";
  position:absolute;
  left:9.5%;
  right:9.5%;
  top:32px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--cult-dim) 7%,var(--cult) 50%,var(--cult-dim) 93%,transparent);
  opacity:.9;
}
.factors{
  display:grid;
  grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr) 42px minmax(0,1fr) 42px minmax(0,1fr);
  align-items:stretch;
  gap:0;
}
.factor{
  position:relative;
  min-width:0;
  min-height:270px;
  padding:62px 24px 30px;
  border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg,rgba(95,200,216,.075),rgba(95,200,216,.018));
}
.factor::before{
  content:"";
  position:absolute;
  top:0;
  left:50%;
  width:1px;
  height:37px;
  background:var(--cult);
  opacity:.75;
}
.factor::after{
  content:"";
  position:absolute;
  top:-4px;
  left:calc(50% - 4px);
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--cult);
  box-shadow:0 0 0 5px rgba(95,200,216,.09);
}
.factor:first-child{border-radius:var(--r) 0 0 var(--r);}
.factor:last-child{border-radius:0 var(--r) var(--r) 0;}
.factor h2{
  margin:0 0 10px;
  color:var(--cult-2);
  font-size:var(--fs-h2);
  line-height:1.25;
  font-weight:700;
}
.factor p{
  margin:0;
  color:var(--text-2);
  font-size:var(--fs-sec);
  line-height:1.55;
}
.factor p strong{color:var(--text);font-weight:600;}
.times{
  align-self:center;
  text-align:center;
  color:var(--cult);
  font-family:var(--font-num);
  font-size:var(--fs-h1);
  line-height:1;
  font-weight:300;
  position:relative;
  z-index:2;
  text-shadow:0 0 18px rgba(95,200,216,.26);
}
.feedback{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr auto 1fr auto 1fr;
  align-items:center;
  gap:18px;
  margin:0 118px;
  padding-top:10px;
  color:var(--text-2);
  font-size:var(--fs-lead);
  line-height:1.35;
  text-align:center;
}
.feedback .node{
  min-height:58px;
  padding:10px 12px;
  border-top:1px solid var(--cult-dim);
  background:linear-gradient(180deg,rgba(95,200,216,.045),transparent);
  display:flex;
  align-items:center;
  justify-content:center;
}
.feedback .node b{color:var(--cult-2);}
.feedback .arrow{
  color:var(--cult);
  font-size:var(--fs-h2);
}
.feedback .loop{
  grid-column:1/-1;
  position:relative;
  height:20px;
  margin:0 12%;
  border:1px solid var(--cult-dim);
  border-top:0;
  border-radius:0 0 18px 18px;
}
.feedback .loop::after{
  content:"▲";
  position:absolute;
  left:-6px;
  top:-10px;
  color:var(--cult);
  font-size:var(--fs-label);
}
.warning{
  flex:0 0 auto;
  margin:0;
  padding:10px 16px 11px;
  border-left:4px solid var(--warn);
  background:rgba(224,87,74,.065);
  color:var(--warn);
  font-size:var(--fs-lead);
  line-height:1.4;
  font-weight:600;
}
.warning strong{color:#f28d83;}
</style>
</head>
<body data-page="27" data-total="44">
<div id="stage"><main id="main">
  <section class="claim" aria-label="核心主张">
    加速不是因为人变聪明了，是因为<span class="key">存量本身在参与生产</span>。<br>
    每一代人手上可用的体外信息越多，他们能造出来的就越多——而造出来的又变成下一代的存量。
  </section>

  <section class="factor-field min0" aria-label="四个互相放大的因子">
    <div class="factors min0">
      <article class="factor min0">
        <h2>累积</h2>
        <p><strong>棘轮不回退。</strong>学会的东西写在体外，不随人死去（p14、p25）</p>
      </article>
      <div class="times" aria-hidden="true">×</div>
      <article class="factor min0">
        <h2>组合</h2>
        <p><strong>新东西多半是旧东西的重组。</strong>存量翻倍，可能的组合远不止翻倍</p>
      </article>
      <div class="times" aria-hidden="true">×</div>
      <article class="factor min0">
        <h2>人数与连接</h2>
        <p><strong>阈值只跟 <span class="num">ln N</span> 有关，</strong>但 <span class="num">N</span> 本身在指数增长（p15、p23）</p>
      </article>
      <div class="times" aria-hidden="true">×</div>
      <article class="factor min0">
        <h2>能量</h2>
        <p><strong>每个人手上从 <span class="num">1</span> 个当量人变成几十个</strong>（p24）</p>
      </article>
    </div>

    <div class="feedback" aria-label="存量与产出的反馈循环">
      <div class="node">可用的<b>体外信息</b>越多</div>
      <div class="arrow" aria-hidden="true">→</div>
      <div class="node">能造出来的就越多</div>
      <div class="arrow" aria-hidden="true">→</div>
      <div class="node">变成下一代的<b>存量</b></div>
      <div class="loop" aria-hidden="true"></div>
    </div>
  </section>

  <p class="warning">注意这四个因子里，<strong>没有一个在基因里</strong>。它们全都在身体外面。</p>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>

</script>
</body></html>
