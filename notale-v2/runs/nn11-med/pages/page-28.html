<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:12px}
.work{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 382px;gap:18px}
.chart-panel{display:flex;flex-direction:column;gap:10px;padding:14px 18px 12px;background:linear-gradient(145deg,rgba(34,27,22,.82),rgba(16,14,13,.7));border-color:var(--line)}
.control-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center}
.ctl{min-width:0}.ctl .cl{font-weight:700;color:var(--text)}
.ctl .cv{width:82px;color:var(--gene-2);font-weight:700}
.legend{justify-content:flex-end;white-space:nowrap}
.plot{flex:1 1 auto;min-height:0;border:1px solid var(--line-soft);background:rgba(8,7,6,.46)}
.readout{display:flex;flex-direction:column;gap:10px;min-height:0}
.metric{flex:1 1 0;min-height:0;padding:13px 17px;display:flex;flex-direction:column;justify-content:center;border-left:3px solid var(--line)}
.metric.up{border-left-color:var(--gene)}
.metric.stay{border-left-color:var(--cult)}
.metric.gap{border-left-color:var(--text-3)}
.metric .k{font-size:var(--fs-label);color:var(--text-3);margin-bottom:5px}
.metric .big{font-size:36px;white-space:nowrap}
.metric.up .big{color:var(--gene-2)}
.metric.stay .big{color:var(--cult-2)}
.metric.gap .big{color:var(--text)}
.metric .unit{font-size:var(--fs-sec)}
.energy{margin-left:14px;padding-left:14px;border-left:1px solid var(--line);font-size:var(--fs-sec);color:var(--text-2)}
.takeaway{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:10px 18px;border:1px solid var(--line);border-radius:var(--r);background:rgba(25,21,18,.78);font-size:var(--fs-lead);line-height:1.45}
.takeaway .stamp{font-family:var(--font-num);font-size:var(--fs-label);letter-spacing:.08em;color:var(--gene-2);border-right:1px solid var(--line);padding-right:16px;white-space:nowrap}
.takeaway .gene{color:var(--gene-2)}
.takeaway .cult{color:var(--cult-2)}
.hint{flex:0 0 auto}
@media (prefers-reduced-motion:reduce){input[type=range]{scroll-behavior:auto}}
</style>
</head>
<body data-page="28" data-total="44">
<div id="stage"><main id="main">
  <section class="work min0" aria-label="上抛速度与圆轨道速度比较">
    <div class="panel chart-panel min0">
      <div class="control-row min0">
        <label class="ctl min0" for="launchSpeed">
          <span class="cl">竖直初速</span>
          <input id="launchSpeed" class="no-pan" type="range" min="0" max="11.5" step="0.05" value="1.4">
          <output class="cv" id="speedOut">1.40 km/s</output>
        </label>
        <div class="legend" aria-hidden="true">
          <span class="li"><i class="sw line" style="background:var(--gene)"></i>扔上去</span>
          <span class="li"><i class="sw line" style="background:var(--cult)"></i>留在该高度</span>
        </div>
      </div>
      <div class="cvbox plot no-pan min0">
        <canvas id="plot" class="cv-fill" role="img" aria-label="共同坐标轴比较：横轴为速度，纵轴为高度；赭色曲线表示竖直上抛能达到的高度，青色曲线表示各高度的圆轨道速度。"></canvas>
      </div>
      <div class="hint">拖滑块给它一个向上的初速，看它能上多高</div>
    </div>

    <aside class="readout min0" aria-live="polite">
      <div class="panel metric up">
        <div class="k">上到</div>
        <div class="big"><span id="heightVal">101.5</span><span class="unit" id="heightUnit">km</span></div>
      </div>
      <div class="panel metric stay">
        <div class="k">留在这个高度需要</div>
        <div class="big"><span id="orbitVal">7.85</span><span class="unit" id="orbitUnit">km/s</span></div>
      </div>
      <div class="panel metric gap">
        <div class="k">同一高度，共同基准</div>
        <div><span class="big"><span id="ratioVal">5.6</span><span class="unit">倍速度</span></span><span class="energy"><b id="energyVal">31</b> 倍能量</span></div>
      </div>
    </aside>
  </section>

  <div class="takeaway">
    <span class="stamp">同一高度，两种任务</span>
    <span><span class="gene">1.4 km/s</span> 就能摸到太空，但那只是<strong>扔上去再掉回来</strong>。要留在 400 km 上，需要 <span class="cult">7.67 km/s</span> —— 速度只差 5.5 倍，<strong>能量差 30 倍</strong>。</span>
  </div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:4, title:'难的不是"上去"', sub:'到太空只要 1.4 km/s。留在太空要 7.7 km/s。差的那一截才是全部的难处。', foot:'那么"留在上面"到底是什么意思？牛顿三百年前就想清楚了。' });

(function(){
  var GM=3.986e14, R=6.371e6;
  var escape=Math.sqrt(2*GM/R);
  var slider=document.getElementById('launchSpeed');
  var cv=document.getElementById('plot');
  var els={
    speed:document.getElementById('speedOut'), height:document.getElementById('heightVal'),
    heightUnit:document.getElementById('heightUnit'), orbit:document.getElementById('orbitVal'),
    orbitUnit:document.getElementById('orbitUnit'), ratio:document.getElementById('ratioVal'),
    energy:document.getElementById('energyVal')
  };
  var state={v:1400,h:0,vc:0,escaping:false};

  function physics(v){
    var escaping=v>=escape;
    var h=escaping?Infinity:(1/(1/R-v*v/(2*GM))-R);
    var vc=isFinite(h)?Math.sqrt(GM/(R+h)):NaN;
    return {v:v,h:h,vc:vc,escaping:escaping};
  }
  function fmtHeight(h){
    if(h<10e3) return (h/1000).toFixed(1);
    if(h<500e3) return (h/1000).toFixed(1);
    return '> 500';
  }
  function updateText(){
    var s=state;
    els.speed.value=(s.v/1000).toFixed(2)+' km/s';
    if(s.escaping){
      els.height.textContent='逃逸'; els.heightUnit.textContent='';
      els.orbit.textContent='—'; els.orbitUnit.textContent='';
      els.ratio.textContent='—'; els.energy.textContent='—';
    }else{
      els.height.textContent=fmtHeight(s.h); els.heightUnit.textContent='km';
      els.orbit.textContent=(s.vc/1000).toFixed(2); els.orbitUnit.textContent='km/s';
      if(s.v===0){ els.ratio.textContent='—'; els.energy.textContent='—'; }
      else{
        var ratio=s.vc/s.v;
        els.ratio.textContent=ratio.toFixed(1);
        els.energy.textContent=Math.round(ratio*ratio);
      }
    }
  }

  function draw(){
    var ctx=Deck.fit(cv), W=cv.clientWidth, H=cv.clientHeight;
    var L=86,Rt=34,T=26,B=52, PW=W-L-Rt, PH=H-T-B;
    var xMax=8.5, hMax=500;
    function X(kms){return L+(kms/xMax)*PW}
    function Y(km){return T+PH-(km/hMax)*PH}
    var text=Deck.token('--text-2'), muted=Deck.token('--text-3');
    var line=Deck.token('--line'), soft=Deck.token('--line-soft');
    var gene=Deck.token('--gene'), gene2=Deck.token('--gene-2');
    var cult=Deck.token('--cult'), cult2=Deck.token('--cult-2');
    ctx.clearRect(0,0,W,H);
    ctx.lineCap='round';ctx.lineJoin='round';

    ctx.font='13px '+Deck.token('--font-num');
    ctx.textBaseline='middle';
    [0,100,200,300,400,500].forEach(function(h){
      var y=Y(h); ctx.strokeStyle=h===100||h===400?line:soft;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-Rt,y);ctx.stroke();
      ctx.fillStyle=muted;ctx.textAlign='right';ctx.fillText(h+' km',L-12,y);
    });
    [0,1,2,3,4,5,6,7,8].forEach(function(v){
      var x=X(v);ctx.strokeStyle=soft;ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,T+PH);ctx.stroke();
      ctx.fillStyle=muted;ctx.textAlign='center';ctx.fillText(String(v),x,T+PH+22);
    });
    ctx.font='15px '+Deck.token('--font-sans');ctx.fillStyle=text;ctx.textAlign='center';
    ctx.fillText('速度（km/s）',L+PW/2,H-13);
    ctx.save();ctx.translate(18,T+PH/2);ctx.rotate(-Math.PI/2);ctx.fillText('高度',0,0);ctx.restore();

    ctx.font='15px '+Deck.token('--font-sans');ctx.textAlign='left';
    ctx.fillStyle=gene2;ctx.fillText('竖直上抛所需初速',X(.35),Y(452));
    ctx.fillStyle=cult2;ctx.textAlign='right';ctx.fillText('圆轨道速度',X(8.25),Y(452));
    ctx.font='13px '+Deck.token('--font-sans');ctx.fillStyle=text;ctx.textAlign='left';
    ctx.fillText('卡门线',L+8,Y(100)-12);ctx.fillText('国际空间站',L+8,Y(400)-12);

    ctx.strokeStyle=gene;ctx.lineWidth=4;ctx.beginPath();
    for(var h=0;h<=hMax;h+=2){
      var hm=h*1000, vu=Math.sqrt(2*GM*(1/R-1/(R+hm)))/1000;
      if(h===0)ctx.moveTo(X(vu),Y(h));else ctx.lineTo(X(vu),Y(h));
    }ctx.stroke();
    ctx.strokeStyle=cult;ctx.lineWidth=4;ctx.beginPath();
    for(var hh=0;hh<=hMax;hh+=2){
      var vc=Math.sqrt(GM/(R+hh*1000))/1000;
      if(hh===0)ctx.moveTo(X(vc),Y(hh));else ctx.lineTo(X(vc),Y(hh));
    }ctx.stroke();

    var shown=Math.min(state.h/1000,hMax), y=Y(isFinite(shown)?shown:hMax);
    var launchX=X(Math.min(state.v/1000,xMax));
    var orbitAtShown=Math.sqrt(GM/(R+shown*1000))/1000, orbitX=X(orbitAtShown);
    ctx.setLineDash([7,7]);ctx.strokeStyle=Deck.rgba('--text',.5);ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(launchX,y);ctx.lineTo(orbitX,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=gene2;ctx.beginPath();ctx.arc(launchX,y,8,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=Deck.token('--bg-deep');ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle=cult2;ctx.beginPath();ctx.arc(orbitX,y,7,0,Math.PI*2);ctx.fill();ctx.stroke();
    if(state.h>500e3||state.escaping){
      ctx.fillStyle=gene2;ctx.textAlign='left';ctx.font='15px '+Deck.token('--font-sans');
      ctx.fillText(state.escaping?'超过逃逸速度':'最高点在图外',Math.min(launchX+14,W-150),T+14);
    }
  }
  function update(){state=physics(parseFloat(slider.value)*1000);updateText();draw()}
  slider.addEventListener('input',update);
  Deck.onResize(draw);
  update();
})();
</script>
</body></html>
