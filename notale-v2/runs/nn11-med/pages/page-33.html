<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:16px}
.mass-layout{display:grid;grid-template-columns:minmax(0,2.25fr) minmax(0,.94fr) minmax(0,.88fr);gap:20px;flex:1 1 auto;min-height:0}
.chart-col{display:flex;flex-direction:column;gap:10px;min-height:0}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:0 0 auto}
.chart-head .ttl{margin:0}
.baseline{font-size:var(--fs-label);color:var(--text-2);white-space:nowrap}
.baseline b{font-family:var(--font-num);font-variant-numeric:tabular-nums;color:var(--cult-2)}
.mass-map{position:relative;flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#11100f}
.mass-map svg{display:block;width:100%;height:100%}
.mass-map .tile{cursor:pointer;transition:opacity .16s,filter .16s}
.mass-map .tile:hover{filter:brightness(1.17)}
.mass-map .tile:focus{outline:none}
.mass-map .tile-focus{fill:none;stroke:#fff;stroke-width:3;pointer-events:none}
.mass-map text{font-family:var(--font-sans);fill:var(--text);pointer-events:none}
.mass-map .tile-name{font-size:var(--fs-label);font-weight:700}
.mass-map .tile-value{font-family:var(--font-num);font-size:var(--fs-tick);fill:var(--text-2)}
.mass-map .return-name{font-size:var(--fs-tick);font-weight:800;fill:#071013}
.map-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:0 0 auto}
.key{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:var(--fs-label);color:var(--text-3)}
.key span{display:flex;align-items:center;gap:6px}
.key i{width:11px;height:11px;border-radius:2px;display:block;background:rgba(95,200,216,.45)}
.key .dry i{background:rgba(95,200,216,.21);border:1px solid rgba(95,200,216,.35)}
.key .ship i{background:var(--cult)}
.photo-col{display:flex;flex-direction:column;min-height:0}
.launch{display:flex;flex-direction:column;height:100%;min-height:0}
.launch .photo-frame{flex:1 1 auto;min-height:0;overflow:hidden;border-radius:var(--r);position:relative;background:var(--panel)}
.launch img{border-radius:0;object-position:58% 48%}
.launch .photo-frame::after{content:"APOLLO 11 · 1969";position:absolute;left:12px;bottom:10px;padding:4px 8px;background:rgba(8,7,6,.72);color:var(--text-2);font:var(--fs-tick)/1.2 var(--font-num);letter-spacing:.05em}
.launch figcaption{font-size:var(--fs-label);color:var(--text-2)}
.readout{height:100%;display:flex;flex-direction:column;gap:13px;padding:16px 17px}
.readout .ttl{margin:0}
.sel-name{font-size:var(--fs-lead);line-height:1.35;font-weight:700;color:var(--cult-2);min-height:52px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:11px 8px;padding:12px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.metric .k{font-size:var(--fs-label);color:var(--text-3);line-height:1.3}
.metric .v{font-family:var(--font-num);font-size:var(--fs-body);font-variant-numeric:tabular-nums;color:var(--text);margin-top:3px}
.metric.wide{grid-column:1/-1}
.metric.wide .v{color:var(--cult-2)}
.aggregates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aggregate{padding:9px 10px;background:rgba(95,200,216,.055);border-left:2px solid var(--cult-dim)}
.aggregate .k{font-size:var(--fs-label);color:var(--text-3)}
.aggregate .v{font-family:var(--font-num);font-size:var(--fs-sec);color:var(--text);font-variant-numeric:tabular-nums;margin-top:2px}
.readout .btn{width:100%;margin-top:auto}
.readout .hint{line-height:1.35}
.conclusion{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:22px;padding:13px 20px;border:1px solid var(--cult-dim);border-radius:var(--r);background:linear-gradient(90deg,rgba(95,200,216,.10),rgba(95,200,216,.025))}
.mass-ratio{font-family:var(--font-num);font-size:36px;line-height:1;font-weight:700;color:var(--cult-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.conclusion p{margin:0;font-size:var(--fs-lead);line-height:1.42;color:var(--text-2)}
.conclusion strong{color:var(--text)}
@media (prefers-reduced-motion:reduce){.mass-map .tile{transition:none}}
</style>
</head>
<body data-page="33" data-total="44">
<div id="stage"><main id="main">
  <section class="mass-layout min0" aria-label="土星五号起飞质量组成">
    <div class="chart-col min0">
      <div class="chart-head">
        <div class="ttl cult">同一个 100%：起飞总质量</div>
        <div class="baseline"><b id="totalMass">2,970,000 kg</b> = 100%</div>
      </div>
      <div class="mass-map no-pan min0" id="massMap">
        <svg id="massSvg" role="img" aria-label="按面积严格对应质量的土星五号质量方块图"></svg>
      </div>
      <div class="map-foot">
        <div class="key" aria-label="图例"><span><i></i>推进剂</span><span class="dry"><i></i>干重与结构</span><span class="ship"><i></i>飞向月球</span></div>
        <div class="hint">点任意一块看它占多少</div>
      </div>
    </div>
    <div class="photo-col min0">
      <figure class="launch min0">
        <div class="photo-frame min0"><img src="assets/img/saturn-v-launch.jpg" alt="土星五号搭载阿波罗 11 号升空" title="土星五号 / 阿波罗 11 号发射，1969 年 7 月 16 日 · NASA · 公有领域"></div>
        <figcaption><span class="num">110.6</span> 米高，起飞推力 <span class="num">3,400</span> 万牛。</figcaption>
      </figure>
    </div>
    <aside class="panel readout min0" aria-live="polite">
      <div class="ttl cult">当前选中</div>
      <div class="sel-name" id="selName">送往月球的飞船</div>
      <div class="metrics">
        <div class="metric"><div class="k">质量</div><div class="v" id="selMass">48,600 kg</div></div>
        <div class="metric"><div class="k">占起飞质量</div><div class="v" id="selPct">1.64%</div></div>
        <div class="metric wide"><div class="k">相当于总质量的</div><div class="v" id="selFraction">1 / 61.1</div></div>
      </div>
      <div class="aggregates" aria-label="质量汇总">
        <div class="aggregate"><div class="k">推进剂合计</div><div class="v" id="fuelSum"></div></div>
        <div class="aggregate"><div class="k">结构合计</div><div class="v" id="drySum"></div></div>
      </div>
      <button class="btn cult" id="returnOnly" type="button" aria-pressed="false">只留下回来的那部分</button>
      <div class="hint">点任意一块看它占多少</div>
    </aside>
  </section>
  <section class="conclusion" aria-label="质量换算结论">
    <div class="mass-ratio"><span id="returnRatio">534</span> : 1</div>
    <p>每 <strong>1 公斤</strong>回到地球的东西，要在发射台上放 <strong><span id="returnWords">534</span> 公斤</strong>。上一页那条对数曲线，就是这个比例的来源。</p>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
Chrome.mount({ act:4, title:'土星五号的质量账', sub:'2970 吨在发射台上，48.6 吨飞向月球，5.6 吨回到地球。', foot:'把这 5.6 吨里的三个人放回幕 I 的那具身体——他们在上面怎么样？' });

(function(){
  var TOTAL = 2970000;
  var RETURN = 5560;
  var data = [
    {id:'s1fuel', name:'第一级 S-IC 推进剂', short:'S-IC 推进剂', mass:2145000, kind:'fuel'},
    {id:'s1dry', name:'第一级 S-IC 干重', short:'S-IC 干重', mass:131000, kind:'dry'},
    {id:'s2fuel', name:'第二级 S-II 推进剂', short:'S-II 推进剂', mass:456100, kind:'fuel'},
    {id:'s2dry', name:'第二级 S-II 干重', short:'S-II 干重', mass:36000, kind:'dry'},
    {id:'s3fuel', name:'第三级 S-IVB 推进剂', short:'S-IVB 推进剂', mass:106600, kind:'fuel'},
    {id:'s3dry', name:'第三级 S-IVB 干重 + 仪器舱', short:'S-IVB 干重 + 仪器舱', mass:13500, kind:'dry'},
    {id:'ship', name:'送往月球的飞船（指令舱+服务舱+登月舱+适配器）', short:'送往月球的飞船', mass:48600, kind:'ship'}
  ];
  var listed = data.reduce(function(s,d){ return s+d.mass; },0);
  data.push({id:'other',name:'其余质量（总量与分项之差）',short:'其余质量',mass:TOTAL-listed,kind:'other'});
  var returnData = {id:'return',name:'其中最终溅落回地球的指令舱',short:'回到地球的指令舱',mass:RETURN,kind:'return'};
  var fuel = data.filter(function(d){return d.kind==='fuel';}).reduce(function(s,d){return s+d.mass;},0);
  var dry = data.filter(function(d){return d.kind==='dry';}).reduce(function(s,d){return s+d.mass;},0);
  var selected = data[6];
  var onlyReturn = false;
  var svg = d3.select('#massSvg');

  function pct(m){
    var p=m/TOTAL*100;
    var precise=(m===48600 || m===13500 || m===5560 || m===TOTAL-listed);
    return p.toFixed(precise?2:1)+'%';
  }
  function fraction(m){
    var n=TOTAL/m;
    return '1 / '+(n<100?n.toFixed(1):Math.round(n).toLocaleString('en-US'));
  }
  function updateReadout(d){
    selected=d;
    document.getElementById('selName').textContent=d.name;
    document.getElementById('selMass').textContent=Chrome.n(d.mass)+' kg';
    document.getElementById('selPct').textContent=pct(d.mass);
    document.getElementById('selFraction').textContent=fraction(d.mass);
    drawFocus();
  }
  function tileFill(d){
    if(d.kind==='ship') return 'rgba(95,200,216,.74)';
    if(d.kind==='fuel') return d.id==='s1fuel'?'rgba(95,200,216,.36)':'rgba(95,200,216,.47)';
    if(d.kind==='dry') return 'rgba(95,200,216,.18)';
    return 'rgba(185,173,160,.13)';
  }
  function draw(){
    var box=document.getElementById('massMap');
    var w=box.clientWidth, h=box.clientHeight;
    if(!w||!h) return;
    svg.attr('viewBox','0 0 '+w+' '+h);
    svg.selectAll('*').remove();
    var root=d3.hierarchy({children:data}).sum(function(d){return d.mass||0;});
    d3.treemap().size([w,h]).paddingOuter(5).paddingInner(3).round(true)(root);
    var leaves=root.leaves();
    var groups=svg.selectAll('g.mass-tile').data(leaves,function(d){return d.data.id;}).join('g')
      .attr('class','mass-tile tile').attr('data-id',function(d){return d.data.id;})
      .attr('tabindex','0').attr('role','button')
      .attr('aria-label',function(d){return d.data.name+'，'+Chrome.n(d.data.mass)+' 千克，'+pct(d.data.mass);})
      .on('click',function(event,d){updateReadout(d.data);})
      .on('keydown',function(event,d){if(event.key==='Enter'||event.key===' '){event.preventDefault();updateReadout(d.data);}});
    groups.append('rect').attr('x',function(d){return d.x0;}).attr('y',function(d){return d.y0;})
      .attr('width',function(d){return Math.max(0,d.x1-d.x0);}).attr('height',function(d){return Math.max(0,d.y1-d.y0);})
      .attr('rx',4).attr('fill',function(d){return tileFill(d.data);}).attr('stroke','rgba(95,200,216,.30)');
    groups.each(function(d){
      var gw=d.x1-d.x0, gh=d.y1-d.y0;
      if(gw>112 && gh>47){
        var g=d3.select(this);
        g.append('text').attr('class','tile-name').attr('x',d.x0+10).attr('y',d.y0+22).text(d.data.short);
        g.append('text').attr('class','tile-value').attr('x',d.x0+10).attr('y',d.y0+43).text(Chrome.n(d.data.mass)+' kg · '+pct(d.data.mass));
      }
    });
    var shipNode=leaves.find(function(d){return d.data.id==='ship';});
    if(shipNode){
      var sw=shipNode.x1-shipNode.x0, sh=shipNode.y1-shipNode.y0;
      var rw=sw*(RETURN/48600);
      var rg=svg.append('g').attr('class','tile return-tile').attr('data-id','return').attr('tabindex','0').attr('role','button')
        .attr('aria-label',returnData.name+'，'+Chrome.n(RETURN)+' 千克，'+pct(RETURN))
        .on('click',function(event){event.stopPropagation();updateReadout(returnData);})
        .on('keydown',function(event){if(event.key==='Enter'||event.key===' '){event.preventDefault();updateReadout(returnData);}});
      rg.append('rect').attr('x',shipNode.x0).attr('y',shipNode.y0).attr('width',Math.max(3,rw)).attr('height',sh)
        .attr('rx',2).attr('fill','#9de3ee').attr('stroke','#ffffff').attr('stroke-width',1.5);
      if(rw>34 && sh>34){rg.append('text').attr('class','return-name').attr('x',shipNode.x0+5).attr('y',shipNode.y0+18).text('返回');}
    }
    applyOpacity();
    drawFocus();
  }
  function drawFocus(){
    svg.selectAll('.tile-focus').remove();
    var target=svg.select('[data-id="'+selected.id+'"] rect');
    if(!target.empty()){
      svg.append('rect').attr('class','tile-focus')
        .attr('x',+target.attr('x')+1.5).attr('y',+target.attr('y')+1.5)
        .attr('width',Math.max(0,+target.attr('width')-3)).attr('height',Math.max(0,+target.attr('height')-3)).attr('rx',4);
    }
  }
  function applyOpacity(){
    svg.selectAll('.tile').style('opacity',function(){
      if(!onlyReturn) return 1;
      return d3.select(this).attr('data-id')==='return'?1:.12;
    });
  }
  document.getElementById('fuelSum').textContent=Chrome.n(fuel)+' kg · '+pct(fuel);
  document.getElementById('drySum').textContent=Chrome.n(dry)+' kg · '+pct(dry);
  var rr=Math.round(TOTAL/RETURN);
  document.getElementById('returnRatio').textContent=Chrome.n(rr);
  document.getElementById('returnWords').textContent=Chrome.n(rr);
  document.getElementById('returnOnly').addEventListener('click',function(){
    onlyReturn=!onlyReturn;
    this.setAttribute('aria-pressed',String(onlyReturn));
    this.textContent=onlyReturn?'恢复全部质量':'只留下回来的那部分';
    if(onlyReturn) updateReadout(returnData);
    applyOpacity();
  });
  updateReadout(selected);
  requestAnimationFrame(draw);
  Deck.onResize(draw);
})();
</script>
</body></html>
