<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:14px}
.timeline{position:relative;flex:1 1 auto;min-height:0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);overflow:hidden;background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 14.285%,transparent 14.285%,transparent 28.57%),rgba(25,21,18,.38)}
.axis{position:absolute;left:0;right:0;top:55%;height:2px;background:linear-gradient(90deg,var(--line) 0%,var(--cult-dim) 100%)}
.axis::after{content:"";position:absolute;right:-1px;top:-6px;border-left:12px solid var(--cult);border-top:7px solid transparent;border-bottom:7px solid transparent}
.range-label{position:absolute;top:calc(55% + 16px);font:var(--fs-tick)/1 var(--font-num);color:var(--text-3);font-variant-numeric:tabular-nums}
.range-label.start{left:0}.range-label.end{right:0}
.decade{position:absolute;top:0;bottom:0;border-left:1px dashed rgba(185,173,160,.22);pointer-events:none}
.decade span{position:absolute;left:7px;bottom:9px;font:var(--fs-tick)/1 var(--font-num);color:var(--text-3);font-variant-numeric:tabular-nums}
.photo{position:absolute;top:12px;width:400px;height:230px;margin:0}
.photo.first{left:0}.photo.last{right:0}
.photo::after{content:"";position:absolute;bottom:-27px;width:1px;height:27px;background:var(--line)}
.photo.first::after{left:64px}.photo.last::after{right:21px}
.photo img{filter:grayscale(.18) contrast(1.06);border:1px solid var(--line-soft)}
.photo figcaption{position:absolute;left:0;right:0;bottom:0;margin:0;padding:24px 12px 9px;background:linear-gradient(transparent,rgba(8,7,6,.94));color:var(--text);font-size:var(--fs-sec);line-height:1.35;border-radius:0 0 var(--r) var(--r)}
.photo figcaption b{display:block;font-size:var(--fs-body);margin-bottom:2px}
.photo.last figcaption{text-align:right}
.event{position:absolute;width:214px;line-height:1.35;padding:9px 10px 10px;border-top:1px solid var(--cult-dim);background:rgba(8,7,6,.46)}
.event.above{top:26px}
.event.below{top:calc(55% + 70px)}
.event .ey{font:600 var(--fs-label)/1.2 var(--font-num);color:var(--cult);font-variant-numeric:tabular-nums;margin-bottom:5px}
.event .name{font-size:var(--fs-sec);font-weight:700;color:var(--text);margin-bottom:3px}
.event .desc{font-size:var(--fs-label);line-height:1.42;color:var(--text-2)}
.tick{position:absolute;top:calc(55% - 7px);width:2px;height:16px;background:var(--cult);transform:translateX(-1px)}
.tick::after{content:"";position:absolute;left:-4px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--cult)}
.year{position:absolute;top:calc(55% - 31px);transform:translateX(-50%);font:600 var(--fs-label)/1 var(--font-num);color:var(--text);font-variant-numeric:tabular-nums}
.leader{position:absolute;width:1px;background:var(--line);transform:translateX(-.5px)}
.leader.up{top:242px;height:calc(55% - 242px)}
.leader.down{top:calc(55% + 9px);height:49px}
.gap-year{position:absolute;top:calc(55% + 21px);transform:translateX(-50%);padding:2px 7px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg);font:var(--fs-tick)/1.25 var(--font-num);color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.summary{flex:0 0 auto;display:grid;grid-template-columns:190px 1fr;align-items:center;gap:24px;padding:22px 20px 23px;border-left:4px solid var(--cult);background:linear-gradient(90deg,rgba(95,200,216,.09),rgba(95,200,216,.015) 70%,transparent)}
.summary .age{font-family:var(--font-num);color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.summary .age span{font-size:var(--fs-label);color:var(--text-3);font-family:var(--font-sans);margin-left:7px}
.summary p{margin:0;font-size:var(--fs-lead);line-height:1.5;color:var(--text-2)}
.summary .gene{color:var(--gene-2);font-weight:700}.summary .cult{color:var(--cult-2);font-weight:700}
</style>
</head>
<body data-page="34" data-total="44">
<div id="stage"><main id="main">
  <section class="timeline min0" id="timeline" aria-label="1900 到 1970 年的飞行技术时间线">
    <div class="axis" aria-hidden="true"></div>
    <span class="range-label start">1900</span><span class="range-label end">1970</span>
    <figure class="photo first">
      <img src="assets/img/wright-1903.jpg" alt="莱特飞行者号在沙地上首次动力飞行" title="莱特飞行者号首飞，1903 年 12 月 17 日，摄影 John T. Daniels · 公有领域">
      <figcaption><b><span class="num">1903</span> · 莱特兄弟首次动力飞行</b>12 秒，36.5 米，离地约 3 米</figcaption>
    </figure>
    <figure class="photo last">
      <img src="assets/img/moon-bootprint.jpg" alt="阿波罗 11 号宇航员留在月尘中的靴印" title="Apollo 11 靴印，1969 年 7 月 · NASA/JSC · 公有领域">
      <figcaption><b><span class="num">1969</span> · 阿波罗 11 号</b>第一次有人踩在另一个天体上</figcaption>
    </figure>
  </section>
  <section class="summary min0" aria-label="66 年的含义">
    <div class="age big">66<span>岁那年</span></div>
    <p>1903 年出生的人，在电视上看见了这只靴印。这 66 年里，人类的<span class="gene">基因组没有发生任何与飞行有关的变化</span>。<span class="cult">变的全是图纸、材料和算法。</span></p>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:4, title:'66 年', sub:'1903 年 12 月 17 日，一架帆布飞机离地 12 秒。1969 年 7 月 20 日，一只靴子踩进月尘。', foot:'一个人的一生，装得下这两件事。而基因在这 66 年里什么也没做。' });

var events = [
  {year:1903},
  {year:1926, name:'戈达德的第一枚液体火箭', desc:'飞了 2.5 秒，12.5 米高', side:'above', dx:-100},
  {year:1942, name:'V-2 首次越过 100 km', desc:'人造物体第一次进入太空', side:'below', dx:-107},
  {year:1957, name:'斯普特尼克 1 号', desc:'第一颗人造卫星，绕地球 96 分钟一圈', side:'above', dx:-350},
  {year:1961, name:'加加林', desc:'第一个进入轨道的人，绕地一圈 108 分钟', side:'below', dx:-145},
  {year:1969}
];
var timeline = document.getElementById('timeline');
function pct(year){ return (year - 1900) / (1970 - 1900) * 100; }
[1910,1920,1930,1940,1950,1960].forEach(function(year){
  var guide = document.createElement('i');
  guide.className = 'decade'; guide.style.left = pct(year) + '%';
  guide.innerHTML = '<span>' + year + '</span>';
  guide.setAttribute('aria-hidden','true'); timeline.appendChild(guide);
});
events.forEach(function(ev, i){
  var x = pct(ev.year);
  var tick = document.createElement('i');
  tick.className = 'tick'; tick.style.left = x + '%'; tick.setAttribute('aria-hidden','true'); timeline.appendChild(tick);
  var yr = document.createElement('span');
  yr.className = 'year'; yr.style.left = x + '%'; yr.textContent = ev.year; timeline.appendChild(yr);
  if(ev.name){
    var leader = document.createElement('i');
    leader.className = 'leader ' + (ev.side === 'above' ? 'up' : 'down'); leader.style.left = x + '%'; leader.setAttribute('aria-hidden','true'); timeline.appendChild(leader);
    var item = document.createElement('article');
    item.className = 'event ' + ev.side;
    item.style.left = 'calc(' + x + '% + ' + ev.dx + 'px)';
    item.innerHTML = '<div class="ey">' + ev.year + '</div><div class="name">' + ev.name + '</div><div class="desc">' + ev.desc + '</div>';
    timeline.appendChild(item);
  }
  if(i > 0){
    var previous = events[i-1].year;
    var gap = ev.year - previous;
    var mid = (pct(previous) + x) / 2;
    var label = document.createElement('span');
    label.className = 'gap-year'; label.style.left = mid + '%'; label.textContent = '+' + gap + ' 年'; timeline.appendChild(label);
  }
});
</script>
</body></html>
