<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{display:flex;flex-direction:column;height:100%;gap:14px}
.scene{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px}
.chart-panel{min-width:0;min-height:0;position:relative;padding:12px 14px 8px;background:rgba(25,21,18,.72);border:1px solid var(--line-soft);border-radius:var(--r)}
#chart{width:100%;height:100%;min-height:0}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}
.readout{padding:16px 18px 14px;border-left:3px solid var(--warn);background:linear-gradient(105deg,rgba(224,87,74,.10),rgba(25,21,18,.72) 58%)}
.readout .ttl{margin-bottom:5px}
.readout .big{color:#f07a6d}
.live-loss{font-size:var(--fs-sec);color:var(--text-2);margin-top:5px}
.eq{font-size:var(--fs-lead);line-height:1.4;margin-top:10px}
.eq .num{color:var(--gene-2);font-weight:700}
.values{display:grid;grid-template-columns:1fr auto;gap:5px 12px;padding-top:10px;margin-top:10px;border-top:1px solid var(--line-soft);font-size:var(--fs-label);color:var(--text-2)}
.values .num{color:var(--text)}
.values .ared{color:var(--cult-2)}
.values .ground{color:var(--gene-2)}
.callout{font-size:var(--fs-sec);line-height:1.5;color:var(--text-2);padding:0 4px}
.callout b:last-child{color:var(--cult-2)}
.photo{margin-top:auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;align-items:center}
.photo img{width:220px;height:150px;object-fit:cover}
.photo figcaption{margin:0;font-size:var(--fs-label);color:var(--text-2)}
.control{flex:0 0 auto;padding:12px 18px 10px;background:rgba(25,21,18,.74);border:1px solid var(--line-soft);border-radius:var(--r)}
.control .ctl{gap:14px}
.control .cl{font-weight:700;color:var(--text)}
.control .cv{min-width:74px;color:var(--cult-2);font-size:var(--fs-body);font-weight:700}
.scale-wrap{margin-left:94px;margin-right:88px;position:relative;height:26px;font-size:var(--fs-tick);font-family:var(--font-num);color:var(--text-3)}
.anchor{position:absolute;top:2px;transform:translateX(-50%);white-space:nowrap}
.anchor::before{content:"";display:block;width:1px;height:6px;background:var(--line);margin:0 auto 2px}
.anchor.a6{left:16.6667%}.anchor.a12{left:33.3333%}.anchor.a30{left:83.3333%}
.control-bottom{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:1px}
.formula{font-size:var(--fs-label);color:var(--text-3)}
</style>
</head>
<body data-page="36" data-total="44">
<div id="stage"><main id="main">
  <section class="scene min0" aria-label="三种情形下骨密度随任务时长的共同坐标比较">
    <div class="chart-panel min0">
      <div id="chart" role="img" aria-label="0 到 36 个月内，无对抗措施、有抗阻训练与药物、地面骨质疏松三种情形的剩余骨密度折线图"></div>
    </div>
    <aside class="side min0">
      <div class="readout">
        <div class="ttl warn">无对抗措施 · 剩余骨密度</div>
        <div><span id="bmdBig" class="big">91.3</span><span class="unit">%</span></div>
        <div class="live-loss">已经流失 <span id="lossVal" class="num">8.7%</span></div>
        <div class="eq">相当于在地面上老化 <span id="yearsVal" class="num">9</span> 年</div>
        <div class="values">
          <span>ARED 抗阻训练 + 药物</span><span id="aredVal" class="num ared">98.2%</span>
          <span>地面骨质疏松</span><span id="groundVal" class="num ground">99.5%</span>
        </div>
      </div>
      <div class="callout">6 个月不锻炼，骨密度掉 8.7%——<b>相当于在地面上老了 9 年</b>。所以空间站上每天必须花两小时锻炼。<b>这两小时不是健身，是维持。</b></div>
      <figure class="photo">
        <img src="assets/img/iss-treadmill.jpg" alt="宇航员在国际空间站跑步机上训练" title="国际空间站上的跑步机训练 · NASA · 公有领域">
        <figcaption>每天两小时抗阻与有氧训练，是把那条红线压成蓝线的全部办法。</figcaption>
      </figure>
    </aside>
  </section>
  <section class="control no-pan" aria-label="任务时长控制">
    <div class="ctl">
      <label class="cl" for="months">任务时长</label>
      <input id="months" type="range" min="0" max="36" step="1" value="6">
      <output id="monthOut" class="cv" for="months">6 个月</output>
    </div>
    <div class="scale-wrap" aria-hidden="true">
      <span class="anchor a6">6 一次空间站任务</span>
      <span class="anchor a12">12</span>
      <span class="anchor a30">30 火星往返（含地表）</span>
    </div>
    <div class="control-bottom">
      <div class="hint">拖任务时长，看骨头掉到什么程度</div>
      <div class="formula num">BMD(t) = 100 × (1 − r)<sup>t</sup></div>
    </div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
Chrome.mount({ act:5, title:'骨量：每月 1–1.5%', sub:'地面上骨质疏松是一年掉 1%。轨道上是一个月。', foot:'骨头还能靠跑步机救回来。下一样救不回来。' });

(function(){
  var rates={none:0.015,ared:0.003,ground:0.00083};
  function bmd(t,r){return 100*Math.pow(1-r,t);}
  function curve(r){var a=[];for(var t=0;t<=36;t++)a.push([t,+bmd(t,r).toFixed(3)]);return a;}
  var chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
  var colors={none:'#e0574a',ared:'#5fc8d8',ground:'#e0913a'};
  var months=document.getElementById('months');
  var monthOut=document.getElementById('monthOut');
  var bmdBig=document.getElementById('bmdBig');
  var lossVal=document.getElementById('lossVal');
  var yearsVal=document.getElementById('yearsVal');
  var aredVal=document.getElementById('aredVal');
  var groundVal=document.getElementById('groundVal');

  var option={
    animation:false,
    textStyle:{fontFamily:'Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif',fontSize:16,color:'#ece7df'},
    grid:{left:74,right:30,top:58,bottom:58,containLabel:false},
    legend:{top:8,left:66,itemWidth:24,itemHeight:3,itemGap:24,textStyle:{fontSize:14,color:'#b9ada0'},data:['微重力，无对抗措施','微重力，ARED + 药物','地面，骨质疏松']},
    tooltip:{show:false},
    xAxis:{type:'value',min:0,max:36,interval:6,name:'任务时长（月）',nameLocation:'middle',nameGap:38,nameTextStyle:{fontSize:14,color:'#b9ada0'},axisLabel:{fontSize:14,color:'#8b8078'},axisLine:{lineStyle:{color:'#5a4d43'}},axisTick:{lineStyle:{color:'#5a4d43'}},splitLine:{lineStyle:{color:'#2a231e'}}},
    yAxis:{type:'value',min:60,max:100,interval:10,name:'剩余骨密度（%）',nameGap:12,nameTextStyle:{fontSize:14,color:'#b9ada0',align:'left'},axisLabel:{fontSize:14,color:'#8b8078',formatter:'{value}%'},axisLine:{show:true,lineStyle:{color:'#5a4d43'}},axisTick:{show:true,lineStyle:{color:'#5a4d43'}},splitLine:{lineStyle:{color:'#2a231e'}}},
    series:[
      {name:'微重力，无对抗措施',type:'line',data:curve(rates.none),showSymbol:false,lineStyle:{width:4,color:colors.none},itemStyle:{color:colors.none}},
      {name:'微重力，ARED + 药物',type:'line',data:curve(rates.ared),showSymbol:false,lineStyle:{width:3,color:colors.ared},itemStyle:{color:colors.ared}},
      {name:'地面，骨质疏松',type:'line',data:curve(rates.ground),showSymbol:false,lineStyle:{width:3,color:colors.ground,type:'dashed'},itemStyle:{color:colors.ground}}
    ]
  };
  chart.setOption(option);

  function update(){
    var t=+months.value;
    var n=bmd(t,rates.none),a=bmd(t,rates.ared),g=bmd(t,rates.ground),loss=100-n;
    monthOut.textContent=t+' 个月';
    bmdBig.textContent=n.toFixed(1);
    lossVal.textContent=loss.toFixed(1)+'%';
    yearsVal.textContent=String(Math.round(loss));
    aredVal.textContent=a.toFixed(1)+'%';
    groundVal.textContent=g.toFixed(1)+'%';
    chart.setOption({series:[
      {markLine:{silent:true,symbol:'none',label:{show:true,formatter:t+' 个月',position:'insideEndTop',fontSize:14,color:'#ece7df'},lineStyle:{color:'#ece7df',width:1,opacity:.65,type:'solid'},data:[{xAxis:t}]},markPoint:{silent:true,symbol:'circle',symbolSize:10,label:{show:false},data:[{coord:[t,n]}]}},
      {markPoint:{silent:true,symbol:'circle',symbolSize:9,label:{show:false},data:[{coord:[t,a]}]}},
      {markPoint:{silent:true,symbol:'circle',symbolSize:9,label:{show:false},data:[{coord:[t,g]}]}}
    ]});
  }
  months.addEventListener('input',update);
  update();
  Deck.onResize(function(){chart.resize();});
})();
</script>
</body></html>
