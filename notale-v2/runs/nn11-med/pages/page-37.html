<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;}
.scene{height:100%;display:flex;flex-direction:column;gap:12px;}
.hero{flex:1 1 auto;min-height:0;position:relative;border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;background:linear-gradient(115deg,rgba(224,145,58,.055),rgba(25,21,18,.88) 42%,rgba(95,200,216,.035));}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 44%,rgba(224,145,58,.08),transparent 32%);}
.hero canvas{z-index:1;}
.status{position:absolute;z-index:2;left:20px;top:16px;display:flex;align-items:center;gap:9px;font-size:var(--fs-label);color:var(--text-2);}
.status i{width:8px;height:8px;border-radius:50%;background:var(--gene);box-shadow:0 0 14px rgba(224,145,58,.7);}
.volume{position:absolute;z-index:2;left:26px;top:66px;width:285px;border-left:3px solid var(--gene);padding-left:16px;}
.volume .big{color:var(--gene-2);}
.volume p{margin:8px 0 0;color:var(--text-2);font-size:var(--fs-sec);line-height:1.45;}
.replay{position:absolute;z-index:3;right:20px;top:16px;}
.misread{position:absolute;z-index:2;left:26px;bottom:22px;width:315px;padding:12px 15px;border-radius:8px;background:rgba(15,13,12,.78);border:1px solid var(--line-soft);font-size:var(--fs-sec);line-height:1.45;color:var(--text-2);}
.misread b{color:var(--warn);font-family:var(--font-num);}
.quote{position:absolute;z-index:2;right:24px;top:74px;width:390px;font-size:var(--fs-lead);line-height:1.5;color:var(--text-2);padding-left:16px;border-left:3px solid var(--gene-dim);}
.quote strong{display:block;margin-top:4px;color:var(--text);font-size:var(--fs-h2);}
.counter{position:absolute;z-index:2;right:24px;bottom:22px;width:390px;font-size:var(--fs-sec);line-height:1.45;color:var(--text-2);}
.counter .tag{margin-right:7px;}
.chain{flex:0 0 auto;display:grid;grid-template-columns:1fr 28px 1.12fr 28px 1.38fr 28px 1.22fr 28px 1.28fr 28px 1.08fr;align-items:stretch;}
.chain .step{min-width:0;position:relative;padding:10px 12px 9px;border-top:2px solid var(--line);background:rgba(25,21,18,.62);font-size:var(--fs-sec);line-height:1.38;color:var(--text-2);}
.chain .step:first-child{border-color:var(--text-3);border-radius:8px 0 0 8px;}
.chain .step.body{border-color:var(--gene-dim);}
.chain .step.risk{border-color:var(--warn);}
.chain .step:last-child{border-radius:0 8px 8px 0;}
.chain .k{display:block;margin-bottom:4px;font-size:var(--fs-label);font-weight:700;color:var(--text);}
.chain .num{color:var(--gene-2);font-weight:700;}
.chain .en{font-family:var(--font-num);font-size:var(--fs-label);color:var(--gene-2);}
.chain .risk .k,.chain .risk .num{color:#f0968c;}
.chain .arw{align-self:center;text-align:center;color:var(--gene);font-size:var(--fs-h2);line-height:1;}
.chain .arw::before{content:"→";}
.sans-note{position:absolute;right:12px;bottom:7px;font-size:var(--fs-tick);color:var(--text-3);font-family:var(--font-num);}
@media (prefers-reduced-motion:reduce){.status i{box-shadow:none;}}
</style>
</head>
<body data-page="37" data-total="44">
<div id="stage"><main id="main">
  <section class="scene min0" aria-label="失重导致体液上移并引发视力变化的因果过程">
    <div class="hero cvbox min0">
      <canvas id="bodyCanvas" class="cv-fill" aria-hidden="true"></canvas>
      <div class="status"><i></i><span id="statusText">迁移已完成</span></div>
      <div class="volume"><div><span class="big sm">≈ 2</span><span class="unit">升</span></div><p>体液从下肢移向胸腔与头部</p></div>
      <button id="replay" class="btn replay" type="button" aria-label="重播体液上移动画">↻ 重播</button>
      <div class="misread">最初几天，身体误判为“血太多”并排水：<br>血浆容量 <b>↓ 10–15%</b></div>
      <div class="quote">地面上你躺一晚上，体液也会上移一点——早上起来脸会肿。<strong>失重就是那一晚永远不结束。</strong></div>
      <div class="counter"><span class="tag warn">仍在试验</span>下体负压装置、颈部套囊；目前没有成熟方案</div>
    </div>

    <div class="chain" role="img" aria-label="失重到远视漂移的六步因果链">
      <div class="step"><span class="k">失重</span>脚下压力梯度消失</div><div class="arw"></div>
      <div class="step body"><span class="k"><span class="num">≈ 2 L</span> 上移</span>下肢 → 胸腔、头部</div><div class="arw"></div>
      <div class="step body"><span class="k">外观先变</span><span class="en">puffy face</span> 月亮脸<br><span class="en">bird legs</span> 鸟腿</div><div class="arw"></div>
      <div class="step risk"><span class="k">压力升高</span>头部静脉压、颅内压上升</div><div class="arw"></div>
      <div class="step risk"><span class="k">眼后部受压</span>眼球后极变平、视盘水肿</div><div class="arw"></div>
      <div class="step risk"><span class="k">远视漂移 · SANS</span>长期任务报告率 <span class="num">&gt; 60%</span><br>部分人返回后未完全恢复</div>
    </div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:5, title:'两升体液往上跑', sub:'循环系统是按"站着"校准的。躺平了还好说，永远失重就不一样了。', foot:'骨和血还能调。下一样是身体根本挡不住的。' });

(function(){
  var cv=document.getElementById('bodyCanvas');
  var replay=document.getElementById('replay');
  var status=document.getElementById('statusText');
  var progress=1;
  var stopCurrent=null;

  function ease(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}

  function draw(p){
    progress=p;
    var ctx=Deck.fit(cv), w=cv.offsetWidth, h=cv.offsetHeight;
    ctx.clearRect(0,0,w,h);
    var cx=w*.515, base=h-23;
    var gene=Deck.token('--gene'), gene2=Deck.token('--gene-2');
    var text2=Deck.token('--text-2'), line=Deck.token('--line');

    // Ground reference and the vanished gravity cue.
    ctx.strokeStyle=Deck.rgba('--text-3',.22);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx-180,base);ctx.lineTo(cx+180,base);ctx.stroke();
    ctx.setLineDash([5,7]);ctx.beginPath();ctx.moveTo(cx-146,50);ctx.lineTo(cx-146,base-15);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=text2;ctx.globalAlpha=.72;ctx.font='15px '+getComputedStyle(document.documentElement).getPropertyValue('--font-sans');ctx.textAlign='center';
    ctx.fillText('重力梯度消失',cx-146,41);ctx.globalAlpha=1;

    // Body outline, morphing from normal distribution to puffy face / bird legs.
    var headR=30+9*p, calf=27-10*p, shoulder=66, hip=43;
    ctx.strokeStyle=Deck.rgba('--text',.78);ctx.fillStyle=Deck.rgba('--text',.035);ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(cx,70,headR,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx-shoulder,119);ctx.quadraticCurveTo(cx-54,190,cx-hip,255);
    ctx.lineTo(cx-calf,base-60);ctx.quadraticCurveTo(cx-calf,base-22,cx-17,base);
    ctx.lineTo(cx+17,base);ctx.quadraticCurveTo(cx+calf,base-22,cx+calf,base-60);
    ctx.lineTo(cx+hip,255);ctx.quadraticCurveTo(cx+54,190,cx+shoulder,119);ctx.closePath();ctx.fill();ctx.stroke();
    // arms
    ctx.beginPath();ctx.moveTo(cx-58,132);ctx.quadraticCurveTo(cx-92,205,cx-82,286);ctx.moveTo(cx+58,132);ctx.quadraticCurveTo(cx+92,205,cx+82,286);ctx.stroke();

    // Fluid reservoirs. Legs fade while chest/head fill.
    var legAlpha=.72-.48*p, upperAlpha=.17+.55*p;
    var g1=ctx.createLinearGradient(0,245,0,base);g1.addColorStop(0,Deck.rgba('--gene',legAlpha*.35));g1.addColorStop(1,Deck.rgba('--gene',legAlpha));
    ctx.fillStyle=g1;
    ctx.beginPath();ctx.moveTo(cx-39,258);ctx.lineTo(cx-17,base-8);ctx.lineTo(cx-31,base-8);ctx.lineTo(cx-53,258);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(cx+39,258);ctx.lineTo(cx+17,base-8);ctx.lineTo(cx+31,base-8);ctx.lineTo(cx+53,258);ctx.closePath();ctx.fill();
    var g2=ctx.createRadialGradient(cx,148,12,cx,148,112);g2.addColorStop(0,Deck.rgba('--gene',upperAlpha));g2.addColorStop(1,Deck.rgba('--gene',upperAlpha*.08));
    ctx.fillStyle=g2;ctx.beginPath();ctx.ellipse(cx,170,57,105,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=Deck.rgba('--gene',.10+.42*p);ctx.beginPath();ctx.arc(cx,70,headR-5,0,Math.PI*2);ctx.fill();

    // Rising packets communicate direction, not ambient decoration.
    for(var i=0;i<9;i++){
      var phase=(p*1.5+i/9)%1;
      var y=base-70-phase*(base-145);
      var x=cx+Math.sin(i*2.4)*24;
      ctx.fillStyle=Deck.rgba('--gene',.22+.55*(1-phase));
      ctx.beginPath();ctx.arc(x,y,4+(i%3),0,Math.PI*2);ctx.fill();
    }
    ctx.strokeStyle=gene;ctx.lineWidth=2;ctx.globalAlpha=.78;
    Deck.arrow(ctx,cx-88,base-62,cx-88,145,9);Deck.arrow(ctx,cx+88,base-62,cx+88,145,9);ctx.globalAlpha=1;

    // Local labels remain adjacent to the changing anatomy.
    ctx.textAlign='left';ctx.font='600 16px '+getComputedStyle(document.documentElement).getPropertyValue('--font-sans');ctx.fillStyle=gene2;
    ctx.fillText('脸部变圆',cx+82,78);ctx.fillText('小腿变细',cx+57,base-42);
    ctx.strokeStyle=Deck.rgba('--gene',.55);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx+42,76);ctx.lineTo(cx+72,76);ctx.moveTo(cx+28,base-48);ctx.lineTo(cx+49,base-43);ctx.stroke();
  }

  function showFinal(){
    var firstStop;
    firstStop=Deck.loop(function(){draw(1);if(firstStop)firstStop();},{still:6000});
  }

  function play(){
    if(stopCurrent)stopCurrent();
    replay.disabled=true;status.textContent='体液正在上移…';
    stopCurrent=Deck.loop(function(t){
      var p=Math.min(1,t/6000);
      draw(ease(p));
      if(p>=1){stopCurrent();stopCurrent=null;replay.disabled=false;status.textContent='迁移已完成';}
    },{still:6000});
  }

  replay.addEventListener('click',play);
  Deck.onResize(function(){draw(progress);});
  showFinal();
})();
</script>
</body></html>
