<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:12px}
.taskbar{flex:0 0 auto;display:flex;align-items:flex-start;gap:18px;padding:12px 16px;border:1px solid var(--line-soft);border-radius:var(--r);background:rgba(25,21,18,.72)}
.task-select{flex:1 1 auto;display:flex;flex-direction:column;gap:9px}
.task-head{display:flex;align-items:center;justify-content:space-between;gap:16px}
.task-head .ttl{margin:0}
.btns{flex-wrap:nowrap}
.btn{white-space:nowrap;padding:8px 13px}
.custom-controls{flex:0 0 560px;display:none;grid-template-columns:1fr;gap:5px;padding-left:18px;border-left:1px solid var(--line)}
.custom-controls.show{display:grid}
.custom-controls .ctl{min-height:27px}
.custom-controls .cl{width:116px}
.custom-controls .cv{width:55px;text-align:right}
.workspace{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,2.05fr) minmax(390px,.95fr);gap:16px}
.chart-panel{position:relative;min-height:0;padding:10px 16px 8px;border:1px solid var(--line-soft);border-radius:var(--r);background:rgba(15,13,12,.5);display:flex;flex-direction:column}
.chart-kicker{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 4px 2px}
.chart-kicker .ttl{margin:0}
.axis-note{font-size:var(--fs-label);color:var(--text-3)}
#dose-chart{flex:1 1 auto;min-height:0;width:100%}
.chart-note{flex:0 0 auto;margin:1px 4px 0;font-size:var(--fs-label);line-height:1.35;color:var(--text-3)}
.readout{min-height:0;display:flex;flex-direction:column;border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;background:rgba(25,21,18,.82)}
.total{padding:14px 18px 12px;border-bottom:1px solid var(--line-soft)}
.total .ttl{margin-bottom:7px}
.total .big{color:var(--warn);font-size:44px}
.metrics{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line-soft)}
.metric{padding:11px 15px;min-width:0}
.metric:nth-child(odd){border-right:1px solid var(--line-soft)}
.metric:nth-child(-n+2){border-bottom:1px solid var(--line-soft)}
.metric .label{font-size:var(--fs-label);color:var(--text-3);line-height:1.35}
.metric .value{margin-top:3px;font-family:var(--font-num);font-size:var(--fs-h2);line-height:1.15;font-variant-numeric:tabular-nums;color:var(--text)}
.metric .value.warn{color:var(--warn)}
.verdict{flex:1 1 auto;min-height:0;padding:13px 17px 12px;border-left:4px solid var(--warn);display:flex;flex-direction:column;justify-content:center;gap:7px}
.verdict-main{font-size:var(--fs-lead);line-height:1.42;font-weight:700}
.verdict-main .pct{font-family:var(--font-num);color:var(--warn);font-variant-numeric:tabular-nums}
.verdict-sub{font-size:var(--fs-sec);line-height:1.45;color:var(--text-2)}
.verdict-sub strong{color:var(--warn)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body data-page="38" data-total="44">
<div id="stage"><main id="main">
  <section class="taskbar min0" aria-label="任务设定">
    <div class="task-select min0">
      <div class="task-head">
        <p class="ttl">任务设定</p>
        <div class="hint">选一个任务，或自己定天数</div>
      </div>
      <div class="btns" role="group" aria-label="选择任务">
        <button class="btn" type="button" data-mode="iss180" aria-pressed="false">空间站 6 个月</button>
        <button class="btn" type="button" data-mode="iss365" aria-pressed="false">空间站 1 年</button>
        <button class="btn" type="button" data-mode="mars" aria-pressed="true">火星往返（巡航 360 天 + 地表 500 天）</button>
        <button class="btn" type="button" data-mode="custom" aria-pressed="false">自定义</button>
      </div>
    </div>
    <div class="custom-controls min0" id="custom-controls">
      <label class="ctl"><span class="cl">巡航天数</span><input class="no-pan" id="cruise-days" type="range" min="0" max="500" step="1" value="360"><span class="cv" id="cruise-out">360 天</span></label>
      <label class="ctl"><span class="cl">地表/在轨天数</span><input class="no-pan" id="local-days" type="range" min="0" max="600" step="1" value="500"><span class="cv" id="local-out">500 天</span></label>
    </div>
  </section>

  <section class="workspace min0">
    <div class="chart-panel min0">
      <div class="chart-kicker">
        <p class="ttl">所有条共用同一根剂量轴</p>
        <span class="axis-note num">mSv · 对数刻度</span>
      </div>
      <div id="dose-chart" role="img" aria-label="地面本底、胸部 CT、空间站、深空巡航、火星地表与当前任务累计辐射剂量的共同对数轴条形图"></div>
      <p class="chart-note">空间站在 400 km 高度，仍受部分磁层保护；Curiosity RAD 实测地火往返巡航约 660 mSv；火星地表还有稀薄大气与星体遮挡。</p>
    </div>

    <aside class="readout min0" aria-live="polite">
      <div class="total">
        <p class="ttl">累计剂量</p>
        <span class="big" id="total-dose">982.4</span><span class="unit">mSv</span>
      </div>
      <div class="metrics">
        <div class="metric"><div class="label">相当于胸部 CT</div><div class="value" id="ct-equiv">≈ 140 次</div></div>
        <div class="metric"><div class="label">相当于地面本底</div><div class="value" id="bg-equiv">≈ 409 年</div></div>
        <div class="metric"><div class="label">NASA 生涯上限</div><div class="value warn" id="nasa-pct">164%</div></div>
        <div class="metric"><div class="label">当前任务时长</div><div class="value" id="duration">860 天</div></div>
      </div>
      <div class="verdict">
        <div class="verdict-main">一次火星往返就把 NASA 给一个人<strong>一辈子</strong>的额度用掉 <span class="pct" id="claim-pct">164%</span>。</div>
        <div class="verdict-sub">而这不是工程问题——<strong>没有任何一种已知的材料</strong>能在可发射的质量内挡住银河宇宙射线。</div>
      </div>
    </aside>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
Chrome.mount({ act:5, title:'没有磁层的日子', sub:'地球有一层大气和一个磁场替我们挡射线。出了这两层，什么都没有。', foot:'骨、血、DNA 都靠不住。剩下的办法只有一个：把地球的条件随身带着。' });

(function(){
  var rates={iss:0.72,cruise:1.84,mars:0.64};
  var state={mode:'mars',cruise:360,local:500};
  var chart=echarts.init(document.getElementById('dose-chart'),null,{renderer:'svg'});
  var buttons=[].slice.call(document.querySelectorAll('[data-mode]'));
  var custom=document.getElementById('custom-controls');
  var cruise=document.getElementById('cruise-days');
  var local=document.getElementById('local-days');

  function model(){
    if(state.mode==='iss180') return {issDays:180,cruiseDays:0,marsDays:0,label:'空间站 6 个月'};
    if(state.mode==='iss365') return {issDays:365,cruiseDays:0,marsDays:0,label:'空间站 1 年'};
    if(state.mode==='mars') return {issDays:0,cruiseDays:360,marsDays:500,label:'火星往返'};
    return {issDays:0,cruiseDays:state.cruise,marsDays:state.local,label:'自定义任务'};
  }
  function fmtDose(v){return v>=100?v.toFixed(1):v.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');}
  function update(){
    var m=model();
    var issDose=rates.iss*m.issDays;
    var cruiseDose=rates.cruise*m.cruiseDays;
    var marsDose=rates.mars*m.marsDays;
    var total=issDose+cruiseDose+marsDose;
    var pct=Math.round(total/600*100);
    document.getElementById('total-dose').textContent=fmtDose(total);
    document.getElementById('ct-equiv').textContent='≈ '+Math.round(total/7)+' 次';
    document.getElementById('bg-equiv').textContent='≈ '+Math.round(total/2.4)+' 年';
    document.getElementById('nasa-pct').textContent=pct+'%';
    document.getElementById('duration').textContent=(m.issDays+m.cruiseDays+m.marsDays)+' 天';
    document.getElementById('cruise-out').textContent=state.cruise+' 天';
    document.getElementById('local-out').textContent=state.local+' 天';

    var labels=['地面天然本底 · 2.4/年','一次胸部 CT · 单次','空间站 · 0.72/天','深空巡航 · 1.84/天','火星地表 · 0.64/天','当前任务累计'];
    var vals=[2.4,7,issDose,cruiseDose,marsDose,total];
    chart.setOption({
      animation:false,
      textStyle:{fontFamily:'Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif',fontSize:16,color:'#ece7df'},
      grid:{left:202,right:52,top:16,bottom:48,containLabel:false},
      tooltip:{show:false},
      xAxis:{type:'log',logBase:10,min:0.1,max:2000,
        axisLine:{lineStyle:{color:'#5c5148'}},axisTick:{show:false},splitLine:{show:true,lineStyle:{color:'#2a231e'}},
        axisLabel:{fontSize:14,color:'#a99e93',formatter:function(v){var map={0.1:'0.1',1:'1',10:'10',100:'100',1000:'1,000'};return map[v]||'';}}
      },
      yAxis:{type:'category',inverse:true,data:labels,axisLine:{show:false},axisTick:{show:false},axisLabel:{fontSize:14,color:'#b9ada0',width:186,overflow:'truncate',margin:14}},
      series:[{type:'bar',barWidth:22,data:vals.map(function(v,i){return {value:Math.max(v,0.1),itemStyle:{color:i===5?'#e0574a':(i<2?'#8b8078':'#c66f45'),opacity:v===0?0.16:1,borderRadius:[0,4,4,0]},label:{show:v>0,position:'right',distance:8,color:i===5?'#f0968c':'#ece7df',fontFamily:'ui-monospace, SFMono-Regular, Menlo, monospace',fontSize:14,formatter:fmtDose(v)+' mSv'}};}),
        markLine:{silent:true,symbol:'none',lineStyle:{type:'dashed',width:2,color:'#d0c4b7'},label:{show:true,position:'insideEndTop',fontSize:14,color:'#ece7df',backgroundColor:'#221b16',padding:[4,7],borderRadius:3},data:[
          {xAxis:20,label:{formatter:'工作人员年限值 20'}},
          {xAxis:600,lineStyle:{color:'#e0574a',type:'dashed',width:2},label:{formatter:'NASA 生涯上限 600',color:'#f0968c'}}
        ]}
      }]
    },true);
  }
  buttons.forEach(function(btn){btn.addEventListener('click',function(){
    state.mode=btn.getAttribute('data-mode');
    buttons.forEach(function(b){b.setAttribute('aria-pressed',String(b===btn));});
    custom.classList.toggle('show',state.mode==='custom');
    update();
  });});
  cruise.addEventListener('input',function(){state.cruise=Number(cruise.value);update();});
  local.addEventListener('input',function(){state.local=Number(local.value);update();});
  Deck.onResize(function(){chart.resize();});
  update();
})();
</script>
</body></html>
