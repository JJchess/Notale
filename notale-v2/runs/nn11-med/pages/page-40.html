<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:12px}
.workspace{flex:1 1 auto;display:grid;grid-template-columns:420px minmax(0,1fr);gap:16px;min-height:0}
.controls{display:flex;flex-direction:column;gap:15px;padding:17px 20px}
.controls .ttl{margin-bottom:0}
.control-group{display:grid;gap:8px}
.control-group .ctl{display:grid;grid-template-columns:74px minmax(0,1fr) 76px;gap:10px}
.control-group .cv{text-align:right;color:var(--cult-2)}
.scale-ends{display:flex;justify-content:space-between;padding-left:84px;font-size:var(--fs-tick);line-height:1;color:var(--text-3);font-family:var(--font-num)}
.scheme-label{font-size:var(--fs-label);color:var(--text-2);font-weight:700}
.scheme-btns{display:grid;gap:7px}
.scheme-btns .btn{text-align:left;line-height:1.25;padding:9px 12px}
.hint{margin-top:auto}
.result{border-top:1px solid var(--line-soft);padding-top:13px}
.result-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.result .big{color:var(--text)}
.tonnes{font-family:var(--font-num);font-size:var(--fs-lead);color:var(--cult-2);white-space:nowrap;padding-bottom:3px}
.estimate{margin-top:6px;font-size:var(--fs-label);color:var(--text-3)}
.viz{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px;min-height:0}
.chart-panel{display:flex;flex-direction:column;min-height:0;padding:14px 18px 10px}
.chart-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.chart-top .ttl{margin:0}
.design-note{font-size:var(--fs-label);color:var(--text-3)}
#chart{flex:1 1 auto;min-height:0;width:100%}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.metric{padding:11px 16px;min-width:0}
.metric+.metric{border-left:1px solid var(--line)}
.metric .m-label{font-size:var(--fs-label);color:var(--text-3);line-height:1.35}
.metric .m-value{font-family:var(--font-num);font-size:var(--fs-h2);line-height:1.25;color:var(--text);font-variant-numeric:tabular-nums;margin-top:3px;white-space:nowrap}
.metric .m-note{font-size:var(--fs-label);line-height:1.35;color:var(--text-3);margin-top:2px}
.takeaway{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:28px;border-left:4px solid var(--cult);padding:8px 18px;background:linear-gradient(90deg,rgba(95,200,216,.09),transparent 70%)}
.takeaway p{margin:0;font-size:var(--fs-lead);line-height:1.45;color:var(--text-2)}
.takeaway strong{color:var(--text)}
.takeaway .last{font-size:var(--fs-h2);font-weight:700;color:var(--cult-2);white-space:nowrap}
</style>
</head>
<body data-page="40" data-total="44">
<div id="stage"><main id="main">
  <section class="workspace min0">
    <div class="panel controls min0" aria-label="物资账计算器">
      <div class="ttl cult">任务参数</div>
      <div class="control-group">
        <label class="ctl" for="crew"><span class="cl">乘员数</span><input id="crew" type="range" min="1" max="6" step="1" value="6"><output class="cv" id="crewOut">6 人</output></label>
      </div>
      <div class="control-group">
        <label class="ctl" for="days"><span class="cl">任务天数</span><input id="days" type="range" min="0" max="1000" step="1" value="752" aria-valuemin="1" aria-valuemax="1000" aria-valuenow="180"><output class="cv" id="daysOut">180 天</output></label>
        <div class="scale-ends"><span>1</span><span>10</span><span>100</span><span>1000 天</span></div>
      </div>
      <div class="control-group">
        <div class="scheme-label">回收方案</div>
        <div class="scheme-btns" role="group" aria-label="选择回收方案">
          <button class="btn" type="button" data-scheme="none" aria-pressed="false">不回收</button>
          <button class="btn cult" type="button" data-scheme="iss" aria-pressed="true">国际空间站现行（水 98% + 氧 50%）</button>
          <button class="btn" type="button" data-scheme="water" aria-pressed="false">只回收水</button>
        </div>
      </div>
      <div class="hint">调乘员数和天数，再切换回收方案</div>
      <div class="result" aria-live="polite">
        <div class="result-head">
          <div><div class="small">总补给质量</div><div class="big" id="totalKg">2,506<span class="unit">kg</span></div></div>
          <div class="tonnes" id="totalTonnes">2.51 吨</div>
        </div>
        <div class="estimate">设计口径估计 · 每人每天当场乘算</div>
      </div>
    </div>

    <div class="viz min0">
      <div class="panel chart-panel min0">
        <div class="chart-top">
          <div class="ttl">同一根质量轴（kg）</div>
          <div class="design-note">基准：氧 0.84 · 水 5.0 · 食物 1.8 kg/人·天</div>
        </div>
        <div id="chart" role="img" aria-label="不回收与当前所选回收方案的补给质量对比图"></div>
      </div>
      <div class="metrics" aria-label="补给质量换算">
        <div class="metric"><div class="m-label">约合货运飞船</div><div class="m-value" id="ships">1.0 次</div><div class="m-note">假设每次上行约 2,500 kg</div></div>
        <div class="metric"><div class="m-label">送到近地轨道的费用</div><div class="m-value" id="cost">752 万美元</div><div class="m-note">按 3,000 美元/kg，量级估计</div></div>
        <div class="metric"><div class="m-label">回收后食物占比</div><div class="m-value" id="foodShare">77.6%</div><div class="m-note">回收越充分，吃的越显眼</div></div>
      </div>
    </div>
  </section>

  <section class="takeaway" aria-label="关键结论">
    <p>水可以回收到 98%，氧可以电解一半回来，<strong>食物一克也回收不了</strong>。长期任务最后剩下的最大一块，是吃的。</p>
    <div class="last">所有方案最后都绕回：种地</div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
Chrome.mount({ act:5, title:'一个人一天要多少', sub:'氧气 0.84 公斤，水 5 公斤，食物 1.8 公斤。一天 7.6 公斤，一样都不能少。', foot:'这些数字全部指向同一件事——去写幕 VI 的那句结论。' });

(function(){
  var crewEl=document.getElementById('crew');
  var daysEl=document.getElementById('days');
  var scheme='iss';
  var chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
  var base={oxygen:0.84,water:5.0,food:1.8};
  var schemes={
    none:{label:'不回收',oxygen:0.84,water:5.0,food:1.8},
    iss:{label:'ISS 现行回收',oxygen:0.42,water:0.10,food:1.8},
    water:{label:'只回收水',oxygen:0.84,water:0.10,food:1.8}
  };
  function daysFromSlider(){return Math.max(1,Math.round(Math.pow(1000,Number(daysEl.value)/1000)));}
  function fmt(n,d){return n.toLocaleString('zh-CN',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
  function update(){
    var crew=Number(crewEl.value),days=daysFromSlider(),mult=crew*days,s=schemes[scheme];
    daysEl.setAttribute('aria-valuenow',String(days));
    document.getElementById('crewOut').textContent=crew+' 人';
    document.getElementById('daysOut').textContent=fmt(days)+' 天';
    var current={oxygen:s.oxygen*mult,water:s.water*mult,food:s.food*mult};
    var original={oxygen:base.oxygen*mult,water:base.water*mult,food:base.food*mult};
    var total=current.oxygen+current.water+current.food;
    var originalTotal=original.oxygen+original.water+original.food;
    document.getElementById('totalKg').innerHTML=fmt(total)+'<span class="unit">kg</span>';
    document.getElementById('totalTonnes').textContent=fmt(total/1000,2)+' 吨';
    document.getElementById('ships').textContent=fmt(total/2500,1)+' 次';
    document.getElementById('cost').textContent=fmt(total*3000/10000)+' 万美元';
    document.getElementById('foodShare').textContent=fmt(current.food/total*100,1)+'%';
    var max=Math.ceil(originalTotal/1000)*1000;
    var rows=['不回收',s.label];
    chart.setOption({
      animationDuration:260,
      textStyle:{fontFamily:'Noto Sans SC, Source Han Sans SC, sans-serif',fontSize:16,color:'#b9ada0'},
      color:['#b9ada0','#5fc8d8','#e0913a'],
      legend:{top:4,right:4,itemWidth:15,itemHeight:10,textStyle:{fontSize:14,color:'#b9ada0'},data:['氧气','水','食物']},
      grid:{left:112,right:102,top:48,bottom:42,containLabel:false},
      xAxis:{type:'value',min:0,max:max,name:'kg',nameTextStyle:{fontSize:14,color:'#8b8078',padding:[22,0,0,0]},axisLabel:{fontSize:14,color:'#8b8078',formatter:function(v){return fmt(v);}},axisLine:{show:true,lineStyle:{color:'#5a4c40'}},axisTick:{show:true,lineStyle:{color:'#5a4c40'}},splitLine:{show:true,lineStyle:{color:'#2a231e'}}},
      yAxis:{type:'category',data:rows,axisLabel:{fontSize:16,color:function(v){return v==='不回收'?'#b9ada0':'#9de3ee';},width:94,overflow:'truncate'},axisLine:{show:false},axisTick:{show:false}},
      series:[
        {name:'氧气',type:'bar',stack:'total',barWidth:42,data:[original.oxygen,current.oxygen],label:{show:true,position:'inside',fontSize:14,color:'#0f0d0c',formatter:function(p){return p.value/max>.075?fmt(p.value):'';}}},
        {name:'水',type:'bar',stack:'total',barWidth:42,data:[original.water,current.water],label:{show:true,position:'inside',fontSize:14,color:'#0f0d0c',formatter:function(p){return p.value/max>.075?fmt(p.value):'';}}},
        {name:'食物',type:'bar',stack:'total',barWidth:42,data:[original.food,current.food],label:{show:true,position:'inside',fontSize:14,color:'#0f0d0c',formatter:function(p){return p.value/max>.075?fmt(p.value):'';}}},
        {name:'总量',type:'scatter',symbolSize:1,data:[[originalTotal,0],[total,1]],label:{show:true,position:'right',distance:9,fontSize:16,fontWeight:700,color:'#ece7df',formatter:function(p){return fmt(p.value[0])+' kg';}},tooltip:{show:false},z:5}
      ],
      tooltip:{trigger:'axis',axisPointer:{type:'shadow'},textStyle:{fontSize:16},formatter:function(ps){var out='<b>'+ps[0].axisValue+'</b>';ps.forEach(function(p){if(p.seriesName!=='总量')out+='<br>'+p.marker+p.seriesName+'：'+fmt(p.value,1)+' kg';});return out;}}
    },true);
  }
  crewEl.addEventListener('input',update);
  daysEl.addEventListener('input',update);
  document.querySelectorAll('[data-scheme]').forEach(function(btn){btn.addEventListener('click',function(){scheme=btn.dataset.scheme;document.querySelectorAll('[data-scheme]').forEach(function(b){b.setAttribute('aria-pressed',String(b===btn));});update();});});
  Deck.onResize(function(){chart.resize();});
  update();
})();
</script>
</body></html>
