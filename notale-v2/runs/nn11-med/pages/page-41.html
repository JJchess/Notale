<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
  #main{height:100%;}
  .summary{
    height:100%;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .claim{
    flex:0 0 auto;
    max-width:1360px;
    border-left-color:var(--gene);
    padding-top:7px;
    padding-bottom:7px;
  }
  .claim .turn{color:var(--cult-2);}
  .evidence{
    flex:1 1 auto;
    min-height:0;
    position:relative;
    display:flex;
    flex-direction:column;
    padding-left:28px;
  }
  .evidence .trunk{
    left:6px;
    top:34px;
    bottom:24px;
    background:linear-gradient(180deg,var(--gene-dim),var(--line) 42%,var(--cult-dim));
  }
  .columns{
    display:grid;
    grid-template-columns:1.03fr 1fr 1.12fr;
    column-gap:0;
    align-items:end;
    min-height:34px;
    border-bottom:1px solid var(--line);
  }
  .columns > div{
    min-width:0;
    padding:0 18px 8px;
    font-size:var(--fs-label);
    line-height:1.35;
    font-weight:700;
    letter-spacing:.05em;
    color:var(--text-3);
  }
  .columns .body-h{color:var(--gene);}
  .columns .out-h{
    color:var(--cult);
    border-left:1px solid var(--cult-dim);
    background:linear-gradient(90deg,rgba(95,200,216,.07),transparent 72%);
  }
  .supports{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-rows:repeat(5,1fr);
    gap:0;
  }
  .support{
    padding:0;
    display:grid;
    grid-template-columns:1.03fr 1fr 1.12fr;
    align-items:stretch;
    color:var(--text-2);
    border-bottom:1px solid var(--line-soft);
  }
  .support:last-child{border-bottom:0;}
  .support::before{
    left:-22px;
    top:50%;
    width:22px;
    background:var(--line);
  }
  .cell{
    min-width:0;
    display:flex;
    align-items:center;
    padding:8px 18px;
    font-size:var(--fs-sec);
    line-height:1.4;
  }
  .calibrated{color:var(--text);}
  .calibrated strong{color:var(--gene-2);}
  .failure{color:var(--text-2);}
  .solution{
    position:relative;
    border-left:1px solid var(--cult-dim);
    color:var(--cult-2);
    background:linear-gradient(90deg,rgba(95,200,216,.07),transparent 72%);
  }
  .solution::before{
    content:"体外";
    flex:0 0 auto;
    margin-right:12px;
    padding:2px 8px;
    border:1px solid var(--cult-dim);
    border-radius:20px;
    color:var(--cult);
    font-size:var(--fs-label);
    line-height:1.3;
    letter-spacing:.04em;
  }
  .support.unready .failure{color:#e8b0aa;}
  .support.unready .solution{
    color:#f0968c;
    border-left-color:#5e2620;
    background:linear-gradient(90deg,rgba(224,87,74,.10),transparent 72%);
  }
  .support.unready .solution::before{
    content:"未解";
    color:#f0968c;
    border-color:#5e2620;
  }
  .solution strong{color:inherit;}
  .num{white-space:nowrap;}
</style>
</head>
<body data-page="41" data-total="44">
<div id="stage"><main id="main">
  <section class="summary min0" aria-labelledby="thesis">
    <div class="claim" id="thesis">从 <span class="num">366 万年</span>前到今天，这具身体没有为太空做过任何一项准备。<br><span class="turn">它在轨道上出的每一个问题，解法都不在身体里。</span></div>

    <div class="evidence min0" aria-label="五条支撑证据">
      <div class="trunk" aria-hidden="true"></div>
      <div class="columns" aria-hidden="true">
        <div class="body-h">身体按什么校准</div>
        <div>在太空里</div>
        <div class="out-h">解法 · 全部在体外</div>
      </div>
      <div class="supports min0">
        <div class="support min0">
          <div class="cell calibrated">骨骼按 <strong class="num">1 g</strong> 的受力重塑</div>
          <div class="cell failure">每月流失 <span class="num">1–1.5%</span></div>
          <div class="cell solution">一台跑步机、一套抗阻器械、双膦酸盐</div>
        </div>
        <div class="support unready min0">
          <div class="cell calibrated">循环系统按站立姿势校准</div>
          <div class="cell failure"><span class="num">2 升</span>体液上移，视力受损</div>
          <div class="cell solution">下体负压装置——<strong>还在试验阶段</strong></div>
        </div>
        <div class="support unready min0">
          <div class="cell calibrated">皮肤和 DNA 靠大气与磁层挡射线</div>
          <div class="cell failure">火星往返 <span class="num">982 mSv</span></div>
          <div class="cell solution"><strong>目前没有可行的屏蔽方案</strong></div>
        </div>
        <div class="support min0">
          <div class="cell calibrated">体温调节靠对流和蒸发</div>
          <div class="cell failure">真空里两者都不存在</div>
          <div class="cell solution"><span class="num">14</span> 层的服装 + <span class="num">90 米</span>水冷管</div>
        </div>
        <div class="support min0">
          <div class="cell calibrated">每天要 <strong class="num">7.6 kg</strong> 物质流过身体</div>
          <div class="cell failure">那里什么都没有</div>
          <div class="cell solution">整套再生生保系统</div>
        </div>
      </div>
    </div>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:6, title:'一项太空适应都没有', sub:'把幕 V 的五件事并排放一下，会看到同一个句式。', foot:'但这不是太空的特殊问题。' });
</script>
</body></html>
