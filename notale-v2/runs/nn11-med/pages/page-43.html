<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;}
.reprise{
  height:100%;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.footprints{
  flex:1 1 auto;
  min-height:0;
  display:grid;
  grid-template-columns:190px minmax(0,1fr) minmax(0,1fr);
  grid-template-rows:148px repeat(5,minmax(0,1fr));
  column-gap:20px;
  background:rgba(25,21,18,.72);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.corner{
  display:flex;
  align-items:flex-end;
  justify-content:flex-end;
  padding:0 14px 14px 0;
  color:var(--text-3);
  font-size:var(--fs-label);
  letter-spacing:.06em;
}
.photohead{
  position:relative;
  align-self:stretch;
  min-width:0;
  min-height:0;
  overflow:hidden;
  border-radius:var(--r) var(--r) 0 0;
}
.photohead img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:saturate(.82) contrast(1.05);
}
.photohead::after{
  content:"";
  position:absolute;
  inset:auto 0 0;
  height:58%;
  background:linear-gradient(transparent,rgba(8,7,6,.9));
  pointer-events:none;
}
.photohead h2{
  position:absolute;
  z-index:1;
  left:18px;
  bottom:12px;
  margin:0;
  font-size:var(--fs-h2);
  line-height:1.2;
  color:var(--text);
  text-shadow:0 2px 10px #000;
}
.photohead.moon img{object-position:center 58%;}
.rowlabel,.datum{
  min-width:0;
  display:flex;
  align-items:center;
  border-top:1px solid var(--line-soft);
}
.rowlabel{
  justify-content:flex-end;
  text-align:right;
  padding:8px 14px 8px 0;
  font-size:var(--fs-label);
  line-height:1.4;
  color:var(--text-3);
}
.datum{
  padding:8px 16px;
  font-size:var(--fs-sec);
  line-height:1.42;
  color:var(--text-2);
  background:rgba(255,255,255,.012);
}
.datum.left{border-left:1px solid var(--line-soft);}
.datum.right{border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft);}
.rowlabel.body{color:var(--gene);}
.rowlabel.outside,.rowlabel.info{color:var(--cult);}
.datum.gene{
  color:var(--gene-2);
  font-weight:700;
  background:linear-gradient(90deg,rgba(224,145,58,.12),rgba(224,145,58,.025));
  border-left:3px solid var(--gene);
}
.datum.cult{
  color:var(--cult-2);
  font-weight:600;
  background:linear-gradient(90deg,rgba(95,200,216,.12),rgba(95,200,216,.025));
  border-left:3px solid var(--cult);
}
.closing{
  flex:0 0 auto;
  margin:0;
  padding:1px 28px 3px;
  text-align:center;
  font-size:var(--fs-lead);
  line-height:1.5;
  color:var(--text-2);
}
.closing strong{color:var(--text);}
</style>
</head>
<body data-page="43" data-total="44">
<div id="stage"><main id="main">
  <section class="reprise" aria-label="Laetoli 足迹与月面靴印的五个维度对照">
    <div class="footprints cmp min0">
      <div class="corner">共同维度</div>
      <figure class="photohead min0">
        <img src="assets/img/laetoli-trackway.jpg" alt="Laetoli 足迹" title="Laetoli 足迹复制品（日本国立科学博物馆） · Momotarou2012 · CC BY-SA 3.0">
        <h2>Laetoli 足迹</h2>
      </figure>
      <figure class="photohead moon min0">
        <img src="assets/img/moon-bootprint.jpg" alt="月面靴印">
        <h2>月面靴印</h2>
      </figure>

      <div class="rowlabel body">留下它的那具身体</div>
      <div class="datum left">直立、足弓、汗腺、一颗 <span class="num">450 cc</span> 的脑</div>
      <div class="datum right">直立、足弓、汗腺、一颗 <span class="num">1350 cc</span> 的脑</div>

      <div class="rowlabel body">这具身体的基因改动</div>
      <div class="datum left">—</div>
      <div class="datum right gene">在 <span class="num">366</span> 万年里，没有一处是为太空准备的</div>

      <div class="rowlabel outside">身体之外的东西</div>
      <div class="datum left">无</div>
      <div class="datum right cult"><span class="num">145 kg</span> 的服装、<span class="num">2970</span> 吨的火箭、一整个再生生保系统</div>

      <div class="rowlabel info">让这一切成立的信息，存在哪</div>
      <div class="datum left">在活着的个体身上，随人死去</div>
      <div class="datum right cult">在图纸、手册、代码和几百万人的脑子里</div>

      <div class="rowlabel info">那份信息的量级</div>
      <div class="datum left">一个人一生能学会的全部</div>
      <div class="datum right cult">阿波罗计划：<span class="num">40</span> 万人，<span class="num">10</span> 年</div>
    </div>
    <p class="closing"><strong>这 <span class="num">366</span> 万年里，身体走了很短的一段。剩下的全部路程，是身体之外的东西走的。</strong></p>
  </section>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:6, title:'回到两个脚印', sub:'同一张对照，第二次看。', foot:'最后三个问题，没有标准答案。' });
</script>
</body></html>
