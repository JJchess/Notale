<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/deck.css">
<style>
#main{height:100%;display:flex;flex-direction:column;gap:12px}
.closing-claim{flex:0 0 auto;max-width:1320px;padding-top:1px}
.closing-claim strong{color:var(--text)}
.closing-claim .cult-word{color:var(--cult)}
.closing-claim .gene-word{color:var(--gene-2)}
.question-tree{flex:1 1 auto;min-height:0;position:relative;padding-top:25px}
.question-tree>.trunk{left:9%;right:9%;top:12px;bottom:auto;width:auto;height:1px;background:linear-gradient(90deg,var(--line),var(--acc),var(--line))}
.question-tree::before{content:"";position:absolute;left:50%;top:0;width:1px;height:13px;background:var(--acc);opacity:.75}
.question-grid{height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.question{position:relative;min-width:0;min-height:0;padding:16px 16px 14px;background:rgba(25,21,18,.74);border:1px solid var(--line-soft);border-radius:var(--r);display:flex;flex-direction:column}
.question::before{content:"";position:absolute;left:50%;top:-14px;width:1px;height:14px;background:var(--line)}
.qhead{min-height:72px;margin:0 0 10px;font-size:var(--fs-lead);line-height:1.42;font-weight:650;color:var(--text)}
.qmark{display:block;margin-bottom:3px;font:600 var(--fs-label)/1.2 var(--font-num);letter-spacing:.08em;color:var(--acc)}
.options{display:grid;gap:7px}
.quiz .opt{padding:9px 12px;font-size:var(--fs-sec);line-height:1.35}
.quiz .opt[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 11%,var(--panel));box-shadow:inset 3px 0 0 var(--acc)}
.opt .letter{display:inline-block;width:24px;font-family:var(--font-num);font-weight:700;color:var(--text-3)}
.opt[aria-pressed="true"] .letter{color:var(--acc)}
.opt.gene-choice .choice-key{color:var(--gene-2)}
.opt.cult-choice .choice-key{color:var(--cult-2)}
.fb-shell{flex:1 1 auto;min-height:120px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft)}
.quiz .fb{margin:0;opacity:0;transform:translateY(3px);transition:opacity .16s ease,transform .16s ease}
.quiz .fb.show{opacity:1;transform:none}
.bottomline{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;min-height:31px}
.bottomline .hint{margin:0}
.thanks{margin:0;font-size:var(--fs-lead);color:var(--text-2)}
@media (prefers-reduced-motion:reduce){.quiz .fb{transition:none}}
</style>
</head>
<body data-page="44" data-total="44">
<div id="stage"><main id="main">
  <section class="claim sm closing-claim" aria-label="收束主张">
    这堂课只讲了一件事：<strong><span class="cult-word">信息换了一条通道</span>，<span class="gene-word">身体没跟上</span>。</strong><br>
    剩下的三个问题，答案要靠你们这一代给。
  </section>

  <section class="supports question-tree min0" aria-label="三个思考问题">
    <span class="trunk" aria-hidden="true"></span>
    <div class="question-grid min0">
      <article class="support question quiz min0" data-question="1">
        <h2 class="qhead"><span class="qmark">Q1</span>第一个在火星上出生的孩子，长大后和地球人最大的差别会来自哪里？</h2>
        <div class="options" role="group" aria-label="问题一选项">
          <button class="opt gene-choice" type="button" aria-pressed="false" data-feedback="突变是随机的，几乎全是有害的，而且一代人根本不够。这条太慢。"><span class="letter">A</span><span class="choice-key">基因</span>（在辐射下发生的突变）</button>
          <button class="opt" type="button" aria-pressed="false" data-feedback-html="这一条我们整堂课都没讲——因为没人知道答案。人类从未在 <span class='num'>1 g</span> 之外发育过一个胚胎。这是第三条通道：不是基因，也不是文化，是发育可塑性。"><span class="letter">B</span><span class="choice-key">发育</span>（在 <span class="num">0.38 g</span> 下长骨头、长心脏、长内耳）</button>
          <button class="opt cult-choice" type="button" aria-pressed="false" data-feedback="很可能是最大的那一项，但它和地球上任何一个封闭小社会没有本质区别。真正新的是 B。"><span class="letter">C</span><span class="choice-key">文化</span>（在一个封闭的小社会里长大）</button>
        </div>
        <div class="fb-shell"><p class="fb" aria-live="polite"></p></div>
      </article>

      <article class="support question quiz min0" data-question="2">
        <h2 class="qhead"><span class="qmark">Q2</span>如果体外通道断了——所有存储被抹掉，会用它的人也不在了——人类要多久回到今天？</h2>
        <div class="options" role="group" aria-label="问题二选项">
          <button class="opt" type="button" aria-pressed="false" data-feedback-html="回想第 <span class='num'>15</span> 页。一个人学不会。&quot;原理还在&quot;和&quot;有足够多的人同时掌握它&quot;是两回事。"><span class="letter">A</span>一两代人，因为原理还在人脑子里</button>
          <button class="opt" type="button" aria-pressed="false" data-feedback="有一个新的障碍：容易开采的浅层煤和石油已经被我们用掉了。第二次工业革命没有第一次的燃料。"><span class="letter">B</span>几千年，相当于重走一遍农业到工业</button>
          <button class="opt" type="button" aria-pressed="false" data-feedback="可能太悲观。但塔斯马尼亚的例子说明，退化是真的会发生的，而且不需要任何灾难，只需要人变少。"><span class="letter">C</span>永远回不来</button>
        </div>
        <div class="fb-shell"><p class="fb" aria-live="polite"></p></div>
      </article>

      <article class="support question quiz min0" data-question="3">
        <h2 class="qhead"><span class="qmark">Q3</span>两到三个数量级的错配，该让身体追上去，还是让环境慢下来？</h2>
        <div class="options" role="group" aria-label="问题三选项">
          <button class="opt gene-choice" type="button" aria-pressed="false" data-feedback="那等于把身体也变成体外通道的一部分——变化速度会和技术一样快。你确定那是&quot;追上&quot;，还是&quot;放弃了那把慢的尺子&quot;？"><span class="letter">A</span>让<span class="choice-key">身体</span>追上去（基因编辑、器械增强）</button>
          <button class="opt cult-choice" type="button" aria-pressed="false" data-feedback="人类历史上没有任何一次成功地让技术慢下来过。而且慢下来的代价通常由最穷的人先付。"><span class="letter">B</span>让<span class="choice-key">环境</span>慢下来</button>
          <button class="opt" type="button" aria-pressed="false" data-feedback="这大概是现实的答案，但&quot;学会&quot;本身也是一项要靠体外通道传下去的技能——它得被教。比如，被这样一堂课教。"><span class="letter">C</span>两个都不选，学会带着错配生活</button>
        </div>
        <div class="fb-shell"><p class="fb" aria-live="polite"></p></div>
      </article>
    </div>
  </section>

  <div class="bottomline">
    <p class="hint">每题选一个，看看我的回应</p>
    <p class="thanks">谢谢。</p>
  </div>
</main></div>
<script src="assets/base.js"></script>
<script src="assets/deck.js"></script>
<script>
Chrome.mount({ act:6, title:'留给你们的问题', sub:'三个问题，都没有标准答案。选一个，然后看看我的回应。', foot:null });

document.querySelectorAll('.question').forEach(function(question){
  var feedback = question.querySelector('.fb');
  question.querySelectorAll('.opt').forEach(function(option){
    option.addEventListener('click',function(){
      question.querySelectorAll('.opt').forEach(function(peer){ peer.setAttribute('aria-pressed','false'); });
      option.setAttribute('aria-pressed','true');
      feedback.classList.remove('show');
      if(option.dataset.feedbackHtml){ feedback.innerHTML = option.dataset.feedbackHtml; }
      else{ feedback.textContent = option.dataset.feedback; }
      requestAnimationFrame(function(){ feedback.classList.add('show'); });
    });
  });
});
</script>
</body></html>
