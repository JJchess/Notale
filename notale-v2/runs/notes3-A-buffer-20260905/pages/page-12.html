<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/lib/katex.min.css">
  <style>
    /* 页面特定布局与覆盖 */
    #stage {
      padding: 48px 56px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-sizing: border-box;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--muted);
      padding-bottom: 14px;
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: var(--fs-h1);
      color: var(--text);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .lead-text {
      margin: 6px 0 0;
      font-size: var(--fs-sec);
      color: var(--muted);
    }

    .meta-badge {
      font-family: var(--font-num);
      font-size: var(--fs-sec);
      color: var(--buffer);
      background: var(--selected);
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 600;
    }

    /* 主工作区：左图（滴定曲线与阶段指示） + 右侧（4阶段模型切换卡与实时推导） */
    .focus-main {
      flex: 1;
      display: grid;
      grid-template-columns: 820px 1fr;
      gap: 28px;
      min-height: 0;
    }

    /* 左侧图表卡片 */
    .chart-panel {
      background: var(--paper);
      border: 1px solid #d4dfe2;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 18px 20px 16px;
      position: relative;
    }

    .chart-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .chart-title {
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: var(--fs-sec);
      color: var(--text);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .chart-host {
      flex: 1;
      width: 100%;
      min-height: 0;
      position: relative;
    }

    /* 图表底部的阶段切换器：4个阶段标签按钮 */
    .stage-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e2eaec;
    }

    .stage-tab {
      background: var(--bg);
      border: 1px solid #cfdce0;
      border-radius: 6px;
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .stage-tab:hover {
      border-color: var(--buffer);
      background: #eaf3f5;
    }

    .stage-tab.active {
      background: var(--selected);
      border-color: var(--buffer);
      box-shadow: 0 0 0 1px var(--buffer);
    }

    .stage-tab .tab-name {
      font-size: var(--fs-sec);
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stage-tab .tab-sub {
      font-size: var(--fs-tick);
      font-family: var(--font-num);
      color: var(--text);
    }

    /* 右侧推导面板 */
    .inspector-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    .model-card {
      background: var(--paper);
      border: 1px solid #d4dfe2;
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }

    .model-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .model-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: var(--fs-label);
      font-weight: 700;
    }

    .model-badge.stage-0 { background: #faeae8; color: var(--acid); }
    .model-badge.stage-1 { background: #e3f2f1; color: var(--buffer); }
    .model-badge.stage-2 { background: #e2ecf5; color: var(--base); }
    .model-badge.stage-3 { background: #fdf2e8; color: var(--focus); }

    .vol-badge {
      font-family: var(--font-num);
      font-size: var(--fs-sec);
      color: var(--text);
      font-weight: 600;
    }

    .model-core-formula {
      background: var(--bg);
      border: 1px solid #dce6e8;
      border-radius: 6px;
      padding: 12px 16px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--text);
      overflow: hidden;
    }
    .model-core-formula .katex-display {
      margin: 0;
      overflow: visible;
    }

    .calc-box {
      background: #fafcfc;
      border: 1px dashed #cad8db;
      border-radius: 6px;
      padding: 12px 14px;
      font-size: var(--fs-sec);
      line-height: 1.5;
      color: var(--text);
    }

    .calc-step {
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .calc-step:last-child {
      margin-bottom: 0;
    }

    .calc-step-label {
      color: var(--text);
      font-size: var(--fs-sec);
    }

    .calc-step-val {
      font-family: var(--font-num);
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-align: right;
    }

    /* 关键对比结论条 */
    .summary-card {
      background: var(--paper);
      border: 1px solid #d4dfe2;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: var(--fs-sec);
      line-height: 1.45;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .summary-card strong {
      color: var(--buffer);
    }

    .interactive-slider-box {
      background: var(--paper);
      border: 1px solid #d4dfe2;
      border-radius: 8px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .interactive-slider-box label {
      font-size: var(--fs-sec);
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .interactive-slider-box input[type=range] {
      flex: 1;
      accent-color: var(--buffer);
      cursor: pointer;
    }

    .interactive-slider-box .vol-readout {
      font-family: var(--font-num);
      font-size: var(--fs-sec);
      font-weight: 700;
      min-width: 68px;
      text-align: right;
      color: var(--buffer);
    }
  </style>
</head>
<body data-page="12" data-total="17">
  <div id="stage">
    <header>
      <div>
        <h1>弱酸—强碱滴定的分段计算</h1>
        <p class="lead-text">体系中主导粒子随中和进度跃迁，不同体积区间必须匹配专属物理化学模型</p>
      </div>
      <div class="meta-badge">基准体系：20.00 mL 0.1000 mol/L CH₃COOH + 0.1000 mol/L NaOH (pKa = 4.75)</div>
    </header>

    <div class="focus-main">
      <!-- 左侧：滴定曲线图与分段控制 -->
      <div class="chart-panel min0">
        <div class="chart-panel-header">
          <div class="chart-title">
            <span>滴定进程与分段模型覆盖区</span>
          </div>
          <div class="legend-row">
            <span class="legend-item"><span class="legend-dot" style="background: var(--acid);"></span>起始电离</span>
            <span class="legend-item"><span class="legend-dot" style="background: var(--buffer);"></span>缓冲共存</span>
            <span class="legend-item"><span class="legend-dot" style="background: var(--base);"></span>共轭碱水解</span>
            <span class="legend-item"><span class="legend-dot" style="background: var(--focus);"></span>强碱过量</span>
          </div>
        </div>

        <div id="chart-host" class="chart-host"></div>

        <!-- 4 阶段选项卡 -->
        <div class="stage-tabs" role="tablist">
          <button class="stage-tab active" id="tab-0" onclick="selectStage(0)">
            <span class="tab-name">① 起始点 <span>0.00 mL</span></span>
            <span class="tab-sub">一元弱酸近似公式</span>
          </button>
          <button class="stage-tab" id="tab-1" onclick="selectStage(1)">
            <span class="tab-name">② 缓冲共存 <span>0 ~ 20 mL</span></span>
            <span class="tab-sub">Henderson-Hasselbalch</span>
          </button>
          <button class="stage-tab" id="tab-2" onclick="selectStage(2)">
            <span class="tab-name">③ 当量点 <span>20.00 mL</span></span>
            <span class="tab-sub">一元弱碱(Ac⁻)水解</span>
          </button>
          <button class="stage-tab" id="tab-3" onclick="selectStage(3)">
            <span class="tab-name">④ 强碱过量 <span>&gt; 20 mL</span></span>
            <span class="tab-sub">剩余微量 OH⁻ 浓度</span>
          </button>
        </div>
      </div>

      <!-- 右侧：数学与物种计算剖析 -->
      <div class="inspector-panel min0">
        <!-- 滑块联动 -->
        <div class="interactive-slider-box">
          <label for="vol-slider">滴定体积 V(NaOH):</label>
          <input type="range" id="vol-slider" min="0" max="30" step="0.2" value="10.0">
          <span class="vol-readout" id="vol-val">10.00 mL</span>
        </div>

        <!-- 阶段模型详解 -->
        <div class="model-card" id="model-details">
          <div class="model-badge-row">
            <span class="model-badge stage-1" id="model-tag">阶段 ②：缓冲共存区</span>
            <span class="vol-badge" id="current-point-label">V = 10.00 mL (半当量点)</span>
          </div>

          <div class="model-core-formula" id="formula-display">
            <!-- KaTeX 渲染核心方程 -->
          </div>

          <div class="calc-box" id="calc-content">
            <!-- 动态解构信息 -->
          </div>
        </div>

        <!-- 底部核心结论 -->
        <div class="summary-card">
          <div><strong>为什么不能一套公式算到底？</strong></div>
          <div id="core-insight">
            滴定反应彻底改写了溶液的主要质子转移机制：从单一弱酸解离，到共轭酸碱对共存，再到强碱离子抑制弱碱解离。选择模型前，必须先看谁是主导粒子。
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/lib/katex.min.js"></script>
  <script>
    /* 化学计算常数 */
    const C_ACID = 0.1000;      // mol/L CH3COOH
    const V_ACID = 20.00;       // mL
    const C_BASE = 0.1000;      // mol/L NaOH
    const P_KA = 4.75;
    const KA = Math.pow(10, -P_KA);
    const KW = 1.0e-14;
    const KB = KW / KA;

    /* 计算任意体积 V 下真实严格的 pH (解析酸碱电中性/分段精确实质方程) */
    function calcPH(V) {
      if (V <= 0.0001) {
        // 起始点：单一弱酸 c = 0.1000 mol/L, [H+] ≈ sqrt(Ka * c)
        let h = Math.sqrt(KA * C_ACID);
        return -Math.log10(h);
      }
      if (V < 19.999) {
        // 缓冲共存区：未反应的 HAc 与 生成的 NaAc
        // n_HAc = C_ACID * V_ACID - C_BASE * V
        // n_Ac = C_BASE * V
        // 精确解 [H+]：考虑微弱离解/水解，当 V > 0.1 时，H-H 方程极准
        let n_HAc = C_ACID * V_ACID - C_BASE * V;
        let n_Ac = C_BASE * V;
        if (V < 0.2) {
          // 极低加入量，求解二次方程 [H+]^2 + (Ka + c_Ac)[H+] - Ka*c_HAc = 0
          let V_tot = V_ACID + V;
          let c_HAc = n_HAc / V_tot;
          let c_Ac = n_Ac / V_tot;
          let h = (- (KA + c_Ac) + Math.sqrt(Math.pow(KA + c_Ac, 2) + 4 * KA * c_HAc)) / 2;
          return -Math.log10(h);
        }
        let h = KA * (n_HAc / n_Ac);
        return -Math.log10(h);
      }
      if (Math.abs(V - 20.00) <= 0.01) {
        // 当量点：纯 NaAc 溶液，c_Ac = 0.1 * 20 / 40 = 0.0500 mol/L
        // [OH-] ≈ sqrt(Kb * c_Ac)
        let c_Ac = (C_ACID * V_ACID) / (V_ACID + V);
        let oh = Math.sqrt(KB * c_Ac);
        let h = KW / oh;
        return -Math.log10(h);
      }
      // 强碱过量区：主要由过量 NaOH 控制 [OH-] ≈ (C_BASE * (V - V_ACID)) / (V_ACID + V)
      let V_tot = V_ACID + V;
      let n_OH_excess = C_BASE * (V - 20.00);
      let c_OH = n_OH_excess / V_tot;
      let h = KW / c_OH;
      return -Math.log10(h);
    }

    // 生成密集曲线数据 (0 ~ 30 mL)
    const curvePoints = [];
    for (let v = 0; v <= 30; v += 0.1) {
      let ph = calcPH(v);
      curvePoints.push([parseFloat(v.toFixed(1)), parseFloat(ph.toFixed(3))]);
    }

    /* 4个阶段的数据定义与解析文案 */
    const STAGES = [
      {
        id: 0,
        title: "阶段 ①：滴定起始点 (V = 0 mL)",
        rangeName: "起始电离",
        tagClass: "stage-0",
        badgeText: "起始电离 · 弱酸解离平衡",
        volPreset: 0.0,
        markArea: [[{ xAxis: 0 }, { xAxis: 0.5 }]],
        formulaKatex: "[\\mathrm{H^+}] \\approx (K_a \\cdot c_a)^{1/2}",
        leadFormula: "pH = -\\lg\\sqrt{K_a \\cdot c_a} = \\frac{1}{2}(\\mathrm{p}K_a - \\lg c_a)",
        species: "主要物种：CH_3COOH、H_2O",
        calcSteps: [
          { label: "分析浓度 c_a", val: "0.1000 mol/L" },
          { label: "解离常数 K_a", val: "1.78 × 10⁻⁵ (pKa = 4.75)" },
          { label: "平衡氢离子 [H⁺]", val: "1.33 × 10⁻³ mol/L" },
          { label: "起始 pH 理论值", val: "2.88" }
        ],
        insight: "体系只有单一弱酸，解离度极小（约 1.3%）。未加入 NaOH 前，不能当作强酸处理（强酸同浓度 pH 为 1.00），必须使用弱酸离解常数 Ka 估算平衡态。"
      },
      {
        id: 1,
        title: "阶段 ②：缓冲共存区 (0 < V < 20 mL)",
        rangeName: "缓冲共存",
        tagClass: "stage-1",
        badgeText: "缓冲共存 · Henderson-Hasselbalch 方程",
        volPreset: 10.0,
        markArea: [[{ xAxis: 0.5 }, { xAxis: 19.8 }]],
        formulaKatex: "\\mathrm{pH} = \\mathrm{p}K_a + \\lg\\frac{[\\mathrm{Ac^-}]}{[\\mathrm{HAc}]}",
        leadFormula: "\\left[\\mathrm{H^+}\\right] = K_a \\cdot \\frac{n(\\mathrm{HAc})}{n(\\mathrm{Ac^-})}",
        species: "主要物种：CH_3COOH、CH_3COO⁻、Na⁺",
        calcSteps: [
          { label: "未反应弱酸 n(HAc)", val: "1.000 mmol (10.00 mL 时)" },
          { label: "生成共轭碱 n(Ac⁻)", val: "1.000 mmol (10.00 mL 时)" },
          { label: "共轭对浓度比值", val: "[Ac⁻] / [HAc] = 1.000" },
          { label: "半当量点 pH (pH = pKa)", val: "4.75" }
        ],
        insight: "滴加的强碱将部分 HAc 转化为 Ac⁻，形成了具有抗酸抗碱能力的缓冲体系。此阶段 pH 变化平缓，在半当量点（V = 10 mL）时 [Ac⁻] = [HAc]，pH 严格等于 pKa。"
      },
      {
        id: 2,
        title: "阶段 ③：化学计量当量点 (V = 20 mL)",
        rangeName: "共轭碱水解",
        tagClass: "stage-2",
        badgeText: "中和完成 · 共轭弱碱水解平衡",
        volPreset: 20.0,
        markArea: [[{ xAxis: 19.8 }, { xAxis: 20.4 }]],
        formulaKatex: "[\\mathrm{OH^-}] \\approx (K_b \\cdot c_{\\mathrm{Ac^-}})^{1/2}",
        leadFormula: "\\mathrm{Ac^-} + \\mathrm{H_2O} \\rightleftharpoons \\mathrm{HAc} + \\mathrm{OH^-}",
        species: "主要物种：CH_3COO⁻、Na⁺、微量 OH⁻",
        calcSteps: [
          { label: "体系总体积 V_tot", val: "40.00 mL (20.00 + 20.00)" },
          { label: "共轭碱浓度 c(Ac⁻)", val: "0.0500 mol/L" },
          { label: "水解常数 K_b (Kw / Ka)", val: "5.62 × 10⁻¹⁰" },
          { label: "当量点理论 pH", val: "8.72 (显碱性，非 7.00)" }
        ],
        insight: "HAc 被 NaOH 恰好完全中和转化为 NaAc。溶液不是纯水，弱酸根 Ac⁻ 会发生微弱水解产生微量 OH⁻，因此滴定终点溶液呈弱碱性，pH 大于 7。"
      },
      {
        id: 3,
        title: "阶段 ④：强碱过量区 (V > 20 mL)",
        rangeName: "强碱过量",
        tagClass: "stage-3",
        badgeText: "强碱过量 · 微量过量 OH⁻ 主导",
        volPreset: 25.0,
        markArea: [[{ xAxis: 20.4 }, { xAxis: 30 }]],
        formulaKatex: "c_{\\mathrm{OH^-}} \\approx \\frac{c_b(V_b - V_a)}{V_a + V_b}",
        leadFormula: "\\mathrm{pOH} = -\\lg c(\\mathrm{OH^-}), \\quad \\mathrm{pH} = 14.00 - \\mathrm{pOH}",
        species: "主要物种：过量 OH⁻、Na⁺、CH_3COO⁻",
        calcSteps: [
          { label: "过量 NaOH 物质的量", val: "0.500 mmol (25.00 mL 时)" },
          { label: "稀释后总体积", val: "45.00 mL" },
          { label: "过量 [OH⁻] 浓度", val: "1.11 × 10⁻² mol/L" },
          { label: "过量点 pH 读数", val: "12.05" }
        ],
        insight: "当量点后，微量过量的 NaOH 是强电解质，完全电离出的 OH⁻ 浓度远超 Ac⁻ 水解出的极微量 OH⁻（并同离子效应严重抑制 Ac⁻ 水解），计算完全由过量强碱主导。"
      }
    ];

    let currentStageId = 1;
    let currentV = 10.0;
    let chartInstance = null;

    function getStageFromV(v) {
      if (v <= 0.05) return 0;
      if (v < 19.85) return 1;
      if (v <= 20.2) return 2;
      return 3;
    }

    /* 初始化 ECharts 图表 */
    function initChart() {
      const chartDom = document.getElementById('chart-host');
      chartInstance = echarts.init(chartDom, null, { renderer: 'svg' });
      updateChart();
    }

    function updateChart() {
      const phNow = calcPH(currentV);

      const option = {
        animation: false,
        grid: {
          left: 56,
          right: 28,
          top: 36,
          bottom: 42
        },
        tooltip: {
          trigger: 'axis',
          axisPointer: { type: 'cross', lineStyle: { color: '#526970', type: 'dashed' } },
          formatter: function(params) {
            let pt = params[0].data;
            return `滴定剂体积: <b>${pt[0].toFixed(1)} mL</b><br/>溶液 pH: <b>${pt[1].toFixed(2)}</b>`;
          }
        },
        xAxis: {
          type: 'value',
          min: 0,
          max: 30,
          interval: 5,
          name: 'V(NaOH) / mL',
          nameLocation: 'middle',
          nameGap: 26,
          nameTextStyle: { color: '#142B33', fontSize: 14, fontWeight: 'bold' },
          axisLabel: { color: '#526970', fontSize: 13, fontFamily: 'Bahnschrift' },
          axisLine: { lineStyle: { color: '#526970' } },
          splitLine: { lineStyle: { color: '#eef2f3' } }
        },
        yAxis: {
          type: 'value',
          min: 0,
          max: 14,
          interval: 2,
          name: 'pH',
          nameLocation: 'end',
          nameTextStyle: { color: '#142B33', fontSize: 14, fontWeight: 'bold' },
          axisLabel: { color: '#526970', fontSize: 13, fontFamily: 'Bahnschrift' },
          axisLine: { lineStyle: { color: '#526970' } },
          splitLine: { lineStyle: { color: '#eef2f3' } }
        },
        series: [
          {
            name: '滴定曲线',
            type: 'line',
            data: curvePoints,
            smooth: 0.15,
            showSymbol: false,
            lineStyle: {
              color: '#08746E',
              width: 3.2
            },
            // 分段区域染色
            markArea: {
              silent: true,
              data: [
                [
                  { name: '① 起始', xAxis: 0, itemStyle: { color: 'rgba(180, 63, 43, 0.08)' } },
                  { xAxis: 0.5 }
                ],
                [
                  { name: '② 缓冲共存', xAxis: 0.5, itemStyle: { color: 'rgba(8, 116, 110, 0.10)' } },
                  { xAxis: 19.8 }
                ],
                [
                  { name: '③ 当量点', xAxis: 19.8, itemStyle: { color: 'rgba(35, 98, 154, 0.12)' } },
                  { xAxis: 20.4 }
                ],
                [
                  { name: '④ 强碱过量', xAxis: 20.4, itemStyle: { color: 'rgba(196, 90, 0, 0.08)' } },
                  { xAxis: 30 }
                ]
              ],
              label: {
                position: 'insideTop',
                color: '#526970',
                fontSize: 12,
                fontWeight: 'bold',
                offset: [0, 8]
              }
            },
            // 关键特征线与当前滴定点
            markLine: {
              symbol: 'none',
              lineStyle: { type: 'dashed', width: 1.2 },
              data: [
                { yAxis: 7, lineStyle: { color: '#889fa6' }, label: { formatter: '中性 pH=7', position: 'insideEndTop', color: '#526970', fontSize: 12 } },
                { yAxis: 8.72, lineStyle: { color: '#23629A' }, label: { formatter: '当量点 pH=8.72', position: 'insideEndTop', color: '#23629A', fontSize: 12 } },
                { xAxis: 20, lineStyle: { color: '#23629A' } }
              ]
            },
            markPoint: {
              data: [
                {
                  coord: [parseFloat(currentV.toFixed(1)), parseFloat(phNow.toFixed(2))],
                  symbol: 'circle',
                  symbolSize: 12,
                  itemStyle: {
                    color: '#C45A00',
                    borderColor: '#FFFFFF',
                    borderWidth: 2,
                    shadowBlur: 4,
                    shadowColor: 'rgba(0,0,0,0.3)'
                  },
                  label: {
                    show: true,
                    formatter: `V=${currentV.toFixed(1)}\npH=${phNow.toFixed(2)}`,
                    position: currentV > 18 ? 'left' : 'right',
                    color: '#142B33',
                    fontSize: 13,
                    fontWeight: 'bold',
                    backgroundColor: '#FFFFFF',
                    borderColor: '#CAD8DB',
                    borderWidth: 1,
                    padding: [4, 6],
                    borderRadius: 4
                  }
                }
              ]
            }
          }
        ]
      };

      chartInstance.setOption(option);
    }

    /* 渲染右侧面板 */
    function renderInspector() {
      const stage = STAGES[currentStageId];
      const phNow = calcPH(currentV);

      // 更新标签与当前点指示
      const badge = document.getElementById('model-tag');
      badge.className = `model-badge ${stage.tagClass}`;
      badge.textContent = stage.badgeText;

      document.getElementById('current-point-label').textContent = 
        `V = ${currentV.toFixed(2)} mL ｜ pH = ${phNow.toFixed(2)}`;

      // 更新核心公式 (KaTeX)
      const formulaDom = document.getElementById('formula-display');
      formulaDom.innerHTML = '';
      katex.render(stage.formulaKatex, formulaDom, { displayMode: true, throwOnError: false });

      // 更新步骤与物种
      let stepsHtml = `
        <div class="calc-step" style="border-bottom: 1px dashed #cad8db; padding-bottom: 6px; margin-bottom: 8px;">
          <span class="calc-step-label">主导平衡机制</span>
          <span class="calc-step-val" id="species-formula"></span>
        </div>
      `;

      stage.calcSteps.forEach(step => {
        stepsHtml += `
          <div class="calc-step">
            <span class="calc-step-label">${step.label}</span>
            <span class="calc-step-val">${step.val}</span>
          </div>
        `;
      });

      const calcContent = document.getElementById('calc-content');
      calcContent.innerHTML = stepsHtml;

      // 渲染物种文本
      const specDom = document.getElementById('species-formula');
      specDom.textContent = stage.species;

      // 更新底部洞见
      document.getElementById('core-insight').textContent = stage.insight;

      // 同步 Tabs 状态
      for (let i = 0; i < 4; i++) {
        const tab = document.getElementById(`tab-${i}`);
        if (i === currentStageId) {
          tab.classList.add('active');
        } else {
          tab.classList.remove('active');
        }
      }
    }

    /* 阶段选择与联动 */
    function selectStage(stageId) {
      currentStageId = stageId;
      currentV = STAGES[stageId].volPreset;
      document.getElementById('vol-slider').value = currentV;
      document.getElementById('vol-val').textContent = currentV.toFixed(2) + ' mL';
      updateChart();
      renderInspector();
    }

    // 滑块实时交互
    const slider = document.getElementById('vol-slider');
    slider.addEventListener('input', function(e) {
      currentV = parseFloat(e.target.value);
      document.getElementById('vol-val').textContent = currentV.toFixed(2) + ' mL';
      currentStageId = getStageFromV(currentV);
      updateChart();
      renderInspector();
    });

    // 页面初始化
    window.addEventListener('load', () => {
      Deck.init({ index: 12, total: 17, keys: false });
      initChart();
      renderInspector();

      window.addEventListener('resize', () => {
        if (chartInstance) chartInstance.resize();
      });
    });
  </script>
</body>
</html>
