          },
          col3: {

            crossView: "心胸狭隘、公报私仇且背信杀降的复杂人物"
          },
          summary: "司马迁深情书写李广遭小吏阻留之辱，却在后文与军律互考中暴露其擅杀霸陵尉与背信杀降的残暴狭隘。互见还李广以历史血肉与道德真相。"

      var state = {
        currentIndex: 0
      };

      var tabs = [
        document.getElementById("tab-0"),
        document.getElementById("tab-1"),
        document.getElementById("tab-2")
      ];
      var col1El = document.getElementById("narrative-col1");
      var col2El = document.getElementById("narrative-col2");
      var col3El = document.getElementById("narrative-col3");
      var summaryEl = document.getElementById("synthesis-summary");

      function render() {
        var data = COMPARISONS[state.currentIndex];

        // 更新 tabs 状态
        tabs.forEach(function (tab, idx) {
          var isSelected = idx === state.currentIndex;
          tab.setAttribute("aria-selected", isSelected ? "true" : "false");
        });

        // 渲染列一
        var col1ChipsHtml = data.col1.chips.map(function(c){ return '<span class="fact-chip">' + c + '</span>'; }).join("");
        col1El.innerHTML = [
          '<blockquote class="quote-box">',
          '<span class="quote-label">' + data.col1.quoteTitle + '</span>',
          data.col1.quote,
          '</blockquote>',
          '<div class="analysis-card">',
          '<div class="analysis-title">' + data.col1.analysisTitle + '</div>',
          '<p class="analysis-text">' + data.col1.analysisText + '</p>',
          '</div>',
          '<div class="analysis-card">',
          '<div class="analysis-title">' + data.col1.echoTitle + '</div>',
          '<p class="analysis-text">' + data.col1.echoText + '</p>',
          '</div>',
          '<div class="fact-tag-list">' + col1ChipsHtml + '</div>'
        ].join("");

        // 渲染列二
        var col2ChipsHtml = data.col2.chips.map(function(c){ return '<span class="fact-chip highlight">' + c + '</span>'; }).join("");
        col2El.innerHTML = [
          '<blockquote class="quote-box crossref-quote">',
          '<span class="quote-label">' + data.col2.quoteTitle + '</span>',
          data.col2.quote,
          '</blockquote>',
          '<div class="analysis-card">',
          '<div class="analysis-title">' + data.col2.analysisTitle + '</div>',
          '<p class="analysis-text">' + data.col2.analysisText + '</p>',
          '</div>',
          '<div class="analysis-card">',
          '<div class="analysis-title">' + data.col2.echoTitle + '</div>',
          '<p class="analysis-text">' + data.col2.echoText + '</p>',
          '</div>',
          '<div class="fact-tag-list">' + col2ChipsHtml + '</div>'
        ].join("");

        // 渲染列三
        col3El.innerHTML = [
          '<div class="effect-block">',
          '  <div class="effect-title">',
          '    <span>' + data.col3.shiftTitle + '</span>',
          '  </div>',
          '  <p class="effect-text">' + data.col3.shiftBody + '</p>',
          '</div>',
          '<div class="effect-block">',
          '  <div class="effect-title">',
          '    <span>' + data.col3.craftTitle + '</span>',
          '  </div>',
          '  <p class="effect-text">' + data.col3.craftBody + '</p>',
          '</div>',
          '<div class="contrast-summary">',
          '  <div class="contrast-summary-title">互见结论对照</div>',
          '  <div class="contrast-row"><span class="contrast-label">单篇印象：</span><span class="contrast-val">' + data.col3.singleView + '</span></div>',
          '  <div class="contrast-row"><span class="contrast-label">互见全相：</span><span class="contrast-val">' + data.col3.crossView + '</span></div>',
          '</div>'
        ].join("");

        // 渲染底部
        summaryEl.textContent = data.summary;
      }

      function setTab(index) {
        if (index < 0 || index >= COMPARISONS.length) return;
        state.currentIndex = index;
        render();
      }

      // 事件绑定
      tabs.forEach(function (tab) {
        tab.addEventListener("click", function () {
          var idx = parseInt(this.getAttribute("data-index"), 10);
          setTab(idx);
        });
      });

      // 键盘快捷导航
      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight" || e.key === "ArrowDown") {
          setTab((state.currentIndex + 1) % COMPARISONS.length);
        } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
          setTab((state.currentIndex - 1 + COMPARISONS.length) % COMPARISONS.length);
        }
      });

      // 初始化底盘与渲染
      Deck.init({ keys: false });
      render();

      // 暴露可测试的接口
      window.__PAGE_STATE__ = {
        setTab: setTab,
        getState: function () { return state; }
      };
    })();
  </script>
