<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>什么是缓冲溶液</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F7F8;
      --paper: #FFFFFF;
      --text: #142B33;
      --muted: #526970;
      --focus: #C45A00;
      --acid: #B43F2B;
      --base: #23629A;
      --buffer: #08746E;
      --selected: #DCECEF;
      --correct: #356A3A;
      --incorrect: #8A5100;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --font-num: Bahnschrift, "Noto Sans SC", sans-serif;
    }

    #stage {
      display: flex;
      flex-direction: column;
      padding: 44px 56px;
      box-sizing: border-box;
      gap: 20px;
    }

    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(82, 105, 112, 0.2);
      padding-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .claim-tag {
      font-size: var(--fs-sec);
      color: var(--buffer);
      font-weight: 600;
    }

    /* 左右对照主区 */
    .compare-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      min-height: 0;
    }

    .case-card {
      background: var(--paper);
      border: 1px solid rgba(82, 105, 112, 0.2);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 20px 24px;
      position: relative;
    }

    .case-card.buffer-card {
      border-color: rgba(8, 116, 110, 0.35);
    }

    .card-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-title h2 {
      margin: 0;
      font-size: var(--fs-h2);
      color: var(--text);
      font-weight: 600;
    }

    .system-desc {
      font-size: var(--fs-label);
      color: var(--muted);
      margin: 0 0 14px 0;
      line-height: 1.4;
    }

    /* 仪器仪表读数区 */
    .meter-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      background: var(--bg);
      border-radius: 6px;
      padding: 10px 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(82, 105, 112, 0.15);
    }

    .meter-label {
      font-size: var(--fs-label);
      color: var(--muted);
      font-weight: 500;
    }

    .meter-val {
      font-family: var(--font-num);
      font-size: 34px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .meter-delta {
      font-family: var(--font-num);
      font-size: var(--fs-body);
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .delta-large {
      color: var(--acid);
      background: rgba(180, 63, 43, 0.1);
    }

    .delta-tiny {
      color: var(--buffer);
      background: rgba(8, 116, 110, 0.1);
    }

    /* 烧杯微观图 */
    .beaker-visual {
      flex: 1;
      position: relative;
      border: 1px solid rgba(82, 105, 112, 0.18);
      border-radius: 6px;
      min-height: 220px;
      overflow: hidden;
      background: #fafcfc;
    }

    .beaker-visual svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 状态解释条 */
    .beaker-caption {
      margin-top: 12px;
      font-size: var(--fs-sec);
      line-height: 1.4;
      color: var(--text);
      min-height: 42px;
    }

    /* 底部控制器 */
    .controls-panel {
      background: var(--paper);
      border: 1px solid rgba(82, 105, 112, 0.2);
      border-radius: 8px;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ctl-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ctl-label {
      font-size: var(--fs-label);
      color: var(--muted);
      font-weight: 500;
    }

    .act-btn {
      appearance: none;
      background: var(--bg);
      border: 1px solid rgba(82, 105, 112, 0.3);
      border-radius: 6px;
      padding: 8px 16px;
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .act-btn:hover {
      border-color: var(--focus);
    }

    .act-btn[aria-pressed="true"] {
      background: var(--selected);
      border-color: var(--buffer);
      color: var(--buffer);
    }

    .act-btn.acid-act[aria-pressed="true"] {
      border-color: var(--acid);
      color: var(--acid);
      background: rgba(180, 63, 43, 0.08);
    }

    .act-btn.base-act[aria-pressed="true"] {
      border-color: var(--base);
      color: var(--base);
      background: rgba(35, 98, 154, 0.08);
    }

    .summary-text {
      font-size: var(--fs-label);
      color: var(--muted);
    }

    .summary-text strong {
      color: var(--text);
    }
  </style>
</head>
<body data-page="03" data-total="17">
  <div id="stage">
    <header class="header-area">
      <h1>弱酸与共轭碱体系抵抗 pH 突变</h1>
      <span class="claim-tag">相同扰动 · 百倍差异</span>
    </header>

    <main class="compare-grid">
      <!-- 左：纯水（无缓冲能力） -->
      <section class="case-card min0">
        <div class="card-title">
          <h2>无缓冲体系：纯水 (100 mL)</h2>
          <span class="tag" style="background: rgba(82, 105, 112, 0.12); color: var(--text); padding: 3px 8px; border-radius: 4px; font-size: var(--fs-tick); font-weight: 500;">对照组</span>
        </div>
        <p class="system-desc">微量解离，无额外弱酸与共轭碱储备。</p>
        
        <div class="meter-row">
          <span class="meter-label">pH 计读数</span>
          <div class="meter-val">
            <span id="water-ph">7.00</span>
          </div>
          <span id="water-delta" class="meter-delta delta-large">ΔpH = 0.00</span>
        </div>

        <div class="beaker-visual">
          <svg id="water-svg" viewBox="0 0 700 320">
            <!-- 溶液背景与液面 -->
            <rect x="50" y="70" width="600" height="230" rx="10" fill="#EBF3F5" stroke="#C5D7DC" stroke-width="2"/>
            <line x1="50" y1="70" x2="650" y2="70" stroke="#87AAB3" stroke-width="2.5" stroke-dasharray="6 4"/>
            <!-- 滴入试剂指示 -->
            <g id="water-droplet-layer"></g>
            <!-- 溶液内部粒子 -->
            <g id="water-particles"></g>
          </svg>
        </div>

        <div id="water-caption" class="beaker-caption">
          初始为纯水，未引入外加强酸强碱，体系保持中性平衡。
        </div>
      </section>

      <!-- 右：缓冲溶液（弱酸+共轭碱） -->
      <section class="case-card buffer-card min0">
        <div class="card-title">
          <h2>缓冲体系：0.1 mol/L HAc + NaAc (100 mL)</h2>
          <span class="tag" style="background: rgba(8, 116, 110, 0.12); color: var(--buffer); padding: 3px 8px; border-radius: 4px; font-size: var(--fs-tick); font-weight: 600;">共轭对储备</span>
        </div>
        <p class="system-desc">等摩尔弱酸分子 HAc 与共轭碱离子 Ac⁻ 共存。</p>
        
        <div class="meter-row">
          <span class="meter-label">pH 计读数</span>
          <div class="meter-val">
            <span id="buffer-ph">4.76</span>
          </div>
          <span id="buffer-delta" class="meter-delta delta-tiny">ΔpH = 0.00</span>
        </div>

        <div class="beaker-visual">
          <svg id="buffer-svg" viewBox="0 0 700 320">
            <!-- 溶液背景与液面 -->
            <rect x="50" y="70" width="600" height="230" rx="10" fill="#E3F0EF" stroke="#A7CFCD" stroke-width="2"/>
            <line x1="50" y1="70" x2="650" y2="70" stroke="#08746E" stroke-width="2.5" stroke-dasharray="6 4"/>
            <!-- 滴入试剂指示 -->
            <g id="buffer-droplet-layer"></g>
            <!-- 溶液内部粒子 -->
            <g id="buffer-particles"></g>
          </svg>
        </div>

        <div id="buffer-caption" class="beaker-caption">
          储备等摩尔 HAc 与 Ac⁻，体系初始处于 pKa 稳定平衡点。
        </div>
      </section>
    </main>

    <!-- 底部扰动切换 -->
    <footer class="controls-panel">
      <div class="ctl-group">
        <span class="ctl-label">加入扰动剂 (0.1 mL 1.0 mol/L):</span>
        <button id="btn-none" class="act-btn" aria-pressed="true">不加扰动 (初始)</button>
        <button id="btn-acid" class="act-btn acid-act" aria-pressed="false">+ 盐酸 (HCl)</button>
        <button id="btn-base" class="act-btn base-act" aria-pressed="false">+ 氢氧化钠 (NaOH)</button>
      </div>
      <div class="summary-text">
        机制：<strong>共轭碱抗酸，弱酸分子抗碱</strong>
      </div>
    </footer>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      "use strict";

      // 状态定义：加入 0.1 mL 1.0 M HCl (0.1 mmol) / 0.1 mL 1.0 M NaOH (0.1 mmol)
      // 溶液体积 100 mL
      // 纯水：
      // - 初始: pH 7.00
      // - +0.1 mmol HCl: [H+] = 0.1 mmol / 100 mL = 1.0e-3 M => pH = 3.00 (ΔpH = -4.00)
      // - +0.1 mmol NaOH: [OH-] = 0.1 mmol / 100 mL = 1.0e-3 M => pOH = 3.00 => pH = 11.00 (ΔpH = +4.00)
      // 缓冲液 (0.1 M 各 100 mL = 各 10 mmol):
      // - 初始: pH = 4.76
      // - +0.1 mmol HCl: Ac- 消耗 0.1 mmol(剩 9.9), HAc 增 0.1 mmol(达 10.1) => pH = 4.76 + lg(9.9/10.1) = 4.75 (ΔpH = -0.01)
      // - +0.1 mmol NaOH: HAc 消耗 0.1 mmol(剩 9.9), Ac- 增 0.1 mmol(达 10.1) => pH = 4.76 + lg(10.1/9.9) = 4.77 (ΔpH = +0.01)
      const DATA = {
        none: {
          water: { ph: "7.00", delta: "ΔpH = 0.00", text: "纯水自然电离平衡，[H⁺] = [OH⁻] = 10⁻⁷ mol/L。" },
          buffer: { ph: "4.76", delta: "ΔpH = 0.00", text: "含 10 mmol HAc 与 10 mmol Ac⁻，比例 1:1，处于缓冲中心。" }
        },
        acid: {
          water: { ph: "3.00", delta: "ΔpH = -4.00", text: "外加 H⁺ 无人消耗，游离酸度激增 10000 倍，pH 骤降！" },
          buffer: { ph: "4.75", delta: "ΔpH = -0.01", text: "外加 H⁺ 被共轭碱 Ac⁻ 结合转为 HAc，游离酸度微幅波动。" }
        },
        base: {
          water: { ph: "11.00", delta: "ΔpH = +4.00", text: "外加 OH⁻ 毫无阻拦，游离碱度骤增 10000 倍，pH 飙升！" },
          buffer: { ph: "4.77", delta: "ΔpH = +0.01", text: "外加 OH⁻ 被弱酸 HAc 解离中和，共轭碱微增，pH 几乎稳定。" }
        }
      };

      const waterPh = document.getElementById("water-ph");
      const waterDelta = document.getElementById("water-delta");
      const waterCap = document.getElementById("water-caption");
      const bufferPh = document.getElementById("buffer-ph");
      const bufferDelta = document.getElementById("buffer-delta");
      const bufferCap = document.getElementById("buffer-caption");

      const waterDropletLayer = document.getElementById("water-droplet-layer");
      const waterParticles = document.getElementById("water-particles");
      const bufferDropletLayer = document.getElementById("buffer-droplet-layer");
      const bufferParticles = document.getElementById("buffer-particles");

      const btnNone = document.getElementById("btn-none");
      const btnAcid = document.getElementById("btn-acid");
      const btnBase = document.getElementById("btn-base");

      let currentMode = "none";

      function renderDroplet(layer, type) {
        if (type === "none") {
          layer.innerHTML = "";
          return;
        }
        const color = type === "acid" ? "#B43F2B" : "#23629A";
        const label = type === "acid" ? "+ HCl" : "+ NaOH";
        layer.innerHTML = `
          <g transform="translate(350, 42)">
            <path d="M0,0 C-10,14 -14,24 0,36 C14,24 10,14 0,0 Z" fill="${color}"/>
            <text x="24" y="24" font-size="15" font-weight="700" fill="${color}" font-family="Bahnschrift">${label}</text>
          </g>
        `;
      }

      function pill(x, y, text, fill, textColor = "#FFFFFF", stroke = "none") {
        return `
          <g transform="translate(${x}, ${y})">
            <rect x="-38" y="-14" width="76" height="28" rx="14" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>
            <text x="0" y="5" font-size="13" font-family="Bahnschrift, sans-serif" font-weight="600" fill="${textColor}" text-anchor="middle">${text}</text>
          </g>
        `;
      }

      function renderWaterParticles(mode) {
        let html = "";
        if (mode === "none") {
          // 微量极少量水分子解离
          html += pill(200, 160, "H₂O", "#DAE6E8", "#45636C");
          html += pill(360, 140, "H₂O", "#DAE6E8", "#45636C");
          html += pill(520, 170, "H₂O", "#DAE6E8", "#45636C");
          html += pill(280, 230, "H⁺ (极少)", "rgba(180, 63, 43, 0.15)", "#B43F2B", "#B43F2B");
          html += pill(440, 230, "OH⁻ (极少)", "rgba(35, 98, 154, 0.15)", "#23629A", "#23629A");
        } else if (mode === "acid") {
          // 很多游离 H+ 充斥
          html += pill(160, 140, "游离 H⁺", "#B43F2B");
          html += pill(300, 130, "游离 H⁺", "#B43F2B");
          html += pill(460, 140, "游离 H⁺", "#B43F2B");
          html += pill(570, 190, "游离 H⁺", "#B43F2B");
          html += pill(220, 220, "游离 H⁺", "#B43F2B");
          html += pill(380, 230, "游离 H⁺", "#B43F2B");
          html += pill(510, 240, "Cl⁻", "#7E969D");
        } else {
          // 很多游离 OH- 充斥
          html += pill(160, 140, "游离 OH⁻", "#23629A");
          html += pill(300, 130, "游离 OH⁻", "#23629A");
          html += pill(460, 140, "游离 OH⁻", "#23629A");
          html += pill(570, 190, "游离 OH⁻", "#23629A");
          html += pill(220, 220, "游离 OH⁻", "#23629A");
          html += pill(380, 230, "游离 OH⁻", "#23629A");
          html += pill(510, 240, "Na⁺", "#7E969D");
        }
        waterParticles.innerHTML = html;
      }

      function renderBufferParticles(mode) {
        let html = "";
        // 缓冲基底：大量的 HAc 与 Ac-
        const baseHAc = [
          [150, 130], [280, 150], [420, 125], [560, 140]
        ];
        const baseAc = [
          [160, 225], [300, 235], [440, 230], [570, 235]
        ];

        baseHAc.forEach(pt => {
          html += pill(pt[0], pt[1], "弱酸 HAc", "#08746E");
        });
        baseAc.forEach(pt => {
          html += pill(pt[0], pt[1], "共轭碱 Ac⁻", "#1D8F88");
        });

        if (mode === "acid") {
          // 显示 Ac- 吸收外加 H+ 变为 HAc
          html += `
            <g transform="translate(350, 175)">
              <rect x="-140" y="-18" width="280" height="36" rx="8" fill="#FFF2EE" stroke="#B43F2B" stroke-width="1.5"/>
              <text x="0" y="6" font-size="15" font-weight="700" fill="#B43F2B" text-anchor="middle">Ac⁻ + H⁺ (外加) → HAc 结合抗酸</text>
            </g>
          `;
        } else if (mode === "base") {
          // 显示 HAc 中和外加 OH-
          html += `
            <g transform="translate(350, 175)">
              <rect x="-140" y="-18" width="280" height="36" rx="8" fill="#EDF4FA" stroke="#23629A" stroke-width="1.5"/>
              <text x="0" y="6" font-size="15" font-weight="700" fill="#23629A" text-anchor="middle">HAc + OH⁻ (外加) → Ac⁻ + H₂O 离解抗碱</text>
            </g>
          `;
        }
        bufferParticles.innerHTML = html;
      }

      function applyMode(mode) {
        currentMode = mode;
        const conf = DATA[mode];

        // 读数更新
        waterPh.textContent = conf.water.ph;
        waterDelta.textContent = conf.water.delta;
        waterCap.textContent = conf.water.text;

        bufferPh.textContent = conf.buffer.ph;
        bufferDelta.textContent = conf.buffer.delta;
        bufferCap.textContent = conf.buffer.text;

        // 样式类
        if (mode === "none") {
          waterDelta.className = "meter-delta";
          waterDelta.style.background = "rgba(82,105,112,0.1)";
          waterDelta.style.color = "var(--muted)";
        } else {
          waterDelta.className = "meter-delta delta-large";
          waterDelta.style.background = "";
          waterDelta.style.color = "";
        }

        // 渲染粒子
        renderDroplet(waterDropletLayer, mode);
        renderDroplet(bufferDropletLayer, mode);
        renderWaterParticles(mode);
        renderBufferParticles(mode);

        // 按钮状态
        btnNone.setAttribute("aria-pressed", mode === "none");
        btnAcid.setAttribute("aria-pressed", mode === "acid");
        btnBase.setAttribute("aria-pressed", mode === "base");
      }

      btnNone.addEventListener("click", () => applyMode("none"));
      btnAcid.addEventListener("click", () => applyMode("acid"));
      btnBase.addEventListener("click", () => applyMode("base"));

      // 初始渲染
      applyMode("none");

      // 暴露给 Check
      window.BufferDemo = {
        setMode: applyMode,
        getMode: () => currentMode
      };
    })();
  </script>
</body>
</html>
