<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: 52px 64px 44px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(82, 105, 112, 0.22);
      padding-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    /* 左右双机理对比布局 */
    .mechanisms {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      min-height: 0;
    }

    .mech-card {
      background: var(--paper);
      border: 1px solid rgba(82, 105, 112, 0.18);
      border-radius: 12px;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 18px rgba(20, 43, 51, 0.04);
      position: relative;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
    }

    /* 反应方程式横条 */
    .rxn-box {
      font-family: var(--font-sans);
      font-size: 19px;
      font-weight: 600;
      padding: 12px 16px;
      border-radius: 8px;
      background: var(--selected);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .rxn-box span.acid-sp { color: var(--acid); }
    .rxn-box span.base-sp { color: var(--base); }
    .rxn-box span.buffer-sp { color: var(--buffer); }

    /* 可视化示意图区域 (SVG) */
    .diag-stage {
      flex: 1;
      width: 100%;
      min-height: 0;
      position: relative;
    }

    .diag-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 底盘说明条 */
    .takeaway {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      padding-top: 14px;
      border-top: 1px solid rgba(82, 105, 112, 0.22);
    }

    .takeaway-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: var(--fs-sec);
      color: var(--text);
      font-weight: 500;
    }

    .dot-bullet {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body data-page="04" data-total="17">
  <div id="stage">
    <header>
      <h1>缓冲作用的粒子机制：共轭碱承接外加酸，弱酸补偿外加碱</h1>
    </header>

    <div class="mechanisms min0">
      <!-- 左栏：抵抗外加强酸 -->
      <section class="mech-card min0">
        <div class="card-head">
          <div class="card-title">抵抗外加强酸（加入 H⁺）</div>
        </div>

        <div class="rxn-box">
          <span class="acid-sp">H⁺</span> + <span class="base-sp">A⁻</span>
          <span>⟶</span>
          <span class="buffer-sp">HA</span>
        </div>

        <div class="diag-stage min0">
          <svg class="diag-svg" viewBox="0 0 660 380">
            <defs>
              <marker id="arrow-acid" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                <path d="M1 1 L7 4 L1 7 Z" fill="#B43F2B" />
              </marker>
              <marker id="arrow-buf" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                <path d="M1 1 L7 4 L1 7 Z" fill="#08746E" />
              </marker>
            </defs>

            <!-- 容器背景框 -->
            <rect x="20" y="20" width="620" height="340" rx="10" fill="#F8FCFC" stroke="#D3E2E5" stroke-width="1.5" />

            <!-- 左区：外加质子入侵 -->
            <g transform="translate(60, 50)">
              <rect x="0" y="0" width="160" height="110" rx="8" fill="#FDF3F1" stroke="#F1CBC4" stroke-width="1" />
              <text x="80" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#B43F2B">外来酸</text>
              <circle cx="80" cy="72" r="22" fill="#B43F2B" />
              <text x="80" y="79" text-anchor="middle" font-family="Bahnschrift" font-size="22" font-weight="700" fill="#FFF">H⁺</text>
            </g>

            <!-- 中间反应箭头 -->
            <path d="M 230 105 L 305 105" stroke="#B43F2B" stroke-width="3" fill="none" marker-end="url(#arrow-acid)" />
            <text x="268" y="92" text-anchor="middle" font-size="13" fill="#526970">结合消耗</text>

            <!-- 中区：共轭碱池承接 -->
            <g transform="translate(320, 45)">
              <rect x="0" y="0" width="280" height="120" rx="8" fill="#EFF7F7" stroke="#08746E" stroke-width="1.5" />
              <text x="140" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#08746E">共轭碱储备 (A⁻)</text>
              
              <!-- 粒子群示意 -->
              <g transform="translate(42, 68)">
                <circle cx="0" cy="0" r="18" fill="#23629A" />
                <text x="0" y="6" text-anchor="middle" font-family="Bahnschrift" font-size="16" font-weight="700" fill="#FFF">A⁻</text>
              </g>
              <g transform="translate(98, 68)">
                <circle cx="0" cy="0" r="18" fill="#23629A" />
                <text x="0" y="6" text-anchor="middle" font-family="Bahnschrift" font-size="16" font-weight="700" fill="#FFF">A⁻</text>
              </g>
              <g transform="translate(154, 68)">
                <circle cx="0" cy="0" r="18" fill="#23629A" />
                <text x="0" y="6" text-anchor="middle" font-family="Bahnschrift" font-size="16" font-weight="700" fill="#FFF">A⁻</text>
              </g>
              <g transform="translate(210, 68)">
                <circle cx="0" cy="0" r="18" fill="#23629A" />
                <text x="0" y="6" text-anchor="middle" font-family="Bahnschrift" font-size="16" font-weight="700" fill="#FFF">A⁻</text>
              </g>
            </g>

            <!-- 转化路径连线 -->
            <path d="M 460 175 L 460 215" stroke="#08746E" stroke-width="2.5" fill="none" marker-end="url(#arrow-buf)" stroke-dasharray="4,4" />

            <!-- 下区：转化生成弱酸分子 -->
            <g transform="translate(220, 225)">
              <rect x="0" y="0" width="380" height="110" rx="8" fill="#FFFFFF" stroke="#08746E" stroke-width="2" />
              <text x="190" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#08746E">转化为弱酸 (HA)</text>
              
              <g transform="translate(130, 72)">
                <rect x="-35" y="-18" width="70" height="36" rx="18" fill="#08746E" />
                <text x="0" y="6" text-anchor="middle" font-family="Bahnschrift" font-size="16" font-weight="700" fill="#FFF">HA</text>
              </g>
              <g transform="translate(250, 72)">
                <rect x="-35" y="-18" width="70" height="36" rx="18" fill="#08746E" />
                <text x="0" y="6" text-anchor="middle" font-family="Bahnschrift" font-size="16" font-weight="700" fill="#FFF">HA</text>
              </g>
            </g>

            <!-- 左下机制结论注记 -->
            <g transform="translate(45, 230)">
              <rect x="0" y="0" width="150" height="100" rx="6" fill="#F2F7F8" />
              <text x="75" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#142B33">游离 H⁺ 被锁定</text>
              <text x="75" y="74" text-anchor="middle" font-family="Bahnschrift" font-size="16" font-weight="600" fill="#08746E">ΔpH ≈ 0</text>
            </g>
          </svg>
        </div>
      </section>

      <!-- 右栏：抵抗外加强碱 -->
      <section class="mech-card min0">
        <div class="card-head">
          <div class="card-title">抵抗外加强碱（加入 OH⁻）</div>
        </div>

        <div class="rxn-box">
          <span class="base-sp">OH⁻</span> + <span class="buffer-sp">HA</span>
          <span>⟶</span>
          <span class="acid-sp">H₂O</span> + <span class="base-sp">A⁻</span>
        </div>

        <div class="diag-stage min0">
          <svg class="diag-svg" viewBox="0 0 660 380">
            <defs>
              <marker id="arrow-oh" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                <path d="M1 1 L7 4 L1 7 Z" fill="#23629A" />
              </marker>
              <marker id="arrow-buf2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                <path d="M1 1 L7 4 L1 7 Z" fill="#08746E" />
              </marker>
            </defs>

            <!-- 容器背景框 -->
            <rect x="20" y="20" width="620" height="340" rx="10" fill="#F8FCFC" stroke="#D3E2E5" stroke-width="1.5" />

            <!-- 左区：外加氢氧根入侵 -->
            <g transform="translate(60, 50)">
              <rect x="0" y="0" width="160" height="110" rx="8" fill="#EEF4F9" stroke="#C3D9EB" stroke-width="1" />
              <text x="80" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#23629A">外来碱</text>
              <circle cx="80" cy="72" r="22" fill="#23629A" />
              <text x="80" y="79" text-anchor="middle" font-family="Bahnschrift" font-size="18" font-weight="700" fill="#FFF">OH⁻</text>
            </g>

            <!-- 中间反应箭头 -->
            <path d="M 230 105 L 305 105" stroke="#23629A" stroke-width="3" fill="none" marker-end="url(#arrow-oh)" />
            <text x="268" y="92" text-anchor="middle" font-size="13" fill="#526970">中和消耗</text>

            <!-- 中区：弱酸池供给质子 -->
            <g transform="translate(320, 45)">
              <rect x="0" y="0" width="280" height="120" rx="8" fill="#EFF7F7" stroke="#08746E" stroke-width="1.5" />
              <text x="140" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#08746E">弱酸储备 (HA)</text>
              
              <!-- 粒子群示意 -->
              <g transform="translate(55, 68)">
                <rect x="-26" y="-16" width="52" height="32" rx="16" fill="#08746E" />
                <text x="0" y="6" text-anchor="middle" font-family="Bahnschrift" font-size="15" font-weight="700" fill="#FFF">HA</text>
              </g>
              <g transform="translate(125, 68)">
                <rect x="-26" y="-16" width="52" height="32" rx="16" fill="#08746E" />
                <text x="0" y="6" text-anchor="middle" font-family="Bahnschrift" font-size="15" font-weight="700" fill="#FFF">HA</text>
              </g>
              <g transform="translate(195, 68)">
                <rect x="-26" y="-16" width="52" height="32" rx="16" fill="#08746E" />
                <text x="0" y="6" text-anchor="middle" font-family="Bahnschrift" font-size="15" font-weight="700" fill="#FFF">HA</text>
              </g>
            </g>

            <!-- 转化路径连线 -->
            <path d="M 460 175 L 460 215" stroke="#08746E" stroke-width="2.5" fill="none" marker-end="url(#arrow-buf2)" stroke-dasharray="4,4" />

            <!-- 下区：转化生成 H2O 和共轭碱 -->
            <g transform="translate(220, 225)">
              <rect x="0" y="0" width="380" height="110" rx="8" fill="#FFFFFF" stroke="#08746E" stroke-width="2" />
              <text x="190" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#08746E">生成 H₂O 与共轭碱 (A⁻)</text>
              
              <g transform="translate(110, 72)">
                <rect x="-35" y="-18" width="70" height="36" rx="18" fill="#526970" />
                <text x="0" y="6" text-anchor="middle" font-family="Bahnschrift" font-size="16" font-weight="700" fill="#FFF">H₂O</text>
              </g>
              <g transform="translate(220, 72)">
                <circle cx="0" cy="0" r="18" fill="#23629A" />
                <text x="0" y="6" text-anchor="middle" font-family="Bahnschrift" font-size="16" font-weight="700" fill="#FFF">A⁻</text>
              </g>
              <g transform="translate(290, 72)">
                <circle cx="0" cy="0" r="18" fill="#23629A" />
                <text x="0" y="6" text-anchor="middle" font-family="Bahnschrift" font-size="16" font-weight="700" fill="#FFF">A⁻</text>
              </g>
            </g>

            <!-- 右下机制结论注记 -->
            <g transform="translate(45, 230)">
              <rect x="0" y="0" width="150" height="100" rx="6" fill="#F2F7F8" />
              <text x="75" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#142B33">游离 OH⁻ 被中和</text>
              <text x="75" y="74" text-anchor="middle" font-family="Bahnschrift" font-size="16" font-weight="600" fill="#08746E">ΔpH ≈ 0</text>
            </g>
          </svg>
        </div>
      </section>
    </div>

    <!-- 底部结论总结 -->
    <footer class="takeaway">
      <div class="takeaway-item">
        <div class="dot-bullet" style="background: var(--acid);"></div>
        <span>加入酸时：A⁻ 与 H⁺ 结合转化为弱酸 HA，阻断游离 H⁺ 积累</span>
      </div>
      <div class="takeaway-item">
        <div class="dot-bullet" style="background: var(--base);"></div>
        <span>加入碱时：HA 供氢中和 OH⁻ 生成水与 A⁻，阻断游离 OH⁻ 积累</span>
      </div>
    </footer>
  </div>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 4, total: 17 });
  </script>
</body>
</html>
