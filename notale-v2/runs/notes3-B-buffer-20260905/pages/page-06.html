<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F7F8;
      --paper: #FFFFFF;
      --text: #142B33;
      --muted: #526970;
      --focus: #C45A00;
      --acid: #B43F2B;
      --base: #23629A;
      --buffer: #08746E;
      --selected: #DCECEF;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --font-num: Bahnschrift, "Noto Sans SC", sans-serif;
    }

    #stage {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      padding: 48px 56px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header-row h1 {
      margin: 0;
      font-size: var(--fs-h1);
      line-height: 1.2;
      color: var(--text);
      font-weight: 700;
    }

    .main-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 28px;
    }

    .plot-panel {
      background: var(--paper);
      border: 1px solid #d5e0e3;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 18px 22px 14px;
      position: relative;
    }

    .plot-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .plot-title {
      font-size: var(--fs-body);
      font-weight: 600;
      color: var(--text);
    }

    .legend-row {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: var(--fs-label);
      color: var(--muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-swatch {
      width: 18px;
      height: 3px;
      border-radius: 2px;
    }

    .plot-container {
      flex: 1;
      min-height: 0;
      position: relative;
      width: 100%;
    }

    #chart {
      width: 100%;
      height: 100%;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--paper);
      border: 1px solid #d5e0e3;
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card h2 {
      margin: 0;
      font-size: var(--fs-lead);
      font-weight: 600;
      color: var(--text);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: var(--fs-label);
    }

    .control-head span {
      color: var(--muted);
    }

    .control-val {
      font-family: var(--font-num);
      font-weight: 700;
      color: var(--buffer);
      font-size: var(--fs-body);
    }

    .btn-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .btn {
      appearance: none;
      background: var(--bg);
      border: 1px solid #c7d8dc;
      border-radius: 6px;
      padding: 9px 4px;
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .btn:hover {
      border-color: var(--buffer);
    }

    .btn.active {
      background: var(--buffer);
      border-color: var(--buffer);
      color: #ffffff;
    }

    .btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .stat-readouts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-box {
      background: var(--bg);
      border-radius: 6px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-lbl {
      font-size: var(--fs-tick);
      color: var(--muted);
    }

    .stat-val {
      font-family: var(--font-num);
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
    }

    .stat-val .unit {
      font-size: var(--fs-tick);
      font-weight: 400;
      color: var(--muted);
      margin-left: 2px;
    }

    .rule-box {
      font-size: var(--fs-tick);
      line-height: 1.6;
      color: var(--text);
      border-top: 1px solid #e1e9ec;
      padding-top: 10px;
      margin: 0;
    }

    .rule-box b {
      color: var(--buffer);
      font-weight: 600;
    }
  </style>
</head>
<body data-page="06" data-total="17">
  <div id="stage">
    <div class="header-row">
      <h1>缓冲范围由比例划定，缓冲容量由总浓度支撑</h1>
    </div>

    <div class="main-grid min0">
      <div class="plot-panel min0">
        <div class="plot-title-bar">
          <div class="plot-title">外加强酸/强碱时溶液 pH 的响应轨迹</div>
          <div class="legend-row">
            <div class="legend-item">
              <span class="legend-swatch" style="background: var(--buffer);"></span>
              <span id="legend-cur-txt">所选缓冲液 (0.20 M)</span>
            </div>
            <div class="legend-item">
              <span class="legend-swatch" style="background: var(--base); border-top: 2px dotted var(--base); height:0;"></span>
              <span>对比基准 (0.05 M)</span>
            </div>
          </div>
        </div>
        <div class="plot-container min0">
          <div id="chart" role="img" aria-label="缓冲容量与范围曲线图"></div>
        </div>
      </div>

      <div class="side-panel min0">
        <div class="card">
          <h2>体系总浓度设置</h2>
          <div class="control-group">
            <div class="control-head">
              <span>基准缓冲体系总浓度 c_tot</span>
              <span class="control-val" id="ctot-val">0.20 mol/L</span>
            </div>
            <div class="btn-group" role="radiogroup" aria-label="缓冲液总浓度">
              <button class="btn" data-c="0.05" role="radio" aria-checked="false">0.05 M</button>
              <button class="btn" data-c="0.10" role="radio" aria-checked="false">0.10 M</button>
              <button class="btn active" data-c="0.20" role="radio" aria-checked="true">0.20 M</button>
            </div>
          </div>
          <p class="rule-box">
            <b>缓冲范围：</b>pH ≈ pKa ± 1（比例 0.1 ~ 10）。<br>
            <b>缓冲容量：</b>当外加酸碱量接近共轭物总量时缓冲失效。
          </p>
        </div>

        <div class="card" style="flex:1;">
          <h2>当前状态读数</h2>
          <div class="stat-readouts">
            <div class="stat-box">
              <span class="stat-lbl">初始体系 pH (1:1)</span>
              <span class="stat-val" id="ph0-read">4.76</span>
            </div>
            <div class="stat-box">
              <span class="stat-lbl">有效缓冲跨度 ΔpH</span>
              <span class="stat-val">2.00</span>
            </div>
            <div class="stat-box">
              <span class="stat-lbl">耐酸限度 (ΔpH ≤ 1)</span>
              <span class="stat-val" id="acid-cap">0.082 <span class="unit">M</span></span>
            </div>
            <div class="stat-box">
              <span class="stat-lbl">耐碱限度 (ΔpH ≤ 1)</span>
              <span class="stat-val" id="base-cap">0.082 <span class="unit">M</span></span>
            </div>
          </div>
          <p class="rule-box" style="margin-top:auto;">
            总浓度增加 4 倍，抵御同等 pH 偏移所需外加酸碱量等比例提升 4 倍。
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
    (function () {
      "use strict";

      Deck.init({ index: 6, total: 17, keys: false });

      var pKa = 4.76;
      var curC = 0.20;
      var chartHost = document.getElementById("chart");
      var chart = echarts.init(chartHost, null, { renderer: "svg" });

      function calcCurve(cTot) {
        var points = [];
        var maxDelta = cTot * 0.45;
        var step = maxDelta / 80;
        // x 轴：正值表示加碱（pH 上升），负值表示加酸（pH 下降）
        for (var d = -maxDelta; d <= maxDelta; d += step) {
          var a = cTot / 2 + d;  // 加碱消耗 HA 转化为 A-
          var ha = cTot / 2 - d; // 加碱减少 HA
          if (a > 0.0005 && ha > 0.0005) {
            var ph = pKa + Math.log10(a / ha);
            points.push([Number(d.toFixed(4)), Number(ph.toFixed(3))]);
          }
        }
        return points;
      }

      function updateReadouts(c) {
        document.getElementById("ctot-val").textContent = c.toFixed(2) + " M";
        document.getElementById("legend-cur-txt").textContent = "所选缓冲液 (" + c.toFixed(2) + " M)";
        var acidCap = (c * 0.5 * (9 / 11)).toFixed(3);
        document.getElementById("acid-cap").innerHTML = acidCap + ' <span class="unit">M</span>';
        document.getElementById("base-cap").innerHTML = acidCap + ' <span class="unit">M</span>';
      }

      function render(c) {
        var primaryData = calcCurve(c);
        var refData = calcCurve(0.05);

        var option = {
          animation: false,
          grid: {
            left: 70,
            right: 80,
            top: 40,
            bottom: 48
          },
          xAxis: {
            type: "value",
            min: -0.22,
            max: 0.22,
            axisLabel: {
              formatter: function (v) {
                if (v < 0) return "加酸 " + Math.abs(v).toFixed(2);
                if (v > 0) return "加碱 " + v.toFixed(2);
                return "0";
              },
              color: "#526970",
              fontFamily: "Bahnschrift, sans-serif",
              fontSize: 13
            },
            name: "外加酸 / 碱量 (mol/L)",
            nameLocation: "middle",
            nameGap: 30,
            nameTextStyle: {
              color: "#526970",
              fontSize: 14
            },
            splitLine: {
              lineStyle: {
                color: "#E2EBED",
                type: "dashed"
              }
            }
          },
          yAxis: {
            type: "value",
            min: 2.5,
            max: 7.0,
            interval: 1.0,
            name: "pH",
            nameTextStyle: {
              color: "#526970",
              fontSize: 14
            },
            axisLabel: {
              color: "#526970",
              fontFamily: "Bahnschrift, sans-serif",
              fontSize: 13
            },
            splitLine: {
              lineStyle: {
                color: "#E2EBED"
              }
            }
          },
          series: [
            {
              name: "有效缓冲带",
              type: "line",
              data: [],
              markArea: {
                silent: true,
                itemStyle: {
                  color: "rgba(8, 116, 110, 0.08)"
                },
                data: [
                  [
                    { yAxis: pKa - 1 },
                    { yAxis: pKa + 1 }
                  ]
                ]
              }
            },
            {
              name: "低浓度对比",
              type: "line",
              data: refData,
              showSymbol: false,
              lineStyle: {
                color: "#23629A",
                width: 2.5,
                type: "dotted"
              }
            },
            {
              name: "当前缓冲液",
              type: "line",
              data: primaryData,
              showSymbol: false,
              lineStyle: {
                color: "#08746E",
                width: 3.5
              },
              markLine: {
                silent: true,
                symbol: "none",
                lineStyle: {
                  color: "#526970",
                  type: "dashed",
                  width: 1
                },
                data: [
                  {
                    yAxis: pKa,
                    label: {
                      formatter: "pKa = 4.76",
                      position: "insideStartTop",
                      color: "#08746E",
                      fontSize: 13,
                      fontFamily: "Bahnschrift, sans-serif"
                    }
                  },
                  {
                    yAxis: pKa + 1,
                    label: {
                      formatter: "pKa + 1 (5.76)",
                      position: "insideEndTop",
                      color: "#526970",
                      fontSize: 13,
                      fontFamily: "Bahnschrift, sans-serif"
                    }
                  },
                  {
                    yAxis: pKa - 1,
                    label: {
                      formatter: "pKa - 1 (3.76)",
                      position: "insideEndBottom",
                      color: "#526970",
                      fontSize: 13,
                      fontFamily: "Bahnschrift, sans-serif"
                    }
                  }
                ]
              }
            }
          ]
        };

        chart.setOption(option, true);
        updateReadouts(c);
      }

      var buttons = document.querySelectorAll(".btn-group .btn");
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          buttons.forEach(function (b) {
            b.classList.remove("active");
            b.setAttribute("aria-checked", "false");
          });
          btn.classList.add("active");
          btn.setAttribute("aria-checked", "true");
          curC = parseFloat(btn.dataset.c);
          render(curC);
        });
      });

      render(curC);

      window.addEventListener("resize", function () {
        chart.resize();
      });
    })();
  </script>
</body>
</html>
