<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: 56px 64px 44px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    h1 {
      font-size: var(--fs-h1);
      font-weight: 700;
      line-height: 1.15;
      margin: 0;
      color: var(--text);
    }
    .lead-text {
      font-size: var(--fs-lead);
      color: var(--muted);
      margin: 0;
    }

    .main-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 430px;
      gap: 28px;
    }

    .chart-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }
    .chart-box {
      flex: 1;
      min-height: 0;
      position: relative;
      background: var(--paper);
      border: 1px solid #d5e2e6;
      border-radius: 8px;
      overflow: hidden;
    }
    #titration-chart {
      width: 100%;
      height: 100%;
    }

    .info-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }
    .regime-selector {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stage-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--paper);
      border: 1px solid #d5e2e6;
      border-radius: 6px;
      font-size: var(--fs-sec);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      color: var(--text);
      font-family: inherit;
    }
    .stage-btn:hover {
      background: var(--selected);
    }
    .stage-btn.active {
      border-color: var(--focus);
      background: #fff8f2;
      box-shadow: 0 0 0 1px var(--focus);
    }
    .stage-btn .badge {
      font-family: var(--font-num);
      font-size: var(--fs-tick);
      padding: 2px 6px;
      border-radius: 4px;
      background: #eef4f6;
      color: var(--muted);
    }
    .stage-btn.active .badge {
      background: #fae7d4;
      color: var(--focus);
      font-weight: 600;
    }

    .detail-card {
      flex: 1;
      background: var(--paper);
      border: 1px solid #d5e2e6;
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }
    .detail-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid #edf2f4;
      padding-bottom: 8px;
    }
    .detail-title {
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
    }
    .detail-coords {
      font-family: var(--font-num);
      font-size: var(--fs-tick);
      color: var(--muted);
    }
    .detail-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: #f7fafb;
      padding: 10px 12px;
      border-radius: 6px;
    }
    .metric-label {
      font-size: var(--fs-sec);
      color: var(--muted);
      margin-bottom: 2px;
    }
    .metric-value {
      font-family: var(--font-num);
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .detail-desc {
      font-size: var(--fs-sec);
      line-height: 1.5;
      color: var(--text);
      margin: 0;
    }
    .species-pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chem-pill {
      font-size: var(--fs-label);
      padding: 4px 10px;
      border-radius: 4px;
      font-family: var(--font-sans);
    }
    .pill-acid { background: #fbeae7; color: var(--acid); }
    .pill-base { background: #eaf2f8; color: var(--base); }
    .pill-buf { background: #e8f5f4; color: var(--buffer); }

    .chart-legend-bar {
      display: flex;
      gap: 18px;
      padding-top: 10px;
      font-size: var(--fs-label);
      color: var(--muted);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }
  </style>
</head>
<body data-page="10" data-total="17">
  <div id="stage">
    <header>
      <h1>滴定曲线的五个控制区</h1>
      <p class="lead-text">随强碱滴入，溶液由弱酸单一电离经共轭缓冲转变为强碱主导过量</p>
    </header>

    <div class="main-grid">
      <div class="chart-panel min0">
        <div class="chart-box">
          <div id="titration-chart"></div>
        </div>
        <div class="chart-legend-bar">
          <div class="legend-item"><span class="legend-color" style="background:#B43F2B"></span>起始弱酸</div>
          <div class="legend-item"><span class="legend-color" style="background:#08746E"></span>共轭缓冲窗 (pH = pKa ± 1)</div>
          <div class="legend-item"><span class="legend-color" style="background:#C45A00"></span>当量点突跃</div>
          <div class="legend-item"><span class="legend-color" style="background:#23629A"></span>过量强碱</div>
        </div>
      </div>

      <div class="info-panel min0">
        <div class="regime-selector" role="tablist">
          <button class="stage-btn active" data-id="0">
            <span>起点：弱酸微弱电离</span>
            <span class="badge">0.0 mL</span>
          </button>
          <button class="stage-btn" data-id="1">
            <span>缓冲平缓区：共轭对共存</span>
            <span class="badge">5–18 mL</span>
          </button>
          <button class="stage-btn" data-id="2">
            <span>半当量点：pH = pKa</span>
            <span class="badge">10.0 mL</span>
          </button>
          <button class="stage-btn" data-id="3">
            <span>当量点：产物水解显弱碱性</span>
            <span class="badge">20.0 mL</span>
          </button>
          <button class="stage-btn" data-id="4">
            <span>过量区：强碱主导 pH</span>
            <span class="badge">&gt;20.0 mL</span>
          </button>
        </div>

        <div class="detail-card">
          <div class="detail-header">
            <div class="detail-title" id="card-title">起点：弱酸纯溶液</div>
            <div class="detail-coords" id="card-v-ph">V = 0.00 mL · pH = 2.88</div>
          </div>
          <div class="detail-metrics">
            <div>
              <div class="metric-label">控制平衡模型</div>
              <div class="metric-value" id="card-model">HA ⇌ H⁺ + A⁻</div>
            </div>
            <div>
              <div class="metric-label">缓冲指数 β</div>
              <div class="metric-value" id="card-beta">极低 (无抵御)</div>
            </div>
          </div>
          <p class="detail-desc" id="card-desc">
            未加入 NaOH，体系只有弱酸 HA 电离。H⁺ 浓度约为 √(c·Ka)，pH 由初浓度与解离常数决定。
          </p>
          <div>
            <div class="metric-label" style="margin-bottom:6px;">关键优势物种</div>
            <div class="species-pill-group" id="card-species">
              <span class="chem-pill pill-acid">HA 主导</span>
              <span class="chem-pill pill-acid">微量 H⁺</span>
              <span class="chem-pill pill-buf">极微量 A⁻</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
    (function(){
      // 0.1 M HA (Ka = 1.75e-5, pKa = 4.76), 20.00 mL
      // Titrated with 0.1 M NaOH
      var V0 = 20.0, c0 = 0.1, cB = 0.1, pKa = 4.76, Ka = 1.75e-5, Kw = 1e-14;

      function calcPH(v) {
        if (v <= 0.0001) {
          // c*Ka
          var H = Math.sqrt(c0 * Ka);
          return -Math.log10(H);
        }
        var nA_tot = V0 * c0;
        var nB = v * cB;
        var Vtot = V0 + v;
        if (v < 19.98) {
          // Buffer regime (Henderson-Hasselbalch corrected for dilution)
          var nA = nA_tot - nB;
          var nA_min = nB;
          var ratio = nA_min / nA;
          return pKa + Math.log10(ratio);
        } else if (Math.abs(v - 20.0) <= 0.04) {
          // Equivalence point: pure NaA hydrolysis
          // A- + H2O <=> HA + OH-, Kb = Kw / Ka
          var cA = nA_tot / Vtot;
          var Kb = Kw / Ka;
          var OH = Math.sqrt(cA * Kb);
          var H = Kw / OH;
          return -Math.log10(H);
        } else {
          // Excess strong base dominates
          var nOH_excess = nB - nA_tot;
          var cOH = nOH_excess / Vtot;
          var pOH = -Math.log10(cOH);
          return 14.0 - pOH;
        }
      }

      var rawData = [];
      for (var v = 0; v <= 35.05; v += 0.1) {
        var roundedV = Math.round(v * 10) / 10;
        rawData.push([roundedV, parseFloat(calcPH(roundedV).toFixed(2))]);
      }

      var STAGES = [
        {
          id: 0,
          name: "起点：弱酸纯溶液",
          coord: "V = 0.00 mL · pH = 2.88",
          model: "HA ⇌ H⁺ + A⁻",
          beta: "极低 (无共轭碱)",
          desc: "滴定开始前仅弱酸微弱电离，无缓冲能力，加碱初段 pH 快速爬升。",
          species: [
            { text: "HA 主导", cls: "pill-acid" },
            { text: "微量 H⁺", cls: "pill-acid" },
            { text: "微量 A⁻", cls: "pill-buf" }
          ],
          focusPt: [0, 2.88],
          highlightZone: null
        },
        {
          id: 1,
          name: "缓冲平缓区：共轭对共存",
          coord: "V = 5.0–18.0 mL · pH 4.2–5.3",
          model: "pH = pKa + lg([A⁻]/[HA])",
          beta: "高缓冲容量",
          desc: "生成共轭碱 A⁻ 构成缓冲对，曲线平缓，吸收外加碱冲击。",
          species: [
            { text: "HA 与 A⁻ 共存", cls: "pill-buf" },
            { text: "Na⁺ 旁观离子", cls: "pill-base" }
          ],
          focusPt: [10, 4.76],
          highlightZone: [4, 18]
        },
        {
          id: 2,
          name: "半当量点：最大缓冲容量",
          coord: "V = 10.00 mL · pH = 4.76",
          model: "[HA] = [A⁻] ⇒ pH = pKa",
          beta: "β 达到极大值",
          desc: "加入半数 NaOH，弱酸与共轭碱等量，缓冲抵御力达到极大值。",
          species: [
            { text: "[HA] = [A⁻]", cls: "pill-buf" },
            { text: "pH = pKa", cls: "pill-buf" }
          ],
          focusPt: [10, 4.76],
          highlightZone: [8, 12]
        },
        {
          id: 3,
          name: "当量点：化学计量中和",
          coord: "V = 20.00 mL · pH = 8.73",
          model: "A⁻ + H₂O ⇌ HA + OH⁻",
          beta: "极低 (突跃顶点)",
          desc: "HA 完全转化为 A⁻，产物弱酸根水解产生 OH⁻，使当量点 pH 大于 7。",
          species: [
            { text: "A⁻ 全部生成", cls: "pill-buf" },
            { text: "水解产 OH⁻", cls: "pill-base" }
          ],
          focusPt: [20, 8.73],
          highlightZone: [19.5, 20.5]
        },
        {
          id: 4,
          name: "过量区：强碱主导 pH",
          coord: "V > 20.00 mL · pH > 11.5",
          model: "[OH⁻] 决定于过量 NaOH",
          beta: "脱离弱酸缓冲",
          desc: "滴入过量 NaOH 游离在溶液中，主导高 pH 水平。",
          species: [
            { text: "游离 OH⁻ 主导", cls: "pill-base" },
            { text: "Na⁺ 增多", cls: "pill-base" }
          ],
          focusPt: [25, 12.04],
          highlightZone: [20.5, 35]
        }
      ];

      var currentStage = 0;
      var chart = echarts.init(document.getElementById('titration-chart'), null, { renderer: 'svg' });

      function buildOption(stageIdx) {
        var stage = STAGES[stageIdx];
        var markAreas = [
          [
            { name: '缓冲窗 (pKa±1)', xAxis: 3.5, itemStyle: { color: 'rgba(8, 116, 110, 0.08)' } },
            { xAxis: 18.2 }
          ]
        ];

        var markPoints = [
          {
            name: '当前控制点',
            coord: stage.focusPt,
            symbol: 'circle',
            symbolSize: 14,
            itemStyle: { color: '#C45A00', borderColor: '#FFFFFF', borderWidth: 2 }
          }
        ];

        return {
          animationDuration: 300,
          grid: { left: 55, right: 35, top: 40, bottom: 45 },
          xAxis: {
            type: 'value',
            min: 0,
            max: 35,
            interval: 5,
            name: 'NaOH 体积 (mL)',
            nameLocation: 'middle',
            nameGap: 28,
            nameTextStyle: { color: '#526970', fontSize: 15 },
            axisLabel: { color: '#142B33', fontSize: 13, fontFamily: 'Bahnschrift' },
            splitLine: { lineStyle: { color: '#edf2f4', type: 'dashed' } }
          },
          yAxis: {
            type: 'value',
            min: 0,
            max: 14,
            interval: 2,
            name: 'pH',
            nameTextStyle: { color: '#526970', fontSize: 15 },
            axisLabel: { color: '#142B33', fontSize: 13, fontFamily: 'Bahnschrift' },
            splitLine: { lineStyle: { color: '#edf2f4' } }
          },
          series: [
            {
              type: 'line',
              data: rawData,
              smooth: 0.15,
              showSymbol: false,
              lineStyle: {
                color: '#142B33',
                width: 3
              },
              markArea: {
                silent: true,
                label: {
                  position: 'insideTop',
                  color: '#08746E',
                  fontSize: 15,
                  fontWeight: 'bold',
                  offset: [0, 8]
                },
                data: markAreas
              },
              markPoint: {
                data: markPoints
              },
              markLine: {
                silent: true,
                symbol: 'none',
                lineStyle: { color: '#B43F2B', type: 'dotted', width: 1.5 },
                data: [
                  { yAxis: 7, label: { formatter: '中性 pH 7', position: 'end', color: '#526970', fontSize: 13 } },
                  { xAxis: 20, label: { formatter: '当量点 20 mL', position: 'start', color: '#C45A00', fontSize: 13 } }
                ]
              }
            }
          ]
        };
      }

      function updateCard(idx) {
        var s = STAGES[idx];
        document.getElementById('card-title').textContent = s.name;
        document.getElementById('card-v-ph').textContent = s.coord;
        document.getElementById('card-model').textContent = s.model;
        document.getElementById('card-beta').textContent = s.beta;
        document.getElementById('card-desc').textContent = s.desc;

        var pillBox = document.getElementById('card-species');
        pillBox.innerHTML = '';
        s.species.forEach(function(sp) {
          var span = document.createElement('span');
          span.className = 'chem-pill ' + sp.cls;
          span.textContent = sp.text;
          pillBox.appendChild(span);
        });
      }

      function setStage(idx) {
        currentStage = idx;
        var btns = document.querySelectorAll('.stage-btn');
        btns.forEach(function(btn, i) {
          if (i === idx) btn.classList.add('active');
          else btn.classList.remove('active');
        });
        chart.setOption(buildOption(idx));
        updateCard(idx);
      }

      document.querySelectorAll('.stage-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var id = parseInt(this.getAttribute('data-id'), 10);
          setStage(id);
        });
      });

      chart.setOption(buildOption(0));
      updateCard(0);

      window.addEventListener('resize', function() {
        chart.resize();
      });

      Deck.init({ index: 10, total: 17 });
    })();
  </script>
</body>
</html>
