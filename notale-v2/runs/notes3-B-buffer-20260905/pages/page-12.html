<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>弱酸—强碱滴定的分段计算</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F7F8;
      --paper: #FFFFFF;
      --text: #142B33;
      --muted: #526970;
      --focus: #C45A00;
      --acid: #B43F2B;
      --base: #23629A;
      --buffer: #08746E;
      --selected: #DCECEF;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --font-num: Bahnschrift, "Noto Sans SC", sans-serif;
    }
    #stage {
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 36px 56px 32px 56px;
      color: var(--text);
      font-family: var(--font-sans);
      background: var(--bg);
      gap: 18px;
    }
    header h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
    }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 880px 1fr;
      gap: 32px;
      min-height: 0;
    }
    .plot-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chart-container {
      flex: 1;
      position: relative;
      background: var(--paper);
      border: 1px solid #c7d8dc;
      border-radius: 6px;
      padding: 12px;
      min-height: 0;
    }
    #chartHost {
      width: 100%;
      height: 100%;
    }
    .chart-legend {
      display: flex;
      gap: 20px;
      font-size: var(--fs-label);
      color: var(--muted);
      align-items: center;
      padding-left: 4px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }
    .legend-line {
      width: 20px;
      height: 3px;
      border-radius: 2px;
    }
    .model-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stage-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .stage-btn {
      background: var(--paper);
      border: 1px solid #b8ccd2;
      border-radius: 5px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--muted);
      transition: all 0.15s ease;
    }
    .stage-btn:hover {
      border-color: var(--buffer);
      color: var(--text);
    }
    .stage-btn.active {
      background: var(--selected);
      border-color: var(--buffer);
      color: var(--text);
      box-shadow: inset 0 0 0 1px var(--buffer);
    }
    .panel-card {
      background: var(--paper);
      border: 1px solid #c7d8dc;
      border-radius: 6px;
      padding: 22px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #e2ecee;
      padding-bottom: 10px;
    }
    .panel-stage-title {
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
    }
    .panel-sub {
      font-family: var(--font-num);
      font-size: var(--fs-label);
      color: var(--muted);
    }
    .spec-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .spec-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .spec-label {
      font-size: var(--fs-label);
      color: var(--muted);
      font-weight: 600;
    }
    .spec-val {
      font-size: var(--fs-body);
      color: var(--text);
      font-weight: 500;
    }
    .formula-box {
      background: #f7fafb;
      border: 1px solid #d8e5e8;
      border-radius: 4px;
      padding: 14px 16px;
      font-family: var(--font-num);
      font-size: var(--fs-lead);
      color: var(--buffer);
      font-weight: 600;
    }
    .readout-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 14px 18px;
      background: #eef6f6;
      border: 1px solid #b8d9d7;
      border-radius: 6px;
    }
    .readout-label {
      font-size: var(--fs-label);
      color: var(--muted);
      font-weight: 600;
    }
    .readout-num {
      font-family: var(--font-num);
      font-size: var(--fs-h1);
      font-weight: 700;
      color: var(--text);
    }
    .source-note {
      font-size: var(--fs-tick);
      color: var(--muted);
      margin-top: 2px;
    }
  </style>
</head>
<body data-page="12" data-total="17">
  <div id="stage" class="min0">
    <header>
      <h1>弱酸—强碱滴定按溶液主导物种分为四类计算模型</h1>
    </header>

    <div class="layout min0">
      <div class="plot-col min0">
        <div class="chart-container min0">
          <div id="chartHost"></div>
        </div>
        <div class="chart-legend">
          <span class="legend-item"><span class="legend-line" style="background:#08746E"></span>滴定曲线 (0.1 M HAc + 0.1 M NaOH)</span>
          <span class="legend-item"><span class="legend-swatch" style="background:#08746E; opacity:0.18"></span>缓冲窗口 (pH = pKa ± 1)</span>
          <span class="legend-item"><span class="legend-swatch" style="background:#C45A00; border-radius:50%"></span>当前计算阶段</span>
        </div>
        <div class="source-note">初始 20.00 mL 0.100 M 醋酸 (pKa = 4.76)，用 0.100 M 氢氧化钠滴定。</div>
      </div>

      <div class="model-col min0">
        <div class="stage-nav" role="tablist">
          <button class="stage-btn active" id="btn-0" data-idx="0">起始点</button>
          <button class="stage-btn" id="btn-1" data-idx="1">缓冲区</button>
          <button class="stage-btn" id="btn-2" data-idx="2">当量点</button>
          <button class="stage-btn" id="btn-3" data-idx="3">过量区</button>
        </div>

        <div class="panel-card" id="detailPanel">
          <div class="panel-header">
            <div class="panel-stage-title" id="stageName">起始电离模型</div>
            <div class="panel-sub" id="stageCondition">V(NaOH) = 0.00 mL</div>
          </div>

          <div class="spec-grid">
            <div class="spec-item">
              <span class="spec-label">主导平衡与主导物种</span>
              <span class="spec-val" id="speciesVal">HAc ⇌ H⁺ + Ac⁻（单一弱酸弱电离）</span>
            </div>
            <div class="spec-item">
              <span class="spec-label">适用计算公式</span>
              <div class="formula-box" id="formulaVal">[H⁺] = √(Ka · c)</div>
            </div>
          </div>

          <div class="readout-row">
            <span class="readout-label">计算所得 pH：</span>
            <span class="readout-num" id="phVal">2.88</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
    (function(){
      "use strict";
      Deck.init({ index: 12, total: 17, keys: false });

      // 0.100 M HAc, 20.00 mL, Ka = 1.75e-5, pKa = 4.76
      // Titrated with 0.100 M NaOH
      var Ka = 1.75e-5;
      var Kw = 1.0e-14;
      var c0 = 0.100;
      var V0 = 20.00;

      function calcPH(V) {
        if (V <= 0.0001) {
          // Weak acid dissociation: [H+] = sqrt(Ka * c0)
          var h = Math.sqrt(Ka * c0);
          return -Math.log10(h);
        } else if (V < 19.98) {
          // Buffer region: HH equation
          // moles of Ac- = V * c0, moles of HAc = (V0 - V) * c0
          // [H+] = Ka * (V0 - V) / V
          var ratio = (V0 - V) / V;
          var h = Ka * ratio;
          return -Math.log10(h);
        } else if (Math.abs(V - 20.0) <= 0.05) {
          // Equivalence point: Ac- hydrolysis
          // Ac- + H2O <=> HAc + OH-
          // c(Ac-) = 20 * 0.1 / 40 = 0.05 M
          // Kb = Kw / Ka
          var cAc = (V0 * c0) / (V0 + V);
          var Kb = Kw / Ka;
          var oh = Math.sqrt(Kb * cAc);
          var poh = -Math.log10(oh);
          return 14.0 - poh;
        } else {
          // Excess strong base
          // [OH-] = (V - V0)*0.1 / (V0 + V)
          var oh = ((V - V0) * c0) / (V0 + V);
          var poh = -Math.log10(oh);
          return 14.0 - poh;
        }
      }

      var curveData = [];
      for (var v = 0; v <= 35.05; v += (v > 19.5 && v < 20.5 ? 0.05 : 0.25)) {
        var roundedV = Math.round(v * 100) / 100;
        curveData.push([roundedV, Math.round(calcPH(roundedV) * 100) / 100]);
      }

      var stages = [
        {
          name: "起始电离模型",
          cond: "V(NaOH) = 0.00 mL",
          v: 0.00,
          ph: 2.88,
          species: "HAc ⇌ H⁺ + Ac⁻（单一弱酸电离）",
          formula: "[H⁺] ≈ √(Ka · c)",
          markLabel: "起始点 (0 mL, pH 2.88)"
        },
        {
          name: "缓冲共存模型",
          cond: "0 < V(NaOH) < 20.00 mL (取半当量点 10.00 mL)",
          v: 10.00,
          ph: 4.76,
          species: "HAc 与 Ac⁻ 共存（共轭缓冲对）",
          formula: "pH = pKa + lg(c(Ac⁻) / c(HAc))",
          markLabel: "半当量点 (10 mL, pH 4.76)"
        },
        {
          name: "弱碱水解模型",
          cond: "V(NaOH) = 20.00 mL (化学计量点)",
          v: 20.00,
          ph: 8.73,
          species: "Ac⁻ + H₂O ⇌ HAc + OH⁻（强碱弱酸盐）",
          formula: "[OH⁻] ≈ √( (Kw/Ka) · c(Ac⁻) )",
          markLabel: "当量点 (20 mL, pH 8.73)"
        },
        {
          name: "强碱过量模型",
          cond: "V(NaOH) > 20.00 mL (示例取 25.00 mL)",
          v: 25.00,
          ph: 12.04,
          species: "过量 OH⁻ 主导（抑制弱酸根水解）",
          formula: "[OH⁻] = Δn(OH⁻) / V(总)",
          markLabel: "强碱过量 (25 mL, pH 12.04)"
        }
      ];

      var currentIdx = 0;
      var host = document.getElementById("chartHost");
      var chart = echarts.init(host, null, { renderer: "svg" });

      function getOption(idx) {
        var st = stages[idx];
        return {
          animation: !Deck.reduced(),
          grid: {
            left: 54,
            right: 40,
            top: 40,
            bottom: 45
          },
          xAxis: {
            type: "value",
            name: "V(NaOH) / mL",
            nameLocation: "middle",
            nameGap: 26,
            min: 0,
            max: 35,
            interval: 5,
            axisLabel: { color: "#526970", fontSize: 13, fontFamily: "Bahnschrift" },
            axisLine: { lineStyle: { color: "#8ca2a8" } },
            splitLine: { lineStyle: { color: "#e3ecee" } }
          },
          yAxis: {
            type: "value",
            name: "pH",
            min: 0,
            max: 14,
            interval: 2,
            axisLabel: { color: "#526970", fontSize: 13, fontFamily: "Bahnschrift" },
            axisLine: { lineStyle: { color: "#8ca2a8" } },
            splitLine: { lineStyle: { color: "#e3ecee" } }
          },
          series: [
            {
              id: "buffer-zone",
              type: "line",
              markArea: {
                silent: true,
                itemStyle: {
                  color: "#08746E",
                  opacity: 0.12
                },
                data: [
                  [
                    { yAxis: 3.76 },
                    { yAxis: 5.76 }
                  ]
                ]
              }
            },
            {
              id: "titration-curve",
              type: "line",
              data: curveData,
              showSymbol: false,
              lineStyle: {
                color: "#08746E",
                width: 3.5
              }
            },
            {
              id: "active-point",
              type: "scatter",
              data: [[st.v, st.ph]],
              symbolSize: 14,
              itemStyle: {
                color: "#C45A00",
                borderColor: "#FFFFFF",
                borderWidth: 2
              },
              markPoint: {
                data: [
                  {
                    coord: [st.v, st.ph],
                    value: st.markLabel,
                    symbol: "pin",
                    symbolSize: 42,
                    itemStyle: { color: "#C45A00" },
                    label: {
                      show: true,
                      position: idx === 0 ? "right" : (idx === 2 ? "left" : "top"),
                      distance: 10,
                      formatter: st.markLabel,
                      color: "#142B33",
                      fontSize: 15,
                      fontWeight: 600,
                      backgroundColor: "#FFFFFFee",
                      padding: [4, 8],
                      borderRadius: 4,
                      borderColor: "#b8ccd2",
                      borderWidth: 1
                    }
                  }
                ]
              }
            }
          ]
        };
      }

      function updateUI(idx) {
        currentIdx = idx;
        for (var i = 0; i < 4; i++) {
          var btn = document.getElementById("btn-" + i);
          if (i === idx) {
            btn.classList.add("active");
          } else {
            btn.classList.remove("active");
          }
        }
        var st = stages[idx];
        document.getElementById("stageName").textContent = st.name;
        document.getElementById("stageCondition").textContent = st.cond;
        document.getElementById("speciesVal").textContent = st.species;
        document.getElementById("formulaVal").textContent = st.formula;
        document.getElementById("phVal").textContent = st.ph.toFixed(2);

        chart.setOption(getOption(idx));
      }

      for (var i = 0; i < 4; i++) {
        (function(index){
          document.getElementById("btn-" + index).addEventListener("click", function(){
            updateUI(index);
          });
        })(i);
      }

      chart.setOption(getOption(0));

      window.addEventListener("resize", function(){
        chart.resize();
      });
      new ResizeObserver(function(){
        chart.resize();
      }).observe(host);

      window.setStage = updateUI;
    })();
  </script>
</body>
</html>
