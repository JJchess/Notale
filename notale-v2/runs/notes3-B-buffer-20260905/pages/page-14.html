<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F7F8;
      --paper: #FFFFFF;
      --text: #142B33;
      --muted: #526970;
      --focus: #C45A00;
      --acid: #B43F2B;
      --base: #23629A;
      --buffer: #08746E;
      --selected: #DCECEF;
      --correct: #356A3A;
      --incorrect: #8A5100;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --font-num: Bahnschrift, "Noto Sans SC", sans-serif;
    }

    #stage {
      display: flex;
      flex-direction: column;
      padding: 38px 56px 32px;
      box-sizing: border-box;
      gap: 18px;
    }

    .header-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header-block h1 {
      margin: 0;
      font-size: var(--fs-h1);
      color: var(--text);
      line-height: 1.15;
      font-weight: 700;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 430px;
      gap: 28px;
      flex: 1;
      min-height: 0;
    }

    .chart-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      border: 1px solid rgba(82, 105, 112, 0.22);
      border-radius: 8px;
      padding: 16px 20px 14px;
      min-height: 0;
    }

    .chart-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }

    .chart-title {
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
    }

    .chart-legends {
      display: flex;
      gap: 16px;
      font-size: var(--fs-label);
      color: var(--muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-line {
      width: 18px;
      height: 3px;
      border-radius: 2px;
    }

    .legend-line.weak {
      background: var(--buffer);
    }

    .legend-line.strong {
      background: #8FA4AA;
      border-top: 1px dashed #8FA4AA;
      height: 2px;
    }

    .chart-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    #curveChart {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .side-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

    .panel-box {
      background: var(--paper);
      border: 1px solid rgba(82, 105, 112, 0.22);
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel-box.highlight {
      border-color: rgba(8, 116, 110, 0.35);
      background: #F8FBFC;
    }

    .readout-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(82, 105, 112, 0.14);
      padding-bottom: 10px;
    }

    .readout-label {
      font-size: var(--fs-sec);
      color: var(--muted);
      font-weight: 500;
    }

    .readout-val {
      font-family: var(--font-num);
      font-size: 32px;
      font-weight: 700;
      color: var(--buffer);
    }

    .readout-val.neutral {
      color: var(--muted);
      font-size: 22px;
    }

    .reaction-box {
      background: rgba(220, 236, 239, 0.45);
      border-radius: 6px;
      padding: 10px 14px;
      font-family: var(--font-num), var(--font-sans);
      font-size: 16px;
      color: var(--text);
      line-height: 1.5;
    }

    .reaction-box .hl {
      color: var(--base);
      font-weight: 700;
    }

    .formula-math {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
    }

    .formula-math strong {
      color: var(--text);
      font-family: var(--font-num);
    }

    .controls-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ctl-label-row {
      display: flex;
      justify-content: space-between;
      font-size: var(--fs-label);
      color: var(--text);
      font-weight: 600;
    }

    .ctl-val-badge {
      font-family: var(--font-num);
      color: var(--focus);
      font-weight: 700;
    }

    .range-ctl {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #CCD8DC;
      outline: none;
      cursor: pointer;
    }

    .range-ctl::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--focus);
      cursor: pointer;
      box-shadow: 0 0 0 4px rgba(196, 90, 0, 0.18);
    }

    .nav-btns {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      flex: 1;
      height: 40px;
      padding: 0 4px;
      border: 1px solid rgba(82, 105, 112, 0.28);
      background: var(--paper);
      color: var(--text);
      border-radius: 6px;
      font-size: var(--fs-label);
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .nav-btn:hover {
      background: var(--selected);
    }

    .nav-btn.active {
      background: var(--buffer);
      color: #FFFFFF;
      border-color: var(--buffer);
    }
  </style>
</head>
<body data-page="14" data-total="17">
  <div id="stage">
    <header class="header-block">
      <h1>弱酸滴定的当量点并非中性：共轭碱水解使当量点 pH 大于 7</h1>
    </header>

    <div class="main-grid">
      <!-- 曲线展示区 -->
      <section class="chart-panel min0">
        <div class="chart-head">
          <div class="chart-title">0.10 mol/L 体系滴定曲线对比</div>
          <div class="chart-legends">
            <div class="legend-item"><span class="legend-line weak"></span>0.10 M 醋酸 (pKa 4.76)</div>
            <div class="legend-item"><span class="legend-line strong"></span>0.10 M 强酸参比 (HCl)</div>
          </div>
        </div>
        <div class="chart-wrap min0">
          <div id="curveChart"></div>
        </div>
      </section>

      <!-- 右侧解析与控制区 -->
      <aside class="side-col min0">
        <!-- 当量点核心机理卡片 -->
        <div class="panel-box highlight">
          <div class="readout-row">
            <div class="readout-label">化学计量点 pH</div>
            <div class="readout-val" id="eqPhVal">8.72</div>
          </div>
          <div class="reaction-box">
            CH₃COO⁻ + H₂O ⇌ CH₃COOH + <span class="hl">OH⁻</span>
          </div>
          <div class="formula-math">
            中和生成 0.050 M NaAc。水解使溶液呈碱性：<br>
            [OH⁻] = √(Kb · c) = <strong>5.3×10⁻⁶ M</strong> (pH 8.72)
          </div>
        </div>

        <!-- 交互与状态检视 -->
        <div class="panel-box">
          <div class="controls-wrap">
            <div class="ctl-label-row">
              <span>加入 0.10 M NaOH 体积</span>
              <span class="ctl-val-badge" id="vLabel">20.0 mL（当量点）</span>
            </div>
            <input type="range" id="volRange" class="range-ctl" min="0" max="40" step="0.2" value="20.0">
          </div>

          <div class="nav-btns">
            <button class="nav-btn" data-v="10.0">半当量 10 mL</button>
            <button class="nav-btn active" data-v="20.0">当量点 20 mL</button>
            <button class="nav-btn" data-v="30.0">过量 30 mL</button>
          </div>

          <div class="readout-row" style="margin-top:2px; padding-bottom:4px; border:none;">
            <div class="readout-label">当前滴定点 pH</div>
            <div class="readout-val" id="curPhVal" style="font-size:24px; color:var(--text);">8.72</div>
          </div>
          <div class="formula-math" id="statusDesc">
            全部转化为 CH₃COONa，主导平衡为醋酸根水解，pH > 7。
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script>
    (function(){
      "use strict";

      // 滴定物理常数与计算模型
      // 20.0 mL 0.10 M HA (pKa = 4.76, Ka = 1.74e-5) 用 0.10 M NaOH 滴定
      var V0 = 20.0;
      var C0 = 0.10;
      var Cb = 0.10;
      var pKa = 4.757;
      var Ka = Math.pow(10, -pKa);
      var Kw = 1.0e-14;
      var Kb = Kw / Ka;

      function calcWeakPh(V) {
        var v = Math.max(0, V);
        var totalV = V0 + v;
        if (v === 0) {
          // 起始弱酸电离: [H+] = sqrt(Ka * C0)
          var h = Math.sqrt(Ka * C0);
          return -Math.log10(h);
        }
        if (v < 19.95) {
          // 缓冲共存区: Henderson-Hasselbalch (严格近似)
          var nAcid = C0 * V0 - Cb * v;
          var nBase = Cb * v;
          // [H+] = Ka * nAcid / nBase
          var h = Ka * (nAcid / nBase);
          return -Math.log10(h);
        }
        if (Math.abs(v - 20.0) <= 0.05) {
          // 当量点: 醋酸钠水解 [OH-] = sqrt(Kb * cSalt)
          var cSalt = (C0 * V0) / totalV; // 0.05 M
          var oh = Math.sqrt(Kb * cSalt);
          var h = Kw / oh;
          return -Math.log10(h); // 8.72
        }
        // 过量强碱区: [OH-] = (Cb*v - C0*V0) / totalV
        var nOh = Cb * v - C0 * V0;
        var oh = nOh / totalV;
        var h = Kw / oh;
        return -Math.log10(h);
      }

      function calcStrongPh(V) {
        var v = Math.max(0, V);
        var totalV = V0 + v;
        if (v < 19.98) {
          var nH = C0 * V0 - Cb * v;
          var h = nH / totalV;
          return -Math.log10(h);
        }
        if (Math.abs(v - 20.0) <= 0.05) {
          return 7.00;
        }
        var nOh = Cb * v - C0 * V0;
        var oh = nOh / totalV;
        var h = Kw / oh;
        return -Math.log10(h);
      }

      // 预生成曲线采样点 (0 到 40 mL, 步长 0.2)
      var weakData = [];
      var strongData = [];
      for (var v = 0; v <= 40.05; v += 0.2) {
        var vVal = parseFloat(v.toFixed(1));
        weakData.push([vVal, parseFloat(calcWeakPh(vVal).toFixed(2))]);
        strongData.push([vVal, parseFloat(calcStrongPh(vVal).toFixed(2))]);
      }

      var chartEl = document.getElementById("curveChart");
      var chart = echarts.init(chartEl, null, { renderer: "svg" });

      var option = {
        animation: false,
        grid: {
          left: 56,
          right: 32,
          top: 36,
          bottom: 46
        },
        xAxis: {
          type: "value",
          name: "V(NaOH) / mL",
          nameLocation: "middle",
          nameGap: 28,
          nameTextStyle: { color: "#526970", fontSize: 14, fontFamily: "Noto Sans SC" },
          min: 0,
          max: 40,
          interval: 5,
          axisLine: { lineStyle: { color: "#526970" } },
          axisLabel: { color: "#142B33", fontSize: 13, fontFamily: "Bahnschrift" },
          splitLine: { lineStyle: { color: "rgba(82, 105, 112, 0.12)" } }
        },
        yAxis: {
          type: "value",
          name: "pH",
          nameLocation: "end",
          nameTextStyle: { color: "#526970", fontSize: 14, fontFamily: "Noto Sans SC" },
          min: 0,
          max: 14,
          interval: 2,
          axisLine: { lineStyle: { color: "#526970" } },
          axisLabel: { color: "#142B33", fontSize: 13, fontFamily: "Bahnschrift" },
          splitLine: { lineStyle: { color: "rgba(82, 105, 112, 0.12)" } }
        },
        series: [
          {
            name: "强酸参比",
            type: "line",
            data: strongData,
            smooth: false,
            showSymbol: false,
            lineStyle: { color: "#8FA4AA", width: 2, type: "dashed" },
            z: 2
          },
          {
            name: "弱酸滴定",
            type: "line",
            data: weakData,
            smooth: false,
            showSymbol: false,
            lineStyle: { color: "#08746E", width: 3.5 },
            z: 3,
            markLine: {
              silent: true,
              symbol: "none",
              data: [
                {
                  yAxis: 7.0,
                  lineStyle: { color: "rgba(82, 105, 112, 0.45)", type: "dotted", width: 1.5 },
                  label: {
                    formatter: "中性 pH = 7.0",
                    position: "start",
                    color: "#526970",
                    fontSize: 13,
                    fontFamily: "Noto Sans SC"
                  }
                },
                {
                  xAxis: 20.0,
                  lineStyle: { color: "rgba(196, 90, 0, 0.45)", type: "dashed", width: 1.5 },
                  label: {
                    formatter: "当量点 20 mL",
                    position: "end",
                    color: "#C45A00",
                    fontSize: 13,
                    fontFamily: "Noto Sans SC"
                  }
                }
              ]
            },
            markPoint: {
              silent: true,
              data: [
                {
                  coord: [20.0, 8.72],
                  symbol: "circle",
                  symbolSize: 14,
                  itemStyle: { color: "#08746E", borderColor: "#FFFFFF", borderWidth: 3 },
                  label: {
                    show: true,
                    formatter: "弱酸当量点 pH 8.72",
                    position: "right",
                    distance: 10,
                    color: "#08746E",
                    fontSize: 14,
                    fontWeight: "bold",
                    fontFamily: "Noto Sans SC"
                  }
                },
                {
                  coord: [20.0, 7.00],
                  symbol: "circle",
                  symbolSize: 10,
                  itemStyle: { color: "#8FA4AA", borderColor: "#FFFFFF", borderWidth: 2 },
                  label: {
                    show: true,
                    formatter: "强酸当量点 pH 7.00",
                    position: "bottom",
                    distance: 8,
                    color: "#526970",
                    fontSize: 12,
                    fontFamily: "Noto Sans SC"
                  }
                }
              ]
            }
          },
          {
            name: "当前探针点",
            type: "scatter",
            data: [[20.0, 8.72]],
            symbol: "circle",
            symbolSize: 16,
            itemStyle: {
              color: "#C45A00",
              borderColor: "#FFFFFF",
              borderWidth: 3,
              shadowColor: "rgba(196, 90, 0, 0.4)",
              shadowBlur: 8
            },
            z: 5
          }
        ]
      };

      chart.setOption(option);
      window.addEventListener("resize", function(){ chart.resize(); });

      // 交互逻辑
      var volRange = document.getElementById("volRange");
      var vLabel = document.getElementById("vLabel");
      var curPhVal = document.getElementById("curPhVal");
      var statusDesc = document.getElementById("statusDesc");
      var navBtns = document.querySelectorAll(".nav-btn");

      function updatePoint(vol) {
        var v = parseFloat(vol);
        var ph = calcWeakPh(v);
        var phStr = ph.toFixed(2);
        curPhVal.textContent = phStr;

        if (Math.abs(v - 20.0) < 0.1) {
          vLabel.textContent = "20.0 mL（当量点）";
          curPhVal.textContent = "8.72";
          statusDesc.textContent = "全部转化为 CH₃COONa，主导平衡为醋酸根水解，pH > 7。";
        } else if (v < 20.0) {
          vLabel.textContent = v.toFixed(1) + " mL（未达当量点）";
          if (Math.abs(v - 10.0) < 0.2) {
            statusDesc.textContent = "半当量点：[CH₃COOH] = [CH₃COO⁻]，体系处于缓冲核心区，pH = 4.76。";
          } else {
            statusDesc.textContent = "未达当量点：体系由弱酸与生成的共轭碱构成缓冲对。";
          }
        } else {
          vLabel.textContent = v.toFixed(1) + " mL（滴定剂过量）";
          statusDesc.textContent = "过量区：过量强碱 NaOH 主导溶液 [OH⁻]，水解被极大抑制。";
        }

        // 更新探针散点
        chart.setOption({
          series: [
            {},
            {},
            { data: [[v, parseFloat(phStr)]] }
          ]
        });

        // 按钮高亮同步
        navBtns.forEach(function(btn){
          var targetV = parseFloat(btn.getAttribute("data-v"));
          if (Math.abs(targetV - v) < 0.2) {
            btn.classList.add("active");
          } else {
            btn.classList.remove("active");
          }
        });
      }

      volRange.addEventListener("input", function(e){
        updatePoint(e.target.value);
      });

      navBtns.forEach(function(btn){
        btn.addEventListener("click", function(){
          var targetV = this.getAttribute("data-v");
          volRange.value = targetV;
          updatePoint(targetV);
        });
      });

      Deck.init({ index: 14, total: 17, keys: false });
    })();
  </script>
</body>
</html>
