<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F6F7;
      --text: #17272D;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
    }
    #stage {
      display: flex;
      flex-direction: column;
      padding: 40px 56px 36px;
      box-sizing: border-box;
      gap: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--soft);
      padding-bottom: 14px;
    }
    .header h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }
    .core-claim {
      font-size: var(--fs-sec);
      color: var(--cause);
      font-weight: 600;
    }
    .stage-canvas {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: var(--r-md);
      border: 1px solid var(--soft);
      padding: 24px 28px;
      box-sizing: border-box;
      gap: 16px;
      min-height: 0;
    }
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--soft);
      border-radius: var(--r-sm);
      padding: 8px 16px;
    }
    .controls-label {
      font-size: var(--fs-sec);
      font-weight: 600;
      color: var(--text);
    }
    .toggle-group {
      display: flex;
      gap: 8px;
    }
    .toggle-btn {
      border: 1px solid transparent;
      background: transparent;
      padding: 8px 20px;
      font-size: var(--fs-sec);
      color: var(--muted);
      cursor: pointer;
      border-radius: var(--r-sm);
      font-weight: 600;
      transition: all var(--fast);
    }
    .toggle-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .svg-container {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* SVG styles */
    .node-title {
      font-size: 18px;
      font-weight: 700;
      font-family: var(--font-sans);
    }
    .node-sub {
      font-size: 15px;
      font-family: var(--font-sans);
    }
    .node-pill {
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-sans);
    }
    .node-formula {
      font-size: 16px;
      font-weight: 600;
      font-family: "Times New Roman", serif;
    }
    .edge-path {
      fill: none;
      stroke-width: 3.5;
      transition: stroke var(--fast), stroke-dasharray var(--fast);
    }
    .branch-rect {
      rx: 10px;
      stroke-width: 1.5;
      transition: fill var(--fast), stroke var(--fast);
    }
    .summary-text {
      font-size: 18px;
      font-weight: 700;
      font-family: var(--font-sans);
      transition: fill var(--fast);
    }
  </style>
</head>
<body data-page="19" data-total="24">
  <div id="stage">
    <header class="header min0">
      <div>
        <h1>拓展主张，但不能替代识别</h1>
      </div>
      <div class="core-claim">识别失效时，异质性与机制分析同归无效</div>
    </header>

    <div class="stage-canvas min0">
      <div class="controls-bar min0">
        <span class="controls-label">审读切入视角：</span>
        <div class="toggle-group" role="group" aria-label="基准状态切换">
          <button id="btnValid" class="toggle-btn active" type="button">情境 A：基准因果识别成立</button>
          <button id="btnBroken" class="toggle-btn" type="button">情境 B：基准因果识别破裂（内生偏误）</button>
        </div>
      </div>

      <div class="svg-container min0">
        <svg id="diagram" viewBox="0 0 1430 610">
          <defs>
            <marker id="arrow-valid" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
              <path d="M1,1 L7,4 L1,7 Z" fill="#245A74" />
            </marker>
            <marker id="arrow-broken" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
              <path d="M1,1 L7,4 L1,7 Z" fill="#B13F2A" />
            </marker>
          </defs>

          <!-- ROOT: BASELINE IDENTIFICATION -->
          <g id="nodeBase" transform="translate(40, 160)">
            <rect id="baseBg" x="0" y="0" width="370" height="260" rx="12" fill="#FAFCFD" stroke="#245A74" stroke-width="2"/>
            <text x="28" y="44" class="node-title" fill="#17272D">基准识别模型 (Baseline)</text>
            <text x="28" y="80" class="node-formula" fill="#245A74">Y = β · D + X'γ + ε</text>

            <rect id="baseStatusBg" x="28" y="104" width="314" height="42" rx="6" fill="#E4F1EB"/>
            <text id="baseStatusText" x="42" y="130" class="node-pill" fill="#2D694C">外生性假设满足：Cov(D, ε | X) = 0</text>

            <text x="28" y="180" class="node-sub" fill="#52666E">核心估计量：</text>
            <text id="baseBetaDesc" x="28" y="206" class="node-title" fill="#245A74">β̂ 测度真实平均因果效应</text>
            <text id="baseFootnote" x="28" y="234" class="node-sub" fill="#52666E">主效应可信，是后续分析的唯一合法地基</text>
          </g>

          <!-- CONNECTORS / TREE TRUNKS -->
          <!-- To Heterogeneity (Top) -->
          <path id="pathHetero" class="edge-path" d="M 410,240 C 490,240 510,95 590,95" stroke="#245A74" marker-end="url(#arrow-valid)"/>
          <!-- To Mechanism (Middle) -->
          <path id="pathMech" class="edge-path" d="M 410,290 C 490,290 510,290 590,290" stroke="#245A74" marker-end="url(#arrow-valid)"/>
          <!-- To External Validity (Bottom) -->
          <path id="pathExt" class="edge-path" d="M 410,340 C 490,340 510,485 590,485" stroke="#245A74" marker-end="url(#arrow-valid)"/>

          <!-- BRANCH 1: HETEROGENEITY -->
          <g id="nodeHetero" transform="translate(600, 20)">
            <rect id="heteroBg" class="branch-rect" x="0" y="0" width="790" height="150" fill="#FAFCFD" stroke="#D6E3E8"/>
            <text x="28" y="38" class="node-title" fill="#17272D">1. 异质性分析 (Heterogeneity)</text>
            <text x="490" y="38" class="node-sub" fill="#52666E">子样本回归 / 交互项 βₖ · (D × Gₖ)</text>

            <line x1="28" y1="56" x2="762" y2="56" stroke="#E3ECEF" stroke-width="1"/>

            <rect id="heteroPillBg" x="28" y="74" width="130" height="32" rx="4" fill="#D6E8EE"/>
            <text id="heteroPillText" x="42" y="95" class="node-pill" fill="#245A74">明确受益群体</text>

            <text id="heteroCore" x="176" y="95" class="node-title" fill="#17272D">展现政策对不同群体的差异化边际影响</text>
            <text id="heteroDetail" x="28" y="130" class="node-sub" fill="#52666E">基准成立时反映真实治理差异；基准失效时差异仅代表遗漏变量的分布偏态。</text>
          </g>

          <!-- BRANCH 2: MECHANISM -->
          <g id="nodeMech" transform="translate(600, 215)">
            <rect id="mechBg" class="branch-rect" x="0" y="0" width="790" height="150" fill="#FAFCFD" stroke="#D6E3E8"/>
            <text x="28" y="38" class="node-title" fill="#17272D">2. 机制检验 (Mechanism)</text>
            <text x="500" y="38" class="node-sub" fill="#52666E">中介方程 M = α·D + … ；Y = β'D + θM</text>

            <line x1="28" y1="56" x2="762" y2="56" stroke="#E3ECEF" stroke-width="1"/>

            <rect id="mechPillBg" x="28" y="74" width="130" height="32" rx="4" fill="#D6E8EE"/>
            <text id="mechPillText" x="42" y="95" class="node-pill" fill="#245A74">打开因果黑箱</text>

            <text id="mechCore" x="176" y="95" class="node-title" fill="#17272D">验证处理变量通过中介渠道传导的逻辑链</text>
            <text id="mechDetail" x="28" y="130" class="node-sub" fill="#52666E">基准成立时证明中间环节；基准有偏时中介显著性同样由未观测混淆驱动。</text>
          </g>

          <!-- BRANCH 3: EXTERNAL VALIDITY -->
          <g id="nodeExt" transform="translate(600, 410)">
            <rect id="extBg" class="branch-rect" x="0" y="0" width="790" height="150" fill="#FAFCFD" stroke="#D6E3E8"/>
            <text x="28" y="38" class="node-title" fill="#17272D">3. 外部效度 (External Validity)</text>
            <text x="510" y="38" class="node-sub" fill="#52666E">跨时期、跨地区或向总体样本外推评估</text>

            <line x1="28" y1="56" x2="762" y2="56" stroke="#E3ECEF" stroke-width="1"/>

            <rect id="extPillBg" x="28" y="74" width="130" height="32" rx="4" fill="#D6E8EE"/>
            <text id="extPillText" x="42" y="95" class="node-pill" fill="#245A74">界定外推边界</text>

            <text id="extCore" x="176" y="95" class="node-title" fill="#17272D">评估局部平均处理效应向宏观一般均衡的推广度</text>
            <text id="extDetail" x="28" y="130" class="node-sub" fill="#52666E">内部效度是外推前提：样本内因果不真，讨论向他处推广便无学术价值。</text>
          </g>

          <!-- BOTTOM SUMMARY BANNER -->
          <g id="nodeSummary" transform="translate(40, 450)">
            <rect id="summaryBg" x="0" y="0" width="370" height="110" rx="10" fill="#E4F1EB" stroke="#2D694C" stroke-width="1.5"/>
            <text x="20" y="36" class="node-sub" fill="#52666E">审稿人评估判据：</text>
            <text id="summaryText" x="20" y="72" class="summary-text" fill="#2D694C">基准识别立得住，拓展分析才锦上添花</text>
            <text id="summarySub" x="20" y="94" class="node-sub" fill="#2D694C">机制与异质性负责丰富故事，不能弥补因果识别赤字</text>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      Deck.init({ index: 19, total: 24 });

      var btnValid = document.getElementById('btnValid');
      var btnBroken = document.getElementById('btnBroken');

      // Base Elements
      var baseBg = document.getElementById('baseBg');
      var baseStatusBg = document.getElementById('baseStatusBg');
      var baseStatusText = document.getElementById('baseStatusText');
      var baseBetaDesc = document.getElementById('baseBetaDesc');
      var baseFootnote = document.getElementById('baseFootnote');

      // Paths
      var pathHetero = document.getElementById('pathHetero');
      var pathMech = document.getElementById('pathMech');
      var pathExt = document.getElementById('pathExt');

      // Heterogeneity
      var heteroBg = document.getElementById('heteroBg');
      var heteroPillBg = document.getElementById('heteroPillBg');
      var heteroPillText = document.getElementById('heteroPillText');
      var heteroCore = document.getElementById('heteroCore');

      // Mechanism
      var mechBg = document.getElementById('mechBg');
      var mechPillBg = document.getElementById('mechPillBg');
      var mechPillText = document.getElementById('mechPillText');
      var mechCore = document.getElementById('mechCore');

      // External Validity
      var extBg = document.getElementById('extBg');
      var extPillBg = document.getElementById('extPillBg');
      var extPillText = document.getElementById('extPillText');
      var extCore = document.getElementById('extCore');

      // Summary
      var summaryBg = document.getElementById('summaryBg');
      var summaryText = document.getElementById('summaryText');
      var summarySub = document.getElementById('summarySub');

      function update(valid) {
        if (valid) {
          btnValid.classList.add('active');
          btnBroken.classList.remove('active');

          baseBg.setAttribute('fill', '#FAFCFD');
          baseBg.setAttribute('stroke', '#245A74');
          baseStatusBg.setAttribute('fill', '#E4F1EB');
          baseStatusText.setAttribute('fill', '#2D694C');
          baseStatusText.textContent = '外生性假设满足：Cov(D, ε | X) = 0';
          baseBetaDesc.setAttribute('fill', '#245A74');
          baseBetaDesc.textContent = 'β̂ 测度真实平均因果效应';
          baseFootnote.textContent = '主效应可信，是后续分析的唯一合法地基';

          pathHetero.setAttribute('stroke', '#245A74');
          pathHetero.setAttribute('stroke-dasharray', 'none');
          pathHetero.setAttribute('marker-end', 'url(#arrow-valid)');

          pathMech.setAttribute('stroke', '#245A74');
          pathMech.setAttribute('stroke-dasharray', 'none');
          pathMech.setAttribute('marker-end', 'url(#arrow-valid)');

          pathExt.setAttribute('stroke', '#245A74');
          pathExt.setAttribute('stroke-dasharray', 'none');
          pathExt.setAttribute('marker-end', 'url(#arrow-valid)');

          // Hetero
          heteroBg.setAttribute('fill', '#FAFCFD');
          heteroBg.setAttribute('stroke', '#D6E3E8');
          heteroPillBg.setAttribute('fill', '#D6E8EE');
          heteroPillText.setAttribute('fill', '#245A74');
          heteroPillText.textContent = '明确受益群体';
          heteroCore.setAttribute('fill', '#17272D');
          heteroCore.textContent = '展现政策对不同群体的差异化边际影响';

          // Mech
          mechBg.setAttribute('fill', '#FAFCFD');
          mechBg.setAttribute('stroke', '#D6E3E8');
          mechPillBg.setAttribute('fill', '#D6E8EE');
          mechPillText.setAttribute('fill', '#245A74');
          mechPillText.textContent = '打开因果黑箱';
          mechCore.setAttribute('fill', '#17272D');
          mechCore.textContent = '验证处理变量通过中介渠道传导的逻辑链';

          // Ext
          extBg.setAttribute('fill', '#FAFCFD');
          extBg.setAttribute('stroke', '#D6E3E8');
          extPillBg.setAttribute('fill', '#D6E8EE');
          extPillText.setAttribute('fill', '#245A74');
          extPillText.textContent = '界定外推边界';
          extCore.setAttribute('fill', '#17272D');
          extCore.textContent = '评估局部平均处理效应向宏观一般均衡的推广度';

          // Summary
          summaryBg.setAttribute('fill', '#E4F1EB');
          summaryBg.setAttribute('stroke', '#2D694C');
          summaryText.setAttribute('fill', '#2D694C');
          summaryText.textContent = '基准识别立得住，拓展分析才锦上添花';
          summarySub.setAttribute('fill', '#2D694C');
          summarySub.textContent = '机制与异质性负责丰富故事，不能弥补因果识别赤字';
        } else {
          btnValid.classList.remove('active');
          btnBroken.classList.add('active');

          baseBg.setAttribute('fill', '#FDF9F8');
          baseBg.setAttribute('stroke', '#B13F2A');
          baseStatusBg.setAttribute('fill', '#FCEBE8');
          baseStatusText.setAttribute('fill', '#B13F2A');
          baseStatusText.textContent = '内生偏误 / 遗漏变量：Cov(D, ε) ≠ 0';
          baseBetaDesc.setAttribute('fill', '#B13F2A');
          baseBetaDesc.textContent = 'β̂ 混入偏误，不具有因果含义';
          baseFootnote.textContent = '地基崩塌：后续一切派生分析均继承此偏误';

          pathHetero.setAttribute('stroke', '#B13F2A');
          pathHetero.setAttribute('stroke-dasharray', '6 4');
          pathHetero.setAttribute('marker-end', 'url(#arrow-broken)');

          pathMech.setAttribute('stroke', '#B13F2A');
          pathMech.setAttribute('stroke-dasharray', '6 4');
          pathMech.setAttribute('marker-end', 'url(#arrow-broken)');

          pathExt.setAttribute('stroke', '#B13F2A');
          pathExt.setAttribute('stroke-dasharray', '6 4');
          pathExt.setAttribute('marker-end', 'url(#arrow-broken)');

          // Hetero
          heteroBg.setAttribute('fill', '#FDF9F8');
          heteroBg.setAttribute('stroke', '#F1D4CE');
          heteroPillBg.setAttribute('fill', '#FCEBE8');
          heteroPillText.setAttribute('fill', '#B13F2A');
          heteroPillText.textContent = '偏误组间扩散';
          heteroCore.setAttribute('fill', '#B13F2A');
          heteroCore.textContent = '子样本系数差异不能解释为因果异质性，仅反映偏误分布';

          // Mech
          mechBg.setAttribute('fill', '#FDF9F8');
          mechBg.setAttribute('stroke', '#F1D4CE');
          mechPillBg.setAttribute('fill', '#FCEBE8');
          mechPillText.setAttribute('fill', '#B13F2A');
          mechPillText.textContent = '中介回归伪相关';
          mechCore.setAttribute('fill', '#B13F2A');
          mechCore.textContent = '中介与结果的统计显著性很可能同样由未观测混淆变量导致';

          // Ext
          extBg.setAttribute('fill', '#FDF9F8');
          extBg.setAttribute('stroke', '#F1D4CE');
          extPillBg.setAttribute('fill', '#FCEBE8');
          extPillText.setAttribute('fill', '#B13F2A');
          extPillText.textContent = '外推丧失前提';
          extCore.setAttribute('fill', '#B13F2A');
          extCore.textContent = '缺乏内部有效性的估计值，推向任何外部情境都无意义';

          // Summary
          summaryBg.setAttribute('fill', '#FCEBE8');
          summaryBg.setAttribute('stroke', '#B13F2A');
          summaryText.setAttribute('fill', '#B13F2A');
          summaryText.textContent = '基准一旦失效，拓展分析全线沦为虚假繁荣';
          summarySub.setAttribute('fill', '#B13F2A');
          summarySub.textContent = '不能用“机制合理”或“异质性显著”来倒推基准识别正确';
        }
      }

      btnValid.addEventListener('click', function () { update(true); });
      btnBroken.addEventListener('click', function () { update(false); });
    })();
  </script>
</body>
</html>
