<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>从“纪传体是资料分类”到“篇章组合会产生意义”</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F3F5F1;
      --paper: #FFFFFF;
      --text: #17231F;
      --muted: #52635D;
      --focus: #0A6D8C;
      --crossref: #246358;
      --judgment: #9C3528;
      --selected: #155F83;
      --font-display: "Noto Serif SC", "Source Han Serif SC", STSong, serif;
      --font-sans: "Noto Sans SC", "Source Han Sans SC", STHeiti, sans-serif;
      --font-num: "DIN Alternate", "Trebuchet MS", sans-serif;
      --fs-h1: 34px;
      --fs-h2: 22px;
      --fs-body: 18px;
      --fs-sec: 16px;
      --fs-label: 15px;
      --fs-tick: 13px;
    }

    #stage {
      padding: 40px 56px 36px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-sizing: border-box;
      color: var(--text);
      font-family: var(--font-sans);
    }

    /* 顶部标题区 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 2px solid var(--text);
      padding-bottom: 12px;
    }
    .header-title h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .header-sub {
      margin-top: 6px;
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: 1.4;
    }

    /* 核心对比工作台 */
    .workbench {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      min-height: 0;
    }

    .model-card {
      background: var(--paper);
      border: 1px solid rgba(23, 35, 31, 0.12);
      border-radius: 6px;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 16px rgba(23, 35, 31, 0.04);
      transition: border-color var(--ease), box-shadow var(--ease);
    }
    .model-card.active {
      border: 2px solid var(--selected);
      box-shadow: 0 8px 24px rgba(21, 95, 131, 0.1);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(23, 35, 31, 0.08);
      padding-bottom: 10px;
    }
    .card-label {
      font-size: var(--fs-label);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .card-title {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 700;
      margin: 0;
      color: var(--text);
    }

    /* 结构展示台 */
    .stage-canvas-wrap {
      flex: 1;
      position: relative;
      border-radius: 4px;
      background: #FAFBFA;
      border: 1px dashed rgba(23, 35, 31, 0.12);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 图形视区（SVG架构图） */
    .stage-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 底部判断与机制解释 */
    .card-desc {
      font-size: var(--fs-sec);
      line-height: 1.45;
      color: var(--muted);
      min-height: 44px;
    }
    .card-desc strong {
      color: var(--text);
      font-weight: 600;
    }

    /* 底部互动与结论栏 */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--paper);
      border: 1px solid rgba(23, 35, 31, 0.1);
      border-radius: 6px;
      padding: 10px 24px;
    }
    .mode-switch {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn-toggle {
      border: 1px solid rgba(23, 35, 31, 0.2);
      background: transparent;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: var(--fs-label);
      font-weight: 600;
      cursor: pointer;
      color: var(--muted);
      transition: all var(--ease);
    }
    .btn-toggle:hover {
      border-color: var(--text);
      color: var(--text);
    }
    .btn-toggle.active {
      background: var(--selected);
      border-color: var(--selected);
      color: #FFFFFF;
    }
    .summary-text {
      font-size: var(--fs-sec);
      font-family: var(--font-display);
      color: var(--judgment);
      font-weight: 600;
    }
  </style>
</head>
<body data-page="02" data-total="15">
  <div id="stage">
    <header class="header">
      <div class="header-title">
        <h1>篇章组合产生意义：纪传体不是封闭档案</h1>
        <div class="header-sub">单篇记述与跨篇互见：拼合太史公的史识网络</div>
      </div>
    </header>

    <main class="workbench min0">
      <!-- 左：传统误解（档案袋模型） -->
      <section class="model-card min0" id="model-folder">
        <div class="card-top">
          <h2 class="card-title">孤立档案视角</h2>
          <span class="card-label">分类查索 · 篇章割裂</span>
        </div>
        <div class="stage-canvas-wrap">
          <svg class="stage-svg" viewBox="0 0 680 430" id="svg-folder">
            <defs>
              <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
                <circle cx="2" cy="2" r="1" fill="#E2E6E2" />
              </pattern>
            </defs>
            <rect width="680" height="430" fill="url(#grid-dots)" />

            <!-- 独立箱体 1: 高祖本纪 -->
            <g transform="translate(45, 55)">
              <rect x="0" y="0" width="165" height="310" rx="4" fill="#FFFFFF" stroke="#8E9B96" stroke-width="1.5" />
              <rect x="0" y="0" width="165" height="42" rx="4" fill="#F0F4F2" />
              <text x="82" y="27" text-anchor="middle" font-size="16" font-family="var(--font-display)" font-weight="700" fill="#17231F">高祖本纪</text>
              <line x1="20" y1="80" x2="145" y2="80" stroke="#CBD4D0" stroke-width="2" />
              <text x="25" y="73" font-size="13" fill="#17231F" font-weight="600">功业统绪</text>
              <rect x="20" y="100" width="125" height="46" rx="3" fill="#F8FAF9" stroke="#DFE4E2" />
              <text x="82" y="128" text-anchor="middle" font-size="15" fill="#17231F">约法三章</text>
              <rect x="20" y="158" width="125" height="46" rx="3" fill="#F8FAF9" stroke="#DFE4E2" />
              <text x="82" y="186" text-anchor="middle" font-size="15" fill="#17231F">定鼎称尊</text>
              <text x="82" y="280" text-anchor="middle" font-size="13" fill="#52635D">隐去狼狈弃子</text>
            </g>

            <!-- 独立箱体 2: 项羽本纪 -->
            <g transform="translate(255, 55)">
              <rect x="0" y="0" width="165" height="310" rx="4" fill="#FFFFFF" stroke="#8E9B96" stroke-width="1.5" />
              <rect x="0" y="0" width="165" height="42" rx="4" fill="#F0F4F2" />
              <text x="82" y="27" text-anchor="middle" font-size="16" font-family="var(--font-display)" font-weight="700" fill="#17231F">项羽本纪</text>
              <line x1="20" y1="80" x2="145" y2="80" stroke="#CBD4D0" stroke-width="2" />
              <text x="25" y="73" font-size="13" fill="#17231F" font-weight="600">霸业悲壮</text>
              <rect x="20" y="100" width="125" height="46" rx="3" fill="#F8FAF9" stroke="#DFE4E2" />
              <text x="82" y="128" text-anchor="middle" font-size="15" fill="#17231F">巨鹿破釜</text>
              <rect x="20" y="158" width="125" height="46" rx="3" fill="#F8FAF9" stroke="#DFE4E2" />
              <text x="82" y="186" text-anchor="middle" font-size="15" fill="#17231F">彭城大破汉军</text>
              <text x="82" y="280" text-anchor="middle" font-size="13" fill="#52635D">隐去坑降杀戮</text>
            </g>

            <!-- 独立箱体 3: 淮阴侯列传 -->
            <g transform="translate(465, 55)">
              <rect x="0" y="0" width="165" height="310" rx="4" fill="#FFFFFF" stroke="#8E9B96" stroke-width="1.5" />
              <rect x="0" y="0" width="165" height="42" rx="4" fill="#F0F4F2" />
              <text x="82" y="27" text-anchor="middle" font-size="16" font-family="var(--font-display)" font-weight="700" fill="#17231F">淮阴侯列传</text>
              <line x1="20" y1="80" x2="145" y2="80" stroke="#CBD4D0" stroke-width="2" />
              <text x="25" y="73" font-size="13" fill="#17231F" font-weight="600">军事韬略</text>
              <rect x="20" y="100" width="125" height="46" rx="3" fill="#F8FAF9" stroke="#DFE4E2" />
              <text x="82" y="128" text-anchor="middle" font-size="15" fill="#17231F">背水一战</text>
              <rect x="20" y="158" width="125" height="46" rx="3" fill="#F8FAF9" stroke="#DFE4E2" />
              <text x="82" y="186" text-anchor="middle" font-size="15" fill="#17231F">计定齐赵</text>
              <text x="82" y="280" text-anchor="middle" font-size="13" fill="#52635D">孤立自足无互涉</text>
            </g>
          </svg>
        </div>
        <div class="card-desc">
          视各篇为<strong>孤立人事档案</strong>：只在本篇读本传，见其首尾自足，却隐去了跨篇方显的幽微实况。
        </div>
      </section>

      <!-- 右：互见生义（网络交织模型） -->
      <section class="model-card min0 active" id="model-network">
        <div class="card-top">
          <h2 class="card-title">互见法网络视角</h2>
          <span class="card-label" style="color: var(--crossref);">篇章交织 · 立体照映</span>
        </div>
        <div class="stage-canvas-wrap">
          <svg class="stage-svg" viewBox="0 0 680 430" id="svg-network">
            <!-- 节点背景卡片 -->
            <!-- 节点 1: 高祖本纪 -->
            <g id="node-gaozu" transform="translate(60, 45)">
              <rect x="0" y="0" width="160" height="95" rx="4" fill="#FFFFFF" stroke="#246358" stroke-width="2" />
              <rect x="0" y="0" width="160" height="28" rx="4" fill="#E8F1EE" />
              <text x="80" y="19" text-anchor="middle" font-size="14" font-family="var(--font-display)" font-weight="700" fill="#246358">高祖本纪</text>
              <text x="80" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#17231F">明扬帝范</text>
              <text x="80" y="76" text-anchor="middle" font-size="12" fill="#52635D">主述开国功德</text>
            </g>

            <!-- 节点 2: 项羽本纪 -->
            <g id="node-xiangyu" transform="translate(460, 45)">
              <rect x="0" y="0" width="160" height="95" rx="4" fill="#FFFFFF" stroke="#246358" stroke-width="2" />
              <rect x="0" y="0" width="160" height="28" rx="4" fill="#E8F1EE" />
              <text x="80" y="19" text-anchor="middle" font-size="14" font-family="var(--font-display)" font-weight="700" fill="#246358">项羽本纪</text>
              <text x="80" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#17231F">独显霸王之雄</text>
              <text x="80" y="76" text-anchor="middle" font-size="12" fill="#52635D">主述慷慨气概</text>
            </g>

            <!-- 核心焦点事件：彭城战败与弃子 -->
            <g id="node-event" transform="translate(240, 160)">
              <rect x="0" y="0" width="200" height="90" rx="6" fill="#FFF8F7" stroke="#9C3528" stroke-width="2" />
              <text x="100" y="28" text-anchor="middle" font-size="14" font-family="var(--font-display)" font-weight="700" fill="#9C3528">关键史实聚焦</text>
              <text x="100" y="54" text-anchor="middle" font-size="15" font-weight="700" fill="#17231F">彭城大败 · 楚军围逼</text>
              <text x="100" y="74" text-anchor="middle" font-size="13" fill="#9C3528">高祖推堕儿女于车下</text>
            </g>

            <!-- 节点 3: 滕公列传 -->
            <g id="node-tenggong" transform="translate(60, 290)">
              <rect x="0" y="0" width="160" height="95" rx="4" fill="#FFFFFF" stroke="#155F83" stroke-width="2" />
              <rect x="0" y="0" width="160" height="28" rx="4" fill="#E8EFF3" />
              <text x="80" y="19" text-anchor="middle" font-size="14" font-family="var(--font-display)" font-weight="700" fill="#155F83">夏侯婴(滕公)列传</text>
              <text x="80" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#17231F">如实出恶言与弃子</text>
              <text x="80" y="76" text-anchor="middle" font-size="12" fill="#52635D">补足刘邦卑劣窘急</text>
            </g>

            <!-- 节点 4: 高祖功臣侯者年表 / 淮阴侯列传 -->
            <g id="node-huaiyin" transform="translate(460, 290)">
              <rect x="0" y="0" width="160" height="95" rx="4" fill="#FFFFFF" stroke="#155F83" stroke-width="2" />
              <rect x="0" y="0" width="160" height="28" rx="4" fill="#E8EFF3" />
              <text x="80" y="19" text-anchor="middle" font-size="14" font-family="var(--font-display)" font-weight="700" fill="#155F83">淮阴侯 / 功臣侯表</text>
              <text x="80" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#17231F">分述杀伐与暗计</text>
              <text x="80" y="76" text-anchor="middle" font-size="12" fill="#52635D">还原汉家立国代价</text>
            </g>

            <!-- 互见关联线 -->
            <!-- 高祖本纪 -> 核心事件（虚饰） -->
            <path d="M 140 140 Q 180 205 240 205" fill="none" stroke="#52635D" stroke-width="2" stroke-dasharray="4,4" />
            <rect x="150" y="158" width="68" height="22" rx="3" fill="#FFFFFF" stroke="#CBD4D0" />
            <text x="184" y="174" text-anchor="middle" font-size="13" fill="#52635D">略去丑行</text>

            <!-- 滕公列传 -> 核心事件（互见实录） -->
            <path d="M 140 290 Q 180 230 240 220" fill="none" stroke="#246358" stroke-width="2.5" />
            <polygon points="237,216 247,220 238,225" fill="#246358" />
            <rect x="146" y="246" width="76" height="22" rx="3" fill="#E8F1EE" stroke="#246358" />
            <text x="184" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#246358">互见见真形</text>

            <!-- 项羽本纪 -> 核心事件 -->
            <path d="M 540 140 Q 500 205 440 205" fill="none" stroke="#246358" stroke-width="2" />
            <polygon points="443,201 433,205 442,210" fill="#246358" />
            <rect x="460" y="158" width="68" height="22" rx="3" fill="#E8F1EE" stroke="#246358" />
            <text x="494" y="174" text-anchor="middle" font-size="13" fill="#246358">威势压顶</text>

            <!-- 淮阴侯 -> 核心事件 -->
            <path d="M 540 290 Q 500 230 440 220" fill="none" stroke="#52635D" stroke-width="2" stroke-dasharray="4,4" />
            <rect x="462" y="246" width="68" height="22" rx="3" fill="#FFFFFF" stroke="#CBD4D0" />
            <text x="496" y="262" text-anchor="middle" font-size="13" fill="#52635D">反衬用兵</text>
          </svg>
        </div>
        <div class="card-desc">
          本纪载大体、列传补实态：<strong>同一事件在各篇取不同侧面</strong>，交织方见太史公褒贬真意。
        </div>
      </section>
    </main>

    <!-- 底部操作与核心论点 -->
    <footer class="footer-bar">
      <div class="mode-switch">
        <span style="font-size: 14px; font-weight: 700; color: var(--muted); margin-right: 4px;">聚焦研读：</span>
        <button type="button" class="btn-toggle" id="btn-focus-folder" onclick="setFocus('folder')">传统：各篇归各篇</button>
        <button type="button" class="btn-toggle active" id="btn-focus-network" onclick="setFocus('network')">司马迁：篇章互见拼合</button>
      </div>
      <div class="summary-text" id="summary-caption">
        篇章不是储物格，而是由读者参与重构的意义网络
      </div>
    </footer>
  </div>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 2, total: 15 });

    function setFocus(mode) {
      const folderCard = document.getElementById('model-folder');
      const networkCard = document.getElementById('model-network');
      const btnFolder = document.getElementById('btn-focus-folder');
      const btnNetwork = document.getElementById('btn-focus-network');
      const caption = document.getElementById('summary-caption');

      if (mode === 'folder') {
        folderCard.classList.add('active');
        networkCard.classList.remove('active');
        btnFolder.classList.add('active');
        btnNetwork.classList.remove('active');
        caption.textContent = '孤立阅篇：难察剪裁之巧，错把纪传当死分类';
      } else {
        networkCard.classList.add('active');
        folderCard.classList.remove('active');
        btnNetwork.classList.add('active');
        btnFolder.classList.remove('active');
        caption.textContent = '篇章不是储物格，而是由读者参与重构的意义网络';
      }
    }
  </script>
</body>
</html>
