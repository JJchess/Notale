<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      display: flex;
      flex-direction: column;
      padding: 48px 56px;
      color: var(--text);
      background: var(--bg);
      user-select: none;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(82, 99, 93, 0.25);
      padding-bottom: 14px;
    }
    .page-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: 700;
      letter-spacing: 0.02em;
      margin: 0;
    }
    .status-badge {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      color: var(--muted);
    }
    .status-badge strong {
      color: var(--text);
      font-family: var(--font-num);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 28px;
      flex: 1;
      min-height: 0;
    }

    /* 左侧：史料片段卡片库 */
    .source-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    .col-label {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .col-label .hint-sub {
      font-family: var(--font-sans);
      font-size: var(--fs-tick);
      color: var(--muted);
      font-weight: normal;
    }

    .cards-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .doc-card {
      background: var(--paper);
      border: var(--line) solid rgba(82, 99, 93, 0.25);
      border-radius: var(--radius);
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color var(--ease), transform var(--ease), box-shadow var(--ease);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }
    .doc-card:hover {
      border-color: var(--selected);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(23, 35, 31, 0.06);
    }
    .doc-card.active {
      border-color: var(--crossref);
      background: #fafcfb;
    }
    .doc-card.active::after {
      content: "已编联";
      position: absolute;
      right: 14px;
      top: 14px;
      font-size: var(--fs-tick);
      color: var(--crossref);
      font-weight: 700;
    }
    .doc-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .doc-tag {
      font-size: var(--fs-tick);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .tag-benji {
      background: #e9eff5;
      color: var(--selected);
    }
    .tag-other {
      background: #eaf2ed;
      color: var(--crossref);
    }
    .doc-source {
      font-family: var(--font-display);
      font-size: var(--fs-label);
      font-weight: 700;
      color: var(--text);
    }
    .doc-quote {
      font-family: var(--font-display);
      font-size: var(--fs-sec);
      line-height: 1.45;
      color: var(--text);
      margin: 0;
    }
    .doc-impact {
      font-size: var(--fs-tick);
      color: var(--muted);
      line-height: 1.35;
    }

    /* 右侧：证据链天平与形象重构 */
    .synthesis-col {
      background: var(--paper);
      border: var(--line) solid rgba(82, 99, 93, 0.2);
      border-radius: var(--radius);
      padding: 24px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
    }

    /* 上部：形象坐标轴与属性重算 */
    .balance-section {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .persona-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .persona-title {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      color: var(--text);
      margin: 0;
    }
    .persona-phase-tag {
      font-size: var(--fs-label);
      padding: 3px 12px;
      border-radius: 4px;
      font-weight: 700;
      transition: background var(--ease), color var(--ease);
    }
    .phase-single {
      background: #fbeefd;
      color: var(--judgment);
    }
    .phase-multi {
      background: #eaf2ed;
      color: var(--crossref);
    }

    .meter-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 6px;
    }
    .meter-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .meter-info {
      display: flex;
      justify-content: space-between;
      font-size: var(--fs-label);
    }
    .meter-info .trait-name {
      font-weight: 700;
      color: var(--text);
    }
    .meter-info .trait-val {
      font-family: var(--font-num);
      font-weight: 700;
    }
    .meter-track {
      height: 12px;
      background: #eaeee9;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .meter-bar {
      height: 100%;
      border-radius: 6px;
      transition: width 350ms cubic-bezier(0.16, 1, 0.3, 1), background var(--ease);
    }

    /* 结论对比卡 */
    .verdict-box {
      margin-top: 14px;
      background: #f7f9f6;
      border: 1px solid rgba(82, 99, 93, 0.2);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .verdict-box .verdict-tag {
      font-size: var(--fs-label);
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .verdict-box .verdict-text {
      font-family: var(--font-display);
      font-size: var(--fs-body);
      line-height: 1.5;
      color: var(--text);
      margin: 0;
    }

    /* 底部操作与重置 */
    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid rgba(82, 99, 93, 0.2);
    }
    .action-msg {
      font-size: var(--fs-sec);
      color: var(--muted);
    }
    .btn-reset {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      padding: 8px 18px;
      border: 1px solid var(--muted);
      border-radius: var(--radius);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: all var(--ease);
    }
    .btn-reset:hover {
      background: var(--text);
      color: var(--paper);
      border-color: var(--text);
    }
  </style>
</head>
<body data-page="07" data-total="15">
  <div id="stage">
    <header class="header-row">
      <h1 class="page-title">互见重构：单篇结论与跨篇结论的校正</h1>
      <div class="status-badge" id="status-badge">
        已编联 <strong id="active-count">1</strong> / 4 篇
      </div>
    </header>

    <main class="main-grid">
      <!-- 左列：史料编联库 -->
      <section class="source-col min0" aria-label="相关篇章史料">
        <div class="col-label">
          <span>考据卷宗：李广其人</span>
          <span class="hint-sub">点击卡片切换编联</span>
        </div>
        <div class="cards-box" id="cards-box">
          <!-- 动态渲染 4 张卡片 -->
        </div>
      </section>

      <!-- 右列：重构模型推演与天平 -->
      <section class="synthesis-col min0" aria-label="形象重构结果">
        <div class="balance-section">
          <div class="persona-header">
            <div>
              <h2 class="persona-title" id="persona-title">单篇本传：悲剧名将</h2>
              <div style="font-size: var(--fs-sec); color: var(--muted); margin-top: 4px;" id="persona-sub">
                仅依据《李将军列传》建构的抒情化武将形象
              </div>
            </div>
            <div class="persona-phase-tag phase-single" id="phase-tag">本篇孤证</div>
          </div>

          <div class="meter-container">
            <div class="meter-row">
              <div class="meter-info">
                <span class="trait-name">军事治军严明度</span>
                <span class="trait-val" id="val-discipline">85%</span>
              </div>
              <div class="meter-track">
                <div class="meter-bar" id="bar-discipline" style="width: 85%; background: var(--selected);"></div>
              </div>
            </div>

            <div class="meter-row">
              <div class="meter-info">
                <span class="trait-name">不遇不公感（悲剧色彩）</span>
                <span class="trait-val" id="val-tragedy">92%</span>
              </div>
              <div class="meter-track">
                <div class="meter-bar" id="bar-tragedy" style="width: 92%; background: var(--judgment);"></div>
              </div>
            </div>

            <div class="meter-row">
              <div class="meter-info">
                <span class="trait-name">政治大局与战略短板</span>
                <span class="trait-val" id="val-flaw">15%</span>
              </div>
              <div class="meter-track">
                <div class="meter-bar" id="bar-flaw" style="width: 15%; background: var(--muted);"></div>
              </div>
            </div>
          </div>

          <div class="verdict-box" id="verdict-box">
            <span class="verdict-tag" id="verdict-tag">叙事结论分析</span>
            <p class="verdict-text" id="verdict-text">
              《李将军列传》倾注深厚同情，详写善射爱士、数奇不封与引刀自刭；读者极易得出“朝廷刻薄寡恩、良将怀才不遇”的绝对悲剧结论。
            </p>
          </div>
        </div>

        <div class="action-row">
          <div class="action-msg" id="action-msg">
            点选左侧跨篇证据，观察叙事天平如何纠偏
          </div>
          <button type="button" class="btn-reset" id="btn-reset">还原单篇视界</button>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script>
    const SOURCES = [
      {
        id: "li_zhuan",
        source: "《李将军列传》",
        type: "benji",
        typeLabel: "本传",
        quote: "“广廉，得赏赐辄分其麾下……引刀自刭，百姓闻之垂涕。”",
        impact: "突出廉洁宽厚与悲壮结局。",
        locked: true, // 基础篇不可卸除
        discipline: 85,
        tragedy: 92,
        flaw: 15
      },
      {
        id: "wei_qing",
        source: "《卫将军骠骑列传》",
        type: "other",
        typeLabel: "他传互见",
        quote: "“大将军阴受上诫，以为李广老，数奇，毋令当单于。”",
        impact: "揭示武帝战略评估，非单纯私人恩怨。",
        discipline: -10,
        tragedy: -20,
        flaw: +25
      },
      {
        id: "cheng_bu_shi",
        source: "《李将军列传》附程不识",
        type: "other",
        typeLabel: "篇内对比",
        quote: "“程不识正部曲行伍营阵……广军简易，然匈奴忽至亦多亡。”",
        impact: "对照严整治军，显露治军松弛之患。",
        discipline: -30,
        tragedy: -15,
        flaw: +20
      },
      {
        id: "sha_jiang",
        source: "《李将军列传》霸陵尉/杀降事",
        type: "other",
        typeLabel: "伏笔校正",
        quote: "“广诱降羌八百余人诈而杀之……霸陵尉醉呵广，起复斩尉。”",
        impact: "显露性格狭隘：杀尉复仇、背誓杀降。",
        discipline: -15,
        tragedy: -25,
        flaw: +35
      }
    ];

    let state = {
      activeIds: ["li_zhuan"]
    };

    const cardsBox = document.getElementById("cards-box");
    const activeCountEl = document.getElementById("active-count");
    const titleEl = document.getElementById("persona-title");
    const subEl = document.getElementById("persona-sub");
    const phaseTagEl = document.getElementById("phase-tag");
    const valDiscipline = document.getElementById("val-discipline");
    const valTragedy = document.getElementById("val-tragedy");
    const valFlaw = document.getElementById("val-flaw");
    const barDiscipline = document.getElementById("bar-discipline");
    const barTragedy = document.getElementById("bar-tragedy");
    const barFlaw = document.getElementById("bar-flaw");
    const verdictText = document.getElementById("verdict-text");
    const actionMsg = document.getElementById("action-msg");
    const btnReset = document.getElementById("btn-reset");

    function calculateScores() {
      let discipline = 85;
      let tragedy = 92;
      let flaw = 15;

      state.activeIds.forEach(id => {
        if (id === "li_zhuan") return;
        const item = SOURCES.find(s => s.id === id);
        if (item) {
          discipline += item.discipline;
          tragedy += item.tragedy;
          flaw += item.flaw;
        }
      });

      return {
        discipline: Math.max(10, Math.min(100, discipline)),
        tragedy: Math.max(10, Math.min(100, tragedy)),
        flaw: Math.max(10, Math.min(100, flaw))
      };
    }

    function renderCards() {
      cardsBox.innerHTML = "";
      SOURCES.forEach(s => {
        const card = document.createElement("div");
        const isActive = state.activeIds.includes(s.id);
        card.className = `doc-card ${isActive ? "active" : ""}`;
        card.dataset.id = s.id;

        card.innerHTML = `
          <div class="doc-meta">
            <span class="doc-tag ${s.type === 'benji' ? 'tag-benji' : 'tag-other'}">${s.typeLabel}</span>
            <span class="doc-source">${s.source}</span>
          </div>
          <p class="doc-quote">${s.quote}</p>
          <div class="doc-impact">${s.impact}</div>
        `;

        if (!s.locked) {
          card.addEventListener("click", () => toggleCard(s.id));
        } else {
          card.style.cursor = "default";
        }
        cardsBox.appendChild(card);
      });
    }

    function toggleCard(id) {
      if (state.activeIds.includes(id)) {
        state.activeIds = state.activeIds.filter(i => i !== id);
      } else {
        state.activeIds.push(id);
      }
      updateView();
    }

    function updateView() {
      renderCards();
      const count = state.activeIds.length;
      activeCountEl.textContent = count;

      const scores = calculateScores();
      valDiscipline.textContent = `${scores.discipline}%`;
      barDiscipline.style.width = `${scores.discipline}%`;

      valTragedy.textContent = `${scores.tragedy}%`;
      barTragedy.style.width = `${scores.tragedy}%`;

      valFlaw.textContent = `${scores.flaw}%`;
      barFlaw.style.width = `${scores.flaw}%`;

      if (count === 1) {
        titleEl.textContent = "单篇本传：悲剧名将";
        subEl.textContent = "仅依据《李将军列传》建构的抒情化武将形象";
        phaseTagEl.className = "persona-phase-tag phase-single";
        phaseTagEl.textContent = "本篇孤证";
        verdictText.textContent = "《李将军列传》详写善射爱士与引刀自刭，易得出“良将怀才不遇、朝廷刻薄”的悲剧结论。";
        actionMsg.textContent = "点选左侧跨篇证据，观察叙事天平如何纠偏";
      } else if (count < 4) {
        titleEl.textContent = "互见透视：性格与战略之隙";
        subEl.textContent = "引入跨篇史料校正，露出军事战术与制度限度";
        phaseTagEl.className = "persona-phase-tag phase-multi";
        phaseTagEl.textContent = "局部校正";
        verdictText.textContent = "引入治军对比与高层战略顾虑后，治军过简的溃散风险显现，“数奇”亦有大兵团协同战术的制度成因。";
        actionMsg.textContent = `已纳 ${count} 处材料，继续编联以拼合司马迁笔下多面史实`;
      } else {
        titleEl.textContent = "立体拼合：多重视界下的复杂真人";
        subEl.textContent = "本传、他传与阴微琐事互证，英雄与局限并存";
        phaseTagEl.className = "persona-phase-tag phase-multi";
        phaseTagEl.textContent = "互见全景";
        verdictText.textContent = "全篇互见：既存录其爱士勇决，又如实载其杀降失德与战术缺陷。司马迁以此达成“寓褒贬于离合”的历史实录。";
        actionMsg.textContent = "完成 4 篇跨篇互见编联，呈现司马迁笔下复调史学构图";
      }
    }

    btnReset.addEventListener("click", () => {
      state.activeIds = ["li_zhuan"];
      updateView();
    });

    // 初始化
    updateView();
    Deck.init({ index: 7, total: 15, keys: false });
  </script>
</body>
</html>
