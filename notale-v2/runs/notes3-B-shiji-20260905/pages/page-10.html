<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F3F5F1;
      --paper: #FFFFFF;
      --text: #17231F;
      --muted: #52635D;
      --judgment: #9C3528;
      --crossref: #246358;
      --selected: #155F83;
      --font-display: "Noto Serif SC", "Source Han Serif SC", SimSun, serif;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --fs-h1: 34px;
      --fs-h2: 22px;
      --fs-lead: 19px;
      --fs-body: 18px;
      --fs-sec: 16px;
      --fs-label: 15px;
      --fs-tick: 13px;
    }

    #stage {
      display: flex;
      flex-direction: column;
      padding: 44px 56px 36px;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
    }

    header {
      margin-bottom: 20px;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .lead-claim {
      margin: 8px 0 0;
      font-size: var(--fs-body);
      color: var(--muted);
      line-height: 1.4;
    }

    /* 主结构容器：左侧结构图解，右侧叙述声音解析 */
    .arena {
      flex: 1;
      display: grid;
      grid-template-columns: 910px 1fr;
      gap: 28px;
      min-height: 0;
    }

    /* 左侧面板：篇末位置与四大材料汇聚机制 */
    .diagram-panel {
      background: var(--paper);
      border-radius: 6px;
      border: 1px solid rgba(23, 35, 31, 0.14);
      padding: 24px 28px 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(23, 35, 31, 0.08);
      padding-bottom: 10px;
    }

    .panel-title {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
    }

    .diagram-svg-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    .diagram-svg-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 右侧面板：声音分层与例证 */
    .stream-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .voice-card {
      background: var(--paper);
      border-radius: 6px;
      border: 1px solid rgba(23, 35, 31, 0.12);
      padding: 14px 18px;
      cursor: pointer;
      transition: all 180ms ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .voice-card:hover {
      border-color: var(--selected);
    }

    .voice-card.active {
      border-color: var(--judgment);
      background: #FAF8F6;
      box-shadow: 0 2px 8px rgba(156, 53, 40, 0.08);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .voice-name {
      font-family: var(--font-display);
      font-size: var(--fs-body);
      font-weight: 700;
      color: var(--text);
    }

    .voice-card.active .voice-name {
      color: var(--judgment);
    }

    .voice-role {
      font-size: var(--fs-label);
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .voice-quote {
      font-family: var(--font-display);
      font-size: var(--fs-sec);
      color: var(--text);
      line-height: 1.45;
      background: #F3F5F1;
      padding: 8px 12px;
      border-radius: 4px;
      border-left: none;
      margin: 2px 0 0;
    }

    .voice-action {
      font-size: var(--fs-label);
      color: var(--muted);
      line-height: 1.4;
    }

    /* 底部导航控件 */
    .deck-nav {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid rgba(23, 35, 31, 0.1);
    }

    .nav-tabs {
      display: flex;
      gap: 12px;
    }

    .nav-btn {
      background: var(--paper);
      border: 1px solid rgba(23, 35, 31, 0.2);
      border-radius: 4px;
      padding: 7px 18px;
      font-size: var(--fs-label);
      color: var(--text);
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all 180ms ease;
    }

    .nav-btn:hover {
      border-color: var(--judgment);
      color: var(--judgment);
    }

    .nav-btn[aria-current="true"] {
      background: var(--judgment);
      color: #FFF;
      border-color: var(--judgment);
    }

    .nav-indicator {
      font-size: var(--fs-label);
      color: var(--muted);
    }
  </style>
</head>
<body data-page="10" data-total="15">
  <div id="stage">
    <header>
      <div class="title-row">
        <h1>“太史公曰”的位置与声音</h1>
      </div>
      <p class="lead-claim">篇末收束史事、传闻、感慨与裁断，叙事者从隐身记录转为显身定论。</p>
    </header>

    <div class="arena">
      <!-- 左：篇末空间与结构动量 -->
      <section class="diagram-panel min0">
        <div class="panel-head">
          <span class="panel-title">篇体结构与材料交汇</span>
          <span class="voice-role" id="viewDesc">篇末论赞收束四大叙述支流</span>
        </div>
        <div class="diagram-svg-wrap">
          <svg id="schematic" viewBox="0 0 850 470" fill="none">
            <!-- 篇章主体区（上方） -->
            <rect x="20" y="16" width="810" height="162" rx="6" fill="#F8F9F7" stroke="#D1D8D4" stroke-width="1.5" />
            <text x="44" y="50" fill="#52635D" font-size="16" font-weight="700">纪传篇体 · 正文叙事层</text>
            <text x="44" y="78" fill="#52635D" font-size="15">依序记录世系、战阵与言行，叙事者隐藏于客观陈述之后</text>

            <!-- 四个源头节点 -->
            <g id="node-fact" class="source-node" transform="translate(44, 104)">
              <rect width="170" height="52" rx="4" fill="#FFF" stroke="#246358" stroke-width="1.5" />
              <text x="24" y="32" fill="#246358" font-size="15" font-weight="700">官方档案 · 史事</text>
            </g>

            <g id="node-legend" class="source-node" transform="translate(238, 104)">
              <rect width="170" height="52" rx="4" fill="#FFF" stroke="#246358" stroke-width="1.5" />
              <text x="24" y="32" fill="#246358" font-size="15" font-weight="700">田野访求 · 传闻</text>
            </g>

            <g id="node-feeling" class="source-node" transform="translate(432, 104)">
              <rect width="170" height="52" rx="4" fill="#FFF" stroke="#246358" stroke-width="1.5" />
              <text x="24" y="32" fill="#246358" font-size="15" font-weight="700">目击所见 · 感慨</text>
            </g>

            <g id="node-judgment" class="source-node" transform="translate(626, 104)">
              <rect width="170" height="52" rx="4" fill="#FFF" stroke="#246358" stroke-width="1.5" />
              <text x="24" y="32" fill="#246358" font-size="15" font-weight="700">春秋义理 · 裁断</text>
            </g>

            <!-- 流向汇聚连线 -->
            <path id="flow-fact" d="M 129 156 C 129 224, 380 230, 400 286" stroke="#246358" stroke-width="2" stroke-dasharray="4 3" opacity="0.4" fill="none" />
            <path id="flow-legend" d="M 323 156 C 323 216, 410 234, 420 286" stroke="#246358" stroke-width="2" opacity="0.4" fill="none" />
            <path id="flow-feeling" d="M 517 156 C 517 216, 440 234, 430 286" stroke="#246358" stroke-width="2" opacity="0.4" fill="none" />
            <path id="flow-judgment" d="M 711 156 C 711 224, 470 230, 450 286" stroke="#9C3528" stroke-width="2.5" opacity="0.4" fill="none" />

            <!-- 篇末界标 -->
            <line x1="20" y1="222" x2="830" y2="222" stroke="#D1D8D4" stroke-dasharray="3 3" stroke-width="1" />
            <text x="36" y="214" fill="#52635D" font-size="13">篇末界标：叙事者在此显身发言</text>

            <!-- 篇末论赞核心区 -->
            <g id="zan-block" transform="translate(175, 286)">
              <rect width="500" height="152" rx="6" fill="#FDFBF9" stroke="#9C3528" stroke-width="2" />
              <text x="32" y="40" fill="#9C3528" font-family="'Noto Serif SC', serif" font-size="22" font-weight="700">太史公曰：</text>
              <text id="zan-dynamic-text" x="32" y="76" fill="#17231F" font-size="16" font-family="'Noto Serif SC', serif">“余读功令，及客设难……乃知其说。”</text>
              <text id="zan-dynamic-sub" x="32" y="112" fill="#52635D" font-size="15">依托官府档案与法律令文，作为叙事实证的底板</text>
            </g>
          </svg>
        </div>
      </section>

      <!-- 右：四种声音及其作用 -->
      <section class="stream-panel min0">
        <div class="voice-card active" data-flow="fact">
          <div class="card-top">
            <span class="voice-name">核验史事</span>
            <span class="voice-role">正史骨干</span>
          </div>
          <blockquote class="voice-quote">“余读功令，及客设难……乃知其说。”</blockquote>
          <span class="voice-action">穿透书面官牍，指出档案缝隙。</span>
        </div>

        <div class="voice-card" data-flow="legend">
          <div class="card-top">
            <span class="voice-name">引述传闻</span>
            <span class="voice-role">补史之阙</span>
          </div>
          <blockquote class="voice-quote">“学者多称五帝，尚矣，然尚书独载尧以来……”</blockquote>
          <span class="voice-action">采撷风俗父老所传，辨析异闻。</span>
        </div>

        <div class="voice-card" data-flow="feeling">
          <div class="card-top">
            <span class="voice-name">现场感慨</span>
            <span class="voice-role">目击体验</span>
          </div>
          <blockquote class="voice-quote">“余登会稽，探禹穴……适鲁，观仲尼庙堂车服礼器……”</blockquote>
          <span class="voice-action">以学者足迹与叹喟注入历史体温。</span>
        </div>

        <div class="voice-card" data-flow="judgment">
          <div class="card-top">
            <span class="voice-name">定性裁断</span>
            <span class="voice-role">微言大义</span>
          </div>
          <blockquote class="voice-quote">“自矜功伐，奋其私智……乃引天亡我，岂不谬哉！”</blockquote>
          <span class="voice-action">直接剥离虚饰，对历史成败一锤定音。</span>
        </div>
      </section>
    </div>

    <!-- 控制条 -->
    <div class="deck-nav">
      <div class="nav-tabs">
        <button class="nav-btn" data-target="fact" aria-current="true">史事：证史实</button>
        <button class="nav-btn" data-target="legend">传闻：广见闻</button>
        <button class="nav-btn" data-target="feeling">感慨：通情志</button>
        <button class="nav-btn" data-target="judgment">裁断：定褒贬</button>
      </div>
      <div class="nav-indicator">按键或点击切换四种声音的交汇维度</div>
    </div>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (function() {
      Deck.init({ index: 9, total: 15, keys: false });

      const cards = Array.from(document.querySelectorAll('.voice-card'));
      const buttons = Array.from(document.querySelectorAll('.nav-btn'));
      const zanText = document.getElementById('zan-dynamic-text');
      const zanSub = document.getElementById('zan-dynamic-sub');
      const viewDesc = document.getElementById('viewDesc');

      const DATA = {
        fact: {
          name: "核验史事",
          flowId: "flow-fact",
          nodeId: "node-fact",
          quote: "“余读功令，及客设难……乃知其说。”",
          sub: "依托官府档案与法律令文，作为叙事实证的底板",
          desc: "以档案材料为骨架，勘定纪传核心脉络"
        },
        legend: {
          name: "引述传闻",
          flowId: "flow-legend",
          nodeId: "node-legend",
          quote: "“学者多称五帝，然尚书独载尧以来……非好学深思者不能知。”",
          sub: "网罗天下放失旧闻，考信于父老相传的口述记载",
          desc: "兼听传闻与异说，保留历史现场的多元面貌"
        },
        feeling: {
          name: "现场感慨",
          flowId: "flow-feeling",
          nodeId: "node-feeling",
          quote: "“余登会稽，探禹穴……适鲁，观仲尼庙堂车服礼器，祇回留之不能去。”",
          sub: "亲历遗迹引发的情感震颤，赋予文字强烈的个人烙印",
          desc: "以身涉历古迹，使篇末生发出超越纯实录的叹咏"
        },
        judgment: {
          name: "定性裁断",
          flowId: "flow-judgment",
          nodeId: "node-judgment",
          quote: "“自矜功伐，奋其私智……乃引天亡我，岂不谬哉！”",
          sub: "反驳传主盲区，以深刻的因果逻辑完成最终历史定性",
          desc: "冲破传主叙述视角，确立司马迁独立的史家裁决"
        }
      };

      const flows = ['flow-fact', 'flow-legend', 'flow-feeling', 'flow-judgment'];
      const nodes = ['node-fact', 'node-legend', 'node-feeling', 'node-judgment'];

      function setActive(key) {
        const item = DATA[key];
        if (!item) return;

        // 更新按键状态
        buttons.forEach(btn => {
          btn.setAttribute('aria-current', btn.getAttribute('data-target') === key ? 'true' : 'false');
        });

        // 更新卡片状态
        cards.forEach(card => {
          card.classList.toggle('active', card.getAttribute('data-flow') === key);
        });

        // 更新文案
        zanText.textContent = item.quote;
        zanSub.textContent = item.sub;
        viewDesc.textContent = item.desc;

        // 更新 SVG 动势高亮
        flows.forEach(fid => {
          const el = document.getElementById(fid);
          if (el) {
            if (fid === item.flowId) {
              el.setAttribute('opacity', '1');
              el.setAttribute('stroke-width', '3.5');
            } else {
              el.setAttribute('opacity', '0.2');
              el.setAttribute('stroke-width', '1.5');
            }
          }
        });

        nodes.forEach(nid => {
          const el = document.getElementById(nid);
          if (el) {
            const rect = el.querySelector('rect');
            if (nid === item.nodeId) {
              rect.setAttribute('stroke', '#9C3528');
              rect.setAttribute('stroke-width', '2.5');
            } else {
              rect.setAttribute('stroke', '#246358');
              rect.setAttribute('stroke-width', '1.5');
            }
          }
        });
      }

      // 绑定卡片与按钮事件
      cards.forEach(card => {
        card.addEventListener('click', () => {
          const key = card.getAttribute('data-flow');
          setActive(key);
        });
      });

      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.getAttribute('data-target');
          setActive(key);
        });
      });

      // 初始化默认状态
      setActive('fact');
    })();
  </script>
</body>
</html>
