<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F3F5F1;
      --paper: #FFFFFF;
      --text: #17231F;
      --muted: #52635D;
      --focus: #0A6D8C;
      --crossref: #246358;
      --judgment: #9C3528;
      --selected: #155F83;
      --line: 2px;
      --radius: 6px;
      --font-display: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", STSong, serif;
      --font-sans: "PingFang SC", "Noto Sans SC", "Source Han Sans SC", STHeiti, sans-serif;
      --font-num: "DIN Alternate", "Trebuchet MS", sans-serif;
    }

    #stage {
      padding: 40px 56px 48px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
    }

    /* 顶部标题区 */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: var(--line) solid var(--text);
      padding-bottom: 14px;
    }
    .header-main {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .page-title {
      font-family: var(--font-display);
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin: 0;
      line-height: 1.2;
    }
    .page-sub {
      font-size: 16px;
      color: var(--muted);
      margin: 0;
    }
    .btns {
      display: flex;
      gap: 10px;
    }
    .btn {
      appearance: none;
      background: var(--paper);
      border: 1px solid var(--muted);
      border-radius: var(--radius);
      padding: 8px 18px;
      font-family: var(--font-sans);
      font-size: 15px;
      color: var(--text);
      cursor: pointer;
      transition: all 160ms ease;
    }
    .btn:hover {
      border-color: var(--text);
      background: #fafbfa;
    }
    .btn.active {
      background: var(--selected);
      border-color: var(--selected);
      color: #fff;
      font-weight: 600;
    }
    .btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    /* 主证据区：对立双栏架构 */
    .arena {
      display: flex;
      flex: 1;
      gap: 32px;
      min-height: 0;
    }

    /* 左栏：项羽临终自白 */
    .side-narrative {
      flex: 0.95;
      background: var(--paper);
      border-radius: var(--radius);
      border: 1px solid rgba(82, 99, 93, 0.25);
      box-shadow: 0 4px 16px rgba(23, 35, 31, 0.04);
      padding: 28px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 右栏：太史公论赞裁断 */
    .side-judgment {
      flex: 1.05;
      background: var(--paper);
      border-radius: var(--radius);
      border: 2px solid rgba(156, 53, 40, 0.35);
      box-shadow: 0 4px 16px rgba(156, 53, 40, 0.05);
      padding: 28px 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }

    .col-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border-radius: 4px;
      width: fit-content;
    }
    .tag-narrative {
      background: #E8ECE9;
      color: var(--muted);
    }
    .tag-judgment {
      background: rgba(156, 53, 40, 0.1);
      color: var(--judgment);
    }

    .quote-box {
      margin: 24px 0 0;
      border-left: 3px solid var(--muted);
      padding-left: 20px;
    }
    .quote-text {
      font-family: var(--font-display);
      font-size: 34px;
      line-height: 1.4;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .quote-context {
      margin-top: 14px;
      font-size: 16px;
      color: var(--muted);
      line-height: 1.5;
    }

    .claim-point {
      border-top: 1px solid #E3E7E4;
      padding-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .claim-core {
      font-size: 16px;
      color: var(--muted);
    }
    .claim-keyword {
      font-size: 22px;
      font-weight: 700;
      font-family: var(--font-display);
      color: var(--text);
    }

    /* 右侧：拆解清单 */
    .rebuttal-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
      justify-content: center;
    }
    .rebuttal-item {
      display: flex;
      gap: 16px;
      padding: 16px 20px;
      border-radius: var(--radius);
      background: #F8FAF8;
      border: 1px solid #E2E7E3;
      transition: all 180ms ease;
    }
    .rebuttal-item.highlight {
      border-color: var(--judgment);
      background: #FDF4F2;
    }
    .step-idx {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--judgment);
      min-width: 28px;
    }
    .step-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .step-lead {
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 600;
      color: var(--text);
    }
    .rebuttal-item.highlight .step-lead {
      color: var(--judgment);
    }
    .step-desc {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.45;
    }

    /* 底部判语总结条 */
    .judgment-footer {
      border-top: 1px dashed rgba(156, 53, 40, 0.4);
      padding-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .verdict-line {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--judgment);
      letter-spacing: 0.03em;
    }
    .verdict-note {
      font-size: 15px;
      color: var(--muted);
    }
  </style>
</head>
<body data-page="11" data-total="15">
  <main id="stage">
    <div class="header-row">
      <div class="header-main">
        <h1 class="page-title">《项羽本纪》篇末论赞：因果反驳</h1>
        <p class="page-sub">史官在篇末撕开悲剧抒情，用五年行事推翻“天亡我”</p>
      </div>
      <div class="btns" role="tablist">
        <button class="btn active" id="btn-all" type="button">全景对审</button>
        <button class="btn" id="btn-1" type="button">1. 纵暴失政</button>
        <button class="btn" id="btn-2" type="button">2. 专任私智</button>
        <button class="btn" id="btn-3" type="button">3. 遁辞欺人</button>
      </div>
    </div>

    <div class="arena min0">
      <!-- 左栏：项羽的自我解释 -->
      <section class="side-narrative min0">
        <div>
          <span class="col-tag tag-narrative">垓下自述 · 终局归因</span>
          <div class="quote-box">
            <div class="quote-text">
              “天之亡我，<br>非战之罪也。”
            </div>
            <div class="quote-context">兵败垓下溃围至东城，临死自语</div>
          </div>
        </div>

        <div class="claim-point">
          <div class="claim-core">叙事层视角</div>
          <div class="claim-keyword">悲壮抒情掩盖政治过失</div>
        </div>
      </section>

      <!-- 右栏：太史公的裁断 -->
      <section class="side-judgment min0">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="col-tag tag-judgment">太史公曰 · 论赞裁断</span>
          <span class="verdict-note">以事实因果瓦解天命修辞</span>
        </div>

        <div class="rebuttal-list">
          <div class="rebuttal-item" id="card-1">
            <span class="step-idx">一</span>
            <div class="step-content">
              <div class="step-lead">自弃关中，怀思楚越</div>
              <div class="step-desc">放逐义帝而自立，怨叛纷起；失地利与人和。</div>
            </div>
          </div>

          <div class="rebuttal-item" id="card-2">
            <span class="step-idx">二</span>
            <div class="step-content">
              <div class="step-lead">奋其私智，不师古</div>
              <div class="step-desc">欲以武力经营天下，仅得三年，终被汉灭。</div>
            </div>
          </div>

          <div class="rebuttal-item" id="card-3">
            <span class="step-idx">三</span>
            <div class="step-content">
              <div class="step-lead">身死东城，尚不觉寤</div>
              <div class="step-desc">死至仍引天亡，不悟用兵与施政之实过。</div>
            </div>
          </div>
        </div>

        <div class="judgment-footer">
          <div class="verdict-line">“乃引‘天亡我’，岂不谬哉！”</div>
          <div class="verdict-note">史家之笔：严密因果破除悲情托辞</div>
        </div>
      </section>
    </div>
  </main>

  <script src="assets/base.js"></script>
  <script>
    (function(){
      Deck.init({ index: 11, total: 15 });

      var buttons = [
        document.getElementById('btn-all'),
        document.getElementById('btn-1'),
        document.getElementById('btn-2'),
        document.getElementById('btn-3')
      ];
      var cards = [
        document.getElementById('card-1'),
        document.getElementById('card-2'),
        document.getElementById('card-3')
      ];

      function setFocus(idx) {
        buttons.forEach(function(btn, i){
          btn.classList.toggle('active', i === idx);
        });

        cards.forEach(function(card, i){
          if (idx === 0) {
            card.classList.remove('highlight');
            card.style.opacity = '1';
          } else {
            var isCurrent = (i === idx - 1);
            card.classList.toggle('highlight', isCurrent);
            card.style.opacity = isCurrent ? '1' : '0.45';
          }
        });
      }

      buttons.forEach(function(btn, i){
        btn.addEventListener('click', function(){
          setFocus(i);
        });
      });

      window.__NOTALE_READY__ = true;
    })();
  </script>
</body>
</html>
