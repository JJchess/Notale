<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>论赞介入前后的解释模型</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: 48px 56px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      color: var(--text);
      background: var(--bg);
      user-select: none;
    }

    /* 顶部标题区 */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .header-row h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-family: var(--font-display);
      font-weight: normal;
      letter-spacing: 0.5px;
    }
    .header-row .sub-desc {
      font-size: var(--fs-sec);
      color: var(--muted);
      font-family: var(--font-sans);
    }

    /* 主交互区布局：左侧史事证据链与调控，右侧论赞裁断与模型偏离计量 */
    .main-grid {
      display: grid;
      grid-template-columns: 880px 1fr;
      gap: 32px;
      flex: 1;
      min-height: 0;
    }

    /* 左侧：史事实证链面板 */
    .evidence-panel {
      background: var(--paper);
      border: 1px solid var(--muted);
      border-radius: var(--radius);
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--muted);
      padding-bottom: 12px;
    }
    .panel-title {
      font-size: var(--fs-h2);
      font-family: var(--font-display);
      font-weight: 600;
      color: var(--text);
    }
    .case-selector {
      display: flex;
      gap: 8px;
    }
    .case-btn {
      background: transparent;
      border: 1px solid var(--muted);
      border-radius: var(--radius);
      padding: 6px 14px;
      font-size: var(--fs-label);
      font-family: var(--font-sans);
      color: var(--muted);
      cursor: pointer;
      transition: all var(--ease);
    }
    .case-btn.active {
      background: var(--selected);
      border-color: var(--selected);
      color: #fff;
    }

    /* 证据项列表（编联线结构） */
    .fact-chain {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      justify-content: space-around;
    }
    .fact-item {
      display: grid;
      grid-template-columns: 140px 1fr 140px;
      align-items: center;
      gap: 16px;
      padding: 10px 14px;
      border: 1px solid #dfe5e1;
      border-radius: var(--radius);
      background: #fbfcfb;
    }
    .fact-item.suppressed {
      opacity: 0.45;
      background: #f4f6f4;
    }
    .fact-source {
      font-size: var(--fs-label);
      color: var(--crossref);
      font-family: var(--font-display);
      font-weight: 600;
    }
    .fact-text {
      font-size: var(--fs-sec);
      line-height: 1.4;
      color: var(--text);
    }
    .fact-attr {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    .fact-weight-label {
      font-size: var(--fs-tick);
      font-family: var(--font-num);
      color: var(--muted);
      width: 40px;
      text-align: right;
    }
    .toggle-btn {
      border: 1px solid var(--muted);
      background: #fff;
      border-radius: var(--radius);
      padding: 4px 8px;
      font-size: var(--fs-tick);
      cursor: pointer;
      color: var(--text);
      transition: background var(--ease);
    }
    .toggle-btn.off {
      background: var(--muted);
      color: #fff;
    }

    /* 底部作者介入度滑块 */
    .slider-zone {
      display: flex;
      align-items: center;
      gap: 20px;
      padding-top: 14px;
      border-top: 1px solid #dfe5e1;
    }
    .slider-label {
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--judgment);
      white-space: nowrap;
    }
    .slider-zone input[type="range"] {
      flex: 1;
      accent-color: var(--judgment);
      cursor: pointer;
    }
    .slider-val {
      font-family: var(--font-num);
      font-size: var(--fs-lead);
      font-weight: bold;
      color: var(--judgment);
      width: 45px;
      text-align: right;
    }

    /* 右侧：因果模型与太史公曰裁断对比 */
    .eval-panel {
      background: var(--paper);
      border: 1px solid var(--muted);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .eval-chart-box {
      position: relative;
      height: 200px;
      border: 1px solid #e2e8e4;
      border-radius: var(--radius);
      background: #fafbfa;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .chart-title {
      font-size: var(--fs-label);
      font-family: var(--font-display);
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    .bars-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: auto 0;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 80px 1fr 50px;
      align-items: center;
      gap: 12px;
    }
    .bar-name {
      font-size: var(--fs-tick);
      color: var(--muted);
    }
    .bar-track {
      background: #e8ede9;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width var(--ease), background var(--ease);
    }
    .bar-fill.fact-bar { background: var(--crossref); }
    .bar-fill.judgment-bar { background: var(--judgment); }
    .bar-num {
      font-family: var(--font-num);
      font-size: var(--fs-tick);
      color: var(--text);
      text-align: right;
    }

    /* 太史公曰论赞呈现区 */
    .judgment-quote-box {
      border: 1px solid #ebdedb;
      padding: 14px 18px;
      background: #fdfaf9;
      border-radius: var(--radius);
    }
    .quote-tag {
      font-size: var(--fs-sec);
      font-family: var(--font-display);
      font-weight: 600;
      color: var(--judgment);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .quote-tag::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--judgment);
    }
    .quote-content {
      font-size: var(--fs-sec);
      line-height: 1.5;
      color: var(--text);
      font-family: var(--font-display);
    }

    /* 模型检验反馈卡片 */
    .conclusion-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid #e0e5e2;
      background: #f7f9f8;
      gap: 8px;
    }
    .conclusion-tag {
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--text);
    }
    .conclusion-text {
      font-size: var(--fs-sec);
      line-height: 1.45;
      color: var(--muted);
    }
  </style>
</head>
<body data-page="13" data-total="15">
  <div id="stage">
    <div class="header-row">
      <h1>叙事因果与作者裁断：太史公曰约束模拟</h1>
      <span class="sub-desc">检视实证因果权重与论赞干预度如何塑造最终评价</span>
    </div>

    <main class="main-grid">
      <!-- 左侧：史事要素选择与权重调节 -->
      <section class="evidence-panel min0">
        <div class="panel-head">
          <span class="panel-title">篇章实证链：因果要素干预</span>
          <div class="case-selector" role="tablist">
            <button class="case-btn active" id="btn-xiangyu" data-case="xiangyu">《项羽本纪》</button>
            <button class="case-btn" id="btn-boyi" data-case="boyi">《伯夷列传》</button>
            <button class="case-btn" id="btn-reset">重置状态</button>
          </div>
        </div>

        <div class="fact-chain" id="factChain">
          <!-- JS 渲染史事证据项 -->
        </div>

        <div class="slider-zone">
          <span class="slider-label">论赞介入烈度（太史公曰）</span>
          <input type="range" id="judgmentSlider" min="0" max="100" value="50" step="5">
          <span class="slider-val" id="sliderVal">50%</span>
        </div>
      </section>

      <!-- 右侧：裁断模型偏离与结论呈现 -->
      <section class="eval-panel min0">
        <div class="eval-chart-box">
          <div class="chart-title">
            <span>解释力平衡计量</span>
            <span id="deviationLabel">偏离度：平衡</span>
          </div>
          <div class="bars-wrap">
            <div class="bar-row">
              <span class="bar-name">史事因果</span>
              <div class="bar-track">
                <div class="bar-fill fact-bar" id="factBar" style="width: 50%;"></div>
              </div>
              <span class="bar-num" id="factScore">50</span>
            </div>
            <div class="bar-row">
              <span class="bar-name">主观裁断</span>
              <div class="bar-track">
                <div class="bar-fill judgment-bar" id="judgmentBar" style="width: 50%;"></div>
              </div>
              <span class="bar-num" id="judgmentScore">50</span>
            </div>
          </div>
        </div>

        <div class="judgment-quote-box">
          <div class="quote-tag" id="quoteTitle">太史公曰断语</div>
          <div class="quote-content" id="quoteBody">
            羽非有尺寸，乘势起陇亩之中，三年遂将五诸侯灭秦……乃引“天亡我，非用兵之罪也”，岂不谬哉！
          </div>
        </div>

        <div class="conclusion-box">
          <div class="conclusion-tag" id="conclTitle">交互诊断：实证与裁断张力</div>
          <div class="conclusion-text" id="conclDesc">
            叙事实证（人事过失）与作者断语形成相互锚定：论赞并未凌空说教，而是直击项羽推诿天命的因果逻辑。
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (() => {
      Deck.init({ index: 13, total: 15 });

      // 案例数据模型
      const CASES = {
        xiangyu: {
          name: "《项羽本纪》",
          quote: "自矜功伐，奋其私智而不师古，谓霸王之业，欲以力征经营天下，五年卒亡其国……乃引“天亡我，非用兵之罪也”，岂不谬哉！",
          facts: [
            { id: "f1", source: "背关怀楚", text: "放逐义帝自立，分封诸侯不平，引发齐赵四方叛乱", baseWeight: 35, enabled: true },
            { id: "f2", source: "坑卒残暴", text: "新安坑杀秦降卒二十万，失尽秦地人心与民力根基", baseWeight: 30, enabled: true },
            { id: "f3", source: "垓下困境", text: "兵疲食尽，自谓“天亡我，非用兵之罪”，拒绝渡乌江", baseWeight: 35, enabled: true }
          ],
          idealJudgment: 70
        },
        boyi: {
          name: "《伯夷列传》",
          quote: "余登箕山，其上盖有许由冢云……或曰：“天道无亲，常与善人。”若伯夷、叔齐，可谓善人者伯非邪？积仁絜行如此而饿死！",
          facts: [
            { id: "b1", source: "扣马谏伐", text: "武王伐纣，伯夷叔齐叩马而谏，谓以臣弑君为不仁", baseWeight: 30, enabled: true },
            { id: "b2", source: "耻食周粟", text: "天下宗周，二人隐于首阳山，采薇而食，义不苟生", baseWeight: 35, enabled: true },
            { id: "b3", source: "抱节饿死", text: "作采薇之歌，慷慨就义，世人莫能掩其高洁微声", baseWeight: 35, enabled: true }
          ],
          idealJudgment: 85
        }
      };

      let currentCaseKey = "xiangyu";
      let judgmentLevel = 50;

      const factChainEl = document.getElementById("factChain");
      const judgmentSlider = document.getElementById("judgmentSlider");
      const sliderVal = document.getElementById("sliderVal");
      const factBar = document.getElementById("factBar");
      const judgmentBar = document.getElementById("judgmentBar");
      const factScoreEl = document.getElementById("factScore");
      const judgmentScoreEl = document.getElementById("judgmentScore");
      const deviationLabel = document.getElementById("deviationLabel");
      const quoteTitle = document.getElementById("quoteTitle");
      const quoteBody = document.getElementById("quoteBody");
      const conclTitle = document.getElementById("conclTitle");
      const conclDesc = document.getElementById("conclDesc");
      const btnReset = document.getElementById("btn-reset");

      function renderFacts() {
        const c = CASES[currentCaseKey];
        factChainEl.innerHTML = "";
        c.facts.forEach(f => {
          const item = document.createElement("div");
          item.className = "fact-item" + (f.enabled ? "" : " suppressed");
          item.id = "fact-" + f.id;
          item.innerHTML = `
            <span class="fact-source">${f.source}</span>
            <span class="fact-text">${f.text}</span>
            <div class="fact-attr">
              <span class="fact-weight-label">${f.enabled ? f.baseWeight + '%' : '已排除'}</span>
              <button class="toggle-btn ${f.enabled ? '' : 'off'}" data-fid="${f.id}">${f.enabled ? '纳入因果' : '排除实证'}</button>
            </div>
          `;
          factChainEl.appendChild(item);
        });
      }

      function updateModel() {
        const c = CASES[currentCaseKey];
        // 计算实证总分
        let activeWeightSum = 0;
        let totalBase = 0;
        c.facts.forEach(f => {
          totalBase += f.baseWeight;
          if (f.enabled) activeWeightSum += f.baseWeight;
        });
        const factScore = Math.round((activeWeightSum / totalBase) * 100);
        const jScore = judgmentLevel;

        factBar.style.width = factScore + "%";
        judgmentBar.style.width = jScore + "%";
        factScoreEl.textContent = factScore;
        judgmentScoreEl.textContent = jScore;

        sliderVal.textContent = jScore + "%";
        quoteTitle.textContent = `太史公曰：${c.name}篇末裁断`;
        quoteBody.textContent = c.quote;

        // 动态分析张力状态
        const diff = jScore - factScore;
        if (factScore < 40) {
          deviationLabel.textContent = "失衡：证据链残缺";
          deviationLabel.style.color = "var(--judgment)";
          conclTitle.textContent = "叙事危机：作者裁断沦为悬空武断";
          conclDesc.textContent = "若剔除篇中关键史事，太史公篇末的激烈断语便丧失了因果根基，论赞将沦为无凭据的主观宣泄。";
        } else if (jScore < 25) {
          deviationLabel.textContent = "平实：论赞弱化";
          deviationLabel.style.color = "var(--muted)";
          conclTitle.textContent = "编年体倾向：意义隐而不显";
          conclDesc.textContent = "纯粹依赖事实累加而不显露作者识度，历史因果退化为机械的时间相继，无法击中历史人物的认知盲区。";
        } else if (Math.abs(diff) <= 25) {
          deviationLabel.textContent = "协调：互为张力与制约";
          deviationLabel.style.color = "var(--crossref)";
          conclTitle.textContent = "经典范式：史事与论赞的双向锚定";
          conclDesc.textContent = currentCaseKey === "xiangyu" 
            ? "实证篇章铺陈项羽百战之勇与处置之失，篇末论赞借'岂不谬哉'直接刺穿其天亡我托词，叙事与裁断完成合龙。"
            : "伯夷积仁饿死的史事与天道报善的传统信念剧烈撞击，篇末论赞顺势推向对天道本质的普遍诘问。";
        } else {
          deviationLabel.textContent = "偏激：论赞显著主导";
          deviationLabel.style.color = "var(--selected)";
          conclTitle.textContent = "议论主导：叙事服务于哲思论辩";
          conclDesc.textContent = "论赞密度大幅压过实证推导，文本重心从'记录一人兴亡'跃迁为'借助个案探索历史与天命大法则'。";
        }
      }

      // 事件绑定
      factChainEl.addEventListener("click", e => {
        const btn = e.target.closest(".toggle-btn");
        if (!btn) return;
        const fid = btn.dataset.fid;
        const c = CASES[currentCaseKey];
        const target = c.facts.find(f => f.id === fid);
        if (target) {
          target.enabled = !target.enabled;
          renderFacts();
          updateModel();
        }
      });

      judgmentSlider.addEventListener("input", e => {
        judgmentLevel = parseInt(e.target.value, 10);
        updateModel();
      });

      btnReset.addEventListener("click", () => {
        judgmentLevel = 50;
        judgmentSlider.value = 50;
        CASES[currentCaseKey].facts.forEach(f => f.enabled = true);
        renderFacts();
        updateModel();
      });

      document.querySelectorAll(".case-btn[data-case]").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".case-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentCaseKey = btn.dataset.case;
          // 切换案例时恢复基础值
          judgmentLevel = 50;
          judgmentSlider.value = 50;
          CASES[currentCaseKey].facts.forEach(f => f.enabled = true);
          renderFacts();
          updateModel();
        });
      });

      // 初始化
      renderFacts();
      updateModel();
    })();
  </script>
</body>
</html>
