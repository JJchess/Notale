<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #E8EFF1;
      --text: #17282E;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
    }

    #stage {
      padding: var(--pad-y) var(--pad-x);
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-sizing: border-box;
      user-select: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--muted);
      padding-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: var(--fs-h1);
      color: var(--text);
      font-weight: 700;
    }

    .subtitle {
      font-size: var(--fs-sec);
      color: var(--muted);
    }

    .main-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 390px;
      gap: 28px;
      min-height: 0;
    }

    .chart-panel {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--surface-strong);
      border-radius: 4px;
      padding: 16px 20px 12px 20px;
      display: flex;
      flex-direction: column;
    }

    .chart-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .chart-title {
      font-size: var(--fs-h2);
      font-weight: 600;
      color: var(--text);
    }

    .chart-legend {
      display: flex;
      gap: 16px;
      font-size: var(--fs-label);
      color: var(--muted);
      align-items: center;
    }

    .chart-legend .item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-sw {
      width: 14px;
      height: 3px;
      border-radius: 2px;
    }
    .sw-baseline { background: var(--observed); }
    .sw-calm { background: var(--heat); }
    .sw-windy { background: var(--cooling); border-top: 1px dashed var(--cooling); }

    .plot-box {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    #chart {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--surface-strong);
      border-radius: 4px;
      padding: 22px 24px;
    }

    .metric-hero {
      border-bottom: 1px solid var(--surface-strong);
      padding-bottom: 16px;
    }

    .metric-label {
      font-size: var(--fs-label);
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }

    .metric-val {
      font-family: var(--font-num);
      font-size: 48px;
      line-height: 1;
      color: var(--heat);
      font-weight: 700;
    }

    .metric-val .unit {
      font-size: 20px;
      margin-left: 2px;
      font-family: var(--font-sans);
      font-weight: 500;
      color: var(--text);
    }

    .state-name {
      display: inline-block;
      margin-top: 8px;
      font-size: var(--fs-sec);
      color: var(--text);
      font-weight: 600;
    }

    .mod-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ctl-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ctl-label-row {
      display: flex;
      justify-content: space-between;
      font-size: var(--fs-label);
      color: var(--text);
    }

    .ctl-val {
      font-family: var(--font-num);
      color: var(--cooling);
      font-weight: 600;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-weather {
      padding: 10px 8px;
      font-size: var(--fs-label);
      background: var(--surface-strong);
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text);
      font-weight: 500;
      text-align: center;
      transition: all var(--dur) var(--ease);
    }

    .btn-weather.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .btn-weather:focus-visible {
      outline: 2px solid var(--focus);
    }

    .formula-card {
      margin-top: auto;
      background: var(--surface-strong);
      padding: 12px 14px;
      border-radius: 4px;
      font-size: var(--fs-sec);
      color: var(--text);
      line-height: 1.5;
    }

    .formula-card strong {
      color: var(--heat);
      font-family: var(--font-num);
    }

    .reading-summary {
      font-size: var(--fs-label);
      color: var(--muted);
      line-height: 1.45;
    }
  </style>
</head>
<body data-page="07" data-total="19">
  <div id="stage">
    <header>
      <h1>热岛强度非固定常数：气象条件与人为热动态调制</h1>
      <span class="subtitle">Oke 敏感性模型：ΔT ∝ (1 − 0.8n) / √u</span>
    </header>

    <div class="main-grid">
      <div class="chart-panel min0">
        <div class="chart-head">
          <span class="chart-title">24 小时城乡温差演化（ΔT_u-r）</span>
          <div class="chart-legend">
            <div class="item"><span class="legend-sw sw-baseline"></span><span>典型晴朗弱风日（基线）</span></div>
            <div class="item"><span class="legend-sw sw-calm" id="legMod"></span><span id="legLabel">当前调制情景</span></div>
          </div>
        </div>
        <div class="plot-box min0">
          <div id="chart" role="img" aria-label="24小时热岛强度动态变化折线图"></div>
        </div>
      </div>

      <div class="side-panel min0">
        <div class="metric-hero">
          <span class="metric-label">夜间峰值强度（23:00）</span>
          <div class="metric-val" id="peakVal">+4.5<span class="unit">°C</span></div>
          <span class="state-name" id="stateDesc">晴朗微风 · 强蓄释热</span>
        </div>

        <div class="mod-section">
          <div class="ctl-group">
            <span class="metric-label">外部气象背景预设</span>
            <div class="btn-row">
              <button type="button" class="btn-weather active" id="btnCalm" aria-pressed="true">晴朗微风 (1.2 m/s)</button>
              <button type="button" class="btn-weather" id="btnWind" aria-pressed="false">阴天大风 (5.5 m/s)</button>
            </div>
          </div>

          <div class="ctl-group">
            <div class="ctl-label-row">
              <span>人为排热通量 (Q_F)</span>
              <span class="ctl-val" id="qfVal">45 W/m²</span>
            </div>
            <input type="range" id="qfRange" min="10" max="90" step="5" value="45" style="width: 100%; accent-color: var(--heat);" aria-label="人为排热通量">
          </div>
        </div>

        <div class="formula-card">
          <strong>ΔT_max ∝ (1 − 0.8n) / √u</strong><br>
          风速驱动对流稀释，云量削弱辐射冷却差；人为排热抬高基底。
        </div>

        <div class="reading-summary" id="conclText">
          弱风抑制对流散热，长波辐射滞留累积，夜间温差达峰值。
        </div>
      </div>
    </div>
  </div>

  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
    (function () {
      "use strict";

      Deck.init({ index: 7, total: 19, keys: false });

      var chartEl = document.getElementById("chart");
      var chart = echarts.init(chartEl, null, { renderer: "svg" });

      var hours = [
        "00:00", "02:00", "04:00", "06:00", "08:00", "10:00", 
        "12:00", "14:00", "16:00", "18:00", "20:00", "22:00", "24:00"
      ];

      // 基线：晴朗弱风日标准 UHI 曲线
      var baselineData = [4.2, 4.0, 3.8, 2.5, 1.2, 0.8, 0.5, 0.7, 1.4, 2.8, 3.9, 4.5, 4.3];

      // 状态变量
      var weather = "calm"; // "calm" | "wind"
      var qf = 45; // 10 - 90 W/m²

      function calcCurve(wMode, qVal) {
        // Oke 敏感性经验近似：
        // 弱风 u ~ 1.2 m/s, n ~ 0.1 -> factor ~ 1.0
        // 大风阴天 u ~ 5.5 m/s, n ~ 0.8 -> factor ~ 0.28
        var windFactor = (wMode === "calm") ? 1.0 : 0.32;
        var qfOffset = (qVal - 45) * 0.025; // 每增减 20 W/m² 约 0.5°C 偏移

        return baselineData.map(function (base) {
          var val = (base * windFactor) + (qfOffset * (base > 2.0 ? 1.1 : 0.8));
          return Math.max(0.1, parseFloat(val.toFixed(1)));
        });
      }

      function updateChart() {
        var currentData = calcCurve(weather, qf);
        var peakVal = Math.max.apply(null, currentData);
        var peakEl = document.getElementById("peakVal");
        var stateDesc = document.getElementById("stateDesc");
        var conclText = document.getElementById("conclText");
        var legMod = document.getElementById("legMod");
        var legLabel = document.getElementById("legLabel");

        peakEl.innerHTML = "+" + peakVal.toFixed(1) + '<span class="unit">°C</span>';

        if (weather === "wind") {
          stateDesc.textContent = "阴天大风 · 强迫对流稀释";
          legMod.className = "legend-sw sw-windy";
          legLabel.textContent = "阴天大风调制";
          conclText.textContent = "大风加强对流交换，云层削弱辐射冷却差，夜间温差峰值被压平。";
        } else {
          stateDesc.textContent = "晴朗微风 · 强蓄释热";
          legMod.className = "legend-sw sw-calm";
          legLabel.textContent = "晴朗微风调制";
          conclText.textContent = "弱风抑制对流散热，长波辐射滞留累积，夜间温差达峰值。";
        }

        var option = {
          animation: false,
          grid: {
            left: 46,
            right: 28,
            top: 36,
            bottom: 38
          },
          xAxis: {
            type: "category",
            data: hours,
            axisLine: { lineStyle: { color: "#50646B" } },
            axisLabel: { color: "#50646B", fontSize: 13, fontFamily: "Bahnschrift" },
            splitLine: { show: false }
          },
          yAxis: {
            type: "value",
            min: 0,
            max: 6,
            interval: 1,
            name: "城乡温差 ΔT (°C)",
            nameTextStyle: { color: "#50646B", fontSize: 13, padding: [0, 0, 8, 20] },
            axisLabel: { color: "#50646B", fontSize: 13, fontFamily: "Bahnschrift" },
            splitLine: { lineStyle: { color: "#DCE7EA", type: "dashed" } }
          },
          series: [
            {
              name: "典型基线",
              type: "line",
              smooth: true,
              data: baselineData,
              lineStyle: { color: "#255F73", width: 2, type: "dotted" },
              symbol: "none"
            },
            {
              name: "调制曲线",
              type: "line",
              smooth: true,
              data: currentData,
              lineStyle: {
                color: weather === "calm" ? "#C63F20" : "#176B82",
                width: 3.5,
                type: weather === "calm" ? "solid" : "dashed"
              },
              areaStyle: {
                color: weather === "calm" ? "rgba(198, 63, 32, 0.12)" : "rgba(23, 107, 130, 0.1)"
              },
              symbol: "circle",
              symbolSize: 6,
              itemStyle: {
                color: weather === "calm" ? "#C63F20" : "#176B82"
              },
              markPoint: {
                symbol: "circle",
                symbolSize: 10,
                data: [
                  {
                    coord: ["22:00", currentData[11]],
                    label: {
                      show: true,
                      position: "top",
                      formatter: "+" + currentData[11].toFixed(1) + "°C",
                      color: weather === "calm" ? "#C63F20" : "#176B82",
                      fontSize: 15,
                      fontWeight: "bold",
                      fontFamily: "Bahnschrift"
                    }
                  }
                ]
              }
            }
          ]
        };

        chart.setOption(option, true);
      }

      // 绑定控件
      var btnCalm = document.getElementById("btnCalm");
      var btnWind = document.getElementById("btnWind");
      var qfRange = document.getElementById("qfRange");
      var qfVal = document.getElementById("qfVal");

      btnCalm.addEventListener("click", function () {
        weather = "calm";
        btnCalm.classList.add("active");
        btnCalm.setAttribute("aria-pressed", "true");
        btnWind.classList.remove("active");
        btnWind.setAttribute("aria-pressed", "false");
        updateChart();
      });

      btnWind.addEventListener("click", function () {
        weather = "wind";
        btnWind.classList.add("active");
        btnWind.setAttribute("aria-pressed", "true");
        btnCalm.classList.remove("active");
        btnCalm.setAttribute("aria-pressed", "false");
        updateChart();
      });

      qfRange.addEventListener("input", function (e) {
        qf = parseInt(e.target.value, 10);
        qfVal.textContent = qf + " W/m²";
        updateChart();
      });

      window.addEventListener("resize", function () {
        chart.resize();
      });

      updateChart();
    })();
  </script>
</body>
</html>
