<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: var(--pad-y) var(--pad-x);
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
    }

    /* 顶部标题区 */
    .header-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }
    .header-title {
      font-size: var(--fs-h1);
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .header-sub {
      font-size: var(--fs-lead);
      color: var(--muted);
      margin: 0;
    }

    /* 主网格布局：左右两栏对齐（左：时间连续性，右：空间细微性） */
    .main-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      min-height: 0;
    }

    .card {
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--surface-strong);
      padding: 16px 20px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--surface-strong);
      padding-bottom: 8px;
    }
    .card-title {
      font-size: var(--fs-h2);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-title .tag {
      font-size: var(--fs-tick);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    .card-stat {
      font-size: var(--fs-sec);
      color: var(--muted);
    }
    .card-stat strong {
      font-family: var(--font-num);
      color: var(--text);
      font-size: var(--fs-lead);
    }

    .chart-container {
      flex: 1;
      position: relative;
      min-height: 0;
      width: 100%;
    }

    /* 底部互补与协同结论栏 */
    .footer-dock {
      background: var(--surface-strong);
      border-radius: 6px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      font-size: var(--fs-sec);
      color: var(--text);
    }
    .dock-col {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dock-pill {
      background: var(--surface);
      border: 1px solid var(--muted);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: var(--fs-label);
      font-weight: 700;
    }
    .dock-text {
      color: var(--text);
    }
    .dock-text strong {
      color: var(--heat);
    }
    .time-ctl {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-label);
      color: var(--muted);
    }
    .time-ctl input[type=range] {
      width: 130px;
      cursor: pointer;
    }
    .time-val {
      font-family: var(--font-num);
      font-weight: 700;
      color: var(--focus);
      width: 48px;
    }
  </style>
  <script src="assets/lib/echarts.min.js"></script>
</head>
<body data-page="12" data-total="19">
  <div id="stage">
    <div class="header-block">
      <h1 class="header-title">固定站与移动走航互补</h1>
      <p class="header-sub">固定站追踪连续昼夜节律，移动走航刻画街区微气候空间梯度</p>
    </div>

    <div class="main-grid">
      <!-- 左栏：固定站 24h 时间连续曲线 -->
      <section class="card min0">
        <div class="card-head">
          <div class="card-title">
            <span>固定气象站</span>
            <span class="tag" data-kind="observed" style="background:#255f731a; color:var(--observed);">高时间分辨率 (1分钟)</span>
          </div>
          <div class="card-stat">
            最大夜间热岛差：<strong id="maxUhiStat">3.4°C</strong>
          </div>
        </div>
        <div id="timeChart" class="chart-container"></div>
      </section>

      <!-- 右栏：移动走航 沿线空间剖面 -->
      <section class="card min0">
        <div class="card-head">
          <div class="card-title">
            <span>移动走航横剖面</span>
            <span class="tag" data-kind="heat" style="background:#c63f201a; color:var(--heat);">高空间分辨率 (10米)</span>
          </div>
          <div class="card-stat">
            沿线温差峰值：<strong id="transectSpan">4.8°C</strong>
          </div>
        </div>
        <div id="spaceChart" class="chart-container"></div>
      </section>
    </div>

    <!-- 底部协同读数与控制 -->
    <footer class="footer-dock">
      <div class="dock-col">
        <span class="dock-pill">协同机制</span>
        <span class="dock-text">走航需固定站进行<strong>时间趋势校正</strong>；固定站借走航建立<strong>街区高分空间插值</strong>。</span>
      </div>
      <div class="dock-col">
        <div class="time-ctl">
          <label for="timeSlider" style="font-size:var(--fs-label); color:var(--text);">走航时刻：</label>
          <input type="range" id="timeSlider" min="0" max="23" value="22" step="1">
          <span class="time-val" id="timeDisplay">22:00</span>
        </div>
      </div>
    </footer>
  </div>

  <script src="assets/base.js"></script>
  <script>
  (function(){
    "use strict";

    // 1. 数据集定义 (真实合理的气象观测与城市剖面数据)
    // 24小时固定站点气温记录：郊区农村站 vs 城市中心站 (单位: °C)
    var hours = ["00:00","02:00","04:00","06:00","08:00","10:00","12:00","14:00","16:00","18:00","20:00","22:00","24:00"];
    var ruralTemp = [20.2, 19.4, 18.8, 19.1, 23.5, 27.2, 30.1, 31.8, 31.0, 27.5, 24.2, 22.1, 20.4];
    var urbanTemp = [23.4, 22.7, 22.2, 21.9, 25.1, 28.5, 31.3, 33.1, 32.6, 29.8, 27.3, 25.5, 23.7];

    // 移动走航沿线断面数据：横跨郊野、水体、住宅、核心CBD、城市公园、密集街谷 (总长15 km)
    var transectDist = [0, 1.5, 3.5, 6.0, 8.5, 11.5, 14.0];
    var zoneNames = ["郊区农田", "河流廊道", "低密街区", "核心商业", "城市公园", "高密街区", "外环绿带"];
    // 基准走航断面在 22:00 时的气温分布
    var baseTransectTemp = [21.8, 21.0, 24.5, 26.6, 23.2, 25.8, 22.2];

    var timeChartDom = document.getElementById("timeChart");
    var spaceChartDom = document.getElementById("spaceChart");
    var timeSlider = document.getElementById("timeSlider");
    var timeDisplay = document.getElementById("timeDisplay");
    var transectSpanEl = document.getElementById("transectSpan");

    var timeChart = echarts.init(timeChartDom, null, { renderer: "svg" });
    var spaceChart = echarts.init(spaceChartDom, null, { renderer: "svg" });

    // 当前选定的走航时间点
    var selectedHour = 22;

    function getTimeChartOption(selH) {
      // 找到最近的刻度索引
      var hIdx = Math.round(selH / 2);
      var selLabel = hours[hIdx];

      return {
        animationDuration: 300,
        grid: { left: 45, right: 30, top: 36, bottom: 42 },
        tooltip: {
          trigger: "axis",
          formatter: function(params) {
            var res = params[0].name + "<br/>";
            params.forEach(function(item) {
              res += item.marker + " " + item.seriesName + ": <b>" + item.value.toFixed(1) + "°C</b><br/>";
            });
            var diff = (params[1].value - params[0].value).toFixed(1);
            res += "热岛强度 (ΔT): <b style='color:#C63F20'>+" + diff + "°C</b>";
            return res;
          }
        },
        legend: {
          data: ["郊区参照站", "城市中心站"],
          top: 0,
          right: 10,
          textStyle: { fontSize: 15, color: "#50646B" }
        },
        xAxis: {
          type: "category",
          data: hours,
          axisLine: { lineStyle: { color: "#DCE7EA" } },
          axisLabel: { color: "#50646B", fontSize: 13 },
          axisTick: { alignWithLabel: true }
        },
        yAxis: {
          type: "value",
          min: 16,
          max: 36,
          name: "气温 (°C)",
          nameTextStyle: { color: "#50646B", fontSize: 13, padding: [0, 0, 4, -10] },
          axisLabel: { color: "#50646B", fontSize: 13 },
          splitLine: { lineStyle: { color: "#E8EFF1" } }
        },
        series: [
          {
            name: "郊区参照站",
            type: "line",
            smooth: true,
            data: ruralTemp,
            symbol: "circle",
            symbolSize: 6,
            lineStyle: { width: 3, color: "#176B82" },
            itemStyle: { color: "#176B82" }
          },
          {
            name: "城市中心站",
            type: "line",
            smooth: true,
            data: urbanTemp,
            symbol: "circle",
            symbolSize: 6,
            lineStyle: { width: 3, color: "#C63F20" },
            itemStyle: { color: "#C63F20" },
            markLine: {
              symbol: "none",
              data: [
                {
                  xAxis: selLabel,
                  lineStyle: { color: "#A92F18", type: "dashed", width: 2 },
                  label: {
                    formatter: "走航时刻: " + selLabel,
                    position: "insideEndTop",
                    color: "#A92F18",
                    fontSize: 13,
                    fontWeight: 600
                  }
                }
              ]
            }
          }
        ]
      };
    }

    function getSpaceChartOption(selH) {
      // 随着走航采样时间变化，城市剖面的平均温度平移，但空间微气候冷岛/热谷特征保留
      var hIdx = Math.round(selH / 2);
      var currentUrban = urbanTemp[hIdx];
      var offset = currentUrban - 25.5; // 22:00 基准中心为25.5°C

      var currentTransect = baseTransectTemp.map(function(t) {
        return +(t + offset).toFixed(1);
      });

      var minT = Math.min.apply(null, currentTransect);
      var maxT = Math.max.apply(null, currentTransect);
      var span = (maxT - minT).toFixed(1);
      transectSpanEl.textContent = span + "°C";

      return {
        animationDuration: 300,
        grid: { left: 45, right: 30, top: 36, bottom: 42 },
        tooltip: {
          trigger: "axis",
          formatter: function(params) {
            var idx = params[0].dataIndex;
            return zoneNames[idx] + " (" + transectDist[idx] + " km)<br/>走航气温: <b>" + params[0].value.toFixed(1) + "°C</b>";
          }
        },
        xAxis: {
          type: "category",
          data: zoneNames.map(function(n, i){ return transectDist[i] + " km\n" + n; }),
          axisLine: { lineStyle: { color: "#DCE7EA" } },
          axisLabel: {
            color: "#50646B",
            fontSize: 13,
            interval: 0,
            lineHeight: 16
          },
          axisTick: { alignWithLabel: true }
        },
        yAxis: {
          type: "value",
          min: 16,
          max: 36,
          name: "气温 (°C)",
          nameTextStyle: { color: "#50646B", fontSize: 13, padding: [0, 0, 4, -10] },
          axisLabel: { color: "#50646B", fontSize: 13 },
          splitLine: { lineStyle: { color: "#E8EFF1" } }
        },
        series: [
          {
            name: "移动走航实测剖面",
            type: "line",
            smooth: 0.3,
            data: currentTransect,
            symbol: "circle",
            symbolSize: 8,
            lineStyle: { width: 3.5, color: "#C63F20" },
            itemStyle: { color: "#C63F20" },
            areaStyle: {
              color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                { offset: 0, color: "rgba(198, 63, 32, 0.28)" },
                { offset: 1, color: "rgba(198, 63, 32, 0.02)" }
              ])
            },
            markPoint: {
              symbolSize: 48,
              label: { fontSize: 13, fontWeight: "bold" },
              data: [
                { type: "max", name: "峰值", itemStyle: { color: "#C63F20" } },
                { type: "min", name: "谷值", itemStyle: { color: "#176B82" } }
              ]
            }
          }
        ]
      };
    }

    function updateView(hour) {
      selectedHour = hour;
      var formattedH = (hour < 10 ? "0" : "") + hour + ":00";
      timeDisplay.textContent = formattedH;

      timeChart.setOption(getTimeChartOption(selectedHour));
      spaceChart.setOption(getSpaceChartOption(selectedHour));
    }

    timeSlider.addEventListener("input", function(e) {
      updateView(parseInt(e.target.value, 10));
    });

    window.addEventListener("resize", function() {
      timeChart.resize();
      spaceChart.resize();
    });

    // 初始化加载
    updateView(22);
    Deck.init({ index: 12, total: 19, keys: false });
  })();
  </script>
</body>
</html>
