<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>采样设计与热岛估计偏差联动</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #E8EFF1;
      --surface: #F7FAFA;
      --surface-strong: #DCE7EA;
      --text: #17282E;
      --muted: #50646B;
      --focus: #A92F18;
      --heat: #C63F20;
      --cooling: #176B82;
      --vegetation: #39704A;
      --observed: #255F73;
      --uncertain: #735F2A;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --font-num: "Bahnschrift", system-ui, sans-serif;
    }

    #stage {
      padding: var(--pad-y) var(--pad-x);
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
      user-select: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--surface-strong);
      padding-bottom: 10px;
    }

    h1 {
      font-size: var(--fs-h1);
      color: var(--text);
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 860px 1fr;
      gap: 28px;
      flex: 1;
      min-height: 0;
    }

    /* 地图与场域区 */
    .field-card {
      background: var(--surface);
      border: 1px solid var(--surface-strong);
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .field-title {
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
    }

    .map-container {
      position: relative;
      width: 820px;
      height: 480px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--surface-strong);
      background: #cedde0;
    }

    #fieldCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .field-legend {
      display: flex;
      gap: 24px;
      font-size: var(--fs-label);
      color: var(--muted);
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    /* 右侧控制与计量看板 */
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-block {
      background: var(--surface);
      border: 1px solid var(--surface-strong);
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .block-title {
      font-size: var(--fs-sec);
      font-weight: 700;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .mode-btn {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--muted);
      background: transparent;
      color: var(--text);
      font-size: var(--fs-label);
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      font-weight: 500;
      transition: all var(--dur) var(--ease);
    }

    .mode-btn[aria-pressed="true"] {
      background: var(--observed);
      color: #fff;
      border-color: var(--observed);
      font-weight: 700;
    }

    .readout-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .readout-box {
      background: var(--surface-strong);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .readout-box.highlight {
      background: #F4DFD8;
      border: 1px solid var(--heat);
    }

    .readout-label {
      font-size: var(--fs-label);
      color: var(--muted);
    }

    .readout-val {
      font-family: var(--font-num);
      font-size: var(--fs-h1);
      font-weight: 700;
      color: var(--text);
    }

    .readout-val.heat {
      color: var(--heat);
    }

    .readout-val.observed {
      color: var(--observed);
    }

    .verdict-box {
      font-size: var(--fs-sec);
      line-height: 1.45;
      padding: 12px 14px;
      border-radius: 6px;
      background: #fff;
      border: 1px solid var(--surface-strong);
      color: var(--text);
    }

    .verdict-box.balanced {
      background: #EDF5F0;
      border-color: var(--vegetation);
    }

    .verdict-box.biased {
      background: #FAF0ED;
      border-color: var(--heat);
    }

    .helper-hint {
      font-size: var(--fs-label);
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body data-page="14" data-total="19">
  <div id="stage">
    <header>
      <h1>采样设计与热岛估计偏差联动</h1>
    </header>

    <main class="main-grid">
      <!-- 空间场域交互区 -->
      <section class="field-card min0">
        <div class="field-header">
          <span class="field-title">区域温度场与监测站点布设</span>
          <div class="field-legend">
            <div class="legend-item">
              <span class="legend-dot" style="background: var(--heat)"></span>
              <span>城区站点</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot" style="background: var(--vegetation)"></span>
              <span>乡村参照站</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot" style="background: #999; border: 1px dashed #444"></span>
              <span>可移动参照候选</span>
            </div>
          </div>
        </div>

        <div class="map-container min0">
          <canvas id="fieldCanvas" width="820" height="480"></canvas>
        </div>

        <div class="helper-hint">
          拖动或点击地图中的乡村参照点，或切换右侧采样预设，观察实测均温与热岛强度偏差联动。
        </div>
      </section>

      <!-- 侧边策略与定量比对 -->
      <aside class="side-panel min0">
        <div class="panel-block">
          <div class="block-title">
            <span>城区采样布设</span>
          </div>
          <div class="btn-group" role="group" aria-label="城区采样模式">
            <button type="button" class="mode-btn" data-urban="canyon" aria-pressed="false">街谷集中</button>
            <button type="button" class="mode-btn" data-urban="park" aria-pressed="false">公园偏置</button>
            <button type="button" class="mode-btn" data-urban="grid" aria-pressed="true">分层网格</button>
          </div>
        </div>

        <div class="panel-block">
          <div class="block-title">
            <span>乡村参照站选址</span>
          </div>
          <div class="btn-group" role="group" aria-label="参照站预设">
            <button type="button" class="mode-btn" data-ref="cropland" aria-pressed="true">开阔农田</button>
            <button type="button" class="mode-btn" data-ref="forest" aria-pressed="false">湿润林地</button>
            <button type="button" class="mode-btn" data-ref="airport" aria-pressed="false">机场跑道</button>
          </div>
        </div>

        <div class="panel-block">
          <div class="block-title">
            <span>气温读数对比</span>
          </div>
          <div class="readout-grid">
            <div class="readout-box">
              <span class="readout-label">城区样点均温 (T_urb)</span>
              <span class="readout-val heat" id="urbTemp">31.4°C</span>
            </div>
            <div class="readout-box">
              <span class="readout-label">参照站气温 (T_ref)</span>
              <span class="readout-val observed" id="refTemp">28.2°C</span>
            </div>
          </div>
        </div>

        <div class="panel-block">
          <div class="block-title">
            <span>热岛强度与估计偏差</span>
          </div>
          <div class="readout-grid">
            <div class="readout-box highlight">
              <span class="readout-label">估计热岛强度 (ΔT)</span>
              <span class="readout-val heat" id="uhiEst">+3.2°C</span>
            </div>
            <div class="readout-box">
              <span class="readout-label">全域基准偏差 (Bias)</span>
              <span class="readout-val" id="uhiBias">+0.2°C</span>
            </div>
          </div>
          <div class="verdict-box" id="verdictText">
            设计平衡：网格分层结合农田参照，误差在 0.3°C 以内。
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      // 真实连续物理场参数（高斯热核模型）
      // 区域大小 820 x 480，中心城核心 (360, 240)
      // 真实连续物理场参数（高斯热核模型）
      // 区域大小 820 x 480，中心城核心 (360, 240)
      const URBAN_CENTER = { x: 360, y: 240 };
      const BASE_RURAL_TEMP = 28.0;
      const TRUE_URBAN_MEAN = 30.8;
      const TRUE_UHI = TRUE_URBAN_MEAN - BASE_RURAL_TEMP; // 2.8°C

      // 乡村参照站候选点位
      const REF_PRESETS = {
        cropland: { x: 710, y: 360, name: "开阔农田", type: "cropland" },
        forest: { x: 720, y: 110, name: "湿润林地", type: "forest" },
        airport: { x: 570, y: 410, name: "城郊机场跑道", type: "airport" }
      };

      // 城区站点预设
      const URBAN_PRESETS = {
        canyon: [
          { x: 340, y: 220 }, { x: 370, y: 210 }, { x: 360, y: 250 },
          { x: 390, y: 260 }, { x: 320, y: 270 }, { x: 380, y: 230 }
        ],
        park: [
          { x: 260, y: 190 }, { x: 280, y: 220 }, { x: 340, y: 290 },
          { x: 430, y: 180 }, { x: 390, y: 310 }, { x: 300, y: 260 }
        ],
        grid: [
          { x: 260, y: 180 }, { x: 350, y: 160 }, { x: 440, y: 200 },
          { x: 250, y: 280 }, { x: 360, y: 250 }, { x: 450, y: 290 }
        ]
      };

      // 连续温度场估算函数（模拟真实微气候环境）
      function evaluateTemp(x, y) {
        // 1. 城区热岛核心高斯衰减
        const dx = x - URBAN_CENTER.x;
        const dy = y - URBAN_CENTER.y;
        const distSq = dx * dx + dy * dy;
        let t = BASE_RURAL_TEMP + 4.2 * Math.exp(-distSq / (2 * 115 * 115));

        // 2. 城区内部公园水体弱降温区 (270, 200)
        const parkDistSq = (x - 270) ** 2 + (y - 200) ** 2;
        t -= 1.4 * Math.exp(-parkDistSq / (2 * 45 * 45));

        // 3. 东北部湿润森林冷源 (720, 110)
        const forestDistSq = (x - 720) ** 2 + (y - 110) ** 2;
        t -= 1.8 * Math.exp(-forestDistSq / (2 * 80 * 80));

        // 4. 东南郊区机场跑道/水泥下垫面局地强升温区 (570, 410)
        const airportDistSq = (x - 570) ** 2 + (y - 410) ** 2;
        t += 2.0 * Math.exp(-airportDistSq / (2 * 50 * 50));

        return t;
      }

      // 状态
      let state = {
        urbanMode: "grid",
        refPreset: "cropland",
        refPos: { ...REF_PRESETS.cropland },
        isDraggingRef: false
      };

      const canvas = document.getElementById("fieldCanvas");
      const ctx = canvas.getContext("2d");

      // 预渲染静态底图热力分布
      const bgCanvas = document.createElement("canvas");
      bgCanvas.width = 820;
      bgCanvas.height = 480;
      const bgCtx = bgCanvas.getContext("2d");

      function precalcBackground() {
        const imgData = bgCtx.createImageData(820, 480);
        const data = imgData.data;
        for (let y = 0; y < 480; y += 2) {
          for (let x = 0; x < 820; x += 2) {
            const temp = evaluateTemp(x, y);
            // 归一化温度 26.0°C ~ 32.5°C
            const norm = Math.max(0, Math.min(1, (temp - 26.2) / 6.0));
            // 冷(180, 210, 215) -> 热(220, 110, 90)
            const r = Math.round(185 + norm * 45);
            const g = Math.round(210 - norm * 95);
            const b = Math.round(215 - norm * 130);

            for (let dy = 0; dy < 2; dy++) {
              for (let dx = 0; dx < 2; dx++) {
                const idx = ((y + dy) * 820 + (x + dx)) * 4;
                data[idx] = r;
                data[idx + 1] = g;
                data[idx + 2] = b;
                data[idx + 3] = 255;
              }
            }
          }
        }
        bgCtx.putImageData(imgData, 0, 0);

        // 绘制特征注记
        bgCtx.font = "12px Bahnschrift, sans-serif";
        bgCtx.fillStyle = "rgba(23, 40, 46, 0.6)";
        bgCtx.fillText("城市核心区", URBAN_CENTER.x - 28, URBAN_CENTER.y - 80);
        bgCtx.fillText("林地冷源", 700, 75);
        bgCtx.fillText("城郊跑道/硬化地", 530, 445);
        bgCtx.fillText("开阔农田", 690, 400);

        // 城市轮廓示意线
        bgCtx.strokeStyle = "rgba(198, 63, 32, 0.4)";
        bgCtx.lineWidth = 1.5;
        bgCtx.setLineDash([4, 4]);
        bgCtx.beginPath();
        bgCtx.ellipse(URBAN_CENTER.x, URBAN_CENTER.y, 160, 120, 0, 0, Math.PI * 2);
        bgCtx.stroke();
        bgCtx.setLineDash([]);
      }

      precalcBackground();

      function updateCalculations() {
        // 计算当前城区站气温均值
        const urbanSites = URBAN_PRESETS[state.urbanMode];
        let sumUrban = 0;
        urbanSites.forEach(pt => {
          sumUrban += evaluateTemp(pt.x, pt.y);
        });
        const meanUrban = sumUrban / urbanSites.length;

        // 计算参照站气温
        const refT = evaluateTemp(state.refPos.x, state.refPos.y);

        // 计算估计 UHI 及偏差
        const uhiEstimate = meanUrban - refT;
        const bias = uhiEstimate - TRUE_UHI;

        // 更新界面指标
        document.getElementById("urbTemp").textContent = `${meanUrban.toFixed(1)}°C`;
        document.getElementById("refTemp").textContent = `${refT.toFixed(1)}°C`;
        document.getElementById("uhiEst").textContent = `${uhiEstimate >= 0 ? "+" : ""}${uhiEstimate.toFixed(1)}°C`;

        const biasEl = document.getElementById("uhiBias");
        biasEl.textContent = `${bias >= 0 ? "+" : ""}${bias.toFixed(1)}°C`;

        const verdictEl = document.getElementById("verdictText");
        verdictEl.className = "verdict-box";

        if (Math.abs(bias) <= 0.35) {
          verdictEl.classList.add("balanced");
          verdictEl.textContent = `设计优良：布设均衡且参照站无极端干扰，偏差仅 ${bias >= 0 ? "+" : ""}${bias.toFixed(1)}°C。`;
        } else if (bias > 0.35) {
          verdictEl.classList.add("biased");
          const reason = state.urbanMode === "canyon" ? "密集街谷过度集热" : "参照站落入林地冷源";
          verdictEl.textContent = `高估警告：${reason}，热岛被虚高 +${bias.toFixed(1)}°C。`;
        } else {
          verdictEl.classList.add("biased");
          const reason = refT >= 29.0 ? "参照站受干热跑道烘烤" : "城区站点偏向公园冷岛";
          verdictEl.textContent = `低估警告：${reason}，热岛被压低 ${bias.toFixed(1)}°C。`;
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(bgCanvas, 0, 0);

        // 绘制城区站点
        const urbanSites = URBAN_PRESETS[state.urbanMode];
        urbanSites.forEach((pt, i) => {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 7, 0, Math.PI * 2);
          ctx.fillStyle = "#C63F20";
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = "#FFFFFF";
          ctx.stroke();

          // 站点标温
          ctx.font = "11px Bahnschrift";
          ctx.fillStyle = "#17282E";
          ctx.fillText(`${evaluateTemp(pt.x, pt.y).toFixed(1)}°`, pt.x + 10, pt.y + 4);
        });

        // 绘制参照站候选环（非选中的预设展示虚线环）
        Object.keys(REF_PRESETS).forEach(k => {
          const p = REF_PRESETS[k];
          const isCurrent = Math.hypot(p.x - state.refPos.x, p.y - state.refPos.y) < 8;
          if (!isCurrent) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(80, 100, 107, 0.6)";
            ctx.lineWidth = 1.5;
            ctx.setLineDash([3, 3]);
            ctx.stroke();
            ctx.setLineDash([]);
          }
        });

        // 绘制当前参照站
        const rx = state.refPos.x;
        const ry = state.refPos.y;
        ctx.beginPath();
        ctx.arc(rx, ry, 9, 0, Math.PI * 2);
        ctx.fillStyle = "#39704A";
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = "#FFFFFF";
        ctx.stroke();

        // 拖拽光晕
        ctx.beginPath();
        ctx.arc(rx, ry, 16, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(57, 112, 74, 0.4)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = "12px Bahnschrift";
        ctx.fillStyle = "#17282E";
        ctx.fillText(`参照站: ${evaluateTemp(rx, ry).toFixed(1)}°C`, rx + 14, ry + 4);
      }

      function render() {
        updateCalculations();
        draw();
      }

      // 事件交互
      // 1. 城区布设切换
      document.querySelectorAll("[data-urban]").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-urban]").forEach(b => b.setAttribute("aria-pressed", "false"));
          btn.setAttribute("aria-pressed", "true");
          state.urbanMode = btn.dataset.urban;
          render();
        });
      });

      // 2. 乡村参照预设切换
      document.querySelectorAll("[data-ref]").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-ref]").forEach(b => b.setAttribute("aria-pressed", "false"));
          btn.setAttribute("aria-pressed", "true");
          state.refPreset = btn.dataset.ref;
          state.refPos = { ...REF_PRESETS[btn.dataset.ref] };
          render();
        });
      });

      // 3. 画布指针拖动参照站
      function getCanvasCoords(e) {
        const pt = Deck.pt(canvas, e);
        return {
          x: Math.max(20, Math.min(800, pt.x)),
          y: Math.max(20, Math.min(460, pt.y))
        };
      }

      canvas.addEventListener("pointerdown", e => {
        const pos = getCanvasCoords(e);
        const dist = Math.hypot(pos.x - state.refPos.x, pos.y - state.refPos.y);
        if (dist <= 24) {
          state.isDraggingRef = true;
          canvas.setPointerCapture(e.pointerId);
        } else {
          // 如果点击某个候选点，直接吸附过去
          Object.keys(REF_PRESETS).forEach(k => {
            const p = REF_PRESETS[k];
            if (Math.hypot(pos.x - p.x, pos.y - p.y) <= 20) {
              state.refPos = { ...p };
              state.refPreset = k;
              document.querySelectorAll("[data-ref]").forEach(b => {
                b.setAttribute("aria-pressed", String(b.dataset.ref === k));
              });
              render();
            }
          });
        }
      });

      canvas.addEventListener("pointermove", e => {
        if (!state.isDraggingRef) return;
        const pos = getCanvasCoords(e);
        state.refPos = pos;
        // 检查是否靠近某个预设点
        let matched = false;
        Object.keys(REF_PRESETS).forEach(k => {
          const p = REF_PRESETS[k];
          if (Math.hypot(pos.x - p.x, pos.y - p.y) < 16) {
            matched = true;
            document.querySelectorAll("[data-ref]").forEach(b => {
              b.setAttribute("aria-pressed", String(b.dataset.ref === k));
            });
          }
        });
        if (!matched) {
          document.querySelectorAll("[data-ref]").forEach(b => b.setAttribute("aria-pressed", "false"));
        }
        render();
      });

      function stopDrag(e) {
        if (state.isDraggingRef) {
          state.isDraggingRef = false;
          try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      }

      canvas.addEventListener("pointerup", stopDrag);
      canvas.addEventListener("pointercancel", stopDrag);

      // 初始化底盘
      Deck.init({ index: 14, total: 19 });
      render();
    })();
  </script>
</body>
</html>
