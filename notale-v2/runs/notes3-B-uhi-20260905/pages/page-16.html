<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #E8EFF1;
      --text: #17282E;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
    }

    #stage {
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: var(--pad-y) var(--pad-x);
      width: 1600px;
      height: 900px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
      user-select: none;
    }

    /* 顶部标题区 */
    header {
      flex: 0 0 auto;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .lead-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 8px;
    }
    .lead-text {
      font-size: var(--fs-lead);
      color: var(--muted);
      margin: 0;
    }
    .status-badge {
      font-size: var(--fs-label);
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 4px;
      background: var(--surface-strong);
      color: var(--observed);
    }

    /* 主体三列对比布局 */
    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 24px;
      flex: 1 1 0;
      min-height: 0;
    }

    .case-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1.5px solid var(--surface-strong);
      border-radius: 8px;
      padding: 22px 24px;
      cursor: pointer;
      transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
      outline: none;
      text-align: left;
    }
    .case-card:hover, .case-card:focus-visible {
      border-color: var(--observed);
      box-shadow: 0 6px 18px rgba(23, 40, 46, 0.08);
    }
    .case-card.active {
      border-color: var(--cooling);
      background: #FFFFFF;
      box-shadow: 0 8px 24px rgba(23, 107, 130, 0.14);
    }
    .case-card.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--cooling);
      border-radius: 8px 8px 0 0;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }

    /* 机制示意剖面 SVG */
    .scene-svg {
      width: 100%;
      height: 270px;
      flex: 0 0 270px;
      background: #EAF0F2;
      border-radius: 6px;
      overflow: hidden;
    }
    .svg-banner {
      font-size: 15px;
      font-weight: 700;
      font-family: var(--font-sans);
    }
    .svg-pill-txt {
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font-sans);
      fill: #FFFFFF;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    /* 数据读数网格 */
    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 18px 0 14px;
    }
    .metric-item {
      background: var(--surface-strong);
      border-radius: 4px;
      padding: 10px 14px;
    }
    .metric-label {
      font-size: var(--fs-label);
      color: var(--muted);
      margin-bottom: 4px;
    }
    .metric-val {
      font-family: var(--font-num);
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
    }
    .metric-val .unit {
      font-size: var(--fs-tick);
      font-weight: normal;
      margin-left: 2px;
      color: var(--muted);
    }
    .metric-val.heat { color: var(--heat); }
    .metric-val.cool { color: var(--cooling); }

    /* 约束诊断分析 */
    .card-finding {
      margin-top: auto;
      font-size: var(--fs-sec);
      line-height: 1.5;
      color: var(--text);
      border-top: 1px solid var(--surface-strong);
      padding-top: 14px;
    }
    .card-finding strong {
      color: var(--cooling);
    }
    .card-finding.card-alert strong {
      color: var(--heat);
    }

    /* 底部底栏总览 */
    footer {
      flex: 0 0 auto;
      margin-top: 16px;
      padding: 12px 20px;
      background: var(--surface-strong);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--fs-label);
      color: var(--muted);
    }
    .footer-tags {
      display: flex;
      gap: 20px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sw-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body data-page="16" data-total="19">
  <div id="stage">
    <header>
      <h1>树冠遮阴与绿地蒸散：降温机理受水分及配置强约束</h1>
      <div class="lead-row">
        <p class="lead-text">遮阴即时阻隔短波辐射，蒸散持续消耗潜热；干旱缺水或断续斑块会严重削弱降温成效</p>
        <div class="status-badge" id="inspectState">点击卡片比对微气候机制</div>
      </div>
    </header>

    <div class="compare-grid min0">
      <!-- 案例 1: 连续阔叶树冠（充分灌溉） -->
      <button class="case-card min0 active" id="case1" data-case="1" tabindex="0" aria-pressed="true">
        <div class="card-head">
          <h2 class="card-title">连续树冠 · 充足水分</h2>
          <span class="tag" data-kind="cooling">遮阴 + 蒸散协同</span>
        </div>

        <svg class="scene-svg" viewBox="0 0 460 280">
          <!-- 天空与太阳辐射 -->
          <circle cx="70" cy="45" r="24" fill="#C63F20" opacity="0.85" />
          <path d="M70 75 L70 95 M95 70 L115 82 M45 70 L25 82" stroke="#C63F20" stroke-width="2.5" stroke-linecap="round" />
          
          <!-- 树冠层 (连续高郁闭度) -->
          <path d="M40 170 Q100 80 180 130 Q260 70 340 120 Q410 90 440 170 Z" fill="#39704A" />
          <rect x="220" y="170" width="22" height="60" fill="#735F2A" />
          <rect x="100" y="160" width="18" height="70" fill="#735F2A" />
          <rect x="350" y="160" width="18" height="70" fill="#735F2A" />

          <!-- 地面 (阴影区草地) -->
          <rect x="0" y="230" width="460" height="50" fill="#2D5A3B" />
          <rect x="0" y="226" width="460" height="5" fill="#255F73" opacity="0.3" />

          <!-- 能量流箭头：遮阴与蒸散 -->
          <!-- 蒸散潜热通量 (向上蓝色虚线波浪) -->
          <path d="M120 120 Q125 100 120 80 M240 100 Q245 80 240 60 M330 90 Q335 70 330 50" 
                fill="none" stroke="#176B82" stroke-width="3" stroke-dasharray="4,3" stroke-linecap="round" />
          <!-- 遮阴阻隔率标注 -->
          <text x="235" y="45" fill="#176B82" class="svg-banner">潜热通量 λE ↑ 380 W/m²</text>
          
          <!-- 地表阴影标注 -->
          <rect x="90" y="238" width="280" height="28" rx="4" fill="#17282E" opacity="0.88" />
          <text x="230" y="252" class="svg-pill-txt">地面辐射截留率 > 85%</text>
        </svg>

        <div class="metric-grid">
          <div class="metric-item">
            <div class="metric-label">地面温降 ΔT地表</div>
            <div class="metric-val cool">-14.2<span class="unit">°C</span></div>
          </div>
          <div class="metric-item">
            <div class="metric-label">冠下气温 ΔT气</div>
            <div class="metric-val cool">-2.8<span class="unit">°C</span></div>
          </div>
          <div class="metric-item">
            <div class="metric-label">蒸散耗热占比</div>
            <div class="metric-val">68<span class="unit">%</span></div>
          </div>
          <div class="metric-item">
            <div class="metric-label">有效降温半径</div>
            <div class="metric-val">35<span class="unit">m</span></div>
          </div>
        </div>

        <div class="card-finding">
          <strong>机制闭环：</strong>高叶面积指数截留绝大部分短波辐射，充足根区水维持高气孔导度，蒸散与遮阴形成叠加降温。
        </div>
      </button>

      <!-- 案例 2: 干旱受限树冠（水分胁迫） -->
      <button class="case-card min0" id="case2" data-case="2" tabindex="0" aria-pressed="false">
        <div class="card-head">
          <h2 class="card-title">树冠干旱 · 气孔关闭</h2>
          <span class="tag" data-kind="uncertain">蒸散停滞 / 仅余遮阴</span>
        </div>

        <svg class="scene-svg" viewBox="0 0 460 280">
          <!-- 天空与烈日 -->
          <circle cx="70" cy="45" r="26" fill="#C63F20" />
          <path d="M70 78 L70 100 M98 72 L120 85 M42 72 L20 85" stroke="#C63F20" stroke-width="3" stroke-linecap="round" />

          <!-- 树冠层 (叶片卷曲干燥) -->
          <path d="M60 175 Q120 100 200 145 Q270 95 340 135 Q400 115 420 175 Z" fill="#6A7A4D" />
          <rect x="230" y="175" width="20" height="55" fill="#735F2A" />

          <!-- 地面 (干燥泥土) -->
          <rect x="0" y="230" width="460" height="50" fill="#8C7A5E" />
          <!-- 根区干燥裂纹示意 -->
          <path d="M180 250 L200 270 L215 260 M260 245 L275 265 L290 255" stroke="#4A3F2C" stroke-width="2" fill="none" />

          <!-- 热感应箭头：树冠自身发热显热通量 -->
          <path d="M190 120 Q180 95 190 70 M270 110 Q260 85 270 60" 
                fill="none" stroke="#C63F20" stroke-width="3" stroke-dasharray="3,3" stroke-linecap="round" />
          <text x="195" y="45" fill="#C63F20" class="svg-banner">显热通量 H ↑ (叶温升高)</text>

          <!-- 地表阴影（遮阴依然存在，但气温难降） -->
          <rect x="90" y="238" width="280" height="28" rx="4" fill="#17282E" opacity="0.88" />
          <text x="230" y="252" class="svg-pill-txt">短波截留仍存 · 蒸散冷源停滞</text>
        </svg>

        <div class="metric-grid">
          <div class="metric-item">
            <div class="metric-label">地面温降 ΔT地表</div>
            <div class="metric-val cool">-8.5<span class="unit">°C</span></div>
          </div>
          <div class="metric-item">
            <div class="metric-label">冠下气温 ΔT气</div>
            <div class="metric-val heat">-0.6<span class="unit">°C</span></div>
          </div>
          <div class="metric-item">
            <div class="metric-label">蒸散耗热占比</div>
            <div class="metric-val heat">14<span class="unit">%</span></div>
          </div>
          <div class="metric-item">
            <div class="metric-label">有效降温半径</div>
            <div class="metric-val">8<span class="unit">m</span></div>
          </div>
        </div>

        <div class="card-finding card-alert">
          <strong>水分约束：</strong>干旱导致气孔关闭，蒸散骤降80%；树冠吸收辐射后直接转为显热加热空气，空气温降近乎失效。
        </div>
      </button>

      <!-- 案例 3: 孤立散生与硬化铺装包裹（配置破碎） -->
      <button class="case-card min0" id="case3" data-case="3" tabindex="0" aria-pressed="false">
        <div class="card-head">
          <h2 class="card-title">孤立树穴 · 硬质环绕</h2>
          <span class="tag" data-kind="heat">边缘侧向热平流侵蚀</span>
        </div>

        <svg class="scene-svg" viewBox="0 0 460 280">
          <!-- 天空与烈日 -->
          <circle cx="70" cy="45" r="26" fill="#C63F20" />
          <path d="M70 78 L70 100 M98 72 L120 85 M42 72 L20 85" stroke="#C63F20" stroke-width="3" stroke-linecap="round" />

          <!-- 单株小孤立树冠 -->
          <circle cx="230" cy="140" r="55" fill="#39704A" />
          <rect x="223" y="195" width="14" height="35" fill="#735F2A" />

          <!-- 两侧大面积沥青/硬化下垫面 -->
          <rect x="0" y="230" width="190" height="50" fill="#434E52" />
          <rect x="270" y="230" width="190" height="50" fill="#434E52" />
          <!-- 窄小树穴 -->
          <rect x="190" y="230" width="80" height="50" fill="#6A573F" />

          <!-- 周围热沥青向树下平流水平热波 -->
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#C63F20"/>
            </marker>
          </defs>
          <path d="M60 215 L165 215 M400 215 L295 215" 
                stroke="#C63F20" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
          <text x="230" y="45" fill="#C63F20" class="svg-banner" text-anchor="middle">侧向高温热平流冲刷</text>

          <rect x="150" y="238" width="160" height="28" rx="4" fill="#17282E" opacity="0.88" />
          <text x="230" y="252" class="svg-pill-txt">树阴覆盖区狭窄</text>
        </svg>

        <div class="metric-grid">
          <div class="metric-item">
            <div class="metric-label">地面温降 ΔT地表</div>
            <div class="metric-val cool">-4.1<span class="unit">°C</span></div>
          </div>
          <div class="metric-item">
            <div class="metric-label">冠下气温 ΔT气</div>
            <div class="metric-val heat">-0.3<span class="unit">°C</span></div>
          </div>
          <div class="metric-item">
            <div class="metric-label">边缘热平流抵消</div>
            <div class="metric-val heat">75<span class="unit">%</span></div>
          </div>
          <div class="metric-item">
            <div class="metric-label">有效降温半径</div>
            <div class="metric-val">3<span class="unit">m</span></div>
          </div>
        </div>

        <div class="card-finding card-alert">
          <strong>空间配置约束：</strong>斑块过小且被高热路面环绕，侧向热平流迅速中和局部微气泡，单木难形成稳定冷岛。
        </div>
      </button>
    </div>

    <footer>
      <div class="footer-tags">
        <div class="legend-item">
          <span class="sw-dot" style="background: var(--cooling);"></span>
          <span>降温主导：短波截留与潜热通量</span>
        </div>
        <div class="legend-item">
          <span class="sw-dot" style="background: var(--heat);"></span>
          <span>衰减主导：显热通量与侧向平流</span>
        </div>
      </div>
      <div>工程要义：确保根区透水容积、优先成片聚集绿化、选育耐旱深根复层树种</div>
    </footer>
  </div>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 16, total: 19 });

    const cards = document.querySelectorAll('.case-card');
    const inspectState = document.getElementById('inspectState');

    const stateTips = {
      '1': '当前状态：连续林荫配置下，遮阴与蒸散发挥 100% 潜能',
      '2': '当前状态：土壤缺水触发气孔关闭，蒸散降温崩溃，只剩微弱遮阴',
      '3': '当前状态：孤立小树穴被周围沥青热空气包围，冷岛迅速被热平流吹散'
    };

    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => {
          c.classList.remove('active');
          c.setAttribute('aria-pressed', 'false');
        });
        card.classList.add('active');
        card.setAttribute('aria-pressed', 'true');
        const cid = card.getAttribute('data-case');
        inspectState.textContent = stateTips[cid];
      });
    });
  </script>
</body>
</html>
