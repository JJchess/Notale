<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>异质性、机制与外部效度：扩展主张而非修复识别</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: 48px 56px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      color: var(--text);
      box-sizing: border-box;
      background: var(--bg);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 32px;
    }

    h1 {
      font-size: var(--fs-h1);
      line-height: 1.2;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .btns {
      display: inline-flex;
      background: var(--soft);
      padding: 4px;
      border-radius: var(--r-sm);
      gap: 4px;
    }

    .btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: var(--fs-sec);
      font-family: var(--font-sans);
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      transition: all var(--fast) ease;
      font-weight: 500;
    }

    .btn:hover {
      color: var(--text);
    }

    .btn.active {
      background: var(--surface);
      color: var(--text);
      border-color: rgba(0, 0, 0, 0.08);
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .main-view {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 860px 1fr;
      gap: 28px;
      align-items: stretch;
    }

    .diagram-panel {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--soft);
      border-radius: var(--r-md);
      display: flex;
      flex-direction: column;
      padding: 24px;
      box-sizing: border-box;
    }

    .diagram-panel svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .summary-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--soft);
      border-radius: var(--r-md);
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-title {
      font-size: var(--fs-sec);
      color: var(--muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--supported);
    }

    .card-status {
      font-size: var(--fs-h2);
      line-height: 1.35;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .card-detail {
      font-size: var(--fs-sec);
      line-height: 1.5;
      color: var(--muted);
    }

    /* SVG 内部样式 */
    .node-rect {
      transition: all var(--move) ease;
      rx: 8px;
    }
    .node-text-title {
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .node-text-sub {
      font-family: var(--font-sans);
      font-size: 13px;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .flow-line {
      stroke-width: 2;
      transition: all var(--move) ease;
    }
  </style>
</head>
<body data-page="19" data-total="24">
  <div id="stage">
    <header>
      <h1>异质性与机制无法修复有偏识别</h1>
      <div class="btns" role="group" aria-label="识别状态切换">
        <button class="btn active" id="btn-valid" type="button">识别成立</button>
        <button class="btn" id="btn-biased" type="button">存在偏误</button>
      </div>
    </header>

    <div class="main-view min0">
      <!-- 架构示意图 -->
      <div class="diagram-panel min0">
        <svg viewBox="0 0 800 620" id="flow-svg">
          <defs>
            <marker id="arrow-supported" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
              <path d="M1 1 L7 4 L1 7 Z" fill="#2D694C" />
            </marker>
            <marker id="arrow-cause" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
              <path d="M1 1 L7 4 L1 7 Z" fill="#B13F2A" />
            </marker>
            <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
              <path d="M1 1 L7 4 L1 7 Z" fill="#52666E" />
            </marker>
          </defs>

          <!-- 顶层：外部效度 -->
          <g id="node-external" transform="translate(260, 40)">
            <rect class="node-rect" width="280" height="74" fill="#F2F6F7" stroke="#52666E" stroke-width="1.5" />
            <text class="node-text-title" x="140" y="27" fill="#17272D">外部效度</text>
            <text class="node-text-sub" id="text-ext-sub" x="140" y="51" fill="#52666E">主张跨情境推广</text>
          </g>

          <!-- 中层连线到顶层 -->
          <path id="link-ext-left" class="flow-line" d="M 230 220 L 340 124" stroke="#2D694C" marker-end="url(#arrow-supported)" />
          <path id="link-ext-right" class="flow-line" d="M 570 220 L 460 124" stroke="#2D694C" marker-end="url(#arrow-supported)" />

          <!-- 中层左：异质性分析 -->
          <g id="node-hetero" transform="translate(80, 220)">
            <rect class="node-rect" id="rect-hetero" width="300" height="96" fill="#F2F6F7" stroke="#2D694C" stroke-width="1.5" />
            <text class="node-text-title" id="title-hetero" x="150" y="34" fill="#17272D">异质性分析</text>
            <text class="node-text-sub" id="sub-hetero" x="150" y="66" fill="#245A74">群体差异切片</text>
          </g>

          <!-- 中层右：机制检验 -->
          <g id="node-mechanism" transform="translate(420, 220)">
            <rect class="node-rect" id="rect-mechanism" width="300" height="96" fill="#F2F6F7" stroke="#2D694C" stroke-width="1.5" />
            <text class="node-text-title" id="title-mechanism" x="150" y="34" fill="#17272D">机制渠道</text>
            <text class="node-text-sub" id="sub-mechanism" x="150" y="66" fill="#245A74">中介链条验证</text>
          </g>

          <!-- 底层连线到中层 -->
          <path id="link-base-left" class="flow-line" d="M 330 460 L 230 326" stroke="#2D694C" marker-end="url(#arrow-supported)" />
          <path id="link-base-right" class="flow-line" d="M 470 460 L 570 326" stroke="#2D694C" marker-end="url(#arrow-supported)" />

          <!-- 错误倒推反向虚线箭头 -->
          <path id="link-reverse-left" class="flow-line" d="M 200 326 L 290 450" stroke="#B13F2A" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-cause)" opacity="0" />
          <path id="link-reverse-right" class="flow-line" d="M 600 326 L 510 450" stroke="#B13F2A" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-cause)" opacity="0" />
          <text id="label-reverse" class="node-text-sub" x="400" y="380" fill="#B13F2A" font-weight="700" opacity="0">无法逆向补救偏误</text>

          <!-- 底层：基准因果识别 -->
          <g id="node-base" transform="translate(160, 460)">
            <rect class="node-rect" id="rect-base" width="480" height="110" fill="#FFFFFF" stroke="#2D694C" stroke-width="2.5" />
            <text class="node-text-title" id="title-base" x="240" y="40" fill="#2D694C">基准因果识别</text>
            <text class="node-text-sub" id="sub-base" x="240" y="74" fill="#52666E">外生冲击与严格可比对照</text>
          </g>
        </svg>
      </div>

      <!-- 右侧结论与实证诊断 -->
      <div class="summary-panel min0">
        <div class="card">
          <div class="card-title">
            <span class="status-badge" id="dot-indicator"></span>
            <span>证据链状态</span>
          </div>
          <div class="card-status" id="claim-text">地基稳固，扩展成立</div>
          <div class="card-detail" id="diag-desc">
            基准因果无偏时，异质性与机制充实传导路径。
          </div>
        </div>

        <div class="card">
          <div class="card-title">诊断准则</div>
          <div class="card-detail" id="rule-text" style="color: var(--text);">
            机制显著不等于因果成立，无法替代外生性假设。
          </div>
        </div>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    读论文时，很多读者常被丰富的分组异质性表格或机制检验打动，误以为这能弥补基准回归缺乏因果识别的漏洞。
    事实上，因果识别具有不可逆的层级性：基准识别是地基，只有在外生性或可比性成立时，异质性与机制检验才有明确的因果含义。
    如果基准识别本身存在反向因果或未观测混杂，那么中介变量检验往往同样面临内生性，子样本的差异也可能只是选择偏误的切片，绝不可能倒推证明基准是因果。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (function() {
      Deck.init({ index: 19, total: 24 });

      var btnValid = document.getElementById('btn-valid');
      var btnBiased = document.getElementById('btn-biased');
      var dotIndicator = document.getElementById('dot-indicator');
      var claimText = document.getElementById('claim-text');
      var diagDesc = document.getElementById('diag-desc');

      var rectBase = document.getElementById('rect-base');
      var titleBase = document.getElementById('title-base');
      var subBase = document.getElementById('sub-base');

      var linkBaseLeft = document.getElementById('link-base-left');
      var linkBaseRight = document.getElementById('link-base-right');
      var linkExtLeft = document.getElementById('link-ext-left');
      var linkExtRight = document.getElementById('link-ext-right');

      var rectHetero = document.getElementById('rect-hetero');
      var subHetero = document.getElementById('sub-hetero');
      var rectMechanism = document.getElementById('rect-mechanism');
      var subMechanism = document.getElementById('sub-mechanism');

      var linkReverseLeft = document.getElementById('link-reverse-left');
      var linkReverseRight = document.getElementById('link-reverse-right');
      var labelReverse = document.getElementById('label-reverse');

      function setBiasedMode(biased) {
        if (biased) {
          btnBiased.classList.add('active');
          btnValid.classList.remove('active');

          dotIndicator.style.background = 'var(--cause)';
          claimText.textContent = '地基有偏，扩展失真';
          diagDesc.textContent = '基准存在混杂时，异质性仅为偏误的子集分解。';

          // 底层状态
          rectBase.setAttribute('stroke', '#B13F2A');
          rectBase.setAttribute('stroke-dasharray', '8,4');
          titleBase.setAttribute('fill', '#B13F2A');
          titleBase.textContent = '识别破裂：内生偏误';
          subBase.textContent = '存在未观测混杂变量或自选择';

          // 连线失效
          linkBaseLeft.setAttribute('stroke', '#B13F2A');
          linkBaseLeft.setAttribute('marker-end', 'url(#arrow-cause)');
          linkBaseRight.setAttribute('stroke', '#B13F2A');
          linkBaseRight.setAttribute('marker-end', 'url(#arrow-cause)');

          linkExtLeft.setAttribute('stroke', '#52666E');
          linkExtLeft.setAttribute('marker-end', 'url(#arrow-muted)');
          linkExtRight.setAttribute('stroke', '#52666E');
          linkExtRight.setAttribute('marker-end', 'url(#arrow-muted)');

          rectHetero.setAttribute('stroke', '#B13F2A');
          subHetero.textContent = '混入群组选择偏误';
          subHetero.setAttribute('fill', '#B13F2A');

          rectMechanism.setAttribute('stroke', '#B13F2A');
          subMechanism.textContent = '中介仍受内生干扰';
          subMechanism.setAttribute('fill', '#B13F2A');

          linkReverseLeft.style.opacity = '1';
          linkReverseRight.style.opacity = '1';
          labelReverse.style.opacity = '1';
        } else {
          btnValid.classList.add('active');
          btnBiased.classList.remove('active');

          dotIndicator.style.background = 'var(--supported)';
          claimText.textContent = '地基稳固，扩展成立';
          diagDesc.textContent = '基准因果无偏时，异质性与机制充实传导路径。';

          // 底层状态
          rectBase.setAttribute('stroke', '#2D694C');
          rectBase.removeAttribute('stroke-dasharray');
          titleBase.setAttribute('fill', '#2D694C');
          titleBase.textContent = '基准因果识别';
          subBase.textContent = '外生冲击与严格可比对照';

          // 连线正常
          linkBaseLeft.setAttribute('stroke', '#2D694C');
          linkBaseLeft.setAttribute('marker-end', 'url(#arrow-supported)');
          linkBaseRight.setAttribute('stroke', '#2D694C');
          linkBaseRight.setAttribute('marker-end', 'url(#arrow-supported)');

          linkExtLeft.setAttribute('stroke', '#2D694C');
          linkExtLeft.setAttribute('marker-end', 'url(#arrow-supported)');
          linkExtRight.setAttribute('stroke', '#2D694C');
          linkExtRight.setAttribute('marker-end', 'url(#arrow-supported)');

          rectHetero.setAttribute('stroke', '#2D694C');
          subHetero.textContent = '群体差异切片';
          subHetero.setAttribute('fill', '#245A74');

          rectMechanism.setAttribute('stroke', '#2D694C');
          subMechanism.textContent = '中介链条验证';
          subMechanism.setAttribute('fill', '#245A74');

          linkReverseLeft.style.opacity = '0';
          linkReverseRight.style.opacity = '0';
          labelReverse.style.opacity = '0';
        }
      }

      btnValid.addEventListener('click', function() { setBiasedMode(false); });
      btnBiased.addEventListener('click', function() { setBiasedMode(true); });
    })();
  </script>
</body>
</html>
