<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
    }

    /* 顶部标题栏 */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-shrink: 0;
      border-bottom: var(--line) solid var(--muted);
      padding-bottom: 10px;
    }
    .header-row h1 {
      margin: 0;
      font-size: var(--fs-h1);
      color: var(--text);
      font-family: var(--font-display);
      letter-spacing: -0.02em;
    }

    /* 主交互区：左右分栏 */
    .game-grid {
      display: grid;
      grid-template-columns: 880px 1fr;
      gap: 28px;
      flex: 1;
      min-height: 0;
    }

    /* 左侧：文献拼合台 */
    .desk-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    .desk-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .desk-head .sec-title {
      font-size: var(--fs-h2);
      font-family: var(--font-display);
      margin: 0;
      color: var(--text);
    }
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      min-height: 0;
      justify-content: space-between;
    }

    .doc-card {
      background: var(--paper);
      border: 1px solid var(--muted);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      transition: border-color var(--ease), box-shadow var(--ease);
      user-select: none;
    }
    .doc-card:hover {
      border-color: var(--selected);
    }
    .doc-card[aria-pressed="true"] {
      border: 2px solid var(--crossref);
      box-shadow: 0 0 0 1px var(--crossref);
    }
    .doc-card.locked-card {
      cursor: default;
      border-color: var(--muted);
    }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .quote-text {
      font-family: var(--font-display);
      font-size: var(--fs-body);
      color: var(--text);
      line-height: 1.45;
      margin: 0;
    }
    .card-impact {
      display: flex;
      gap: 12px;
      font-size: var(--fs-tick);
      color: var(--muted);
      border-top: 1px dashed rgba(82,99,93,0.3);
      padding-top: 4px;
    }
    .impact-item b {
      font-family: var(--font-num);
      font-weight: normal;
    }

    /* 右侧：证据合成仪与形象裁定 */
    .synth-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    .radar-panel {
      background: var(--paper);
      border: 1px solid var(--muted);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
      min-height: 0;
      justify-content: space-between;
    }

    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .metric-box {
      border: 1px solid rgba(82,99,93,0.3);
      border-radius: var(--radius);
      padding: 10px 14px;
      background: var(--bg);
    }
    .metric-box .label {
      font-size: var(--fs-label);
      color: var(--muted);
      display: block;
    }
    .metric-box .num {
      font-family: var(--font-num);
      font-size: 34px;
      color: var(--text);
      display: block;
      margin-top: 4px;
      line-height: 1;
    }

    .svg-wrap {
      flex: 1;
      min-height: 200px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #traitChart {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 结论推演区 */
    .verdict-box {
      border-top: 2px solid var(--muted);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .verdict-title {
      font-size: var(--fs-h2);
      font-family: var(--font-display);
      color: var(--judgment);
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .verdict-desc {
      font-size: var(--fs-body);
      color: var(--text);
      line-height: 1.5;
      margin: 0;
      min-height: 52px;
    }
  </style>
</head>
<body data-page="07" data-total="15">
  <div id="stage">
    <header class="header-row">
      <h1>互见材料重组人物：单篇与跨篇的形象位移</h1>
    </header>

    <div class="game-grid min0">
      <!-- 左列：互见证据竹简卡片 -->
      <section class="desk-col min0">
        <div class="desk-head">
          <h2 class="sec-title">勾选篇章切片重构李广形象</h2>
          <div class="btns">
            <button type="button" class="btn" id="btnSingle">仅本传</button>
            <button type="button" class="btn" id="btnCross">全篇互见</button>
            <button type="button" class="btn" id="btnReset">重置</button>
          </div>
        </div>

        <div class="cards-container" id="cardsList">
          <!-- 动态卡片 -->
        </div>
      </section>

      <!-- 右列：属性天平与断制推演 -->
      <section class="synth-col min0">
        <div class="radar-panel min0">
          <div class="metrics-bar">
            <div class="metric-box">
              <span class="label">战术勇武</span>
              <span class="num" id="valValor">0</span>
            </div>
            <div class="metric-box">
              <span class="label">治军统御</span>
              <span class="num" id="valDiscipline">0</span>
            </div>
            <div class="metric-box">
              <span class="label">政治德操</span>
              <span class="num" id="valEthics">0</span>
            </div>
          </div>

          <div class="svg-wrap">
            <svg id="traitChart" viewBox="0 0 500 240">
              <!-- 轴名与基准 -->
              <text x="50" y="52" font-size="16" fill="#17231F" text-anchor="end" font-family="Noto Sans SC">勇武</text>
              <text x="50" y="127" font-size="16" fill="#17231F" text-anchor="end" font-family="Noto Sans SC">治军</text>
              <text x="50" y="202" font-size="16" fill="#17231F" text-anchor="end" font-family="Noto Sans SC">德操</text>

              <!-- 基准轨道 -->
              <rect x="65" y="32" width="410" height="30" rx="4" fill="#EAEFE9"/>
              <rect x="65" y="107" width="410" height="30" rx="4" fill="#EAEFE9"/>
              <rect x="65" y="182" width="410" height="30" rx="4" fill="#EAEFE9"/>

              <!-- 单传基准刻线 (勇武85, 治军70, 德操60) -->
              <line x1="413" y1="28" x2="413" y2="66" stroke="#9C3528" stroke-width="2" stroke-dasharray="3 3"/>
              <text x="413" y="24" font-size="13" fill="#9C3528" text-anchor="middle" font-family="Noto Sans SC">本传基准</text>
              <line x1="352" y1="103" x2="352" y2="141" stroke="#9C3528" stroke-width="2" stroke-dasharray="3 3"/>
              <line x1="311" y1="178" x2="311" y2="216" stroke="#9C3528" stroke-width="2" stroke-dasharray="3 3"/>

              <!-- 动态指示条 -->
              <rect id="barValor" x="65" y="32" width="0" height="30" rx="4" fill="#246358" opacity="0.9"/>
              <rect id="barDiscipline" x="65" y="107" width="0" height="30" rx="4" fill="#246358" opacity="0.9"/>
              <rect id="barEthics" x="65" y="182" width="0" height="30" rx="4" fill="#246358" opacity="0.9"/>
            </svg>
          </div>

          <div class="verdict-box">
            <span class="verdict-title" id="verdictTag">史公叙事裁断</span>
            <p class="verdict-desc" id="verdictText">请勾选材料拼合形象。</p>
          </div>
        </div>
      </section>
    </div>
  </div>

  <aside class="notes" hidden>
    这一页让学生通过亲手勾选与剔除史料片段，体会司马迁“互见法”的构造逻辑。
    当学生只读《李将军列传》时，李广箭射没石、与士卒同甘苦，形象是完美的悲剧英雄；
    而一旦纳入《卫青霍去病列传》中失道迷路的战略失职、《匈奴列传》中的轻敌冒进、以及杀降霸陵尉的专断，
    右侧的治军与德操数值立刻发生偏转。
    司马迁并非隐瞒事实，而是把情感投注在本传，把严酷的政治军事审视分置于他篇，使读者拼合出立体真实的人格。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      const SLICES = [
        {
          id: "lg_shoot",
          source: "《李将军列传》",
          isBase: true,
          text: "广出猎，见草中石，以为虎而射之，中石没镞。",
          delta: { valor: 35, discipline: 5, ethics: 0 },
          desc: "突显个人神勇与骑射绝技"
        },
        {
          id: "lg_troops",
          source: "《李将军列传》",
          isBase: true,
          text: "广廉，得赏赐辄分其麾下。乏绝处见水泉，士卒不尽饮，广不近水。",
          delta: { valor: 10, discipline: 25, ethics: 20 },
          desc: "爱抚士卒，奠定悲剧英雄的情感基石"
        },
        {
          id: "wq_lost",
          source: "《卫将军骠骑列传》",
          isBase: false,
          text: "大将军与单于接战，而广军由东道迷失，不任责，引刀自刭。",
          delta: { valor: -5, discipline: -35, ethics: 0 },
          desc: "暴露缺乏大军团协同能力与战略迟滞"
        },
        {
          id: "lg_kill",
          source: "《李将军列传》（附记）",
          isBase: false,
          text: "霸陵尉醉呵广，广后复起为将军，引霸陵尉俱，至军而斩之。",
          delta: { valor: 0, discipline: -10, ethics: -30 },
          desc: "睚眦必报、公报私仇的性格缺陷"
        },
        {
          id: "xn_defeat",
          source: "《匈奴列传》",
          isBase: false,
          text: "匈奴兵多，汉军不利，李广为单于所生得，脱身独骑归。",
          delta: { valor: 5, discipline: -20, ethics: -5 },
          desc: "轻敌轻出，导致部队损失惨重"
        }
      ];

      let state = {
        selected: new Set(["lg_shoot", "lg_troops"])
      };

      const cardsContainer = document.getElementById("cardsList");
      const valValor = document.getElementById("valValor");
      const valDiscipline = document.getElementById("valDiscipline");
      const valEthics = document.getElementById("valEthics");
      const barValor = document.getElementById("barValor");
      const barDiscipline = document.getElementById("barDiscipline");
      const barEthics = document.getElementById("barEthics");
      const verdictTag = document.getElementById("verdictTag");
      const verdictText = document.getElementById("verdictText");

      function calcMetrics() {
        let valor = 40;
        let discipline = 40;
        let ethics = 40;
        state.selected.forEach(id => {
          const item = SLICES.find(s => s.id === id);
          if (item) {
            valor += item.delta.valor;
            discipline += item.delta.discipline;
            ethics += item.delta.ethics;
          }
        });
        return {
          valor: Math.max(0, Math.min(100, valor)),
          discipline: Math.max(0, Math.min(100, discipline)),
          ethics: Math.max(0, Math.min(100, ethics))
        };
      }

      function updateVerdict(m) {
        const hasCross = state.selected.has("wq_lost") || state.selected.has("lg_kill") || state.selected.has("xn_defeat");
        const onlyBase = state.selected.has("lg_shoot") && state.selected.has("lg_troops") && !hasCross;

        if (onlyBase) {
          verdictTag.textContent = "单篇视界：桃李不言的千古悲剧";
          verdictTag.style.color = "var(--selected)";
          verdictText.textContent = "仅凭本传抒情笔墨，李广是身怀绝技、士卒爱戴却命途多舛的纯粹名将。";
        } else if (state.selected.size === 5) {
          verdictTag.textContent = "全篇互见：性格缺陷与历史真实";
          verdictTag.style.color = "var(--judgment)";
          verdictText.textContent = "结合他篇互勘：勇于单兵骑射，拙于军制统驭；虽仁爱部属，亦狭隘杀降。神话复归于血肉。";
        } else if (hasCross) {
          verdictTag.textContent = "互见重构中：形象裂隙显现";
          verdictTag.style.color = "var(--crossref)";
          verdictText.textContent = "他篇事实切入后，治军失序与德操污点打破了单一维度的英雄幻象。";
        } else {
          verdictTag.textContent = "史料不足：轮廓未定";
          verdictTag.style.color = "var(--muted)";
          verdictText.textContent = "请纳入更多篇章材料以拼合人物全貌。";
        }
      }

      function renderCards() {
        cardsContainer.innerHTML = "";
        SLICES.forEach(item => {
          const isSel = state.selected.has(item.id);
          const card = document.createElement("div");
          card.className = "doc-card";
          card.setAttribute("role", "checkbox");
          card.setAttribute("aria-checked", isSel ? "true" : "false");
          card.setAttribute("aria-pressed", isSel ? "true" : "false");
          card.dataset.id = item.id;

          card.innerHTML = `
            <div class="card-top">
              <div class="card-meta">
                <span class="tag" style="background:${item.source.includes('本传') ? 'var(--bg)' : 'rgba(36,99,88,0.1)'}; color:${item.source.includes('本传') ? 'var(--text)' : 'var(--crossref)'}">${item.source}</span>
                <span style="font-size:var(--fs-sec); color:var(--muted);">${item.desc}</span>
              </div>
              <span style="font-family:var(--font-num); font-size:var(--fs-label); color:${isSel ? 'var(--crossref)' : 'var(--muted)'};">
                ${isSel ? '✓ 已载入' : '+ 未采用'}
              </span>
            </div>
            <p class="quote-text">${item.text}</p>
          `;

          card.addEventListener("click", () => {
            if (state.selected.has(item.id)) {
              state.selected.delete(item.id);
            } else {
              state.selected.add(item.id);
            }
            render();
          });

          cardsContainer.appendChild(card);
        });
      }

      function render() {
        renderCards();
        const m = calcMetrics();
        valValor.textContent = m.valor;
        valDiscipline.textContent = m.discipline;
        valEthics.textContent = m.ethics;

        // SVG 宽度 410px
        barValor.setAttribute("width", (m.valor / 100) * 410);
        barDiscipline.setAttribute("width", (m.discipline / 100) * 410);
        barEthics.setAttribute("width", (m.ethics / 100) * 410);

        updateVerdict(m);
      }

      document.getElementById("btnSingle").addEventListener("click", () => {
        state.selected = new Set(["lg_shoot", "lg_troops"]);
        render();
      });

      document.getElementById("btnCross").addEventListener("click", () => {
        state.selected = new Set(SLICES.map(s => s.id));
        render();
      });

      document.getElementById("btnReset").addEventListener("click", () => {
        state.selected = new Set();
        render();
      });

      Deck.init({ keys: false });
      render();
    })();
  </script>
</body>
</html>
