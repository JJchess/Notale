<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: 38px 56px 36px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      gap: 16px;
      height: 900px;
    }

    /* 顶部标题与导语 */
    .head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: var(--line) solid var(--muted);
      padding-bottom: 12px;
      flex-shrink: 0;
    }
    .head h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .head .sub {
      margin: 4px 0 0;
      font-size: var(--fs-sec);
      color: var(--muted);
    }
    .case-nav {
      display: flex;
      gap: 8px;
    }
    .case-btn {
      padding: 6px 14px;
      border: 1px solid var(--muted);
      background: var(--paper);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--ease);
    }
    .case-btn:hover {
      border-color: var(--selected);
    }
    .case-btn.active {
      background: var(--selected);
      color: #ffffff;
      border-color: var(--selected);
      font-weight: 600;
    }

    /* 主训练工作台 */
    .workbench {
      display: grid;
      grid-template-columns: 480px 1fr;
      gap: 24px;
      flex: 1;
      min-height: 0;
    }

    /* 左侧：史事因果链与叙事证据 */
    .facts-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    .col-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
    }
    .col-title .badge {
      font-family: var(--font-num);
      font-size: var(--fs-tick);
      color: var(--crossref);
      font-weight: 600;
      background: rgba(36, 99, 88, 0.1);
      padding: 2px 8px;
      border-radius: var(--radius);
    }
    .facts-stack {
      flex: 1;
      background: var(--paper);
      border: 1px solid rgba(82, 99, 93, 0.25);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .fact-card {
      padding: 10px 12px;
      border: 1px solid rgba(82, 99, 93, 0.2);
      border-radius: var(--radius);
      background: #fafbfa;
      transition: all var(--ease);
    }
    .fact-card.highlight {
      border-color: var(--crossref);
      background: rgba(36, 99, 88, 0.05);
    }
    .fact-head {
      display: flex;
      justify-content: space-between;
      font-size: var(--fs-tick);
      color: var(--muted);
      margin-bottom: 4px;
    }
    .fact-head .source {
      color: var(--crossref);
      font-weight: 600;
    }
    .fact-text {
      margin: 0;
      font-size: var(--fs-sec);
      line-height: 1.45;
      font-family: var(--font-display);
      color: var(--text);
    }

    /* 右侧：推导互动、张力天平与论赞裁断 */
    .eval-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    .eval-box {
      background: var(--paper);
      border: 1px solid rgba(82, 99, 93, 0.25);
      border-radius: var(--radius);
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      min-height: 0;
    }

    /* 选项推断区 */
    .step-prompt {
      font-size: var(--fs-lead);
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--text);
    }
    .hypo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .hypo-btn {
      padding: 12px 14px;
      border: 1px solid rgba(82, 99, 93, 0.3);
      border-radius: var(--radius);
      background: #fdfdfd;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all var(--ease);
    }
    .hypo-btn:hover {
      border-color: var(--selected);
      background: #f7fafc;
    }
    .hypo-btn.active {
      border-color: var(--selected);
      background: rgba(21, 95, 131, 0.08);
      box-shadow: inset 0 0 0 1px var(--selected);
    }
    .hypo-title {
      font-size: var(--fs-body);
      font-weight: 600;
      color: var(--text);
    }
    .hypo-desc {
      font-size: var(--fs-tick);
      color: var(--muted);
      line-height: 1.4;
    }

    /* 天平/张力测度图解 */
    .gauge-card {
      border-top: 1px solid rgba(82, 99, 93, 0.2);
      border-bottom: 1px solid rgba(82, 99, 93, 0.2);
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .gauge-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: var(--fs-label);
      color: var(--muted);
    }
    .gauge-bars {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 80px 1fr 48px;
      align-items: center;
      gap: 10px;
      font-size: var(--fs-tick);
    }
    .bar-label {
      color: var(--muted);
      text-align: right;
    }
    .bar-track {
      height: 10px;
      background: #edf0ec;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 300ms ease;
    }
    .bar-fill.fact {
      background: var(--crossref);
    }
    .bar-fill.moral {
      background: var(--judgment);
    }
    .bar-val {
      font-family: var(--font-num);
      font-weight: 600;
      color: var(--text);
    }

    /* 裁断揭示与解释模型对比 */
    .verdict-box {
      border: 1px solid rgba(156, 53, 40, 0.35);
      background: rgba(156, 53, 40, 0.04);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .verdict-tag {
      font-size: var(--fs-tick);
      color: var(--judgment);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .verdict-quote {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-sec);
      color: var(--text);
      line-height: 1.45;
    }
    .verdict-analysis {
      margin: 0;
      font-size: var(--fs-tick);
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body data-page="13" data-total="15">
  <div id="stage">
    <header class="head">
      <div>
        <h1>史事因果与论赞裁断的互制模型</h1>
        <p class="sub">通过典型篇目检验：叙事因果如何支撑或反驳作者判断</p>
      </div>
      <nav class="case-nav" aria-label="案例切换">
        <button type="button" class="case-btn active" data-case="0">案例一：项羽因果之辩</button>
        <button type="button" class="case-btn" data-case="1">案例二：伯夷天道之惑</button>
        <button type="button" class="case-btn" data-case="2">案例三：李广数奇之叹</button>
      </nav>
    </header>

    <main class="workbench">
      <!-- 左栏：史实证据链 -->
      <section class="facts-col min0" aria-labelledby="facts-title">
        <div class="col-title">
          <span id="facts-title">本纪/列传叙事证据</span>
          <span class="badge" id="case-source-tag">项羽本纪</span>
        </div>
        <div class="facts-stack min0" id="facts-list">
          <!-- 动态渲染史事证据 -->
        </div>
      </section>

      <!-- 右栏：因果假设检验与论赞介入 -->
      <section class="eval-col min0" aria-labelledby="eval-title">
        <div class="eval-box min0">
          <div class="step-prompt" id="prompt-heading">假设检验：当事人立场 vs 篇末论赞</div>
          
          <div class="hypo-grid" id="hypo-container" role="radiogroup" aria-label="解释假设">
            <!-- 动态生成假设按钮 -->
          </div>

          <!-- 双轨张力天平 -->
          <div class="gauge-card">
            <div class="gauge-header">
              <span>模型解释度评估</span>
              <span id="gauge-summary">请选择解释假设</span>
            </div>
            <div class="gauge-bars">
              <div class="bar-row">
                <span class="bar-label">事实验证</span>
                <div class="bar-track">
                  <div class="bar-fill fact" id="bar-fact" style="width: 0%"></div>
                </div>
                <span class="bar-val" id="val-fact">0%</span>
              </div>
              <div class="bar-row">
                <span class="bar-label">论赞认同</span>
                <div class="bar-track">
                  <div class="bar-fill moral" id="bar-moral" style="width: 0%"></div>
                </div>
                <span class="bar-val" id="val-moral">0%</span>
              </div>
            </div>
          </div>

          <!-- 篇末论赞裁断揭示 -->
          <div class="verdict-box" id="verdict-display">
            <div class="verdict-tag">
              <span>太史公曰裁断</span>
            </div>
            <blockquote class="verdict-quote" id="verdict-quote">
              加载中……
            </blockquote>
            <p class="verdict-analysis" id="verdict-analysis">
              加载中……
            </p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <aside class="notes" hidden>
    这一页我们把前几页讨论的论赞机制，做成一个可操作的因果检验模型。
    《史记》的精彩处在于：太史公从不悬空发表议论。篇末的“太史公曰”必须直面叙事文本中堆叠的硬证据。
    通过切换项羽、伯夷、李广三个案例，我们可以清楚看到：当事人的自我辩解与太史公的终极裁决之间，始终存在着严密的因果拉锯与价值张力。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (function() {
      "use strict";

      const CASES = [
        {
          id: "xiangyu",
          title: "案例一：项羽因果之辩",
          source: "《项羽本纪》",
          facts: [
            { source: "破釜沉舟", text: "项羽引兵渡河，皆沉船破釜，示士卒必死，无一还心。" },
            { source: "分封失序", text: "项王自封西楚霸王，诸将私相封割，背义帝之约，天下怨叛。" },
            { source: "垓下之叹", text: "『天之亡我，我何渡为！』八千子弟无一生还，愧见江东父兄。" }
          ],
          hypos: [
            {
              id: "tianwang",
              name: "假设 A：天亡项羽（当事人归因）",
              desc: "项羽临终归咎于天命气数，非战之罪。",
              factScore: 20,
              moralScore: 10,
              highlightIdx: 2
            },
            {
              id: "feizhan",
              name: "假设 B：政略覆亡（太史公裁断）",
              desc: "自矜功伐，恃匹夫之勇，不师古始，身死国灭是人事之失。",
              factScore: 92,
              moralScore: 95,
              highlightIdx: 1
            }
          ],
          verdict: "太史公曰：羽起陇亩，三年灭秦。然矜伐私智而不师古，引『天亡我』，岂不谬哉！",
          analysis: "太史公以三年灭秦的现实事实，反驳了将政治失略托辞为天命气数的自辩。"
        },
        {
          id: "boyi",
          title: "案例二：伯夷天道之惑",
          source: "《伯夷列传》",
          facts: [
            { source: "叩马而谏", text: "伯夷叔齐叩马谏曰：『父死不葬及干戈，孝乎？以臣弑君，仁乎？』" },
            { source: "首阳采薇", text: "武王平商，伯夷叔齐义不食周粟，隐于首阳，采薇而食，遂饿死。" },
            { source: "善恶无凭", text: "颜渊箪瓢屡空蚤夭；盗跖日杀不辜竟以寿终。天道福善果安在？" }
          ],
          hypos: [
            {
              id: "tiandao_you",
              name: "假设 A：天道无亲，常与善人",
              desc: "信奉传统天道正义，行善必有善报。",
              factScore: 15,
              moralScore: 30,
              highlightIdx: 2
            },
            {
              id: "tiandao_huo",
              name: "假设 B：天道安在？立言传名",
              desc: "现实中善恶无报，史家以立传裁断使仁人名垂后世。",
              factScore: 90,
              moralScore: 98,
              highlightIdx: 1
            }
          ],
          verdict: "太史公曰：余甚惑焉，傥所谓天道，是邪非邪？伯夷虽贤，得夫子而名彰。",
          analysis: "直面善人受困的残酷现实，不以虚妄天理搪塞，转向史笔立传的寄托。"
        },
        {
          id: "liguang",
          title: "案例三：李广数奇之叹",
          source: "《李将军列传》",
          facts: [
            { source: "百战无封", text: "李广与匈奴大小七十余战，部下皆封侯，广独无尺寸之封。" },
            { source: "杀降致恨", text: "尝诱降西羌八百人而尽诈杀之，后自省常以此为平生深憾。" },
            { source: "引刀自刭", text: "卫青令广出东道，失道受责，广不愿对簿刀笔吏，遂引刀自裁。" }
          ],
          hypos: [
            {
              id: "shuqi",
              name: "假设 A：命数奇舛（当事人感慨）",
              desc: "生不逢时，命运使然，将帅命途多舛。",
              factScore: 45,
              moralScore: 50,
              highlightIdx: 0
            },
            {
              id: "debupei",
              name: "假设 B：治军与怨谴（叙事互制）",
              desc: "李广治军简易失于约束，杀降失信，终至愤激绝命。",
              factScore: 88,
              moralScore: 85,
              highlightIdx: 1
            }
          ],
          verdict: "太史公曰：桃李不言，下自成蹊。彼其忠实心诚信于士大夫也。",
          analysis: "既崇敬其爱兵诚笃之德，又以诈杀、失道之实笔揭示未得封侯的深层人事原因。"
        }
      ];

      let currentCaseIdx = 0;
      let selectedHypoId = CASES[0].hypos[1].id; // 默认选中太史公裁断

      function render() {
        const c = CASES[currentCaseIdx];
        document.getElementById("case-source-tag").textContent = c.source;

        // 案例按钮激活
        document.querySelectorAll(".case-btn").forEach((btn, idx) => {
          btn.classList.toggle("active", idx === currentCaseIdx);
        });

        // 渲染事实列表
        const activeHypo = c.hypos.find(h => h.id === selectedHypoId) || c.hypos[0];
        const factsContainer = document.getElementById("facts-list");
        factsContainer.innerHTML = c.facts.map((f, i) => `
          <div class="fact-card ${i === activeHypo.highlightIdx ? 'highlight' : ''}">
            <div class="fact-head">
              <span class="source">${f.source}</span>
              <span>证据 #${i + 1}</span>
            </div>
            <p class="fact-text">${f.text}</p>
          </div>
        `).join("");

        // 渲染假设选择按钮
        const hypoContainer = document.getElementById("hypo-container");
        hypoContainer.innerHTML = c.hypos.map(h => `
          <button type="button" class="hypo-btn ${h.id === activeHypo.id ? 'active' : ''}" data-hypo="${h.id}">
            <span class="hypo-title">${h.name}</span>
            <span class="hypo-desc">${h.desc}</span>
          </button>
        `).join("");

        // 渲染刻度条与读数
        document.getElementById("bar-fact").style.width = activeHypo.factScore + "%";
        document.getElementById("val-fact").textContent = activeHypo.factScore + "%";
        document.getElementById("bar-moral").style.width = activeHypo.moralScore + "%";
        document.getElementById("val-moral").textContent = activeHypo.moralScore + "%";
        document.getElementById("gauge-summary").textContent = activeHypo.name.split("：")[1];

        // 渲染论赞
        document.getElementById("verdict-quote").textContent = c.verdict;
        document.getElementById("verdict-analysis").textContent = c.analysis;
      }

      // 事件绑定
      document.querySelector(".case-nav").addEventListener("click", function(e) {
        const btn = e.target.closest(".case-btn");
        if (!btn) return;
        currentCaseIdx = parseInt(btn.dataset.case, 10);
        selectedHypoId = CASES[currentCaseIdx].hypos[1].id;
        render();
      });

      document.getElementById("hypo-container").addEventListener("click", function(e) {
        const btn = e.target.closest(".hypo-btn");
        if (!btn) return;
        selectedHypoId = btn.dataset.hypo;
        render();
      });

      render();
      Deck.init({ index: 13, total: 15 });
    })();
  </script>
</body>
</html>
