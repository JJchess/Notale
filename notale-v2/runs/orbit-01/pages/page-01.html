<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="01" data-total="20">
<div id="stage">
  <main class="page" id="page-main">
    <section class="page-body split min0">
      <figure class="chart-shell min0" aria-label="地球与实时轨迹">
        <canvas id="orbit-canvas" class="cv-fill no-pan" aria-label="可拖拽速度箭头的地心二体轨道实验"></canvas>
      </figure>
      <aside class="panel control-panel min0" aria-label="发射实验控制区">
        <div class="panel-heading">
          <span class="panel-kicker">先写下预测，再发射</span>
          <h2 class="panel-title">同一位置，换方向</h2>
          <p class="panel-description">拖动画面中的箭头改变初速度。先猜它会回来、绕行，还是离开附近。</p>
        </div>
        <div class="control-group">
          <label class="control-label" for="mode">发射方式</label>
          <select id="mode" aria-label="选择发射方式">
            <option value="up">竖直向上</option>
            <option value="side" selected>水平向前</option>
            <option value="diag">斜向前上方</option>
          </select>
        </div>
        <div class="control-group">
          <label class="control-label" for="speed">箭头长度 · 速度</label>
          <div class="control-row">
            <input id="speed" type="range" min="0" max="18000" step="100" value="7780" aria-label="初速度大小">
            <output id="speed-readout" class="control-value" for="speed"></output>
          </div>
        </div>
        <div class="control-group">
          <label class="control-label" for="angle">箭头方向</label>
          <div class="control-row">
            <input id="angle" type="range" min="-90" max="90" step="1" value="0" aria-label="初速度方向">
            <output id="angle-readout" class="control-value" for="angle"></output>
          </div>
        </div>
        <div class="readout-grid is-three" aria-live="polite">
          <div class="readout"><span class="readout-label">当前速度</span><strong id="current-speed" class="readout-value">—</strong></div>
          <div class="readout is-blue"><span class="readout-label">离地距离</span><strong id="current-distance" class="readout-value">—</strong></div>
          <div class="readout"><span class="readout-label">结果</span><strong id="result" class="readout-value">等待发射</strong></div>
        </div>
        <div class="control-group">
          <label class="control-label" for="prediction">我的预测</label>
          <textarea id="prediction" aria-label="写下你的预测" placeholder="哪一种更可能绕地球？为什么？"></textarea>
        </div>
        <div class="cluster">
          <button id="launch" class="button-primary" type="button">发射</button>
          <button id="reset" class="button-quiet" type="button">重置轨迹</button>
        </div>
      </aside>
    </section>
  </main>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  if (!window.Lec || !window.Deck) return;
  Lec.mount({
    index: 1,
    kicker: `FIRST GUESS`,
    title: `把同一个物体，分别向上、向旁边和斜上方发射`,
    take: `能不能绕地球，不由“飞得够不够高”决定，而由速度与方向共同决定。`
  });
  var main = document.getElementById("page-main");
  var mountedHeader = document.getElementById("lec-header");
  var mountedFooter = document.getElementById("lec-footer");
  if (mountedHeader) {
    mountedHeader.className = "page-header";
    var k = mountedHeader.querySelector(".lec-header__kicker");
    var h = mountedHeader.querySelector("h1");
    if (k) k.className = "kicker";
    if (h) h.className = "page-title";
    main.insertBefore(mountedHeader, main.firstChild);
  }
  if (mountedFooter) {
    mountedFooter.className = "page-footer";
    var take = mountedFooter.querySelector(".lec-footer__take");
    var topic = mountedFooter.querySelector(".lec-footer__topic");
    if (take) take.className = "take";
    if (topic) topic.className = "footer-meta";
    main.appendChild(mountedFooter);
  }

  var cv = document.getElementById("orbit-canvas");
  var ctx;
  var earth = { x: 0, y: 0 };
  var body = Lec.K.BODIES.earth;
  var R = Lec.K.R_EARTH;
  var mu = Lec.K.MU_EARTH;
  var pos, vel, trail, running, elapsed, outcome, dragging;
  var speed = document.getElementById("speed");
  var angle = document.getElementById("angle");
  var mode = document.getElementById("mode");
  var speedOut = document.getElementById("speed-readout");
  var angleOut = document.getElementById("angle-readout");
  var speedNow = document.getElementById("current-speed");
  var distanceNow = document.getElementById("current-distance");
  var result = document.getElementById("result");
  var scale = Lec.K.KM / Lec.K.TEN;
  var maxSpeed = Lec.K.TYPICAL_ESCAPE_DELTA_V + Lec.K.TYPICAL_LEO_SPEED;

  function launchPoint() { return { x: 0, y: R + Lec.K.THOUSAND * Lec.K.M }; }
  function setReadouts() {
    var v = Math.sqrt(vel.x * vel.x + vel.y * vel.y);
    speedOut.textContent = Lec.P.formatVelocity(Number(speed.value));
    angleOut.textContent = String(angle.value) + "°";
    speedNow.textContent = Lec.P.formatVelocity(v);
    distanceNow.textContent = Lec.P.formatDistance(Math.max(0, Math.sqrt(pos.x * pos.x + pos.y * pos.y) - R));
    result.textContent = outcome || "等待发射";
  }
  function setVelocity() {
    var a = Number(angle.value) * Lec.K.DEG_TO_RAD;
    var v = Number(speed.value);
    vel = { x: v * Math.cos(a), y: v * Math.sin(a) };
    setReadouts(); draw();
  }
  function reset() {
    pos = launchPoint(); trail = []; running = false; elapsed = 0; outcome = "等待发射";
    setVelocity();
  }
  function accel(p) {
    var r = Math.sqrt(p.x * p.x + p.y * p.y);
    var f = -mu / (r * r * r);
    return { x: p.x * f, y: p.y * f };
  }
  function step(dt) {
    var a = accel(pos);
    var p2 = { x: pos.x + vel.x * dt * Lec.K.HALF, y: pos.y + vel.y * dt * Lec.K.HALF };
    var v2 = { x: vel.x + a.x * dt * Lec.K.HALF, y: vel.y + a.y * dt * Lec.K.HALF };
    var a2 = accel(p2);
    var p3 = { x: pos.x + v2.x * dt * Lec.K.HALF, y: pos.y + v2.y * dt * Lec.K.HALF };
    var v3 = { x: vel.x + a2.x * dt * Lec.K.HALF, y: vel.y + a2.y * dt * Lec.K.HALF };
    var a3 = accel(p3);
    var p4 = { x: pos.x + v3.x * dt, y: pos.y + v3.y * dt };
    var v4 = { x: vel.x + a3.x * dt, y: vel.y + a3.y * dt };
    var a4 = accel(p4);
    pos.x += dt * (vel.x + Lec.K.TWO * v2.x + Lec.K.TWO * v3.x + v4.x) / Lec.K.SIX;
    pos.y += dt * (vel.y + Lec.K.TWO * v2.y + Lec.K.TWO * v3.y + v4.y) / Lec.K.SIX;
    vel.x += dt * (a.x + Lec.K.TWO * a2.x + Lec.K.TWO * a3.x + a4.x) / Lec.K.SIX;
    vel.y += dt * (a.y + Lec.K.TWO * a2.y + Lec.K.TWO * a3.y + a4.y) / Lec.K.SIX;
    elapsed += dt;
  }
  function classify() {
    var r = Math.sqrt(pos.x * pos.x + pos.y * pos.y);
    var energy = Lec.P.specificOrbitalEnergy(r, Math.sqrt(vel.x * vel.x + vel.y * vel.y), mu);
    if (r <= R) return "撞回地面";
    if (r > R * Lec.K.TEN || (energy > 0 && r > R * Lec.K.FOUR)) return "离开地球附近";
    if (elapsed > Lec.K.THOUSAND * Lec.K.TEN) return "围绕地球运动";
    return "";
  }
  function draw() {
    if (!ctx) return;
    var w = cv.__w, h = cv.__h, cx = w * 0.48, cy = h * 0.52, er = Math.min(w, h) * 0.22;
    ctx.clearRect(0, 0, w, h); earth = { x: cx, y: cy };
    ctx.fillStyle = Deck.rgba("--accent-blue", 0.08); ctx.beginPath(); ctx.arc(cx, cy, er * 1.38, 0, Lec.K.TWO_PI); ctx.fill();
    ctx.strokeStyle = Deck.rgba("--line-strong", 0.7); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, er * 1.38, 0, Lec.K.TWO_PI); ctx.stroke();
    ctx.fillStyle = Deck.rgba("--accent-blue", 0.85); ctx.beginPath(); ctx.arc(cx, cy, er, 0, Lec.K.TWO_PI); ctx.fill();
    ctx.strokeStyle = Deck.rgba("--accent-blue", 0.55); ctx.beginPath(); ctx.arc(cx, cy, er * 0.72, 0, Lec.K.TWO_PI); ctx.stroke();
    ctx.strokeStyle = Deck.rgba("--ink", 0.42); ctx.beginPath(); ctx.moveTo(cx-er, cy); ctx.lineTo(cx+er, cy); ctx.stroke();
    var lp = { x: cx, y: cy - er };
    if (trail.length > 1) { ctx.strokeStyle = Deck.rgba(outcome === "撞回地面" ? "--danger" : outcome === "离开地球附近" ? "--accent-warm" : "--accent", 0.9); ctx.lineWidth = 3; ctx.beginPath(); trail.forEach(function (p, i) { if (i) ctx.lineTo(cx + p.x / R * er, cy - p.y / R * er); else ctx.moveTo(cx + p.x / R * er, cy - p.y / R * er); }); ctx.stroke(); }
    var pp = { x: cx + pos.x / R * er, y: cy - pos.y / R * er };
    ctx.fillStyle = Deck.rgba("--ink-strong", 1); ctx.beginPath(); ctx.arc(pp.x, pp.y, 7, 0, Lec.K.TWO_PI); ctx.fill();
    ctx.strokeStyle = Deck.rgba("--accent-warm", 1); ctx.lineWidth = 5; var a = Number(angle.value) * Lec.K.DEG_TO_RAD; var al = Number(speed.value) / scale; Deck.arrow(ctx, lp.x, lp.y, lp.x + Math.cos(a)*al, lp.y - Math.sin(a)*al, 12);
    ctx.fillStyle = Deck.rgba("--ink-muted", 1); ctx.font = "16px " + Deck.token("--font-mono"); ctx.fillText("地心", cx - 20, cy + er + 28); ctx.fillText("拖动箭头", lp.x + 22, lp.y - 18);
  }
  function animate(dt) {
    if (running) { var i; for (i = 0; i < Lec.K.TEN; i += Lec.K.ONE) { step(Lec.K.TEN); trail.push({x:pos.x,y:pos.y}); if (trail.length > Lec.K.THOUSAND) trail.shift(); var c = classify(); if (c) { outcome = c; running = false; break; } } setReadouts(); draw(); }
  }
  Deck.autofit(cv, function (c) { ctx = c; draw(); });
  Deck.loop(animate, { still: 0 });
  mode.addEventListener("change", function () { angle.value = mode.value === "up" ? "90" : mode.value === "diag" ? "45" : "0"; speed.value = String(Math.round(Number(speed.value) || Lec.K.TYPICAL_LEO_SPEED)); setVelocity(); });
  speed.addEventListener("input", setVelocity); angle.addEventListener("input", setVelocity);
  document.getElementById("launch").addEventListener("click", function () { pos = launchPoint(); trail = []; elapsed = 0; outcome = "进行中"; running = true; setReadouts(); });
  document.getElementById("reset").addEventListener("click", reset);
  cv.addEventListener("pointerdown", function (e) { var p = Deck.pt(cv, e), lp = {x:cv.__w*0.48, y:cv.__h*0.52-Math.min(cv.__w,cv.__h)*0.22}; if (Math.hypot(p.x-lp.x,p.y-lp.y) < 130) { dragging = true; cv.setPointerCapture(e.pointerId); } });
  cv.addEventListener("pointermove", function (e) { if (!dragging) return; var p = Deck.pt(cv,e), lp={x:cv.__w*0.48,y:cv.__h*0.52-Math.min(cv.__w,cv.__h)*0.22}, dx=p.x-lp.x, dy=lp.y-p.y, v=Math.min(maxSpeed, Math.max(0, Math.hypot(dx,dy)*scale)); speed.value=String(Math.round(v / (Lec.K.HUNDRED) ) * Lec.K.HUNDRED); angle.value=String(Math.round(Math.max(-90,Math.min(90,Math.atan2(dy,dx)/Lec.K.DEG_TO_RAD)))); setVelocity(); });
  cv.addEventListener("pointerup", function () { dragging = false; }); cv.addEventListener("pointercancel", function () { dragging = false; });
  reset();
});
</script>
</body>
</html>
