<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="02" data-total="20">
  <div id="stage">
    <main class="page">
      <header id="lec-header" class="lec-header"></header>

      <section class="page-body split min0" aria-label="牛顿炮实验">
        <figure id="scene-shell" class="visual-shell min0" aria-label="可拖动旋转的炮台地球三维场景">
        </figure>

        <aside class="panel min0 stack-3" aria-label="发射控制与测量">
          <div class="stack-2">
            <h3 class="panel-title">让炮弹错过地面</h3>
            <p class="panel-description">改变炮口方向和初速度，再发射。轨迹由地心引力逐步算出；拖动左侧场景可换观察方向。</p>
          </div>

          <div class="callout">
            <span class="callout-title">引导问题</span>
            <p>从离开发射台到绕行或撞地，炮弹是否一直受重力？</p>
          </div>

          <div class="control-row">
            <label class="control-label" for="angle">炮口方向</label>
            <input id="angle" type="range" aria-describedby="angle-value">
            <output id="angle-value" class="control-value" for="angle"></output>
          </div>

          <div class="control-row">
            <label class="control-label" for="speed">初速度</label>
            <input id="speed" type="range" aria-describedby="speed-value">
            <output id="speed-value" class="control-value" for="speed"></output>
          </div>

          <div class="cluster">
            <label class="switch" for="flat-view">
              <input id="flat-view" type="checkbox">
              <span class="switch-track" aria-hidden="true"></span>
              <span>隐藏地球曲率</span>
            </label>
            <button id="launch" class="button-primary" type="button">发射</button>
          </div>

          <div id="status" class="status" role="status" aria-live="polite"><span class="dot"></span><span id="status-text">待发：先设定速度与方向</span></div>

          <div class="readout-grid" aria-label="本次发射记录">
            <div class="readout">
              <span class="readout-label">初始速度</span>
              <strong id="m-speed" class="readout-value">—</strong>
            </div>
            <div class="readout is-blue">
              <span class="readout-label">飞行时间</span>
              <strong id="m-time" class="readout-value">—</strong>
            </div>
            <div class="readout">
              <span class="readout-label">最近点高度</span>
              <strong id="m-near" class="readout-value">—</strong>
            </div>
            <div class="readout is-warm">
              <span class="readout-label">最远点高度</span>
              <strong id="m-far" class="readout-value">—</strong>
            </div>
          </div>
        </aside>
      </section>

      <footer id="lec-footer" class="lec-footer"></footer>
    </main>

    <script src="assets/lib/three.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        'use strict';

        Lec.mount({
          index: 2,
          kicker: `MISS THE GROUND`,
          title: `不是不掉下去，而是每次都错过地面`,
          take: `轨道物体一直在掉落，只是地球表面同时向下弯走了。`
        });

        var K = Lec.K;
        var P = Lec.P;
        var shell = document.getElementById('scene-shell');
        var angleInput = document.getElementById('angle');
        var speedInput = document.getElementById('speed');
        var flatInput = document.getElementById('flat-view');
        var launchButton = document.getElementById('launch');
        var angleValue = document.getElementById('angle-value');
        var speedValue = document.getElementById('speed-value');
        var status = document.getElementById('status');
        var statusText = document.getElementById('status-text');
        var metricSpeed = document.getElementById('m-speed');
        var metricTime = document.getElementById('m-time');
        var metricNear = document.getElementById('m-near');
        var metricFar = document.getElementById('m-far');

        var earthRadius = K.R_EARTH;
        var mu = K.MU_EARTH;
        var launchAltitude = K.LOW_EARTH_ORBIT_ALTITUDE;
        var launchRadius = P.radiusAtAltitude(launchAltitude);
        var circularSpeed = P.circularVelocity(launchRadius, mu);
        var escapeSpeed = P.escapeVelocity(launchRadius, mu);
        var earthSceneRadius = K.TWO + K.ONE / K.FOUR;
        var sceneScale = earthSceneRadius / earthRadius;
        var flatScale = K.ONE / (earthRadius / K.SIX);
        var fixedStep = K.TWO;
        var simulationRate = K.THOUSAND;
        var maxFlightTime = P.orbitalPeriod(launchRadius, mu) * K.TWO;
        var state = null;
        var running = false;
        var accumulator = K.ZERO;
        var tracePhysics = [];
        var traceCounter = K.ZERO;
        var flatMode = false;

        angleInput.min = String(-K.TEN);
        angleInput.max = String(K.THREE * K.TEN);
        angleInput.step = String(K.ONE);
        angleInput.value = String(K.ZERO);
        speedInput.min = String(K.ZERO);
        speedInput.max = String(Math.round(escapeSpeed));
        speedInput.step = String(K.HUNDRED);
        speedInput.value = String(Math.round(circularSpeed));

        function themeColor(name) {
          var c = Deck.rgb(name);
          return new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255);
        }

        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(K.THREE * K.TEN + K.TEN + K.FOUR + K.ONE, K.ONE, K.ONE / K.TEN, K.HUNDRED);
        camera.position.set(K.ZERO, K.ZERO, K.TEN);
        var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.domElement.className = 'cv-fill no-pan';
        renderer.domElement.setAttribute('aria-label', '拖动旋转炮台地球；聚焦后可用方向键旋转');
        renderer.domElement.setAttribute('role', 'application');
        renderer.domElement.setAttribute('tabindex', '0');
        shell.appendChild(renderer.domElement);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.setClearColor(themeColor('surface-inset'), K.ONE);

        var world = new THREE.Group();
        scene.add(world);
        var earthGroup = new THREE.Group();
        world.add(earthGroup);

        var earth = new THREE.Mesh(
          new THREE.SphereGeometry(earthSceneRadius, K.SIX * K.EIGHT, K.THREE * K.EIGHT),
          new THREE.MeshPhongMaterial({
            color: themeColor('surface-3'),
            emissive: themeColor('surface-1'),
            shininess: K.TEN
          })
        );
        earthGroup.add(earth);

        var wire = new THREE.Mesh(
          new THREE.SphereGeometry(earthSceneRadius * (K.ONE + K.ONE / K.HUNDRED), K.SIX * K.EIGHT, K.THREE * K.EIGHT),
          new THREE.MeshBasicMaterial({
            color: themeColor('accent-blue'),
            wireframe: true,
            transparent: true,
            opacity: K.ONE / K.TEN
          })
        );
        earthGroup.add(wire);

        var atmosphere = new THREE.Mesh(
          new THREE.SphereGeometry(earthSceneRadius * (K.ONE + K.ONE / (K.TEN * K.TEN)), K.SIX * K.EIGHT, K.THREE * K.EIGHT),
          new THREE.MeshBasicMaterial({
            color: themeColor('accent-blue'),
            transparent: true,
            opacity: K.ONE / (K.TEN * K.TWO),
            side: THREE.BackSide
          })
        );
        earthGroup.add(atmosphere);

        var plane = new THREE.Mesh(
          new THREE.BoxGeometry(K.TEN * K.TWO, K.ONE / K.TEN, K.TEN),
          new THREE.MeshPhongMaterial({ color: themeColor('surface-3') })
        );
        plane.position.y = -K.TWO;
        plane.visible = false;
        world.add(plane);

        var cannon = new THREE.Group();
        world.add(cannon);
        var base = new THREE.Mesh(
          new THREE.SphereGeometry(K.ONE / K.TEN, K.TEN + K.SIX, K.EIGHT),
          new THREE.MeshPhongMaterial({ color: themeColor('accent-warm') })
        );
        cannon.add(base);
        var barrel = new THREE.Mesh(
          new THREE.CylinderGeometry(K.ONE / (K.TEN * K.TWO), K.ONE / K.TEN, K.HALF, K.TEN + K.SIX),
          new THREE.MeshPhongMaterial({ color: themeColor('accent-warm') })
        );
        barrel.position.y = K.ONE / K.FOUR;
        cannon.add(barrel);

        var ball = new THREE.Mesh(
          new THREE.SphereGeometry(K.ONE / K.TEN, K.TEN + K.SIX, K.TEN + K.SIX),
          new THREE.MeshPhongMaterial({ color: themeColor('accent') })
        );
        world.add(ball);

        var impact = new THREE.Mesh(
          new THREE.RingGeometry(K.ONE / K.TEN, K.ONE / K.FOUR, K.THREE * K.EIGHT),
          new THREE.MeshBasicMaterial({ color: themeColor('danger'), side: THREE.DoubleSide })
        );
        impact.visible = false;
        world.add(impact);

        var traceGeometry = new THREE.BufferGeometry();
        var traceMaterial = new THREE.LineBasicMaterial({ color: themeColor('accent'), transparent: true, opacity: K.ONE - K.ONE / K.TEN });
        var traceLine = new THREE.Line(traceGeometry, traceMaterial);
        world.add(traceLine);

        scene.add(new THREE.HemisphereLight(themeColor('ink-strong'), themeColor('surface-inset'), K.ONE));
        var keyLight = new THREE.DirectionalLight(themeColor('accent-blue'), K.TWO);
        keyLight.position.set(K.FOUR, K.SIX, K.EIGHT);
        scene.add(keyLight);

        function sizeScene() {
          var w = shell.offsetWidth;
          var h = shell.offsetHeight;
          if (!w || !h) return;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.render(scene, camera);
        }
        Deck.onResize(sizeScene);

        function angleRadians() {
          return P.degreesToRadians(Number(angleInput.value));
        }

        function updateControls() {
          angleValue.textContent = P.formatNumber(Number(angleInput.value), K.ZERO) + '°';
          speedValue.textContent = P.formatVelocity(Number(speedInput.value));
          cannon.rotation.z = -angleRadians();
          if (!running) positionAtLaunch();
          renderer.render(scene, camera);
        }

        function positionAtLaunch() {
          if (flatMode) {
            cannon.position.set(-K.FOUR, -K.TWO + K.ONE / K.TEN, K.ZERO);
            ball.position.set(-K.FOUR, -K.TWO + launchAltitude * flatScale, K.ZERO);
          } else {
            cannon.position.set(launchRadius * sceneScale, K.ZERO, K.ZERO);
            ball.position.copy(cannon.position);
          }
        }

        function setStatus(text, kind) {
          statusText.textContent = text;
          status.className = 'status' + (kind ? ' ' + kind : '');
        }

        function clearTrace() {
          tracePhysics = [];
          traceGeometry.setFromPoints([]);
          impact.visible = false;
        }

        function mapPoint(point) {
          if (flatMode) {
            return new THREE.Vector3(-K.FOUR + point.x * flatScale, -K.TWO + point.y * flatScale, K.ZERO);
          }
          return new THREE.Vector3(point.x * sceneScale, point.y * sceneScale, K.ZERO);
        }

        function refreshTrace() {
          var points = tracePhysics.map(mapPoint);
          traceGeometry.setFromPoints(points);
          traceGeometry.computeBoundingSphere();
        }

        function sphericalApsides(s) {
          var radius = Math.sqrt(s.x * s.x + s.y * s.y);
          var speed = Math.sqrt(s.vx * s.vx + s.vy * s.vy);
          var h = Math.abs(s.x * s.vy - s.y * s.vx);
          var eccentricity = P.eccentricityFromState(radius, speed, h, mu);
          var periRadius = h * h / (mu * (K.ONE + eccentricity));
          var apoRadius = eccentricity < K.ONE ? h * h / (mu * (K.ONE - eccentricity)) : Infinity;
          return {
            near: P.altitudeFromRadius(periRadius),
            far: apoRadius === Infinity ? Infinity : P.altitudeFromRadius(apoRadius)
          };
        }

        function updateMetrics() {
          if (!state) return;
          metricSpeed.textContent = P.formatVelocity(state.initialSpeed);
          metricTime.textContent = P.formatTime(state.time);
          if (flatMode) {
            metricNear.textContent = P.formatDistance(state.minHeight);
            metricFar.textContent = P.formatDistance(state.maxHeight);
          } else {
            var apsides = sphericalApsides(state);
            metricNear.textContent = P.formatDistance(apsides.near);
            metricFar.textContent = apsides.far === Infinity ? '开放轨迹' : P.formatDistance(apsides.far);
          }
        }

        function beginLaunch() {
          var speed = P.clamp(Number(speedInput.value), K.ZERO, escapeSpeed);
          var angle = angleRadians();
          flatMode = flatInput.checked;
          clearTrace();
          accumulator = K.ZERO;
          traceCounter = K.ZERO;
          if (flatMode) {
            state = {
              x: K.ZERO,
              y: launchAltitude,
              vx: speed * Math.cos(angle),
              vy: speed * Math.sin(angle),
              time: K.ZERO,
              initialSpeed: speed,
              minHeight: launchAltitude,
              maxHeight: launchAltitude
            };
          } else {
            state = {
              x: launchRadius,
              y: K.ZERO,
              vx: speed * Math.sin(angle),
              vy: speed * Math.cos(angle),
              time: K.ZERO,
              initialSpeed: speed,
              minHeight: launchAltitude,
              maxHeight: launchAltitude
            };
          }
          tracePhysics.push({ x: state.x, y: state.y });
          running = true;
          setStatus(flatMode ? '平面视图：同样初速度，地面不再弯走' : '飞行中：重力始终指向地心', 'is-active');
          updateMetrics();
          if (Deck.reduced()) {
            var guard = K.ZERO;
            while (running && guard < K.THOUSAND * K.TEN) {
              integrate(fixedStep);
              guard += K.ONE;
            }
            refreshTrace();
            drawState();
          }
        }

        function acceleration(x, y) {
          var r2 = x * x + y * y;
          var r = Math.sqrt(r2);
          var factor = -mu / (r2 * r);
          return { x: factor * x, y: factor * y };
        }

        function integrate(dt) {
          if (!running || !state) return;
          if (flatMode) {
            state.x += state.vx * dt;
            state.y += state.vy * dt;
            state.vy -= K.EARTH_SURFACE_GRAVITY * dt;
          } else {
            var a0 = acceleration(state.x, state.y);
            state.x += state.vx * dt + a0.x * dt * dt * K.HALF;
            state.y += state.vy * dt + a0.y * dt * dt * K.HALF;
            var a1 = acceleration(state.x, state.y);
            state.vx += (a0.x + a1.x) * dt * K.HALF;
            state.vy += (a0.y + a1.y) * dt * K.HALF;
          }
          state.time += dt;
          var height = flatMode ? state.y : P.altitudeFromRadius(Math.sqrt(state.x * state.x + state.y * state.y));
          state.minHeight = Math.min(state.minHeight, height);
          state.maxHeight = Math.max(state.maxHeight, height);
          traceCounter += K.ONE;
          if (traceCounter >= K.FOUR + K.ONE || tracePhysics.length < K.TEN) {
            tracePhysics.push({ x: state.x, y: state.y });
            traceCounter = K.ZERO;
          }

          if ((flatMode && state.y <= K.ZERO) || (!flatMode && height <= K.ZERO)) {
            finishImpact();
            return;
          }

          if (!flatMode) {
            var dx = state.x - launchRadius;
            var dy = state.y;
            var returnDistance = Math.sqrt(dx * dx + dy * dy);
            if (state.time > P.orbitalPeriod(launchRadius, mu) * K.HALF && returnDistance < launchAltitude) {
              running = false;
              setStatus('成功：绕行一周，再次回到发射区域', 'is-success');
            }
          }

          if (state.time >= maxFlightTime) {
            running = false;
            setStatus('观测结束：炮弹没有在时限内回到发射区', 'is-warm');
          }
        }

        function finishImpact() {
          running = false;
          if (flatMode) state.y = K.ZERO;
          var point = mapPoint(state);
          impact.position.copy(point);
          if (!flatMode) {
            impact.lookAt(K.ZERO, K.ZERO, K.ZERO);
          } else {
            impact.rotation.set(-K.HALF_PI, K.ZERO, K.ZERO);
          }
          impact.visible = true;
          setStatus('撞地：红圈标出撞击点', 'is-danger');
          updateMetrics();
        }

        function drawState() {
          if (state) ball.position.copy(mapPoint(state));
          refreshTrace();
          updateMetrics();
          renderer.render(scene, camera);
        }

        function changeMode() {
          running = false;
          state = null;
          flatMode = flatInput.checked;
          earthGroup.visible = !flatMode;
          plane.visible = flatMode;
          clearTrace();
          positionAtLaunch();
          metricSpeed.textContent = '—';
          metricTime.textContent = '—';
          metricNear.textContent = '—';
          metricFar.textContent = '—';
          setStatus(flatMode ? '平面已展开：地面不再向下弯曲' : '曲率已恢复：地面会沿球面弯走', flatMode ? 'is-warm' : '');
          renderer.render(scene, camera);
        }

        angleInput.addEventListener('input', updateControls);
        speedInput.addEventListener('input', updateControls);
        flatInput.addEventListener('change', changeMode);
        launchButton.addEventListener('click', beginLaunch);

        var dragging = false;
        var previous = null;
        renderer.domElement.addEventListener('pointerdown', function (event) {
          dragging = true;
          previous = Deck.pt(renderer.domElement, event);
          renderer.domElement.setPointerCapture(event.pointerId);
        });
        renderer.domElement.addEventListener('pointermove', function (event) {
          if (!dragging) return;
          var point = Deck.pt(renderer.domElement, event);
          world.rotation.y += (point.x - previous.x) / (K.HUNDRED * K.TWO);
          world.rotation.x += (point.y - previous.y) / (K.HUNDRED * K.TWO);
          world.rotation.x = P.clamp(world.rotation.x, -K.HALF_PI, K.HALF_PI);
          previous = point;
          renderer.render(scene, camera);
        });
        renderer.domElement.addEventListener('pointerup', function (event) {
          dragging = false;
          previous = null;
          renderer.domElement.releasePointerCapture(event.pointerId);
        });
        renderer.domElement.addEventListener('pointercancel', function () {
          dragging = false;
          previous = null;
        });
        renderer.domElement.addEventListener('keydown', function (event) {
          var turn = K.ONE / K.TEN;
          if (event.key === 'ArrowLeft') world.rotation.y -= turn;
          else if (event.key === 'ArrowRight') world.rotation.y += turn;
          else if (event.key === 'ArrowUp') world.rotation.x = P.clamp(world.rotation.x - turn, -K.HALF_PI, K.HALF_PI);
          else if (event.key === 'ArrowDown') world.rotation.x = P.clamp(world.rotation.x + turn, -K.HALF_PI, K.HALF_PI);
          else return;
          event.preventDefault();
          renderer.render(scene, camera);
        });

        positionAtLaunch();
        updateControls();
        sizeScene();

        Deck.loop(function (time, dtMilliseconds) {
          if (running) {
            accumulator += dtMilliseconds * simulationRate / K.THOUSAND;
            var safety = K.ZERO;
            while (accumulator >= fixedStep && running && safety < K.HUNDRED) {
              integrate(fixedStep);
              accumulator -= fixedStep;
              safety += K.ONE;
            }
          }
          earth.rotation.y = Deck.reduced() ? K.ZERO : time / (K.THOUSAND * K.TEN);
          drawState();
        }, { still: K.ZERO });
      });
    </script>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
</body>
</html>
