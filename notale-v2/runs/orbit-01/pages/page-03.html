<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="03" data-total="20">
<div id="stage">
  <main class="page">
    <header id="lec-header"></header>

    <section class="page-body split min0" aria-label="自由落体舱内实验">
      <figure class="visual-shell min0" aria-label="可旋转的透明舱体；拖动舱内小球改变释放位置">
        <canvas id="cabin-canvas" class="cv-fill no-pan" tabindex="0" aria-label="透明舱体三维模拟。拖动空白处旋转舱体，拖动小球改变释放位置；方向键可旋转。"></canvas>
      </figure>

      <aside class="panel control-panel min0" aria-label="实验控制与测量">
        <div class="panel-heading">
          <h2 class="panel-title">舱内测量</h2>
          <p class="panel-description">重力按当前位置计算；秤只测舱壁施加的支撑约束。</p>
        </div>

        <div class="control-group">
          <label class="caption muted" for="flight-mode">飞行状态</label>
          <select id="flight-mode">
            <option value="engine">发动机推力</option>
            <option value="coast">关闭推力</option>
            <option value="orbit" selected>轨道自由飞行</option>
          </select>
        </div>

        <div class="control-group">
          <label class="caption muted" for="release-height">小球释放位置（滑块是画布拖动的键盘等价操作）</label>
          <input id="release-height" type="range">
        </div>

        <div class="readout-grid is-three" aria-label="实时读数">
          <div class="readout">
            <span class="caption muted">当地重力</span>
            <strong id="gravity-value" class="readout-value"></strong>
          </div>
          <div class="readout is-warm">
            <span class="caption muted">重力作用</span>
            <strong id="weight-value" class="readout-value"></strong>
          </div>
          <div class="readout is-blue">
            <span class="caption muted">弹簧秤</span>
            <strong id="scale-value" class="readout-value"></strong>
          </div>
        </div>

        <div class="callout">
          <span class="callout-title">相对运动</span>
          <p id="relative-status">飞船、宇航员和小球一起受地心引力，相对加速度接近零。</p>
        </div>

        <div class="control-group" aria-labelledby="question-label">
          <span id="question-label" class="caption">关闭发动机后，重力还在不在？</span>
          <button id="verdict" class="button-primary" draggable="true" aria-label="还在。拖入重力或支撑力区域；键盘用左右方向键选择。">还在：拖入正确区域</button>
          <div class="grid-2" aria-label="判断区域">
            <div id="gravity-zone" class="readout"><span class="caption muted">重力</span><strong class="readout-value">持续存在</strong></div>
            <div id="support-zone" class="readout"><span class="caption muted">支撑力</span><strong class="readout-value">可变为零</strong></div>
          </div>
          <p id="verdict-result" class="caption" aria-live="polite"></p>
        </div>
      </aside>
    </section>

    <footer id="lec-footer"></footer>
  </main>

  <script src="assets/lib/three.min.js"></script>
  <script>
  document.addEventListener("DOMContentLoaded", function () {
    "use strict";

    Lec.mount({
      index: 3,
      kicker: `FALLING TOGETHER`,
      title: `宇航员不是没有重量，而是和飞船一起自由落体`,
      take: `失重感来自缺少支撑力，不是来自重力消失。`
    });

    var K = Lec.K;
    var P = Lec.P;
    var header = document.getElementById("lec-header");
    var footer = document.getElementById("lec-footer");
    header.classList.add("page-header");
    header.querySelector("h1").classList.add("page-title");
    header.querySelector(".lec-header__kicker").classList.add("kicker");
    header.querySelector(".lec-header__index").classList.add("page-number");
    footer.classList.add("page-footer");
    footer.querySelector(".lec-footer__take").classList.add("caption");
    footer.querySelector(".lec-footer__topic").classList.add("footer-meta");

    var canvas = document.getElementById("cabin-canvas");
    var shell = canvas.parentElement;
    var modeControl = document.getElementById("flight-mode");
    var releaseControl = document.getElementById("release-height");
    var gravityValue = document.getElementById("gravity-value");
    var weightValue = document.getElementById("weight-value");
    var scaleValue = document.getElementById("scale-value");
    var relativeStatus = document.getElementById("relative-status");
    var verdict = document.getElementById("verdict");
    var verdictResult = document.getElementById("verdict-result");
    var gravityZone = document.getElementById("gravity-zone");
    var supportZone = document.getElementById("support-zone");

    var maxColor = K.HUNDRED * K.TWO + K.TEN * K.SIX - K.FOUR - K.ONE;
    function themeColor(name) {
      var c = Deck.rgb(name);
      return new THREE.Color(c[K.ZERO] / maxColor, c[K.ONE] / maxColor, c[K.TWO] / maxColor);
    }

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(K.TEN * K.FOUR + K.SIX, K.ONE, K.ONE / K.TEN, K.HUNDRED);
    camera.position.set(K.SIX, K.THREE, K.TEN);
    camera.lookAt(K.ZERO, K.ZERO, K.ZERO);

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(themeColor("--surface-inset"), K.ONE);

    scene.add(new THREE.HemisphereLight(themeColor("--ink-strong"), themeColor("--surface-inset"), K.ONE));
    var keyLight = new THREE.DirectionalLight(themeColor("--accent"), K.TWO);
    keyLight.position.set(K.SIX, K.EIGHT, K.SIX);
    scene.add(keyLight);
    var rimLight = new THREE.DirectionalLight(themeColor("--accent-blue"), K.ONE);
    rimLight.position.set(-K.SIX, K.TWO, -K.FOUR);
    scene.add(rimLight);

    var world = new THREE.Group();
    scene.add(world);

    var cabinWidth = K.FOUR;
    var cabinHeight = K.SIX;
    var cabinDepth = K.FOUR;
    var cabin = new THREE.Group();
    world.add(cabin);

    var glassMaterial = new THREE.MeshPhysicalMaterial({
      color: themeColor("--accent-blue"), transparent: true,
      opacity: K.ONE / K.TEN, roughness: K.ONE / K.TEN,
      metalness: K.ZERO, side: THREE.DoubleSide, depthWrite: false
    });
    var cabinBox = new THREE.Mesh(new THREE.BoxGeometry(cabinWidth, cabinHeight, cabinDepth), glassMaterial);
    cabin.add(cabinBox);
    var edgeMaterial = new THREE.LineBasicMaterial({ color: themeColor("--line-strong"), transparent: true, opacity: K.ONE - K.ONE / K.TEN });
    cabin.add(new THREE.LineSegments(new THREE.EdgesGeometry(cabinBox.geometry), edgeMaterial));

    var floorY = -cabinHeight / K.TWO + K.HALF;
    var floor = new THREE.Mesh(
      new THREE.BoxGeometry(cabinWidth - K.HALF, K.ONE / K.TEN, cabinDepth - K.HALF),
      new THREE.MeshStandardMaterial({ color: themeColor("--surface-3"), metalness: K.HALF, roughness: K.HALF })
    );
    floor.position.y = floorY - K.ONE / K.TEN;
    cabin.add(floor);

    var earth = new THREE.Mesh(
      new THREE.SphereGeometry(K.TEN, K.TEN * K.THREE, K.TEN + K.SIX),
      new THREE.MeshStandardMaterial({ color: themeColor("--accent-blue"), transparent: true, opacity: K.ONE / K.TEN + K.ONE / K.TEN, roughness: K.ONE })
    );
    earth.position.set(K.ZERO, -K.TEN - K.SIX, -K.SIX);
    world.add(earth);

    var astronaut = new THREE.Group();
    cabin.add(astronaut);
    var suitMaterial = new THREE.MeshStandardMaterial({ color: themeColor("--ink-strong"), roughness: K.HALF });
    var visorMaterial = new THREE.MeshStandardMaterial({ color: themeColor("--accent-warm"), metalness: K.HALF, roughness: K.ONE / K.TEN });
    var torso = new THREE.Mesh(new THREE.CylinderGeometry(K.HALF, K.HALF + K.ONE / K.TEN, K.ONE + K.HALF, K.TEN + K.SIX), suitMaterial);
    torso.position.y = K.ONE;
    astronaut.add(torso);
    var head = new THREE.Mesh(new THREE.SphereGeometry(K.HALF, K.TEN + K.SIX, K.TEN), visorMaterial);
    head.position.y = K.TWO;
    astronaut.add(head);
    var limbGeometry = new THREE.CylinderGeometry(K.ONE / K.TEN, K.ONE / K.TEN, K.ONE + K.ONE / K.TEN, K.TEN);
    [-(K.HALF + K.ONE / K.TEN), K.HALF + K.ONE / K.TEN].forEach(function (x) {
      var arm = new THREE.Mesh(limbGeometry, suitMaterial);
      arm.position.set(x, K.ONE, K.ZERO);
      arm.rotation.z = x < K.ZERO ? -K.HALF : K.HALF;
      astronaut.add(arm);
      var leg = new THREE.Mesh(limbGeometry, suitMaterial);
      leg.position.set(x / K.TWO, K.ONE / K.TEN, K.ZERO);
      astronaut.add(leg);
    });
    astronaut.scale.setScalar(K.HALF + K.ONE / K.TEN);
    astronaut.position.x = -K.ONE;

    var ball = new THREE.Mesh(
      new THREE.SphereGeometry(K.ONE / K.FOUR, K.TEN + K.SIX, K.TEN),
      new THREE.MeshStandardMaterial({ color: themeColor("--accent"), roughness: K.ONE / K.TEN, metalness: K.HALF })
    );
    cabin.add(ball);

    var scaleGroup = new THREE.Group();
    cabin.add(scaleGroup);
    var scaleBody = new THREE.Mesh(
      new THREE.BoxGeometry(K.ONE + K.HALF, K.ONE / K.FOUR, K.ONE),
      new THREE.MeshStandardMaterial({ color: themeColor("--accent-warm"), metalness: K.HALF, roughness: K.HALF })
    );
    scaleBody.position.set(-K.ONE, floorY, K.ZERO);
    scaleGroup.add(scaleBody);
    var springPoints = [];
    for (var si = K.ZERO; si <= K.TEN * K.TWO; si += K.ONE) {
      springPoints.push(new THREE.Vector3(
        -K.ONE + Math.sin(si * K.PI / K.TWO) / K.TEN,
        floorY + K.ONE / K.TEN + si / (K.TEN * K.TWO) * K.HALF,
        K.ZERO
      ));
    }
    var spring = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(springPoints),
      new THREE.LineBasicMaterial({ color: themeColor("--accent-warm") })
    );
    scaleGroup.add(spring);

    var altitude = K.ISS_ALTITUDE;
    var baseRadius = P.radiusAtAltitude(altitude);
    var astroMass = K.HUNDRED - K.TEN * K.THREE;
    var mode = modeControl.value;
    var cabinRadius = baseRadius;
    var cabinVelocity = K.ZERO;
    var astroRadius = baseRadius;
    var astroVelocity = K.ZERO;
    var ballRadius = baseRadius + K.ONE;
    var ballVelocity = K.ZERO;
    var ballX = K.ONE;
    var supportForce = K.ZERO;
    var previousRelativeVelocity = K.ZERO;
    var relativeAcceleration = K.ZERO;
    var dragging = "";
    var lastPointer = null;
    var released = true;
    var yaw = -K.ONE / K.TEN;
    var pitch = K.ONE / K.TEN;

    releaseControl.min = String(floorY + K.HALF);
    releaseControl.max = String(cabinHeight / K.TWO - K.HALF);
    releaseControl.step = String(K.ONE / K.TEN);
    releaseControl.value = String(K.ONE);

    function setBallRelease(relativeY) {
      var y = P.clamp(relativeY, floorY + K.HALF, cabinHeight / K.TWO - K.HALF);
      ballRadius = cabinRadius + y;
      ballVelocity = cabinVelocity;
      released = false;
      releaseControl.value = String(y);
    }

    function resetState() {
      cabinRadius = baseRadius;
      cabinVelocity = K.ZERO;
      astroRadius = baseRadius + floorY + K.HALF;
      astroVelocity = K.ZERO;
      previousRelativeVelocity = K.ZERO;
      relativeAcceleration = K.ZERO;
      setBallRelease(Number(releaseControl.value));
      released = true;
    }

    function updateReadouts(localGravity) {
      var gravityForce = P.weight(astroMass, localGravity);
      gravityValue.textContent = P.formatNumber(localGravity) + " m/s²";
      weightValue.textContent = P.formatNumber(gravityForce) + " N";
      scaleValue.textContent = P.formatNumber(supportForce) + " N";
      if (mode === "engine") {
        relativeStatus.textContent = "发动机使舱体获得非自由落体加速度；接触约束恢复，秤重新有读数。";
      } else {
        relativeStatus.textContent = "相邻帧算得舱内相对加速度 " + P.formatNumber(relativeAcceleration) + " m/s²；共同下落时接近零。";
      }
    }

    function physics(dt) {
      var gCabin = P.gravityAtRadius(cabinRadius);
      var thrustAcceleration = mode === "engine" ? gCabin : K.ZERO;
      var cabinAcceleration = -gCabin + thrustAcceleration;
      cabinVelocity += cabinAcceleration * dt;
      cabinRadius += cabinVelocity * dt;

      var astroFreeAcceleration = -P.gravityAtRadius(astroRadius);
      var requiredConstraint = astroMass * (cabinAcceleration - astroFreeAcceleration);
      if (mode === "engine") {
        astroRadius = cabinRadius + floorY + K.HALF;
        astroVelocity = cabinVelocity;
        supportForce = Math.max(K.ZERO, requiredConstraint);
      } else {
        astroVelocity += astroFreeAcceleration * dt;
        astroRadius += astroVelocity * dt;
        supportForce = K.ZERO;
      }

      if (released) {
        var ballAcceleration = -P.gravityAtRadius(ballRadius);
        ballVelocity += ballAcceleration * dt;
        ballRadius += ballVelocity * dt;
        if (mode === "engine" && ballRadius - cabinRadius < floorY + K.ONE / K.FOUR) {
          ballRadius = cabinRadius + floorY + K.ONE / K.FOUR;
          ballVelocity = cabinVelocity;
        }
      }

      var relativeVelocity = (astroVelocity - cabinVelocity);
      relativeAcceleration = (relativeVelocity - previousRelativeVelocity) / Math.max(dt, K.ONE / (K.HUNDRED * K.TEN));
      previousRelativeVelocity = relativeVelocity;
    }

    function resizeRenderer() {
      var w = shell.clientWidth;
      var h = shell.clientHeight;
      renderer.setPixelRatio(Deck.ratio());
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    function renderFrame(t, dtMilliseconds) {
      var dt = Math.min(dtMilliseconds / K.THOUSAND, K.ONE / (K.TEN * K.TWO));
      if (dt > K.ZERO) physics(dt);

      astronaut.position.y = astroRadius - cabinRadius;
      ball.position.set(ballX, ballRadius - cabinRadius, K.HALF);
      if (mode !== "engine") astronaut.rotation.z += dt / K.TEN;
      else astronaut.rotation.z = K.ZERO;
      spring.scale.y = K.ONE - Math.min(K.HALF, supportForce / Math.max(P.weight(astroMass, P.gravityAtRadius(cabinRadius)), K.ONE) / K.TWO);

      cabin.rotation.y = yaw;
      cabin.rotation.x = pitch;
      if (mode === "orbit" && !Deck.reduced() && dragging === "") yaw += dt / (K.TEN * K.TWO);
      earth.rotation.y += mode === "orbit" ? dt / K.TEN : K.ZERO;

      updateReadouts(P.gravityAtRadius(cabinRadius));
      renderer.render(scene, camera);
    }

    function ballScreenPosition() {
      var point = new THREE.Vector3();
      ball.getWorldPosition(point);
      point.project(camera);
      return {
        x: (point.x + K.ONE) * K.HALF * shell.clientWidth,
        y: (K.ONE - point.y) * K.HALF * shell.clientHeight
      };
    }

    canvas.addEventListener("pointerdown", function (event) {
      var p = Deck.pt(canvas, event);
      var bp = ballScreenPosition();
      var hitRadius = Deck.W / (K.HUNDRED * K.TWO);
      dragging = Math.hypot(p.x - bp.x, p.y - bp.y) < hitRadius ? "ball" : "rotate";
      lastPointer = p;
      canvas.setPointerCapture(event.pointerId);
      if (dragging === "ball") released = false;
    });

    canvas.addEventListener("pointermove", function (event) {
      if (!dragging) return;
      var p = Deck.pt(canvas, event);
      if (dragging === "rotate") {
        yaw += (p.x - lastPointer.x) / (Deck.W / K.TWO);
        pitch = P.clamp(pitch + (p.y - lastPointer.y) / (Deck.H / K.TWO), -K.HALF, K.HALF);
      } else {
        var normalized = K.ONE - K.TWO * p.y / shell.clientHeight;
        setBallRelease(normalized * cabinHeight / K.TWO);
      }
      lastPointer = p;
    });

    function releasePointer() {
      if (dragging === "ball") released = true;
      dragging = "";
      lastPointer = null;
    }
    canvas.addEventListener("pointerup", releasePointer);
    canvas.addEventListener("pointercancel", releasePointer);
    canvas.addEventListener("keydown", function (event) {
      var step = K.ONE / K.TEN;
      if (event.key === "ArrowLeft") yaw -= step;
      if (event.key === "ArrowRight") yaw += step;
      if (event.key === "ArrowUp") pitch = P.clamp(pitch - step, -K.HALF, K.HALF);
      if (event.key === "ArrowDown") pitch = P.clamp(pitch + step, -K.HALF, K.HALF);
      if (event.key.indexOf("Arrow") === K.ZERO) event.preventDefault();
    });

    modeControl.addEventListener("change", function () {
      mode = modeControl.value;
      resetState();
    });
    releaseControl.addEventListener("input", function () {
      setBallRelease(Number(releaseControl.value));
    });
    releaseControl.addEventListener("change", function () {
      released = true;
    });

    function answer(target) {
      if (target === "gravity") {
        verdictResult.textContent = "正确：关闭的是推力；重力仍在，消失的是舱壁的支撑。";
        gravityZone.classList.add("is-blue");
        supportZone.classList.remove("is-warm");
      } else {
        verdictResult.textContent = "再观察秤：读数归零说明支撑消失，不代表重力消失。";
        supportZone.classList.add("is-warm");
        gravityZone.classList.remove("is-blue");
      }
    }

    verdict.addEventListener("dragstart", function (event) {
      event.dataTransfer.setData("text/plain", "verdict");
    });
    [gravityZone, supportZone].forEach(function (zone) {
      zone.addEventListener("dragover", function (event) { event.preventDefault(); });
      zone.addEventListener("drop", function (event) {
        event.preventDefault();
        answer(zone === gravityZone ? "gravity" : "support");
      });
    });
    verdict.addEventListener("keydown", function (event) {
      if (event.key === "ArrowLeft") { event.preventDefault(); answer("gravity"); }
      if (event.key === "ArrowRight") { event.preventDefault(); answer("support"); }
    });
    verdict.addEventListener("click", function () { answer("gravity"); });

    resizeRenderer();
    Deck.onResize(resizeRenderer);
    resetState();
    if (Deck.reduced()) {
      physics(K.ONE / (K.TEN * K.TWO));
      renderFrame(K.ZERO, K.ZERO);
    } else {
      Deck.loop(renderFrame);
    }
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
