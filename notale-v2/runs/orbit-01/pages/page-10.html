<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="10" data-total="20">
  <div id="stage">
    <main class="page">
      <header id="lec-header" class="lec-header"></header>

      <section class="page-body split min0" aria-label="速度预算工作台">
        <section class="panel control-panel min0" aria-labelledby="budget-title">
          <div class="panel-header">
            <div class="panel-heading">
              <p class="panel-kicker">MISSION LEDGER</p>
              <h2 id="budget-title" class="panel-title">速度预算栏</h2>
              <p class="panel-description">把损失卡拖到“暂不计入”，就能比较理想模型与真实发射。也可拖回预算栏或重排卡片。</p>
            </div>
            <span id="model-badge" class="status is-active">真实发射模型</span>
          </div>

          <div class="readout-grid is-three" aria-live="polite">
            <div class="readout">
              <span class="caption muted">目标预算</span>
              <strong id="required-value" class="readout-value">—</strong>
            </div>
            <div class="readout is-blue">
              <span class="caption muted">方案可用速度</span>
              <strong id="available-value" class="readout-value">—</strong>
            </div>
            <div id="margin-readout" class="readout">
              <span class="caption muted">余量</span>
              <strong id="margin-value" class="readout-value">—</strong>
            </div>
          </div>

          <div class="grid-2 min0">
            <section id="budget-zone" class="panel panel-inset grid-2 min0" aria-label="已计入预算的卡片">
              <div class="cluster">
                <h3 class="card-title">已计入</h3>
                <span id="rotation-value" class="badge is-success">—</span>
              </div>
              <article class="readout" draggable="true" data-card="orbit" aria-label="获得轨道速度，已计入">
                <span class="caption muted">获得轨道速度</span>
                <strong class="readout-value" data-value="orbit">—</strong>
              </article>
              <article class="readout is-warm" draggable="true" data-card="gravity" aria-label="克服重力损失，已计入">
                <span class="caption muted">克服重力损失</span>
                <strong class="readout-value" data-value="gravity">—</strong>
              </article>
              <article class="readout is-blue" draggable="true" data-card="drag" aria-label="克服阻力损失，已计入">
                <span class="caption muted">克服阻力损失</span>
                <strong class="readout-value" data-value="drag">—</strong>
              </article>
              <article class="readout" draggable="true" data-card="steering" aria-label="转向损失，已计入">
                <span class="caption muted">转向损失</span>
                <strong class="readout-value" data-value="steering">—</strong>
              </article>
            </section>

            <section id="excluded-zone" class="panel panel-inset grid-2 min0" aria-label="暂不计入预算的卡片">
              <div class="stack-2">
                <h3 class="card-title">暂不计入</h3>
                <p class="hint">拖到这里关闭损失项</p>
              </div>
              <div class="note is-warm">
                <span class="note-title">注意</span>
                <p>账面数字会变小，不代表上升模拟仍能完成任务。</p>
              </div>
            </section>
          </div>
        </section>

        <aside class="panel stack-3 min0" aria-labelledby="setup-title">
          <div class="stack-3">
            <p class="panel-kicker">MISSION SETUP</p>
            <h2 id="setup-title" class="panel-title">任务条件</h2>
            <p class="panel-description">Δv 是发动机累计交出的速度变化量，不是关机后的最终速度。同一笔预算，可以由不同推力时序和转向方式交付。</p>
          </div>

          <div class="control-group">
            <label class="caption muted" for="target-select">目标轨道类型</label>
            <select id="target-select"></select>
            <span id="target-height" class="control-value">—</span>
          </div>

          <div class="control-group">
            <label class="caption muted" for="launch-select">发射方式</label>
            <select id="launch-select">
              <option value="direct">快速转向</option>
              <option value="balanced" selected>均衡转弯</option>
              <option value="lofted">高抛上升</option>
            </select>
          </div>

          <div class="control-group">
            <label class="caption muted" for="mass-range">任务质量 <span id="mass-value" class="control-value">—</span></label>
            <input id="mass-range" type="range" aria-label="任务质量">
          </div>

          <div class="control-group">
            <label class="caption muted" for="latitude-range">发射纬度 <span id="latitude-value" class="control-value">—</span></label>
            <input id="latitude-range" type="range" aria-label="发射纬度">
          </div>

          <div class="control-group">
            <label class="caption muted" for="loss-model">键盘选择预算构成</label>
            <select id="loss-model">
              <option value="full">全部计入</option>
              <option value="ideal">只计轨道速度</option>
              <option value="noGravity">关闭重力损失</option>
              <option value="noDrag">关闭阻力损失</option>
              <option value="noSteering">关闭转向损失</option>
            </select>
          </div>

          <button id="verify-button" class="button-primary button-compact" type="button">准备返回上升模拟重新验证</button>
          <p id="verify-status" class="caption muted" aria-live="polite">改变任一条件，预算会立即重算。</p>
        </aside>
      </section>

      <footer id="lec-footer" class="lec-footer"></footer>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        "use strict";

        Lec.mount({
          index: 10,
          kicker: `DELTA-V BUDGET`,
          title: `要到达目标轨道，火箭必须交出多少“速度零钱”`,
          take: `进入轨道需要的不是一个单独速度数字，而是一笔由多个损失组成的速度预算。`
        });

        var K = Lec.K;
        var P = Lec.P;
        var stage = document.getElementById("stage");
        var header = stage.querySelector("#lec-header");
        var footer = stage.querySelector("#lec-footer");
        var target = stage.querySelector("#target-select");
        var launch = stage.querySelector("#launch-select");
        var mass = stage.querySelector("#mass-range");
        var latitude = stage.querySelector("#latitude-range");
        var lossModel = stage.querySelector("#loss-model");
        var verify = stage.querySelector("#verify-button");
        var activeZone = stage.querySelector("#budget-zone");
        var excludedZone = stage.querySelector("#excluded-zone");
        var enabled = { gravity: true, drag: true, steering: true };
        var dragged = null;
        var referenceMass = K.TEN * K.TONNE;
        var baseDuration = K.TYPICAL_GRAVITY_LOSS / K.G0;
        var latest = null;

        header.classList.add("page-header");
        header.querySelector("h1").classList.add("page-title");
        footer.classList.add("page-footer");
        footer.children[K.ZERO].classList.add("caption");
        footer.children[K.ONE].classList.add("footer-meta");

        function addTarget(name, value) {
          var option = document.createElement("option");
          option.value = String(value);
          option.textContent = name;
          target.appendChild(option);
        }

        addTarget("近地圆轨道", K.LOW_EARTH_ORBIT_ALTITUDE);
        addTarget("空间站高度圆轨道", K.ISS_ALTITUDE);
        addTarget("地球同步高度圆轨道", K.GEO_ALTITUDE);
        target.value = String(K.ISS_ALTITUDE);

        mass.min = String(K.TONNE);
        mass.max = String(K.HUNDRED * K.TONNE);
        mass.step = String(K.TONNE);
        mass.value = String(referenceMass);
        latitude.min = String(-P.radiansToDegrees(K.HALF_PI));
        latitude.max = String(P.radiansToDegrees(K.HALF_PI));
        latitude.step = String(K.ONE);
        latitude.value = String(K.THREE * K.TEN);

        function scheme() {
          if (launch.value === "direct") {
            return {
              duration: K.ONE - K.TWO / K.TEN,
              drag: K.ONE + K.ONE_THIRD,
              angle: K.PI / K.FOUR,
              capacity: K.ONE + K.ONE / K.TEN
            };
          }
          if (launch.value === "lofted") {
            return {
              duration: K.ONE + K.ONE_THIRD,
              drag: K.ONE - K.TWO / K.TEN,
              angle: K.PI / K.SIX,
              capacity: K.ONE - K.ONE / K.TEN
            };
          }
          return {
            duration: K.ONE,
            drag: K.ONE,
            angle: K.PI / (K.TWO * K.SIX),
            capacity: K.ONE
          };
        }

        function render() {
          var altitude = Number(target.value);
          var taskMass = Number(mass.value);
          var siteLatitude = Number(latitude.value);
          var profile = scheme();
          var orbitalSpeed = P.circularVelocityAtAltitude(altitude);
          var massFactor = P.clamp(
            K.ONE + (taskMass / referenceMass - K.ONE) / K.TEN,
            K.HALF,
            K.TWO
          );
          var duration = baseDuration * profile.duration * massFactor;
          var gravity = P.gravityLoss(P.gravityAtAltitude(altitude * K.HALF), duration);
          var referenceDrag = K.TYPICAL_DRAG_LOSS * referenceMass / baseDuration;
          var drag = P.dragLoss(referenceDrag * profile.drag, taskMass, duration);
          var steering = P.steeringLoss(orbitalSpeed, profile.angle);
          var rotation = P.rotationBenefitAtLatitude(siteLatitude);
          var budget = P.deltaVBudget(orbitalSpeed, {
            gravity: enabled.gravity ? gravity : K.ZERO,
            drag: enabled.drag ? drag : K.ZERO,
            steering: enabled.steering ? steering : K.ZERO
          });
          var required = P.launchDeltaV(
            orbitalSpeed,
            enabled.gravity ? gravity : K.ZERO,
            enabled.drag ? drag : K.ZERO,
            enabled.steering ? steering : K.ZERO,
            rotation
          );
          var available = K.TYPICAL_LEO_DELTA_V * profile.capacity /
            P.clamp(taskMass / referenceMass, K.HALF, K.TWO);
          var margin = available - required;

          latest = {
            altitude: altitude,
            mass: taskMass,
            latitude: siteLatitude,
            orbitalSpeed: orbitalSpeed,
            gravity: gravity,
            drag: drag,
            steering: steering,
            grossBudget: budget.total,
            required: required,
            available: available,
            margin: margin
          };

          stage.querySelector("#target-height").textContent = P.formatDistance(altitude);
          stage.querySelector("#mass-value").textContent = P.formatMass(taskMass);
          stage.querySelector("#latitude-value").textContent = P.formatNumber(siteLatitude) + "°";
          stage.querySelector("#required-value").textContent = P.formatVelocity(required);
          stage.querySelector("#available-value").textContent = P.formatVelocity(available);
          stage.querySelector("#margin-value").textContent = P.formatVelocity(margin);
          stage.querySelector("#rotation-value").textContent = "自转抵扣 " + P.formatVelocity(rotation);
          stage.querySelector('[data-value="orbit"]').textContent = P.formatVelocity(orbitalSpeed);
          stage.querySelector('[data-value="gravity"]').textContent = P.formatVelocity(gravity);
          stage.querySelector('[data-value="drag"]').textContent = P.formatVelocity(drag);
          stage.querySelector('[data-value="steering"]').textContent = P.formatVelocity(steering);

          var marginReadout = stage.querySelector("#margin-readout");
          marginReadout.classList.toggle("is-danger", margin < K.ZERO);
          marginReadout.classList.toggle("is-warm", margin >= K.ZERO);
          var full = enabled.gravity && enabled.drag && enabled.steering;
          var badge = stage.querySelector("#model-badge");
          badge.textContent = full ? "真实发射模型" : "理想化删减模型";
          badge.classList.toggle("is-active", full);
          badge.classList.toggle("is-warm", !full);
        }

        function setEnabled(key, value) {
          if (key === "orbit") {
            return;
          }
          enabled[key] = value;
          var card = stage.querySelector('[data-card="' + key + '"]');
          (value ? activeZone : excludedZone).appendChild(card);
          card.setAttribute("aria-label", card.querySelector(".caption").textContent +
            (value ? "，已计入" : "，暂不计入"));
          render();
        }

        function applyModel(value) {
          enabled.gravity = value === "full" || value === "noDrag" || value === "noSteering";
          enabled.drag = value === "full" || value === "noGravity" || value === "noSteering";
          enabled.steering = value === "full" || value === "noGravity" || value === "noDrag";
          ["gravity", "drag", "steering"].forEach(function (key) {
            var card = stage.querySelector('[data-card="' + key + '"]');
            (enabled[key] ? activeZone : excludedZone).appendChild(card);
            card.setAttribute("aria-label", card.querySelector(".caption").textContent +
              (enabled[key] ? "，已计入" : "，暂不计入"));
          });
          render();
        }

        stage.querySelectorAll("[data-card]").forEach(function (card) {
          card.addEventListener("dragstart", function (event) {
            dragged = card.dataset.card;
            event.dataTransfer.setData("text/plain", dragged);
            event.dataTransfer.effectAllowed = "move";
          });
          card.addEventListener("dragend", function () {
            dragged = null;
          });
        });

        [activeZone, excludedZone].forEach(function (zone) {
          zone.addEventListener("dragover", function (event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
          });
          zone.addEventListener("drop", function (event) {
            event.preventDefault();
            var key = dragged || event.dataTransfer.getData("text/plain");
            if (key === "orbit") {
              activeZone.appendChild(stage.querySelector('[data-card="orbit"]'));
              return;
            }
            if (enabled[key] !== undefined) {
              setEnabled(key, zone === activeZone);
              lossModel.value = enabled.gravity && enabled.drag && enabled.steering ? "full" : "ideal";
            }
          });
        });

        [target, launch, mass, latitude].forEach(function (control) {
          control.addEventListener("input", render);
          control.addEventListener("change", render);
        });
        lossModel.addEventListener("change", function () {
          applyModel(lossModel.value);
        });
        verify.addEventListener("click", function () {
          if (!latest) {
            return;
          }
          var outcome = latest.margin >= K.ZERO ? "账面余量为正" : "账面速度不足";
          stage.querySelector("#verify-status").textContent =
            "已准备验证参数：" + outcome + "；回到上升模拟时仍需检查被关闭的损失。";
        });

        render();
      });
    </script>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
</body>
</html>
