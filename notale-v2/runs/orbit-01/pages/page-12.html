<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="12" data-total="20">
<div id="stage">
  <main class="page">
    <header id="lec-header" class="page-header"></header>

    <section class="page-body split min0" aria-label="多级火箭拼装工作区">
      <figure class="visual-shell min0" aria-label="可拖动级段改变上下顺序的火箭拼装与燃烧视图">
        <canvas id="rocket-canvas" class="cv-fill no-pan" tabindex="0" aria-label="火箭拼装画布。拖动任一级越过另一极可交换级序；也可使用右侧选择框完成同样操作。"></canvas>
      </figure>

      <aside class="panel control-panel min0" aria-label="拼装说明和控制">
        <div class="panel-heading stack-2">
          <p class="panel-kicker">两项目标</p>
          <h2 class="panel-title">越过预算，还要留下更多载荷</h2>
          <p class="panel-description">拖动左侧两级可交换顺序。点火后，每级燃尽都要亲手分离；空罐未抛弃前仍算在总质量里。</p>
        </div>

        <div class="readout-grid">
          <div class="readout">
            <span class="readout-label">当前总质量</span>
            <strong id="mass-now" class="readout-value">—</strong>
          </div>
          <div class="readout is-blue">
            <span class="readout-label">燃尽后剩余</span>
            <strong id="mass-after" class="readout-value">—</strong>
          </div>
          <div class="readout is-warm">
            <span class="readout-label">当前质量比</span>
            <strong id="mass-ratio" class="readout-value">—</strong>
          </div>
          <div class="readout">
            <span class="readout-label">载荷分数</span>
            <strong id="payload-frac" class="readout-value">—</strong>
          </div>
        </div>

        <div class="grid-2">
          <div class="control-group">
            <label class="control-label" for="lower-stage">第一级（下）</label>
            <select id="lower-stage">
              <option value="balanced">均衡级</option>
              <option value="light">轻结构级</option>
              <option value="heavy">重结构级</option>
            </select>
          </div>
          <div class="control-group">
            <label class="control-label" for="upper-stage">第二级（上）</label>
            <select id="upper-stage">
              <option value="light">轻结构级</option>
              <option value="balanced">均衡级</option>
              <option value="heavy">重结构级</option>
            </select>
          </div>
        </div>
        <div class="control-group">
          <label class="control-label" for="payload">载荷质量 <span id="payload-value" class="control-value">—</span></label>
          <input id="payload" type="range" aria-label="载荷质量">
        </div>
        <div class="cluster">
          <button id="action" class="button-primary">点火第一级</button>
          <button id="export" disabled>导出到任务规划器</button>
        </div>
        <div id="result-note" class="callout" aria-live="polite">
          <span id="result-title" class="callout-title">等待点火</span>
          <p id="result-text">预算线与实时总速度会显示在左侧。</p>
        </div>
      </aside>
    </section>

    <footer id="lec-footer" class="page-footer"></footer>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';

    Lec.mount({
      index: 12,
      kicker: `STAGING GAME`,
      title: `为什么火箭会把已经空了的罐子扔掉`,
      take: `分级的价值在于及时抛掉不再产生速度的结构质量。`
    });

    var header = document.getElementById('lec-header');
    var footer = document.getElementById('lec-footer');
    header.classList.add('page-header');
    footer.classList.add('page-footer');
    var mountedTitle = header.querySelector('.lec-header__title');
    var mountedKicker = header.querySelector('.lec-header__kicker');
    var mountedIndex = header.querySelector('.lec-header__index');
    var mountedTake = footer.querySelector('.lec-footer__take');
    var mountedTopic = footer.querySelector('.lec-footer__topic');
    if (mountedTitle) { mountedTitle.classList.add('page-title'); }
    if (mountedKicker) { mountedKicker.classList.add('kicker'); }
    if (mountedIndex) { mountedIndex.classList.add('page-number'); }
    if (mountedTake) { mountedTake.classList.add('prose'); }
    if (mountedTopic) { mountedTopic.classList.add('footer-meta'); }

    var K = Lec.K;
    var P = Lec.P;
    var canvas = document.getElementById('rocket-canvas');
    var lowerSelect = document.getElementById('lower-stage');
    var upperSelect = document.getElementById('upper-stage');
    var payloadInput = document.getElementById('payload');
    var payloadValue = document.getElementById('payload-value');
    var actionButton = document.getElementById('action');
    var exportButton = document.getElementById('export');
    var massNow = document.getElementById('mass-now');
    var massAfter = document.getElementById('mass-after');
    var massRatio = document.getElementById('mass-ratio');
    var payloadFrac = document.getElementById('payload-frac');
    var resultNote = document.getElementById('result-note');
    var resultTitle = document.getElementById('result-title');
    var resultText = document.getElementById('result-text');

    var stageTypes = {
      balanced: {
        name: '均衡级',
        dryMass: K.EIGHT * K.THOUSAND,
        propellantMass: K.HUNDRED * K.THOUSAND,
        specificImpulse: K.THREE * K.HUNDRED,
        thrust: K.TWO * K.MILLION
      },
      light: {
        name: '轻结构级',
        dryMass: K.SIX * K.THOUSAND - K.THOUSAND,
        propellantMass: (K.EIGHT * K.TEN - K.TEN) * K.THOUSAND,
        specificImpulse: (K.THREE * K.HUNDRED) + (K.HUNDRED * K.HALF),
        thrust: K.MILLION
      },
      heavy: {
        name: '重结构级',
        dryMass: (K.TWO * K.TEN - K.TWO) * K.THOUSAND,
        propellantMass: (K.HUNDRED + K.HUNDRED * K.HALF) * K.THOUSAND,
        specificImpulse: (K.THREE * K.HUNDRED) + (K.TWO * K.TEN),
        thrust: K.THREE * K.MILLION
      }
    };

    var targetDeltaV = P.deltaVBudget(P.circularVelocityAtAltitude(K.LOW_EARTH_ORBIT_ALTITUDE), {
      gravity: K.TYPICAL_GRAVITY_LOSS,
      drag: K.TYPICAL_DRAG_LOSS,
      steering: K.TYPICAL_STEERING_LOSS
    }).total;
    var state = {
      mode: 'ready',
      active: K.ZERO,
      progress: K.ZERO,
      completedDeltaV: K.ZERO,
      droppedMass: K.ZERO,
      dragging: K.ZERO,
      dragY: K.ZERO,
      dragStartY: K.ZERO,
      result: null,
      stages: [],
      payload: K.FOUR * K.THOUSAND,
      currentMass: K.ZERO,
      afterMass: K.ZERO,
      ratio: K.ONE,
      achievedDeltaV: K.ZERO
    };
    var fitHandle;
    var stopBurn = function () {};

    payloadInput.min = String(K.THOUSAND);
    payloadInput.max = String(K.TEN * K.THOUSAND);
    payloadInput.step = String(K.THOUSAND);
    payloadInput.value = String(state.payload);

    function makeStage(key) {
      var source = stageTypes[key];
      return {
        key: key,
        name: source.name,
        dryMass: source.dryMass,
        propellantMass: source.propellantMass,
        wetMass: source.dryMass + source.propellantMass,
        specificImpulse: source.specificImpulse,
        thrust: source.thrust
      };
    }

    function rebuild() {
      stopBurn();
      stopBurn = function () {};
      state.stages = [makeStage(lowerSelect.value), makeStage(upperSelect.value)];
      state.payload = Number(payloadInput.value);
      state.result = P.multistageDeltaV(state.stages, state.payload, K.G0);
      state.mode = 'ready';
      state.active = K.ZERO;
      state.progress = K.ZERO;
      state.completedDeltaV = K.ZERO;
      state.droppedMass = K.ZERO;
      state.achievedDeltaV = K.ZERO;
      actionButton.disabled = false;
      actionButton.textContent = '点火第一级';
      exportButton.disabled = true;
      setInputsDisabled(false);
      resultNote.className = 'callout';
      resultTitle.textContent = '等待点火';
      resultText.textContent = '拖动级段可交换顺序；预算为 ' + P.formatVelocity(targetDeltaV) + '。';
      updateState();
    }

    function setInputsDisabled(disabled) {
      lowerSelect.disabled = disabled;
      upperSelect.disabled = disabled;
      payloadInput.disabled = disabled;
    }

    function upperMassFor(index) {
      var total = state.payload;
      var i;
      for (i = state.stages.length - K.ONE; i > index; i -= K.ONE) {
        total += state.stages[i].wetMass;
      }
      return total;
    }

    function updateState() {
      var initial = state.result.initialStackMass;
      var activeStage = state.stages[state.active];
      var upper = upperMassFor(state.active);
      var remainingPropellant;
      var partialStage;
      var fullStageDeltaV;
      var remainingDeltaV;

      if (state.mode === 'done') {
        state.currentMass = state.payload;
        state.afterMass = state.payload;
        state.ratio = K.ONE;
        state.achievedDeltaV = state.result.totalDeltaV;
      } else {
        remainingPropellant = activeStage.propellantMass * (K.ONE - state.progress);
        state.currentMass = initial - state.droppedMass - activeStage.propellantMass * state.progress;
        state.afterMass = activeStage.dryMass + upper;
        state.ratio = P.stageMassRatio(
          activeStage.dryMass + remainingPropellant,
          activeStage.dryMass,
          upper
        );
        partialStage = {
          wetMass: activeStage.dryMass + remainingPropellant,
          dryMass: activeStage.dryMass,
          specificImpulse: activeStage.specificImpulse
        };
        fullStageDeltaV = P.stageDeltaV(activeStage, upper, K.G0);
        remainingDeltaV = P.stageDeltaV(partialStage, upper, K.G0);
        state.achievedDeltaV = state.completedDeltaV + fullStageDeltaV - remainingDeltaV;
      }

      massNow.textContent = P.formatMass(state.currentMass);
      massAfter.textContent = P.formatMass(state.afterMass);
      massRatio.textContent = P.formatNumber(state.ratio);
      payloadFrac.textContent = P.formatNumber(P.payloadFraction(state.payload, state.currentMass) * K.HUNDRED) + '%';
      payloadValue.textContent = P.formatMass(state.payload);
      if (fitHandle) { fitHandle.redraw(); }
    }

    function beginBurn() {
      var stage = state.stages[state.active];
      var massFlow = P.massFlowFromThrust(stage.thrust, stage.specificImpulse, K.G0);
      var burnDuration = P.burnTime(stage.propellantMass, massFlow);
      var visualDuration = K.TWO * K.THOUSAND;
      var elapsed = K.ZERO;
      state.mode = 'burning';
      actionButton.disabled = true;
      actionButton.textContent = '第' + (state.active + K.ONE) + '级燃烧中';
      setInputsDisabled(true);

      stopBurn();
      stopBurn = Deck.loop(function (t, dt) {
        elapsed += dt;
        state.progress = Deck.reduced() ? K.ONE : P.clamp(elapsed / visualDuration, K.ZERO, K.ONE);
        var burned = P.burnedMass(massFlow, burnDuration * state.progress);
        state.progress = P.clamp(burned / stage.propellantMass, K.ZERO, K.ONE);
        updateState();
        if (state.progress >= K.ONE) {
          stopBurn();
          stopBurn = function () {};
          state.mode = 'await-separation';
          actionButton.disabled = false;
          actionButton.textContent = '分离第' + (state.active + K.ONE) + '级';
          resultTitle.textContent = '燃尽：空罐仍在';
          resultText.textContent = '点击分离，才会抛掉 ' + P.formatMass(stage.dryMass) + ' 的结构与发动机。';
          updateState();
        }
      }, { still: visualDuration });
    }

    function separateStage() {
      var stage = state.stages[state.active];
      state.completedDeltaV += P.stageDeltaV(stage, upperMassFor(state.active), K.G0);
      state.droppedMass += stage.propellantMass + stage.dryMass;
      state.progress = K.ZERO;
      if (state.active < state.stages.length - K.ONE) {
        state.active += K.ONE;
        state.mode = 'ready-next';
        resultTitle.textContent = '分离完成';
        resultText.textContent = '总质量骤减；第二级不再加速第一级的空结构。';
        updateState();
        beginBurn();
      } else {
        state.mode = 'done';
        finishMission();
      }
    }

    function finishMission() {
      var success = state.result.totalDeltaV >= targetDeltaV;
      var lightened = state.stages.map(function (stage) {
        return {
          wetMass: stage.propellantMass + stage.dryMass * K.HALF,
          dryMass: stage.dryMass * K.HALF,
          specificImpulse: stage.specificImpulse
        };
      });
      var lightResult = P.multistageDeltaV(lightened, state.payload, K.G0);
      state.progress = K.ONE;
      updateState();
      actionButton.disabled = false;
      actionButton.textContent = '重新拼装';
      exportButton.disabled = false;
      setInputsDisabled(false);

      if (success) {
        resultNote.className = 'callout';
        resultTitle.textContent = '双目标完成';
        resultText.textContent = '总速度 ' + P.formatVelocity(state.result.totalDeltaV) + '；保留载荷 ' + P.formatMass(state.payload) + '。';
      } else if (lightResult.totalDeltaV >= targetDeltaV) {
        resultNote.className = 'callout is-danger';
        resultTitle.textContent = '失败：级间结构过重';
        resultText.textContent = '减轻空结构后可越过预算；先换轻结构级或调整顺序。';
      } else {
        resultNote.className = 'callout is-danger';
        resultTitle.textContent = '失败：速度不足';
        resultText.textContent = '即使结构减半仍未越过预算；需要更高效级段或减少载荷。';
      }
    }

    function handleAction() {
      if (state.mode === 'ready') {
        beginBurn();
      } else if (state.mode === 'await-separation') {
        separateStage();
      } else if (state.mode === 'done') {
        rebuild();
      }
    }

    function swapStages() {
      if (state.mode !== 'ready') { return; }
      var lower = lowerSelect.value;
      lowerSelect.value = upperSelect.value;
      upperSelect.value = lower;
      rebuild();
    }

    function stageRects(w, h) {
      var cx = w * K.HALF;
      var rocketW = w / (K.TEN + K.TWO);
      var stageH = h / (K.FOUR + K.ONE);
      var gap = h / (K.HUNDRED / K.TWO);
      var upperY = h * K.HALF - stageH - gap * K.HALF;
      var lowerY = h * K.HALF + gap * K.HALF;
      return [
        { x: cx - rocketW * K.HALF, y: lowerY, w: rocketW, h: stageH },
        { x: cx - rocketW * K.HALF, y: upperY, w: rocketW, h: stageH }
      ];
    }

    function draw(ctx, w, h) {
      var surface = Deck.rgb('surface-inset');
      var line = Deck.rgb('line');
      var ink = Deck.rgb('ink');
      var muted = Deck.rgb('ink-muted');
      var accent = Deck.rgb('accent');
      var warm = Deck.rgb('accent-warm');
      var blue = Deck.rgb('accent-blue');
      var danger = Deck.rgb('danger');
      var mono = Deck.token('font-mono');
      var sans = Deck.token('font-sans');
      var rects = stageRects(w, h);
      var barStart = w / K.TEN;
      var barEnd = w - w / K.TEN;
      var scaleMaximum = targetDeltaV * (K.ONE + K.HALF);
      var targetX = barStart + (barEnd - barStart) * targetDeltaV / scaleMaximum;
      var achievedX = barStart + (barEnd - barStart) * state.achievedDeltaV / scaleMaximum;
      var i;

      ctx.clearRect(K.ZERO, K.ZERO, w, h);
      ctx.fillStyle = 'rgb(' + surface.join(',') + ')';
      ctx.fillRect(K.ZERO, K.ZERO, w, h);

      ctx.strokeStyle = Deck.rgba('line', K.HALF);
      ctx.lineWidth = K.ONE;
      for (i = K.ONE; i < K.TEN; i += K.ONE) {
        ctx.beginPath();
        ctx.moveTo(w * i / K.TEN, K.ZERO);
        ctx.lineTo(w * i / K.TEN, h);
        ctx.stroke();
      }

      ctx.fillStyle = 'rgb(' + ink.join(',') + ')';
      ctx.font = '650 ' + (K.TWO * K.TEN + K.TWO) + 'px ' + sans;
      ctx.fillText('拖动级段交换顺序', w / K.TEN, h / K.TEN);
      ctx.fillStyle = 'rgb(' + muted.join(',') + ')';
      ctx.font = (K.TEN + K.SIX) + 'px ' + sans;
      ctx.fillText('推进剂燃尽后，必须点击分离才会甩掉干质量', w / K.TEN, h / K.TEN + K.THREE * K.TEN);

      for (i = K.ZERO; i < rects.length; i += K.ONE) {
        var r = rects[i];
        var stage = state.stages[i];
        var active = i === state.active && state.mode !== 'done';
        var progress = i < state.active || state.mode === 'done' ? K.ONE : (active ? state.progress : K.ZERO);
        var drawY = r.y;
        if (state.dragging === i + K.ONE) {
          drawY = P.clamp(state.dragY - r.h * K.HALF, h / K.TEN, h - r.h - h / K.TEN);
        }

        ctx.fillStyle = active ? Deck.rgba('accent', K.ONE / K.TEN) : Deck.rgba('accent-blue', K.ONE / K.TEN);
        ctx.strokeStyle = active ? 'rgb(' + accent.join(',') + ')' : 'rgb(' + blue.join(',') + ')';
        ctx.lineWidth = active ? K.THREE : K.TWO;
        Deck.rr(ctx, r.x, drawY, r.w, r.h, K.TEN);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = Deck.rgba('accent-warm', (K.ONE - progress) * (K.HALF + K.ONE / K.TEN));
        Deck.rr(ctx, r.x + K.EIGHT, drawY + r.h * progress + K.EIGHT, r.w - K.TWO * K.EIGHT, (r.h - K.TWO * K.EIGHT) * (K.ONE - progress), K.SIX);
        ctx.fill();

        ctx.fillStyle = 'rgb(' + ink.join(',') + ')';
        ctx.font = '650 ' + (K.TEN + K.SIX) + 'px ' + sans;
        ctx.textAlign = 'center';
        ctx.fillText((i + K.ONE) + '｜' + stage.name, r.x + r.w * K.HALF, drawY + r.h * K.HALF);
        ctx.fillStyle = 'rgb(' + muted.join(',') + ')';
        ctx.font = (K.TEN + K.FOUR) + 'px ' + mono;
        ctx.fillText('推进剂 ' + P.formatMass(stage.propellantMass), r.x + r.w * K.HALF, drawY + r.h * K.HALF + K.THREE * K.TEN);
        ctx.fillText('结构+发动机 ' + P.formatMass(stage.dryMass), r.x + r.w * K.HALF, drawY + r.h * K.HALF + K.THREE * K.TEN + K.TWO * K.TEN);
        ctx.textAlign = 'start';
      }

      var payloadY = rects[K.ONE].y - h / K.TEN;
      ctx.fillStyle = Deck.rgba('accent', K.ONE / K.FOUR);
      ctx.strokeStyle = 'rgb(' + accent.join(',') + ')';
      ctx.lineWidth = K.TWO;
      Deck.rr(ctx, w * K.HALF - w / (K.TEN * K.TWO), payloadY, w / K.TEN, h / (K.TEN + K.TWO), K.TEN);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = 'rgb(' + ink.join(',') + ')';
      ctx.font = '650 ' + (K.TEN + K.FOUR) + 'px ' + sans;
      ctx.textAlign = 'center';
      ctx.fillText('载荷 ' + P.formatMass(state.payload), w * K.HALF, payloadY + h / (K.FOUR * K.TEN));
      ctx.textAlign = 'start';

      var barY = h - h / K.EIGHT;
      ctx.strokeStyle = 'rgb(' + line.join(',') + ')';
      ctx.lineWidth = K.EIGHT;
      ctx.beginPath();
      ctx.moveTo(w / K.TEN, barY);
      ctx.lineTo(w - w / K.TEN, barY);
      ctx.stroke();
      ctx.strokeStyle = state.achievedDeltaV >= targetDeltaV ? 'rgb(' + accent.join(',') + ')' : 'rgb(' + warm.join(',') + ')';
      ctx.beginPath();
      ctx.moveTo(w / K.TEN, barY);
      ctx.lineTo(P.clamp(achievedX, w / K.TEN, w - w / K.TEN), barY);
      ctx.stroke();
      ctx.strokeStyle = 'rgb(' + danger.join(',') + ')';
      ctx.lineWidth = K.TWO;
      ctx.beginPath();
      ctx.moveTo(targetX, barY - K.TWO * K.TEN);
      ctx.lineTo(targetX, barY + K.TWO * K.TEN);
      ctx.stroke();
      ctx.fillStyle = 'rgb(' + muted.join(',') + ')';
      ctx.font = (K.TEN + K.FOUR) + 'px ' + mono;
      ctx.fillText('实时总速度 ' + P.formatVelocity(state.achievedDeltaV), w / K.TEN, barY - K.THREE * K.TEN);
      ctx.fillStyle = 'rgb(' + danger.join(',') + ')';
      ctx.fillText('预算 ' + P.formatVelocity(targetDeltaV), targetX + K.TEN, barY - K.THREE * K.TEN);
    }

    function pointerDown(event) {
      if (state.mode !== 'ready') { return; }
      var point = Deck.pt(canvas, event);
      var rects = stageRects(canvas.__w, canvas.__h);
      var i;
      for (i = K.ZERO; i < rects.length; i += K.ONE) {
        var r = rects[i];
        if (point.x >= r.x && point.x <= r.x + r.w && point.y >= r.y && point.y <= r.y + r.h) {
          state.dragging = i + K.ONE;
          state.dragY = point.y;
          state.dragStartY = point.y;
          canvas.setPointerCapture(event.pointerId);
          if (fitHandle) { fitHandle.redraw(); }
          break;
        }
      }
    }

    function pointerMove(event) {
      if (!state.dragging) { return; }
      state.dragY = Deck.pt(canvas, event).y;
      if (fitHandle) { fitHandle.redraw(); }
    }

    function pointerUp(event) {
      if (!state.dragging) { return; }
      var endY = Deck.pt(canvas, event).y;
      var threshold = canvas.__h / K.TEN;
      if (Math.abs(endY - state.dragStartY) > threshold) { swapStages(); }
      state.dragging = K.ZERO;
      if (canvas.hasPointerCapture(event.pointerId)) { canvas.releasePointerCapture(event.pointerId); }
      if (fitHandle) { fitHandle.redraw(); }
    }

    lowerSelect.addEventListener('change', rebuild);
    upperSelect.addEventListener('change', rebuild);
    payloadInput.addEventListener('input', rebuild);
    actionButton.addEventListener('click', handleAction);
    exportButton.addEventListener('click', function () {
      var design = {
        stages: state.stages.map(function (stage) { return stage.key; }),
        payloadMass: state.payload,
        totalDeltaV: state.result.totalDeltaV,
        targetDeltaV: targetDeltaV
      };
      try {
        localStorage.setItem('orbit-page12-design', JSON.stringify(design));
        resultTitle.textContent = '已导出到任务规划器';
        resultText.textContent = '级序、载荷与总速度预算已保存，page-18 可读取这套方案。';
      } catch (error) {
        resultTitle.textContent = '导出未保存';
        resultText.textContent = '浏览器阻止了本地保存；本页结果仍可继续比较。';
      }
    });
    canvas.addEventListener('pointerdown', pointerDown);
    canvas.addEventListener('pointermove', pointerMove);
    canvas.addEventListener('pointerup', pointerUp);
    canvas.addEventListener('pointercancel', pointerUp);
    canvas.addEventListener('keydown', function (event) {
      if ((event.key === 'ArrowUp' || event.key === 'ArrowDown') && state.mode === 'ready') {
        event.preventDefault();
        swapStages();
      }
    });

    rebuild();
    fitHandle = Deck.autofit(canvas, draw);
    updateState();
  });
  </script>
</div>

<script src="assets/lec.js"></script>
</body>
