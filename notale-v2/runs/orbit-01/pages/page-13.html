<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="13" data-total="20">
<div id="stage">
  <main class="page">
    <header id="lec-header"></header>
    <section class="page-body split min0" aria-label="重力转弯实验">
      <figure class="visual-shell min0" aria-label="火箭轨迹与姿态曲线">
        <canvas id="flight-canvas" class="cv-fill no-pan" tabindex="0" role="application" aria-label="火箭轨迹与可拖拽姿态曲线。拖动下方曲线节点可改变飞行程序。"></canvas>
      </figure>

      <aside class="panel control-panel min0" aria-label="飞行控制与结果">
        <div class="stack-3">
          <h2 class="panel-title">设计一条转弯程序</h2>
          <p class="panel-description">拖动曲线节点，再让积分器逐步读取姿态。比较到达目标高度时，哪种程序留下更多横向速度与推进剂。</p>
        </div>

        <div class="grid-2" aria-live="polite">
          <div class="metric">
            <span class="caption muted">当前高度</span>
            <strong class="metric-value" id="altitude-value">—</strong>
          </div>
          <div class="metric">
            <span class="caption muted">水平速度</span>
            <strong class="metric-value" id="horizontal-value">—</strong>
          </div>
        </div>

        <div class="control-group">
          <label class="caption muted" for="program-select">俯仰程序</label>
          <select id="program-select">
            <option value="vertical">保持竖直</option>
            <option value="sudden">突然转弯</option>
            <option value="smooth" selected>平滑转弯</option>
          </select>
        </div>

        <div class="grid-2 min0">
          <div class="control-group min0">
            <label class="caption muted" for="node-select">键盘编辑节点</label>
            <select id="node-select">
              <option value="0">起飞</option>
              <option value="1">初段</option>
              <option value="2">中前段</option>
              <option value="3">中段</option>
              <option value="4">中后段</option>
              <option value="5">末段</option>
            </select>
          </div>
          <div class="control-group min0">
            <label class="caption muted" for="angle-range">姿态角 <span class="control-value" id="angle-value">—</span></label>
            <input id="angle-range" type="range" aria-label="选中节点的姿态角">
          </div>
        </div>

        <div class="cluster">
          <button id="fly-button" class="button-primary" type="button">飞行</button>
          <button id="reset-button" class="button-quiet" type="button">恢复程序</button>
          <span id="flight-status" class="status" aria-live="polite">等待点火</span>
        </div>

        <div class="stack-2">
          <span class="caption muted">同一火箭的参考结果</span>
          <div id="comparison-list" class="stack-1" aria-label="三种转弯程序比较"></div>
        </div>
      </aside>
    </section>
    <footer id="lec-footer"></footer>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';

    Lec.mount({
      index: 13,
      kicker: `GRAVITY TURN`,
      title: `火箭为什么要在上升途中慢慢转弯`,
      take: `进入轨道需要横向速度，合理的转弯把推力从“抬高”逐步转向“绕行”。`
    });

    var K = Lec.K;
    var P = Lec.P;
    var header = document.getElementById('lec-header');
    var footer = document.getElementById('lec-footer');
    header.className = 'page-header';
    header.querySelector('.lec-header__top').className = 'cluster';
    header.querySelector('.lec-header__kicker').className = 'kicker';
    header.querySelector('.lec-header__index').className = 'page-number';
    header.querySelector('.lec-header__title').className = 'page-title';
    footer.className = 'page-footer';
    footer.querySelector('.lec-footer__take').className = 'accent';
    footer.querySelector('.lec-footer__topic').className = 'footer-meta';

    var cv = document.getElementById('flight-canvas');
    var presetSelect = document.getElementById('program-select');
    var nodeSelect = document.getElementById('node-select');
    var angleRange = document.getElementById('angle-range');
    var angleValue = document.getElementById('angle-value');
    var flyButton = document.getElementById('fly-button');
    var resetButton = document.getElementById('reset-button');
    var statusEl = document.getElementById('flight-status');
    var altitudeEl = document.getElementById('altitude-value');
    var horizontalEl = document.getElementById('horizontal-value');
    var comparisonEl = document.getElementById('comparison-list');

    var maxAngle = K.HUNDRED - K.THREE * K.TEN;
    var presets = {
      vertical: [K.ZERO, K.ZERO, K.ZERO, K.ZERO, K.ZERO, K.ZERO],
      sudden: [K.ZERO, K.ZERO, K.ZERO, maxAngle, maxAngle, maxAngle],
      smooth: [K.ZERO, maxAngle / K.EIGHT, maxAngle / K.THREE, maxAngle * K.HALF, maxAngle * (K.THREE / K.FOUR), maxAngle]
    };
    var presetNames = {
      vertical: '竖直',
      sudden: '突然',
      smooth: '平滑'
    };

    angleRange.min = String(K.ZERO);
    angleRange.max = String(maxAngle);
    angleRange.step = String(K.ONE);

    var initialMass = K.HUNDRED * K.THOUSAND;
    var dryMass = initialMass / K.FOUR;
    var targetAltitude = K.LOW_EARTH_ORBIT_ALTITUDE;
    var initialGravity = P.gravityAtAltitude(K.ZERO);
    var thrust = K.TWO * initialMass * initialGravity;
    var specificImpulse = K.THREE * K.HUNDRED;
    var massFlow = P.massFlowFromThrust(thrust, specificImpulse, K.G0);
    var burnTime = P.burnTime(initialMass - dryMass, massFlow);
    var simulationLimit = K.FOUR * K.MINUTE;
    var integrationStep = K.ONE / K.TEN;

    var selectedNode = K.ZERO;
    var angles = presets.smooth.slice();
    var currentProgram = 'smooth';
    var sim = null;
    var currentTrail = [];
    var comparison = {};
    var runningStop = null;
    var curveBox = null;
    var dragging = false;
    var canvasFit = null;

    function angleAt(progress, curve) {
      var p = P.clamp(progress, K.ZERO, K.ONE);
      var scaled = p * (curve.length - K.ONE);
      var left = Math.floor(scaled);
      var right = Math.min(curve.length - K.ONE, left + K.ONE);
      return Deck.lerp(curve[left], curve[right], scaled - left);
    }

    function makeSimulation(curve) {
      return {
        curve: curve.slice(),
        t: K.ZERO,
        x: K.ZERO,
        y: K.ZERO,
        vx: K.ZERO,
        vy: K.ZERO,
        mass: initialMass,
        thrustAcceleration: P.accelerationFromThrust(thrust, initialMass),
        netVerticalAcceleration: P.netAcceleration(thrust, initialMass, initialGravity, K.ZERO),
        thrustToWeight: P.thrustToWeight(thrust, initialMass, initialGravity),
        reached: false,
        done: false,
        peak: K.ZERO,
        trail: [{x: K.ZERO, y: K.ZERO, t: K.ZERO}]
      };
    }

    function stepSimulation(s) {
      if (s.done) return;
      var g = P.gravityAtAltitude(Math.max(K.ZERO, s.y));
      var burning = s.mass > dryMass && s.t < burnTime;
      var activeThrust = burning ? thrust : K.ZERO;
      var pitch = P.degreesToRadians(angleAt(s.t / burnTime, s.curve));
      var aThrust = burning ? P.accelerationFromThrust(activeThrust, s.mass) : K.ZERO;
      var ax = aThrust * Math.sin(pitch);
      var ay = P.netAcceleration(activeThrust * Math.cos(pitch), s.mass, g, K.ZERO);

      s.vx += ax * integrationStep;
      s.vy += ay * integrationStep;
      s.x += s.vx * integrationStep;
      s.y += s.vy * integrationStep;
      s.t += integrationStep;
      s.thrustAcceleration = aThrust;
      s.netVerticalAcceleration = ay;
      s.thrustToWeight = burning ? P.thrustToWeight(activeThrust, s.mass, g) : K.ZERO;
      s.peak = Math.max(s.peak, s.y);

      if (burning) {
        s.mass = Math.max(dryMass, s.mass - massFlow * integrationStep);
      }
      if (s.trail.length === K.ZERO || s.t - s.trail[s.trail.length - K.ONE].t >= K.ONE) {
        s.trail.push({x: s.x, y: Math.max(K.ZERO, s.y), t: s.t});
      }
      if (!s.reached && s.y >= targetAltitude) {
        s.reached = true;
        s.done = true;
      }
      if (s.y < K.ZERO && s.t > K.ONE || s.t >= simulationLimit) {
        s.done = true;
      }
    }

    function runComplete(curve) {
      var result = makeSimulation(curve);
      while (!result.done) stepSimulation(result);
      return result;
    }

    function remainingPropellant(s) {
      return Math.max(K.ZERO, s.mass - dryMass);
    }

    function resultText(result) {
      var speed = result.reached ? P.formatVelocity(result.vx) : '未到达';
      var fuel = P.formatMass(remainingPropellant(result));
      return speed + ' · ' + fuel;
    }

    function updateComparison() {
      comparisonEl.innerHTML = '';
      ['vertical', 'sudden', 'smooth'].forEach(function (key) {
        var row = document.createElement('div');
        var term = document.createElement('span');
        var value = document.createElement('span');
        row.className = 'definition';
        term.className = 'definition-term';
        value.className = 'definition-description no-wrap';
        term.textContent = presetNames[key];
        value.textContent = resultText(comparison[key]);
        row.appendChild(term);
        row.appendChild(value);
        comparisonEl.appendChild(row);
      });
    }

    function syncEditor() {
      nodeSelect.value = String(selectedNode);
      angleRange.value = String(P.round(angles[selectedNode], K.ZERO));
      angleValue.textContent = P.formatNumber(angles[selectedNode]) + '°';
    }

    function setProgram(name) {
      currentProgram = name;
      angles = presets[name].slice();
      selectedNode = K.ZERO;
      sim = makeSimulation(angles);
      currentTrail = sim.trail;
      statusEl.textContent = '程序已装载';
      statusEl.className = 'status';
      syncEditor();
      redraw();
      updateReadouts(sim);
    }

    function markCustom() {
      currentProgram = 'custom';
      statusEl.textContent = '自定义程序';
      statusEl.className = 'status is-warm';
    }

    function updateReadouts(s) {
      altitudeEl.textContent = P.formatDistance(Math.max(K.ZERO, s.y));
      horizontalEl.textContent = P.formatVelocity(Math.max(K.ZERO, s.vx));
    }

    function finishFlight() {
      if (runningStop) {
        runningStop();
        runningStop = null;
      }
      flyButton.disabled = false;
      if (sim.reached) {
        statusEl.textContent = '到达目标高度';
        statusEl.className = 'status is-success';
      } else {
        statusEl.textContent = '未到达目标高度';
        statusEl.className = 'status is-danger';
      }
      if (currentProgram !== 'custom') {
        comparison[currentProgram] = sim;
        updateComparison();
      }
      updateReadouts(sim);
      redraw();
    }

    function fly() {
      if (runningStop) runningStop();
      sim = makeSimulation(angles);
      currentTrail = sim.trail;
      flyButton.disabled = true;
      statusEl.textContent = '飞行中';
      statusEl.className = 'status is-active';

      if (Deck.reduced()) {
        while (!sim.done) stepSimulation(sim);
        finishFlight();
        return;
      }

      var accumulator = K.ZERO;
      runningStop = Deck.loop(function (time, dt) {
        accumulator += Math.min(dt / K.THOUSAND * K.TEN, K.ONE);
        while (accumulator >= integrationStep && !sim.done) {
          stepSimulation(sim);
          accumulator -= integrationStep;
        }
        updateReadouts(sim);
        redraw();
        if (sim.done) finishFlight();
      });
    }

    function drawLabel(ctx, text, x, y, color, align) {
      ctx.fillStyle = color;
      ctx.font = Deck.token('type-label') + ' ' + Deck.token('font-sans');
      ctx.textAlign = align || 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x, y);
    }

    function drawTick(ctx, text, x, y, align) {
      ctx.fillStyle = Deck.rgba('ink-muted', K.ONE);
      ctx.font = Deck.token('type-tick') + ' ' + Deck.token('font-mono');
      ctx.textAlign = align || 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x, y);
    }

    function drawTrajectory(ctx, trail, box, color, width, alpha) {
      if (!trail || trail.length < K.TWO) return;
      var worldX = targetAltitude * K.THREE;
      var sx = box.w / worldX;
      var sy = box.h / (targetAltitude * (K.ONE + K.ONE / K.FOUR));
      ctx.strokeStyle = color;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = width;
      ctx.beginPath();
      trail.forEach(function (point, index) {
        var px = box.x + point.x * sx;
        var py = box.y + box.h - point.y * sy;
        if (index === K.ZERO) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();
      ctx.globalAlpha = K.ONE;
    }

    function draw(ctx, w, h) {
      ctx.clearRect(K.ZERO, K.ZERO, w, h);
      var pad = K.THREE * K.EIGHT;
      var curveHeight = h / K.THREE;
      var plot = {x: pad * K.TWO, y: pad, w: w - pad * K.THREE, h: h - curveHeight - pad * K.TWO};
      curveBox = {x: pad * K.TWO, y: h - curveHeight + pad, w: w - pad * K.THREE, h: curveHeight - pad * K.TWO};

      ctx.fillStyle = Deck.rgba('accent-blue', K.ONE / K.TEN);
      ctx.fillRect(plot.x, plot.y, plot.w, plot.h);
      ctx.strokeStyle = Deck.rgba('line-strong', K.ONE);
      ctx.lineWidth = K.ONE;
      ctx.beginPath();
      ctx.moveTo(plot.x, plot.y + plot.h);
      ctx.lineTo(plot.x + plot.w, plot.y + plot.h);
      ctx.stroke();

      var targetY = plot.y + plot.h - plot.h / (K.ONE + K.ONE / K.FOUR);
      ctx.setLineDash([K.SIX, K.SIX]);
      ctx.strokeStyle = Deck.rgba('accent-blue', K.ONE);
      ctx.beginPath();
      ctx.moveTo(plot.x, targetY);
      ctx.lineTo(plot.x + plot.w, targetY);
      ctx.stroke();
      ctx.setLineDash([]);
      drawLabel(ctx, '目标高度 ' + P.formatDistance(targetAltitude), plot.x + K.EIGHT, targetY - K.TEN, Deck.rgba('accent-blue', K.ONE), 'left');
      drawLabel(ctx, '飞行轨迹', plot.x, plot.y - K.TEN, Deck.rgba('ink', K.ONE), 'left');
      if (sim) {
        drawLabel(
          ctx,
          '推重比 ' + P.formatNumber(sim.thrustToWeight) + ' · 竖直合加速度 ' + P.formatNumber(sim.netVerticalAcceleration) + ' m/s²',
          plot.x + plot.w,
          plot.y - K.TEN,
          Deck.rgba('ink-muted', K.ONE),
          'right'
        );
      }

      drawTrajectory(ctx, comparison.vertical.trail, plot, Deck.rgba('ink-faint', K.ONE), K.TWO, K.HALF);
      drawTrajectory(ctx, comparison.sudden.trail, plot, Deck.rgba('accent-warm', K.ONE), K.TWO, K.HALF);
      drawTrajectory(ctx, comparison.smooth.trail, plot, Deck.rgba('accent-blue', K.ONE), K.TWO, K.HALF);
      drawTrajectory(ctx, currentTrail, plot, Deck.rgba('accent', K.ONE), K.THREE, K.ONE);

      if (sim && sim.trail.length) {
        var worldX = targetAltitude * K.THREE;
        var rx = plot.x + sim.x / worldX * plot.w;
        var ry = plot.y + plot.h - Math.max(K.ZERO, sim.y) / (targetAltitude * (K.ONE + K.ONE / K.FOUR)) * plot.h;
        ctx.fillStyle = Deck.rgba('accent', K.ONE);
        ctx.beginPath();
        ctx.arc(rx, ry, K.SIX, K.ZERO, K.TWO_PI);
        ctx.fill();
        ctx.strokeStyle = Deck.rgba('accent', K.ONE);
        ctx.fillStyle = Deck.rgba('accent', K.ONE);
        Deck.arrow(ctx, rx, ry, rx + sim.vx / K.HUNDRED, ry, K.SIX);
        ctx.strokeStyle = Deck.rgba('accent-blue', K.ONE);
        ctx.fillStyle = Deck.rgba('accent-blue', K.ONE);
        Deck.arrow(ctx, rx, ry, rx, ry - sim.vy / K.HUNDRED, K.SIX);
      }

      ctx.strokeStyle = Deck.rgba('line-strong', K.ONE);
      ctx.strokeRect(curveBox.x, curveBox.y, curveBox.w, curveBox.h);
      drawLabel(ctx, '姿态角曲线：竖直 → 水平', curveBox.x, curveBox.y - K.TEN, Deck.rgba('ink', K.ONE), 'left');
      drawTick(ctx, '燃烧开始', curveBox.x, curveBox.y + curveBox.h + K.TWO * K.EIGHT, 'left');
      drawTick(ctx, '燃烧结束', curveBox.x + curveBox.w, curveBox.y + curveBox.h + K.TWO * K.EIGHT, 'right');

      ctx.strokeStyle = Deck.rgba('accent', K.ONE);
      ctx.lineWidth = K.THREE;
      ctx.beginPath();
      angles.forEach(function (angle, index) {
        var px = curveBox.x + index / (angles.length - K.ONE) * curveBox.w;
        var py = curveBox.y + curveBox.h - angle / maxAngle * curveBox.h;
        if (index === K.ZERO) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();

      angles.forEach(function (angle, index) {
        var px = curveBox.x + index / (angles.length - K.ONE) * curveBox.w;
        var py = curveBox.y + curveBox.h - angle / maxAngle * curveBox.h;
        ctx.fillStyle = index === selectedNode ? Deck.rgba('focus', K.ONE) : Deck.rgba('accent', K.ONE);
        ctx.beginPath();
        ctx.arc(px, py, index === selectedNode ? K.EIGHT : K.SIX, K.ZERO, K.TWO_PI);
        ctx.fill();
      });
    }

    function redraw() {
      if (canvasFit) canvasFit.redraw();
    }

    function editFromPointer(event) {
      if (!curveBox) return;
      var pt = Deck.pt(cv, event);
      var fraction = P.clamp((pt.x - curveBox.x) / curveBox.w, K.ZERO, K.ONE);
      selectedNode = Math.round(fraction * (angles.length - K.ONE));
      angles[selectedNode] = P.clamp((curveBox.y + curveBox.h - pt.y) / curveBox.h * maxAngle, K.ZERO, maxAngle);
      markCustom();
      syncEditor();
      redraw();
    }

    presetSelect.addEventListener('change', function () {
      setProgram(presetSelect.value);
    });
    nodeSelect.addEventListener('change', function () {
      selectedNode = Number(nodeSelect.value);
      syncEditor();
      redraw();
    });
    angleRange.addEventListener('input', function () {
      angles[selectedNode] = P.clamp(Number(angleRange.value), K.ZERO, maxAngle);
      markCustom();
      syncEditor();
      redraw();
    });
    flyButton.addEventListener('click', fly);
    resetButton.addEventListener('click', function () {
      setProgram(presetSelect.value);
    });
    cv.addEventListener('pointerdown', function (event) {
      dragging = true;
      cv.setPointerCapture(event.pointerId);
      editFromPointer(event);
    });
    cv.addEventListener('pointermove', function (event) {
      if (dragging) editFromPointer(event);
    });
    cv.addEventListener('pointerup', function (event) {
      dragging = false;
      if (cv.hasPointerCapture(event.pointerId)) cv.releasePointerCapture(event.pointerId);
    });
    cv.addEventListener('pointercancel', function () {
      dragging = false;
    });

    comparison.vertical = runComplete(presets.vertical);
    comparison.sudden = runComplete(presets.sudden);
    comparison.smooth = runComplete(presets.smooth);
    sim = makeSimulation(angles);
    currentTrail = sim.trail;
    updateComparison();
    syncEditor();
    updateReadouts(sim);
    canvasFit = Deck.autofit(cv, draw);
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
