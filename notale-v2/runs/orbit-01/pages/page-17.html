<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="17" data-total="20">
<div id="stage">
  <main class="page">
    <header id="lec-header"></header>

    <section class="page-body split min0" aria-label="地球自转助推实验">
      <figure class="visual-shell min0" aria-label="地球自转、发射点与初始惯性速度向量">
        <canvas id="globe" class="cv-fill no-pan" tabindex="0" role="application" aria-label="可拖动发射点的三维地球；上下方向键也可改变纬度"></canvas>
      </figure>

      <aside class="panel min0 stack-4" aria-label="任务说明与控制">
        <div class="stack-2">
          <p class="panel-kicker">同一目标轨道</p>
          <h2 class="panel-title">移动发射场，重算速度预算</h2>
        </div>

        <p class="prose muted">拖动地球表面的发射点，或用纬度滑块。绿色箭头是发射点已经拥有的惯性速度；它不是发动机额外产生的速度。</p>

        <div class="callout">
          <span class="callout-title">方向只作预算比较</span>
          <p>目标平面在图中只作方向参考；倾角与变轨代价回看 page-08。</p>
        </div>

        <div class="control-group">
          <label class="control-label" for="latitude">发射纬度</label>
          <div class="control-row">
            <span class="label">南 ← 纬度 → 北</span>
            <input id="latitude" type="range" aria-describedby="latitude-value">
            <output id="latitude-value" class="control-value" for="latitude"></output>
          </div>
        </div>

        <div class="control-group">
          <span class="control-label">发射方向</span>
          <div class="segmented" role="group" aria-label="发射方向">
            <button id="prograde" type="button" class="is-active" aria-pressed="true">顺行</button>
            <button id="retrograde" type="button" aria-pressed="false">逆行</button>
            <button id="equatorial" type="button" aria-pressed="false">赤道顺行</button>
          </div>
        </div>

        <div class="readout-grid">
          <div class="readout">
            <span class="readout-label">继承的惯性速度</span>
            <strong id="inherited" class="readout-value"></strong>
          </div>
          <div class="readout is-blue">
            <span class="readout-label">赤道参考速度</span>
            <strong id="equator-speed" class="readout-value"></strong>
          </div>
          <div class="readout is-warm">
            <span class="readout-label">预算变化</span>
            <strong id="budget-change" class="readout-value"></strong>
          </div>
          <div class="readout">
            <span class="readout-label">火箭所需 Δv</span>
            <strong id="required" class="readout-value"></strong>
          </div>
        </div>
      </aside>
    </section>

    <footer id="lec-footer"></footer>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';

    Lec.mount({
      index: 17,
      kicker: `ROTATION BOOST`,
      title: `为什么发射地点和发射方向也会改变燃料需求`,
      take: `火箭起飞时已经继承了发射点随地球自转的速度。`
    });

    var header = document.getElementById('lec-header');
    var footer = document.getElementById('lec-footer');
    header.classList.add('page-header');
    footer.classList.add('page-footer');
    header.querySelector('.lec-header__top').classList.add('cluster');
    header.querySelector('.lec-header__kicker').classList.add('kicker');
    header.querySelector('.lec-header__index').classList.add('page-number');
    header.querySelector('.lec-header__title').classList.add('page-title');
    footer.querySelector('.lec-footer__take').classList.add('accent');
    footer.querySelector('.lec-footer__topic').classList.add('footer-meta');

    var K = Lec.K;
    var P = Lec.P;
    var canvas = document.getElementById('globe');
    var latitude = document.getElementById('latitude');
    var latitudeValue = document.getElementById('latitude-value');
    var inherited = document.getElementById('inherited');
    var equatorSpeedNode = document.getElementById('equator-speed');
    var budgetChange = document.getElementById('budget-change');
    var required = document.getElementById('required');
    var buttons = {
      prograde: document.getElementById('prograde'),
      retrograde: document.getElementById('retrograde'),
      equatorial: document.getElementById('equatorial')
    };

    latitude.min = String(-P.radiansToDegrees(K.HALF_PI));
    latitude.max = String(P.radiansToDegrees(K.HALF_PI));
    latitude.step = String(K.ONE);
    latitude.value = String(K.ZERO);

    var state = {
      latitude: K.ZERO,
      longitude: K.HALF_PI,
      direction: 'prograde',
      rotation: K.ZERO,
      dragging: false
    };
    var latest = null;
    var ctx = Deck.fit(canvas);

    function losses() {
      return {
        gravity: K.TYPICAL_GRAVITY_LOSS,
        drag: K.TYPICAL_DRAG_LOSS,
        steering: K.TYPICAL_STEERING_LOSS
      };
    }

    function calculations() {
      var localSpeed = P.surfaceRotationSpeedAtLatitude(state.latitude);
      var benefit = P.rotationBenefitAtLatitude(state.latitude);
      var equatorSurfaceSpeed = P.surfaceRotationSpeed(K.ZERO);
      var equatorBenefit = P.rotationBenefit(K.ZERO);
      var base = P.deltaVBudget(K.TYPICAL_LEO_SPEED, losses()).total;
      var current;
      var signedSpeed;

      if (state.direction === 'retrograde') {
        signedSpeed = -localSpeed;
        current = P.deltaVBudget(K.TYPICAL_LEO_SPEED + benefit, losses()).total;
      } else if (state.direction === 'equatorial') {
        signedSpeed = equatorSurfaceSpeed;
        current = P.launchDeltaV(
          K.TYPICAL_LEO_SPEED,
          K.TYPICAL_GRAVITY_LOSS,
          K.TYPICAL_DRAG_LOSS,
          K.TYPICAL_STEERING_LOSS,
          equatorBenefit
        );
      } else {
        signedSpeed = localSpeed;
        current = P.launchDeltaV(
          K.TYPICAL_LEO_SPEED,
          K.TYPICAL_GRAVITY_LOSS,
          K.TYPICAL_DRAG_LOSS,
          K.TYPICAL_STEERING_LOSS,
          benefit
        );
      }

      return {
        localSpeed: localSpeed,
        signedSpeed: signedSpeed,
        equatorSpeed: equatorSurfaceSpeed,
        current: current,
        saving: base - current
      };
    }

    function updateButtons() {
      Object.keys(buttons).forEach(function (name) {
        var active = state.direction === name;
        buttons[name].classList.toggle('is-active', active);
        buttons[name].setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    function updateReadouts() {
      latest = calculations();
      latitude.value = String(state.latitude);
      latitudeValue.textContent = P.formatNumber(state.latitude) + '°';
      inherited.textContent = P.formatVelocity(latest.signedSpeed);
      equatorSpeedNode.textContent = P.formatVelocity(latest.equatorSpeed);
      budgetChange.textContent = (latest.saving >= K.ZERO ? '−' : '+') +
        P.formatVelocity(Math.abs(latest.saving));
      required.textContent = P.formatVelocity(latest.current);
      updateButtons();
    }

    function rotateY(x, y, z, angle) {
      var c = Math.cos(angle);
      var s = Math.sin(angle);
      return {
        x: x * c + z * s,
        y: y,
        z: -x * s + z * c
      };
    }

    function spherePoint(latDeg, lonRad, rotation) {
      var latRad = P.degreesToRadians(latDeg);
      var cosLat = Math.cos(latRad);
      return rotateY(
        cosLat * Math.cos(lonRad),
        Math.sin(latRad),
        cosLat * Math.sin(lonRad),
        rotation
      );
    }

    function drawArrow(context, x1, y1, x2, y2, color, width) {
      context.strokeStyle = color;
      context.fillStyle = color;
      context.lineWidth = width;
      Deck.arrow(context, x1, y1, x2, y2, 10);
    }

    function draw(t, dt) {
      if (!ctx) {
        ctx = Deck.fit(canvas);
        if (!ctx) return;
      }
      if (!Deck.reduced()) {
        state.rotation += K.OMEGA_EARTH * (dt / K.THOUSAND) * K.HOUR;
      }

      var w = canvas.__w;
      var h = canvas.__h;
      var cx = w * K.HALF;
      var cy = h * K.HALF;
      var radius = Math.min(w, h) * 0.36;
      var ink = Deck.rgba('ink-muted', 0.72);
      var faint = Deck.rgba('ink-faint', 0.34);
      var line = Deck.rgba('line-strong', 0.58);
      var accent = Deck.rgba('accent', 1);
      var blue = Deck.rgba('accent-blue', 0.9);
      var warm = Deck.rgba('accent-warm', 1);
      var surface = Deck.rgba('surface-2', 1);
      var inset = Deck.rgba('surface-inset', 1);
      var font = Deck.token('font-sans');
      var mono = Deck.token('font-mono');
      var latStep = P.radiansToDegrees(K.PI / K.SIX);
      var lonStep = K.PI / K.SIX;
      var sampleStep = K.PI / (K.HUNDRED * K.TWO);
      var latRad;
      var lon;
      var a;
      var p;
      var started;

      ctx.clearRect(K.ZERO, K.ZERO, w, h);
      ctx.fillStyle = inset;
      ctx.fillRect(K.ZERO, K.ZERO, w, h);

      ctx.beginPath();
      ctx.arc(cx, cy, radius, K.ZERO, K.TWO_PI);
      ctx.fillStyle = surface;
      ctx.fill();
      ctx.strokeStyle = line;
      ctx.lineWidth = K.TWO;
      ctx.stroke();

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, radius, K.ZERO, K.TWO_PI);
      ctx.clip();

      ctx.strokeStyle = faint;
      ctx.lineWidth = K.ONE;
      for (latRad = -P.radiansToDegrees(K.PI / K.THREE); latRad <= P.radiansToDegrees(K.PI / K.THREE); latRad += latStep) {
        ctx.beginPath();
        started = false;
        for (a = K.ZERO; a <= K.TWO_PI + sampleStep; a += sampleStep) {
          p = spherePoint(latRad, a, state.rotation);
          if (p.z >= K.ZERO) {
            if (!started) ctx.moveTo(cx + p.x * radius, cy - p.y * radius);
            else ctx.lineTo(cx + p.x * radius, cy - p.y * radius);
            started = true;
          } else {
            started = false;
          }
        }
        ctx.stroke();
      }

      for (lon = K.ZERO; lon < K.TWO_PI; lon += lonStep) {
        ctx.beginPath();
        started = false;
        for (a = -K.HALF_PI; a <= K.HALF_PI + sampleStep; a += sampleStep) {
          p = rotateY(Math.cos(a) * Math.cos(lon), Math.sin(a), Math.cos(a) * Math.sin(lon), state.rotation);
          if (p.z >= K.ZERO) {
            if (!started) ctx.moveTo(cx + p.x * radius, cy - p.y * radius);
            else ctx.lineTo(cx + p.x * radius, cy - p.y * radius);
            started = true;
          } else {
            started = false;
          }
        }
        ctx.stroke();
      }

      ctx.strokeStyle = blue;
      ctx.lineWidth = K.TWO;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.ellipse(cx, cy, radius * 1.18, radius * 0.28, K.ZERO, K.ZERO, K.TWO_PI);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      p = spherePoint(state.latitude, state.longitude, state.rotation);
      var px = cx + p.x * radius;
      var py = cy - p.y * radius;
      var visible = p.z >= K.ZERO;
      var speedRatio = latest ? latest.localSpeed / latest.equatorSpeed : K.ONE;
      var directionSign = state.direction === 'retrograde' ? -K.ONE : K.ONE;
      var east = rotateY(-Math.sin(state.longitude), K.ZERO, Math.cos(state.longitude), state.rotation);
      var tangentX = east.x;
      var projectedLength = radius * (0.24 + 0.22 * speedRatio) * directionSign;
      var arrowEndX = px + tangentX * projectedLength;
      var arrowEndY = py;

      ctx.globalAlpha = visible ? K.ONE : 0.36;
      ctx.beginPath();
      ctx.arc(px, py, 9, K.ZERO, K.TWO_PI);
      ctx.fillStyle = warm;
      ctx.fill();
      ctx.strokeStyle = Deck.rgba('ink-strong', 1);
      ctx.lineWidth = K.TWO;
      ctx.stroke();
      drawArrow(ctx, px, py, arrowEndX, arrowEndY, accent, 4);
      ctx.globalAlpha = K.ONE;

      drawArrow(ctx, cx - radius * 0.72, cy + radius * 1.18, cx + radius * 0.72, cy + radius * 1.18, ink, K.TWO);
      ctx.fillStyle = ink;
      ctx.font = '600 14px ' + font;
      ctx.textAlign = 'center';
      ctx.fillText('地球自转方向', cx, cy + radius * 1.31);

      ctx.fillStyle = Deck.rgba('ink-strong', 1);
      ctx.font = '650 16px ' + font;
      ctx.textAlign = 'left';
      ctx.fillText('发射点', 24, 34);
      ctx.fillStyle = warm;
      ctx.font = '600 16px ' + mono;
      ctx.fillText(P.formatNumber(state.latitude) + '°', 24, 58);

      ctx.fillStyle = blue;
      ctx.font = '600 14px ' + font;
      ctx.textAlign = 'right';
      ctx.fillText('目标方向参考', w - 24, 34);
      ctx.fillStyle = accent;
      ctx.fillText('初始惯性速度向量', w - 24, h - 26);
    }

    function redrawNow() {
      updateReadouts();
      draw(K.ZERO, K.ZERO);
    }

    function setDirection(name) {
      state.direction = name;
      if (name === 'equatorial') {
        state.latitude = K.ZERO;
      }
      redrawNow();
    }

    latitude.addEventListener('input', function () {
      var value = Number(latitude.value);
      if (!P.isFinite(value)) return;
      state.latitude = P.clamp(value, Number(latitude.min), Number(latitude.max));
      if (state.direction === 'equatorial') state.direction = 'prograde';
      redrawNow();
    });

    Object.keys(buttons).forEach(function (name) {
      buttons[name].addEventListener('click', function () {
        setDirection(name);
      });
    });

    function setSiteFromPointer(event) {
      var point = Deck.pt(canvas, event);
      var w = canvas.__w;
      var h = canvas.__h;
      var cx = w * K.HALF;
      var cy = h * K.HALF;
      var radius = Math.min(w, h) * 0.36;
      var x = (point.x - cx) / radius;
      var y = -(point.y - cy) / radius;
      var d2 = x * x + y * y;
      if (d2 > K.ONE) return;
      var z = Math.sqrt(K.ONE - d2);
      var local = rotateY(x, y, z, -state.rotation);
      state.latitude = P.clamp(P.radiansToDegrees(Math.asin(local.y)), Number(latitude.min), Number(latitude.max));
      state.longitude = Math.atan2(local.z, local.x);
      if (state.direction === 'equatorial') state.direction = 'prograde';
      redrawNow();
    }

    canvas.addEventListener('pointerdown', function (event) {
      state.dragging = true;
      canvas.setPointerCapture(event.pointerId);
      setSiteFromPointer(event);
    });
    canvas.addEventListener('pointermove', function (event) {
      if (state.dragging) setSiteFromPointer(event);
    });
    canvas.addEventListener('pointerup', function (event) {
      state.dragging = false;
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointercancel', function () {
      state.dragging = false;
    });
    canvas.addEventListener('keydown', function (event) {
      if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
      event.preventDefault();
      state.latitude = P.clamp(
        state.latitude + (event.key === 'ArrowUp' ? K.ONE : -K.ONE),
        Number(latitude.min),
        Number(latitude.max)
      );
      if (state.direction === 'equatorial') state.direction = 'prograde';
      redrawNow();
    });

    updateReadouts();
    Deck.onResize(function () {
      ctx = Deck.fit(canvas);
      draw(K.ZERO, K.ZERO);
    });
    Deck.loop(draw, { still: K.ZERO });
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
