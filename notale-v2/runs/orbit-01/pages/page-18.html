<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="18" data-total="20">
<div id="stage">
  <main class="page">
    <header id="lec-header" class="page-header"></header>
    <section class="page-body split min0" aria-label="任务设计工作区">
      <figure class="visual-shell min0" aria-label="轨道平面、上升轨迹与速度预算联动图">
        <canvas id="mission-view" class="cv-fill" aria-hidden="true"></canvas>
      </figure>
      <aside class="panel min0 stack-3" aria-label="任务约束与方案选择">
        <div class="panel-heading">
          <p class="panel-kicker">约束卡 · 已领取</p>
          <h2 class="panel-title">把四个选择接成任务链</h2>
        </div>

        <div class="readout-grid is-three" aria-label="本次任务参数">
          <div class="readout"><span class="readout-label definition-description">载荷</span><strong id="task-mass" class="readout-value"></strong></div>
          <div class="readout is-blue"><span class="readout-label definition-description">发射纬度</span><strong id="task-site" class="readout-value"></strong></div>
          <div class="readout is-warm"><span class="readout-label definition-description">目标高度</span><strong id="task-alt" class="readout-value"></strong></div>
          <div class="readout"><span class="readout-label definition-description">目标倾角</span><strong id="task-inc" class="readout-value"></strong></div>
          <div class="readout is-blue"><span class="readout-label definition-description">可用级数</span><strong id="task-stages" class="readout-value"></strong></div>
          <div class="readout is-warm"><span class="readout-label definition-description">验证项</span><strong class="readout-value">轨道＋载荷</strong></div>
        </div>

        <div class="grid-2" aria-label="任务链选择">
          <div class="control-group">
            <label class="control-label definition-description" for="direction">发射方向</label>
            <select id="direction">
              <option value="east">顺行向东</option>
              <option value="polar">向北极向</option>
              <option value="west">逆行向西</option>
            </select>
          </div>
          <div class="control-group">
            <label class="control-label definition-description" for="turn">转弯策略</label>
            <select id="turn">
              <option value="smooth">平滑重力转弯</option>
              <option value="late">延迟转弯</option>
              <option value="vertical">长时间直上</option>
            </select>
          </div>
          <div class="control-group">
            <label class="control-label definition-description" for="separation">级间分离</label>
            <select id="separation">
              <option value="nominal">按计划分离</option>
              <option value="late">延迟分离</option>
              <option value="none">不分离</option>
            </select>
          </div>
          <div class="control-group">
            <label class="control-label definition-description" for="transfer">轨道转移</label>
            <select id="transfer">
              <option value="direct">直接入目标圆轨道</option>
              <option value="hohmann">先入低轨再转移</option>
            </select>
          </div>
        </div>

        <div class="cluster" aria-label="保存方案">
          <button id="save-a" type="button" class="is-primary">保存为方案 A</button>
          <button id="save-b" type="button">保存为方案 B</button>
        </div>

        <div id="verdict" class="callout" aria-live="polite">
          <span id="verdict-title" class="callout-title"></span>
          <p id="verdict-text"></p>
        </div>
      </aside>
    </section>
    <footer id="lec-footer" class="page-footer"></footer>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';

    Lec.mount({
      index: 18,
      kicker: `MISSION DESIGN`,
      title: `给任务一张约束卡，你能把载荷送到正确的轨道吗`,
      take: `没有“最好的火箭”，只有在目标、地点、时间和载荷约束下合适的方案。`
    });

    var stage = document.getElementById('stage');
    var header = stage.querySelector('#lec-header');
    var footer = stage.querySelector('#lec-footer');
    header.className = 'page-header';
    footer.className = 'page-footer';
    header.querySelector('h1').className = 'page-title';
    header.querySelector('.lec-header__kicker').className = 'kicker';
    header.querySelector('.lec-header__top').className = 'cluster';
    footer.querySelector('.lec-footer__topic').className = 'footer-meta';

    var K = Lec.K;
    var P = Lec.P;
    var task = {
      payload: K.THOUSAND * K.EIGHT,
      latitude: K.TEN * K.THREE,
      altitude: K.ISS_ALTITUDE,
      inclination: P.radiansToDegrees(K.PI / K.SIX),
      stageCount: K.TWO
    };
    var state = {
      direction: 'east',
      turn: 'smooth',
      separation: 'nominal',
      transfer: 'direct',
      saved: [null, null]
    };
    var cv = stage.querySelector('#mission-view');
    var fitter;
    var result;

    var directionNames = { east: '顺行', polar: '极向', west: '逆行' };
    var turnNames = { smooth: '平滑转弯', late: '延迟转弯', vertical: '直上' };
    var separationNames = { nominal: '按计划分离', late: '延迟分离', none: '不分离' };
    var transferNames = { direct: '直接入轨', hohmann: '低轨转移' };

    function durationText(seconds) {
      var d = P.formatDuration(seconds);
      if (d.hours > K.ZERO) return d.hours + ' h ' + d.minutes + ' min';
      if (d.minutes > K.ZERO) return d.minutes + ' min ' + d.seconds + ' s';
      return d.seconds + ' s';
    }

    function rocketFor(mode) {
      var first = {
        specificImpulse: K.HUNDRED * K.THREE,
        wetMass: K.THOUSAND * K.HUNDRED * K.FOUR,
        dryMass: K.THOUSAND * K.TEN * K.FOUR
      };
      var second = {
        specificImpulse: K.HUNDRED * K.FOUR + K.TEN * (K.FOUR + K.ONE),
        wetMass: K.THOUSAND * K.TEN * K.SIX,
        dryMass: K.THOUSAND * K.TEN + K.THOUSAND * K.TWO
      };
      if (mode === 'late') {
        second = {
          specificImpulse: second.specificImpulse,
          wetMass: second.wetMass + first.dryMass,
          dryMass: second.dryMass + first.dryMass
        };
      }
      if (mode === 'none') {
        return [{
          specificImpulse: first.specificImpulse,
          wetMass: first.wetMass + second.wetMass,
          dryMass: first.dryMass + second.dryMass
        }];
      }
      return [first, second];
    }

    function compute() {
      var orbit = P.orbitAtAltitude(task.altitude);
      var lowOrbit = P.orbitAtAltitude(K.LOW_EARTH_ORBIT_ALTITUDE);
      var rotation = P.rotationBenefitAtLatitude(task.latitude);
      var actualInclination;
      var rotationCredit = K.ZERO;
      var directionPenalty = K.ZERO;
      var gravity = K.TYPICAL_GRAVITY_LOSS;
      var drag = K.TYPICAL_DRAG_LOSS;
      var steering = K.TYPICAL_STEERING_LOSS;
      var insertionAltitude = task.altitude;
      var periapsis = task.altitude;
      var apoapsis = task.altitude;

      if (state.direction === 'east') {
        actualInclination = Math.abs(task.latitude);
        rotationCredit = rotation;
      } else if (state.direction === 'polar') {
        actualInclination = P.radiansToDegrees(K.HALF_PI);
      } else {
        actualInclination = K.HUNDRED + K.TEN * K.EIGHT - Math.abs(task.latitude);
        directionPenalty = rotation * K.TWO;
      }

      if (state.turn === 'late') {
        gravity *= K.ONE + K.HALF;
        steering *= K.TWO;
        periapsis = task.altitude - task.altitude / K.FOUR;
      } else if (state.turn === 'vertical') {
        gravity *= K.TWO;
        steering *= K.FOUR;
        periapsis = task.altitude * K.HALF;
        apoapsis = task.altitude + task.altitude / K.TWO;
      }

      var transfer = P.hohmannTransferFromAltitudes(
        K.LOW_EARTH_ORBIT_ALTITUDE,
        task.altitude
      );
      var maneuver = directionPenalty;
      var orbitalSpeed = orbit.circularVelocity;
      var transferTime = K.ZERO;
      if (state.transfer === 'hohmann') {
        insertionAltitude = K.LOW_EARTH_ORBIT_ALTITUDE;
        orbitalSpeed = lowOrbit.circularVelocity;
        maneuver += transfer.totalDeltaV;
        transferTime = transfer.transferTime;
        if (state.turn === 'smooth') {
          periapsis = task.altitude;
          apoapsis = task.altitude;
        }
      }

      var planeError = Math.abs(actualInclination - task.inclination);
      var planeCost = P.planeChangeDeltaV(
        orbit.circularVelocity,
        P.degreesToRadians(planeError)
      );
      var launchRequired = P.launchDeltaV(
        orbitalSpeed,
        gravity,
        drag,
        steering,
        rotationCredit
      );
      var budget = P.deltaVBudget(orbitalSpeed, {
        gravity: gravity,
        drag: drag,
        steering: steering,
        maneuver: maneuver + planeCost
      });
      var required = launchRequired + maneuver + planeCost;
      var rocket = P.multistageDeltaV(rocketFor(state.separation), task.payload, K.G0);
      var available = rocket.totalDeltaV;
      var delivered = available >= required ? task.payload : task.payload * available / required;
      var altitudeTolerance = task.altitude / K.TEN;
      var inclinationTolerance = K.TEN;
      var fuel = rocket.initialStackMass - task.payload;
      var failure = '';

      if (planeError > inclinationTolerance) {
        failure = '轨道平面先违反约束：倾角误差为 ' + P.formatNumber(planeError) + '°。';
      } else if (Math.abs(periapsis - task.altitude) > altitudeTolerance) {
        failure = '近地点先违反约束：验证值为 ' + P.formatDistance(periapsis) + '。';
      } else if (Math.abs(apoapsis - task.altitude) > altitudeTolerance) {
        failure = '远地点先违反约束：验证值为 ' + P.formatDistance(apoapsis) + '。';
      } else if (delivered < task.payload) {
        failure = '载荷先违反约束：最终只能交付 ' + P.formatMass(delivered) + '。';
      }

      return {
        orbit: orbit,
        insertionAltitude: insertionAltitude,
        inclination: actualInclination,
        planeError: planeError,
        periapsis: periapsis,
        apoapsis: apoapsis,
        transferTime: transferTime,
        required: required,
        available: available,
        margin: available - required,
        delivered: delivered,
        fuel: fuel,
        budget: budget,
        success: !failure,
        failure: failure,
        chain: directionNames[state.direction] + ' → ' + turnNames[state.turn] + ' → ' + separationNames[state.separation] + ' → ' + transferNames[state.transfer]
      };
    }

    function setTaskCard() {
      stage.querySelector('#task-mass').textContent = P.formatMass(task.payload);
      stage.querySelector('#task-site').textContent = P.formatNumber(task.latitude) + '°';
      stage.querySelector('#task-alt').textContent = P.formatDistance(task.altitude);
      stage.querySelector('#task-inc').textContent = P.formatNumber(task.inclination) + '°';
      stage.querySelector('#task-stages').textContent = P.formatNumber(task.stageCount) + ' 级';
    }

    function updateVerdict() {
      var box = stage.querySelector('#verdict');
      var title = stage.querySelector('#verdict-title');
      var text = stage.querySelector('#verdict-text');
      box.className = result.success ? 'callout' : 'callout is-danger';
      title.textContent = result.success ? '约束全部通过' : '验证中止 · 第一个违规项';
      text.textContent = result.success
        ? '余量 ' + P.formatVelocity(result.margin) + '；最终载荷 ' + P.formatMass(result.delivered) + '。'
        : result.failure;
    }

    function line(ctx, x1, y1, x2, y2, color, width, dash) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.setLineDash(dash || []);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, radius);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = K.TWO;
      ctx.stroke();
    }

    function drawSaved(ctx, item, label, x, y, width, height, colors) {
      roundRect(ctx, x, y, width, height, K.TEN, Deck.rgba('surface-2', 0.9), Deck.rgba('line-strong', 0.9));
      ctx.fillStyle = item ? colors.accent : colors.muted;
      ctx.font = '650 16px ' + Deck.token('font-sans');
      ctx.fillText('方案 ' + label, x + K.TEN * K.TWO, y + K.TEN * K.THREE);
      ctx.font = '500 14px ' + Deck.token('font-mono');
      ctx.fillStyle = colors.ink;
      if (!item) {
        ctx.fillText('尚未保存', x + K.TEN * K.TWO, y + K.TEN * K.SIX);
        return;
      }
      ctx.fillText('载荷 ' + P.formatMass(item.delivered), x + K.TEN * K.TWO, y + K.TEN * K.SIX);
      ctx.fillText('燃料 ' + P.formatMass(item.fuel), x + width * K.HALF, y + K.TEN * K.SIX);
      ctx.fillText('倾角误差 ' + P.formatNumber(item.planeError) + '°', x + K.TEN * K.TWO, y + K.TEN * (K.TEN - K.ONE));
      ctx.fillText('转移 ' + durationText(item.transferTime), x + width * K.HALF, y + K.TEN * (K.TEN - K.ONE));
    }

    function draw(ctx, w, h) {
      if (!ctx || !result) return;
      var colors = {
        accent: Deck.rgba('accent', 1),
        blue: Deck.rgba('accent-blue', 1),
        warm: Deck.rgba('accent-warm', 1),
        danger: Deck.rgba('danger', 1),
        ink: Deck.rgba('ink', 1),
        muted: Deck.rgba('ink-muted', 1),
        faint: Deck.rgba('ink-faint', 1),
        line: Deck.rgba('line', 1)
      };
      var cx = w * K.HALF;
      var cy = h * (K.ONE_THIRD + K.ONE / K.TEN);
      var earthR = Math.min(w, h) / K.SIX;
      var orbitR = earthR * (K.ONE + K.HALF);
      var tilt = P.degreesToRadians(result.inclination);
      var top = h / K.TEN;
      var meterY = h * (K.ONE - K.ONE / K.FOUR);
      var savedY = h * (K.ONE - K.ONE / K.SIX);

      ctx.clearRect(K.ZERO, K.ZERO, w, h);

      ctx.fillStyle = colors.muted;
      ctx.font = '650 14px ' + Deck.token('font-sans');
      ctx.fillText('实时任务链', w / K.TEN, top);
      ctx.fillStyle = colors.ink;
      ctx.font = '650 18px ' + Deck.token('font-sans');
      ctx.fillText(result.chain, w / K.TEN, top + K.TEN * K.THREE);

      line(ctx, w / K.TEN, top + K.TEN * (K.FOUR + K.ONE), w * (K.ONE - K.ONE / K.TEN), top + K.TEN * (K.FOUR + K.ONE), colors.line, K.TWO);
      var chainLabels = ['发射', '转弯', '分级', '转移', '验证'];
      for (var i = K.ZERO; i < chainLabels.length; i += K.ONE) {
        var px = w / K.TEN + i * (w * (K.ONE - K.TWO / K.TEN) / K.FOUR);
        ctx.beginPath();
        ctx.arc(px, top + K.TEN * (K.FOUR + K.ONE), K.EIGHT, K.ZERO, K.TWO_PI);
        ctx.fillStyle = i === chainLabels.length - K.ONE && !result.success ? colors.danger : colors.accent;
        ctx.fill();
        ctx.fillStyle = colors.muted;
        ctx.font = '500 14px ' + Deck.token('font-sans');
        ctx.textAlign = 'center';
        ctx.fillText(chainLabels[i], px, top + K.TEN * K.EIGHT);
      }
      ctx.textAlign = 'left';

      ctx.beginPath();
      ctx.arc(cx, cy, earthR, K.ZERO, K.TWO_PI);
      ctx.fillStyle = Deck.rgba('accent-blue', 0.15);
      ctx.fill();
      ctx.strokeStyle = colors.blue;
      ctx.lineWidth = K.TWO;
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(cx, cy, orbitR, orbitR * Math.max(K.ONE / K.FOUR, Math.abs(Math.cos(tilt))), tilt / K.TWO, K.ZERO, K.TWO_PI);
      ctx.strokeStyle = result.success ? colors.accent : colors.danger;
      ctx.lineWidth = K.THREE;
      ctx.stroke();
      line(ctx, cx - earthR, cy, cx + earthR, cy, Deck.rgba('line-strong', 0.8), K.TWO, [K.EIGHT, K.EIGHT]);

      ctx.fillStyle = colors.ink;
      ctx.font = '650 16px ' + Deck.token('font-sans');
      ctx.fillText('轨道平面', cx - orbitR, cy - orbitR * K.HALF);
      ctx.fillStyle = colors.muted;
      ctx.font = '500 14px ' + Deck.token('font-mono');
      ctx.fillText('倾角 ' + P.formatNumber(result.inclination) + '°', cx - orbitR, cy - orbitR * K.HALF + K.TEN * K.THREE);
      ctx.fillText('近地点 ' + P.formatDistance(result.periapsis), cx - orbitR, cy + orbitR * K.HALF);
      ctx.fillText('远地点 ' + P.formatDistance(result.apoapsis), cx - orbitR, cy + orbitR * K.HALF + K.TEN * K.THREE);

      var rocketX = w / K.SIX;
      var groundY = cy + orbitR;
      line(ctx, rocketX, groundY, rocketX + earthR * K.HALF, cy - earthR, colors.warm, K.FOUR);
      ctx.beginPath();
      ctx.moveTo(rocketX + earthR * K.HALF, cy - earthR);
      ctx.lineTo(rocketX + earthR * K.HALF - K.TEN, cy - earthR + K.TEN * K.THREE);
      ctx.lineTo(rocketX + earthR * K.HALF + K.TEN, cy - earthR + K.TEN * K.THREE);
      ctx.closePath();
      ctx.fillStyle = colors.warm;
      ctx.fill();
      ctx.fillStyle = colors.muted;
      ctx.font = '500 14px ' + Deck.token('font-sans');
      ctx.fillText('上升验证', rocketX - K.TEN * K.TWO, groundY + K.TEN * K.THREE);

      var barX = w / K.TEN;
      var barW = w * (K.ONE - K.TWO / K.TEN);
      var ratio = P.clamp(result.available / result.required, K.ZERO, K.ONE + K.HALF);
      roundRect(ctx, barX, meterY, barW, K.TEN * K.THREE, K.SIX, Deck.rgba('surface-3', 1), colors.line);
      ctx.fillStyle = result.margin >= K.ZERO ? colors.accent : colors.danger;
      ctx.fillRect(barX, meterY, barW * Math.min(K.ONE, ratio), K.TEN * K.THREE);
      ctx.fillStyle = colors.ink;
      ctx.font = '650 16px ' + Deck.token('font-mono');
      ctx.fillText('可用 ' + P.formatVelocity(result.available), barX, meterY - K.TEN);
      ctx.textAlign = 'right';
      ctx.fillText('需求 ' + P.formatVelocity(result.required), barX + barW, meterY - K.TEN);
      ctx.textAlign = 'left';

      var cardGap = K.TEN * K.TWO;
      var cardW = (barW - cardGap) / K.TWO;
      drawSaved(ctx, state.saved[K.ZERO], 'A', barX, savedY, cardW, h - savedY - K.TEN, colors);
      drawSaved(ctx, state.saved[K.ONE], 'B', barX + cardW + cardGap, savedY, cardW, h - savedY - K.TEN, colors);
    }

    function refresh() {
      result = compute();
      updateVerdict();
      if (fitter) fitter.redraw();
    }

    ['direction', 'turn', 'separation', 'transfer'].forEach(function (id) {
      var control = stage.querySelector('#' + id);
      control.addEventListener('change', function () {
        state[id] = control.value;
        refresh();
      });
    });

    stage.querySelector('#save-a').addEventListener('click', function () {
      state.saved[K.ZERO] = Object.assign({}, result);
      refresh();
    });
    stage.querySelector('#save-b').addEventListener('click', function () {
      state.saved[K.ONE] = Object.assign({}, result);
      refresh();
    });

    setTaskCard();
    result = compute();
    updateVerdict();
    fitter = Deck.autofit(cv, draw);
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
