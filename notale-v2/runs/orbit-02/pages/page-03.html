<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="03" data-total="20">
<div id="stage">
  <style>
    .air-page {
      --split-left: 1.62fr;
      --split-right: .78fr;
      gap: var(--space-5);
      padding-block: var(--space-5);
    }
    .air-page .layout-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-5);
      min-inline-size: 0;
    }
    .air-page .instruction {
      margin: 0;
      color: var(--text-muted);
      font-size: var(--fs-small);
      line-height: var(--lh-body);
    }
    .air-page .instruction strong { color: var(--text-strong); }
    .air-page .layout-left {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: var(--space-3);
    }
    .air-page .tunnel-frame {
      position: relative;
      min-inline-size: 0;
      min-block-size: 0;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      background: var(--surface-inset);
      box-shadow: var(--shadow-panel);
    }
    .air-page .tunnel-frame::before {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px var(--line);
      content: "";
      pointer-events: none;
    }
    .air-page canvas {
      display: block;
      inline-size: 100%;
      block-size: 100%;
      min-block-size: 430px;
      outline: none;
    }
    .air-page canvas:focus-visible { box-shadow: inset 0 0 0 4px var(--focus); }
    .air-page .tunnel-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      color: var(--text-muted);
      font-size: var(--fs-caption);
      line-height: var(--lh-tight);
    }
    .air-page .key-hint { color: var(--text-faint); }
    .air-page .layout-right {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .air-page .control-panel {
      gap: var(--space-3);
      padding: var(--space-4);
    }
    .air-page .control-row { justify-content: space-between; }
    .air-page select { max-inline-size: 260px; }
    .air-page .specs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-2);
    }
    .air-page .spec {
      min-inline-size: 0;
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-1);
    }
    .air-page .spec span {
      display: block;
      color: var(--text-faint);
      font-size: var(--fs-caption);
      line-height: var(--lh-tight);
    }
    .air-page .spec strong {
      display: block;
      overflow: hidden;
      color: var(--text-strong);
      font-family: var(--font-mono);
      font-size: var(--fs-label);
      line-height: var(--lh-tight);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .air-page .readout-panel {
      --readout-cols: 2;
      flex: 1 1 auto;
      gap: var(--space-2);
      padding: var(--space-3);
    }
    .air-page .readout {
      min-block-size: 82px;
      padding: var(--space-3);
    }
    .air-page .readout-value { font-size: var(--fs-h3); }
    .air-page .readout-value.compact { font-size: var(--fs-label); }
    .air-page .relation {
      margin: 0;
      padding: var(--space-3) var(--space-4);
      border-inline-start: 3px solid var(--accent);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      background: var(--accent-soft);
      font-size: var(--fs-small);
      line-height: var(--lh-body);
    }
    .air-page .relation strong { color: var(--accent-strong); }
    .air-page .layout-foot {
      display: flex;
      justify-content: flex-end;
    }
    @media (prefers-reduced-motion: reduce) {
      .air-page * { transition-duration: 0.01ms !important; }
    }
  </style>

  <main class="split-lr air-page" aria-label="分层粒子风洞实验">
    <section class="layout-head">
      <p class="instruction"><strong>拖动试验体改变高度；拖动气流箭头改变相对速度。</strong>先固定一个变量，再比较另一个。</p>
      <span class="status status--live" id="mode-status">实时物理输入</span>
    </section>

    <figure class="layout-left min0">
      <div class="tunnel-frame min0">
        <canvas id="wind-canvas" class="cv-fill no-pan" width="900" height="500" tabindex="0" role="application" aria-label="风洞：方向键改变高度，按住 Shift 加左右键改变气流速度"></canvas>
      </div>
      <figcaption class="tunnel-caption">
        <span>粒子只表现介质；全部仪表共享同一组高度、速度与外形输入。</span>
        <span class="key-hint">↑↓ 高度　Shift＋←→ 气流</span>
      </figcaption>
    </figure>

    <aside class="layout-right min0" aria-label="风洞仪表与试验体设置">
      <div class="control-panel">
        <div class="control-row">
          <label class="control-label" for="body-select">替换试验体</label>
          <select id="body-select" aria-label="选择试验体">
            <option value="stream">流线探针</option>
            <option value="capsule">钝头舱</option>
            <option value="heavy">重载体</option>
          </select>
        </div>
        <div class="specs" aria-label="试验体参数">
          <div class="spec"><span>迎风面积</span><strong id="area-out">—</strong></div>
          <div class="spec"><span>质量</span><strong id="mass-out">—</strong></div>
          <div class="spec"><span>阻力系数</span><strong id="cd-out">—</strong></div>
        </div>
      </div>

      <div class="readout-panel" aria-live="polite">
        <div class="readout"><span class="readout-label">高度</span><strong class="readout-value" id="alt-out">—</strong></div>
        <div class="readout"><span class="readout-label">相对速度</span><strong class="readout-value" id="speed-out">—</strong></div>
        <div class="readout"><span class="readout-label">温度</span><strong class="readout-value" id="temp-out">—</strong></div>
        <div class="readout"><span class="readout-label">压强</span><strong class="readout-value" id="pressure-out">—</strong></div>
        <div class="readout"><span class="readout-label">空气密度</span><strong class="readout-value" id="density-out">—</strong></div>
        <div class="readout"><span class="readout-label">声速 / 马赫数</span><strong class="readout-value compact" id="mach-out">—</strong></div>
        <div class="readout readout--accent"><span class="readout-label">动压</span><strong class="readout-value" id="q-out">—</strong></div>
        <div class="readout readout--accent"><span class="readout-label">阻力 / 减速度</span><strong class="readout-value compact" id="drag-out">—</strong></div>
      </div>

      <p class="relation" id="relation">保持外形不变：<strong>动压同时受密度与速度平方控制。</strong></p>
    </aside>

    <div class="layout-foot">
      <button id="reset" class="button button--quiet" type="button">恢复初始风洞</button>
    </div>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      'use strict';

      Lec.mount({
        index: 3,
        kicker: `AIR`,
        title: `真正妨碍高速飞行的，是还没离开的<em>大气</em>`,
        take: `空气越稠、相对速度越大，阻力和动压越不能忽略。`
      });

      const P = Lec.P;
      const K = Lec.K;
      const cv = document.getElementById('wind-canvas');
      const select = document.getElementById('body-select');
      const reset = document.getElementById('reset');
      const W = Number(cv.getAttribute('width'));
      const H = Number(cv.getAttribute('height'));
      const maxAltitude = K.atmosphere.maxIsaAltitude;
      const maxSpeed = K.orbit.leoTypicalSpeed;
      const initial = Object.freeze({
        altitude: K.atmosphere.layers[2].altitude,
        speed: K.rocket.typicalGravityLoss,
        body: 'stream'
      });
      const bodies = Object.freeze({
        stream: Object.freeze({ area: K.vehicles.v2.height, mass: K.vehicles.v2.liftoffMass, cd: K.units.ft, shape: 0 }),
        capsule: Object.freeze({ area: K.vehicles.falcon9.height, mass: K.vehicles.falcon9.payloadToLeo, cd: K.units.m, shape: 1 }),
        heavy: Object.freeze({ area: K.vehicles.saturnV.height, mass: K.vehicles.saturnV.payloadToLeo, cd: K.atmosphere.heatCapacityRatio, shape: 2 })
      });
      const state = { altitude: initial.altitude, speed: initial.speed, body: initial.body, drag: null };
      const out = {};
      ['area','mass','cd','alt','speed','temp','pressure','density','mach','q','drag'].forEach(function (key) {
        out[key] = document.getElementById(key + '-out');
      });
      const relation = document.getElementById('relation');
      const particles = [];
      const particleCount = 220;
      let ctx = Deck.fit(cv);
      let lastAnnounced = '';

      function seeded(i, n) {
        return ((i * n) % particleCount) / particleCount;
      }
      for (let i = 0; i < particleCount; i += 1) {
        particles.push({
          x: seeded(i + 1, 83) * W,
          y: seeded(i + 7, 137) * H,
          size: 1 + seeded(i + 3, 29) * 2,
          phase: seeded(i + 11, 53) * K.TWO_PI
        });
      }

      function compute() {
        const isa = P.isaAtmosphere(state.altitude);
        const standard = P.standardAtmosphere(state.altitude);
        const density = P.atmosphericDensity(state.altitude);
        const sound = P.speedOfSound(isa.temperature);
        const mach = P.machNumber(state.speed, sound, true);
        const body = bodies[state.body];
        const q = P.dynamicPressure(density, state.speed);
        const force = P.dragForce(density, state.speed, body.cd, body.area);
        const acceleration = P.dragAcceleration(density, state.speed, body.cd, body.area, body.mass);
        return { isa: isa, standard: standard, density: density, sound: sound, mach: mach, body: body, q: q, force: force, acceleration: acceleration };
      }

      function updateReadouts() {
        const r = compute();
        out.area.textContent = P.formatNumber(r.body.area, 1) + ' m²';
        out.mass.textContent = P.formatMass(r.body.mass, 0);
        out.cd.textContent = P.formatNumber(r.body.cd, 2);
        out.alt.textContent = P.formatDistance(state.altitude, 1);
        out.speed.textContent = P.formatSpeed(state.speed, 0);
        out.temp.textContent = P.formatNumber(r.isa.temperature, 1) + ' K';
        out.pressure.textContent = P.formatSI(r.standard.pressure, 'Pa', 2);
        out.density.textContent = P.formatSI(r.density, 'kg/m³', 2);
        out.mach.textContent = P.formatSpeed(r.sound, 0) + ' / M ' + P.formatNumber(r.mach, 2);
        out.q.textContent = P.formatSI(r.q, 'Pa', 2);
        out.drag.textContent = P.formatSI(r.force, 'N', 1) + ' / ' + P.formatNumber(r.acceleration, 1) + ' m/s²';
        relation.innerHTML = state.speed < K.atmosphere.seaLevelSoundSpeed
          ? '当前以密度变化为主：<strong>向上拖，粒子与动压一起迅速减少。</strong>'
          : '当前已进入高速区：<strong>速度平方会迅速放大动压与阻力。</strong>';
        const label = '当前高度' + out.alt.textContent + '，相对速度' + out.speed.textContent + '，动压' + out.q.textContent + '，阻力' + P.formatSI(r.force, 'N', 2);
        if (label !== lastAnnounced) {
          cv.setAttribute('aria-label', '风洞。' + label + '。方向键改变高度，按住 Shift 加左右键改变气流速度');
          lastAnnounced = label;
        }
      }

      function objectY() {
        return H - 76 - (state.altitude / maxAltitude) * (H - 132);
      }
      function speedX() {
        return 92 + (state.speed / maxSpeed) * (W - 180);
      }
      function setAltitudeFromY(y) {
        state.altitude = P.clamp((H - 76 - y) / (H - 132) * maxAltitude, 0, maxAltitude);
        updateReadouts();
      }
      function setSpeedFromX(x) {
        state.speed = P.clamp((x - 92) / (W - 180) * maxSpeed, 0, maxSpeed);
        updateReadouts();
      }

      function draw(time) {
        const r = compute();
        const oy = objectY();
        const sx = speedX();
        const densityRatio = P.clamp((Math.log(r.density) - Math.log(P.atmosphericDensity(maxAltitude))) / (Math.log(K.atmosphere.seaLevelDensity) - Math.log(P.atmosphericDensity(maxAltitude))), 0, 1);
        const visible = Math.round(18 + densityRatio * (particleCount - 18));
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = Deck.rgba('--surface-inset', 1);
        ctx.fillRect(0, 0, W, H);

        for (let i = 0; i < K.atmosphere.layers.length; i += 1) {
          const ly = H - 76 - (K.atmosphere.layers[i].altitude / maxAltitude) * (H - 132);
          ctx.strokeStyle = Deck.rgba('--chart-grid', i === 0 ? .8 : .5);
          ctx.lineWidth = 1;
          ctx.setLineDash(i === 0 ? [] : [5, 8]);
          ctx.beginPath();
          ctx.moveTo(62, ly);
          ctx.lineTo(W - 24, ly);
          ctx.stroke();
        }
        ctx.setLineDash([]);

        ctx.fillStyle = Deck.rgba('--text-muted', 1);
        ctx.font = '14px ' + Deck.token('--font-mono');
        ctx.textAlign = 'left';
        for (let i = 0; i < K.atmosphere.layers.length; i += 2) {
          const ly = H - 76 - (K.atmosphere.layers[i].altitude / maxAltitude) * (H - 132);
          ctx.fillText(P.formatDistance(K.atmosphere.layers[i].altitude, 0), 14, ly + 5);
        }

        const flow = state.speed / maxSpeed;
        for (let i = 0; i < visible; i += 1) {
          const p = particles[i];
          let px = p.x + (Deck.reduced() ? 0 : time * (18 + flow * 150) + Math.sin(time * .001 + p.phase) * 7);
          px %= W + 40;
          if (px < 0) px += W + 40;
          px -= 20;
          const dy = p.y - oy;
          let py = p.y;
          if (px > W * .48 && Math.abs(dy) < 60) py += (dy < 0 ? -1 : 1) * (1 - Math.abs(dy) / 60) * 28;
          ctx.fillStyle = Deck.rgba('--accent-2', .16 + densityRatio * .34);
          ctx.beginPath();
          ctx.arc(px, py, p.size, 0, K.TWO_PI);
          ctx.fill();
        }

        ctx.strokeStyle = Deck.rgba('--accent', .9);
        ctx.fillStyle = Deck.rgba('--accent', 1);
        ctx.lineWidth = 5;
        Deck.arrow(ctx, 92, H - 42, sx, H - 42, 16);
        ctx.beginPath();
        ctx.arc(sx, H - 42, 12, 0, K.TWO_PI);
        ctx.fill();
        ctx.fillStyle = Deck.rgba('--text-strong', 1);
        ctx.font = '16px ' + Deck.token('--font-sans');
        ctx.textAlign = 'left';
        ctx.fillText('气流 ' + P.formatSpeed(state.speed, 0), 92, H - 56);

        ctx.save();
        ctx.translate(W * .55, oy);
        ctx.shadowColor = Deck.rgba('--accent', .45);
        ctx.shadowBlur = 18;
        ctx.fillStyle = Deck.rgba('--warm', 1);
        ctx.strokeStyle = Deck.rgba('--text-strong', .9);
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (r.body.shape === 0) {
          ctx.moveTo(-54, 0); ctx.quadraticCurveTo(-20, -19, 46, -9); ctx.lineTo(62, 0); ctx.lineTo(46, 9); ctx.quadraticCurveTo(-20, 19, -54, 0);
        } else if (r.body.shape === 1) {
          ctx.moveTo(-35, -28); ctx.quadraticCurveTo(45, -22, 52, 0); ctx.quadraticCurveTo(45, 22, -35, 28); ctx.closePath();
        } else {
          ctx.rect(-46, -27, 92, 54);
        }
        ctx.fill(); ctx.stroke();
        ctx.restore();

        ctx.strokeStyle = Deck.rgba('--warm', .75);
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.beginPath(); ctx.moveTo(W * .55, 54); ctx.lineTo(W * .55, H - 76); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = Deck.rgba('--warm', 1);
        ctx.beginPath(); ctx.arc(W * .55, oy, 8, 0, K.TWO_PI); ctx.fill();
      }

      function pointerDown(e) {
        const p = Deck.pt(cv, e);
        const ox = W * .55;
        const oy = objectY();
        const sx = speedX();
        if (Math.hypot(p.x - ox, p.y - oy) <= 70) state.drag = 'altitude';
        else if (Math.hypot(p.x - sx, p.y - (H - 42)) <= 44 || p.y > H - 92) state.drag = 'speed';
        if (state.drag) {
          cv.setPointerCapture(e.pointerId);
          if (state.drag === 'altitude') setAltitudeFromY(p.y); else setSpeedFromX(p.x);
        }
      }
      function pointerMove(e) {
        if (!state.drag) return;
        const p = Deck.pt(cv, e);
        if (state.drag === 'altitude') setAltitudeFromY(p.y); else setSpeedFromX(p.x);
      }
      function pointerUp(e) {
        if (state.drag && cv.hasPointerCapture(e.pointerId)) cv.releasePointerCapture(e.pointerId);
        state.drag = null;
      }

      cv.addEventListener('pointerdown', pointerDown);
      cv.addEventListener('pointermove', pointerMove);
      cv.addEventListener('pointerup', pointerUp);
      cv.addEventListener('pointercancel', pointerUp);
      cv.addEventListener('lostpointercapture', function () { state.drag = null; });
      cv.addEventListener('keydown', function (e) {
        const altStep = maxAltitude / 20;
        const speedStep = maxSpeed / 20;
        if (e.shiftKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
          state.speed = P.clamp(state.speed + (e.key === 'ArrowRight' ? speedStep : -speedStep), 0, maxSpeed);
        } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
          state.altitude = P.clamp(state.altitude + (e.key === 'ArrowUp' ? altStep : -altStep), 0, maxAltitude);
        } else if (e.key === 'Home') {
          state.altitude = 0;
        } else if (e.key === 'End') {
          state.altitude = maxAltitude;
        } else {
          return;
        }
        e.preventDefault();
        updateReadouts();
      });
      select.addEventListener('change', function () {
        state.body = select.value;
        updateReadouts();
      });
      reset.addEventListener('click', function () {
        state.altitude = initial.altitude;
        state.speed = initial.speed;
        state.body = initial.body;
        state.drag = null;
        select.value = initial.body;
        updateReadouts();
        cv.focus();
      });

      Deck.onResize(function () { ctx = Deck.fit(cv); });
      updateReadouts();
      Deck.loop(function (time) { draw(time); }, { still: 0 });
    }, { once: true });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
