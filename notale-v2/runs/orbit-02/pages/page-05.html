<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="05" data-total="20">
<div id="stage">
  <style>
    .p05.focus { padding-block: var(--space-6); gap: var(--space-5); }
    .p05 .layout-head { display:flex; align-items:center; justify-content:space-between; gap:var(--space-6); }
    .p05 .mission { margin:0; color:var(--text-muted); font-size:var(--fs-small); line-height:var(--lh-body); }
    .p05 .mission strong { color:var(--text-strong); }
    .p05 .layout-main { display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:var(--space-4); }
    .p05 .meter-strip { --readout-cols:4; }
    .p05 .readout { min-block-size:76px; padding:var(--space-3) var(--space-4); }
    .p05 .readout-value { font-size:var(--fs-h3); }
    .p05 .lab-frame { position:relative; min-block-size:390px; overflow:visible; }
    .p05 canvas { position:absolute; inset:0; inline-size:100%; block-size:100%; }
    .p05 .part-rack { position:absolute; inset:var(--space-5); display:flex; flex-direction:column; align-items:flex-start; gap:var(--space-3); pointer-events:none; }
    .p05 .part-rack__title { color:var(--text-muted); font-size:var(--fs-caption); line-height:var(--lh-tight); }
    .p05 .part {
      inline-size:190px; min-block-size:54px; justify-content:space-between; pointer-events:auto;
      border-color:var(--line-strong); background:var(--surface-glass); touch-action:none;
    }
    .p05 .part[data-on="true"] { border-color:var(--accent); background:var(--accent-soft); }
    .p05 .part[data-kind="payload"] { box-shadow:inset 4px 0 0 var(--chart-2); }
    .p05 .part[data-kind="structure"] { box-shadow:inset 4px 0 0 var(--chart-1); }
    .p05 .part[data-kind="propellant"] { box-shadow:inset 4px 0 0 var(--chart-3); }
    .p05 .part[data-kind="booster"] { box-shadow:inset 4px 0 0 var(--chart-4); }
    .p05 .part small { color:var(--text-muted); font-family:var(--font-mono); font-size:var(--fs-caption); }
    .p05 .part.is-dragging { position:fixed; z-index:20; inline-size:190px; pointer-events:none; box-shadow:var(--shadow-float); }
    .p05 .drop-label { position:absolute; inset-block-start:var(--space-5); inset-inline-start:50%; translate:-50% 0; color:var(--text-muted); font-size:var(--fs-caption); line-height:var(--lh-tight); pointer-events:none; }
    .p05 .status-card { position:absolute; inset-block-start:var(--space-5); inset-inline-end:var(--space-5); inline-size:260px; }
    .p05 .status-card p { margin:var(--space-3) 0 0; color:var(--text-muted); font-size:var(--fs-small); line-height:var(--lh-body); }
    .p05 .actions { display:flex; align-items:center; justify-content:center; gap:var(--space-4); }
    .p05 .actions button { min-inline-size:150px; }
    .p05 .formula { margin:0; color:var(--text-muted); font-size:var(--fs-small); line-height:var(--lh-body); text-align:center; }
    .p05 .formula strong { color:var(--accent-strong); }
    .p05 .live { min-inline-size:300px; text-align:center; }
    .p05 button:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    @media (prefers-reduced-motion: reduce) { .p05 * { transition-duration:0.001ms !important; animation-duration:0.001ms !important; } }
  </style>

  <liftoff-lab class="p05 focus">
    <div class="layout-head">
      <p class="mission"><strong>任务：</strong>装上指定载荷、结构与推进剂，让试验火箭离架；额外助推包会增加推力，也增加死重。</p>
      <span class="badge">拖到火箭 / 点击切换</span>
    </div>

    <main class="layout-main min0">
      <section class="readout-panel meter-strip" aria-label="实时物理读数">
        <div class="readout"><span class="readout-label">总质量</span><strong class="readout-value" id="massOut">—</strong></div>
        <div class="readout"><span class="readout-label">重量</span><strong class="readout-value" id="weightOut">—</strong></div>
        <div class="readout readout--accent"><span class="readout-label">推重比 T/W</span><strong class="readout-value" id="twrOut">—</strong></div>
        <div class="readout"><span class="readout-label">竖直净加速度</span><strong class="readout-value" id="accelOut">—</strong></div>
      </section>

      <section class="canvas-frame lab-frame min0" aria-label="实体感火箭测力台">
        <canvas id="labCanvas" class="cv-fill" aria-hidden="true"></canvas>
        <span class="drop-label">装配区 · 推重比跨过 1 才会离架</span>
        <div class="part-rack" aria-label="质量块架">
          <span class="part-rack__title">质量块</span>
          <button class="part" data-kind="payload" data-on="false"><span>指定载荷</span><small id="payloadMass">—</small></button>
          <button class="part" data-kind="structure" data-on="false"><span>结构块</span><small id="structureMass">—</small></button>
          <button class="part" data-kind="propellant" data-on="false"><span>推进剂块</span><small id="propMass">—</small></button>
          <button class="part" data-kind="booster" data-on="false"><span>额外助推包</span><small id="boosterMass">—</small></button>
        </div>
        <aside class="callout status-card">
          <span id="stateBadge" class="status status--warn">等待装配</span>
          <p id="stateText" aria-live="polite">把三个任务质量块装上火箭，再点火验证。</p>
        </aside>
      </section>

      <div class="actions">
        <button id="ignite" class="button--primary">点火试验</button>
        <p class="formula live"><strong id="burnOut">燃烧时间 —</strong><br><span id="flowOut">质量流率 —</span></p>
        <button id="reset" class="button--quiet">重置试验</button>
      </div>
    </main>

    <p class="layout-foot formula">同一推力下，推进剂减少 → 重量下降 → <strong>加速度继续上升</strong>；推力大不等于一定能离架。</p>
  </liftoff-lab>

  <script src="assets/lib/matter.min.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      'use strict';

      const page = Object.freeze({
        index: Number(document.body.dataset.page),
        kicker: `LIFTOFF`,
        title: `有推力还不够：先让推重比<em>超过一</em>`,
        take: `火箭能否起飞取决于推力与当下重量之比，而不是发动机推力的绝对大小。`
      });

      Lec.mount(page);

      class LiftoffLab extends HTMLElement {
        connectedCallback() {
          if (this.ready) return;
          this.ready = true;
          const P = Lec.P;
          const K = Lec.K;
          const source = K.vehicles.falcon9;
          const reference = K.vehicles.v2;
          this.parts = Object.freeze({
            payload: source.payloadToLeo,
            structure: reference.liftoffMass,
            propellant: source.liftoffMass - source.payloadToLeo - reference.liftoffMass,
            booster: reference.liftoffMass
          });
          this.thrust = source.liftoffThrust;
          this.isp = source.firstStageSeaLevelIsp;
          this.baseMass = reference.liftoffMass;
          this.makeState();

          this.cv = this.querySelector('#labCanvas');
          this.ctx = Deck.fit(this.cv);
          this.engine = Matter.Engine.create();
          this.engine.gravity.y = 1;
          this.platform = Matter.Bodies.rectangle(620, 352, 250, 30, { isStatic:true, friction:0.9 });
          this.rocket = Matter.Bodies.rectangle(620, 255, 92, 170, { friction:0.8, restitution:0 });
          Matter.Composite.add(this.engine.world, [this.platform, this.rocket]);

          this.els = {
            mass:this.querySelector('#massOut'), weight:this.querySelector('#weightOut'),
            twr:this.querySelector('#twrOut'), accel:this.querySelector('#accelOut'),
            burn:this.querySelector('#burnOut'), flow:this.querySelector('#flowOut'),
            badge:this.querySelector('#stateBadge'), text:this.querySelector('#stateText'),
            ignite:this.querySelector('#ignite')
          };
          this.querySelector('#payloadMass').textContent = P.formatMass(this.parts.payload, 1);
          this.querySelector('#structureMass').textContent = P.formatMass(this.parts.structure, 1);
          this.querySelector('#propMass').textContent = P.formatMass(this.parts.propellant, 1);
          this.querySelector('#boosterMass').textContent = '+' + P.formatMass(this.parts.booster, 1);

          this.querySelectorAll('.part').forEach((button) => {
            button.addEventListener('click', () => {
              if (button.dataset.dragged === 'true') {
                button.dataset.dragged = 'false';
                return;
              }
              if (this.state.running) return;
              this.toggle(button.dataset.kind);
            });
            button.addEventListener('pointerdown', (event) => this.dragStart(button, event));
            button.addEventListener('keydown', (event) => {
              if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                if (!this.state.running) this.toggle(button.dataset.kind);
              }
            });
          });
          this.els.ignite.addEventListener('click', () => this.start());
          this.querySelector('#reset').addEventListener('click', () => this.reset());
          this.updateReadouts();
          this.draw();
          Deck.onResize(() => { this.ctx = Deck.fit(this.cv); this.draw(); });
          this.stopLoop = Deck.loop((time, dt) => this.frame(time, dt), { still:0 });
        }

        makeState() {
          this.state = { attached:{ payload:false, structure:false, propellant:false, booster:false }, running:false, elapsed:0, fuel:0, y:255, result:'setup' };
        }

        totalMass() {
          let mass = this.baseMass;
          Object.keys(this.state.attached).forEach((key) => {
            if (this.state.attached[key]) mass += this.parts[key];
          });
          if (this.state.attached.propellant) mass -= Math.min(this.parts.propellant, this.state.fuel);
          return mass;
        }

        currentThrust() {
          return this.thrust * (this.state.attached.booster ? 2 : 1);
        }

        physics() {
          const mass = this.totalMass();
          const thrust = this.currentThrust();
          const gravity = Lec.P.gravityAtAltitude(0);
          return {
            mass:mass,
            thrust:thrust,
            gravity:gravity,
            weight:Lec.P.weight(mass, 0),
            twr:Lec.P.thrustToWeight(thrust, mass, gravity),
            accel:Lec.P.netVerticalAcceleration(thrust, mass, gravity),
            flow:Lec.P.massFlow(thrust, this.isp),
            burn:Lec.P.burnTime(this.state.attached.propellant ? this.parts.propellant : 0, Lec.P.massFlow(thrust, this.isp))
          };
        }

        toggle(kind) {
          this.state.attached[kind] = !this.state.attached[kind];
          this.state.result = 'setup';
          this.querySelector('[data-kind="' + kind + '"]').dataset.on = String(this.state.attached[kind]);
          this.updateReadouts();
          this.progress('toggle-' + kind);
        }

        dragStart(button, event) {
          if (this.state.running || event.pointerType === 'mouse' && event.button !== 0) return;
          const origin = { left:button.style.left, top:button.style.top };
          let moved = false;
          button.setPointerCapture(event.pointerId);
          button.classList.add('is-dragging');
          const move = (e) => {
            const point = Deck.pt(document.getElementById('stage'), e);
            moved = true;
            button.dataset.dragged = 'true';
            button.style.left = point.x + 'px';
            button.style.top = point.y + 'px';
          };
          const end = (e) => {
            const point = Deck.pt(document.getElementById('stage'), e);
            button.classList.remove('is-dragging');
            button.style.left = origin.left;
            button.style.top = origin.top;
            button.removeEventListener('pointermove', move);
            button.removeEventListener('pointerup', end);
            button.removeEventListener('pointercancel', end);
            if (moved && point.x > 520 && point.x < 1080 && point.y > 260 && point.y < 720) {
              this.state.attached[button.dataset.kind] = true;
              button.dataset.on = 'true';
              this.updateReadouts();
              this.progress('drop-' + button.dataset.kind);
            }
          };
          button.addEventListener('pointermove', move);
          button.addEventListener('pointerup', end);
          button.addEventListener('pointercancel', end);
        }

        start() {
          if (this.state.running) return;
          const ph = this.physics();
          this.state.running = true;
          this.state.elapsed = 0;
          this.state.fuel = 0;
          this.state.result = ph.twr > 1 ? 'burning' : 'held';
          Matter.Body.setPosition(this.rocket, {x:620, y:255});
          Matter.Body.setVelocity(this.rocket, {x:0, y:0});
          this.querySelectorAll('.part').forEach((b) => b.disabled = true);
          this.els.ignite.disabled = true;
          this.updateReadouts();
          this.dispatchEvent(new CustomEvent('game-start', {bubbles:true, composed:true, detail:{state:this.getState()}}));
        }

        reset() {
          this.makeState();
          this.querySelectorAll('.part').forEach((b) => { b.disabled=false; b.dataset.on='false'; });
          this.els.ignite.disabled = false;
          Matter.Body.setPosition(this.rocket, {x:620, y:255});
          Matter.Body.setVelocity(this.rocket, {x:0, y:0});
          this.updateReadouts();
          this.dispatchEvent(new CustomEvent('game-reset', {bubbles:true, composed:true}));
        }

        frame(time, dt) {
          let ms = dt > 1 ? dt : dt * 1000;
          ms = Lec.P.clamp(ms || 0, 0, 34);
          if (this.state.running && ms > 0) {
            const ph = this.physics();
            if (this.state.attached.propellant && this.state.fuel < this.parts.propellant) {
              this.state.elapsed += ms / 1000 * 12;
              this.state.fuel = Math.min(this.parts.propellant, ph.flow * this.state.elapsed);
            }
            const now = this.physics();
            Matter.Body.setMass(this.rocket, Math.max(1, now.mass / this.baseMass));
            const gravityForce = this.rocket.mass * this.engine.gravity.scale;
            Matter.Body.applyForce(this.rocket, this.rocket.position, {x:0, y:-gravityForce * now.twr});
            Matter.Engine.update(this.engine, ms);
            this.state.y = this.rocket.position.y;
            const complete = this.rocket.position.y < 190;
            if (complete && this.state.result !== 'complete' && this.state.result !== 'excess') {
              const allRequired = this.state.attached.payload && this.state.attached.structure && this.state.attached.propellant;
              this.state.result = allRequired && !this.state.attached.booster ? 'complete' : 'excess';
              const metrics = this.physics();
              this.dispatchEvent(new CustomEvent('game-complete', {bubbles:true, composed:true, detail:{score:this.state.result === 'complete' ? 1 : 0, metrics:metrics, trace:{elapsed:this.state.elapsed}}}));
            }
            this.updateReadouts();
          }
          this.draw();
        }

        updateReadouts() {
          const ph = this.physics();
          this.els.mass.textContent = Lec.P.formatMass(ph.mass, 1);
          this.els.weight.textContent = Lec.P.formatSI(ph.weight, 'N', 2);
          this.els.twr.textContent = Lec.P.formatNumber(ph.twr, 2);
          this.els.accel.textContent = Lec.P.formatNumber(ph.accel, 2) + ' m/s²';
          this.els.burn.textContent = '燃烧时间 ' + Lec.P.formatDuration(ph.burn, 1);
          this.els.flow.textContent = '质量流率 ' + Lec.P.formatMass(ph.flow, 1) + '/s';
          let badge = '等待装配', text = '把三个任务质量块装上火箭，再点火验证。', cls = 'status status--warn';
          if (this.state.running) {
            if (this.state.result === 'complete') { badge='挑战完成'; text='指定载荷已离架，而且没有堆叠多余发动机质量。'; cls='status status--live'; }
            else if (this.state.result === 'excess') { badge='离架但未达标'; text='火箭离架了，但载荷不全或额外助推造成了无意义的高初始加速度。'; cls='status status--error'; }
            else if (ph.twr < 1) { badge='仍压在台上'; text='推力小于当下重量，测力台继续提供支持力。'; cls='status status--error'; }
            else if (ph.twr < 1.08) { badge='临界卸载'; text='支持力几乎消失；质量再减小一点，火箭才会明确离架。'; cls='status status--warn'; }
            else { badge='真实离架'; text='推重比超过一；燃料继续减少时，净加速度还在上升。'; cls='status status--live'; }
          } else if (ph.twr < 1) { badge='超重配置'; text='当前推力还托不起这些质量；拆减非任务质量或补充推力。'; cls='status status--error'; }
          this.els.badge.className = cls;
          this.els.badge.textContent = badge;
          this.els.text.textContent = text;
        }

        draw() {
          const ctx = this.ctx;
          const ph = this.physics();
          ctx.clearRect(0, 0, 1160, 430);
          ctx.fillStyle = Deck.rgba('chart-grid', 0.55);
          for (let x=240; x<1100; x+=40) ctx.fillRect(x, 0, 1, 430);
          ctx.fillStyle = Deck.rgba('line-strong', 0.9);
          ctx.fillRect(495, 365, 250, 24);
          ctx.fillStyle = Deck.rgba('surface-3', 1);
          ctx.fillRect(525, 389, 190, 20);
          const load = Lec.P.clamp(1 - Math.max(0, ph.twr - 0.82) / 0.18, 0, 1);
          ctx.fillStyle = Deck.rgba('warning', 0.28 + load * 0.5);
          ctx.fillRect(525, 365, 190 * load, 8);
          ctx.font = Deck.token('font-mono').trim() ? '14px ' + Deck.token('font-mono') : '14px sans-serif';
          ctx.fillStyle = Deck.rgba('text-muted', 1);
          ctx.fillText('测力台支持力', 775, 382);

          const x = this.rocket.position.x;
          const y = this.rocket.position.y;
          const segments = [];
          if (this.state.attached.payload) segments.push(['chart-2', 34]);
          if (this.state.attached.structure) segments.push(['chart-1', 42]);
          if (this.state.attached.propellant) segments.push(['chart-3', 62]);
          if (!segments.length) segments.push(['text-faint', 42]);
          let top = y - 82;
          ctx.fillStyle = Deck.rgba('text-strong', 0.92);
          ctx.beginPath(); ctx.moveTo(x, top-34); ctx.lineTo(x-34, top+4); ctx.lineTo(x+34, top+4); ctx.closePath(); ctx.fill();
          segments.forEach((seg) => {
            ctx.fillStyle = Deck.rgba(seg[0], 0.88);
            ctx.fillRect(x-38, top+4, 76, seg[1]);
            ctx.strokeStyle = Deck.rgba('surface-inset', 0.8);
            ctx.strokeRect(x-38, top+4, 76, seg[1]);
            top += seg[1];
          });
          ctx.fillStyle = Deck.rgba('surface-3', 1);
          ctx.fillRect(x-46, top+4, 92, 34);
          ctx.fillStyle = Deck.rgba('text-muted', 1);
          ctx.beginPath(); ctx.moveTo(x-46, top+18); ctx.lineTo(x-70, top+38); ctx.lineTo(x-46, top+38); ctx.fill();
          ctx.beginPath(); ctx.moveTo(x+46, top+18); ctx.lineTo(x+70, top+38); ctx.lineTo(x+46, top+38); ctx.fill();
          if (this.state.running && ph.twr > 1) {
            ctx.fillStyle = Deck.rgba('warm', 0.9);
            ctx.beginPath(); ctx.moveTo(x-24, top+38); ctx.lineTo(x, top+38+48+Math.min(35, ph.accel*2)); ctx.lineTo(x+24, top+38); ctx.fill();
          }
          if (this.state.attached.booster) {
            ctx.fillStyle = Deck.rgba('chart-4', 0.85);
            ctx.fillRect(x-66, y-30, 18, 106); ctx.fillRect(x+48, y-30, 18, 106);
          }
          ctx.strokeStyle = Deck.rgba('accent', 0.8);
          ctx.lineWidth = 3;
          ctx.setLineDash([8, 8]);
          ctx.strokeRect(500, 70, 240, 285);
          ctx.setLineDash([]);
        }

        progress(action) {
          this.dispatchEvent(new CustomEvent('game-progress', {bubbles:true, composed:true, detail:{state:this.getState(), action:action, metrics:this.physics()}}));
        }

        getState() { return JSON.parse(JSON.stringify(this.state)); }
      }

      customElements.define('liftoff-lab', LiftoffLab);
    }, { once: true });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
