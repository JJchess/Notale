<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="06" data-total="20">
<div id="stage">
  <style>
    .p06.stage-cards { --cards-width: 390px; }
    .p06 .layout-head { display:flex; align-items:center; justify-content:space-between; gap:var(--space-6); }
    .p06 .mission-line { margin:0; color:var(--text-muted); font-size:var(--fs-small); line-height:var(--lh-body); }
    .p06 .mission-line strong { color:var(--text-strong); }
    .p06 .layout-stage { display:grid; grid-template-rows:minmax(0,1fr) auto; gap:var(--space-4); }
    .p06 .mass-bench { position:relative; padding:var(--space-4); overflow:hidden; border:1px solid var(--line-strong); border-radius:var(--radius-lg); background:linear-gradient(180deg,var(--surface-2),var(--surface-inset)); box-shadow:var(--shadow-panel),inset 0 1px 0 var(--line-strong),inset 0 -8px 24px var(--bg); }
    .p06 .mass-canvas { display:block; inline-size:100%; block-size:100%; min-block-size:310px; outline:none; touch-action:none; }
    .p06 .mass-canvas:focus-visible { box-shadow:inset 0 0 0 3px var(--focus); border-radius:var(--radius-md); }
    .p06 .bench-hint { display:flex; justify-content:space-between; gap:var(--space-5); color:var(--text-muted); font-size:var(--fs-caption); line-height:var(--lh-tight); }
    .p06 .gain-card { padding:var(--space-4); border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface-1); }
    .p06 .gain-head { display:flex; align-items:center; justify-content:space-between; gap:var(--space-4); margin-block-end:var(--space-3); }
    .p06 .gain-head h2 { margin:0; color:var(--text-strong); font-size:var(--fs-label-lg); line-height:var(--lh-tight); }
    .p06 .gain-head span { color:var(--text-muted); font-size:var(--fs-caption); }
    .p06 .gain-strip { display:flex; align-items:stretch; gap:var(--space-1); block-size:42px; padding:var(--space-1); border-radius:var(--radius-sm); background:var(--surface-inset); box-shadow:inset 0 3px 9px var(--bg); }
    .p06 .gain-step { min-inline-size:3px; border-radius:var(--radius-sm); background:linear-gradient(180deg,var(--accent-strong),var(--accent)); box-shadow:inset 0 1px 0 var(--text-strong); transition:flex-basis 200ms ease,opacity 200ms ease; }
    .p06 .gain-step:nth-child(even) { background:linear-gradient(180deg,var(--accent-2),var(--surface-3)); }
    .p06 .layout-cards { overflow:visible; }
    .p06 .instrument { position:relative; padding:var(--space-5); border:1px solid var(--line-strong); border-radius:var(--radius-lg); background:linear-gradient(180deg,var(--surface-3),var(--surface-1)); box-shadow:var(--shadow-panel),inset 0 1px 0 var(--line-strong),inset 0 -2px 0 var(--surface-inset); }
    .p06 .instrument::after { content:""; position:absolute; inset:1px 1px auto; block-size:28%; border-radius:inherit; background:linear-gradient(180deg,var(--accent-soft),transparent); pointer-events:none; }
    .p06 .instrument > * { position:relative; z-index:1; }
    .p06 .instrument h2 { margin:0 0 var(--space-4); color:var(--text-strong); font-size:var(--fs-h3); line-height:var(--lh-tight); }
    .p06 .digital { padding:var(--space-4); border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface-inset); box-shadow:inset 0 5px 16px var(--bg); }
    .p06 .digital-main { display:flex; align-items:baseline; justify-content:space-between; gap:var(--space-3); }
    .p06 .digital-main output { color:var(--accent-strong); font-family:var(--font-mono); font-size:var(--fs-h2); font-weight:var(--weight-bold); line-height:var(--lh-tight); }
    .p06 .digital-main span { color:var(--text-muted); font-size:var(--fs-caption); }
    .p06 .verify { margin:var(--space-2) 0 0; color:var(--text-faint); font-size:var(--fs-caption); line-height:var(--lh-tight); }
    .p06 .metrics { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-3); margin-block-start:var(--space-4); }
    .p06 .metric { padding:var(--space-3); border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface-2); }
    .p06 .metric span { display:block; color:var(--text-muted); font-size:var(--fs-caption); line-height:var(--lh-tight); }
    .p06 .metric output { display:block; margin-block-start:var(--space-1); overflow:hidden; color:var(--text-strong); font-family:var(--font-mono); font-size:var(--fs-label-lg); font-weight:var(--weight-semibold); line-height:var(--lh-tight); text-overflow:ellipsis; white-space:nowrap; }
    .p06 .target-card { padding:var(--space-5); border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--surface-glass); box-shadow:var(--shadow-panel); }
    .p06 .target-row { display:flex; align-items:center; justify-content:space-between; gap:var(--space-4); }
    .p06 .target-row label { color:var(--text-strong); font-size:var(--fs-label-lg); font-weight:var(--weight-semibold); }
    .p06 .target-row output { color:var(--warm); font-family:var(--font-mono); font-size:var(--fs-label-lg); }
    .p06 input[type="range"] { margin-block:var(--space-3); }
    .p06 .inverse { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-2); }
    .p06 .inverse div { padding:var(--space-2); border-radius:var(--radius-sm); background:var(--surface-inset); }
    .p06 .inverse span { display:block; color:var(--text-muted); font-size:var(--fs-caption); line-height:var(--lh-tight); }
    .p06 .inverse output { display:block; color:var(--text-strong); font-family:var(--font-mono); font-size:var(--fs-label); line-height:var(--lh-tight); }
    .p06 .status-row { display:flex; align-items:center; justify-content:space-between; gap:var(--space-4); }
    .p06 .game-status { margin:0; color:var(--text); font-size:var(--fs-small); line-height:var(--lh-body); }
    .p06 .game-status[data-win="true"] { color:var(--success); }
    .p06 .reset { flex:0 0 auto; min-inline-size:92px; background:linear-gradient(180deg,var(--surface-3),var(--surface-1)); box-shadow:0 7px 0 var(--surface-inset),var(--shadow-panel),inset 0 1px 0 var(--line-strong); }
    .p06 .reset:active { translate:0 4px; box-shadow:0 3px 0 var(--surface-inset),inset 0 3px 8px var(--bg); }
    .p06 .layout-foot { display:none; }
    @media (prefers-reduced-motion:reduce) { .p06 *, .p06 *::before, .p06 *::after { transition-duration:0.01ms !important; } }
  </style>

  <main class="stage-cards p06" aria-label="火箭质量套箱解谜">
    <div class="layout-head">
      <p class="mission-line"><strong>任务：</strong>把指定载荷与结构放进外壳，再添加推进剂达到目标 Δv。</p>
      <span class="status status--live">单级质量实验台</span>
    </div>

    <section class="layout-stage min0" aria-label="质量装配桌面">
      <div class="mass-bench min0">
        <canvas id="massCanvas" class="mass-canvas no-pan" tabindex="0" role="application" aria-label="质量块装配桌面。左右键选择载荷、结构或推进剂，上键装入，下键移出，Home 键重置。"></canvas>
      </div>
      <div class="bench-hint"><span>拖入外壳装载；从外壳拖回桌面移除</span><span>键盘：← → 选择，↑ 装入，↓ 移出</span></div>
      <section class="gain-card" aria-label="每块推进剂带来的速度增益">
        <div class="gain-head"><h2>推进剂逐块加入后的 Δv 增益</h2><span>面积越往后越窄＝对数收益递减</span></div>
        <div id="gainStrip" class="gain-strip" aria-hidden="true"></div>
      </section>
    </section>

    <aside class="layout-cards min0" aria-label="计算与反向任务">
      <section class="instrument">
        <h2>火箭方程读数</h2>
        <div class="digital">
          <div class="digital-main"><output id="dvOut">—</output><span>当前 Δv</span></div>
          <p id="verifyOut" class="verify">等待结构块</p>
        </div>
        <div class="metrics">
          <div class="metric"><span>初始质量</span><output id="initialOut">—</output></div>
          <div class="metric"><span>质量比 m₀/mf</span><output id="ratioOut">—</output></div>
          <div class="metric"><span>推进剂质量</span><output id="propOut">—</output></div>
          <div class="metric"><span>目标下可交付载荷</span><output id="payloadOut">—</output></div>
        </div>
      </section>

      <section class="target-card">
        <div class="target-row"><label for="targetDv">反向任务：目标 Δv</label><output id="targetOut" for="targetDv">—</output></div>
        <input id="targetDv" type="range" aria-label="目标速度增量">
        <div class="inverse">
          <div><span>所需质量比</span><output id="needRatio">—</output></div>
          <div><span>推进剂占比</span><output id="needFraction">—</output></div>
          <div><span>所需初始质量</span><output id="needInitial">—</output></div>
          <div><span>有效排气速度</span><output id="exhaustOut">—</output></div>
        </div>
      </section>

      <div class="status-row">
        <p id="gameStatus" class="game-status" aria-live="polite">先把结构与载荷装入外壳。</p>
        <button id="resetBtn" class="reset" type="button">重置</button>
      </div>
    </aside>
    <div class="layout-foot"></div>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      'use strict';
      Lec.mount({
        index: Number(document.body.dataset.page),
        kicker: `ROCKET-EQUATION`,
        title: `每多要一点 Δv，都要付出<em>成倍的初始质量</em>`,
        take: `火箭的速度能力取决于排气速度和质量比，并且只按质量比的对数增长。`
      });

      const P = Lec.P;
      const K = Lec.K;
      const canvas = document.getElementById('massCanvas');
      const target = document.getElementById('targetDv');
      const resetBtn = document.getElementById('resetBtn');
      const gainStrip = document.getElementById('gainStrip');
      const dryMass = K.vehicles.v2.liftoffMass;
      const payloadMass = K.vehicles.falcon9.payloadToLEO;
      const propUnit = K.vehicles.falcon9.liftoffMass / K.pageCount;
      const isp = K.rocket.keroloxVacuumIsp;
      const ve = P.effectiveExhaustVelocity(isp);
      const maxProp = Math.round(K.pageCount / 2);
      const initialProp = Math.round(K.pageCount / 5);
      const targetDefault = K.rocket.leoOrbitalSpeed - K.rocket.typicalTotalLoss;
      const state = { structure:false, payload:false, propellant:initialProp, selected:0, drag:null, won:false };
      let boardW = 900;
      let boardH = 330;

      target.min = String(K.rocket.typicalTotalLoss);
      target.max = String(K.rocket.launchToLeoDeltaV);
      target.step = String(K.rocket.typicalDragLoss);
      target.value = String(targetDefault);

      function fresh() {
        state.structure = false;
        state.payload = false;
        state.propellant = initialProp;
        state.selected = 0;
        state.drag = null;
        state.won = false;
      }

      function assembly() {
        const finalMass = (state.structure ? dryMass : 0) + (state.payload ? payloadMass : 0);
        const propellant = state.propellant * propUnit;
        const initialMass = finalMass + propellant;
        const safeFinal = finalMass || K.g0;
        const safeInitial = Math.max(initialMass, safeFinal);
        const byIsp = P.rocketDeltaV(isp, safeInitial, safeFinal);
        const byVe = P.rocketDeltaVFromExhaustVelocity(ve, safeInitial, safeFinal);
        const dv = state.structure ? byIsp : 0;
        return { finalMass, propellant, initialMass, byIsp, byVe, dv };
      }

      function add(type) {
        if (type === 0) state.payload = true;
        if (type === 1) state.structure = true;
        if (type === 2) state.propellant = Math.min(maxProp, state.propellant + 1);
        update();
      }
      function remove(type) {
        if (type === 0) state.payload = false;
        if (type === 1) state.structure = false;
        if (type === 2) state.propellant = Math.max(0, state.propellant - 1);
        update();
      }

      function updateGain(a) {
        gainStrip.replaceChildren();
        if (!state.structure) return;
        let previous = 0;
        for (let i = 1; i <= state.propellant; i += 1) {
          const mass0 = a.finalMass + i * propUnit;
          const current = P.rocketDeltaV(isp, mass0, a.finalMass);
          const gain = Math.max(0, current - previous);
          const bar = document.createElement('span');
          bar.className = 'gain-step';
          bar.style.flexBasis = (gain / Math.max(a.dv, K.numeric.epsilon) * 100) + '%';
          bar.title = P.formatSpeed(gain, K.display.defaultDecimals);
          gainStrip.appendChild(bar);
          previous = current;
        }
      }

      function update() {
        const a = assembly();
        const goal = Number(target.value);
        const massRatio = a.finalMass > 0 ? a.initialMass / a.finalMass : NaN;
        const stage = [{ wetMass:dryMass + a.propellant, dryMass:dryMass, isp:isp }];
        const payloadCapacity = P.payloadForDeltaV(stage, goal);
        const needRatio = P.massRatioForDeltaV(goal, isp);
        const needFraction = P.propellantFractionForDeltaV(goal, isp);
        const needInitial = P.initialMassForDeltaV(dryMass + payloadMass, goal, isp);
        state.won = state.structure && state.payload && a.dv >= goal;

        document.getElementById('dvOut').textContent = state.structure ? P.formatSpeed(a.dv, K.display.defaultDecimals) : '—';
        document.getElementById('verifyOut').textContent = state.structure ? 'Isp 与排气速度两种接口校验：' + P.formatSpeed(a.byVe, K.display.defaultDecimals) : '等待结构块';
        document.getElementById('initialOut').textContent = P.formatMass(a.initialMass, K.display.defaultDecimals);
        document.getElementById('ratioOut').textContent = P.formatNumber(massRatio, K.display.defaultDecimals);
        document.getElementById('propOut').textContent = P.formatMass(a.propellant, K.display.defaultDecimals);
        document.getElementById('payloadOut').textContent = P.isNumber(payloadCapacity) ? P.formatMass(payloadCapacity, K.display.defaultDecimals) : '不可达';
        document.getElementById('targetOut').textContent = P.formatSpeed(goal, K.display.defaultDecimals);
        document.getElementById('needRatio').textContent = P.formatNumber(needRatio, K.display.defaultDecimals);
        document.getElementById('needFraction').textContent = P.formatPercent(needFraction, K.display.percentDecimals);
        document.getElementById('needInitial').textContent = P.formatMass(needInitial, K.display.defaultDecimals);
        document.getElementById('exhaustOut').textContent = P.formatSpeed(ve, K.display.defaultDecimals);
        const status = document.getElementById('gameStatus');
        status.dataset.win = String(state.won);
        if (state.won) status.textContent = '任务完成：载荷已达到目标 Δv。';
        else if (!state.structure || !state.payload) status.textContent = '先把结构与载荷装入外壳。';
        else status.textContent = '还差 ' + P.formatSpeed(Math.max(0, goal - a.dv), K.display.defaultDecimals) + '；新增燃料也要被加速。';
        updateGain(a);
        draw();
      }

      function rect(ctx,x,y,w,h,r,fill,stroke) {
        Deck.rr(ctx,x,y,w,h,r);
        ctx.fillStyle = fill; ctx.fill();
        ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke();
      }

      function drawBlock(ctx,x,y,w,h,label,value,kind,selected) {
        const tops = ['accent-strong','warm','accent-2'];
        const bases = ['accent','warning','surface-3'];
        ctx.save();
        ctx.shadowColor = Deck.rgba('bg',0.8); ctx.shadowBlur = 12; ctx.shadowOffsetY = 7;
        rect(ctx,x,y,w,h,10,Deck.rgba(bases[kind],0.9),Deck.rgba(tops[kind],0.95));
        ctx.shadowColor = Deck.rgba('bg',0);
        const g = ctx.createLinearGradient(0,y,0,y+h);
        g.addColorStop(0,Deck.rgba(tops[kind],0.48)); g.addColorStop(1,Deck.rgba('surface-inset',0.28));
        rect(ctx,x+3,y+3,w-6,h-6,8,g,selected ? Deck.rgba('focus',1) : Deck.rgba('text-strong',0.18));
        ctx.fillStyle = Deck.rgba('text-inverse',1); ctx.font = '650 17px ' + Deck.token('font-sans'); ctx.fillText(label,x+14,y+25);
        ctx.font = '560 14px ' + Deck.token('font-mono'); ctx.fillText(value,x+14,y+48);
        ctx.restore();
      }

      function zones() {
        const pad = 24;
        const trayH = 82;
        const shell = { x:pad+28, y:28, w:boardW-pad*2-56, h:boardH-trayH-56 };
        const trayY = boardH-trayH;
        const bw = (boardW-pad*4)/3;
        return { shell, trayY, blocks:[0,1,2].map(i => ({x:pad+i*(bw+pad),y:trayY+8,w:bw,h:66})) };
      }

      function draw() {
        const ctx = Deck.fit(canvas);
        boardW = canvas.offsetWidth;
        boardH = canvas.offsetHeight;
        ctx.clearRect(0,0,boardW,boardH);
        const z = zones();
        ctx.fillStyle = Deck.rgba('text-muted',1); ctx.font = '650 16px ' + Deck.token('font-sans');
        ctx.fillText('火箭初始质量外壳  m₀',z.shell.x,z.shell.y-8);
        rect(ctx,z.shell.x,z.shell.y,z.shell.w,z.shell.h,18,Deck.rgba('surface-inset',0.92),Deck.rgba('line-strong',1));
        ctx.setLineDash([8,7]); ctx.strokeStyle = Deck.rgba('accent',0.45); ctx.lineWidth=2; ctx.strokeRect(z.shell.x+10,z.shell.y+10,z.shell.w-20,z.shell.h-20); ctx.setLineDash([]);
        const innerX=z.shell.x+24, innerY=z.shell.y+25, innerW=z.shell.w-48;
        let cursor=innerX;
        if (state.payload) { const w=Math.max(115,innerW*0.18); drawBlock(ctx,cursor,innerY,w,68,'载荷',P.formatMass(payloadMass,K.display.defaultDecimals),0,state.selected===0); cursor+=w+10; }
        if (state.structure) { const w=Math.max(115,innerW*0.15); drawBlock(ctx,cursor,innerY,w,68,'结构',P.formatMass(dryMass,K.display.defaultDecimals),1,state.selected===1); cursor+=w+10; }
        const available=Math.max(0,z.shell.x+z.shell.w-24-cursor);
        const pw=state.propellant ? Math.max(22,Math.min(54,(available-(state.propellant-1)*5)/state.propellant)) : 0;
        for(let i=0;i<state.propellant;i+=1){ drawBlock(ctx,cursor+i*(pw+5),innerY,pw,68,i===0?'推进剂':'',i===0?P.formatMass(propUnit,K.display.defaultDecimals):'',2,state.selected===2); }
        ctx.fillStyle=Deck.rgba('text-faint',1); ctx.font='14px '+Deck.token('font-sans');
        ctx.fillText('燃烧后留下 mf：结构＋载荷',innerX,z.shell.y+z.shell.h-18);
        ['载荷','结构','推进剂'].forEach((label,i)=>{
          const mass=i===0?payloadMass:(i===1?dryMass:propUnit);
          drawBlock(ctx,z.blocks[i].x,z.blocks[i].y,z.blocks[i].w,z.blocks[i].h,label,P.formatMass(mass,K.display.defaultDecimals),i,state.selected===i);
        });
        if(state.drag){
          drawBlock(ctx,state.drag.x-65,state.drag.y-32,130,64,['载荷','结构','推进剂'][state.drag.type],'',state.drag.type,true);
        }
      }

      function hitBlock(p) {
        const z=zones();
        for(let i=0;i<z.blocks.length;i+=1){ const b=z.blocks[i]; if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return {type:i,from:'tray'}; }
        if(p.y>=z.shell.y&&p.y<=z.shell.y+z.shell.h){
          if(state.selected===0&&state.payload)return {type:0,from:'shell'};
          if(state.selected===1&&state.structure)return {type:1,from:'shell'};
          if(state.selected===2&&state.propellant>0)return {type:2,from:'shell'};
        }
        return null;
      }

      canvas.addEventListener('pointerdown',function(e){
        const p=Deck.pt(canvas,e); const hit=hitBlock(p); if(!hit)return;
        state.selected=hit.type; state.drag={type:hit.type,from:hit.from,x:p.x,y:p.y,id:e.pointerId}; canvas.setPointerCapture(e.pointerId); draw();
      });
      canvas.addEventListener('pointermove',function(e){ if(!state.drag)return; const p=Deck.pt(canvas,e); state.drag.x=p.x; state.drag.y=p.y; draw(); });
      function endDrag(e){
        if(!state.drag)return; const p=Deck.pt(canvas,e); const z=zones(); const inside=p.x>=z.shell.x&&p.x<=z.shell.x+z.shell.w&&p.y>=z.shell.y&&p.y<=z.shell.y+z.shell.h; const type=state.drag.type; const from=state.drag.from; state.drag=null;
        if(from==='tray'&&inside)add(type); else if(from==='shell'&&!inside)remove(type); else update();
        if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);
      }
      canvas.addEventListener('pointerup',endDrag); canvas.addEventListener('pointercancel',function(e){state.drag=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);update();});
      canvas.addEventListener('keydown',function(e){
        if(e.key==='ArrowLeft'){state.selected=(state.selected+2)%3;e.preventDefault();draw();}
        else if(e.key==='ArrowRight'){state.selected=(state.selected+1)%3;e.preventDefault();draw();}
        else if(e.key==='ArrowUp'||e.key==='Enter'||e.key===' '){add(state.selected);e.preventDefault();}
        else if(e.key==='ArrowDown'||e.key==='Delete'){remove(state.selected);e.preventDefault();}
        else if(e.key==='Home'){fresh();update();e.preventDefault();}
      });
      target.addEventListener('input',update);
      resetBtn.addEventListener('click',function(){fresh();target.value=String(targetDefault);update();canvas.focus();});
      Deck.onResize(draw);
      update();
    }, { once:true });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
