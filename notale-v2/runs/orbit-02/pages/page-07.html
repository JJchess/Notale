<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="07" data-total="20">
<div id="stage">
  <style>
    .staging-game {
      gap: var(--space-4);
      padding-block: var(--space-4);
    }
    .staging-game .layout-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-5);
      min-inline-size: 0;
    }
    .staging-game .brief {
      margin: 0;
      color: var(--text-muted);
      font-size: var(--fs-small);
      line-height: var(--lh-body);
    }
    .staging-game .target {
      flex: 0 0 auto;
      padding: var(--space-2) var(--space-4);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-pill);
      background: var(--surface-inset);
      color: var(--warm);
      font-family: var(--font-mono);
      font-size: var(--fs-label);
    }
    .staging-game .rocket-bay {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      gap: var(--space-3);
      min-inline-size: 0;
      min-block-size: 0;
      padding: var(--space-4);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: linear-gradient(160deg, var(--surface-2), var(--surface-1));
      box-shadow: var(--shadow-panel);
    }
    .staging-game .bay-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }
    .staging-game .bay-title {
      margin: 0;
      color: var(--text-strong);
      font-size: var(--fs-h3);
      line-height: var(--lh-tight);
    }
    .staging-game .build-select {
      inline-size: 100%;
    }
    .staging-game .card-rack {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      min-block-size: 32px;
    }
    .staging-game .part-card {
      display: inline-flex;
      align-items: center;
      min-block-size: 28px;
      padding: var(--space-1) var(--space-2);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--surface-3);
      color: var(--text-muted);
      font-size: var(--fs-caption);
      line-height: var(--lh-tight);
    }
    .staging-game .flight-view {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-block-size: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background:
        linear-gradient(var(--chart-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--chart-grid) 1px, transparent 1px),
        var(--surface-inset);
      background-size: 40px 40px;
    }
    .staging-game .rocket-stack {
      position: absolute;
      inset-block-end: var(--space-4);
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: var(--space-1);
      inline-size: 88px;
      transition: translate 160ms ease;
    }
    .staging-game .rocket-stage {
      position: relative;
      inline-size: 62px;
      min-block-size: 42px;
      border: 1px solid var(--accent-2);
      border-radius: var(--radius-sm);
      background: var(--accent-2-soft);
      box-shadow: inset 0 -4px 0 var(--surface-3);
    }
    .staging-game .rocket-stage::after {
      content: "";
      position: absolute;
      inset-inline: var(--space-2);
      inset-block-end: 5px;
      block-size: var(--fuel, 70%);
      max-block-size: calc(100% - var(--space-3));
      border-radius: var(--radius-sm);
      background: var(--accent);
      opacity: .72;
    }
    .staging-game .rocket-stage.is-spent::after { block-size: 0; }
    .staging-game .rocket-stage.is-active {
      border-color: var(--warm);
      box-shadow: 0 0 18px var(--warm-soft);
    }
    .staging-game .rocket-stage.is-detached {
      display: none;
    }
    .staging-game .payload-capsule {
      inline-size: 54px;
      block-size: 34px;
      border: 1px solid var(--accent);
      border-radius: var(--radius-pill) var(--radius-pill) var(--radius-sm) var(--radius-sm);
      background: var(--accent-soft);
    }
    .staging-game .flame {
      inline-size: 20px;
      block-size: 0;
      border-radius: var(--radius-pill);
      background: var(--warm);
      box-shadow: 0 0 24px var(--warm);
      transition: block-size 120ms ease;
    }
    .staging-game .is-burning .flame { block-size: 34px; }
    .staging-game .phase-label {
      position: absolute;
      inset-block-start: var(--space-3);
      inset-inline: var(--space-3);
      color: var(--text-muted);
      font-size: var(--fs-caption);
      line-height: var(--lh-tight);
      text-align: center;
    }
    .staging-game .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-2);
    }
    .staging-game .metric {
      min-inline-size: 0;
      padding: var(--space-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-inset);
    }
    .staging-game .metric-label {
      display: block;
      margin-block-end: var(--space-1);
    }
    .staging-game .metric-value {
      display: block;
      font-size: var(--fs-label);
    }
    .staging-game .flight-button { inline-size: 100%; }
    .staging-game .flight-button.is-urgent {
      border-color: var(--warning);
      color: var(--warm);
    }
    .staging-game .layout-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-5);
      min-inline-size: 0;
      padding: var(--space-3) var(--space-4);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-glass);
    }
    .staging-game .score-line {
      margin: 0;
      color: var(--text-muted);
      font-size: var(--fs-small);
      line-height: var(--lh-body);
    }
    .staging-game .score-line strong { color: var(--text-strong); }
    @media (prefers-reduced-motion: reduce) {
      .staging-game .rocket-stack,
      .staging-game .flame { transition: none; }
    }
  </style>

  <main class="triptych staging-game" aria-label="三套火箭分级搭建挑战">
    <header class="layout-head">
      <p class="brief">先选载荷卡，再点火。二、三级方案要由你亲手分离；烧完后仍不分离，上级会拖着空壳继续加速。</p>
      <div class="target">目标 <span id="target-dv">—</span></div>
    </header>

    <section class="layout-a rocket-bay" data-rocket="0" aria-labelledby="rocket-title-0">
      <div class="bay-head"><h2 class="bay-title" id="rocket-title-0">一级方案</h2><span class="status">待组装</span></div>
      <label><span class="control-label">载荷卡</span><select class="build-select" aria-label="一级方案载荷卡"></select></label>
      <div class="flight-view" aria-label="一级火箭状态图">
        <span class="phase-label">同一初始质量</span><div class="rocket-stack"></div>
      </div>
      <div class="metrics">
        <div class="metric"><span class="metric-label">累计 Δv</span><strong class="metric-value dv">—</strong></div>
        <div class="metric"><span class="metric-label">加速结构</span><strong class="metric-value structure">—</strong></div>
        <div class="metric"><span class="metric-label">最终载荷</span><strong class="metric-value payload">—</strong></div>
      </div>
      <button class="flight-button button--primary" type="button">点火试飞</button>
      <div class="card-rack" aria-label="一级方案部件卡"></div>
    </section>

    <section class="layout-b rocket-bay" data-rocket="1" aria-labelledby="rocket-title-1">
      <div class="bay-head"><h2 class="bay-title" id="rocket-title-1">二级方案</h2><span class="status">待组装</span></div>
      <label><span class="control-label">载荷卡</span><select class="build-select" aria-label="二级方案载荷卡"></select></label>
      <div class="flight-view" aria-label="二级火箭状态图">
        <span class="phase-label">同一初始质量</span><div class="rocket-stack"></div>
      </div>
      <div class="metrics">
        <div class="metric"><span class="metric-label">累计 Δv</span><strong class="metric-value dv">—</strong></div>
        <div class="metric"><span class="metric-label">加速结构</span><strong class="metric-value structure">—</strong></div>
        <div class="metric"><span class="metric-label">最终载荷</span><strong class="metric-value payload">—</strong></div>
      </div>
      <button class="flight-button button--primary" type="button">点火试飞</button>
      <div class="card-rack" aria-label="二级方案部件卡"></div>
    </section>

    <section class="layout-c rocket-bay" data-rocket="2" aria-labelledby="rocket-title-2">
      <div class="bay-head"><h2 class="bay-title" id="rocket-title-2">三级方案</h2><span class="status">待组装</span></div>
      <label><span class="control-label">载荷卡</span><select class="build-select" aria-label="三级方案载荷卡"></select></label>
      <div class="flight-view" aria-label="三级火箭状态图">
        <span class="phase-label">同一初始质量</span><div class="rocket-stack"></div>
      </div>
      <div class="metrics">
        <div class="metric"><span class="metric-label">累计 Δv</span><strong class="metric-value dv">—</strong></div>
        <div class="metric"><span class="metric-label">加速结构</span><strong class="metric-value structure">—</strong></div>
        <div class="metric"><span class="metric-label">最终载荷</span><strong class="metric-value payload">—</strong></div>
      </div>
      <button class="flight-button button--primary" type="button">点火试飞</button>
      <div class="card-rack" aria-label="三级方案部件卡"></div>
    </section>

    <footer class="layout-foot">
      <p class="score-line" id="game-result" aria-live="polite"><strong>挑战：</strong>在相同起飞质量下，找出能达到目标且载荷最大的方案。</p>
      <span class="caption">燃料亮条耗尽后，空壳仍会留在箭体上</span>
    </footer>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      'use strict';

      const page = Object.freeze({
        index: Number(document.body.dataset.page),
        kicker: `STAGING`,
        title: `分级的价值，是不再加速已经用完的<em>死质量</em>`,
        take: `适时抛弃空结构能提高总 Δv，但更多级也会带来额外结构代价。`
      });

      Lec.mount(page);

      const P = Lec.P;
      const K = Lec.K;
      const initialMass = K.vehicles.falcon9.liftoffMass;
      const targetDeltaV = K.rocket.launchToLEODeltaV;
      const payloadChoices = [
        { label: '轻载卡', mass: K.vehicles.v2.liftoffMass },
        { label: '标准载荷卡', mass: K.vehicles.falcon9.payloadToLeo },
        { label: '重载卡', mass: K.vehicles.saturnV.payloadToLeo }
      ];
      const bays = Array.from(document.querySelectorAll('.rocket-bay'));
      const resultNode = document.getElementById('game-result');
      const burnSpan = 3000;
      const states = [];

      document.getElementById('target-dv').textContent = P.formatSpeed(targetDeltaV, 1);

      function makeStages(count, payloadMass) {
        const interstageMass = K.vehicles.v2.liftoffMass;
        const baseDry = K.vehicles.falcon9.payloadToLeo;
        const totalInterstage = interstageMass * Math.max(0, count - 1);
        const propellant = initialMass - payloadMass - baseDry - totalInterstage;
        const propellantEach = Math.max(0, propellant / count);
        return Array.from({ length: count }, function (_, index) {
          const dryMass = baseDry / count + (index < count - 1 ? interstageMass : 0);
          return {
            wetMass: dryMass + propellantEach,
            dryMass: dryMass,
            propellant: propellantEach,
            propellantInitial: propellantEach,
            isp: K.rocket.keroloxVacuumIsp,
            attached: true
          };
        });
      }

      function freshState(count, payloadIndex) {
        const payloadMass = payloadChoices[payloadIndex].mass;
        const stages = makeStages(count, payloadMass);
        return {
          count: count,
          payloadIndex: payloadIndex,
          payloadMass: payloadMass,
          stages: stages,
          phase: 'ready',
          active: 0,
          deltaV: 0,
          nominal: P.multiStageDeltaV(stages.map(function (stage) {
            return { wetMass: stage.wetMass, dryMass: stage.dryMass, isp: stage.isp };
          }), payloadMass).totalDeltaV,
          elapsed: 0,
          lateBurn: false
        };
      }

      function totalMass(state) {
        return state.payloadMass + state.stages.reduce(function (sum, stage) {
          return sum + (stage.attached ? stage.dryMass + stage.propellant : 0);
        }, 0);
      }

      function attachedStructure(state) {
        return state.stages.reduce(function (sum, stage) {
          return sum + (stage.attached ? stage.dryMass : 0);
        }, 0);
      }

      function separationCandidate(state) {
        for (let i = 0; i < state.active; i += 1) {
          if (state.stages[i].attached) return i;
        }
        if (state.active < state.count - 1 && state.stages[state.active].attached) return state.active;
        return -1;
      }

      function advanceReduced(state) {
        if (!Deck.reduced() || state.phase !== 'flying' || state.active >= state.count) return;
        const stage = state.stages[state.active];
        const massBefore = totalMass(state);
        const fullDv = P.stageDeltaV(
          stage.dryMass + stage.propellant,
          stage.dryMass,
          massBefore - stage.dryMass - stage.propellant,
          stage.isp
        );
        P.finalMassAfterBurn(massBefore, fullDv, stage.isp);
        state.deltaV += fullDv;
        stage.propellant = 0;
        if (state.active === state.count - 1) {
          state.phase = 'done';
        } else {
          state.active += 1;
        }
      }

      function createPart(label) {
        const span = document.createElement('span');
        span.className = 'part-card';
        span.textContent = label;
        return span;
      }

      function render(state, bay) {
        const status = bay.querySelector('.status');
        const button = bay.querySelector('.flight-button');
        const rack = bay.querySelector('.card-rack');
        const stack = bay.querySelector('.rocket-stack');
        const select = bay.querySelector('.build-select');
        const candidate = separationCandidate(state);
        const isBurning = state.phase === 'flying' && state.active < state.count;

        bay.querySelector('.dv').textContent = P.formatSpeed(state.deltaV, 1);
        bay.querySelector('.structure').textContent = P.formatMass(attachedStructure(state), 1);
        bay.querySelector('.payload').textContent = P.formatMass(state.payloadMass, 1);
        select.disabled = state.phase === 'flying';

        rack.replaceChildren();
        for (let i = 0; i < state.count; i += 1) {
          rack.appendChild(createPart('发动机'));
          rack.appendChild(createPart('油箱'));
          if (i < state.count - 1) rack.appendChild(createPart('级间'));
        }
        rack.appendChild(createPart('载荷'));

        stack.replaceChildren();
        const flame = document.createElement('span');
        flame.className = 'flame';
        stack.appendChild(flame);
        state.stages.forEach(function (stage, index) {
          const el = document.createElement('span');
          el.className = 'rocket-stage';
          if (!stage.attached) el.classList.add('is-detached');
          if (stage.propellant <= 0) el.classList.add('is-spent');
          if (index === state.active && isBurning) el.classList.add('is-active');
          el.style.setProperty('--fuel', P.formatPercent(stage.propellantInitial ? stage.propellant / stage.propellantInitial : 0, 1));
          el.setAttribute('aria-label', '第' + (index + 1) + '级');
          stack.appendChild(el);
        });
        const capsule = document.createElement('span');
        capsule.className = 'payload-capsule';
        stack.appendChild(capsule);
        stack.classList.toggle('is-burning', isBurning);
        stack.style.translate = '0 ' + (isBurning ? '-18px' : '0');

        button.classList.remove('is-urgent');
        if (state.phase === 'ready') {
          status.className = 'status';
          status.textContent = '待试飞';
          button.disabled = false;
          button.textContent = '点火试飞';
        } else if (state.phase === 'done') {
          const success = state.deltaV >= targetDeltaV;
          status.className = 'status ' + (success ? 'status--live' : 'status--error');
          status.textContent = success ? '载荷交付' : '速度不足';
          button.disabled = false;
          button.textContent = '重置方案';
        } else if (candidate >= 0) {
          const early = candidate === state.active && state.stages[candidate].propellant > 0;
          status.className = 'status ' + (early ? 'status--warn' : 'status--error');
          status.textContent = early ? '燃烧中' : '拖着空壳';
          button.disabled = false;
          button.classList.add('is-urgent');
          button.textContent = early ? '现在分离（会丢燃料）' : '分离空级';
        } else {
          status.className = 'status status--live';
          status.textContent = '燃烧中';
          button.disabled = true;
          button.textContent = '等待燃尽';
        }
      }

      function updateResult() {
        const finished = states.filter(function (state) { return state.phase === 'done'; });
        if (!finished.length) return;
        const successes = finished.filter(function (state) { return state.deltaV >= targetDeltaV; });
        if (!successes.length) {
          resultNode.innerHTML = '<strong>尚未交付：</strong>速度不足；试试更轻载荷，或更及时地分离空级。';
          return;
        }
        successes.sort(function (a, b) { return b.payloadMass - a.payloadMass; });
        const best = successes[0];
        resultNode.innerHTML = '<strong>当前最佳：</strong>' + best.count + '级方案交付 ' + P.formatMass(best.payloadMass, 1) + '，累计 ' + P.formatSpeed(best.deltaV, 1) + '。';
      }

      bays.forEach(function (bay, bayIndex) {
        const count = bayIndex + 1;
        const select = bay.querySelector('.build-select');
        payloadChoices.forEach(function (choice, index) {
          const option = document.createElement('option');
          option.value = String(index);
          option.textContent = choice.label + ' · ' + P.formatMass(choice.mass, 1);
          select.appendChild(option);
        });
        select.value = '1';
        states[bayIndex] = freshState(count, 1);
        select.addEventListener('change', function () {
          states[bayIndex] = freshState(count, Number(select.value));
          render(states[bayIndex], bay);
          resultNode.innerHTML = '<strong>挑战：</strong>在相同起飞质量下，找出能达到目标且载荷最大的方案。';
        });
        bay.querySelector('.flight-button').addEventListener('click', function () {
          let state = states[bayIndex];
          if (state.phase === 'ready') {
            state.phase = 'flying';
            state.elapsed = 0;
            advanceReduced(state);
          } else if (state.phase === 'done') {
            states[bayIndex] = freshState(count, state.payloadIndex);
            state = states[bayIndex];
          } else {
            const candidate = separationCandidate(state);
            if (candidate >= 0) {
              state.stages[candidate].attached = false;
              if (candidate === state.active) {
                state.active += 1;
                state.elapsed = 0;
              }
              advanceReduced(state);
            }
          }
          render(state, bay);
          updateResult();
        });
        render(states[bayIndex], bay);
      });

      Deck.loop(function (_time, dt) {
        states.forEach(function (state, index) {
          if (state.phase !== 'flying') return;
          if (state.active >= state.count) {
            state.phase = 'done';
            render(state, bays[index]);
            updateResult();
            return;
          }
          const stage = state.stages[state.active];
          if (stage.propellant <= 0) {
            stage.propellant = 0;
            if (state.active === state.count - 1) {
              state.phase = 'done';
            } else {
              state.active += 1;
              state.elapsed = 0;
              state.lateBurn = true;
            }
            render(state, bays[index]);
            updateResult();
            return;
          }
          const massBefore = totalMass(state);
          const stageWet = stage.dryMass + stage.propellant;
          const carried = massBefore - stageWet;
          const requestedBurn = Math.min(stage.propellant, stage.propellantInitial * P.clamp(dt / burnSpan, 0, 1));
          const burnToMass = stageWet - requestedBurn;
          const dvStep = P.stageDeltaV(stageWet, burnToMass, carried, stage.isp);
          const massAfter = P.finalMassAfterBurn(massBefore, dvStep, stage.isp);
          const consumed = Math.min(stage.propellant, Math.max(0, massBefore - massAfter));
          stage.propellant -= consumed;
          if (stage.propellant <= stage.propellantInitial * K.numeric.epsilon) stage.propellant = 0;
          state.deltaV += dvStep;
          state.elapsed += dt;
          render(state, bays[index]);
        });
      }, { still: 0 });
    }, { once: true });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
