<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="08" data-total="20">
<div id="stage">
<style>
  .ascent-page { position: relative; }
  .ascent-page .game-canvas { inline-size: 100%; block-size: 100%; display: block; }
  .ascent-page .hud { position: absolute; inset: var(--space-6) var(--space-6) auto; display: grid; grid-template-columns: 380px minmax(0, 1fr) 420px; gap: var(--space-5); align-items: start; pointer-events: none; }
  .ascent-page .hud-card { min-inline-size: 0; padding: var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-glass); box-shadow: var(--shadow-panel); }
  .ascent-page .telemetry { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
  .ascent-page .metric { min-inline-size: 0; }
  .ascent-page .metric b { display: block; overflow: hidden; color: var(--text-strong); font-family: var(--font-mono); font-size: var(--fs-h3); line-height: var(--lh-tight); text-overflow: ellipsis; white-space: nowrap; }
  .ascent-page .metric span { display: block; color: var(--text-muted); font-size: var(--fs-caption); line-height: var(--lh-tight); }
  .ascent-page .mission { justify-self: center; max-inline-size: 430px; text-align: center; }
  .ascent-page .mission strong { display: block; color: var(--text-strong); font-size: var(--fs-h3); line-height: var(--lh-tight); }
  .ascent-page .mission p { margin: var(--space-2) 0 0; color: var(--text-muted); font-size: var(--fs-small); line-height: var(--lh-body); }
  .ascent-page .budget-title { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-block-end: var(--space-3); }
  .ascent-page .budget-title b { color: var(--text-strong); font-size: var(--fs-label-lg); }
  .ascent-page .budget-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 96px; gap: var(--space-2); align-items: center; margin-block-start: var(--space-2); color: var(--text-muted); font-size: var(--fs-caption); line-height: var(--lh-tight); }
  .ascent-page .budget-row output { color: var(--text-strong); font-family: var(--font-mono); text-align: end; }
  .ascent-page .bar { block-size: 7px; overflow: hidden; border-radius: var(--radius-pill); background: var(--line); }
  .ascent-page .bar i { display: block; inline-size: 0; block-size: 100%; border-radius: inherit; background: var(--bar-color, var(--accent)); }
  .ascent-page .controls { position: absolute; right: var(--space-7); bottom: var(--space-8); display: grid; grid-template-columns: auto 300px; gap: var(--space-5); align-items: end; pointer-events: none; }
  .ascent-page .help { max-inline-size: 330px; padding: var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-glass); color: var(--text-muted); font-size: var(--fs-small); line-height: var(--lh-body); }
  .ascent-page .help b { color: var(--accent-strong); }
  .ascent-page .ring-panel { pointer-events: auto; }
  .ascent-page .ring { inline-size: 300px; block-size: 230px; display: block; border: 1px solid var(--line-strong); border-radius: var(--radius-lg); background: var(--surface-glass); box-shadow: var(--shadow-float); outline: none; }
  .ascent-page .ring:focus-visible { box-shadow: 0 0 0 4px var(--focus), var(--shadow-float); }
  .ascent-page .action-row { position: absolute; left: var(--space-7); bottom: var(--space-8); display: flex; gap: var(--space-3); align-items: center; }
  .ascent-page .action-row button { pointer-events: auto; }
  .ascent-page .action-row .status { min-block-size: 46px; background: var(--surface-glass); }
  .ascent-page .trace-key { position: absolute; left: var(--space-7); bottom: 106px; display: flex; gap: var(--space-5); padding: var(--space-2) var(--space-3); border-radius: var(--radius-pill); background: var(--surface-glass); }
  .ascent-page .trace-key span { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--text-muted); font-size: var(--fs-caption); line-height: var(--lh-tight); }
  .ascent-page .trace-key i { inline-size: 24px; block-size: 3px; background: var(--accent); }
  .ascent-page .trace-key .best { background: var(--accent-2); }
  .ascent-page .result { position: absolute; left: 50%; top: 52%; inline-size: 520px; padding: var(--space-6); translate: -50% -50%; border: 1px solid var(--line-strong); border-radius: var(--radius-lg); background: var(--surface-glass); box-shadow: var(--shadow-float); text-align: center; }
  .ascent-page .result[hidden] { display: none; }
  .ascent-page .result h2 { margin: 0; color: var(--text-strong); font-size: var(--fs-h2); line-height: var(--lh-tight); }
  .ascent-page .result p { margin: var(--space-3) 0 0; color: var(--text-muted); font-size: var(--fs-body); line-height: var(--lh-body); }
  @media (prefers-reduced-motion: reduce) { .ascent-page * { transition: none !important; } }
</style>

<main class="canvas-full ascent-page" aria-label="二维入轨上升驾驶游戏">
  <canvas id="world" class="game-canvas cv-fill" aria-hidden="true"></canvas>

  <section class="hud" aria-label="飞行仪表">
    <div class="hud-card telemetry">
      <div class="metric"><span>高度</span><b id="altitude">—</b></div>
      <div class="metric"><span>横向速度</span><b id="horizontal">—</b></div>
      <div class="metric"><span>动压 q</span><b id="q">—</b></div>
      <div class="metric"><span>马赫数</span><b id="mach">—</b></div>
    </div>
    <div class="hud-card mission">
      <strong id="phase">等待点火</strong>
      <p id="instruction">先竖直穿出稠密空气，再平缓转向；关机后以近地点判定。</p>
    </div>
    <div class="hud-card budget" aria-label="速度预算">
      <div class="budget-title"><b>发动机 Δv 去向</b><output id="totalDv">—</output></div>
      <div class="budget-row"><span>轨道速度</span><span class="bar"><i id="barUseful"></i></span><output id="useful">—</output></div>
      <div class="budget-row"><span>重力损失</span><span class="bar"><i id="barGravity" style="--bar-color:var(--chart-3)"></i></span><output id="gravityLoss">—</output></div>
      <div class="budget-row"><span>阻力损失</span><span class="bar"><i id="barDrag" style="--bar-color:var(--danger)"></i></span><output id="dragLoss">—</output></div>
      <div class="budget-row"><span>转向损失</span><span class="bar"><i id="barSteer" style="--bar-color:var(--chart-2)"></i></span><output id="steerLoss">—</output></div>
    </div>
  </section>

  <div class="trace-key" aria-label="轨迹图例"><span><i></i>本次路径</span><span><i class="best"></i>最佳路径</span></div>

  <div class="action-row">
    <button id="ignite" class="button--primary" type="button">点火</button>
    <button id="reset" type="button">重置</button>
    <span id="flightStatus" class="status">READY</span>
  </div>

  <section class="controls" aria-label="驾驶控制">
    <p class="help"><b>拖拽姿态环</b>：角度控制俯仰，离圆心距离控制节流。键盘用 ← → 调俯仰、↑ ↓ 调节流，空格点火／关机。</p>
    <div class="ring-panel">
      <canvas id="ring" class="ring no-pan" width="300" height="230" tabindex="0" role="slider" aria-label="姿态与节流联合控制；左右调俯仰，上下调节流" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"></canvas>
    </div>
  </section>

  <aside id="result" class="result" hidden aria-live="polite">
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
  </aside>
  <p id="a11yState" class="sr-only" aria-live="polite"></p>
</main>

<script>
window.addEventListener('DOMContentLoaded', function () {
  'use strict';

  const page = Object.freeze({
    index: 8,
    kicker: `ASCENT`,
    title: `入轨飞行要在阻力、重力和转弯之间找一条<em>折中路径</em>`,
    take: `火箭先离开稠密空气，再逐渐把推力转向水平方向，最终目标是横向速度。`
  });

  Lec.mount(page);

  const P = Lec.P;
  const K = Lec.K;
  const world = document.getElementById('world');
  const ring = document.getElementById('ring');
  let worldCtx = Deck.fit(world);
  let ringCtx = Deck.fit(ring);
  const els = {};
  ['altitude','horizontal','q','mach','phase','instruction','totalDv','useful','gravityLoss','dragLoss','steerLoss','barUseful','barGravity','barDrag','barSteer','ignite','reset','flightStatus','result','resultTitle','resultText','a11yState'].forEach(function (id) { els[id] = document.getElementById(id); });

  const task = Object.freeze({
    initialMass: K.vehicles.falcon9.liftoffMass,
    thrust: K.vehicles.falcon9.liftoffThrust,
    isp: K.vehicles.falcon9.firstStageVacuumIsp,
    targetDeltaV: K.rocket.launchToLeoDeltaV,
    safeAltitude: K.KARMAN_ALTITUDE,
    dragCoefficient: 0.5,
    area: K.vehicles.falcon9.height
  });
  const dryMass = task.initialMass / P.massRatioForDeltaV(task.targetDeltaV, task.isp);
  const timeScale = K.display.pageDigits * K.display.defaultDecimals;
  let best = null;
  let dragging = false;
  const particles = [];
  for (let i = 0; i < 180; i += 1) {
    particles.push({ x: (i * 83) % 1600, y: (i * 47) % 900, s: 1 + (i % 3), p: (i % 19) / 19 });
  }

  function initialState() {
    return {
      mode: 'ready', pitch: K.HALF_PI, throttle: 1, x: K.EARTH_RADIUS, y: 0,
      vx: 0, vy: 0, mass: task.initialMass, elapsed: 0, engineDv: 0,
      gravityLoss: 0, dragLoss: 0, useful: 0, steeringLoss: 0,
      q: 0, mach: 0, maxQ: 0, trace: [], coastTrace: [], minCoastAltitude: Infinity,
      coastElapsed: 0, coastLimit: 0, passedApoapsis: false, result: ''
    };
  }
  let state = initialState();

  function altitude() { return Math.hypot(state.x, state.y) - K.EARTH_RADIUS; }
  function localFrame() {
    const r = Math.hypot(state.x, state.y);
    return { r: r, ex: state.x / r, ey: state.y / r, tx: -state.y / r, ty: state.x / r };
  }
  function metrics() {
    const f = localFrame();
    const radial = state.vx * f.ex + state.vy * f.ey;
    const tangential = state.vx * f.tx + state.vy * f.ty;
    return { frame: f, radial: radial, tangential: tangential, speed: Math.hypot(state.vx, state.vy) };
  }

  function setControl(pitch, throttle) {
    state.pitch = P.clamp(pitch, 0, K.HALF_PI);
    state.throttle = P.clamp(throttle, 0, 1);
    ring.setAttribute('aria-valuenow', String(Math.round(state.throttle * 100)));
    ring.setAttribute('aria-valuetext', '俯仰 ' + P.formatNumber(P.toDegrees(state.pitch), 0) + ' 度，节流 ' + P.formatPercent(state.throttle, 0));
    drawRing();
    updateHud();
  }

  function transition(action) {
    if (action === 'ignite') {
      if (state.mode === 'ready') {
        state.mode = 'burn';
        els.ignite.textContent = '关机';
        els.result.hidden = true;
      } else if (state.mode === 'burn') {
        beginCoast();
      }
    } else if (action === 'reset') {
      state = initialState();
      els.ignite.textContent = '点火';
      els.ignite.disabled = false;
      els.result.hidden = true;
      updateHud();
      drawRing();
    }
  }

  function beginCoast() {
    if (state.mode !== 'burn') return;
    state.mode = 'coast';
    state.throttle = 0;
    state.minCoastAltitude = altitude();
    state.coastLimit = P.orbitalPeriodAtRadius(Math.hypot(state.x, state.y));
    els.ignite.disabled = true;
    els.ignite.textContent = '滑行判定中';
    drawRing();
  }

  function integrate(dt, powered) {
    const f = localFrame();
    const h = Math.max(0, f.r - K.EARTH_RADIUS);
    const g = P.gravityAtRadius(f.r);
    const speed = Math.hypot(state.vx, state.vy);
    const rho = P.atmosphericDensity(h);
    const atmosphere = P.standardAtmosphere(h);
    state.q = P.dynamicPressure(rho, speed);
    state.mach = P.machNumber(speed, atmosphere.soundSpeed, true);
    state.maxQ = Math.max(state.maxQ, state.q);

    let thrust = 0;
    if (powered && state.mass > dryMass && state.throttle > 0) {
      thrust = task.thrust * state.throttle;
      const flow = P.massFlow(thrust, task.isp);
      state.mass = Math.max(dryMass, state.mass - flow * dt);
    }
    const thrustAcc = thrust / state.mass;
    const dirX = Math.cos(state.pitch) * f.tx + Math.sin(state.pitch) * f.ex;
    const dirY = Math.cos(state.pitch) * f.ty + Math.sin(state.pitch) * f.ey;
    const dragAcc = speed > 0 ? P.dragAcceleration(rho, speed, task.dragCoefficient, task.area, state.mass) : 0;
    const dragX = speed > 0 ? -dragAcc * state.vx / speed : 0;
    const dragY = speed > 0 ? -dragAcc * state.vy / speed : 0;
    P.netVerticalAcceleration(thrust * Math.sin(state.pitch), state.mass, g);

    state.vx += (thrustAcc * dirX - g * f.ex + dragX) * dt;
    state.vy += (thrustAcc * dirY - g * f.ey + dragY) * dt;
    state.x += state.vx * dt;
    state.y += state.vy * dt;
    state.elapsed += dt;

    if (powered) {
      const dv = thrustAcc * dt;
      state.engineDv += dv;
      state.dragLoss += dragAcc * dt;
      const now = metrics();
      const gamma = now.speed > 0 ? Math.asin(P.clamp(now.radial / now.speed, -1, 1)) : K.HALF_PI;
      state.gravityLoss += P.gravityLoss(g, dt, Math.abs(gamma));
      state.useful = Math.max(0, Math.abs(now.tangential));
      state.steeringLoss = Math.max(0, state.engineDv - state.useful - state.gravityLoss - state.dragLoss);
      P.deltaVBudget({ useful: state.useful, gravity: state.gravityLoss, drag: state.dragLoss, steering: state.steeringLoss });
    }
  }

  function finish() {
    if (state.mode === 'done') return;
    state.mode = 'done';
    const success = state.minCoastAltitude >= task.safeAltitude;
    state.result = success ? 'success' : 'fail';
    if (!best || state.minCoastAltitude > best.perigee) best = { perigee: state.minCoastAltitude, trace: state.trace.concat(state.coastTrace) };
    els.resultTitle.textContent = success ? '轨道成立' : '尚未入轨';
    els.resultText.textContent = success
      ? '关机后的近地点仍高于安全高度：你买到的是横向速度，不只是高度。'
      : '本次近地点低于安全高度。对照路径再试：更早平缓转向，或减少在稠密空气中的横飞。';
    els.result.hidden = false;
    els.ignite.disabled = true;
    els.a11yState.textContent = els.resultTitle.textContent + '，近地点 ' + P.formatDistance(state.minCoastAltitude, 0);
  }

  function update(dt) {
    if (state.mode === 'burn') {
      let remaining = dt * timeScale;
      const step = P.orbitalPeriodAtRadius(Math.hypot(state.x, state.y)) / (K.numeric.integrationSteps * 50);
      while (remaining > 0) {
        const d = Math.min(step, remaining);
        integrate(d, true);
        remaining -= d;
      }
      if (state.trace.length === 0 || state.elapsed - state.trace[state.trace.length - 1].t > 2) state.trace.push({ x: state.x, y: state.y, t: state.elapsed });
      if (altitude() < -K.vehicles.falcon9.height) finish();
      else if (state.mass <= dryMass) beginCoast();
    } else if (state.mode === 'coast') {
      for (let i = 0; i < 16; i += 1) {
        const localStep = P.orbitalPeriodAtRadius(Math.hypot(state.x, state.y)) / K.numeric.integrationSteps;
        integrate(localStep, false);
        state.coastElapsed += localStep;
        const h = altitude();
        state.minCoastAltitude = Math.min(state.minCoastAltitude, h);
        state.coastTrace.push({ x: state.x, y: state.y, t: state.elapsed });
        const m = metrics();
        if (m.radial < 0) state.passedApoapsis = true;
        if ((state.passedApoapsis && m.radial >= 0) || h < 0 || state.coastElapsed >= state.coastLimit) { finish(); break; }
      }
    }
  }

  function updateHud() {
    const m = metrics();
    const h = Math.max(0, altitude());
    els.altitude.textContent = P.formatDistance(h, 0);
    els.horizontal.textContent = P.formatSpeed(Math.abs(m.tangential), 2);
    els.q.textContent = P.formatSI(state.q, 'Pa', 1);
    els.mach.textContent = P.formatNumber(state.mach, 2);
    els.totalDv.textContent = P.formatSpeed(P.deltaVBudget({ useful: state.useful, gravity: state.gravityLoss, drag: state.dragLoss, steering: state.steeringLoss }), 2);
    els.useful.textContent = P.formatSpeed(state.useful, 1);
    els.gravityLoss.textContent = P.formatSpeed(state.gravityLoss, 1);
    els.dragLoss.textContent = P.formatSpeed(state.dragLoss, 1);
    els.steerLoss.textContent = P.formatSpeed(state.steeringLoss, 1);
    const denom = Math.max(state.engineDv, 1);
    els.barUseful.style.inlineSize = P.formatPercent(state.useful / denom, 1);
    els.barGravity.style.inlineSize = P.formatPercent(state.gravityLoss / denom, 1);
    els.barDrag.style.inlineSize = P.formatPercent(state.dragLoss / denom, 1);
    els.barSteer.style.inlineSize = P.formatPercent(state.steeringLoss / denom, 1);
    const phase = state.mode === 'ready' ? '等待点火' : state.mode === 'burn' ? '动力上升' : state.mode === 'coast' ? '关机滑行' : (state.result === 'success' ? '稳定近地点' : '轨迹回落');
    els.phase.textContent = phase;
    els.flightStatus.textContent = state.mode.toUpperCase();
    els.flightStatus.className = 'status ' + (state.mode === 'burn' ? 'status--live' : state.mode === 'coast' ? 'status--warn' : state.result === 'fail' ? 'status--error' : '');
  }

  function project(point) {
    const angle = Math.atan2(point.y, point.x);
    const h = Math.hypot(point.x, point.y) - K.EARTH_RADIUS;
    const maxH = Math.max(K.ISS_ALTITUDE, altitude() * 1.2, best ? best.perigee * 1.2 : 0);
    return { x: 300 + angle * 900, y: 790 - P.clamp(h / maxH, -0.05, 1) * 600 };
  }

  function drawTrace(ctx, trace, color, dashed) {
    if (!trace || trace.length < 2) return;
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 3; if (dashed) ctx.setLineDash([10, 8]); ctx.beginPath();
    for (let i = 0; i < trace.length; i += 1) { const p = project(trace[i]); if (i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y); }
    ctx.stroke(); ctx.restore();
  }

  function drawWorld(t) {
    worldCtx = Deck.fit(world);
    const ctx = worldCtx;
    ctx.clearRect(0, 0, Deck.W, Deck.H);
    const bg = ctx.createLinearGradient(0, 0, 0, 900);
    bg.addColorStop(0, Deck.rgba('bg', 1)); bg.addColorStop(0.7, Deck.rgba('surface-inset', 1)); bg.addColorStop(1, Deck.rgba('surface-3', 1));
    ctx.fillStyle = bg; ctx.fillRect(0, 0, Deck.W, Deck.H);
    for (let i = 0; i < particles.length; i += 1) {
      const p = particles[i]; const drift = Deck.reduced() ? 0 : (t * (6 + p.s) + p.p * 100) % 70;
      ctx.fillStyle = Deck.rgba(i % 5 ? 'text-muted' : 'accent', 0.15 + p.p * 0.35);
      ctx.fillRect((p.x + drift) % Deck.W, p.y * 0.7, p.s, p.s);
    }
    const sky = ctx.createLinearGradient(0, 360, 0, 790);
    sky.addColorStop(0, Deck.rgba('accent-2', 0)); sky.addColorStop(1, Deck.rgba('accent-2', 0.18));
    ctx.fillStyle = sky; ctx.fillRect(0, 300, Deck.W, 490);
    ctx.strokeStyle = Deck.rgba('line-strong', 0.6); ctx.lineWidth = 1;
    [K.KARMAN_ALTITUDE, K.ISS_ALTITUDE].forEach(function (h) { const p = project({ x: K.EARTH_RADIUS + h, y: 0 }); ctx.setLineDash([8, 10]); ctx.beginPath(); ctx.moveTo(180, p.y); ctx.lineTo(1410, p.y); ctx.stroke(); });
    ctx.setLineDash([]); ctx.fillStyle = Deck.rgba('surface-3', 1); ctx.beginPath(); ctx.moveTo(0, 790); ctx.quadraticCurveTo(800, 850, 1600, 790); ctx.lineTo(1600, 900); ctx.lineTo(0, 900); ctx.closePath(); ctx.fill();
    if (best) drawTrace(ctx, best.trace, Deck.rgba('accent-2', 0.7), true);
    drawTrace(ctx, state.trace.concat(state.coastTrace), Deck.rgba('accent', 0.95), false);
    const rp = project({ x: state.x, y: state.y });
    ctx.save(); ctx.translate(rp.x, rp.y); ctx.rotate(-state.pitch + Math.atan2(state.y, state.x));
    if (state.mode === 'burn' && state.throttle > 0) { ctx.fillStyle = Deck.rgba('warm', 0.8); ctx.beginPath(); ctx.moveTo(-8, 16); ctx.lineTo(0, 24 + 28 * state.throttle); ctx.lineTo(8, 16); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = Deck.rgba('text-strong', 1); ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(10, 15); ctx.lineTo(-10, 15); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = Deck.rgba('accent', 1); ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  }

  function drawRing() {
    ringCtx = Deck.fit(ring);
    const ctx = ringCtx; const cx = 150; const cy = 150; const radius = 86;
    ctx.clearRect(0, 0, 300, 230);
    ctx.strokeStyle = Deck.rgba('line-strong', 1); ctx.lineWidth = 14; ctx.beginPath(); ctx.arc(cx, cy, radius, K.PI, K.TWO_PI); ctx.stroke();
    ctx.strokeStyle = Deck.rgba('accent', 0.75); ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, radius * state.throttle, K.PI, K.TWO_PI); ctx.stroke();
    const a = K.PI + state.pitch;
    const hx = cx + Math.cos(a) * radius * state.throttle; const hy = cy + Math.sin(a) * radius * state.throttle;
    ctx.strokeStyle = Deck.rgba('text-muted', 0.7); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.fillStyle = Deck.rgba('accent-strong', 1); ctx.beginPath(); ctx.arc(hx, hy, 12, 0, K.TWO_PI); ctx.fill();
    ctx.fillStyle = Deck.rgba('text-muted', 1); ctx.font = '16px ' + Deck.token('font-sans'); ctx.textAlign = 'center';
    ctx.fillText('水平', 48, 177); ctx.fillText('竖直', 150, 35); ctx.fillText(P.formatNumber(P.toDegrees(state.pitch), 0) + '°  ·  ' + P.formatPercent(state.throttle, 0), 150, 215);
  }

  function ringPoint(e) {
    const p = Deck.pt(ring, e); const cx = 150; const cy = 150; const dx = p.x - cx; const dy = p.y - cy;
    const angle = P.clamp(Math.atan2(-dy, -dx), 0, K.HALF_PI);
    setControl(angle, P.clamp(Math.hypot(dx, dy) / 86, 0, 1));
  }
  ring.addEventListener('pointerdown', function (e) { dragging = true; ring.setPointerCapture(e.pointerId); ringPoint(e); });
  ring.addEventListener('pointermove', function (e) { if (dragging) ringPoint(e); });
  function endDrag(e) { dragging = false; if (ring.hasPointerCapture && ring.hasPointerCapture(e.pointerId)) ring.releasePointerCapture(e.pointerId); }
  ring.addEventListener('pointerup', endDrag); ring.addEventListener('pointercancel', endDrag); ring.addEventListener('lostpointercapture', function () { dragging = false; });
  ring.addEventListener('keydown', function (e) {
    const pitchStep = K.DEG_TO_RAD * 2; const throttleStep = 0.05;
    if (e.key === 'ArrowLeft') setControl(state.pitch + pitchStep, state.throttle);
    else if (e.key === 'ArrowRight') setControl(state.pitch - pitchStep, state.throttle);
    else if (e.key === 'ArrowUp') setControl(state.pitch, state.throttle + throttleStep);
    else if (e.key === 'ArrowDown') setControl(state.pitch, state.throttle - throttleStep);
    else if (e.key === 'Home') setControl(K.HALF_PI, 1);
    else if (e.key === 'End') setControl(0, 0);
    else if (e.key === ' ' || e.key === 'Enter') transition('ignite');
    else return;
    e.preventDefault();
  });
  window.addEventListener('blur', function () { dragging = false; });
  els.ignite.addEventListener('click', function () { transition('ignite'); });
  els.reset.addEventListener('click', function () { transition('reset'); });

  Deck.onResize(function () { worldCtx = Deck.fit(world); ringCtx = Deck.fit(ring); drawRing(); });
  Deck.loop(function (t, dt) { update(dt); updateHud(); drawWorld(t); }, { still: 0 });
  updateHud(); drawRing();
}, { once: true });
</script>
