<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="09" data-total="20">
<div id="stage">
  <style>
    .orbit-page {
      --split-left: 1.42fr;
      --split-right: .76fr;
      padding-block-start: 218px;
      padding-block-end: 76px;
      grid-template-rows: 0 minmax(0, 1fr) 0;
      row-gap: var(--space-0);
    }
    .orbit-page .layout-left,
    .orbit-page .layout-right { min-width: 0; min-height: 0; }
    .orbit-page .orbit-plot { height: 100%; }
    .orbit-page .orbit-svg { width: 100%; height: 100%; display: block; outline: none; }
    .orbit-page .orbit-svg:focus-visible { box-shadow: inset 0 0 0 3px var(--focus); border-radius: var(--radius-lg); }
    .orbit-page .plot-note {
      position: absolute;
      inset: var(--space-5) auto auto var(--space-5);
      z-index: 2;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      max-width: 62%;
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      background: var(--surface-glass);
      color: var(--text-muted);
      font-size: var(--fs-caption);
      line-height: var(--lh-tight);
      pointer-events: none;
    }
    .orbit-page .mode-chip { color: var(--accent-strong); font-weight: var(--weight-bold); }
    .orbit-page .side-panel {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      padding: var(--space-5);
    }
    .orbit-page .side-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
    .orbit-page .status-copy { margin: 0; color: var(--text); font-size: var(--fs-small); line-height: var(--lh-body); }
    .orbit-page .metrics { --readout-cols: 2; padding: var(--space-3); gap: var(--space-2); }
    .orbit-page .metrics .readout { min-height: 82px; padding: var(--space-3); gap: var(--space-1); }
    .orbit-page .metrics .readout-value { font-size: var(--fs-h3); }
    .orbit-page .metrics #speedOut { font-size: var(--fs-label); }
    .orbit-page .balance {
      min-height: 148px;
      padding: var(--space-4);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-inset);
    }
    .orbit-page .balance-head { display: flex; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-2); }
    .orbit-page .balance-svg { width: 100%; height: 98px; display: block; }
    .orbit-page .instructions { margin: 0; color: var(--text-muted); font-size: var(--fs-small); line-height: var(--lh-body); }
    .orbit-page .action-row { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
    .orbit-page .key-hint { color: var(--text-faint); font-size: var(--fs-caption); line-height: var(--lh-tight); }
    .orbit-page .earth { fill: url(#earthGlow); stroke: var(--accent-2); stroke-width: 2; }
    .orbit-page .earth-line { fill: none; stroke: var(--chart-grid); stroke-width: 1.5; }
    .orbit-page .guide-orbit { fill: none; stroke: var(--line-strong); stroke-width: 2; stroke-dasharray: 7 8; }
    .orbit-page .trajectory { fill: none; stroke: var(--warm); stroke-width: 3; stroke-linecap: round; }
    .orbit-page .trajectory.is-match { stroke: var(--success); }
    .orbit-page .error-ring { fill: none; stroke: var(--danger); stroke-width: 2; stroke-dasharray: 4 5; }
    .orbit-page .error-ring.is-match { stroke: var(--success); }
    .orbit-page .radial-guide { stroke: var(--line-strong); stroke-width: 1.5; stroke-dasharray: 3 7; }
    .orbit-page .satellite { fill: var(--text-strong); stroke: var(--accent); stroke-width: 5; cursor: grab; }
    .orbit-page .satellite-halo { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
    .orbit-page .velocity-line { stroke: var(--accent-strong); stroke-width: 5; stroke-linecap: round; marker-end: url(#arrowVelocity); }
    .orbit-page .velocity-handle { fill: var(--surface-inset); stroke: var(--accent-strong); stroke-width: 4; cursor: grab; }
    .orbit-page .svg-label { fill: var(--text-muted); font: var(--fs-caption) var(--font-sans); }
    .orbit-page .svg-value { fill: var(--text-strong); font: var(--weight-semibold) var(--fs-label) var(--font-mono); }
    .orbit-page .bar-label { fill: var(--text-muted); font: var(--fs-caption) var(--font-sans); }
    .orbit-page .bar-value { fill: var(--text-strong); font: var(--fs-tick) var(--font-mono); }
    .orbit-page .bar-g { stroke: var(--chart-2); stroke-width: 9; stroke-linecap: round; }
    .orbit-page .bar-c { stroke: var(--chart-3); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 7 5; }
    .orbit-page .bar-base { stroke: var(--line); stroke-width: 2; }
    @media (prefers-reduced-motion: reduce) { .orbit-page * { transition: none !important; animation: none !important; } }
  </style>

  <main class="orbit-page split-lr" aria-label="圆轨道速度调谐器">
    <section class="layout-left plot orbit-plot min0" aria-label="拖动卫星高度和速度矢量，调谐圆轨道">
      <div class="plot-note"><span class="mode-chip" id="modeChip">高度模式</span><span>拖卫星改高度；拖箭头端点改速度</span></div>
      <svg id="orbitSvg" class="orbit-svg no-pan" viewBox="0 0 900 540" role="application" tabindex="0" aria-label="圆轨道调谐器。按 Enter 切换高度与速度模式，方向键调整，Home 重置当前变量。">
        <defs>
          <radialGradient id="earthGlow" cx="38%" cy="32%">
            <stop offset="0" stop-color="var(--surface-3)"></stop>
            <stop offset=".72" stop-color="var(--surface-2)"></stop>
            <stop offset="1" stop-color="var(--surface-inset)"></stop>
          </radialGradient>
          <marker id="arrowVelocity" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent-strong)"></path>
          </marker>
        </defs>
        <g id="orbitScene"></g>
      </svg>
    </section>

    <aside class="layout-right panel side-panel min0" aria-labelledby="diagnostic-title">
      <div class="side-top">
        <h2 id="diagnostic-title" class="heading-3">匹配诊断</h2>
        <span id="statusBadge" class="status status--warn">正在偏离圆轨道</span>
      </div>
      <p id="statusCopy" class="status-copy" aria-live="polite">先观察轨迹，再把箭头调成切向且长度匹配。</p>

      <div class="readout-panel metrics">
        <div class="readout readout--accent">
          <span class="readout-label">当前高度</span>
          <output id="altitudeOut" class="readout-value">—</output>
        </div>
        <div class="readout">
          <span class="readout-label">当前速度 / 圆轨道速度</span>
          <output id="speedOut" class="readout-value">—</output>
        </div>
      </div>

      <section class="balance" aria-labelledby="balance-title">
        <div class="balance-head">
          <h3 id="balance-title" class="label">同一尺度：向心加速度需求 vs 重力</h3>
          <span id="balanceDelta" class="numeric-id">—</span>
        </div>
        <svg id="balanceSvg" class="balance-svg" viewBox="0 0 430 98" role="img" aria-label="重力加速度与当前速度所需向心加速度对比"></svg>
      </section>

      <p class="instructions">圆轨道不是“速度够大”就行：速度要近似切向，且此时所需向心加速度要与重力重合。</p>
      <div class="action-row">
        <span class="key-hint">Enter 切模式 · 方向键微调</span>
        <button id="resetBtn" class="button--quiet" type="button">重置</button>
      </div>
      <p id="a11yState" class="sr-only" aria-live="polite"></p>
    </aside>
  </main>

  <script src="assets/lib/d3.min.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      'use strict';

      const page = Object.freeze({
        index: 9,
        kicker: `CIRCULAR`,
        title: `在每个高度，都有一个对应的<em>圆轨道速度</em>`,
        take: `圆轨道要求重力恰好提供改变速度方向所需的向心加速度。`
      });

      Lec.mount(page);

      const K = Lec.K;
      const P = Lec.P;
      const svgNode = document.getElementById('orbitSvg');
      const scene = d3.select('#orbitScene');
      const balanceSvg = d3.select('#balanceSvg');
      const altitudeOut = document.getElementById('altitudeOut');
      const speedOut = document.getElementById('speedOut');
      const statusBadge = document.getElementById('statusBadge');
      const statusCopy = document.getElementById('statusCopy');
      const balanceDelta = document.getElementById('balanceDelta');
      const modeChip = document.getElementById('modeChip');
      const a11yState = document.getElementById('a11yState');
      const resetBtn = document.getElementById('resetBtn');

      const W = 900;
      const H = 540;
      const center = { x: 392, y: 286 };
      const orbitPixels = 212;
      const launchAngle = P.toRadians(34);
      const minAltitude = K.KARMAN_ALTITUDE;
      const maxAltitude = K.ISS_ALTITUDE * 4;
      const defaultAltitude = K.ISS_ALTITUDE;
      let dragMode = null;
      let keyboardMode = 'altitude';

      const state = {
        altitude: defaultAltitude,
        speed: P.circularVelocityAtRadius(P.orbitalRadius(defaultAltitude + K.ISS_ALTITUDE)),
        direction: launchAngle + Math.PI / 2
      };

      const layers = {
        guides: scene.append('g'),
        path: scene.append('g'),
        earth: scene.append('g'),
        controls: scene.append('g'),
        labels: scene.append('g')
      };

      function satellitePoint(radiusPixels) {
        return {
          x: center.x + Math.cos(launchAngle) * radiusPixels,
          y: center.y - Math.sin(launchAngle) * radiusPixels
        };
      }

      function angleDifference(a, b) {
        return Math.atan2(Math.sin(a - b), Math.cos(a - b));
      }

      function computeTrajectory(radius, speed, direction, scale) {
        const period = P.orbitalPeriodAtRadius(radius);
        const steps = 620;
        const dt = period / steps;
        let x = radius * Math.cos(launchAngle);
        let y = radius * Math.sin(launchAngle);
        let vx = speed * Math.cos(direction);
        let vy = speed * Math.sin(direction);
        let hit = false;
        const points = [];

        for (let i = 0; i <= steps; i += 1) {
          if (i % 2 === 0) points.push([center.x + x * scale, center.y - y * scale]);
          const r = Math.hypot(x, y);
          if (r <= K.EARTH_RADIUS) { hit = true; break; }
          const gravity = P.gravityAtRadius(r);
          vx += (-gravity * x / r) * dt;
          vy += (-gravity * y / r) * dt;
          x += vx * dt;
          y += vy * dt;
        }
        return { points: points, hit: hit, endDistance: Math.hypot(x - radius * Math.cos(launchAngle), y - radius * Math.sin(launchAngle)) };
      }

      function updateBalance(gravity, centripetal) {
        const data = [
          { key: 'gravity', label: '重力  g', value: gravity, cls: 'bar-g' },
          { key: 'centripetal', label: '向心需求  v²/r', value: centripetal, cls: 'bar-c' }
        ];
        const scale = d3.scaleLinear().domain([0, Math.max(gravity, centripetal) * 1.08]).range([120, 405]);
        const rows = balanceSvg.selectAll('g.balance-row').data(data, d => d.key).join(enter => {
          const g = enter.append('g').attr('class', 'balance-row');
          g.append('text').attr('class', 'bar-label').attr('x', 0);
          g.append('line').attr('class', 'bar-base').attr('x1', 120).attr('x2', 405);
          g.append('line').attr('data-role', 'bar').attr('x1', 120);
          g.append('text').attr('class', 'bar-value').attr('x', 405).attr('text-anchor', 'end');
          return g;
        }).attr('transform', (d, i) => `translate(0,${24 + i * 48})`);
        rows.select('.bar-label').text(d => d.label).attr('y', 5);
        rows.select('[data-role="bar"]').attr('class', d => d.cls).attr('x2', d => scale(d.value));
        rows.select('.bar-value').text(d => P.formatNumber(d.value, 2) + ' m/s²').attr('y', 24);
      }

      function render(announce) {
        state.altitude = P.clamp(state.altitude, minAltitude, maxAltitude);
        const orbit = P.circularOrbit(state.altitude);
        const radius = orbit.radius;
        const scale = orbitPixels / radius;
        const earthPixels = K.EARTH_RADIUS * scale;
        const sat = satellitePoint(orbitPixels);
        const idealDirection = launchAngle + Math.PI / 2;
        const directionError = Math.abs(angleDifference(state.direction, idealDirection));
        const speedError = Math.abs(state.speed - orbit.speed) / orbit.speed;
        const combinedError = Math.hypot(speedError, directionError);
        const trajectory = computeTrajectory(radius, state.speed, state.direction, scale);
        const matched = combinedError <= 44 / W;
        const centripetal = P.centripetalAcceleration(state.speed, radius);
        const gravity = P.gravityAtRadius(radius);
        const velocityPixels = state.speed / orbit.speed * 118;
        const end = {
          x: sat.x + Math.cos(state.direction) * velocityPixels,
          y: sat.y - Math.sin(state.direction) * velocityPixels
        };

        layers.guides.selectAll('*').remove();
        layers.guides.append('line').attr('class', 'radial-guide')
          .attr('x1', center.x).attr('y1', center.y).attr('x2', sat.x).attr('y2', sat.y);
        layers.guides.append('circle').attr('class', 'guide-orbit')
          .attr('cx', center.x).attr('cy', center.y).attr('r', orbitPixels);

        const line = d3.line().curve(d3.curveLinear);
        layers.path.selectAll('path.trajectory').data([trajectory.points]).join('path')
          .attr('class', matched ? 'trajectory is-match' : 'trajectory').attr('d', line);
        layers.path.selectAll('circle.error-ring').data([combinedError]).join('circle')
          .attr('class', matched ? 'error-ring is-match' : 'error-ring')
          .attr('cx', sat.x).attr('cy', sat.y).attr('r', 18 + Math.min(54, combinedError * 92));

        layers.earth.selectAll('*').remove();
        layers.earth.append('circle').attr('class', 'earth').attr('cx', center.x).attr('cy', center.y).attr('r', earthPixels);
        layers.earth.append('ellipse').attr('class', 'earth-line').attr('cx', center.x).attr('cy', center.y)
          .attr('rx', earthPixels).attr('ry', earthPixels * .32);
        layers.earth.append('path').attr('class', 'earth-line')
          .attr('d', `M ${center.x} ${center.y - earthPixels} Q ${center.x - earthPixels * .45} ${center.y} ${center.x} ${center.y + earthPixels} Q ${center.x + earthPixels * .45} ${center.y} ${center.x} ${center.y - earthPixels}`);

        layers.controls.selectAll('*').remove();
        layers.controls.append('circle').attr('class', 'satellite-halo').attr('cx', sat.x).attr('cy', sat.y).attr('r', 22);
        layers.controls.append('circle').attr('class', 'satellite').attr('cx', sat.x).attr('cy', sat.y).attr('r', 8).attr('data-control', 'altitude');
        layers.controls.append('line').attr('class', 'velocity-line').attr('x1', sat.x).attr('y1', sat.y).attr('x2', end.x).attr('y2', end.y);
        layers.controls.append('circle').attr('class', 'velocity-handle').attr('cx', end.x).attr('cy', end.y).attr('r', 12).attr('data-control', 'velocity');

        layers.labels.selectAll('*').remove();
        layers.labels.append('text').attr('class', 'svg-label').attr('x', sat.x + 25).attr('y', sat.y + 34).text('拖动卫星：改变轨道高度');
        layers.labels.append('text').attr('class', 'svg-value').attr('x', end.x + 18).attr('y', end.y - 12).text(P.formatSpeed(state.speed, 2));
        layers.labels.append('text').attr('class', 'svg-label').attr('x', center.x).attr('y', center.y + 5).attr('text-anchor', 'middle').text('地球');

        altitudeOut.textContent = P.formatDistance(state.altitude, 0);
        speedOut.textContent = P.formatNumber(state.speed / K.units.kps, 2) + ' / ' + P.formatNumber(orbit.speed / K.units.kps, 2) + ' km/s';
        balanceDelta.textContent = '差 ' + P.formatNumber(Math.abs(gravity - centripetal), 2) + ' m/s²';
        updateBalance(gravity, centripetal);

        statusBadge.className = 'status ' + (matched ? 'status--live' : trajectory.hit ? 'status--error' : 'status--warn');
        if (matched) {
          statusBadge.textContent = '误差环已收拢';
          statusCopy.textContent = '方向近似切向，速度也匹配；轨迹闭合成圆。';
        } else if (trajectory.hit) {
          statusBadge.textContent = '轨迹撞向地球';
          statusCopy.textContent = '当前速度或方向使轨迹切入地表；先把箭头转向切线，再增加长度。';
        } else if (state.speed < orbit.speed) {
          statusBadge.textContent = '速度偏小或方向不切向';
          statusCopy.textContent = '轨迹向内弯曲；圆轨道要求速度方向与半径近似垂直。';
        } else {
          statusBadge.textContent = '形成非圆轨道';
          statusCopy.textContent = '速度偏大或方向有径向分量，轨迹不会在当前半径保持圆形。';
        }

        if (announce) {
          a11yState.textContent = '当前高度' + P.formatDistance(state.altitude, 0) + '，速度' + P.formatSpeed(state.speed, 2) + '。' + statusCopy.textContent;
        }
      }

      function pointerPoint(event) {
        return Deck.pt(svgNode, event);
      }

      svgNode.addEventListener('pointerdown', function (event) {
        const point = pointerPoint(event);
        const orbit = P.circularOrbit(state.altitude);
        const sat = satellitePoint(orbitPixels);
        const velocityPixels = state.speed / orbit.speed * 118;
        const end = { x: sat.x + Math.cos(state.direction) * velocityPixels, y: sat.y - Math.sin(state.direction) * velocityPixels };
        const nearSatellite = Math.hypot(point.x - sat.x, point.y - sat.y) <= 28;
        const nearVelocity = Math.hypot(point.x - end.x, point.y - end.y) <= 28;
        if (!nearSatellite && !nearVelocity) return;
        dragMode = nearVelocity ? 'velocity' : 'altitude';
        keyboardMode = dragMode;
        modeChip.textContent = dragMode === 'velocity' ? '速度模式' : '高度模式';
        svgNode.setPointerCapture(event.pointerId);
        event.preventDefault();
      });

      svgNode.addEventListener('pointermove', function (event) {
        if (!dragMode) return;
        const point = pointerPoint(event);
        const orbit = P.circularOrbit(state.altitude);
        const sat = satellitePoint(orbitPixels);
        if (dragMode === 'altitude') {
          const projected = (point.x - center.x) * Math.cos(launchAngle) - (point.y - center.y) * Math.sin(launchAngle);
          state.altitude = P.lerp(minAltitude, maxAltitude, P.clamp((projected - 150) / 135, 0, 1));
        } else {
          const dx = point.x - sat.x;
          const dy = -(point.y - sat.y);
          state.direction = Math.atan2(dy, dx);
          state.speed = P.clamp(Math.hypot(dx, dy) / 118 * orbit.speed, orbit.speed / 4, orbit.speed * 1.65);
        }
        render(false);
        event.preventDefault();
      });

      function endDrag(event) {
        if (!dragMode) return;
        dragMode = null;
        if (svgNode.hasPointerCapture(event.pointerId)) svgNode.releasePointerCapture(event.pointerId);
        render(true);
      }
      svgNode.addEventListener('pointerup', endDrag);
      svgNode.addEventListener('pointercancel', endDrag);
      svgNode.addEventListener('lostpointercapture', function () { dragMode = null; });

      svgNode.addEventListener('keydown', function (event) {
        const orbit = P.circularOrbit(state.altitude);
        const altitudeStep = (maxAltitude - minAltitude) / 40;
        const speedStep = orbit.speed / 50;
        const angleStep = P.toRadians(2);
        let handled = true;
        if (event.key === 'Enter' || event.key === ' ') {
          keyboardMode = keyboardMode === 'altitude' ? 'velocity' : 'altitude';
          modeChip.textContent = keyboardMode === 'velocity' ? '速度模式' : '高度模式';
        } else if (keyboardMode === 'altitude' && (event.key === 'ArrowUp' || event.key === 'ArrowRight')) {
          state.altitude += altitudeStep;
        } else if (keyboardMode === 'altitude' && (event.key === 'ArrowDown' || event.key === 'ArrowLeft')) {
          state.altitude -= altitudeStep;
        } else if (keyboardMode === 'velocity' && event.key === 'ArrowUp') {
          state.speed += speedStep;
        } else if (keyboardMode === 'velocity' && event.key === 'ArrowDown') {
          state.speed -= speedStep;
        } else if (keyboardMode === 'velocity' && event.key === 'ArrowLeft') {
          state.direction += angleStep;
        } else if (keyboardMode === 'velocity' && event.key === 'ArrowRight') {
          state.direction -= angleStep;
        } else if (event.key === 'Home') {
          if (keyboardMode === 'altitude') state.altitude = defaultAltitude;
          else { state.speed = orbit.speed; state.direction = launchAngle + Math.PI / 2; }
        } else {
          handled = false;
        }
        if (handled) { event.preventDefault(); render(true); }
      });

      resetBtn.addEventListener('click', function () {
        state.altitude = defaultAltitude;
        state.speed = P.circularVelocityAtRadius(P.orbitalRadius(defaultAltitude + K.ISS_ALTITUDE));
        state.direction = launchAngle + Math.PI / 2;
        keyboardMode = 'altitude';
        modeChip.textContent = '高度模式';
        render(true);
        svgNode.focus();
      });

      render(false);
    }, { once: true });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
