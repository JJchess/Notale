<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="11" data-total="20">
<div id="stage">
  <style>
    .period-page { grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "a b c" "foot foot foot"; gap: var(--space-5); padding-block: var(--space-5); }
    .period-page .orbit-card { display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:var(--space-3); padding:var(--space-4); }
    .period-page .orbit-card__head { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); }
    .period-page .orbit-name { margin:0; color:var(--text-strong); font-size:var(--fs-h3); line-height:var(--lh-tight); }
    .period-page .orbit-figure { display:grid; place-items:center; min-block-size:0; margin:0; }
    .period-page .orbit-svg { display:block; inline-size:400px; max-inline-size:100%; block-size:280px; outline:none; touch-action:none; }
    .period-page .orbit-svg:focus-visible { border-radius:var(--radius-md); box-shadow:0 0 0 3px var(--focus); }
    .period-page .space-ring { fill:none; stroke:var(--line-strong); stroke-width:2; }
    .period-page .space-ring-hit { fill:none; stroke:transparent; stroke-width:44; cursor:ns-resize; }
    .period-page .count-ring { fill:none; stroke:var(--accent); stroke-width:2; opacity:.48; }
    .period-page .target-ring { fill:none; stroke:var(--warm); stroke-width:2; stroke-dasharray:7 7; opacity:.8; }
    .period-page .earth-halo { fill:var(--accent-soft); }
    .period-page .earth { fill:var(--surface-3); stroke:var(--accent); stroke-width:2; }
    .period-page .earth-mark { fill:none; stroke:var(--line-strong); stroke-width:2; }
    .period-page .sat { fill:var(--text-strong); stroke:var(--accent); stroke-width:4; }
    .period-page .start-line { stroke:var(--chart-axis); stroke-width:1; stroke-dasharray:3 5; opacity:.7; }
    .period-page .clock-face { fill:var(--surface-inset); stroke:var(--line-strong); stroke-width:2; }
    .period-page .clock-tick { stroke:var(--text-faint); stroke-width:2; }
    .period-page .clock-hand { stroke:var(--warm); stroke-width:4; stroke-linecap:round; cursor:grab; }
    .period-page .clock-hub { fill:var(--warm); }
    .period-page .svg-label { fill:var(--text-muted); font-family:var(--font-sans); font-size:14px; }
    .period-page .svg-count { fill:var(--accent-strong); font-family:var(--font-mono); font-size:16px; font-weight:var(--weight-semibold); }
    .period-page .metrics { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); padding:var(--space-3); }
    .period-page .metric { min-inline-size:0; }
    .period-page .metric-label { display:block; }
    .period-page .metric-value { display:block; margin-block-start:var(--space-1); font-size:var(--fs-small); overflow:visible; white-space:normal; }
    .period-page .clock-readout { grid-column:1 / -1; padding-block-start:var(--space-2); border-block-start:1px solid var(--line); }
    .period-page .action-deck { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:var(--space-5); padding:var(--space-4) var(--space-5); }
    .period-page .prediction { display:flex; align-items:center; justify-content:center; gap:var(--space-3); min-inline-size:0; }
    .period-page .prediction__prompt { color:var(--text-muted); font-size:var(--fs-small); line-height:var(--lh-body); }
    .period-page .prediction__result { min-inline-size:300px; color:var(--text); font-size:var(--fs-small); line-height:var(--lh-body); text-align:end; }
    .period-page button { white-space:nowrap; }
    @media (prefers-reduced-motion: reduce) { .period-page * { transition-duration:0.01ms !important; } }
  </style>

  <main class="triptych period-page" aria-label="三条同步圆轨道的周期实验">
    <section class="layout-a card orbit-card" data-orbit="0">
      <div class="orbit-card__head"><h2 class="orbit-name">低轨</h2><span class="badge">拖动轨道环</span></div>
      <figure class="orbit-figure">
        <svg class="orbit-svg no-pan" viewBox="0 0 400 280" tabindex="0" role="slider" aria-label="低轨高度，拖动轨道环调整，方向键也可调整"></svg>
      </figure>
      <div class="readout-panel metrics">
        <div class="metric"><span class="metric-label">高度</span><output class="metric-value altitude"></output></div>
        <div class="metric"><span class="metric-label">周期</span><output class="metric-value period"></output></div>
        <div class="metric"><span class="metric-label">平均运动</span><output class="metric-value motion"></output></div>
        <div class="metric"><span class="metric-label">累计</span><output class="metric-value laps"></output></div>
      </div>
    </section>

    <section class="layout-b card orbit-card card--accent" data-orbit="1">
      <div class="orbit-card__head"><h2 class="orbit-name">中轨</h2><span class="badge">环＋目标时钟</span></div>
      <figure class="orbit-figure">
        <svg class="orbit-svg no-pan" viewBox="0 0 400 280" tabindex="0" role="slider" aria-label="中轨高度与目标周期时钟；拖轨道环调高度，拖右下时钟反求高度；方向键调轨道，Shift加方向键调时钟"></svg>
      </figure>
      <div class="readout-panel metrics">
        <div class="metric"><span class="metric-label">高度</span><output class="metric-value altitude"></output></div>
        <div class="metric"><span class="metric-label">周期</span><output class="metric-value period"></output></div>
        <div class="metric"><span class="metric-label">平均运动</span><output class="metric-value motion"></output></div>
        <div class="metric"><span class="metric-label">累计</span><output class="metric-value laps"></output></div>
        <div class="metric clock-readout"><span class="metric-label">目标周期 → 反求高度（地心半径）</span><output class="metric-value target-value"></output></div>
      </div>
    </section>

    <section class="layout-c card orbit-card" data-orbit="2">
      <div class="orbit-card__head"><h2 class="orbit-name">高轨</h2><span class="badge">拖动轨道环</span></div>
      <figure class="orbit-figure">
        <svg class="orbit-svg no-pan" viewBox="0 0 400 280" tabindex="0" role="slider" aria-label="高轨高度，拖动轨道环调整，方向键也可调整"></svg>
      </figure>
      <div class="readout-panel metrics">
        <div class="metric"><span class="metric-label">高度</span><output class="metric-value altitude"></output></div>
        <div class="metric"><span class="metric-label">周期</span><output class="metric-value period"></output></div>
        <div class="metric"><span class="metric-label">平均运动</span><output class="metric-value motion"></output></div>
        <div class="metric"><span class="metric-label">累计</span><output class="metric-value laps"></output></div>
      </div>
    </section>

    <section class="layout-foot panel panel--flat action-deck" aria-label="同步运行与预测">
      <button type="button" class="button--primary" id="sync-start">同线出发</button>
      <div class="prediction">
        <span class="prediction__prompt">预测：周期加倍，高度也加倍？</span>
        <button type="button" class="predict" data-answer="yes">会</button>
        <button type="button" class="predict" data-answer="no">不会</button>
      </div>
      <output class="prediction__result" id="prediction-result" aria-live="polite">先作预测，再看真实反算。</output>
    </section>
  </main>

  <script src="assets/lib/d3.min.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      'use strict';

      const page = Object.freeze({
        index: 11,
        kicker: `PERIOD`,
        title: `更高的卫星路更长，速度也更低，所以周期增长得<em>更快</em>`,
        take: `轨道周期由轨道尺度决定，并不是离地越远就能更快绕地球。`
      });

      Lec.mount(page);

      const P = Lec.P;
      const K = Lec.K;
      const minAltitude = K.KARMAN_ALTITUDE;
      const maxAltitude = K.GEO_ALTITUDE;
      const minRadius = P.orbitalRadius(minAltitude);
      const maxRadius = P.orbitalRadius(maxAltitude);
      const minPeriod = P.orbitalPeriodAtRadius(minRadius);
      const maxPeriod = P.orbitalPeriodAtRadius(maxRadius);
      const state = {
        altitudes: [K.ISS_ALTITUDE, K.orbit.mediumEarthAltitude, K.GEO_ALTITUDE],
        targetPeriod: K.EARTH_SIDEREAL_DAY,
        elapsed: 0,
        running: false,
        drag: null
      };
      const cards = Array.from(document.querySelectorAll('[data-orbit]'));
      const svgs = cards.map(function (card) { return card.querySelector('svg'); });
      const orbitCenter = { x: 185, y: 132 };
      const clockCenter = { x: 332, y: 226 };
      const earthRadius = 39;
      const orbitScale = d3.scaleLog().domain([minRadius, maxRadius]).range([70, 116]);
      const altitudeScale = d3.scaleLog().domain([minRadius, maxRadius]).range([0, 1]);
      const targetScale = d3.scaleLog().domain([minPeriod, maxPeriod]).range([0, Math.PI * 2]);
      const startButton = document.getElementById('sync-start');
      const prediction = document.getElementById('prediction-result');

      function physics(index) {
        const radius = P.orbitalRadius(state.altitudes[index]);
        return {
          radius: radius,
          period: P.orbitalPeriodAtRadius(radius),
          motion: P.meanMotion(radius)
        };
      }

      function setAltitude(index, altitude) {
        state.altitudes[index] = P.clamp(altitude, minAltitude, maxAltitude);
        update();
      }

      function setTarget(period) {
        state.targetPeriod = P.clamp(period, minPeriod, maxPeriod);
        update();
      }

      function ringFromPoint(index, point) {
        const distance = Math.hypot(point.x - orbitCenter.x, point.y - orbitCenter.y);
        const clamped = P.clamp(distance, orbitScale(minRadius), orbitScale(maxRadius));
        setAltitude(index, P.altitudeFromRadius(orbitScale.invert(clamped)));
      }

      function clockFromPoint(point) {
        let angle = Math.atan2(point.x - clockCenter.x, -(point.y - clockCenter.y));
        if (angle < 0) angle += Math.PI * 2;
        setTarget(targetScale.invert(angle));
      }

      function buildSvg(svg, index) {
        const root = d3.select(svg);
        root.append('line').attr('class', 'start-line').attr('x1', orbitCenter.x).attr('y1', 12).attr('x2', orbitCenter.x).attr('y2', 252);
        root.append('circle').attr('class', 'earth-halo').attr('cx', orbitCenter.x).attr('cy', orbitCenter.y).attr('r', earthRadius + 9);
        root.append('circle').attr('class', 'earth').attr('cx', orbitCenter.x).attr('cy', orbitCenter.y).attr('r', earthRadius);
        root.append('path').attr('class', 'earth-mark').attr('d', 'M151 126 Q170 109 189 123 T219 119 M158 146 Q181 135 213 150');
        root.append('g').attr('class', 'counts');
        root.append('circle').attr('class', 'target-ring').attr('cx', orbitCenter.x).attr('cy', orbitCenter.y).style('display', index === 1 ? null : 'none');
        root.append('circle').attr('class', 'space-ring').attr('cx', orbitCenter.x).attr('cy', orbitCenter.y);
        root.append('circle').attr('class', 'space-ring-hit').attr('cx', orbitCenter.x).attr('cy', orbitCenter.y);
        root.append('circle').attr('class', 'sat').attr('r', 7);
        root.append('text').attr('class', 'svg-count').attr('x', 18).attr('y', 256);
        if (index === 1) {
          const clock = root.append('g').attr('class', 'clock');
          clock.append('circle').attr('class', 'clock-face').attr('cx', clockCenter.x).attr('cy', clockCenter.y).attr('r', 37);
          d3.range(12).forEach(function (tick) {
            const a = tick / 12 * Math.PI * 2;
            clock.append('line').attr('class', 'clock-tick')
              .attr('x1', clockCenter.x + Math.sin(a) * 29).attr('y1', clockCenter.y - Math.cos(a) * 29)
              .attr('x2', clockCenter.x + Math.sin(a) * 34).attr('y2', clockCenter.y - Math.cos(a) * 34);
          });
          clock.append('line').attr('class', 'clock-hand');
          clock.append('circle').attr('class', 'clock-hub').attr('cx', clockCenter.x).attr('cy', clockCenter.y).attr('r', 5);
          clock.append('text').attr('class', 'svg-label').attr('x', 286).attr('y', 276).text('拖时钟反求高度');
        }

        svg.addEventListener('pointerdown', function (event) {
          const point = Deck.pt(svg, event);
          const inClock = index === 1 && Math.hypot(point.x - clockCenter.x, point.y - clockCenter.y) <= 54;
          state.drag = { index: index, mode: inClock ? 'clock' : 'ring', pointer: event.pointerId };
          svg.setPointerCapture(event.pointerId);
          if (inClock) clockFromPoint(point); else ringFromPoint(index, point);
        });
        svg.addEventListener('pointermove', function (event) {
          if (!state.drag || state.drag.pointer !== event.pointerId || state.drag.index !== index) return;
          const point = Deck.pt(svg, event);
          if (state.drag.mode === 'clock') clockFromPoint(point); else ringFromPoint(index, point);
        });
        function endDrag(event) {
          if (!state.drag || state.drag.pointer !== event.pointerId) return;
          if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
          state.drag = null;
        }
        svg.addEventListener('pointerup', endDrag);
        svg.addEventListener('pointercancel', endDrag);
        svg.addEventListener('lostpointercapture', function () { state.drag = null; });
        svg.addEventListener('keydown', function (event) {
          const key = event.key;
          if (!['ArrowUp', 'ArrowRight', 'ArrowDown', 'ArrowLeft', 'Home', 'End'].includes(key)) return;
          event.preventDefault();
          const positive = key === 'ArrowUp' || key === 'ArrowRight';
          if (index === 1 && event.shiftKey) {
            if (key === 'Home') setTarget(minPeriod);
            else if (key === 'End') setTarget(maxPeriod);
            else {
              const fraction = targetScale(state.targetPeriod) / (Math.PI * 2);
              setTarget(targetScale.invert(P.clamp(fraction + (positive ? 0.02 : -0.02), 0, 1) * Math.PI * 2));
            }
          } else {
            if (key === 'Home') setAltitude(index, minAltitude);
            else if (key === 'End') setAltitude(index, maxAltitude);
            else {
              const radius = P.orbitalRadius(state.altitudes[index]);
              const fraction = altitudeScale(radius);
              setAltitude(index, P.altitudeFromRadius(altitudeScale.invert(P.clamp(fraction + (positive ? 0.02 : -0.02), 0, 1))));
            }
          }
        });
      }

      function update() {
        const targetRadius = P.radiusForPeriod(state.targetPeriod);
        const targetAltitude = P.altitudeForPeriod(state.targetPeriod);
        cards.forEach(function (card, index) {
          const data = physics(index);
          const ring = orbitScale(data.radius);
          const angle = data.motion * state.elapsed;
          const laps = Math.floor(state.elapsed / data.period);
          const shownRings = d3.range(Math.min(laps, 6));
          const root = d3.select(svgs[index]);
          root.select('.space-ring').attr('r', ring);
          root.select('.space-ring-hit').attr('r', ring);
          root.select('.sat').attr('cx', orbitCenter.x + Math.sin(angle) * ring).attr('cy', orbitCenter.y - Math.cos(angle) * ring);
          root.select('.svg-count').text('完成 ' + P.formatNumber(laps, 0) + ' 圈');
          root.select('.counts').selectAll('circle').data(shownRings).join('circle').attr('class', 'count-ring')
            .attr('cx', orbitCenter.x).attr('cy', orbitCenter.y).attr('r', function (d) { return ring + 5 + d * 4; });
          if (index === 1) {
            const targetRing = orbitScale(P.clamp(targetRadius, minRadius, maxRadius));
            root.select('.target-ring').attr('r', targetRing);
            const clockAngle = targetScale(state.targetPeriod);
            root.select('.clock-hand').attr('x1', clockCenter.x).attr('y1', clockCenter.y)
              .attr('x2', clockCenter.x + Math.sin(clockAngle) * 26).attr('y2', clockCenter.y - Math.cos(clockAngle) * 26);
            card.querySelector('.target-value').textContent = P.formatDuration(state.targetPeriod, 2) + ' → ' + P.formatDistance(targetAltitude, 0) + '（' + P.formatDistance(targetRadius, 0) + '）';
          }
          card.querySelector('.altitude').textContent = P.formatDistance(state.altitudes[index], 0);
          card.querySelector('.period').textContent = P.formatDuration(data.period, 2);
          card.querySelector('.motion').textContent = P.formatSI(data.motion, 'rad/s', 2);
          card.querySelector('.laps').textContent = P.formatNumber(laps, 0) + ' 圈';
          svgs[index].setAttribute('aria-valuemin', String(minAltitude));
          svgs[index].setAttribute('aria-valuemax', String(maxAltitude));
          svgs[index].setAttribute('aria-valuenow', String(state.altitudes[index]));
          svgs[index].setAttribute('aria-valuetext', '高度' + P.formatDistance(state.altitudes[index], 0) + '，周期' + P.formatDuration(data.period, 2));
        });
      }

      svgs.forEach(buildSvg);
      startButton.addEventListener('click', function () {
        state.elapsed = 0;
        state.running = true;
        startButton.textContent = '重新同线出发';
        update();
      });
      document.querySelectorAll('.predict').forEach(function (button) {
        button.addEventListener('click', function () {
          const current = physics(1);
          const doubledPeriod = current.period + current.period;
          const actualAltitude = P.altitudeForPeriod(doubledPeriod);
          const ratio = actualAltitude / state.altitudes[1];
          const correct = button.dataset.answer === 'no';
          prediction.textContent = (correct ? '猜对：' : '再看反算：') + P.formatDistance(state.altitudes[1], 0) + ' → ' + P.formatDistance(actualAltitude, 0) + '，为原高度的 ' + P.formatNumber(ratio, 2) + ' 倍。';
          document.querySelectorAll('.predict').forEach(function (item) { item.setAttribute('aria-pressed', String(item === button)); });
        });
      });

      update();
      const basePeriod = physics(0).period;
      Deck.loop(function (_time, dt) {
        if (state.running && !Deck.reduced()) {
          state.elapsed += dt * basePeriod / 8000;
          update();
        }
      }, { still: 0 });
    }, { once: true });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
