<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="12" data-total="20">
<div id="stage">
  <style>
    .escape-page .layout-main {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: var(--space-5);
    }
    .escape-page escape-sling-game {
      display: contents;
    }
    .escape-page .escape-field {
      position: relative;
      min-block-size: 0;
    }
    .escape-page .escape-field canvas {
      inline-size: 100%;
      block-size: 100%;
      min-block-size: 410px;
      cursor: ew-resize;
      outline: none;
    }
    .escape-page .escape-field canvas:focus-visible {
      box-shadow: inset 0 0 0 3px var(--focus);
    }
    .escape-page .field-top {
      position: absolute;
      inset: var(--space-5) var(--space-5) auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-4);
      pointer-events: none;
    }
    .escape-page .mission-copy {
      max-inline-size: 42ch;
      padding: var(--space-3) var(--space-4);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-glass);
    }
    .escape-page .mission-copy strong {
      display: block;
      color: var(--text-strong);
      font-size: var(--fs-small);
      line-height: var(--lh-tight);
    }
    .escape-page .mission-copy span {
      display: block;
      margin-block-start: var(--space-1);
      color: var(--text-muted);
      font-size: var(--fs-caption);
      line-height: var(--lh-tight);
    }
    .escape-page .result-pill {
      min-inline-size: 240px;
      justify-content: center;
      background: var(--surface-glass);
    }
    .escape-page .game-console {
      display: grid;
      grid-template-columns: minmax(250px, 1.1fr) repeat(3, minmax(0, 0.72fr)) auto;
      gap: var(--space-3);
      align-items: stretch;
      padding: var(--space-4);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface-glass);
      box-shadow: var(--shadow-panel);
    }
    .escape-page .altitude-control {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--space-2);
      min-inline-size: 0;
      padding-inline: var(--space-3);
    }
    .escape-page .control-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-3);
    }
    .escape-page .control-line output {
      color: var(--accent-strong);
      font-family: var(--font-mono);
      font-size: var(--fs-label);
      white-space: nowrap;
    }
    .escape-page .mini-readout {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--space-1);
      min-inline-size: 0;
      padding: var(--space-3) var(--space-4);
      border-inline-start: 1px solid var(--line);
    }
    .escape-page .mini-readout span {
      color: var(--text-muted);
      font-size: var(--fs-caption);
      line-height: var(--lh-tight);
    }
    .escape-page .mini-readout strong {
      overflow: hidden;
      color: var(--text-strong);
      font-family: var(--font-mono);
      font-size: var(--fs-label-lg);
      font-variant-numeric: tabular-nums;
      line-height: var(--lh-tight);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .escape-page .mini-readout.energy strong {
      color: var(--warm);
    }
    .escape-page .reset-button {
      align-self: center;
      min-inline-size: 96px;
    }
    @media (prefers-reduced-motion: reduce) {
      .escape-page * { transition-duration: 0.01ms !important; }
    }
  </style>

  <main class="focus escape-page" aria-label="逃逸速度弹射挑战">
    <section class="layout-main min0">
      <escape-sling-game>
        <div class="canvas-frame escape-field min0">
          <canvas id="escape-canvas" class="cv-fill no-pan" width="1160" height="470" tabindex="0" role="slider" aria-label="弹射速度手柄；左右方向键调速，Home 设为圆轨道速度，End 设为逃逸速度，Enter 发射" aria-describedby="mission-copy" aria-valuemin="0"></canvas>
          <div class="field-top">
            <div id="mission-copy" class="mission-copy">
              <strong>目标：命中能量零点</strong>
              <span>拖动速度手柄，松开弹射；轨迹离开画框不等于逃逸。</span>
            </div>
            <div id="result-pill" class="status result-pill" aria-live="polite">待弹射</div>
          </div>
        </div>

        <div class="game-console">
          <label class="altitude-control" for="altitude-range">
            <span class="control-line"><span class="control-label">出发高度</span><output id="altitude-output"></output></span>
            <input id="altitude-range" type="range" aria-describedby="altitude-hint">
            <span id="altitude-hint" class="control-hint">改变半径后，两枚速度标记会一起移动</span>
          </label>
          <div class="mini-readout"><span>当前弹射速度</span><strong id="speed-output">—</strong></div>
          <div class="mini-readout"><span>当地圆轨道速度</span><strong id="circular-output">—</strong></div>
          <div class="mini-readout energy"><span>单位质量轨道能量</span><strong id="energy-output">—</strong></div>
          <button id="reset-button" class="button--quiet reset-button" type="button">重置</button>
        </div>
      </escape-sling-game>
    </section>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      'use strict';

      const page = Object.freeze({
        index: 12,
        kicker: `ESCAPE`,
        title: `逃逸速度不是“飞到某个高度”，而是让总能量<em>不再为负</em>`,
        take: `在同一位置，速度决定轨道是闭合、临界逃逸还是开放。`
      });

      Lec.mount(page);

      if (!customElements.get('escape-sling-game')) {
        customElements.define('escape-sling-game', class extends HTMLElement {});
      }
      const game = document.querySelector('escape-sling-game');
      const cv = document.getElementById('escape-canvas');
      const altitudeInput = document.getElementById('altitude-range');
      const altitudeOutput = document.getElementById('altitude-output');
      const speedOutput = document.getElementById('speed-output');
      const circularOutput = document.getElementById('circular-output');
      const energyOutput = document.getElementById('energy-output');
      const resultPill = document.getElementById('result-pill');
      const resetButton = document.getElementById('reset-button');
      const P = Lec.P;
      const K = Lec.K;
      const W = 1160;
      const H = 470;
      const rail = Object.freeze({ x0: 520, x1: 1080, y: 405 });
      const earth = Object.freeze({ x: 285, y: 245, radius: 62 });
      const traceLimit = 720;
      let ctx = Deck.fit(cv);
      let dragging = false;
      let completionSent = false;

      function freshState() {
        const altitude = K.ISS_ALTITUDE;
        const radius = K.EARTH_RADIUS + altitude;
        const circular = P.circularVelocityAtRadius(radius);
        return {
          phase: 'aim',
          altitude: altitude,
          radius: radius,
          speed: circular,
          x: radius,
          y: 0,
          vx: 0,
          vy: circular,
          trace: [],
          outwardTicks: 0,
          result: '待弹射'
        };
      }

      let state = freshState();

      function localValues(s) {
        const radius = Math.hypot(s.x, s.y);
        const speed = Math.hypot(s.vx, s.vy);
        const circular = P.circularVelocityAtRadius(s.radius);
        const escape = P.escapeVelocityAtRadius(s.radius);
        const denominator = 2 / radius - speed * speed / K.EARTH_MU;
        const semiMajorAxis = denominator === 0 ? Infinity : 1 / denominator;
        const energy = P.specificOrbitalEnergy(semiMajorAxis);
        return { radius: radius, speed: speed, circular: circular, escape: escape, energy: energy };
      }

      function energyClass(energy, radius) {
        const tolerance = Math.abs(K.EARTH_MU / radius) * Number.EPSILON * 64;
        if (Math.abs(energy) <= tolerance) return 'zero';
        return energy < 0 ? 'negative' : 'positive';
      }

      function setAimSpeed(speed) {
        const escape = P.escapeVelocityAtRadius(state.radius);
        state.speed = P.clamp(speed, 0, escape * 1.24);
        state.vx = 0;
        state.vy = state.speed;
        state.x = state.radius;
        state.y = 0;
        state.trace = [];
        state.phase = 'aim';
        state.result = '待弹射';
        state.outwardTicks = 0;
        completionSent = false;
        sync();
        emit('game-progress', { action: 'aim', metrics: metrics() });
      }

      function metrics() {
        const v = localValues(state);
        return { altitude: state.altitude, speed: state.speed, circularSpeed: v.circular, escapeSpeed: v.escape, specificEnergy: v.energy, result: state.result };
      }

      function emit(name, detail) {
        game.dispatchEvent(new CustomEvent(name, { bubbles: true, composed: true, detail: detail }));
      }

      function launch() {
        if (state.phase !== 'aim') return;
        state.phase = 'flight';
        const values = localValues(state);
        const kind = energyClass(values.energy, state.radius);
        state.result = kind === 'negative' ? '闭合｜能量为负' : kind === 'zero' ? '临界逃逸｜能量为零' : '开放｜能量为正';
        emit('game-start', { state: game.getState() });
        if (kind === 'zero' && !completionSent) {
          completionSent = true;
          emit('game-complete', { score: 1, metrics: metrics(), trace: state.trace.slice() });
        }
        sync();
      }

      function reset() {
        state = freshState();
        altitudeInput.value = String(state.altitude);
        completionSent = false;
        sync();
        emit('game-reset', { state: game.getState() });
      }

      function sync() {
        const values = localValues(state);
        altitudeOutput.value = P.formatDistance(P.altitudeFromRadius(state.radius), 0);
        speedOutput.textContent = P.formatSpeed(state.speed, 2);
        circularOutput.textContent = P.formatSpeed(values.circular, 2);
        energyOutput.textContent = P.formatSI(values.energy, 'J/kg', 2);
        resultPill.textContent = state.result;
        resultPill.className = 'status result-pill' + (energyClass(values.energy, values.radius) === 'positive' ? ' status--live' : energyClass(values.energy, values.radius) === 'zero' ? ' status--warn' : '');
        cv.setAttribute('aria-valuemax', String(values.escape * 1.24));
        cv.setAttribute('aria-valuenow', String(state.speed));
        cv.setAttribute('aria-valuetext', P.formatSpeed(state.speed, 2) + '；' + state.result);
        draw();
      }

      function worldToCanvas(x, y) {
        const maxRadius = K.EARTH_RADIUS + K.GEO_ALTITUDE;
        const startVisual = P.lerp(earth.radius + 25, 310, P.clamp(P.altitudeFromRadius(state.radius) / K.GEO_ALTITUDE, 0, 1));
        const scale = startVisual / state.radius;
        const rawX = earth.x + x * scale;
        const rawY = earth.y - y * scale;
        return { x: rawX, y: rawY, maxRadius: maxRadius };
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        const text = Deck.rgba('text', 0.9);
        const muted = Deck.rgba('text-muted', 0.82);
        const faint = Deck.rgba('text-faint', 0.65);
        const line = Deck.rgba('line-strong', 0.75);
        const accent = Deck.rgba('accent', 1);
        const accent2 = Deck.rgba('accent-2', 1);
        const warm = Deck.rgba('warm', 1);
        const danger = Deck.rgba('danger', 1);
        const surface = Deck.rgba('surface-3', 1);
        const values = localValues(state);
        const kind = energyClass(values.energy, values.radius);

        ctx.save();
        ctx.setLineDash([5, 8]);
        ctx.strokeStyle = Deck.rgba('chart-grid', 0.7);
        ctx.beginPath();
        ctx.arc(earth.x, earth.y, worldToCanvas(state.radius, 0).x - earth.x, 0, K.TWO_PI);
        ctx.stroke();
        ctx.restore();

        const glow = ctx.createRadialGradient(earth.x - 16, earth.y - 18, 8, earth.x, earth.y, earth.radius + 18);
        glow.addColorStop(0, Deck.rgba('accent-2', 0.9));
        glow.addColorStop(0.72, Deck.rgba('surface-3', 1));
        glow.addColorStop(1, Deck.rgba('accent', 0.08));
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(earth.x, earth.y, earth.radius, 0, K.TWO_PI);
        ctx.fill();
        ctx.strokeStyle = Deck.rgba('accent-2', 0.65);
        ctx.lineWidth = 2;
        ctx.stroke();

        if (state.trace.length > 1) {
          ctx.beginPath();
          state.trace.forEach(function (p, i) {
            const q = worldToCanvas(p.x, p.y);
            if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
          });
          ctx.strokeStyle = kind === 'negative' ? accent2 : kind === 'zero' ? warm : accent;
          ctx.lineWidth = 3;
          ctx.stroke();
        }

        const probe = worldToCanvas(state.x, state.y);
        ctx.save();
        ctx.translate(probe.x, probe.y);
        ctx.rotate(-Math.atan2(state.vy, state.vx));
        ctx.fillStyle = text;
        ctx.beginPath();
        ctx.moveTo(14, 0);
        ctx.lineTo(-8, -7);
        ctx.lineTo(-4, 0);
        ctx.lineTo(-8, 7);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        ctx.font = '600 14px ' + Deck.token('font-sans');
        ctx.fillStyle = muted;
        ctx.fillText('地球', earth.x - 16, earth.y + 5);
        ctx.fillText('同一出发半径', earth.x + earth.radius + 18, earth.y + 2);

        ctx.strokeStyle = line;
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(rail.x0, rail.y);
        ctx.lineTo(rail.x1, rail.y);
        ctx.stroke();

        const maxSpeed = values.escape * 1.24;
        const xFor = function (speed) { return P.lerp(rail.x0, rail.x1, P.clamp(speed / maxSpeed, 0, 1)); };
        const circularX = xFor(values.circular);
        const escapeX = xFor(values.escape);
        ctx.lineWidth = 2;
        ctx.strokeStyle = accent2;
        ctx.beginPath(); ctx.moveTo(circularX, rail.y - 18); ctx.lineTo(circularX, rail.y + 18); ctx.stroke();
        ctx.strokeStyle = warm;
        ctx.beginPath(); ctx.moveTo(escapeX, rail.y - 22); ctx.lineTo(escapeX, rail.y + 22); ctx.stroke();
        ctx.fillStyle = accent2;
        ctx.fillText('圆轨道', circularX - 25, rail.y - 28);
        ctx.fillStyle = warm;
        ctx.fillText('能量零点 / 逃逸', escapeX - 50, rail.y - 28);
        ctx.fillStyle = faint;
        ctx.fillText('速度', rail.x0, rail.y + 42);

        const handleX = xFor(state.speed);
        ctx.fillStyle = kind === 'negative' ? accent2 : kind === 'zero' ? warm : danger;
        ctx.beginPath();
        ctx.arc(handleX, rail.y, 13, 0, K.TWO_PI);
        ctx.fill();
        ctx.strokeStyle = Deck.rgba('text-strong', 0.9);
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      function aimFromPointer(event) {
        const p = Deck.pt(cv, event);
        const escape = P.escapeVelocityAtRadius(state.radius);
        const maxSpeed = escape * 1.24;
        let speed = P.lerp(0, maxSpeed, P.clamp((p.x - rail.x0) / (rail.x1 - rail.x0), 0, 1));
        const escapeX = P.lerp(rail.x0, rail.x1, 1 / 1.24);
        if (Math.abs(p.x - escapeX) < 14) speed = escape;
        setAimSpeed(speed);
      }

      cv.addEventListener('pointerdown', function (event) {
        dragging = true;
        cv.setPointerCapture(event.pointerId);
        aimFromPointer(event);
      });
      cv.addEventListener('pointermove', function (event) {
        if (dragging) aimFromPointer(event);
      });
      function endDrag(event) {
        if (!dragging) return;
        dragging = false;
        if (cv.hasPointerCapture(event.pointerId)) cv.releasePointerCapture(event.pointerId);
        launch();
      }
      cv.addEventListener('pointerup', endDrag);
      cv.addEventListener('pointercancel', function (event) {
        dragging = false;
        if (cv.hasPointerCapture(event.pointerId)) cv.releasePointerCapture(event.pointerId);
      });
      cv.addEventListener('keydown', function (event) {
        const values = localValues(state);
        const step = values.escape / 100;
        if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') setAimSpeed(state.speed - step);
        else if (event.key === 'ArrowRight' || event.key === 'ArrowUp') setAimSpeed(state.speed + step);
        else if (event.key === 'Home') setAimSpeed(values.circular);
        else if (event.key === 'End') setAimSpeed(values.escape);
        else if (event.key === 'Enter' || event.key === ' ') launch();
        else return;
        event.preventDefault();
      });

      altitudeInput.min = String(0);
      altitudeInput.max = String(K.GEO_ALTITUDE);
      altitudeInput.step = String(K.KARMAN_ALTITUDE);
      altitudeInput.value = String(state.altitude);
      altitudeInput.addEventListener('input', function () {
        const ratio = state.speed / P.escapeVelocityAtRadius(state.radius);
        state.altitude = Number(altitudeInput.value);
        state.radius = K.EARTH_RADIUS + state.altitude;
        setAimSpeed(P.escapeVelocityAtRadius(state.radius) * ratio);
      });
      resetButton.addEventListener('click', reset);

      game.start = launch;
      game.reset = reset;
      game.getState = function () {
        return JSON.parse(JSON.stringify({
          phase: state.phase,
          altitude: state.altitude,
          radius: state.radius,
          speed: state.speed,
          result: state.result,
          metrics: metrics()
        }));
      };

      Deck.onResize(function () {
        ctx = Deck.fit(cv);
        draw();
      });

      Deck.loop(function (time, dt) {
        if (state.phase !== 'flight' || Deck.reduced()) return;
        const substeps = 4;
        const localPeriod = P.orbitalPeriodAtRadius(Math.max(Math.hypot(state.x, state.y), K.EARTH_RADIUS));
        const totalStep = Math.min(localPeriod / 560, Math.max(0, dt) * localPeriod / 18);
        const h = totalStep / substeps;
        for (let i = 0; i < substeps; i += 1) {
          const r = Math.hypot(state.x, state.y);
          const g = P.gravityAtRadius(r);
          state.vx += (-state.x / r) * g * h;
          state.vy += (-state.y / r) * g * h;
          state.x += state.vx * h;
          state.y += state.vy * h;
        }
        const rNow = Math.hypot(state.x, state.y);
        const radial = (state.x * state.vx + state.y * state.vy) / rNow;
        state.outwardTicks = radial > 0 && rNow > state.radius ? state.outwardTicks + 1 : 0;
        if (state.trace.length < traceLimit) state.trace.push({ x: state.x, y: state.y });
        const values = localValues(state);
        const kind = energyClass(values.energy, rNow);
        if (kind === 'positive' && state.outwardTicks > 24) state.result = '开放｜能量为正且持续远离';
        else if (kind === 'negative') state.result = '闭合｜能量为负';
        else if (kind === 'zero') state.result = '临界逃逸｜能量为零';
        sync();
      }, { still: 0 });

      sync();
    }, { once: true });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
