<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="14" data-total="20">
<div id="stage">
  <style>
    .p14.split-lr{--split-left:1.42fr;--split-right:.78fr;gap:var(--space-7);padding:var(--space-6) var(--page-pad-x)}
    .p14 .layout-left,.p14 .layout-right{min-inline-size:0;min-block-size:0}
    .p14 .orbit-board{position:relative;block-size:100%;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-lg);background:radial-gradient(circle at 46% 50%,var(--accent-soft),transparent 18%),var(--surface-inset);box-shadow:var(--shadow-panel)}
    .p14 #orbitSvg{display:block;inline-size:100%;block-size:100%}
    .p14 #orbitSvg text{font-family:var(--font-sans);font-size:var(--fs-caption);fill:var(--text-muted)}
    .p14 .board-top{position:absolute;inset:var(--space-5) var(--space-5) auto;display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-4);pointer-events:none}
    .p14 .mission-copy{max-inline-size:38ch;margin:0;color:var(--text-muted);font-size:var(--fs-small);line-height:var(--lh-body)}
    .p14 .board-bottom{position:absolute;inset:auto var(--space-5) var(--space-5);display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4);pointer-events:none}
    .p14 .legend{padding:var(--space-3) var(--space-4);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-glass)}
    .p14 .sw-low{--swatch:var(--accent-2)}.p14 .sw-transfer{--swatch:var(--warm)}.p14 .sw-target{--swatch:var(--accent)}
    .p14 .phase-note{max-inline-size:30ch;margin:0;padding:var(--space-3) var(--space-4);border-left:3px solid var(--warm);background:var(--surface-glass);color:var(--text);font-size:var(--fs-small);line-height:var(--lh-body)}
    .p14 .layout-right{display:flex;flex-direction:column;gap:var(--space-4)}
    .p14 .control-panel{gap:var(--space-4);padding:var(--space-5);box-shadow:none}
    .p14 .panel-head{margin-block-end:0;align-items:center}
    .p14 .control-group{gap:var(--space-2);padding-block-end:var(--space-3)}
    .p14 .label-line{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3)}
    .p14 output{color:var(--text-strong);font-family:var(--font-mono);font-size:var(--fs-label);font-variant-numeric:tabular-nums}
    .p14 .actions{display:grid;grid-template-columns:1fr auto;gap:var(--space-3)}
    .p14 .actions button{white-space:nowrap}
    .p14 .readout-panel{--readout-cols:3;padding:var(--space-3)}
    .p14 .readout{min-block-size:88px;padding:var(--space-3)}
    .p14 .readout-value{font-size:var(--fs-body)}
    .p14 .score-card{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4)}
    .p14 .score-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:var(--space-3);font-size:var(--fs-label);line-height:var(--lh-tight)}
    .p14 .meter{block-size:8px;overflow:hidden;border-radius:var(--radius-pill);background:var(--line)}
    .p14 .meter>i{display:block;inline-size:0;block-size:100%;border-radius:inherit;background:var(--accent)}
    .p14 .score-value{min-inline-size:88px;text-align:end;color:var(--text-muted);font-family:var(--font-mono);font-size:var(--fs-caption)}
    .p14 .verdict{margin:0;color:var(--text);font-size:var(--fs-small);line-height:var(--lh-body)}
    .p14 .svg-grid{stroke:var(--chart-grid);stroke-width:1}.p14 .earth{fill:var(--surface-3);stroke:var(--accent-2);stroke-width:2}.p14 .low-orbit{fill:none;stroke:var(--accent-2);stroke-width:2;stroke-dasharray:5 7}.p14 .target-orbit{fill:none;stroke:var(--accent);stroke-width:2}.p14 .ideal-orbit{fill:none;stroke:var(--warm);stroke-width:2;stroke-dasharray:9 7;opacity:.7}.p14 .trace{fill:none;stroke:var(--warm);stroke-width:3}.p14 .craft{fill:var(--text-strong);stroke:var(--warm);stroke-width:3}.p14 .target{fill:var(--accent);stroke:var(--text-strong);stroke-width:2}.p14 .burn-mark{fill:none;stroke:var(--danger);stroke-width:3}.p14 .burn-vector{stroke:var(--danger);stroke-width:3}.p14 .phase-arc{fill:none;stroke:var(--warm);stroke-width:2;stroke-dasharray:4 5}
    @media (prefers-reduced-motion:reduce){.p14 *{transition-duration:.01ms!important}}
  </style>

  <main class="p14 split-lr" aria-label="双脉冲轨道转移谜题">
    <section class="layout-left orbit-board min0" aria-labelledby="game-title">
      <svg id="orbitSvg" viewBox="0 0 900 590" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">地球、初始圆轨道、目标圆轨道与飞行轨迹</title>
        <desc id="svgDesc">等待改变出发相位；第一次点火后飞船按二体引力实时推进，可在任意时刻执行第二次点火。</desc>
      </svg>
      <div class="board-top">
        <div>
          <h2 class="heading-3" id="game-title">交会挑战</h2>
          <p class="mission-copy">先等待合适相位，再点火抬高远地点；接近目标时用第二次切向点火圆化。</p>
        </div>
        <span class="status" id="statusChip">等待出发</span>
      </div>
      <div class="board-bottom">
        <div class="legend" aria-label="轨道图例">
          <span class="legend-item"><i class="legend-swatch sw-low"></i>初始圆轨道</span>
          <span class="legend-item"><i class="legend-swatch sw-transfer"></i>实际轨迹</span>
          <span class="legend-item"><i class="legend-swatch sw-target"></i>目标圆轨道</span>
        </div>
        <p class="phase-note" id="phaseNote">目标必须在转移抵达时也到达同一点。</p>
      </div>
    </section>

    <aside class="layout-right min0" aria-label="点火控制与任务结果">
      <section class="control-panel">
        <div class="panel-head">
          <h2 class="heading-3">点火台</h2>
          <span class="badge" id="burnCount">0 / 2</span>
        </div>
        <div class="control-group">
          <div class="label-line"><label class="control-label" for="waitRange">等待至出发位置</label><output id="waitOut" for="waitRange"></output></div>
          <input id="waitRange" type="range" aria-describedby="waitHint">
          <span class="control-hint" id="waitHint">等待会同时改变飞船位置与目标相位</span>
        </div>
        <div class="control-group">
          <div class="label-line"><label class="control-label" for="dvRange">本次 Δv</label><output id="dvOut" for="dvRange"></output></div>
          <input id="dvRange" type="range">
        </div>
        <div class="control-group">
          <div class="label-line"><label class="control-label" for="dirRange">相对顺行方向</label><output id="dirOut" for="dirRange"></output></div>
          <input id="dirRange" type="range">
        </div>
        <div class="actions">
          <button class="button--primary" id="burnBtn">执行第一次点火</button>
          <button class="button--quiet" id="resetBtn">重置</button>
        </div>
      </section>

      <section class="readout-panel" aria-label="标准霍曼转移参考">
        <div class="readout readout--accent"><span class="readout-label">标准总 Δv</span><strong class="readout-value" id="stdDv"></strong><span class="readout-unit">双脉冲</span></div>
        <div class="readout"><span class="readout-label">转移时间</span><strong class="readout-value" id="stdTime"></strong><span class="readout-unit">半椭圆</span></div>
        <div class="readout"><span class="readout-label">出发相位</span><strong class="readout-value" id="stdPhase"></strong><span class="readout-unit">目标领先</span></div>
      </section>

      <section class="card score-card" aria-labelledby="score-title">
        <div class="panel-head"><h3 class="heading-3" id="score-title">挑战评分</h3><span class="status" id="resultChip">尚未完成</span></div>
        <div class="score-row"><span>燃料</span><span class="meter"><i id="fuelBar"></i></span><span class="score-value" id="fuelValue">—</span></div>
        <div class="score-row"><span>到达误差</span><span class="meter"><i id="errorBar"></i></span><span class="score-value" id="errorValue">—</span></div>
        <div class="score-row"><span>等待</span><span class="meter"><i id="waitBar"></i></span><span class="score-value" id="scoreWait">—</span></div>
        <p class="verdict" id="verdict" aria-live="polite">第二次点火后，将同时检查交会距离与圆化残差。</p>
      </section>
    </aside>
  </main>

  <script src="assets/lib/d3.min.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      'use strict';

      const page = Object.freeze({
        index: 14,
        kicker: `TRANSFER`,
        title: `霍曼转移：在两个正确的位置，各推<em>一次</em>`,
        take: `改变轨道半径通常需要两次切向点火：先进入转移椭圆，再在另一端圆化。`
      });

      Lec.mount(page);
      const mountedTitle = document.querySelector('.lec-header__title');
      if (mountedTitle) mountedTitle.innerHTML = page.title;

      const K = Lec.K;
      const P = Lec.P;
      const r1 = P.orbitalRadius(K.ISS_ALTITUDE);
      const r2 = P.orbitalRadius(K.GEO_ALTITUDE);
      const standard = P.hohmannTransfer(r1, r2);
      const idealPhase = P.transferPhaseAngle(r1, r2);
      const period1 = P.orbitalPeriodAtRadius(r1);
      const period2 = P.orbitalPeriodAtRadius(r2);
      const synodic = P.synodicPeriod(period1, period2);
      const n1 = P.meanMotion(r1);
      const n2 = P.meanMotion(r2);
      const toleranceDistance = K.ISS_ALTITUDE;
      const toleranceSpeed = toleranceDistance / standard.transferTime;

      const els = {
        svg: document.getElementById('orbitSvg'), wait: document.getElementById('waitRange'), dv: document.getElementById('dvRange'), dir: document.getElementById('dirRange'),
        waitOut: document.getElementById('waitOut'), dvOut: document.getElementById('dvOut'), dirOut: document.getElementById('dirOut'), burn: document.getElementById('burnBtn'), reset: document.getElementById('resetBtn'),
        status: document.getElementById('statusChip'), result: document.getElementById('resultChip'), burnCount: document.getElementById('burnCount'), phaseNote: document.getElementById('phaseNote'),
        fuelBar: document.getElementById('fuelBar'), errorBar: document.getElementById('errorBar'), waitBar: document.getElementById('waitBar'), fuelValue: document.getElementById('fuelValue'), errorValue: document.getElementById('errorValue'), scoreWait: document.getElementById('scoreWait'), verdict: document.getElementById('verdict')
      };

      document.getElementById('stdDv').textContent = P.formatSpeed(standard.totalDeltaV, 2);
      document.getElementById('stdTime').textContent = P.formatDuration(standard.transferTime, 1);
      document.getElementById('stdPhase').textContent = P.formatNumber(P.toDegrees(idealPhase), 1) + '°';

      els.wait.min = 0; els.wait.max = synodic; els.wait.step = synodic / (K.numeric.integrationSteps * K.numeric.integrationSteps);
      els.dv.min = 0; els.dv.max = standard.totalDeltaV; els.dv.step = standard.totalDeltaV / (K.numeric.integrationSteps * K.numeric.integrationSteps);
      els.dir.min = -K.PI; els.dir.max = K.PI; els.dir.step = K.TWO_PI / (K.numeric.integrationSteps * K.numeric.integrationSteps);

      function freshState() {
        return { phase:'waiting', wait:0, burns:0, dv:Number(standard.deltaV1), dir:0, simTime:0, targetAngle:0, craftAngle:0, x:r1, y:0, vx:0, vy:P.circularVelocityAtRadius(r1), fuel:0, trace:[], marks:[], result:null };
      }
      let state = freshState();

      const svg = d3.select(els.svg);
      const W = 900, H = 590, cx = 430, cy = 302;
      const scale = d3.scaleLinear().domain([0, r2]).range([0, 236]);
      const layer = svg.append('g').attr('transform', `translate(${cx},${cy})`);
      layer.selectAll('.grid-ring').data(P.range(0, r2, 5).slice(1)).join('circle').attr('class','svg-grid').attr('r',d=>scale(d)).attr('fill','none');
      layer.append('circle').attr('class','earth').attr('r',scale(K.EARTH_RADIUS));
      layer.append('circle').attr('class','low-orbit').attr('r',scale(r1));
      layer.append('circle').attr('class','target-orbit').attr('r',scale(r2));
      const ideal = layer.append('path').attr('class','ideal-orbit');
      const tracePath = layer.append('path').attr('class','trace');
      const phaseArc = layer.append('path').attr('class','phase-arc');
      const burnLayer = layer.append('g');
      const craft = layer.append('path').attr('class','craft').attr('d','M 0 -9 L 8 8 L 0 4 L -8 8 Z');
      const target = layer.append('path').attr('class','target').attr('d','M 0 -10 L 10 0 L 0 10 L -10 0 Z');
      const line = d3.line().x(d=>scale(d.x)).y(d=>scale(d.y));

      function point(radius, angle) { return {x:Math.cos(angle)*radius, y:Math.sin(angle)*radius}; }
      function idealPoints(angle) {
        const a = standard.semiMajorAxis;
        const e = (r2-r1)/(r2+r1);
        return P.range(0, K.PI, 100).map(nu => {
          const rr = P.radiusAtTrueAnomaly(a,e,nu);
          return point(rr, angle+nu);
        });
      }
      function normalizedAngle(a) { a %= K.TWO_PI; return a < 0 ? a + K.TWO_PI : a; }
      function currentWaitGeometry() {
        const wait = Number(els.wait.value);
        return {wait:wait, craft:n1*wait, target:n2*wait};
      }
      function setBar(el, quality) { el.style.inlineSize = P.formatPercent(P.clamp(quality,0,1),1); }

      function render() {
        if (state.phase === 'waiting') {
          const g = currentWaitGeometry();
          state.wait=g.wait; state.craftAngle=g.craft; state.targetAngle=g.target;
          const p=point(r1,state.craftAngle); state.x=p.x; state.y=p.y;
          state.vx=-Math.sin(state.craftAngle)*P.circularVelocityAtRadius(r1); state.vy=Math.cos(state.craftAngle)*P.circularVelocityAtRadius(r1);
        }
        const craftAngle = Math.atan2(state.y,state.x);
        const cp = {x:scale(state.x),y:scale(state.y)};
        const tp0 = point(r2,state.targetAngle), tp={x:scale(tp0.x),y:scale(tp0.y)};
        craft.attr('transform',`translate(${cp.x},${cp.y}) rotate(${P.toDegrees(craftAngle)+90})`);
        target.attr('transform',`translate(${tp.x},${tp.y})`);
        ideal.attr('d',line(idealPoints(state.craftAngle)));
        tracePath.attr('d',state.trace.length>1?line(state.trace):null);
        burnLayer.selectAll('g').data(state.marks).join(enter=>{const g=enter.append('g');g.append('circle').attr('class','burn-mark').attr('r',8);g.append('line').attr('class','burn-vector').attr('x2',22);return g;}).attr('transform',d=>`translate(${scale(d.x)},${scale(d.y)}) rotate(${P.toDegrees(d.angle)})`);
        const phaseRadius=scale(r1)*1.65;
        const rel=normalizedAngle(state.targetAngle-craftAngle);
        phaseArc.attr('d',d3.arc()({innerRadius:phaseRadius,outerRadius:phaseRadius,startAngle:0,endAngle:rel}));

        els.waitOut.textContent=P.formatDuration(Number(els.wait.value),1);
        els.dvOut.textContent=P.formatSpeed(Number(els.dv.value),2);
        els.dirOut.textContent=P.formatNumber(P.toDegrees(Number(els.dir.value)),1)+'°';
        els.burnCount.textContent=state.burns+' / 2';
        els.status.textContent=state.phase==='waiting'?'等待出发':state.phase==='flying'?'转移飞行中':'评估完成';
        els.status.className='status '+(state.phase==='flying'?'status--live':state.phase==='done'?(state.result.success?'status--live':'status--error'):'');
        const phaseError=Math.abs(normalizedAngle(state.targetAngle-state.craftAngle)-idealPhase);
        els.phaseNote.textContent=state.phase==='waiting'?'当前目标领先 '+P.formatNumber(P.toDegrees(normalizedAngle(state.targetAngle-state.craftAngle)),1)+'°；标准相位 '+P.formatNumber(P.toDegrees(idealPhase),1)+'°。':'已飞行 '+P.formatDuration(state.simTime,1)+'；第二次点火时机由你决定。';
        if(state.phase==='done') els.phaseNote.textContent='轨迹继续显示点火位置；重新尝试可比较不同相位与方向。';
      }

      function updateControls() {
        els.wait.disabled=state.phase!=='waiting';
        els.burn.disabled=state.phase==='done';
        els.burn.textContent=state.burns===0?'执行第一次点火':'执行第二次点火';
        els.dv.value=state.dv; els.dir.value=state.dir;
        render();
      }

      function advancePhysics(duration) {
        let advance=duration;
        while(advance>0){
          const rr=Math.hypot(state.x,state.y);
          const localStep=P.orbitalPeriodAtRadius(rr)/(K.numeric.integrationSteps*K.display.pageDigits);
          const h=Math.min(advance,localStep);
          const factor=-K.EARTH_MU/(rr*rr*rr);
          const ax=factor*state.x, ay=factor*state.y;
          state.x+=state.vx*h+ax*h*h/K.display.pageDigits;
          state.y+=state.vy*h+ay*h*h/K.display.pageDigits;
          const nextR=Math.hypot(state.x,state.y);
          const nextFactor=-K.EARTH_MU/(nextR*nextR*nextR);
          state.vx+=(ax+nextFactor*state.x)*h/K.display.pageDigits;
          state.vy+=(ay+nextFactor*state.y)*h/K.display.pageDigits;
          state.targetAngle=normalizedAngle(state.targetAngle+n2*h);
          state.simTime+=h; advance-=h;
          state.trace.push({x:state.x,y:state.y});
        }
        if(state.trace.length>K.numeric.integrationSteps) state.trace=state.trace.slice(-K.numeric.integrationSteps);
      }

      function applyBurn() {
        const dv=Number(els.dv.value), offset=Number(els.dir.value);
        const rr=Math.hypot(state.x,state.y);
        const prograde=Math.atan2(state.vy,state.vx);
        const angle=prograde+offset;
        state.vx+=Math.cos(angle)*dv; state.vy+=Math.sin(angle)*dv;
        state.fuel+=Math.abs(dv); state.marks.push({x:state.x,y:state.y,angle:angle}); state.burns+=1;
        if(state.burns===1){
          state.phase='flying'; state.trace=[{x:state.x,y:state.y}]; state.dv=standard.deltaV2; state.dir=0;
          if(Deck.reduced()) advancePhysics(standard.transferTime);
        } else {
          finish(rr);
        }
        updateControls();
      }

      function finish(radiusAtBurn) {
        state.phase='done';
        const targetPoint=point(r2,state.targetAngle);
        const arrivalError=Math.hypot(state.x-targetPoint.x,state.y-targetPoint.y);
        const radialSpeed=Math.abs((state.x*state.vx+state.y*state.vy)/Math.hypot(state.x,state.y));
        const speed=Math.hypot(state.vx,state.vy);
        const circular=P.circularVelocityAtRadius(Math.hypot(state.x,state.y));
        const circularResidual=Math.hypot(radialSpeed,speed-circular);
        const orbitError=Math.abs(radiusAtBurn-r2);
        const success=arrivalError<=toleranceDistance && orbitError<=toleranceDistance && circularResidual<=toleranceSpeed;
        state.result={arrivalError,orbitError,circularResidual,success};
        const fuelQuality=standard.totalDeltaV/state.fuel;
        const errorQuality=toleranceDistance/Math.max(toleranceDistance,arrivalError+orbitError);
        const waitQuality=1-state.wait/synodic;
        setBar(els.fuelBar,fuelQuality); setBar(els.errorBar,errorQuality); setBar(els.waitBar,waitQuality);
        els.fuelValue.textContent=P.formatPercent(state.fuel/standard.totalDeltaV,1)+' 标准量';
        els.errorValue.textContent=P.formatDistance(arrivalError,1);
        els.scoreWait.textContent=P.formatDuration(state.wait,1);
        els.result.textContent=success?'交会并圆化':'仍未闭合';
        els.result.className='status '+(success?'status--live':'status--error');
        if(success){els.verdict.textContent='成功：两次点火同时满足相位交会与圆化。';}
        else if(arrivalError>toleranceDistance){els.verdict.textContent='未交会：轨道可能相交，但目标在抵达时不在那里。';}
        else {els.verdict.textContent='未圆化：第二次点火过早、过晚或方向不够切向。';}
      }

      function reset() {
        state=freshState(); els.wait.value=0; els.dv.value=state.dv; els.dir.value=0;
        els.fuelValue.textContent='—';els.errorValue.textContent='—';els.scoreWait.textContent='—';
        setBar(els.fuelBar,0);setBar(els.errorBar,0);setBar(els.waitBar,0);
        els.result.textContent='尚未完成';els.result.className='status';els.verdict.textContent='第二次点火后，将同时检查交会距离与圆化残差。';
        updateControls();
      }

      els.wait.addEventListener('input',render);
      els.dv.addEventListener('input',()=>{state.dv=Number(els.dv.value);render();});
      els.dir.addEventListener('input',()=>{state.dir=Number(els.dir.value);render();});
      els.burn.addEventListener('click',applyBurn);
      els.reset.addEventListener('click',reset);

      Deck.loop(function(t,dt){
        if(state.phase!=='flying') return;
        const frameSeconds=dt>1?dt/1000:dt;
        const advance=Math.min(standard.transferTime/10*frameSeconds,standard.transferTime/K.display.pageDigits/100);
        advancePhysics(advance);
        render();
      },{still:0});

      reset();
    }, { once: true });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
