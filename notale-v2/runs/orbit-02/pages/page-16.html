<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="16" data-total="20">
<div id="stage">
  <style>
    .geo-page {
      --split-top: 1.28fr;
      --split-bottom: .72fr;
      gap: var(--space-5);
      padding-block: var(--space-5);
    }
    .geo-page .layout-top { position: relative; }
    .geo-stage {
      position: relative;
      inline-size: 100%;
      block-size: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface-inset);
      box-shadow: var(--shadow-panel);
    }
    #geo-globe { position: absolute; inset: 0; }
    #geo-globe canvas { display: block; }
    .geo-stage__label {
      position: absolute;
      inset-block-start: var(--space-5);
      inset-inline-start: var(--space-5);
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      max-inline-size: 390px;
      padding: var(--space-4);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-glass);
      pointer-events: none;
    }
    .geo-stage__label strong { font-size: var(--fs-h3); line-height: var(--lh-tight); }
    .geo-stage__label span { color: var(--text-muted); font-size: var(--fs-caption); line-height: var(--lh-tight); }
    .geo-lock {
      position: absolute;
      inset-block-start: var(--space-5);
      inset-inline-end: var(--space-5);
      z-index: 2;
      min-inline-size: 230px;
      padding: var(--space-4);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--surface-glass);
      text-align: end;
      pointer-events: none;
    }
    .geo-lock__time { display: block; color: var(--accent-strong); font: var(--weight-semibold) var(--fs-h2)/var(--lh-tight) var(--font-mono); }
    .geo-lock__label { color: var(--text-muted); font-size: var(--fs-caption); }
    .geo-caption {
      position: absolute;
      inset-inline-start: var(--space-5);
      inset-block-end: var(--space-4);
      z-index: 2;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      background: var(--surface-glass);
      font-size: var(--fs-caption);
      line-height: var(--lh-tight);
      pointer-events: none;
    }
    .geo-page .layout-bottom {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(0, .9fr);
      gap: var(--space-5);
    }
    .geo-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-4) var(--space-6);
      padding: var(--space-5);
    }
    .geo-control { display: flex; flex-direction: column; gap: var(--space-2); min-inline-size: 0; }
    .geo-control__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
    .geo-control output { color: var(--text-strong); font-family: var(--font-mono); font-size: var(--fs-label); }
    .geo-selects { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3); align-items: end; }
    .geo-toggle { display: flex; align-items: center; gap: var(--space-3); min-block-size: 46px; color: var(--text); font-size: var(--fs-label); }
    .geo-reset { align-self: end; }
    .geo-results {
      --readout-cols: 2;
      align-content: stretch;
      padding: var(--space-3);
    }
    .geo-results .readout { min-block-size: 0; padding: var(--space-3); }
    .geo-results .readout-value { font-size: var(--fs-h3); }
    .geo-verdict { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-3) var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-2); }
    .geo-verdict p { margin: 0; color: var(--text-muted); font-size: var(--fs-small); line-height: var(--lh-body); }
    @media (prefers-reduced-motion: reduce) { #geo-globe { transition: none; } }
  </style>

  <main class="split-tb geo-page">
    <section class="layout-top min0" aria-label="三维地球与卫星相对运动">
      <figure class="geo-stage no-pan" aria-labelledby="geo-figure-title">
        <div id="geo-globe" aria-hidden="true"></div>
        <figcaption class="geo-stage__label" id="geo-figure-title">
          <strong>让波束钉在地面站上</strong>
          <span>拖动高度与倾角；地球、卫星按各自真实角速度推进。</span>
        </figcaption>
        <div class="geo-lock" aria-live="polite">
          <span class="geo-lock__time" id="lock-time">—</span>
          <span class="geo-lock__label">地面站连续锁定</span>
        </div>
        <div class="geo-caption">亮线：轨道　虚线：地面轨迹　光束：星下点</div>
      </figure>
    </section>

    <section class="layout-bottom min0" aria-label="轨道条件控制台">
      <form class="control-panel geo-controls" id="geo-form">
        <label class="geo-control" for="altitude">
          <span class="geo-control__head"><span class="control-label">轨道高度</span><output id="altitude-out" for="altitude">—</output></span>
          <input id="altitude" type="range">
        </label>
        <label class="geo-control" for="inclination">
          <span class="geo-control__head"><span class="control-label">轨道倾角</span><output id="inclination-out" for="inclination">—</output></span>
          <input id="inclination" type="range">
        </label>
        <div class="geo-control">
          <span class="control-label">形状与方向</span>
          <div class="geo-selects">
            <label class="geo-toggle"><input id="circular" type="checkbox">圆轨道</label>
            <select id="direction" aria-label="运行方向"><option value="prograde">顺行</option><option value="retrograde">逆行</option></select>
          </div>
        </div>
        <button class="geo-reset button--quiet" id="reset" type="reset">重置实验</button>
      </form>

      <div class="readout-panel geo-results" aria-label="实时轨道读数">
        <div class="readout readout--accent"><span class="readout-label">轨道周期</span><strong class="readout-value" id="period-out">—</strong></div>
        <div class="readout"><span class="readout-label">每圈地面经度漂移</span><strong class="readout-value" id="shift-out">—</strong></div>
        <div class="geo-verdict">
          <p id="verdict">还不是对地静止轨道。</p>
          <span class="status status--warn" id="state-badge">条件未齐</span>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/lib/three.min.js"></script>
  <script src="assets/lib/globe.gl.min.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      'use strict';

      const page = Object.freeze({
        index: 16,
        kicker: `GEO`,
        title: `要对地静止，周期、方向和轨道平面必须<em>同时正确</em>`,
        take: `地球同步只要求周期匹配；对地静止还要求圆形、赤道面和顺行。`
      });
      Lec.mount(page);

      const K = Lec.K;
      const P = Lec.P;
      const host = document.getElementById('geo-globe');
      const altitudeInput = document.getElementById('altitude');
      const inclinationInput = document.getElementById('inclination');
      const circularInput = document.getElementById('circular');
      const directionInput = document.getElementById('direction');
      const form = document.getElementById('geo-form');
      const altitudeOut = document.getElementById('altitude-out');
      const inclinationOut = document.getElementById('inclination-out');
      const periodOut = document.getElementById('period-out');
      const shiftOut = document.getElementById('shift-out');
      const lockOut = document.getElementById('lock-time');
      const verdict = document.getElementById('verdict');
      const badge = document.getElementById('state-badge');

      const targetByPeriod = P.altitudeForPeriod(K.EARTH_SIDEREAL_DAY);
      const geo = P.geostationaryOrbit();
      const altitudeStep = K.GEO_ALTITUDE / 100;
      const degreeStep = P.toDegrees(K.DEG_TO_RAD);
      const initial = Object.freeze({ altitude: K.GEO_ALTITUDE / 2, inclination: P.toDegrees(K.HALF_PI) / 6, circular: false, direction: 'prograde' });
      const state = { altitude: initial.altitude, inclination: initial.inclination, circular: initial.circular, direction: initial.direction, elapsed: 0, lock: 0, earthAngle: 0, satelliteAngle: 0, period: 0, valid: false };

      altitudeInput.min = String(0);
      altitudeInput.max = String(K.GEO_ALTITUDE * 2);
      altitudeInput.step = String(altitudeStep);
      inclinationInput.min = String(0);
      inclinationInput.max = String(P.toDegrees(K.HALF_PI));
      inclinationInput.step = String(degreeStep);

      const colorNumber = function (name) {
        const c = Deck.rgb(name);
        return (c[0] << 16) + (c[1] << 8) + c[2];
      };

      const world = Globe()(host)
        .width(host.offsetWidth)
        .height(host.offsetHeight)
        .backgroundColor(Deck.token('--surface-inset'))
        .showAtmosphere(true)
        .atmosphereColor(Deck.token('--accent-2'))
        .atmosphereAltitude(0.14)
        .pathsData([])
        .pathPoints('coords')
        .pathPointLat('lat')
        .pathPointLng('lng')
        .pathPointAlt(0.004)
        .pathColor(function () { return Deck.token('--warm'); })
        .pathStroke(1.2)
        .pathDashLength(0.05)
        .pathDashGap(0.03)
        .pathDashAnimateTime(0);

      world.globeMaterial(new THREE.MeshPhongMaterial({ color: colorNumber('--surface-2'), emissive: colorNumber('--surface-inset'), shininess: 18, wireframe: true, transparent: true, opacity: 0.96 }));
      world.controls().enablePan = false;
      world.controls().autoRotate = false;
      world.pointOfView({ lat: P.toDegrees(K.DEG_TO_RAD) * 18, lng: -P.toDegrees(K.HALF_PI) / 2, altitude: 2.35 }, 0);
      world.pauseAnimation();

      const scene = world.scene();
      const orbitMaterial = new THREE.LineBasicMaterial({ color: colorNumber('--accent-strong'), transparent: true, opacity: 0.9 });
      const beamMaterial = new THREE.LineBasicMaterial({ color: colorNumber('--warm'), transparent: true, opacity: 0.9 });
      const trackMaterial = new THREE.MeshBasicMaterial({ color: colorNumber('--warm') });
      const stationMaterial = new THREE.MeshBasicMaterial({ color: colorNumber('--success') });
      const satelliteMaterial = new THREE.MeshBasicMaterial({ color: colorNumber('--text-strong') });
      const orbitLine = new THREE.LineLoop(new THREE.BufferGeometry(), orbitMaterial);
      const beamLine = new THREE.Line(new THREE.BufferGeometry(), beamMaterial);
      const satellite = new THREE.Mesh(new THREE.SphereGeometry(2.4, 12, 8), satelliteMaterial);
      const footprint = new THREE.Mesh(new THREE.RingGeometry(2.5, 4.5, 24), trackMaterial);
      const station = new THREE.Mesh(new THREE.SphereGeometry(2.2, 12, 8), stationMaterial);
      scene.add(orbitLine, beamLine, satellite, footprint, station);

      const toVec = function (lat, lng, alt) {
        const p = world.getCoords(lat, lng, alt);
        return new THREE.Vector3(p.x, p.y, p.z);
      };

      const orbitLatLng = function (angle, inclination, direction) {
        const signed = direction === 'prograde' ? angle : -angle;
        const inc = P.toRadians(inclination);
        const lat = Math.asin(Math.sin(inc) * Math.sin(signed));
        const lng = Math.atan2(Math.cos(inc) * Math.sin(signed), Math.cos(signed));
        return { lat: P.toDegrees(lat), lng: P.toDegrees(lng) };
      };

      function rebuildGeometry() {
        const inc = state.inclination;
        const eccentricScale = state.circular ? 1 : 0.82;
        const orbitAltitudeRatio = (K.EARTH_RADIUS + state.altitude) / K.EARTH_RADIUS - 1;
        const vertices = [];
        const track = [];
        const samples = 128;
        for (let i = 0; i < samples; i += 1) {
          const angle = K.TWO_PI * i / samples;
          const ll = orbitLatLng(angle, inc, state.direction);
          const radial = orbitAltitudeRatio * (state.circular ? 1 : 1 + (1 - eccentricScale) * Math.cos(angle));
          vertices.push(toVec(ll.lat, ll.lng, radial));
          const earthShift = P.groundTrackShiftPerOrbit(state.period) * angle / K.TWO_PI;
          track.push({ lat: ll.lat, lng: ll.lng - P.toDegrees(earthShift) });
        }
        orbitLine.geometry.dispose();
        orbitLine.geometry = new THREE.BufferGeometry().setFromPoints(vertices);
        world.pathsData([{ coords: track }]);
      }

      function syncInputs() {
        altitudeInput.value = String(state.altitude);
        inclinationInput.value = String(state.inclination);
        circularInput.checked = state.circular;
        directionInput.value = state.direction;
      }

      function updateModel() {
        state.period = P.circularOrbit(state.altitude).period;
        const altitudeCorrect = Math.abs(state.altitude - K.GEO_ALTITUDE) <= altitudeStep / 2 || Math.abs(state.altitude - targetByPeriod) <= altitudeStep / 2;
        const inclinationCorrect = Math.abs(state.inclination) <= degreeStep / 2;
        const directionCorrect = state.direction === 'prograde';
        state.valid = altitudeCorrect && inclinationCorrect && directionCorrect && state.circular;

        altitudeOut.textContent = P.formatDistance(state.altitude, 0);
        inclinationOut.textContent = P.formatNumber(state.inclination, 0) + '°';
        periodOut.textContent = P.formatDuration(state.period, 2);
        const shift = P.groundTrackShiftPerOrbit(state.period);
        shiftOut.textContent = P.formatNumber(P.toDegrees(shift), 1) + '°';
        if (state.valid) {
          verdict.textContent = '四项同时成立：波束可持续锁定同一地点。';
          badge.textContent = '对地静止';
          badge.className = 'status status--live';
        } else {
          const periodOnly = altitudeCorrect;
          verdict.textContent = periodOnly ? '周期同步，但圆度、赤道面与顺行仍须同时满足。' : '周期未同步，星下点每圈都会产生经度漂移。';
          badge.textContent = periodOnly ? '仅地球同步' : '条件未齐';
          badge.className = 'status status--warn';
        }
        rebuildGeometry();
      }

      function readInputs() {
        state.altitude = Number(altitudeInput.value);
        state.inclination = Number(inclinationInput.value);
        state.circular = circularInput.checked;
        state.direction = directionInput.value;
        state.lock = 0;
        updateModel();
      }

      form.addEventListener('input', readInputs);
      form.addEventListener('change', readInputs);
      form.addEventListener('reset', function (event) {
        event.preventDefault();
        state.altitude = initial.altitude;
        state.inclination = initial.inclination;
        state.circular = initial.circular;
        state.direction = initial.direction;
        state.lock = 0;
        state.elapsed = 0;
        state.earthAngle = 0;
        state.satelliteAngle = 0;
        syncInputs();
        updateModel();
      });

      Deck.onResize(function () {
        world.width(host.offsetWidth).height(host.offsetHeight);
      });

      syncInputs();
      updateModel();

      const timeScale = K.EARTH_SIDEREAL_DAY / 12;
      Deck.loop(function (time, dt) {
        const simDt = dt * timeScale;
        if (!Deck.reduced()) {
          state.elapsed += simDt;
          state.earthAngle += K.EARTH_ROTATION_RATE * simDt;
          state.satelliteAngle += (state.direction === 'prograde' ? 1 : -1) * K.TWO_PI / state.period * simDt;
          state.lock = state.valid ? state.lock + simDt : 0;
        }
        const ll = orbitLatLng(state.satelliteAngle, state.inclination, state.direction);
        const earthDegrees = P.toDegrees(state.earthAngle);
        const orbitAltitudeRatio = (K.EARTH_RADIUS + state.altitude) / K.EARTH_RADIUS - 1;
        const satPos = toVec(ll.lat, ll.lng, orbitAltitudeRatio);
        const groundPos = toVec(ll.lat, ll.lng, 0.012);
        const stationPos = toVec(0, earthDegrees, 0.014);
        satellite.position.copy(satPos);
        footprint.position.copy(groundPos);
        footprint.lookAt(new THREE.Vector3(0, 0, 0));
        station.position.copy(stationPos);
        beamLine.geometry.dispose();
        beamLine.geometry = new THREE.BufferGeometry().setFromPoints([satPos, groundPos]);
        lockOut.textContent = P.formatDuration(state.lock, 1);
        world.renderer().render(scene, world.camera());
      }, { still: 0 });
    }, { once: true });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
