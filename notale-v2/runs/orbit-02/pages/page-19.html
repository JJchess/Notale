<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="19" data-total="20">
<div id="stage">
<style>
  .p19 { position: relative; }
  .p19 .layout-head { display:flex; align-items:end; justify-content:space-between; gap:var(--space-6); }
  .p19 .eyebrow { margin:0; color:var(--accent-strong); font:var(--weight-bold) var(--fs-caption)/var(--lh-tight) var(--font-mono); letter-spacing:.1em; }
  .p19 .head-note { margin:0; color:var(--text-muted); font-size:var(--fs-small); line-height:var(--lh-body); }
  .p19 .ledger-board { display:grid; grid-template-rows:auto minmax(0,1fr); gap:var(--space-4); padding:var(--space-5); }
  .p19 .task-bank { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:var(--space-2); }
  .p19 .task-card { min-width:0; min-height:70px; padding:var(--space-2) var(--space-3); flex-direction:column; align-items:flex-start; gap:var(--space-1); border-color:var(--line-strong); background:var(--surface-2); touch-action:none; }
  .p19 .task-card strong { color:var(--text-strong); font-size:var(--fs-label); line-height:var(--lh-tight); white-space:nowrap; }
  .p19 .task-card span { color:var(--accent-strong); font-family:var(--font-mono); font-size:var(--fs-caption); line-height:var(--lh-tight); white-space:nowrap; }
  .p19 .task-card[data-owner="rocket"] { border-color:var(--accent); background:var(--accent-soft); }
  .p19 .task-card[data-owner="craft"] { border-color:var(--accent-2); background:var(--accent-2-soft); }
  .p19 .task-card.is-dragging { box-shadow:var(--shadow-float); translate:0 -4px; }
  .p19 .book { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--space-4); min-height:0; }
  .p19 .account { display:flex; flex-direction:column; min-width:0; min-height:0; border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface-inset); }
  .p19 .account[data-owner="rocket"] { box-shadow:inset 3px 0 0 var(--accent); }
  .p19 .account[data-owner="craft"] { box-shadow:inset 3px 0 0 var(--accent-2); }
  .p19 .account-head { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); padding:var(--space-3) var(--space-4); border-bottom:1px solid var(--line); }
  .p19 .account-head h2 { margin:0; font-size:var(--fs-h3); line-height:var(--lh-tight); }
  .p19 .capacity { color:var(--text-muted); font-size:var(--fs-caption); line-height:var(--lh-tight); }
  .p19 .capacity b { color:var(--text-strong); font-family:var(--font-mono); }
  .p19 .ledger-wrap { min-height:0; }
  .p19 .ledger-table { table-layout:fixed; }
  .p19 .ledger-table th,.p19 .ledger-table td { padding:var(--space-2) var(--space-3); }
  .p19 .ledger-table th:nth-child(1) { width:12%; }
  .p19 .ledger-table th:nth-child(2) { width:39%; }
  .p19 .ledger-table th:nth-child(3) { width:27%; }
  .p19 .ledger-table th:nth-child(4) { width:22%; }
  .p19 .ledger-table td { font-size:var(--fs-caption); }
  .p19 .ledger-table .empty { color:var(--text-faint); text-align:center; }
  .p19 .state-ok { color:var(--success); }
  .p19 .state-bad { color:var(--danger); font-weight:var(--weight-bold); }
  .p19 .state-lock { color:var(--warning); }
  .p19 .side { display:grid; grid-template-rows:minmax(0,1fr) auto; gap:var(--space-4); min-height:0; }
  .p19 .chart-panel { display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:var(--space-3); padding:var(--space-5); }
  .p19 .chart-panel .panel-head { margin:0; }
  .p19 #waterfall { width:100%; height:100%; min-height:0; }
  .p19 #waterfall text { fill:var(--text-muted); font-family:var(--font-mono); font-size:var(--fs-tick); }
  .p19 #waterfall .grid-line { stroke:var(--chart-grid); stroke-dasharray:3 5; }
  .p19 #waterfall .axis-line { stroke:var(--chart-axis); }
  .p19 #waterfall .rocket-bar { fill:var(--chart-1); }
  .p19 #waterfall .craft-bar { fill:var(--chart-2); }
  .p19 #waterfall .deficit { fill:var(--danger); }
  .p19 #waterfall .reserve { fill:var(--warm); }
  .p19 #waterfall .step-link { stroke:var(--text-faint); stroke-width:1.5; stroke-dasharray:4 4; }
  .p19 .legend { justify-content:space-between; }
  .p19 .status-panel { padding:var(--space-4); }
  .p19 .status-line { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); }
  .p19 .status-line + .status-line { margin-top:var(--space-3); padding-top:var(--space-3); border-top:1px solid var(--line); }
  .p19 .status-line span { color:var(--text-muted); font-size:var(--fs-caption); line-height:var(--lh-tight); }
  .p19 .status-line b { color:var(--text-strong); font-family:var(--font-mono); font-size:var(--fs-label-lg); white-space:nowrap; }
  .p19 .layout-foot { display:flex; align-items:center; justify-content:space-between; gap:var(--space-6); }
  .p19 .hint { margin:0; color:var(--text-muted); font-size:var(--fs-small); line-height:var(--lh-body); }
  .p19 .hint strong { color:var(--warm); }
  @media (prefers-reduced-motion:reduce) { .p19 .task-card { transition:none; } }
</style>

<main class="ledger p19" aria-label="Δv 任务总账">
  <header class="layout-head">
    <div>
      <p class="eyebrow">MISSION COST / PAYER / MARGIN</p>
      <p class="head-note">把任务卡放进付款方账本；顺序固定，能力按任务逐项扣减。</p>
    </div>
    <span class="status" id="mission-status">等待编制</span>
  </header>

  <section class="layout-main panel panel--flat ledger-board min0" aria-label="任务条目与双账本">
    <div class="task-bank" id="task-bank" aria-label="可分配任务卡"></div>
    <div class="book min0">
      <section class="account" data-owner="rocket" aria-label="运载火箭账本">
        <div class="account-head"><h2>运载火箭支付</h2><span class="capacity">能力 <b id="rocket-cap">—</b></span></div>
        <div class="ledger-wrap"><table class="ledger-table"><thead><tr><th>序</th><th>任务</th><th class="numeric">支出</th><th>状态</th></tr></thead><tbody id="rocket-body"></tbody></table></div>
      </section>
      <section class="account" data-owner="craft" aria-label="航天器账本">
        <div class="account-head"><h2>航天器支付</h2><span class="capacity">能力 <b id="craft-cap">—</b></span></div>
        <div class="ledger-wrap"><table class="ledger-table"><thead><tr><th>序</th><th>任务</th><th class="numeric">支出</th><th>状态</th></tr></thead><tbody id="craft-body"></tbody></table></div>
      </section>
    </div>
  </section>

  <aside class="layout-right side min0">
    <section class="panel panel--flat chart-panel min0">
      <div class="panel-head"><div><h2 class="heading-3">实时瀑布图</h2><span class="caption">每一格都是一次速度改变</span></div></div>
      <svg id="waterfall" role="img" aria-label="运载火箭与航天器剩余Δv瀑布图"></svg>
      <div class="legend"><span class="legend-item"><i class="legend-swatch" style="--swatch:var(--chart-1)"></i>运载火箭</span><span class="legend-item"><i class="legend-swatch" style="--swatch:var(--chart-2)"></i>航天器</span><span class="legend-item"><i class="legend-swatch" style="--swatch:var(--warm)"></i>保护余量</span></div>
    </section>
    <section class="panel panel--flat status-panel" aria-live="polite">
      <div class="status-line"><span>任务需求</span><b id="demand">—</b></div>
      <div class="status-line"><span>航天器需推进剂</span><b id="propellant">—</b></div>
      <div class="status-line"><span>风险卡保护余量</span><b id="reserve">—</b></div>
    </section>
  </aside>

  <footer class="layout-foot">
    <p class="hint"><strong>拖拽</strong>卡片到左右账本；键盘用 ← / → 指派付款方，Delete 撤回。</p>
    <p class="hint">出现赤字后，后续条目仍可见，但标记为“锁定”。</p>
  </footer>
</main>

<script src="assets/lib/d3.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  'use strict';

  const page = Object.freeze({
    index: 19,
    kicker: `DELTA-V`,
    title: `航天器不问“还能飞多远”，它问“还剩多少<em>Δv</em>”`,
    take: `把每次速度改变列成预算，才能判断推进剂、载荷和任务余量是否闭合。`
  });
  Lec.mount(page);
  const mountedTitle = document.querySelector('.lec-header__title');
  if (mountedTitle) mountedTitle.innerHTML = page.title;

  const P = Lec.P;
  const K = Lec.K;
  const root = document.querySelector('.p19');
  const transfer = P.hohmannTransferByAltitude(K.ISS_ALTITUDE, K.GEO_ALTITUDE);
  const reboost = P.hohmannTransferByAltitude(K.ISS_ALTITUDE, K.ISS_ALTITUDE + K.KARMAN_ALTITUDE);
  const returnBurn = P.hohmannTransferByAltitude(K.ISS_ALTITUDE, K.KARMAN_ALTITUDE);
  const geoSpeed = P.circularVelocity(K.GEO_ALTITUDE);
  const planePure = P.planeChangeDeltaVDegrees(geoSpeed, P.toDegrees(K.earth.axialTilt));
  const combined = P.combinedBurnDeltaV(transfer.transferSpeedTo, transfer.circularSpeedTo, K.earth.axialTilt);
  const launchNeed = P.deltaVBudget([
    K.rocket.leoOrbitalSpeed,
    K.rocket.typicalGravityLoss,
    K.rocket.typicalDragLoss,
    K.rocket.typicalSteeringLoss
  ]);

  const tasks = [
    { id:'launch', name:'发射入轨', value:launchNeed },
    { id:'circular', name:'远地点圆化', value:Math.abs(transfer.deltaV2) },
    { id:'transfer', name:'转移注入', value:Math.abs(transfer.deltaV1) },
    { id:'plane', name:'平面变化', value:P.deltaVBudget([combined, -Math.abs(transfer.deltaV2)]) },
    { id:'reboost', name:'再升轨', value:reboost.totalDeltaV },
    { id:'return', name:'返程·风险卡', value:Math.abs(returnBurn.deltaV1), risk:true }
  ];
  const state = { owners:{} };

  const booster = P.multiStageDeltaV([{ wetMass:K.vehicles.saturnV.liftoffMass, dryMass:K.vehicles.saturnV.payloadToLeo, isp:K.rocket.keroloxVacuumIsp }], K.vehicles.falcon9.payloadToLeo).totalDeltaV;
  const craft = P.rocketDeltaV(K.rocket.methaneVacuumIsp, K.vehicles.saturnV.payloadToLeo, K.vehicles.falcon9.payloadToLeo);
  const capacities = { rocket:booster, craft:craft };
  const bank = document.getElementById('task-bank');

  tasks.forEach(function(task, index){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'task-card no-pan';
    b.dataset.id = task.id;
    b.dataset.owner = '';
    b.setAttribute('aria-label', task.name + '，未分配，使用左右方向键指派付款方');
    b.innerHTML = '<strong>' + task.name + '</strong><span>' + P.formatSpeed(task.value, 2) + '</span>';
    let dragged = false;
    b.addEventListener('pointerdown', function(e){
      dragged = false;
      b.classList.add('is-dragging');
      b.setPointerCapture(e.pointerId);
    });
    b.addEventListener('pointermove', function(e){
      if (!b.hasPointerCapture(e.pointerId)) return;
      const pt = Deck.pt(root, e);
      dragged = true;
      const owner = pt.x < Deck.W * 0.38 ? 'rocket' : (pt.x < Deck.W * 0.73 ? 'craft' : '');
      b.dataset.preview = owner;
    });
    function finish(e){
      if (!b.hasPointerCapture(e.pointerId)) return;
      const pt = Deck.pt(root, e);
      b.releasePointerCapture(e.pointerId);
      b.classList.remove('is-dragging');
      if (dragged) assign(task.id, pt.x < Deck.W * 0.38 ? 'rocket' : (pt.x < Deck.W * 0.73 ? 'craft' : ''));
    }
    b.addEventListener('pointerup', finish);
    b.addEventListener('pointercancel', function(){ b.classList.remove('is-dragging'); });
    b.addEventListener('click', function(){ if (!dragged) assign(task.id, state.owners[task.id] ? '' : (index === 0 ? 'rocket' : 'craft')); });
    b.addEventListener('keydown', function(e){
      if (e.key === 'ArrowLeft') { e.preventDefault(); assign(task.id, 'rocket'); }
      if (e.key === 'ArrowRight') { e.preventDefault(); assign(task.id, 'craft'); }
      if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); assign(task.id, ''); }
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); assign(task.id, state.owners[task.id] ? '' : (index === 0 ? 'rocket' : 'craft')); }
    });
    bank.appendChild(b);
  });

  function assign(id, owner){
    state.owners[id] = owner;
    render();
  }

  function evaluate(owner){
    const protectedReserve = owner === 'craft' && state.owners.return ? reboost.totalDeltaV : 0;
    let remaining = capacities[owner] - protectedReserve;
    let failed = false;
    return tasks.filter(function(t){ return state.owners[t.id] === owner; }).map(function(t){
      const before = remaining;
      if (failed) return { task:t, before:before, after:before, locked:true };
      remaining -= t.value;
      const deficit = remaining < 0;
      if (deficit) failed = true;
      return { task:t, before:before, after:remaining, deficit:deficit, locked:false };
    });
  }

  function renderTable(owner, target){
    const rows = evaluate(owner);
    target.innerHTML = '';
    if (!rows.length) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td colspan="4" class="empty">把任务卡拖到这里</td>';
      target.appendChild(tr);
      return;
    }
    rows.forEach(function(r){
      const tr = document.createElement('tr');
      const status = r.locked ? '<span class="state-lock">锁定</span>' : r.deficit ? '<span class="state-bad">赤字</span>' : '<span class="state-ok">可执行</span>';
      tr.innerHTML = '<td class="numeric-id">' + String(tasks.indexOf(r.task) + 1).padStart(2,'0') + '</td><td>' + r.task.name + '</td><td class="numeric">−' + P.formatSpeed(r.task.value,2) + '</td><td>' + status + '</td>';
      target.appendChild(tr);
    });
  }

  function drawChart(){
    const svg = d3.select('#waterfall');
    svg.selectAll('*').remove();
    const node = document.getElementById('waterfall');
    const width = node.clientWidth || 360;
    const height = node.clientHeight || 320;
    const margin = {top:24,right:12,bottom:34,left:54};
    const iw = width-margin.left-margin.right;
    const ih = height-margin.top-margin.bottom;
    const all = evaluate('rocket').concat(evaluate('craft'));
    const min = Math.min(0, d3.min(all, function(d){return d.after;}) || 0);
    const max = Math.max(capacities.rocket, capacities.craft);
    const y = d3.scaleLinear().domain([min,max]).nice().range([ih,0]);
    const x = d3.scaleBand().domain(tasks.map(function(t){return t.id;})).range([0,iw]).padding(0.2);
    const g = svg.attr('viewBox','0 0 '+width+' '+height).append('g').attr('transform','translate('+margin.left+','+margin.top+')');
    g.append('g').call(d3.axisLeft(y).ticks(5).tickFormat(function(v){return P.formatNumber(v/K.units.km,1);})).call(function(a){a.select('.domain').attr('class','axis-line');a.selectAll('.tick line').attr('class','grid-line').attr('x2',iw);});
    g.append('text').attr('x',-44).attr('y',-9).text('km/s');
    const series = [{owner:'rocket', cls:'rocket-bar'},{owner:'craft', cls:'craft-bar'}];
    series.forEach(function(s, si){
      const rows = evaluate(s.owner);
      g.selectAll('.'+s.owner).data(rows).join('rect').attr('class',function(d){return d.deficit?'deficit':s.cls;}).attr('x',function(d){return x(d.task.id)+si*x.bandwidth()/2;}).attr('width',x.bandwidth()/2-2).attr('y',function(d){return y(Math.max(d.before,d.after));}).attr('height',function(d){return Math.max(3,Math.abs(y(d.after)-y(d.before)));});
      g.selectAll('.link-'+s.owner).data(rows.filter(function(d){return !d.locked;})).join('line').attr('class','step-link').attr('x1',function(d){return x(d.task.id)+si*x.bandwidth()/2;}).attr('x2',function(d){return x(d.task.id)+(si+1)*x.bandwidth()/2-2;}).attr('y1',function(d){return y(d.after);}).attr('y2',function(d){return y(d.after);});
    });
    g.append('g').attr('transform','translate(0,'+ih+')').call(d3.axisBottom(x).tickFormat(function(id){return String(tasks.findIndex(function(t){return t.id===id;})+1).padStart(2,'0');})).call(function(a){a.select('.domain').attr('class','axis-line');a.selectAll('.tick line').remove();});
    const reserveValue = state.owners.return ? reboost.totalDeltaV : 0;
    if (reserveValue) g.append('rect').attr('class','reserve').attr('x',iw-12).attr('width',8).attr('y',y(reserveValue)).attr('height',y(0)-y(reserveValue));
  }

  function render(){
    const rocketRows = evaluate('rocket');
    const craftRows = evaluate('craft');
    document.querySelectorAll('.task-card').forEach(function(b){
      const owner = state.owners[b.dataset.id] || '';
      b.dataset.owner = owner;
      b.setAttribute('aria-label', tasks.find(function(t){return t.id===b.dataset.id;}).name + '，' + (owner === 'rocket' ? '运载火箭支付' : owner === 'craft' ? '航天器支付' : '未分配'));
    });
    renderTable('rocket', document.getElementById('rocket-body'));
    renderTable('craft', document.getElementById('craft-body'));
    const assigned = tasks.filter(function(t){return state.owners[t.id];});
    const demand = P.deltaVBudget(assigned.map(function(t){return t.value;}));
    const craftDemand = P.deltaVBudget(tasks.filter(function(t){return state.owners[t.id] === 'craft';}).map(function(t){return t.value;}));
    const protectedReserve = state.owners.return ? reboost.totalDeltaV : 0;
    const prop = P.propellantMassForDeltaV(K.vehicles.falcon9.payloadToLeo, craftDemand + protectedReserve, K.rocket.methaneVacuumIsp);
    document.getElementById('rocket-cap').textContent = P.formatSpeed(booster,2);
    document.getElementById('craft-cap').textContent = P.formatSpeed(craft,2);
    document.getElementById('demand').textContent = P.formatSpeed(demand,2);
    document.getElementById('propellant').textContent = P.formatMass(prop,1);
    document.getElementById('reserve').textContent = P.formatSpeed(protectedReserve,2);
    const failed = rocketRows.some(function(r){return r.deficit;}) || craftRows.some(function(r){return r.deficit;});
    const complete = assigned.length === tasks.length;
    const status = document.getElementById('mission-status');
    status.className = 'status ' + (failed ? 'status--error' : complete ? 'status--live' : 'status--warn');
    status.textContent = failed ? '预算未闭合' : complete ? '预算闭合，余量已保护' : '尚有任务未入账';
    drawChart();
  }

  Deck.onResize(drawChart);
  render();
}, { once:true });
</script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
