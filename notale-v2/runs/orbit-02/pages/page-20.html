<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="20" data-total="20">
<div id="stage">
  <style>
    .mission-page {
      --cards-width: 430px;
      gap: var(--space-6);
      padding-block: var(--space-6);
    }
    .mission-page .layout-stage { display:grid; grid-template-rows:auto minmax(0,1fr); gap:var(--space-5); }
    .mission-page .layout-cards { gap:var(--space-4); }
    .mission-brief { display:grid; grid-template-columns:auto repeat(4,minmax(0,1fr)); gap:var(--space-3); align-items:stretch; }
    .brief-id { display:flex; flex-direction:column; justify-content:space-between; min-inline-size:150px; padding:var(--space-4); border:1px solid var(--accent); border-radius:var(--radius-md); background:var(--accent-soft); }
    .brief-id strong { color:var(--accent-strong); font-family:var(--font-mono); font-size:var(--fs-h3); line-height:var(--lh-tight); }
    .brief-cell { display:flex; flex-direction:column; justify-content:space-between; gap:var(--space-2); min-width:0; padding:var(--space-4); border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface-1); }
    .brief-cell span { color:var(--text-muted); font-size:var(--fs-caption); line-height:var(--lh-tight); }
    .brief-cell b { overflow:hidden; color:var(--text-strong); font-family:var(--font-mono); font-size:var(--fs-small); line-height:var(--lh-tight); text-overflow:ellipsis; white-space:nowrap; }
    .mission-field { position:relative; display:grid; grid-template-rows:auto 1fr auto; gap:var(--space-5); overflow:hidden; padding:var(--space-6); }
    .field-head { display:flex; align-items:center; justify-content:space-between; gap:var(--space-4); }
    .phase-track { position:relative; display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); align-items:center; min-height:190px; }
    .phase-track::before { content:""; position:absolute; inset-inline:6%; top:50%; height:2px; background:var(--line-strong); }
    .phase { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:var(--space-3); color:var(--text-muted); text-align:center; font-size:var(--fs-label); line-height:var(--lh-tight); }
    .phase-dot { display:grid; place-items:center; width:54px; height:54px; border:2px solid var(--line-strong); border-radius:50%; background:var(--surface-inset); color:var(--text-faint); font-family:var(--font-mono); }
    .phase.is-done .phase-dot { border-color:var(--success); color:var(--success); background:var(--surface-2); }
    .phase.is-current .phase-dot { border-color:var(--accent-strong); color:var(--text-strong); box-shadow:0 0 0 8px var(--accent-soft); }
    .phase.is-failed .phase-dot { border-color:var(--danger); color:var(--danger); }
    .telemetry { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:var(--space-3); }
    .telemetry > div { min-width:0; padding:var(--space-3) var(--space-4); border-left:2px solid var(--line-strong); background:var(--surface-inset); }
    .telemetry span { display:block; color:var(--text-muted); font-size:var(--fs-caption); line-height:var(--lh-tight); }
    .telemetry strong { display:block; margin-top:var(--space-2); color:var(--text-strong); font-family:var(--font-mono); font-size:var(--fs-caption); line-height:var(--lh-tight); overflow-wrap:anywhere; }
    .result-box { min-height:76px; padding:var(--space-4) var(--space-5); border:1px solid var(--line-strong); border-radius:var(--radius-md); background:var(--surface-glass); }
    .result-box strong { display:block; color:var(--text-strong); font-size:var(--fs-body-lg); line-height:var(--lh-tight); }
    .result-box p { margin:var(--space-1) 0 0; color:var(--text-muted); font-size:var(--fs-small); line-height:var(--lh-body); }
    .result-box.is-win { border-color:var(--success); }
    .result-box.is-loss { border-color:var(--danger); }
    .planner { padding:var(--space-5); }
    .planner-head { display:flex; align-items:flex-start; justify-content:space-between; gap:var(--space-4); margin-bottom:var(--space-4); }
    .planner-head p { margin:var(--space-1) 0 0; color:var(--text-muted); font-size:var(--fs-caption); line-height:var(--lh-tight); }
    .plan-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-3); }
    .plan-grid label { display:flex; flex-direction:column; gap:var(--space-2); color:var(--text-muted); font-size:var(--fs-caption); line-height:var(--lh-tight); }
    .plan-grid label.wide { grid-column:1/-1; }
    .plan-grid select { min-block-size:42px; padding:var(--space-2) var(--space-3); }
    .execute { width:100%; margin-top:var(--space-4); }
    .score-card { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-3); padding:var(--space-4); }
    .score-card h3 { grid-column:1/-1; margin:0; color:var(--accent-strong); font-size:var(--fs-h3); line-height:var(--lh-tight); }
    .score-card div { min-width:0; }
    .score-card span { display:block; color:var(--text-muted); font-size:var(--fs-caption); line-height:var(--lh-tight); }
    .score-card b { display:block; overflow:hidden; color:var(--text-strong); font-family:var(--font-mono); font-size:var(--fs-small); line-height:var(--lh-tight); text-overflow:ellipsis; white-space:nowrap; }
    .score-card[hidden] { display:none; }
    @media (prefers-reduced-motion:reduce) { .phase-dot { transition:none; } }
    @media print {
      body > :not(#stage), .mission-brief, .mission-field, .planner { display:none !important; }
      #stage, .mission-page, .layout-cards { overflow:visible !important; }
      .mission-page { display:block; padding:var(--space-8); background:var(--bg); }
      .score-card[hidden] { display:none !important; }
      .score-card { display:grid; box-shadow:none; }
    }
  </style>

  <main class="stage-cards mission-page" aria-label="任务控制中心小游戏">
    <section class="layout-stage min0" aria-label="任务执行舞台">
      <article class="mission-brief" aria-label="随机任务需求">
        <div class="brief-id"><span class="caption">随机任务</span><strong id="missionId">MC-20</strong></div>
        <div class="brief-cell"><span>载荷</span><b id="reqPayload">—</b></div>
        <div class="brief-cell"><span>目标轨道 / 倾角</span><b id="reqOrbit">—</b></div>
        <div class="brief-cell"><span>覆盖目标</span><b id="reqCoverage">—</b></div>
        <div class="brief-cell"><span>最低服役</span><b id="reqLife">—</b></div>
      </article>

      <article class="panel mission-field">
        <div class="field-head">
          <h2 class="heading-3">执行链</h2>
          <span id="runStatus" class="status">等待方案</span>
        </div>
        <div class="phase-track" id="phaseTrack" aria-label="任务阶段">
          <div class="phase"><span class="phase-dot">01</span><span>离架</span></div>
          <div class="phase"><span class="phase-dot">02</span><span>上升</span></div>
          <div class="phase"><span class="phase-dot">03</span><span>入轨面</span></div>
          <div class="phase"><span class="phase-dot">04</span><span>转移</span></div>
          <div class="phase"><span class="phase-dot">05</span><span>覆盖</span></div>
          <div class="phase"><span class="phase-dot">06</span><span>服役</span></div>
        </div>
        <div class="telemetry" aria-label="实时任务读数">
          <div><span>推重比</span><strong id="mTwr">—</strong></div>
          <div><span>可用 / 需求 Δv</span><strong id="mDv">—</strong></div>
          <div><span>轨道周期</span><strong id="mPeriod">—</strong></div>
          <div><span>预计寿命</span><strong id="mLife">—</strong></div>
        </div>
        <div id="resultBox" class="result-box" aria-live="polite">
          <strong id="resultTitle">先闭合方案，再执行任务</strong>
          <p id="resultText">系统只报告最先破坏任务的约束；修改后可重新执行。</p>
        </div>
      </article>
    </section>

    <aside class="layout-cards min0" aria-label="任务方案卡片">
      <article class="card planner">
        <div class="planner-head"><div><h2 class="heading-3">飞行方案</h2><p>五张决策卡共同支付任务代价</p></div><span class="badge">LIVE MODEL</span></div>
        <div class="plan-grid">
          <label>发射场<select id="site"><option value="eq">赤道发射场</option><option value="mid">中纬度发射场</option><option value="high">高纬度发射场</option></select></label>
          <label>级数 · 推进剂<select id="stack"><option value="two">两级 · 均衡装填</option><option value="three">三级 · 上面级优先</option><option value="over">三级 · 过量装填</option></select></label>
          <label>上升策略<select id="ascent"><option value="east">向东重力转弯</option><option value="diag">东北向上升</option><option value="polar">向北极轨上升</option></select></label>
          <label>停车轨道 · 转移<select id="transfer"><option value="safe">安全低轨 · 霍曼</option><option value="direct">直接圆化</option><option value="low">极低停车 · 霍曼</option></select></label>
          <label class="wide">长期能力<select id="reserve"><option value="none">不预留再升轨</option><option value="reboost">预留一次再升轨</option></select></label>
        </div>
        <button id="execute" class="button--primary execute" type="button">执行任务</button>
      </article>

      <article id="scoreCard" class="card card--accent score-card" hidden aria-label="可打印任务卡">
        <h3>MISSION ACCEPTED</h3>
        <div><span>载荷</span><b id="cardPayload">—</b></div>
        <div><span>质量比</span><b id="cardRatio">—</b></div>
        <div><span>总 Δv</span><b id="cardDv">—</b></div>
        <div><span>轨道参数</span><b id="cardOrbit">—</b></div>
        <div><span>预计寿命</span><b id="cardLife">—</b></div>
        <div><span>任务编号</span><b id="cardId">—</b></div>
      </article>
    </aside>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      'use strict';

      const page = Object.freeze({
        index: 20,
        kicker: `MISSION-CONTROL`,
        title: `把一件东西送上去，并让它真的<em>待在那儿</em>`,
        take: `成功任务必须让发射场、火箭、轨道、载荷和寿命同时满足约束。`
      });

      Lec.mount(page);

      const P = Lec.P;
      const K = Lec.K;
      const $ = function (id) { return document.getElementById(id); };
      const controls = ['site', 'stack', 'ascent', 'transfer', 'reserve'].map($);
      const phases = Array.prototype.slice.call(document.querySelectorAll('.phase'));
      const state = { mission: null, running: false, elapsed: 0, phase: -1, result: null };

      function makeMission() {
        const type = Math.floor(Math.random() * 3);
        const geo = type === 2;
        const polar = type === 1;
        const payloadFactor = type === 0 ? 0.5 : (polar ? 0.4 : 0.25);
        return {
          id: 'MC-' + P.formatNumber(Math.floor(Math.random() * K.units.km), 0),
          payload: K.vehicles.falcon9.payloadToLeo * payloadFactor,
          altitude: geo ? K.GEO_ALTITUDE : K.ISS_ALTITUDE,
          inclination: geo ? 0 : (polar ? K.HALF_PI : K.PI / 3),
          coverage: geo ? '固定经度持续覆盖' : (polar ? '全球高纬覆盖' : '中纬区域巡访'),
          service: K.time.julianYear * (geo ? 3 : (polar ? 1 : 2)),
          geo: geo
        };
      }

      function siteLatitude(value) {
        if (value === 'mid') return K.PI / 6;
        if (value === 'high') return K.PI / 3;
        return 0;
      }

      function ascentAzimuth(value) {
        if (value === 'diag') return K.PI / 4;
        if (value === 'polar') return 0;
        return K.HALF_PI;
      }

      function makeStages(kind) {
        const base = K.vehicles.falcon9.liftoffMass;
        const over = kind === 'over';
        const three = kind !== 'two';
        const fill = over ? 1.55 : 1;
        if (!three) {
          return [
            { wetMass: base * 0.75 * fill, dryMass: base * 0.05, isp: K.rocket.keroloxSeaLevelIsp, thrust: K.vehicles.falcon9.liftoffThrust },
            { wetMass: base * 0.22 * fill, dryMass: base * 0.04, isp: K.vehicles.falcon9.secondStageVacuumIsp }
          ];
        }
        return [
          { wetMass: base * 0.68 * fill, dryMass: base * 0.045, isp: K.rocket.keroloxSeaLevelIsp, thrust: K.vehicles.falcon9.liftoffThrust },
          { wetMass: base * 0.23 * fill, dryMass: base * 0.035, isp: K.vehicles.falcon9.secondStageVacuumIsp },
          { wetMass: base * 0.08 * fill, dryMass: base * 0.012, isp: K.rocket.hydroloxVacuumIsp }
        ];
      }

      function calculate() {
        const mission = state.mission;
        const latitude = siteLatitude($('site').value);
        const azimuth = ascentAzimuth($('ascent').value);
        const stages = makeStages($('stack').value);
        const initialMass = mission.payload + P.sum(stages.map(function (s) { return s.wetMass; }));
        const dryMass = mission.payload + P.sum(stages.map(function (s) { return s.dryMass; }));
        const twr = P.thrustToWeight(stages[0].thrust, initialMass, P.gravityAtAltitude(0));
        const achievedInclination = P.launchInclination(latitude, azimuth);
        const assist = P.rotationAssist(latitude, azimuth);
        const orbit = P.circularOrbit(mission.altitude);
        const parking = $('transfer').value === 'direct' ? mission.altitude : ($('transfer').value === 'low' ? K.KARMAN_ALTITUDE / 2 : K.ISS_ALTITUDE);
        const transfer = P.hohmannTransferByAltitude(parking, mission.altitude);
        const transferDv = $('transfer').value === 'direct' ? 0 : transfer.totalDeltaV;
        const planeDv = P.planeChangeDeltaVDegrees(orbit.speed, Math.abs(P.toDegrees(achievedInclination - mission.inclination)));
        const reserveDv = $('reserve').value === 'reboost' ? P.hohmannTransferByAltitude(K.KARMAN_ALTITUDE, mission.altitude).totalDeltaV : 0;
        const requiredDv = P.deltaVBudget([K.rocket.launchToLeoDeltaV - assist, transferDv, planeDv, reserveDv]);
        const rocket = P.multiStageDeltaV(stages, mission.payload);
        const payloadCapacity = P.payloadForDeltaV(stages, requiredDv);
        const area = mission.payload / K.vehicles.falcon9.payloadToLeo * K.pageCount;
        const coefficient = P.ballisticCoefficient(mission.payload, K.atmosphere.heatCapacityRatio, area);
        const decay = P.orbitDecayTime(mission.altitude, K.KARMAN_ALTITUDE, mission.payload, K.atmosphere.heatCapacityRatio, area);
        const lifetime = $('reserve').value === 'reboost' ? decay + decay : decay;
        const minimumInclination = P.minimumLaunchInclination(latitude);
        const syncComplete = !mission.geo || (latitude === 0 && azimuth === K.HALF_PI && mission.inclination === 0);
        const failures = [
          { bad: twr <= 1, label: '推重比不足', note: '满载推力无法让火箭离架。' },
          { bad: rocket.totalDeltaV < requiredDv || payloadCapacity < mission.payload, label: 'Δv 赤字', note: '火箭能力无法同时支付上升、转移与余量。' },
          { bad: mission.inclination < minimumInclination, label: '倾角不可达', note: '该纬度无法直接进入任务要求的低倾角轨道。' },
          { bad: parking < K.KARMAN_ALTITUDE, label: '近地点过低', note: '停车轨道仍落在任务允许的空间边界以下。' },
          { bad: !syncComplete, label: '同步条件不全', note: '周期目标之外，赤道面与顺行条件没有同时满足。' },
          { bad: lifetime < mission.service, label: '寿命不足', note: '弹道系数与轨道高度无法支持最低服役时长。' }
        ];
        let first = -1;
        failures.some(function (f, i) { if (f.bad) { first = i; return true; } return false; });
        return { stages, initialMass, dryMass, twr, orbit, parking, requiredDv, rocket, payloadCapacity, coefficient, lifetime, first, failure: first < 0 ? null : failures[first], transferTime: transfer.transferTime };
      }

      function renderMission() {
        const m = state.mission;
        $('missionId').textContent = m.id;
        $('reqPayload').textContent = P.formatMass(m.payload, 1);
        $('reqOrbit').textContent = (m.geo ? '同步圆轨道' : '低圆轨道') + ' · ' + P.formatNumber(P.toDegrees(m.inclination), 0) + '°';
        $('reqCoverage').textContent = m.coverage;
        $('reqLife').textContent = P.formatDuration(m.service, 1);
      }

      function updateReadouts(model) {
        $('mTwr').textContent = P.formatNumber(model.twr, 2);
        $('mDv').textContent = P.formatSpeed(model.rocket.totalDeltaV, 2) + ' / ' + P.formatSpeed(model.requiredDv, 2);
        $('mPeriod').textContent = P.formatDuration(P.orbitalPeriodAtRadius(model.orbit.radius), 1);
        $('mLife').textContent = P.formatDuration(model.lifetime, 1);
      }

      function resetRun() {
        state.running = false;
        state.elapsed = 0;
        state.phase = -1;
        state.result = null;
        phases.forEach(function (p) { p.classList.remove('is-done', 'is-current', 'is-failed'); });
        $('runStatus').className = 'status';
        $('runStatus').textContent = '等待方案';
        $('resultBox').className = 'result-box';
        $('resultTitle').textContent = '先闭合方案，再执行任务';
        $('resultText').textContent = '系统只报告最先破坏任务的约束；修改后可重新执行。';
        $('scoreCard').hidden = true;
        updateReadouts(calculate());
      }

      function finish(model) {
        state.running = false;
        if (model.failure) {
          phases[model.first].classList.remove('is-current');
          phases[model.first].classList.add('is-failed');
          $('runStatus').className = 'status status--error';
          $('runStatus').textContent = '任务中止';
          $('resultBox').className = 'result-box is-loss';
          $('resultTitle').textContent = model.failure.label;
          $('resultText').textContent = model.failure.note + ' 修改方案后重新执行。';
          return;
        }
        phases.forEach(function (p) { p.classList.remove('is-current'); p.classList.add('is-done'); });
        $('runStatus').className = 'status status--live';
        $('runStatus').textContent = '任务成功';
        $('resultBox').className = 'result-box is-win';
        $('resultTitle').textContent = '全部约束闭合';
        $('resultText').textContent = '可打印任务卡已生成；这不是单项最优，而是一套能执行的系统方案。';
        $('scoreCard').hidden = false;
        $('cardPayload').textContent = P.formatMass(state.mission.payload, 1);
        $('cardRatio').textContent = P.formatNumber(model.initialMass / model.dryMass, 2);
        $('cardDv').textContent = P.formatSpeed(model.rocket.totalDeltaV, 2);
        $('cardOrbit').textContent = P.formatDistance(model.orbit.altitude, 0) + ' · ' + P.formatDuration(model.orbit.period, 1);
        $('cardLife').textContent = P.formatDuration(model.lifetime, 1);
        $('cardId').textContent = state.mission.id;
      }

      function startRun() {
        const model = calculate();
        state.running = true;
        state.elapsed = 0;
        state.phase = 0;
        state.result = model;
        phases.forEach(function (p) { p.classList.remove('is-done', 'is-current', 'is-failed'); });
        phases[0].classList.add('is-current');
        $('scoreCard').hidden = true;
        $('runStatus').className = 'status status--warn';
        $('runStatus').textContent = '实时传播';
        $('resultBox').className = 'result-box';
        $('resultTitle').textContent = '任务执行中';
        $('resultText').textContent = '物理状态正按当前方案逐段推进。';
        updateReadouts(model);
        if (Deck.reduced()) finish(model);
      }

      controls.forEach(function (control) { control.addEventListener('change', resetRun); });
      $('execute').addEventListener('click', startRun);
      state.mission = makeMission();
      renderMission();
      resetRun();

      Deck.loop(function (time, dt) {
        if (!state.running || !state.result) return;
        state.elapsed += dt;
        const live = calculate();
        state.result = live;
        updateReadouts(live);
        const physicalScale = Math.max(K.time.minute, Math.log(1 + live.orbit.period + live.transferTime) * K.time.minute);
        const stepDuration = physicalScale / K.time.hour;
        const nextPhase = Math.min(phases.length - 1, Math.floor(state.elapsed / stepDuration));
        if (nextPhase !== state.phase) {
          phases[state.phase].classList.remove('is-current');
          phases[state.phase].classList.add('is-done');
          state.phase = nextPhase;
          phases[state.phase].classList.add('is-current');
        }
        if ((live.first >= 0 && state.phase >= live.first) || state.elapsed >= stepDuration * phases.length) finish(live);
      }, { still: 0 });
    }, { once: true });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
