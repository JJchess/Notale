<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: var(--bg);
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
    }

    .cover-header {
      position: absolute;
      top: 140px;
      left: 112px;
      z-index: 10;
      max-width: 620px;
      pointer-events: none;
    }

    .cover-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 58px;
      line-height: 1.15;
      font-weight: var(--weight-strong);
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .cover-title span {
      display: block;
      margin-top: 8px;
      color: var(--model);
    }

    .cover-sub {
      margin: 28px 0 0 0;
      font-family: var(--font-sans);
      font-size: var(--fs-h2);
      line-height: var(--lh-copy);
      color: var(--muted);
      font-weight: var(--weight-body);
    }

    .scene-svg {
      position: absolute;
      inset: 0;
      width: 1600px;
      height: 900px;
      pointer-events: none;
    }

    /* 光子与能量流动的微动 */
    .photon-beam {
      transform-origin: 680px 180px;
      animation: photon-pulse 4s ease-in-out infinite alternate;
    }

    .carrier-flow {
      stroke-dasharray: 8 6;
      animation: flow-dash 12s linear infinite;
    }

    @keyframes photon-pulse {
      0% { opacity: 0.85; }
      100% { opacity: 1; }
    }

    @keyframes flow-dash {
      to { stroke-dashoffset: -140; }
    }

    @media (prefers-reduced-motion: reduce) {
      .photon-beam, .carrier-flow {
        animation: none !important;
      }
    }
  </style>
</head>
<body data-page="01" data-total="22">
  <div id="stage">
    <header class="cover-header">
      <h1 class="cover-title">
        光合作用
        <span>光反应与暗反应</span>
      </h1>
      <p class="cover-sub">从光子捕获到糖分子合成的两阶段能量转化</p>
    </header>

    <svg class="scene-svg" viewBox="0 0 1600 900" role="img" aria-label="叶绿体双反应体系构图">
      <defs>
        <!-- 叶绿体外轮廓渐变/阴影 -->
        <radialGradient id="chloroplast-grad" cx="58%" cy="50%" r="52%">
          <stop offset="0%" stop-color="#21633F" stop-opacity="0.16" />
          <stop offset="65%" stop-color="#21633F" stop-opacity="0.08" />
          <stop offset="100%" stop-color="#21633F" stop-opacity="0.02" />
        </radialGradient>

        <!-- 入射暖光束 -->
        <linearGradient id="light-beam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E08A16" stop-opacity="0.65" />
          <stop offset="40%" stop-color="#E08A16" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#E08A16" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="core-ray" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E08A16" stop-opacity="0.95" />
          <stop offset="70%" stop-color="#E08A16" stop-opacity="0.4" />
          <stop offset="100%" stop-color="#E08A16" stop-opacity="0" />
        </linearGradient>

        <!-- 滤镜柔化 -->
        <filter id="blur-soft" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="6" />
        </filter>
      </defs>

      <!-- 叶绿体宏观水相轮廓 (基质 Stroma 区域) -->
      <path d="M 680,160 C 950,110 1340,150 1460,380 C 1580,610 1380,820 1080,840 C 780,860 620,740 590,560 C 560,380 520,190 680,160 Z"
            fill="url(#chloroplast-grad)"
            stroke="#21633F"
            stroke-opacity="0.32"
            stroke-width="2.5" />

      <!-- 叶绿体双层膜示意外环微线 -->
      <path d="M 670,148 C 960,98 1360,138 1482,375 C 1604,612 1398,832 1086,854 C 774,874 608,750 578,564 C 548,378 508,180 670,148 Z"
            fill="none"
            stroke="#81968A"
            stroke-opacity="0.4"
            stroke-width="1.5"
            stroke-dasharray="6 4" />

      <!-- 入射光子流（只标出能量接入类囊体的那一刻） -->
      <g class="photon-beam">
        <!-- 扩散光锥 -->
        <polygon points="520,0 740,0 920,400 810,425" fill="url(#light-beam-grad)" filter="url(#blur-soft)" />
        <!-- 锐利聚光线 -->
        <line x1="610" y1="0" x2="865" y2="405" stroke="url(#core-ray)" stroke-width="4" />
        <line x1="660" y1="0" x2="885" y2="415" stroke="url(#core-ray)" stroke-width="2" stroke-dasharray="16 8" />
        <!-- 光反应入口聚焦光斑 -->
        <ellipse cx="875" cy="410" rx="20" ry="14" fill="#E08A16" opacity="0.9" filter="url(#blur-soft)" />
        <circle cx="875" cy="410" r="7" fill="#E08A16" />
      </g>

      <!-- 类囊体堆叠基粒 (Granum / Thylakoids) - 尺度放大 1.45 倍 -->
      <g id="thylakoids" transform="translate(820, 340)">
        <!-- 膜片堆叠组 1 (上层基粒) -->
        <rect x="0" y="24" width="116" height="20" rx="10" fill="#21633F" opacity="0.88" />
        <rect x="-8" y="50" width="132" height="20" rx="10" fill="#21633F" opacity="0.95" />
        <rect x="-4" y="76" width="124" height="20" rx="10" fill="#21633F" opacity="0.9" />
        <rect x="8" y="102" width="108" height="20" rx="10" fill="#21633F" opacity="0.84" />

        <!-- 基质类囊体连接管 (Lamella) -->
        <path d="M 124,60 C 170,60 185,150 230,150" fill="none" stroke="#21633F" stroke-width="5" stroke-linecap="round" opacity="0.75" />
        <path d="M 116,86 C 158,86 178,172 222,172" fill="none" stroke="#21633F" stroke-width="5" stroke-linecap="round" opacity="0.75" />

        <!-- 膜片堆叠组 2 (下层基粒) -->
        <rect x="215" y="122" width="118" height="20" rx="10" fill="#21633F" opacity="0.85" />
        <rect x="206" y="148" width="136" height="20" rx="10" fill="#21633F" opacity="0.92" />
        <rect x="212" y="174" width="126" height="20" rx="10" fill="#21633F" opacity="0.88" />

        <!-- 场所标签 -->
        <text x="56" y="152" fill="#21633F" font-family="var(--font-sans)" font-size="var(--fs-sec)" font-weight="600" text-anchor="middle">光反应 · 类囊体膜</text>
      </g>

      <!-- 能量载体接力弧线：ATP & NADPH (从类囊体流向基质) -->
      <g id="carrier-relay">
        <!-- 上向弧线：ATP / NADPH 供给 -->
        <path class="carrier-flow" d="M 1030,410 C 1110,350 1220,350 1280,410" fill="none" stroke="#A65322" stroke-width="3.5" stroke-linecap="round" opacity="0.95" />
        <polygon points="1288,416 1282,400 1272,412" fill="#A65322" />
        <text x="1155" y="348" fill="#A65322" font-family="var(--font-sans)" font-size="var(--fs-sec)" font-weight="600" text-anchor="middle">ATP · NADPH</text>

        <!-- 下向弧线：ADP / NADP+ 循环返回 -->
        <path class="carrier-flow" d="M 1280,570 C 1210,630 1100,630 1015,560" fill="none" stroke="#81968A" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
        <polygon points="1008,554 1016,568 1024,556" fill="#81968A" />
        <text x="1150" y="638" fill="#52655B" font-family="var(--font-sans)" font-size="var(--fs-label)" font-weight="500" text-anchor="middle">ADP + Pi · NADP⁺</text>
      </g>

      <!-- 右侧结构：暗反应卡尔文循环 (Stroma 基质中，放大) -->
      <g id="calvin-cycle" transform="translate(1360, 490)">
        <!-- 循环圆弧轨迹 -->
        <circle cx="0" cy="0" r="110" fill="none" stroke="#2E6680" stroke-width="3" stroke-dasharray="24 10" opacity="0.75" />

        <!-- 反应流向箭头 -->
        <path d="M 0,-110 A 110 110 0 0 1 104,34" fill="none" stroke="#2E6680" stroke-width="3.5" />
        <polygon points="110,40 102,24 94,36" fill="#2E6680" />

        <path d="M 104,34 A 110 110 0 0 1 -60,92" fill="none" stroke="#2E6680" stroke-width="3.5" />
        <polygon points="-66,97 -50,94 -56,82" fill="#2E6680" />

        <!-- 碳固定与有机物产出标注点 -->
        <circle cx="0" cy="-110" r="6" fill="#2E6680" />
        <text x="0" y="-128" fill="#2E6680" font-family="var(--font-sans)" font-size="var(--fs-label)" font-weight="600" text-anchor="middle">CO₂ 固定</text>

        <!-- 糖类合成标注移至圆环外下方，彻底拉开间隙 -->
        <circle cx="-68" cy="86" r="6" fill="#21633F" />
        <text x="-48" y="146" fill="#21633F" font-family="var(--font-sans)" font-size="var(--fs-label)" font-weight="600" text-anchor="middle">(CH₂O) 糖类合成</text>

        <text x="0" y="8" fill="#2E6680" font-family="var(--font-sans)" font-size="var(--fs-sec)" font-weight="600" text-anchor="middle">暗反应 · 基质</text>
      </g>

      <!-- 物质流接入与逸出（水进入 -> 释放氧气） -->
      <g id="matter-water-oxygen" transform="translate(770, 460)">
        <!-- H2O 输入 -->
        <line x1="-70" y1="30" x2="10" y2="30" stroke="#2E6680" stroke-width="2.5" stroke-dasharray="6 4" />
        <text x="-80" y="36" fill="#2E6680" font-family="var(--font-sans)" font-size="var(--fs-label)" font-weight="600" text-anchor="end">H₂O</text>
        
        <!-- O2 释放 -->
        <line x1="28" y1="90" x2="28" y2="160" stroke="#2E6680" stroke-width="2.5" stroke-dasharray="6 4" />
        <polygon points="28,168 22,154 34,154" fill="#2E6680" />
        <text x="28" y="194" fill="#2E6680" font-family="var(--font-sans)" font-size="var(--fs-label)" font-weight="600" text-anchor="middle">O₂ 释放</text>
      </g>

    </svg>
  </div>

  <aside class="notes" hidden>
    同学们好，今天我们正式进入植物生理学中最壮丽的化学过程——光合作用。
    大家在画面上看到的是叶绿体内部的完整能量转化链：从左侧倾泻而下的一束光子被类囊体薄膜捕获，驱动水分子裂解并释放氧气，同时把光能临时锁在 ATP 和高能电子载体中；随后，这些能量流向右侧的基质，驱动卡尔文循环固定空气中的二氧化碳，最终源源不断地合成我们生命的根基——糖类。
    我们将分别用光反应与暗反应两个篇章，拆解这一分子层面的能量奇迹。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 1, total: 22 });
  </script>
</body>
</html>
