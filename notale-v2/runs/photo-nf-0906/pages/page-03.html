<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>光合作用总览：水和二氧化碳经过两个相互依赖的阶段形成有机物并释放氧气</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #DCE6DF;
      --text: #17251E;
      --muted: #52655B;
      --model: #21633F;
      --focus: #E08A16;
      --energy: #A65322;
      --matter: #2E6680;
      --rule: #81968A;
      --font-sans: "Noto Sans CJK SC", "PingFang SC", system-ui, sans-serif;
      --font-display: "Noto Sans CJK SC Medium", "Noto Sans CJK SC", system-ui, sans-serif;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--pad-y) var(--pad-x);
    }

    header {
      position: absolute;
      top: 36px;
      left: 56px;
      right: 56px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      font-weight: var(--weight-strong);
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .meta-eq {
      font-size: var(--fs-h2);
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .meta-eq strong {
      color: var(--model);
      font-weight: 600;
    }

    /* 主示意图 SVG */
    #schematic {
      position: absolute;
      left: 56px;
      top: 104px;
      width: 1488px;
      height: 640px;
    }

    /* 下方交互切换与导语 */
    footer {
      position: absolute;
      bottom: 28px;
      left: 56px;
      right: 56px;
      height: 96px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--rule);
      padding-top: 8px;
    }

    .beat-tabs {
      display: flex;
      gap: 12px;
    }

    .beat-btn {
      appearance: none;
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 10px 20px;
      font-size: var(--fs-sec);
      font-family: var(--font-sans);
      color: var(--text);
      cursor: pointer;
      transition: background var(--motion-fast), color var(--motion-fast), border-color var(--motion-fast);
    }

    .beat-btn:hover {
      background: rgba(255, 255, 255, 0.8);
    }

    .beat-btn[aria-pressed="true"] {
      background: var(--model);
      color: #FFFFFF;
      border-color: var(--model);
      font-weight: var(--weight-strong);
    }

    .state-summary {
      font-size: var(--fs-lead);
      color: var(--text);
      font-family: var(--font-display);
      max-width: 820px;
      text-align: right;
    }

    /* SVG 内部语义样式 */
    .chloroplast-body {
      fill: #CDDCD2;
      stroke: var(--model);
      stroke-width: 2.5;
    }

    .stage-region {
      fill: #FFFFFF;
      stroke-width: 1.5;
      transition: stroke 0.3s, fill 0.3s, opacity 0.3s;
    }
    .stage-light {
      stroke: var(--model);
    }
    .stage-dark {
      stroke: var(--matter);
    }

    .stage-title {
      font-size: var(--fs-h2);
      font-weight: 700;
      font-family: var(--font-display);
    }

    .stage-sub {
      font-size: var(--fs-label);
      fill: var(--muted);
    }

    .chem-label {
      font-size: var(--fs-body);
      font-weight: 600;
    }
    .chem-sub {
      font-size: var(--fs-tick);
      fill: var(--muted);
    }

    .carrier-text {
      font-size: var(--fs-sec);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .cycle-note {
      font-size: var(--fs-tick);
      fill: var(--muted);
      text-anchor: middle;
    }

    /* 高亮动画与聚焦效果 */
    .flow-path {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flow-photon { stroke: var(--focus); }
    .flow-matter { stroke: var(--matter); }
    .flow-energy { stroke: var(--energy); }
    .flow-return { stroke: var(--rule); stroke-dasharray: 6 4; }

    .pulse-dot {
      fill: var(--focus);
    }

    [data-beat="light"] .only-dark,
    [data-beat="dark"] .only-light {
      opacity: 0.3;
    }
  </style>
</head>
<body data-page="03" data-total="22">
  <div id="stage">
    <header>
      <h1>光反应与暗反应的依赖闭环</h1>
      <div class="meta-eq">
        <span>6 CO₂ + 6 H₂O</span>
        <span style="color: var(--focus); margin: 0 6px;">光照 / 叶绿体</span>
        <strong>C₆H₁₂O₆ + 6 O₂</strong>
      </div>
    </header>

    <!-- 核心证据图：两个相互依赖的阶段构成的闭环 -->
    <svg id="schematic" viewBox="0 0 1488 640" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arr-focus" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <path d="M1,1 L7,4 L1,7 Z" fill="var(--focus)" />
        </marker>
        <marker id="arr-matter" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <path d="M1,1 L7,4 L1,7 Z" fill="var(--matter)" />
        </marker>
        <marker id="arr-energy" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <path d="M1,1 L7,4 L1,7 Z" fill="var(--energy)" />
        </marker>
        <marker id="arr-return" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <path d="M1,1 L7,4 L1,7 Z" fill="var(--rule)" />
        </marker>
      </defs>

      <!-- 叶绿体外轮廓 -->
      <g id="chloroplast-frame">
        <rect class="chloroplast-body" x="40" y="40" width="1408" height="560" rx="36" />
        <text x="76" y="84" fill="var(--model)" font-size="18" font-weight="700">叶绿体 Chloroplast</text>
        <line x1="76" y1="98" x2="240" y2="98" stroke="var(--rule)" stroke-width="1.5" />
      </g>

      <!-- 左侧：光反应阶段 (类囊体) -->
      <g id="light-stage-group" class="group-light">
        <rect class="stage-region stage-light" x="140" y="130" width="460" height="420" rx="24" />
        <text class="stage-title" x="176" y="180" fill="var(--model)">光反应阶段</text>
        <text class="stage-sub" x="176" y="206">场所：类囊体薄膜</text>

        <!-- 类囊体垛叠微结构指示 -->
        <g opacity="0.85">
          <rect x="176" y="236" width="388" height="24" rx="6" fill="#A4C2B0" />
          <rect x="176" y="268" width="388" height="24" rx="6" fill="#A4C2B0" />
          <rect x="176" y="300" width="388" height="24" rx="6" fill="#A4C2B0" />
          <text x="370" y="284" fill="var(--model)" font-size="15" font-weight="600" text-anchor="middle">光合色素吸光 · 水光解 · ATP合成</text>
        </g>

        <!-- 光子射入 -->
        <path class="flow-path flow-photon" marker-end="url(#arr-focus)" d="M 60,280 L 165,280" />
        <text x="70" y="268" fill="var(--focus)" font-size="16" font-weight="700">光能</text>

        <!-- 水输入与氧气输出 -->
        <!-- 水进入 -->
        <path class="flow-path flow-matter" marker-end="url(#arr-matter)" d="M 370,50 L 370,120" />
        <text class="chem-label" x="370" y="38" fill="var(--matter)" text-anchor="middle">水 H₂O</text>
        <text class="chem-sub" x="370" y="106" text-anchor="middle">提供电子与质子</text>

        <!-- 氧气释放 -->
        <path class="flow-path flow-matter" marker-end="url(#arr-matter)" d="M 370,550 L 370,612" />
        <text class="chem-label" x="370" y="632" fill="var(--matter)" text-anchor="middle">氧气 O₂</text>
      </g>

      <!-- 中间：能量载体接力闭环 (ATP / NADPH 与 ADP / NADP+) -->
      <g id="carriers-loop">
        <!-- 上向弧：光反应输出高能载体到暗反应 -->
        <path class="flow-path flow-energy" marker-end="url(#arr-energy)" d="M 600,240 C 744,190 744,190 888,240" />
        <rect x="670" y="180" width="150" height="42" rx="8" fill="#F4EAE3" stroke="var(--energy)" stroke-width="1.5" />
        <text class="carrier-text" x="745" y="206" fill="var(--energy)" text-anchor="middle">ATP + NADPH</text>
        <text class="cycle-note" x="745" y="166">高能还原动力与能量</text>

        <!-- 下向弧：暗反应耗能后将载体回流光反应 -->
        <path class="flow-path flow-return" marker-end="url(#arr-return)" d="M 888,440 C 744,490 744,490 600,440" />
        <rect x="660" y="458" width="170" height="42" rx="8" fill="#E8EDE9" stroke="var(--rule)" stroke-width="1.5" />
        <text class="carrier-text" x="745" y="484" fill="var(--muted)" text-anchor="middle">ADP + Pi + NADP⁺</text>
        <text class="cycle-note" x="745" y="522">供光反应重新充能</text>
      </g>

      <!-- 右侧：暗反应阶段 (基质) -->
      <g id="dark-stage-group" class="group-dark">
        <rect class="stage-region stage-dark" x="888" y="130" width="460" height="420" rx="24" />
        <text class="stage-title" x="924" y="180" fill="var(--matter)">暗反应阶段 (卡尔文循环)</text>
        <text class="stage-sub" x="924" y="206">场所：叶绿体基质</text>

        <!-- 卡尔文循环图解环 -->
        <g id="calvin-graphic">
          <circle cx="1118" cy="340" r="82" fill="none" stroke="#9ABCCB" stroke-width="3" stroke-dasharray="10 6" />
          <text x="1118" y="334" fill="var(--matter)" font-size="16" font-weight="700" text-anchor="middle">CO₂ 固定</text>
          <text x="1118" y="358" fill="var(--matter)" font-size="16" font-weight="700" text-anchor="middle">C₃ 还原</text>
        </g>

        <!-- CO2 输入 -->
        <path class="flow-path flow-matter" marker-end="url(#arr-matter)" d="M 1118,50 L 1118,120" />
        <text class="chem-label" x="1118" y="38" fill="var(--matter)" text-anchor="middle">二氧化碳 CO₂</text>
        <text class="chem-sub" x="1118" y="106" text-anchor="middle">碳骨架来源</text>

        <!-- 糖类合成输出 -->
        <path class="flow-path flow-matter" marker-end="url(#arr-matter)" d="M 1118,550 L 1118,612" />
        <text class="chem-label" x="1118" y="632" fill="var(--matter)" text-anchor="middle">(CH₂O) 糖类</text>
      </g>
    </svg>

    <footer>
      <div class="beat-tabs" role="tablist">
        <button id="btn-all" class="beat-btn" aria-pressed="true">总览全过程</button>
        <button id="btn-light" class="beat-btn" aria-pressed="false">光反应输出</button>
        <button id="btn-dark" class="beat-btn" aria-pressed="false">暗反应回流</button>
      </div>
      <div id="state-desc" class="state-summary">
        光反应输出 ATP 与 NADPH，暗反应利用其能量还原 CO₂ 合成糖类，耗竭载体回流充能。
      </div>
    </footer>
  </div>

  <aside class="notes" hidden>
    光合作用总反应式包含了物质与能量的完整转化。水在光反应中被光解产生氧气并生成高能物质；二氧化碳在暗反应中被同化为糖类。两个阶段通过 ATP 和 NADPH 的生成与消耗紧密偶联，缺一不可。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (function() {
      Deck.init({ index: 3, total: 22, keys: false });

      const btnAll = document.getElementById('btn-all');
      const btnLight = document.getElementById('btn-light');
      const btnDark = document.getElementById('btn-dark');
      const stage = document.getElementById('stage');
      const desc = document.getElementById('state-desc');

      const beats = {
        all: {
          text: '光反应输出 ATP 与 NADPH，暗反应利用其能量还原 CO₂ 合成糖类，耗竭载体回流充能。'
        },
        light: {
          text: '光能驱动水光解产生 O₂，生成的 ATP 与 NADPH 将能量与还原剂持续送往暗反应。'
        },
        dark: {
          text: '暗反应消耗载体将 CO₂ 还原为糖类，排空的 ADP 与 NADP⁺ 回流到类囊体重新充能。'
        }
      };

      function setBeat(name) {
        btnAll.setAttribute('aria-pressed', name === 'all');
        btnLight.setAttribute('aria-pressed', name === 'light');
        btnDark.setAttribute('aria-pressed', name === 'dark');

        stage.setAttribute('data-beat', name);
        desc.textContent = beats[name].text;

        const lightGroup = document.getElementById('light-stage-group');
        const darkGroup = document.getElementById('dark-stage-group');
        const carrierEnergy = document.querySelector('.flow-energy');
        const carrierReturn = document.querySelector('.flow-return');

        if (name === 'all') {
          lightGroup.style.opacity = '1';
          darkGroup.style.opacity = '1';
          carrierEnergy.style.strokeWidth = '3';
          carrierReturn.style.strokeWidth = '3';
        } else if (name === 'light') {
          lightGroup.style.opacity = '1';
          darkGroup.style.opacity = '0.45';
          carrierEnergy.style.strokeWidth = '5';
          carrierReturn.style.strokeWidth = '2';
        } else if (name === 'dark') {
          lightGroup.style.opacity = '0.45';
          darkGroup.style.opacity = '1';
          carrierEnergy.style.strokeWidth = '2';
          carrierReturn.style.strokeWidth = '5';
        }
      }

      btnAll.addEventListener('click', () => setBeat('all'));
      btnLight.addEventListener('click', () => setBeat('light'));
      btnDark.addEventListener('click', () => setBeat('dark'));
    })();
  </script>
</body>
</html>
