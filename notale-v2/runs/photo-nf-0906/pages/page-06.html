<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #DCE6DF;
      --text: #17251E;
      --muted: #52655B;
      --model: #21633F;
      --focus: #E08A16;
      --energy: #A65322;
      --matter: #2E6680;
      --rule: #81968A;
      --font-sans: "Noto Sans CJK SC", "Noto Sans SC", system-ui, sans-serif;
      --font-display: "Noto Sans CJK SC Medium", "Noto Sans CJK SC", sans-serif;
    }

    #stage {
      background-color: var(--bg);
      position: relative;
      overflow: hidden;
      padding: var(--pad-y) var(--pad-x);
    }

    .cover-copy {
      position: absolute;
      top: 120px;
      left: 104px;
      z-index: 5;
      pointer-events: none;
    }

    .cover-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: var(--weight-strong);
      line-height: var(--lh-tight);
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .cover-title .accent {
      display: inline-block;
      margin-top: 10px;
      font-size: var(--fs-h1);
      color: var(--model);
    }

    .cover-lead {
      margin: 24px 0 0 0;
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* 反应路径动效 */
    .photon-beam {
      transform-origin: 260px 580px;
      animation: photon-pulse 4s ease-in-out infinite alternate;
    }

    .carrier-flow {
      stroke-dasharray: 8 12;
      animation: carrier-march 24s linear infinite;
    }

    @keyframes photon-pulse {
      0% { opacity: 0.85; }
      100% { opacity: 1; }
    }

    @keyframes carrier-march {
      to { stroke-dashoffset: -200; }
    }

    @media (prefers-reduced-motion: reduce) {
      .photon-beam, .carrier-flow {
        animation: none !important;
      }
    }
  </style>
</head>
<body data-page="06" data-total="22">
  <div id="stage">
    <header class="cover-copy">
      <h1 class="cover-title">光反应<br><span class="accent">把光能装进能量载体</span></h1>
      <p class="cover-lead">光子激发、水裂解与 ATP / NADPH 生成</p>
    </header>

    <svg class="scene cv-fill" viewBox="0 0 1600 900" role="img" aria-label="光反应结构示意：光能注入类囊体膜，驱动电子传递与能量载体生成">
      <defs>
        <!-- 光束暖光渐变 -->
        <linearGradient id="photon-grad" x1="120" y1="360" x2="680" y2="590" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#E08A16" stop-opacity="0"/>
          <stop offset="40%" stop-color="#E08A16" stop-opacity="0.35"/>
          <stop offset="85%" stop-color="#E08A16" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#FCEFD8" stop-opacity="1"/>
        </linearGradient>

        <!-- 类囊体基质膜色 -->
        <linearGradient id="thylakoid-membrane" x1="500" y1="500" x2="1500" y2="700" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#1B5335"/>
          <stop offset="100%" stop-color="#21633F"/>
        </linearGradient>

        <linearGradient id="lumen-grad" x1="600" y1="620" x2="1500" y2="820" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#16462C" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#21633F" stop-opacity="0.12"/>
        </linearGradient>
      </defs>

      <!-- 宏观叶绿体轮廓层 (柔和深绿质感背景) -->
      <path d="M 520,380 C 760,280 1200,310 1440,460 C 1540,530 1530,750 1420,810 C 1200,890 700,860 480,750 C 380,700 360,450 520,380 Z"
            fill="#C9DAD0" opacity="0.6"/>

      <!-- 类囊体基粒叠层暗示 (左侧至底部的圆盘结构) -->
      <g opacity="0.45">
        <ellipse cx="620" cy="740" rx="190" ry="38" fill="#AEC5B7"/>
        <ellipse cx="620" cy="718" rx="190" ry="38" fill="#B9CEBF"/>
        <ellipse cx="620" cy="696" rx="190" ry="38" fill="#C5D7CB"/>
      </g>

      <!-- 主体：类囊体膜剖面弧线带 (膜结构) -->
      <!-- 腔内侧衬底 -->
      <path d="M 560,630 C 720,600 1000,590 1480,650 L 1480,820 C 1000,770 740,790 560,820 Z"
            fill="url(#lumen-grad)"/>

      <!-- 磷脂双分子层代表带 -->
      <path d="M 560,610 C 720,580 1000,570 1480,630"
            fill="none" stroke="url(#thylakoid-membrane)" stroke-width="36" stroke-linecap="round"/>
      <path d="M 560,650 C 720,620 1000,610 1480,670"
            fill="none" stroke="url(#thylakoid-membrane)" stroke-width="36" stroke-linecap="round"/>

      <!-- 膜蛋白复合体 (PSII、Cyt b6f、PSI、ATP合酶) 抽象结构块 -->
      <!-- PSII: 光系统II (光子命中点) -->
      <g id="complex-psii">
        <rect x="670" y="555" width="94" height="130" rx="14" fill="#21633F"/>
        <!-- 核心捕光中心与光子结合位点 -->
        <circle cx="717" cy="590" r="16" fill="#E08A16"/>
        <circle cx="717" cy="590" r="8" fill="#FFF"/>
      </g>

      <!-- 细胞色素 b6f -->
      <rect x="860" y="565" width="76" height="118" rx="12" fill="#2B744C"/>

      <!-- PSI: 光系统I -->
      <g id="complex-psi">
        <rect x="1030" y="555" width="92" height="130" rx="14" fill="#21633F"/>
        <circle cx="1076" cy="590" r="12" fill="#E08A16" opacity="0.85"/>
      </g>

      <!-- ATP 合成酶结构 -->
      <g id="complex-atpsynthase">
        <rect x="1260" y="570" width="60" height="110" rx="10" fill="#2E6680" opacity="0.9"/>
        <circle cx="1290" cy="535" r="32" fill="#2E6680"/>
        <ellipse cx="1290" cy="535" rx="20" ry="10" fill="#3D7B99"/>
      </g>

      <!-- 光束：斜射穿透入光系统 II -->
      <g class="photon-beam">
        <!-- 弥散外光束 -->
        <polygon points="180,240 240,220 735,595 695,605" fill="url(#photon-grad)" opacity="0.45"/>
        <!-- 锐利聚光主光束 -->
        <polygon points="200,230 225,220 722,592 708,598" fill="url(#photon-grad)"/>
        <!-- 光子光粒子轨迹 -->
        <circle cx="440" cy="400" r="4.5" fill="#E08A16"/>
        <circle cx="560" cy="485" r="5" fill="#E08A16"/>
        <line x1="190" y1="225" x2="717" y2="590" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
      </g>

      <!-- 物质与能量流转路径 -->
      <!-- 水裂解流向：水进入，产生氧气与质子 -->
      <g id="water-path" opacity="0.95">
        <path d="M 660,760 C 680,720 700,680 705,650" fill="none" stroke="#2E6680" stroke-width="3" stroke-linecap="round"/>
        <text x="645" y="785" fill="#2E6680" font-family="var(--font-sans)" font-size="15px" font-weight="600">H₂O</text>
        <path d="M 725,650 C 735,700 755,740 775,765" fill="none" stroke="#2E6680" stroke-width="2" stroke-dasharray="4 4"/>
        <text x="775" y="785" fill="#2E6680" font-family="var(--font-sans)" font-size="15px">O₂ + H⁺</text>
      </g>

      <!-- 膜上高能电子传递链 -->
      <path d="M 725,580 C 770,550 820,550 865,580 C 910,610 980,550 1035,580"
            fill="none" stroke="#E08A16" stroke-width="3.5" stroke-linecap="round" class="carrier-flow"/>

      <!-- 能量载体产出标注 (ATP 与 NADPH) -->
      <!-- NADPH 输出 -->
      <g id="nadph-output">
        <path d="M 1080,555 C 1090,500 1120,470 1160,460"
              fill="none" stroke="#A65322" stroke-width="3" stroke-linecap="round"/>
        <circle cx="1165" cy="460" r="4" fill="#A65322"/>
        <text x="1176" y="466" fill="#A65322" font-family="var(--font-sans)" font-size="16px" font-weight="600">NADPH</text>
        <text x="1176" y="488" fill="#52655B" font-family="var(--font-sans)" font-size="15px">还原能力</text>
      </g>

      <!-- ATP 输出 -->
      <g id="atp-output">
        <path d="M 1290,500 C 1300,450 1335,430 1375,425"
              fill="none" stroke="#A65322" stroke-width="3" stroke-linecap="round"/>
        <circle cx="1380" cy="425" r="4" fill="#A65322"/>
        <text x="1392" y="431" fill="#A65322" font-family="var(--font-sans)" font-size="16px" font-weight="600">ATP</text>
        <text x="1392" y="453" fill="#52655B" font-family="var(--font-sans)" font-size="15px">化学能</text>
      </g>

      <!-- 膜空间层级极性标注 (基质 Stroma / 类囊体腔 Lumen) -->
      <text x="1370" y="585" fill="#52655B" font-family="var(--font-sans)" font-size="15px" letter-spacing="0.05em">基质 (Stroma)</text>
      <text x="1370" y="725" fill="#52655B" font-family="var(--font-sans)" font-size="15px" letter-spacing="0.05em">类囊体腔 (Lumen)</text>
    </svg>
  </div>

  <aside class="notes" hidden>
    本章进入光合作用的第一阶段：光反应。
    大家可以看到，叶绿体中的类囊体膜就像一套精密的光能转化车间。
    一束光子打在膜上的捕光系统，激发出高能电子；水分子在膜内侧被裂解，补充电子的同时释放出氧气。
    随着电子沿传递链下行，质子浓度梯度驱动合成 ATP，同时电子最终装载形成 NADPH。
    光能就这样稳稳转化并存储成了后续暗反应所需的化学能与还原能力。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 6, total: 22, keys: false });
  </script>
</body>
</html>
