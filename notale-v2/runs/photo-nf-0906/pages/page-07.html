<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #DCE6DF;
      --text: #17251E;
      --font-sans: "Noto Sans CJK SC", "Noto Sans SC", system-ui, sans-serif;
    }

    #stage {
      width: 1600px;
      height: 900px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--pad-y) var(--pad-x);
    }

    /* 顶部标题区 */
    header {
      position: absolute;
      top: 36px;
      left: 56px;
      right: 56px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-weight: var(--weight-strong);
      line-height: var(--lh-tight);
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .claim-tag {
      font-size: var(--fs-sec);
      color: var(--muted);
    }

    /* 主可视化舞台 */
    .viewport {
      position: absolute;
      top: 110px;
      left: 56px;
      width: 1488px;
      height: 640px;
    }

    svg#scene {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* SVG 内部排版样式 */
    .axis-line {
      stroke: var(--rule);
      stroke-width: 2;
    }

    .energy-level {
      stroke-dasharray: 4 4;
      stroke-width: 1.5;
    }

    .label-title {
      font-size: var(--fs-h2);
      font-weight: var(--weight-strong);
      fill: var(--text);
    }

    .label-muted {
      font-size: var(--fs-label);
      fill: var(--muted);
    }

    .label-body {
      font-size: var(--fs-sec);
      fill: var(--text);
    }

    .label-numeric {
      font-family: var(--font-numeric);
      font-size: var(--fs-label);
      fill: var(--muted);
    }

    /* 控制栏 */
    footer.controls {
      position: absolute;
      bottom: 30px;
      left: 56px;
      right: 56px;
      height: 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--rule);
      padding-top: 12px;
    }

    .status-summary {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .status-badge {
      font-size: var(--fs-body);
      font-weight: var(--weight-strong);
      color: var(--model);
      min-width: 180px;
    }

    .status-desc {
      font-size: var(--fs-sec);
      color: var(--muted);
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    button.step-btn {
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 8px 20px;
      font-size: var(--fs-label);
      color: var(--text);
      cursor: pointer;
      transition: background var(--motion-fast), border-color var(--motion-fast), color var(--motion-fast);
    }

    button.step-btn:hover {
      border-color: var(--model);
    }

    button.step-btn[aria-current="true"] {
      background: var(--model);
      border-color: var(--model);
      color: #fff;
      font-weight: var(--weight-strong);
    }
  </style>
</head>
<body data-page="07" data-total="22">
  <div id="stage">
    <header>
      <h1>光能的起点：叶绿素吸收光使电子跃迁至高能级</h1>
      <span class="claim-tag">能量输入阶段</span>
    </header>

    <div class="viewport">
      <svg id="scene" viewBox="0 0 1488 640">
        <defs>
          <!-- 箭头标号 -->
          <marker id="arrow-model" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M1 1 L7 4 L1 7 Z" fill="#21633F"/>
          </marker>
          <marker id="arrow-focus" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M1 1 L7 4 L1 7 Z" fill="#E08A16"/>
          </marker>
          <marker id="arrow-energy" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M1 1 L7 4 L1 7 Z" fill="#A65322"/>
          </marker>
          <marker id="arrow-rule" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M1 1 L7 4 L1 7 Z" fill="#81968A"/>
          </marker>
        </defs>

        <!-- 纵坐标：能量轴 -->
        <g id="energy-axis" transform="translate(70, 40)">
          <line x1="0" y1="520" x2="0" y2="40" class="axis-line" marker-end="url(#arrow-rule)"/>
          <text x="-16" y="24" class="label-numeric" font-weight="600">能量 E</text>
          
          <!-- 能级虚线贯穿整个图区 -->
          <line x1="0" y1="160" x2="1350" y2="160" class="energy-level" stroke="#A65322"/>
          <text x="12" y="152" class="label-numeric" fill="#A65322">激发态能级 (高自由能)</text>

          <line x1="0" y1="460" x2="1350" y2="460" class="energy-level" stroke="#81968A"/>
          <text x="12" y="452" class="label-numeric" fill="#52655B">基态能级 (稳定低能态)</text>
        </g>

        <!-- 左侧区域：叶绿素分子受光激发直观模型 -->
        <g id="chlorophyll-panel" transform="translate(180, 70)">
          <!-- 区域标题 -->
          <text x="0" y="30" class="label-title">反应中心 (P680)</text>
          <text x="0" y="55" class="label-muted">叶绿素共轭体系吸光并释放电子</text>

          <!-- 分子核心示意：卟啉环轮廓 -->
          <rect x="80" y="280" width="180" height="200" rx="16" fill="rgba(33, 99, 63, 0.08)" stroke="#21633F" stroke-width="2"/>
          <circle cx="170" cy="380" r="32" fill="rgba(33, 99, 63, 0.15)" stroke="#21633F" stroke-width="2"/>
          <text x="170" y="386" font-size="18" font-weight="600" fill="#21633F" text-anchor="middle">Mg²⁺</text>
          <text x="170" y="450" class="label-muted" text-anchor="middle">基态叶绿素</text>

          <!-- 光子入射波列 (hν) -->
          <g id="photon-wave">
            <path d="M-60,260 Q -30,220 0,260 T 60,260 T 120,260 T 160,330" fill="none" stroke="#E08A16" stroke-width="3" stroke-linecap="round"/>
            <polygon points="160,330 152,316 166,320" fill="#E08A16"/>
            <text x="10" y="235" font-size="16" font-weight="600" fill="#E08A16">光子 hν</text>
            <text x="10" y="215" class="label-numeric" fill="#E08A16">680 nm</text>
          </g>

          <!-- 电子跃迁轨道与电子小球 -->
          <g id="electron-jump">
            <!-- 跃迁轨道虚线 -->
            <path d="M 170,350 C 170,240 170,180 170,130" fill="none" stroke="#E08A16" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-focus)"/>
            <text x="185" y="240" font-size="15" font-weight="600" fill="#E08A16">吸光跃迁</text>

            <!-- 高能电子小球 (激发后) -->
            <circle id="electron-dot" cx="170" cy="130" r="12" fill="#E08A16" stroke="#fff" stroke-width="2"/>
            <text id="electron-txt" x="170" y="134" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">e⁻</text>
            <text x="170" y="95" font-size="16" font-weight="600" fill="#A65322" text-anchor="middle">高能电子</text>
          </g>
        </g>

        <!-- 中间：能级跃迁与能量差对照 -->
        <g id="transition-diagram" transform="translate(680, 70)">
          <text x="0" y="30" class="label-title">能级跃迁差 (ΔE)</text>
          <text x="0" y="55" class="label-muted">光子能量转化为电子的高势能</text>

          <!-- 能级柱与台阶 -->
          <!-- 基态条 -->
          <rect x="50" y="420" width="160" height="12" rx="4" fill="#21633F"/>
          <text x="130" y="460" class="label-body" text-anchor="middle">基态 (低势能)</text>

          <!-- 激发态条 -->
          <rect x="50" y="120" width="160" height="12" rx="4" fill="#A65322"/>
          <text x="130" y="105" class="label-body" font-weight="600" fill="#A65322" text-anchor="middle">激发态 (高势能)</text>

          <!-- 能量吸收箭头 -->
          <line x1="130" y1="410" x2="130" y2="142" stroke="#E08A16" stroke-width="3" marker-end="url(#arrow-focus)"/>
          <text x="145" y="275" font-size="18" font-weight="600" fill="#E08A16">ΔE = hν</text>
          <text x="145" y="300" class="label-muted">电子跃离原基态轨道</text>
        </g>

        <!-- 右侧：去向与后续反应连接（承上启下） -->
        <g id="fate-panel" transform="translate(1080, 70)">
          <text x="0" y="30" class="label-title">高能电子流向</text>
          <text x="0" y="55" class="label-muted">进入原初受体开启传递链</text>

          <!-- 接收器：原初受体 -->
          <rect x="40" y="100" width="220" height="100" rx="12" fill="rgba(46, 102, 128, 0.1)" stroke="#2E6680" stroke-width="2"/>
          <text x="150" y="142" font-size="18" font-weight="600" fill="#2E6680" text-anchor="middle">原初电子受体</text>
          <text x="150" y="170" class="label-muted" text-anchor="middle">捕获脱离的活跃电子</text>

          <!-- 高能电子输出通道 -->
          <path d="M-150,130 L30,130" fill="none" stroke="#A65322" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow-energy)"/>
          <text x="-60" y="115" class="label-body" font-weight="600" fill="#A65322" text-anchor="middle">传给受体</text>

          <!-- 下方空穴提示（引导第8页水的光解） -->
          <g id="hole-notice" transform="translate(40, 360)">
            <rect x="0" y="0" width="220" height="96" rx="12" fill="rgba(82, 101, 91, 0.08)" stroke="#81968A" stroke-width="1.5"/>
            <text x="110" y="36" class="label-body" font-weight="600" fill="#21633F" text-anchor="middle">留下强氧化空穴</text>
            <text x="110" y="64" class="label-muted" text-anchor="middle">由水光解补充电子</text>
            <path d="M-60,70 L-10,48" fill="none" stroke="#81968A" stroke-width="1.5" stroke-dasharray="4 4"/>
          </g>
        </g>
      </svg>
    </div>

    <footer class="controls">
      <div class="status-summary">
        <div id="statusBadge" class="status-badge">吸收光能跃迁</div>
        <div id="statusDesc" class="status-desc">光子能量 hν 驱动电子从基态跃升到高能激发态，获得化学活性。</div>
      </div>
      <div class="btn-group">
        <button id="step0" class="step-btn" data-step="0" aria-current="false">基态静止</button>
        <button id="step1" class="step-btn" data-step="1" aria-current="true">吸光跃迁</button>
        <button id="step2" class="step-btn" data-step="2" aria-current="false">传递给受体</button>
      </div>
    </footer>
  </div>

  <aside class="notes" hidden>
    同学们请看，光反应的第一步就是光能的捕捉。叶绿体类囊体膜上的叶绿素分子吸收了特定波长的光子，光子能量被卟啉环中的共轭π电子吸收。电子吸收能量后，从能量较低的基态轨道瞬间跃迁到高能级的激发态轨道。这个高能电子非常活跃，随后脱离叶绿素分子被原初电子受体捕获，正式开启了光反应的电子传递链；而失去电子的叶绿素分子变成强氧化态，这就为下一页讲的“水的光解”埋下了伏笔。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      "use strict";

      const STEPS = [
        {
          name: "基态叶绿素",
          desc: "叶绿素分子处于低能级稳定态，电子留在卟啉环内等待受光。",
          electronPos: { x: 170, y: 350 },
          photonOpacity: 0.2,
          jumpOpacity: 0.1,
          toAcceptorOpacity: 0.1,
          holeOpacity: 0.2
        },
        {
          name: "吸收光能跃迁",
          desc: "光子能量 hν 驱动电子从基态跃升到高能激发态，获得化学活性。",
          electronPos: { x: 170, y: 130 },
          photonOpacity: 1,
          jumpOpacity: 1,
          toAcceptorOpacity: 0.3,
          holeOpacity: 0.6
        },
        {
          name: "电子脱离并传递",
          desc: "高能电子脱离叶绿素进入原初受体，叶绿素失去电子形成强氧化中心。",
          electronPos: { x: 1190, y: 130 },
          photonOpacity: 0.4,
          jumpOpacity: 0.5,
          toAcceptorOpacity: 1,
          holeOpacity: 1
        }
      ];

      let currentStep = 1;

      const badge = document.getElementById("statusBadge");
      const desc = document.getElementById("statusDesc");
      const buttons = document.querySelectorAll(".step-btn");
      const electronDot = document.getElementById("electron-dot");
      const electronTxt = document.getElementById("electron-txt");
      const photonWave = document.getElementById("photon-wave");
      const jumpGroup = document.getElementById("electron-jump");
      const fatePanel = document.getElementById("fate-panel");
      const holeNotice = document.getElementById("hole-notice");

      function update(stepIdx) {
        currentStep = stepIdx;
        const data = STEPS[stepIdx];

        badge.textContent = data.name;
        desc.textContent = data.desc;

        buttons.forEach((btn, idx) => {
          btn.setAttribute("aria-current", idx === stepIdx ? "true" : "false");
        });

        // 动画更新电子坐标
        if (electronDot && electronTxt) {
          electronDot.setAttribute("cx", data.electronPos.x);
          electronDot.setAttribute("cy", data.electronPos.y);
          electronTxt.setAttribute("x", data.electronPos.x);
          electronTxt.setAttribute("y", data.electronPos.y + 4);
        }

        if (photonWave) {
          photonWave.style.opacity = data.photonOpacity;
          photonWave.style.transition = "opacity 300ms ease";
        }

        if (holeNotice) {
          holeNotice.style.opacity = data.holeOpacity;
          holeNotice.style.transition = "opacity 300ms ease";
        }
      }

      buttons.forEach(btn => {
        btn.addEventListener("click", () => {
          const step = parseInt(btn.getAttribute("data-step"), 10);
          update(step);
        });
      });

      // 初始化步骤2（决策态）
      update(1);

      Deck.init({ index: 7, total: 22, keys: true });
    })();
  </script>
</body>
</html>
