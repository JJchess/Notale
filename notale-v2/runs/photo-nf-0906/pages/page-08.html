<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #DCE6DF;
      --text: #17251E;
      --muted: #52655B;
      --model: #21633F;
      --focus: #E08A16;
      --energy: #A65322;
      --matter: #2E6680;
      --rule: #81968A;
      --font-sans: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    header {
      position: absolute;
      top: 36px;
      left: 64px;
      right: 64px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 16px;
    }

    .title-wrap h1 {
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      font-weight: var(--weight-strong);
      color: var(--text);
      margin: 0;
    }

    .title-wrap p {
      margin: 8px 0 0;
      font-size: var(--fs-sec);
      color: var(--muted);
    }

    .formula-badge {
      font-size: 20px;
      font-weight: var(--weight-strong);
      color: var(--model);
      font-family: var(--font-numeric);
      letter-spacing: 0.02em;
    }

    /* 主图布局：类囊体膜与裂解剖面 */
    #diagram {
      position: absolute;
      top: 136px;
      left: 64px;
      width: 1472px;
      height: 610px;
    }

    /* 阶段控制器与步骤说明 */
    footer {
      position: absolute;
      bottom: 30px;
      left: 64px;
      right: 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--rule);
      padding-top: 14px;
    }

    .step-desc {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .step-desc b {
      font-size: var(--fs-h2);
      color: var(--focus);
    }

    .step-desc span {
      font-size: var(--fs-body);
      color: var(--text);
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 6px 18px;
      font-size: var(--fs-label);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      transition: background var(--motion-fast), border-color var(--motion-fast);
    }

    .nav-btn:hover {
      background: rgba(33, 99, 63, 0.12);
      border-color: var(--model);
    }

    .nav-btn[aria-current="true"] {
      background: var(--model);
      color: #ffffff;
      border-color: var(--model);
      font-weight: 600;
    }
  </style>
</head>
<body data-page="08" data-total="22">
  <div id="stage">
    <header>
      <div class="title-wrap">
        <h1>水的光解：水补充电子，同时释放氧与氢</h1>
        <p>光系统Ⅱ失电子后夺取水分子中的电子，维持传递链连续运转</p>
      </div>
      <div class="formula-badge">2H₂O → 4H⁺ + 4e⁻ + O₂</div>
    </header>

    <svg id="diagram" viewBox="0 0 1472 610" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 区域背景底色划分：类囊体腔(下)与基质(上) -->
      <rect x="0" y="0" width="1472" height="230" fill="#cdd8d1" rx="8" />
      <rect x="0" y="320" width="1472" height="290" fill="#d2ded6" rx="8" />

      <!-- 区域标注 -->
      <text x="32" y="42" fill="var(--muted)" font-size="16" font-weight="600">叶绿体基质（低 H⁺ 浓度）</text>
      <text x="32" y="582" fill="var(--muted)" font-size="16" font-weight="600">类囊体腔（高 H⁺ 蓄积区）</text>

      <!-- 双层脂质膜示意带 -->
      <rect x="0" y="230" width="1472" height="90" fill="#9db1a4" />
      <text x="32" y="282" fill="#2b3b33" font-size="15" font-weight="600" letter-spacing="0.05em">类囊体膜（磷脂双分子层）</text>

      <!-- 光系统Ⅱ (PSII) 复合体跨膜主体 -->
      <g id="psii-complex" transform="translate(560, 160)">
        <rect x="0" y="0" width="350" height="230" rx="20" fill="var(--model)" />
        <rect x="15" y="15" width="320" height="200" rx="14" fill="#267349" />
        <text x="100" y="60" text-anchor="middle" fill="#f0f6f2" font-size="22" font-weight="700">光系统 Ⅱ (PS Ⅱ)</text>
        <text x="100" y="88" text-anchor="middle" fill="#d0e2d7" font-size="15">反应中心 P680</text>

        <!-- 锰析氧复合体 (OEC / 水裂解催化中心) 位于膜内侧（腔侧） -->
        <g id="oec" transform="translate(45, 140)">
          <rect x="0" y="0" width="260" height="68" rx="10" fill="#1b4d32" stroke="var(--focus)" stroke-width="2" />
          <text x="130" y="28" text-anchor="middle" fill="#ffdfa9" font-size="16" font-weight="600">析氧复合体 (OEC)</text>
          <text x="130" y="52" text-anchor="middle" fill="#f4ebd9" font-size="13">Mn₄CaO₅ 催化核心</text>
        </g>
      </g>

      <!-- 1. 入射光子驱动反应中心失电子 (左上方暖光箭头) -->
      <g id="light-beam">
        <path d="M 440 60 L 590 175" stroke="var(--focus)" stroke-width="5" stroke-linecap="round" />
        <polygon points="597,180 581,173 591,163" fill="var(--focus)" />
        <text x="400" y="52" fill="var(--focus)" font-size="16" font-weight="600">光子能量驱动</text>
      </g>

      <!-- 2. 激发出的高能电子离开 PSII 前往电子传递链 (右上方) -->
      <g id="electron-exit">
        <path d="M 890 185 C 950 170, 990 160, 1070 160" stroke="var(--energy)" stroke-width="4" stroke-dasharray="8 6" fill="none" />
        <polygon points="1080,160 1064,153 1064,167" fill="var(--energy)" />
        <!-- 电子粒子标记 -->
        <circle cx="975" cy="170" r="15" fill="var(--energy)" />
        <text x="975" y="175" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">e⁻</text>
        <text x="1100" y="165" fill="var(--energy)" font-size="16" font-weight="600">高能电子向下游传递</text>
      </g>

      <!-- 3. 水分子进入催化中心裂解 (水相物质流) -->
      <g id="water-in">
        <path d="M 380 470 C 440 470, 520 440, 600 375" stroke="var(--matter)" stroke-width="4" fill="none" />
        <polygon points="606,370 591,374 600,385" fill="var(--matter)" />
        <!-- 水分子球棍模型示意 -->
        <circle cx="350" cy="470" r="30" fill="#fff" stroke="var(--matter)" stroke-width="3" />
        <text x="350" y="476" text-anchor="middle" fill="var(--matter)" font-size="19" font-weight="700">2H₂O</text>
        <text x="350" y="520" text-anchor="middle" fill="var(--matter)" font-size="15">原料水分子</text>
      </g>

      <!-- 4. 裂解产生的 4e⁻ 补位进入 PSII (填补电子空缺) -->
      <g id="electron-replenish">
        <path d="M 800 300 L 800 180" stroke="var(--focus)" stroke-width="4" stroke-linecap="round" fill="none" />
        <polygon points="800,172 793,186 807,186" fill="var(--focus)" />
        <circle cx="800" cy="240" r="18" fill="var(--focus)" />
        <text x="800" y="246" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">4e⁻</text>
        <text x="828" y="246" fill="#fff" font-size="15" font-weight="600">填补空穴</text>
      </g>

      <!-- 5. 产物一：氧气生成并释放扩散 -->
      <g id="oxygen-out">
        <path d="M 870 370 C 940 400, 990 430, 1070 445" stroke="var(--matter)" stroke-width="4" fill="none" />
        <polygon points="1078,446 1063,438 1065,453" fill="var(--matter)" />
        <circle cx="1115" cy="450" r="28" fill="#fff" stroke="var(--matter)" stroke-width="3" />
        <text x="1115" y="457" text-anchor="middle" fill="var(--matter)" font-size="19" font-weight="700">O₂</text>
        <text x="1165" y="455" fill="var(--matter)" font-size="16" font-weight="600">副产物氧气</text>
        <text x="1165" y="478" fill="var(--muted)" font-size="13">扩散出叶绿体</text>
      </g>

      <!-- 6. 产物二：4H⁺ 在类囊体腔内释放与积累 -->
      <g id="protons-out">
        <path d="M 690 395 C 690 450, 710 490, 740 520" stroke="var(--model)" stroke-width="3" stroke-dasharray="6 4" fill="none" />
        <polygon points="745,525 732,520 739,510" fill="var(--model)" />
        <g transform="translate(770, 485)">
          <!-- 4个氢离子聚集 -->
          <circle cx="20" cy="20" r="16" fill="#fff" stroke="var(--model)" stroke-width="2" />
          <text x="20" y="25" text-anchor="middle" fill="var(--model)" font-size="13" font-weight="700">H⁺</text>
          <circle cx="58" cy="20" r="16" fill="#fff" stroke="var(--model)" stroke-width="2" />
          <text x="58" y="25" text-anchor="middle" fill="var(--model)" font-size="13" font-weight="700">H⁺</text>
          <circle cx="20" cy="58" r="16" fill="#fff" stroke="var(--model)" stroke-width="2" />
          <text x="20" y="63" text-anchor="middle" fill="var(--model)" font-size="13" font-weight="700">H⁺</text>
          <circle cx="58" cy="58" r="16" fill="#fff" stroke="var(--model)" stroke-width="2" />
          <text x="58" y="63" text-anchor="middle" fill="var(--model)" font-size="13" font-weight="700">H⁺</text>
          <text x="96" y="44" fill="var(--model)" font-size="16" font-weight="600">质子留在腔内</text>
          <text x="96" y="66" fill="var(--muted)" font-size="13">积累形成跨膜浓度差</text>
        </g>
      </g>
    </svg>

    <footer>
      <div class="step-desc">
        <b id="step-title">1. 水分子裂解</b>
        <span id="step-info">在锰簇催化下分解为电子、氧气与质子。</span>
      </div>
      <div class="nav-buttons">
        <button class="nav-btn" data-step="0" aria-current="true">1. 水裂解</button>
        <button class="nav-btn" data-step="1">2. 电子补给</button>
        <button class="nav-btn" data-step="2">3. 产物去向</button>
      </div>
    </footer>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      "use strict";

      const steps = [
        {
          title: "1. 催化裂解",
          info: "在锰簇催化下，2个水分子分解为4个电子、4个氢离子和1个氧分子。",
          highlight: "water-in"
        },
        {
          title: "2. 电子补给",
          info: "4个电子持续填补反应中心空缺，维持光反应电子流循环运转。",
          highlight: "electron-replenish"
        },
        {
          title: "3. 产物去向",
          info: "氧气扩散释放，氢离子留在类囊体腔内蓄积形成跨膜浓度差。",
          highlight: "protons-out"
        }
      ];

      const stepTitle = document.getElementById("step-title");
      const stepInfo = document.getElementById("step-info");
      const buttons = document.querySelectorAll(".nav-btn");

      function setStep(idx) {
        const s = steps[idx];
        stepTitle.textContent = s.title;
        stepInfo.textContent = s.info;

        buttons.forEach((btn, i) => {
          btn.setAttribute("aria-current", i === idx ? "true" : "false");
        });

        // 改变焦点示意透明度
        const groups = ["water-in", "electron-replenish", "protons-out", "oxygen-out"];
        groups.forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            if (idx === 0) {
              el.style.opacity = (id === "water-in") ? "1" : "0.6";
            } else if (idx === 1) {
              el.style.opacity = (id === "electron-replenish" || id === "electron-exit") ? "1" : "0.5";
            } else {
              el.style.opacity = (id === "protons-out" || id === "oxygen-out") ? "1" : "0.6";
            }
          }
        });
      }

      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          setStep(parseInt(btn.dataset.step, 10));
        });
      });

      setStep(0);
      Deck.init({ index: 8, total: 22 });
    })();
  </script>
  <aside class="notes" hidden>
    在上一页中我们看到，光能激发叶绿素分子释放出高能电子。但如果电子只出不进，反应中心就会因为缺少电子而停摆。
    解决这个危机的机制，就是位于类囊体膜内侧的水的光解。
    在光系统Ⅱ的析氧复合体催化下，水分子被分解为电子、氢离子和氧气。
    水贡献的电子源源不断地填补反应中心的空缺，使光反应链条能够持续运转；生成的氧气作为副产物释放到大气中；而氢离子则蓄积在类囊体腔内，成为下一步制造ATP的关键势能。
  </aside>
</body>
</html>
