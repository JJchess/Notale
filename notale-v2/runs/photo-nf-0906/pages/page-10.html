<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #DCE6DF;
      --text: #17251E;
      --font-sans: "Noto Sans CJK SC", "Noto Sans SC", system-ui, sans-serif;
    }

    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
    }

    header {
      position: absolute;
      top: 36px;
      left: 56px;
      right: 56px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: var(--weight-strong);
      line-height: var(--lh-tight);
      margin: 0;
      color: var(--text);
    }

    .claim-tag {
      font-size: var(--fs-label);
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* 主示意图区域 */
    .viewport {
      position: absolute;
      top: 104px;
      left: 56px;
      width: 1488px;
      height: 640px;
    }

    svg.scheme {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 状态控制器 */
    .dock {
      position: absolute;
      bottom: 26px;
      left: 56px;
      right: 56px;
      height: 92px;
      display: grid;
      grid-template-columns: 860px 1fr;
      align-items: center;
      border-top: 1px solid var(--rule);
      gap: 32px;
    }

    .dock-lead {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dock-title {
      font-size: var(--fs-h2);
      font-weight: var(--weight-strong);
      color: var(--model);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dock-title span.focus-pill {
      color: var(--focus);
      font-size: var(--fs-label);
      font-weight: var(--weight-body);
    }

    .dock-desc {
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: var(--lh-copy);
      margin: 0;
    }

    .controls {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 14px;
    }

    .step-btn {
      background: none;
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 8px 16px;
      color: var(--text);
      font-size: var(--fs-label);
      cursor: pointer;
      font-family: inherit;
      transition: background var(--motion-fast), color var(--motion-fast), border-color var(--motion-fast);
    }

    .step-btn:hover {
      border-color: var(--model);
      color: var(--model);
    }

    .step-btn[aria-current="true"] {
      background: var(--model);
      border-color: var(--model);
      color: #fff;
      font-weight: var(--weight-strong);
    }

    .step-btn.act {
      border-color: var(--focus);
      color: var(--focus);
    }

    .step-btn.act:hover {
      background: var(--focus);
      color: #fff;
    }
  </style>
</head>
<body data-page="10" data-total="22">
  <div id="stage">
    <header>
      <h1>质子浓度差驱动合成酶旋转生成 ATP</h1>
    </header>

    <div class="viewport">
      <svg class="scheme" viewBox="0 0 1488 640">
        <defs>
          <marker id="arr-focus" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M1,1 L7,4 L1,7 Z" fill="var(--focus)" />
          </marker>
          <marker id="arr-energy" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M1,1 L7,4 L1,7 Z" fill="var(--energy)" />
          </marker>
          <marker id="arr-model" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M1,1 L7,4 L1,7 Z" fill="var(--model)" />
          </marker>
        </defs>

        <!-- 空间底衬与分隔 -->
        <!-- 类囊体腔（高 H+，低 pH） -->
        <rect x="0" y="0" width="1488" height="240" fill="rgba(33, 99, 63, 0.12)" />
        <text x="36" y="46" fill="var(--model)" font-size="22" font-weight="600">类囊体腔</text>
        <text x="36" y="74" fill="var(--muted)" font-size="16">高 H⁺ 浓度（pH ≈ 5）</text>

        <!-- 类囊体双层脂质膜 -->
        <rect x="0" y="240" width="1488" height="88" fill="rgba(82, 101, 91, 0.22)" stroke="var(--rule)" stroke-width="1.5" />
        <line x1="0" y1="284" x2="1488" y2="284" stroke="var(--rule)" stroke-dasharray="5 5" stroke-width="1" />
        <text x="36" y="290" fill="var(--text)" font-size="16" font-weight="600">类囊体薄膜</text>

        <!-- 叶绿体基质（低 H+，高 pH） -->
        <rect x="0" y="328" width="1488" height="312" fill="rgba(220, 230, 223, 0.4)" />
        <text x="36" y="372" fill="var(--matter)" font-size="22" font-weight="600">叶绿体基质</text>
        <text x="36" y="400" fill="var(--muted)" font-size="16">低 H⁺ 浓度（pH ≈ 8）</text>

        <!-- 左侧对比标尺：膜两侧浓度梯度 -->
        <g transform="translate(420, 40)">
          <!-- 腔内 H+ 密集区 -->
          <g id="lumen-protons" fill="var(--focus)" opacity="0.95">
            <!-- 密集点阵 -->
            <circle cx="20" cy="20" r="13" /><text x="20" y="24" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">H⁺</text>
            <circle cx="70" cy="35" r="13" /><text x="70" y="39" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">H⁺</text>
            <circle cx="120" cy="18" r="13" /><text x="120" y="22" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">H⁺</text>
            <circle cx="45" cy="80" r="13" /><text x="45" y="84" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">H⁺</text>
            <circle cx="95" cy="95" r="13" /><text x="95" y="99" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">H⁺</text>
            <circle cx="145" cy="70" r="13" /><text x="145" y="74" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">H⁺</text>
            <circle cx="20" cy="140" r="13" /><text x="20" y="144" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">H⁺</text>
            <circle cx="70" cy="155" r="13" /><text x="70" y="159" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">H⁺</text>
            <circle cx="125" cy="145" r="13" /><text x="125" y="149" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">H⁺</text>
          </g>
          <text x="80" y="188" fill="var(--focus)" font-size="15" text-anchor="middle" font-weight="600">高质子浓度</text>
        </g>

        <!-- 膜屏障标识：不可自由穿透 -->
        <g transform="translate(420, 252)">
          <line x1="30" y1="32" x2="130" y2="32" stroke="var(--energy)" stroke-width="2" />
          <path d="M70,18 L90,46 M90,18 L70,46" stroke="var(--energy)" stroke-width="2.5" />
          <text x="80" y="66" fill="var(--energy)" font-size="13" text-anchor="middle">膜不透质子</text>
        </g>

        <!-- 基质稀疏区 -->
        <g transform="translate(420, 420)">
          <circle cx="45" cy="50" r="13" fill="var(--focus)" opacity="0.35" /><text x="45" y="54" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">H⁺</text>
          <circle cx="125" cy="100" r="13" fill="var(--focus)" opacity="0.35" /><text x="125" y="104" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">H⁺</text>
          <text x="85" y="140" fill="var(--muted)" font-size="15" text-anchor="middle">低质子浓度</text>
        </g>

        <!-- 中央主机制：ATP 合成酶结构与机械偶联 -->
        <g id="synthase-group" transform="translate(860, 160)">
          <!-- 静态支架 b亚基/定子 -->
          <path d="M-84,90 L-84,280 L-50,290" fill="none" stroke="var(--rule)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
          <text x="-98" y="210" fill="var(--muted)" font-size="15" text-anchor="end">定子支架 (b/δ)</text>

          <!-- F0 转子区 (膜内 c环) -->
          <g id="f0-rotor">
            <rect x="-60" y="80" width="120" height="88" rx="8" fill="var(--model)" stroke="#fff" stroke-width="1.5" />
            <!-- c环亚基柱状切片条纹 -->
            <line x1="-36" y1="80" x2="-36" y2="168" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
            <line x1="-12" y1="80" x2="-12" y2="168" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
            <line x1="12" y1="80" x2="12" y2="168" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
            <line x1="36" y1="80" x2="36" y2="168" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
            <text x="0" y="116" fill="#fff" font-size="16" text-anchor="middle" font-weight="600">F₀ 跨膜通道</text>
          </g>

          <!-- 旋转中心轴 γ/ε 轴 -->
          <g id="central-stalk">
            <rect x="-14" y="168" width="28" height="96" rx="4" fill="var(--focus)" />
            <text x="0" y="222" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">γ轴</text>
          </g>

          <!-- F1 催化核心球体 (α3β3 六聚体) -->
          <g id="f1-head" transform="translate(0, 310)">
            <ellipse cx="0" cy="0" rx="92" ry="72" fill="#E8F1EC" stroke="var(--model)" stroke-width="4" />
            <!-- 三个催化区切分 -->
            <path d="M0,0 L0,-72 M0,0 L76,36 M0,0 L-76,36" stroke="var(--model)" stroke-width="2.5" />
            <text x="0" y="-30" fill="var(--model)" font-size="16" text-anchor="middle" font-weight="600">F₁ 催化头部</text>
            <text x="-36" y="24" fill="var(--muted)" font-size="13" text-anchor="middle">结合位点</text>
            <text x="36" y="24" fill="var(--muted)" font-size="13" text-anchor="middle">催化位点</text>
          </g>

          <!-- H+ 通流路径箭头与粒子 -->
          <g id="flow-path">
            <!-- 腔进入路径 -->
            <path d="M0,-40 L0,76" fill="none" stroke="var(--focus)" stroke-width="3.5" stroke-dasharray="6 4" marker-end="url(#arr-focus)" />
            <!-- 通道至基质释放路径 -->
            <path d="M0,172 L52,224 L68,260" fill="none" stroke="var(--focus)" stroke-width="3.5" stroke-dasharray="6 4" marker-end="url(#arr-focus)" />
          </g>

          <!-- 动态流动质子 -->
          <g id="active-proton" transform="translate(0, -16)">
            <circle cx="0" cy="0" r="16" fill="var(--focus)" stroke="#fff" stroke-width="2" />
            <text x="0" y="5" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">H⁺</text>
          </g>

          <!-- 旋转动作标记指示环 -->
          <g id="spin-indicator" transform="translate(0, 142)">
            <path d="M-36,-6 A38,10 0 0,1 36,-6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr-focus)" />
            <text x="0" y="14" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">旋转中</text>
          </g>

          <!-- 右侧底物与产物生成区 -->
          <g id="reaction-group" transform="translate(140, 310)">
            <!-- 底物 ADP + Pi -->
            <g id="substrates" transform="translate(0, -40)">
              <rect x="0" y="-18" width="130" height="36" rx="6" fill="#fff" stroke="var(--matter)" stroke-width="1.5" />
              <text x="65" y="5" fill="var(--matter)" font-size="15" text-anchor="middle" font-weight="600">ADP + Pi</text>
              <!-- 接入箭头 -->
              <path d="M-4,0 L-42,0" fill="none" stroke="var(--matter)" stroke-width="2.5" marker-end="url(#arr-model)" />
            </g>

            <!-- 能量输入指示 -->
            <path d="M-42,0 L18,22" fill="none" stroke="var(--energy)" stroke-width="2" stroke-dasharray="4 3" />

            <!-- 产物 ATP -->
            <g id="product" transform="translate(0, 42)">
              <rect x="0" y="-20" width="140" height="40" rx="6" fill="var(--energy)" />
              <text x="70" y="6" fill="#fff" font-size="17" text-anchor="middle" font-weight="600">ATP (高能)</text>
              <!-- 产出箭头 -->
              <path d="M-42,0 L-4,0" fill="none" stroke="var(--energy)" stroke-width="2.5" marker-end="url(#arr-energy)" />
              <text x="70" y="38" fill="var(--energy)" font-size="13" text-anchor="middle" font-weight="600">为后续暗反应供能</text>
            </g>
          </g>
        </g>

        <!-- 机制说明微标牌（右侧摘要） -->
        <g transform="translate(1220, 60)">
          <rect x="0" y="0" width="220" height="150" rx="6" fill="#fff" stroke="var(--rule)" stroke-width="1" />
          <text x="20" y="34" fill="var(--text)" font-size="16" font-weight="600">能量转化阶段</text>
          <line x1="20" y1="46" x2="200" y2="46" stroke="var(--rule)" stroke-width="1" />
          <text x="20" y="74" fill="var(--focus)" font-size="15" font-weight="600">1. 质子电化学势</text>
          <text x="20" y="102" fill="var(--model)" font-size="15" font-weight="600">2. 转子机械转动</text>
          <text x="20" y="130" fill="var(--energy)" font-size="15" font-weight="600">3. ATP 磷酸键能</text>
        </g>
      </svg>
    </div>

    <div class="dock">
      <div class="dock-lead">
        <div class="dock-title">
          <span id="step-name">质子电化学势累积</span>
          <span class="focus-pill" id="step-phase">阶段 1 / 3</span>
        </div>
        <p class="dock-desc" id="step-desc">
          光反应裂解水和电子传递将大量 H⁺ 泵入类囊体腔，腔内质子浓度达到基质的近千倍。
        </p>
      </div>
      <div class="controls">
        <button class="step-btn" data-step="0" aria-current="true">1. 势能累积</button>
        <button class="step-btn" data-step="1">2. 驱动旋转</button>
        <button class="step-btn" data-step="2">3. 合成 ATP</button>
        <button class="step-btn act" id="play-btn">自动演示</button>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    在前面的内容中，我们看到水光解产生质子，以及电子传递链将质子从基质泵入类囊体腔。
    现在，类囊体腔内的 H+ 浓度极高，而膜外基质非常低，形成了巨大的化学渗透势能。
    由于脂质膜不可穿透，这些质子只能经由唯一的通道——ATP合成酶的 F0 转子顺浓度流出。
    质子的流动推动 F0 和中央轴高速旋转，机械形变迫使 F1 催化结构将 ADP 和无机磷酸缩合成 ATP。
    这就是光能最终被固定成化学能的关键步骤，为紧接着的暗反应提供动力。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      "use strict";

      Deck.init({ index: 10, total: 22 });

      const STEPS = [
        {
          name: "质子电化学势累积",
          phase: "阶段 1 / 3",
          desc: "光反应裂解水与电子传递使质子大量积聚在类囊体腔，形成跨膜浓度差与电化学势。",
          activeProtonX: 0,
          activeProtonY: -20,
          rotorRotation: 0,
          spinOpacity: 0,
          substrateOpacity: 0.4,
          productOpacity: 0.2
        },
        {
          name: "顺浓度流动与机械旋转",
          phase: "阶段 2 / 3",
          desc: "膜阻隔质子，H⁺ 沿唯一的跨膜通道流入基质，流动力直接驱动 F₀ 环旋转。",
          activeProtonX: 0,
          activeProtonY: 120,
          rotorRotation: 12,
          spinOpacity: 1,
          substrateOpacity: 0.8,
          productOpacity: 0.5
        },
        {
          name: "构象改变合成高能 ATP",
          phase: "阶段 3 / 3",
          desc: "旋转迫使 F₁ 催化头部改变构象，将机械动能转化为化学能，催化生成 ATP。",
          activeProtonX: 58,
          activeProtonY: 240,
          rotorRotation: 24,
          spinOpacity: 1,
          substrateOpacity: 1,
          productOpacity: 1
        }
      ];

      let currentStep = 0;
      let timer = null;

      const stepName = document.getElementById("step-name");
      const stepPhase = document.getElementById("step-phase");
      const stepDesc = document.getElementById("step-desc");
      const stepBtns = document.querySelectorAll(".step-btn[data-step]");
      const playBtn = document.getElementById("play-btn");

      const activeProton = document.getElementById("active-proton");
      const spinIndicator = document.getElementById("spin-indicator");
      const substrates = document.getElementById("substrates");
      const product = document.getElementById("product");
      const f0Rotor = document.getElementById("f0-rotor");
      const centralStalk = document.getElementById("central-stalk");

      function applyStep(index) {
        currentStep = index;
        const data = STEPS[index];

        stepName.textContent = data.name;
        stepPhase.textContent = data.phase;
        stepDesc.textContent = data.desc;

        stepBtns.forEach((btn, i) => {
          btn.setAttribute("aria-current", i === index ? "true" : "false");
        });

        // 动画更新
        if (activeProton) {
          activeProton.setAttribute("transform", `translate(${data.activeProtonX || 0}, ${data.activeProtonY})`);
        }
        if (spinIndicator) {
          spinIndicator.style.opacity = data.spinOpacity;
        }
        if (substrates) {
          substrates.style.opacity = data.substrateOpacity;
        }
        if (product) {
          product.style.opacity = data.productOpacity;
        }
        if (f0Rotor) {
          f0Rotor.setAttribute("transform", `skewX(${data.rotorRotation > 10 ? 3 : 0})`);
        }
        if (centralStalk) {
          centralStalk.setAttribute("transform", `rotate(${data.rotorRotation * 0.4})`);
        }
      }

      stepBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          stopPlay();
          const target = parseInt(btn.getAttribute("data-step"), 10);
          applyStep(target);
        });
      });

      function stopPlay() {
        if (timer) {
          clearInterval(timer);
          timer = null;
          playBtn.textContent = "自动演示";
        }
      }

      function togglePlay() {
        if (timer) {
          stopPlay();
        } else {
          playBtn.textContent = "暂停";
          timer = setInterval(() => {
            const next = (currentStep + 1) % STEPS.length;
            applyStep(next);
          }, 1600);
        }
      }

      playBtn.addEventListener("click", togglePlay);

      // 初态设定
      applyStep(0);
    })();
  </script>
</body>
</html>
