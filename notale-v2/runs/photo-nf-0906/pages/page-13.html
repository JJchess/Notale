<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #DCE6DF;
      --text: #17251E;
      --muted: #52655B;
      --model: #21633F;
      --focus: #E08A16;
      --energy: #A65322;
      --matter: #2E6680;
      --rule: #81968A;
      --font-sans: "Noto Sans SC", "Noto Sans CJK SC", system-ui, sans-serif;
      --font-display: "Noto Sans CJK SC Medium", "Noto Sans SC", sans-serif;
      --font-numeric: "Noto Sans Display", "Noto Sans CJK SC", sans-serif;
    }

    #stage {
      isolation: isolate;
      background-color: var(--bg);
      width: 1600px;
      height: 900px;
      overflow: hidden;
      position: relative;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
    }

    /* 整体构图层 */
    .cover-header {
      position: absolute;
      left: 112px;
      top: 140px;
      z-index: 10;
      pointer-events: none;
      max-width: 620px;
    }

    .cover-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: 600;
      line-height: var(--lh-tight);
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .cover-subtitle {
      margin: 24px 0 0 0;
      font-family: var(--font-sans);
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .cover-subtitle::before {
      content: "";
      display: inline-block;
      width: 32px;
      height: 2px;
      background: var(--model);
      opacity: 0.8;
    }

    /* 右侧卡尔文循环碳固定几何主角 */
    .calvin-graphic {
      position: absolute;
      top: 0;
      right: 0;
      width: 1600px;
      height: 900px;
      z-index: 5;
      pointer-events: none;
    }

    .carrier-tag {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      font-weight: 600;
      fill: var(--text);
    }

    .carrier-sub {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      fill: var(--muted);
    }

    /* 优雅微动：入场平稳收束与呼吸 */
    .ring-orbit {
      transform-origin: 1070px 450px;
      animation: orbit-subtle 40s linear infinite;
    }

    @keyframes orbit-subtle {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ring-orbit {
        animation: none !important;
      }
    }
  </style>
</head>
<body data-page="13" data-total="22">
  <div id="stage">
    <header class="cover-header">
      <h1 class="cover-title">暗反应：把二氧化碳变成有机物</h1>
      <p class="cover-subtitle">碳固定、还原与受体再生的闭合循环</p>
    </header>

    <svg class="calvin-graphic cv-fill" viewBox="0 0 1600 900" role="img" aria-label="暗反应卡尔文循环与碳转化图解">
      <defs>
        <!-- 物质流渐变 (CO2 接入) -->
        <linearGradient id="matter-grad" x1="1070" y1="90" x2="1070" y2="240" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2E6680" stop-opacity="0.1" />
          <stop offset="100%" stop-color="#2E6680" stop-opacity="0.9" />
        </linearGradient>

        <!-- 产物流出渐变 (三碳糖输出) -->
        <linearGradient id="sugar-grad" x1="1260" y1="580" x2="1420" y2="720" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#21633F" stop-opacity="0.9" />
          <stop offset="100%" stop-color="#21633F" stop-opacity="0.15" />
        </linearGradient>

        <!-- 能量汇入渐变 (ATP/NADPH) -->
        <linearGradient id="energy-grad" x1="1380" y1="360" x2="1240" y2="430" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#A65322" stop-opacity="0.2" />
          <stop offset="100%" stop-color="#A65322" stop-opacity="0.9" />
        </linearGradient>

        <!-- 箭头标记定义 -->
        <marker id="arrow-model" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#21633F" />
        </marker>
        <marker id="arrow-matter" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#2E6680" />
        </marker>
        <marker id="arrow-sugar" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#21633F" />
        </marker>
        <marker id="arrow-energy" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#A65322" />
        </marker>
      </defs>

      <!-- 底盘衬线与定轴背景 -->
      <g stroke="#81968A" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,8" fill="none">
        <circle cx="1070" cy="450" r="330" />
        <line x1="740" y1="450" x2="1400" y2="450" />
        <line x1="1070" y1="120" x2="1070" y2="780" />
      </g>

      <!-- 卡尔文循环主轨道 -->
      <circle cx="1070" cy="450" r="230" fill="none" stroke="#21633F" stroke-width="4" stroke-opacity="0.25" />

      <!-- 动态轨道点阵与刻度 (代表三个主要阶段) -->
      <g class="ring-orbit">
        <!-- 阶段一弧线：碳固定 (12点到4点方向) -->
        <path d="M 1070 220 A 230 230 0 0 1 1269 335" fill="none" stroke="#21633F" stroke-width="8" stroke-linecap="round" />
        <!-- 阶段二弧线：还原与糖输出 (4点到8点方向) -->
        <path d="M 1269 335 A 230 230 0 0 1 955 649" fill="none" stroke="#21633F" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8" />
        <!-- 阶段三弧线：受体再生 (8点到12点方向) -->
        <path d="M 955 649 A 230 230 0 0 1 1070 220" fill="none" stroke="#21633F" stroke-width="8" stroke-linecap="round" stroke-opacity="0.5" />
      </g>

      <!-- 循环上的主要生化节点 (碳骨架标识) -->
      <!-- 节点 1：RuBP (五碳受体) 顶部偏左 -->
      <g transform="translate(980, 240)">
        <circle cx="0" cy="0" r="22" fill="#DCE6DF" stroke="#21633F" stroke-width="2.5" />
        <text x="0" y="5" text-anchor="middle" font-family="var(--font-numeric)" font-size="var(--fs-tick)" font-weight="700" fill="#21633F">C5</text>
        <text x="-32" y="-12" class="carrier-sub" text-anchor="end">核酮糖二磷酸 (RuBP)</text>
      </g>

      <!-- 节点 2：3-PGA (三碳中间物) 东北角 -->
      <g transform="translate(1230, 290)">
        <circle cx="0" cy="0" r="22" fill="#DCE6DF" stroke="#21633F" stroke-width="2.5" />
        <text x="0" y="5" text-anchor="middle" font-family="var(--font-numeric)" font-size="var(--fs-tick)" font-weight="700" fill="#21633F">C3</text>
        <text x="32" y="-6" class="carrier-sub" text-anchor="start">3-磷酸甘油酸 (PGA)</text>
      </g>

      <!-- 节点 3：G3P (三碳糖) 东南角 -->
      <g transform="translate(1220, 570)">
        <circle cx="0" cy="0" r="22" fill="#DCE6DF" stroke="#21633F" stroke-width="2.5" />
        <text x="0" y="5" text-anchor="middle" font-family="var(--font-numeric)" font-size="var(--fs-tick)" font-weight="700" fill="#21633F">C3</text>
        <text x="32" y="16" class="carrier-sub" text-anchor="start">磷酸丙糖 (G3P)</text>
      </g>

      <!-- 物质流入：CO2 注入碳固定 -->
      <g>
        <line x1="1070" y1="90" x2="1070" y2="215" stroke="url(#matter-grad)" stroke-width="4" marker-end="url(#arrow-matter)" />
        <circle cx="1070" cy="85" r="14" fill="#2E6680" />
        <text x="1070" y="90" text-anchor="middle" font-family="var(--font-display)" font-size="var(--fs-tick)" font-weight="700" fill="#FFFFFF">C1</text>
        <text x="1092" y="135" class="carrier-tag" fill="#2E6680">CO₂ 汇入</text>
        <text x="1092" y="157" class="carrier-sub">碳固定起始</text>
      </g>

      <!-- 能量汇入：光反应产物推动还原 -->
      <g>
        <path d="M 1390 380 Q 1310 400 1250 425" fill="none" stroke="url(#energy-grad)" stroke-width="3.5" marker-end="url(#arrow-energy)" />
        <text x="1402" y="382" class="carrier-tag" fill="#A65322">ATP + NADPH</text>
        <text x="1402" y="404" class="carrier-sub">光反应供给能量与还原力</text>
      </g>

      <!-- 产物流出：三碳糖输出合成葡萄糖/淀粉 -->
      <g>
        <path d="M 1240 585 Q 1320 630 1390 680" fill="none" stroke="url(#sugar-grad)" stroke-width="4" marker-end="url(#arrow-sugar)" />
        <rect x="1395" y="665" width="118" height="36" rx="4" fill="#21633F" fill-opacity="0.12" stroke="#21633F" stroke-width="1.5" />
        <text x="1454" y="688" text-anchor="middle" class="carrier-tag" fill="#21633F">合成有机物</text>
        <text x="1454" y="722" class="carrier-sub" text-anchor="middle">蔗糖 · 淀粉</text>
      </g>

      <!-- 核心反应场所标识 (叶绿体基质) -->
      <g transform="translate(1070, 450)">
        <text x="0" y="-12" text-anchor="middle" font-family="var(--font-display)" font-size="var(--fs-h2)" font-weight="600" fill="#21633F" letter-spacing="0.05em">叶绿体基质</text>
        <text x="0" y="20" text-anchor="middle" font-family="var(--font-sans)" font-size="var(--fs-label)" fill="#52655B">卡尔文循环场所</text>
      </g>
    </svg>
  </div>

  <aside class="notes" hidden>
    本章进入光合作用的第二阶段——暗反应，也称碳反应或卡尔文循环。
    光反应在类囊体薄膜上捕获了光能，转化为了 ATP 和 NADPH。
    现在，这些能量和还原力进入叶绿体基质，推动二氧化碳固定并转变为有机物。
    我们将依次剖析碳固定、还原产出和受体再生三个关键步骤。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 13, total: 22, keys: false });
  </script>
</body>
</html>
