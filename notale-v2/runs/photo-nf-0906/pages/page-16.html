<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #DCE6DF;
      --text: #17251E;
      --muted: #52655B;
      --model: #21633F;
      --focus: #E08A16;
      --energy: #A65322;
      --matter: #2E6680;
      --rule: #81968A;
      --font-sans: "Noto Sans CJK SC", "Noto Sans SC", system-ui, sans-serif;
    }

    #stage {
      width: 1600px;
      height: 900px;
      padding: 38px 56px;
      box-sizing: border-box;
      position: relative;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
    }

    /* 标题区 */
    header {
      position: absolute;
      top: 38px;
      left: 56px;
      right: 56px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
      line-height: 1.2;
    }

    .core-claim {
      font-size: 16px;
      color: var(--muted);
      margin: 0;
    }

    /* 核心舞台 */
    .calvin-stage {
      position: absolute;
      top: 110px;
      left: 56px;
      width: 1488px;
      height: 650px;
    }

    svg.diagram {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 步骤切换控制栏 */
    .step-nav {
      position: absolute;
      bottom: 34px;
      left: 56px;
      right: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--rule);
      padding-top: 18px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    .step-btn {
      background: transparent;
      border: 1px solid var(--rule);
      color: var(--muted);
      font-size: 15px;
      padding: 7px 18px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 160ms;
      font-family: inherit;
    }

    .step-btn:hover {
      border-color: var(--model);
      color: var(--text);
    }

    .step-btn[aria-current="true"] {
      background: var(--model);
      border-color: var(--model);
      color: #F4F8F5;
      font-weight: 600;
    }

    .status-readout {
      font-size: 15px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .status-readout b {
      color: var(--matter);
      font-weight: 600;
    }

    .status-readout .energy-metric {
      color: var(--energy);
      font-weight: 600;
    }

    /* 图中文字与样式 */
    .label-carbon {
      font-size: 16px;
      font-weight: 600;
      fill: var(--text);
    }

    .label-sub {
      font-size: 13px;
      fill: var(--muted);
    }

    .label-energy {
      font-size: 15px;
      font-weight: 600;
      fill: var(--energy);
    }

    .label-matter {
      font-size: 15px;
      font-weight: 600;
      fill: var(--matter);
    }

    .flow-line {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .active-halo {
      transition: opacity 280ms, stroke-width 280ms;
    }
  </style>
</head>
<body data-page="16" data-total="22">
  <div id="stage">
    <header>
      <h1>还原与产物输出：光反应能量驱动三碳糖生成与分流</h1>
      <p class="core-claim">每固定 3 分子 CO₂，消耗 6 ATP 与 6 NADPH，净输出 1 分子 G3P</p>
    </header>

    <div class="calvin-stage">
      <svg class="diagram" viewBox="0 0 1488 650" aria-label="卡尔文循环还原与三碳糖输出示意图">
        <defs>
          <!-- 箭头定义 -->
          <marker id="arr-model" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M1,1 L7,4 L1,7 Z" fill="#21633F" />
          </marker>
          <marker id="arr-matter" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M1,1 L7,4 L1,7 Z" fill="#2E6680" />
          </marker>
          <marker id="arr-energy" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M1,1 L7,4 L1,7 Z" fill="#A65322" />
          </marker>
          <marker id="arr-focus" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M1,1 L7,4 L1,7 Z" fill="#E08A16" />
          </marker>
        </defs>

        <!-- 背景引导架构：卡尔文循环主圈与分支出口 -->
        <!-- 循环中心水相区标注 -->
        <g opacity="0.85">
          <circle cx="680" cy="320" r="260" fill="none" stroke="#81968A" stroke-width="1.5" stroke-dasharray="4 4" />
          <text x="680" y="315" text-anchor="middle" font-size="20" font-weight="600" fill="#21633F" letter-spacing="1">叶绿体基质·卡尔文循环</text>
          <text x="680" y="342" text-anchor="middle" font-size="14" fill="#52655B">三碳骨架转化与能量耦合</text>
        </g>

        <!-- 节点 1：前序碳固定产物 6 × 3-PGA (18C) -->
        <g id="node-pga" transform="translate(360, 150)">
          <circle id="halo-pga" cx="0" cy="0" r="54" fill="#DCE6DF" stroke="#21633F" stroke-width="2" />
          <!-- 3个碳原子球模型表示 3-PGA -->
          <circle cx="-16" cy="-12" r="8" fill="#21633F" />
          <circle cx="0" cy="-12" r="8" fill="#21633F" />
          <circle cx="16" cy="-12" r="8" fill="#21633F" />
          <text x="0" y="14" text-anchor="middle" class="label-carbon">6 × 3-PGA</text>
          <text x="0" y="30" text-anchor="middle" class="label-sub">3-磷酸甘油酸 (共18碳)</text>
        </g>

        <!-- 碳固定汇入路径指引 -->
        <path d="M220,75 Q295,85 330,120" fill="none" stroke="#21633F" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arr-model)" />
        <text x="210" y="65" font-size="13" fill="#52655B">来自碳固定阶段 (RuBP + CO₂)</text>

        <!-- 反应流动：PGA -> 1,3-BPG (清晰避开中间节点与标注) -->
        <path d="M420,150 L685,150" class="flow-line" stroke="#21633F" marker-end="url(#arr-model)" />

        <!-- 能量投入 1：6 ATP 磷酸化 -->
        <g id="step-atp" transform="translate(550, 75)">
          <rect id="box-atp" x="-75" y="-35" width="150" height="70" rx="6" fill="#DCE6DF" stroke="#A65322" stroke-width="1.5" />
          <text x="0" y="-12" text-anchor="middle" class="label-energy">6 ATP → 6 ADP</text>
          <text x="0" y="8" text-anchor="middle" font-size="13" fill="#52655B">输入高能磷酸基团</text>
          <text x="0" y="25" text-anchor="middle" font-size="13" fill="#A65322">活化为二磷酸中间态</text>
          <path d="M0,35 L0,65" fill="none" stroke="#A65322" stroke-width="2" marker-end="url(#arr-energy)" />
        </g>

        <!-- 中间产物：6 × 1,3-BPG -->
        <g id="node-bpg" transform="translate(745, 150)">
          <circle id="halo-bpg" cx="0" cy="0" r="50" fill="#DCE6DF" stroke="#21633F" stroke-width="2" />
          <circle cx="-16" cy="-10" r="8" fill="#21633F" />
          <circle cx="0" cy="-10" r="8" fill="#21633F" />
          <circle cx="16" cy="-10" r="8" fill="#21633F" />
          <text x="0" y="14" text-anchor="middle" class="label-carbon">6 × 1,3-BPG</text>
          <text x="0" y="30" text-anchor="middle" class="label-sub">中间态 (共18碳)</text>
        </g>

        <!-- 反应流动：BPG -> G3P -->
        <path d="M798,165 C885,200 955,245 985,285" class="flow-line" stroke="#21633F" marker-end="url(#arr-model)" />

        <!-- 能量与还原力投入 2：6 NADPH 还原 -->
        <g id="step-nadph" transform="translate(945, 120)">
          <rect id="box-nadph" x="-85" y="-38" width="170" height="74" rx="6" fill="#DCE6DF" stroke="#E08A16" stroke-width="2" />
          <text x="0" y="-14" text-anchor="middle" font-size="15" font-weight="600" fill="#A65322">6 NADPH → 6 NADP⁺</text>
          <text x="0" y="7" text-anchor="middle" font-size="13" fill="#52655B">+ 6 H⁺，释放 6 Pi</text>
          <text x="0" y="25" text-anchor="middle" font-size="13" font-weight="600" fill="#E08A16">核心供氢与电子还原</text>
          <path d="M-25,36 L-45,72" fill="none" stroke="#E08A16" stroke-width="2" marker-end="url(#arr-focus)" />
        </g>

        <!-- 还原生成物总汇：6 × G3P (18C) -->
        <g id="node-g3p" transform="translate(1010, 330)">
          <rect id="box-g3p" x="-75" y="-50" width="150" height="100" rx="8" fill="#DCE6DF" stroke="#21633F" stroke-width="2" />
          <text x="0" y="-22" text-anchor="middle" class="label-carbon">6 × G3P</text>
          <text x="0" y="-3" text-anchor="middle" font-size="13" font-weight="600" fill="#2E6680">3-磷酸甘油醛 (三碳糖)</text>
          <text x="0" y="16" text-anchor="middle" class="label-sub">共 18 个碳原子</text>
          <text x="0" y="34" text-anchor="middle" font-size="13" fill="#52655B">化学势能升高</text>
        </g>

        <!-- 关键分流岔路：1 G3P 离开，5 G3P 继续循环 -->
        <!-- 分支 A：净产物输出 (1 G3P / 3C) -->
        <path id="path-out" d="M1085,350 Q1220,380 1260,470" class="flow-line" stroke="#2E6680" stroke-width="4" marker-end="url(#arr-matter)" />

        <g id="node-out" transform="translate(1290, 520)">
          <rect id="card-out" x="-115" y="-55" width="230" height="110" rx="8" fill="#DCE6DF" stroke="#2E6680" stroke-width="2" />
          <text x="0" y="-26" text-anchor="middle" font-size="18" font-weight="600" fill="#2E6680">输出：1 × G3P (3碳)</text>
          <text x="0" y="-4" text-anchor="middle" font-size="13" fill="#17251E">脱离循环，运向胞质/叶绿体</text>
          <line x1="-95" y1="8" x2="95" y2="8" stroke="#81968A" stroke-width="0.8" />
          <text x="0" y="27" text-anchor="middle" font-size="13" fill="#52655B">合成 葡萄糖、蔗糖、淀粉</text>
          <text x="0" y="45" text-anchor="middle" font-size="13" fill="#2E6680">（每 2 分子 G3P 合成 1 葡萄糖）</text>
        </g>

        <!-- 分支 B：保留循环以再生受体 (5 G3P / 15C) -->
        <path id="path-recycle" d="M960,380 C880,490 650,560 480,480" class="flow-line" stroke="#21633F" stroke-width="3.5" marker-end="url(#arr-model)" />

        <g id="node-recycle" transform="translate(430, 440)">
          <rect id="card-recycle" x="-90" y="-46" width="180" height="92" rx="8" fill="#DCE6DF" stroke="#21633F" stroke-width="2" />
          <text x="0" y="-18" text-anchor="middle" class="label-carbon">留存：5 × G3P</text>
          <text x="0" y="5" text-anchor="middle" font-size="13" fill="#21633F">共 15 个碳原子</text>
          <text x="0" y="27" text-anchor="middle" class="label-sub">进入第 17 页：受体再生阶段</text>
        </g>

        <!-- 回环指向 RuBP 再生 -->
        <path d="M380,400 C320,340 310,240 340,195" fill="none" stroke="#21633F" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr-model)" />
        <text x="210" y="295" font-size="13" fill="#52655B">重组再生 3 × RuBP (15C)</text>

        <!-- 底部核心核算卡片 -->
        <g transform="translate(680, 565)">
          <rect x="-240" y="-30" width="480" height="58" rx="6" fill="#F4F8F5" stroke="#81968A" stroke-width="1" />
          <text x="0" y="-6" text-anchor="middle" font-size="15" font-weight="600" fill="#17251E">
            碳与能量账目：18 碳输入 = 3 碳净输出 + 15 碳再循环
          </text>
          <text x="0" y="17" text-anchor="middle" font-size="13" fill="#52655B">
            光能经光反应暂存于 ATP 与 NADPH，在还原阶段固化为三碳糖的稳定化学能
          </text>
        </g>
      </svg>
    </div>

    <!-- 交互与切换条 -->
    <nav class="step-nav">
      <div class="btn-group">
        <button class="step-btn" data-step="0" aria-current="true">1. 磷酸化激活</button>
        <button class="step-btn" data-step="1">2. 供氢还原</button>
        <button class="step-btn" data-step="2">3. 产物分流输出</button>
      </div>
      <div class="status-readout" id="readout">
        <span>当前阶段：<b id="step-title">6 分子 3-PGA 消耗 6 ATP 完成活化</b></span>
        <span>能量消耗：<span class="energy-metric" id="step-energy">6 ATP</span></span>
      </div>
    </nav>
  </div>

  <aside class="notes" hidden>
    在碳固定之后，生成的三碳酸3-PGA处于低能氧化态，无法直接合成糖。
    光反应产生的ATP先提供高能磷酸基团将其活化，紧接着NADPH提供氢原子和高能电子完成还原，转变为高能的三碳糖G3P。
    每转动一轮卡尔文循环（固定3个CO₂），总共生成6个G3P分子；
    其中只有1个G3P分子作为净产物运出循环合成蔗糖或淀粉，其余5个G3P必须留在循环中重组再生RuBP受体。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      "use strict";

      const STEPS = [
        {
          title: "6 分子 3-PGA 消耗 6 ATP 完成磷酸化活化",
          energy: "6 ATP",
          focusId: "step-atp",
          activeNodes: ["node-pga", "node-bpg"],
          pathHighlight: "path-atp"
        },
        {
          title: "6 分子 NADPH 提供氢与电子，还原生成 6 分子 G3P",
          energy: "6 ATP + 6 NADPH",
          focusId: "step-nadph",
          activeNodes: ["node-bpg", "node-g3p"],
          pathHighlight: "path-nadph"
        },
        {
          title: "1 分子 G3P 净输出合成糖，5 分子留存再生受体",
          energy: "总计 6 ATP + 6 NADPH",
          focusId: "node-out",
          activeNodes: ["node-g3p", "node-out", "node-recycle"],
          pathHighlight: "path-out"
        }
      ];

      let currentStep = 0;
      const stepButtons = document.querySelectorAll(".step-btn");
      const titleEl = document.getElementById("step-title");
      const energyEl = document.getElementById("step-energy");

      const boxAtp = document.getElementById("box-atp");
      const boxNadph = document.getElementById("box-nadph");
      const cardOut = document.getElementById("card-out");
      const cardRecycle = document.getElementById("card-recycle");
      const pathOut = document.getElementById("path-out");
      const pathRecycle = document.getElementById("path-recycle");

      function applyStep(idx) {
        currentStep = idx;
        const info = STEPS[idx];

        // 按钮状态
        stepButtons.forEach((btn, i) => {
          btn.setAttribute("aria-current", i === idx ? "true" : "false");
        });

        // 文本提示
        titleEl.textContent = info.title;
        energyEl.textContent = info.energy;

        // 视觉高亮调度
        if (idx === 0) {
          boxAtp.setAttribute("stroke-width", "3");
          boxAtp.setAttribute("stroke", "#E08A16");
          boxNadph.setAttribute("stroke-width", "1.5");
          boxNadph.setAttribute("stroke", "#A65322");
          cardOut.setAttribute("stroke-width", "2");
          cardOut.setAttribute("stroke", "#2E6680");
          pathOut.setAttribute("stroke-width", "3");
        } else if (idx === 1) {
          boxAtp.setAttribute("stroke-width", "1.5");
          boxAtp.setAttribute("stroke", "#A65322");
          boxNadph.setAttribute("stroke-width", "3.5");
          boxNadph.setAttribute("stroke", "#E08A16");
          cardOut.setAttribute("stroke-width", "2");
          cardOut.setAttribute("stroke", "#2E6680");
          pathOut.setAttribute("stroke-width", "3");
        } else if (idx === 2) {
          boxAtp.setAttribute("stroke-width", "1.5");
          boxAtp.setAttribute("stroke", "#A65322");
          boxNadph.setAttribute("stroke-width", "1.5");
          boxNadph.setAttribute("stroke", "#A65322");
          cardOut.setAttribute("stroke-width", "3.5");
          cardOut.setAttribute("stroke", "#E08A16");
          pathOut.setAttribute("stroke-width", "5");
          pathOut.setAttribute("stroke", "#E08A16");
        }
      }

      stepButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const step = parseInt(btn.getAttribute("data-step"), 10);
          applyStep(step);
        });
      });

      // 初始化底盘与状态
      Deck.init({ index: 16, total: 22 });
      applyStep(0);
    })();
  </script>
</body>
</html>
