<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #DCE6DF;
      --text: #17251E;
      --muted: #52655B;
      --model: #21633F;
      --focus: #E08A16;
      --energy: #A65322;
      --matter: #2E6680;
      --rule: #81968A;
      --font-sans: "Noto Sans CJK SC", system-ui, sans-serif;
      --font-display: "Noto Sans CJK SC Medium", "Noto Sans CJK SC", sans-serif;
      --font-numeric: "Noto Sans Display", "Noto Sans CJK SC", sans-serif;
    }

    #stage {
      padding: var(--pad-y) var(--pad-x);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 16px;
      box-sizing: border-box;
      color: var(--text);
      font-family: var(--font-sans);
    }

    /* 顶部标题区：严格控字 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-family: var(--font-display);
      font-weight: var(--weight-strong);
      letter-spacing: -0.5px;
    }
    .header-sub {
      font-size: var(--fs-sec);
      color: var(--muted);
    }

    /* 主工作台：左侧大环图，右侧控制与核算 */
    main {
      display: grid;
      grid-template-columns: 960px 1fr;
      gap: 36px;
      align-items: center;
    }

    /* 环图区域 */
    .cycle-panel {
      position: relative;
      width: 960px;
      height: 720px;
    }
    #cycleCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 右侧控制板 */
    .dash-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.35);
    }

    .card h2 {
      margin: 0 0 10px 0;
      font-size: var(--fs-h2);
      font-weight: var(--weight-strong);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 阶段推进按钮 */
    .stepper {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .step-btn {
      appearance: none;
      background: #EDF3EE;
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 12px 14px;
      text-align: left;
      font-family: var(--font-sans);
      font-size: var(--fs-body);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background var(--motion-fast), border-color var(--motion-fast);
    }
    .step-btn:hover {
      background: #F7FAF8;
    }
    .step-btn.active {
      background: #FFF;
      border-color: var(--focus);
      box-shadow: 0 0 0 1px var(--focus);
    }
    .step-btn .tag {
      font-size: var(--fs-label);
      font-family: var(--font-numeric);
      color: var(--muted);
    }
    .step-btn.active .tag {
      color: var(--focus);
      font-weight: var(--weight-strong);
    }

    /* 反应投入执行栏 */
    .action-bar {
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }
    .act-btn {
      flex: 1;
      padding: 12px;
      font-size: var(--fs-body);
      font-weight: var(--weight-strong);
      background: var(--model);
      color: #FFF;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .act-btn:disabled {
      background: var(--rule);
      cursor: not-allowed;
      opacity: 0.6;
    }
    .reset-btn {
      padding: 12px 18px;
      font-size: var(--fs-sec);
      background: transparent;
      border: 1px solid var(--rule);
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
    }

    /* 能量与碳计量核算表 */
    .ledger {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      text-align: center;
    }
    .ledger-item {
      background: rgba(255, 255, 255, 0.5);
      border-radius: 4px;
      padding: 10px 4px;
      border: 1px solid rgba(129, 150, 138, 0.4);
    }
    .ledger-label {
      font-size: var(--fs-label);
      color: var(--muted);
      margin-bottom: 4px;
    }
    .ledger-val {
      font-family: var(--font-numeric);
      font-size: var(--fs-h2);
      font-weight: var(--weight-strong);
      color: var(--text);
    }
    .val-energy { color: var(--energy); }
    .val-matter { color: var(--matter); }

    /* 状态即时说明 */
    .status-msg {
      font-size: var(--fs-sec);
      line-height: var(--lh-copy);
      min-height: 48px;
      color: var(--text);
    }
  </style>
</head>
<body data-page="18" data-total="22">
  <div id="stage">
    <header>
      <h1>卡尔文循环的碳流与能量投入</h1>
      <span class="header-sub">固定 3 个 CO₂ 输出 1 个三碳糖</span>
    </header>

    <main>
      <!-- 反应回路互动视界 -->
      <section class="cycle-panel min0">
        <canvas id="cycleCanvas" class="cv-fill" width="960" height="720"></canvas>
      </section>

      <!-- 交互控制面板 -->
      <section class="dash-panel min0">
        <div class="card">
          <h2>当前反应阶段</h2>
          <div class="stepper">
            <button class="step-btn active" id="btnStep1" data-step="1">
              <span>碳固定：CO₂ 接入五碳分子</span>
              <span class="tag">阶段 1</span>
            </button>
            <button class="step-btn" id="btnStep2" data-step="2">
              <span>还原：消耗 ATP 与 NADPH</span>
              <span class="tag">阶段 2</span>
            </button>
            <button class="step-btn" id="btnStep3" data-step="3">
              <span>受体再生：五碳糖重组与输出</span>
              <span class="tag">阶段 3</span>
            </button>
          </div>
          <div class="action-bar">
            <button class="act-btn" id="runStepBtn">执行当前阶段投入</button>
            <button class="reset-btn" id="resetBtn">重置循环</button>
          </div>
        </div>

        <div class="card">
          <h2>单轮收支核算</h2>
          <div class="ledger">
            <div class="ledger-item">
              <div class="ledger-label">消耗 ATP</div>
              <div class="ledger-val val-energy" id="atpVal">0 / 9</div>
            </div>
            <div class="ledger-item">
              <div class="ledger-label">消耗 NADPH</div>
              <div class="ledger-val val-energy" id="nadphVal">0 / 6</div>
            </div>
            <div class="ledger-item">
              <div class="ledger-label">净输出 G3P</div>
              <div class="ledger-val val-matter" id="g3pVal">0 / 1</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h2>物质状态提示</h2>
          <div class="status-msg" id="statusMsg">
            初始就绪：3 个 RuBP（5C）等待固定 3 个 CO₂。点击“执行当前阶段投入”。
          </div>
        </div>
      </section>
    </main>
  </div>

  <aside class="notes" hidden>
    卡尔文循环每固定3个二氧化碳，需要消耗9个ATP和6个NADPH，最终净输出1个三碳糖分子。通过点击逐步执行固定、还原与再生三阶段，观察碳骨架数量的变化以及能量载体的定向投入。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      // 阶段与核算状态
      const state = {
        step: 1, // 1: 固定, 2: 还原, 3: 再生, 4: 完成
        atp: 0,
        nadph: 0,
        g3pOut: 0,
        rubp: 3,
        pga: 0, // 3-PGA
        g3pTotal: 0
      };

      const cv = document.getElementById("cycleCanvas");
      const ctx = cv.getContext("2d");

      const atpVal = document.getElementById("atpVal");
      const nadphVal = document.getElementById("nadphVal");
      const g3pVal = document.getElementById("g3pVal");
      const statusMsg = document.getElementById("statusMsg");
      const runStepBtn = document.getElementById("runStepBtn");
      const resetBtn = document.getElementById("resetBtn");
      const stepBtns = [
        document.getElementById("btnStep1"),
        document.getElementById("btnStep2"),
        document.getElementById("btnStep3")
      ];

      function updateUI() {
        atpVal.textContent = `${state.atp} / 9`;
        nadphVal.textContent = `${state.nadph} / 6`;
        g3pVal.textContent = `${state.g3pOut} / 1`;

        stepBtns.forEach((btn, idx) => {
          if (state.step === idx + 1) {
            btn.classList.add("active");
          } else {
            btn.classList.remove("active");
          }
        });

        if (state.step === 1) {
          runStepBtn.disabled = false;
          runStepBtn.textContent = "投入 3 个 CO₂ 固定";
          statusMsg.textContent = "阶段 1：Rubisco 催化 3 个 CO₂ 与 3 个 RuBP 结合，生成 6 个 3-PGA。";
        } else if (state.step === 2) {
          runStepBtn.disabled = false;
          runStepBtn.textContent = "投入 6 ATP 与 6 NADPH 还原";
          statusMsg.textContent = "阶段 2：消耗 6 个 ATP 与 6 个 NADPH，还原生成 6 个 G3P。";
        } else if (state.step === 3) {
          runStepBtn.disabled = false;
          runStepBtn.textContent = "输出 1 个 G3P 并投入 3 ATP 再生";
          statusMsg.textContent = "阶段 3：1 个 G3P 离开循环，其余 5 个 G3P 消耗 3 个 ATP 重组为 3 个 RuBP。";
        } else {
          runStepBtn.disabled = true;
          runStepBtn.textContent = "循环闭合完成";
          statusMsg.textContent = "循环成功闭合：净产出 1 个 G3P，3 个 RuBP 完全再生。";
        }

        drawCycle();
      }

      function drawCycle() {
        const w = cv.width;
        const h = cv.height;
        ctx.clearRect(0, 0, w, h);

        const cx = 410;
        const cy = 360;
        const r = 215;

        // 绘制主环路轨道
        ctx.save();
        ctx.strokeStyle = "#ADC4B5";
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();

        // 阶段弧线高亮
        function drawArcHighlight(startAngle, endAngle, color, active) {
          ctx.beginPath();
          ctx.strokeStyle = active ? color : "transparent";
          ctx.lineWidth = active ? 14 : 0;
          ctx.arc(cx, cy, r, startAngle, endAngle);
          ctx.stroke();
        }

        // 弧度划分：
        // 顶部偏左到右上方：阶段 1 (碳固定 - 物质摄入) -0.7π 到 0.1π
        // 右上方到右下方：阶段 2 (还原与输出) 0.1π 到 0.8π
        // 下方到左上方：阶段 3 (再生) 0.8π 到 1.3π
        drawArcHighlight(-0.75 * Math.PI, 0.05 * Math.PI, "#21633F", state.step === 1 || state.step > 1);
        drawArcHighlight(0.05 * Math.PI, 0.75 * Math.PI, "#A65322", state.step === 2 || state.step > 2);
        drawArcHighlight(0.75 * Math.PI, 1.25 * Math.PI, "#2E6680", state.step === 3 || state.step > 3);

        ctx.restore();

        // 绘制各枢纽节点与物质标示
        // 节点 A: RuBP (左上)
        const aX = cx + r * Math.cos(-0.8 * Math.PI);
        const aY = cy + r * Math.sin(-0.8 * Math.PI);

        // 节点 B: 3-PGA (东北偏东)
        const bX = cx + r * Math.cos(0.05 * Math.PI);
        const bY = cy + r * Math.sin(0.05 * Math.PI);

        // 节点 C: G3P (东南偏南)
        const cX = cx + r * Math.cos(0.75 * Math.PI);
        const cY = cy + r * Math.sin(0.75 * Math.PI);

        // 辅助绘制卡片式节点
        function drawNode(x, y, name, sub, highlight) {
          ctx.save();
          ctx.fillStyle = highlight ? "#FFFFFF" : "#EAF0EC";
          ctx.strokeStyle = highlight ? "#E08A16" : "#81968A";
          ctx.lineWidth = highlight ? 3 : 1.5;
          ctx.beginPath();
          ctx.roundRect(x - 80, y - 36, 160, 72, 8);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = "#17251E";
          ctx.font = "bold 18px 'Noto Sans CJK SC', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(name, x, y - 6);

          ctx.fillStyle = "#52655B";
          ctx.font = "15px 'Noto Sans Display', sans-serif";
          ctx.fillText(sub, x, y + 20);
          ctx.restore();
        }

        drawNode(aX, aY, "3 × RuBP", "受体分子 (5C × 3)", state.step === 1);
        drawNode(bX, bY, state.step >= 2 ? "6 × 3-PGA" : "等待生成 3-PGA", "中间产物 (3C × 6)", state.step === 2);
        drawNode(cX, cY, state.step >= 3 ? "6 × G3P" : "等待还原 G3P", "三碳糖 (3C × 6)", state.step === 3);

        // 输入箭头 1: CO2 进入 (顶部接入)
        ctx.save();
        ctx.fillStyle = "#2E6680";
        ctx.strokeStyle = "#2E6680";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx, cy - 320);
        ctx.lineTo(cx, cy - 250);
        ctx.stroke();
        // 箭头
        ctx.beginPath();
        ctx.moveTo(cx - 6, cy - 258);
        ctx.lineTo(cx, cy - 246);
        ctx.lineTo(cx + 6, cy - 258);
        ctx.fill();

        ctx.font = "bold 16px 'Noto Sans CJK SC', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("+ 3 CO₂ (无机碳源)", cx, cy - 330);
        ctx.restore();

        // 能量投入 1: 阶段 2 (6 ATP + 6 NADPH)
        ctx.save();
        ctx.fillStyle = "#A65322";
        ctx.strokeStyle = "#A65322";
        ctx.lineWidth = 3;
        const eX = bX + 85;
        const eY = bY;
        ctx.beginPath();
        ctx.moveTo(eX + 50, eY);
        ctx.lineTo(eX + 10, eY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(eX + 18, eY - 6);
        ctx.lineTo(eX + 6, eY);
        ctx.lineTo(eX + 18, eY + 6);
        ctx.fill();

        ctx.textAlign = "left";
        ctx.font = "bold 15px 'Noto Sans CJK SC', sans-serif";
        ctx.fillText("投入 6 ATP + 6 NADPH", eX + 58, eY + 5);
        ctx.restore();

        // 输出分支: 1 G3P 离开循环 (右下输出)
        ctx.save();
        ctx.fillStyle = "#2E6680";
        ctx.strokeStyle = "#2E6680";
        ctx.lineWidth = 3;
        const outX = cX + 85;
        const outY = cY + 80;
        ctx.beginPath();
        ctx.moveTo(outX - 15, outY - 15);
        ctx.lineTo(outX + 25, outY + 15);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(outX + 16, outY + 15);
        ctx.lineTo(outX + 28, outY + 17);
        ctx.lineTo(outX + 24, outY + 5);
        ctx.fill();

        ctx.textAlign = "left";
        ctx.font = "bold 15px 'Noto Sans CJK SC', sans-serif";
        ctx.fillText("净输出 1 × G3P", outX + 34, outY + 20);
        ctx.restore();

        // 能量投入 2: 阶段 3 (3 ATP 再生)
        ctx.save();
        ctx.fillStyle = "#A65322";
        ctx.strokeStyle = "#A65322";
        ctx.lineWidth = 3;
        const regX = cx - 190;
        const regY = cy + 115;
        ctx.beginPath();
        ctx.moveTo(regX - 45, regY);
        ctx.lineTo(regX - 10, regY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(regX - 18, regY - 6);
        ctx.lineTo(regX - 6, regY);
        ctx.lineTo(regX - 18, regY + 6);
        ctx.fill();

        ctx.textAlign = "right";
        ctx.font = "bold 15px 'Noto Sans CJK SC', sans-serif";
        ctx.fillText("投入 3 ATP (再生受体)", regX - 52, regY + 5);
        ctx.restore();

        // 中心说明标示
        ctx.save();
        ctx.textAlign = "center";
        ctx.fillStyle = "#21633F";
        ctx.font = "bold 22px 'Noto Sans CJK SC', sans-serif";
        ctx.fillText("碳平衡：15C → 18C → 15C", cx, cy - 12);
        ctx.fillStyle = "#52655B";
        ctx.font = "16px 'Noto Sans CJK SC', sans-serif";
        ctx.fillText("3 RuBP + 3 CO₂ → 6 3-PGA", cx, cy + 18);
        ctx.fillText("1 G3P 输出 + 5 G3P 重生受体", cx, cy + 42);
        ctx.restore();
      }

      // 执行推进操作
      runStepBtn.addEventListener("click", () => {
        if (state.step === 1) {
          state.step = 2;
          state.pga = 6;
        } else if (state.step === 2) {
          state.step = 3;
          state.atp += 6;
          state.nadph += 6;
          state.g3pTotal = 6;
        } else if (state.step === 3) {
          state.step = 4;
          state.atp += 3;
          state.g3pOut = 1;
        }
        updateUI();
      });

      // 切换阶段选择（也可直接按步骤点选）
      stepBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          const s = parseInt(btn.dataset.step, 10);
          if (s === 1) {
            state.step = 1;
            state.atp = 0;
            state.nadph = 0;
            state.g3pOut = 0;
          } else if (s === 2) {
            state.step = 2;
            state.atp = 0;
            state.nadph = 0;
            state.g3pOut = 0;
          } else if (s === 3) {
            state.step = 3;
            state.atp = 6;
            state.nadph = 6;
            state.g3pOut = 0;
          }
          updateUI();
        });
      });

      // 重置循环
      resetBtn.addEventListener("click", () => {
        state.step = 1;
        state.atp = 0;
        state.nadph = 0;
        state.g3pOut = 0;
        state.pga = 0;
        state.g3pTotal = 0;
        updateUI();
      });

      // 初始渲染
      updateUI();
    })();
  </script>
</body>
</html>
