<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #D7E4DC;
      --text: #16271F;
      --font-sans: "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
    }

    #stage {
      padding: var(--pad-y) var(--pad-x);
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 960px 660px at 76% 50%, rgba(237, 243, 239, 0.95) 0%, rgba(215, 228, 220, 0.4) 65%, transparent 100%),
        radial-gradient(circle 420px at 86% 20%, rgba(217, 122, 11, 0.14) 0%, transparent 80%);
      color: var(--text);
      overflow: hidden;
      contain: layout paint;
    }

    /* 标题区域 */
    .title-group {
      position: absolute;
      top: 140px;
      left: 112px;
      z-index: 10;
      pointer-events: none;
    }

    .main-title {
      font-family: var(--font-display);
      font-size: 76px;
      font-weight: 700;
      line-height: var(--lh-tight);
      letter-spacing: -0.02em;
      color: var(--model);
      margin: 0 0 24px 0;
    }

    .sub-title {
      font-family: var(--font-sans);
      font-size: var(--fs-h2);
      font-weight: 500;
      line-height: var(--lh-tight);
      color: var(--muted);
      letter-spacing: 0.04em;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .sub-title::before {
      content: "";
      display: inline-block;
      width: 44px;
      height: var(--line-hair);
      background: var(--rule);
    }

    /* 贯穿画面的双通道反应构图 SVG */
    .hero-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* 动效编排 */
    .sunbeam {
      stroke-dasharray: 8 8;
      animation: ray-dash 28s linear infinite;
    }

    .path-light, .path-carbon {
      stroke-dasharray: 12 10;
    }

    .path-light {
      animation: flow-path 14s linear infinite;
    }

    .path-carbon {
      animation: flow-path-rev 16s linear infinite;
    }

    @keyframes flow-path {
      to { stroke-dashoffset: -220; }
    }

    @keyframes flow-path-rev {
      to { stroke-dashoffset: 220; }
    }

    @keyframes ray-dash {
      to { stroke-dashoffset: -320; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sunbeam, .path-light, .path-carbon {
        animation: none !important;
      }
    }
  </style>
</head>
<body data-page="01" data-total="25">
  <div id="stage">
    <!-- 主标题群落 -->
    <header class="title-group">
      <h1 class="main-title">光合作用</h1>
      <p class="sub-title">光反应与暗反应</p>
    </header>

    <!-- 视觉构图：叶绿体切片与双通道反应系统 -->
    <svg class="hero-svg" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 叶绿体外轮廓柔和底面 -->
        <filter id="chloroplast-shadow" x="-5%" y="-5%" width="115%" height="115%">
          <feDropShadow dx="8" dy="16" stdDeviation="28" flood-color="#245E43" flood-opacity="0.10"/>
        </filter>
      </defs>

      <!-- 背景结构：叶绿体双层膜切片大轮廓 -->
      <g filter="url(#chloroplast-shadow)">
        <!-- 叶绿体外膜与内膜边界 -->
        <path d="M 640 100 C 960 70, 1420 180, 1490 470 C 1550 710, 1180 830, 840 810 C 600 790, 520 620, 520 450 C 520 280, 550 110, 640 100 Z"
              fill="var(--surface)" stroke="var(--model-soft)" stroke-width="2" opacity="0.92"/>
        <path d="M 660 125 C 960 98, 1390 200, 1460 470 C 1515 685, 1170 805, 850 785 C 625 768, 545 615, 545 450 C 545 295, 580 135, 660 125 Z"
              stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.65"/>
      </g>

      <!-- 太阳光子能量输入（橙色聚焦进入光反应） -->
      <g opacity="0.85">
        <line class="sunbeam" x1="1260" y1="20" x2="940" y2="290" stroke="var(--focus)" stroke-width="3" stroke-linecap="round"/>
        <line class="sunbeam" x1="1310" y1="40" x2="990" y2="310" stroke="var(--focus)" stroke-width="4.5" stroke-linecap="round"/>
        <line class="sunbeam" x1="1360" y1="70" x2="1040" y2="340" stroke="var(--focus)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="1320" cy="50" r="32" fill="var(--focus)" opacity="0.16"/>
        <circle cx="1320" cy="50" r="14" fill="var(--focus)"/>
      </g>

      <!-- 左侧枢纽：光反应核心 —— 类囊体膜基粒基团 (Thylakoid Granum) -->
      <g transform="translate(680, 290)">
        <!-- 叠摞类囊体薄盘 -->
        <rect x="0" y="0" width="280" height="42" rx="21" fill="var(--model)" opacity="0.95"/>
        <rect x="-12" y="32" width="304" height="42" rx="21" fill="var(--model)"/>
        <rect x="12" y="64" width="276" height="42" rx="21" fill="var(--model)" opacity="0.92"/>
        <rect x="-6" y="96" width="298" height="42" rx="21" fill="var(--model)"/>
        <rect x="8" y="128" width="270" height="42" rx="21" fill="var(--model)" opacity="0.95"/>
        <!-- 基质类囊体连接桥 -->
        <path d="M 280 52 C 340 52, 365 110, 420 110" stroke="var(--model)" stroke-width="12" stroke-linecap="round"/>
        <path d="M 274 115 C 335 115, 360 170, 425 170" stroke="var(--model)" stroke-width="10" stroke-linecap="round"/>
        <!-- 阶段标注 -->
        <text x="140" y="210" fill="var(--model)" font-family="var(--font-sans)" font-size="var(--fs-sec)" font-weight="600" text-anchor="middle" letter-spacing="0.06em">类囊体 · 光反应</text>
      </g>

      <!-- 右侧枢纽：暗反应核心 —— 基质卡尔文循环环系 (Calvin Cycle) -->
      <g transform="translate(1220, 500)">
        <!-- 循环多轨道圆弧与流向 -->
        <circle cx="0" cy="0" r="142" stroke="var(--model-soft)" stroke-width="3" opacity="0.5"/>
        <path d="M -142 0 A 142 142 0 1 1 0 142" stroke="var(--model)" stroke-width="5" stroke-linecap="round"/>
        <polygon points="14,142 -8,132 -8,152" fill="var(--model)"/>
        <!-- 内核深主色锚点 -->
        <circle cx="0" cy="0" r="54" fill="var(--surface)" stroke="var(--rule)" stroke-width="2"/>
        <circle cx="0" cy="0" r="14" fill="var(--model)" opacity="0.8"/>
        <!-- 阶段标注 -->
        <text x="0" y="180" fill="var(--model)" font-family="var(--font-sans)" font-size="var(--fs-sec)" font-weight="600" text-anchor="middle" letter-spacing="0.06em">基质 · 卡尔文循环</text>
      </g>

      <!-- 贯穿两阶段的双通道能量与还原力联结线（ATP / NADPH 循环） -->
      <!-- 上行通路：光反应输出高能物质到暗反应 -->
      <path class="path-light" d="M 970 380 C 1070 350, 1130 395, 1220 415"
            stroke="var(--focus)" stroke-width="var(--line-path)" stroke-linecap="round"/>
      <polygon points="1232,417 1210,409 1216,424" fill="var(--focus)"/>

      <!-- 下行通路：暗反应消耗后返回光反应再生 -->
      <path class="path-carbon" d="M 1200 595 C 1090 650, 1010 590, 955 465"
            stroke="var(--rule)" stroke-width="var(--line-hair)" stroke-linecap="round"/>
      <polygon points="948,454 954,474 967,463" fill="var(--rule)"/>

      <!-- 物质出入端点指引 -->
      <!-- H2O 输入与 O2 释放 -->
      <path d="M 590 475 L 670 410" stroke="var(--rule)" stroke-width="var(--line-hair)" stroke-linecap="round"/>
      <text x="565" y="492" fill="var(--muted)" font-family="var(--font-sans)" font-size="var(--fs-label)" font-weight="500">水与氧气</text>

      <!-- CO2 输入与糖类合成 -->
      <path d="M 1335 625 L 1400 685" stroke="var(--rule)" stroke-width="var(--line-hair)" stroke-linecap="round"/>
      <text x="1410" y="700" fill="var(--muted)" font-family="var(--font-sans)" font-size="var(--fs-label)" font-weight="500">二氧化碳与糖类</text>
    </svg>
  </div>

  <aside class="notes" hidden>
    欢迎来到光合作用专题。这套课程将拆解植物将光能转化为稳定化学能的完整图景。
    光反应在类囊体膜上捕获光子、分解水并产生氧气，同时生成高能载体；暗反应则在叶绿体基质中利用这些能量固定二氧化碳，合成糖类。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 1, total: 25, keys: false });
  </script>
</body>
</html>
