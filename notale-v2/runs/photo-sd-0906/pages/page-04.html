<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #D7E4DC;
      --surface: #EDF3EF;
      --text: #16271F;
      --muted: #506359;
      --rule: #758A7E;
      --model: #245E43;
      --model-soft: #A9C5B4;
      --focus: #D97A0B;
      --on-model: #F5F8F6;
      --on-focus: #1D241F;
      --font-display: "Noto Sans CJK SC Medium", "WenQuanYi Zen Hei", sans-serif;
      --font-sans: "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
      --font-numeric: "Noto Sans Mono", "文泉驿等宽正黑", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    #stage {
      width: 1600px;
      height: 900px;
      position: relative;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      padding: 38px 56px;
      overflow: hidden;
    }

    header {
      position: absolute;
      top: 36px;
      left: 56px;
      right: 56px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 34px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .subtitle {
      font-size: 16px;
      color: var(--muted);
      font-family: var(--font-sans);
    }

    /* 主图布局 */
    .coupling-stage {
      position: absolute;
      top: 110px;
      left: 56px;
      width: 1488px;
      height: 730px;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* SVG 内部排版样式 */
    .domain-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 500;
      fill: var(--text);
    }

    .domain-sub {
      font-family: var(--font-sans);
      font-size: 15px;
      fill: var(--muted);
    }

    .node-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 500;
    }

    .node-detail {
      font-family: var(--font-sans);
      font-size: 15px;
    }

    .node-chem {
      font-family: var(--font-numeric);
      font-size: 16px;
      font-weight: 600;
    }

    .channel-label {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 500;
      fill: var(--text);
    }

    .channel-sub {
      font-family: var(--font-sans);
      font-size: 15px;
      fill: var(--muted);
    }

    .pill-text {
      font-family: var(--font-numeric);
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body data-page="04" data-total="25">
  <div id="stage">
    <header>
      <h1>光反应提供能量与还原力，暗反应完成碳固定与转化</h1>
    </header>

    <div class="coupling-stage">
      <svg viewBox="0 0 1488 730" aria-label="光反应与暗反应的耦联模型">
        <defs>
          <marker id="arr-focus" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 1 1.5 L 8 5 L 1 8.5 z" fill="var(--focus)" />
          </marker>
          <marker id="arr-model" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 1 1.5 L 8 5 L 1 8.5 z" fill="var(--model)" />
          </marker>
        </defs>

        <!-- 背景连接主干管道 (贯穿双通道) -->
        <g id="reaction-conduits">
          <!-- 上方供给管道：光反应 -> 暗反应 -->
          <path d="M 450 350 L 1030 350" fill="none" stroke="var(--focus)" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-focus)" />
          <!-- 下方回流管道：暗反应 -> 光反应 -->
          <path d="M 1030 520 L 450 520" fill="none" stroke="var(--model)" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-model)" />
        </g>

        <!-- 左侧：光反应 (类囊体薄膜) -->
        <g id="light-domain" transform="translate(40, 20)">
          <rect x="0" y="0" width="410" height="670" rx="16" fill="var(--surface)" stroke="var(--model-soft)" stroke-width="2" />
          
          <text x="32" y="46" class="domain-title">光反应</text>
          <text x="32" y="72" class="domain-sub">场所：类囊体薄膜</text>

          <!-- 输入：光能 -->
          <g transform="translate(32, 100)">
            <rect x="0" y="0" width="346" height="66" rx="10" fill="#FFF7ED" stroke="var(--focus)" stroke-width="2" />
            <text x="20" y="32" class="node-title" fill="var(--focus)">光能输入</text>
            <text x="20" y="54" class="node-detail" fill="var(--muted)">光系统激发电子</text>
          </g>

          <!-- 反应：水光解 -->
          <g transform="translate(32, 186)">
            <rect x="0" y="0" width="346" height="76" rx="10" fill="#FFFFFF" stroke="var(--rule)" stroke-width="1.5" />
            <text x="20" y="30" class="node-title" fill="var(--text)">水的光解</text>
            <text x="20" y="56" class="node-chem" fill="var(--model)">2H₂O → O₂↑ + 4H⁺ + 4e⁻</text>
          </g>

          <!-- 产物：氧气 -->
          <g transform="translate(32, 282)">
            <rect x="0" y="0" width="346" height="70" rx="10" fill="var(--surface)" stroke="var(--model)" stroke-width="1.5" />
            <text x="20" y="30" class="node-title" fill="var(--model)">副产物释放</text>
            <text x="20" y="54" class="node-chem" fill="var(--text)">O₂ 释放至细胞外</text>
          </g>

          <!-- 输出产物 (连接供给通道) -->
          <g transform="translate(32, 372)">
            <rect x="0" y="0" width="346" height="268" rx="12" fill="var(--model)" />
            <text x="24" y="38" class="node-title" fill="var(--on-model)">输出产物</text>
            <text x="24" y="66" class="node-detail" fill="var(--model-soft)">能量与还原力供给</text>

            <g transform="translate(24, 88)">
              <rect x="0" y="0" width="298" height="72" rx="8" fill="#1C4B35" />
              <text x="20" y="32" class="pill-text" fill="var(--focus)">ATP</text>
              <text x="20" y="56" class="node-detail" fill="var(--on-model)">高能磷酸键储存能量</text>
            </g>

            <g transform="translate(24, 176)">
              <rect x="0" y="0" width="298" height="72" rx="8" fill="#1C4B35" />
              <text x="20" y="32" class="pill-text" fill="var(--focus)">NADPH</text>
              <text x="20" y="56" class="node-detail" fill="var(--on-model)">提供还原力 [H] 与电子</text>
            </g>
          </g>
        </g>

        <!-- 中间：双通道载体说明 (浮动在管道上的卡片) -->
        <g id="middle-conduits" transform="translate(500, 20)">
          <!-- 供给载体卡片 (对应 Y=350 管道) -->
          <g transform="translate(0, 305)">
            <rect x="0" y="0" width="480" height="90" rx="12" fill="#FFFFFF" stroke="var(--focus)" stroke-width="2" />
            <text x="24" y="32" class="channel-label">能量与还原力供给</text>
            <text x="24" y="56" class="channel-sub">ATP 提供化学能，NADPH 提供氢与高能电子</text>
            <text x="24" y="78" class="pill-text" fill="var(--focus)">ATP + NADPH  →</text>
          </g>

          <!-- 回流再生产物卡片 (对应 Y=520 管道) -->
          <g transform="translate(0, 475)">
            <rect x="0" y="0" width="480" height="90" rx="12" fill="#FFFFFF" stroke="var(--model)" stroke-width="2" />
            <text x="24" y="32" class="channel-label">原料载体回流循环</text>
            <text x="24" y="56" class="channel-sub">暗反应消耗后返回类囊体薄膜重新再生</text>
            <text x="24" y="78" class="pill-text" fill="var(--model)">←  ADP + Pi  /  NADP⁺</text>
          </g>
        </g>

        <!-- 右侧：暗反应 (卡尔文循环 / 基质) -->
        <g id="dark-domain" transform="translate(1038, 20)">
          <rect x="0" y="0" width="410" height="670" rx="16" fill="var(--surface)" stroke="var(--model-soft)" stroke-width="2" />

          <text x="32" y="46" class="domain-title">暗反应（卡尔文循环）</text>
          <text x="32" y="72" class="domain-sub">场所：叶绿体基质</text>

          <!-- 步骤1：CO2固定 -->
          <g transform="translate(32, 100)">
            <rect x="0" y="0" width="346" height="88" rx="10" fill="#FFFFFF" stroke="var(--rule)" stroke-width="1.5" />
            <text x="20" y="30" class="node-title" fill="var(--text)">二氧化碳固定</text>
            <text x="20" y="56" class="node-chem" fill="var(--model)">CO₂ + C₅ (RuBP) → 2 C₃</text>
            <text x="20" y="76" class="node-detail" fill="var(--muted)">由 Rubisco 酶催化</text>
          </g>

          <!-- 步骤2：C3还原 (核心) -->
          <g transform="translate(32, 208)">
            <rect x="0" y="0" width="346" height="108" rx="10" fill="#FFF7ED" stroke="var(--focus)" stroke-width="2" />
            <text x="20" y="30" class="node-title" fill="var(--focus)">三碳化合物还原</text>
            <text x="20" y="56" class="node-chem" fill="var(--text)">2 C₃ → 糖类</text>
            <text x="20" y="78" class="node-detail" fill="var(--muted)">消耗 ATP 供能与 NADPH 还原</text>
          </g>

          <!-- 步骤3：有机物产出 -->
          <g transform="translate(32, 336)">
            <rect x="0" y="0" width="346" height="78" rx="10" fill="#FFFFFF" stroke="var(--model)" stroke-width="1.5" />
            <text x="20" y="30" class="node-title" fill="var(--model)">有机物产出</text>
            <text x="20" y="56" class="node-chem" fill="var(--text)">(CH₂O) 淀粉 / 蔗糖</text>
            <text x="20" y="74" class="node-detail" fill="var(--muted)">储能高分子糖类化合物</text>
          </g>

          <!-- 步骤4：C5再生 -->
          <g transform="translate(32, 434)">
            <rect x="0" y="0" width="346" height="206" rx="12" fill="var(--model)" />
            <text x="24" y="38" class="node-title" fill="var(--on-model)">C₅ 受体再生与循环</text>
            <text x="24" y="66" class="node-detail" fill="var(--model-soft)">消耗 ATP 再生 RuBP 受体</text>
            
            <g transform="translate(20, 88)">
              <rect x="0" y="0" width="306" height="46" rx="8" fill="#1C4B35" />
              <text x="16" y="28" class="node-chem" fill="var(--on-model)">部分磷酸丙糖再生为 RuBP</text>
            </g>

            <g transform="translate(20, 144)">
              <rect x="0" y="0" width="306" height="46" rx="8" fill="#1C4B35" />
              <text x="16" y="28" class="pill-text" fill="var(--model-soft)">释放 ADP 与 Pi 回流</text>
            </g>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <aside class="notes" hidden>
    本节梳理光反应与暗反应的总体联系。
    左侧光反应在类囊体薄膜上进行，利用光能水解水分子释放氧气，同时生成高能载体 ATP 与强还原剂 NADPH。
    右侧暗反应在叶绿体基质中进行，利用光反应输送的能量与还原力，将固定的二氧化碳还原为有机糖类。
    消耗后的 ADP、Pi 以及 NADP+ 重新返回类囊体循环使用，构成了两阶段密不可分的物质循环与能量耦联系统。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 4, total: 25, keys: false });
  </script>
</body>
</html>
