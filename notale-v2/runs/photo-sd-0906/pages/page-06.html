<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>光反应</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #D7E4DC;
      --text: #16271F;
      --font-sans: "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
    }

    /* 结构网格与背景基底 */
    .base-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* 标题区块：极简、清晰、保留留白，字阶严谨 */
    .title-group {
      position: absolute;
      left: 108px;
      top: 180px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    .title-h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: 700;
      line-height: var(--lh-tight);
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .title-sub {
      margin-top: 24px;
      font-size: var(--fs-h2);
      color: var(--model);
      font-weight: 500;
      line-height: var(--lh-tight);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .title-sub::before {
      content: "";
      display: inline-block;
      width: 36px;
      height: var(--line-hair);
      background: var(--rule);
    }

    .core-claim {
      margin-top: 18px;
      font-size: var(--fs-lead);
      color: var(--muted);
      line-height: var(--lh-copy);
      max-width: 360px;
    }

    /* 章节导引提示 */

    /* 类囊体膜与光反应图解 SVG 主视觉 */
    .membrane-svg {
      position: absolute;
      inset: 0;
      width: 1600px;
      height: 900px;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body data-page="06" data-total="25">
  <main id="stage" role="region" aria-label="光反应章节标题页">
    <!-- 背景流线与膜结构网格 -->
    <svg class="membrane-svg" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 光束渐变：太阳橙 -->
        <linearGradient id="photonBeam" x1="740" y1="130" x2="810" y2="440" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#D97A0B" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#D97A0B" stop-opacity="0.2"/>
        </linearGradient>

        <!-- 膜双层渐变 -->
        <linearGradient id="membraneGrad" x1="600" y1="460" x2="1520" y2="460" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#EDF3EF" stop-opacity="0.4"/>
          <stop offset="30%" stop-color="#EDF3EF" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#EDF3EF" stop-opacity="0.6"/>
        </linearGradient>

        <linearGradient id="electronFlow" x1="810" y1="450" x2="1420" y2="470" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#245E43"/>
          <stop offset="50%" stop-color="#245E43"/>
          <stop offset="100%" stop-color="#D97A0B"/>
        </linearGradient>
      </defs>

      <!-- 类囊体双层膜带背景 -->
      <path d="M 520 440 Q 860 425, 1100 440 T 1560 450 L 1560 515 Q 1200 505, 860 520 T 520 510 Z"
            fill="url(#membraneGrad)" stroke="var(--model-soft)" stroke-width="1.5"/>

      <!-- 磷脂小圆点排布（质朴的手绘切片纹理） -->
      <g stroke="var(--rule)" stroke-width="1.5" opacity="0.4" fill="none">
        <!-- 上层磷脂分子头部 -->
        <circle cx="560" cy="438" r="3"/>
        <circle cx="590" cy="436" r="3"/>
        <circle cx="620" cy="435" r="3"/>
        <circle cx="650" cy="434" r="3"/>
        <circle cx="680" cy="433" r="3"/>
        <circle cx="710" cy="433" r="3"/>
        <circle cx="870" cy="434" r="3"/>
        <circle cx="960" cy="438" r="3"/>
        <circle cx="1095" cy="442" r="3"/>
        <circle cx="1170" cy="443" r="3"/>
        <circle cx="1330" cy="446" r="3"/>
        <circle cx="1360" cy="447" r="3"/>
        <circle cx="1470" cy="450" r="3"/>
        <circle cx="1500" cy="450" r="3"/>
        <circle cx="1530" cy="450" r="3"/>

        <!-- 下层磷脂分子头部 -->
        <circle cx="560" cy="512" r="3"/>
        <circle cx="590" cy="513" r="3"/>
        <circle cx="620" cy="514" r="3"/>
        <circle cx="650" cy="515" r="3"/>
        <circle cx="680" cy="516" r="3"/>
        <circle cx="710" cy="517" r="3"/>
        <circle cx="870" cy="518" r="3"/>
        <circle cx="960" cy="515" r="3"/>
        <circle cx="1095" cy="510" r="3"/>
        <circle cx="1170" cy="508" r="3"/>
        <circle cx="1330" cy="505" r="3"/>
        <circle cx="1360" cy="504" r="3"/>
        <circle cx="1470" cy="504" r="3"/>
        <circle cx="1500" cy="504" r="3"/>
        <circle cx="1530" cy="505" r="3"/>
      </g>

      <!-- 光系统 II (PS II) 复合体柱状主体 -->
      <g>
        <rect x="740" y="375" width="116" height="190" rx="10" fill="var(--model)" stroke="var(--model)" stroke-width="2"/>
        <!-- 叶绿素中心与吸光标记 -->
        <circle cx="798" cy="430" r="22" fill="var(--focus)"/>
        <text x="798" y="525" fill="var(--on-model)" font-size="16" font-family="var(--font-numeric)" text-anchor="middle" font-weight="600">PS II</text>
        <text x="798" y="436" fill="var(--on-focus)" font-size="13" font-family="var(--font-sans)" text-anchor="middle" font-weight="700">P680</text>
      </g>

      <!-- 质体醌 PQ 传递载体 -->
      <g>
        <circle cx="920" cy="460" r="18" fill="var(--surface)" stroke="var(--rule)" stroke-width="2"/>
        <text x="920" y="465" fill="var(--text)" font-size="13" font-family="var(--font-numeric)" text-anchor="middle" font-weight="600">PQ</text>
      </g>

      <!-- 细胞色素 b6f 复合体 -->
      <g>
        <rect x="990" y="390" width="86" height="160" rx="8" fill="var(--surface)" stroke="var(--model)" stroke-width="2.5"/>
        <text x="1033" y="475" fill="var(--model)" font-size="15" font-family="var(--font-sans)" text-anchor="middle" font-weight="600">Cyt b₆f</text>
      </g>

      <!-- 质体蓝素 PC 传递载体 -->
      <g>
        <circle cx="1135" cy="535" r="18" fill="var(--surface)" stroke="var(--rule)" stroke-width="2"/>
        <text x="1135" y="540" fill="var(--text)" font-size="13" font-family="var(--font-numeric)" text-anchor="middle" font-weight="600">PC</text>
      </g>

      <!-- 光系统 I (PS I) 复合体 -->
      <g>
        <rect x="1200" y="375" width="110" height="190" rx="10" fill="var(--model)" stroke="var(--model)" stroke-width="2"/>
        <circle cx="1255" cy="430" r="20" fill="var(--focus)" opacity="0.9"/>
        <text x="1255" y="525" fill="var(--on-model)" font-size="16" font-family="var(--font-numeric)" text-anchor="middle" font-weight="600">PS I</text>
        <text x="1255" y="436" fill="var(--on-focus)" font-size="13" font-family="var(--font-sans)" text-anchor="middle" font-weight="700">P700</text>
      </g>

      <!-- ATP 合成酶转子复合体 -->
      <g>
        <rect x="1390" y="425" width="60" height="95" rx="6" fill="var(--surface)" stroke="var(--model)" stroke-width="2.5"/>
        <circle cx="1420" cy="355" r="34" fill="var(--surface)" stroke="var(--model)" stroke-width="2.5"/>
        <text x="1420" y="360" fill="var(--model)" font-size="15" font-family="var(--font-sans)" text-anchor="middle" font-weight="700">CF₁</text>
        <text x="1420" y="480" fill="var(--muted)" font-size="13" font-family="var(--font-numeric)" text-anchor="middle">CF₀</text>
      </g>

      <!-- 太阳光子射入路径 (粗橙色光柱带聚焦点) -->
      <g>
        <line x1="680" y1="120" x2="792" y2="415" stroke="url(#photonBeam)" stroke-width="7" stroke-linecap="round"/>
        <line x1="702" y1="116" x2="798" y2="415" stroke="#D97A0B" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6"/>
        <!-- 聚焦光晕环 -->
        <circle cx="798" cy="430" r="38" stroke="var(--focus)" stroke-width="1.5" stroke-dasharray="5 5" fill="none" opacity="0.75"/>
        <!-- 光子能量标注 -->
        <text x="700" y="105" fill="var(--focus)" font-size="15" font-weight="700" font-family="var(--font-sans)">hν 光能输入</text>
      </g>

      <!-- 电子传递路径 (高能流动双通道线) -->
      <path d="M 798 430 C 840 330, 890 380, 920 442 C 950 500, 970 470, 1033 440 C 1080 420, 1100 520, 1135 520 C 1170 520, 1210 400, 1255 430 C 1290 440, 1310 390, 1350 370"
            fill="none" stroke="url(#electronFlow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 5"/>

      <!-- H+ 跨膜穿梭轨迹箭头提示 -->
      <g stroke="var(--model)" stroke-width="2.5" fill="none" stroke-linecap="round">
        <!-- 基质进类囊体腔 -->
        <path d="M 1033 340 L 1033 590"/>
        <polyline points="1026,578 1033,594 1040,578"/>
        <!-- 回流驱动合成 -->
        <path d="M 1420 595 L 1420 300"/>
        <polyline points="1413,312 1420,296 1427,312"/>
      </g>

      <!-- 质子标记 -->
      <text x="1045" y="335" fill="var(--model)" font-size="15" font-family="var(--font-numeric)" font-weight="600">H⁺ 泵入</text>
      <text x="1432" y="295" fill="var(--model)" font-size="15" font-family="var(--font-numeric)" font-weight="600">H⁺ 顺浓度回流</text>

      <!-- 终产物直接标注在路径末端 -->
      <text x="1330" y="350" fill="var(--model)" font-size="15" font-family="var(--font-sans)" font-weight="700">NADPH</text>
      <text x="1465" y="360" fill="var(--model)" font-size="15" font-family="var(--font-sans)" font-weight="700">ATP</text>

      <!-- 基质与类囊体腔两界标注 -->
      <text x="510" y="360" fill="var(--muted)" font-size="15" font-family="var(--font-sans)">基质侧（低 H⁺）</text>
      <text x="510" y="620" fill="var(--muted)" font-size="15" font-family="var(--font-sans)">类囊体腔（高 H⁺）</text>
    </svg>

    <!-- 标题与导引文字 -->
    <header class="title-group">
      <h1 class="title-h1">光反应</h1>
      <div class="title-sub">类囊体膜上的能量捕获与转换</div>
      <div class="core-claim">光能激发电子并分解水，在膜两侧建立质子梯度，生成 ATP 与 NADPH。</div>
    </header>
  </main>

  <aside class="notes" hidden>
    这一章进入光反应。光反应发生在叶绿体的类囊体膜上。
    它的核心使命是将光能转化为化学能：叶绿素吸收光子激发高能电子，通过水的光解释放氧气，并借助电子传递链建立膜内外质子梯度，最终生成 ATP 和 NADPH，为暗反应提供源源不断的驱动力。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 6, total: 25, keys: false });
  </script>
</body>
</html>
