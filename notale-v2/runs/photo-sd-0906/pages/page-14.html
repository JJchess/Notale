<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --stage-w: 1600px;
      --stage-h: 900px;
    }
    #stage {
      position: relative;
      width: 1600px;
      height: 900px;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      background: var(--bg);
      overflow: hidden;
      contain: layout paint;
    }
    .cover-copy {
      position: absolute;
      top: 240px;
      left: 112px;
      z-index: 10;
      max-width: 480px;
      pointer-events: none;
    }
    .cover-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: 600;
      line-height: var(--lh-tight);
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .cover-title span {
      display: block;
      color: var(--model);
      font-size: 58px;
      margin-top: 12px;
    }
    .cover-sub {
      margin: 32px 0 0;
      font-family: var(--font-sans);
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      max-width: 420px;
    }
    .scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    .settle-group {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 900ms var(--motion-ease), opacity 900ms var(--motion-ease);
    }
    .cycle-halo {
      opacity: 0.15;
    }
    .pulse-glow {
      animation: pulse-flux 6s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes pulse-flux {
      0% { opacity: 0.25; transform: scale(0.985); }
      100% { opacity: 0.45; transform: scale(1.015); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse-glow {
        animation: none !important;
      }
    }
    .stage-card {
      font-family: var(--font-sans);
      font-size: 15px;
      fill: var(--text);
    }
    .stage-card-num {
      font-family: var(--font-numeric);
      font-weight: bold;
      font-size: 14px;
      fill: var(--on-model);
    }
  </style>
</head>
<body data-page="14" data-total="25">
  <div id="stage">
    <header class="cover-copy">
      <h1 class="cover-title">
        暗反应
        <span>卡尔文循环</span>
      </h1>
      <p class="cover-sub">以光反应能量为动力，在基质中将二氧化碳连续还原并再生受体。</p>
    </header>

    <svg class="scene" viewBox="0 0 1600 900" aria-hidden="true">
      <defs>
        <!-- 环形流向渐变 -->
        <linearGradient id="calvin-grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#245E43" />
          <stop offset="50%" stop-color="#3A7E5E" />
          <stop offset="100%" stop-color="#245E43" />
        </linearGradient>
        <radialGradient id="matrix-glow" cx="72%" cy="50%" r="42%">
          <stop offset="0%" stop-color="#EDF3EF" stop-opacity="0.8" />
          <stop offset="55%" stop-color="#D7E4DC" stop-opacity="0.4" />
          <stop offset="100%" stop-color="#D7E4DC" stop-opacity="0" />
        </radialGradient>
        <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="8" />
        </filter>
        <marker id="arrow-model" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 1 2 L 8 5 L 1 8 z" fill="#245E43" />
        </marker>
        <marker id="arrow-focus" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 1 2 L 8 5 L 1 8 z" fill="#D97A0B" />
        </marker>
      </defs>

      <!-- 基质环境底衬 -->
      <ellipse cx="1120" cy="450" rx="380" ry="380" fill="url(#matrix-glow)" />

      <!-- 主循环轨道组 -->
      <g class="settle-group" transform="translate(0, 0)">
        <!-- 循环光晕外轮廓 -->
        <circle cx="1120" cy="450" r="250" fill="none" stroke="#A9C5B4" stroke-width="24" class="cycle-halo pulse-glow" />

        <!-- 主循环三大弧线（碳固定、还原阶段、受体再生） -->
        <!-- 弧 1: 顶到右下 (碳固定 -> 还原) 270deg to 30deg (角度参考：以顶部为起点) -->
        <path d="M 1120 200 A 250 250 0 0 1 1336 575" fill="none" stroke="#245E43" stroke-width="6" marker-end="url(#arrow-model)" />
        
        <!-- 弧 2: 右下到左下 (还原 -> 再生/输出) -->
        <path d="M 1336 575 A 250 250 0 0 1 904 575" fill="none" stroke="#245E43" stroke-width="6" marker-end="url(#arrow-model)" />

        <!-- 弧 3: 左下回到顶 (受体再生 -> RuBP) -->
        <path d="M 904 575 A 250 250 0 0 1 1120 200" fill="none" stroke="#245E43" stroke-width="6" marker-end="url(#arrow-model)" />

        <!-- 外部物质输入：CO2 进入碳固定 (太阳橙/焦点色能量与物质入口) -->
        <path d="M 1120 80 L 1120 188" fill="none" stroke="#758A7E" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#arrow-model)" />
        <rect x="1075" y="46" width="90" height="34" rx="6" fill="#EDF3EF" stroke="#758A7E" stroke-width="1.5" />
        <text x="1120" y="70" text-anchor="middle" fill="#16271F" font-family="var(--font-sans)" font-size="var(--fs-sec)" font-weight="600">CO₂ 输入</text>

        <!-- 光反应产物供给入口 (ATP & NADPH) -->
        <path d="M 1430 330 L 1320 395" fill="none" stroke="#D97A0B" stroke-width="4" marker-end="url(#arrow-focus)" />
        <rect x="1400" y="295" width="145" height="38" rx="6" fill="#EDF3EF" stroke="#D97A0B" stroke-width="2" />
        <text x="1472" y="320" text-anchor="middle" fill="#D97A0B" font-family="var(--font-numeric)" font-size="var(--fs-label)" font-weight="bold">ATP + NADPH</text>

        <!-- 产物输出支流 (三碳糖输出) -->
        <path d="M 1120 700 L 1120 790" fill="none" stroke="#245E43" stroke-width="4" marker-end="url(#arrow-model)" />
        <rect x="1055" y="796" width="130" height="38" rx="6" fill="#245E43" />
        <text x="1120" y="821" text-anchor="middle" fill="#F5F8F6" font-family="var(--font-sans)" font-size="var(--fs-sec)" font-weight="600">合成有机物原料</text>

        <!-- 节点 1：碳固定 -->
        <g transform="translate(1120, 200)">
          <circle cx="0" cy="0" r="18" fill="#245E43" />
          <text x="0" y="5" text-anchor="middle" class="stage-card-num" font-size="var(--fs-tick)">1</text>
          <text x="32" y="-6" font-family="var(--font-display)" font-size="var(--fs-h2)" font-weight="600" fill="#16271F">碳固定</text>
          <text x="32" y="18" font-family="var(--font-sans)" font-size="var(--fs-label)" fill="#506359">CO₂ 结合五碳受体</text>
        </g>

        <!-- 节点 2：三碳化合物还原 -->
        <g transform="translate(1336, 575)">
          <circle cx="0" cy="0" r="18" fill="#245E43" />
          <text x="0" y="5" text-anchor="middle" class="stage-card-num" font-size="var(--fs-tick)">2</text>
          <text x="32" y="2" font-family="var(--font-display)" font-size="var(--fs-h2)" font-weight="600" fill="#16271F">还原阶段</text>
          <text x="32" y="25" font-family="var(--font-sans)" font-size="var(--fs-label)" fill="#506359">形成三碳糖磷酸</text>
        </g>

        <!-- 节点 3：受体再生 -->
        <g transform="translate(904, 575)">
          <circle cx="0" cy="0" r="18" fill="#245E43" />
          <text x="0" y="5" text-anchor="middle" class="stage-card-num" font-size="var(--fs-tick)">3</text>
          <text x="-32" y="2" text-anchor="end" font-family="var(--font-display)" font-size="var(--fs-h2)" font-weight="600" fill="#16271F">受体再生</text>
          <text x="-32" y="25" text-anchor="end" font-family="var(--font-sans)" font-size="var(--fs-label)" fill="#506359">消耗 ATP 恢复循环</text>
        </g>

        <!-- 中心微注 -->
        <text x="1120" y="442" text-anchor="middle" font-family="var(--font-display)" font-size="var(--fs-h2)" font-weight="600" fill="#245E43" letter-spacing="0.05em">叶绿体基质</text>
        <text x="1120" y="470" text-anchor="middle" font-family="var(--font-sans)" font-size="var(--fs-label)" fill="#506359">STROMA</text>
      </g>
    </svg>
  </div>

  <aside class="notes" hidden>
    这里是本章的第二幕——暗反应，也就是卡尔文循环。
    虽然名为“暗反应”，但它并不一定在黑暗中进行，而是指反应本身不需要光子直接驱动，
    但它高度依赖光反应阶段源源不断送来的 ATP 和 NADPH。
    在叶绿体基质中，二氧化碳被固定、还原，最终一部分三碳化合物离开循环去合成糖类，大部分则继续完成受体再生。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 14, total: 25, keys: false });
  </script>
</body>
</html>
