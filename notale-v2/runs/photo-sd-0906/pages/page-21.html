<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>两阶段的协同</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #D7E4DC;
      --surface: #EDF3EF;
      --text: #16271F;
      --muted: #506359;
      --rule: #758A7E;
      --model: #245E43;
      --model-soft: #A9C5B4;
      --focus: #D97A0B;
      --on-model: #F5F8F6;
      --on-focus: #1D241F;
    }

    #stage {
      isolation: isolate;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
    }

    #flow-canvas {
      z-index: 1;
      pointer-events: none;
    }

    /* 标题排印区：左侧保护区 */
    .title-block {
      position: absolute;
      z-index: 5;
      left: 104px;
      top: 310px;
      width: 560px;
      pointer-events: none;
    }

    .chapter-tag {
      font-family: var(--font-display);
      font-size: var(--fs-label);
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--model);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chapter-tag::before {
      content: "";
      display: inline-block;
      width: 24px;
      height: 3px;
      background: var(--focus);
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .lead-text {
      margin: 28px 0 0;
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      max-width: 480px;
    }

    /* 右侧协同核心机制结构标注（极简图解，不抢主画面） */
    .synergy-hubs {
      position: absolute;
      z-index: 4;
      left: 740px;
      top: 130px;
      width: 760px;
      height: 640px;
      pointer-events: none;
    }

    .hub-card {
      position: absolute;
      background: var(--surface);
      border: 1px solid var(--model-soft);
      border-radius: 6px;
      padding: 16px 22px;
      box-shadow: 0 8px 24px rgba(22, 39, 31, 0.06);
    }

    .hub-light {
      top: 30px;
      left: 60px;
      width: 250px;
    }

    .hub-dark {
      bottom: 60px;
      right: 60px;
      width: 270px;
    }

    .hub-name {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--model);
      margin-bottom: 4px;
    }

    .hub-site {
      font-size: var(--fs-sec);
      color: var(--muted);
    }

    .carrier-label {
      position: absolute;
      font-family: var(--font-numeric);
      font-size: var(--fs-label);
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 5px 12px;
      border-radius: 3px;
      background: var(--surface);
      border: 1px solid var(--rule);
    }

    .carrier-forward {
      top: 155px;
      left: 360px;
      color: var(--focus);
      border-color: var(--focus);
    }

    .carrier-backward {
      bottom: 165px;
      left: 170px;
      color: var(--model);
      border-color: var(--model-soft);
    }
  </style>
</head>
<body data-page="21" data-total="25">
  <div id="stage">
    <canvas id="flow-canvas" class="cv-fill no-pan"></canvas>

    <header class="title-block">
      <div class="chapter-tag">第 4 模块 · 综合与调控</div>
      <h1>两阶段的协同</h1>
      <p class="lead-text">光反应提供同化力，暗反应消耗并再生载体。两者互为底物源头，在叶绿体中实现连续耦联。</p>
    </header>

    <div class="synergy-hubs" aria-hidden="true">
      <div class="hub-card hub-light">
        <div class="hub-name">光反应</div>
        <div class="hub-site">类囊体薄膜 · 捕光与电荷分离</div>
      </div>

      <div class="carrier-label carrier-forward">ATP · NADPH →</div>
      <div class="carrier-label carrier-backward">← ADP · NADP⁺ + Pi</div>

      <div class="hub-card hub-dark">
        <div class="hub-name">暗反应</div>
        <div class="hub-site">叶绿体基质 · 碳固定与三碳还原</div>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    光反应与暗反应从来不是孤立进行的两个环节。光反应在类囊体薄膜上捕获光能，产出高能分子 ATP 和还原力 NADPH；暗反应则在基质中利用它们固定二氧化碳合成糖类，同时把消耗后的 ADP、Pi 与氧化态 NADP⁺ 归还光反应。两阶段互为动力、互为原料，任何一方受阻，另一方都会在数十秒内停摆。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("flow-canvas");
      let ctx = null;

      // 逻辑坐标定义
      const W = 1600;
      const H = 900;

      // 两个反应中枢位置（映射到全画布坐标系）
      const C1 = { x: 920, y: 220 };   // 光反应中心
      const C2 = { x: 1320, y: 640 };  // 暗反应中心

      // 顺行能量流轨道（上弧：光反应 -> 暗反应，输送 ATP & NADPH）
      // 逆向载体流轨道（下弧：暗反应 -> 光反应，归还 ADP & NADP+）
      const forwardPath = [
        { x: C1.x, y: C1.y },
        { x: 1040, y: 190 },
        { x: 1190, y: 230 },
        { x: 1290, y: 380 },
        { x: C2.x, y: C2.y }
      ];

      const backwardPath = [
        { x: C2.x, y: C2.y },
        { x: 1220, y: 730 },
        { x: 1050, y: 720 },
        { x: 880, y: 560 },
        { x: C1.x, y: C1.y }
      ];

      // 曲线贝塞尔采样插值
      function getBezierPoint(p0, p1, p2, p3, t) {
        const u = 1 - t;
        const tt = t * t;
        const uu = u * u;
        const uuu = uu * u;
        const ttt = tt * t;
        return {
          x: uuu * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + ttt * p3.x,
          y: uuu * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + ttt * p3.y
        };
      }

      // 生成平滑轨道点序列
      function buildStreamlines(count, spread, dir) {
        const lines = [];
        for (let i = 0; i < count; i++) {
          const offset = (i - (count - 1) / 2) * spread;
          const pts = [];
          const numSteps = 70;
          for (let s = 0; s <= numSteps; s++) {
            const t = s / numSteps;
            let pt;
            if (dir === 1) {
              // 顺行：拱形
              const p0 = { x: C1.x, y: C1.y + offset * 0.5 };
              const p1 = { x: 1050 + offset * 0.4, y: 150 + offset };
              const p2 = { x: 1320 + offset, y: 310 + offset * 0.5 };
              const p3 = { x: C2.x, y: C2.y + offset * 0.3 };
              pt = getBezierPoint(p0, p1, p2, p3, t);
            } else {
              // 逆行：下垂弧
              const p0 = { x: C2.x, y: C2.y + offset * 0.4 };
              const p1 = { x: 1200 + offset, y: 770 + offset };
              const p2 = { x: 920 + offset * 0.8, y: 690 + offset * 0.7 };
              const p3 = { x: C1.x, y: C1.y + offset * 0.5 };
              pt = getBezierPoint(p0, p1, p2, p3, t);
            }
            pts.push(pt);
          }
          lines.push({
            pts,
            alpha: 0.18 + (1 - Math.abs(i - (count - 1) / 2) / (count / 2)) * 0.28,
            width: 1.5 + (i % 2 === 0 ? 1 : 0)
          });
        }
        return lines;
      }

      const forwardStreams = buildStreamlines(18, 9, 1);
      const backwardStreams = buildStreamlines(18, 9, -1);

      // 粒子载体
      const particles = [];
      const P_COUNT = 44;
      for (let i = 0; i < P_COUNT; i++) {
        const isForward = i < P_COUNT * 0.55;
        particles.push({
          forward: isForward,
          streamIdx: i % 18,
          t: (i / P_COUNT) + (Math.random() * 0.05),
          speed: (isForward ? 0.00028 : 0.00024) * (0.85 + Math.random() * 0.3),
          size: isForward ? 3.5 : 2.8,
          trail: []
        });
      }

      function drawStaticField() {
        if (!ctx) return;

        // 背景微弱膜区底晕
        const g1 = ctx.createRadialGradient(C1.x, C1.y, 10, C1.x, C1.y, 220);
        g1.addColorStop(0, "rgba(36, 94, 67, 0.09)");
        g1.addColorStop(1, "rgba(36, 94, 67, 0)");
        ctx.fillStyle = g1;
        ctx.fillRect(C1.x - 220, C1.y - 220, 440, 440);

        const g2 = ctx.createRadialGradient(C2.x, C2.y, 10, C2.x, C2.y, 240);
        g2.addColorStop(0, "rgba(36, 94, 67, 0.07)");
        g2.addColorStop(1, "rgba(36, 94, 67, 0)");
        ctx.fillStyle = g2;
        ctx.fillRect(C2.x - 240, C2.y - 240, 480, 480);

        // 绘制静止流线束
        ctx.lineCap = "round";

        // 顺行（ATP / NADPH 流：带太阳橙焦点倾向）
        forwardStreams.forEach(stream => {
          ctx.beginPath();
          stream.pts.forEach((p, idx) => {
            if (idx === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          });
          ctx.strokeStyle = `rgba(217, 122, 11, ${stream.alpha * 0.75})`;
          ctx.lineWidth = stream.width;
          ctx.stroke();
        });

        // 逆行（ADP / NADP+ 归还流：深绿主模型线）
        backwardStreams.forEach(stream => {
          ctx.beginPath();
          stream.pts.forEach((p, idx) => {
            if (idx === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          });
          ctx.strokeStyle = `rgba(36, 94, 67, ${stream.alpha * 0.75})`;
          ctx.lineWidth = stream.width;
          ctx.stroke();
        });
      }

      function render(time) {
        if (!ctx) return;
        ctx.clearRect(0, 0, W, H);

        drawStaticField();

        // 绘制流动粒子与尾迹
        particles.forEach(p => {
          const stream = p.forward ? forwardStreams[p.streamIdx] : backwardStreams[p.streamIdx];
          const pts = stream.pts;

          p.t += p.speed * 16;
          if (p.t >= 1) p.t -= 1;

          const fIndex = p.t * (pts.length - 1);
          const i0 = Math.floor(fIndex);
          const i1 = Math.min(pts.length - 1, i0 + 1);
          const ratio = fIndex - i0;

          const currentX = pts[i0].x + (pts[i1].x - pts[i0].x) * ratio;
          const currentY = pts[i0].y + (pts[i1].y - pts[i0].y) * ratio;

          // 记录尾迹
          p.trail.unshift({ x: currentX, y: currentY });
          if (p.trail.length > 8) p.trail.pop();

          // 画尾迹
          if (p.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(p.trail[0].x, p.trail[0].y);
            for (let j = 1; j < p.trail.length; j++) {
              ctx.lineTo(p.trail[j].x, p.trail[j].y);
            }
            ctx.strokeStyle = p.forward ? "rgba(217, 122, 11, 0.45)" : "rgba(36, 94, 67, 0.4)";
            ctx.lineWidth = p.size * 0.6;
            ctx.stroke();
          }

          // 粒子本体
          ctx.beginPath();
          ctx.arc(currentX, currentY, p.size, 0, Math.PI * 2);
          ctx.fillStyle = p.forward ? "rgb(217, 122, 11)" : "rgb(36, 94, 67)";
          ctx.fill();
        });
      }

      function init() {
        ctx = Deck.fit(canvas);
        Deck.autofit(canvas, () => {
          render(0);
        });

        if (Deck.reduced()) {
          render(2400);
        } else {
          Deck.loop((time) => {
            render(time);
          }, { still: 3000 });
        }
      }

      window.addEventListener("DOMContentLoaded", init);
    })();
  </script>
</body>
</html>
