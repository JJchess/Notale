<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      background-color: var(--bg);
      overflow: hidden;
    }

    /* 标题区域：严守左侧静止安全区，规范折行与行距 */
    .title-group {
      position: absolute;
      top: 140px;
      left: 104px;
      width: 640px;
      z-index: 10;
      pointer-events: none;
    }

    .kicker {
      font-size: var(--fs-label);
      font-family: var(--font-sans);
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 24px;
      font-weight: 500;
    }

    .main-title {
      font-size: var(--fs-h1);
      font-family: var(--font-display);
      font-weight: 700;
      line-height: var(--lh-tight);
      color: var(--text);
      letter-spacing: -0.01em;
      margin-bottom: 20px;
      width: 620px;
    }

    .subtitle {
      font-size: var(--fs-lead);
      font-family: var(--font-sans);
      line-height: var(--lh-copy);
      color: var(--muted);
      font-weight: 400;
      width: 520px;
    }

    /* 底栏量化指标：蓝图线条风格，数值与说明清晰 */
    .engine-metrics {
      position: absolute;
      left: 104px;
      bottom: 100px;
      display: flex;
      gap: 48px;
      z-index: 10;
      pointer-events: none;
    }

    .metric-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .metric-value {
      font-size: var(--fs-h2);
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--model);
      line-height: 1;
    }

    .metric-label {
      font-size: var(--fs-tick);
      font-family: var(--font-sans);
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* 右侧主图形容器：SVG 矢量光能与光系统引擎架构 */
    .hero-engine {
      position: absolute;
      inset: 0;
      width: 1600px;
      height: 900px;
      z-index: 2;
      pointer-events: none;
    }

    .solar-beam {
      stroke: var(--focus);
      stroke-width: var(--stroke);
      opacity: 0.85;
      stroke-dasharray: 6 6;
      animation: beamPulse 4s ease-in-out infinite alternate;
    }

    .membrane-path {
      stroke: var(--model);
      stroke-width: var(--stroke-strong);
      fill: none;
    }

    .flow-wire {
      stroke: var(--rule);
      stroke-width: var(--stroke);
      fill: none;
    }

    .flow-converge {
      stroke: var(--model);
      stroke-width: var(--stroke-strong);
      fill: none;
    }

    .node-label {
      font-family: var(--font-sans);
      font-size: var(--fs-tick);
      fill: var(--muted);
      font-weight: 500;
    }

    .key-node-label {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      fill: var(--text);
      font-weight: 700;
    }

    @keyframes beamPulse {
      0% { stroke-dashoffset: 0; opacity: 0.75; }
      100% { stroke-dashoffset: -24; opacity: 0.95; }
    }

    @media (prefers-reduced-motion: reduce) {
      .solar-beam { animation: none; }
    }
  </style>
</head>
<body data-page="01" data-total="25">
  <div id="stage">
    <!-- 主标题区 -->
    <header class="title-group">
      <div class="kicker">生命科学通识 · 生物能量学</div>
      <h1 class="main-title">光合作用：驱动地球生命圈的能量引擎</h1>
      <p class="subtitle">阳光、水与二氧化碳的相遇转化，构成了生物圈能量流动与碳循环的基石。</p>
    </header>

    <!-- 底栏量化指标 -->
    <section class="engine-metrics" aria-label="关键生态尺度">
      <div class="metric-col">
        <div class="metric-value">2.8 × 10¹⁸ kJ</div>
        <div class="metric-label">年固定光能总量</div>
      </div>
      <div class="metric-col">
        <div class="metric-value">1.5 × 10¹¹ t</div>
        <div class="metric-label">年同化干有机物</div>
      </div>
      <div class="metric-col">
        <div class="metric-value">21% O₂</div>
        <div class="metric-label">维系好氧大气环境</div>
      </div>
    </section>

    <!-- 蓝图绘图：光子捕获、类囊体膜电荷分离与碳汇聚路径 -->
    <svg class="hero-engine" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 坐标参考系与辐射场 -->
      <g stroke="var(--rule)" stroke-width="1" opacity="0.32">
        <circle cx="1120" cy="460" r="330" stroke-dasharray="4 8" />
        <circle cx="1120" cy="460" r="210" stroke-dasharray="4 8" />
        <line x1="760" y1="460" x2="1480" y2="460" stroke-dasharray="2 6" />
        <line x1="1120" y1="130" x2="1120" y2="790" stroke-dasharray="2 6" />
      </g>

      <!-- 光子捕获天线束 (从左上方入射至各光反应中心) -->
      <g>
        <line class="solar-beam" x1="680" y1="160" x2="950" y2="355" />
        <line class="solar-beam" x1="820" y1="110" x2="1030" y2="355" />
        <line class="solar-beam" x1="970" y1="80" x2="1230" y2="355" />
        <!-- 激发位点标记（使用焦点色） -->
        <circle cx="950" cy="355" r="4.5" fill="var(--focus)" />
        <circle cx="1030" cy="355" r="4.5" fill="var(--focus)" />
        <circle cx="1230" cy="355" r="4.5" fill="var(--focus)" />
        <text x="800" y="210" fill="var(--focus)" font-size="13" font-family="var(--font-sans)" font-weight="600" letter-spacing="0.5">hν 太阳辐射能</text>
      </g>

      <!-- 类囊体膜与光反应超分子复合体 -->
      <g>
        <!-- 类囊体膜基底曲线 (下移至 y=620，避开文字重叠) -->
        <path class="membrane-path" d="M 720 620 Q 940 590 1120 620 T 1520 600" />
        
        <!-- PS II 复合体 -->
        <rect x="910" y="380" width="80" height="110" rx="4" fill="var(--bg)" stroke="var(--model)" stroke-width="2" />
        <text class="key-node-label" x="932" y="430">PS Ⅱ</text>
        <text class="node-label" x="926" y="454">水裂解</text>
        <!-- 水解生氧支路 -->
        <line x1="950" y1="490" x2="950" y2="540" stroke="var(--rule)" stroke-width="2" />
        <text class="node-label" x="906" y="562">H₂O → O₂ + 4H⁺</text>

        <!-- Cyt b6f 复合体 -->
        <rect x="1050" y="395" width="70" height="85" rx="4" fill="var(--bg)" stroke="var(--rule)" stroke-width="2" />
        <text class="key-node-label" x="1066" y="445">Cyt b₆f</text>

        <!-- PS I 复合体 -->
        <rect x="1190" y="380" width="80" height="110" rx="4" fill="var(--bg)" stroke="var(--model)" stroke-width="2" />
        <text class="key-node-label" x="1215" y="430">PS Ⅰ</text>
        <text class="node-label" x="1208" y="454">NADPH</text>

        <!-- ATP 合成酶复合体 -->
        <circle cx="1370" cy="435" r="38" fill="var(--bg)" stroke="var(--model)" stroke-width="2" />
        <text class="key-node-label" x="1352" y="432">ATP</text>
        <text class="node-label" x="1346" y="452">合成酶</text>

        <!-- 电子传递链跨膜路径 -->
        <path class="flow-wire" d="M 990 420 C 1015 390 1025 390 1050 420" />
        <path class="flow-wire" d="M 1120 420 C 1145 390 1165 390 1190 420" />
        <path class="flow-wire" d="M 1270 410 C 1300 375 1335 375 1355 405" />

        <!-- 碳汇聚总流：光反应产物汇入暗反应（签名粗线收束） -->
        <path class="flow-converge" d="M 1250 490 C 1270 550 1280 630 1220 700 T 1110 740" />
        <path class="flow-converge" d="M 1370 475 C 1380 570 1340 670 1230 730" />
        
        <!-- 汇聚终点：高能碳化合物固定 -->
        <circle cx="1110" cy="740" r="5" fill="var(--model)" />
        <text class="key-node-label" x="980" y="744">高能碳骨架 [CH₂O]</text>
        <text class="node-label" x="980" y="766">CO₂ 同化与生物量汇聚</text>
      </g>
    </svg>
  </div>

  <aside class="notes" hidden>
    同学们好，今天我们正式开启《光合作用：驱动地球生命圈的能量引擎》这一重要模块。
    地球生物圈的所有复杂生命活动，从根本上都依赖太阳核聚变释放的辐射能。光合作用是生物界最宏大的能量转换机制，它将光能捕获转化为高能电子与化学势能，进而固定无机碳、构建起所有生物分子骨架。
    本章我们将从类囊体膜上的超分子机器出发，探究电子传递与碳同化的协同演化。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 1, total: 25 });
  </script>
</body>
</html>
