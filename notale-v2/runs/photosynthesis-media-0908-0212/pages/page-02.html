<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      display: grid;
      grid-template-rows: auto 1fr;
      box-sizing: border-box;
      padding: var(--pad-y) var(--pad-x);
      color: var(--text);
      font-family: var(--font-sans);
      background-color: var(--bg);
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: var(--stroke) solid var(--rule);
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      letter-spacing: -0.02em;
    }

    .claim {
      margin: 0;
      font-size: var(--fs-lead);
      color: var(--muted);
    }

    .diagram-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .title-text {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: bold;
      fill: var(--text);
    }

    .body-text {
      font-size: var(--fs-body);
      fill: var(--text);
    }

    .sec-text {
      font-size: var(--fs-sec);
      fill: var(--muted);
    }

    .label-text {
      font-size: var(--fs-label);
      font-weight: 500;
      fill: var(--text);
    }

    .tick-text {
      font-size: var(--fs-tick);
      fill: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .notes {
      display: none;
    }
  </style>
</head>
<body data-page="02" data-total="25">
  <div id="stage">
    <header>
      <h1>能量与碳的流动：光合作用驱动生物圈</h1>
      <p class="claim">光能转化为化学能 · 无机碳固化为生命基质</p>
    </header>

    <div class="diagram-wrap min0">
      <svg viewBox="0 0 1488 740" preserveAspectRatio="xMidYMid meet">
        <defs>
          <marker id="arr-model" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--model)" />
          </marker>
          <marker id="arr-focus" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--focus)" />
          </marker>
          <marker id="arr-rule" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--rule)" />
          </marker>
        </defs>

        <!-- 左列：源头 -->
        <g id="col-inputs">
          <circle cx="120" cy="180" r="38" fill="none" stroke="var(--focus)" stroke-width="2" stroke-dasharray="4 3" />
          <text x="120" y="186" text-anchor="middle" class="label-text" fill="var(--focus)">太阳辐射</text>
          <text x="120" y="240" text-anchor="middle" class="tick-text">1.7×10¹⁴ kW</text>

          <line x1="50" y1="360" x2="190" y2="360" stroke="var(--rule)" stroke-width="1" />
          <text x="120" y="395" text-anchor="middle" class="title-text">水 H₂O</text>
          <text x="120" y="425" text-anchor="middle" class="sec-text">光解供电子</text>

          <line x1="50" y1="520" x2="190" y2="520" stroke="var(--rule)" stroke-width="1" />
          <text x="120" y="555" text-anchor="middle" class="title-text">CO₂</text>
          <text x="120" y="585" text-anchor="middle" class="sec-text">无机碳源</text>
        </g>

        <!-- 中列：自养转化枢纽 -->
        <g id="col-hub">
          <text x="350" y="135" class="title-text" fill="var(--model)">自养生物转化枢纽</text>

          <path d="M 165 180 L 350 220" fill="none" stroke="var(--focus)" stroke-width="3" marker-end="url(#arr-focus)" />
          <path d="M 190 380 L 350 250" fill="none" stroke="var(--rule)" stroke-width="1.5" marker-end="url(#arr-rule)" />
          <path d="M 190 550 L 350 460" fill="none" stroke="var(--rule)" stroke-width="1.5" marker-end="url(#arr-rule)" />

          <line x1="350" y1="180" x2="740" y2="180" stroke="var(--model)" stroke-width="2" />
          <text x="350" y="215" class="body-text" font-weight="bold" fill="var(--model)">光反应</text>
          <text x="350" y="245" class="sec-text">光解水产生活跃化学能</text>

          <path d="M 530 270 L 530 370" fill="none" stroke="var(--focus)" stroke-width="3" marker-end="url(#arr-focus)" />
          <text x="545" y="325" class="tick-text" fill="var(--focus)">活跃能量与 [H]</text>

          <line x1="350" y1="390" x2="740" y2="390" stroke="var(--model)" stroke-width="2" />
          <text x="350" y="425" class="body-text" font-weight="bold" fill="var(--model)">碳反应（卡尔文循环）</text>
          <text x="350" y="455" class="sec-text">固定 CO₂ 并还原为糖类</text>
        </g>

        <!-- 右列：生物圈终态 -->
        <g id="col-outputs">
          <path d="M 740 230 L 920 215" fill="none" stroke="var(--model)" stroke-width="2" marker-end="url(#arr-model)" />
          <line x1="920" y1="180" x2="1400" y2="180" stroke="var(--model)" stroke-width="2" />
          <text x="920" y="215" class="title-text" fill="var(--model)">释放氧气 O₂</text>
          <text x="920" y="245" class="sec-text">维系有氧呼吸与臭氧屏障</text>

          <path d="M 740 435 L 920 390" fill="none" stroke="var(--focus)" stroke-width="4" marker-end="url(#arr-focus)" />
          <line x1="920" y1="350" x2="1400" y2="350" stroke="var(--focus)" stroke-width="4" />
          <text x="920" y="390" class="title-text" fill="var(--focus)">合成有机质 (CH₂O)</text>
          <text x="920" y="425" class="body-text" font-weight="bold">食物链总能量基石</text>
          <text x="920" y="455" class="sec-text">年产逾 1500 亿吨生物质</text>
        </g>
      </svg>
    </div>
  </div>

  <aside class="notes" hidden>
    本页阐释生命圈运转的根本机制：能量与碳的流动。
    左侧为源头：太阳辐射能、水与二氧化碳。
    中间是自养生物转化中枢：光反应裂解水并捕获能量生成活跃化学能；碳反应接力固定二氧化碳，生成糖类。
    右侧展示这一流动塑造的地球生命环境：一方面释放氧气支撑有氧呼吸与臭氧屏障，另一方面年合成逾千亿吨有机质，奠定生物圈食物链的总能量基石。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 2, total: 25 });
  </script>
</body>
</html>
