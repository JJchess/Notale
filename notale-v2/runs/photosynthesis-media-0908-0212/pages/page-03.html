<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      user-select: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: var(--stroke) solid var(--rule);
      padding-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      color: var(--text);
      font-weight: 500;
    }

    .equation-bar {
      font-family: var(--font-sans);
      font-size: var(--fs-lead);
      color: var(--muted);
      letter-spacing: 0.5px;
    }
    .equation-bar .hl-energy {
      color: var(--focus);
      font-weight: 500;
    }

    .overview-canvas-wrap {
      position: relative;
      flex: 1;
      margin: 16px 0;
      min-height: 0;
    }

    svg#diagram {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .target-group {
      transition: opacity var(--motion-fast) var(--ease-out);
    }

    footer {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      border-top: 1px solid var(--rule);
      padding-top: 12px;
      min-height: 44px;
    }

    .step-text {
      font-size: var(--fs-body);
      line-height: var(--lh-copy);
      color: var(--text);
      margin: 0;
    }

    .step-pills {
      display: flex;
      gap: 10px;
    }

    .pill-btn {
      background: transparent;
      border: 1px solid var(--rule);
      color: var(--text);
      font-size: var(--fs-label);
      padding: 5px 16px;
      border-radius: 2px;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all var(--motion-fast) var(--ease-out);
    }
    .pill-btn.active {
      background: var(--model);
      border-color: var(--model);
      color: #ffffff;
      font-weight: 500;
    }
    .pill-btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
  </style>
</head>
<body data-page="03" data-total="25">
  <div id="stage">
    <header>
      <h1>光合作用两阶段总览：光反应与卡尔文循环</h1>
      <div class="equation-bar">
        6CO₂ + 6H₂O <span class="hl-energy">+ 光能</span> → C₆H₁₂O₆ + 6O₂
      </div>
    </header>

    <div class="overview-canvas-wrap">
      <svg id="diagram" viewBox="0 0 1488 640">
        <defs>
          <marker id="arr-m" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--model)" />
          </marker>
          <marker id="arr-f" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--focus)" />
          </marker>
          <marker id="arr-r" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--rule)" />
          </marker>
        </defs>

        <!-- 叶绿体外轮廓 -->
        <rect x="30" y="20" width="1428" height="600" rx="32" fill="none" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="6 6" />
        <text x="60" y="58" fill="var(--muted)" font-size="15" font-family="var(--font-sans)">叶绿体基质 (Stroma)</text>

        <!-- 第一阶段：类囊体 / 光反应 -->
        <g id="zone-light" class="target-group">
          <!-- 类囊体薄膜区域外轮廓 -->
          <rect x="80" y="90" width="580" height="490" rx="20" fill="#DCE7EC" stroke="var(--model)" stroke-width="2" />
          <text x="120" y="140" fill="var(--model)" font-size="22" font-family="var(--font-display)" font-weight="600">第一阶段：光反应</text>
          <text x="120" y="170" fill="var(--muted)" font-size="15" font-family="var(--font-sans)">场所：类囊体薄膜</text>

          <!-- 光能输入 -->
          <path d="M 30 250 L 140 250" fill="none" stroke="var(--focus)" stroke-width="3" marker-end="url(#arr-f)" />
          <text x="40" y="235" fill="var(--focus)" font-size="16" font-family="var(--font-sans)">光能</text>

          <!-- H2O 输入 -->
          <path d="M 30 370 L 140 370" fill="none" stroke="var(--model)" stroke-width="2" marker-end="url(#arr-m)" />
          <text x="40" y="355" fill="var(--text)" font-size="16" font-family="var(--font-sans)">H₂O</text>

          <!-- 电子传递链反应体 -->
          <rect x="170" y="220" width="230" height="200" rx="10" fill="#FFFFFF" stroke="var(--model)" stroke-width="2" />
          <text x="285" y="280" text-anchor="middle" fill="var(--model)" font-size="18" font-family="var(--font-sans)" font-weight="600">光合电子传递链</text>
          <text x="285" y="315" text-anchor="middle" fill="var(--muted)" font-size="15" font-family="var(--font-sans)">光解水产氧 · 质子转运</text>
          <text x="285" y="360" text-anchor="middle" fill="var(--focus)" font-size="15" font-family="var(--font-sans)">光能 → 活跃化学能</text>

          <!-- O2 释放 -->
          <path d="M 285 420 L 285 530" fill="none" stroke="var(--model)" stroke-width="2" marker-end="url(#arr-m)" />
          <text x="300" y="525" fill="var(--text)" font-size="16" font-family="var(--font-sans)">O₂ 释放</text>
        </g>

        <!-- 中间载体耦合 -->
        <g id="zone-coupling" class="target-group">
          <!-- 上行供能路径 -->
          <path d="M 400 270 C 580 270, 670 270, 800 270" fill="none" stroke="var(--focus)" stroke-width="4" marker-end="url(#arr-f)" />
          <rect x="540" y="235" width="180" height="42" rx="4" fill="#FFF2EB" stroke="var(--focus)" stroke-width="1.5" />
          <text x="630" y="262" text-anchor="middle" fill="var(--focus)" font-size="16" font-family="var(--font-sans)" font-weight="600">ATP + NADPH</text>

          <!-- 下行回收回路 -->
          <path d="M 800 390 C 670 390, 580 390, 400 390" fill="none" stroke="var(--rule)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-r)" />
          <rect x="530" y="375" width="200" height="36" rx="4" fill="#F4F7F9" stroke="var(--rule)" stroke-width="1" />
          <text x="630" y="399" text-anchor="middle" fill="var(--muted)" font-size="15" font-family="var(--font-sans)">ADP + Pi + NADP⁺</text>
        </g>

        <!-- 第二阶段：基质 / 碳反应 -->
        <g id="zone-dark" class="target-group">
          <rect x="808" y="90" width="600" height="490" rx="20" fill="#EDF3F6" stroke="var(--model)" stroke-width="2" />
          <text x="848" y="140" fill="var(--model)" font-size="22" font-family="var(--font-display)" font-weight="600">第二阶段：碳反应 (卡尔文循环)</text>
          <text x="848" y="170" fill="var(--muted)" font-size="15" font-family="var(--font-sans)">场所：叶绿体基质</text>

          <!-- CO2 输入 -->
          <path d="M 1108 40 L 1108 220" fill="none" stroke="var(--model)" stroke-width="2" marker-end="url(#arr-m)" />
          <text x="1120" y="70" fill="var(--text)" font-size="16" font-family="var(--font-sans)">CO₂ 固定</text>

          <!-- 卡尔文循环 -->
          <g transform="translate(1108, 330)">
            <circle cx="0" cy="0" r="110" fill="#FFFFFF" stroke="var(--model)" stroke-width="2" stroke-dasharray="8 4" />
            <path d="M 0 -110 A 110 110 0 0 1 110 0" fill="none" stroke="var(--model)" stroke-width="3" marker-end="url(#arr-m)" />
            <path d="M 110 0 A 110 110 0 0 1 0 110" fill="none" stroke="var(--model)" stroke-width="3" marker-end="url(#arr-m)" />
            <path d="M 0 110 A 110 110 0 0 1 -110 0" fill="none" stroke="var(--model)" stroke-width="3" marker-end="url(#arr-m)" />
            <path d="M -110 0 A 110 110 0 0 1 -10 -108" fill="none" stroke="var(--model)" stroke-width="3" marker-end="url(#arr-m)" />

            <text x="0" y="-15" text-anchor="middle" fill="var(--model)" font-size="18" font-family="var(--font-sans)" font-weight="600">三碳循环还原</text>
            <text x="0" y="16" text-anchor="middle" fill="var(--muted)" font-size="15" font-family="var(--font-sans)">固定 → 还原 → 再生</text>
            <text x="0" y="44" text-anchor="middle" fill="var(--focus)" font-size="15" font-family="var(--font-sans)">活跃化学能 → 稳定糖</text>
          </g>

          <!-- 糖类输出 -->
          <path d="M 1218 330 L 1380 330" fill="none" stroke="var(--focus)" stroke-width="3" marker-end="url(#arr-f)" />
          <text x="1248" y="315" fill="var(--focus)" font-size="16" font-family="var(--font-sans)">糖类产物 (CH₂O)</text>
        </g>
      </svg>
    </div>

    <footer>
      <p id="step-explanation" class="step-text">光反应在类囊体膜吸收光能分解水，生成的 ATP 与 NADPH 驱动基质中的碳反应合成糖类。</p>
      <div class="step-pills">
        <button class="pill-btn active" data-step-idx="0">全景耦合</button>
        <button class="pill-btn" data-step-idx="1">光反应</button>
        <button class="pill-btn" data-step-idx="2">载体循环</button>
        <button class="pill-btn" data-step-idx="3">碳反应</button>
      </div>
    </footer>
  </div>

  <aside class="notes" hidden>
    光合作用总反应式由空间与能量紧密耦合的两大阶段组成。
    类囊体薄膜上的光反应吸收光能并水解产氧，转化为 ATP 和 NADPH；
    高能载体进入叶绿体基质，推动卡尔文循环固定二氧化碳生成有机糖，载体耗竭后返回膜重新充能。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      const EXPLANATIONS = [
        "光反应在类囊体膜吸收光能分解水，生成的 ATP 与 NADPH 驱动基质中的碳反应合成糖类。",
        "阶段一（光反应）：在类囊体薄膜上进行，光解水生成 O₂，把光能转变为活跃的化学能。",
        "载体循环：高能分子 ATP 与 NADPH 将能量注入基质，耗能后回收为 ADP 与 NADP⁺。",
        "阶段二（碳反应）：在基质中利用同化力固定 CO₂，还原成储存稳定化学能的有机糖。"
      ];

      const pills = document.querySelectorAll('.pill-btn');
      const textEl = document.getElementById('step-explanation');
      const zoneLight = document.getElementById('zone-light');
      const zoneCoupling = document.getElementById('zone-coupling');
      const zoneDark = document.getElementById('zone-dark');

      function setStep(idx) {
        pills.forEach((p, i) => p.classList.toggle('active', i === idx));
        textEl.textContent = EXPLANATIONS[idx];

        if (idx === 0) {
          zoneLight.style.opacity = '1';
          zoneCoupling.style.opacity = '1';
          zoneDark.style.opacity = '1';
        } else if (idx === 1) {
          zoneLight.style.opacity = '1';
          zoneCoupling.style.opacity = '0.22';
          zoneDark.style.opacity = '0.22';
        } else if (idx === 2) {
          zoneLight.style.opacity = '0.35';
          zoneCoupling.style.opacity = '1';
          zoneDark.style.opacity = '0.35';
        } else if (idx === 3) {
          zoneLight.style.opacity = '0.22';
          zoneCoupling.style.opacity = '0.22';
          zoneDark.style.opacity = '1';
        }
      }

      pills.forEach(p => {
        p.addEventListener('click', () => {
          const idx = parseInt(p.dataset.stepIdx, 10);
          setStep(idx);
        });
      });

      Deck.init({ index: 3, total: 25 });
    })();
  </script>
</body>
</html>
