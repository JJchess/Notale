<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      display: grid;
      grid-template-columns: 520px 1fr;
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      position: relative;
    }

    .cover-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 2;
      padding-right: 48px;
    }

    .chapter-tag {
      font-family: var(--font-sans);
      font-size: var(--fs-sec);
      color: var(--model);
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }

    .title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      color: var(--text);
      margin: 0 0 20px 0;
      letter-spacing: -0.01em;
      font-weight: 700;
    }

    .lead {
      font-family: var(--font-sans);
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
      max-width: 480px;
    }

    .blueprint-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .chart-svg {
      width: 100%;
      height: 740px;
    }

    .factor-axis {
      stroke: var(--rule);
      stroke-width: var(--stroke);
      stroke-linecap: square;
    }

    .grid-line {
      stroke: rgba(113, 130, 139, 0.22);
      stroke-dasharray: 4 4;
      stroke-width: 1px;
    }

    .curve-base {
      fill: none;
      stroke: var(--model);
      stroke-width: var(--stroke);
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.42;
    }

    .curve-mid {
      fill: none;
      stroke: var(--model);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.75;
    }

    .curve-optimal {
      fill: none;
      stroke: var(--model);
      stroke-width: var(--stroke-strong);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .limit-ray {
      stroke: var(--focus);
      stroke-width: 2px;
      stroke-dasharray: 6 4;
    }

    .tick-label {
      font-family: var(--font-sans);
      font-size: var(--fs-tick);
      fill: var(--muted);
    }

    .chart-label {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      fill: var(--text);
      font-weight: 500;
    }

    .focus-label {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      fill: var(--focus);
      font-weight: 700;
    }
  </style>
</head>
<body data-page="19" data-total="25">
  <div id="stage">
    <header class="cover-copy min0">
      <div class="chapter-tag">第 05 章 · 动力学边界</div>
      <h1 class="title">环境调控与光合速率限制因子</h1>
      <p class="lead">多因子交织下，光合速率始终受制于供给最匮乏的短板因子。</p>
    </header>

    <div class="blueprint-stage min0">
      <svg class="chart-svg" viewBox="0 0 820 700" fill="none" role="img" aria-label="限制因子响应曲线系统">
        <!-- 坐标系与参考网格 -->
        <line class="grid-line" x1="100" y1="520" x2="740" y2="520" />
        <line class="grid-line" x1="100" y1="370" x2="740" y2="370" />
        <line class="grid-line" x1="100" y1="220" x2="740" y2="220" />
        <line class="grid-line" x1="320" y1="120" x2="320" y2="580" />
        <line class="grid-line" x1="540" y1="120" x2="540" y2="580" />

        <!-- 坐标轴 -->
        <path class="factor-axis" d="M100 120 L100 580 L760 580" />

        <!-- 坐标刻度与标签 -->
        <text class="tick-label" x="90" y="585" text-anchor="end">0</text>
        <text class="tick-label" x="90" y="524" text-anchor="end">低</text>
        <text class="tick-label" x="90" y="374" text-anchor="end">中</text>
        <text class="tick-label" x="90" y="224" text-anchor="end">高</text>

        <text class="chart-label" x="100" y="90">光合速率 (Pn)</text>
        <text class="chart-label" x="760" y="618" text-anchor="end">光照强度 (I)</text>

        <!-- 响应曲线群：不同 CO2 浓度与温度环境下的光饱和阶梯 -->
        <!-- 曲线 1：限制因子为低 CO2 (饱和点提前截断) -->
        <path class="curve-base" d="M100 580 C180 570 230 528 290 520 L720 520" />
        <circle cx="290" cy="520" r="4" fill="var(--model)" opacity="0.6" />
        <text class="tick-label" x="726" y="524">低 CO₂ 限制</text>

        <!-- 曲线 2：限制因子为适中 CO2 -->
        <path class="curve-mid" d="M100 580 C210 560 320 420 460 370 L720 370" />
        <circle cx="460" cy="370" r="5" fill="var(--model)" opacity="0.8" />
        <text class="tick-label" x="726" y="374">中等环境</text>

        <!-- 曲线 3：高 CO2 与最适温度（充分条件） -->
        <path class="curve-optimal" d="M100 580 C240 550 400 310 580 220 L720 220" />
        <circle cx="580" cy="220" r="6" fill="var(--model)" />
        <text class="chart-label" x="726" y="224">最适复合环境</text>

        <!-- 黑色曼限制法则交点与聚焦线 -->
        <line class="limit-ray" x1="290" y1="580" x2="290" y2="520" />
        <line class="limit-ray" x1="460" y1="580" x2="460" y2="370" />
        <line class="limit-ray" x1="580" y1="580" x2="580" y2="220" />

        <circle cx="290" cy="580" r="3" fill="var(--focus)" />
        <circle cx="460" cy="580" r="3" fill="var(--focus)" />
        <circle cx="580" cy="580" r="3" fill="var(--focus)" />

        <text class="focus-label" x="580" y="618" text-anchor="middle">饱和点后移</text>
        <path d="M460 614 L520 614" stroke="var(--focus)" stroke-width="1.5" marker-end="url(#arrow)" />

        <!-- 限制区与饱和区标注 -->
        <text class="chart-label" x="205" y="326" text-anchor="middle" fill="var(--model)">光限制区</text>
        <text class="focus-label" x="665" y="166" text-anchor="middle">碳/酶限制区</text>
      </svg>
    </div>
  </div>

  <aside class="notes" hidden>
    本章我们进入光合作用的环境动力学。
    在自然环境中，光强、温度和二氧化碳浓度三者紧密交织。
    根据黑色曼限制因子定律，当多项环境因子同时存在时，整个系统的反应速率只取决于处于最低供应状态的那一个。
    本章我们将逐一拆解气孔调节机制、光补偿点与光饱和点，以及多环境因子耦合下的动态平衡。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 19, total: 25 });
  </script>
</body>
</html>
