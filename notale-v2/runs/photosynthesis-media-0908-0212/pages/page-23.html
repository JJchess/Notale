<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      isolation: isolate;
      overflow: hidden;
      background: var(--bg);
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
    }

    /* 标题区域 */
    .title-group {
      position: absolute;
      top: 140px;
      left: 100px;
      z-index: 10;
      max-width: 580px;
      pointer-events: none;
    }

    .main-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      color: var(--text);
      letter-spacing: -0.01em;
      margin: 0 0 20px 0;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
      max-width: 500px;
    }

    /* 构图主体 */
    .diagram-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }

    .branch-tag {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      font-weight: 500;
      fill: var(--text);
    }

    .branch-sub {
      font-family: var(--font-sans);
      font-size: var(--fs-tick);
      fill: var(--muted);
    }

    .converge-node {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 600;
      fill: var(--focus);
    }
  </style>
</head>
<body data-page="23" data-total="25">
  <div id="stage" role="main">
    <header class="title-group">
      <h1 class="main-title">演化策略与未来应用</h1>
      <p class="subtitle">自然碳浓缩机制历经分流适应，现代人工合成路径在此交汇超越。</p>
    </header>

    <svg class="diagram-layer" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- 演化时间标尺 -->
      <line x1="680" y1="120" x2="680" y2="780" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" />
      <text x="668" y="140" text-anchor="end" class="branch-sub">三十亿年演化时间轴</text>

      <!-- 原始 C3 途径起点 -->
      <circle cx="680" cy="240" r="5" fill="var(--rule)" />
      <text x="664" y="244" text-anchor="end" class="branch-sub">原始 C3 光合途径</text>

      <!-- 自然演化三分支：平行横展与充分右延 -->
      <!-- 分支 1: C3 经典途径 -->
      <path d="M 680 240 C 760 240, 800 190, 880 190 L 1180 190" stroke="var(--model)" stroke-width="var(--stroke)" />
      <circle cx="880" cy="190" r="4" fill="var(--model)" />
      <text x="892" y="184" class="branch-tag">C3 经典途径</text>
      <text x="892" y="206" class="branch-sub">大部分温带植物 · 光呼吸损耗显著</text>

      <!-- 分支 2: C4 空间浓缩 -->
      <path d="M 680 240 C 770 240, 800 330, 880 330 L 1180 330" stroke="var(--model)" stroke-width="var(--stroke)" />
      <circle cx="880" cy="330" r="4" fill="var(--model)" />
      <text x="892" y="324" class="branch-tag">C4 空间隔离</text>
      <text x="892" y="346" class="branch-sub">花环组织高压浓缩 · 适应热带强光</text>

      <!-- 分支 3: CAM 昼夜交替 -->
      <path d="M 680 240 C 770 240, 790 470, 880 470 L 1180 470" stroke="var(--model)" stroke-width="var(--stroke)" />
      <circle cx="880" cy="470" r="4" fill="var(--model)" />
      <text x="892" y="464" class="branch-tag">CAM 时间隔离</text>
      <text x="892" y="486" class="branch-sub">夜间固定苹果酸 · 极度节水抗旱</text>

      <!-- 自然智慧向现代人工光合汇聚的平缓优雅弧线 -->
      <path d="M 1180 190 C 1260 190, 1310 520, 1380 620" stroke="var(--model)" stroke-width="var(--stroke)" opacity="0.5" />
      <path d="M 1180 330 C 1250 330, 1300 520, 1380 620" stroke="var(--model)" stroke-width="var(--stroke)" opacity="0.75" />
      <path d="M 1180 470 C 1250 470, 1310 550, 1380 620" stroke="var(--model)" stroke-width="var(--stroke)" opacity="0.6" />

      <!-- 工程介入主干：来自左侧人工设计源头 -->
      <line x1="680" y1="620" x2="1380" y2="620" stroke="var(--focus)" stroke-width="var(--stroke-strong)" />
      <circle cx="680" cy="620" r="5" fill="var(--focus)" />
      <text x="664" y="616" text-anchor="end" class="branch-tag" fill="var(--focus)">无细胞催化设计</text>
      <text x="664" y="636" text-anchor="end" class="branch-sub">光电化学跨界耦联</text>

      <!-- 终极汇聚节点: ASAP 人工淀粉合成与未来应用 -->
      <circle cx="1380" cy="620" r="7" fill="var(--focus)" />
      <line x1="1380" y1="620" x2="1520" y2="620" stroke="var(--focus)" stroke-width="var(--stroke-strong)" />
      <polygon points="1528,620 1516,614 1516,626" fill="var(--focus)" />

      <text x="1230" y="674" class="converge-node">人工光合作用与淀粉合成</text>
      <text x="1230" y="700" class="branch-sub">突破自然酶学瓶颈 · 理论效率提升 8.5 倍</text>
    </svg>
  </div>

  <aside class="notes" hidden>
    这一章我们将目光从光合作用的微观生物化学机制，投向更宏阔的时空尺度：演化与未来应用。
    自然界历经三十多亿年的试错，演化出了 C3、C4 和 CAM 三种不同的碳浓缩策略，以应对不同气候和氧气浓度的挑战。
    而在今天，人类科学家正从解构自然演化走向超越自然，通过人工光合作用与无细胞体外催化，直接将二氧化碳合成为淀粉，实现了光能转化效率的跨越式突破。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 23, total: 25, keys: false });
  </script>
</body>
</html>
