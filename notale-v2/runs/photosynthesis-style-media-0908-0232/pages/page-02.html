<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      padding: 56px 56px 44px 56px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    header {
      position: absolute;
      top: 56px;
      left: 56px;
      right: 56px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .equation-bar {
      font-family: var(--font-mono);
      font-size: 22px;
      letter-spacing: 0.02em;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .eq-h2o { color: #52B766; font-weight: 600; }
    .eq-co2 { color: #3E8DA8; font-weight: 600; }
    .eq-o2 { color: #E0683A; font-weight: 600; }
    .eq-c6 { color: #F2B93B; font-weight: 600; }
    .eq-arrow { color: var(--text); padding: 0 4px; }

    /* 主舞台与 SVG 区域 */
    .viewport {
      position: absolute;
      left: 56px;
      top: 130px;
      width: 1488px;
      height: 610px;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .axis-line {
      stroke: var(--rule);
      stroke-width: 1.5;
    }

    .label-stage {
      font-size: var(--fs-h2);
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .mol-node circle {
      transition: stroke-width var(--dur-state);
    }

    .path-label {
      font-size: var(--fs-tick);
      font-family: var(--font-mono);
      fill: var(--muted);
    }

    /* 底部指标与核验条 */
    .audit-bar {
      position: absolute;
      bottom: 40px;
      left: 56px;
      right: 56px;
      height: 54px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--rule);
      padding-top: 12px;
    }

    .atom-counts {
      display: flex;
      gap: 40px;
      font-size: var(--fs-sec);
      font-family: var(--font-mono);
    }

    .atom-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .atom-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    /* 模式切换 */
    .controls {
      display: flex;
      gap: 12px;
    }

    .btn-tab {
      background: transparent;
      border: 1px solid var(--rule);
      color: var(--text);
      padding: 6px 16px;
      font-size: var(--fs-label);
      font-family: var(--font-sans);
      border-radius: 4px;
      cursor: pointer;
      transition: all var(--dur-state);
    }

    .btn-tab:hover {
      border-color: var(--text);
    }

    .btn-tab.active {
      background: rgba(82, 183, 102, 0.16);
      border-color: var(--action-green);
      color: #FFFFFF;
      font-weight: 500;
    }
  </style>
</head>
<body data-page="02" data-total="16">
  <div id="stage">
    <header>
      <h1>总反应式：物质守恒与能量输入</h1>
      <div class="equation-bar">
        <span class="eq-h2o">6H₂O</span>
        <span>+</span>
        <span class="eq-co2">6CO₂</span>
        <span class="eq-arrow">→</span>
        <span class="eq-c6">C₆H₁₂O₆</span>
        <span>+</span>
        <span class="eq-o2">6O₂</span>
      </div>
    </header>

    <main class="viewport">
      <svg viewBox="0 0 1488 610" id="flowSvg">
        <!-- 阶段基准刻度 -->
        <line x1="744" y1="30" x2="744" y2="530" class="axis-line" />
        <text x="320" y="40" text-anchor="middle" class="label-stage" fill="var(--action-green)">反应物输入</text>
        <text x="1168" y="40" text-anchor="middle" class="label-stage" fill="var(--energy-bond)">生成物输出</text>

        <!-- 光子驱动核心枢纽 -->
        <g id="energyInput" transform="translate(744, 280)">
          <line x1="0" y1="-210" x2="0" y2="-45" stroke="var(--focus)" stroke-width="2" stroke-dasharray="6 4" />
          <polygon points="-5,-45 5,-45 0,-32" fill="var(--focus)" />
          <text x="14" y="-140" fill="var(--focus)" font-size="15" font-family="var(--font-mono)">+2870 kJ/mol</text>
          <text x="14" y="-116" fill="var(--muted)" font-size="13">光子驱动</text>
          
          <circle cx="0" cy="0" r="32" fill="var(--bg)" stroke="var(--action-green)" stroke-width="2" />
          <text x="0" y="5" text-anchor="middle" fill="var(--action-green)" font-family="var(--font-mono)" font-size="15" font-weight="600">e⁻ / H⁺</text>
          <text x="0" y="52" text-anchor="middle" fill="var(--muted)" font-size="13">高能电子与质子</text>
        </g>

        <!-- 示踪线条与分子节点 -->
        <g id="tracerPaths"></g>
        <g id="moleculeNodes"></g>
      </svg>
    </main>

    <footer class="audit-bar">
      <div class="atom-counts" id="atomBar">
        <div class="atom-item">
          <span class="atom-dot" style="background:#52B766"></span>
          <span>碳: 6 进 = 6 出</span>
        </div>
        <div class="atom-item">
          <span class="atom-dot" style="background:#3E8DA8"></span>
          <span>氢: 12 进 = 12 出</span>
        </div>
        <div class="atom-item">
          <span class="atom-dot" style="background:#E0683A"></span>
          <span>氧: 18 进 = 18 出</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn-tab active" data-mode="all">全原子守恒</button>
        <button class="btn-tab" data-mode="oxygen">¹⁸O 示踪</button>
        <button class="btn-tab" data-mode="carbon">¹⁴C 示踪</button>
      </div>
    </footer>
  </div>

  <aside class="notes" hidden>
    光合作用总反应式是物质守恒与能量转化的典范。
    通过鲁宾和卡门的 18O 同位素示踪，证实释放的氧分子全部源于水分子的光解，而非二氧化碳。
    二氧化碳中的碳和氧则全部固定进入糖分子中，整个过程净储存 2870 kJ/mol 的化学能。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      "use strict";

      const svgPaths = document.getElementById("tracerPaths");
      const svgNodes = document.getElementById("moleculeNodes");
      const buttons = document.querySelectorAll(".btn-tab");

      const nodes = [
        { id: "h2o", label: "6H₂O", sub: "水", x: 220, y: 170, color: "#52B766" },
        { id: "co2", label: "6CO₂", sub: "二氧化碳", x: 220, y: 410, color: "#3E8DA8" },
        { id: "c6", label: "C₆H₁₂O₆", sub: "葡萄糖", x: 1268, y: 410, color: "#F2B93B" },
        { id: "o2", label: "6O₂", sub: "氧气", x: 1268, y: 170, color: "#E0683A" }
      ];

      // 节点与文字标签位置调整，确保通道互不重叠遮挡
      const flows = [
        {
          id: "f-o",
          type: "oxygen",
          label: "12 [O] 裂解成氧",
          path: "M 276 170 L 1212 170",
          textPos: { x: 500, y: 152 },
          color: "#E0683A",
          strokeWidth: 3.5
        },
        {
          id: "f-h",
          type: "hydrogen",
          label: "12 [H] 还原转移",
          path: "M 276 185 C 520 210, 680 270, 712 280 S 940 400, 1212 400",
          textPos: { x: 960, y: 345 },
          color: "#52B766",
          strokeWidth: 3
        },
        {
          id: "f-c",
          type: "carbon",
          label: "6 [C] 骨架同化",
          path: "M 276 410 L 1212 410",
          textPos: { x: 490, y: 392 },
          color: "#F2B93B",
          strokeWidth: 3
        },
        {
          id: "f-co",
          type: "carbon-o",
          label: "6 [O] 进糖",
          path: "M 276 426 C 600 442, 900 442, 1212 426",
          textPos: { x: 744, y: 460 },
          color: "#3E8DA8",
          strokeWidth: 2.5
        }
      ];

      function renderNodes() {
        svgNodes.innerHTML = "";
        nodes.forEach(node => {
          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          g.setAttribute("class", "mol-node");
          g.setAttribute("transform", `translate(${node.x}, ${node.y})`);

          g.innerHTML = `
            <circle cx="0" cy="0" r="48" fill="var(--bg)" stroke="${node.color}" stroke-width="2" />
            <text x="0" y="6" text-anchor="middle" fill="var(--text)" font-family="var(--font-mono)" font-size="22" font-weight="600">${node.label}</text>
            <text x="0" y="74" text-anchor="middle" fill="var(--muted)" font-size="15">${node.sub}</text>
          `;
          svgNodes.appendChild(g);
        });
      }

      function renderFlows(filterMode) {
        svgPaths.innerHTML = "";

        flows.forEach(flow => {
          const isHighlighted = (filterMode === "all") ||
            (filterMode === "oxygen" && flow.type === "oxygen") ||
            (filterMode === "carbon" && (flow.type === "carbon" || flow.type === "carbon-o"));

          const opacity = isHighlighted ? 1 : 0.12;
          const strokeWidth = isHighlighted ? flow.strokeWidth : 1.5;

          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          g.innerHTML = `
            <path d="${flow.path}" fill="none" stroke="${flow.color}" stroke-width="${strokeWidth}" opacity="${opacity}" stroke-linecap="round" ${isHighlighted && filterMode !== "all" ? 'stroke-dasharray="6 4"' : ''} />
            <text x="${flow.textPos.x}" y="${flow.textPos.y}" text-anchor="middle" fill="${flow.color}" font-size="13" font-family="var(--font-mono)" opacity="${isHighlighted ? 0.95 : 0}">
              ${flow.label}
            </text>
          `;
          svgPaths.appendChild(g);
        });
      }

      function setMode(mode) {
        buttons.forEach(btn => {
          btn.classList.toggle("active", btn.dataset.mode === mode);
        });
        renderFlows(mode);
      }

      buttons.forEach(btn => {
        btn.addEventListener("click", () => {
          setMode(btn.dataset.mode);
        });
      });

      renderNodes();
      setMode("all");
      Deck.init({ index: 2, total: 16 });
    })();
  </script>
</body>
</html>
