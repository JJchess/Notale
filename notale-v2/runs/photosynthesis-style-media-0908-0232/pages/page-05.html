<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>光反应阶段：光能捕获与电荷转移</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      isolation: isolate;
      background: var(--bg);
      color: var(--text);
      padding: var(--pad-y) var(--pad-x);
      overflow: hidden;
    }

    #flow-field {
      z-index: 1;
      pointer-events: none;
    }

    /* 标题排版区 */
    .title-group {
      position: absolute;
      left: 120px;
      top: 190px;
      z-index: 5;
      max-width: 660px;
      pointer-events: none;
      user-select: none;
    }

    .chap-tag {
      font-family: var(--font-mono);
      font-size: var(--fs-sec);
      color: var(--action-green);
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 22px 0;
      font-family: var(--font-sans);
      font-size: var(--fs-h1);
      font-weight: 700;
      line-height: 1.25;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .deck-lead {
      margin: 0;
      font-family: var(--font-sans);
      font-size: var(--fs-lead);
      line-height: 1.5;
      color: var(--muted);
      max-width: 560px;
    }

    /* 底部能量标尺与签名示踪线注记 */
    .spectro-scale {
      position: absolute;
      left: 120px;
      bottom: 74px;
      z-index: 5;
      display: flex;
      gap: 36px;
      font-family: var(--font-sans);
      font-size: var(--fs-sec);
      color: var(--text);
      pointer-events: none;
    }

    .scale-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      flex: none;
    }

    .dot-ps2 {
      background: var(--focus);
      box-shadow: 0 0 8px rgba(242, 185, 59, 0.6);
    }

    .dot-etc {
      background: var(--action-green);
      box-shadow: 0 0 8px rgba(82, 183, 102, 0.6);
    }

    .dot-ps1 {
      background: var(--energy-bond);
      box-shadow: 0 0 8px rgba(224, 104, 58, 0.6);
    }
  </style>
</head>
<body data-page="05" data-total="16">
  <div id="stage">
    <canvas id="flow-field" class="cv-fill no-pan" aria-hidden="true"></canvas>

    <div class="title-group">
      <div class="chap-tag">第 02 阶段 · 类囊体膜电子流</div>
      <h1>光反应阶段：<br>光能捕获与电荷转移</h1>
      <p class="deck-lead">从类囊体膜上的光量子激发，到驱动跨膜质子梯度的定向高能电子流链。</p>
    </div>

    <div class="spectro-scale">
      <div class="scale-item">
        <span class="dot dot-ps2"></span>
        <span>PS II 原初激发</span>
      </div>
      <div class="scale-item">
        <span class="dot dot-etc"></span>
        <span>质子跨膜易位</span>
      </div>
      <div class="scale-item">
        <span class="dot dot-ps1"></span>
        <span>NADPH 与 ATP 偶联</span>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    这一章我们将进入光合作用能量转换的核心现场——类囊体薄膜。
    在这里，光量子被天线色素分子捕获后，激发出极高能量的电子，经由光系统II、细胞色素b6f复合物与光系统I构成的精密电子传递链逐步释放能量，并在此过程中建立驱动ATP合成的跨膜质子动力势。
    本章我们将逐一解析光吸收光谱、水光解机制、电子流动方向以及能量储存的高效物理化学过程。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";
      if (!window.Deck) return;

      Deck.init({ index: 5, total: 16, keys: false });

      const W = 1600;
      const H = 900;
      const canvas = document.getElementById("flow-field");
      let ctx = Deck.fit(canvas);

      function seededRandom(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s + 0x6d2b79f5) >>> 0;
          let n = s;
          n = Math.imul(n ^ (n >>> 15), n | 1);
          n ^= n + Math.imul(n ^ (n >>> 7), n | 61);
          return ((n ^ (n >>> 14)) >>> 0) / 4294967296;
        };
      }

      const SEED = 680700;
      const rng = seededRandom(SEED);

      // 三个复合物核心节点位置优化：适度下移靠右，避免重叠
      const NODES = [
        { x: 840, y: 580, type: "ps2", r: 42, title: "PS II", sub: "P680 激发态", pot: "-0.60 V" },
        { x: 1080, y: 460, type: "cyt", r: 36, title: "Cyt b₆f", sub: "质子泵核心", pot: "+0.35 V" },
        { x: 1330, y: 310, type: "ps1", r: 42, title: "PS I", sub: "P700 跃迁态", pot: "-0.43 V" }
      ];

      const TITLE_BOX = { x: 80, y: 150, w: 700, h: 360 };

      function insideTitle(x, y) {
        return x >= TITLE_BOX.x && x <= TITLE_BOX.x + TITLE_BOX.w &&
               y >= TITLE_BOX.y && y <= TITLE_BOX.y + TITLE_BOX.h;
      }

      // 生成矢量电子流轨迹
      const STREAMLINE_COUNT = 70;
      const streamlines = [];

      for (let i = 0; i < STREAMLINE_COUNT; i++) {
        const startY = 460 + rng() * 380;
        const startX = 620 + rng() * 360;
        const points = [];
        let cx = startX;
        let cy = startY;
        const maxLen = 340 + Math.floor(rng() * 220);

        for (let step = 0; step < maxLen; step++) {
          points.push({ x: cx, y: cy });

          let vx = 1.3;
          let vy = -0.4;

          // PS2 偏转与抽吸
          const d1x = NODES[0].x - cx;
          const d1y = NODES[0].y - cy;
          const dist1 = Math.hypot(d1x, d1y);
          if (dist1 < 250) {
            const pull = (250 - dist1) / 250;
            vx += (d1x / dist1) * pull * 1.6;
            vy += (d1y / dist1) * pull * 1.6 - pull * 0.9;
          }

          // Cyt b6f 汇聚下行
          const d2x = NODES[1].x - cx;
          const d2y = NODES[1].y - cy;
          const dist2 = Math.hypot(d2x, d2y);
          if (dist2 < 260) {
            const pull = (260 - dist2) / 260;
            vx += (d2x / dist2) * pull * 1.8 + 0.6;
            vy += (d2y / dist2) * pull * 1.3;
          }

          // PS1 二次跃迁吸引
          const d3x = NODES[2].x - cx;
          const d3y = NODES[2].y - cy;
          const dist3 = Math.hypot(d3x, d3y);
          if (dist3 < 300) {
            const pull = (300 - dist3) / 300;
            vx += (d3x / dist3) * pull * 2.1 + 0.9;
            vy += (d3y / dist3) * pull * 1.8 - pull * 1.4;
          }

          if (cx > 1340) {
            vx += 1.2;
            vy -= 0.7;
          }

          const speed = Math.hypot(vx, vy) || 1;
          const stepSize = 3.6;
          cx += (vx / speed) * stepSize;
          cy += (vy / speed) * stepSize;

          if (cx > 1650 || cy < 40 || cy > 880) break;
        }

        if (points.length > 25) {
          const roleVal = rng();
          let colorRole = "--rule";
          if (roleVal > 0.65) colorRole = "--action-green";
          else if (roleVal > 0.42) colorRole = "--carbon-fix";

          streamlines.push({
            points,
            colorRole,
            alpha: 0.14 + rng() * 0.22,
            width: 0.9 + rng() * 1.2,
            speed: 0.00035 + rng() * 0.00045,
            offset: rng()
          });
        }
      }

      // 高能电子流示踪粒子
      const TRACERS_COUNT = 24;
      const tracers = [];
      for (let i = 0; i < TRACERS_COUNT; i++) {
        const lineIdx = Math.floor(rng() * streamlines.length);
        tracers.push({
          lineIdx,
          progress: rng(),
          speed: 0.08 + rng() * 0.12,
          size: 2.2 + rng() * 2.2,
          type: rng() > 0.35 ? "focus" : "green"
        });
      }

      // 静态底纹缓存
      const staticCanvas = document.createElement("canvas");
      let staticCtx = staticCanvas.getContext("2d");

      function renderStatic() {
        staticCanvas.width = canvas.width;
        staticCanvas.height = canvas.height;
        if (!staticCtx) return;
        const ratio = canvas.__r || 1;
        staticCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
        staticCtx.clearRect(0, 0, W, H);

        const ruleRgb = Deck.rgb("rule");
        const mutedRgb = Deck.rgb("muted");
        const greenRgb = Deck.rgb("action-green");
        const focusRgb = Deck.rgb("focus");
        const bondRgb = Deck.rgb("energy-bond");

        // 1. 类囊体基质与腔界面基准线
        staticCtx.lineWidth = 1;
        staticCtx.strokeStyle = `rgba(${ruleRgb.join(",")}, 0.75)`;
        staticCtx.setLineDash([4, 6]);

        staticCtx.beginPath();
        staticCtx.moveTo(740, 710);
        staticCtx.lineTo(1540, 710);
        staticCtx.stroke();

        staticCtx.beginPath();
        staticCtx.moveTo(740, 190);
        staticCtx.lineTo(1540, 190);
        staticCtx.stroke();
        staticCtx.setLineDash([]);

        // 界面与氧化还原电位说明
        staticCtx.font = `14px ${Deck.token("--font-mono")}`;
        staticCtx.fillStyle = `rgba(${mutedRgb.join(",")}, 0.8)`;
        staticCtx.fillText("叶绿体基质 (pH ~ 8.0)", 760, 178);
        staticCtx.fillText("类囊体腔 (pH ~ 5.5 · 质子积累)", 760, 735);
        staticCtx.fillText("氧化还原电位 E₀' (V)", 1350, 140);

        // 2. 流线绘制
        streamlines.forEach((line) => {
          staticCtx.beginPath();
          let started = false;
          for (let p of line.points) {
            if (insideTitle(p.x, p.y)) {
              started = false;
              continue;
            }
            if (!started) {
              staticCtx.moveTo(p.x, p.y);
              started = true;
            } else {
              staticCtx.lineTo(p.x, p.y);
            }
          }
          const rgb = Deck.rgb(line.colorRole);
          staticCtx.strokeStyle = `rgba(${rgb.join(",")}, ${line.alpha})`;
          staticCtx.lineWidth = line.width;
          staticCtx.stroke();
        });

        // 3. 反应复合体节点与高对比标签
        NODES.forEach((n) => {
          const col = n.type === "ps2" ? focusRgb : (n.type === "cyt" ? greenRgb : bondRgb);

          // 核心光环
          staticCtx.beginPath();
          staticCtx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          staticCtx.strokeStyle = `rgba(${col.join(",")}, 0.38)`;
          staticCtx.lineWidth = 1.5;
          staticCtx.stroke();

          staticCtx.beginPath();
          staticCtx.arc(n.x, n.y, n.r + 10, 0, Math.PI * 2);
          staticCtx.strokeStyle = `rgba(${col.join(",")}, 0.16)`;
          staticCtx.lineWidth = 1;
          staticCtx.setLineDash([3, 5]);
          staticCtx.stroke();
          staticCtx.setLineDash([]);

          // 复合体主名
          staticCtx.textAlign = "center";
          staticCtx.fillStyle = `rgb(${col.join(",")})`;
          staticCtx.font = `700 16px ${Deck.token("--font-mono")}`;
          staticCtx.fillText(n.title, n.x, n.y - 12);

          // 阶段说明与能级
          staticCtx.font = `14px ${Deck.token("--font-sans")}`;
          staticCtx.fillStyle = Deck.token("--text");
          staticCtx.fillText(n.sub, n.x, n.y + 7);

          staticCtx.font = `13px ${Deck.token("--font-mono")}`;
          staticCtx.fillStyle = `rgba(${mutedRgb.join(",")}, 0.9)`;
          staticCtx.fillText(n.pot, n.x, n.y + 25);

          staticCtx.textAlign = "left";
        });
      }

      function drawFrame(time) {
        if (!ctx) return;
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(staticCanvas, 0, 0, W, H);

        const focusRgb = Deck.rgb("focus");
        const greenRgb = Deck.rgb("action-green");

        tracers.forEach((t) => {
          const line = streamlines[t.lineIdx];
          if (!line || line.points.length < 2) return;

          const pts = line.points;
          const pos = ((t.progress + time * 0.00015 * t.speed) % 1) * (pts.length - 1);
          const i = Math.floor(pos);
          const rem = pos - i;
          const p1 = pts[i];
          const p2 = pts[Math.min(i + 1, pts.length - 1)];

          const x = p1.x + (p2.x - p1.x) * rem;
          const y = p1.y + (p2.y - p1.y) * rem;

          if (insideTitle(x, y)) return;

          const col = t.type === "focus" ? focusRgb : greenRgb;

          ctx.beginPath();
          ctx.arc(x, y, t.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${col.join(",")}, 0.95)`;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(x, y, t.size * 2.5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${col.join(",")}, 0.25)`;
          ctx.fill();
        });
      }

      function rebuild() {
        ctx = Deck.fit(canvas);
        renderStatic();
        drawFrame(1200);
      }

      Deck.onResize(() => {
        rebuild();
      });

      rebuild();

      Deck.loop((time) => {
        drawFrame(time);
      }, { still: 1600 });
    })();
  </script>
</body>
</html>
