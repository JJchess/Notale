<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdaBoosting 算法</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root{
    --bg:#EEF2F6;
    --text:#121821;
    --font-sans:"Noto Sans SC",system-ui,sans-serif;
  }
  html,body{ width:100%; height:100%; }
  body{ background:var(--bg); }

  #stage{
    position:relative;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }

  #ensemble{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    pointer-events:none;
  }

  .cover-copy{
    position:absolute;
    left:96px;
    top:150px;
    width:640px;
    z-index:5;
    pointer-events:none;
  }

  h1{
    margin:0;
    font-family:var(--font-display,var(--font-sans));
    font-weight:800;
    font-size:96px;
    line-height:1.02;
    letter-spacing:-.01em;
    color:var(--text);
  }

  h1 .accent{ color:var(--strong); }

  .lead{
    margin-top:30px;
    max-width:560px;
    font-size:22px;
    line-height:1.6;
    color:var(--muted);
  }

  .legend-row{
    display:flex;
    align-items:center;
    gap:28px;
    margin-top:44px;
  }

  .legend-item{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:16px;
    color:var(--muted);
  }

  .sw{
    display:inline-block;
    width:30px;
    height:0;
    border-top:2px solid currentColor;
  }
  .sw.weak{ color:var(--weak); opacity:.85; }
  .sw.strong{ color:var(--strong); border-top-width:4px; }
</style>
</head>
<body data-page="1" data-total="8">
  <div id="stage" aria-labelledby="cover-title">
    <canvas id="ensemble" class="cv-fill" aria-hidden="true"></canvas>

    <div class="cover-copy">
      <h1 id="cover-title">Ada<span class="accent">Boost</span>ing<br>算法</h1>
      <p class="lead">一组各自平庸的弱分类器，按各自的准确程度分配权重、逐轮叠加，就能收敛成一条远比任何单一弱分类器更可靠的决策边界。</p>
      <div class="legend-row" aria-hidden="true">
        <div class="legend-item"><span class="sw weak"></span>弱分类器</div>
        <div class="legend-item"><span class="sw strong"></span>加权叠加后的强分类器</div>
      </div>
    </div>
    <span id="live-status" class="sr-only" aria-live="polite"></span>
  </div>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
(function () {
  'use strict';

  var W = 1600, H = 900;
  var REPRESENTATIVE_MS = 4600;

  // governing rule: M 条弱分类器（振荡边界，各自频率/相位/误差不同）
  // 按各自权重 alpha = 0.5*ln((1-err)/err) 加权叠加，
  // 叠加结果收敛成一条更稳定、振幅更小的强边界曲线。
  var CONFIG = Object.freeze({
    seed: 'adaboost-cover-01',
    weakCount: 7,
    channelY: 560,          // 弱/强分类曲线共享的水平基线
    channelAmp: 118,        // 弱分类器振幅上限
    xStart: 660,            // 曲线区起点（避开标题区）
    xEnd: 1560,
    titleField: Object.freeze({ x: 40, y: 60, w: 660, h: 620 }) // 排除区（近似标题占位）
  });

  var canvas = document.getElementById('ensemble');
  var liveStatus = document.getElementById('live-status');
  var ctx = null;
  var model = null;
  var stopLoop = function(){};
  var lastTime = REPRESENTATIVE_MS;

  Deck.init({ index: 1, total: 8, keys: false });

  var palette = {};
  function readPalette(){
    palette.weak = Deck.rgb('weak');
    palette.strong = Deck.rgb('strong');
    palette.muted = Deck.rgb('muted');
    palette.bg = Deck.rgb('bg');
  }
  function rgba(rgb, a){ return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }

  function inTitleField(x, y){
    var t = CONFIG.titleField;
    return x > t.x && x < t.x + t.w && y > t.y && y < t.y + t.h;
  }

  function buildModel(){
    var rng = new Math.seedrandom(CONFIG.seed);
    var weak = [];
    var errSum = 0;
    for (var i = 0; i < CONFIG.weakCount; i++){
      // 每个弱分类器：一条正弦形决策边界，误差率随机但确定（0.18~0.46之间，体现"弱"）
      var err = 0.18 + rng() * 0.28;
      var alpha = 0.5 * Math.log((1 - err) / err); // 标准 AdaBoost 分类器权重公式
      var freq = 0.9 + rng() * 2.6;
      var phase = rng() * Math.PI * 2;
      var ampScale = 0.55 + rng() * 0.6;
      weak.push({ err: err, alpha: alpha, freq: freq, phase: phase, ampScale: ampScale });
      errSum += alpha;
    }
    // 归一化权重，供强分类器叠加使用
    weak.forEach(function(w){ w.norm = w.alpha / errSum; });
    return { weak: weak };
  }

  function weakValueAt(w, u){
    // u in [0,1] 沿通道横向位置；振幅随 u 增大逐渐衰减（象征逐轮收敛）
    var damp = 1 - 0.55 * u;
    return Math.sin(u * Math.PI * 2 * w.freq + w.phase) * CONFIG.channelAmp * w.ampScale * damp;
  }

  function strongValueAt(model, u){
    var sum = 0;
    for (var i = 0; i < model.weak.length; i++){
      sum += model.weak[i].norm * weakValueAt(model.weak[i], u);
    }
    return sum;
  }

  function drawCurve(g, points, color, width, alpha, dash){
    g.save();
    g.beginPath();
    g.setLineDash(dash || []);
    var started = false;
    for (var i = 0; i < points.length; i++){
      var p = points[i];
      if (inTitleField(p.x, p.y)){ started = false; continue; }
      if (!started){ g.moveTo(p.x, p.y); started = true; }
      else g.lineTo(p.x, p.y);
    }
    g.strokeStyle = rgba(color, alpha);
    g.lineWidth = width;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.stroke();
    g.restore();
  }

  function render(time){
    if (!ctx || !model) return;
    ctx.clearRect(0, 0, W, H);

    var steps = 260;
    var span = CONFIG.xEnd - CONFIG.xStart;
    var reveal = Deck.clamp(time / 2600, 0, 1); // 逐条弱线依次显现，再汇聚成强线

    // 弱分类器细线：逐条淡入，按误差率不同呈现不同透明度
    model.weak.forEach(function(w, idx){
      var lineReveal = Deck.clamp(reveal * model.weak.length - idx, 0, 1);
      if (lineReveal <= 0) return;
      var pts = [];
      for (var s = 0; s <= steps; s++){
        var u = s / steps;
        var x = CONFIG.xStart + u * span;
        var y = CONFIG.channelY + weakValueAt(w, u);
        pts.push({ x: x, y: y });
      }
      var baseAlpha = 0.24 + (1 - w.err) * 0.36;
      drawCurve(ctx, pts, palette.weak, 2, baseAlpha * lineReveal, [2, 5]);
    });

    // 强分类器粗线：随时间收敛显现，代表加权叠加结果
    var strongReveal = Deck.clamp((reveal - 0.4) / 0.4, 0, 1);
    if (strongReveal > 0){
      var spts = [];
      for (var s2 = 0; s2 <= steps; s2++){
        var u2 = s2 / steps;
        var x2 = CONFIG.xStart + u2 * span;
        var y2 = CONFIG.channelY + strongValueAt(model, u2) * (0.4 + 0.6 * strongReveal);
        spts.push({ x: x2, y: y2 });
      }
      drawCurve(ctx, spts, palette.strong, 5.4, 0.92 * strongReveal, []);
    }

    // 基线：一条极浅的水平参照线，暗示"零误差"轴
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(CONFIG.xStart, CONFIG.channelY);
    ctx.lineTo(CONFIG.xEnd, CONFIG.channelY);
    ctx.strokeStyle = rgba(palette.muted, 0.18);
    ctx.lineWidth = 1;
    ctx.setLineDash([1, 6]);
    ctx.stroke();
    ctx.restore();
  }

  function rebuild(){
    ctx = Deck.fit(canvas);
    if (!ctx) return;
    readPalette();
    model = buildModel();
    render(lastTime);
  }

  function startMotion(){
    stopMotion();
    if (Deck.reduced()){
      render(REPRESENTATIVE_MS);
      lastTime = REPRESENTATIVE_MS;
      return;
    }
    stopLoop = Deck.loop(function(elapsed){
      if (elapsed <= REPRESENTATIVE_MS){
        lastTime = elapsed;
        render(lastTime);
      } else if (lastTime !== REPRESENTATIVE_MS) {
        lastTime = REPRESENTATIVE_MS;
        render(lastTime);
      }
    }, { still: REPRESENTATIVE_MS });
  }

  function stopMotion(){ stopLoop(); stopLoop = function(){}; }

  Deck.onResize(function(){ rebuild(); });

  rebuild();
  startMotion();
})();
  </script>
</body>
</html>
