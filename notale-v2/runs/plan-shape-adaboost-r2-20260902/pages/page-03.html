<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>核心思想：弱分类器加权组合成强分类器</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{ display:flex; flex-direction:column; }
  .head{ flex:0 0 auto; }
  .head h1{ font:700 var(--fs-h1)/1.15 var(--font-display); color:var(--text); margin:0 0 6px; }
  .head p{ font:400 var(--fs-lead)/1.5 var(--font-sans); color:var(--muted); margin:0; max-width:1100px; }

  .body{ flex:1; min-height:0; display:flex; gap:22px; margin-top:18px; }
  .weak-col{ flex:0 0 392px; min-height:0; display:flex; flex-direction:column; gap:14px; }
  .weak-card{ flex:1; min-height:0; display:flex; flex-direction:column; gap:6px; padding:14px 16px; }
  .weak-card .wc-top{ display:flex; align-items:baseline; justify-content:space-between; }
  .weak-card .wc-name{ font:700 17px var(--font-display); color:var(--text); }
  .weak-card .wc-name .sw{ display:inline-block; width:22px; height:3px; border-radius:2px; margin-right:8px; vertical-align:middle; transform:translateY(-3px); }
  .weak-card .wc-rule{ font:400 var(--fs-sec) var(--font-num); color:var(--muted); }
  .weak-card .wc-figure{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  .weak-card svg{ width:100%; height:100%; }
  .wc-stats{ display:flex; gap:18px; align-items:baseline; }
  .wc-stats .item{ font:400 var(--fs-label) var(--font-sans); color:var(--muted); }
  .wc-stats .item b{ font:700 20px var(--font-num); color:var(--text); margin-left:4px; }

  .strong-col{ flex:1; min-height:0; display:flex; flex-direction:column; gap:14px; }
  .strong-card{ flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; padding:18px 22px; }
  .strong-card .sc-top{ display:flex; align-items:baseline; justify-content:space-between; }
  .strong-card .sc-name{ font:700 20px var(--font-display); color:var(--strong); }
  .strong-card .sc-formula{ font:400 var(--fs-sec) var(--font-num); color:var(--muted); }
  .strong-card .sc-figure{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  .strong-card svg{ width:100%; height:100%; }

  .compare{ flex:0 0 168px; min-height:0; padding:16px 22px; display:flex; flex-direction:column; gap:10px; }
  .compare .cmp-title{ font:700 var(--fs-h2) var(--font-display); color:var(--text); }
  .cmp-rows{ display:flex; flex-direction:column; gap:9px; flex:1; justify-content:center; }
  .cmp-row{ display:flex; align-items:center; gap:12px; }
  .cmp-row .lab{ flex:0 0 128px; font:400 var(--fs-label) var(--font-sans); color:var(--muted); display:flex; align-items:center; gap:8px; }
  .cmp-row .lab .sw{ display:inline-block; width:14px; height:14px; border-radius:3px; flex:0 0 auto; }
  .cmp-row .bar-track{ flex:1; height:16px; background:#E3E8EE; border-radius:8px; overflow:hidden; }
  .cmp-row .bar-fill{ height:100%; border-radius:8px; }
  .cmp-row .val{ flex:0 0 66px; text-align:right; font:700 18px var(--font-num); color:var(--text); }
  .cmp-row.strong .val{ color:var(--strong); }
</style>
</head>
<body data-page="03" data-total="8">
<div id="stage">
  <div class="head">
    <h1>一组弱分类器，按权重投票组成一个强分类器</h1>
    <p>下面 3 条弱分类器各自只会画一刀，误差率都高于随机线太多不算数，但都明显犯错；把它们的判断按误差率折算成权重 α 相加取符号，得到的组合边界能纠正大部分错误。</p>
  </div>
  <div class="body">
    <div class="weak-col" id="weakCol"></div>
    <div class="strong-col">
      <div class="strong-card panel" id="strongCard">
        <div class="sc-top">
          <div class="sc-name">强分类器 F(x)</div>
          <div class="sc-formula">F(x) = sign( α₁h₁(x) + α₂h₂(x) + α₃h₃(x) )</div>
        </div>
        <div class="sc-figure"><svg id="strongSvg" viewBox="0 0 520 460"></svg></div>
      </div>
      <div class="compare panel q">
        <div class="cmp-title">误差率对比：组合明显优于每一个弱分类器</div>
        <div class="cmp-rows" id="cmpRows"></div>
      </div>
    </div>
  </div>
</div>
<script src="assets/base.js"></script>
<script>
(function(){
  // ---- 数据：8 个二维点，标签 ±1（真实坐标，全部现算） ----
  const pts = [
    {x:2,y:2,label:1}, {x:3,y:3,label:1}, {x:2,y:4,label:1}, {x:8,y:8,label:1},
    {x:2,y:8,label:-1}, {x:3,y:7,label:-1}, {x:8,y:2,label:-1}, {x:7,y:3,label:-1}
  ];

  // ---- 三个弱分类器规则（轴向/矩形阈值），均返回 +1/-1 ----
  const weak = [
    { id:'h1', name:'h₁', rule:'x₂ < 5 → +1，否则 −1', color:'var(--weak)',
      fn: p => p.y < 5 ? 1 : -1,
      draw: (svg,x0,y0,x1,y1) => `M ${x0} ${y1-5*(y1-y0)/10} L ${x1} ${y1-5*(y1-y0)/10}` },
    { id:'h2', name:'h₂', rule:'x₁ < 5 → +1，否则 −1', color:'var(--weak)',
      fn: p => p.x < 5 ? 1 : -1,
      draw: (svg,x0,y0,x1,y1) => `M ${x0+5*(x1-x0)/10} ${y0} L ${x0+5*(x1-x0)/10} ${y1}` },
    { id:'h3', name:'h₃', rule:'x₁>5 且 x₂>5 → +1，否则 −1', color:'var(--weak)',
      fn: p => (p.x > 5 && p.y > 5) ? 1 : -1,
      draw: (svg,x0,y0,x1,y1) => {
        const midx = x0+5*(x1-x0)/10, midy = y1-5*(y1-y0)/10;
        return `M ${midx} ${y0} L ${midx} ${midy} L ${x1} ${midy}`;
      } }
  ];

  // ---- 现算每个弱分类器的误差率、权重 alpha ----
  const n = pts.length;
  weak.forEach(w=>{
    let wrong = 0;
    pts.forEach(p=>{ if (w.fn(p) !== p.label) wrong++; });
    w.errorCount = wrong;
    w.error = wrong / n;
    w.alpha = 0.5 * Math.log((1 - w.error) / w.error);
  });

  // ---- 组合强分类器 ----
  function strongFn(p){
    const s = weak.reduce((acc,w)=> acc + w.alpha * w.fn(p), 0);
    return s >= 0 ? 1 : -1;
  }
  let strongWrong = 0;
  pts.forEach(p=>{ if (strongFn(p) !== p.label) strongWrong++; });
  const strongError = strongWrong / n;

  // ---- 绘制辅助：数据坐标 0-10 映射到 svg 视窗 ----
  function plotPoints(svg, x0,y0,x1,y1, highlightWrong, fn){
    const sx = v => x0 + v/10*(x1-x0);
    const sy = v => y1 - v/10*(y1-y0);
    let html = '';
    pts.forEach(p=>{
      const cx = sx(p.x), cy = sy(p.y);
      const wrong = fn ? fn(p) !== p.label : false;
      const fill = p.label === 1 ? 'var(--strong)' : 'var(--current)';
      const r = wrong ? 9 : 7;
      html += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" fill-opacity="${wrong?0.35:0.92}" stroke="${fill}" stroke-width="${wrong?2.5:0}"/>`;
      if (wrong) html += `<line x1="${cx-6}" y1="${cy-6}" x2="${cx+6}" y2="${cy+6}" stroke="var(--bad)" stroke-width="2"/><line x1="${cx-6}" y1="${cy+6}" x2="${cx+6}" y2="${cy-6}" stroke="var(--bad)" stroke-width="2"/>`;
    });
    return html;
  }

  function frame(x0,y0,x1,y1){
    return `<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="none" stroke="var(--muted)" stroke-opacity=".35" stroke-width="1"/>`;
  }

  // ---- 渲染三张弱分类器小图 ----
  const weakCol = document.getElementById('weakCol');
  weak.forEach(w=>{
    const card = document.createElement('div');
    card.className = 'weak-card panel';
    card.innerHTML = `
      <div class="wc-top">
        <div class="wc-name"><span class="sw" style="background:${w.color}"></span>${w.name}(x)</div>
        <div class="wc-rule">${w.rule}</div>
      </div>
      <div class="wc-figure"><svg viewBox="0 0 340 190"></svg></div>
      <div class="wc-stats">
        <div class="item">误差率<b>${(w.error*100).toFixed(1)}%</b></div>
        <div class="item">α<b>${w.alpha.toFixed(3)}</b></div>
      </div>`;
    weakCol.appendChild(card);
    const svg = card.querySelector('svg');
    const x0=30,y0=15,x1=310,y1=175;
    const path = w.draw(svg,x0,y0,x1,y1);
    svg.innerHTML = frame(x0,y0,x1,y1)
      + `<path d="${path}" fill="none" stroke="${w.color}" stroke-width="3"/>`
      + plotPoints(svg,x0,y0,x1,y1,true,w.fn);
  });

  // ---- 渲染强分类器组合图：网格采样出组合判定区域 ----
  const strongSvg = document.getElementById('strongSvg');
  const X0=40,Y0=20,X1=480,Y1=440;
  const sxv = v => X0 + v/10*(X1-X0);
  const syv = v => Y1 - v/10*(Y1-Y0);
  const GRID = 40;
  let cells = '';
  for (let i=0;i<GRID;i++){
    for (let j=0;j<GRID;j++){
      const cx = (i+0.5)/GRID*10, cy = (j+0.5)/GRID*10;
      const s = strongFn({x:cx,y:cy});
      const cellX = X0 + i/GRID*(X1-X0);
      const cellY = Y1 - (j+1)/GRID*(Y1-Y0);
      const w = (X1-X0)/GRID, h = (Y1-Y0)/GRID;
      const fill = s === 1 ? 'var(--strong)' : 'var(--current)';
      cells += `<rect x="${cellX.toFixed(1)}" y="${cellY.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" fill-opacity="0.14"/>`;
    }
  }
  strongSvg.innerHTML = cells
    + frame(X0,Y0,X1,Y1)
    + plotPoints(strongSvg,X0,Y0,X1,Y1,true,strongFn)
    + `<text x="${X0+8}" y="${Y0+22}" font-size="14" fill="var(--muted)">阴影：判定为 +1 / −1 的区域（按 α 加权投票）</text>`;

  // ---- 误差率对比条 ----
  const cmpRows = document.getElementById('cmpRows');
  const maxErr = 0.5;
  const rows = weak.map(w=>({label:w.name+'(x)', color:'var(--weak)', error:w.error}))
    .concat([{label:'F(x) 组合', color:'var(--strong)', error:strongError, strongRow:true}]);
  rows.forEach(r=>{
    const row = document.createElement('div');
    row.className = 'cmp-row' + (r.strongRow ? ' strong' : '');
    const pct = (r.error/maxErr*100).toFixed(1);
    row.innerHTML = `
      <div class="lab"><span class="sw" style="background:${r.color}"></span>${r.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${r.color}"></div></div>
      <div class="val">${(r.error*100).toFixed(1)}%</div>`;
    cmpRows.appendChild(row);
  });

  Deck.init({ index:3, total:8, keys:true });
})();
</script>
</body>
</html>
