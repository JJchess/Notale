<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>学习率决定步长</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root{--bg:#F4F1E8;--text:#1E252B;--font-sans:"DejaVu Sans","Noto Sans CJK SC",sans-serif;--focus:#E56B2F}
    #stage{padding:var(--pad-y) var(--pad-x);gap:16px;overflow:hidden}
    .page-head{height:112px;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:1px solid var(--rule);padding-bottom:16px}
    .kicker{margin:0 0 8px;color:var(--muted);font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.14em}
    h1{margin:0;font:700 var(--fs-h1)/1.05 var(--font-sans);letter-spacing:-.02em}
    .work{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:64px;min-height:0}
    .figure-wrap{margin:0;display:flex;flex-direction:column;min-height:0}
    .figure-top{height:48px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .formula{font:700 var(--fs-body)/1.2 var(--font-sans)}
    .scope{font:var(--fs-label)/1.3 var(--font-sans);color:var(--muted)}
    .chartbox{position:relative;flex:1;min-height:0;border:1px solid var(--rule);background:transparent}
    #chart{position:absolute;inset:0}
    figcaption{height:38px;display:flex;align-items:flex-end;font:var(--fs-label)/1.35 var(--font-sans);color:var(--muted)}
    .controls{display:flex;flex-direction:column;gap:16px;padding-top:48px;min-height:0}
    .panel{padding:24px}
    .panel h2{margin:0 0 16px;font:700 var(--fs-body)/1.25 var(--font-sans)}
    .rate-set{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    button{font-family:var(--font-sans)}
    .knob{width:100%;min-width:0;height:88px;border:1px solid var(--rule);border-radius:18px;background:transparent;color:var(--text);font:700 var(--fs-body)/1 var(--font-mono);cursor:pointer;position:relative}
    .knob::before{content:"";display:block;width:28px;height:28px;margin:0 auto 10px;border:2px solid var(--rule);border-radius:50%;background:repeating-conic-gradient(var(--text) 0 2deg,transparent 2deg 28deg)}
    .knob.on,.knob[aria-pressed="true"]{border:3px solid var(--attention);color:var(--attention)}
    .readouts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
    .readouts .big{display:block;min-width:0;padding:16px 8px;background:transparent;border:0}
    .readouts .big+ .big{border-left:1px solid var(--rule)}
    .read-label{display:block;margin-bottom:8px;font:var(--fs-label)/1 var(--font-sans);color:var(--muted)}
    .readouts .num{display:block;font:700 28px/1 var(--font-mono);white-space:nowrap}
    .action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btn{min-height:48px;padding:8px 12px;font-size:var(--fs-sec);cursor:pointer}
    .reset{width:100%;background:transparent}
    .status{min-height:54px;margin:0;padding-top:8px;border-top:1px solid var(--rule);font:var(--fs-sec)/1.4 var(--font-sans)}
    .status.attn{color:var(--attention);font-weight:700}
    .evidence{height:106px;display:grid;grid-template-columns:1.35fr 1fr;gap:64px;border-top:1px solid var(--rule);padding-top:16px}
    .conclusion{margin:0;font:700 var(--fs-body)/1.45 var(--font-sans)}
    .next{margin:0;align-self:start;font:var(--fs-sec)/1.4 var(--font-sans);color:var(--muted)}
    .fallback{position:absolute;left:16px;bottom:10px;z-index:2;margin:0;padding:5px 8px;background:var(--bg);border:1px solid var(--rule-soft);font:var(--fs-label)/1.25 var(--font-sans);color:var(--muted)}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body data-page="12" data-total="21">
  <div id="stage" class="canvas-full">
    <header class="page-head">
      <p class="kicker">STEP SIZE · RATE</p>
      <h1>学习率把方向变成一步的距离</h1>
    </header>

    <main class="work min0">
      <figure class="figure-wrap min0" aria-labelledby="chart-title" aria-describedby="chart-caption chart-summary">
        <div class="figure-top">
          <div id="chart-title" class="formula">新参数 = 旧参数 − 学习率 × 梯度读数</div>
          <div class="scope">同一初值 w = 0 · 同一目标 1 · 同一损失坡面</div>
        </div>
        <div class="chartbox cvbox min0">
          <div id="chart" role="img" aria-label="三种学习率下参数位置随更新次数变化的共同尺度折线图。纵轴固定为负四到四，目标参数为一。"></div>
          <p id="chart-summary" class="fallback">第 5 次：η 0.03 → w≈0.266；η 0.3 → w≈0.990；η 30 在第 2 次到达 −3480。</p>
        </div>
        <figcaption id="chart-caption">横轴为更新次数；纵轴固定在 −4 到 4。越界值停在图框边缘，并保留精确数值。</figcaption>
      </figure>

      <aside class="controls min0" aria-label="学习率实验控制">
        <section class="panel">
          <h2>选择学习率 η</h2>
          <div class="rate-set" role="group" aria-label="三个学习率档位">
            <button class="knob" type="button" data-rate="0.03" aria-pressed="false">0.03</button>
            <button class="knob on" type="button" data-rate="0.3" aria-pressed="true">0.3</button>
            <button class="knob" type="button" data-rate="30" aria-pressed="false">30</button>
          </div>
        </section>

        <section class="panel q">
          <div class="readouts" aria-live="polite">
            <div class="big"><span class="read-label">当前参数 w</span><span id="w-read" class="num">0.000</span></div>
            <div class="big"><span class="read-label">当前损失 L</span><span id="loss-read" class="num">1.000</span></div>
          </div>
          <p id="grad-read" class="small">初始梯度读数：约 −2.000（数值近似）</p>
          <div class="action-row">
            <button id="step-btn" class="btn" type="button">更新一步</button>
            <button id="run-btn" class="btn" type="button">连续 5 次</button>
          </div>
          <button id="reset-btn" class="btn reset" type="button">全部重置</button>
          <p id="status" class="status" role="status">已选 η = 0.3。三条轨迹从同一初值出发。</p>
        </section>
      </aside>
    </main>

    <footer class="evidence">
      <p class="conclusion">同一份梯度建议，学习率太小会走得慢，合适时可稳定下降，太大则可能反复跨过低处。</p>
      <p class="next">下一问：一步会下降，怎样变成持续的学习？</p>
    </footer>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/echarts.min.js"></script>
  <script>
  (function(){
    'use strict';
    Deck.init({index:12,total:21});
    var rates=[0.03,0.3,30];
    var state={rate:0.3,step:0,w:0,running:false};
    var timer=null;
    var host=document.getElementById('chart');
    var chart=echarts.init(host,null,{renderer:'svg'});
    var css=getComputedStyle(document.documentElement);
    function token(n){return css.getPropertyValue(n).trim();}
    function loss(w){return Lec.P.meanSquaredError([w],[1]).value;}
    function gradient(w){
      return Lec.P.finiteDifferenceGradient(function(v){return loss(v[0]);},[w],Lec.K.FINITE_DIFFERENCE_STEP)[0];
    }
    function pathFor(rate){
      var out=[[0,0]],w=0,max=rate===30?2:5;
      for(var i=1;i<=max;i++){w=w-rate*gradient(w);out.push([i,w]);}
      return out;
    }
    var paths={}; rates.forEach(function(r){paths[String(r)]=pathFor(r);});
    function clipped(data){return data.map(function(p){return [p[0],Math.max(-4,Math.min(4,p[1]))];});}
    function lineSeries(rate){
      var active=state.rate===rate;
      var name='η = '+rate;
      var col=active?token('--attention'):(rate===0.03?token('--muted'):token('--text'));
      var dash=rate===0.03?'dashed':(rate===30?'dotted':'solid');
      return {id:'rate-'+rate,name:name,type:'line',data:clipped(paths[String(rate)]),showSymbol:true,symbol:rate===30?'diamond':'circle',symbolSize:active?9:6,lineStyle:{width:active?3:2,type:dash,color:col},itemStyle:{color:col},emphasis:{disabled:true},animationDurationUpdate:240,clip:true};
    }
    function currentSeries(){
      var shown=Math.max(-4,Math.min(4,state.w));
      return {id:'current',name:'当前点',type:'scatter',data:[[state.step,shown]],symbolSize:16,itemStyle:{color:token('--attention'),borderColor:token('--bg'),borderWidth:3},z:20,animationDurationUpdate:240,tooltip:{show:false}};
    }
    function option(){
      return {
        animation:!Deck.reduced(),animationDurationUpdate:240,
        textStyle:{fontFamily:'DejaVu Sans, Noto Sans CJK SC, sans-serif',fontSize:16,color:token('--text')},
        color:[token('--muted'),token('--text'),token('--attention')],
        grid:{left:76,right:54,top:58,bottom:60,containLabel:false},
        legend:{top:14,left:70,itemWidth:28,itemHeight:10,textStyle:{fontSize:15,color:token('--text')},selectedMode:false},
        tooltip:{trigger:'axis',confine:true,backgroundColor:token('--surface'),borderColor:token('--rule'),textStyle:{fontSize:16,color:token('--text')},formatter:function(ps){var s='更新 '+ps[0].axisValue+' 次';ps.forEach(function(p){if(p.seriesName!=='当前点')s+='<br>'+p.marker+p.seriesName+'：w = '+paths[p.seriesName.replace('η = ','')][p.dataIndex][1].toLocaleString('zh-CN',{maximumFractionDigits:6});});return s;}},
        xAxis:{type:'value',min:0,max:5,interval:1,name:'更新次数',nameLocation:'middle',nameGap:36,nameTextStyle:{fontSize:15,color:token('--muted')},axisLabel:{fontSize:12,color:token('--muted')},axisLine:{lineStyle:{color:token('--rule')}},axisTick:{lineStyle:{color:token('--rule')}},splitLine:{show:false}},
        yAxis:{type:'value',min:-4,max:4,interval:1,name:'参数位置 w',nameLocation:'middle',nameGap:48,nameRotate:90,nameTextStyle:{fontSize:15,color:token('--muted')},axisLabel:{fontSize:12,color:token('--muted')},axisLine:{show:true,lineStyle:{color:token('--rule')}},axisTick:{show:true},splitLine:{show:true,lineStyle:{color:token('--rule-soft')} }},
        series:[lineSeries(0.03),lineSeries(0.3),lineSeries(30),{
          id:'target-a',name:'目标位置',type:'line',data:[],markLine:{silent:true,symbol:'none',label:{show:true,formatter:'目标 w = 1',position:'insideEndTop',fontSize:14,color:token('--muted')},lineStyle:{color:token('--muted'),width:1,type:'solid'},data:[{yAxis:0.97},{yAxis:1.03,label:{show:false}}]},tooltip:{show:false}
        },{
          id:'overflow',name:'越界值',type:'scatter',data:[[1,4,60],[2,-4,-3480]],symbol:'diamond',symbolSize:10,itemStyle:{color:token('--text')},label:{show:true,fontSize:14,color:token('--text'),backgroundColor:token('--bg'),borderColor:token('--rule'),borderWidth:1,padding:[4,6],formatter:function(p){return p.value[2].toLocaleString('zh-CN')+'（超出图框）';},position:function(p){return p.value&&p.value[2]>0?'bottom':'top';}},tooltip:{show:false},z:12
        },currentSeries()]
      };
    }
    function fmtW(v){return Math.abs(v)>=100?v.toLocaleString('zh-CN',{maximumFractionDigits:0}):v.toFixed(3);}
    function fmtLoss(v){return v>=1000?v.toLocaleString('zh-CN',{maximumFractionDigits:0}):v.toFixed(v<0.001?6:4);}
    function render(msg){
      chart.setOption(option(),{notMerge:true});
      document.getElementById('w-read').textContent=fmtW(state.w);
      document.getElementById('loss-read').textContent=fmtLoss(loss(state.w));
      document.getElementById('grad-read').textContent='当前梯度读数：约 '+gradient(state.w).toFixed(3)+'（数值近似）';
      document.querySelectorAll('[data-rate]').forEach(function(b){var on=Number(b.dataset.rate)===state.rate;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});
      document.getElementById('step-btn').disabled=state.running;
      document.getElementById('run-btn').disabled=state.running||state.step>=5||(state.rate===30&&state.step>=2);
      var st=document.getElementById('status'); st.textContent=msg||('η = '+state.rate+'，已更新 '+state.step+' 次。');
      st.classList.toggle('attn',state.rate===30&&state.step>0);
    }
    function setState(patch,msg){Object.keys(patch).forEach(function(k){state[k]=patch[k];});render(msg);}
    function oneStep(done){
      if(state.step>=5||(state.rate===30&&state.step>=2)){if(done)done();return;}
      var nw=state.w-state.rate*gradient(state.w), ns=state.step+1;
      state.w=nw;state.step=ns;
      render(state.rate===30&&ns>=2?'数值仍有效，但步子正在放大误差。':'完成第 '+ns+' 次更新。');
      window.setTimeout(function(){if(done)done();},Deck.reduced()?0:360);
    }
    document.querySelectorAll('[data-rate]').forEach(function(b){b.addEventListener('click',function(){clearTimeout(timer);setState({rate:Number(b.dataset.rate),step:0,w:0,running:false},'已切换档位，并回到共同初值 w = 0。');});});
    document.getElementById('step-btn').addEventListener('click',function(){oneStep();});
    document.getElementById('run-btn').addEventListener('click',function(){
      if(state.running)return; state.running=true;render('连续更新中。');
      var limit=state.rate===30?2:5;
      function advance(){if(state.step>=limit){state.running=false;render(state.rate===30?'数值仍有效，但步子正在放大误差。':'已连续更新 5 次。');return;}oneStep(function(){timer=setTimeout(advance,Deck.reduced()?0:80);});}
      advance();
    });
    document.getElementById('reset-btn').addEventListener('click',function(){clearTimeout(timer);setState({rate:0.3,step:0,w:0,running:false},'已全部重置：η = 0.3，w = 0。');});
    var observer=new ResizeObserver(function(){chart.resize();}); observer.observe(host);
    window.addEventListener('beforeunload',function(){clearTimeout(timer);observer.disconnect();chart.dispose();},{once:true});
    render('已选 η = 0.3。三条轨迹从同一初值出发。');
  })();
  </script>
</body>
</html>
