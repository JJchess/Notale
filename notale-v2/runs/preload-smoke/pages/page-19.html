<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>排对训练循环</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{
      display:flex;
      flex-direction:column;
      gap:24px;
      padding:var(--pad-y) var(--pad-x);
      background:var(--bg);
      color:var(--text);
      overflow:hidden;
    }
    .p19-head{flex:0 0 112px;display:flex;flex-direction:column;justify-content:flex-start;gap:8px;min-width:0}
    .p19-head .kicker{margin:0;color:var(--muted);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;letter-spacing:.1em}
    .p19-head h1{margin:0;max-width:1240px;font-family:var(--font-sans);font-size:var(--fs-h1);line-height:1.12;font-style:normal;letter-spacing:-.02em}

    #loop-sorter{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:16px}
    #loop-sorter *{box-sizing:border-box}
    #loop-sorter .workbench{position:relative;flex:1 1 auto;min-height:0;display:grid;grid-template-rows:minmax(230px,1fr) 176px;gap:16px;border:1px solid var(--rule);padding:24px;background:transparent}
    #loop-sorter .slot-region{position:relative;min-height:0;padding-top:30px}
    #loop-sorter .axis-label{position:absolute;left:0;top:0;font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;color:var(--muted);letter-spacing:.06em}
    #loop-sorter .k-process{height:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px;position:relative;align-items:stretch}
    #loop-sorter .k-process::before{content:"";position:absolute;left:8%;right:8%;top:50%;border-top:1px solid var(--rule);z-index:0}
    #loop-sorter .step-slot{position:relative;z-index:1;min-width:0;min-height:184px;border:1px solid var(--rule);background:var(--bg);padding:16px;text-align:left;color:var(--text);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:stretch;justify-content:flex-start}
    #loop-sorter .step-slot:hover,#loop-sorter .step-slot:focus-visible{border-color:var(--attention)}
    #loop-sorter .step-slot.current{border:3px solid var(--attention);padding:14px}
    #loop-sorter .step-slot.locked{cursor:default}
    #loop-sorter .slot-no{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--muted);font-weight:700}
    #loop-sorter .empty-label{margin:auto 0;text-align:center;color:var(--rule);font-size:var(--fs-body);font-weight:600}
    #loop-sorter .step-name{font-size:var(--fs-lead);line-height:1.1;font-weight:800;color:var(--text)}
    #loop-sorter .step-copy{font-size:var(--fs-sec);line-height:1.42;color:var(--muted)}
    #loop-sorter .step-output{margin-top:auto;padding-top:8px;border-top:1px solid var(--rule-soft);font-size:var(--fs-label);color:var(--prediction);font-weight:700;opacity:0}
    #loop-sorter .complete .step-output{opacity:1}
    #loop-sorter .step-slot[draggable="true"]{cursor:grab}
    #loop-sorter .step-slot.dragging{opacity:.45}
    #loop-sorter .step-slot.drop-target{outline:3px solid var(--attention);outline-offset:-3px}
    #loop-sorter .break-after::after,#loop-sorter .break-after::before{content:"";position:absolute;right:-40px;width:40px;border-top:1px solid var(--text);z-index:3}
    #loop-sorter .break-after::before{top:calc(50% - 3px)}
    #loop-sorter .break-after::after{top:calc(50% + 3px)}
    #loop-sorter .break-mark{position:absolute;right:-27px;top:calc(50% - 17px);z-index:4;width:14px;height:34px;background:var(--bg);border-left:2px solid var(--attention);transform:rotate(32deg);pointer-events:none}
    #loop-sorter .loopback{position:absolute;left:4%;right:4%;bottom:-7px;height:28px;border:2px solid var(--prediction);border-top:0;opacity:0;transition:opacity 240ms linear}
    #loop-sorter .loopback::before{content:"";position:absolute;left:-2px;top:-8px;border-right:10px solid var(--prediction);border-top:6px solid transparent;border-bottom:6px solid transparent}
    #loop-sorter .loop-label{position:absolute;right:4%;bottom:-2px;transform:translateY(100%);font-size:var(--fs-label);color:var(--prediction);font-weight:700;background:var(--bg);padding-left:8px;opacity:0}
    #loop-sorter .complete .loopback,#loop-sorter .complete .loop-label{opacity:1}

    #loop-sorter .ledger{display:grid;grid-template-columns:170px minmax(0,1fr);gap:24px;min-height:0;border-top:1px solid var(--rule);padding-top:16px}
    #loop-sorter .ledger-label{display:flex;flex-direction:column;gap:8px}
    #loop-sorter .ledger-label strong{font-size:var(--fs-body)}
    #loop-sorter .ledger-label span{font-size:var(--fs-label);line-height:1.4;color:var(--muted)}
    #loop-sorter .pool{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;min-width:0}
    #loop-sorter .entry{min-width:0;height:134px;border:1px solid var(--rule);background:var(--surface);padding:16px;text-align:left;color:var(--text);font:inherit;cursor:grab;display:flex;flex-direction:column;gap:8px}
    #loop-sorter .entry:hover,#loop-sorter .entry:focus-visible,#loop-sorter .entry.selected{border:3px solid var(--attention);padding:14px}
    #loop-sorter .entry .step-name{font-size:var(--fs-body)}
    #loop-sorter .entry .step-copy{font-size:var(--fs-label);line-height:1.42}
    #loop-sorter .pool-gap{height:134px;border:1px dashed var(--rule-soft);display:flex;align-items:center;justify-content:center;color:var(--rule);font-size:var(--fs-label)}

    #loop-sorter .control-row{flex:0 0 56px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
    #loop-sorter .feedback{min-height:48px;display:flex;align-items:center;gap:16px;font-size:var(--fs-sec);line-height:1.4;color:var(--muted)}
    #loop-sorter .feedback strong{color:var(--text)}
    #loop-sorter .feedback .chain{font-family:var(--font-mono);color:var(--prediction);font-weight:700}
    #loop-sorter .btn{min-width:144px}

    .p19-foot{flex:0 0 78px;border-top:1px solid var(--rule);padding-top:16px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:64px;align-items:start}
    .p19-foot .claim{font-family:var(--font-serif);font-size:var(--fs-body);line-height:1.42;font-weight:700}
    .p19-foot .next{font-size:var(--fs-sec);line-height:1.42;color:var(--muted)}
    .p19-foot .next b{color:var(--text)}

    @media (prefers-reduced-motion: reduce){
      #loop-sorter .loopback{transition:none}
    }
  </style>
</head>
<body data-page="19" data-total="21">
  <div id="stage">
    <header class="p19-head">
      <p class="kicker">V-01 · LOOP CHECK</p>
      <h1>排对四步，就抓住了学习的数学动作</h1>
    </header>

    <section id="loop-sorter" aria-label="训练循环排序互动">
      <div class="workbench">
        <div class="slot-region">
          <div class="axis-label">训练循环 · 从左到右</div>
          <div class="k-process" data-slots></div>
          <div class="loopback" aria-hidden="true"></div>
          <div class="loop-label">用新参数处理下一批样本</div>
        </div>
        <div class="ledger">
          <div class="ledger-label">
            <strong>待排步骤</strong>
            <span>拖到上方，或先选条目再点槽位。</span>
          </div>
          <div class="pool" data-pool></div>
        </div>
      </div>
      <div class="control-row">
        <div class="feedback" data-feedback aria-live="polite"></div>
        <button class="btn" type="button" data-reset>重新打乱</button>
      </div>
    </section>

    <footer class="p19-foot">
      <div class="claim">模型每次学习，都是先得到错误，再把错误变成参数的修改方向。</div>
      <div class="next"><b>下一问</b><br>训练误差降下去，模型就真的理解了吗？</div>
    </footer>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
  (() => {
    const root = document.getElementById('loop-sorter');
    if (!root) return;
    const slotsEl = root.querySelector('[data-slots]');
    const poolEl = root.querySelector('[data-pool]');
    const feedbackEl = root.querySelector('[data-feedback]');
    const statusEl = feedbackEl;
    const resetBtn = root.querySelector('[data-reset]');
    const workbench = root.querySelector('.workbench');

    const items = Object.freeze({
      back: { name:'反传', copy:'从输出错误倒着分配责任，为每个参数得到改动方向。', output:'各参数的方向' },
      forward: { name:'前向', copy:'样本进入模型，按当前参数得到预测。', output:'预测' },
      update: { name:'更新', copy:'按学习率沿建议方向迈一小步，得到新参数。', output:'更新后的参数' },
      loss: { name:'损失', copy:'把预测与真实答案比较，压成一个损失数。', output:'错误的数值' }
    });
    const correct = ['forward','loss','back','update'];
    const initialPool = ['back','forward','update','loss'];
    let state = makeInitial();
    let dragId = null;
    let timers = [];
    let destroyed = false;

    function makeInitial(){ return { slots:[null,null,null,null], pool:[...initialPool], selected:null, locked:false, active:-1 }; }
    function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
    function isComplete(){ return state.slots.every(Boolean) && state.slots.every((id,i)=>id===correct[i]); }
    function firstBreak(){
      if (!state.slots.every(Boolean) || isComplete()) return -1;
      for (let i=0;i<3;i++) if (state.slots[i+1] !== correct[correct.indexOf(state.slots[i])+1]) return i;
      return 2;
    }
    function itemMarkup(id, outputVisible){
      const it=items[id];
      return `<span class="step-name">${it.name}</span><span class="step-copy">${it.copy}</span>${outputVisible?`<span class="step-output">产出 · ${it.output}</span>`:''}`;
    }
    function announce(text){ statusEl.setAttribute('aria-label',text); }
    function moveToSlot(id,index){
      if (state.locked || !id || index<0 || index>3) return;
      const oldIndex=state.slots.indexOf(id);
      const displaced=state.slots[index];
      if (oldIndex>=0) state.slots[oldIndex]=displaced || null;
      else state.pool=state.pool.filter(x=>x!==id);
      if (displaced && oldIndex<0) state.pool.push(displaced);
      state.slots[index]=id;
      state.selected=null;
      state.active=index;
      evaluate();
    }
    function returnToPool(id){
      if (state.locked) return;
      const i=state.slots.indexOf(id);
      if(i<0) return;
      state.slots[i]=null;
      if(!state.pool.includes(id)) state.pool.push(id);
      state.selected=id;
      state.active=-1;
      evaluate();
    }
    function swapSlot(index,delta){
      if(state.locked) return;
      const target=index+delta;
      if(target<0 || target>3 || !state.slots[index]) return;
      [state.slots[index],state.slots[target]]=[state.slots[target],state.slots[index]];
      state.active=target;
      evaluate();
      requestAnimationFrame(()=>root.querySelector(`[data-slot="${target}"]`)?.focus());
    }
    function evaluate(){
      clearTimers();
      const filled=state.slots.filter(Boolean).length;
      if(filled<4){ state.locked=false; render(); announce(`还差 ${4-filled} 步`); return; }
      if(!isComplete()){ state.locked=false; render(); announce('这里还没有产生下一步需要的东西'); return; }
      state.locked=true; state.active=-1; render();
      if(Deck.reduced()) { state.active=3; render(); announce('排序正确：预测，错误数值，参数方向，新参数'); return; }
      [0,1,2,3].forEach((n)=>{
        timers.push(setTimeout(()=>{ state.active=n; render(); }, n*500));
      });
      timers.push(setTimeout(()=>announce('排序正确：预测，错误数值，参数方向，新参数'), 1820));
    }
    function render(){
      if(destroyed) return;
      const complete=isComplete();
      root.classList.toggle('complete',complete);
      const broken=firstBreak();
      slotsEl.innerHTML=state.slots.map((id,i)=>{
        const current=state.active===i?' current':'';
        const locked=state.locked?' locked':'';
        const breakClass=broken===i?' break-after':'';
        return `<button type="button" class="step step-slot${current}${locked}${breakClass}" data-slot="${i}" ${id&&!state.locked?'draggable="true"':''} aria-label="第 ${i+1} 步${id?'，'+items[id].name:'，空槽'}"><span class="slot-no">0${i+1}</span>${id?itemMarkup(id,true):'<span class="empty-label">放入一步</span>'}${broken===i?'<span class="break-mark" aria-hidden="true"></span>':''}</button>`;
      }).join('');
      poolEl.innerHTML=initialPool.map(id=>state.pool.includes(id)?`<button type="button" class="entry${state.selected===id?' selected':''}" draggable="true" data-item="${id}" aria-pressed="${state.selected===id}">${itemMarkup(id,false)}</button>`:'<div class="pool-gap">已放入上方</div>').join('');
      const filled=state.slots.filter(Boolean).length;
      if(complete) feedbackEl.innerHTML='<strong>顺序成立</strong><span class="chain">预测 → 错误数值 → 参数方向 → 新参数</span>';
      else if(filled<4) feedbackEl.innerHTML=`<strong>还差 ${4-filled} 步</strong><span>每一步的产出，必须能成为下一步的输入。</span>`;
      else feedbackEl.innerHTML='<strong>第一处因果断裂已用双线标出</strong><span>这里还没有产生下一步需要的东西。</span>';
    }
    function onClick(e){
      const item=e.target.closest('[data-item]');
      const slot=e.target.closest('[data-slot]');
      if(item){
        const id=item.dataset.item;
        state.selected=state.selected===id?null:id;
        render();
        announce(state.selected?`已选中${items[id].name}，请点一个槽位`:`已取消选择${items[id].name}`);
      } else if(slot){
        const i=Number(slot.dataset.slot);
        if(state.selected) moveToSlot(state.selected,i);
        else if(state.slots[i] && !state.locked){ state.selected=state.slots[i]; render(); announce(`已选中${items[state.selected].name}，可点另一槽位换位，或按左右方向键`); }
      }
    }
    function onKey(e){
      const slot=e.target.closest('[data-slot]');
      if(slot && (e.key==='ArrowLeft'||e.key==='ArrowRight')){
        e.preventDefault();e.stopPropagation();swapSlot(Number(slot.dataset.slot),e.key==='ArrowLeft'?-1:1);
      }
      if(slot && (e.key==='Backspace'||e.key==='Delete') && state.slots[Number(slot.dataset.slot)]){
        e.preventDefault();e.stopPropagation();returnToPool(state.slots[Number(slot.dataset.slot)]);
      }
    }
    function onDragStart(e){
      const source=e.target.closest('[data-item], [data-slot]');
      if(!source || state.locked) return;
      dragId=source.dataset.item || state.slots[Number(source.dataset.slot)];
      if(!dragId) return;
      source.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',dragId);
    }
    function onDragOver(e){
      const slot=e.target.closest('[data-slot]');
      if(!slot || !dragId || state.locked) return;
      e.preventDefault();
      root.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));
      slot.classList.add('drop-target');
    }
    function onDrop(e){
      const slot=e.target.closest('[data-slot]');
      if(!slot || !dragId || state.locked) return;
      e.preventDefault();moveToSlot(dragId,Number(slot.dataset.slot));dragId=null;
    }
    function onDragEnd(){ dragId=null;root.querySelectorAll('.dragging,.drop-target').forEach(x=>x.classList.remove('dragging','drop-target')); }
    function reset(){
      clearTimers();dragId=null;state=makeInitial();render();announce('已恢复固定乱序：反传、前向、更新、损失');
    }

    root.addEventListener('click',onClick);
    root.addEventListener('keydown',onKey);
    root.addEventListener('dragstart',onDragStart);
    root.addEventListener('dragover',onDragOver);
    root.addEventListener('drop',onDrop);
    root.addEventListener('dragend',onDragEnd);
    resetBtn.addEventListener('click',reset);
    render();
    Deck.init({index:19,total:21});

    root.destroyLoopSorter=()=>{
      if(destroyed) return; destroyed=true; clearTimers();
      root.removeEventListener('click',onClick);root.removeEventListener('keydown',onKey);
      root.removeEventListener('dragstart',onDragStart);root.removeEventListener('dragover',onDragOver);
      root.removeEventListener('drop',onDrop);root.removeEventListener('dragend',onDragEnd);
      resetBtn.removeEventListener('click',reset);delete root.destroyLoopSorter;
    };
  })();
  </script>
</body>
</html>
