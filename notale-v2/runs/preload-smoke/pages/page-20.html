<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="20" data-total="21">
  <div id="stage">
    <style>
      #stage{
        display:flex;
        flex-direction:column;
        gap:24px;
        overflow:hidden;
      }
      .page-head{
        flex:0 0 112px;
        display:flex;
        flex-direction:column;
        justify-content:flex-start;
        gap:8px;
        border-bottom:1px solid var(--rule);
      }
      .page-head .kicker{
        margin:0;
        color:var(--muted);
        font-family:var(--font-mono);
        font-size:var(--fs-label);
        font-weight:700;
        letter-spacing:.08em;
      }
      .page-head h1{
        margin:0;
        color:var(--text);
        font-family:var(--font-sans);
        font-size:var(--fs-h1);
        line-height:1.08;
        font-weight:700;
      }
      .comparison-shell{
        flex:1;
        min-height:0;
        display:flex;
        flex-direction:column;
        border-top:2px solid var(--text);
        border-bottom:2px solid var(--text);
      }
      .comparison-head,
      .comparison-row{
        display:grid;
        grid-template-columns:176px minmax(0,1fr) minmax(0,1fr);
        column-gap:0;
      }
      .comparison-head{
        flex:0 0 70px;
        align-items:stretch;
        border-bottom:2px solid var(--text);
      }
      .corner-label,
      .col-head{
        display:flex;
        align-items:center;
        min-width:0;
      }
      .corner-label{
        color:var(--muted);
        font-size:var(--fs-label);
        font-weight:700;
        letter-spacing:.08em;
      }
      .col-head{
        padding:0 24px;
        font-size:var(--fs-lead);
        line-height:1.2;
        font-weight:700;
      }
      .col-head.cannot{
        border-left:2px solid var(--text);
        position:relative;
      }
      .col-head.cannot::before{
        content:"";
        position:absolute;
        left:-3px;
        top:20px;
        width:4px;
        height:30px;
        background:var(--attention);
      }
      .comparison-body{
        flex:1;
        min-height:0;
        display:flex;
        flex-direction:column;
      }
      .comparison-row{
        flex:1 1 0;
        min-height:0;
        align-items:stretch;
        border-bottom:1px solid var(--rule);
      }
      .comparison-row:last-child{border-bottom:0;}
      .dimension{
        display:flex;
        align-items:center;
        padding-right:24px;
        font-size:var(--fs-h2);
        line-height:1;
        font-weight:700;
      }
      .pair{
        grid-column:2 / 4;
        display:grid;
        grid-template-columns:minmax(0,1fr) minmax(0,1fr);
        column-gap:0;
        min-width:0;
      }
      .statement{
        display:flex;
        align-items:center;
        min-width:0;
        padding:16px 32px 16px 24px;
        font-size:var(--fs-body);
        line-height:1.38;
      }
      .statement.cannot{
        position:relative;
        border-left:2px solid var(--text);
        padding-left:32px;
        font-weight:600;
      }
      .statement.cannot::before{
        content:"";
        position:absolute;
        left:-3px;
        top:calc(50% - 12px);
        width:4px;
        height:24px;
        background:var(--attention);
      }
      .bottom-band{
        flex:0 0 116px;
        display:grid;
        grid-template-columns:minmax(0,1fr) auto;
        align-items:center;
        column-gap:64px;
        border-top:1px solid var(--rule);
      }
      .closing{
        margin:0;
        font-family:var(--font-serif);
        font-size:var(--fs-lead);
        line-height:1.35;
        font-weight:700;
      }
      .prompt{
        margin:0;
        max-width:520px;
        padding-left:24px;
        border-left:2px solid var(--attention);
        color:var(--text);
        font-size:var(--fs-sec);
        line-height:1.4;
      }
      .prompt strong{
        display:block;
        margin-bottom:4px;
        color:var(--attention);
        font-family:var(--font-mono);
        font-size:var(--fs-label);
        letter-spacing:.06em;
      }
    </style>

    <header class="page-head">
      <p class="kicker">V-02 · CLAIM LIMIT</p>
      <h1>误差下降，不等于模型理解了</h1>
    </header>

    <main class="k-comparison comparison-shell min0" aria-label="误差下降能够支持与不能自动支持的结论比较">
      <div class="comparison-head">
        <div class="corner-label">判断维度</div>
        <div class="col-head">这一步可以推出</div>
        <div class="col-head cannot">这一步不能跳过去</div>
      </div>

      <div class="comparison-body min0">
        <section class="comparison-row rowline">
          <div class="dimension dim">拟合</div>
          <div class="pair split-lr min0">
            <div class="statement min0">模型更贴合给定的训练数据与目标。</div>
            <div class="statement cannot diff min0">它在所有现实情境中都会同样有效。</div>
          </div>
        </section>

        <section class="comparison-row rowline">
          <div class="dimension dim">理解</div>
          <div class="pair split-lr min0">
            <div class="statement min0">模型找到了能降低错误的参数。</div>
            <div class="statement cannot diff min0">模型拥有与人相同的理解。</div>
          </div>
        </section>

        <section class="comparison-row rowline">
          <div class="dimension dim">因果</div>
          <div class="pair split-lr min0">
            <div class="statement min0">模型利用了数据中有助预测的关系。</div>
            <div class="statement cannot diff min0">它识别出了事件之间的因果关系。</div>
          </div>
        </section>

        <section class="comparison-row rowline">
          <div class="dimension dim">公平</div>
          <div class="pair split-lr min0">
            <div class="statement min0">可以按既定指标测量不同样本上的表现。</div>
            <div class="statement cannot diff min0">数据覆盖充分、目标合理，或结果对所有人公平。</div>
          </div>
        </section>
      </div>
    </main>

    <footer class="bottom-band">
      <p class="closing">误差下降只证明：在给定数据和目标下，这个模型拟合得更好了。</p>
      <p class="prompt"><strong>下一问</strong>那么，神经网络的学习最短可以怎样说？</p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>Deck.init({index:20,total:21});</script>
</body>
</html>
