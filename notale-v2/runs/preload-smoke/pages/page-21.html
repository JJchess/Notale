<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用错误指方向，再反复迈小步</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root{
      --bg:#F4F1E8;
      --text:#1E252B;
      --font-sans:"DejaVu Sans","Noto Sans CJK SC",sans-serif;
    }
    #stage{
      display:flex;
      flex-direction:column;
      overflow:hidden;
      color:var(--text);
    }
    .page-head{
      flex:0 0 144px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      border-bottom:1px solid var(--rule);
    }
    .page-head .kicker{
      margin:0 0 8px;
      color:var(--muted);
      font-family:var(--font-mono);
      font-size:var(--fs-label);
      font-weight:700;
      letter-spacing:.12em;
    }
    .page-head h1{
      margin:0;
      font-family:var(--font-sans);
      font-size:var(--fs-h1);
      line-height:1.08;
      font-weight:760;
      letter-spacing:-.025em;
    }
    .summary-line{
      margin:12px 0 0;
      max-width:1240px;
      color:var(--muted);
      font-family:var(--font-serif);
      font-size:var(--fs-body);
      line-height:1.4;
    }
    .takeaway{
      flex:1;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0;
    }
    .takeaway-inner{
      width:1400px;
      height:560px;
      box-sizing:border-box;
      padding:24px 40px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }
    .claim{
      width:1240px;
      padding:32px 40px 34px;
      border-top:3px solid var(--text);
      border-bottom:3px solid var(--text);
      background:var(--surface);
      text-align:center;
      font-family:var(--font-serif);
      font-size:var(--fs-h1);
      line-height:1.35;
      font-weight:700;
    }
    .trunk{
      width:1px;
      height:40px;
      flex:0 0 40px;
      background:var(--rule);
      position:relative;
    }
    .trunk::after{
      content:"";
      position:absolute;
      left:-5px;
      bottom:-1px;
      width:11px;
      height:11px;
      box-sizing:border-box;
      border:2px solid var(--text);
      background:var(--bg);
    }
    .supports{
      position:relative;
      width:1280px;
      height:258px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      align-items:start;
    }
    .process-rail{
      position:absolute;
      left:108px;
      right:108px;
      top:25px;
      height:2px;
      background:var(--rule);
    }
    .forward-segment{
      position:absolute;
      left:108px;
      width:356px;
      top:25px;
      height:2px;
      background:var(--prediction);
    }
    .forward-segment::after{
      content:"";
      position:absolute;
      right:-1px;
      top:-5px;
      width:10px;
      height:10px;
      border-top:2px solid var(--prediction);
      border-right:2px solid var(--prediction);
      transform:rotate(45deg);
    }
    .update-tick{
      position:absolute;
      right:99px;
      top:14px;
      width:3px;
      height:24px;
      background:var(--attention);
    }
    .support{
      position:relative;
      z-index:1;
      min-width:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      height:240px;
      padding:0 16px 8px;
      justify-content:space-between;
      text-align:center;
    }
    .support .node{
      width:18px;
      height:18px;
      box-sizing:border-box;
      border:2px solid var(--text);
      background:var(--bg);
    }
    .support:first-of-type .node{
      border-color:var(--prediction);
    }
    .support:last-of-type .node{
      border-width:3px;
      border-color:var(--attention);
    }
    .support .phrase{
      font-size:var(--fs-h1);
      line-height:1.35;
      font-weight:700;
      white-space:nowrap;
    }
    .support .role{
      margin-top:-6px;
      color:var(--muted);
      font-size:var(--fs-lead);
      line-height:1.35;
      letter-spacing:0;
    }
    .recap{
      width:1240px;
      margin:0;
      padding-top:16px;
      border-top:1px solid var(--rule);
      display:flex;
      justify-content:center;
      gap:64px;
      color:var(--text);
      font-size:var(--fs-body);
      line-height:1.4;
    }
    .recap span{
      flex:1;
      min-width:0;
      text-align:center;
    }
    .page-foot{
      flex:0 0 144px;
      display:grid;
      grid-template-columns:1fr 1.2fr;
      gap:64px;
      align-items:center;
      border-top:1px solid var(--rule);
    }
    .exit-check,
    .next-question{
      min-width:0;
      margin:0;
      line-height:1.45;
    }
    .exit-check{
      font-size:var(--fs-body);
      font-weight:700;
    }
    .audit-terms{
      display:flex;
      gap:24px;
      align-items:baseline;
    }
    .audit-terms span{
      font-size:var(--fs-h1);
      line-height:1.2;
      font-weight:800;
    }
    .audit-terms span + span::before{
      content:"/";
      margin-right:24px;
      color:var(--rule);
      font-weight:400;
    }
    .next-question{
      padding-left:24px;
      border-left:1px solid var(--rule);
      color:var(--muted);
      font-size:var(--fs-body);
    }
    .foot-label{
      display:block;
      margin-bottom:6px;
      color:var(--attention);
      font-family:var(--font-mono);
      font-size:var(--fs-label);
      font-weight:700;
      letter-spacing:.08em;
    }
  </style>
</head>
<body data-page="21" data-total="21">
  <div id="stage">
    <header class="page-head">
      <p class="kicker">V-03 · TAKEAWAY</p>
      <h1>用错误指方向，再反复迈小步</h1>
      <p class="summary-line">神经网络学习，就是用错误为每个参数指出方向，再反复迈小步。</p>
    </header>

    <main class="takeaway focus min0" aria-labelledby="main-claim">
      <section class="takeaway-inner k-generalization" aria-label="神经网络学习的最终复述">
        <div class="claim" id="main-claim">学习 = 用错误指导参数修改，并重复这个动作</div>
        <div class="trunk" aria-hidden="true"></div>
        <div class="supports" aria-label="四个已学动作">
          <div class="process-rail" aria-hidden="true"></div>
          <div class="forward-segment" aria-hidden="true"></div>
          <div class="update-tick" aria-hidden="true"></div>
          <div class="support">
            <span class="node" aria-hidden="true"></span>
            <span class="phrase">做出<br>预测</span>
            <span class="role">由当前参数<br>产生 ŷ</span>
          </div>
          <div class="support">
            <span class="node" aria-hidden="true"></span>
            <span class="phrase">把错误<br>变成数</span>
            <span class="role">比较 ŷ<br>与目标 y</span>
          </div>
          <div class="support">
            <span class="node" aria-hidden="true"></span>
            <span class="phrase">为参数<br>指出方向</span>
            <span class="role">读出损失<br>变化方向</span>
          </div>
          <div class="support">
            <span class="node" aria-hidden="true"></span>
            <span class="phrase">迈小步<br>再重复</span>
            <span class="role">学习率<br>控制步幅</span>
          </div>
        </div>
        <p class="recap"><span>错误落实为每个参数的修改方向。</span><span>一次迈一小步，下一轮再用新预测检验。</span></p>
      </section>
    </main>

    <footer class="page-foot">
      <div class="exit-check"><span class="foot-label">看到“学会了”，先找</span><div class="audit-terms"><span>目标</span><span>错误</span><span>参数更新</span></div></div>
      <p class="next-question"><span class="foot-label">下次听到</span>“模型学会了”，你会先问它依据什么数据、目标和误差吗？</p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>Deck.init({index:21,total:21});</script>
</body>
</html>
