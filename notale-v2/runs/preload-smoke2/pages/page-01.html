<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{
    padding:var(--pad-y) var(--pad-x);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
  }
  .page-head{
    flex:0 0 152px;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    gap:8px;
    border-bottom:1px solid var(--rule-soft);
  }
  .page-head .kicker{
    margin:0;
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:var(--fs-label);
    font-weight:700;
    letter-spacing:.12em;
  }
  .page-head h1{
    margin:0;
    max-width:1100px;
    font-family:var(--font-sans);
    font-size:var(--fs-h1);
    line-height:1.12;
    font-weight:700;
    letter-spacing:-.025em;
  }
  .main{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    padding-top:8px;
  }
  .focus{
    flex:1;
    min-height:0;
    display:flex;
    align-items:stretch;
    justify-content:center;
  }
  .k-generalization{
    width:100%;
    min-height:0;
    display:grid;
    grid-template-rows:145px 63px minmax(0,1fr);
    position:relative;
    border:1px solid var(--rule);
    padding:8px 40px 16px;
  }
  .claim{
    width:1120px;
    justify-self:center;
    align-self:start;
    padding:24px 40px;
    border-top:2px solid var(--text);
    border-bottom:2px solid var(--text);
    text-align:center;
    font-family:var(--font-serif);
    font-size:var(--fs-h1);
    line-height:1.25;
    font-weight:600;
  }
  .claim strong{
    font-weight:700;
    text-decoration:underline;
    text-decoration-color:var(--attention);
    text-decoration-thickness:3px;
    text-underline-offset:8px;
  }
  .trunk{
    width:calc(100% - 160px);
    height:63px;
    justify-self:center;
    position:relative;
    margin:0;
    transform:none;
    align-self:start;
    padding:0;
    border:0;
    background:transparent;
  }
  .trunk::before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    width:1px;
    height:32px;
    background:var(--rule);
  }
  .trunk::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:54px;
    height:1px;
    background:var(--rule);
  }
  .trace-label{
    position:absolute;
    left:50%;
    top:14px;
    transform:translateX(-50%);
    padding:8px 24px;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    font-size:var(--fs-lead);
    font-weight:700;
    letter-spacing:0;
    white-space:nowrap;
  }
  .supports{
    min-height:0;
    display:grid;
    grid-template-columns:1fr 48px 1fr 48px 1fr;
    align-items:stretch;
    padding:24px;
    gap:0;
  }
  .support{
    min-width:0;
    position:relative;
    padding:32px 32px 24px;
    border:1px solid var(--rule);
  }
  .support::before{
    content:"";
    position:absolute;
    left:50%;
    top:-45px;
    width:1px;
    height:44px;
    background:var(--rule);
  }
  .support .mark{
    display:block;
    margin-bottom:24px;
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:var(--fs-h2);
    font-weight:700;
    letter-spacing:.1em;
  }
  .support h2{
    margin:0 0 16px;
    font-family:var(--font-sans);
    font-size:var(--fs-h1);
    line-height:1.1;
    font-weight:700;
  }
  .support p{
    margin:0;
    max-width:360px;
    color:var(--muted);
    font-size:var(--fs-lead);
    line-height:1.35;
  }
  .support p span{
    display:block;
    margin-bottom:8px;
  }
  .support p b{
    display:block;
    margin:0 0 8px;
    color:var(--text);
    font-family:var(--font-mono);
    font-size:var(--fs-h2);
    line-height:1;
    font-weight:400;
  }
  .support.final{
    border:1px solid var(--rule);
    border-top:3px solid var(--attention);
    padding-top:30px;
  }
  .support.final::before{ background:var(--attention); }
  .revision{
    display:inline-flex;
    align-items:center;
    gap:16px;
    width:100%;
    justify-content:center;
    margin-top:16px;
    padding:8px 16px;
    background:var(--surface);
    border:1px solid var(--rule);
    font-family:var(--font-mono);
    font-size:var(--fs-lead);
    font-weight:700;
    white-space:nowrap;
  }
  .revision .arrow{ color:var(--attention); }
  .causal{
    align-self:stretch;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding-top:72px;
    color:var(--text);
    font-size:var(--fs-h2);
    line-height:1;
  }
  .next-question{
    flex:0 0 68px;
    display:flex;
    align-items:flex-end;
    justify-content:flex-end;
    border-top:1px solid var(--rule-soft);
    color:var(--text);
    font-size:var(--fs-h1);
    font-weight:700;
  }
  .next-question span{
    color:var(--attention);
    margin-right:8px;
    font-family:var(--font-mono);
  }
</style>
</head>
<body data-page="01" data-total="21">
<div id="stage">
  <header class="page-head">
    <p class="kicker">ACT I · OPEN</p>
    <h1>“学习”不是魔法，<br>而是几次看得见的参数修改</h1>
  </header>

  <main class="main min0">
    <section class="focus min0" aria-label="从可见痕迹归纳神经网络学习">
      <div class="k-generalization min0">
        <div class="claim">神经网络会用样本<strong>检查预测器</strong>，再改动其中可调的数字。</div>
        <div class="trunk" aria-hidden="true"><span class="trace-label">预测器 → 用样本检查 → 修改参数</span></div>
        <div class="supports panel min0" aria-label="三条实验痕迹">
          <article class="support min0">
            <span class="mark">01</span>
            <h2>预测器</h2>
            <p><span>根据输入</span><b aria-hidden="true">↓</b><span>给出答案的规则</span></p>
          </article>
          <div class="causal" aria-hidden="true">→</div>
          <article class="support min0">
            <span class="mark">02</span>
            <h2>参数</h2>
            <p><span>预测器里</span><b aria-hidden="true">↓</b><span>可以被改动的数字</span></p>
          </article>
          <div class="causal" aria-hidden="true">→</div>
          <article class="support final min0">
            <span class="mark">03</span>
            <h2>学习痕迹</h2>
            <p><span>检查答案，再留下</span></p>
            <div class="revision" aria-label="更新前到更新后"><span>更新前</span><span class="arrow">→</span><span>更新后</span></div>
          </article>
        </div>
      </div>
    </section>
  </main>

  <div class="next-question"><span>下一问</span>这些修改按什么顺序发生？</div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
