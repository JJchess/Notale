<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>误差下降的边界</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root{
      --bg:#F4F1E8;
      --text:#1E252B;
      --font-sans:"DejaVu Sans","Noto Sans CJK SC",sans-serif;
    }
    #stage{
      display:flex;
      flex-direction:column;
      gap:24px;
      overflow:hidden;
    }
    .page-head{
      flex:0 0 104px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      gap:8px;
      border-bottom:1px solid var(--rule);
    }
    .page-head .kicker{
      margin:0;
      color:var(--muted);
      font-family:var(--font-mono);
      font-size:var(--fs-label);
      font-weight:700;
      letter-spacing:.11em;
      line-height:1.2;
    }
    .page-head h1{
      margin:0;
      font-family:var(--font-sans);
      font-size:var(--fs-h1);
      line-height:1.08;
      letter-spacing:-.025em;
      font-weight:750;
    }
    .comparison-field{
      flex:1 1 auto;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:16px;
    }
    .comparison-caption{
      flex:0 0 32px;
      display:grid;
      grid-template-columns:176px minmax(0,1fr);
      column-gap:24px;
      align-items:end;
      color:var(--muted);
      font-size:var(--fs-label);
      line-height:1.25;
    }
    .comparison-caption .pair-head{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      column-gap:64px;
    }
    .comparison-caption .hdr{
      font-size:var(--fs-lead);
      line-height:1.15;
      font-weight:750;
      color:var(--text);
    }
    .comparison-caption .hdr:last-child{
      position:relative;
      padding-left:24px;
    }
    .comparison-caption .hdr:last-child::before{
      content:"";
      position:absolute;
      left:0;
      top:4px;
      bottom:3px;
      width:3px;
      background:var(--attention);
    }
    .k-comparison{
      flex:1 1 auto;
      min-height:0;
      display:grid;
      grid-template-columns:176px minmax(0,1fr);
      column-gap:24px;
      border-top:2px solid var(--text);
      border-bottom:1px solid var(--rule);
    }
    .dimension-rail,
    .compare-pair,
    .compare-side{
      min-height:0;
    }
    .dimension-rail,
    .compare-side{
      display:grid;
      grid-template-rows:repeat(4,minmax(0,1fr));
    }
    .dimension-rail{
      border-right:1px solid var(--rule);
      padding-right:24px;
    }
    .dim,
    .rowline{
      min-height:0;
      display:flex;
      align-items:center;
      border-bottom:1px solid var(--rule-soft);
    }
    .dimension-rail > :last-child,
    .compare-side > :last-child{
      border-bottom:0;
    }
    .dim{
      font-family:var(--font-mono);
      font-size:var(--fs-body);
      font-weight:700;
      color:var(--muted);
      letter-spacing:.04em;
    }
    .compare-pair.split-lr{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      column-gap:64px;
    }
    .compare-side.right{
      position:relative;
    }
    .compare-side.right::before{
      content:"";
      position:absolute;
      left:-32px;
      top:0;
      bottom:0;
      width:1px;
      background:var(--rule);
    }
    .rowline{
      position:relative;
      padding:16px 8px 16px 0;
      font-size:var(--fs-body);
      line-height:1.42;
    }
    .compare-side.left .rowline{
      font-weight:650;
    }
    .compare-side.right .rowline{
      padding-left:24px;
      color:var(--text);
    }
    .diff::before{
      content:"";
      position:absolute;
      left:0;
      width:8px;
      height:8px;
      background:var(--attention);
    }
    .bottom-zone{
      flex:0 0 152px;
      display:grid;
      grid-template-columns:minmax(0,1fr) 450px;
      column-gap:64px;
      align-items:center;
      border-top:2px solid var(--text);
    }
    .claim-wrap{
      min-width:0;
    }
    .boundary-question{
      margin:0 0 8px;
      font-family:var(--font-mono);
      font-size:var(--fs-label);
      font-weight:700;
      color:var(--attention);
      letter-spacing:.05em;
    }
    .takeaway{
      margin:0;
      font-family:var(--font-serif);
      font-size:var(--fs-lead);
      font-weight:700;
      line-height:1.38;
    }
    .next{
      margin:0;
      padding-left:24px;
      border-left:1px solid var(--rule);
      color:var(--muted);
      font-size:var(--fs-sec);
      line-height:1.45;
    }
    .next strong{
      display:block;
      margin-top:8px;
      color:var(--text);
      font-size:var(--fs-body);
      font-weight:700;
    }
  </style>
</head>
<body data-page="20" data-total="21">
  <div id="stage">
    <header class="page-head">
      <p class="kicker">V-02 · CLAIM LIMIT</p>
      <h1>误差下降，不等于模型理解了</h1>
    </header>

    <main class="comparison-field min0" aria-label="训练误差下降能说明与不能自动说明的比较">
      <div class="comparison-caption" aria-hidden="true">
        <span>同一判断维度</span>
        <div class="pair-head">
          <span class="hdr">这一步可以推出</span>
          <span class="hdr">这一步不能跳过去</span>
        </div>
      </div>

      <section class="k-comparison min0" aria-label="四项判断边界">
        <div class="dimension-rail min0">
          <div class="dim">拟合</div>
          <div class="dim">理解</div>
          <div class="dim">因果</div>
          <div class="dim">公平</div>
        </div>

        <div class="compare-pair split-lr min0">
          <div class="compare-side left min0">
            <div class="rowline">模型更贴合给定的训练数据与目标。</div>
            <div class="rowline">模型找到了能降低错误的参数。</div>
            <div class="rowline">模型利用了数据中有助预测的关系。</div>
            <div class="rowline">可以按既定指标测量不同样本上的表现。</div>
          </div>
          <div class="compare-side right min0">
            <div class="rowline diff">它在所有现实情境中都会同样有效。</div>
            <div class="rowline diff">模型拥有与人相同的理解。</div>
            <div class="rowline diff">它识别出了事件之间的因果关系。</div>
            <div class="rowline diff">数据覆盖充分、目标合理，或结果对所有人公平。</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="bottom-zone">
      <div class="claim-wrap min0">
        <p class="boundary-question">先问：给定的是什么数据？优化的是什么目标？</p>
        <p class="takeaway">误差下降只证明：在给定数据和目标下，这个模型拟合得更好了。</p>
      </div>
      <p class="next">下一问<strong>那么，神经网络的学习最短可以怎样说？</strong></p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>Deck.init({index:20,total:21});</script>
</body>
</html>
