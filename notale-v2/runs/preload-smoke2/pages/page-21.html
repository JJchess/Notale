<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用错误指方向，再反复迈小步</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{
      display:flex;
      flex-direction:column;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
    }
    .page-head{
      flex:0 0 112px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      border-bottom:1px solid var(--rule-soft);
    }
    .page-head .kicker{
      margin:0 0 8px;
      color:var(--muted);
      font-family:var(--font-mono);
      font-size:var(--fs-label);
      font-weight:700;
      letter-spacing:.12em;
    }
    .page-head h1{
      margin:0;
      font-family:var(--font-sans);
      font-size:var(--fs-h1);
      line-height:1.12;
      letter-spacing:-.025em;
    }
    .main{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:24px 32px 16px;
    }
    .k-generalization{
      width:100%;
      max-width:1360px;
      min-height:570px;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:16px 40px;
    }
    .claim{
      width:1180px;
      min-height:150px;
      box-sizing:border-box;
      border:0;
      border-bottom:2px solid var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 40px;
      text-align:center;
      font-family:var(--font-serif);
      font-size:var(--fs-h2);
      font-weight:700;
      line-height:1.35;
      gap:16px;
      position:relative;
    }
    .claim::after{
      content:"";
      position:absolute;
      left:50%;
      top:100%;
      width:1px;
      height:16px;
      background:var(--rule);
    }
    .process-wrap{
      width:100%;
      padding-top:16px;
    }
    .supports{
      position:relative;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:24px;
      padding-top:16px;
    }
    .supports::before{
      content:"";
      position:absolute;
      top:0;
      left:10%;
      right:10%;
      height:1px;
      background:var(--rule);
    }
    .support{
      position:relative;
      min-width:0;
      min-height:300px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:16px;
      border-top:2px solid var(--text);
      border-bottom:1px solid var(--rule-soft);
      text-align:center;
      font-size:var(--fs-lead);
      font-weight:650;
      line-height:1.35;
    }
    .support .verb{
      font-family:var(--font-mono);
      font-size:var(--fs-label);
      font-weight:700;
      letter-spacing:.08em;
      color:var(--muted);
    }
    .support.prediction .verb{ color:var(--prediction); }
    .support .detail{
      font-size:var(--fs-sec);
      font-weight:400;
      color:var(--muted);
    }
    .support::before{
      content:"";
      position:absolute;
      left:50%;
      bottom:100%;
      width:1px;
      height:16px;
      background:var(--rule);
    }
    .support:not(:last-child)::after{
      content:"";
      position:absolute;
      left:calc(100% + 8px);
      top:50%;
      width:24px;
      height:10px;
      border-top:1px solid var(--rule);
      border-right:1px solid var(--rule);
      transform:translateY(-5px) rotate(45deg);
    }
    .support.prediction{
      color:var(--prediction);
      border-top-color:var(--prediction);
    }
    .support.prediction::after{
      border-color:var(--prediction);
      border-left:0;
      border-bottom:0;
    }
    .support.update{
      border-top-color:var(--text);
    }
    .landing-tick{
      position:absolute;
      right:18px;
      top:-9px;
      width:3px;
      height:18px;
      background:var(--attention);
    }
    .summary{
      margin:16px 0 0;
      font-size:var(--fs-body);
      line-height:1.45;
      text-align:center;
      color:var(--muted);
    }
    .summary strong{
      color:var(--text);
      font-weight:700;
    }
    .page-foot{
      flex:0 0 112px;
      display:grid;
      grid-template-columns:minmax(0, .9fr) minmax(0, 1.1fr);
      gap:64px;
      align-items:center;
      border-top:1px solid var(--rule);
    }
    .exit-check,
    .next-question{
      min-width:0;
      margin:0;
      line-height:1.4;
    }
    .exit-check{
      font-size:var(--fs-sec);
      color:var(--muted);
    }
    .exit-check b{
      color:var(--text);
      font-weight:700;
    }
    .next-question{
      font-size:var(--fs-body);
      font-weight:650;
    }
    .next-question .mark{
      display:inline-block;
      width:12px;
      height:12px;
      margin-right:12px;
      border:2px solid var(--attention);
      vertical-align:1px;
    }
  </style>
</head>
<body data-page="21" data-total="21">
  <div id="stage">
    <header class="page-head">
      <p class="kicker">V-03 · TAKEAWAY</p>
      <h1>用错误指方向，再反复迈小步</h1>
    </header>

    <main class="main focus min0">
      <section class="k-generalization" aria-labelledby="takeaway">
        <div class="claim" id="takeaway">学习 = 用错误指导参数修改，并重复这个动作</div>

        <div class="process-wrap">
          <div class="supports" aria-label="训练循环的四个动作">
            <div class="support prediction min0">做出预测<span class="verb">预测</span><span class="detail">得到当前输出 ŷ</span></div>
            <div class="support min0">把错误变成数<span class="verb">计错</span><span class="detail">用损失 L 比较</span></div>
            <div class="support min0">为参数指出方向<span class="verb">定向</span><span class="detail">确定各参数怎么改</span></div>
            <div class="support update min0"><span class="landing-tick" aria-hidden="true"></span>迈小步，再重复<span class="verb">更新</span><span class="detail">更新后重新预测</span></div>
          </div>
        </div>

        <p class="summary"><strong>神经网络学习</strong>，就是用错误为每个参数指出方向，再反复迈小步。</p>
      </section>
    </main>

    <footer class="page-foot">
      <p class="exit-check"><b>离场自检</b>　看到“学会了”，先找：目标、错误、参数更新。</p>
      <p class="next-question"><span class="mark" aria-hidden="true"></span>下次听到“模型学会了”，你会先问它依据什么数据、目标和误差吗？</p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>Deck.init({ index: 21, total: 21 });</script>
</body>
</html>
