<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>缓冲溶液与酸碱滴定曲线</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --stage-w: 1600px;
      --stage-h: 900px;
    }

    #stage {
      position: relative;
      overflow: hidden;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 64px 80px;
    }

    #field {
      z-index: 1;
      pointer-events: none;
    }

    .cover-header {
      position: relative;
      z-index: 3;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .topic-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-label);
      color: var(--buffer);
      letter-spacing: 0.12em;
      font-weight: 600;
    }

    .topic-tag::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--buffer);
    }

    h1 {
      margin: 0;
      font-size: 54px;
      font-weight: 700;
      line-height: 1.18;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .lead-text {
      margin: 0;
      font-size: var(--fs-lead);
      line-height: 1.6;
      color: var(--muted);
      max-width: 680px;
    }

    .axis-preview {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding-top: 24px;
      border-top: 1px solid rgba(82, 105, 112, 0.22);
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .leg-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: var(--fs-label);
      color: var(--text);
    }

    .leg-mark {
      width: 22px;
      height: 3px;
      border-radius: 2px;
    }
    .leg-mark.acid { background: var(--acid); }
    .leg-mark.buffer { background: var(--buffer); height: 4px; }
    .leg-mark.base { background: var(--base); }

    .meta-track {
      display: flex;
      align-items: baseline;
      gap: 16px;
      font-family: var(--font-num), var(--font-sans);
      color: var(--muted);
      font-size: var(--fs-sec);
    }

    .meta-track .ph-range {
      color: var(--text);
      font-size: var(--fs-h2);
      font-weight: 600;
    }

    /* 右侧读数微卡：将滴定与缓冲的关键关系锚定在右下象限 */
    .metric-callout {
      position: absolute;
      right: 80px;
      bottom: 110px;
      z-index: 3;
      width: 330px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(82, 105, 112, 0.22);
      border-radius: 8px;
      padding: 24px 28px;
      box-shadow: 0 12px 32px rgba(20, 43, 51, 0.06);
      pointer-events: none;
    }

    .metric-callout .metric-title {
      font-size: var(--fs-sec);
      color: var(--muted);
      margin-bottom: 8px;
    }

    .metric-callout .metric-val {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-family: var(--font-num);
      font-size: 34px;
      font-weight: 700;
      color: var(--buffer);
      line-height: 1.1;
    }

    .metric-callout .metric-desc {
      margin-top: 12px;
      font-size: var(--fs-sec);
      line-height: 1.55;
      color: var(--text);
      opacity: 0.9;
    }
  </style>
</head>
<body data-page="01" data-total="17">
  <div id="stage">
    <canvas id="field" class="cv-fill no-pan" aria-hidden="true"></canvas>

    <header class="cover-header">
      <div class="topic-tag">分析化学与水溶液平衡</div>
      <h1>缓冲溶液与<br>酸碱滴定曲线</h1>
      <p class="lead-text">
        探究溶液在面对酸碱扰动时维持 pH 稳定的机理，并通过滴定剂体积全程追踪溶液组成与质子转移的连续演变。
      </p>
    </header>

    <aside class="metric-callout">
      <div class="metric-title">缓冲中点 / 突跃窗口</div>
      <div class="metric-val">
        <span>pH = pKₐ</span>
      </div>
      <div class="metric-desc">
        共轭酸碱对等浓度共存区形成最大缓冲容量；越过该区间后，滴定曲线在化学计量点附近发生质子势能剧烈突跃。
      </div>
    </aside>

    <footer class="axis-preview">
      <div class="legend-row">
        <div class="leg-item">
          <span class="leg-mark acid"></span>
          <span>强酸初始态 (pH 1.0–3.0)</span>
        </div>
        <div class="leg-item">
          <span class="leg-mark buffer"></span>
          <span>共轭缓冲平缓区 (ΔpH/ΔV 极小)</span>
        </div>
        <div class="leg-item">
          <span class="leg-mark base"></span>
          <span>滴定突跃与过量碱区 (pH &gt; 10.0)</span>
        </div>
      </div>
      <div class="meta-track">
        <span>滴定进程</span>
        <span class="ph-range">pH 1.00 → 13.00</span>
      </div>
    </footer>
  </div>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      const W = 1600;
      const H = 900;
      const SEED = "buffer-titration-curve-01";
      const canvas = document.getElementById("field");
      let ctx = null;
      let stopLoop = () => {};

      // 标题排除区与关键读数排除区
      const TITLE_ZONE = { x: 50, y: 40, w: 780, h: 420 };
      const CARD_ZONE = { x: 1160, y: 640, w: 380, h: 220 };

      // 滴定曲线数学模型（以弱酸 HA 被 NaOH 滴定为例的典型 S 型与突跃场）
      // x: 0 -> W (对应滴定体积 0 -> 50 mL, 化学计量点在 25 mL 即 x 约 1080 处)
      // y: H -> 0 (pH 0 -> 14)
      const V_EQ = 1080; // 化学计量点横坐标
      const Y_BASE = 720; // 初始高酸位点（pH ~ 2.5 对应画布下方）
      const Y_EQ = 410;   // 等当点对应画布中位 (pH 8.5)
      const Y_END = 190;  // 滴定终点过量碱区 (pH 12.5 对应画布上方)

      function titrationCurve(x) {
        // 返回代表性滴定主曲线在 x 点处的 y 坐标
        // 逻辑：前半段具有弱酸缓冲区的平缓凸出，在 V_EQ 处形成急剧突跃，随后平缓趋近强碱
        const norm = (x - V_EQ) / 90;
        const sigmoid = 1 / (1 + Math.exp(-norm));
        // 添加弱酸缓冲区起步轻微凹陷
        const bufferOffset = (x < V_EQ) ? Math.sin((x / V_EQ) * Math.PI) * 28 : 0;
        return (Y_BASE - (Y_BASE - Y_END) * sigmoid) - bufferOffset;
      }

      function insideZone(x, y, z) {
        return x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h;
      }

      function buildCurves() {
        const rng = new Math.seedrandom(SEED);
        const curves = [];
        const count = 48;

        // 生成多条反应流线，围绕滴定主轨迹产生受质子浓度与平衡常数调制的束流
        for (let i = 0; i < count; i++) {
          const pKaOffset = (rng() - 0.5) * 110;
          const slopeScale = 0.75 + rng() * 0.5;
          const points = [];
          const step = 8;
          const phase = rng() * Math.PI * 2;
          const isAcidZone = (i < count * 0.45);
          const isBufferZone = (i >= count * 0.45 && i < count * 0.8);

          for (let x = 120; x <= 1520; x += step) {
            // 真实滴定曲线基础
            const norm = (x - (V_EQ + (rng() - 0.5) * 20)) / (85 * slopeScale);
            const sig = 1 / (1 + Math.exp(-norm));
            const buf = (x < V_EQ) ? Math.sin((x / V_EQ) * Math.PI) * (26 + pKaOffset * 0.15) : 0;
            const baseY = (Y_BASE + pKaOffset * 0.8) - ((Y_BASE - Y_END) * sig) - buf;
            
            // 叠加极微弱的动力学扰动
            const drift = Math.sin(x * 0.008 + phase) * 3.5;
            const y = baseY + drift;

            points.push({ x, y });
          }

          curves.push({
            points,
            colorType: isBufferZone ? "buffer" : (isAcidZone ? "acid" : "base"),
            alpha: 0.14 + rng() * 0.28,
            lineWidth: (isBufferZone ? 1.6 : 1.1) + rng() * 0.8,
            speed: 0.00035 + rng() * 0.00045,
            tracerHead: rng()
          });
        }
        return curves;
      }

      let curves = [];
      const staticCanvas = document.createElement("canvas");
      let staticCtx = null;

      function renderStatic() {
        staticCanvas.width = canvas.width;
        staticCanvas.height = canvas.height;
        staticCtx = staticCanvas.getContext("2d");
        if (!staticCtx) return;

        const ratio = canvas.__r || 1;
        staticCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
        staticCtx.clearRect(0, 0, W, H);

        // 绘制微妙的实验网格基准线（滴定等当点垂线与 pKa 缓冲带）
        staticCtx.save();
        staticCtx.strokeStyle = "rgba(82, 105, 112, 0.12)";
        staticCtx.lineWidth = 1;
        staticCtx.setLineDash([4, 6]);

        // 等当点突跃中轴 (x = 1080)
        staticCtx.beginPath();
        staticCtx.moveTo(V_EQ, 140);
        staticCtx.lineTo(V_EQ, 780);
        staticCtx.stroke();

        // 缓冲中心线 (pH ~ 4.75 对应 Y ~ 580)
        staticCtx.beginPath();
        staticCtx.moveTo(120, 580);
        staticCtx.lineTo(1520, 580);
        staticCtx.stroke();
        staticCtx.restore();

        // 绘制静态滴定束流
        curves.forEach(c => {
          let strokeColor = "rgba(8, 116, 110, "; // buffer
          if (c.colorType === "acid") strokeColor = "rgba(180, 63, 43, ";
          else if (c.colorType === "base") strokeColor = "rgba(35, 98, 154, ";

          staticCtx.beginPath();
          let drawing = false;

          for (let pt of c.points) {
            // 在标题和右侧卡片区域进行适度淡化衰减
            const inTitle = insideZone(pt.x, pt.y, TITLE_ZONE);
            const inCard = insideZone(pt.x, pt.y, CARD_ZONE);
            
            if (inTitle || inCard) {
              drawing = false;
            } else {
              if (!drawing) {
                staticCtx.moveTo(pt.x, pt.y);
                drawing = true;
              } else {
                staticCtx.lineTo(pt.x, pt.y);
              }
            }
          }

          staticCtx.strokeStyle = strokeColor + c.alpha + ")";
          staticCtx.lineWidth = c.lineWidth;
          staticCtx.stroke();
        });
      }

      function drawTracers(time) {
        if (!ctx) return;
        ctx.lineCap = "round";

        curves.forEach((c, idx) => {
          // 只为部分流线绘制动态质子迁移脉冲
          if (idx % 3 !== 0) return;

          const progress = (c.tracerHead + time * c.speed) % 1;
          const totalPts = c.points.length;
          const curIndex = Math.floor(progress * (totalPts - 1));
          if (curIndex < 1) return;

          const pt = c.points[curIndex];
          if (insideZone(pt.x, pt.y, TITLE_ZONE) || insideZone(pt.x, pt.y, CARD_ZONE)) return;

          // 粒子头部
          let dotColor = "rgba(8, 116, 110, 0.85)";
          if (c.colorType === "acid") dotColor = "rgba(180, 63, 43, 0.85)";
          else if (c.colorType === "base") dotColor = "rgba(35, 98, 154, 0.85)";

          ctx.fillStyle = dotColor;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 2.5, 0, Math.PI * 2);
          ctx.fill();

          // 粒子尾焰
          const tailLen = 14;
          for (let t = 1; t <= tailLen; t++) {
            const pIdx = curIndex - t;
            if (pIdx <= 0) break;
            const p1 = c.points[pIdx];
            const p0 = c.points[pIdx + 1];
            if (insideZone(p1.x, p1.y, TITLE_ZONE)) continue;

            const alpha = (1 - t / tailLen) * 0.55;
            ctx.strokeStyle = c.colorType === "buffer" 
              ? `rgba(8, 116, 110, ${alpha})`
              : (c.colorType === "acid" ? `rgba(180, 63, 43, ${alpha})` : `rgba(35, 98, 154, ${alpha})`);
            ctx.lineWidth = 1.6 * (1 - t / tailLen);
            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.stroke();
          }
        });
      }

      function loopFrame(time) {
        if (!ctx) return;
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(staticCanvas, 0, 0, W, H);
        drawTracers(time);
      }

      function initCover() {
        ctx = Deck.fit(canvas);
        curves = buildCurves();
        renderStatic();

        stopLoop();
        stopLoop = Deck.loop(time => {
          loopFrame(time);
        }, { still: 3600 });
      }

      Deck.init({ index: 1, total: 17, keys: false });
      Deck.onResize(() => {
        ctx = Deck.fit(canvas);
        renderStatic();
        loopFrame(3600);
      });

      initCover();
    })();
  </script>
</body>
</html>
