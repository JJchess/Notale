<body data-page="09" data-total="17">
  <div id="stage">
    <canvas id="curve-canvas" class="cv-fill" aria-hidden="true"></canvas>

    <header class="hero-header">
      <div class="chapter-tag">第 2 部分 · 酸碱滴定曲线</div>
      <h1 class="hero-title">用滴定剂体积追踪<br>溶液组成与 pH 的连续变化</h1>
      <p class="hero-lead">
        滴定不仅是测定浓度的终点实验，更是酸碱体系演变的全程记录。随着滴定剂滴入，溶液依次经历起始电离、共轭缓冲、当量陡跃与过量主导四个化学阶段。
      </p>
    </header>

    <footer class="hero-footer">
      <div class="phase-strip">
        <div class="phase-item p-acid">
          <div class="phase-name">起始点 (0 mL)</div>
          <div class="phase-desc">弱酸单独电离 · HA 主导</div>
        </div>
        <div class="phase-item p-buffer">
          <div class="phase-name">缓冲区 (10–20 mL)</div>
          <div class="phase-desc">HA / A⁻ 共轭对 · pH 稳步延展</div>
        </div>
        <div class="phase-item p-eq">
          <div class="phase-name">化学计量点 (25 mL)</div>
          <div class="phase-desc">完全中和 · 微量试剂引发 pH 剧烈陡跃</div>
        </div>
        <div class="phase-item p-base">
          <div class="phase-name">过量区 (&gt; 25 mL)</div>
          <div class="phase-desc">过量强碱控制 · OH⁻ 主导</div>
        </div>
      </div>

      <div class="status-panel">
        <div class="metric-group">
          <span class="metric-label">滴定体系</span>
          <span class="metric-val" style="font-size: 18px; line-height: 28px;">0.1 mol/L 弱酸 + NaOH</span>
        </div>
        <div class="metric-group">
          <span class="metric-label">半当量点</span>
          <span class="metric-val">pH = pK<sub>a</sub></span>
        </div>
      </div>
    </footer>
  </div>

  <script src="assets/lib/seedrandom.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
  (() => {
    "use strict";

    const canvas = document.getElementById("curve-canvas");
    let ctx = null;
    let stopLoop = () => {};

    // 严谨弱酸滴定计算参数 (0.1M HA 25mL, Ka = 1.8e-5, pKa = 4.745, titrant 0.1M NaOH)
    const C_A = 0.1;
    const V_A = 25.0; // mL
    const C_B = 0.1;
    const Ka = 1.8e-5;
    const pKa = -Math.log10(Ka);
    const Kw = 1.0e-14;

    // 坐标视口定义（逻辑尺寸 1600 x 900）
    // 滴定曲线从左到右伸展，避开左上标题区(w: 680, h: 280)与底部卡片区(h: 120)
    const plot = {
      x: 140,
      y: 110,
      w: 1360,
      h: 580,
      minV: 0,
      maxV: 50,  // mL
      minPH: 1,
      maxPH: 13
    };

    function vToX(v) {
      return plot.x + ((v - plot.minV) / (plot.maxV - plot.minV)) * plot.w;
    }

    function phToY(ph) {
      return (plot.y + plot.h) - ((ph - plot.minPH) / (plot.maxPH - plot.minPH)) * plot.h;
    }

    // 根据真实化学方程求解 pH(V)
    function calcPH(V) {
      if (V <= 0.0001) {
        // 初始弱酸 [H+] = sqrt(Ka * C_A)
        const h = Math.sqrt(Ka * C_A);
        return -Math.log10(h);
      }
      const totalV = V_A + V;
      const n_acid_init = C_A * V_A;
      const n_base_add = C_B * V;

      if (V < 24.98) {
        // 缓冲溶液区：弱酸 + 共轭碱
        const n_HA = n_acid_init - n_base_add;
        const n_A = n_base_add;
        // Henderson-Hasselbalch 微调电离
        const r = n_A / n_HA;
        return pKa + Math.log10(r);
      } else if (Math.abs(V - 25.0) <= 0.05) {
        // 当量点：A- 弱酸根水解 [OH-] = sqrt(Kw/Ka * (n_A / totalV))
        const c_salt = n_acid_init / totalV;
        const Kb = Kw / Ka;
        const oh = Math.sqrt(Kb * c_salt);
        const pOH = -Math.log10(oh);
        return 14 - pOH; // 约 8.72
      } else {
        // 强碱过量区
        const n_oh_excess = n_base_add - n_acid_init;
        const c_oh = n_oh_excess / totalV;
        const pOH = -Math.log10(c_oh);
        return 14 - pOH;
      }
    }

    // 预计算滴定曲线高精度点集，采样步长自适应（当量点 25 mL 附近极密）
    const curvePoints = [];
    const N = 400;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      // 在 25 mL 附近加密采样
      // t 映射到 V: 0 ~ 50
      let v;
      if (t < 0.45) {
        v = (t / 0.45) * 24.0;
      } else if (t < 0.55) {
        v = 24.0 + ((t - 0.45) / 0.1) * 2.0; // 24 ~ 26 mL
      } else {
        v = 26.0 + ((t - 0.55) / 0.45) * 24.0;
      }
      const ph = calcPH(v);
      curvePoints.push({ v, ph, x: vToX(v), y: phToY(ph) });
    }

    // 强酸强碱对比参考曲线（细虚线背景）
    const saPoints = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      let v;
      if (t < 0.46) {
        v = (t / 0.46) * 24.5;
      } else if (t < 0.54) {
        v = 24.5 + ((t - 0.46) / 0.08) * 1.0;
      } else {
        v = 25.5 + ((t - 0.54) / 0.46) * 24.5;
      }
      let ph;
      const totalV = V_A + v;
      if (v < 24.999) {
        const c_h = (C_A * V_A - C_B * v) / totalV;
        ph = -Math.log10(c_h);
      } else if (v > 25.001) {
        const c_oh = (C_B * v - C_A * V_A) / totalV;
        ph = 14 + Math.log10(c_oh);
      } else {
        ph = 7.0;
      }
      saPoints.push({ v, ph, x: vToX(v), y: phToY(ph) });
    }

    // 粒子生成与流场流动（表现由滴定剂注入带来的动态微观反应与宏观曲线贯穿）
    const rng = new Math.seedrandom("titration-curve-hero");
    const particles = [];
    const NUM_PARTICLES = 36;
    for (let i = 0; i < NUM_PARTICLES; i++) {
      particles.push({
        t: rng(), // 沿曲线位置 0~1
        speed: 0.04 + rng() * 0.035, // 周期秒数
        offset: (rng() - 0.5) * 28, // 垂直于曲线切线的微幅弥散
        radius: 2 + rng() * 2.5,
        baseColor: rng() > 0.5 ? "buffer" : "acid"
      });
    }

    function getPointAt(points, progress) {
      const p = Math.max(0, Math.min(1, progress)) * (points.length - 1);
      const idx = Math.floor(p);
      const frac = p - idx;
      if (idx >= points.length - 1) return points[points.length - 1];
      const p1 = points[idx];
      const p2 = points[idx + 1];
      return {
        x: p1.x + (p2.x - p1.x) * frac,
        y: p1.y + (p2.y - p1.y) * frac,
        v: p1.v + (p2.v - p1.v) * frac,
        ph: p1.ph + (p2.ph - p1.ph) * frac,
        dx: p2.x - p1.x,
        dy: p2.y - p1.y
      };
    }

    function render(time) {
      if (!ctx) return;

      const sec = time / 1000;
      ctx.clearRect(0, 0, 1600, 900);

      // 1. 绘制网格刻度与坐标轴
      ctx.save();
      ctx.strokeStyle = "rgba(82, 105, 112, 0.12)";
      ctx.lineWidth = 1;

      // 横向网格线 (pH 2, 4, 6, 7, 8, 10, 12)
      const phTicks = [2, 4, 6, 7, 8, 10, 12];
      ctx.font = "600 13px Bahnschrift, 'Noto Sans SC'";
      ctx.fillStyle = "#526970";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";

      for (const ph of phTicks) {
        const y = phToY(ph);
        ctx.beginPath();
        if (ph === 7) {
          ctx.strokeStyle = "rgba(8, 116, 110, 0.28)";
          ctx.setLineDash([4, 4]);
        } else {
          ctx.strokeStyle = "rgba(82, 105, 112, 0.12)";
          ctx.setLineDash([]);
        }
        ctx.moveTo(plot.x, y);
        ctx.lineTo(plot.x + plot.w, y);
        ctx.stroke();

        // 避免在左上标题正文背后重叠打印 pH 刻度
        if (ph <= 8) {
          ctx.fillText(`pH ${ph}`, plot.x - 12, y);
        }
      }
      ctx.setLineDash([]);

      // 纵向网格线 (V = 10, 12.5, 20, 25, 30, 40, 50 mL)
      const vTicks = [10, 12.5, 20, 25, 30, 40, 50];
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      for (const v of vTicks) {
        const x = vToX(v);
        ctx.beginPath();
        if (v === 25) {
          ctx.strokeStyle = "rgba(196, 90, 0, 0.35)";
          ctx.setLineDash([3, 3]);
        } else if (v === 12.5) {
          ctx.strokeStyle = "rgba(8, 116, 110, 0.35)";
          ctx.setLineDash([3, 3]);
        } else {
          ctx.strokeStyle = "rgba(82, 105, 112, 0.12)";
          ctx.setLineDash([]);
        }
        ctx.moveTo(x, plot.y);
        ctx.lineTo(x, plot.y + plot.h);
        ctx.stroke();

        let label = `${v}`;
        if (v === 12.5) label = "12.5 (半当量)";
        if (v === 25) label = "25.0 (化学计量点)";
        // 在横坐标轴线上方显示标签，避免被底栏卡片遮盖
        if (v !== 50) {
          ctx.fillText(label, x, plot.y + plot.h - 8);
        }
      }
      ctx.setLineDash([]);

      // 坐标轴标签
      ctx.font = "700 13px 'Noto Sans SC'";
      ctx.fillStyle = "#142B33";
      ctx.textAlign = "right";
      ctx.fillText("NaOH 滴定液体积 V / mL →", plot.x + plot.w, plot.y + plot.h + 8);
      ctx.textAlign = "right";
      ctx.fillText("pH", plot.x - 12, plot.y + 10);

      // 2. 缓冲平台高亮带 (pH = pKa ± 1, V ≈ 2.5 ~ 22.5 mL)
      const bufferY1 = phToY(pKa - 1);
      const bufferY2 = phToY(pKa + 1);
      const bufferX1 = vToX(2.5);
      const bufferX2 = vToX(22.7);

      ctx.fillStyle = "rgba(8, 116, 110, 0.05)";
      ctx.fillRect(bufferX1, bufferY2, bufferX2 - bufferX1, bufferY1 - bufferY2);

      ctx.strokeStyle = "rgba(8, 116, 110, 0.25)";
      ctx.lineWidth = 1;
      ctx.setLineDash([6, 6]);
      ctx.strokeRect(bufferX1, bufferY2, bufferX2 - bufferX1, bufferY1 - bufferY2);
      ctx.setLineDash([]);

      // 缓冲区域文字标注
      ctx.fillStyle = "#08746E";
      ctx.font = "700 13px 'Noto Sans SC'";
      ctx.textAlign = "center";
      ctx.fillText("共轭缓冲窗口 (pH = pKa ± 1)", (bufferX1 + bufferX2) / 2, bufferY1 + 18);

      // 3. 强酸对比基准线（灰淡色细虚线）
      ctx.beginPath();
      for (let i = 0; i < saPoints.length; i++) {
        if (i === 0) ctx.moveTo(saPoints[i].x, saPoints[i].y);
        else ctx.lineTo(saPoints[i].x, saPoints[i].y);
      }
      ctx.strokeStyle = "rgba(82, 105, 112, 0.35)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);

      // 4. 弱酸滴定主曲线发光与主体绘制
      // 渐变主线段（酸性红 -> 缓冲绿 -> 陡跃焦点橙 -> 碱性蓝）
      const grad = ctx.createLinearGradient(vToX(0), 0, vToX(50), 0);
      grad.addColorStop(0, "#B43F2B");
      grad.addColorStop(0.2, "#08746E");
      grad.addColorStop(0.48, "#08746E");
      grad.addColorStop(0.51, "#C45A00");
      grad.addColorStop(0.56, "#23629A");
      grad.addColorStop(1, "#23629A");

      // 主线辉光底色
      ctx.beginPath();
      for (let i = 0; i < curvePoints.length; i++) {
        if (i === 0) ctx.moveTo(curvePoints[i].x, curvePoints[i].y);
        else ctx.lineTo(curvePoints[i].x, curvePoints[i].y);
      }
      ctx.strokeStyle = "rgba(8, 116, 110, 0.12)";
      ctx.lineWidth = 12;
      ctx.stroke();

      // 主线实线
      ctx.strokeStyle = grad;
      ctx.lineWidth = 4;
      ctx.stroke();

      // 5. 关键特异点标记 (起始点、半当量点、当量点)
      const specialPoints = [
        { v: 0, label: "起始点: pH 2.87", color: "#B43F2B", align: "left", ox: 14, oy: -4 },
        { v: 12.5, label: "半当量点: pH = pKa (4.75)", color: "#08746E", align: "left", ox: 14, oy: -18 },
        { v: 25.0, label: "化学计量点: pH 8.72 (弱酸根水解显碱性)", color: "#C45A00", align: "left", ox: 16, oy: -4 }
      ];

      for (const sp of specialPoints) {
        const ph = calcPH(sp.v);
        const x = vToX(sp.v);
        const y = phToY(ph);

        // 外圆环
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#FFFFFF";
        ctx.fill();
        ctx.strokeStyle = sp.color;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // 核心实心点
        ctx.beginPath();
        ctx.arc(x, y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = sp.color;
        ctx.fill();

        // 标签胶囊底板
        ctx.font = "700 14px 'Noto Sans SC'";
        const tw = ctx.measureText(sp.label).width;
        const lx = sp.align === "left" ? x + sp.ox : x + sp.ox - tw;
        const ly = y + sp.oy - 16;

        ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
        ctx.strokeStyle = "rgba(82, 105, 112, 0.2)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(lx - 8, ly - 4, tw + 16, 24, 4);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = sp.color;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(sp.label, lx, ly + 8);
      }

      // 6. 沿曲线运动的滴定微粒（表现滴定过程中的滴入推进与微观物种沿程转化）
      for (const p of particles) {
        const prog = (p.t + sec * p.speed * 0.15) % 1;
        const pt = getPointAt(curvePoints, prog);

        // 法线方向微偏
        const len = Math.hypot(pt.dx, pt.dy) || 1;
        const nx = -pt.dy / len;
        const ny = pt.dx / len;

        const px = pt.x + nx * p.offset * 0.4;
        const py = pt.y + ny * p.offset * 0.4;

        // 颜色随所在区域平滑演变
        let pColor;
        if (pt.v < 10) pColor = "rgba(180, 63, 43, 0.75)";
        else if (pt.v < 24) pColor = "rgba(8, 116, 110, 0.75)";
        else if (pt.v < 26) pColor = "rgba(196, 90, 0, 0.9)";
        else pColor = "rgba(35, 98, 154, 0.75)";

        ctx.beginPath();
        ctx.arc(px, py, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = pColor;
        ctx.fill();
      }

      // 7. 引导光标/行进探针（沿曲线缓缓行进，指示当前滴定动态追踪点）
      const scanT = (sec * 0.05) % 1;
      const scanPt = getPointAt(curvePoints, scanT);

      ctx.save();
      ctx.beginPath();
      ctx.arc(scanPt.x, scanPt.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(196, 90, 0, 0.25)";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(scanPt.x, scanPt.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = "#C45A00";
      ctx.fill();

      // 引线投影至两轴
      ctx.setLineDash([2, 3]);
      ctx.strokeStyle = "rgba(196, 90, 0, 0.45)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(scanPt.x, scanPt.y);
      ctx.lineTo(scanPt.x, plot.y + plot.h);
      ctx.moveTo(scanPt.x, scanPt.y);
      ctx.lineTo(plot.x, scanPt.y);
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }

    function init() {
      ctx = Deck.fit(canvas);
      if (!ctx) return;

      // 启动循环，并在减弱动态或首屏即刻绘制代表帧
      stopLoop = Deck.loop(time => {
        render(time);
      }, { still: 5400 });
    }

    Deck.init({ index: 9, total: 17 });
    Deck.onResize(() => {
      ctx = Deck.fit(canvas);
      render(5400);

    init();
  })();
