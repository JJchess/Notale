<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>收束：缓冲区与滴定曲线的统一图景</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F7F8;
      --paper: #FFFFFF;
      --text: #142B33;
      --muted: #526970;
      --focus: #C45A00;
      --acid: #B43F2B;
      --base: #23629A;
      --buffer: #08746E;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --font-num: Bahnschrift, "Noto Sans SC", sans-serif;
    }

    #stage {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 52px 64px;
      isolation: isolate;
      position: relative;
      overflow: hidden;
    }

    /* 背景化学纹理网格与光影 */
    .bg-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.65;
    }

    /* 主视觉容器：左侧排版叙事，右侧宏观滴定与微观缓冲一体化曲线 */
    .cover-body {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 500px 1fr;
      gap: 56px;
      align-items: center;
      height: 100%;
      min-height: 0;
    }

    /* 左侧：精炼文字与概念链 */
    .hero-pane {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .topic-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-label);
      font-weight: 700;
      color: var(--buffer);
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }

    .topic-tag::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--buffer);
    }

    .hero-h1 {
      font-size: var(--fs-h1);
      font-weight: 800;
      line-height: 1.28;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }

    .hero-h1 span.hl {
      color: var(--buffer);
    }

    .hero-summary {
      font-size: var(--fs-lead);
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 36px;
    }

    .synthesis-card {
      background: var(--paper);
      border: 1px solid rgba(82, 105, 112, 0.18);
      border-radius: 12px;
      padding: 22px 24px;
      box-shadow: 0 4px 20px rgba(20, 43, 51, 0.04);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .synthesis-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .synthesis-row .badge {
      font-family: var(--font-num);
      font-size: var(--fs-tick);
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge.buf {
      background: rgba(8, 116, 110, 0.16);
      color: #065450;
    }

    .badge.titr {
      background: rgba(35, 98, 154, 0.16);
      color: #1a4973;
    }

    .synthesis-row p {
      font-size: var(--fs-sec);
      line-height: 1.45;
      color: var(--text);
      margin: 0;
    }

    .synthesis-row p strong {
      color: var(--text);
    }

    /* 右侧：滴定曲线与缓冲平台全景图解 (SVG) */
    .hero-viz {
      position: relative;
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .svg-scene {
      width: 100%;
      height: 100%;
      max-height: 720px;
      overflow: visible;
    }

    /* 曲线动态与图表样式 */
    .axis-line { stroke: var(--muted); stroke-width: 1.5; opacity: 0.45; }
    .grid-line { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 6; opacity: 0.18; }
    .tick-label { font-family: var(--font-num); font-size: var(--fs-tick); fill: var(--muted); }
    .axis-title { font-size: var(--fs-label); font-weight: 700; fill: var(--text); }

    /* 缓冲区间强调带 */
    .buffer-band {
      fill: var(--buffer);
      fill-opacity: 0.09;
      stroke: var(--buffer);
      stroke-width: 1.2;
      stroke-dasharray: 5 4;
      stroke-opacity: 0.45;
    }

    /* 滴定主曲线 */
    .titration-curve-bg {
      fill: none;
      stroke: #C9D9DC;
      stroke-width: 5;
      stroke-linecap: round;
    }

    .titration-curve-acid {
      fill: none;
      stroke: var(--acid);
      stroke-width: 3.5;
      stroke-linecap: round;
      opacity: 0.75;
    }

    .titration-curve-buffer {
      fill: none;
      stroke: var(--buffer);
      stroke-width: 4.5;
      stroke-linecap: round;
    }

    .titration-curve-base {
      fill: none;
      stroke: var(--base);
      stroke-width: 3.5;
      stroke-linecap: round;
      opacity: 0.75;
    }

    /* 关键化学状态标注卡 */
    .callout-box {
      fill: var(--paper);
      stroke: rgba(82, 105, 112, 0.22);
      stroke-width: 1;
      filter: drop-shadow(0 4px 12px rgba(20, 43, 51, 0.08));
      rx: 8;
    }

    .callout-title {
      font-size: var(--fs-label);
      font-weight: 700;
    }

    .callout-desc {
      font-size: var(--fs-tick);
      fill: var(--muted);
      font-family: var(--font-num), var(--font-sans);
    }

    /* 微动入场与浮动动效 */
    .entering .titration-curve-buffer {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: draw-curve 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .entering .hero-callout {
      opacity: 0;
      transform: translateY(8px);
      animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    @keyframes draw-curve {
      to { stroke-dashoffset: 0; }
    }

    @keyframes fade-up {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .titration-curve-buffer, .hero-callout {
        animation: none !important;
        stroke-dashoffset: 0 !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body data-page="17" data-total="17">
  <main id="stage" role="main" aria-label="收束：缓冲溶液与酸碱滴定曲线全景总结">
    <!-- 背景坐标方格 -->
    <svg class="bg-grid cv-fill" viewBox="0 0 1600 900" aria-hidden="true">
      <defs>
        <pattern id="subtle-grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#526970" stroke-width="0.75" stroke-opacity="0.08"/>
        </pattern>
      </defs>
      <rect width="1600" height="900" fill="url(#subtle-grid)"/>
    </svg>

    <div class="cover-body">
      <!-- 左侧：结构性收束陈述 -->
      <section class="hero-pane">
        <div class="topic-tag">全篇收束 · 统一图景</div>
        <h1 class="hero-h1">
          缓冲区是曲线上的化学状态<br>
          曲线是体系被改写的<span class="hl">全程记录</span>
        </h1>
        <p class="hero-summary">
          滴定并非孤立的加碱测数，而是共轭对平衡的连续演进：平缓平台记录着缓冲容量对扰动的抵御，陡峭突跃印证着缓冲容量彻底耗竭的质变。
        </p>

        <div class="synthesis-card">
          <div class="synthesis-row">
            <span class="badge buf">平缓区</span>
            <p>
              <strong>半计量点 [HA] ≈ [A⁻]：</strong>
              pH 锚定于 pKₐ，斜率最低，缓冲阻抗达到极大。
            </p>
          </div>
          <div class="synthesis-row">
            <span class="badge titr">化学计量点</span>
            <p>
              <strong>弱酸完全转化：</strong>
              缓冲对耗尽，微量滴定剂即引发 pH 陡跃与指示剂变色。
            </p>
          </div>
        </div>
      </section>

      <!-- 右侧：全局滴定曲线与缓冲机制整合图形 -->
      <section class="hero-viz" aria-label="滴定曲线全局与半计量点、计量点特征">
        <svg class="svg-scene" viewBox="0 0 920 680" role="img">
          <title>弱酸强碱滴定全景曲线及缓冲平台</title>
          <!-- 坐标轴底图 -->
          <g class="axes">
            <!-- 网格水平线 -->
            <line x1="80" y1="580" x2="860" y2="580" class="grid-line"/>
            <line x1="80" y1="460" x2="860" y2="460" class="grid-line"/>
            <line x1="80" y1="340" x2="860" y2="340" class="grid-line"/>
            <line x1="80" y1="220" x2="860" y2="220" class="grid-line"/>
            <line x1="80" y1="100" x2="860" y2="100" class="grid-line"/>

            <!-- 网格垂直线 -->
            <line x1="280" y1="80" x2="280" y2="580" class="grid-line"/>
            <line x1="480" y1="80" x2="480" y2="580" class="grid-line"/>
            <line x1="680" y1="80" x2="680" y2="580" class="grid-line"/>

            <!-- 主轴 -->
            <line x1="80" y1="580" x2="880" y2="580" class="axis-line" stroke-width="2"/>
            <line x1="80" y1="580" x2="80" y2="60" class="axis-line" stroke-width="2"/>

            <!-- Y轴刻度 pH 0 ~ 14 -->
            <text x="65" y="584" class="tick-label" text-anchor="end">0</text>
            <text x="65" y="464" class="tick-label" text-anchor="end">4</text>
            <text x="65" y="344" class="tick-label" text-anchor="end">7</text>
            <text x="65" y="224" class="tick-label" text-anchor="end">10</text>
            <text x="65" y="104" class="tick-label" text-anchor="end">14</text>
            <text x="80" y="44" class="axis-title" text-anchor="middle">pH</text>

            <!-- X轴刻度 体积 V(NaOH) -->
            <text x="80" y="606" class="tick-label" text-anchor="middle">0</text>
            <text x="280" y="606" class="tick-label" text-anchor="middle">10 mL (半计量点)</text>
            <text x="480" y="606" class="tick-label" text-anchor="middle">20 mL (计量点)</text>
            <text x="680" y="606" class="tick-label" text-anchor="middle">30 mL</text>
            <text x="870" y="606" class="axis-title" text-anchor="end">滴加 NaOH 体积 V / mL</text>
          </g>

          <rect x="150" y="380" width="260" height="120" rx="8" class="buffer-band"/>
          <text x="280" y="490" fill="var(--buffer)" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.05em">
            有效缓冲区间 (pKₐ ± 1)
          </text>

          <!-- 滴定完整底线 (0.1M CH3COOH 被 0.1M NaOH 滴定) -->
          <!-- 拟合曲线路径 -->
          <path d="M 80 495
                   C 100 480, 140 455, 200 448
                   C 280 439, 360 432, 420 410
                   C 460 395, 475 360, 480 280
                   C 485 200, 500 170, 540 155
                   C 600 142, 720 135, 860 130"
                class="titration-curve-bg"/>

          <!-- 缓冲段强化高亮 (V=100 到 420) -->
          <path d="M 120 465
                   C 160 452, 200 448, 280 439
                   C 360 432, 400 420, 435 405"
                class="titration-curve-buffer"/>

          <!-- 突跃段标记线 -->
          <line x1="480" y1="180" x2="480" y2="380" stroke="var(--base)" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.6"/>

          <!-- 状态标注 1：半计量点 -->
          <g class="hero-callout" style="transform-origin: 280px 439px;">
            <circle cx="280" cy="439" r="6" fill="var(--buffer)"/>
            <circle cx="280" cy="439" r="12" fill="none" stroke="var(--buffer)" stroke-width="2" opacity="0.5"/>
            <!-- 引导线与卡片 -->
            <path d="M 280 425 L 280 340 L 310 340" fill="none" stroke="var(--buffer)" stroke-width="1.5"/>
            <rect x="310" y="305" width="180" height="70" class="callout-box"/>
            <text x="324" y="332" class="callout-title" fill="var(--buffer)">半计量点 (V = 10 mL)</text>
            <text x="324" y="352" class="callout-desc">pH = pKₐ = 4.76</text>
            <text x="324" y="367" class="callout-desc">[CH₃COOH] = [CH₃COO⁻]</text>
          </g>

          <!-- 状态标注 2：化学计量点 (突跃核心) -->
          <g class="hero-callout" style="transform-origin: 480px 280px;">
            <circle cx="480" cy="280" r="6" fill="var(--base)"/>
            <circle cx="480" cy="280" r="12" fill="none" stroke="var(--base)" stroke-width="2" opacity="0.5"/>
            <!-- 引导线与卡片 -->
            <path d="M 480 266 L 480 205 L 515 205" fill="none" stroke="var(--base)" stroke-width="1.5"/>
            <rect x="515" y="170" width="186" height="70" class="callout-box"/>
            <text x="529" y="197" class="callout-title" fill="var(--base)">化学计量点 (V = 20 mL)</text>
            <text x="529" y="217" class="callout-desc">弱酸完全转化为弱酸盐</text>
            <text x="529" y="232" class="callout-desc">pH = 8.72 · 缓冲彻底丧失</text>
          </g>

          <!-- 状态标注 3：过量强碱阶段 -->
          <g class="hero-callout">
            <circle cx="680" cy="138" r="5" fill="var(--muted)"/>
            <text x="696" y="142" font-size="13" font-weight="700" fill="var(--text)">过量 NaOH 决定体系 pH</text>
          </g>
        </svg>
      </section>
    </div>
  </main>

  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";
      const stage = document.getElementById("stage");
      const motion = matchMedia("(prefers-reduced-motion: reduce)");

      Deck.init({ index: 17, total: 17, title: "收束：缓冲溶液与酸碱滴定曲线" });

      function initAnimation() {
        if (motion.matches) {
          stage.classList.add("settled");
          return;
        }
        stage.classList.remove("entering", "settled");
        void stage.offsetWidth;
        stage.classList.add("entering");
      }

      motion.addEventListener("change", initAnimation);
      initAnimation();
    })();
  </script>
</body>
</html>
