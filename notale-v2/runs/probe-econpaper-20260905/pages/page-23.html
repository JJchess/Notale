<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    :root {
      --bg: #F2F6F7;
      --text: #17272D;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
    }

    #stage {
      padding: 44px 56px 36px 56px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      gap: 20px;
      height: 900px;
      background: var(--bg);
      color: var(--text);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid rgba(82, 102, 110, 0.25);
      padding-bottom: 14px;
    }

    .header-main {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    h1 {
      font-size: var(--fs-h1);
      margin: 0;
      color: var(--text);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .lead {
      font-size: var(--fs-sec);
      color: var(--muted);
      margin: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-audit {
      appearance: none;
      background: var(--surface);
      border: 1px solid rgba(82, 102, 110, 0.35);
      border-radius: var(--r-sm);
      padding: 8px 16px;
      font-size: var(--fs-label);
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all var(--fast) var(--ease);
    }

    .btn-audit:hover {
      border-color: var(--observed);
      background: var(--selected);
    }

    .btn-audit[aria-pressed="true"] {
      background: var(--observed);
      color: #ffffff;
      border-color: var(--observed);
    }

    /* 主工作台：左侧账本矩阵，右侧追踪溯源面板 */
    .workbench {
      flex: 1;
      display: grid;
      grid-template-columns: 880px 1fr;
      gap: 24px;
      min-height: 0;
    }

    /* 账本矩阵卡片 */
    .ledger-pane {
      background: var(--surface);
      border-radius: var(--r-md);
      border: 1px solid rgba(82, 102, 110, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(23, 39, 45, 0.04);
    }

    .ledger-head {
      display: grid;
      grid-template-columns: 240px 260px 1fr;
      background: var(--soft);
      padding: 14px 20px;
      font-size: var(--fs-label);
      font-weight: 700;
      color: var(--muted);
      border-bottom: 1px solid rgba(82, 102, 110, 0.18);
    }

    .ledger-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .ledger-row {
      display: grid;
      grid-template-columns: 240px 260px 1fr;
      padding: 18px 20px;
      border-bottom: 1px solid rgba(82, 102, 110, 0.12);
      cursor: pointer;
      transition: background var(--fast) var(--ease);
      position: relative;
      align-items: center;
    }

    .ledger-row:hover {
      background: rgba(214, 232, 238, 0.3);
    }

    .ledger-row.active {
      background: var(--selected);
      box-shadow: inset 4px 0 0 0 var(--observed);
    }

    .claim-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 16px;
    }

    .claim-title {
      font-size: var(--fs-sec);
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
    }

    .claim-id {
      font-size: var(--fs-label);
      color: var(--observed);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .assume-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 16px;
    }

    .assume-text {
      font-size: var(--fs-sec);
      color: var(--text);
      line-height: 1.45;
    }

    .assume-type {
      display: inline-flex;
      align-items: center;
      font-size: var(--fs-tick);
      color: var(--uncertain);
      font-weight: 600;
    }

    .evidence-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .loc-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      font-size: var(--fs-tick);
      padding: 2px 8px;
      border-radius: var(--r-sm);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .badge-body {
      background: rgba(36, 90, 116, 0.1);
      color: var(--observed);
      border: 1px solid rgba(36, 90, 116, 0.25);
    }

    .badge-tab {
      background: rgba(45, 105, 76, 0.1);
      color: var(--supported);
      border: 1px solid rgba(45, 105, 76, 0.25);
    }

    .badge-app {
      background: rgba(122, 91, 18, 0.12);
      color: var(--uncertain);
      border: 1px solid rgba(122, 91, 18, 0.28);
    }

    .badge-alert {
      background: rgba(177, 63, 42, 0.12);
      color: var(--cause);
      border: 1px solid rgba(177, 63, 42, 0.3);
    }

    .verdict-tag {
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: 1.4;
    }

    /* 右侧溯源剖析面板 */
    .inspect-pane {
      background: var(--surface);
      border-radius: var(--r-md);
      border: 1px solid rgba(82, 102, 110, 0.2);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 4px 16px rgba(23, 39, 45, 0.04);
    }

    .pane-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-bottom: 1px solid rgba(82, 102, 110, 0.15);
      padding-bottom: 12px;
    }

    .pane-header-title {
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pane-status {
      font-size: var(--fs-label);
      padding: 3px 10px;
      border-radius: var(--r-sm);
      font-weight: 600;
    }

    .status-solid {
      background: rgba(45, 105, 76, 0.12);
      color: var(--supported);
      border: 1px solid rgba(45, 105, 76, 0.3);
    }

    .status-threat {
      background: rgba(177, 63, 42, 0.12);
      color: var(--cause);
      border: 1px solid rgba(177, 63, 42, 0.3);
    }

    .evidence-chain-map {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      justify-content: space-between;
    }

    .source-block {
      background: var(--soft);
      border-radius: var(--r-sm);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid rgba(82, 102, 110, 0.1);
    }

    .source-label {
      font-size: var(--fs-label);
      font-weight: 700;
      color: var(--observed);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .source-meta {
      font-size: var(--fs-tick);
      color: var(--muted);
      font-family: inherit;
    }

    .source-desc {
      font-size: var(--fs-sec);
      color: var(--text);
      line-height: 1.4;
    }

    .audit-threat-box {
      background: #FFF9F7;
      border: 1px solid rgba(177, 63, 42, 0.25);
      border-radius: var(--r-sm);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .audit-title {
      font-size: var(--fs-label);
      font-weight: 700;
      color: var(--cause);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .audit-desc {
      font-size: var(--fs-sec);
      color: var(--text);
      line-height: 1.4;
    }

    .footer-rule {
      background: rgba(36, 90, 116, 0.05);
      border: 1px solid rgba(36, 90, 116, 0.15);
      border-radius: var(--r-sm);
      padding: 10px 14px;
      font-size: var(--fs-label);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-rule strong {
      color: var(--observed);
    }
  </style>
</head>
<body data-page="23" data-total="24">
  <div id="stage">
    <header>
      <div class="header-main">
        <h1>主张—假设—证据账本：支持关系必须可追踪</h1>
        <p class="lead">不看作者结论有多动听，只核对每一项因果主张是否在正文、图表或附录中有直接证据落脚点。</p>
      </div>
      <div class="toolbar">
        <button id="filterBtn" class="btn-audit" aria-pressed="false">
          <span>只看存在断裂威胁的账项</span>
        </button>
      </div>
    </header>

    <div class="workbench">
      <!-- 账本表单 -->
      <div class="ledger-pane">
        <div class="ledger-head">
          <span>① 核心因果主张 (Claim)</span>
          <span>② 支撑成立的关键假设 (Assumption)</span>
          <span>③ 对应检验位置与证据链 (Evidence)</span>
        </div>
        <div class="ledger-body" id="ledgerRows">
          <!-- 动态渲染行 -->
        </div>
      </div>

      <!-- 右侧检视面板 -->
      <div class="inspect-pane" id="inspectPane">
        <div class="pane-header">
          <div class="pane-header-title">
            <span id="detailId">账项 #1 溯源诊断</span>
            <span id="detailStatus" class="pane-status status-solid">证据闭环</span>
          </div>
          <div id="detailClaim" style="font-size: var(--fs-sec); font-weight: 700; color: var(--text); margin-top: 4px;"></div>
        </div>

        <div class="evidence-chain-map" id="detailChain">
          <!-- 链条详情 -->
        </div>

        <div class="footer-rule">
          <strong>审计准则：</strong>
          <span id="auditRule">正文主表给估计，附录表格测边界；只要关键假设无检验落脚点，即构成识别漏洞。</span>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (function() {
      "use strict";

      // 账本核心数据模型：主张、假设、证据位置、断裂威胁与审计评级
      const LEDGER_ITEMS = [
        {
          id: "账项 #1",
          claim: "政策干预显著提升了企业绿色技术专利申请量",
          assume: "平行趋势假设：若未受干预，处理组与对照组绿色创新趋势保持一致",
          assumeType: "核心因果假设",
          locations: [
            { type: "body", label: "正文 4.1 节", note: "基准模型双向固定效应设定与主要变量定义" },
            { type: "tab", label: "Table 2 (主表)", note: "报告核心估计量 β = 0.142，聚类稳健标准误 p < 0.01" },
            { type: "tab", label: "Figure 3 (动态效应)", note: "政策出台前 4 期估计系数紧贴零线且不显著" }
          ],
          threat: "前置趋势平稳仅证实事前无显著差异，无法直接排除同期其他环保督察政策的混杂交织影响。",
          threatLevel: "controlled",
          status: "solid",
          statusText: "证据闭环",
          verdict: "正文主表与动态效应图严格对应，事前平行趋势检验通过。"
        },
        {
          id: "账项 #2",
          claim: "估计效应完全源于就地技术升级而非排污产能异地搬迁",
          assume: "SUTVA 无溢出假设：政策未诱发跨区域选址套利或污染避难所外迁",
          assumeType: "空间与关联假设",
          locations: [
            { type: "body", label: "正文 5.3 节", note: "机制检验：企业机器设备固定资产账面投资原值" },
            { type: "app", label: "Appendix Table A.7", note: "异地投资与异地新设子公司概率未见显著上升" }
          ],
          threat: "附录仅统计法人子公司的工商注册，未核查通过代工厂协议外包排污工序的供应链转移行为。",
          threatLevel: "threat",
          status: "threat",
          statusText: "存在待证漏洞",
          verdict: "附录虽有投资检验，但供应链代工与外包产能流向数据缺乏封闭检验。"
        },
        {
          id: "账项 #3",
          claim: "以历史通商口岸地理距离构建的工具变量具备排他外生性",
          assume: "排他性约束：历史通商距离仅通过当代政策试点概率作用于创新产出",
          assumeType: "识别关键假定",
          locations: [
            { type: "body", label: "正文 3.2 节", note: "IV 构造逻辑与第一阶段 F 统计量检验 (F = 48.2)" },
            { type: "tab", label: "Table 4 (IV 回归)", note: "2SLS 第二阶段系数较基准 OLS 略有扩大" },
            { type: "alert", label: "正文附录均缺失", note: "未控制沿海历史通达度对人力资本集聚与商业文化的直接影响" }
          ],
          threat: "历史地理距离直接影响当地营商法治、高校密度与早期要素流动，难以满足严格的排他性约束。",
          threatLevel: "threat",
          status: "threat",
          statusText: "排他性悬空",
          verdict: "虽报告一阶段强相关，但排他假定仅靠定性自圆其说，附录无安慰剂检验。"
        },
        {
          id: "账项 #4",
          claim: "排除特大城市强拉动后，政策激励的核心符号依然成立",
          assume: "外推稳定性假设：结论并非极端城市样本或单点异常值主导",
          assumeType: "样本与稳健性",
          locations: [
            { type: "app", label: "Appendix Table B.3", note: "剔除直辖市与副省级城市的子样本回归" },
            { type: "app", label: "Appendix Figure B.1", note: "分地区分行业逐一排除后的系数分布盒须图" }
          ],
          threat: "样本削减 35% 后估计系数下降约 42%，但在 5% 显著性水平上仍保持统计显著。",
          threatLevel: "controlled",
          status: "solid",
          statusText: "附录检验充分",
          verdict: "附录包含完备的样本截断表与删减检验，核心符号与统计显著性存活。"
        }
      ];

      let selectedIndex = 0;
      let filterThreatOnly = false;

      const ledgerRowsEl = document.getElementById("ledgerRows");
      const filterBtn = document.getElementById("filterBtn");
      const detailIdEl = document.getElementById("detailId");
      const detailStatusEl = document.getElementById("detailStatus");
      const detailClaimEl = document.getElementById("detailClaim");
      const detailChainEl = document.getElementById("detailChain");

      function renderLedger() {
        ledgerRowsEl.innerHTML = "";

        LEDGER_ITEMS.forEach((item, idx) => {
          if (filterThreatOnly && item.status !== "threat") {
            return;
          }

          const row = document.createElement("div");
          row.className = "ledger-row" + (idx === selectedIndex ? " active" : "");
          row.dataset.index = idx;

          // 徽章
          let badgesHtml = "";
          item.locations.forEach(loc => {
            let cls = "badge-body";
            if (loc.type === "tab") cls = "badge-tab";
            else if (loc.type === "app") cls = "badge-app";
            else if (loc.type === "alert") cls = "badge-alert";
            badgesHtml += `<span class="badge ${cls}">${loc.label}</span>`;
          });

          row.innerHTML = `
            <div class="claim-col min0">
              <span class="claim-id">${item.id}</span>
              <span class="claim-title">${item.claim}</span>
            </div>
            <div class="assume-col min0">
              <span class="assume-type">〔${item.assumeType}〕</span>
              <span class="assume-text">${item.assume}</span>
            </div>
            <div class="evidence-col min0">
              <div class="loc-badges">${badgesHtml}</div>
              <div class="verdict-tag">${item.verdict}</div>
            </div>
          `;

          row.addEventListener("click", () => {
            selectedIndex = idx;
            renderLedger();
            renderInspect();
          });

          ledgerRowsEl.appendChild(row);
        });

        // 若当前选中的项被过滤掉，自动切换
        if (filterThreatOnly && LEDGER_ITEMS[selectedIndex].status !== "threat") {
          const firstThreatIdx = LEDGER_ITEMS.findIndex(d => d.status === "threat");
          if (firstThreatIdx !== -1) {
            selectedIndex = firstThreatIdx;
            renderLedger();
            renderInspect();
          }
        }
      }

      function renderInspect() {
        const cur = LEDGER_ITEMS[selectedIndex];
        if (!cur) return;

        detailIdEl.textContent = `${cur.id} 识别支撑审计`;
        detailClaimEl.textContent = `主张：${cur.claim}`;

        if (cur.status === "solid") {
          detailStatusEl.className = "pane-status status-solid";
          detailStatusEl.textContent = cur.statusText;
        } else {
          detailStatusEl.className = "pane-status status-threat";
          detailStatusEl.textContent = cur.statusText;
        }

        // 拼接证据块
        let chainHtml = "";
        cur.locations.forEach(loc => {
          let typeColor = loc.type === "alert" ? "var(--cause)" : "var(--observed)";
          chainHtml += `
            <div class="source-block">
              <div class="source-label" style="color: ${typeColor}">
                <span>● ${loc.label}</span>
                <span class="source-meta">${loc.type === "app" ? "[附录稳健性]" : loc.type === "tab" ? "[正文主证据]" : loc.type === "alert" ? "[缺口预警]" : "[回归规范]"}</span>
              </div>
              <div class="source-desc">${loc.note}</div>
            </div>
          `;
        });

        // 威胁警告区
        chainHtml += `
          <div class="audit-threat-box">
            <div class="audit-title">
              <span>⚠ 关键识别威胁与未封闭缝隙</span>
            </div>
            <div class="audit-desc">${cur.threat}</div>
          </div>
        `;

        detailChainEl.innerHTML = chainHtml;
      }

      filterBtn.addEventListener("click", () => {
        filterThreatOnly = !filterThreatOnly;
        filterBtn.setAttribute("aria-pressed", filterThreatOnly ? "true" : "false");
        filterBtn.querySelector("span").textContent = filterThreatOnly ? "显示全部账项 (含已闭环)" : "只看存在断裂威胁的账项";
        renderLedger();
        renderInspect();
      });

      renderLedger();
      renderInspect();

      Deck.init({ index: 23, total: 24 });
      window.__NOTALE_READY__ = true;
    })();
  </script>
</body>
</html>
