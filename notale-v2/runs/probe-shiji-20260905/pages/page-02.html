<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>从“资料分类”到“篇章组合产生意义”</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* 页面特定布局：左侧对比切换舞台，右侧编联线与核心论断 */
    #stage {
      padding: 44px 56px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
    }

    .header-zone {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: var(--line) solid rgba(23, 35, 31, 0.12);
      padding-bottom: 14px;
    }

    .title-wrap h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: 1.2;
      margin: 0;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .title-wrap p {
      margin: 6px 0 0;
      font-size: var(--fs-lead);
      color: var(--muted);
      line-height: 1.4;
    }

    .view-switch {
      display: inline-flex;
      gap: 8px;
      background: rgba(23, 35, 31, 0.05);
      padding: 4px;
      border-radius: var(--radius);
    }

    .view-switch button {
      border: none;
      background: transparent;
      padding: 6px 16px;
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--muted);
      border-radius: calc(var(--radius) - 2px);
      cursor: pointer;
      transition: background var(--ease), color var(--ease);
    }

    .view-switch button.active {
      background: var(--paper);
      color: var(--selected);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .main-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 28px;
      min-height: 0;
    }

    /* 左侧：架构对比舞台 */
    .stage-card {
      background: var(--paper);
      border-radius: var(--radius);
      border: 1px solid rgba(23, 35, 31, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,0.03);
      position: relative;
    }

    .stage-topbar {
      padding: 14px 22px;
      border-bottom: 1px solid rgba(23, 35, 31, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(243, 245, 241, 0.5);
    }

    .stage-topbar .mode-tag {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stage-topbar .mode-desc {
      font-size: var(--fs-label);
      color: var(--muted);
    }

    .svg-container {
      flex: 1;
      position: relative;
      min-height: 0;
      width: 100%;
    }

    .svg-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 右侧：解构分析与论断面板 */
    .analysis-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

    .detail-card {
      background: var(--paper);
      border: 1px solid rgba(23, 35, 31, 0.1);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .detail-card h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-meta {
      font-size: var(--fs-label);
      color: var(--crossref);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .thread-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .thread-node {
      border-left: 2px solid rgba(36, 99, 88, 0.35);
      padding: 4px 0 4px 14px;
      position: relative;
      transition: border-color var(--ease);
    }

    .thread-node::before {
      content: "";
      position: absolute;
      left: -5px;
      top: 9px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--crossref);
    }

    .thread-node .chapter-title {
      font-weight: 700;
      font-size: var(--fs-sec);
      color: var(--text);
      display: flex;
      justify-content: space-between;
    }

    .thread-node .chapter-quote {
      margin-top: 3px;
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: 1.4;
      font-family: var(--font-display);
    }

    .effect-box {
      margin-top: 4px;
      background: rgba(156, 53, 40, 0.05);
      border-radius: var(--radius);
      border: 1px solid rgba(156, 53, 40, 0.18);
      padding: 14px 18px;
    }

    .effect-box .effect-title {
      font-size: var(--fs-label);
      font-weight: 700;
      color: var(--judgment);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .effect-box p {
      margin: 0;
      font-size: var(--fs-sec);
      line-height: 1.45;
      color: var(--text);
    }

    /* 底部署名与导引栏 */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: var(--paper);
      border: 1px solid rgba(23, 35, 31, 0.08);
      border-radius: var(--radius);
    }

    .bottom-bar .takeaway {
      font-size: var(--fs-sec);
      color: var(--text);
    }

    .bottom-bar .takeaway strong {
      color: var(--judgment);
    }

    .interactive-hint {
      font-size: var(--fs-label);
      color: var(--muted);
    }
  </style>
</head>
<body data-page="02" data-total="15">
  <div id="stage">
    <header class="header-zone min0">
      <div class="title-wrap">
        <h1>纪传体不是档案盒，而是产生意义的叙事网络</h1>
        <p>若把五体看作资料归档，读者只得零散死案；看作篇章重组，互见法与论赞才显现裁断。</p>
      </div>
      <div class="view-switch" role="tablist" aria-label="结构视图切换">
        <button id="btn-cabinet" class="active" role="tab" aria-selected="true" onclick="switchMode('cabinet')">旧解：静态资料分类</button>
        <button id="btn-network" role="tab" aria-selected="false" onclick="switchMode('network')">真容：跨篇互见网络</button>
      </div>
    </header>

    <div class="main-grid min0">
      <!-- 左侧：结构演示画布 -->
      <section class="stage-card min0" aria-label="纪传体结构演化对比">
        <div class="stage-topbar">
          <span class="mode-tag" id="modeTitle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
            静态类目孤立模型
          </span>
          <span class="mode-desc" id="modeSub">五体各司其职，资料彼此割裂封闭</span>
        </div>
        <div class="svg-container min0">
          <svg id="stageSvg" viewBox="0 0 760 480">
            <!-- 动态生成网格或网络图 -->
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#246358" />
              </marker>
              <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
                <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
              </filter>
            </defs>
            <g id="sceneRoot"></g>
          </svg>
        </div>
      </section>

      <!-- 右侧：对应具体文本证据 -->
      <section class="analysis-panel min0">
        <div class="detail-card min0">
          <h2>
            <span>典型个案：汉高祖刘邦的形象解构</span>
            <span class="card-meta" id="caseMeta">单篇叙事局限</span>
          </h2>
          <div class="thread-list" id="caseThreads">
            <!-- 节点内容根据模式动态切换 -->
          </div>
        </div>

        <div class="effect-box min0" id="readingBox">
          <div class="effect-title" id="effectTitle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            认知阻断：为何资料观遮蔽了文学性
          </div>
          <p id="effectDesc">若只读《高祖本纪》，刘邦宽仁大度、顺应天命；残暴猜忌与狼狈弃子被本纪隐去，读者所见只是政治正统宣称，而非真实立体的人物。</p>
        </div>
      </section>
    </div>

    <footer class="bottom-bar min0">
      <div class="takeaway" id="bottomTakeaway">
        档案分类解决<strong>“材料放在哪里”</strong>；而《史记》的篇章组合解决<strong>“在何处暴露真相”</strong>。
      </div>
      <div class="interactive-hint">
        点击右上角切换模式，观察篇章从“孤立抽屉”转向“张力互见”
      </div>
    </footer>
  </div>

  <script src="assets/base.js"></script>
  <script>
    let currentMode = 'cabinet';

    const cabinetData = {
      title: '静态类目孤立模型',
      sub: '五体各司其职，资料彼此割裂封闭',
      meta: '本纪神化·真相隐匿',
      threads: [
        {
          chapter: '《高祖本纪》· 帝王建构',
          quote: '“高祖为人，隆准而龙颜……仁而爱人，喜施，意豁如也。”',
          desc: '作为全书正统帝王纪，重点突出龙种神迹与开国首创，掩抑其市井无赖与寡恩。'
        },
        {
          chapter: '信息封存状态',
          quote: '单向查阅：要找刘邦看本纪，要查项羽看本纪，要看功臣看世家列传。',
          desc: '读者默认本纪代表人物全部评价，视其他篇章为同质档案储备，互不参验。'
        }
      ],
      effectTitle: '认知误区：为何资料分类观遮蔽了《史记》精微',
      effectDesc: '传统将本纪、世家、列传视为等级森严的分类目录。按类寻索只能得到片面定论，司马迁藏在篇章错位间的史笔暗讽便尽数失落。',
      bottom: '资料分类只回答<strong>“材料放在哪里”</strong>；而司马迁的建构回答<strong>“在何处暴露真相”</strong>。'
    };

    const networkData = {
      title: '跨篇互见与张力网络',
      sub: '本纪树立大节，列传发露隐恶，论赞一槌定音',
      meta: '互见发露·多面人格',
      threads: [
        {
          chapter: '《项羽本纪》· 彭城溃败',
          quote: '“汉王急，推堕孝惠、鲁元车下；滕公常下收载之，如是者三。”',
          desc: '本纪中隐去逃命弃子之丑态，在死敌项羽的纪中毫不掩饰地披露。'
        },
        {
          chapter: '《留侯世家》《淮阴侯列传》· 猜忌屠戮',
          quote: '“果若人言，‘狡兔死，良狗烹’……天下已定，我固当烹！”',
          desc: '本纪中“待功臣如子”，而在韩信、彭越列传中则详写借刀杀人与残忍分尸。'
        }
      ],
      effectTitle: '叙事突围：篇章组合催生立体裁断',
      effectDesc: '互见法将一人之行事散见各篇：本纪存其尊，列传求其实。当读者在篇际穿梭拼图时，神坛上的开国皇帝便还原为多疑善变、雄才与卑鄙并存的复杂生命。',
      bottom: '篇章的分散与呼应不是冗余杂乱，而是以<strong>立体结构消解官方独断</strong>的叙事策略。'
    };

    function renderScene(mode) {
      const root = document.getElementById('sceneRoot');
      root.innerHTML = '';

      if (mode === 'cabinet') {
        // 画抽屉分类柜
        const sections = [
          { name: '十二本纪', desc: '帝王世系与大政纲领', color: '#52635D', x: 50, y: 50, w: 310, h: 170 },
          { name: '十表', desc: '大事年表与时空框架', color: '#52635D', x: 400, y: 50, w: 310, h: 170 },
          { name: '八书', desc: '礼乐律历与典章制度', color: '#52635D', x: 50, y: 260, w: 200, h: 180 },
          { name: '三十世家', desc: '诸侯王公及勋贵辅佐', color: '#52635D', x: 280, y: 260, w: 200, h: 180 },
          { name: '七十列传', desc: '各色历史个体人生', color: '#52635D', x: 510, y: 260, w: 200, h: 180 }
        ];

        let html = '';
        // 隔离线背景
        html += `<rect x="20" y="20" width="720" height="440" rx="8" fill="rgba(23,35,31,0.02)" stroke="#17231F" stroke-width="1.5" stroke-dasharray="4 4"/>`;

        sections.forEach(s => {
          html += `
            <g transform="translate(${s.x}, ${s.y})" filter="url(#shadow)">
              <rect width="${s.w}" height="${s.h}" rx="6" fill="#FFFFFF" stroke="#17231F" stroke-width="1.5"/>
              <rect x="0" y="0" width="${s.w}" height="38" rx="6" fill="rgba(23,35,31,0.05)"/>
              <line x1="0" y1="38" x2="${s.w}" y2="38" stroke="#17231F" stroke-width="1.2"/>
              <text x="16" y="25" font-family="Noto Serif SC, Songti SC, serif" font-weight="bold" font-size="16" fill="#17231F">${s.name}</text>
              <rect x="${s.w - 46}" y="10" width="30" height="18" rx="3" fill="none" stroke="#52635D" stroke-width="1"/>
              <circle cx="${s.w - 31}" cy="19" r="2.5" fill="#52635D"/>
              <text x="16" y="70" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#52635D">${s.desc}</text>
              
              <!-- 模拟档案格抽屉条 -->
              <rect x="16" y="90" width="${s.w - 32}" height="28" rx="4" fill="rgba(23,35,31,0.03)" stroke="rgba(23,35,31,0.12)" stroke-width="1"/>
              <text x="26" y="110" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#52635D">独占档案格 · 彼此不相往来</text>
              
              ${s.h > 170 ? `
              <rect x="16" y="128" width="${s.w - 32}" height="28" rx="4" fill="rgba(23,35,31,0.03)" stroke="rgba(23,35,31,0.12)" stroke-width="1"/>
              <text x="26" y="148" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#52635D">按类归置 · 封闭封存</text>
              ` : ''}
            </g>
          `;
        });

        // 居中打上孤立锁图标或断裂符
        html += `
          <g transform="translate(380, 240)">
            <circle cx="0" cy="0" r="26" fill="#F3F5F1" stroke="#9C3528" stroke-width="1.5"/>
            <text x="0" y="5" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="bold" fill="#9C3528">隔绝</text>
          </g>
        `;

        root.innerHTML = html;
      } else {
        // 节点与连线布局计算
        const nodes = [
          { id: 'benji', name: '《高祖本纪》', role: '大纲与神化', tag: '尊者讳', x: 380, y: 64, color: '#155F83' },
          { id: 'xiang', name: '《项羽本纪》', role: '弃子狼狈', tag: '敌手观照', x: 120, y: 195, color: '#246358' },
          { id: 'han', name: '《淮阴侯列传》', role: '猜忌诛杀', tag: '受害者述', x: 640, y: 195, color: '#246358' },
          { id: 'zhang', name: '《留侯世家》', role: '权术机谋', tag: '谋臣佐证', x: 160, y: 395, color: '#246358' },
          { id: 'fan', name: '《樊郦滕灌列传》', role: '近臣私德', tag: '密友发露', x: 600, y: 395, color: '#246358' },
          { id: 'yue', name: '太史公曰', role: '史官裁断', tag: '终极审视', x: 380, y: 425, color: '#9C3528' }
        ];

        const center = { x: 380, y: 245, name: '多面立体之“刘邦”', sub: '篇章互见拼合出的真实人性' };

        let html = '';

        // 互见辐射连线
        nodes.forEach(n => {
          html += `
            <line x1="${center.x}" y1="${center.y}" x2="${n.x}" y2="${n.y}" 
                  stroke="${n.color}" stroke-width="2" stroke-dasharray="5 4" opacity="0.75"/>
          `;
        });

        // 篇际互补弧线（带箭头）
        html += `
          <!-- 本纪与列传/世家之间的印证弧线 -->
          <path d="M 285 64 Q 130 90 120 160" fill="none" stroke="#246358" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
          <path d="M 475 64 Q 630 90 640 160" fill="none" stroke="#246358" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
          <path d="M 120 230 Q 130 310 160 360" fill="none" stroke="#246358" stroke-width="2" marker-end="url(#arrow)"/>
          <path d="M 640 230 Q 630 310 600 360" fill="none" stroke="#246358" stroke-width="2" marker-end="url(#arrow)"/>
          <path d="M 255 395 Q 380 370 285 425" fill="none" stroke="#9C3528" stroke-width="1.8" marker-end="url(#arrow)"/>
          <path d="M 505 395 Q 380 370 475 425" fill="none" stroke="#9C3528" stroke-width="1.8" marker-end="url(#arrow)"/>
        `;

        // 中心核心聚合体
        html += `
          <g transform="translate(${center.x}, ${center.y})" filter="url(#shadow)">
            <ellipse rx="130" ry="46" fill="#FFFFFF" stroke="#9C3528" stroke-width="2.5"/>
            <text x="0" y="-8" text-anchor="middle" font-family="Noto Serif SC, Songti SC, serif" font-weight="bold" font-size="18" fill="#17231F">${center.name}</text>
            <text x="0" y="18" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#52635D">${center.sub}</text>
          </g>
        `;

        // 周围篇章卡片
        nodes.forEach(n => {
          html += `
            <g transform="translate(${n.x}, ${n.y})" filter="url(#shadow)">
              <rect x="-95" y="-34" width="190" height="68" rx="6" fill="#FFFFFF" stroke="${n.color}" stroke-width="2"/>
              <rect x="-95" y="-34" width="190" height="24" rx="6" fill="${n.color}" opacity="0.1"/>
              <text x="-80" y="-17" font-family="Noto Serif SC, Songti SC, serif" font-weight="bold" font-size="15" fill="${n.color}">${n.name}</text>
              <text x="80" y="-17" text-anchor="end" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="${n.color}">${n.tag}</text>
              <text x="0" y="18" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#17231F">${n.role}</text>
            </g>
          `;
        });

        root.innerHTML = html;
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const btnCabinet = document.getElementById('btn-cabinet');
      const btnNetwork = document.getElementById('btn-network');
      const modeTitle = document.getElementById('modeTitle');
      const modeSub = document.getElementById('modeSub');
      const caseMeta = document.getElementById('caseMeta');
      const caseThreads = document.getElementById('caseThreads');
      const effectTitle = document.getElementById('effectTitle');
      const effectDesc = document.getElementById('effectDesc');
      const bottomTakeaway = document.getElementById('bottomTakeaway');

      const data = mode === 'cabinet' ? cabinetData : networkData;

      if (mode === 'cabinet') {
        btnCabinet.classList.add('active');
        btnCabinet.setAttribute('aria-selected', 'true');
        btnNetwork.classList.remove('active');
        btnNetwork.setAttribute('aria-selected', 'false');
        modeTitle.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          ${data.title}
        `;
      } else {
        btnNetwork.classList.add('active');
        btnNetwork.setAttribute('aria-selected', 'true');
        btnCabinet.classList.remove('active');
        btnCabinet.setAttribute('aria-selected', 'false');
        modeTitle.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#246358" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          ${data.title}
        `;
      }

      modeSub.textContent = data.sub;
      caseMeta.textContent = data.meta;

      let threadHtml = '';
      data.threads.forEach(t => {
        threadHtml += `
          <div class="thread-node">
            <div class="chapter-title">
              <span>${t.chapter}</span>
            </div>
            <div class="chapter-quote">${t.quote}</div>
            <div style="font-size:var(--fs-sec); color:var(--muted); margin-top:4px; line-height:1.4;">${t.desc}</div>
          </div>
        `;
      });
      caseThreads.innerHTML = threadHtml;

      effectTitle.innerHTML = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        ${data.effectTitle}
      `;
      effectDesc.textContent = data.effectDesc;
      bottomTakeaway.innerHTML = data.bottom;

      renderScene(mode);
    }

    // 初始化
    Deck.init({ index: 2, total: 15, keys: false });
    switchMode('cabinet');
  </script>
</body>
</html>
