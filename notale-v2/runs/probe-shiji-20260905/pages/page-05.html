<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>《项羽本纪》与《高祖本纪》的互见</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* 页面特有结构与互见线谱 */
    #stage {
      display: flex;
      flex-direction: column;
      padding: 44px 56px 36px;
      color: var(--text);
      background: var(--bg);
      box-sizing: border-box;
      gap: 16px;
    }

    header.deck-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: var(--line) solid var(--muted);
      padding-bottom: 12px;
    }
    .head-left h1 {
      margin: 0 0 6px 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
    }
    .head-left p {
      margin: 0;
      font-family: var(--font-sans);
      font-size: var(--fs-lead);
      color: var(--muted);
    }
    .legend-lane {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: var(--fs-label);
      font-family: var(--font-sans);
    }
    .lane-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .lane-dot {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }
    .lane-dot.xiang { background: var(--judgment); }
    .lane-dot.liu { background: var(--selected); }

    /* 主交互区：上部三节点历史坐标轴，下部左右原文对照与对撞结论 */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    /* 节点切片步进器 */
    .timeline-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .nav-card {
      background: var(--paper);
      border: 1px solid rgba(82, 99, 93, 0.3);
      border-radius: var(--radius);
      padding: 10px 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color var(--ease), background var(--ease), box-shadow var(--ease);
      outline: none;
      text-align: left;
    }
    .nav-card:hover {
      border-color: var(--muted);
    }
    .nav-card:focus-visible {
      outline: 2px solid var(--focus);
    }
    .nav-card.active {
      border: 2px solid var(--text);
      background: #FFFFFF;
      box-shadow: 0 2px 8px rgba(23, 35, 31, 0.08);
      padding: 9px 15px; /* 补偿 1px border */
    }
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-step {
      font-family: var(--font-num);
      font-size: var(--fs-label);
      font-weight: 700;
      color: var(--crossref);
    }
    .nav-status {
      font-size: var(--fs-label);
      color: var(--muted);
      border-bottom: 1px dashed currentColor;
    }
    .nav-card.active .nav-status {
      color: var(--text);
      font-weight: 700;
      border-bottom: none;
    }
    .nav-title {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }
    .nav-desc {
      font-size: var(--fs-sec);
      color: var(--muted);
      margin: 0;
      line-height: 1.4;
    }

    /* 对照主展区：左右两栏对称排布，中间穿插互见机制 */
    .compare-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      min-height: 0;
    }
    .narrative-lane {
      background: var(--paper);
      border: 1px solid rgba(82, 99, 93, 0.25);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      padding: 18px 20px;
      min-height: 0;
      position: relative;
    }
    .narrative-lane.xiang-lane {
      border-color: rgba(156, 53, 40, 0.35);
    }
    .narrative-lane.liu-lane {
      border-color: rgba(21, 95, 131, 0.35);
    }

    .lane-banner {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(82, 99, 93, 0.2);
      margin-bottom: 12px;
    }
    .lane-chapter {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .xiang-lane .lane-chapter { color: var(--judgment); }
    .liu-lane .lane-chapter { color: var(--selected); }

    .lane-posture {
      font-size: var(--fs-label);
      font-family: var(--font-sans);
      color: var(--muted);
      font-weight: 600;
    }

    /* 原文呈现卡片 */
    .quote-box {
      background: #FAFBF9;
      border: 1px solid rgba(82, 99, 93, 0.18);
      border-radius: var(--radius);
      padding: 16px 18px;
      font-family: var(--font-display);
      font-size: var(--fs-body);
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 12px;
      position: relative;
    }
    .quote-box mark.hl {
      background: rgba(197, 160, 89, 0.28);
      color: inherit;
      padding: 0 2px;
      border-bottom: 2px solid var(--crossref);
      font-weight: 600;
    }

    /* 叙事策略解析卡片 */
    .strategy-analysis {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-family: var(--font-sans);
      min-height: 0;
      justify-content: flex-start;
    }
    .strategy-row {
      display: flex;
      gap: 10px;
      font-size: var(--fs-sec);
      line-height: 1.55;
    }
    .strategy-label {
      font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
      width: 80px;
    }
    .strategy-content {
      color: var(--text);
    }
    .strategy-content strong {
      color: var(--text);
      font-weight: 700;
    }

    /* 底部收束：互见法综合断案 */
    .bottom-synthesis {
      background: var(--paper);
      border: 1px solid rgba(82, 99, 93, 0.3);
      border-radius: var(--radius);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .synthesis-lead {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .synthesis-tag {
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      font-weight: 700;
      background: var(--crossref);
      color: #FFFFFF;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .synthesis-title {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }
    .synthesis-body {
      font-family: var(--font-sans);
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: 1.45;
      margin: 0;
      flex: 1;
    }
    .synthesis-body strong {
      color: var(--text);
    }

    .stepper-ctl {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .ctl-btn {
      background: var(--paper);
      border: 1px solid var(--muted);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: var(--fs-label);
      font-weight: 600;
      padding: 6px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--ease);
    }
    .ctl-btn:hover:not(:disabled) {
      background: var(--text);
      color: #FFFFFF;
    }
    .ctl-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
  </style>
</head>
<body data-page="05" data-total="15">
  <div id="stage">
    <header class="deck-head">
      <div class="head-left">
        <h1>同一场政治竞争中的两套自我叙述</h1>
        <p>《项羽本纪》与《高祖本纪》如何通过互见法，让两位开国竞争者的自证与史实互相对质</p>
      </div>
      <div class="legend-lane">

        <div class="lane-tag"><span class="lane-dot liu"></span><span>《高祖本纪》：约法、宽大与天命视角</span></div>
      </div>

    <main class="content-area">

        </button>

        <button type="button" class="nav-card" data-event="1">
          <div class="nav-header">
            <span class="nav-step">事件二</span>
            <span class="nav-status">楚汉对峙与彭城</span>
          </div>
          <h2 class="nav-title">彭城惨败与广武骂羽</h2>
          <p class="nav-desc">谁背弃了盟约？正义讨伐与弑君大罪的互相指斥</p>
        </button>

        <button type="button" class="nav-card" data-event="2">
          <div class="nav-header">
            <span class="nav-step">事件三</span>

          </div>
          <h2 class="nav-title">“天亡我”还是“得人之力”？</h2>
          <p class="nav-desc">英雄个人的悲歌，与政治集团协作的成败归因</p>
        </button>
      </nav>

      <!-- 双向对称阅读视域 -->
      <div class="compare-container">
        <!-- 项羽本纪叙事 -->
        <article class="narrative-lane xiang-lane" id="xiangLane">
          <div class="lane-banner">
            <div class="lane-chapter">
              <span>《项羽本纪》</span>
            </div>
            <span class="lane-posture" id="xiangPosture">主调：英雄被背叛与霸者盛怒</span>
          </div>
          <div class="quote-box" id="xiangQuote">
            <!-- 动态载入原文 -->
          </div>
          <div class="strategy-analysis">

              <span class="strategy-label">呈现重心</span>
              <span class="strategy-content" id="xiangFocus">——</span>
            </div>
            <div class="strategy-row">
              <span class="strategy-label">刻意隐抑</span>
              <span class="strategy-content" id="xiangOmit">——</span>
            </div>
            <div class="strategy-row">
              <span class="strategy-label">叙事效果</span>
              <span class="strategy-content" id="xiangEffect">——</span>
            </div>
          </div>
        </article>

        <!-- 高祖本纪叙事 -->
        <article class="narrative-lane liu-lane" id="liuLane">
          <div class="lane-banner">
            <div class="lane-chapter">
              <span>《高祖本纪》</span>
            </div>
            <span class="lane-posture" id="liuPosture">主调：宽仁受拥与受屈避难</span>
          </div>
          <div class="quote-box" id="liuQuote">
            <!-- 动态载入原文 -->
          </div>
          <div class="strategy-analysis">
            <div class="strategy-row">
              <span class="strategy-label">呈现重心</span>
              <span class="strategy-content" id="liuFocus">——</span>
            </div>
            <div class="strategy-row">
              <span class="strategy-label">刻意隐抑</span>
              <span class="strategy-content" id="liuOmit">——</span>
            </div>
            <div class="strategy-row">
              <span class="strategy-label">叙事效果</span>
              <span class="strategy-content" id="liuEffect">——</span>
            </div>
          </div>
        </article>
      </div>

      <!-- 底部互见核验裁断 -->
      <footer class="bottom-synthesis">
        <div class="synthesis-lead">
          <span class="synthesis-tag">互见机制</span>
          <h2 class="synthesis-title" id="synthesisTitle">同台对质产生历史张力</h2>
        </div>
        <p class="synthesis-body" id="synthesisDesc">
          司马迁不直接做裁判，而是让项羽在自己的本纪里慷慨自辩，又在高祖本纪与各列传里露出残暴与政治短视的证据；反之亦然。两篇并读，才还原出真实的楚汉之争。
        </p>
        <div class="stepper-ctl">
          <button type="button" class="ctl-btn" id="prevBtn" disabled>上一个焦点</button>
          <button type="button" class="ctl-btn" id="nextBtn">下一个焦点</button>
        </div>
      </footer>
    </main>
  </div>

      var xiangFocus = document.getElementById("xiangFocus");
      var xiangOmit = document.getElementById("xiangOmit");
      var xiangEffect = document.getElementById("xiangEffect");

      var liuPosture = document.getElementById("liuPosture");
      var liuQuote = document.getElementById("liuQuote");
      var liuFocus = document.getElementById("liuFocus");
      var liuOmit = document.getElementById("liuOmit");
      var liuEffect = document.getElementById("liuEffect");

      var synthesisTitle = document.getElementById("synthesisTitle");
      var synthesisDesc = document.getElementById("synthesisDesc");
      var prevBtn = document.getElementById("prevBtn");
      var nextBtn = document.getElementById("nextBtn");

      function render(idx) {
        currentIndex = idx;
        var item = data[idx];

        navCards.forEach(function(c, i){
          if(i === idx) {
            c.classList.add("active");
            c.setAttribute("aria-current", "true");
          } else {
            c.classList.remove("active");
            c.removeAttribute("aria-current");
          }
        });

        // 项羽
        xiangPosture.textContent = item.xiang.posture;
        xiangQuote.innerHTML = item.xiang.quote;
        xiangFocus.innerHTML = item.xiang.focus;
        xiangOmit.innerHTML = item.xiang.omit;
        xiangEffect.textContent = item.xiang.effect;

        // 刘邦
        liuPosture.textContent = item.liu.posture;
        liuQuote.innerHTML = item.liu.quote;
        liuFocus.innerHTML = item.liu.focus;
        liuOmit.innerHTML = item.liu.omit;
        liuEffect.textContent = item.liu.effect;

        // 裁断
        synthesisTitle.textContent = item.synthesis.title;
        synthesisDesc.innerHTML = item.synthesis.desc;

        prevBtn.disabled = idx === 0;
        nextBtn.disabled = idx === data.length - 1;
      }

      navCards.forEach(function(card){
        card.addEventListener("click", function(){
          var id = parseInt(this.getAttribute("data-event"), 10);
          render(id);
        });
      });

      prevBtn.addEventListener("click", function(){
        if(currentIndex > 0) render(currentIndex - 1);
      });

      nextBtn.addEventListener("click", function(){
        if(currentIndex < data.length - 1) render(currentIndex + 1);
      });

      document.addEventListener("keydown", function(e){
        if(e.key === "ArrowLeft" || e.key === "ArrowUp") {
          if(currentIndex > 0) {
            e.preventDefault();
            render(currentIndex - 1);
          }
        } else if(e.key === "ArrowRight" || e.key === "ArrowDown") {
          if(currentIndex < data.length - 1) {
            e.preventDefault();
            render(currentIndex + 1);
          }
        }
      });

      // 初始化底盘
      Deck.init({ index: 5, total: 15, keys: false });
      render(0);
    })();
  </script>
</body>
</html>
