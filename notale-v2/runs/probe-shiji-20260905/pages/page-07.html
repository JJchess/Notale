<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 30px 44px;
      gap: 14px;
      user-select: none;
      height: 100%;
      overflow: hidden;
    }

    /* 顶部标题栏与模式切换 */
    .header-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      border-bottom: var(--line) solid var(--muted);
      padding-bottom: 12px;
    }
    .header-title h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.04em;
    }
    .header-title p {
      margin: 4px 0 0;
      font-size: var(--fs-sec);
      color: var(--muted);
    }
    .subject-switch {
      display: flex;
      gap: 8px;
    }
    .subj-btn {
      appearance: none;
      border: 1px solid var(--muted);
      background: var(--paper);
      color: var(--text);
      padding: 6px 18px;
      border-radius: var(--radius);
      font-size: var(--fs-label);
      font-family: var(--font-display);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--ease);
    }
    .subj-btn.active {
      background: var(--crossref);
      color: #fff;
      border-color: var(--crossref);
    }

    /* 主操作区：左右分栏 (左侧文献竹简，右侧评价仪表盘与证据链) */
    .workbench {
      display: grid;
      grid-template-columns: 820px 1fr;
      gap: 22px;
      flex: 1;
      min-height: 0;
    }

    /* 左栏：互见片段编联区 */
    .corpus-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    .col-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .col-title {
      font-size: var(--fs-h2);
      font-family: var(--font-display);
      color: var(--text);
      font-weight: 700;
    }
    .col-sub {
      font-size: var(--fs-label);
      color: var(--muted);
    }

    .source-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding-right: 6px;
      flex: 1;
      min-height: 0;
    }
    .source-card {
      background: var(--paper);
      border: 1px solid rgba(82, 99, 93, 0.28);
      border-radius: var(--radius);
      padding: 9px 12px;
      cursor: pointer;
      position: relative;
      transition: border-color var(--ease), background var(--ease), box-shadow var(--ease);
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }
    .source-card:hover {
      border-color: var(--crossref);
    }
    .source-card.active {
      border: 2px solid var(--crossref);
      background: #FFFFFF;
      box-shadow: 0 2px 8px rgba(36, 99, 88, 0.12);
    }
    .source-card.core-source {
      box-shadow: inset 3px 0 0 var(--selected);
    }
    .source-card.active.core-source {
      box-shadow: inset 3px 0 0 var(--selected), 0 2px 8px rgba(36, 99, 88, 0.12);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tag-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .tag-origin {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--fs-sec);
      color: var(--text);
    }
    .tag-type {
      font-size: var(--fs-label);
      padding: 1px 8px;
      border-radius: 3px;
      font-weight: 500;
    }
    .type-core {
      background: rgba(21, 95, 131, 0.12);
      color: var(--selected);
    }
    .type-cross {
      background: rgba(36, 99, 88, 0.14);
      color: var(--crossref);
    }
    .card-impact {
      font-size: var(--fs-tick);
      font-family: var(--font-num);
      font-weight: 700;
      display: flex;
      gap: 8px;
    }
    .impact-val {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .impact-val.pos { color: var(--correct); }
    .impact-val.neg { color: var(--judgment); }
    .impact-val.zero { color: var(--muted); }

    .card-quote {
      font-family: var(--font-sans);
      font-size: var(--fs-sec);
      line-height: 1.4;
      color: var(--text);
    }
    .card-focus {
      font-size: var(--fs-label);
      color: var(--muted);
      line-height: 1.35;
      border-top: 1px dashed rgba(82, 99, 93, 0.2);
      padding-top: 4px;
      margin-top: 2px;
    }
    .card-checkbox {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: var(--fs-tick);
      color: var(--muted);
      font-weight: 600;
    }
    .source-card.active .card-checkbox {
      color: var(--crossref);
    }

    /* 右栏：重组研判仪表与多维度差异 */
    .analysis-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    .verdict-panel {
      background: var(--paper);
      border: 1px solid rgba(82, 99, 93, 0.3);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .verdict-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(82, 99, 93, 0.2);
      padding-bottom: 8px;
    }
    .verdict-status {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
    }
    .verdict-tag {
      font-size: var(--fs-label);
      color: var(--muted);
    }

    /* 评价维度柱状图/量表 */
    .dimensions-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .dim-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .dim-labels {
      display: flex;
      justify-content: space-between;
      font-size: var(--fs-label);
      color: var(--text);
      font-weight: 600;
    }
    .dim-score {
      font-family: var(--font-num);
      font-weight: 700;
    }
    .meter-track {
      position: relative;
      height: 14px;
      background: #E8ECE6;
      border-radius: 7px;
      overflow: hidden;
    }
    .meter-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      border-radius: 7px;
      transition: width var(--ease), background var(--ease);
    }
    .meter-marker-base {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #17231F;
      opacity: 0.35;
      z-index: 2;
    }

    /* 结论对比框 */
    .contrast-box {
      background: #FAFBF9;
      border: 1px solid rgba(82, 99, 93, 0.22);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .contrast-title {
      font-size: var(--fs-sec);
      font-weight: 700;
      color: var(--judgment);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .contrast-desc {
      font-size: var(--fs-sec);
      line-height: 1.45;
      color: var(--text);
    }

    /* 动作按钮区 */
    .action-row {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }
    .action-btn {
      flex: 1;
      height: 42px;
      border: 1px solid var(--muted);
      background: var(--paper);
      color: var(--text);
      font-size: var(--fs-label);
      font-weight: 600;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--ease);
    }
    .action-btn.primary {
      background: var(--crossref);
      color: #FFFFFF;
      border-color: var(--crossref);
    }
    .action-btn:hover {
      filter: brightness(0.95);
    }

    /* 编联统计标尺 */
    .evidence-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: center;
    }
    .summary-card {
      background: var(--paper);
      border: 1px solid rgba(82, 99, 93, 0.2);
      border-radius: var(--radius);
      padding: 8px 6px;
    }
    .summary-num {
      font-family: var(--font-num);
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
    }
    .summary-lbl {
      font-size: var(--fs-tick);
      color: var(--muted);
      margin-top: 2px;
    }
  </style>
</head>
<body data-page="07" data-total="15">
  <div id="stage">
    <!-- 顶栏：教学目标与探究主体选择 -->
    <header class="header-row">
      <div class="header-title">
        <h1>互见材料重组：单篇结论与跨篇结论的视差</h1>
        <p>勾选不同篇章的历史记录，观察史料编联如何动态改变人物评价与道德归因</p>
      </div>
      <div class="subject-switch" role="tablist" aria-label="选择探究人物">
        <button class="subj-btn active" id="btnSubjLi" data-subj="li" role="tab" aria-selected="true">李广：悲剧名将</button>
        <button class="subj-btn" id="btnSubjXiang" data-subj="xiang" role="tab" aria-selected="false">项羽：英雄与残暴</button>
      </div>
    </header>

    <!-- 主操作工作台 -->
    <main class="workbench min0">
      <!-- 左栏：互见片段编联区 -->
      <section class="corpus-col min0">
        <div class="col-head">
          <span class="col-title" id="corpusTitle">《史记》跨篇文献碎片库</span>
          <span class="col-sub">点击卡片加入/移出研判证据链（当前选中 <b id="activeCount" style="color:var(--crossref)">1</b> 篇）</span>
        </div>
        <div class="source-list min0" id="sourceList" role="group" aria-label="可勾选的文献片段列表">
          <!-- 动态渲染篇章卡片 -->
        </div>
      </section>

      <!-- 右栏：量化重组与结论视差 -->
      <section class="analysis-col min0">
        <!-- 编联统计标尺 -->
        <div class="evidence-summary">
          <div class="summary-card">
            <div class="summary-num" id="statIncluded">1 / 5</div>
            <div class="summary-lbl">编联文献篇数</div>
          </div>
          <div class="summary-card">
            <div class="summary-num" id="statDiscrepancy" style="color:var(--judgment)">0%</div>
            <div class="summary-lbl">与本传偏离度</div>
          </div>
          <div class="summary-card">
            <div class="summary-num" id="statParadox" style="color:var(--crossref)">单篇叙述</div>
            <div class="summary-lbl">当前认知状态</div>
          </div>
        </div>

        <!-- 研判仪表盘 -->
        <div class="verdict-panel min0">
          <div class="verdict-header">
            <span class="verdict-status" id="verdictHeadline">单篇视角：悲剧战神</span>
            <span class="verdict-tag" id="verdictPerspective">基准源：本传独览</span>
          </div>

          <!-- 三维量表 -->
          <div class="dimensions-list" id="dimensionsContainer">
            <!-- 动态渲染三项评价维度 -->
          </div>

          <!-- 结论反差说明 -->
          <div class="contrast-box">
            <div class="contrast-title">
              <span id="contrastBadge">● 视差诊断</span>
            </div>
            <div class="contrast-desc" id="contrastDetail">
              仅读本传，读者易沉浸于“数奇不偶、士卒爱戴”的悲壮情调中；补全其他列传后，李广治军疏阔、杀降自私的制度缺陷逐渐浮出。
            </div>
          </div>
        </div>

        <!-- 快捷操作区 -->
        <div class="action-row">
          <button class="action-btn" id="btnSelectCore">仅看本传（单篇基准）</button>
          <button class="action-btn primary" id="btnSelectAll">全篇编联（互见全景）</button>
          <button class="action-btn" id="btnInvert">翻转外传片段</button>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/base.js"></script>

            countMin: 4, countMax: 5,
            title: "全景编联：暴虐失道与神武共存之实",
            tag: "视角：司马迁不虚美不隐恶的定评",
            desc: "新安坑卒二十万与彭城屠戮在诸传汇聚，打破纯英雄滤镜：楚之速亡并非天意，而是逆历史大势的自取之祸。"
          }
        ]
      }
    };

    // 运行状态机
    let currentSubjectKey = "li";
    let selectedFragmentIds = new Set(["li_main"]);

    // DOM 引用
    const dom = {
      btnSubjLi: document.getElementById("btnSubjLi"),
      btnSubjXiang: document.getElementById("btnSubjXiang"),
      sourceList: document.getElementById("sourceList"),
      corpusTitle: document.getElementById("corpusTitle"),
      activeCount: document.getElementById("activeCount"),
      statIncluded: document.getElementById("statIncluded"),
      statDiscrepancy: document.getElementById("statDiscrepancy"),
      statParadox: document.getElementById("statParadox"),
      verdictHeadline: document.getElementById("verdictHeadline"),
      verdictPerspective: document.getElementById("verdictPerspective"),
      dimensionsContainer: document.getElementById("dimensionsContainer"),
      contrastBadge: document.getElementById("contrastBadge"),
      contrastDetail: document.getElementById("contrastDetail"),
      btnSelectCore: document.getElementById("btnSelectCore"),
      btnSelectAll: document.getElementById("btnSelectAll"),
      btnInvert: document.getElementById("btnInvert")
    };

    // 切换探究人物
    function switchSubject(key) {
      currentSubjectKey = key;
      const data = DATASETS[key];
      selectedFragmentIds = new Set([data.fragments[0].id]); // 默认只选本传

      dom.btnSubjLi.classList.toggle("active", key === "li");
      dom.btnSubjLi.setAttribute("aria-selected", key === "li");
      dom.btnSubjXiang.classList.toggle("active", key === "xiang");
      dom.btnSubjXiang.setAttribute("aria-selected", key === "xiang");

      dom.corpusTitle.textContent = `${data.name}相关篇章文献碎片`;
      render();
    }

    // 切换单张卡片状态
    function toggleFragment(id) {
      const data = DATASETS[currentSubjectKey];
      const isCore = (id === data.fragments[0].id);

      // 本传允许取消吗？为教学对照，强制至少选一项；若取消核心，需有其他支撑，但推荐本传常驻
      if (selectedFragmentIds.has(id)) {
        if (selectedFragmentIds.size === 1) {
          // 不允许完全清空
          return;
        }
        selectedFragmentIds.delete(id);
      } else {
        selectedFragmentIds.add(id);
      }
      render();
    }

    // 计算衍生量与证据
    function computeEvaluation() {
      const data = DATASETS[currentSubjectKey];
      const coreFrag = data.fragments[0];
      const hasCore = selectedFragmentIds.has(coreFrag.id);

      // 汇总当前各项维度的净分
      const currentScores = {};
      data.dimensions.forEach(dim => {
        let val = dim.base;
        data.fragments.forEach(frag => {
          if (selectedFragmentIds.has(frag.id)) {
            val += frag.delta[dim.key] || 0;
          }
        });
        currentScores[dim.key] = Math.max(15, Math.min(100, val));
      });

      // 计算与纯本传的加权平均偏离度 (Discrepancy)
      let totalShift = 0;
      data.dimensions.forEach(dim => {
        const baseScore = dim.base;
        totalShift += Math.abs(baseScore - currentScores[dim.key]);
      });
      const maxPossibleShift = 120; // 归一化基准
      const discrepancyPct = Math.min(100, Math.round((totalShift / maxPossibleShift) * 100));

      // 决定综合评语阶段
      const activeCount = selectedFragmentIds.size;
      let synthesis = data.syntheses[0];
      for (const s of data.syntheses) {
        if (activeCount >= s.countMin && activeCount <= s.countMax) {
          synthesis = s;
          break;
        }
      }

      return {
        scores: currentScores,
        discrepancyPct,
        activeCount,
        synthesis
      };
    }

    // 渲染视图
    function render() {
      const data = DATASETS[currentSubjectKey];
      const evalResult = computeEvaluation();

      // 1. 渲染文献碎片列表
      dom.sourceList.innerHTML = "";
      data.fragments.forEach(frag => {
        const isSelected = selectedFragmentIds.has(frag.id);
        const card = document.createElement("div");
        card.className = `source-card ${isSelected ? 'active' : ''} ${frag.isCore ? 'core-source' : ''}`;
        card.setAttribute("role", "checkbox");
        card.setAttribute("aria-checked", isSelected);
        card.setAttribute("tabindex", "0");

        // 标签
        const typeClass = frag.isCore ? 'type-core' : 'type-cross';

        // 影响概览
        let impactHtml = "";
        data.dimensions.forEach(dim => {
          const d = frag.delta[dim.key];
          if (d !== 0) {
            const sign = d > 0 ? `+${d}` : `${d}`;
            const cls = d > 0 ? 'pos' : 'neg';
            impactHtml += `<span class="impact-val ${cls}">${dim.label.slice(0, 2)} ${sign}</span>`;
          }
        });
        if (!impactHtml) {
          impactHtml = `<span class="impact-val zero">初始基准</span>`;
        }

        card.innerHTML = `
          <div class="card-top">
            <div class="tag-group">
              <span class="tag-origin">${frag.source}</span>
              <span class="tag-type ${typeClass}">${frag.typeLabel}</span>
            </div>
            <div class="card-impact">${impactHtml}</div>
          </div>
          <div class="card-quote">${frag.quote}</div>
          <div class="card-focus">${frag.focus}</div>
          <div class="card-checkbox">
            <span>${isSelected ? '☑ 已纳为研判依据' : '☐ 未编联入链'}</span>
          </div>
        `;

        card.addEventListener("click", () => toggleFragment(frag.id));
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggleFragment(frag.id);
          }
        });
        dom.sourceList.appendChild(card);
      });

      // 2. 顶部与统计标尺
      dom.activeCount.textContent = evalResult.activeCount;
      dom.statIncluded.textContent = `${evalResult.activeCount} / ${data.fragments.length}`;
      dom.statDiscrepancy.textContent = `${evalResult.discrepancyPct}%`;
      dom.statParadox.textContent = evalResult.activeCount === 1 ? "单篇叙述" : (evalResult.activeCount >= 4 ? "全景互见" : "多篇张力");

      // 3. 研判结论与维度仪表
      dom.verdictHeadline.textContent = evalResult.synthesis.title;
      dom.verdictPerspective.textContent = evalResult.synthesis.tag;
      dom.contrastDetail.textContent = evalResult.synthesis.desc;

      // 4. 三维量表更新
      dom.dimensionsContainer.innerHTML = "";
      data.dimensions.forEach(dim => {
        const score = evalResult.scores[dim.key];
        const base = dim.base;
        const diff = score - base;
        const diffStr = diff === 0 ? "基准" : (diff > 0 ? `+${diff}` : `${diff}`);
        const diffColor = diff === 0 ? "var(--muted)" : (diff > 0 ? "var(--correct)" : "var(--judgment)");

        // 颜色动态：高分为墨青色，偏低转化为赭红色
        let barColor = "var(--selected)";
        if (score < 50) barColor = "var(--judgment)";
        else if (score >= 80) barColor = "var(--crossref)";

        const row = document.createElement("div");
        row.className = "dim-row";
        row.innerHTML = `
          <div class="dim-labels">
            <span>${dim.label}</span>
            <span>
              <span class="dim-score" style="color:${barColor}">${score} 分</span>
              <span style="font-size:var(--fs-tick); color:${diffColor}; margin-left:6px;">(${diffStr})</span>
            </span>
          </div>
          <div class="meter-track" title="基准标线为单篇本传读数 (${base}分)">
            <div class="meter-marker-base" style="left:${base}%"></div>
            <div class="meter-fill" style="width:${score}%; background:${barColor}"></div>
          </div>
        `;
        dom.dimensionsContainer.appendChild(row);
      });
    }

    // 绑定全局操作按钮
    dom.btnSubjLi.addEventListener("click", () => switchSubject("li"));
    dom.btnSubjXiang.addEventListener("click", () => switchSubject("xiang"));

    dom.btnSelectCore.addEventListener("click", () => {
      const data = DATASETS[currentSubjectKey];
      selectedFragmentIds = new Set([data.fragments[0].id]);
      render();
    });

    dom.btnSelectAll.addEventListener("click", () => {
      const data = DATASETS[currentSubjectKey];
      selectedFragmentIds = new Set(data.fragments.map(f => f.id));
      render();
    });

    dom.btnInvert.addEventListener("click", () => {
      const data = DATASETS[currentSubjectKey];
      const coreId = data.fragments[0].id;
      const nextSet = new Set();
      if (selectedFragmentIds.has(coreId)) nextSet.add(coreId); // 保留本传

      data.fragments.slice(1).forEach(f => {
        if (!selectedFragmentIds.has(f.id)) nextSet.add(f.id);
      });
      selectedFragmentIds = nextSet;
      render();
    });

    // 初始化运行
    Deck.init({ index: 7, total: 15, keys: false });
    render();
  </script>
</body>
</html>
