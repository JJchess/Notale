<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>带走一套读法：跨篇找互文、篇末辨声音、回到叙事检验判断</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    /* 页面特异样式：本页为《史记》叙事策略收官总结页（方法闭环） */
    #stage {
      padding: 36px 56px 30px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
    }

    .page-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .page-header h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      color: var(--text);
      letter-spacing: -0.02em;
      margin: 0;
      line-height: 1.2;
    }

    .page-header .lead {
      font-size: var(--fs-lead);
      color: var(--muted);
      margin: 0;
      line-height: 1.4;
    }

    /* 主工作台：三步读法联动工作流 */
    .method-workbench {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 370px 1fr;
      gap: 24px;
    }

    /* 左侧：方法三步导引与选择器 */
    .steps-nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .step-card {
      background: var(--paper);
      border: 1.5px solid rgba(82, 99, 93, 0.2);
      border-radius: var(--radius);
      padding: 20px 22px;
      cursor: pointer;
      transition: border-color var(--ease), background var(--ease), transform var(--ease);
      text-align: left;
      position: relative;
    }

    .step-card:hover {
      border-color: var(--muted);
    }

    .step-card[aria-current="true"] {
      border-color: var(--selected);
      box-shadow: 0 0 0 1.5px var(--selected);
      background: #FFFFFF;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .step-card[aria-current="true"] .step-badge {
      color: var(--selected);
    }

    .step-badge .pill {
      display: inline-block;
      width: 22px;
      height: 22px;
      line-height: 22px;
      text-align: center;
      border-radius: 50%;
      background: rgba(82, 99, 93, 0.12);
      font-family: var(--font-num);
      font-size: var(--fs-tick);
    }

    .step-card[aria-current="true"] .step-badge .pill {
      background: var(--selected);
      color: #fff;
    }

    .step-title {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.25;
    }

    .step-summary {
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: 1.5;
      margin: 0;
    }

    .case-selector {
      background: rgba(255, 255, 255, 0.7);
      border-radius: var(--radius);
      border: 1px dashed rgba(82, 99, 93, 0.35);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
    }

    .case-selector .ctl-label {
      font-size: var(--fs-label);
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
    }

    .case-btns {
      display: flex;
      gap: 8px;
    }

    .case-btn {
      border: 1px solid var(--muted);
      background: transparent;
      padding: 5px 12px;
      border-radius: var(--radius);
      font-size: var(--fs-label);
      color: var(--text);
      cursor: pointer;
      transition: all var(--ease);
    }

    .case-btn[aria-pressed="true"] {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    /* 右侧：证据展示与机制解构台 */
    .stage-card {
      background: var(--paper);
      border: 1.5px solid rgba(82, 99, 93, 0.22);
      border-radius: var(--radius);
      padding: 24px 28px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    .stage-card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(82, 99, 93, 0.15);
      padding-bottom: 10px;
    }

    .stage-card-title {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .role-tag {
      font-size: var(--fs-label);
      font-family: var(--font-sans);
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(36, 99, 88, 0.1);
      color: var(--crossref);
      font-weight: 500;
    }

    .role-tag.judgment {
      background: rgba(156, 53, 40, 0.1);
      color: var(--judgment);
    }

    .role-tag.verify {
      background: rgba(21, 95, 131, 0.1);
      color: var(--selected);
    }

    .stage-card-sub {
      font-size: var(--fs-sec);
      color: var(--muted);
    }

    /* 证据与图示展示区 */
    .view-content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* 第一步视图：篇际编联网络图示 */
    .crossref-view {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
      height: 100%;
    }

    .source-panel {
      background: #F8FAF7;
      border: 1px solid rgba(82, 99, 93, 0.2);
      border-radius: var(--radius);
      padding: 24px 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
      justify-content: flex-start;
    }

    .source-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .source-tag {
      font-family: var(--font-display);
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--text);
    }

    .source-slant {
      font-size: var(--fs-tick);
      color: var(--crossref);
      background: rgba(36, 99, 88, 0.08);
      padding: 2px 8px;
      border-radius: 2px;
    }

    .source-quote {
      font-family: var(--font-display);
      font-size: var(--fs-body);
      line-height: 1.6;
      color: var(--text);
      margin: 0;
      border-left: 3px solid var(--crossref);
      padding-left: 14px;
    }

    .source-explain {
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: 1.45;
      margin: 0;
      border-top: 1px dashed rgba(82, 99, 93, 0.15);
      padding-top: 12px;
    }

    .crossref-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 140px;
    }

    .link-svg {
      width: 130px;
      height: 50px;
    }

    .crossref-core-tag {
      font-size: var(--fs-label);
      color: var(--crossref);
      font-weight: 600;
      text-align: center;
      line-height: 1.35;
      background: #EAF2EE;
      border: 1px solid rgba(36, 99, 88, 0.3);
      border-radius: 4px;
      padding: 8px 10px;
    }

    /* 第二步视图：声音分层与裁断解析 */
    .voice-view {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
      height: 100%;
      align-items: center;
    }

    .voice-quote-panel {
      background: #FAF7F6;
      border: 1px solid rgba(156, 53, 40, 0.2);
      border-radius: var(--radius);
      padding: 24px 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: flex-start;
      box-sizing: border-box;
    }

    .voice-label-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .voice-badge {
      font-family: var(--font-display);
      font-size: var(--fs-label);
      font-weight: bold;
      color: var(--judgment);
      border: 1px solid var(--judgment);
      padding: 2px 8px;
      border-radius: 3px;
    }

    .voice-target {
      font-size: var(--fs-sec);
      color: var(--muted);
    }

    .voice-text {
      font-family: var(--font-display);
      font-size: var(--fs-body);
      line-height: 1.65;
      color: var(--text);
      margin: 0;
      border-left: 3px solid var(--judgment);
      padding-left: 14px;
    }

    .voice-diag-panel {
      background: #FBFBFA;
      border: 1px solid rgba(82, 99, 93, 0.2);
      border-radius: var(--radius);
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 12px;
    }

    .voice-breakdown-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .breakdown-title {
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .breakdown-desc {
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: 1.45;
      margin: 0;
    }

    /* 第三步视图：回到叙事循环验证 */
    .verify-view {
      display: grid;
      grid-template-columns: 1fr 68px 1fr;
      align-items: center;
      gap: 18px;
      height: 100%;
    }

    .verify-box {
      background: #F6F9FA;
      border: 1px solid rgba(21, 95, 131, 0.25);
      border-radius: var(--radius);
      padding: 24px 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
      justify-content: flex-start;
    }

    .verify-head {
      font-family: var(--font-display);
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--selected);
    }

    .verify-statement {
      font-size: var(--fs-body);
      font-family: var(--font-display);
      color: var(--text);
      line-height: 1.55;
      margin: 0;
    }

    .verify-proof {
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: 1.45;
      margin: 0;
      border-top: 1px dashed rgba(21, 95, 131, 0.2);
      padding-top: 12px;
    }

    .verify-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .verify-tag {
      font-size: var(--fs-tick);
      font-weight: 600;
      color: var(--selected);
      writing-mode: vertical-rl;
      letter-spacing: 3px;
    }

    /* 底部收束结论条 */
    .summary-strip {
      border-top: 1px solid rgba(82, 99, 93, 0.18);
      padding-top: 12px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 24px;
      align-items: center;
    }

    .summary-formula {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: var(--fs-sec);
      color: var(--text);
      white-space: nowrap;
    }

    .formula-step {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .formula-step b {
      color: var(--text);
    }

    .formula-step span {
      color: var(--muted);
      font-size: var(--fs-label);
    }

    .formula-arrow {
      color: var(--muted);
      font-family: var(--font-sans);
    }

    .takeaway-note {
      font-size: var(--fs-sec);
      color: var(--judgment);
      font-weight: 500;
      line-height: 1.4;
      margin: 0;
      text-align: right;
    }
  </style>
</head>
<body data-page="15" data-total="15">
  <div id="stage">
    <!-- 页头：主结论与导语 -->
    <header class="page-header">
      <h1>带走一套读法：跨篇找互文、篇末辨声音、回到叙事检验判断</h1>
      <p class="lead">读《史记》不在记住孤立的篇章结论，而在掌握司马迁交付给读者的批判性阅读循环。</p>
    </header>

    <!-- 主工作台：左侧方法控制，右侧证据展开 -->
    <main class="method-workbench min0">
      <!-- 左侧：三步阅读法 -->
      <section class="steps-nav min0" aria-label="三步读法选择器">
        <button class="step-card" data-step="0" aria-current="true">
          <div class="step-badge"><span class="pill">1</span>第一步 · 横向检索</div>
          <div class="step-title">跨篇找互文</div>
          <p class="step-summary">不把单篇当作完整定论。同一人物的事迹、言行与弱点，往往分散于本纪、世家与列传中互见补全。</p>
        </button>

        <button class="step-card" data-step="1" aria-current="false">
          <div class="step-badge"><span class="pill">2</span>第二步 · 纵向辨析</div>
          <div class="step-title">篇末辨声音</div>
          <p class="step-summary">区分客观叙述与叙事者现身。太史公曰不是史实的延续，而是作者依据经验、伦理与因果提出的主观裁断。</p>
        </button>

        <button class="step-card" data-step="2" aria-current="false">
          <div class="step-badge"><span class="pill">3</span>第三步 · 闭环验证</div>
          <div class="step-title">回到叙事验判断</div>
          <p class="step-summary">用整部书的实录因果反诘篇末议论。检验叙事者的赞语是否被前文细节支撑，抑或留下了作者的价值困惑。</p>
        </button>

        <!-- 经典范例切换 -->
        <div class="case-selector">
          <span class="ctl-label">实操研读案例：</span>
          <div class="case-btns" role="radiogroup" aria-label="研读案例切换">
            <button class="case-btn" data-case="xiangyu" aria-pressed="true">项羽案例</button>
            <button class="case-btn" data-case="gaozu" aria-pressed="false">高祖案例</button>
          </div>
        </div>
      </section>

      <!-- 右侧：动态证据与方法解构台 -->
      <section class="stage-card min0" aria-live="polite">
        <div class="stage-card-header">
          <div class="stage-card-title">
            <span id="stageTitle">步骤 1：横向互见中的证据拼图</span>
            <span id="roleTag" class="role-tag">跨篇互见</span>
          </div>
          <div class="stage-card-sub" id="stageSub">观察互见法如何把孤立篇章连缀为全息事实</div>
        </div>

        <div class="view-content min0" id="viewContainer">
          <!-- 动态注入 HTML 内容 -->
        </div>

        <!-- 底部收官总结 -->
        <footer class="summary-strip">
          <div class="summary-formula">
            <span class="formula-step"><b>散见史料</b>（互见法）</span>
            <span class="formula-arrow">+</span>
            <span class="formula-step"><b>作者裁断</b>（太史公曰）</span>
            <span class="formula-arrow">→</span>
            <span class="formula-step"><b>读者独立评判</b>（回到叙事）</span>
          </div>
          <p class="takeaway-note" id="takeawayNote">阅读完成：历史的真面目在编联与质疑中显现。</p>
        </footer>
      </section>
    </main>
  </div>

            badge: "太史公曰",
            target: "高祖起布衣定天下，究竟继承了何种历史法则？",
            quote: "夏之政尚忠……殷之政尚敬……周之政尚文。秦承其敝，不改，又益之以严刑峻法，岂不缪哉！故汉兴，承敝易变，使民不倦，得天统矣。",
            points: [
              { label: "历史循环论", desc: "以‘忠、敬、文’三德救敝解释秦汉交替，赋予汉高祖顺应天时的救亡合法性。" },
              { label: "去神话化", desc: "不再提神龙感孕或赤帝斩白蛇，而将汉兴归因于制度上的‘承敝易变，与民休息’。" }
            ]
          },
          step2: {
            title: "步骤 3：回到叙事细节，反验史家判断",
            tag: "闭环验证",
            tagClass: "verify",
            sub: "对照论赞所称的‘得天统/承敝易变’，与开国后剪除异姓功臣的惨烈现实",
            boxA: {
              head: "论赞宏大命题（政统成立）",
              stmt: "“故汉兴，承敝易变，使民不倦，得天统矣”",
              proof: "太史公在赞语中着眼于天下免于秦法摧残，宽刑简政，肯定了刘邦作为帝王顺应民意的历史功绩。"
            },
            relation: "史实校正",
            boxB: {
              head: "叙事残忍实录（功臣屠戮）",
              stmt: "《留侯世家》《淮阴侯列传》记韩信、彭越、黥布相继诛灭",
              proof: "刘邦临终前‘安得猛士兮守四方’的惊恐，与吕后残忍屠戮功臣的细节，暴露了政道循环背后的权力猜忌。"
            }
          },
          takeaway: "总结：读者经由互见破除帝王神话，经由论赞理解制度变革，再回看叙事认清权力更迭的真实代价。"
        }
      };

      // 状态机
      let currentStep = 0;
      let currentCaseKey = "xiangyu";

      // 节点缓存
      const stageTitle = document.getElementById("stageTitle");
      const stageSub = document.getElementById("stageSub");
      const roleTag = document.getElementById("roleTag");
      const viewContainer = document.getElementById("viewContainer");
      const takeawayNote = document.getElementById("takeawayNote");
      const stepButtons = document.querySelectorAll(".step-card");
      const caseButtons = document.querySelectorAll(".case-btn");

      function renderStep() {
        const cData = CASES[currentCaseKey];

        // 更新左侧步骤高亮
        stepButtons.forEach((btn, idx) => {
          btn.setAttribute("aria-current", idx === currentStep ? "true" : "false");
        });

        // 更新案例按钮状态
        caseButtons.forEach(btn => {
          btn.setAttribute("aria-pressed", btn.dataset.case === currentCaseKey ? "true" : "false");
        });

        takeawayNote.textContent = cData.takeaway;

        if (currentStep === 0) {
          const s0 = cData.step0;
          stageTitle.textContent = s0.title;
          stageSub.textContent = s0.sub;
          roleTag.textContent = s0.tag;
          roleTag.className = "role-tag " + s0.tagClass;

          viewContainer.innerHTML = `
            <div class="crossref-view min0">
              <div class="source-panel min0">
                <div class="source-head">
                  <span class="source-tag">${s0.sourceA.chap}</span>
                  <span class="source-slant">${s0.sourceA.slant}</span>
                </div>
                <blockquote class="source-quote">${s0.sourceA.quote}</blockquote>
                <p class="source-explain">${s0.sourceA.explain}</p>
              </div>

              <div class="crossref-mid">
                <svg class="link-svg" viewBox="0 0 130 50">
                  <defs>
                    <marker id="arrowHead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                      <path d="M0,0 L6,3 L0,6 Z" fill="var(--crossref)" />
                    </marker>
                  </defs>
                  <path d="M 10 18 C 65 5, 65 5, 120 18" fill="none" stroke="var(--crossref)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowHead)" />
                  <path d="M 120 32 C 65 45, 65 45, 10 32" fill="none" stroke="var(--crossref)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowHead)" />
                </svg>
                <div class="crossref-core-tag">${s0.midTag}</div>
              </div>

              <div class="source-panel min0">
                <div class="source-head">
                  <span class="source-tag">${s0.sourceB.chap}</span>
                  <span class="source-slant">${s0.sourceB.slant}</span>
                </div>
                <blockquote class="source-quote">${s0.sourceB.quote}</blockquote>
                <p class="source-explain">${s0.sourceB.explain}</p>
              </div>
            </div>
          `;
        } else if (currentStep === 1) {
          const s1 = cData.step1;
          stageTitle.textContent = s1.title;
          stageSub.textContent = s1.sub;
          roleTag.textContent = s1.tag;
          roleTag.className = "role-tag " + s1.tagClass;

          const pointsHtml = s1.points.map(pt => `
            <div class="voice-breakdown-item">
              <div class="breakdown-title">
                <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--judgment);"></span>
                ${pt.label}
              </div>
              <p class="breakdown-desc">${pt.desc}</p>
            </div>
          `).join("");

          viewContainer.innerHTML = `
            <div class="voice-view min0">
              <div class="voice-quote-panel min0">
                <div class="voice-label-row">
                  <span class="voice-badge">${s1.badge}</span>
                  <span class="voice-target">${s1.target}</span>
                </div>
                <blockquote class="voice-text">${s1.quote}</blockquote>
              </div>
              <div class="voice-diag-panel min0">
                ${pointsHtml}
              </div>
            </div>
          `;
        } else if (currentStep === 2) {
          const s2 = cData.step2;
          stageTitle.textContent = s2.title;
          stageSub.textContent = s2.sub;
          roleTag.textContent = s2.tag;
          roleTag.className = "role-tag " + s2.tagClass;

          viewContainer.innerHTML = `
            <div class="verify-view min0">
              <div class="verify-box min0">
                <div class="verify-head">${s2.boxA.head}</div>
                <p class="verify-statement">${s2.boxA.stmt}</p>
                <p class="verify-proof">${s2.boxA.proof}</p>
              </div>

              <div class="verify-link">
                <svg width="32" height="48" viewBox="0 0 32 48">
                  <path d="M 6 12 L 26 12 M 26 12 L 20 6 M 26 12 L 20 18" stroke="var(--selected)" stroke-width="2" fill="none" stroke-linecap="round"/>
                  <path d="M 26 36 L 6 36 M 6 36 L 12 30 M 6 36 L 12 42" stroke="var(--selected)" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
                <span class="verify-tag">${s2.relation}</span>
              </div>

              <div class="verify-box min0">
                <div class="verify-head">${s2.boxB.head}</div>
                <p class="verify-statement">${s2.boxB.stmt}</p>
                <p class="verify-proof">${s2.boxB.proof}</p>
              </div>
            </div>
          `;
        }
      }

      // 事件绑定
      stepButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          currentStep = parseInt(btn.dataset.step, 10);
          renderStep();
        });
      });

      caseButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          currentCaseKey = btn.dataset.case;
          renderStep();
        });
      });

      // 初始化底盘与首绘
      Deck.init({ index: 15, total: 15 });
      renderStep();
    })();
  </script>
</body>
</html>
