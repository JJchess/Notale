<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: var(--pad-y) var(--pad-x);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--text);
      box-sizing: border-box;
      user-select: none;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-family: var(--font-display);
      font-weight: 600;
      line-height: var(--lh-tight);
    }
    .metrics {
      display: flex;
      gap: 24px;
      font-size: var(--fs-label);
      color: var(--muted);
    }
    .metrics b {
      font-size: 18px;
      color: var(--model);
      margin-left: 6px;
      font-weight: 700;
    }

    /* 构图：SVG 矢量连线 + 两栏紧凑对齐，无空盒容器包围 */
    .arena {
      position: relative;
      height: 740px;
      margin-top: 10px;
      display: grid;
      grid-template-columns: 380px 1fr 420px;
      gap: 30px;
      align-items: stretch;
    }

    /* 待归位对象栏 */
    .col-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .col-head {
      font-size: var(--fs-h2);
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
    }
    .probe-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .probe-btn {
      background: transparent;
      border: 0;
      padding: 10px 14px;
      text-align: left;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all var(--motion-fast);
      position: relative;
    }
    .probe-btn:hover {
      background: rgba(23, 98, 142, 0.05);
    }
    .probe-btn.active {
      background: rgba(184, 61, 11, 0.06);
      outline: 2px solid var(--focus);
    }
    .probe-btn.settled {
      background: rgba(23, 98, 142, 0.04);
    }
    .probe-name {
      font-size: var(--fs-lead);
      font-weight: 700;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .probe-badge {
      font-size: var(--fs-sec);
      color: var(--model);
      font-weight: 600;
    }
    .probe-desc {
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: var(--lh-copy);
      margin-top: 3px;
    }

    /* 中间 SVG 矢量关系汇聚区 */
    .canvas-wrap {
      position: relative;
      width: 100%;
      height: 100%;
    }
    svg.link-canvas {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 右侧体例目标与裁量判读栏 */
    .col-right {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .tier-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tier-btn {
      background: transparent;
      border: 0;
      border-left: var(--stroke) solid var(--rule);
      padding: 8px 14px;
      text-align: left;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all var(--motion-fast);
    }
    .tier-btn:hover {
      border-left-color: var(--model);
    }
    .tier-btn.match-flash {
      border-left-color: var(--model);
      border-left-width: var(--stroke-strong);
    }
    .tier-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .tier-name {
      font-size: var(--fs-lead);
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--text);
    }
    .tier-count {
      font-size: var(--fs-tick);
      color: var(--model);
    }
    .tier-func {
      font-size: var(--fs-sec);
      color: var(--muted);
      margin-top: 2px;
      line-height: var(--lh-copy);
    }
    .tier-dock {
      margin-top: 5px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .dock-tag {
      font-size: var(--fs-tick);
      color: var(--model);
      background: rgba(23, 98, 142, 0.1);
      padding: 1px 6px;
      font-weight: 700;
    }

    /* 裁量判决展台 */
    .verdict-box {
      border-top: 1px solid var(--rule);
      padding-top: 14px;
      min-height: 140px;
    }
    .verdict-title {
      font-size: var(--fs-h2);
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .verdict-text {
      font-size: var(--fs-body);
      line-height: var(--lh-copy);
      color: var(--text);
      margin-top: 6px;
    }
    .verdict-sub {
      font-size: var(--fs-sec);
      color: var(--muted);
      line-height: var(--lh-copy);
      margin-top: 6px;
    }

    /* 底部控制 */
    .btn-reset {
      background: transparent;
      border: 1px solid var(--rule);
      color: var(--muted);
      font-size: var(--fs-label);
      padding: 6px 14px;
      cursor: pointer;
      align-self: flex-start;
      margin-top: 8px;
      transition: all var(--motion-fast);
    }
    .btn-reset:hover {
      color: var(--text);
      border-color: var(--model);
    }
    .btn-reset:focus-visible, .probe-btn:focus-visible, .tier-btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
  </style>
</head>
<body data-page="04" data-total="18">
  <div id="stage">
    <header>
      <h1>五体脉络拆解：依史法与叙事功能归位</h1>
      <div class="metrics">
        <span>已归位史料<b id="statPlaced">0 / 5</b></span>
        <span>史法判例<b id="statVerdict">探寻中</b></span>
      </div>
    </header>

    <div class="arena">
      <!-- 左列：待探寻史料 -->
      <section class="col-left" aria-label="探针史料">
        <div>
          <div class="col-head">选择历史对象</div>
          <div class="probe-stack" id="probeStack"></div>
        </div>
        <button class="btn-reset" id="btnReset">重置归位推演</button>
      </section>

      <!-- 中列：关系墨线动态连接 -->
      <div class="canvas-wrap" aria-hidden="true">
        <svg class="link-canvas" id="linkCanvas">
          <g id="settledLines"></g>
          <path id="activeLine" fill="none" stroke="var(--focus)" stroke-width="2" stroke-dasharray="4 4"></path>
        </svg>
      </div>

      <!-- 右列：五体承载架构与史法裁决 -->
      <section class="col-right" aria-label="史记五体">
        <div>
          <div class="col-head">定位体例与叙事功能</div>
          <div class="tier-stack" id="tierStack"></div>
        </div>

        <div class="verdict-box" aria-live="polite">
          <div class="verdict-title" id="verdictTitle">项羽：无天子之号何以入本纪？</div>
          <div class="verdict-text" id="verdictText">请在左侧选定对象后，点击右侧对应体例探寻司马迁的史学裁量。</div>
          <div class="verdict-sub" id="verdictSub">“本纪网罗天下放失旧闻，王迹所兴，原始察终。”</div>
        </div>
      </section>
    </div>
  </div>

  <aside class="notes" hidden>
    《史记》打破了编年体单一的时间轴，开创五体纪传结构。五体并非互不相干的名册，而是相互咬合、互见互补的制度与生命网络。
    让学生通过探针人物的落位，发现司马迁不是以名位、而是以实际历史功能与权柄归属定体裁：项羽虽无天子号却主盟天下，故入本纪；孔子以匹夫立儒家道统、垂宪百世，故入世家。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (() => {
      "use strict";

      const PROBES = [
        {
          id: "xiangyu",
          name: "项羽",
          tag: "西楚霸王",
          clue: "灭秦分封十八诸侯，政由己出，无帝王之名而有天下实权。",
          target: "benji",
          reason: "虽无天子实号，但分封诸侯、政由己出五年，实际主宰天下大政，故太史公破格列入《本纪》。",
          sub: "“政由羽出，号为霸王，位虽不终，近古以来未尝有也。”"
        },
        {
          id: "kongzi",
          name: "孔子",
          tag: "至圣先师",
          clue: "无尺土封疆，传道授徒门下三千，修《春秋》垂宪后世。",
          target: "shijia",
          reason: "布衣学者本应入《列传》，但其创立道统世袭百代，天下言六艺者皆折中于夫子，故升格入《世家》。",
          sub: "“自天子王侯，中国言六艺者折中于夫子，可谓至圣矣！”"
        },
        {
          id: "pingzhun",
          name: "平准物价",
          tag: "财经典章",
          clue: "桑弘羊推行均输平准、盐铁官营，调剂国用抑制兼并。",
          target: "shu",
          reason: "阐述国家经济命脉、食货流通与律历祭祀等制度运转，汇入八大专门制度史《书》之《平准书》。",
          sub: "“礼乐损益，律历改易，兵权山川鬼神，天人之际，作八书。”"
        },
        {
          id: "liuguo",
          name: "六国年表",
          tag: "时空谱系",
          clue: "周室衰微诸侯角逐，年纪错杂纷乱，横列并行以察兴亡。",
          target: "biao",
          reason: "以表格形式并置诸国世系谱牒，统摄纷繁时空坐标，直观呈现兼并盛衰脉络，列入《十表》。",
          sub: "“旁行斜上，并时而记，用见盛衰之迹，作十表。”"
        },
        {
          id: "cike",
          name: "刺客曹沫荆轲",
          tag: "侠烈独立",
          clue: "立节慷慨，士为知己者死，不以胜败论是非。",
          target: "liezhuan",
          reason: "记录社会各阶层人格气节与浮生百态，以类传合聚，构成七十篇《列传》之《刺客列传》。",
          sub: "“此其义或成或不成，然其立意较然，名垂后世，作七十列传。”"
        }
      ];

      const TIERS = [
        { id: "benji", name: "本纪", count: "十二篇", func: "天子通史与大一统权柄总纲" },
        { id: "biao", name: "表", count: "十篇", func: "纵横时空谱系与并行大事记" },
        { id: "shu", name: "书", count: "八篇", func: "国家典章制度与社会经济运转" },
        { id: "shijia", name: "世家", count: "三十篇", func: "诸侯封建藩屏与世袭宗师基石" },
        { id: "liezhuan", name: "列传", count: "七十篇", func: "天下众生百相与各阶层精神图谱" }
      ];

      let state = {
        activeProbe: "xiangyu",
        placements: {} // probeId -> tierId
      };

      const $probeStack = document.getElementById("probeStack");
      const $tierStack = document.getElementById("tierStack");
      const $settledLines = document.getElementById("settledLines");
      const $activeLine = document.getElementById("activeLine");
      const $verdictTitle = document.getElementById("verdictTitle");
      const $verdictText = document.getElementById("verdictText");
      const $verdictSub = document.getElementById("verdictSub");
      const $statPlaced = document.getElementById("statPlaced");
      const $statVerdict = document.getElementById("statVerdict");
      const $btnReset = document.getElementById("btnReset");

      function updateMetrics() {
        const count = Object.keys(state.placements).length;
        $statPlaced.textContent = `${count} / ${PROBES.length}`;
        if (count === PROBES.length) {
          $statVerdict.textContent = "五体融通";
          $statVerdict.style.color = "var(--focus)";
        } else if (count > 0) {
          $statVerdict.textContent = "辨析精审";
          $statVerdict.style.color = "var(--model)";
        } else {
          $statVerdict.textContent = "探寻中";
          $statVerdict.style.color = "var(--text)";
        }
      }

      function getTierName(id) {
        const t = TIERS.find(item => item.id === id);
        return t ? t.name : "";
      }

      function selectProbe(id) {
        state.activeProbe = id;
        renderProbes();
        updateLines();

        const probe = PROBES.find(p => p.id === id);
        if (state.placements[id]) {
          $verdictTitle.innerHTML = `<span style="color:var(--model)">✓ ${probe.name} 已入《${getTierName(state.placements[id])}》</span>`;
          $verdictText.textContent = probe.reason;
          $verdictSub.textContent = probe.sub;
        } else {
          $verdictTitle.textContent = `${probe.name}：探寻其史学叙事功能`;
          $verdictText.textContent = `${probe.clue} 请点击右侧体例建立史法连接。`;
          $verdictSub.textContent = "提示：司马迁不唯虚名，重在裁量其对历史全局的实际功用。";
        }
      }

      function placeToTier(tierId) {
        if (!state.activeProbe) return;
        const probe = PROBES.find(p => p.id === state.activeProbe);
        if (!probe) return;

        if (probe.target === tierId) {
          state.placements[probe.id] = tierId;
          $verdictTitle.innerHTML = `<span style="color:var(--model)">✓ 史法归位：${probe.name} →《${getTierName(tierId)}》</span>`;
          $verdictText.textContent = probe.reason;
          $verdictSub.textContent = probe.sub;

          const next = PROBES.find(p => !state.placements[p.id]);
          if (next) {
            state.activeProbe = next.id;
          }
        } else {
          const tier = TIERS.find(t => t.id === tierId);
          let diff = `未能归入《${tier.name}》。`;
          if (probe.id === "xiangyu" && tierId === "shijia") {
            diff += "项羽虽号霸王，但分封诸侯、政由己出五年，实际掌控天下命运，列入《世家》便轻视其主宰力。";
          } else if (probe.id === "kongzi" && tierId === "liezhuan") {
            diff += "孔子虽是布衣，但其言行教化历代遵从、垂范百世，功同世袭名邦，故超拔入《世家》。";
          } else {
            diff += `请对照《${tier.name}》的叙事职能（${tier.func}）与历史对象的实际功用。`;
          }
          $verdictTitle.innerHTML = `<span style="color:var(--focus)">✕ 史法偏差：未归入《${tier.name}》</span>`;
          $verdictText.textContent = diff;
          $verdictSub.textContent = `线索：${probe.clue}`;
        }

        renderProbes();
        renderTiers();
        updateMetrics();
        updateLines();
      }

      function renderProbes() {
        $probeStack.innerHTML = "";
        PROBES.forEach(p => {
          const btn = document.createElement("button");
          btn.id = `probe-${p.id}`;
          btn.className = `probe-btn ${state.activeProbe === p.id ? "active" : ""} ${state.placements[p.id] ? "settled" : ""}`;
          btn.setAttribute("aria-label", `${p.name}，${p.tag}`);
          btn.innerHTML = `
            <div class="probe-name">
              <span>${p.name}</span>
              <span class="probe-badge">${state.placements[p.id] ? "已归位 · " + getTierName(state.placements[p.id]) : p.tag}</span>
            </div>
            <div class="probe-desc">${p.clue}</div>
          `;
          btn.onclick = () => selectProbe(p.id);
          $probeStack.appendChild(btn);
        });
      }

      function renderTiers() {
        $tierStack.innerHTML = "";
        TIERS.forEach(t => {
          const btn = document.createElement("button");
          btn.id = `tier-${t.id}`;
          btn.className = "tier-btn";
          btn.setAttribute("aria-label", `${t.name}，${t.count}，${t.func}`);

          const settled = PROBES.filter(p => state.placements[p.id] === t.id);
          const settledTags = settled.map(s => `<span class="dock-tag">${s.name}</span>`).join("");

          btn.innerHTML = `
            <div class="tier-head">
              <span class="tier-name">《${t.name}》</span>
              <span class="tier-count">${t.count}</span>
            </div>
            <div class="tier-func">${t.func}</div>
            <div class="tier-dock">${settledTags}</div>
          `;
          btn.onclick = () => placeToTier(t.id);
          $tierStack.appendChild(btn);
        });
      }

      function updateLines() {
        const svgBox = document.getElementById("linkCanvas").getBoundingClientRect();
        if (!svgBox.width || !svgBox.height) return;

        // 绘制所有已归位的墨线
        let pathsHtml = "";
        Object.entries(state.placements).forEach(([probeId, tierId]) => {
          const pEl = document.getElementById(`probe-${probeId}`);
          const tEl = document.getElementById(`tier-${tierId}`);
          if (!pEl || !tEl) return;
          const pRect = pEl.getBoundingClientRect();
          const tRect = tEl.getBoundingClientRect();

          const x1 = 0;
          const y1 = (pRect.top + pRect.height / 2) - svgBox.top;
          const x2 = svgBox.width;
          const y2 = (tRect.top + tRect.height / 2) - svgBox.top;

          const cx1 = x1 + (x2 - x1) * 0.5;
          const cx2 = x1 + (x2 - x1) * 0.5;
          pathsHtml += `<path d="M ${x1} ${y1} C ${cx1} ${y1}, ${cx2} ${y2}, ${x2} ${y2}" fill="none" stroke="var(--model)" stroke-width="2.5" />`;
        });
        $settledLines.innerHTML = pathsHtml;

        // 活动指示线
        const activeProbeEl = document.getElementById(`probe-${state.activeProbe}`);
        if (activeProbeEl) {
          const pRect = activeProbeEl.getBoundingClientRect();
          const x1 = 0;
          const y1 = (pRect.top + pRect.height / 2) - svgBox.top;
          const x2 = 80;
          $activeLine.setAttribute("d", `M ${x1} ${y1} L ${x2} ${y1}`);
        } else {
          $activeLine.setAttribute("d", "");
        }
      }

      function reset() {
        state.placements = {};
        state.activeProbe = PROBES[0].id;
        renderProbes();
        renderTiers();
        selectProbe(PROBES[0].id);
        updateMetrics();
        updateLines();
      }

      $btnReset.onclick = reset;

      renderProbes();
      renderTiers();
      selectProbe(PROBES[0].id);
      updateMetrics();

      window.addEventListener("resize", updateLines);
      setTimeout(updateLines, 200);

      Deck.init({ index: 4, total: 18, keys: false });
    })();
  </script>
</body>
</html>
