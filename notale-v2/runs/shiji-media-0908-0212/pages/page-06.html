<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--text);
      font-family: var(--font-sans);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 14px;
    }

    h1 {
      font-size: var(--fs-h1);
      font-family: var(--font-display);
      line-height: var(--lh-tight);
      margin: 0;
      letter-spacing: -0.02em;
    }

    .tagline {
      font-size: var(--fs-sec);
      color: var(--muted);
      margin: 0;
    }

    .flow-view {
      position: relative;
      height: 480px;
      margin-top: 10px;
    }

    svg#flow-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .axis-line {
      stroke: var(--rule);
      stroke-width: var(--stroke);
      stroke-dasharray: 4 4;
    }

    .main-track {
      stroke: var(--model);
      stroke-width: var(--stroke-strong);
      fill: none;
    }

    .node-rect {
      fill: var(--bg);
      stroke: var(--model);
      stroke-width: var(--stroke);
      rx: 2px;
      ry: 2px;
      transition: stroke var(--motion-fast), fill var(--motion-fast);
      cursor: pointer;
    }

    .node-rect:hover, .node-rect.active {
      stroke: var(--focus);
      stroke-width: var(--stroke-strong);
    }

    .node-title {
      font-family: var(--font-display);
      font-size: var(--fs-body);
      fill: var(--text);
      font-weight: 600;
      text-anchor: middle;
      pointer-events: none;
    }

    .node-sub {
      font-size: var(--fs-tick);
      fill: var(--text);
      text-anchor: middle;
      pointer-events: none;
    }

    .stage-badge {
      font-size: var(--fs-label);
      font-weight: 700;
      fill: var(--text);
    }

    footer.inspection {
      display: grid;
      grid-template-columns: 360px 1fr auto;
      gap: 32px;
      align-items: center;
      border-top: 1px solid var(--rule);
      padding-top: 16px;
      min-height: 80px;
    }

    .era-name {
      font-size: var(--fs-h2);
      font-family: var(--font-display);
      color: var(--focus);
      margin: 0 0 4px 0;
    }

    .era-scope {
      font-size: var(--fs-sec);
      color: var(--text);
      margin: 0;
    }

    .era-desc {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      margin: 0;
      color: var(--text);
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-step {
      background: none;
      border: 1px solid var(--rule);
      color: var(--text);
      padding: 8px 16px;
      font-size: var(--fs-sec);
      font-family: var(--font-sans);
      cursor: pointer;
      border-radius: 2px;
      transition: all var(--motion-fast);
    }

    .btn-step:hover {
      border-color: var(--model);
      color: var(--model);
    }

    .btn-step.active {
      background: var(--model);
      color: var(--bg);
      border-color: var(--model);
    }
  </style>
</head>
<body data-page="06" data-total="18">
  <div id="stage">
    <header>
      <h1>本纪的叙事脉络：通史统摄下的权力演进</h1>
      <p class="tagline">十二篇贯通三千年政体</p>
    </header>

    <div class="flow-view min0">
      <svg id="flow-svg" viewBox="0 0 1488 480">
        <!-- 轴线背景与分期标签 -->
        <g id="grid-lanes">
          <line x1="40" y1="120" x2="1448" y2="120" class="axis-line" />
          <line x1="40" y1="280" x2="1448" y2="280" class="axis-line" />

          <!-- 四个演化阶段标志 -->
          <text x="175" y="45" class="stage-badge">禅让联盟</text>
          <text x="535" y="45" class="stage-badge">宗法封建</text>
          <text x="910" y="45" class="stage-badge">集权变局</text>
          <text x="1300" y="45" class="stage-badge">汉制大成</text>
        </g>

        <!-- 连贯的主干路径 -->
        <path d="M 175 160 L 375 160 L 535 200 L 695 200 L 830 320 L 990 320 L 1150 240 L 1390 240" class="main-track" />

        <!-- 节点定义 -->
        <g class="node-group" data-idx="0" transform="translate(100, 110)">
          <rect class="node-rect active" width="150" height="100" />
          <text x="75" y="42" class="node-title">五帝本纪</text>
          <text x="75" y="70" class="node-sub">黄帝至舜·禅让推戴</text>
        </g>

        <g class="node-group" data-idx="1" transform="translate(300, 110)">
          <rect class="node-rect" width="150" height="100" />
          <text x="75" y="42" class="node-title">夏·殷本纪</text>
          <text x="75" y="70" class="node-sub">禹启传子·世袭确立</text>
        </g>
        <g class="node-group" data-idx="1" transform="translate(480, 150)">
          <rect class="node-rect" width="150" height="100" />
          <text x="75" y="42" class="node-title">周本纪</text>
          <text x="75" y="70" class="node-sub">文武受命·礼乐封建</text>
        </g>

        <g class="node-group" data-idx="2" transform="translate(670, 150)">
          <rect class="node-rect" width="150" height="100" />
          <text x="75" y="42" class="node-title">秦本纪</text>
          <text x="75" y="70" class="node-sub">西陲崛起·兼并六国</text>
        </g>
        <g class="node-group" data-idx="2" transform="translate(850, 270)">
          <rect class="node-rect" width="150" height="100" />
          <text x="75" y="42" class="node-title">秦始皇本纪</text>
          <text x="75" y="70" class="node-sub">废分封·行郡县集权</text>
        </g>
        <g class="node-group" data-idx="2" transform="translate(1030, 270)">
          <rect class="node-rect" width="150" height="100" />
          <text x="75" y="42" class="node-title">项羽本纪</text>
          <text x="75" y="70" class="node-sub">政由羽出·实权统摄</text>
        </g>

        <g class="node-group" data-idx="3" transform="translate(1210, 190)">
          <rect class="node-rect" width="200" height="100" />
          <text x="100" y="42" class="node-title">高祖·文景·武帝</text>
          <text x="100" y="70" class="node-sub">布衣取天下·帝国定型</text>
        </g>
      </svg>
    </div>

    <footer class="inspection">
      <div>
        <h2 class="era-name" id="info-title">五帝时代：禅让天下</h2>
        <p class="era-scope" id="info-meta">五帝本纪 · 部族推戴共主</p>
      </div>
      <div>
        <p class="era-desc" id="info-desc">以黄帝为共祖，经尧舜禅让，确立以德配位的伦理基石。</p>
      </div>
      <div class="nav-buttons">
        <button class="btn-step active" data-step="0">禅让</button>
        <button class="btn-step" data-step="1">三代</button>
        <button class="btn-step" data-step="2">秦楚变局</button>
        <button class="btn-step" data-step="3">汉室定鼎</button>
      </div>
    </footer>
  </div>

  <aside class="notes" hidden>
    《史记》的本纪并非帝王家谱，而是司马迁构建通史全局的经线。十二本纪按年代编排，统摄全书纪年。
    从五帝的德治禅让，到夏商周三代的家天下与宗法礼乐，再到秦并天下建立郡县集权，以及项羽无帝号而主宰天下入本纪，最后到汉高祖布衣起兵、武帝极盛，展现了中国古代政治合法性与国家形态演进的全景。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      "use strict";

      const stages = [
        {
          title: "五帝时代：禅让天下",
          meta: "五帝本纪 · 部族推戴共主",
          desc: "以黄帝为共祖，经尧舜禅让，确立以德配位的伦理基石。"
        },
        {
          title: "三代演进：家天下",
          meta: "夏殷周本纪 · 宗法世袭",
          desc: "禹启开世袭，周制礼乐，以宗法维系天命归属。"
        },
        {
          title: "秦楚变局：集权突变",
          meta: "秦纪与项羽 · 实权统摄",
          desc: "秦废分封行郡县；项羽政由羽出列入本纪，确立实权统摄标尺。"
        },
        {
          title: "汉室定鼎：大一统",
          meta: "高祖至武帝 · 帝国定型",
          desc: "汉高祖布衣取天下，至武帝完成大一统中央帝国定型。"
        }
      ];

      const nodes = document.querySelectorAll(".node-group");
      const buttons = document.querySelectorAll(".btn-step");
      const titleEl = document.getElementById("info-title");
      const metaEl = document.getElementById("info-meta");
      const descEl = document.getElementById("info-desc");

      function setStage(idx) {
        const data = stages[idx];
        titleEl.textContent = data.title;
        metaEl.textContent = data.meta;
        descEl.textContent = data.desc;

        buttons.forEach((b, i) => {
          b.classList.toggle("active", i === idx);
        });

        nodes.forEach(n => {
          const rect = n.querySelector(".node-rect");
          const nIdx = parseInt(n.getAttribute("data-idx"), 10);
          rect.classList.toggle("active", nIdx === idx);
        });
      }

      buttons.forEach((btn, idx) => {
        btn.addEventListener("click", () => setStage(idx));
      });

      nodes.forEach(n => {
        n.addEventListener("click", () => {
          const idx = parseInt(n.getAttribute("data-idx"), 10);
          setStage(idx);
        });
      });

      Deck.init({ index: 6, total: 18 });
    })();
  </script>
</body>
</html>
