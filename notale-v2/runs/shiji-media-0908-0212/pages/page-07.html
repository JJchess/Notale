<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: var(--pad-y) var(--pad-x);
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: var(--stroke) solid var(--rule);
      padding-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-family: var(--font-display);
      font-weight: normal;
      letter-spacing: -0.02em;
    }

    .principle {
      font-size: var(--fs-lead);
      color: var(--model);
      font-weight: 500;
    }

    /* 左右对照视区 */
    .matrix-stage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      margin-top: 24px;
      margin-bottom: 24px;
    }

    .case-col {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .person-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: var(--stroke) solid var(--rule);
      padding-bottom: 8px;
    }

    .person-name {
      font-size: var(--fs-h2);
      font-family: var(--font-display);
      color: var(--text);
    }

    .person-verdict {
      font-size: var(--fs-label);
      color: var(--focus);
    }

    /* 矢量图解区 */
    .diagram-panel {
      position: relative;
      height: 270px;
      width: 100%;
    }

    /* 史家实录批判 */
    .record-critique {
      border-left: var(--stroke-strong) solid var(--model);
      padding-left: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .critique-head {
      font-size: var(--fs-label);
      color: var(--model);
      font-weight: 500;
    }

    .critique-body {
      font-size: var(--fs-sec);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
    }

    /* 底部汇聚 */
    footer {
      border-top: var(--stroke-strong) solid var(--model);
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .conclusion-text {
      font-size: var(--fs-lead);
      font-family: var(--font-display);
      color: var(--text);
    }

    .source-note {
      font-size: var(--fs-sec);
      color: var(--muted);
    }
  </style>
</head>
<body data-page="07" data-total="18">
  <div id="stage">
    <header>
      <h1>名实辨析：项羽与吕后入本纪</h1>
      <span class="principle">以“实权”统摄通史编年</span>
    </header>

    <div class="matrix-stage">
      <!-- 项羽本纪 -->
      <div class="case-col">
        <div class="person-header">
          <span class="person-name">项羽本纪</span>
          <span class="person-verdict">无帝号 · 握主权</span>
        </div>

        <div class="diagram-panel">
          <svg viewBox="0 0 712 270" class="cv-fill">
            <!-- 虚名 -->
            <rect x="0" y="16" width="326" height="96" fill="none" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="4 4" />
            <text x="20" y="48" fill="var(--muted)" font-size="15" font-family="var(--font-sans)">礼制名分（虚）</text>
            <text x="20" y="82" fill="var(--text)" font-size="18" font-family="var(--font-sans)">西楚霸王 · 未称天子</text>

            <!-- 实权 -->
            <rect x="366" y="16" width="326" height="96" fill="none" stroke="var(--model)" stroke-width="2" />
            <text x="386" y="48" fill="var(--model)" font-size="15" font-family="var(--font-sans)">天下权柄（实）</text>
            <text x="386" y="82" fill="var(--text)" font-size="18" font-family="var(--font-sans)">分封诸侯 · 号令自出</text>

            <!-- 汇聚到编年统摄线 -->
            <path d="M 529 112 L 529 154 L 356 184" fill="none" stroke="var(--model)" stroke-width="2" />
            <path d="M 163 112 L 163 154 L 356 184" fill="none" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="3 3" />
            
            <!-- 史家决断枢纽 -->
            <rect x="186" y="184" width="340" height="68" fill="none" stroke="var(--model)" stroke-width="4" />
            <text x="356" y="215" fill="var(--text)" font-size="16" font-family="var(--font-display)" text-anchor="middle">统摄秦汉之际五年大政编年</text>
            <text x="356" y="238" fill="var(--focus)" font-size="15" font-family="var(--font-sans)" text-anchor="middle">决断：不立义帝，列入本纪</text>
          </svg>
        </div>

        <div class="record-critique">
          <span class="critique-head">不虚美，不隐恶</span>
          <p class="critique-body">载灭秦霸业，亦直斥身死之谬。</p>
        </div>
      </div>

      <!-- 吕太后本纪 -->
      <div class="case-col">
        <div class="person-header">
          <span class="person-name">吕太后本纪</span>
          <span class="person-verdict">非皇帝 · 握朝制</span>
        </div>

        <div class="diagram-panel">
          <svg viewBox="0 0 712 270" class="cv-fill">
            <!-- 虚名 -->
            <rect x="0" y="16" width="326" height="96" fill="none" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="4 4" />
            <text x="20" y="48" fill="var(--muted)" font-size="15" font-family="var(--font-sans)">礼制名分（虚）</text>
            <text x="20" y="82" fill="var(--text)" font-size="18" font-family="var(--font-sans)">宫闱太后 · 幼主在位</text>

            <!-- 实权 -->
            <rect x="366" y="16" width="326" height="96" fill="none" stroke="var(--model)" stroke-width="2" />
            <text x="386" y="48" fill="var(--model)" font-size="15" font-family="var(--font-sans)">天下权柄（实）</text>
            <text x="386" y="82" fill="var(--text)" font-size="18" font-family="var(--font-sans)">临朝称制 · 政不出房户</text>

            <!-- 汇聚到编年统摄线 -->
            <path d="M 529 112 L 529 154 L 356 184" fill="none" stroke="var(--model)" stroke-width="2" />
            <path d="M 163 112 L 163 154 L 356 184" fill="none" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="3 3" />

            <!-- 史家决断枢纽 -->
            <rect x="186" y="184" width="340" height="68" fill="none" stroke="var(--model)" stroke-width="4" />
            <text x="356" y="215" fill="var(--text)" font-size="16" font-family="var(--font-display)" text-anchor="middle">统摄惠帝至文帝间天下政事</text>
            <text x="356" y="238" fill="var(--focus)" font-size="15" font-family="var(--font-sans)" text-anchor="middle">决断：不立少帝，以吕后系年</text>
          </svg>
        </div>

        <div class="record-critique">
          <span class="critique-head">不虚美，不隐恶</span>
          <p class="critique-body">记诸吕残暴，亦直书晏然之治。</p>
        </div>
      </div>
    </div>

    <footer>
      <div class="conclusion-text">太史公以“实录”破“虚名”：主宰大政者即系通史之枢</div>
      <div class="source-note">《汉书》评司马迁：“不虚美，不隐恶”</div>
    </footer>
  </div>

  <aside class="notes" hidden>
    本页剖析《史记·十二本纪》中最具创见的名实之辨。
    项羽无帝王虚名，但灭秦后分封诸侯、号令自出，主宰天下达五年之久；吕后虽非天子，但临朝称制八年，政不出房户而天下晏然。司马迁打破传统礼名拘束，依据实权归属统摄通史编年，生动体现了“不虚美、不隐恶”的实录精神。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    Deck.init({ index: 7, total: 18, keys: false });
  </script>
</body>
</html>
