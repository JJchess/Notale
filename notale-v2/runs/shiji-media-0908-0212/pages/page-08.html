<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>诸侯、勋戚与时代基石：三十世家与十表</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      position: relative;
      box-sizing: border-box;
      padding: var(--pad-y) var(--pad-x);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-family: var(--font-sans);
      user-select: none;
    }

    /* 坐标与骨架层（十表经纬） */
    .grid-matrix {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* 主标题区块：安静标题场 */
    .header-zone {
      position: absolute;
      top: 64px;
      left: 72px;
      width: 620px;
      z-index: 10;
    }

    .chapter-tag {
      font-size: var(--fs-label);
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    .main-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
      letter-spacing: -0.01em;
      color: var(--text);
      margin: 0 0 16px 0;
    }

    .main-title span {
      display: block;
      color: var(--model);
      font-size: var(--fs-h2);
      margin-top: 10px;
      font-weight: 500;
    }

    .lead-text {
      font-size: var(--fs-lead);
      line-height: var(--lh-copy);
      color: var(--muted);
      margin: 0;
      max-width: 520px;
    }

    /* 右侧基石阵列与时空脉络图解 */
    .foundation-stage {
      position: absolute;
      top: 56px;
      right: 72px;
      width: 780px;
      height: 788px;
      z-index: 5;
    }

    /* 底部特征标注 */
    .meta-bar {
      position: absolute;
      bottom: 48px;
      left: 72px;
      z-index: 10;
      display: flex;
      gap: 36px;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meta-num {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: 1;
      color: var(--model);
      font-weight: 600;
    }

    .meta-label {
      font-size: var(--fs-label);
      color: var(--text);
      letter-spacing: 0.02em;
    }

    /* 讲稿与无障碍文本 */
    .notes { display: none; }
  </style>
</head>
<body data-page="08" data-total="18">
  <main id="stage">
    <!-- 经纬与表格脉络背景 SVG -->
    <svg class="grid-matrix" width="1600" height="900" viewBox="0 0 1600 900" fill="none" aria-hidden="true">
      <!-- 横向编年标尺 -->
      <g stroke="#71828B" stroke-opacity="0.22" stroke-width="1">
        <line x1="72" y1="280" x2="1528" y2="280" />
        <line x1="72" y1="410" x2="1528" y2="410" />
        <line x1="72" y1="540" x2="1528" y2="540" />
        <line x1="72" y1="670" x2="1528" y2="670" />
      </g>
      <!-- 经度标尺纵线 -->
      <g stroke="#71828B" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 4">
        <line x1="720" y1="56" x2="720" y2="844" />
        <line x1="970" y1="56" x2="970" y2="844" />
        <line x1="1220" y1="56" x2="1220" y2="844" />
        <line x1="1470" y1="56" x2="1470" y2="844" />
      </g>
    </svg>

    <!-- 标题与导引 -->
    <header class="header-zone">
      <div class="chapter-tag">史记体例架构 · 承重经纬</div>
      <h1 class="main-title">
        诸侯、勋戚与时代基石
        <span>三十世家与十表</span>
      </h1>
      <p class="lead-text">
        以十表整饬三千年纷繁年表，以三十世家系联家国兴替与制度沉浮。
      </p>
    </header>

    <!-- 主视觉：世家与十表构筑的骨架经纬 -->
    <div class="foundation-stage" id="foundation-view" aria-label="三十世家与十表结构图">
      <svg width="780" height="788" viewBox="0 0 780 788" fill="none">
        <!-- 时代断代坐标轴头 -->
        <g fill="var(--text)" font-size="13" font-family="var(--font-sans)">
          <text x="60" y="32">西周·分封</text>
          <text x="310" y="32">春秋战国·争霸</text>
          <text x="560" y="32">秦汉之交·立业</text>
        </g>

        <!-- 骨干主脉络线：汇聚与分支 -->
        <g stroke="var(--model)" stroke-linecap="round">
          <!-- 历史主干网 -->
          <path d="M 60,70 L 60,690" stroke-width="2" stroke-opacity="0.35" />
          <path d="M 310,70 L 310,690" stroke-width="2" stroke-opacity="0.35" />
          <path d="M 560,70 L 560,690" stroke-width="2" stroke-opacity="0.35" />

          <!-- 横向时空表谱关联束（十表经线） -->
          <path d="M 60,160 C 180,160 200,210 310,210" stroke-width="2" stroke-opacity="0.5" />
          <path d="M 60,330 C 180,330 200,300 310,300" stroke-width="2" stroke-opacity="0.5" />
          <path d="M 310,210 C 430,210 450,180 560,180" stroke-width="2" stroke-opacity="0.6" />
          <path d="M 310,460 C 420,460 450,510 560,510" stroke-width="2" stroke-opacity="0.6" />
          <path d="M 60,500 C 180,500 200,460 310,460" stroke-width="2" stroke-opacity="0.5" />

          <!-- 汉初勋戚汇聚强线（示集成与筑基） -->
          <path d="M 310,300 C 430,300 460,350 560,350" stroke-width="4" />
        </g>

        <!-- 世家关键节点与锚定结构 -->
        <!-- 西周开国 -->
        <g transform="translate(60, 160)">
          <rect x="-42" y="-18" width="84" height="36" rx="4" fill="#E8EEF1" stroke="var(--model)" stroke-width="2" />
          <text x="0" y="5" text-anchor="middle" font-size="15" font-weight="500" fill="var(--text)">周公世家</text>
        </g>
        <g transform="translate(60, 330)">
          <rect x="-42" y="-18" width="84" height="36" rx="4" fill="#E8EEF1" stroke="var(--model)" stroke-width="2" />
          <text x="0" y="5" text-anchor="middle" font-size="15" font-weight="500" fill="var(--text)">齐太公</text>
        </g>
        <g transform="translate(60, 500)">
          <rect x="-42" y="-18" width="84" height="36" rx="4" fill="#E8EEF1" stroke="var(--model)" stroke-width="2" />
          <text x="0" y="5" text-anchor="middle" font-size="15" font-weight="500" fill="var(--text)">鲁周公</text>
        </g>

        <!-- 春秋战国列国与非侯入世家 -->
        <g transform="translate(310, 210)">
          <rect x="-42" y="-18" width="84" height="36" rx="4" fill="#E8EEF1" stroke="var(--model)" stroke-width="2" />
          <text x="0" y="5" text-anchor="middle" font-size="15" font-weight="500" fill="var(--text)">晋世家</text>
        </g>
        <g transform="translate(310, 300)">
          <rect x="-42" y="-18" width="84" height="36" rx="4" fill="#E8EEF1" stroke="var(--model)" stroke-width="2" />
          <text x="0" y="5" text-anchor="middle" font-size="15" font-weight="500" fill="var(--text)">楚世家</text>
        </g>
        <g transform="translate(310, 460)">
          <!-- 唯一锐利强调：孔子世家（素王布衣入世家） -->
          <rect x="-46" y="-20" width="92" height="40" rx="4" fill="#E8EEF1" stroke="var(--focus)" stroke-width="3" />
          <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="600" fill="var(--focus)">孔子世家</text>
        </g>

        <!-- 秦汉勋戚与起首基石 -->
        <g transform="translate(560, 180)">
          <rect x="-46" y="-20" width="92" height="40" rx="4" fill="#E8EEF1" stroke="var(--focus)" stroke-width="3" />
          <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="600" fill="var(--focus)">陈涉世家</text>
        </g>
        <g transform="translate(560, 350)">
          <rect x="-46" y="-18" width="92" height="36" rx="4" fill="#E8EEF1" stroke="var(--model)" stroke-width="2.5" />
          <text x="0" y="5" text-anchor="middle" font-size="15" font-weight="500" fill="var(--text)">萧相国世家</text>
        </g>
        <g transform="translate(560, 510)">
          <rect x="-46" y="-18" width="92" height="36" rx="4" fill="#E8EEF1" stroke="var(--model)" stroke-width="2" />
          <text x="0" y="5" text-anchor="middle" font-size="15" font-weight="500" fill="var(--text)">留侯世家</text>
        </g>

        <!-- 十表谱系纵横经纬标示 -->
        <g fill="none" stroke="var(--rule)" stroke-width="1.5">
          <!-- 象征“十表”的时空网格标尺节点 -->
          <line x1="60" y1="620" x2="680" y2="620" />
          <line x1="60" y1="655" x2="680" y2="655" stroke-dasharray="2 3" />
        </g>
        <text x="60" y="643" font-size="13" fill="var(--text)">三代世表 · 十二诸侯年表 · 六国年表 · 秦楚之际月表 · 汉兴诸侯表</text>

        <!-- 聚光汇合注记 -->
        <g transform="translate(620, 350)">
          <line x1="0" y1="0" x2="60" y2="0" stroke="var(--model)" stroke-width="2" />
          <circle cx="60" cy="0" r="3" fill="var(--model)" />
          <text x="70" y="5" font-size="13" fill="var(--model)" font-weight="500">辅佐立国之基</text>
        </g>
      </svg>
    </div>

    <!-- 底部数据指标卡 -->
    <div class="meta-bar">
      <div class="meta-item">
        <div class="meta-num">30</div>
        <div class="meta-label">三十世家 · 诸侯立国基石</div>
      </div>
      <div class="meta-item">
        <div class="meta-num">10</div>
        <div class="meta-label">十表 · 织络三千年编年经纬</div>
      </div>
      <div class="meta-item">
        <div class="meta-num">2</div>
        <div class="meta-label">破格特立 · 孔子素王与陈涉发难</div>
      </div>
    </div>
  </main>

  <!-- 教师讲稿（仅供讲授参考，不上画面） -->
  <aside class="notes" hidden>
    这一章我们将聚焦《史记》极为核心的两大体例：三十世家与十表。
    司马迁以“本纪”提纲挈领，但真正承托起整个历史大厦、展现三千年制度演进与地缘变迁的，正是“世家”与“表”。
    十表构建了宏大的时空坐标系，理清错综复杂的线索；而三十世家则记录了诸侯国的兴衰、汉初功臣勋戚的起伏，以及孔子、陈涉两位“不据天子之位却系天下之命”的破格入选。
  </aside>
