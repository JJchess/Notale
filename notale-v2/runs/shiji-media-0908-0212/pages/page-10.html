<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: var(--pad-y) var(--pad-x);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--text);
      font-family: var(--font-sans);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: var(--stroke) solid var(--rule);
      padding-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      line-height: var(--lh-tight);
    }

    .table-tabs {
      display: flex;
      gap: 12px;
    }

    .table-btn {
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--text);
      padding: 6px 14px;
      font-size: var(--fs-label);
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all var(--motion-fast) var(--ease-out);
    }

    .table-btn[aria-pressed="true"] {
      background: var(--model);
      color: #fff;
      border-color: var(--model);
    }

    .table-btn:focus-visible, .time-node:focus-visible, .grid-cell:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 260px 1fr 320px;
      gap: 32px;
      height: 700px;
      margin-top: 14px;
      align-items: stretch;
    }

    /* 栏1：时间切片 */
    .time-col {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--rule);
      padding-right: 20px;
    }

    .sec-title {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      margin: 0 0 16px 0;
      color: var(--text);
    }

    .time-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .time-node {
      border: 1px solid var(--rule);
      background: transparent;
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all var(--motion-fast) var(--ease-out);
    }

    .time-node:hover {
      border-color: var(--model);
    }

    .time-node.active {
      border-color: var(--focus);
      background: rgba(184, 61, 11, 0.06);
    }

    .time-year {
      font-weight: bold;
      font-size: var(--fs-body);
      color: var(--text);
    }

    .time-node.active .time-year {
      color: var(--focus);
    }

    .time-desc {
      font-size: var(--fs-label);
      color: var(--text);
      line-height: var(--lh-tight);
    }

    /* 栏2：坐标矩阵 */
    .matrix-col {
      display: flex;
      flex-direction: column;
    }

    .matrix-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .matrix-desc {
      font-size: var(--fs-sec);
      color: var(--text);
    }

    .grid-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--rule);
    }

    .grid-header {
      display: grid;
      grid-template-columns: 100px repeat(4, 1fr);
      border-bottom: var(--stroke) solid var(--rule);
      font-size: var(--fs-label);
      font-weight: bold;
      text-align: center;
      padding: 10px 0;
      background: rgba(20, 38, 48, 0.04);
    }

    .grid-body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .grid-row {
      display: grid;
      grid-template-columns: 100px repeat(4, 1fr);
      flex: 1;
      border-bottom: 1px dashed var(--rule);
      align-items: center;
    }

    .grid-row:last-child {
      border-bottom: none;
    }

    .grid-row.active {
      background: rgba(23, 98, 142, 0.06);
    }

    .grid-cell-year {
      font-size: var(--fs-sec);
      color: var(--text);
      font-weight: bold;
      text-align: center;
      border-right: 1px solid var(--rule);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grid-row.active .grid-cell-year {
      color: var(--focus);
      background: rgba(184, 61, 11, 0.06);
    }

    .grid-cell {
      padding: 10px 12px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px dashed var(--rule);
      font-size: var(--fs-sec);
      line-height: var(--lh-tight);
      cursor: pointer;
      transition: all var(--motion-fast) var(--ease-out);
    }

    .grid-cell:last-child {
      border-right: none;
    }

    .grid-cell:hover {
      background: rgba(23, 98, 142, 0.12);
    }

    .grid-cell.highlight {
      background: var(--model);
      color: #fff;
    }

    .grid-cell.highlight .cell-title,
    .grid-cell.highlight .cell-sub {
      color: #fff;
    }

    .cell-title {
      font-weight: bold;
      color: var(--text);
      font-size: var(--fs-sec);
    }

    .cell-sub {
      color: var(--text);
      font-size: var(--fs-label);
      margin-top: 3px;
    }

    /* 栏3：结论与机制 */
    .detail-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-left: 1px solid var(--rule);
      padding-left: 20px;
    }

    .detail-card {
      border: 1px solid var(--rule);
      padding: 16px;
    }

    .detail-badge {
      display: inline-block;
      padding: 2px 8px;
      background: var(--model);
      color: #fff;
      font-size: var(--fs-label);
      margin-bottom: 10px;
      font-weight: bold;
    }

    .detail-year {
      font-size: var(--fs-h2);
      font-family: var(--font-display);
      margin: 0 0 8px 0;
      color: var(--focus);
    }

    .detail-headline {
      font-size: var(--fs-lead);
      font-weight: bold;
      margin-bottom: 10px;
      line-height: var(--lh-tight);
    }

    .detail-body {
      font-size: var(--fs-sec);
      line-height: var(--lh-copy);
      color: var(--text);
      margin: 0;
    }

    .rule-box {
      border: var(--stroke) solid var(--model);
      padding: 14px;
    }

    .rule-title {
      font-weight: bold;
      font-size: var(--fs-label);
      color: var(--model);
      margin-bottom: 6px;
    }

    .rule-text {
      font-size: var(--fs-sec);
      line-height: var(--lh-copy);
      margin: 0;
      color: var(--text);
    }
  </style>
</head>
<body data-page="10" data-total="18">

    <header>
      <h1>十表：时空坐标系理清分封与兴替</h1>

      </nav>

        <div class="time-list" id="time-nodes" role="tablist"></div>
      </section>

      <!-- 栏2：纵横网格坐标矩阵 -->
      <section class="matrix-col min0">
        <div class="matrix-meta">
          <span class="matrix-desc" id="matrix-subtitle">横排诸国 · 纵列编年</span>
          <span class="matrix-desc" id="matrix-count">4 实体谱系对齐</span>
        </div>
        <div class="grid-container" role="grid" aria-label="十表时空坐标矩阵">
          <div class="grid-header" id="grid-header"></div>

        </div>
      </section>

      <!-- 栏3：多维互证与立表体例 -->
      <section class="detail-col min0">
        <div class="detail-card">
          <span class="detail-badge" id="card-tag">横向互见机制</span>

        </div>

        <div class="rule-box">
          <div class="rule-title">史记谱系体例：以表统篇</div>
          <p class="rule-text" id="rule-desc">十表横排诸侯与列侯位次，纵列严格纪年，解决多国纪年错乱与同名异事死结。</p>
        </div>
      </section>
    </div>
  </div>

  <aside class="notes" hidden>
    同学们，我们来看《史记》十表。司马迁为什么要在本纪世家之外开辟十表？
    面对战国七雄并立各自纪年、汉初功臣受封析产的错综关系，单线叙事极易割裂。
    十表建立时空坐标系：横排国别爵位，纵列严格编年。
    点击年份切片即可比对同一年里各方势力的同步反应。
  </aside>

            label: "文帝初年 / 功臣解甲",
            hlCol: 2,
            headline: "周勃下狱与功臣世系变迁",
            detail: "周勃就国被诬下狱。十表如实录西汉功臣后代犯法绝国，百四十余侯至武帝仅存二三。",
            grid: [
              { year: "文帝二年", cells: [{t:"延传子",s:"传嗣不息"}, {t:"留侯代立",s:"谨守家规"}, {t:"避位绛县",s:"每畏祸被甲"}, {t:"——",s:"——"}] },
              { year: "文帝三年", cells: [{t:"谨守国法",s:"安保家国"}, {t:"犯法削爵",s:"留国除籍"}, {t:"被诬谋反",s:"下狱后释"}, {t:"——",s:"——"}] },
              { year: "文帝五年", cells: [{t:"世袭侯位",s:"安享尊荣"}, {t:"——",s:"国除为民"}, {t:"周勃卒",s:"文帝厚恤"}, {t:"——",s:"——"}] },
              { year: "景帝三年", cells: [{t:"佐平叛",s:"守安关中"}, {t:"流散草野",s:"后嗣微贱"}, {t:"周亚夫拔",s:"平七国乱"}, {t:"——",s:"——"}] },
              { year: "武帝元光", cells: [{t:"求后复封",s:"绍绝世功"}, {t:"再封后裔",s:"求良曾孙"}, {t:"亚夫绝食",s:"条侯除国"}, {t:"——",s:"——"}] }
            ]
          }
        ]
      }
    };

    let currentTable = 'zg';
    let currentSliceIdx = 1;

    function renderUI() {
      const tData = DATA[currentTable];

      document.querySelectorAll('.table-btn').forEach(btn => {
        btn.setAttribute('aria-pressed', btn.dataset.tid === currentTable ? 'true' : 'false');
      });

      const timeListEl = document.getElementById('time-nodes');
      timeListEl.innerHTML = '';
      tData.slices.forEach((s, idx) => {
        const item = document.createElement('button');
        item.className = 'time-node' + (idx === currentSliceIdx ? ' active' : '');
        item.setAttribute('role', 'tab');
        item.setAttribute('aria-selected', idx === currentSliceIdx ? 'true' : 'false');
        item.innerHTML = `<span class="time-year">${s.year}</span><span class="time-desc">${s.label}</span>`;
        item.onclick = () => {
          currentSliceIdx = idx;
          renderUI();
        };
        timeListEl.appendChild(item);
      });

      document.getElementById('matrix-subtitle').textContent = currentTable === 'zg' ? '横排诸国 · 纵列编年' : '横排列侯 · 纵列代际';
      document.getElementById('matrix-count').textContent = `${tData.cols.length} 实体谱系对齐`;

      const gridHeaderEl = document.getElementById('grid-header');
      gridHeaderEl.innerHTML = '<div>年份纪年</div>' + tData.cols.map(c => `<div>${c}</div>`).join('');

      const gridBodyEl = document.getElementById('grid-body');
      gridBodyEl.innerHTML = '';
      const activeSlice = tData.slices[currentSliceIdx];

      activeSlice.grid.forEach((row, rIdx) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'grid-row' + (row.year.includes(activeSlice.year.replace(/[前年]/g, '')) || rIdx === 2 ? ' active' : '');
        
        let cellsHtml = `<div class="grid-cell-year">${row.year}</div>`;
        row.cells.forEach((cell, cIdx) => {
          const isHl = (cIdx === activeSlice.hlCol && (rowEl.classList.contains('active') || rIdx === 2));
          cellsHtml += `
            <div class="grid-cell ${isHl ? 'highlight' : ''}" data-col="${cIdx}" data-row="${rIdx}" tabindex="0" role="gridcell">
              <span class="cell-title">${cell.t}</span>
              <span class="cell-sub">${cell.s}</span>
            </div>
          `;
        });
        rowEl.innerHTML = cellsHtml;
        gridBodyEl.appendChild(rowEl);
      });

      gridBodyEl.querySelectorAll('.grid-cell').forEach(cell => {
        const updateDetail = () => {
          const cIdx = parseInt(cell.dataset.col);
          const rIdx = parseInt(cell.dataset.row);
          const rowData = activeSlice.grid[rIdx];
          const colName = tData.cols[cIdx];
          const cellData = rowData.cells[cIdx];

          document.getElementById('card-tag').textContent = `坐标选中 · ${colName}`;
          document.getElementById('card-year').textContent = `${rowData.year} · ${colName}`;
          document.getElementById('card-headline').textContent = `${cellData.t}：${cellData.s}`;
          document.getElementById('card-body').textContent = `十表中${rowData.year}年${colName}动向与诸方同时比照，读者可全局把握因果，避免单篇割裂。`;
        };
        cell.onclick = updateDetail;
        cell.onkeydown = (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            updateDetail();
          }
        };
      });

      document.getElementById('card-tag').textContent = currentTable === 'zg' ? '横向互见机制' : '功臣表位次考';
      document.getElementById('card-year').textContent = activeSlice.year;
      document.getElementById('card-headline').textContent = activeSlice.headline;
      document.getElementById('card-body').textContent = activeSlice.detail;
      document.getElementById('rule-desc').textContent = tData.rule;
    }

    document.querySelectorAll('.table-btn').forEach(btn => {
      btn.onclick = () => {
        if (currentTable !== btn.dataset.tid) {
          currentTable = btn.dataset.tid;
          currentSliceIdx = 0;
          renderUI();
        }
      };
    });

    window.addEventListener('keydown', (e) => {
      const maxIdx = DATA[currentTable].slices.length - 1;
      if (e.key === 'ArrowDown') {
        if (currentSliceIdx < maxIdx) {
          currentSliceIdx++;
          renderUI();
        }
      } else if (e.key === 'ArrowUp') {
        if (currentSliceIdx > 0) {
          currentSliceIdx--;
          renderUI();
        }
      }
    });

    renderUI();
    Deck.init({ index: 10, total: 18, keys: false });
  </script>
</body>
</html>
