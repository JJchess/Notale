<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: var(--pad-y) var(--pad-x);
      color: var(--text);
      font-family: var(--font-sans);
      background-color: var(--bg);
      user-select: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 14px;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: var(--fs-h1);
      font-weight: 600;
      letter-spacing: 0.04em;
      margin: 0;
    }
    .total-badge {
      font-family: var(--font-serif);
      font-size: var(--fs-sec);
      color: var(--record);
      letter-spacing: 0.06em;
    }

    /* 主可视化视区：Canvas 绘制汉简编联与互文经纬 */
    .system-canvas-wrap {
      position: relative;
      width: 100%;
      height: 570px;
      margin-top: 14px;
    }
    #systemCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* 底部判语与体例定论 */
    footer.inspector {
      border-top: 1px solid var(--rule);
      padding-top: 14px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 40px;
      align-items: center;
      min-height: 86px;
    }
    .thesis-quote {
      font-family: var(--font-kai);
      font-size: var(--fs-lead);
      color: var(--record);
      line-height: 1.5;
      border-left: 2px solid var(--focus);
      padding-left: 14px;
    }
    .inspector-detail {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .inspector-title {
      font-family: var(--font-serif);
      font-size: var(--fs-h2);
      color: var(--focus);
      font-weight: 600;
    }
    .inspector-desc {
      font-size: var(--fs-body);
      line-height: 1.5;
      color: var(--text);
    }
  </style>
</head>
<body data-page="03" data-total="15">
  <div id="stage">
    <header>
      <h1>五体架构：究天人之际的系统史观</h1>
      <div class="total-badge">一百三十篇 · 五十二万六千五百字</div>
    </header>

    <div class="system-canvas-wrap">
      <canvas id="systemCanvas"></canvas>
    </div>

    <footer class="inspector">
      <div class="thesis-quote">
        “网罗天下放失旧闻，略推事象，综其终始，稽其成败兴坏之纪。”
      </div>
      <div class="inspector-detail">
        <div class="inspector-title" id="inspectorTitle">十二本纪：总揽帝王之迹与政柄转移</div>
        <div class="inspector-desc" id="inspectorDesc">
          以编年总括天下大势。司马迁破格将未即帝位的项羽列入本纪，以政由羽出尊其大位，事实重于名分。
        </div>
      </div>
    </footer>
  </div>

  <aside class="notes" hidden>
    《史记》创制了纪传体通史的五大体例。
    本纪以编年统御宏观治乱与时代更替；
    表以矩阵图表整理繁杂的时序与诸侯世系；
    书是制度与专门领域的演进史，涵盖经济、天文、礼乐水利；
    世家记录代代相传的封国贵族与孔子、陈涉等开创先河者；
    列传则展开形形色色的社会众生相。
    五者经纬交织，构成一个有机立体的人类历史全息模型。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (function () {
      const CATEGORIES = [
        {
          id: "benji",
          name: "本纪",
          count: 12,
          role: "编年纲领，提挈王朝兴废与天下共主大政",
          title: "十二本纪：总揽帝王之迹与政柄转移",
          desc: "以编年总括天下大势。司马迁破格将未即帝位的项羽列入本纪，以政由羽出尊其大位，事实重于名分。"
        },
        {
          id: "biao",
          name: "表",
          count: 10,
          role: "谱列时序，以横纵坐标统理世系交错并列",
          title: "十表：横纵坐标理清三千年纷繁世系",
          desc: "司马迁首创表格谱系。以横行排年、纵栏列国，使世系交错、主从同异一目了然，成后世图谱典范。"
        },
        {
          id: "shu",
          name: "书",
          count: 8,
          role: "制度专史，究考礼乐历律与河渠平准之变",
          title: "八书：典章制度与经济科技之专门史",
          desc: "探究社会运转之器用。河渠平准首开水利经济专论，律历天官究天文物理，非独述政事人事。"
        },
        {
          id: "shijia",
          name: "世家",
          count: 30,
          role: "藩国梁柱，载诸侯勋贵与思想宗师相承之绪",
          title: "三十世家：邦国兴替与开宗立派之砥柱",
          desc: "记载世代相承之诸侯。破格将布衣孔子、戍卒陈涉列为世家，取其万世师表与首倡天下之重。"
        },
        {
          id: "liezhuan",
          name: "列传",
          count: 70,
          role: "百态众生，刻画贤能义烈与社会群像底色",
          title: "七十列传：多元社会群像与独立人格精神",
          desc: "占全书半数以上。文相武将之外，游侠刺客滑稽货殖各得其立，刻画汉以前社会众生之生命光芒。"
        }
      ];

      const canvas = document.getElementById('systemCanvas');
      const titleEl = document.getElementById('inspectorTitle');
      const descEl = document.getElementById('inspectorDesc');

      let selectedIndex = 0;
      let hoveredIndex = -1;

      const colors = {
        bg: '#181715',
        text: '#EDEBE6',
        muted: '#96928A',
        rule: '#35322D',
        focus: '#DC3826',
        record: '#C99E5C'
      };

      function updateUI() {
        const item = CATEGORIES[selectedIndex];
        titleEl.textContent = item.title;
        descEl.textContent = item.desc;
      }

      function draw(ctx, width, height) {
        ctx.clearRect(0, 0, width, height);

        const cols = CATEGORIES.length;
        const colGap = 28;
        const totalGap = colGap * (cols - 1);
        const colWidth = (width - totalGap) / cols;

        CATEGORIES.forEach((cat, i) => {
          const x = i * (colWidth + colGap);
          const isSelected = i === selectedIndex;
          const isHovered = i === hoveredIndex;

          // 顶部栏线与朱砂高亮
          ctx.beginPath();
          ctx.moveTo(x, 2);
          ctx.lineTo(x + colWidth, 2);
          ctx.lineWidth = isSelected ? 3 : 1.5;
          ctx.strokeStyle = isSelected ? colors.focus : (isHovered ? colors.record : colors.rule);
          ctx.stroke();

          // 类别标题与卷数
          ctx.fillStyle = isSelected ? colors.text : (isHovered ? colors.text : colors.muted);
          ctx.font = '600 22px "Noto Serif CJK SC", serif';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillText(cat.name, x, 16);

          ctx.fillStyle = colors.record;
          ctx.font = '600 16px "Noto Serif CJK SC", serif';
          ctx.textAlign = 'right';
          ctx.fillText(cat.count + '卷', x + colWidth, 20);

          // 体例职能简述
          ctx.fillStyle = isSelected ? colors.text : colors.muted;
          ctx.font = '16px "Noto Sans CJK SC", sans-serif';
          ctx.textAlign = 'left';
          
          // 折行渲染
          const roleWords = cat.role;
          const firstLine = roleWords.slice(0, 10);
          const secondLine = roleWords.slice(10);
          ctx.fillText(firstLine, x, 52);
          if (secondLine) {
            ctx.fillText(secondLine, x, 76);
          }

          // 汉简编联竹木条块与朱墨刻度
          const slipStartY = 118;
          const slipAreaHeight = 440;
          
          // 画两根水平简策编绳（贯穿各简）
          const cordY1 = slipStartY + 80;
          const cordY2 = slipStartY + slipAreaHeight - 80;
          
          ctx.beginPath();
          ctx.moveTo(x - 10, cordY1);
          ctx.lineTo(x + colWidth + 10, cordY1);
          ctx.moveTo(x - 10, cordY2);
          ctx.lineTo(x + colWidth + 10, cordY2);
          ctx.lineWidth = 1;
          ctx.strokeStyle = 'rgba(53, 50, 45, 0.45)';
          ctx.stroke();

          // 依据卷数生成简条
          // 列传70卷以35条绘制（每条代表2卷）以保证间距与典雅视觉
          const barCount = cat.count === 70 ? 35 : cat.count;
          const slipWidth = Math.min(18, (colWidth - (barCount - 1) * 3) / barCount);
          const totalSlipsW = barCount * slipWidth + (barCount - 1) * 3;
          const startSlipX = x + (colWidth - totalSlipsW) / 2;

          for (let b = 0; b < barCount; b++) {
            const bx = startSlipX + b * (slipWidth + 3);
            
            // 简策主体
            ctx.fillStyle = isSelected ? (b % 4 === 0 ? colors.record : 'rgba(201, 158, 92, 0.55)') 
                                       : 'rgba(53, 50, 45, 0.65)';
            ctx.fillRect(bx, slipStartY, slipWidth, slipAreaHeight);

            // 朱砂点勘（仅在选中体例中出现重要标引）
            if (isSelected && (b === 0 || b % 5 === 0)) {
              ctx.fillStyle = colors.focus;
              ctx.fillRect(bx, slipStartY + 30 + (b * 11) % (slipAreaHeight - 120), slipWidth, 8);
            }
          }
        });
      }

      const autofit = Deck.autofit(canvas, draw);

      canvas.addEventListener('mousemove', (e) => {
        const pt = Deck.pt(canvas, e);
        const colGap = 28;
        const totalGap = colGap * 4;
        const colWidth = (1488 - totalGap) / 5;
        const idx = Math.floor(pt.x / (colWidth + colGap));
        if (idx >= 0 && idx < 5) {
          if (hoveredIndex !== idx) {
            hoveredIndex = idx;
            autofit.redraw();
          }
        } else if (hoveredIndex !== -1) {
          hoveredIndex = -1;
          autofit.redraw();
        }
      });

      canvas.addEventListener('mouseleave', () => {
        if (hoveredIndex !== -1) {
          hoveredIndex = -1;
          autofit.redraw();
        }
      });

      canvas.addEventListener('click', (e) => {
        const pt = Deck.pt(canvas, e);
        const colGap = 28;
        const totalGap = colGap * 4;
        const colWidth = (1488 - totalGap) / 5;
        const idx = Math.floor(pt.x / (colWidth + colGap));
        if (idx >= 0 && idx < 5 && idx !== selectedIndex) {
          selectedIndex = idx;
          updateUI();
          autofit.redraw();
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') {
          selectedIndex = (selectedIndex + 1) % 5;
          updateUI();
          autofit.redraw();
        } else if (e.key === 'ArrowLeft') {
          selectedIndex = (selectedIndex + 4) % 5;
          updateUI();
          autofit.redraw();
        }
      });

      Deck.init({ index: 3, total: 15, keys: false });
    })();
  </script>
</body>
</html>
