<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: 40px var(--pad-x);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--text);
      font-family: var(--font-sans);
    }

    /* 顶部 */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 14px;
    }
    .header-row h1 {
      margin: 0;
      font-family: var(--font-serif);
      font-size: var(--fs-h1);
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .kicker {
      font-family: var(--font-kai);
      font-size: var(--fs-label);
      color: var(--record);
    }

    /* 主网格：高度调谐为 680px，防止触碰上下安全边距 */
    .main-grid {
      display: grid;
      grid-template-columns: 460px 1px 1fr;
      gap: 40px;
      align-items: stretch;
      height: 680px;
      padding-top: 10px;
    }

    /* 左栏：案卷与词眼 */
    .probe-col {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 28px;
    }
    .case-nav {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .case-btn {
      background: none;
      border: 1px solid var(--rule);
      color: var(--muted);
      font-family: var(--font-serif);
      font-size: var(--fs-sec);
      padding: 10px 8px;
      cursor: pointer;
      text-align: center;
      transition: all var(--duration-base) var(--ease-out-standard);
    }
    .case-btn:hover {
      border-color: var(--muted);
      color: var(--text);
    }
    .case-btn.active {
      border-color: var(--focus);
      color: var(--text);
    }

    .passage-box {
      border-left: 2px solid var(--record);
      padding: 14px 0 14px 18px;
    }
    .passage-text {
      font-family: var(--font-kai);
      font-size: var(--fs-lead);
      line-height: var(--lh-body);
      color: var(--text);
      margin: 0;
    }
    .passage-text mark {
      background: none;
      color: inherit;
      padding: 0 2px;
      transition: color var(--duration-base);
    }
    .passage-text mark.active-word {
      color: var(--focus);
      border-bottom: 2px solid var(--focus);
    }

    .word-tokens {
      display: flex;
      gap: 10px;
    }
    .word-chip {
      flex: 1;
      background: none;
      border: 1px solid var(--rule);
      color: var(--muted);
      font-size: var(--fs-sec);
      padding: 10px 6px;
      cursor: pointer;
      font-family: var(--font-serif);
      text-align: center;
      transition: all var(--duration-base) var(--ease-out-standard);
    }
    .word-chip:hover {
      border-color: var(--muted);
      color: var(--text);
    }
    .word-chip.selected {
      border-color: var(--focus);
      color: var(--text);
      background: rgba(220, 56, 38, 0.08);
    }

    /* 中轴尺 */
    .vertical-rule {
      background: var(--rule);
      height: 100%;
      position: relative;
    }
    .rule-notch {
      position: absolute;
      left: -3px;
      width: 7px;
      height: 1px;
      background: var(--muted);
    }

    /* 右栏：天平与辨析 */
    .analysis-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    /* 褒贬刻度仪 */
    .gauge-wrapper {
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 20px;
    }
    .gauge-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .gauge-title {
      font-size: var(--fs-label);
      color: var(--muted);
    }
    .gauge-metric {
      font-family: var(--font-serif);
      font-size: var(--fs-h2);
      color: var(--focus);
    }
    .metric-val {
      font-weight: 700;
      margin-left: 6px;
    }

    /* 天平轨道 */
    .scale-bar-track {
      position: relative;
      height: 48px;
      background: #141312;
      border: 1px solid var(--rule);
      display: flex;
      align-items: center;
    }
    .scale-center-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--rule);
    }
    .scale-pointer {
      position: absolute;
      top: 4px;
      bottom: 4px;
      width: 4px;
      background: var(--focus);
      left: 50%;
      transform: translateX(-50%);
      transition: left 220ms var(--ease-out-standard);
    }
    .scale-label-neg {
      position: absolute;
      left: 18px;
      font-size: var(--fs-tick);
      color: var(--muted);
      font-family: var(--font-kai);
    }
    .scale-label-pos {
      position: absolute;
      right: 18px;
      font-size: var(--fs-tick);
      color: var(--muted);
      font-family: var(--font-kai);
    }

    /* 证据两列 */
    .evidence-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }
    .evidence-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ev-caption {
      font-size: var(--fs-label);
      color: var(--record);
      font-family: var(--font-serif);
      border-bottom: 1px solid var(--rule);
      padding-bottom: 8px;
    }
    .ev-body {
      font-size: var(--fs-body);
      line-height: var(--lh-body);
      color: var(--text);
      margin: 0;
    }

    /* 评语底栏 */
    .verdict-bar {
      border-top: 1px solid var(--rule);
      padding-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .verdict-summary {
      font-family: var(--font-kai);
      font-size: var(--fs-body);
      color: var(--text);
    }
    .verdict-summary span {
      color: var(--record);
    }
    .btn-contrast {
      background: none;
      border: 1px solid var(--muted);
      color: var(--text);
      font-size: var(--fs-tick);
      padding: 6px 16px;
      cursor: pointer;
      transition: all var(--duration-base);
    }
    .btn-contrast:hover {
      border-color: var(--focus);
      color: var(--focus);
    }
  </style>
</head>
<body data-page="14" data-total="15">
  <div id="stage">
    <!-- 页首 -->
    <header class="header-row">
      <h1>春秋微言与史笔抑扬</h1>
      <div class="kicker">字省而意弘 · 不虚美不隐恶</div>
    </header>

    <!-- 主交互区 -->
    <main class="main-grid">
      <!-- 左栏 -->
      <section class="probe-col">
        <div class="case-nav" role="tablist">
          <button class="case-btn active" data-case="0" role="tab" id="btn-case-0">项羽本纪</button>
          <button class="case-btn" data-case="1" role="tab" id="btn-case-1">高祖本纪</button>
          <button class="case-btn" data-case="2" role="tab" id="btn-case-2">李将军列传</button>
        </div>

        <div class="passage-box">
          <p class="passage-text" id="passage-el"></p>
        </div>

        <div class="word-tokens" id="tokens-el" role="radiogroup"></div>
      </section>

      <!-- 中轴尺 -->
      <div class="vertical-rule" aria-hidden="true">
        <div class="rule-notch" style="top: 25%"></div>
        <div class="rule-notch" style="top: 50%"></div>
        <div class="rule-notch" style="top: 75%"></div>
      </div>

      <!-- 右栏 -->
      <section class="analysis-col">
        <!-- 褒贬刻度 -->
        <div class="gauge-wrapper">
          <div class="gauge-header">
            <span class="gauge-title">史笔倾向测度</span>
            <span class="gauge-metric">
              <span id="gauge-label">抑其败亡</span>
              <span class="metric-val" id="gauge-score">-35</span>
            </span>
          </div>

          <div class="scale-bar-track" aria-label="褒贬天平">
            <span class="scale-label-neg">严贬 / 隐讥</span>
            <div class="scale-center-line"></div>
            <div class="scale-pointer" id="pointer-el"></div>
            <span class="scale-label-pos">盛褒 / 寄慨</span>
          </div>
        </div>

        <!-- 解构 -->
        <div class="evidence-cards">
          <div class="evidence-block">
            <div class="ev-caption">详略笔法机制</div>
            <p class="ev-body" id="mechanism-el"></p>
          </div>
          <div class="evidence-block">
            <div class="ev-caption">微言意旨</div>
            <p class="ev-body" id="intent-el"></p>
          </div>
        </div>

        <!-- 总结 -->
        <div class="verdict-bar">
          <div class="verdict-summary">
            太史公衡评：<span id="verdict-el"></span>
          </div>
          <button class="btn-contrast" id="next-case-btn">研析下一卷</button>
        </div>
      </section>
    </main>
  </div>

  <aside class="notes" hidden>
    本页呈现司马迁“春秋微言”的核心叙事策略。
    史公褒贬往往不直接下断语，而是寄寓于体例位阶、详略取舍与词字抑扬之中。
    学生可以通过切换“项羽”、“高祖”、“李广”三个经典案卷，点按文本中的关键词眼，
    直观观察天平上“严贬隐讥”与“盛褒寄慨”的平衡转移，体会不虚美、不隐恶的史笔真义。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (() => {
      const CASES = [
        {
          title: "项羽本纪",
          rawText: "政由羽出，号为霸王，位虽不终，近古以来未尝有也。",
          words: [
            {
              id: "w1",
              token: "位虽不终",
              score: -35,
              label: "抑其败亡",
              mech: "不掩垓下覆灭与自刎之实，直书其无帝王之终，非天亡我也。",
              intent: "讥其恃力矜功、奋私智而不师古，卒至身死东城。",
              verdict: "虽列帝王本纪以录其实，终不宽其弃德力征之失。"
            },
            {
              id: "w2",
              token: "政由羽出",
              score: 75,
              label: "重其首功",
              mech: "详纪巨鹿破釜沉舟、诸侯膝行，一人决断天下大势。",
              intent: "承认其三年并率诸侯灭暴秦之伟绩，突破成王败寇。",
              verdict: "不以成败论英雄，虽无帝号而享天子之实。"
            },
            {
              id: "w3",
              token: "近古未尝有",
              score: 85,
              label: "盛赞崛兴",
              mech: "以五年崛起之速比周召，行文雄健，倾注慨叹之情。",
              intent: "赞其拔山盖世气概，深寄史家同情与悲剧敬意。",
              verdict: "太史公之叹，实寄己身愤激之慨与英雄之惜。"
            }
          ]
        },
        {
          title: "高祖本纪",
          rawText: "好酒及色。常从王媪、武负贳酒，醉卧，见其上常有龙。",
          words: [
            {
              id: "w1",
              token: "好酒及色",
              score: -60,
              label: "直录陋行",
              mech: "开国帝王传首，直书市井恶癖，不加任何尊圣讳饰。",
              intent: "以不虚美之笔削去神圣光环，还原狡黠任侠本质。",
              verdict: "史臣不事逢迎，虽当朝皇祖，亦存其市井真容。"
            },
            {
              id: "w2",
              token: "从媪负贳酒",
              score: -20,
              label: "隐写机变",
              mech: "详写赊酒欠账细民琐事，与鸿门脱身、分杯羹互证。",
              intent: "显其长于结纳三教九流、隐忍机变，为其得天下之基。",
              verdict: "抑其威仪，扬其实际机变能力，笔法深沉。"
            },
            {
              id: "w3",
              token: "上有龙",
              score: 40,
              label: "存异顺叙",
              mech: "平白顺叙民间神异，紧接折券弃债，语含谐谑。",
              intent: "顺应受命之运，同时以市井谐趣消解绝对神圣感。",
              verdict: "寓真识于传闻，两存实录与神化，游刃有余。"
            }
          ]
        },
        {
          title: "李将军列传",
          rawText: "广讷口少言，其射见敌急。程不识曰：广军极简易，然虏卒犯之不可击。",
          words: [
            {
              id: "w1",
              token: "讷口少言",
              score: 70,
              label: "尊其笃诚",
              mech: "特笔描摹木讷治军、与士同甘苦，士以此爱乐为用。",
              intent: "以桃李不言之品格，反衬当朝谄谀竞进之士。",
              verdict: "极力铺陈其忠义淳笃，寄托孤忠难诉之哀情。"
            },
            {
              id: "w2",
              token: "其射见敌急",
              score: 50,
              label: "赞其绝艺",
              mech: "详写数十步内不射之险绝身手与勇武英雄本色。",
              intent: "刻画名将个人绝艺，同时暗示其偏近独行游侠。",
              verdict: "褒其绝技勇力，不虚美其统军全局，功过判然。"
            },
            {
              id: "w3",
              token: "程不识对比",
              score: -45,
              label: "冷峻互文",
              mech: "特设程不识严谨治军作对笔，指出李广部伍简易之失。",
              intent: "指出数奇不偶不仅关乎天命，亦因治军有短。",
              verdict: "同情与严峻史笔并立，无韵离骚中见冷峻考量。"
            }
          ]
        }
      ];

      let currentCaseIdx = 0;
      let currentWordIdx = 0;

      const passageEl = document.getElementById("passage-el");
      const tokensEl = document.getElementById("tokens-el");
      const gaugeLabel = document.getElementById("gauge-label");
      const gaugeScore = document.getElementById("gauge-score");
      const pointerEl = document.getElementById("pointer-el");
      const mechanismEl = document.getElementById("mechanism-el");
      const intentEl = document.getElementById("intent-el");
      const verdictEl = document.getElementById("verdict-el");
      const nextCaseBtn = document.getElementById("next-case-btn");

      function updateView() {
        const c = CASES[currentCaseIdx];
        const w = c.words[currentWordIdx];

        for (let i = 0; i < 3; i++) {
          const btn = document.getElementById(`btn-case-${i}`);
          if (btn) {
            btn.classList.toggle("active", i === currentCaseIdx);
            btn.setAttribute("aria-selected", String(i === currentCaseIdx));
          }
        }

        let renderedText = c.rawText;
        c.words.forEach((item, idx) => {
          if (item.token === "程不识对比") return;
          const isCurr = (idx === currentWordIdx);
          const regex = new RegExp(item.token, "g");
          renderedText = renderedText.replace(
            regex,
            `<mark class="${isCurr ? 'active-word' : ''}">${item.token}</mark>`
          );
        });
        passageEl.innerHTML = renderedText;

        tokensEl.innerHTML = "";
        c.words.forEach((item, idx) => {
          const chip = document.createElement("button");
          chip.className = `word-chip ${idx === currentWordIdx ? 'selected' : ''}`;
          chip.setAttribute("role", "radio");
          chip.setAttribute("aria-checked", String(idx === currentWordIdx));
          chip.textContent = item.token;
          chip.addEventListener("click", () => {
            currentWordIdx = idx;
            updateView();
          });
          tokensEl.appendChild(chip);
        });

        const leftPercent = 50 + (w.score / 100) * 44;
        pointerEl.style.left = `${leftPercent}%`;
        gaugeScore.textContent = (w.score > 0 ? `+${w.score}` : `${w.score}`);
        gaugeLabel.textContent = w.label;

        mechanismEl.textContent = w.mech;
        intentEl.textContent = w.intent;
        verdictEl.textContent = w.verdict;
      }

      document.querySelectorAll(".case-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = parseInt(btn.dataset.case, 10);
          if (idx !== currentCaseIdx) {
            currentCaseIdx = idx;
            currentWordIdx = 0;
            updateView();
          }
        });
      });

      nextCaseBtn.addEventListener("click", () => {
        currentCaseIdx = (currentCaseIdx + 1) % CASES.length;
        currentWordIdx = 0;
        updateView();
      });

      Deck.init({ index: 14, total: 15, keys: true });
      updateView();
    })();
  </script>
</body>
</html>
