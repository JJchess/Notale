<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="01" data-total="19">
<div id="stage">
  <style>
    #stage{position:relative;overflow:hidden}
    .p01-head{flex:0 0 126px;max-width:1370px}
    .p01-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.18em;color:var(--accent);margin:4px 0 16px}
    .p01-head h1{margin:0;max-width:1320px;font:700 var(--fs-h1)/1.28 var(--font-sans);color:var(--text)}
    .p01-main{flex:1;min-height:0;display:flex;align-items:stretch;gap:42px}
    .p01-sky{position:relative;flex:0 0 1010px;min-width:0;min-height:0;overflow:hidden}
    .p01-sky svg{display:block;width:100%;height:100%}
    .p01-side{flex:1;min-width:0;display:flex;flex-direction:column;padding-top:118px}
    .p01-claim{border-left:3px solid var(--accent);padding:2px 0 4px 25px;max-width:360px}
    .p01-claim .label{font:600 var(--fs-label)/1.4 var(--font-sans);color:var(--accent);margin-bottom:10px}
    .p01-claim p{margin:0;font:600 var(--fs-lead)/1.55 var(--font-sans);color:var(--text)}
    .p01-next{margin-top:auto;margin-bottom:18px;max-width:370px;padding-top:18px;border-top:1px solid var(--line);font:400 var(--fs-sec)/1.45 var(--font-sans);color:var(--star)}
    .p01-next strong{display:block;margin-top:7px;font:600 var(--fs-body)/1.4 var(--font-sans);color:var(--text)}
    .p01-svg-label{font-family:var(--font-sans);font-size:18px;font-weight:600}
  </style>

  <header class="p01-head">
    <div class="p01-kicker">START HERE</div>
    <h1>星图给你恒星背景；行星，要从背景里找出来</h1>
  </header>

  <main class="p01-main focus k-generalization min0">
    <figure class="p01-sky cvbox min0" aria-labelledby="sky-title" style="margin:0">
      <svg viewBox="0 0 1010 690" role="img" aria-labelledby="sky-title sky-desc">
        <title id="sky-title">恒星背景与其中的行星</title>
        <desc id="sky-desc">灰蓝色恒星和辅助线构成连续背景，一个琥珀色开放圆环叠在背景中，标出要寻找的行星。</desc>
        <defs>
          <clipPath id="chartClip"><circle cx="438" cy="340" r="330"/></clipPath>
        </defs>
        <g clip-path="url(#chartClip)">
          <circle cx="438" cy="340" r="330" fill="rgba(143,167,179,.025)"/>
          <g fill="none" stroke="var(--star)" stroke-width="1.5" opacity=".5">
            <path d="M185 330 L337 247 L477 313"/>
            <path d="M337 247 L401 435" opacity=".38"/>
          </g>
          <g fill="var(--star)">
            <circle cx="121" cy="176" r="3"/><circle cx="185" cy="330" r="6"/>
            <circle cx="257" cy="536" r="2.5"/><circle cx="337" cy="247" r="8"/>
            <circle cx="401" cy="435" r="4.5"/><circle cx="477" cy="313" r="5.5"/>
            <circle cx="526" cy="562" r="3"/><circle cx="610" cy="188" r="4"/>
            <circle cx="671" cy="403" r="7"/><circle cx="738" cy="280" r="2.5"/>
            <circle cx="776" cy="527" r="4"/>
          </g>
          <circle cx="548" cy="379" r="5" fill="var(--text)"/>
        </g>
        <circle cx="438" cy="340" r="330" fill="none" stroke="var(--star)" stroke-width="2" opacity=".72"/>
        <path d="M438 10 A330 330 0 0 1 768 340" fill="none" stroke="var(--text)" stroke-width="1" opacity=".22"/>
        <g class="p01-svg-label" fill="var(--star)">
          <path d="M182 594 H286" stroke="var(--star)" stroke-width="1.5"/>
          <text x="102" y="600" text-anchor="end">恒星背景</text>
        </g>
        <g fill="none" stroke="var(--accent)">
          <circle cx="548" cy="379" r="22" stroke-width="4"/>
          <path d="M570 379 H858 Q878 379 878 399 V410" stroke-width="2"/>
        </g>
        <text x="878" y="444" text-anchor="middle" fill="var(--accent)" class="p01-svg-label">要找的行星</text>
      </svg>
    </figure>

    <aside class="p01-side min0">
      <div class="p01-claim">
        <div class="label">从同一片星空中找</div>
        <p>先认出稳定的星空框架，再寻找其中的行星。</p>
      </div>
      <div class="p01-next">下一问<strong>到户外后，第一步该做什么？</strong></div>
    </aside>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
