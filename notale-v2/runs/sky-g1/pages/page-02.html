<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="02" data-total="19">
<div id="stage">
  <style>
    #stage{gap:0}
    .p02-head{height:104px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}
    .p02-kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.18em;color:var(--star);margin-bottom:14px}
    .p02-head h1{margin:0;font:700 var(--fs-h1)/1.2 var(--font-sans);color:var(--text)}
    .p02-summary{align-self:flex-end;font:500 var(--fs-lead)/1.35 var(--font-sans);color:var(--text);letter-spacing:.04em;padding-bottom:2px}
    .p02-flow{position:relative;flex:1;min-height:0;display:flex;align-items:center;padding:22px 0 18px}
    .p02-axis{position:absolute;left:6%;right:6%;top:50%;height:74px;transform:translateY(-50%);z-index:0;pointer-events:none}
    .p02-cards{position:relative;z-index:1;width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;list-style:none;margin:0;padding:0}
    .p02-card{height:530px;display:flex;flex-direction:column;background:color-mix(in srgb,var(--surface) 82%,var(--star) 18%);border:1px solid var(--line);border-radius:8px;padding:30px 28px 26px}
    .p02-card .tag{align-self:flex-start;font-family:var(--font-mono);margin-bottom:24px}
    .p02-icon{height:190px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
    .p02-icon svg{width:238px;height:166px;overflow:visible}
    .p02-card h2{margin:0 0 12px;font:700 var(--fs-h2)/1.25 var(--font-sans);color:var(--text)}
    .p02-card p{margin:0;font:400 var(--fs-body)/1.55 var(--font-sans);color:var(--text);max-width:250px}
    .p02-output{margin-top:auto;padding-top:17px;border-top:1px solid var(--line);font:600 var(--fs-label)/1.3 var(--font-sans);color:var(--star);letter-spacing:.08em}
    .p02-foot{height:82px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:40px}
    .p02-take{font:600 var(--fs-lead)/1.35 var(--font-sans);color:var(--text)}
    .p02-next{font:400 var(--fs-sec)/1.45 var(--font-sans);color:var(--star);text-align:right}
    .p02-star{fill:var(--star)}
    .p02-stroke{fill:none;stroke:var(--star);stroke-width:2}
    .p02-accent{fill:none;stroke:var(--accent);stroke-width:4}
  </style>
  <header class="p02-head">
    <div>
      <div class="p02-kicker">FIELD MISSION</div>
      <h1>到户外，只按四步走</h1>
    </div>
    <div class="p02-summary">定方向 → 对星形 → 找异常 → 留记录</div>
  </header>

  <main class="p02-flow min0 k-process" aria-label="户外观测四步流程">
    <svg class="p02-axis" viewBox="0 0 1300 74" preserveAspectRatio="none" aria-hidden="true">
      <line x1="28" y1="37" x2="1270" y2="37" stroke="var(--star)" stroke-width="2" opacity=".55"/>
      <path d="M328 25 L346 37 L328 49 M646 25 L664 37 L646 49 M964 25 L982 37 L964 49" fill="none" stroke="var(--star)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <ol class="p02-cards stage-cards">
      <li class="p02-card min0">
        <span class="tag">01</span>
        <div class="p02-icon" aria-hidden="true"><svg viewBox="0 0 132 92"><path class="p02-stroke" d="M12 72 Q66 32 120 72"/><path class="p02-stroke" d="M66 67 V18 M56 30 L66 18 L76 30"/><path class="p02-stroke" d="M26 73 H106"/></svg></div>
        <h2>定方向</h2><p>先确认自己正面对哪一边天空</p>
        <div class="p02-output">方向就位</div>
      </li>
      <li class="p02-card min0">
        <span class="tag">02</span>
        <div class="p02-icon" aria-hidden="true"><svg viewBox="0 0 132 92"><path class="p02-stroke" d="M24 68 L66 20 L108 62 Z" opacity=".8"/><circle class="p02-star" cx="24" cy="68" r="6"/><circle class="p02-star" cx="66" cy="20" r="8"/><circle class="p02-star" cx="108" cy="62" r="5"/></svg></div>
        <h2>对星形</h2><p>在纸图与天空中找到同一组亮星</p>
        <div class="p02-output">背景对上</div>
      </li>
      <li class="p02-card min0">
        <span class="tag">03</span>
        <div class="p02-icon" aria-hidden="true"><svg viewBox="0 0 132 92"><circle class="p02-star" cx="66" cy="46" r="7"/><circle class="p02-accent" cx="66" cy="46" r="22"/><circle class="p02-star" cx="25" cy="68" r="3"/><circle class="p02-star" cx="105" cy="24" r="4"/></svg></div>
        <h2>找异常</h2><p>留意不属于纸图恒星背景的亮点</p>
        <div class="p02-output">得到候选</div>
      </li>
      <li class="p02-card min0">
        <span class="tag">04</span>
        <div class="p02-icon" aria-hidden="true"><svg viewBox="0 0 132 92"><path class="p02-stroke" d="M20 18 H112 V76 H20 Z M34 36 H96 M34 55 H82"/><circle cx="101" cy="55" r="5" fill="none" stroke="var(--star)" stroke-width="2"/></svg></div>
        <h2>留记录</h2><p>把今晚看到的位置记下来</p>
        <div class="p02-output">等待复查</div>
      </li>
    </ol>
  </main>

  <footer class="p02-foot">
    <div class="p02-take">定方向 → 对星形 → 找异常 → 留记录</div>
    <div class="p02-next">为什么星图上没有的亮点，反而值得注意？</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
