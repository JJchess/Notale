<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="03" data-total="19">
<div id="stage">
  <style>
    .p03-head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-bottom:18px}
    .p03-kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.14em;color:var(--accent);margin:0 0 9px}
    .p03-head h1{font:700 var(--fs-h1)/1.18 var(--font-sans);margin:0;color:var(--text)}
    .p03-lead{max-width:510px;margin:0 0 2px;font:400 var(--fs-body)/1.45 var(--font-sans);color:var(--text);opacity:.78}
    .p03-main{flex:none;height:748px;display:flex;flex-direction:column;min-height:0}
    section.p03-compare{flex:none;width:100%;height:620px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:620px;gap:28px;min-height:0;position:relative}
    .p03-col{display:flex;flex-direction:column;min-width:0;min-height:0}
    .p03-cap{display:flex;align-items:center;justify-content:space-between;height:38px;font:600 var(--fs-h2)/1.2 var(--font-sans);color:var(--text)}
    .p03-cap span{font:400 var(--fs-label)/1.2 var(--font-sans);color:var(--star)}
    .p03-sky{position:relative;flex:1 1 0;min-height:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:rgba(143,167,179,.035)}
    .p03-sky svg{display:block;width:100%;height:100%}
    .p03-lines{fill:none;stroke:var(--star);stroke-width:1.5;opacity:.44}
    .p03-star{fill:var(--star)}
    .p03-planet{fill:var(--accent)}
    .p03-ring{fill:none;stroke-width:3;pointer-events:none}
    .p03-ring.common{stroke:var(--star)} .p03-ring.extra{stroke:var(--accent)}
    .p03-hit{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer}
    .p03-hit:focus-visible{outline:3px solid var(--focus);outline-offset:3px;background:rgba(255,255,255,.05)}
    .p03-hit:hover{background:rgba(255,255,255,.04)}
    .p03-label{position:absolute;left:62.3%;top:39%;transform:translate(15px,-50%);font:600 var(--fs-label)/1.2 var(--font-sans);color:var(--accent);white-space:nowrap}
    .p03-foot{height:42px;display:flex;align-items:center;justify-content:space-between;gap:20px;font:400 var(--fs-label)/1.35 var(--font-sans);color:var(--star)}
    .p03-legend{display:flex;align-items:center;gap:8px;white-space:nowrap}.p03-dot{width:10px;height:10px;border-radius:50%;background:var(--star)}
    .p03-open{width:15px;height:15px;border:2px solid var(--accent);border-radius:50%}
    .p03-feedback{flex:0 0 64px;box-sizing:border-box;margin-top:12px;display:flex;align-items:center;gap:18px;border-top:1px solid var(--line);background:var(--bg);position:relative;z-index:2}
    .p03-fb{flex:1;margin:0;font:500 var(--fs-body)/1.4 var(--font-sans);color:var(--text)}
    .p03-fb[data-mode="ready"]{color:var(--star)} .p03-fb[data-mode="found"]{color:var(--accent)}
    .p03-reset{flex:none}
    .p03-close{flex:0 0 52px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:36px;padding-top:10px;border-top:1px solid var(--line)}
    .p03-close p{margin:0;font:600 var(--fs-lead)/1.35 var(--font-sans)}
    .p03-next{font:400 var(--fs-sec)/1.35 var(--font-sans)!important;color:var(--star);white-space:nowrap}
  </style>

  <header class="p03-head">
    <div>
      <p class="p03-kicker">STAR MAP ≠ TONIGHT</p>
      <h1>同一片天空，今晚可能多出一个亮点</h1>
    </div>
    <p class="p03-lead">先比形状：两边的恒星一一对应。再找右图独有的点。</p>
  </header>

  <main class="p03-main">
    <section class="p03-compare" aria-label="纸质星图与今晚天空的同尺度比较">
      <article class="p03-col min0">
        <div class="p03-cap">纸质星图 <span>恒星框架</span></div>
        <div class="p03-sky" aria-label="纸质星图中的九颗恒星">
          <svg viewBox="0 0 600 500" role="img" aria-label="九颗恒星及辅助连线">
            <g class="p03-lines"><polyline points="112,126 318,154 454,112"/><polyline points="162,286 292,264 420,312"/><line x1="318" y1="154" x2="292" y2="264"/></g>
            <g class="p03-star"><circle cx="112" cy="126" r="6"/><circle cx="208" cy="88" r="4"/><circle cx="318" cy="154" r="7"/><circle cx="454" cy="112" r="4"/><circle cx="162" cy="286" r="3"/><circle cx="292" cy="264" r="5"/><circle cx="420" cy="312" r="6"/><circle cx="510" cy="242" r="3"/><circle cx="248" cy="404" r="4"/></g>
          </svg>
        </div>
        <div class="p03-foot"><span>图上印着：较稳定的恒星位置关系</span><span class="p03-legend"><i class="p03-dot"></i>恒星框架</span></div>
      </article>

      <article class="p03-col min0">
        <div class="p03-cap">今晚天空 <span>同一视野</span></div>
        <div class="p03-sky" id="night" aria-label="今晚天空。可逐一点选亮点，与左图比较">
          <svg viewBox="0 0 600 500" role="img" aria-label="与左图相同的九颗恒星，另有一个额外亮点">
            <g class="p03-lines"><polyline points="112,126 318,154 454,112"/><polyline points="162,286 292,264 420,312"/><line x1="318" y1="154" x2="292" y2="264"/></g>
            <g class="p03-star"><circle cx="112" cy="126" r="6"/><circle cx="208" cy="88" r="4"/><circle cx="318" cy="154" r="7"/><circle cx="454" cy="112" r="4"/><circle cx="162" cy="286" r="3"/><circle cx="292" cy="264" r="5"/><circle cx="420" cy="312" r="6"/><circle cx="510" cy="242" r="3"/><circle cx="248" cy="404" r="4"/></g>
            <circle class="p03-planet" cx="374" cy="226" r="8"/>
            <circle id="pick-ring" class="p03-ring" cx="0" cy="0" r="17" hidden/>
          </svg>
          <div id="hits"></div><span id="planet-label" class="p03-label" hidden>今晚的行星</span>
        </div>
        <div class="p03-foot"><span>点出右图中“不属于左图”的亮点</span><span class="p03-legend"><i class="p03-dot"></i>恒星框架 <i id="extra-key" class="p03-open" hidden></i><b id="extra-text" hidden>额外亮点</b></span></div>
      </article>
    </section>

    <div class="p03-feedback">
      <p id="feedback" class="p03-fb" data-mode="ready" aria-live="polite">从右图任选一个亮点，核对左图同一位置。</p>
      <button id="reset" class="btn p03-reset" type="button">重新比较</button>
    </div>
    <footer class="p03-close">
      <p>纸图给你稳定的恒星框架，不保证印出今晚出现的行星。</p>
      <p class="p03-next">怎样先把纸图的方向与真实天空对准？</p>
    </footer>
  </main>

  <script>
  window.addEventListener('DOMContentLoaded',()=>{(()=>{
    const stars=[['A',112,126],['B',208,88],['C',318,154],['D',454,112],['E',162,286],['F',292,264],['G',420,312],['H',510,242],['I',248,404]];
    const points=[...stars.map(([id,x,y])=>({id,x,y,extra:false})),{id:'P',x:374,y:226,extra:true}];
    const hits=document.getElementById('hits'), ring=document.getElementById('pick-ring'), feedback=document.getElementById('feedback');
    const label=document.getElementById('planet-label'), resetBtn=document.getElementById('reset'), extraKey=document.getElementById('extra-key'), extraText=document.getElementById('extra-text');
    const events=new AbortController(); let timer=0, destroyed=false;
    function initialState(){return {mode:'ready',selected:null};}
    let state=initialState();
    points.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='p03-hit';b.style.left=(p.x/6)+'%';b.style.top=(p.y/5)+'%';b.dataset.id=p.id;b.setAttribute('aria-label',`亮点 ${i+1}${p.extra?'，额外亮点':''}`);hits.appendChild(b);});
    function transition(s,a){
      if(a.type==='reset') return initialState();
      if(a.type==='select'){const p=points.find(v=>v.id===a.id);return p?{mode:p.extra?'found':'common',selected:p.id}:s;}
      return s;
    }
    function render(){
      const p=points.find(v=>v.id===state.selected);
      ring.hidden=!p; if(p){ring.setAttribute('cx',p.x);ring.setAttribute('cy',p.y);ring.setAttribute('class','p03-ring '+(p.extra?'extra':'common'));}
      const found=state.mode==='found'; label.hidden=!found;extraKey.hidden=!found;extraText.hidden=!found;
      feedback.dataset.mode=state.mode;
      feedback.textContent=state.mode==='ready'?'从右图任选一个亮点，核对左图同一位置。':found?'找到了：周围恒星都能在纸图上对应，只有这个亮点没有。':'再比一次：这个点在左图同一位置也能找到。';
    }
    function dispatch(a){clearTimeout(timer);timer=0;const next=transition(state,a);if(next===state)return;state=next;render();if(state.mode==='common'&&!Deck.reduced())timer=setTimeout(()=>{ring.hidden=true;timer=0;},700);}
    hits.addEventListener('click',e=>{const b=e.target.closest('button');if(b)dispatch({type:'select',id:b.dataset.id});},{signal:events.signal});
    resetBtn.addEventListener('click',()=>{dispatch({type:'reset'});hits.querySelector('button').focus();feedback.textContent='已重新比较：从右图任选一个亮点。';},{signal:events.signal});
    function destroy(){if(destroyed)return;destroyed=true;events.abort();clearTimeout(timer);}
    window.addEventListener('pagehide',destroy,{once:true});
    render(); Deck.init({index:3,total:19});
  })();},{once:true});
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
