<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}
.kicker{font:600 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.12em;color:var(--accent)}
h1{font:600 var(--fs-h1)/1.2 var(--font-sans);margin:7px 0 0;color:var(--text)}
.head-note{font:var(--fs-sec)/1.45 var(--font-sans);color:var(--star);max-width:420px;text-align:right}
.main{flex:1;display:flex;gap:20px;min-height:0}
.visual{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
.dial-wrap{width:750px;height:700px;position:relative;display:flex;align-items:center;justify-content:center}
#dial{width:700px;height:700px;overflow:visible;touch-action:none;cursor:grab;outline:none}
#dial:active{cursor:grabbing} #dial:focus-visible{outline:3px solid var(--focus);outline-offset:6px;border-radius:50%}
.outer{fill:none;stroke:var(--line);stroke-width:2}.outer-tick{stroke:var(--star);stroke-width:2}.outer-label{fill:var(--star);font:600 19px var(--font-serif)}
.map-disc{fill:var(--surface);stroke:var(--star);stroke-width:2}.map-ring{fill:none;stroke:var(--star);stroke-width:1.5}.const{fill:none;stroke:var(--star);stroke-width:1.5;opacity:.45}.star{fill:var(--star)}
.map-label{fill:var(--star);font:600 18px var(--font-serif)}
.map-group{transform-origin:330px 330px;transition:transform 180ms ease-out}.dragging .map-group{transition:none}
#pointer,.align-line{transform-origin:330px 330px}.pointer-line{stroke:var(--accent);stroke-width:4;stroke-linecap:round;transition:transform 240ms ease-out}.pointer-tip{fill:var(--accent)}
.align-line{stroke:var(--accent);stroke-width:3;stroke-dasharray:8 7;opacity:0;transition:opacity 120ms}.aligned .align-line{opacity:1}
.center{fill:var(--bg);stroke:var(--line);stroke-width:2}.drag-hint{fill:var(--text);font:15px var(--font-sans)}
.side{width:560px;display:flex;flex-direction:column;justify-content:center;gap:18px}.panel.q{padding:22px 24px}
.panel h2{font:600 var(--fs-h2)/1.25 var(--font-sans);margin:0 0 14px}.facing{font:var(--fs-lead)/1.35 var(--font-sans);margin:0 0 14px}.facing strong{color:var(--accent)}
.btns{display:flex;gap:8px}.btn{min-width:74px}.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.readouts{display:grid;grid-template-columns:1fr auto;gap:10px 16px;border-top:1px solid var(--line);padding-top:16px;font:var(--fs-sec)/1.4 var(--font-sans)}
.readouts .value{font-family:var(--font-mono);color:var(--text)}
.status{display:flex;align-items:center;gap:10px;min-height:34px;font:600 var(--fs-body)/1.35 var(--font-sans)}.status.ok{color:var(--accent)}
.nudges{display:flex;align-items:center;gap:9px}.nudge{min-width:54px}.reset{margin-left:auto}
.legend{font:var(--fs-label)/1.4 var(--font-sans);color:var(--star)}
.process-strip{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font:var(--fs-label)/1.35 var(--font-sans);color:var(--star)}.process-strip b{font-weight:500;color:var(--text)}.process-strip .arrow{color:var(--accent)}.rigid-note{margin:10px 0 0;font:var(--fs-sec)/1.4 var(--font-sans);color:var(--star)}
.takeaway{border-left:3px solid var(--accent);padding-left:16px;font:var(--fs-lead)/1.45 var(--font-sans);margin:0}.next{font:var(--fs-sec)/1.4 var(--font-sans);color:var(--star);margin:0}
@media (prefers-reduced-motion:reduce){.map-group,.pointer-line,.align-line{transition:none}}
</style>
</head>
<body data-page="04" data-total="19">
<div id="stage">
  <header class="page-head">
    <div><div class="kicker">STEP 1 · 定方位</div><h1>先让图上的方向对上真实地平线</h1></div>
    <div class="head-note">真实方向不动；整张纸图围绕中心转动。</div>
  </header>
  <main class="main min0">
    <section class="visual min0 canvas-full k-process" aria-label="真实地平线与可旋转星图的同心方位转盘">
      <div class="dial-wrap">
        <svg id="dial" class="no-pan" viewBox="0 0 660 660" role="slider" tabindex="0" aria-label="旋转星图" aria-valuemin="0" aria-valuemax="359" aria-valuenow="0" aria-valuetext="图上北方朝向真实北方">
          <circle class="outer" cx="330" cy="330" r="300"/>
          <g aria-hidden="true">
            <path class="outer-tick" d="M330 30v24 M630 330h-24 M330 630v-24 M30 330h24"/>
            <text class="outer-label" x="330" y="22" text-anchor="middle">北</text><text class="outer-label" x="642" y="337" text-anchor="middle">东</text>
            <text class="outer-label" x="330" y="654" text-anchor="middle">南</text><text class="outer-label" x="18" y="337" text-anchor="middle">西</text>
          </g>
          <g id="pointer" aria-hidden="true"><line class="pointer-line" x1="330" y1="70" x2="330" y2="116"/><path class="pointer-tip" d="M330 104l-10-17h20z"/></g>
          <line id="alignLine" class="align-line" x1="330" y1="72" x2="330" y2="210"/>
          <g id="mapGroup" class="map-group" aria-hidden="true">
            <circle class="map-disc" cx="330" cy="330" r="218"/><circle class="map-ring" cx="330" cy="330" r="196"/>
            <path class="const" d="M220 260l54-31 48 53 72-31 48 69 45 47M207 385l67-39 50 51 67-18 55 53M254 476l45-83 72-63 52-86"/>
            <circle class="star" cx="220" cy="260" r="4"/><circle class="star" cx="274" cy="229" r="7"/><circle class="star" cx="322" cy="282" r="3"/><circle class="star" cx="394" cy="251" r="5"/><circle class="star" cx="442" cy="320" r="4"/><circle class="star" cx="487" cy="367" r="6"/>
            <circle class="star" cx="207" cy="385" r="3"/><circle class="star" cx="274" cy="346" r="6"/><circle class="star" cx="324" cy="397" r="4"/><circle class="star" cx="391" cy="379" r="7"/><circle class="star" cx="446" cy="432" r="4"/><circle class="star" cx="254" cy="476" r="5"/><circle class="star" cx="423" cy="244" r="3"/>
            <text class="map-label" x="330" y="153" text-anchor="middle">北</text><text class="map-label" x="508" y="337" text-anchor="middle">东</text>
            <text class="map-label" x="330" y="520" text-anchor="middle">南</text><text class="map-label" x="152" y="337" text-anchor="middle">西</text>
          </g>
          <circle class="center" cx="330" cy="330" r="42"/><text class="drag-hint" x="330" y="326" text-anchor="middle">拖动</text><text class="drag-hint" x="330" y="346" text-anchor="middle">纸图</text>
        </svg>
      </div>
    </section>
    <aside class="side min0">
      <section class="panel q">
        <h2>① 先选你面对的真实方向</h2>
        <p class="facing">你正面对：<strong id="facingText">南</strong></p>
        <div class="btns" id="directions" aria-label="选择面对方向">
          <button class="btn" data-deg="0">北</button><button class="btn" data-deg="90">东</button><button class="btn" data-deg="180" aria-pressed="true">南</button><button class="btn" data-deg="270">西</button>
        </div>
      </section>
      <section class="panel q">
        <h2>② 转动内圈的整张星图</h2>
        <div class="readouts"><span>图边朝向</span><span class="value" id="mapReadout">北 · 000°</span><span>目标方向</span><span class="value" id="targetReadout">南 · 180°</span></div>
        <div id="status" class="status" aria-live="polite"><span class="tag">待对准</span><span>转动星图，让“南”来到指针处</span></div>
        <div class="nudges"><button class="btn nudge" id="minus" aria-label="星图逆时针转一度">−1°</button><button class="btn nudge" id="plus" aria-label="星图顺时针转一度">+1°</button><button class="btn reset" id="reset">复位</button></div>
        <div class="legend">外圈：真实方向　内圈：图上方向</div>
        <div class="process-strip" aria-label="对准顺序"><b>选真实方向</b><span class="arrow">→</span><b>转整张图</b><span class="arrow">→</span><b>同名重合</b></div>
        <p class="rigid-note">观察：星点跟着纸图一起转，彼此形状不变。</p>
      </section>
      <p class="takeaway">你面对哪一方，星图地平圈上的同名方向就必须对准哪一方。</p>
      <p class="next">方向对了，为什么同一张图在不同钟点仍会对不上？</p>
    </aside>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:4,total:19});
  const dial=document.getElementById('dial'), mapGroup=document.getElementById('mapGroup'), pointer=document.getElementById('pointer');
  const facingText=document.getElementById('facingText'), mapReadout=document.getElementById('mapReadout'), targetReadout=document.getElementById('targetReadout'), status=document.getElementById('status');
  const names={0:'北',90:'东',180:'南',270:'西'};
  const initialState=()=>({facing:180,rotation:0,dragging:false}); let state=initialState(), active=null, offset=0, destroyed=false;
  const norm=v=>(v%360+360)%360, diff=(a,b)=>((a-b+540)%360)-180;
  function transition(s,a){
    if(a.type==='face') return {...s,facing:a.value};
    if(a.type==='rotate'){let r=norm(a.value); if(Math.abs(diff(r,s.facing))<=5)r=s.facing; return {...s,rotation:r};}
    if(a.type==='drag') return {...s,dragging:a.value};
    if(a.type==='reset') return initialState(); return s;
  }
  function dispatch(a){state=transition(state,a);render();}
  function render(){
    const aligned=Math.abs(diff(state.rotation,state.facing))===0;
    mapGroup.style.transform=`rotate(${state.rotation}deg)`; pointer.style.transform=`rotate(${state.facing}deg)`;
    dial.classList.toggle('dragging',state.dragging); dial.classList.toggle('aligned',aligned);
    document.getElementById('alignLine').style.transform=`rotate(${state.facing}deg)`;
    facingText.textContent=names[state.facing]; targetReadout.textContent=`${names[state.facing]} · ${String(state.facing).padStart(3,'0')}°`;
    const nearest=[0,90,180,270].reduce((a,b)=>Math.abs(diff(state.rotation,a))<Math.abs(diff(state.rotation,b))?a:b);
    mapReadout.textContent=`${names[nearest]} · ${String(Math.round(state.rotation)).padStart(3,'0')}°`;
    status.className='status'+(aligned?' ok':''); status.innerHTML=aligned?'<span class="tag">已重合</span><span>方向已对准</span>':`<span class="tag">待对准</span><span>转动星图，让“${names[state.facing]}”来到指针处</span>`;
    dial.setAttribute('aria-valuenow',Math.round(state.rotation)); dial.setAttribute('aria-valuetext',aligned?`${names[state.facing]}方向已对准`:`星图旋转${Math.round(state.rotation)}度，尚未对准${names[state.facing]}`);
    document.querySelectorAll('[data-deg]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.deg)===state.facing));
  }
  const events=new AbortController(), opt={signal:events.signal};
  document.getElementById('directions').addEventListener('click',e=>{const b=e.target.closest('[data-deg]');if(b)dispatch({type:'face',value:Number(b.dataset.deg)});},opt);
  function angle(e){const p=Deck.pt(dial,e);return norm(Math.atan2(p.y-330,p.x-330)*180/Math.PI+90)}
  dial.addEventListener('pointerdown',e=>{if(active!==null)return;active=e.pointerId;dial.setPointerCapture(active);offset=diff(state.rotation,angle(e));dispatch({type:'drag',value:true});},opt);
  dial.addEventListener('pointermove',e=>{if(e.pointerId===active)dispatch({type:'rotate',value:angle(e)+offset});},opt);
  function end(e){if(e.pointerId!==active)return;active=null;dispatch({type:'drag',value:false});}
  dial.addEventListener('pointerup',end,opt);dial.addEventListener('pointercancel',end,opt);
  dial.addEventListener('keydown',e=>{let d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();e.stopPropagation();dispatch({type:'rotate',value:state.rotation+d*(e.shiftKey?10:1)});},opt);
  document.getElementById('minus').addEventListener('click',()=>dispatch({type:'rotate',value:state.rotation-1}),opt);document.getElementById('plus').addEventListener('click',()=>dispatch({type:'rotate',value:state.rotation+1}),opt);
  document.getElementById('reset').addEventListener('click',()=>{active=null;dispatch({type:'reset'});dial.focus();status.setAttribute('aria-label','已复位');},opt);
  function destroy(){if(destroyed)return;destroyed=true;events.abort();active=null;} window.addEventListener('pagehide',destroy,{once:true});
  render();
})();
</script>
</body>
</html>
