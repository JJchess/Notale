<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="05" data-total="19">
<div id="stage">
<style>
  .p05{height:100%;display:flex;flex-direction:column;gap:18px}
  .p05-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}
  .p05-kicker{font:var(--fs-label)/1.35 var(--font-mono);color:var(--star);letter-spacing:.12em;margin:0 0 7px}
  .p05 h1{font:600 var(--fs-h1)/1.18 var(--font-sans);margin:0;color:var(--text)}
  .p05-claim{max-width:520px;margin:0 0 2px 28px;font:var(--fs-sec)/1.5 var(--font-sans);color:var(--star);padding-left:18px;border-left:3px solid var(--star)}
  .p05-main{flex:1;display:flex;gap:38px;min-height:0}
  .p05-left{width:730px;display:flex;flex-direction:column;gap:14px}
  .p05-control{padding:18px 22px 16px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
  .p05-control-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .p05-hint{font:var(--fs-body)/1.35 var(--font-sans);color:var(--accent);margin:0;white-space:nowrap}
  .p05-read{font:600 30px/1 var(--font-mono);color:var(--text);padding:7px 10px;border-radius:6px;cursor:pointer}
  .p05-read:focus-visible,.p05-tick:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .p05-range{width:100%;margin:8px 0 5px;accent-color:var(--accent)}
  .p05-ticks{display:flex;justify-content:space-between}
  .p05-tick{border:0;background:transparent;color:var(--star);font:var(--fs-label)/1.3 var(--font-mono);padding:7px 5px;cursor:pointer}
  .p05-tick[aria-current="true"]{color:var(--accent);text-decoration:underline;text-underline-offset:5px}
  .p05-observe{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-left:3px solid var(--accent)}
  .p05-observe strong{font:600 var(--fs-lead)/1.35 var(--font-sans);color:var(--text)}
  .p05-angle{font:var(--fs-body)/1.35 var(--font-mono);color:var(--star)}
  .p05-reset{white-space:nowrap}
  .p05-proof{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;padding:15px 16px}
  .p05-proof-item{flex:1;font:var(--fs-sec)/1.4 var(--font-sans);color:var(--star)}
  .p05-proof-item b{display:block;color:var(--text);font-weight:600;margin-bottom:3px}
  .p05-proof-arrow{align-self:center;color:var(--star);font-size:24px;padding:0 12px}
  .p05-next{margin-top:auto;padding:15px 18px;border-top:1px solid var(--line);font:var(--fs-sec)/1.45 var(--font-sans);color:var(--star)}
  .p05-next b{color:var(--text);font-weight:500}
  .p05-sky{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center}
  .p05-disc{position:relative;width:680px;height:680px}
  .p05-disc svg{width:100%;height:100%;display:block}
  .p05-rim{fill:rgba(143,167,179,.025);stroke:var(--star);stroke-width:2}
  .p05-horizon{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:7 10}
  .p05-star{fill:var(--star)}
  .p05-link{fill:none;stroke:var(--star);stroke-width:1.5}
  .p05-mark{fill:none;stroke:var(--accent);stroke-width:3}
  .p05-center{stroke:var(--star);stroke-width:1.5;opacity:.75}
  .p05-center-label{position:absolute;left:50%;top:50%;transform:translate(13px,12px);font:var(--fs-label)/1.2 var(--font-sans);color:var(--star)}
  .p05-gap-label{position:absolute;transform:translate(-50%,-50%);font:600 var(--fs-label)/1.2 var(--font-sans);color:var(--accent);background:var(--bg);padding:4px 7px;border:1px solid var(--accent);border-radius:5px;white-space:nowrap;pointer-events:none}
  .p05-direction{position:absolute;font:var(--fs-label)/1 var(--font-serif);color:var(--star)}
  .p05-n{left:50%;top:8px;transform:translateX(-50%)} .p05-e{right:10px;top:50%;transform:translateY(-50%)}
  .p05-live{position:absolute;left:22px;bottom:14px;font:var(--fs-label)/1.35 var(--font-sans);color:var(--star)}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<main class="p05" aria-labelledby="p05-title">
  <header class="p05-head">
    <div><p class="p05-kicker">对图 · 02 / 05</p><h1 id="p05-title">转动的是整片恒星天空，不是星形本身</h1></div>
    <p class="p05-claim">时刻改变时，所有恒星绕同一中心同行；任意两星的间距和三角形形状保持不变。</p>
  </header>
  <section class="p05-main min0 split-lr">
    <div class="p05-left min0">
      <div class="p05-control" aria-label="从早到晚的时刻轴">
        <div class="p05-control-top"><p class="p05-hint">拖动时刻：盯住这组三颗星</p><output id="timeRead" class="p05-read" tabindex="0" title="双击回到 22:00">22:00</output></div>
        <input id="timeRange" class="p05-range" type="range" min="0" max="12" step="1" value="4" aria-label="当晚时刻，从20点至次日2点">
        <div class="p05-ticks" aria-label="快速选择时刻">
          <button class="p05-tick" data-index="0">20:00</button><button class="p05-tick" data-index="4" aria-current="true">22:00</button><button class="p05-tick" data-index="8">00:00</button><button class="p05-tick" data-index="12">02:00</button>
        </div>
      </div>
      <div class="p05-observe">
        <div><strong>星间距不变</strong><div id="angleRead" class="p05-angle">相对 22:00：0.00°</div></div>
        <button id="resetBtn" class="btn p05-reset" type="button">回到 22:00</button>
      </div>
      <div class="panel q"><div class="tag">观察结果</div><p class="lead" style="margin:10px 0 4px">过 2 小时：整片天空约转 30°</p><p class="small" style="margin:0">星点同时启动、同时停止；定位三角形没有变形。</p></div>
      <div class="p05-proof k-process" aria-label="从操作到证据的过程"><div class="p05-proof-item"><b>① 改变时刻</b>共用一条连续时刻轴</div><span class="p05-proof-arrow">→</span><div class="p05-proof-item"><b>② 整体旋转</b>18 颗星共享同一转角</div><span class="p05-proof-arrow">→</span><div class="p05-proof-item"><b>③ 核对形状</b>三条边长差仍为 0</div></div>
      <p class="p05-next"><span>下一问　</span><b>图已调到此刻，举起来时哪一面该朝向天空？</b></p>
    </div>
    <div class="p05-sky min0 cvbox" aria-label="随时刻整体旋转的圆形星图">
      <div class="p05-disc">
        <svg viewBox="0 0 620 620" role="img" aria-labelledby="skyTitle skyDesc">
          <title id="skyTitle">单一圆形星图</title><desc id="skyDesc">十八颗恒星与三颗星组成的不等边三角形作为整体绕中心顺时针旋转。</desc>
          <circle class="p05-rim" cx="310" cy="310" r="286"/><circle class="p05-horizon" cx="310" cy="310" r="250"/>
          <g id="starField" transform="rotate(0 310 310)">
            <path class="p05-link" d="M205 172 L408 222 L350 407 Z"/>
            <g fill="var(--star)" font-family="var(--font-mono)" font-size="15"><text x="300" y="183">边 A</text><text x="392" y="319">边 B</text><text x="245" y="303">边 C</text></g>
            <circle class="p05-mark" cx="205" cy="172" r="13"/><circle class="p05-mark" cx="408" cy="222" r="13"/><circle class="p05-mark" cx="350" cy="407" r="13"/>
            <circle class="p05-star" cx="205" cy="172" r="7"/><circle class="p05-star" cx="408" cy="222" r="6"/><circle class="p05-star" cx="350" cy="407" r="8"/>
            <circle class="p05-star" cx="133" cy="279" r="3"/><circle class="p05-star" cx="167" cy="430" r="5"/><circle class="p05-star" cx="258" cy="500" r="3"/><circle class="p05-star" cx="438" cy="470" r="4"/><circle class="p05-star" cx="511" cy="353" r="6"/><circle class="p05-star" cx="486" cy="143" r="3"/><circle class="p05-star" cx="326" cy="105" r="5"/><circle class="p05-star" cx="112" cy="168" r="2.5"/><circle class="p05-star" cx="245" cy="278" r="4"/><circle class="p05-star" cx="438" cy="330" r="3"/><circle class="p05-star" cx="287" cy="365" r="2.5"/><circle class="p05-star" cx="372" cy="148" r="3"/><circle class="p05-star" cx="151" cy="356" r="4"/><circle class="p05-star" cx="459" cy="404" r="2.5"/><circle class="p05-star" cx="293" cy="218" r="3"/>
          </g>
          <path class="p05-center" d="M299 310h22M310 299v22"/>
        </svg>
        <span class="p05-center-label">旋转中心</span><span id="gapLabel" class="p05-gap-label">间距不变</span><span class="p05-direction p05-n">北</span><span class="p05-direction p05-e">东</span>
      </div>
      <div id="live" class="p05-live" aria-live="polite">当前 22:00，星场位于默认角度。</div>
    </div>
  </section>
</main>
<script>
window.addEventListener('DOMContentLoaded',()=>{
  Deck.init({index:5,total:19});
  const sidereal=typeof Lec.K==='function'?Lec.K('MEAN_SIDEREAL_DAY_HOURS'):Lec.K.MEAN_SIDEREAL_DAY_HOURS;
  const range=document.getElementById('timeRange'), field=document.getElementById('starField'), read=document.getElementById('timeRead');
  const angleRead=document.getElementById('angleRead'), gap=document.getElementById('gapLabel'), live=document.getElementById('live');
  const resetBtn=document.getElementById('resetBtn'), ticks=[...document.querySelectorAll('.p05-tick')];
  const events=new AbortController(); let raf=0, destroyed=false;
  const initialState=()=>({index:4,angle:0}); let state=initialState();
  const timeText=i=>{const mins=20*60+i*30;const h=Math.floor(mins/60)%24,m=mins%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')};
  const targetAngle=i=>((i-4)*.5/sidereal)*360;
  function render(s,announce=true){
    field.setAttribute('transform',`rotate(${s.angle} 310 310)`); range.value=s.index; read.value=timeText(s.index); read.textContent=timeText(s.index);
    angleRead.textContent=`相对 22:00：${s.angle===0?'0.00':(s.angle>0?'+':'')+s.angle.toFixed(2)}°`;
    ticks.forEach(b=>b.setAttribute('aria-current',Number(b.dataset.index)===s.index?'true':'false'));
    const a=s.angle*Math.PI/180, x=306.5,y=197; const dx=x-310,dy=y-310;
    gap.style.left=(310+dx*Math.cos(a)-dy*Math.sin(a))+'px'; gap.style.top=(310+dx*Math.sin(a)+dy*Math.cos(a))+'px';
    if(announce) live.textContent=`当前 ${timeText(s.index)}，整片星场相对默认时刻顺时针转动 ${Math.abs(s.angle).toFixed(2)} 度；三角形间距不变。`;
  }
  function cancel(){if(raf){cancelAnimationFrame(raf);raf=0}}
  function setDirect(index){cancel();state={index,angle:targetAngle(index)};render(state)}
  function animateTo(index){cancel();const from=state.angle,to=targetAngle(index);state={index,angle:from};if(Deck.reduced()){state={index,angle:to};render(state);return}const start=performance.now();function frame(now){const p=Math.min(1,(now-start)/320),e=1-Math.pow(1-p,3);state={index,angle:from+(to-from)*e};render(state,p===1);if(p<1)raf=requestAnimationFrame(frame);else raf=0}raf=requestAnimationFrame(frame)}
  function reset(){cancel();state=initialState();render(state);range.focus();live.textContent='已回到 22:00；星场恢复默认角度。'}
  range.addEventListener('input',e=>setDirect(Number(e.target.value)),{signal:events.signal});
  range.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key))e.stopPropagation()},{signal:events.signal});
  ticks.forEach(b=>b.addEventListener('click',()=>animateTo(Number(b.dataset.index)),{signal:events.signal}));
  resetBtn.addEventListener('click',reset,{signal:events.signal});read.addEventListener('dblclick',reset,{signal:events.signal});
  read.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reset()}},{signal:events.signal});
  function destroy(){if(destroyed)return;destroyed=true;events.abort();cancel()}window.addEventListener('pagehide',destroy,{once:true});
  render(state,false);
});
</script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
