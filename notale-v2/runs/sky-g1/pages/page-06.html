<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.18em;color:var(--attention);margin-bottom:8px}
h1{font:700 var(--fs-h1)/1.22 var(--font-sans);max-width:1150px;margin:0;color:var(--text)}
.modebar{display:flex;align-items:center;gap:10px;flex:none}.modebar .btn{min-width:132px}
main{display:flex;flex:1;min-height:0;flex-direction:column;gap:12px}
.instruction{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:12px 16px;border-left:3px solid var(--attention);background:color-mix(in srgb,var(--surface) 70%,transparent)}
.instruction strong{font-size:var(--fs-body)}.instruction span{font-size:var(--fs-label);color:var(--framework)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:none;height:470px;min-height:0;position:relative}
.compare:after{content:"同一张图 · 同一视角 · 同一地平线";position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font:var(--fs-label)/1.2 var(--font-mono);color:var(--framework);background:var(--bg);padding:4px 12px;white-space:nowrap}
.scene{position:relative;min-width:0;min-height:0;height:470px!important;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:linear-gradient(to bottom,transparent 0 73%,color-mix(in srgb,var(--surface) 55%,transparent) 73%)}
.scene.active{border-color:color-mix(in srgb,var(--attention) 65%,var(--line))}
.scene-head{position:absolute;z-index:4;left:18px;top:15px;right:18px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.scene-title{font:700 var(--fs-h2)/1.2 var(--font-sans)}.scene-tag{font:var(--fs-label)/1 var(--font-sans);padding:6px 9px;border:1px solid var(--line);border-radius:999px;color:var(--framework)}
.scene.active .scene-tag{color:var(--attention);border-color:var(--attention)}
.konva{position:absolute;inset:0}.dir-label{position:absolute;z-index:4;bottom:56px;font:700 24px/1 var(--font-serif);color:var(--framework);pointer-events:none}
.scene.active .dir-label{color:var(--attention)}
.edge-label{position:absolute;z-index:5;font:700 var(--fs-label)/1 var(--font-serif);padding:5px 8px;border-radius:4px;background:var(--bg);color:var(--framework);pointer-events:none}.face-note{position:absolute;z-index:4;left:18px;top:58px;font:var(--fs-label)/1.2 var(--font-sans);color:var(--framework);pointer-events:none}
.scene.active .edge-label{color:var(--attention)}
.feedback{height:42px;display:flex;align-items:center;justify-content:space-between;gap:16px}.status{font:700 var(--fs-body)/1.3 var(--font-sans)}.status.ok{color:var(--attention)}
.keyhelp{font:var(--fs-label)/1.3 var(--font-sans);color:var(--framework)}
footer{display:grid;grid-template-columns:1fr auto;align-items:center;gap:28px;border-top:1px solid var(--line);padding-top:12px}
.takeaway{font:var(--fs-lead)/1.4 var(--font-sans);margin:0;max-width:1090px}.next{font:var(--fs-sec)/1.35 var(--font-sans);color:var(--framework);max-width:370px;text-align:right}
.drag-surface{touch-action:none}.drag-surface:focus-visible{outline:3px solid var(--focus);outline-offset:-4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-page="06" data-total="19">
<div id="stage">
<header>
  <div><div class="kicker">HOLD THE CHART</div><h1>别把星图当墙上的地图：面对哪边，就让图上哪边朝向真实天空</h1></div>
  <div class="modebar" role="group" aria-label="选择面对方向"><button class="btn active" id="southBtn" aria-pressed="true">面向南方</button><button class="btn" id="northBtn" aria-pressed="false">面向北方</button><button class="btn" id="resetBtn">重新开始</button></div>
</header>
<main>
  <div class="instruction"><strong>拖动当前栏的圆形星图：先举过头顶，再让图上的方向边缘对准身前箭头。</strong><span>也可聚焦图面后按空格升降，按 ← → 微调方向</span></div>
  <section class="compare k-comparison" aria-label="面向南方与面向北方的持图姿势比较">
    <article class="scene active min0" id="southScene"><div class="scene-head"><span class="scene-title">面向南方</span><span class="scene-tag">当前练习</span></div><div class="konva drag-surface" id="southCanvas" tabindex="0" role="slider" aria-label="南向持图位置与转角" aria-valuemin="0" aria-valuemax="100"></div><span class="dir-label" id="southDir">真实南方</span><span class="edge-label" id="southEdge">图上「南」边</span><span class="face-note">印刷面朝向自己</span></article>
    <article class="scene min0" id="northScene"><div class="scene-head"><span class="scene-title">面向北方</span><span class="scene-tag">对照</span></div><div class="konva drag-surface" id="northCanvas" tabindex="0" role="slider" aria-label="北向持图位置与转角" aria-valuemin="0" aria-valuemax="100"></div><span class="dir-label" id="northDir">真实北方</span><span class="edge-label" id="northEdge">图上「北」边</span><span class="face-note">印刷面朝向自己</span></article>
  </section>
  <div class="feedback"><div id="status" class="status" aria-live="polite">先举过头顶，再让方向名称朝向同一真实方向。</div><div class="keyhelp">位置与方向都要满足；切换面对方向后，星图不会替你自动旋正。</div></div>
</main>
<footer><p class="takeaway">看南方时让“南”朝真实南方；看北方时让“北”朝真实北方，并把图举到头顶比较。</p><div class="next">姿势对了，先用哪几个星点确认图与天空真的重合？</div></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script>
(function(){
'use strict';
Deck.init({index:6,total:19});
const events=new AbortController(), cleanups=[];
const S={south:{scene:document.querySelector('#southScene'),host:document.querySelector('#southCanvas'),dir:document.querySelector('#southDir'),edge:document.querySelector('#southEdge')},north:{scene:document.querySelector('#northScene'),host:document.querySelector('#northCanvas'),dir:document.querySelector('#northDir'),edge:document.querySelector('#northEdge')}};
const statusEl=document.querySelector('#status'), southBtn=document.querySelector('#southBtn'),northBtn=document.querySelector('#northBtn'),resetBtn=document.querySelector('#resetBtn');
function initialState(){return {mode:'south',x:.50,y:.72,angle:90,flash:false};}
let state=initialState(), flashTimer=0, destroyed=false;
function targetAngle(mode){return mode==='south'?0:180;}
function angleGap(a,b){return Math.abs(((a-b+540)%360)-180);}
function isDone(s){return s.y<.34&&angleGap(s.angle,targetAngle(s.mode))<=12;}
const views={};
function makeView(key){
 const host=S[key].host, w=host.clientWidth||720,h=host.clientHeight||470;
 const stage=new Konva.Stage({container:host,width:w,height:h}); const layer=new Konva.Layer(); stage.add(layer);
 const horizon=new Konva.Line({points:[34,h*.73,w-34,h*.73],stroke:'#536671',strokeWidth:2});
 const arrow=new Konva.Arrow({points:key==='south'?[w*.5,h*.73,w*.72,h*.73]:[w*.5,h*.73,w*.28,h*.73],stroke:'#8FA7B3',fill:'#8FA7B3',strokeWidth:4,pointerLength:13,pointerWidth:13});
 const person=new Konva.Group(); person.add(new Konva.Circle({x:0,y:-92,radius:25,fill:'#263440'}),new Konva.Line({points:[0,-66,0,20],stroke:'#263440',strokeWidth:38,lineCap:'round'}),new Konva.Line({points:[-8,-52,-58,-112],stroke:'#536671',strokeWidth:12,lineCap:'round'}),new Konva.Line({points:[8,-52,58,-112],stroke:'#536671',strokeWidth:12,lineCap:'round'}));
 const connector=new Konva.Line({stroke:'#536671',strokeWidth:3,dash:[9,8]});
 const chart=new Konva.Group({draggable:true});
 chart.add(new Konva.Circle({radius:72,fill:'#101923',stroke:'#8FA7B3',strokeWidth:3}),new Konva.Line({points:[-44,24,-5,-28,42,16],stroke:'#8FA7B3',strokeWidth:1.5}),new Konva.Line({points:[-5,-28,25,-42],stroke:'#8FA7B3',strokeWidth:1.5}),new Konva.Circle({x:-44,y:24,radius:5,fill:'#8FA7B3'}),new Konva.Circle({x:-5,y:-28,radius:7,fill:'#8FA7B3'}),new Konva.Circle({x:42,y:16,radius:4,fill:'#8FA7B3'}),new Konva.Line({name:'edge',points:[0,0,0,-72],stroke:'#8FA7B3',strokeWidth:5}));
 layer.add(horizon,arrow,connector,person,chart);layer.draw();
 chart.on('dragmove',()=>{if(state.mode!==key)return; const p=chart.position(); dispatch({type:'drag',x:p.x/w,y:p.y/h,angle:targetAngle(key)+(p.x/w-.5)*150});});
 chart.on('dragend',()=>dispatch({type:'commit'}));
 views[key]={stage,layer,arrow,person,connector,chart,w,h};
}
function transition(s,a){
 if(a.type==='mode')return {...s,mode:a.mode,flash:false};
 if(a.type==='drag')return {...s,x:Math.max(.18,Math.min(.82,a.x)),y:Math.max(.20,Math.min(.72,a.y)),angle:(a.angle+360)%360,flash:false};
 if(a.type==='nudge')return {...s,angle:(s.angle+a.delta+360)%360,flash:false};
 if(a.type==='toggleHeight')return {...s,y:s.y<.34?.72:.25,flash:false};
 if(a.type==='commit'&&isDone(s))return {...s,flash:true};
 return s;
}
function dispatch(a){state=transition(state,a);render();if(state.flash){clearTimeout(flashTimer);flashTimer=setTimeout(()=>{state={...state,flash:false};render();},220);}}
function render(){
 const done=isDone(state);
 ['south','north'].forEach(key=>{const v=views[key],active=state.mode===key,target=targetAngle(key);S[key].scene.classList.toggle('active',active);S[key].scene.querySelector('.scene-tag').textContent=active?'当前练习':'对照';
  const px=state.x*v.w,py=state.y*v.h;v.chart.position({x:px,y:py});v.chart.rotation(state.angle);v.chart.draggable(active);
  const mirror=key==='north'?-1:1;v.person.position({x:v.w*.5,y:v.h*.73});v.person.scaleX(mirror);v.arrow.stroke(active?'#FFB347':'#8FA7B3');v.arrow.fill(active?'#FFB347':'#8FA7B3');
  const rad=(state.angle-90)*Math.PI/180,ex=px+Math.cos(rad)*72,ey=py+Math.sin(rad)*72;const tx=key==='south'?v.w*.72:v.w*.28,ty=v.h*.73;v.connector.points([ex,ey,tx,ty]);v.connector.stroke(active&&done?'#FFB347':'#536671');v.connector.dash(active&&done?[]:[9,8]);v.connector.opacity(active?1:.38);
  v.chart.findOne('.edge').stroke(active&&done?'#FFB347':'#8FA7B3');v.layer.batchDraw();S[key].dir.style.left=(tx-42)+'px';S[key].edge.style.left=(ex-46)+'px';S[key].edge.style.top=(ey-12)+'px';S[key].host.setAttribute('aria-valuenow',String(Math.round((1-state.y/.72)*55+(1-angleGap(state.angle,target)/180)*45)));S[key].host.setAttribute('aria-valuetext',(state.y<.34?'已举过头顶':'仍在胸前')+'，方向偏差 '+Math.round(angleGap(state.angle,target))+' 度');
 });
 southBtn.classList.toggle('active',state.mode==='south');northBtn.classList.toggle('active',state.mode==='north');southBtn.setAttribute('aria-pressed',state.mode==='south');northBtn.setAttribute('aria-pressed',state.mode==='north');
 statusEl.classList.toggle('ok',done);statusEl.textContent=done?(state.mode==='south'?'姿势已对：抬头即可逐区比较':'姿势已对：转身后方向边缘也已换位'):'先举过头顶，再让方向名称朝向同一真实方向。';
}
function bindHost(key){S[key].host.addEventListener('keydown',e=>{if(state.mode!==key)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();e.stopPropagation();dispatch({type:'nudge',delta:e.key==='ArrowRight'?3:-3});}else if(e.key===' '){e.preventDefault();e.stopPropagation();dispatch({type:'toggleHeight'});}}, {signal:events.signal});}
makeView('south');makeView('north');bindHost('south');bindHost('north');
southBtn.addEventListener('click',()=>dispatch({type:'mode',mode:'south'}),{signal:events.signal});northBtn.addEventListener('click',()=>dispatch({type:'mode',mode:'north'}),{signal:events.signal});resetBtn.addEventListener('click',()=>{clearTimeout(flashTimer);state=initialState();render();southBtn.focus();statusEl.textContent='已恢复：面向南方，星图回到胸前错误姿势。';},{signal:events.signal});
cleanups.push(Deck.onResize(()=>{location.reload();}));
function destroy(){if(destroyed)return;destroyed=true;events.abort();clearTimeout(flashTimer);while(cleanups.length)cleanups.pop()();Object.values(views).forEach(v=>v.stage.destroy());}
window.addEventListener('pagehide',destroy,{once:true});render();
})();
</script>
</body>
</html>
