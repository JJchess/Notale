<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="07" data-total="19">
<div id="stage">
  <style>
    .p07-head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-bottom:18px}
    .p07-kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.16em;color:var(--star);margin:0 0 8px}
    .p07-head h1{font:700 var(--fs-h1)/1.2 var(--font-sans);margin:0;max-width:900px}
    .p07-step{display:flex;align-items:center;gap:10px;font:var(--fs-sec)/1.4 var(--font-sans);color:var(--star);padding-bottom:3px}.p07-rule{padding:4px 9px;border:1px solid var(--line);border-radius:999px;font-size:var(--fs-label)}
    .p07-step b{color:var(--accent);font-size:var(--fs-h2)}
    .p07-main{flex:1;display:flex;flex-direction:column;min-height:0}
    .p07-triptych{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;flex:1;min-height:0;align-items:stretch}
    .p07-panel{position:relative;display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:18px;overflow:hidden}
    button.p07-panel{color:var(--text);font:inherit;text-align:left;cursor:pointer;appearance:none;width:100%}
    button.p07-panel:hover,button.p07-panel:focus-visible,button.p07-panel.is-selected{border-color:var(--accent);outline:none;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
    .p07-label{display:flex;align-items:center;justify-content:space-between;font:700 var(--fs-h2)/1.25 var(--font-sans);margin-bottom:6px}
    .p07-label small{font:var(--fs-label)/1.2 var(--font-sans);color:var(--star)}
    .p07-svg{width:100%;flex:1;min-height:290px;display:block}
    .tri{fill:none;stroke:var(--star);stroke-width:1.5;vector-effect:non-scaling-stroke}
    .bright{fill:var(--star)}
    .dim{fill:var(--star);opacity:.22;transition:opacity 220ms ease}
    .is-right .dim,.p07-reference.show-detail .dim{opacity:.8}
    .trace{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:140;stroke-dashoffset:140;opacity:0}
    .is-right .trace{opacity:1;animation:p07draw 180ms ease forwards}
    .is-right .trace.t2{animation-delay:90ms}.is-right .trace.t3{animation-delay:180ms}
    .wrong-ring{fill:none;stroke:var(--accent);stroke-width:2.4;vector-effect:non-scaling-stroke;opacity:0;transform-box:fill-box;transform-origin:center}
    .is-wrong .wrong-ring{opacity:1;animation:p07pulse 300ms ease}
    .match{stroke:var(--star);stroke-width:1.3;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;opacity:0}
    .is-right .match{opacity:.8;transition:opacity 220ms 420ms}
    @keyframes p07draw{to{stroke-dashoffset:0}}@keyframes p07pulse{50%{transform:scale(1.25)}}
    .p07-feedback{height:68px;display:flex;align-items:center;gap:14px;margin-top:14px;padding:0 18px;border-left:3px solid var(--line);font:var(--fs-body)/1.4 var(--font-sans)}
    .p07-feedback strong{color:var(--accent)}
    .p07-bottom{display:flex;align-items:center;justify-content:space-between;gap:30px;margin-top:14px}
    .p07-take{font:700 var(--fs-lead)/1.4 var(--font-sans);max-width:1020px;margin:0}
    .p07-reset{white-space:nowrap}
    .p07-next{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);font:var(--fs-sec)/1.35 var(--font-sans);color:var(--star)}
    @media (prefers-reduced-motion:reduce){.dim,.match{transition:none}.is-right .trace,.is-wrong .wrong-ring{animation:none;stroke-dashoffset:0}}
  </style>

  <header class="p07-head">
    <div><p class="p07-kicker">MATCH THE TRIANGLE</p><h1>先抓住三颗亮星的形状，再看周围暗星</h1></div>
    <div class="p07-step" aria-label="观察顺序"><span class="p07-rule">同一尺度</span><span class="p07-rule">同一基线</span><span class="p07-rule">先骨架后细节</span><b>①</b>亮星骨架 <span>→</span> <b>②</b>暗星细节</div>
  </header>

  <main class="p07-main min0" aria-label="三联局部星图匹配">
    <div class="p07-triptych k-classification" id="choices">
      <section class="p07-panel p07-reference" id="reference">
        <div class="p07-label">纸图 <small>基准</small></div>
        <svg class="p07-svg" viewBox="0 0 100 100" role="img" aria-label="纸图：三颗亮星组成一个三角形，周围有四颗暗星">
          <path class="tri" d="M20 72 L48 22 L82 62 Z"/>
          <g class="dim"><circle cx="31" cy="43" r="1.8"/><circle cx="61" cy="39" r="1.6"/><circle cx="69" cy="78" r="2"/><circle cx="89" cy="31" r="1.5"/></g>
          <g class="bright"><circle cx="20" cy="72" r="5"/><circle cx="48" cy="22" r="4"/><circle cx="82" cy="62" r="3.5"/></g>
        </svg>
      </section>

      <button class="p07-panel" id="choice-a" type="button" data-choice="a" aria-pressed="false" aria-describedby="feedback">
        <div class="p07-label">天空甲 <small>候选</small></div>
        <svg class="p07-svg" viewBox="0 0 100 100" aria-hidden="true">
          <path class="tri" d="M18 68 L46 18 L80 58 Z"/>
          <g class="dim"><circle cx="29" cy="39" r="1.8"/><circle cx="59" cy="35" r="1.6"/><circle cx="67" cy="74" r="2"/><circle cx="87" cy="27" r="1.5"/></g>
          <g class="match"><path d="M26 42 L31 43"/><path d="M56 38 L61 39"/><path d="M64 77 L69 78"/><path d="M84 30 L89 31"/></g>
          <g class="bright"><circle cx="18" cy="68" r="5"/><circle cx="46" cy="18" r="4"/><circle cx="80" cy="58" r="3.5"/></g>
          <path class="trace t1" d="M18 68 L46 18"/><path class="trace t2" d="M46 18 L80 58"/><path class="trace t3" d="M80 58 L18 68"/>
        </svg>
      </button>

      <button class="p07-panel" id="choice-b" type="button" data-choice="b" aria-pressed="false" aria-describedby="feedback">
        <div class="p07-label">天空乙 <small>候选</small></div>
        <svg class="p07-svg" viewBox="0 0 100 100" aria-hidden="true">
          <path class="tri" d="M18 68 L46 18 L74 70 Z"/>
          <g class="dim"><circle cx="27" cy="37" r="1.8"/><circle cx="60" cy="34" r="1.6"/><circle cx="65" cy="79" r="2"/><circle cx="89" cy="28" r="1.5"/></g>
          <g class="bright"><circle cx="18" cy="68" r="5"/><circle cx="46" cy="18" r="4"/><circle cx="74" cy="70" r="3.5"/></g>
          <circle class="wrong-ring" cx="74" cy="70" r="7"/>
        </svg>
      </button>
    </div>

    <div class="p07-feedback hint" id="feedback" aria-live="polite"><strong>先看亮星：</strong><span>点选天空甲或天空乙；聚焦候选后也可用左右键切换，按 Enter 确认。</span></div>
    <div class="p07-bottom"><p class="p07-take">三颗亮星的相对远近与夹角对上，才说明找到了同一片恒星背景。</p><button class="btn p07-reset" id="reset" type="button">重新看</button></div>
    <p class="p07-next">下一问　星形对上了，为什么现场仍可能少掉几颗星？</p>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded',()=>{
    Deck.init({index:7,total:19});
    const initialState=()=>({selected:null});
    let state=initialState();
    const a=document.getElementById('choice-a'), b=document.getElementById('choice-b');
    const ref=document.getElementById('reference'), feedback=document.getElementById('feedback');
    const reset=document.getElementById('reset'), controls=[a,b];
    const events=new AbortController();
    function transition(s,action){
      if(action.type==='select'&&(action.value==='a'||action.value==='b')) return {selected:action.value};
      if(action.type==='reset') return initialState();
      return s;
    }
    function render(s){
      controls.forEach(el=>{const on=el.dataset.choice===s.selected;el.classList.toggle('is-selected',on);el.classList.toggle('is-right',on&&s.selected==='a');el.classList.toggle('is-wrong',on&&s.selected==='b');el.setAttribute('aria-pressed',String(on));});
      ref.classList.toggle('show-detail',s.selected==='a');
      feedback.innerHTML=s.selected==='a'?'<strong>形状对上：</strong><span>现在再核对周围暗星；四颗暗星也落在相同的相对位置。</span>':s.selected==='b'?'<strong>还没对上：</strong><span>第三颗亮星偏低，两条斜边的比例变了。可以立即改选。</span>':'<strong>先看亮星：</strong><span>点选天空甲或天空乙；聚焦候选后也可用左右键切换，按 Enter 确认。</span>';
    }
    function dispatch(action){const next=transition(state,action);if(next===state)return;state=next;render(state)}
    controls.forEach((el,i)=>{
      el.addEventListener('click',()=>dispatch({type:'select',value:el.dataset.choice}),{signal:events.signal});
      el.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();e.stopPropagation();const next=controls[i===0?1:0];next.focus();dispatch({type:'select',value:next.dataset.choice});},{signal:events.signal});
    });
    reset.addEventListener('click',()=>{dispatch({type:'reset'});a.focus();feedback.setAttribute('aria-label','已重新开始，当前没有选择');},{signal:events.signal});
    let destroyed=false;function destroy(){if(destroyed)return;destroyed=true;events.abort()}
    window.addEventListener('pagehide',destroy,{once:true});
    render(state);
  },{once:true});
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
