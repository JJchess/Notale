<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="08" data-total="19">
<div id="stage">
<style>
  #stage{position:relative;gap:14px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:28px}
  .kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.18em;color:var(--attention)}
  h1{margin:7px 0 0;max-width:1100px;font:600 var(--fs-h1)/1.22 var(--font-sans);color:var(--text)}
  .modebox{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
  .modebox .hint{margin:0}
  .btns{display:flex;gap:8px}
  .btn{min-height:42px;padding:8px 16px;font-size:var(--fs-label)}
  .btn[aria-pressed="true"]{border-color:var(--attention);color:var(--attention)}
  .main{display:grid;grid-template-columns:minmax(0,1.82fr) minmax(390px,.86fr);gap:22px;flex:1;min-height:0}
  .sky-panel{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#05080d;min-height:0}
  .sky-panel svg{display:block;width:100%;height:100%}
  .sky-label{position:absolute;left:18px;top:16px;font:500 var(--fs-label)/1.3 var(--font-sans);color:var(--framework);background:rgba(7,11,18,.82);padding:7px 10px;border-radius:5px}
  .plot-note{position:absolute;left:18px;bottom:16px;font:400 var(--fs-label)/1.4 var(--font-sans);color:var(--text);background:rgba(7,11,18,.88);padding:8px 11px;border-left:3px solid var(--attention);max-width:520px}
  .star{fill:var(--framework);stroke:none}.chart-star{opacity:.3}.live-star{fill:#dce6e9}
  .guide{fill:none;stroke:var(--framework);stroke-width:1.5;opacity:.44}
  .horizon{stroke:var(--framework);stroke-width:2;stroke-dasharray:8 8;opacity:.75}
  .ground,.obstacle{fill:#111821}.obstacle{stroke:#26313b;stroke-width:2}
  .target-ring{fill:none;stroke:var(--attention);stroke-width:4}
  .hit{fill:transparent;cursor:pointer;outline:none}.hit:focus-visible{stroke:var(--attention);stroke-width:4}
  .mode-open .building,.mode-open .tree{display:none}.mode-building .tree{display:none}.mode-tree .building{display:none}
  .mode-building [data-live="A"],.mode-tree [data-live="B"], [data-live="C"]{visibility:hidden}
  .ledger{display:flex;flex-direction:column;min-height:0;padding-left:22px;border-left:1px solid var(--line)}
  .ledger h2{margin:0 0 7px;font:600 var(--fs-h2)/1.25 var(--font-sans)}
  .status{margin:0 0 12px;min-height:48px;font:500 var(--fs-lead)/1.4 var(--font-sans);color:var(--attention)}
  .records{display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .record{display:grid;grid-template-columns:126px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:var(--fs-sec);line-height:1.35}
  .record strong{color:var(--framework);font-weight:600}.record.current strong{color:var(--attention)}
  .record.current{border-left:3px solid var(--attention);padding-left:10px}
  .note{margin:12px 0 0;padding:11px 13px;font-size:var(--fs-sec);line-height:1.42}
  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:auto;padding-top:12px;font-size:var(--fs-label)}
  .legend span{display:inline-flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:var(--framework)}
  .ring{width:14px;height:14px;border:2px solid var(--attention);border-radius:50%}.block{width:16px;height:11px;background:#151e28;border:1px solid #33404b}
  .bottom{display:flex;justify-content:space-between;align-items:center;gap:28px;border-top:1px solid var(--line);padding-top:12px}
  .takeaway{font:600 var(--fs-lead)/1.35 var(--font-sans);margin:0}.next{font:400 var(--fs-sec)/1.4 var(--font-sans);color:var(--framework);margin:0;text-align:right;max-width:600px}
</style>
<header class="top">
  <div><div class="kicker">VISIBLE SKY</div><h1>星图没错：地平线与遮挡物会删掉一部分现场天空</h1></div>
  <div class="modebox"><p class="hint">切换前景，观察同一组星点哪些露出</p><div class="btns" role="group" aria-label="遮挡比对"><button class="btn" data-mode="open">开阔地平线</button><button class="btn" data-mode="building">建筑</button><button class="btn" data-mode="tree">树木</button><button class="btn" id="reset">重置</button></div></div>
</header>
<main class="main k-generalization min0">
  <section class="sky-panel cvbox min0" aria-label="同一星图与现场遮挡的叠合比对">
    <div class="sky-label">固定星图层 ＋ 可切换现场前景</div>
    <svg id="sky" class="mode-building" viewBox="0 0 940 570" role="img" aria-labelledby="skyTitle skyDesc">
      <title id="skyTitle">固定星场与现场遮挡叠合图</title><desc id="skyDesc">三颗高处定位星构成固定三角形，低空星可能被楼顶、树冠或地平线遮住。</desc>
      <path class="guide" d="M230 130 L465 72 L650 190 Z"/>
      <g aria-hidden="true">
        <circle class="star chart-star" cx="230" cy="130" r="7"/><circle class="star chart-star" cx="465" cy="72" r="9"/><circle class="star chart-star" cx="650" cy="190" r="6"/>
        <circle class="star chart-star" cx="285" cy="405" r="7"/><circle class="star chart-star" cx="696" cy="337" r="6"/><circle class="star chart-star" cx="518" cy="508" r="7"/><circle class="star chart-star" cx="820" cy="270" r="5"/>
      </g>
      <g aria-hidden="true"><circle class="star live-star" cx="230" cy="130" r="7"/><circle class="star live-star" cx="465" cy="72" r="9"/><circle class="star live-star" cx="650" cy="190" r="6"/><circle class="star live-star" data-live="A" cx="285" cy="405" r="7"/><circle class="star live-star" data-live="B" cx="696" cy="337" r="6"/><circle class="star live-star" data-live="C" cx="518" cy="508" r="7"/><circle class="star live-star" cx="820" cy="270" r="5"/></g>
      <line class="horizon" x1="0" y1="458" x2="940" y2="458"/><rect class="ground" x="0" y="458" width="940" height="112"/>
      <g class="building"><path class="obstacle" d="M0 458V430H145V385H355V458Z"/><path class="obstacle" d="M355 458V438H410V458Z"/></g>
      <g class="tree"><path class="obstacle" d="M610 458V400 Q560 374 606 342 Q575 300 630 292 Q646 246 690 278 Q735 245 752 297 Q806 310 773 350 Q807 392 750 405 V458Z"/><rect class="obstacle" x="672" y="386" width="34" height="72"/></g>
      <circle id="target" class="target-ring" cx="285" cy="405" r="18"/>
      <g aria-label="可核对星点"><circle class="hit" tabindex="0" role="button" aria-label="低空星 A" data-star="A" cx="285" cy="405" r="29"/><circle class="hit" tabindex="0" role="button" aria-label="低空星 B" data-star="B" cx="696" cy="337" r="29"/><circle class="hit" tabindex="0" role="button" aria-label="地平线下星 C" data-star="C" cx="518" cy="508" r="29"/><circle class="hit" tabindex="0" role="button" aria-label="开阔天空星 D" data-star="D" cx="820" cy="270" r="29"/><circle class="hit" tabindex="0" role="button" aria-label="三颗定位星" data-star="tri" cx="465" cy="130" r="40"/></g>
    </svg>
    <div class="plot-note">星图层始终不动；暗色轮廓只是在现场挡住视线。</div>
  </section>
  <aside class="ledger min0" aria-labelledby="recordTitle"><h2 id="recordTitle">现场比对记录</h2><p id="status" class="status" aria-live="polite">低空星 A：图上有；现场被楼顶挡住</p>
    <div class="records"><div class="record" data-row="tri"><strong>三颗定位星</strong><span>三角形仍能对上</span></div><div class="record current" data-row="A"><strong>低空星 A</strong><span></span></div><div class="record" data-row="B"><strong>低空星 B</strong><span></span></div><div class="record" data-row="C"><strong>地平线下星 C</strong><span>图上有；此刻在地平线下</span></div><div class="record" data-row="D"><strong>开阔天空星 D</strong><span>图上与现场都能找到</span></div></div>
    <div class="panel q note">先用露出的三颗亮星确认方向与星形，再判断缺失星点是否落在遮挡轮廓内。</div>
    <div class="legend"><span><i class="dot"></i>星图给出的恒星</span><span><i class="ring"></i>当前核对位置</span><span><i class="block"></i>现场遮挡</span></div>
  </aside>
</main>
<footer class="bottom"><p class="takeaway">只比较未被遮挡的天空；看不见不等于图上画错。</p><p class="next">下一问：对准了可见星形之后，应该去天空的哪一条带里找行星？</p></footer>
<script type="module">
  Deck.init({index:8,total:19});
  const initialState=()=>({mode:'building',selected:'A'}); let state=initialState();
  const sky=document.querySelector('#sky'), status=document.querySelector('#status'), target=document.querySelector('#target');
  const coords={A:[285,405],B:[696,337],C:[518,508],D:[820,270],tri:[465,130]};
  const labels={A:'低空星 A',B:'低空星 B',C:'地平线下星 C',D:'开阔天空星 D',tri:'三颗定位星'};
  const reason=(id,mode)=>id==='tri'?'三角形仍能对上':id==='C'?'图上有；此刻在地平线下':id==='D'?'图上与现场都能找到':id==='A'&&mode==='building'?'图上有；现场被楼顶挡住':id==='B'&&mode==='tree'?'图上有；现场被树冠挡住':'无遮挡，可继续用它对图';
  function render(){sky.setAttribute('class','mode-'+state.mode);document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));const [x,y]=coords[state.selected];target.setAttribute('cx',x);target.setAttribute('cy',y);status.textContent=labels[state.selected]+'：'+reason(state.selected,state.mode);document.querySelectorAll('[data-row]').forEach(r=>{r.classList.toggle('current',r.dataset.row===state.selected);const span=r.querySelector('span');if(r.dataset.row==='A'||r.dataset.row==='B')span.textContent=reason(r.dataset.row,state.mode)});}
  function dispatch(action){state=action.type==='reset'?initialState():action.type==='mode'?{...state,mode:action.value}:{...state,selected:action.value};render()}
  const events=new AbortController(), opt={signal:events.signal};
  document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>dispatch({type:'mode',value:b.dataset.mode}),opt));
  document.querySelectorAll('[data-star]').forEach(el=>{el.addEventListener('click',()=>dispatch({type:'select',value:el.dataset.star}),opt);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();dispatch({type:'select',value:el.dataset.star})}},opt)});
  document.querySelector('#reset').addEventListener('click',()=>{dispatch({type:'reset'});document.querySelector('[data-mode="building"]').focus()},opt);
  let destroyed=false;function destroy(){if(destroyed)return;destroyed=true;events.abort()}window.addEventListener('pagehide',destroy,{once:true});render();
</script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
