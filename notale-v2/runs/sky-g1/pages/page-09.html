<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行星只需在太阳路径附近找</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:20px;color:var(--text)}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;flex:0 0 96px}
.kicker{margin:0 0 8px;color:var(--framework);font:600 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.12em}
h1{margin:0;font:650 var(--fs-h1)/1.15 var(--font-sans)}
.leadline{max-width:590px;margin:0 0 3px;font:var(--fs-body)/1.5 var(--font-sans);color:var(--text)}
.stage-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;flex:1;min-height:0;position:relative}
.stage-cards:before{content:"";position:absolute;left:15%;right:15%;top:47px;border-top:1px solid var(--line);z-index:0}
.stage-cards:after{content:"范围逐级缩小 →";position:absolute;right:18px;top:27px;color:var(--framework);font:var(--fs-label)/1 var(--font-sans);letter-spacing:.08em}
.stage-card{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0;min-height:0}
.card-head{display:flex;align-items:center;gap:10px;min-height:32px}
.step{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--framework);border-radius:50%;background:var(--bg);color:var(--framework);font:600 var(--fs-label)/1 var(--font-mono)}
h2{margin:0;font:600 var(--fs-h2)/1.2 var(--font-sans)}
.sky{position:relative;flex:1;min-height:0;border:1px solid color-mix(in srgb,var(--framework) 45%,transparent);border-radius:6px;overflow:hidden;background:var(--bg)}
.sky svg{display:block;width:100%;height:100%}.stars circle{fill:var(--framework);stroke:none}.constellations{fill:none;stroke:var(--framework);stroke-width:1.5;opacity:.32}.ecliptic{fill:none;stroke:var(--framework);stroke-width:3;stroke-dasharray:13 10}.e-label{fill:var(--framework);font:15px var(--font-serif)}
.sky-note{position:absolute;left:14px;bottom:12px;margin:0;color:var(--framework);font:var(--fs-label)/1.3 var(--font-sans);background:rgba(7,11,18,.84);padding:5px 8px;border-radius:4px}
.band{fill:rgba(143,167,179,.13)}.bound{stroke:var(--attention);stroke-width:3}.handle{fill:var(--bg);stroke:var(--attention);stroke-width:3}.handle-hit{fill:transparent;cursor:ns-resize}.band-label{fill:var(--text);font:600 15px var(--font-sans)}
.interactive{outline:none}.interactive:focus-visible{outline:3px solid var(--focus);outline-offset:-4px}.interactive.done .bound,.interactive.done .handle{stroke:var(--framework)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}.edge-ctl{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:6px}.reading{font:var(--fs-label)/1.2 var(--font-sans);white-space:nowrap}.mini{width:34px;height:32px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--text);font:600 20px/1 var(--font-sans);cursor:pointer}.mini:focus-visible,.reset:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.scale{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--framework);font:var(--fs-label)/1.3 var(--font-sans)}
.hint{margin:0;padding:9px 11px;border-left:3px solid var(--attention);color:var(--text);font:var(--fs-label)/1.35 var(--font-sans)}
.feedback{min-height:43px;margin:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:var(--fs-sec)/1.35 var(--font-sans)}.feedback.done{border-color:var(--framework);color:var(--text)}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:22px;flex:0 0 78px;border-top:1px solid var(--line);padding-top:14px}.takeaway{margin:0;max-width:980px;font:600 var(--fs-lead)/1.4 var(--font-sans)}.next{margin:0;color:var(--framework);font:var(--fs-sec)/1.35 var(--font-sans);text-align:right}.reset{align-self:center;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--text);font:var(--fs-label)/1.2 var(--font-sans);cursor:pointer}
.note{margin:0;color:var(--framework);font:var(--fs-label)/1.35 var(--font-sans)}
</style>
</head>
<body data-page="09" data-total="19">
<div id="stage">
<header><div><p class="kicker">STEP 3 · 缩小天空</p><h1>行星只需在太阳路径附近找</h1></div><p class="leadline">把搜索范围一层层收窄：先认出太阳的路径，再给这条路径留出上下余量。</p></header>
<main class="stage-cards k-classification min0" aria-label="从整片天空逐级缩小到黄道搜索带">
<section class="stage-card panel min0"><div class="card-head"><span class="step">1</span><h2>先看整片天空</h2></div><div class="sky"><svg viewBox="0 0 440 430" aria-hidden="true"><use href="#field"></use></svg><p class="sky-note">搜索范围太大</p></div></section>
<section class="stage-card panel min0"><div class="card-head"><span class="step">2</span><h2>找到黄道</h2></div><div class="sky"><svg viewBox="0 0 440 430" aria-hidden="true"><use href="#field"></use><path class="ecliptic" d="M0 215H440"/><text class="e-label" x="352" y="203">黄道</text></svg><p class="sky-note">太阳一年中经过的路径</p></div></section>
<section class="stage-card panel min0"><div class="card-head"><span class="step">3</span><h2>给路径加宽</h2></div><div id="surface" class="sky interactive no-pan" tabindex="0" role="group" aria-label="拖动上下边界，或使用下方按钮调整搜索带"><svg viewBox="0 0 440 430" aria-hidden="true"><use href="#field"></use><rect id="band" class="band" x="0" width="440"/><path class="ecliptic" d="M0 215H440"/><text class="e-label" x="370" y="207">黄道</text><line id="upperLine" class="bound" x1="0" x2="440"/><line id="lowerLine" class="bound" x1="0" x2="440"/><circle id="upperHandle" class="handle" cx="220" r="9"/><circle id="lowerHandle" class="handle" cx="220" r="9"/><circle id="upperHit" class="handle-hit" cx="220" r="24" data-edge="upper"/><circle id="lowerHit" class="handle-hit" cx="220" r="24" data-edge="lower"/><text id="bandLabel" class="band-label" x="18">优先搜索带</text></svg></div>
<p class="hint">拖动两条边界，让黄道上下各留约一拳；也可用按钮调整。</p>
<div class="controls"><div class="edge-ctl"><span id="upperRead" class="reading">黄道上方 3°</span><button class="mini" data-edge="upper" data-delta="-1" aria-label="缩小上边界">−</button><button class="mini" data-edge="upper" data-delta="1" aria-label="扩大上边界">+</button></div><div class="edge-ctl"><span id="lowerRead" class="reading">黄道下方 3°</span><button class="mini" data-edge="lower" data-delta="-1" aria-label="缩小下边界">−</button><button class="mini" data-edge="lower" data-delta="1" aria-label="扩大下边界">+</button></div></div>
<div class="scale"><span>伸臂一拳 ≈ 10°</span><button id="reset" class="reset">重新标记</button></div><p id="feedback" class="feedback" aria-live="polite">目前只留了较窄的范围。先把任一侧向外扩展。</p><p class="note">这是便于肉眼筛选的教学范围，不是天空中的实体边界。</p></section>
</main>
<div class="bottom"><p class="takeaway">沿黄道向上、向下各留约一拳宽，就是今晚优先搜索的天空带。</p><p class="next">下一问：日期改变时，行星会在这条带里怎样换位置？</p></div>
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><g id="field"><path class="constellations" d="M35 85L92 118L138 72L196 131L255 98L310 144L382 96M50 330L112 286L174 325L238 276L305 318L390 270"/><g class="stars"><circle cx="35" cy="85" r="3"/><circle cx="92" cy="118" r="5"/><circle cx="138" cy="72" r="2.5"/><circle cx="196" cy="131" r="4"/><circle cx="255" cy="98" r="3"/><circle cx="310" cy="144" r="5"/><circle cx="382" cy="96" r="3"/><circle cx="50" cy="330" r="4"/><circle cx="112" cy="286" r="2.5"/><circle cx="174" cy="325" r="5"/><circle cx="238" cy="276" r="3"/><circle cx="305" cy="318" r="4"/><circle cx="390" cy="270" r="2.5"/><circle cx="72" cy="188" r="2"/><circle cx="154" cy="222" r="3"/><circle cx="278" cy="201" r="2"/><circle cx="356" cy="235" r="3"/></g></g></defs></svg>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
(()=>{Deck.init({index:9,total:19});
const initialState=()=>({upper:3,lower:3,active:null,changed:false});let state=initialState();
const $=id=>document.getElementById(id), surface=$('surface'), feedback=$('feedback'), events=new AbortController();const sig={signal:events.signal};
const yFor=d=>215-d*(215/18);
function transition(s,a){if(a.type==='set'){const v=Math.max(2,Math.min(15,Math.round(a.value)));const next={...s,[a.edge]:v,changed:true};if(next.upper>=8&&next.upper<=10&&next.lower>=8&&next.lower<=10){next.upper=9;next.lower=9}return next}if(a.type==='active')return {...s,active:a.edge};if(a.type==='reset')return initialState();return s}
function render(){const uy=yFor(state.upper),ly=430-yFor(state.lower);$('band').setAttribute('y',uy);$('band').setAttribute('height',ly-uy);[['upper',uy],['lower',ly]].forEach(([e,y])=>{$(e+'Line').setAttribute('y1',y);$(e+'Line').setAttribute('y2',y);$(e+'Handle').setAttribute('cy',y);$(e+'Hit').setAttribute('cy',y)});$('bandLabel').setAttribute('y',uy+24);$('upperRead').textContent=`黄道上方 ${state.upper}°`;$('lowerRead').textContent=`黄道下方 ${state.lower}°`;const done=[state.upper,state.lower].every(v=>v===9);surface.classList.toggle('done',done);feedback.classList.toggle('done',done);feedback.textContent=done?'搜索带已标好：沿黄道上下各约一拳。':state.changed?'再给这一侧多留一些天空。':'目前只留了较窄的范围。先把任一侧向外扩展。'}
function dispatch(a){state=transition(state,a);render()}
let pointer=null,edge=null;surface.addEventListener('pointerdown',e=>{const hit=e.target.closest('[data-edge]');if(!hit)return;pointer=e.pointerId;edge=hit.dataset.edge;surface.setPointerCapture(pointer);dispatch({type:'active',edge});move(e)},{...sig});
function move(e){if(e.pointerId!==pointer)return;const p=Deck.pt(surface,e);const value=edge==='upper'?(215-p.y)*18/215:(p.y-215)*18/215;dispatch({type:'set',edge,value})}
surface.addEventListener('pointermove',move,{...sig});function end(e){if(e.pointerId!==pointer)return;pointer=null;edge=null;dispatch({type:'active',edge:null})}surface.addEventListener('pointerup',end,{...sig});surface.addEventListener('pointercancel',end,{...sig});
document.querySelectorAll('.mini').forEach(b=>b.addEventListener('click',()=>dispatch({type:'set',edge:b.dataset.edge,value:state[b.dataset.edge]+Number(b.dataset.delta)}),sig));
surface.addEventListener('keydown',e=>{const d=e.key==='ArrowUp'?1:e.key==='ArrowDown'?-1:0;if(!d)return;e.preventDefault();e.stopPropagation();const target=state.active||'upper';dispatch({type:'set',edge:target,value:state[target]+d})},sig);
$('reset').addEventListener('click',()=>{state=initialState();render();surface.focus()},sig);function destroy(){events.abort();pointer=null}window.addEventListener('pagehide',destroy,{once:true});render()})();
</script>
</body></html>
