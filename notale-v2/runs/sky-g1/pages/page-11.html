<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="11" data-total="19">
<div id="stage">
<style>
  #stage{gap:18px}
  .p11-head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
  .p11-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.18em;color:var(--accent);margin-bottom:10px}
  .p11-head h1{margin:0;font:700 var(--fs-h1)/1.2 var(--font-sans);color:var(--text)}
  .p11-progress{font:600 var(--fs-body)/1.2 var(--font-mono);color:var(--text);padding-bottom:4px;white-space:nowrap}
  .p11-main{flex:1;display:flex;gap:22px;min-height:0}
  .p11-chart{flex:1;display:flex;flex-direction:column;min-width:0;padding:18px 22px 16px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--surface) 78%,transparent)}
  .p11-cols{display:grid;grid-template-columns:1fr 1fr;gap:0;flex:1;min-height:0}
  .p11-col{position:relative;min-width:0}
  .p11-col:first-child{border-right:1px solid var(--line)}
  .p11-colhead{height:48px;display:flex;align-items:flex-start;justify-content:center;font:650 var(--fs-h2)/1.2 var(--font-sans)}
  .p11-col:first-child .p11-colhead{color:var(--framework)}
  .p11-col:last-child .p11-colhead{color:var(--text)}
  .p11-field{position:absolute;left:18px;right:18px;top:48px;bottom:0}
  .p11-band{position:absolute;left:0;right:0;top:27.5%;height:45%;background:rgba(143,167,179,.18);border-top:2px dashed var(--framework);border-bottom:2px dashed var(--framework)}
  .p11-rulers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .p11-rulers line{stroke:var(--framework);stroke-width:1;opacity:.55;vector-effect:non-scaling-stroke}
  .p11-ticks{position:absolute;inset:0;pointer-events:none}
  .p11-ticks span{position:absolute;right:7px;transform:translateY(-50%);font:500 var(--fs-tick)/1 var(--font-mono);color:var(--framework);background:var(--bg);padding:2px 4px}
  .p11-ticks span:nth-child(1){top:1%}.p11-ticks span:nth-child(2){top:12.5%}.p11-ticks span:nth-child(3){top:25%}.p11-ticks span:nth-child(4){top:37.5%}.p11-ticks span:nth-child(5){top:50%}.p11-ticks span:nth-child(6){top:62.5%}.p11-ticks span:nth-child(7){top:75%}.p11-ticks span:nth-child(8){top:87.5%}.p11-ticks span:nth-child(9){top:99%}
  .p11-ecliptic{position:absolute;left:0;right:0;top:50%;border-top:3px dashed var(--framework)}
  .p11-scale{position:absolute;left:10px;z-index:2;font:500 var(--fs-label)/1 var(--font-mono);color:var(--framework);background:var(--bg);padding:2px 5px}
  .p11-scale.plus{top:calc(27.5% - 9px)} .p11-scale.zero{top:calc(50% - 9px)} .p11-scale.minus{top:calc(72.5% - 9px)}
  .starbtn{position:absolute;width:54px;height:54px;transform:translate(-50%,-50%);border:0;background:transparent;color:var(--text);cursor:pointer;padding:0;border-radius:50%;touch-action:manipulation}
  .starbtn::before{content:"";position:absolute;left:23px;top:23px;width:8px;height:8px;border-radius:50%;background:var(--text)}
  .starbtn::after{content:"";position:absolute;inset:8px;border:3px solid transparent;border-radius:50%}
  .starbtn.selected::after{border-color:var(--accent)}
  .starbtn.judged::after{border-color:var(--framework)}
  .starbtn.selected.judged::after{border-color:var(--accent)}
  .starbtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .starbtn span{position:absolute;left:40px;top:14px;font:700 var(--fs-body)/1 var(--font-mono)}
  .starbtn .mark{display:none;left:39px;top:34px;width:118px;text-align:left;font:500 var(--fs-label)/1.15 var(--font-sans);color:var(--framework)}
  .starbtn.judged .mark{display:none}
  .p11-side{width:355px;display:flex;flex-direction:column;gap:14px}
  .p11-side .panel{padding:20px}
  .p11-side h2{margin:0 0 10px;font:650 var(--fs-h2)/1.25 var(--font-sans)}
  .p11-instruction{margin:0;color:var(--text);font:400 var(--fs-body)/1.5 var(--font-sans)}
  .p11-current{min-height:92px;border-left:3px solid var(--accent);padding:10px 0 10px 16px}
  .p11-current strong{display:block;font:700 var(--fs-h2)/1.2 var(--font-sans);margin-bottom:8px}
  .p11-current span{font:400 var(--fs-sec)/1.4 var(--font-sans);color:var(--framework)}
  .p11-actions{display:flex;flex-direction:column;gap:10px}
  .p11-actions .btn{width:100%;min-height:48px}
  .p11-feedback{min-height:78px;margin:0;font:500 var(--fs-sec)/1.45 var(--font-sans);color:var(--text)}
  .p11-conclusion{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);font:600 var(--fs-body)/1.45 var(--font-sans);color:var(--text);opacity:.35}
  .p11-conclusion.show{opacity:1}
  .p11-reset{align-self:flex-start;background:transparent}
  .p11-next{height:42px;display:flex;align-items:center;border-top:1px solid var(--line);font:500 var(--fs-sec)/1.3 var(--font-sans);color:var(--framework)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header class="p11-head">
  <div><div class="p11-kicker">FIRST FILTER</div><h1>黄道带外先排除，带内才值得继续看</h1></div>
  <div id="progress" class="p11-progress">已判断 0/6</div>
</header>
<main class="p11-main">
  <section class="p11-chart k-comparison" aria-label="候选点到黄道的角距离比较">
    <div class="p11-cols">
      <div class="p11-col"><div class="p11-colhead">带外：先排除</div><div class="p11-field" data-side="outside"><div class="p11-band"></div><svg class="p11-rulers" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="0" x2="100" y2="0"/><line x1="0" y1="12.5" x2="100" y2="12.5"/><line x1="0" y1="25" x2="100" y2="25"/><line x1="0" y1="37.5" x2="100" y2="37.5"/><line x1="0" y1="50" x2="100" y2="50"/><line x1="0" y1="62.5" x2="100" y2="62.5"/><line x1="0" y1="75" x2="100" y2="75"/><line x1="0" y1="87.5" x2="100" y2="87.5"/><line x1="0" y1="100" x2="100" y2="100"/><line x1="12.5" y1="0" x2="12.5" y2="100"/><line x1="25" y1="0" x2="25" y2="100"/><line x1="37.5" y1="0" x2="37.5" y2="100"/><line x1="50" y1="0" x2="50" y2="100"/><line x1="62.5" y1="0" x2="62.5" y2="100"/><line x1="75" y1="0" x2="75" y2="100"/><line x1="87.5" y1="0" x2="87.5" y2="100"/><polyline points="3,18 20,31 36,22 55,39 73,28 94,42" fill="none" stroke="var(--framework)" stroke-width="1.5" opacity=".55" vector-effect="non-scaling-stroke"/><polyline points="4,82 22,69 39,78 57,62 76,73 95,58" fill="none" stroke="var(--framework)" stroke-width="1.5" opacity=".55" vector-effect="non-scaling-stroke"/></svg><div class="p11-ticks" aria-hidden="true"><span>+20°</span><span>+15°</span><span>+10°</span><span>+5°</span><span>0°</span><span>−5°</span><span>−10°</span><span>−15°</span><span>−20°</span></div><div class="p11-ecliptic"></div><span class="p11-scale plus">+9°</span><span class="p11-scale zero">黄道</span><span class="p11-scale minus">−9°</span></div></div>
      <div class="p11-col"><div class="p11-colhead">带内：进入下一轮</div><div class="p11-field" data-side="inside"><div class="p11-band"></div><svg class="p11-rulers" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="0" x2="100" y2="0"/><line x1="0" y1="12.5" x2="100" y2="12.5"/><line x1="0" y1="25" x2="100" y2="25"/><line x1="0" y1="37.5" x2="100" y2="37.5"/><line x1="0" y1="50" x2="100" y2="50"/><line x1="0" y1="62.5" x2="100" y2="62.5"/><line x1="0" y1="75" x2="100" y2="75"/><line x1="0" y1="87.5" x2="100" y2="87.5"/><line x1="0" y1="100" x2="100" y2="100"/><line x1="12.5" y1="0" x2="12.5" y2="100"/><line x1="25" y1="0" x2="25" y2="100"/><line x1="37.5" y1="0" x2="37.5" y2="100"/><line x1="50" y1="0" x2="50" y2="100"/><line x1="62.5" y1="0" x2="62.5" y2="100"/><line x1="75" y1="0" x2="75" y2="100"/><line x1="87.5" y1="0" x2="87.5" y2="100"/><polyline points="3,18 20,31 36,22 55,39 73,28 94,42" fill="none" stroke="var(--framework)" stroke-width="1.5" opacity=".55" vector-effect="non-scaling-stroke"/><polyline points="4,82 22,69 39,78 57,62 76,73 95,58" fill="none" stroke="var(--framework)" stroke-width="1.5" opacity=".55" vector-effect="non-scaling-stroke"/></svg><div class="p11-ticks" aria-hidden="true"><span>+20°</span><span>+15°</span><span>+10°</span><span>+5°</span><span>0°</span><span>−5°</span><span>−10°</span><span>−15°</span><span>−20°</span></div><div class="p11-ecliptic"></div><span class="p11-scale plus">+9°</span><span class="p11-scale zero">黄道</span><span class="p11-scale minus">−9°</span></div></div>
    </div>
  </section>
  <aside class="p11-side min0">
    <div class="panel"><h2>按同一条 ±9° 边界筛选</h2><p class="p11-instruction">选择 A–F 中任一点，再判断“先排除”或“暂保留”。可重新选择并改判。</p></div>
    <div class="panel">
      <div class="p11-current"><strong id="currentTitle">先选择一个亮点</strong><span id="currentDetail">用鼠标点击，或按 Tab 聚焦后按空格。</span></div>
      <div class="p11-actions btns" aria-label="分类操作"><button id="exclude" class="btn" disabled>先排除</button><button id="keep" class="btn" disabled>暂保留</button></div>
    </div>
    <p id="feedback" class="p11-feedback" aria-live="polite">判断依据只看亮点与两条边界的相对位置。</p>
    <p id="conclusion" class="p11-conclusion">“位于黄道附近”只让亮点成为候选，不等于它已被确认。</p>
    <button id="reset" class="btn p11-reset">重新筛选</button>
  </aside>
</main>
<footer class="p11-next">下一问：留下来的几个亮点，先看哪一个最省时间？</footer>
<script>
window.addEventListener('load',()=>{
  Deck.init({index:11,total:19});
  const points=[
    {id:'A',deg:16,x:28,side:'outside',correct:'exclude',detail:'超出搜索带 7°'},
    {id:'B',deg:-13,x:51,side:'outside',correct:'exclude',detail:'超出搜索带 4°'},
    {id:'C',deg:11,x:75,side:'outside',correct:'exclude',detail:'超出搜索带 2°'},
    {id:'D',deg:7,x:28,side:'inside',correct:'keep',detail:'位于搜索带内'},
    {id:'E',deg:-4,x:51,side:'inside',correct:'keep',detail:'位于搜索带内'},
    {id:'F',deg:1,x:75,side:'inside',correct:'keep',detail:'位于搜索带内'}
  ];
  const initialState=()=>({selected:null,judgments:{}}); let state=initialState();
  const events=new AbortController(), controls={};
  const fields={outside:document.querySelector('[data-side="outside"]'),inside:document.querySelector('[data-side="inside"]')};
  points.forEach(p=>{const b=document.createElement('button');b.className='starbtn';b.type='button';b.dataset.id=p.id;b.setAttribute('aria-label',`候选 ${p.id}，距黄道 ${p.deg>0?'+':''}${p.deg} 度`);b.style.left=p.x+'%';b.style.top=(50-p.deg*2.5)+'%';b.innerHTML=`<span>${p.id}</span><span class="mark"></span>`;fields[p.side].appendChild(b);controls[p.id]=b;b.addEventListener('click',()=>dispatch({type:'select',id:p.id}),{signal:events.signal});});
  const $=id=>document.getElementById(id);
  function transition(s,a){if(a.type==='select')return {...s,selected:a.id};if(a.type==='judge'&&s.selected)return {...s,judgments:{...s.judgments,[s.selected]:a.value}};if(a.type==='reset')return initialState();return s}
  function dispatch(a){state=transition(state,a);render()}
  function render(){
    points.forEach(p=>{const b=controls[p.id],j=state.judgments[p.id];b.classList.toggle('selected',state.selected===p.id);b.classList.toggle('judged',!!j);b.setAttribute('aria-pressed',state.selected===p.id?'true':'false');b.querySelector('.mark').textContent=j==='exclude'?'先排除':j==='keep'?'暂保留':'';});
    const p=points.find(x=>x.id===state.selected), count=Object.keys(state.judgments).length;
    $('progress').textContent=`已判断 ${count}/6`;$('exclude').disabled=!p;$('keep').disabled=!p;
    $('currentTitle').textContent=p?`候选 ${p.id}｜${p.deg>0?'+':''}${p.deg}°`:'先选择一个亮点';
    $('currentDetail').textContent=p?p.detail:'用鼠标点击，或按 Tab 聚焦后按空格。';
    if(!p)$('feedback').textContent='判断依据只看亮点与两条边界的相对位置。';
    else if(!state.judgments[p.id])$('feedback').textContent='请选择它应“先排除”还是“暂保留”。';
    else if(state.judgments[p.id]!==p.correct)$('feedback').textContent='再比较它与 ±9° 边界的位置。';
    else $('feedback').textContent=p.correct==='exclude'?'先排除：它不在本课的黄道搜索带内':'暂保留：位置合适，但还不能确认';
    const complete=count===6&&points.every(x=>state.judgments[x.id]===x.correct);$('conclusion').classList.toggle('show',complete);
  }
  $('exclude').addEventListener('click',()=>dispatch({type:'judge',value:'exclude'}),{signal:events.signal});
  $('keep').addEventListener('click',()=>dispatch({type:'judge',value:'keep'}),{signal:events.signal});
  $('reset').addEventListener('click',()=>{dispatch({type:'reset'});controls.A.focus();$('feedback').textContent='已恢复：六个亮点都尚未判断。';},{signal:events.signal});
  let destroyed=false;function destroy(){if(destroyed)return;destroyed=true;events.abort()}window.addEventListener('pagehide',destroy,{once:true});render();
});
</script>
</div>
