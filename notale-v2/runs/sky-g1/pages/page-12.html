<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="12" data-total="19">
<div id="stage">
<style>
  .p12-head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .p12-kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.16em;color:var(--accent);margin:0 0 10px}
  .p12-head h1{font:600 var(--fs-h1)/1.18 var(--font-sans);margin:0;max-width:1050px;color:var(--text)}
  .p12-scale{display:flex;align-items:center;gap:12px;font:var(--fs-label)/1 var(--font-sans);color:var(--star);white-space:nowrap;padding-bottom:5px}
  .p12-scale i{display:block;width:160px;border-top:3px dashed var(--star);position:relative}
  .p12-scale i:after{content:"›";position:absolute;right:-2px;top:-16px;font-size:26px}
  .p12-main{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:16px}
  .p12-instruction{display:flex;align-items:center;justify-content:space-between;gap:26px;margin-bottom:12px}
  .p12-instruction p{margin:0;font:var(--fs-body)/1.4 var(--font-sans)}
  .p12-instruction .small{color:var(--star)}
  .p12-board{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:1;min-height:0}
  .p12-board:before{content:"";position:absolute;left:24px;right:24px;top:51%;border-top:1px solid var(--line);z-index:0}
  .p12-zone{position:relative;z-index:1;display:flex;flex-direction:column;min-width:0;padding:17px 18px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
  .p12-zone.bad{border-color:var(--accent)}
  .p12-zone.bad .zone-state{color:var(--accent)}
  .zone-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
  .zone-head h2{font:600 var(--fs-h2)/1.2 var(--font-sans);margin:0}
  .zone-head span,.zone-state{font:var(--fs-label)/1.3 var(--font-sans);color:var(--star)}
  .zone-state{min-height:21px;margin-top:7px}
  .slots{display:flex;flex-direction:column;justify-content:center;gap:10px;flex:1;min-height:150px}
  .empty{height:62px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font:var(--fs-label)/1 var(--font-sans);color:var(--star)}
  .p12-tray{display:flex;align-items:center;gap:12px;min-height:92px;margin-top:14px;padding:10px 14px;border:1px solid var(--line);border-radius:8px}
  .tray-label{width:116px;flex:none;font:600 var(--fs-label)/1.35 var(--font-sans);color:var(--star)}
  .tray-items{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .star-item{appearance:none;min-width:137px;min-height:62px;display:flex;align-items:center;gap:11px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:var(--fs-label)/1.25 var(--font-sans);text-align:left;touch-action:none;cursor:grab}
  .star-item:hover{border-color:var(--star)} .star-item:focus-visible,.p12-zone:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .star-item.selected{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
  .star-item.dragging{position:relative;z-index:20;cursor:grabbing;pointer-events:none}
  .dot{width:20px;height:20px;display:grid;place-items:center;flex:none}.dot:before{content:"";display:block;width:var(--d);height:var(--d);border-radius:50%;background:var(--c)}
  .item-copy b{display:block;font:600 var(--fs-label)/1.2 var(--font-sans)}
  .item-copy em{display:block;margin-top:3px;color:var(--star);font:normal var(--fs-label)/1.2 var(--font-sans)}
  .counter-note{min-height:20px;margin-top:5px;color:var(--accent);font:var(--fs-label)/1.3 var(--font-sans)}
  .p12-foot{display:flex;align-items:center;gap:18px;padding-top:14px}
  .p12-feedback{flex:1;min-width:0;font:600 var(--fs-body)/1.35 var(--font-sans)}
  .p12-feedback strong{color:var(--accent)}
  .p12-next{margin-left:auto;color:var(--star);font:var(--fs-sec)/1.35 var(--font-sans);white-space:nowrap}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  @media (prefers-reduced-motion:reduce){.star-item{transition:none!important}}
</style>
<header class="p12-head">
  <div><p class="p12-kicker">BRIGHTNESS FIRST</p><h1>先看最亮的少数点，但别把“最亮”当成行星证明</h1></div>
  <div class="p12-scale" aria-label="亮度排序方向"><span>更醒目</span><i></i><span>较不醒目</span></div>
</header>
<main class="p12-main">
  <div class="p12-instruction">
    <p><strong>把六个亮点按肉眼醒目程度分批。</strong> 每栏放 2 个，栏内也要从更醒目排到较不醒目。</p>
    <p class="small">拖动；或先点亮点，再点分区。选中后也可用 ← → 移动。</p>
  </div>
  <section class="p12-board triptych k-classification no-pan" id="board" aria-label="三个检查优先级分区"></section>
  <section class="p12-tray" aria-label="待分配亮点">
    <div class="tray-label">待分配<br><span id="remain">6 个</span></div><div class="tray-items" id="tray"></div>
  </section>
  <footer class="p12-foot">
    <div class="btns"><button class="btn" id="check" disabled>核对顺序</button><button class="btn" id="reset">重新排序</button></div>
    <div class="p12-feedback" id="feedback" aria-live="polite">先完成三栏排序，再核对。</div>
    <div class="p12-next">下一问：如果亮度不能定案，亮点是否闪烁能帮多少忙？</div>
  </footer>
</main>
<script>
window.addEventListener('DOMContentLoaded', () => {
  Deck.init({index:12,total:19});
  const items = [
    {id:'A',pre:'暖白亮点',name:'金星',kind:'行星',rank:1,d:18,c:'#f3e8d4'},
    {id:'B',pre:'白色亮点',name:'木星',kind:'行星',rank:2,d:18,c:'#f3f1e8'},
    {id:'C',pre:'蓝白亮点',name:'天狼星',kind:'恒星',rank:3,d:14,c:'#dce9f2'},
    {id:'D',pre:'黄白亮点',name:'五车二',kind:'恒星',rank:4,d:10,c:'#efe6c8'},
    {id:'E',pre:'淡黄亮点',name:'土星',kind:'行星',rank:5,d:10,c:'#e5d6a6'},
    {id:'F',pre:'白色小亮点',name:'北河三',kind:'恒星',rank:6,d:7,c:'#e8e8e3'}
  ];
  const byId = Object.fromEntries(items.map(x=>[x.id,x]));
  const zones = [
    {title:'先查',sub:'最醒目的 2 个'},
    {title:'再查',sub:'接下来的 2 个'},
    {title:'暂缓',sub:'最后处理的 2 个'}
  ];
  const target = [...items].sort((a,b)=>a.rank-b.rank).reduce((a,x,i)=>(a[Math.floor(i/2)].push(x.id),a),[[],[],[]]);
  const initialState = () => ({tray:['D','A','F','C','B','E'],groups:[[],[],[]],selected:null,submitted:false,bad:[]});
  let state = initialState(), drag=null, destroyed=false;
  const board=document.getElementById('board'), tray=document.getElementById('tray'), feedback=document.getElementById('feedback'), check=document.getElementById('check'), reset=document.getElementById('reset'), remain=document.getElementById('remain');
  const events=new AbortController(), on=(el,type,fn)=>el.addEventListener(type,fn,{signal:events.signal});

  function locate(id,s=state){ const t=s.tray.indexOf(id); if(t>=0)return {kind:'tray',index:t}; for(let g=0;g<3;g++){const i=s.groups[g].indexOf(id);if(i>=0)return {kind:'group',g,index:i};} }
  function move(id,g,index=2){
    const groups=state.groups.map(a=>a.slice()), old=locate(id), tr=state.tray.slice();
    if(old.kind==='tray') tr.splice(old.index,1); else groups[old.g].splice(old.index,1);
    let displaced=null;
    if(groups[g].length>=2){ displaced=groups[g][Math.min(index,1)]; groups[g].splice(Math.min(index,1),1); }
    groups[g].splice(Math.min(index,groups[g].length),0,id);
    if(displaced){ if(old.kind==='group'){groups[old.g].splice(Math.min(old.index,groups[old.g].length),0,displaced)} else tr.push(displaced); }
    state={...state,tray:tr,groups,selected:id,submitted:false,bad:[]}; render();
  }
  function itemButton(id){
    const x=byId[id], b=document.createElement('button'); b.className='star-item'+(state.selected===id?' selected':''); b.dataset.id=id; b.type='button'; b.setAttribute('aria-pressed',state.selected===id?'true':'false');
    b.innerHTML=`<span class="dot" style="--d:${x.d}px;--c:${x.c}"></span><span class="item-copy"><b>${state.submitted?x.name:x.pre}</b><em>${state.submitted?x.kind:'身份未揭示'}</em></span>`;
    return b;
  }
  function render(){
    board.innerHTML='';
    zones.forEach((z,g)=>{const zone=document.createElement('div');zone.className='p12-zone panel'+(state.bad.includes(g)?' bad':'');zone.dataset.zone=g;zone.tabIndex=0;zone.setAttribute('role','button');zone.setAttribute('aria-label',`${z.title}，${z.sub}，点击放入已选亮点`);
      const correct=state.submitted&&!state.bad.includes(g); zone.innerHTML=`<div class="zone-head"><h2>${z.title}</h2><span>${z.sub}</span></div><div class="zone-state">${state.submitted?(correct?'分区正确':'这里有亮点放错分区'):`${state.groups[g].length} / 2`}</div>`;
      const slots=document.createElement('div');slots.className='slots'; state.groups[g].forEach(id=>slots.appendChild(itemButton(id))); for(let i=state.groups[g].length;i<2;i++){const e=document.createElement('div');e.className='empty';e.textContent='放入亮点';slots.appendChild(e)} zone.appendChild(slots);
      if(state.submitted&&state.groups[g].includes('C')){const n=document.createElement('div');n.className='counter-note';n.textContent='最亮恒星也可能比某些行星更醒目。';zone.appendChild(n)} else {const n=document.createElement('div');n.className='counter-note';zone.appendChild(n)} board.appendChild(zone);
    });
    tray.innerHTML='';state.tray.forEach(id=>tray.appendChild(itemButton(id))); remain.textContent=`${state.tray.length} 个`;check.disabled=state.tray.length!==0;
  }
  function select(id){state={...state,selected:state.selected===id?null:id};render();}
  function submit(){
    if(state.tray.length)return; const bad=[];state.groups.forEach((a,g)=>{if(a.join('')!==target[g].join(''))bad.push(g)});state={...state,submitted:true,bad};render();
    feedback.innerHTML=bad.length?`有 ${bad.length} 个分区需要调整；已标出分区，但<strong>身份并不能替代亮度排序</strong>。`:`顺序有效：先把观测时间花在少数醒目目标上。<strong>亮度决定检查顺序，不决定身份；醒目的恒星也会排在行星前面。</strong>`;
  }
  function resetAll(){state=initialState();drag=null;render();feedback.textContent='已恢复初始托盘。先完成三栏排序，再核对。';document.querySelector('.star-item')?.focus();}
  function zoneAt(e){const p=Deck.pt(board,e);const els=[...board.querySelectorAll('.p12-zone')];return els.findIndex(el=>p.x>=el.offsetLeft&&p.x<=el.offsetLeft+el.offsetWidth&&p.y>=el.offsetTop&&p.y<=el.offsetTop+el.offsetHeight);}
  on(document.getElementById('stage'),'click',e=>{const item=e.target.closest('.star-item');if(item){if(!drag)select(item.dataset.id);return}const zone=e.target.closest('.p12-zone');if(zone&&state.selected)move(state.selected,+zone.dataset.zone);});
  on(document.getElementById('stage'),'keydown',e=>{const item=e.target.closest('.star-item');if(!item||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();e.stopPropagation();const id=item.dataset.id,pos=locate(id);let slot=pos.kind==='tray'?-1:pos.g*2+pos.index;slot+=e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:1;slot=Math.max(0,Math.min(5,slot));move(id,Math.floor(slot/2),slot%2);setTimeout(()=>document.querySelector(`[data-id="${id}"]`)?.focus(),0);});
  on(document.getElementById('stage'),'pointerdown',e=>{const b=e.target.closest('.star-item');if(!b)return;drag={id:b.dataset.id,pid:e.pointerId,start:Deck.pt(board,e),moved:false};b.setPointerCapture(e.pointerId);b.classList.add('dragging');});
  on(document.getElementById('stage'),'pointermove',e=>{if(!drag||e.pointerId!==drag.pid)return;const p=Deck.pt(board,e),dx=p.x-drag.start.x,dy=p.y-drag.start.y;if(Math.hypot(dx,dy)>5)drag.moved=true;const b=document.querySelector(`[data-id="${drag.id}"]`);if(b)b.style.transform=`translate(${dx}px,${dy}px)`;});
  function endDrag(e){if(!drag||e.pointerId!==drag.pid)return;const d=drag;drag=null;if(d.moved){const g=zoneAt(e);if(g>=0)move(d.id,g);else render();}}
  on(document.getElementById('stage'),'pointerup',endDrag);on(document.getElementById('stage'),'pointercancel',e=>{if(drag&&e.pointerId===drag.pid){drag=null;render();}});
  on(check,'click',submit);on(reset,'click',resetAll);
  function destroy(){if(destroyed)return;destroyed=true;events.abort();drag=null;} window.addEventListener('pagehide',destroy,{once:true});
  render();
});
</script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
