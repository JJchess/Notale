<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>闪烁不是判决</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{gap:18px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
  .kicker{font:600 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.16em;color:var(--accent);margin-bottom:9px}
  h1{font:600 var(--fs-h1)/1.18 var(--font-sans);margin:0;max-width:980px}
  .condition-read{font:500 var(--fs-label)/1.35 var(--font-sans);color:var(--star);text-align:right;padding-bottom:4px}
  .condition-read strong{display:block;font:500 var(--fs-h2)/1.2 var(--font-serif);color:var(--text);margin-top:5px}
  .main{position:relative;display:flex;gap:28px;flex:1;min-height:0}.main-field{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.main-field rect{fill:rgba(143,167,179,.035);stroke:rgba(143,167,179,.18);stroke-width:1;stroke-dasharray:10 12}.main>.compare,.main>.scale-panel{position:relative;z-index:1}
  .compare{flex:1;display:flex;flex-direction:column;min-width:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .matrix-head,.matrix-row{display:grid;grid-template-columns:170px 1fr 1fr;column-gap:18px}
  .matrix-head{height:64px;align-items:end;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .matrix-head span{font:600 var(--fs-h2)/1.2 var(--font-sans);text-align:center}
  .matrix-head .stub{font:500 var(--fs-label)/1.2 var(--font-sans);text-align:left;color:var(--star)}
  .matrix-row{flex:1;min-height:0;align-items:stretch}
  .row-label{display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line);padding-right:24px}
  .row-label .dir{font:500 var(--fs-h2)/1.2 var(--font-serif)}
  .row-label .small{margin-top:10px;color:var(--star)}
  .sample{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
  .sample + .sample{border-left:1px solid var(--line)}
  .sky{position:relative;width:100%;flex:1;min-height:280px;background:linear-gradient(90deg,transparent 8%,rgba(143,167,179,.055) 8%,rgba(143,167,179,.055) 92%,transparent 92%)}
  .range-field{position:absolute;inset:9% 8%;width:84%;height:82%}.range-field .axis{stroke:rgba(143,167,179,.45);stroke-width:1;stroke-dasharray:6 7}.range-field .band{fill:rgba(143,167,179,.16);stroke:var(--star);stroke-width:2;stroke-dasharray:8 8}.range-field .low-band{display:none}.low .range-field .high-band{display:none}.low .range-field .low-band{display:block}
  .sky:before,.sky:after{content:"";position:absolute;left:8%;right:8%;border-top:1px dashed rgba(143,167,179,.32)}
  .sky:before{top:30%}.sky:after{top:62%}
  .envelope{position:absolute;left:50%;top:46%;width:150px;height:150px;transform:translate(-50%,-50%);border:2px dashed rgba(143,167,179,.48);border-radius:50%;background:rgba(143,167,179,.045);transition:width .3s ease,height .3s ease}
  .planet .envelope{width:76px;height:76px}
  .low .star .envelope{width:236px;height:236px}.low .planet .envelope{width:174px;height:174px}
  .envelope-label{position:absolute;left:50%;bottom:-29px;transform:translateX(-50%);white-space:nowrap;font:400 var(--fs-label)/1.2 var(--font-sans);color:var(--star)}
  .star-dot{position:absolute;left:50%;top:46%;width:18px;height:18px;border-radius:50%;background:var(--star);transform:translate(-50%,-50%) scale(var(--scale,1));opacity:var(--opacity,.9);will-change:transform,opacity}
  .star-dot.secondary{left:34%;top:64%;width:11px;height:11px}
  .sample.planet .star-dot.primary:after{content:"";position:absolute;inset:-14px;border:3px solid var(--text);border-radius:50%;opacity:.74}
  .trail{display:none;position:absolute;left:50%;top:46%;width:62px;height:16px;transform:translate(-50%,-50%);border-left:2px solid var(--star);border-right:2px solid var(--star);border-top:1px solid var(--line)}
  .trail:after{content:"波动范围";position:absolute;top:18px;left:50%;transform:translateX(-50%);white-space:nowrap;font:400 var(--fs-label)/1.2 var(--font-sans);color:var(--star)}
  .sample-note{font:500 var(--fs-body)/1.35 var(--font-sans);height:52px;text-align:center}
  .sample-note b{color:var(--accent);font-weight:600}
  .scale-panel{width:270px;display:flex;flex-direction:column;padding:24px 25px}
  .scale-panel h2{font:600 var(--fs-h2)/1.2 var(--font-sans);margin:0 0 18px}
  .scale{position:relative;flex:1;min-height:300px;margin:10px 0 16px 20px;border-left:3px dashed var(--star)}
  .scale:before,.scale:after{position:absolute;left:22px;font:500 var(--fs-label)/1.25 var(--font-sans);white-space:nowrap;color:var(--star)}
  .scale:before{content:"较稳定";bottom:0}.scale:after{content:"闪烁较明显";top:0}
  .marker{position:absolute;left:-11px;width:19px;height:19px;border:3px solid var(--accent);border-radius:50%;background:var(--bg);transform:translateY(50%);transition:bottom .3s ease}
  .marker.star-m{border-radius:2px;transform:translateY(50%) rotate(45deg)}
  .marker-label{position:absolute;left:47px;transform:translateY(50%);font:500 var(--fs-label)/1.2 var(--font-sans);white-space:nowrap;color:var(--text)}
  .scale-note{font:400 var(--fs-sec)/1.45 var(--font-sans);color:var(--star);margin:0}
  .controls{display:flex;align-items:center;gap:16px;min-height:76px}
  .controls .hint{margin-right:auto;max-width:500px}
  .controls .btns{display:flex;gap:8px}
  .btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
  .verdict{display:flex;align-items:center;gap:18px;min-height:74px;border-top:1px solid var(--line);padding-top:16px}
  .verdict .tag{flex:0 0 auto}
  .verdict p{margin:0;font:500 var(--fs-lead)/1.4 var(--font-sans)}
  .next{margin-left:auto;color:var(--star);font:400 var(--fs-sec)/1.4 var(--font-sans);max-width:350px;text-align:right}
  @media (prefers-reduced-motion:reduce){.star-dot{will-change:auto}.trail{display:block}.marker{transition:none}}
</style>
</head>
<body data-page="13" data-total="19">
<div id="stage">
  <header class="head">
    <div><div class="kicker">CLUE 02 · TWINKLE</div><h1>行星通常更稳定，但低空会让它也闪烁</h1></div>
    <div class="condition-read">当前观测条件<strong id="conditionName">高空</strong></div>
  </header>

  <main class="main min0 k-comparison" aria-label="同一高度条件下恒星与行星的闪烁对照">
    <svg class="main-field" viewBox="0 0 1488 590" preserveAspectRatio="none" aria-hidden="true"><rect x="1" y="1" width="1486" height="588"/><path d="M170 64V590 M623 64V590 M1076 0V590" fill="none" stroke="rgba(143,167,179,.2)" stroke-width="1"/></svg>
    <section class="compare min0">
      <div class="matrix-head"><span class="stub">同一亮度与点径尺度</span><span>恒星</span><span>行星候选</span></div>
      <div class="matrix-row">
        <div class="row-label"><span class="dir" id="heightLabel">高空</span><span class="small" id="pathLabel">大气路径较短</span></div>
        <div class="sample star" aria-label="恒星样本">
          <div class="sky"><svg class="range-field" viewBox="0 0 400 260" preserveAspectRatio="none" aria-hidden="true"><line class="axis" x1="0" y1="130" x2="400" y2="130"/><rect class="band high-band" x="0" y="25" width="400" height="210"/><rect class="band low-band" x="0" y="8" width="400" height="244"/></svg><span class="envelope"><em class="envelope-label">固定中心 · 波动范围</em></span><span class="trail"></span><i class="star-dot primary"></i><i class="star-dot secondary"></i></div>
          <div class="sample-note" id="starNote">明暗与点径有可见起伏<br><b>通常较会闪</b></div>
        </div>
        <div class="sample planet" aria-label="开放圆环标记的行星候选样本">
          <div class="sky"><svg class="range-field" viewBox="0 0 400 260" preserveAspectRatio="none" aria-hidden="true"><line class="axis" x1="0" y1="130" x2="400" y2="130"/><rect class="band high-band" x="0" y="86" width="400" height="88"/><rect class="band low-band" x="0" y="38" width="400" height="184"/></svg><span class="envelope"><em class="envelope-label">固定中心 · 波动范围</em></span><span class="trail"></span><i class="star-dot primary"></i><i class="star-dot secondary"></i></div>
          <div class="sample-note" id="planetNote">仅有轻微起伏<br><b>更像行星</b></div>
        </div>
      </div>
    </section>
    <aside class="panel scale-panel">
      <h2>共享闪烁强度标尺</h2>
      <div class="scale" aria-hidden="true">
        <span class="marker star-m" id="starMarker"></span><span class="marker-label" id="starMarkerLabel">恒星</span>
        <span class="marker" id="planetMarker"></span><span class="marker-label" id="planetMarkerLabel">行星</span>
      </div>
      <p class="scale-note">对象没有换，尺度也没有换。只改变光穿过大气的路径。</p>
    </aside>
  </main>

  <section class="controls panel" aria-label="观测条件控制">
    <p class="hint">切换高度，比较两列如何同时变化。聚焦条件按钮后可用 ← → 切换。</p>
    <div class="btns" role="group" aria-label="选择高度条件">
      <button class="btn" id="highBtn" aria-pressed="true">高空</button>
      <button class="btn" id="lowBtn" aria-pressed="false">接近地平线</button>
    </div>
    <button class="btn" id="playBtn" aria-pressed="false">暂停</button>
    <button class="btn" id="resetBtn">重置</button>
  </section>

  <footer class="verdict">
    <span class="tag" id="resultTag">更像行星</span>
    <p id="conclusion">少闪烁可提高“像行星”的可信度；明显闪烁只能降低可信度，不能直接排除。</p>
    <div class="next">外观线索彼此冲突时，应该怎样合并判断？</div>
  </footer>

</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:13,total:19});
  const $ = id => document.getElementById(id);
  const highBtn=$('highBtn'), lowBtn=$('lowBtn'), playBtn=$('playBtn'), resetBtn=$('resetBtn');
  const dots=[...document.querySelectorAll('.star-dot')];
  const events=new AbortController();
  let raf=0, start=performance.now(), destroyed=false;
  const reduced=Deck.reduced();
  function initialState(){ return {height:'high', playing:!reduced}; }
  let state=initialState();
  function transition(s,a){
    if(a.type==='height' && a.value!==s.height) return {...s,height:a.value};
    if(a.type==='toggle') return {...s,playing:!s.playing};
    if(a.type==='reset') return initialState();
    return s;
  }
  function amplitudes(){ return state.height==='high' ? {star:.23,planet:.055} : {star:.43,planet:.28}; }
  function paint(t){
    const a=amplitudes();
    const time=reduced ? 0.32 : (t-start)/1000;
    dots.forEach((dot,i)=>{
      const isPlanet=dot.closest('.planet');
      const amp=isPlanet?a.planet:a.star;
      const period=[.71,.91,.59,.83][i];
      const wave=Math.sin((time/period)*Math.PI*2+[0,1.7,.8,2.4][i]);
      dot.style.setProperty('--scale',(1+amp*wave).toFixed(3));
      dot.style.setProperty('--opacity',(0.82+amp*.38*wave).toFixed(3));
    });
  }
  function loop(t){ if(destroyed||!state.playing||reduced) return; paint(t); raf=requestAnimationFrame(loop); }
  function restart(){ cancelAnimationFrame(raf); start=performance.now(); paint(start); if(state.playing&&!reduced) raf=requestAnimationFrame(loop); }
  function render(announce=true){
    const low=state.height==='low';
    $('conditionName').textContent=low?'接近地平线':'高空';
    document.querySelector('.compare').classList.toggle('low',low);
    $('heightLabel').textContent=low?'低空':'高空';
    $('pathLabel').textContent=low?'光穿过更长的大气路径':'大气路径较短';
    $('starNote').innerHTML=low?'起伏明显增强<br><b>通常较会闪</b>':'明暗与点径有可见起伏<br><b>通常较会闪</b>';
    $('planetNote').innerHTML=low?'起伏增强，可明显闪烁<br><b>可信度下降</b>':'仅有轻微起伏<br><b>更像行星</b>';
    $('resultTag').textContent=low?'可信度下降':'更像行星';
    highBtn.setAttribute('aria-pressed',String(!low)); lowBtn.setAttribute('aria-pressed',String(low));
    playBtn.textContent=state.playing?'暂停':'播放'; playBtn.setAttribute('aria-pressed',String(!state.playing));
    const starBottom=low?79:55, planetBottom=low?58:16;
    $('starMarker').style.bottom=starBottom+'%'; $('starMarkerLabel').style.bottom=starBottom+'%';
    $('planetMarker').style.bottom=planetBottom+'%'; $('planetMarkerLabel').style.bottom=planetBottom+'%';
    if(announce) $('conditionName').setAttribute('aria-label',low?'已切换到接近地平线：恒星与行星的闪烁都增强，行星候选可信度下降。':'已切换到高空：行星候选比恒星稳定，更像行星。');
    restart();
  }
  function dispatch(action){ const next=transition(state,action); if(next===state)return; state=next; render(); }
  highBtn.addEventListener('click',()=>dispatch({type:'height',value:'high'}),{signal:events.signal});
  lowBtn.addEventListener('click',()=>dispatch({type:'height',value:'low'}),{signal:events.signal});
  [highBtn,lowBtn].forEach(btn=>btn.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();e.stopPropagation();const low=e.key==='ArrowRight';dispatch({type:'height',value:low?'low':'high'});(low?lowBtn:highBtn).focus();},{signal:events.signal}));
  playBtn.addEventListener('click',()=>dispatch({type:'toggle'}),{signal:events.signal});
  resetBtn.addEventListener('click',()=>{state=initialState();render(false);$('conditionName').setAttribute('aria-label','已重置为高空，并恢复初始播放状态。');highBtn.focus();},{signal:events.signal});
  function destroy(){if(destroyed)return;destroyed=true;events.abort();cancelAnimationFrame(raf)}
  window.addEventListener('pagehide',destroy,{once:true});
  render(false);
})();
</script>
</body>
</html>
