<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="14" data-total="19">
<div id="stage">
<style>
  .p14-head{display:flex;justify-content:space-between;align-items:flex-end;gap:42px;margin-bottom:18px}
  .p14-head h1{margin:5px 0 0;font-size:var(--fs-h1);font-weight:700;letter-spacing:.01em}
  .p14-kicker{font:600 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.17em;color:var(--attention)}
  .p14-lead{width:510px;margin:0;color:var(--text);font-size:var(--fs-lead);line-height:1.45}
  .p14-main{flex:1;display:flex;gap:28px;min-height:0}
  .p14-record{flex:1;display:flex;flex-direction:column;padding:22px 26px!important;min-width:0}
  .p14-side{width:405px;display:flex;flex-direction:column;gap:16px;min-width:0}
  .candidate-bar{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:16px}
  .candidate-bar h2{font-size:var(--fs-h2);margin:0 10px 0 0}
  .candidate-tab{min-width:56px;height:42px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);font:600 var(--fs-body) var(--font-sans);cursor:pointer}
  .candidate-tab[aria-selected="true"]{border-color:var(--attention);color:var(--attention);background:color-mix(in srgb,var(--attention) 10%,transparent)}
  .result-tag{margin-left:auto;font-size:var(--fs-label)}
  #rows{flex:1;display:flex;flex-direction:column;min-height:0}
  .clue-head,.clue-row{display:grid;grid-template-columns:132px 1fr 230px;column-gap:20px;align-items:center}
  .clue-head{height:44px;color:var(--star);font-size:var(--fs-label)}
  .strength{display:flex;justify-content:space-between;padding:0 15px}
  .clue-row{position:relative;flex:1;min-height:86px;margin-bottom:8px;padding:0 14px;border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:8px;background:color-mix(in srgb,var(--surface) 66%,transparent)}
  .clue-row.changed{border-color:var(--attention);background:linear-gradient(90deg,var(--surface),color-mix(in srgb,var(--attention) 13%,var(--surface)),var(--surface))}
  .clue-name strong{display:block;font-size:var(--fs-body)}
  .clue-name span{display:block;margin-top:5px;color:var(--star);font-size:var(--fs-label)}
  .scale{position:relative;height:50px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--surface) 45%,transparent),color-mix(in srgb,var(--star) 14%,var(--surface)));padding:6px 10px}
  .scale svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .axis{stroke:var(--line);stroke-width:2}.tick{stroke:var(--star);stroke-width:1.5}
  .marker{fill:var(--bg);stroke:var(--attention);stroke-width:3;transition:cx 180ms ease}
  .choices{display:flex;gap:7px;justify-content:flex-end}
  .choice{min-height:42px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:500 var(--fs-label)/1.2 var(--font-sans);cursor:pointer}
  .choice[aria-pressed="true"]{border-color:var(--attention);color:var(--attention);background:color-mix(in srgb,var(--attention) 12%,var(--surface))}
  .choice:focus-visible,.candidate-tab:focus-visible,.reset:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .feedback{min-height:48px;margin:13px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:var(--fs-sec);line-height:1.4;color:var(--star)}
  .feedback strong{color:var(--text)}
  .side-block{padding:20px 22px!important}
  .side-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .side-title h2{margin:0;font-size:var(--fs-h2)}
  .reset{border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);padding:8px 12px;font:500 var(--fs-label) var(--font-sans);cursor:pointer}
  .bucket{position:relative;padding:12px 12px 12px 28px;border-left:2px solid var(--line);min-height:62px;background:color-mix(in srgb,var(--surface) 72%,transparent);border-radius:0 8px 8px 0}
  .bucket+.bucket{margin-top:7px}.bucket h3{margin:0 0 7px;font-size:var(--fs-sec)}
  .chips{display:flex;gap:8px;min-height:28px}.chip{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-label)}
  .ring{width:15px;height:15px;border:2px solid var(--text);border-radius:50%;display:inline-block}
  .side-note{margin:15px 0 0;font-size:var(--fs-sec);line-height:1.45;color:var(--star)}
  .side-note strong{color:var(--attention);font-weight:600}
  .takeaway{padding:20px 22px!important;flex:1;display:flex;flex-direction:column;justify-content:center}
  .takeaway p{margin:0;font-size:var(--fs-lead);line-height:1.5}
  .next{margin-top:18px;padding-top:15px;border-top:1px solid var(--line);font-size:var(--fs-sec);line-height:1.45;color:var(--star)}
  .kbd{margin-top:10px;font-size:var(--fs-label);color:var(--star)}
  @media (prefers-reduced-motion:reduce){.marker{transition:none}}
</style>
<header class="p14-head">
  <div><div class="p14-kicker">WEIGH THE CLUES</div><h1>四条线索一起筛，任何一条都不能定案</h1></div>
  <p class="p14-lead">选一份候选记录，逐项换档。看它在同一套规则下怎样被归入三级结果。</p>
</header>
<main class="p14-main">
  <section class="panel ledger k-classification p14-record min0" aria-labelledby="record-title">
    <div class="candidate-bar"><h2 id="record-title">候选记录</h2><div role="tablist" aria-label="选择候选"><button class="candidate-tab" data-id="A" role="tab">A</button><button class="candidate-tab" data-id="B" role="tab">B</button><button class="candidate-tab" data-id="C" role="tab">C</button></div><span class="tag result-tag" id="current-result"></span></div>
    <div class="clue-head"><span>同一记录的字段</span><span class="strength"><span>较弱</span><span>较强</span></span><span>点选一档</span></div>
    <div id="rows"></div>
    <p class="feedback" id="feedback" aria-live="polite"></p>
  </section>
  <aside class="p14-side min0">
    <section class="panel side-block">
      <div class="side-title"><h2>三级筛选结果</h2><button class="reset" id="reset">恢复三份记录</button></div>
      <div class="bucket"><h3>优先核对</h3><div class="chips" data-bucket="priority"></div></div>
      <div class="bucket"><h3>暂留</h3><div class="chips" data-bucket="hold"></div></div>
      <div class="bucket"><h3>通常先排除</h3><div class="chips" data-bucket="exclude"></div></div>
      <p class="side-note"><strong>“优先核对”仍只是候选，</strong>不等于已经认出行星。</p>
      <p class="kbd">键盘：数字 1–3 切换候选；聚焦按钮后用 ← → 换档。</p>
    </section>
    <section class="panel q takeaway"><p>黄道位置先决定是否值得看，亮度、闪烁和颜色只增减候选可信度。</p><div class="next">筛出的强候选，怎样用星图做更严格的核对？</div></section>
  </aside>
</main>
<script>
window.addEventListener('DOMContentLoaded',()=>{
  Deck.init({index:14,total:19});
  const fields=[
    {key:'ecliptic',name:'黄道位置',note:'主筛选',opts:['带外','边缘','带内']},
    {key:'brightness',name:'亮度',note:'中等线索',opts:['很暗','普通可见','很醒目']},
    {key:'twinkle',name:'闪烁',note:'条件线索',opts:['明显','轻微','较稳定']},
    {key:'color',name:'颜色',note:'弱线索，只帮助描述',opts:['难判断','偏红','白黄']}
  ];
  const initialState=()=>({selected:'A',changed:null,records:{A:{ecliptic:2,brightness:2,twinkle:2,color:2},B:{ecliptic:2,brightness:1,twinkle:0,color:1},C:{ecliptic:0,brightness:2,twinkle:2,color:2}}});
  let state=initialState(), resultTimer=0;
  const rows=document.getElementById('rows'), feedback=document.getElementById('feedback'), resultEl=document.getElementById('current-result');
  const events=new AbortController(), sig={signal:events.signal};
  function classify(r){if(r.ecliptic===0)return'exclude';const score=r.brightness+r.twinkle-(r.ecliptic===1?1:0);return score>=3?'priority':'hold'}
  function label(k){return k==='priority'?'优先核对':k==='hold'?'暂留':'通常先排除'}
  function transition(action){
    if(action.type==='select')return {...state,selected:action.id,changed:null};
    if(action.type==='set'){const records={...state.records,[state.selected]:{...state.records[state.selected],[action.key]:action.value}};return {...state,records,changed:action.key}}
    if(action.type==='reset')return initialState(); return state;
  }
  function dispatch(action){state=transition(action);render();}
  function render(){
    document.querySelectorAll('.candidate-tab').forEach(b=>{const on=b.dataset.id===state.selected;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1});
    const r=state.records[state.selected];
    rows.innerHTML=fields.map(f=>`<div class="clue-row ${state.changed===f.key?'changed':''}" data-key="${f.key}"><div class="clue-name"><strong>${f.name}</strong><span>${f.note}</span></div><div class="scale" aria-hidden="true"><svg viewBox="0 0 300 38" preserveAspectRatio="none"><line class="axis" x1="18" y1="19" x2="282" y2="19"/><line class="tick" x1="18" y1="12" x2="18" y2="26"/><line class="tick" x1="150" y1="12" x2="150" y2="26"/><line class="tick" x1="282" y1="12" x2="282" y2="26"/><circle class="marker" cx="${[18,150,282][r[f.key]]}" cy="19" r="9"/></svg></div><div class="choices" role="group" aria-label="${f.name}">${f.opts.map((o,i)=>`<button class="choice" data-key="${f.key}" data-value="${i}" aria-pressed="${r[f.key]===i}">${o}</button>`).join('')}</div></div>`).join('');
    const res=classify(r); resultEl.textContent=label(res);
    ['priority','hold','exclude'].forEach(k=>{document.querySelector(`[data-bucket="${k}"]`).innerHTML=Object.keys(state.records).filter(id=>classify(state.records[id])===k).map(id=>`<span class="chip"><i class="ring"></i>候选 ${id}</span>`).join('')||'<span class="chip">—</span>'});
    if(!state.changed) feedback.innerHTML=`当前查看 <strong>候选 ${state.selected}</strong>：${label(res)}。请改动任一字段，观察归类是否变化。`;
    else if(state.changed==='color') feedback.innerHTML=`颜色改成“${fields[3].opts[r.color]}”：<strong>只改变描述，不改变筛选等级。</strong>`;
    else if(state.changed==='brightness'||state.changed==='twinkle') feedback.innerHTML=`${fields.find(f=>f.key===state.changed).name}会调整候选顺序。<strong>这只能调整候选顺序，不能定案。</strong>`;
    else feedback.innerHTML=r.ecliptic===0?`目标在搜索带外：<strong>通常先排除</strong>，不再由其他外观线索翻盘。`:`目标在黄道${r.ecliptic===2?'带内':'边缘'}：还要综合其余线索，<strong>仍不能确认。</strong>`;
  }
  document.querySelectorAll('.candidate-tab').forEach(b=>b.addEventListener('click',()=>dispatch({type:'select',id:b.dataset.id}),sig));
  rows.addEventListener('click',e=>{const b=e.target.closest('.choice');if(b)dispatch({type:'set',key:b.dataset.key,value:+b.dataset.value})},sig);
  rows.addEventListener('keydown',e=>{const b=e.target.closest('.choice');if(!b||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();e.stopPropagation();const d=(e.key==='ArrowRight'||e.key==='ArrowUp')?1:-1;const v=Math.max(0,Math.min(2,+b.dataset.value+d));dispatch({type:'set',key:b.dataset.key,value:v});requestAnimationFrame(()=>rows.querySelector(`[data-key="${b.dataset.key}"][data-value="${v}"]`).focus())},sig);
  document.addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key)){dispatch({type:'select',id:['A','B','C'][+e.key-1]});document.querySelector(`[data-id="${['A','B','C'][+e.key-1]}"]`).focus()}},sig);
  document.getElementById('reset').addEventListener('click',()=>{clearTimeout(resultTimer);dispatch({type:'reset'});document.querySelector('[data-id="A"]').focus();feedback.textContent='已恢复三份默认记录。'},sig);
  function destroy(){events.abort();clearTimeout(resultTimer)} window.addEventListener('pagehide',destroy,{once:true});
  render();
});
</script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
