<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="15" data-total="19">
<div id="stage">
<style>
.p15{height:100%;display:flex;flex-direction:column;gap:18px}.p15-head{display:flex;align-items:flex-end;justify-content:space-between;gap:48px}.p15-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.16em;color:var(--accent);margin:0 0 10px}.p15 h1{font:700 var(--fs-h1)/1.18 var(--font-sans);margin:0;color:var(--text)}.p15-intro{font:400 var(--fs-sec)/1.45 var(--font-sans);color:var(--star);max-width:520px;margin:0 0 3px}.p15-main{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}.p15-tabs{display:grid;grid-template-columns:1fr 1fr;gap:72px;padding:0 30px}.p15-tab{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 8px 10px;font:600 var(--fs-h2)/1.2 var(--font-sans)}.p15-tab span{font:400 var(--fs-label)/1.2 var(--font-sans);color:var(--star)}.p15-field{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--surface) 45%,transparent);overflow:hidden}.p15-field svg{position:absolute;inset:0;width:100%;height:100%}.p15-field .divider{stroke:var(--line);stroke-width:1}.p15-field .guide{fill:none;stroke:var(--star);stroke-width:1.5;opacity:.36}.p15-field .star{fill:var(--star)}.p15-field .candidate{fill:var(--text)}.p15-field .checkline{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:7 7}.p15-field .ring{fill:none;stroke:var(--accent);stroke-width:3}.star-btn{position:absolute;width:48px;height:48px;transform:translate(-50%,-50%);border:0;border-radius:50%;background:transparent;cursor:pointer}.star-btn:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}.star-btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.star-btn[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 12%,transparent)}.p15-legend{position:absolute;bottom:17px;font:400 var(--fs-label)/1.3 var(--font-sans);color:var(--star);display:flex;align-items:center;gap:9px}.p15-legend.left{left:24px}.p15-legend.right{left:calc(50% + 54px)}.dot-icon{width:10px;height:10px;border-radius:50%;background:var(--star)}.ring-icon{width:17px;height:17px;border:2px solid var(--accent);border-radius:50%}.p15-feedback{min-height:88px;display:flex;align-items:center;gap:22px;border-top:1px solid var(--line);padding:13px 4px 0}.p15-status{min-width:108px;font:700 var(--fs-label)/1 var(--font-sans);letter-spacing:.08em;color:var(--star)}.p15-status.hot{color:var(--accent)}.p15-copy{flex:1;min-width:0}.p15-copy strong{display:block;font:600 var(--fs-lead)/1.35 var(--font-sans);color:var(--text)}.p15-copy small{display:block;margin-top:4px;font:400 var(--fs-sec)/1.35 var(--font-sans);color:var(--star)}.p15 .btn{flex:0 0 auto}.p15-foot{display:flex;align-items:center;justify-content:space-between;gap:40px;padding-top:4px}.p15-take{margin:0;font:600 var(--fs-body)/1.35 var(--font-sans)}.p15-next{margin:0;font:400 var(--fs-sec)/1.35 var(--font-sans);color:var(--star)}
</style>
<main class="p15">
  <header class="p15-head">
    <div><p class="p15-kicker">CHECK THE GAP</p><h1>同一位置，天空有而恒星图没有</h1></div>
    <p class="p15-intro">两幅星野方向、尺度和裁切完全相同。逐点核对右图亮点，看左图同一位置是否有记录。</p>
  </header>
  <section class="p15-main min0" aria-label="并排局部星图核对">
    <div class="p15-tabs"><div class="p15-tab">纸质恒星图 <span>固定恒星框架</span></div><div class="p15-tab">今晚天空 <span>点击任一亮点</span></div></div>
    <div class="p15-field k-comparison" id="field">
      <svg viewBox="0 0 1486 510" role="img" aria-labelledby="chartTitle chartDesc">
        <title id="chartTitle">纸质恒星图与今晚天空的同尺度对照</title><desc id="chartDesc">两侧有七颗位置相同的恒星，今晚天空另有一个左图缺席的亮点。</desc>
        <line class="divider" x1="743" y1="0" x2="743" y2="510"/>
        <g id="links"></g>
        <g class="guide"><path d="M105 340 L240 120 L390 205 L555 92 L652 282"/><path d="M838 340 L973 120 L1123 205 L1288 92 L1385 282"/></g>
        <g id="leftStars"></g><g id="rightStars"></g><g id="selection"></g>
      </svg>
      <div id="hitTargets"></div>
      <div class="p15-legend left"><i class="dot-icon"></i>灰蓝点＝图上恒星</div>
      <div class="p15-legend right"><i class="ring-icon"></i>开放圆环＝正在核对</div>
    </div>
    <div class="p15-feedback">
      <div class="p15-status" id="status">尚未核对</div>
      <div class="p15-copy" aria-live="polite"><strong id="feedback">从今晚天空选择一个亮点。</strong><small id="caution">圆环会同时落在两图的同一坐标，便于直接比较。</small></div>
      <button class="btn" id="reset" type="button" disabled>清除核对</button>
    </div>
  </section>
  <footer class="p15-foot"><p class="p15-take">星形已经对准时，图上缺席的亮点是强候选，但还不是确认。</p><p class="p15-next">隔几晚再看，它会不会相对邻星换位置？</p></footer>
</main>
<script>
window.addEventListener('load',()=>{
  Deck.init({index:15,total:19});
  const stars=[
    {id:'A',x:105,y:340,r:8,label:'定位星 A',text:'图上有：属于已印出的恒星框架。'},
    {id:'B',x:240,y:120,r:6,label:'定位星 B',text:'图上有：继续核对别的亮点。'},
    {id:'C',x:390,y:205,r:8,label:'定位星 C',text:'图上有：不是“图上缺席”。'},
    {id:'d1',x:555,y:92,r:4,label:'周边暗星 1',text:'图上有：亮暗略有差别不等于缺席。'},
    {id:'d2',x:652,y:282,r:4,label:'周边暗星 2',text:'图上有：亮暗略有差别不等于缺席。'},
    {id:'d3',x:475,y:382,r:4,label:'周边暗星 3',text:'图上有：亮暗略有差别不等于缺席。'},
    {id:'d4',x:174,y:430,r:4,label:'周边暗星 4',text:'图上有：亮暗略有差别不等于缺席。'},
    {id:'P',x:602,y:405,r:9,label:'额外亮点 P',candidate:true,text:'图上没有：标为强候选，留待跨夜复查。'}
  ];
  const left=document.querySelector('#leftStars'),right=document.querySelector('#rightStars'),selection=document.querySelector('#selection'),targets=document.querySelector('#hitTargets');
  const field=document.querySelector('#field'),status=document.querySelector('#status'),feedback=document.querySelector('#feedback'),caution=document.querySelector('#caution'),reset=document.querySelector('#reset');
  const NS='http://www.w3.org/2000/svg';
  const circle=(parent,cx,cy,r,cls)=>{const n=document.createElementNS(NS,'circle');n.setAttribute('cx',cx);n.setAttribute('cy',cy);n.setAttribute('r',r);n.setAttribute('class',cls);parent.appendChild(n)};
  stars.forEach(s=>{if(!s.candidate)circle(left,s.x,s.y,s.r,'star');circle(right,s.x+733,s.y,s.r,s.candidate?'candidate':'star');const b=document.createElement('button');b.type='button';b.className='star-btn';b.dataset.id=s.id;b.setAttribute('aria-label',`核对${s.label}`);b.setAttribute('aria-pressed','false');b.style.left=`${(s.x+733)/1486*100}%`;b.style.top=`${s.y/510*100}%`;targets.appendChild(b)});
  const initialState=()=>({selected:null});let state=initialState();
  function render(){selection.replaceChildren();document.querySelectorAll('.star-btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===state.selected)));if(!state.selected){status.textContent='尚未核对';status.classList.remove('hot');feedback.textContent='从今晚天空选择一个亮点。';caution.textContent='圆环会同时落在两图的同一坐标，便于直接比较。';reset.disabled=true;return}const s=stars.find(v=>v.id===state.selected);circle(selection,s.x,s.y,15,'ring');circle(selection,s.x+733,s.y,15,'ring');const line=document.createElementNS(NS,'line');line.setAttribute('x1',s.x+16);line.setAttribute('x2',s.x+717);line.setAttribute('y1',s.y);line.setAttribute('y2',s.y);line.setAttribute('class','checkline');selection.prepend(line);status.textContent=s.candidate?'强候选':'图上有';status.classList.toggle('hot',s.candidate);feedback.textContent=s.text;caution.textContent=s.candidate?'也可能是印刷深度、版本或遗漏造成，先别写成“已确认行星”。':'两侧同位置都有星点；可继续核对其他亮点。';reset.disabled=false}
  const events=new AbortController();targets.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state={selected:b.dataset.id};render()},{signal:events.signal});reset.addEventListener('click',()=>{state=initialState();render();targets.querySelector('button').focus()},{signal:events.signal});
  function destroy(){events.abort()}window.addEventListener('pagehide',destroy,{once:true});render();
});
</script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
