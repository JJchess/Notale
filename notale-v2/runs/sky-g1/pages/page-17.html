<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="17" data-total="19">
<div id="stage">
  <style>
    #stage{position:relative;gap:18px;overflow:hidden}
    .head{display:flex;align-items:flex-end;justify-content:space-between;flex:0 0 auto}
    .kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.18em;color:var(--accent);margin-bottom:10px}
    h1{font:700 var(--fs-h1)/1.18 var(--font-sans);margin:0;color:var(--text)}
    .head-note{font:var(--fs-sec)/1.45 var(--font-sans);color:var(--star);max-width:420px;text-align:right;padding-bottom:2px}
    .work{position:relative;display:grid;grid-template-columns:270px 1fr 238px;gap:18px;flex:1;min-height:0}
    .panel{position:relative;z-index:1}
    .chooser{display:flex;flex-direction:column;gap:14px;padding:22px}
    .chooser h2,.decision h2{font:600 var(--fs-h2)/1.3 var(--font-sans);margin:0;color:var(--text)}
    .hint{margin:0;font-size:var(--fs-label);line-height:1.45}
    .candidate-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
    .candidate{height:84px;text-align:left;display:grid;grid-template-columns:52px 1fr;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);font:var(--fs-body)/1.25 var(--font-sans);cursor:pointer}
    .candidate .ring{width:32px;height:32px;border:2px solid var(--star);border-radius:50%;display:grid;place-items:center;font-weight:700}
    .candidate small{display:block;color:var(--star);font-size:var(--fs-label);margin-top:3px}
    .candidate[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
    .candidate[aria-pressed="true"] .ring{border-color:var(--accent);color:var(--accent)}
    .chain{position:relative;display:flex;align-items:stretch;min-width:0;padding:64px 12px 52px}
    .chain-title{position:absolute;left:16px;top:20px;font:600 var(--fs-h2)/1.3 var(--font-sans)}
    .stage-cards{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;position:relative;z-index:2}
    .gate{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:18px 16px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;transition:border-color 120ms,opacity 120ms}
    .gate::before{content:attr(data-n);font:700 var(--fs-label)/1 var(--font-mono);color:var(--star)}
    .gate h3{font:600 var(--fs-body)/1.35 var(--font-sans);margin:12px 0 0;min-height:50px}
    .evidence{font:var(--fs-sec)/1.48 var(--font-sans);color:var(--star);margin:22px 0 14px}
    .mark{display:flex;align-items:center;gap:9px;font:700 var(--fs-label)/1.25 var(--font-sans)}
    .mark i{display:block;width:16px;height:16px;border-radius:50%;border:2px solid var(--star)}
    .gate.current{border-color:var(--accent)} .gate.current::before,.gate.current .mark{color:var(--accent)} .gate.current .mark i{border-color:var(--accent)}
    .gate.fail .mark i{border-radius:0;transform:rotate(45deg)}
    .decision{display:flex;flex-direction:column;padding:22px 18px;gap:12px}
    .decision-buttons{display:flex;flex-direction:column;gap:10px;margin-top:4px}
    .decision .btn{min-height:52px;white-space:normal;font-size:var(--fs-label)}
    .decision .btn.chosen{border-color:var(--accent);color:var(--accent)}
    .feedback{min-height:92px;margin-top:4px;padding-top:14px;border-top:1px solid var(--line);font:var(--fs-sec)/1.5 var(--font-sans);color:var(--star)}
    .feedback strong{display:block;color:var(--text);margin-bottom:5px}
    .reset{margin-top:auto;align-self:flex-start;background:transparent}
    .connector{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}
    .connector path{fill:none;stroke:var(--star);stroke-width:2;stroke-dasharray:7 7;opacity:.35}
    .connector path.lit{stroke:var(--accent);stroke-dasharray:none;opacity:1}
    .connector circle{fill:var(--bg);stroke:var(--star);stroke-width:2}
    .connector circle.done{stroke:var(--accent)}
    .footer{flex:0 0 96px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 470px;gap:34px;align-items:center}
    .takeaway{font:600 var(--fs-lead)/1.4 var(--font-sans);margin:0}
    .next{font:var(--fs-sec)/1.45 var(--font-sans);color:var(--star);margin:0;padding-left:22px;border-left:2px solid var(--accent)}
    .complete .takeaway{color:var(--text)}
    @media (prefers-reduced-motion:reduce){.gate{transition:none}}
  </style>
  <header class="head">
    <div><div class="kicker">EVIDENCE CHECK</div><h1>四项证据连成链，候选才能确认</h1></div>
    <div class="head-note">同一份记录必须沿同一条水平基线穿过四关。先选记录，再作末端裁决。</div>
  </header>
  <main class="work min0 k-classification" aria-label="候选记录四关裁决器">
    <svg class="connector" aria-hidden="true"><path id="baseLine"/><path id="activeLine"/><g id="nodes"></g></svg>
    <section class="panel chooser min0" aria-labelledby="recordTitle">
      <h2 id="recordTitle">候选记录</h2><p class="hint">点选 A、B、C；聚焦后也可用方向键切换。</p>
      <div class="candidate-list" role="group" aria-label="选择候选记录">
        <button class="candidate" data-id="A" aria-pressed="true"><span class="ring">A</span><span>记录 A<small>四项均待核对</small></span></button>
        <button class="candidate" data-id="B" aria-pressed="false"><span class="ring">B</span><span>记录 B<small>四项均待核对</small></span></button>
        <button class="candidate" data-id="C" aria-pressed="false"><span class="ring">C</span><span>记录 C<small>四项均待核对</small></span></button>
      </div>
    </section>
    <section class="chain min0" aria-labelledby="chainTitle">
      <h2 class="chain-title" id="chainTitle">四个连续证据关口</h2>
      <div class="stage-cards" id="gates"></div>
    </section>
    <section class="panel decision min0" aria-labelledby="decisionTitle">
      <h2 id="decisionTitle">末端裁决</h2><p class="hint">依据整条证据链，只选一个结局。</p>
      <div class="decision-buttons">
        <button class="btn" data-verdict="确认">确认行星</button>
        <button class="btn" data-verdict="保留">保留候选</button>
        <button class="btn" data-verdict="排除">排除重找</button>
      </div>
      <div class="feedback" id="feedback" aria-live="polite"><strong>尚未裁决</strong>先读完四关记录。</div>
      <button class="btn reset" id="reset">重新裁决</button>
    </section>
  </main>
  <footer class="footer" id="footer">
    <p class="takeaway">正确对图、位于搜索带、图上缺席、跨夜移动：四项缺一，只能保留或排除，不能确认。</p>
    <p class="next"><strong>下一问</strong><br>到户外后，怎样按顺序完成并记下这四项核对？</p>
  </footer>
  <script>
  window.addEventListener('DOMContentLoaded',()=>{
    Deck.init({index:17,total:19});
    const records={
      A:{items:[['三颗定位星形状吻合','通过'],['黄道上下各 9°内','通过'],['没有对应星点','通过'],['相对邻星改变位置','通过']],answer:'确认',feedback:'证据链完整：可以确认。'},
      B:{items:[['三颗定位星形状吻合','通过'],['黄道上下各 9°内','通过'],['没有对应星点','通过'],['相对邻星位置未见变化','不足']],answer:'保留',feedback:'缺少跨夜移动证据，暂不确认。'},
      C:{items:[['三颗定位星形状不吻合','失效'],['看似位于搜索带','未验证'],['没有对应星点','未验证'],['看似发生移动','未验证']],answer:'排除',feedback:'星形没有对准，后续比较失去共同基线。'}
    };
    const titles=['图对准了吗？','在搜索带内吗？','恒星图上缺席吗？','相对邻星移动了吗？'];
    const makeState=()=>({selected:'A',answers:{},animStep:-1}); let state=makeState();
    const gates=document.querySelector('#gates'), feedback=document.querySelector('#feedback'), footer=document.querySelector('#footer');
    const candidates=[...document.querySelectorAll('.candidate')], verdicts=[...document.querySelectorAll('[data-verdict]')];
    const events=new AbortController(); let timers=[]; const cancel=()=>{timers.forEach(clearTimeout);timers=[]};
    function firstIssue(r){return r.items.findIndex(x=>x[1]!=='通过')}
    function render(){
      const r=records[state.selected], issue=firstIssue(r), chosen=state.answers[state.selected];
      candidates.forEach(b=>{b.setAttribute('aria-pressed',b.dataset.id===state.selected);b.querySelector('small').textContent=state.answers[b.dataset.id]?'已裁决：'+state.answers[b.dataset.id]:'四项均待核对'});
      gates.innerHTML=r.items.map((it,i)=>`<article class="gate ${i===(issue<0?3:issue)?'current':''} ${it[1]==='失效'?'fail':''}" data-n="0${i+1}"><h3>${titles[i]}</h3><p class="evidence">${it[0]}</p><div class="mark"><i></i>${it[1]}</div></article>`).join('');
      verdicts.forEach(b=>b.classList.toggle('chosen',chosen===b.dataset.verdict));
      if(chosen){const ok=chosen===r.answer;feedback.innerHTML=`<strong>${ok?'裁决成立':'证据不支持这个裁决'}</strong>${ok?r.feedback:(issue===0?'定位星形未吻合，后续证据没有共同基线。':issue===3?'还没有观察到跨夜移动，不能确认。':'请沿四关逐项核对。')}`}
      else feedback.innerHTML='<strong>尚未裁决</strong>先读完四关记录。';
      footer.classList.toggle('complete',Object.keys(state.answers).length===3&&Object.keys(state.answers).every(k=>state.answers[k]===records[k].answer));
      draw();
    }
    function draw(){
      const svg=document.querySelector('.connector'), wr=document.querySelector('.work').getBoundingClientRect(), cards=[...document.querySelectorAll('.gate')]; if(!cards.length)return;
      const p=el=>{const r=el.getBoundingClientRect();return{x:(r.left+r.width/2-wr.left)/Deck.s,y:(r.top+r.height/2-wr.top)/Deck.s}};
      const pts=cards.map(p), x0=p(document.querySelector('.candidate[aria-pressed="true"]')), x1=p(document.querySelector('.decision'));
      const all=[{x:x0.x+105,y:x0.y},...pts,{x:x1.x-100,y:pts[0].y}]; const d=all.map((q,i)=>(i?'L':'M')+q.x+' '+q.y).join(' ');
      document.querySelector('#baseLine').setAttribute('d',d); const chosen=state.answers[state.selected], max=chosen?state.animStep:-1;
      document.querySelector('#activeLine').setAttribute('d',max<0?'':all.slice(0,Math.min(max+2,all.length)).map((q,i)=>(i?'L':'M')+q.x+' '+q.y).join(' ')); document.querySelector('#activeLine').classList.add('lit');
      document.querySelector('#nodes').innerHTML=pts.map((q,i)=>`<circle class="${i<=max?'done':''}" cx="${q.x}" cy="${q.y}" r="${Object.keys(state.answers).length===3&&Object.keys(state.answers).every(k=>state.answers[k]===records[k].answer)?9:6}"/>`).join('');
    }
    function select(id,focus=false){cancel();state={...state,selected:id,animStep:-1};render();if(focus)candidates.find(b=>b.dataset.id===id).focus()}
    candidates.forEach((b,i)=>{b.addEventListener('click',()=>select(b.dataset.id),{signal:events.signal});b.addEventListener('keydown',e=>{let n=e.key==='ArrowDown'||e.key==='ArrowRight'?1:e.key==='ArrowUp'||e.key==='ArrowLeft'?-1:0;if(n){e.preventDefault();e.stopPropagation();select(candidates[(i+n+3)%3].dataset.id,true)}},{signal:events.signal})});
    verdicts.forEach(b=>b.addEventListener('click',()=>{cancel();state={...state,answers:{...state.answers,[state.selected]:b.dataset.verdict},animStep:Deck.reduced()?4:0};render();if(!Deck.reduced())for(let i=1;i<=4;i++)timers.push(setTimeout(()=>{state={...state,animStep:i};render()},i*140));},{signal:events.signal}));
    document.querySelector('#reset').addEventListener('click',()=>{cancel();state=makeState();render();candidates[0].focus();feedback.innerHTML='<strong>已重新裁决</strong>已回到记录 A，三份作答已清空。'},{signal:events.signal});
    const offResize=Deck.onResize(draw);function destroy(){cancel();events.abort();offResize()}window.addEventListener('pagehide',destroy,{once:true});render();
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
