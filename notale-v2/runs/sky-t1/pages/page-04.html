<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#07111F;--text:#edf5fa;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#FFD166;--ink:#c9d9e4;--dim:#7891a4;--map:#86BBD8;--candidate:#FFD166;}
*{box-sizing:border-box} #stage{padding:28px 56px;display:flex;flex-direction:column;gap:15px;background:var(--bg);overflow:hidden}
header{height:92px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid rgba(134,187,216,.38);padding-bottom:14px}.kicker{font:600 var(--fs-label) var(--font-mono);letter-spacing:.15em;color:var(--map);margin-bottom:8px}.title{margin:0;font-size:var(--fs-h1);line-height:1.2;color:var(--text)}.headnote{width:360px;font-size:var(--fs-sec);line-height:1.45;color:var(--ink);padding-bottom:2px}
.comparison{flex:1;min-height:0;display:flex;gap:34px;align-items:stretch}.map-zone{flex:1;min-width:0;display:flex;gap:26px;align-items:center;justify-content:center}.map-card{width:48%;max-width:490px;min-width:0;display:flex;flex-direction:column;align-items:center}.map-label{align-self:stretch;display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-label);font-weight:700;color:var(--text);margin:0 0 9px}.map-label span{font-family:var(--font-mono);font-size:var(--fs-sec);color:var(--map)}.sky{width:100%;aspect-ratio:1;border:1px solid rgba(134,187,216,.8);background:radial-gradient(circle at 50% 44%,#10273a 0,#091827 61%,#06101d 100%);overflow:hidden}.sky svg{width:100%;height:100%;display:block}.mapline{stroke:var(--map);stroke-width:1.8;fill:none;opacity:.8}.star{fill:#edf5fa}.bright{stroke:#edf5fa;stroke-width:1.4}.ecliptic{stroke:var(--candidate);stroke-width:5;stroke-dasharray:11 9;fill:none}.horizon{stroke:#c9d9e4;stroke-width:7;fill:none;stroke-linecap:round}.baseText{font:700 17px var(--font-sans);fill:#c9d9e4}.smallText{font:14px var(--font-sans);fill:#86BBD8}.map-ring{stroke:rgba(134,187,216,.5);stroke-width:2;fill:none}.axis{stroke:rgba(134,187,216,.4);stroke-width:1.5;stroke-dasharray:3 6}
.control-panel{width:365px;flex:0 0 365px;border:1px solid rgba(134,187,216,.6);border-radius:18px;padding:25px 25px 20px;display:flex;flex-direction:column;justify-content:center;background:rgba(11,31,47,.72)}.panel-title{font-size:var(--fs-h2);margin:0 0 22px;color:var(--text)}.readout{border-left:4px solid var(--candidate);padding:5px 0 7px 16px;margin-bottom:22px}.time{font:700 38px var(--font-mono);letter-spacing:.04em;color:var(--candidate);line-height:1}.derivation{font-size:var(--fs-body);line-height:1.55;color:var(--text);margin:10px 0 0}.derivation b{color:var(--candidate);font-family:var(--font-mono);font-weight:700}.ctl{margin:5px 0 0}.ctl label{display:flex;justify-content:space-between;font-size:var(--fs-label);color:var(--ink);font-weight:700}.ctl output{font-family:var(--font-mono);color:var(--candidate)}input[type=range]{width:100%;accent-color:var(--candidate);margin:13px 0 4px;cursor:pointer}.ticks{display:flex;justify-content:space-between;font:var(--fs-tick) var(--font-mono);color:var(--dim)}.hint{font-size:var(--fs-label);line-height:1.45;color:var(--ink);margin:23px 0 0}.reset{margin-top:18px;align-self:flex-start;background:transparent;border:1px solid var(--map);border-radius:7px;color:var(--text);font:600 var(--fs-label) var(--font-sans);padding:8px 14px;cursor:pointer}.reset:hover{background:rgba(134,187,216,.14)}
footer{height:94px;border-top:1px solid rgba(134,187,216,.38);padding-top:13px;display:flex;justify-content:space-between;gap:38px}.legend{display:flex;gap:23px;align-items:flex-start;font-size:var(--fs-label);color:var(--ink);padding-top:5px}.legend i{display:inline-block;width:30px;vertical-align:middle;margin-right:8px}.legend .cyan{border-top:3px solid var(--map)}.legend .yellow{border-top:4px dashed var(--candidate)}.takeaway{max-width:690px;font-size:var(--fs-lead);line-height:1.4;color:var(--text)}.takeaway strong{color:var(--candidate)}.next{font-size:var(--fs-label);color:var(--map);text-align:right;max-width:340px;line-height:1.45}
@media (prefers-reduced-motion:reduce){#right-group{transition:none!important}}
</style>
</head>
<body data-page="04" data-total="20">
<div id="stage">
<header><div><div class="kicker">TIME SETTING</div><h1 class="title">晚两小时，天空相对地平线约转过 30°</h1></div><div class="headnote">先固定一张星图，再只改变观测时刻。比较的是同一批恒星相对地平线的位置。</div></header>
<main class="comparison k-comparison">
<section class="map-zone min0" aria-label="同尺度星图对照">
<div class="map-card"><div class="map-label">基准时刻 <span>20:00</span></div><div class="sky" id="left-map"></div></div>
<div class="map-card"><div class="map-label">观测时刻 <span id="map-time">22:00</span></div><div class="sky" id="right-map"></div></div>
</section>
<aside class="control-panel panel min0" aria-label="观测时刻控制"><h2 class="panel-title">只移动右边这张图</h2><div class="readout"><div class="time" id="time-readout">22:00</div><p class="derivation" id="derivation" aria-live="polite">相差 <b>2 小时</b> × 约 <b>15°/小时</b><br>= 约 <b>30°</b></p></div><div class="ctl"><label for="time-slider">观测时刻 <output id="slider-output">22:00</output></label><input id="time-slider" type="range" min="20" max="22" step="1" value="22" aria-describedby="time-hint"><div class="ticks"><span>20:00</span><span>21:00</span><span>22:00</span></div></div><p class="hint" id="time-hint">拖动或用方向键改变时刻；恒星、连线和黄道会一起转，地平线不动。</p><button class="reset" type="button" id="reset">重置到 22:00</button></aside>
</main>
<footer><div class="legend"><span><i class="cyan"></i>青蓝：同一恒星背景</span><span><i class="yellow"></i>黄虚线：黄道</span></div><div class="takeaway">同一张星图必须对应观测时刻；每晚每过一小时，朝向约改变 <strong>15°</strong>。</div><div class="next">拿到纸图后，最先该找出哪几条决定“能否对上天空”的线？</div></footer>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
(()=>{
'use strict';
const rate=15; let state={hour:22}; let timer=0;
const stars=[[151,130,5],[260,103,3],[340,167,4],[385,264,3],[311,330,5],[204,295,3],[126,255,4],[224,205,2],[291,236,2],[178,348,2]];
const lines='151,130 224,205 260,103 340,167 291,236 385,264 311,330 204,295 126,255 151,130';
function svg(id,right){const pts=stars.map(([x,y,r])=>`<circle class="star ${r>3?'bright':''}" cx="${x}" cy="${y}" r="${r}"/>`).join('');return `<svg viewBox="0 0 480 480" role="img" aria-label="圆形星图，包含恒星背景、黄道和固定地平线"><circle class="map-ring" cx="240" cy="240" r="224"/><line class="axis" x1="240" y1="22" x2="240" y2="458"/><g id="${id}" style="transform-origin:240px 240px"><polyline class="mapline" points="${lines}"/>${pts}<path class="ecliptic" d="M55 298 Q240 170 425 243"/><text class="smallText" x="307" y="193">黄道</text></g><path class="horizon" d="M55 360 Q240 278 425 360"/><text class="baseText" x="38" y="383">西</text><text class="baseText" x="231" y="325">南</text><text class="baseText" x="425" y="383">东</text></svg>`}
document.getElementById('left-map').innerHTML=svg('left-group');document.getElementById('right-map').innerHTML=svg('right-group');
const slider=document.getElementById('time-slider'), group=document.getElementById('right-group');
function calc(h){const dt=h-20;return {dt,angle:dt*rate};}
function render(){const {dt,angle}=calc(state.hour),time=state.hour+':00';document.getElementById('map-time').textContent=time;document.getElementById('time-readout').textContent=time;document.getElementById('slider-output').textContent=time;document.getElementById('derivation').innerHTML=`相差 <b>${dt} 小时</b> × 约 <b>${rate}°/小时</b><br>= 约 <b>${angle}°</b>`;group.style.transition=Deck.reduced()?'none':'transform 350ms ease-out';group.style.transform=`rotate(${angle}deg)`;}
function setHour(v){const h=Math.max(20,Math.min(22,Number(v)));if(!Number.isInteger(h))return;state={hour:h};slider.value=h;render()}
slider.addEventListener('input',e=>setHour(e.target.value));document.getElementById('reset').addEventListener('click',()=>{setHour(22);slider.focus()});render();Deck.init({index:4,total:20});
})();
</script>
</body></html>
