<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#07111F;--text:#eef5f8;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#FFD166;--map:#86BBD8;--candidate:#FFD166;}
*{box-sizing:border-box} body{margin:0;overflow:hidden} #stage{height:900px;padding:28px 56px;display:flex;flex-direction:column;color:var(--text);font-family:var(--font-sans);background:radial-gradient(ellipse at 73% 36%,#102942 0%,#07111F 52%,#050b15 100%)}
.header{height:150px;border-bottom:1px solid rgba(134,187,216,.35);display:flex;align-items:flex-start;justify-content:space-between;padding:8px 0 22px}.kicker{font:600 var(--fs-label) var(--font-mono);letter-spacing:.16em;color:var(--map);margin-bottom:11px}.header h1{font-size:var(--fs-h1);line-height:1.25;margin:0;font-weight:650;letter-spacing:.02em}.progress{width:250px;margin-top:24px;text-align:right}.progress-label{font:var(--fs-label) var(--font-mono);color:var(--candidate);letter-spacing:.04em}.progress-track{height:5px;background:rgba(134,187,216,.2);margin-top:10px}.progress-fill{display:block;height:100%;width:0;background:var(--candidate);transition:width .2s ease}
.main{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:22px}.intro{height:52px;display:flex;align-items:flex-start;justify-content:space-between;gap:25px}.instruction{font-size:var(--fs-lead);line-height:1.4;margin:0}.instruction b{color:var(--candidate);font-weight:650}.shared-note{font-size:var(--fs-label);line-height:1.4;color:#b7cad6;max-width:365px;text-align:right;margin:3px 0 0}
.triptych{flex:1;min-height:0;display:flex;gap:28px;position:relative;padding-top:14px}.column{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}.column:not(:last-child)::after{content:"";position:absolute;right:-23px;top:46%;height:1px;width:17px;background:rgba(134,187,216,.15)}.paper{flex:1;min-height:0;border:1px solid rgba(134,187,216,.65);background:linear-gradient(130deg,rgba(16,45,68,.55),rgba(7,17,31,.16));position:relative;overflow:hidden}.paper svg{width:100%;height:100%;display:block}.column-head{height:54px;padding:0 0 10px;border-bottom:1px solid rgba(134,187,216,.22);display:flex;align-items:end;gap:10px}.step{font:var(--fs-tick) var(--font-mono);color:var(--map);border:1px solid rgba(134,187,216,.5);padding:3px 6px}.column h2{font-size:var(--fs-h2);line-height:1.2;margin:0;font-weight:600}.legend{font-size:var(--fs-label);line-height:1.35;color:#d9e7ed;margin:12px 0 6px;min-height:22px}.legend-mark{display:inline-block;width:9px;height:9px;border:2px solid var(--map);margin-right:7px;vertical-align:1px}.feedback{min-height:52px;border-left:3px solid rgba(134,187,216,.45);padding:7px 11px;color:#b9ccd7;font-size:var(--fs-sec);line-height:1.4}.column.done .feedback{border-color:var(--candidate);color:#fff3c7}.column.done .legend-mark{border-color:var(--candidate);background:var(--candidate)}
.hit{position:absolute;appearance:none;border:0;background:transparent;cursor:pointer;z-index:3;padding:0}.hit:focus-visible{outline:3px solid var(--candidate);outline-offset:3px}.hit.arc{left:9%;bottom:13%;width:82%;height:34px;border-radius:50%}.hit.direction{top:74%;left:21%;width:58%;height:54px}.hit.ecliptic{left:9%;top:30%;width:83%;height:138px;transform:rotate(-22deg)}.hit.wrong-star{left:39%;top:23%;width:42px;height:42px;border-radius:50%}.hit.wrong-line{left:17%;top:35%;width:62%;height:82px;transform:rotate(-12deg)}
.mapline{stroke:var(--map);stroke-width:2;fill:none;opacity:.7}.horizon{stroke:var(--map);stroke-width:8;fill:none;opacity:.9}.ecliptic{stroke:var(--map);stroke-width:8;stroke-dasharray:18 13;fill:none;opacity:.9}.star{fill:#dce9ed}.faint{opacity:.2}.bright{fill:#fff}.flare{stroke:#fff;stroke-width:2}.dir{fill:var(--map);font:600 21px var(--font-sans)}.selected .horizon,.selected .ecliptic{stroke:var(--candidate);filter:drop-shadow(0 0 4px rgba(255,209,102,.42))}.selected .dir{fill:var(--candidate);font-weight:800}.selected .arc-label{fill:var(--candidate)}.arc-label{fill:var(--map);font:600 15px var(--font-sans);letter-spacing:2px}.wrong-note{position:absolute;z-index:5;font-size:var(--fs-label);line-height:1.25;color:#ffe5a2;background:#17283a;border:1px solid var(--candidate);padding:7px 10px;max-width:220px;pointer-events:none;opacity:0;transition:opacity .15s;left:16px;bottom:16px}.wrong-note.show{opacity:1}.bottom{height:88px;border-top:1px solid rgba(134,187,216,.35);display:flex;align-items:center;justify-content:space-between}.takeaway{font-size:var(--fs-sec);line-height:1.45;max-width:970px;margin:0;color:#dbe7eb}.takeaway strong{color:var(--candidate);font-weight:650}.reset{display:none;border:1px solid var(--candidate);color:#fff0bf;background:transparent;border-radius:4px;padding:10px 16px;font:600 var(--fs-label) var(--font-sans);cursor:pointer}.reset:focus-visible{outline:3px solid #fff;outline-offset:3px}.complete-arrow{position:absolute;display:none;left:0;right:0;top:45%;justify-content:space-around;pointer-events:none;color:var(--candidate);font:var(--fs-label) var(--font-sans);z-index:6}.complete-arrow.show{display:flex}.complete-arrow span{background:#07111F;padding:5px 10px;border-top:1px solid var(--candidate)}
@media (prefers-reduced-motion:reduce){.progress-fill,.wrong-note{transition:none}}
</style>
</head>
<body data-page="05" data-total="20">
<div id="stage">
 <header class="header"><div><div class="kicker">READ THE MAP KEY</div><h1>先找地平线、方位和黄道，名字可以以后再看</h1></div><div class="progress"><div class="progress-label" id="progressText">已标出 0 / 3</div><div class="progress-track"><span class="progress-fill" id="progressFill"></span></div></div></header>
 <main class="main k-classification"><div class="intro"><p class="instruction">依次点出每张图里<strong>今晚最先要读的标记</strong>。</p><p class="shared-note">恒星与连线只是稳定背景；三种标记都要在同一方向基准下读。</p></div>
 <section class="triptych" aria-label="三种先读的星图标记">
  <div class="complete-arrow" id="flow"><span>看见哪半边　→　朝哪边举图　→　沿哪里搜索</span></div>
  <article class="column min0" data-key="horizon"><div class="column-head"><span class="step">01</span><h2>可见范围</h2></div><div class="paper"><svg viewBox="0 0 440 410" aria-hidden="true"><g class="stars"><path class="mapline" d="M64 91L156 58L244 112L345 65M156 58L195 180L286 202"/><circle class="star" cx="64" cy="91" r="4"/><circle class="bright" cx="156" cy="58" r="6"/><path class="flare" d="M156 45v-10M156 71v10M143 58h-10M169 58h10"/><circle class="star" cx="244" cy="112" r="4"/><circle class="star" cx="345" cy="65" r="3"/><circle class="star" cx="195" cy="180" r="5"/><circle class="star faint" cx="92" cy="310" r="5"/><circle class="star faint" cx="236" cy="330" r="4"/><circle class="star faint" cx="357" cy="301" r="5"/></g><g class="target"><path class="horizon" d="M28 283 Q220 371 412 283"/><text class="arc-label" x="188" y="348">地平线</text></g></svg><button class="hit arc" data-action="correct" aria-label="标出地平线"></button><button class="hit wrong-star" data-action="wrong" aria-label="恒星：不是优先图例"></button><div class="wrong-note" aria-live="polite"></div></div><div class="legend"><span class="legend-mark"></span>地平线</div><div class="feedback" aria-live="polite">点图上的标记</div></article>
  <article class="column min0" data-key="direction"><div class="column-head"><span class="step">02</span><h2>举图方向</h2></div><div class="paper"><svg viewBox="0 0 440 410" aria-hidden="true"><path class="mapline" d="M54 113L148 74L255 151L366 92M148 74L212 207L309 185"/><circle class="star" cx="54" cy="113" r="4"/><circle class="bright" cx="148" cy="74" r="6"/><path class="flare" d="M148 61v-10M148 87v10M135 74h-10M161 74h10"/><circle class="star" cx="255" cy="151" r="4"/><circle class="star" cx="366" cy="92" r="3"/><circle class="star" cx="212" cy="207" r="5"/><g class="target"><path class="horizon" d="M28 283 Q220 371 412 283"/><text class="dir" x="72" y="302">东</text><text class="dir" x="207" y="340">南</text><text class="dir" x="350" y="302">西</text></g></svg><button class="hit direction" data-action="correct" aria-label="标出方位：东、南、西"></button><button class="hit wrong-line" data-action="wrong" aria-label="星座连线：不是优先图例"></button><div class="wrong-note" aria-live="polite"></div></div><div class="legend"><span class="legend-mark"></span>方位</div><div class="feedback" aria-live="polite">点图上的标记</div></article>
  <article class="column min0" data-key="ecliptic"><div class="column-head"><span class="step">03</span><h2>优先搜索区</h2></div><div class="paper"><svg viewBox="0 0 440 410" aria-hidden="true"><path class="mapline" d="M48 95L144 142L232 72L358 132M144 142L202 232L314 209"/><circle class="star" cx="48" cy="95" r="4"/><circle class="bright" cx="144" cy="142" r="6"/><path class="flare" d="M144 129v-10M144 155v10M131 142h-10M157 142h10"/><circle class="star" cx="232" cy="72" r="4"/><circle class="star" cx="358" cy="132" r="3"/><circle class="star" cx="202" cy="232" r="5"/><g class="target"><path class="ecliptic" d="M31 261 Q190 154 412 96"/></g><path class="horizon" d="M28 283 Q220 371 412 283"/></svg><button class="hit ecliptic" data-action="correct" aria-label="标出黄道"></button><button class="hit wrong-star" data-action="wrong" aria-label="恒星：不是优先图例"></button><div class="wrong-note" aria-live="polite"></div></div><div class="legend"><span class="legend-mark"></span>黄道</div><div class="feedback" aria-live="polite">点图上的标记</div></article>
 </section></main>
 <footer class="bottom"><p class="takeaway"><strong>能先读出这三种标记，</strong>纸质星图才知道哪一边是可见天空、该朝哪边举、该沿哪里找。　<span>图上哪些星其实已经落到地平线以下了？</span></p><button class="reset" id="reset" type="button">重新标出</button></footer>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
(()=>{ 'use strict'; Deck.init({index:5,total:20});
 const notes={horizon:'弧线上方：今晚可能看见',direction:'让图上的方位朝向真实方位',ecliptic:'之后沿这条线附近找候选亮点'};
 const initial=()=>({horizon:false,direction:false,ecliptic:false}); let state=initial(); let timers=[];
 const cols=[...document.querySelectorAll('.column')], progress=document.getElementById('progressText'),fill=document.getElementById('progressFill'),flow=document.getElementById('flow'),reset=document.getElementById('reset');
 function render(){let n=Object.values(state).filter(Boolean).length; progress.textContent=`已标出 ${n} / 3`;fill.style.width=`${n/3*100}%`;cols.forEach(col=>{let key=col.dataset.key,done=state[key];col.classList.toggle('done',done);col.querySelector('.paper svg').classList.toggle('selected',done);col.querySelector('.feedback').textContent=done?notes[key]:'点图上的标记';col.querySelector('[data-action="correct"]').setAttribute('aria-pressed',String(done));});let complete=n===3;flow.classList.toggle('show',complete);reset.style.display=complete?'block':'none';}
 function wrong(btn){let note=btn.parentElement.querySelector('.wrong-note');note.textContent='这不是今晚最先要找的图例';note.classList.add('show');let id=setTimeout(()=>note.classList.remove('show'),1700);timers.push(id)}
 function act(btn){let col=btn.closest('.column'),key=col.dataset.key;if(btn.dataset.action==='wrong'){wrong(btn);return}if(!state[key]){state={...state,[key]:true};render();}}
 document.querySelectorAll('.hit').forEach(b=>b.addEventListener('click',()=>act(b)));
 reset.addEventListener('click',()=>{timers.forEach(clearTimeout);timers=[];state=initial();render();progress.focus?.();});
 render();
 window.addEventListener('pagehide',()=>{timers.forEach(clearTimeout);timers=[]},{once:true});
})();
</script>
</body></html>
