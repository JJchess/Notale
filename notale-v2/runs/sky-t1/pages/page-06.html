<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#07111F;--text:#e8f2f6;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#FFD166;--map:#86BBD8;--candidate:#FFD166;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text)}
#stage{padding:28px 56px;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(ellipse at 47% 48%,#102944 0%,#07111F 66%)}
.top{height:105px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid rgba(134,187,216,.28);padding-top:8px}.kicker{font:600 var(--fs-label) var(--font-mono);letter-spacing:.13em;color:var(--map);margin-bottom:10px}.top h1{font:700 var(--fs-h1) var(--font-sans);margin:0;letter-spacing:.02em}.step{font:var(--fs-label) var(--font-mono);color:#b7c8d1;border:1px solid rgba(134,187,216,.36);padding:8px 12px;margin-top:5px}
.main{flex:1;min-height:0;display:flex;gap:44px;padding:22px 0 16px}.map-zone{flex:1.25;min-width:0;position:relative;display:flex;align-items:center;justify-content:center}.map-zone:before{content:"";position:absolute;width:570px;height:570px;border:1px solid rgba(134,187,216,.12);border-radius:50%;box-shadow:0 0 0 70px rgba(7,17,31,.16)}
.paper{width:660px;height:660px;max-width:100%;position:relative;z-index:1}.sky-map{width:100%;height:100%;overflow:visible}.paper-title{font:600 15px var(--font-sans);letter-spacing:.08em;fill:#d7eaf3}.rim{fill:#12314d;stroke:var(--map);stroke-width:3}.const{fill:none;stroke:var(--map);stroke-width:2;opacity:.72}.ecliptic{fill:none;stroke:#c3d6df;stroke-width:5;stroke-dasharray:12 10;opacity:.7}.star{fill:#dff2fb}.visible .star,.visible .const{fill:var(--map);stroke:var(--map)}.below{opacity:.32;transition:opacity 160ms ease}.horizon{fill:none;stroke:#b8d9e7;stroke-width:8;stroke-linecap:round}.h-label{font:600 16px var(--font-sans);fill:#e8f2f6;paint-order:stroke;stroke:#07111F;stroke-width:6}.dir{font:600 16px var(--font-mono);fill:var(--map);letter-spacing:.16em}.region{font:500 16px var(--font-sans);fill:#b8d9e7}.region.low{fill:#9aaab5}.mask{fill:#0a1d30;opacity:0;transition:opacity 320ms ease}.cut .mask{opacity:.97;transition:opacity 320ms ease}.mask-lines{opacity:0;transition:opacity 160ms ease 160ms;fill:none;stroke:#86BBD8;stroke-width:2;stroke-dasharray:7 10}.cut .mask-lines{opacity:.32}.cut .below{opacity:0;transition:opacity 160ms ease}.cut .low{opacity:0}.cut .ecliptic{clip-path:url(#aboveClip)}
.side{width:410px;min-width:0;padding:38px 0 0 6px;display:flex;flex-direction:column;justify-content:center}.side .rule{width:54px;height:4px;background:var(--candidate);margin-bottom:22px}.lead{font:var(--fs-lead)/1.55 var(--font-sans);margin:0 0 23px;color:#f1f7fa}.panel.q{border-left:2px solid var(--map);padding:16px 18px 16px 20px;margin-bottom:25px;background:#0c243a}.hint{font:var(--fs-sec)/1.55 var(--font-sans);color:#b9cad3;margin:0}.ctl{display:flex;align-items:center;gap:16px;margin-bottom:22px}.btn{appearance:none;border:1px solid var(--candidate);background:rgba(255,209,102,.12);color:#fff4cf;font:600 var(--fs-body) var(--font-sans);padding:13px 20px;cursor:pointer;border-radius:3px}.btn:hover{background:rgba(255,209,102,.24)}.btn:focus-visible{outline:3px solid var(--focus);outline-offset:4px}.state{font:var(--fs-label)/1.4 var(--font-mono);color:#d4e5ed}.feedback{min-height:70px;border-top:1px solid rgba(134,187,216,.35);padding:16px 15px;background:#0b2034;font:600 var(--fs-body)/1.45 var(--font-sans);color:#e8f2f6}.feedback strong{color:var(--candidate)}.process{border:1px solid rgba(134,187,216,.42);padding:15px 15px 13px;background:#0d2941;display:flex;gap:0;position:relative}.process:before{content:"比对范围的变化";position:absolute;top:-10px;left:12px;background:#07111F;padding:0 7px;font:var(--fs-label) var(--font-mono);color:var(--map)}.pstep{flex:1;font:var(--fs-label)/1.4 var(--font-sans);color:#afc2cc;padding-right:9px}.pstep:before{content:"";display:block;width:25px;height:2px;background:var(--map);margin-bottom:7px}.pstep:nth-child(2):before{background:#d5e4ea}.pstep:nth-child(3):before{background:var(--candidate)}
.bottom{height:85px;border-top:1px solid rgba(134,187,216,.28);display:flex;align-items:center;justify-content:space-between;gap:30px}.take{font:var(--fs-sec)/1.45 var(--font-sans);color:#d9e9f0}.take b{color:var(--candidate)}.next{font:var(--fs-sec)/1.45 var(--font-sans);color:#a9c2cf;text-align:right;max-width:510px}.next span{font-family:var(--font-mono);color:var(--map);margin-right:10px}
@media(prefers-reduced-motion:reduce){.mask,.below{transition:none!important}}
</style>
</head>
<body data-page="06" data-total="20">
<div id="stage">
<header class="top"><div><div class="kicker">STEP 03 · CUT THE HORIZON</div><h1>星图上的星，不一定在你眼前</h1></div><div class="step">已配准 · 面向南方</div></header>
<main class="main">
<section class="map-zone min0" aria-label="同一张星图被地平线分为可见和不可见两部分"><div class="paper">
<svg class="sky-map" viewBox="0 0 620 620" role="img" aria-labelledby="mapTitle mapDesc">
<title id="mapTitle">地平线裁切星图</title><desc id="mapDesc">同一张圆形星图中，粗地平线弧以上的星可见，弧以下的星在图上存在但不在眼前天空。</desc>
<defs><clipPath id="circleClip"><circle cx="310" cy="310" r="300"/></clipPath><clipPath id="aboveClip"><path d="M38 38H582V310 Q310 390 38 310Z"/></clipPath></defs>
<circle class="rim" cx="310" cy="310" r="300"/><g clip-path="url(#circleClip)">
<path class="ecliptic" d="M45 260 Q190 190 310 286 T575 234"/>
<g class="visible"><path class="const" d="M135 160L220 115L292 176L382 126L480 188M220 115L243 245L340 236L382 126M135 160L167 275L243 245"/><circle class="star" cx="135" cy="160" r="6"/><circle class="star" cx="220" cy="115" r="8"/><circle class="star" cx="292" cy="176" r="5"/><circle class="star" cx="382" cy="126" r="7"/><circle class="star" cx="480" cy="188" r="5"/><circle class="star" cx="167" cy="275" r="6"/><circle class="star" cx="243" cy="245" r="5"/><circle class="star" cx="340" cy="236" r="7"/><circle class="star" cx="456" cy="270" r="5"/></g>
<g class="below"><path class="const" d="M103 407L182 456L275 420L352 488L450 430L525 495M182 456L196 545L300 528L352 488M450 430L470 545"/><circle class="star" cx="103" cy="407" r="7"/><circle class="star" cx="182" cy="456" r="5"/><circle class="star" cx="275" cy="420" r="8"/><circle class="star" cx="352" cy="488" r="5"/><circle class="star" cx="450" cy="430" r="6"/><circle class="star" cx="525" cy="495" r="7"/><circle class="star" cx="196" cy="545" r="5"/><circle class="star" cx="300" cy="528" r="6"/><circle class="star" cx="470" cy="545" r="5"/><path class="const" d="M66 355L103 407M275 420L300 528M352 488L390 565M450 430L525 495"/><circle class="star" cx="66" cy="355" r="4"/><circle class="star" cx="390" cy="565" r="4"/><text class="region low" x="310" y="515" text-anchor="middle">星图上有，但在地平线以下</text></g>
<path class="mask" d="M38 310 Q310 390 582 310 V582 H38Z"/><g class="mask-lines"><path d="M100 390L205 560M190 370L310 570M290 365L410 555M390 355L515 520"/></g>
</g>
<path class="horizon" d="M38 310 Q310 390 582 310"/><text class="h-label" x="310" y="351" text-anchor="middle">地平线</text><text class="region" x="310" y="210" text-anchor="middle">眼前可见的天空</text>
<text class="dir" x="88" y="304">E</text><text class="dir" x="304" y="73">S</text><text class="dir" x="518" y="304">W</text><text class="paper-title" x="310" y="27" text-anchor="middle">已配准 · 面向南方</text>
</svg></div></section>
<aside class="side min0"><div class="rule"></div><p class="lead">先删去看不见的半边，<br>再认亮星。</p><div class="panel q"><p class="hint">按一次按钮，让地平线以下退出当前比对范围。再按一次，可以还原整张纸图。</p></div><div class="ctl"><button id="cutBtn" class="btn" type="button" aria-pressed="false">切开地平线以下</button><span id="state" class="state">完整星图</span></div><div id="feedback" class="feedback" aria-live="polite">图上的星都还在；先看清哪一半在你眼前。</div><div class="process" aria-label="观察过程"><div class="pstep">纸图印有<br><b>全圆星空</b></div><div class="pstep">地平线<br><b>划出边界</b></div><div class="pstep">此刻只看<br><b>上半边</b></div></div></aside>
</main>
<footer class="bottom"><div class="take"><b>地平线以下的星</b>仍在星图上，但此刻不在可见天空里。</div><div class="next"><span>下一问</span>删去看不见的半边后，哪几颗亮星能把纸图钉在天空上？</div></footer>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
(()=>{const stage=document.getElementById('stage'),btn=document.getElementById('cutBtn'),stateEl=document.getElementById('state'),feedback=document.getElementById('feedback');let state={cut:false};const render=()=>{stage.classList.toggle('cut',state.cut);btn.textContent=state.cut?'还原整张星图':'切开地平线以下';btn.setAttribute('aria-pressed',String(state.cut));stateEl.textContent=state.cut?'只比对可见半边':'完整星图';feedback.innerHTML=state.cut?' <strong>现在只用上半边和真实天空比对。</strong>':'图上的星都还在；先看清哪一半在你眼前。'};btn.addEventListener('click',()=>{state={cut:!state.cut};render()});render();Deck.init({index:6,total:20});})();
</script>
</body>
</html>
