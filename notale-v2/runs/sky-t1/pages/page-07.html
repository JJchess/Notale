<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#07111F;--text:#E7F0F5;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#86BBD8}
*{box-sizing:border-box}
#stage{display:flex;flex-direction:column;overflow:hidden;padding:28px 56px;color:var(--text);background:var(--bg)}
.header{height:112px;flex:0 0 112px;display:flex;align-items:flex-start;justify-content:space-between;border-top:1px solid rgba(134,187,216,.42);padding-top:16px}
.kicker{color:var(--map);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;letter-spacing:.16em;line-height:1.35}
h1{margin:6px 0 0;font-size:var(--fs-h1);line-height:1.25;letter-spacing:.02em;font-weight:650}
.header-note{width:230px;margin-top:5px;color:rgba(231,240,245,.68);font-size:var(--fs-label);line-height:1.45;text-align:right}
.main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.pin-figure{width:1120px;height:550px;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.figure-caption{width:100%;display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;padding:0 40px;color:rgba(231,240,245,.76);font-size:var(--fs-sec);line-height:1.35}
.figure-caption b{font-weight:650;color:var(--text)}
.figure-caption span:last-child{color:var(--map);font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.08em}
.pin-svg{display:block;width:1120px;height:486px;max-width:100%;overflow:visible}
.hint.panel.q{width:860px;min-height:62px;flex:0 0 auto;margin:0 auto 13px;padding:11px 18px;border-left:2px solid var(--map);color:rgba(231,240,245,.86);font-size:var(--fs-sec);line-height:1.45;text-align:center;background:transparent}
.footer{height:57px;flex:0 0 57px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid rgba(134,187,216,.42);padding-bottom:13px}
.takeaway{font-size:var(--fs-lead);line-height:1.35;font-weight:600;letter-spacing:.01em}.next{max-width:480px;text-align:right;color:rgba(231,240,245,.74);font-size:var(--fs-sec);line-height:1.35}.next b{color:var(--map);font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.09em;margin-right:10px}
svg .guide{stroke:var(--map);stroke-width:2;fill:none}.soft{stroke:rgba(134,187,216,.36);stroke-width:1;fill:none}.link{stroke:var(--map);stroke-width:2;fill:none}.label{fill:rgba(231,240,245,.72);font-family:var(--font-sans);font-size:16px;letter-spacing:.08em}.micro{fill:var(--map);font-family:var(--font-mono);font-size:14px;letter-spacing:.14em}.paper{fill:rgba(134,187,216,.075);stroke:var(--map);stroke-width:2}.star{fill:#E7F0F5}.ray{stroke:#E7F0F5;stroke-width:2;stroke-linecap:round}.mapstar{fill:var(--map)}
</style>
</head>
<body data-page="07" data-total="20">
<div id="stage" class="focus">
  <header class="header">
    <div><div class="kicker">PIN THE MAP</div><h1>先用三颗亮星，把纸图钉在真实天空上</h1></div>
    <div class="header-note">不是记住一颗星名<br>而是固定一组位置关系</div>
  </header>
  <main class="main min0" aria-label="三颗亮星与纸质星图的对应示意">
    <section class="pin-figure k-generalization min0">
      <div class="figure-caption"><b>同一组亮点 · 同一副相对位置</b><span>POSITION LOCK</span></div>
      <svg class="pin-svg" viewBox="0 0 1120 486" role="img" aria-labelledby="svgtitle svgdesc">
        <title id="svgtitle">用三颗亮星将纸质星图钉在天空上</title><desc id="svgdesc">上方天空与下方纸图中的三颗星保持相同位置和尺度，三条青蓝线垂直连接对应星点。</desc>
        <path class="soft" d="M80 72H1040M80 414H1040"/>
        <text class="micro" x="80" y="47">真实天空</text><rect class="paper" x="142" y="278" width="836" height="170"/><text class="micro" x="80" y="454">纸质星图</text>
        <text class="label" x="1040" y="47" text-anchor="end">先看三点的相对位置</text>
        <!-- upper local outline -->
        <path d="M230 112 L560 207 L890 76 Z" fill="rgba(134,187,216,.055)"/>
        <path class="guide" d="M230 112 L560 207 L890 76 Z"/>
        <!-- lower local outline, same geometry -->
        <path d="M230 330 L560 425 L890 294 Z" fill="rgba(134,187,216,.13)"/>
        <path class="guide" d="M230 330 L560 425 L890 294 Z"/>
        <!-- direct correspondence -->
        <path class="link" d="M230 132V310M560 227V405M890 96V274"/>
        <!-- center map pin / action -->
        <circle class="paper" cx="560" cy="258" r="37"/><path class="guide" d="M541 258h38M560 239v38"/>
        <text class="micro" x="560" y="264" text-anchor="middle" style="font-size:14px">对上</text>
        <!-- sky stars -->
        <circle class="star" cx="230" cy="112" r="8"/><path class="ray" d="M230 97v-8M230 135v-8M215 112h-8M253 112h-8"/>
        <circle class="star" cx="560" cy="207" r="5"/>
        <circle class="star" cx="890" cy="76" r="6.5"/><path class="ray" d="M890 63v-7M890 89v7M877 76h-7M903 76h-7"/>
        <!-- map stars -->
        <circle class="mapstar" cx="230" cy="330" r="8"/><path class="guide" d="M230 315v-8M230 353v-8M215 330h-8M253 330h-8"/>
        <circle class="mapstar" cx="560" cy="425" r="5"/>
        <circle class="mapstar" cx="890" cy="294" r="6.5"/><path class="guide" d="M890 281v-7M890 307v7M877 294h-7M903 294h-7"/>
        <text class="label" x="190" y="170" text-anchor="end">亮</text><text class="label" x="596" y="212">较暗</text><text class="label" x="926" y="66">亮</text>
        <text class="label" x="230" y="236" text-anchor="middle">① 左侧亮点</text><text class="label" x="560" y="236" text-anchor="middle">② 中间点</text><text class="label" x="890" y="236" text-anchor="middle">③ 右侧亮点</text>
        <text class="label" x="230" y="471" text-anchor="middle">位置不单独成立</text><text class="label" x="560" y="471" text-anchor="middle">三点一起比</text><text class="label" x="890" y="471" text-anchor="middle">间距与斜向都相同</text>
        <path class="soft" d="M108 112h62M108 330h62"/><text class="micro" x="108" y="255">同时</text><text class="label" x="108" y="279">看三点</text>
        <path class="soft" d="M950 76h62M950 294h62"/><text class="micro" x="1012" y="255" text-anchor="end">同形</text><text class="label" x="1012" y="279" text-anchor="end">才算对上</text>
      </svg>
    </section>
  </main>
  <aside class="hint panel q">把纸图转到位后，找三颗彼此分开的亮星；让三点的间距和角度同时对上。</aside>
  <footer class="footer"><div class="takeaway">三个稳定的亮点一旦对上，纸图就有了可反复比对的落点。</div><div class="next"><b>下一问</b>这三颗亮星之间，怎样变成一个一眼能复认的局部图样？</div></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:7,total:20});</script>
</body>
</html>
