<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#07111F;--text:#edf5f7;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#86BBD8;--cyan:#86BBD8;--yellow:#FFD166;--muted:#9cafbd;--line:rgba(134,187,216,.42);}
*{box-sizing:border-box} #stage{padding:28px 56px;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 72% 42%,rgba(37,86,112,.16),transparent 31%),var(--bg);color:var(--text)}
header{height:118px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;padding-top:3px;flex:none}.kicker{font:600 var(--fs-label) var(--font-mono);letter-spacing:.18em;color:var(--cyan);margin:0 0 10px}.title{font:700 var(--fs-h1) var(--font-sans);margin:0;letter-spacing:.02em}.header-note{font:var(--fs-sec) var(--font-sans);line-height:1.5;color:var(--muted);width:330px;margin:27px 2px 0 0}
main{flex:1;min-height:0;padding:22px 0 15px;display:flex;gap:32px}.comparison{flex:1;min-width:0;width:100%;align-self:stretch;display:flex;flex-direction:column;gap:12px}.map-stack{width:100%;align-self:stretch}.prompt{font:600 var(--fs-lead) var(--font-sans);margin:0;color:#f4f8f8}.prompt strong{color:var(--yellow)}
.map-stack{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}.map-panel{position:relative;flex:1;min-height:0;border:1px solid var(--line);background:linear-gradient(90deg,rgba(18,47,68,.62) 1px,transparent 1px) 0 0/20% 100%,linear-gradient(rgba(18,47,68,.48) 1px,transparent 1px) 0 0/100% 33%,rgba(7,17,31,.78);overflow:hidden}.hit{position:absolute;z-index:5;width:46px;height:46px;margin:-23px 0 0 -23px;border:0;border-radius:50%;background:transparent;cursor:pointer}.hit:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.hit[data-id="A"]{left:23.33%;top:27.89%}.hit[data-id="B"]{left:76.67%;top:27.89%}.hit[data-id="C"]{left:33.33%;top:77.89%}.hit[data-id="X"]{left:51.67%;top:52.63%}.map-panel.sky{border-radius:12px 12px 0 0}.map-panel.chart{border-radius:0 0 12px 12px;background:rgba(13,34,51,.5)}.map-label{position:absolute;z-index:2;top:13px;left:17px;color:var(--cyan);font:600 var(--fs-label) var(--font-sans);letter-spacing:.08em}.map-sub{position:absolute;z-index:2;right:17px;top:14px;font:var(--fs-label) var(--font-mono);color:var(--muted)}svg{width:100%;height:100%;display:block}.constellation{fill:none;stroke:var(--cyan);stroke-width:2}.star{fill:#f5fbfc}.common{fill:var(--cyan)}.star-label{fill:#dceef4;font:600 20px var(--font-mono)}.point{cursor:pointer;outline:none}.point circle{transition:filter .15s ease}.point:focus-visible .focus-ring{display:block}.focus-ring{display:none;fill:none;stroke:var(--cyan);stroke-width:4}.candidate-ring{display:none;fill:none;stroke:var(--yellow);stroke-width:5}.point.selected-x .candidate-ring{display:block;animation:ring .22s ease-out both}.point.selected-common .match-ring{display:block;animation:flash .48s ease-out both}.match-ring{display:none;fill:none;stroke:var(--cyan);stroke-width:4}.guide{display:none;position:absolute;z-index:3;left:50%;top:calc(50% - 7px);height:calc(50% + 8px);border-left:3px dashed var(--yellow);transform:translateX(-50%);pointer-events:none}.guide.show{display:block}.guide:after{content:"星图中无对应点";position:absolute;left:12px;top:50%;transform:translateY(-50%);white-space:nowrap;font:600 var(--fs-label) var(--font-sans);color:var(--yellow);background:var(--bg);padding:3px 7px}
.side{width:380px;flex:none;border-left:1px solid var(--line);padding:21px 0 0 28px;display:flex;flex-direction:column;min-height:0}.side h2{font:600 var(--fs-h2) var(--font-sans);margin:0 0 14px}.instruction{font:var(--fs-body) var(--font-sans);line-height:1.5;margin:0 0 20px;color:#dfe8ec}.instruction b{color:var(--cyan)}.legend{display:flex;flex-direction:column;gap:11px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:18px;font:var(--fs-label) var(--font-sans);color:var(--muted)}.key{display:inline-block;width:29px;margin-right:8px;vertical-align:middle}.key.common{height:2px;background:var(--cyan)}.key.candidate{height:18px;width:18px;border:3px solid var(--yellow);border-radius:50%;margin-left:5px;margin-right:14px}.feedback{min-height:106px;border-left:4px solid var(--cyan);padding:12px 15px;background:rgba(134,187,216,.08);font:var(--fs-body) var(--font-sans);line-height:1.48;color:#e9f3f6}.feedback.correct{border-color:var(--yellow);background:rgba(255,209,102,.1)}.feedback .state{display:block;font:600 var(--fs-label) var(--font-mono);letter-spacing:.08em;color:var(--cyan);margin-bottom:5px}.feedback.correct .state{color:var(--yellow)}.btn{margin-top:18px;align-self:flex-start;border:1px solid var(--cyan);border-radius:7px;background:transparent;color:var(--text);font:600 var(--fs-label) var(--font-sans);padding:10px 16px;cursor:pointer}.btn:hover{background:rgba(134,187,216,.14)}.btn:focus-visible,.point:focus-visible{outline:3px solid var(--focus);outline-offset:4px}.btn[hidden]{display:none}
footer{height:78px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:35px;flex:none}.takeaway{font:600 var(--fs-lead) var(--font-sans);margin:0}.takeaway b{color:var(--yellow)}.next{font:var(--fs-sec) var(--font-sans);color:var(--muted);text-align:right;margin:0}.next:before{content:"下一问  ";font-family:var(--font-mono);color:var(--cyan)}
.intro .common,.intro .x-dot{animation:appear .28s ease both}.intro .common:nth-of-type(2){animation-delay:.12s}.intro .common:nth-of-type(3){animation-delay:.24s}.intro .x-dot{animation-delay:.36s}@keyframes appear{from{opacity:.15}to{opacity:1}}@keyframes ring{from{opacity:.1;transform:scale(.55);transform-origin:50% 50%}to{opacity:1;transform:scale(1)}}@keyframes flash{0%{opacity:0}40%{opacity:1}100%{opacity:.5}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="09" data-total="20">
<div id="stage">
<header><div><p class="kicker">COMPARE THE SKY</p><h1 class="title">天空多出的亮点，才值得圈起来</h1></div><p class="header-note">把已对准的星图当作底稿：同一位置，逐点核对。</p></header>
<main class="split-tb">
<section class="comparison k-comparison min0" aria-label="眼前天空与已对准星图的同尺度比较"><p class="prompt">上图点一个亮点，再到下图查找它的对应点。<br><strong>哪一个亮点在星图中没有对应？</strong></p>
<div class="map-stack intro" id="maps">
<div class="map-panel sky"><span class="map-label">眼前天空</span><span class="map-sub">同朝向 · 同尺度</span>
<svg viewBox="0 0 900 190" role="group" aria-label="眼前天空，含有亮星A、B、C和额外亮点X"><path class="constellation" d="M210 53 L690 53 L300 148 Z"/>
<g class="point" data-sky="A" tabindex="0" role="button" aria-label="选择亮星 A"><circle class="focus-ring" cx="210" cy="53" r="21"/><circle class="common" cx="210" cy="53" r="9"/><path fill="var(--cyan)" d="M210 36v34M193 53h34" stroke="var(--cyan)" stroke-width="2"/><text class="star-label" x="180" y="40">A</text><circle class="match-ring" cx="210" cy="53" r="18"/></g>
<g class="point" data-sky="B" tabindex="0" role="button" aria-label="选择亮星 B"><circle class="focus-ring" cx="690" cy="53" r="21"/><circle class="common" cx="690" cy="53" r="9"/><path fill="var(--cyan)" d="M690 36v34M673 53h34" stroke="var(--cyan)" stroke-width="2"/><text class="star-label" x="708" y="40">B</text><circle class="match-ring" cx="690" cy="53" r="18"/></g>
<g class="point" data-sky="C" tabindex="0" role="button" aria-label="选择亮星 C"><circle class="focus-ring" cx="300" cy="148" r="21"/><circle class="common" cx="300" cy="148" r="9"/><path fill="var(--cyan)" d="M300 131v34M283 148h34" stroke="var(--cyan)" stroke-width="2"/><text class="star-label" x="270" y="181">C</text><circle class="match-ring" cx="300" cy="148" r="18"/></g>
<g class="point" data-sky="X" tabindex="0" role="button" aria-label="选择未标记的白色亮点"><circle class="focus-ring" cx="465" cy="100" r="21"/><circle class="x-dot star" cx="465" cy="100" r="8"/><circle class="candidate-ring" cx="465" cy="100" r="17"/><text class="star-label x-name" x="490" y="106" visibility="hidden">候选 X</text></g></svg><button class="hit" data-id="A" type="button" aria-label="选择亮星 A"></button><button class="hit" data-id="B" type="button" aria-label="选择亮星 B"></button><button class="hit" data-id="C" type="button" aria-label="选择亮星 C"></button><button class="hit" data-id="X" type="button" aria-label="选择白色亮点"></button></div>
<div class="guide" id="guide" aria-hidden="true"></div>
<div class="map-panel chart"><span class="map-label">已对准星图</span><span class="map-sub">三颗亮星构成同一图样</span>
<svg viewBox="0 0 900 190" aria-label="已对准星图，只含亮星A、B、C"><path class="constellation" d="M210 53 L690 53 L300 148 Z"/>
<g data-chart="A"><circle class="common" cx="210" cy="53" r="9"/><path fill="var(--cyan)" d="M210 36v34M193 53h34" stroke="var(--cyan)" stroke-width="2"/><text class="star-label" x="180" y="40">A</text><circle class="match-ring" cx="210" cy="53" r="18"/></g><g data-chart="B"><circle class="common" cx="690" cy="53" r="9"/><path fill="var(--cyan)" d="M690 36v34M673 53h34" stroke="var(--cyan)" stroke-width="2"/><text class="star-label" x="708" y="40">B</text><circle class="match-ring" cx="690" cy="53" r="18"/></g><g data-chart="C"><circle class="common" cx="300" cy="148" r="9"/><path fill="var(--cyan)" d="M300 131v34M283 148h34" stroke="var(--cyan)" stroke-width="2"/><text class="star-label" x="270" y="181">C</text><circle class="match-ring" cx="300" cy="148" r="18"/></g></svg></div>
</div></section>
<aside class="side panel min0"><h2>逐点核对</h2><p class="instruction">点天空中的一个亮点。<b>下图只保留星图本来就有的点。</b></p><div class="legend"><span><i class="key common"></i>青蓝连线：已知恒星图样</span><span><i class="key candidate"></i>观测黄环：待复查的候选</span></div><div id="feedback" class="feedback" aria-live="polite"><span class="state">尚未选择</span>从 A、B、C 或白色亮点开始比对。</div><button id="reset" class="btn" type="button" hidden>再比一次</button></aside>
</main>
<footer><p class="takeaway">已对准后，天空里找不到星图对应点的亮点，<b>是行星候选。</b></p><p class="next">圈出候选后，该从天空的哪里优先寻找更多？</p></footer>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
(()=>{const initial=()=>({selected:null});let state=initial();const points=[...document.querySelectorAll('.hit')],guide=document.getElementById('guide'),feedback=document.getElementById('feedback'),reset=document.getElementById('reset'),xName=document.querySelector('.x-name');
function render(){points.forEach(p=>p.classList.remove('selected-x','selected-common'));document.querySelectorAll('[data-chart] .match-ring').forEach(e=>e.style.display='none');guide.classList.remove('show');xName.setAttribute('visibility','hidden');feedback.classList.remove('correct');reset.hidden=!state.selected;if(!state.selected){feedback.innerHTML='<span class="state">尚未选择</span>从 A、B、C 或白色亮点开始比对。';return}if(state.selected==='X'){document.querySelector('[data-sky="X"]').classList.add('selected-x');guide.classList.add('show');xName.setAttribute('visibility','visible');feedback.classList.add('correct');feedback.innerHTML='<span class="state">找到缺口</span>对：X 在天空中出现，但星图没有对应点。圈为候选。'}else{document.querySelector('[data-sky="'+state.selected+'"]').classList.add('selected-common');const ring=document.querySelector('[data-chart="'+state.selected+'"] .match-ring');ring.style.display='block';feedback.innerHTML='<span class="state">有对应点</span>这颗在星图中有对应点：它属于已知恒星图样。'}}
function choose(id){if(!['A','B','C','X'].includes(id))return;state={selected:id};render()}points.forEach(p=>{p.addEventListener('click',()=>choose(p.dataset.id));p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(p.dataset.id)}})});reset.addEventListener('click',()=>{state=initial();render();document.querySelector('.hit[data-id="A"]').focus();});render();Deck.init({index:9,total:20});})();
</script>
</body></html>
