<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#07111F;--text:#e8f0f5;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#FFD166;--map:#86BBD8;--candidate:#FFD166}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text)}
#stage{padding:28px 56px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
header{height:106px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid rgba(134,187,216,.28);padding:4px 0 15px;flex:none}.kicker{font:600 var(--fs-label) var(--font-mono);letter-spacing:.16em;color:var(--map);margin:0 0 7px}.title{font:700 var(--fs-h1) var(--font-sans);margin:0;letter-spacing:.01em}.header-note{width:330px;margin-top:18px;font:var(--fs-sec)/1.45 var(--font-sans);color:#b7c8d2}
.main{min-height:0;flex:1;display:flex;gap:25px}.work{min-width:0;flex:1;position:relative;border:1px solid rgba(134,187,216,.55);background:linear-gradient(135deg,rgba(18,45,66,.42),rgba(7,17,31,.15));overflow:hidden}.side{width:310px;display:flex;flex-direction:column;gap:15px}.panel{border-left:3px solid var(--map);padding:13px 0 10px 17px;background:rgba(255,255,255,.025)}.panel.q{border-left-color:rgba(134,187,216,.55)}.panel h2{font:600 var(--fs-h2) var(--font-sans);margin:0 0 9px}.panel p{font:var(--fs-sec)/1.48 var(--font-sans);margin:0;color:#c8d6df}.status{border-left-color:var(--candidate);min-height:137px}.status .eyebrow{font:600 var(--fs-label) var(--font-mono);letter-spacing:.09em;color:var(--candidate);margin-bottom:9px}.status strong{display:block;font:600 var(--fs-lead)/1.4 var(--font-sans);color:#fff}.readout{margin-top:10px;font:var(--fs-label) var(--font-mono);color:#a8becb}.ctl{margin-top:auto;padding:14px 0 0;border-top:1px solid rgba(134,187,216,.25)}label{display:block;font:var(--fs-label)/1.4 var(--font-sans);margin-bottom:8px;color:#dbe7ed}input[type=range]{width:100%;accent-color:var(--candidate);height:25px;cursor:pointer}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}.btn{border:1px solid rgba(255,209,102,.85);background:transparent;color:var(--candidate);border-radius:5px;padding:8px 13px;font:600 var(--fs-label) var(--font-sans);cursor:pointer}.btn:hover{background:rgba(255,209,102,.12)}.btn:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.keyhint{font:var(--fs-tick)/1.35 var(--font-sans);color:#a8becb;text-align:right}
svg{width:100%;height:100%;display:block;touch-action:none}.sky-label,.map-label{font:600 15px var(--font-sans);letter-spacing:.08em;fill:#dceaf0}.micro{font:14px var(--font-sans);fill:#b7cad5}.ecliptic{fill:none;stroke:var(--map);stroke-width:8;stroke-dasharray:15 15;opacity:.9}.ecliptic.intro{animation:draw .6s ease-out both}.rule{stroke:rgba(134,187,216,.38);stroke-width:1}.constellation{fill:none;stroke:var(--map);stroke-width:1.5;opacity:.65}.star{fill:#eaf3f7}.mapstar{fill:var(--map)}.star-ray{stroke:#eaf3f7;stroke-width:1.3}.map-ray{stroke:var(--map);stroke-width:1.2}.scanline{stroke:var(--candidate);stroke-width:1.5;stroke-dasharray:4 5;opacity:.75}.scanner{fill:rgba(255,209,102,.1);stroke:var(--candidate);stroke-width:4}.found{fill:none;stroke:var(--candidate);stroke-width:3;opacity:.65}.active-star{fill:var(--candidate);stroke:#fff;stroke-width:1}.candidate-ring{fill:none;stroke:var(--candidate);stroke-width:3}.candidate-ring.hit{animation:pulse .24s ease-out}.guide{fill:none;stroke:rgba(134,187,216,.5);stroke-width:2}.work:focus{outline:none}@keyframes draw{from{stroke-dashoffset:360}to{stroke-dashoffset:0}}@keyframes pulse{50%{transform-box:fill-box;transform-origin:center;transform:scale(1.15)}}
footer{height:66px;flex:none;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(134,187,216,.28);padding-top:12px}.take{max-width:1020px;font:var(--fs-lead)/1.4 var(--font-sans);color:#e0ebf0}.next{font:var(--fs-sec)/1.4 var(--font-sans);color:var(--candidate);text-align:right}
</style>
</head>
<body data-page="10" data-total="20">
<div id="stage">
<header><div><p class="kicker">SCAN THE ECLIPTIC</p><h1 class="title">别满天找：沿黄道扫“图上没有的亮点”</h1></div><p class="header-note">把同一片天空与已配准星图上下叠放。亮点若有对应，就仍是恒星图样的一部分。</p></header>
<div class="main">
<section class="work min0" aria-label="沿黄道扫描天空与星图的对照图">
<svg id="map" viewBox="0 0 1120 570" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">天空与已配准星图的黄道扫描</title><desc id="svgdesc">拖动黄环或使用滑块沿黄道移动，比较天空亮点和下方星图。</desc>
<line class="rule" x1="42" y1="286" x2="1078" y2="286"/><text class="sky-label" x="44" y="43">真实天空 · 亮点</text><text class="map-label" x="44" y="329">已配准：方向与恒星图样</text>
<path id="track" class="ecliptic intro" d="M90,245 C300,207 450,188 600,160 S890,98 1040,63"/><text class="micro" x="940" y="133">黄道</text><text class="micro" x="88" y="270">扫描起点</text><text class="micro" x="865" y="188">只沿虚线移动</text>
<path class="guide" d="M90,510 C300,472 450,453 600,425 S890,363 1040,328"/><text class="micro" x="941" y="398">同位黄道</text><text class="micro" x="89" y="542">星图中没有候选点</text>
<g id="sky-stars"></g><g id="map-lines"></g><g id="map-stars"></g><g id="dynamic"></g>
</svg></section>
<aside class="side min0"><section class="panel q"><h2>沿线扫描</h2><p>拖动黄环，沿虚线扫描天空亮点。黄道：太阳和多数行星常出现的一条天空路径附近。</p></section><section class="panel status" aria-live="polite"><div class="eyebrow">当前读数</div><strong id="statusText">从黄道左端开始扫描</strong><div id="readout" class="readout">位置 0% · 尚未标记候选</div></section><div class="ctl"><label for="scan">沿黄道移动扫描器</label><input id="scan" type="range" min="0" max="100" value="0" step="1" aria-describedby="keyhint"><div class="controls"><button class="btn" id="reset" type="button">重新扫描</button><span class="keyhint" id="keyhint">也可点击轨迹<br>或按 ← / →</span></div></div></aside>
</div>
<footer><div class="take">肉眼可见行星通常靠近黄道；先沿这条线找，再检查亮点是否属于已配准的恒星图样。</div><div class="next">下一问：黄道两侧多宽的天空，值得优先搜索？</div></footer>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
(()=>{const svg=document.getElementById('map'),range=document.getElementById('scan'),reset=document.getElementById('reset'),dyn=document.getElementById('dynamic'),sky=document.getElementById('sky-stars'),ms=document.getElementById('map-stars'),lines=document.getElementById('map-lines'),status=document.getElementById('statusText'),read=document.getElementById('readout');
const NS='http://www.w3.org/2000/svg', path=document.getElementById('track'), stars=[{t:.18,x:270,y:216,r:5},{t:.37,x:444,y:190,r:4},{t:.74,x:810,y:122,r:6},{t:.91,x:965,y:82,r:4}], candidate={t:.57,x:635,y:153,r:6}; let state={t:0,found:false}, timer=0, dragging=false;
function el(tag,a){const n=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));return n}function point(t,lower=false){const l=path.getTotalLength();const p=path.getPointAtLength(l*t);return {x:p.x,y:p.y+(lower?265:0)}}function addStar(g,s,lower){const y=s.y+(lower?265:0);g.append(el('circle',{cx:s.x,cy:y,r:s.r,class:lower?'mapstar':'star'}));if(s.r>=5){g.append(el('path',{d:`M ${s.x-10} ${y}H${s.x+10}M ${s.x} ${y-10}V${y+10}`,class:lower?'map-ray':'star-ray'}))}}
stars.forEach(s=>{addStar(sky,s,false);addStar(ms,s,true)});[[0,1],[1,2],[2,3]].forEach(pair=>{const a=stars[pair[0]],b=stars[pair[1]];lines.append(el('line',{x1:a.x,y1:a.y+265,x2:b.x,y2:b.y+265,class:'constellation'}))});sky.append(el('circle',{cx:candidate.x,cy:candidate.y,r:candidate.r,class:'star'}));sky.append(el('path',{d:`M ${candidate.x-10} ${candidate.y}H${candidate.x+10}M ${candidate.x} ${candidate.y-10}V${candidate.y+10}`,class:'star-ray'}));
function setScanPosition(t){state.t=Math.max(0,Math.min(1,t)); if(Math.abs(state.t-candidate.t)<.055)state.found=true;render()}
function render(){dyn.innerHTML='';range.value=Math.round(state.t*100);const p=point(state.t), lower=point(state.t,true), nearest=stars.reduce((a,s)=>Math.abs(s.t-state.t)<Math.abs(a.t-state.t)?s:a,stars[0]);const onCand=Math.abs(state.t-candidate.t)<.055,onStar=!onCand&&Math.abs(nearest.t-state.t)<.055;dyn.append(el('line',{x1:p.x,y1:p.y+17,x2:lower.x,y2:lower.y-17,class:'scanline'}));dyn.append(el('circle',{cx:p.x,cy:p.y,r:19,class:'scanner'}));if(state.found)dyn.append(el('circle',{cx:candidate.x,cy:candidate.y,r:15,class:'found'}));if(onCand){dyn.append(el('circle',{cx:candidate.x,cy:candidate.y,r:18,class:'candidate-ring hit'}));const label=el('text',{x:candidate.x+24,y:candidate.y-19,class:'micro',fill:'#FFD166'});label.textContent='候选亮点';dyn.append(label);status.textContent='图上没有对应亮点：圈为候选'}else if(onStar){dyn.append(el('circle',{cx:nearest.x,cy:nearest.y+265,r:12,class:'active-star'}));status.textContent='图上有对应恒星：继续沿线找'}else status.textContent=state.t===0?'从黄道左端开始扫描':'沿黄道继续扫描';read.textContent=`位置 ${Math.round(state.t*100)}% · ${state.found?'已标记一个候选':'尚未标记候选'}`}
function pos(e){const raw=Deck.pt(svg,e),q={x:raw.x*1120/svg.offsetWidth,y:raw.y*570/svg.offsetHeight},l=path.getTotalLength();let best=0,bd=1e9;for(let i=0;i<=100;i++){const p=path.getPointAtLength(l*i/100),d=(p.x-q.x)**2+(p.y-q.y)**2;if(d<bd){bd=d;best=i/100}}return best}svg.addEventListener('pointerdown',e=>{dragging=true;svg.setPointerCapture(e.pointerId);setScanPosition(pos(e))});svg.addEventListener('pointermove',e=>{if(dragging)setScanPosition(pos(e))});svg.addEventListener('pointerup',()=>dragging=false);svg.addEventListener('pointercancel',()=>dragging=false);range.addEventListener('input',e=>setScanPosition(+e.target.value/100));reset.addEventListener('click',()=>{state={t:0,found:false};render();range.focus();status.textContent='已重新回到黄道左端'});render();if(!Deck.reduced())timer=setTimeout(()=>setScanPosition(.12),700);window.addEventListener('pagehide',()=>clearTimeout(timer),{once:true});Deck.init({index:10,total:20});})();
</script>
</body></html>
