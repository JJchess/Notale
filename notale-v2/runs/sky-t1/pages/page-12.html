<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#07111F;--text:#EAF2F7;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#FFD166}
*{box-sizing:border-box}
#stage{padding:28px 56px;display:flex;flex-direction:column;overflow:hidden}
.header{height:112px;flex:0 0 112px;border-bottom:1px solid rgba(134,187,216,.34);display:flex;align-items:flex-start;justify-content:space-between;padding-top:5px}
.kicker{font:600 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.13em;color:var(--map);margin:0 0 12px}
h1{font:700 var(--fs-h1)/1.2 var(--font-sans);letter-spacing:.01em;margin:0;color:var(--text)}
.status{margin-top:29px;font:500 var(--fs-label)/1.35 var(--font-sans);color:rgba(234,242,247,.72);text-align:right}.status b{font-weight:600;color:var(--candidate)}
.focus{flex:1;min-height:0;position:relative;display:flex;align-items:stretch}
.diagram{width:100%;height:100%;display:block;overflow:visible}
.diagram text{font-family:var(--font-sans)}
.ecliptic-note{font-size:15px;letter-spacing:.08em;fill:var(--map)}
.label-lead{font-size:16px;fill:var(--map);font-weight:600}.label-small{font-size:14px;fill:rgba(234,242,247,.65)}
.candidate-name{font-size:28px;fill:var(--candidate);font-weight:700}.candidate-sub{font-size:16px;fill:rgba(234,242,247,.72)}
.tag-box{fill:rgba(7,17,31,.88);stroke:var(--map);stroke-width:1.4}.tag-text{font-size:17px;fill:var(--text);font-weight:600}.tag-dot{fill:var(--map)}
.footer{height:112px;flex:0 0 112px;border-top:1px solid rgba(134,187,216,.34);display:flex;align-items:center;justify-content:space-between;gap:42px}
.takeaway{max-width:970px;font:400 var(--fs-lead)/1.5 var(--font-sans);color:var(--text);margin:0}.takeaway strong{font-weight:700;color:var(--candidate)}
.next{font:500 var(--fs-sec)/1.45 var(--font-sans);color:var(--map);max-width:340px;text-align:right;margin:0}.next span{display:block;font:600 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.1em;margin-bottom:6px;color:rgba(134,187,216,.75)}
</style>
</head>
<body data-page="12" data-total="20">
<div id="stage">
  <header class="header">
    <div><p class="kicker">PAUSE · MARK THE CANDIDATE</p><h1>先把它叫作“候选”，不要急着叫它“行星”</h1></div>
    <p class="status">筛选到这里：<b>值得核验</b>，但尚未确认</p>
  </header>
  <main class="focus min0" aria-label="候选亮点由两条筛选线索共同支持">
    <svg class="diagram" viewBox="0 0 1488 620" role="img" aria-labelledby="diagram-title diagram-desc" preserveAspectRatio="xMidYMid meet">
      <title id="diagram-title">黄道搜索带上的候选亮点</title>
      <desc id="diagram-desc">一颗黄环包住的亮点位于黄道搜索带内，下方两条来自已配准星图的线索共同指向它。</desc>
      <g opacity=".55" fill="var(--text)">
        <circle cx="193" cy="163" r="2"/><circle cx="271" cy="274" r="3"/><circle cx="359" cy="121" r="2"/><circle cx="439" cy="218" r="2"/><circle cx="1104" cy="163" r="2"/><circle cx="1219" cy="256" r="3"/><circle cx="1300" cy="107" r="2"/><circle cx="1372" cy="213" r="2"/>
      </g>
      <g fill="none" stroke="var(--map)" stroke-width="1.2" opacity=".35"><path d="M193 163 L271 274 L439 218"/><path d="M1104 163 L1219 256 L1372 213"/></g>
      <path d="M158 318 C385 272 557 346 744 319 S1104 267 1350 318" fill="none" stroke="var(--map)" stroke-width="7" stroke-dasharray="17 13" opacity=".92"/>
      <text x="183" y="277" class="ecliptic-note">黄道搜索带</text>
      <text x="193" y="137" class="label-small">已配准的恒星图样</text>
      <text x="1104" y="137" class="label-small">同一张星图作背景</text>
      <line x1="744" y1="319" x2="744" y2="251" stroke="var(--candidate)" stroke-width="1.5" opacity=".85"/>
      <circle cx="744" cy="244" r="36" fill="none" stroke="var(--candidate)" stroke-width="4"/>
      <circle cx="744" cy="244" r="8" fill="var(--candidate)"/>
      <path d="M744 193 v-13 M744 295 v13 M693 244 h-13 M795 244 h13" stroke="var(--candidate)" stroke-width="2"/>
      <text x="744" y="384" text-anchor="middle" class="candidate-name">候选亮点</text>
      <text x="744" y="411" text-anchor="middle" class="candidate-sub">先保留它，不给它命名</text>
      <text x="744" y="434" text-anchor="middle" class="label-small">≠ 已确认</text>
      <g stroke="var(--map)" fill="none" stroke-width="1.5">
        <path d="M744 282 L744 463 L423 463 L423 488"/>
        <path d="M744 282 L744 463 L1065 463 L1065 488"/>
      </g>
      <circle cx="423" cy="463" r="5" class="tag-dot"/><circle cx="1065" cy="463" r="5" class="tag-dot"/>
      <text x="744" y="477" text-anchor="middle" class="label-lead">两条已完成的筛选线索</text>
      <g transform="translate(195 488)"><rect class="tag-box" width="456" height="76" rx="0"/><text x="29" y="25" class="label-small">线索 01</text><circle cx="29" cy="49" r="5" class="tag-dot"/><text x="51" y="55" class="tag-text">星图上没有对应恒星</text></g>
      <g transform="translate(837 488)"><rect class="tag-box" width="456" height="76" rx="0"/><text x="29" y="25" class="label-small">线索 02</text><circle cx="29" cy="49" r="5" class="tag-dot"/><text x="51" y="55" class="tag-text">在黄道搜索带内</text></g>
      <text x="744" y="602" text-anchor="middle" class="label-small">两条线索来自同一张已配准星图</text>
    </svg>
  </main>
  <footer class="footer">
    <p class="takeaway">你现在得到的是一两个<strong>值得核验的亮点</strong>：它们已经偏离星图中的恒星图样，并落在黄道搜索带附近。</p>
    <p class="next"><span>NEXT QUESTION</span>接下来，亮度、颜色和闪烁能帮你判断多少？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:12,total:20});</script>
</body>
</html>
