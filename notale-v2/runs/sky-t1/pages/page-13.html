<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#07111F;--text:#eaf3f8;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#FFD166;--map:#86BBD8;--candidate:#FFD166}
*{box-sizing:border-box} body{margin:0;overflow:hidden} button{font:inherit}
#stage{padding:28px 56px;display:flex;flex-direction:column;gap:14px;color:var(--text);background:var(--bg)}
header{height:106px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid rgba(134,187,216,.38);padding-bottom:15px}
.kicker{font:600 var(--fs-label) var(--font-mono);letter-spacing:.16em;color:var(--map);margin:0 0 7px}.title{font:700 var(--fs-h1) var(--font-sans);letter-spacing:.015em;margin:0}.sub{font:var(--fs-sec) var(--font-sans);color:#b6c8d4;margin:9px 0 0;line-height:1.4}.step{font:var(--fs-label) var(--font-mono);color:#b6c8d4;margin-top:8px;text-align:right}.step b{color:var(--candidate);font-size:var(--fs-body)}
main{flex:1;min-height:0;display:flex;gap:28px}.map-side{width:57%;min-width:0;display:flex;flex-direction:column}.result-side{flex:1;min-width:0;display:flex;flex-direction:column}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}.section-head h2{font:600 var(--fs-h2) var(--font-sans);margin:0}.section-head span{font:var(--fs-label) var(--font-sans);color:#b6c8d4}.mapbox{flex:1;min-height:0;border:1px solid rgba(134,187,216,.78);position:relative;background:linear-gradient(125deg,rgba(134,187,216,.07),transparent 48%)}
.mapbox svg{width:100%;height:100%;display:block}.mapbox [role="button"]{cursor:pointer;outline:none}.mapbox [role="button"]:focus .ring{stroke:#fff;stroke-width:5}.ring{fill:none;stroke:var(--candidate);stroke-width:3.5}.ring.checked{stroke:#8a9aa5;stroke-width:2}.point{fill:#f2f5f4}.labelbox{fill:#07111F;stroke:#86BBD8;stroke-width:1}.candidate-label{fill:#eef7fb;font:600 18px var(--font-sans)}.star{fill:#dce8ec}.const{fill:none;stroke:#86BBD8;stroke-width:1.5;opacity:.75}.ecliptic{fill:none;stroke:#86BBD8;stroke-width:6;stroke-dasharray:13 11;opacity:.95}.note{fill:#a8c7d8;font:15px var(--font-sans)}.small{fill:#a8c7d8;font:13px var(--font-mono)}
.legend{height:39px;display:flex;gap:22px;align-items:center;font:var(--fs-label) var(--font-sans);color:#c3d2da}.dash{width:40px;border-top:5px dashed var(--map)}.ringkey{width:18px;height:18px;border:3px solid var(--candidate);border-radius:50%}
.result-side{border-left:1px solid rgba(134,187,216,.3);padding-left:24px}.instruction{font:var(--fs-sec) var(--font-sans);line-height:1.42;color:#c3d2da;margin:0 0 10px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;align-content:start}.opt{background:rgba(9,27,43,.76);border:1px solid rgba(180,205,217,.48);border-radius:10px;padding:12px 14px;text-align:left;color:var(--text);min-height:163px;cursor:pointer;transition:border-color .15s,background .15s}.opt:hover{border-color:var(--map)}.opt:focus-visible,.reset:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.opt.selected{grid-column:span 2;border-color:var(--candidate);background:rgba(255,209,102,.09)}.opt.done{border-color:rgba(180,205,217,.68)}.card-top{display:flex;justify-content:space-between;align-items:center}.letter{font:700 24px var(--font-mono);color:var(--candidate)}.state{font:var(--fs-label) var(--font-sans);color:#b6c8d4}.opt.selected .state{color:var(--candidate)}.location{font:var(--fs-label) var(--font-sans);line-height:1.35;color:#dce7ec;margin:8px 0}.gates{display:none;border-left:2px solid var(--map);padding-left:9px;margin-top:9px;font:var(--fs-label) var(--font-sans);line-height:1.5;color:#d6e4e9}.selected .gates{display:block}.gate-pass{color:#e5f3f8}.gate-fail{color:#d1d9dd}.verdict{margin-top:7px;font:600 var(--fs-label) var(--font-sans);line-height:1.35}.keep{color:var(--candidate)}.drop{color:#cbd5d9}.impression{display:none;color:#9eb0ba;font:var(--fs-label) var(--font-sans);margin-top:6px;line-height:1.35}.selected .impression{display:block}
.summary{height:58px;margin-top:10px;border-top:1px solid rgba(134,187,216,.42);display:flex;align-items:center;gap:11px;font:600 var(--fs-sec) var(--font-sans)}.summary .branch{display:none}.summary.complete .branch{display:inline-flex;align-items:center;gap:8px}.branch strong{font:700 var(--fs-body) var(--font-mono)}.branch.keep strong{color:var(--candidate)}.summary .prompt{color:#b6c8d4}.summary.complete .prompt{display:none}.reset{margin-left:auto;border:1px solid var(--map);border-radius:6px;background:transparent;color:var(--text);padding:7px 13px;font:var(--fs-label) var(--font-sans);cursor:pointer}
footer{height:70px;border-top:1px solid rgba(134,187,216,.38);display:flex;align-items:center;gap:20px}.takeaway{font:600 var(--fs-lead) var(--font-sans);line-height:1.35;max-width:1110px}.takeaway b{color:var(--candidate)}.next{margin-left:auto;font:var(--fs-label) var(--font-sans);line-height:1.35;color:#b8c9d2;max-width:255px}.next span{display:block;color:var(--map);font-family:var(--font-mono);font-size:13px;margin-bottom:3px}
@media(prefers-reduced-motion:reduce){.opt{transition:none}}
</style>
</head>
<body data-page="13" data-total="20">
<div id="stage">
<header><div><p class="kicker">EVIDENCE FILTER</p><h1 class="title">亮、白、少闪，都不能替代位置证据</h1><p class="sub">先用同一张已配准星图，逐个过两道位置的门。</p></div><div class="step"><b id="count">0 / 4</b><br>已检查亮点</div></header>
<main class="split-lr">
<section class="map-side min0" aria-labelledby="map-title"><div class="section-head"><h2 id="map-title">同一片局部星图</h2><span>点黄环或右侧亮点</span></div>
<div class="mapbox" aria-label="局部星图，四个待筛选亮点"><svg viewBox="0 0 800 510" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">已配准局部星图与四个亮点</title><desc id="svgdesc">四个编号亮点 A 到 D 共享恒星背景和黄道。选择任一黄环查看它是否通过两道位置检查。</desc>
<path class="const" d="M80 112 L205 165 L305 90 L421 161 L524 110 M205 165 L255 282 L390 315 L470 249 L622 310"/><path class="const" d="M112 390 L255 282 L365 424 L521 400 L670 440"/>
<circle class="star" cx="80" cy="112" r="5"/><circle class="star" cx="205" cy="165" r="8"/><circle class="star" cx="305" cy="90" r="4"/><circle class="star" cx="421" cy="161" r="6"/><circle class="star" cx="524" cy="110" r="4"/><circle class="star" cx="255" cy="282" r="7"/><circle class="star" cx="390" cy="315" r="4"/><circle class="star" cx="470" cy="249" r="6"/><circle class="star" cx="622" cy="310" r="5"/><circle class="star" cx="112" cy="390" r="4"/><circle class="star" cx="365" cy="424" r="7"/><circle class="star" cx="521" cy="400" r="4"/><circle class="star" cx="670" cy="440" r="5"/>
<path class="ecliptic" d="M30 338 C190 270 320 315 460 300 S665 235 775 270"/><text class="note" x="558" y="218">黄道搜索带</text><text class="small" x="39" y="367">太阳和多数行星常出现的路径附近</text>
<g id="target-A" role="button" tabindex="0" aria-label="选择亮点 A"><circle class="point" cx="330" cy="254" r="6"/><circle class="ring" cx="330" cy="254" r="18"/><rect class="labelbox" x="345" y="224" width="31" height="29" rx="3"/><text class="candidate-label" x="354" y="245">A</text></g>
<g id="target-B" role="button" tabindex="0" aria-label="选择亮点 B"><circle class="point" cx="642" cy="82" r="6"/><circle class="ring" cx="642" cy="82" r="18"/><rect class="labelbox" x="658" y="53" width="31" height="29" rx="3"/><text class="candidate-label" x="667" y="74">B</text></g>
<g id="target-C" role="button" tabindex="0" aria-label="选择亮点 C"><circle class="point" cx="470" cy="249" r="6"/><circle class="ring" cx="470" cy="249" r="18"/><rect class="labelbox" x="485" y="219" width="31" height="29" rx="3"/><text class="candidate-label" x="494" y="240">C</text></g>
<g id="target-D" role="button" tabindex="0" aria-label="选择亮点 D"><circle class="point" cx="214" cy="382" r="5"/><circle class="ring" cx="214" cy="382" r="18"/><rect class="labelbox" x="228" y="352" width="31" height="29" rx="3"/><text class="candidate-label" x="237" y="373">D</text></g>
</svg></div><div class="legend"><span class="dash" aria-hidden="true"></span>黄道搜索带 <span class="ringkey" aria-hidden="true"></span>待检查亮点</div></section>
<section class="result-side min0" aria-labelledby="filter-title"><div class="section-head"><h2 id="filter-title">两道门，不是外观印象</h2><span>逐项筛选</span></div><p class="instruction" id="live" aria-live="polite">选择一个亮点：先看它是否偏离星图恒星位置，再看它是否靠近黄道。</p><div class="cards quiz k-classification" id="cards"></div><div class="summary" id="summary"><span class="prompt">检查完四项，这里会按两道门归类。</span><span class="branch drop">排除 <strong>2</strong></span><span class="branch keep">保留候选 <strong>2</strong></span><button class="reset" id="reset" type="button">重来</button></div></section>
</main>
<footer><div class="takeaway">只有<b>“偏离星图恒星位置”</b>且<b>“靠近黄道”</b>的亮点，才保留为强候选。</div><div class="next"><span>下一问</span>保留下来的候选，和邻近亮星相比到底有多亮？</div></footer>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
(()=>{ 'use strict'; Deck.init({index:13,total:20});
const data={A:{place:'黄道北侧，在两颗亮星之间',star:true,band:true,look:'亮、偏白、几乎不闪',verdict:'保留：强候选',reason:'两道位置证据都通过。'},B:{place:'星图右上角',star:true,band:false,look:'很亮、白、几乎不闪',verdict:'淘汰：不在搜索带',reason:'离黄道约两拳宽。'},C:{place:'黄道旁',star:false,band:true,look:'亮、偏白、几乎不闪',verdict:'淘汰：它已在星图上',reason:'与星图恒星圆点重合。'},D:{place:'黄道南侧',star:true,band:true,look:'不太亮、略闪',verdict:'保留：仍是候选',reason:'外观不够突出，也不能替代位置检查。'}};
let state; const cards=document.getElementById('cards'),count=document.getElementById('count'),summary=document.getElementById('summary'),live=document.getElementById('live');
function initial(){return {selected:null,checked:{A:false,B:false,C:false,D:false}}} function choose(id){state.selected=id;state.checked[id]=true;render();live.textContent=`已检查 ${id}：${data[id].verdict}。${data[id].reason}`}
function render(){const n=Object.values(state.checked).filter(Boolean).length;count.textContent=`${n} / 4`;cards.innerHTML=Object.entries(data).map(([id,x])=>{const sel=state.selected===id,done=state.checked[id],keep=x.star&&x.band;return `<button type="button" class="opt ${sel?'selected':''} ${done?'done':''}" data-id="${id}" aria-pressed="${sel}"><span class="card-top"><span class="letter">${id}</span><span class="state">${done?x.verdict:'待判断'}</span></span><div class="location">${x.place}</div><div class="gates">偏离星图恒星位置？ <span class="${x.star?'gate-pass':'gate-fail'}">${x.star?'通过':'未通过'}</span><br>靠近黄道搜索带？ <span class="${x.band?'gate-pass':'gate-fail'}">${x.band?'通过':'未通过'}</span><div class="verdict ${keep?'keep':'drop'}">${x.verdict}</div></div><div class="impression">外观印象：${x.look}。<br>${x.reason}</div></button>`}).join(''); summary.classList.toggle('complete',n===4);document.querySelectorAll('[id^="target-"]').forEach(el=>{const id=el.id.slice(-1), ring=el.querySelector('.ring');ring.classList.toggle('checked',state.checked[id]&&!((data[id].star&&data[id].band)));el.setAttribute('aria-pressed',state.selected===id?'true':'false')})}
function reset(){state=initial();render();document.getElementById('target-A').focus();live.textContent='已重来，四个亮点都恢复为待判断。'}
cards.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)choose(b.dataset.id)});document.querySelectorAll('[id^="target-"]').forEach(el=>{const go=()=>choose(el.id.slice(-1));el.addEventListener('click',go);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});document.getElementById('reset').addEventListener('click',reset);state=initial();render();
})();
</script>
</body></html>
