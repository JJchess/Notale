<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#07111F;--text:#e9f1f5;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#FFD166;--map:#86BBD8;--candidate:#FFD166}
*{box-sizing:border-box} #stage{padding:28px 56px;display:flex;flex-direction:column;gap:14px;overflow:hidden;color:var(--text)}
header{height:76px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid rgba(134,187,216,.28);padding-bottom:12px}.kicker{font:700 var(--fs-label) var(--font-mono);letter-spacing:.16em;color:var(--map);margin-bottom:5px}h1{font-size:var(--fs-h1);line-height:1.15;margin:0;font-weight:700}.legend{display:flex;gap:18px;align-items:center;font-size:var(--fs-label);color:#c7d6df;margin-top:22px}.key{display:inline-flex;align-items:center;gap:7px}.swatch{width:24px;height:0;border-top:3px solid var(--map)}.ringkey{width:16px;height:16px;border:3px solid var(--candidate);border-radius:50%}
.process{height:78px;display:flex;align-items:center;justify-content:center;gap:0}.step{width:192px;display:flex;align-items:center;color:#7d919d}.step:not(:last-child)::after{content:"";width:50px;border-top:2px solid #385362;margin:0 10px}.dot{width:30px;height:30px;border:2px solid #587484;border-radius:50%;display:grid;place-items:center;font:700 var(--fs-label) var(--font-mono);margin-right:9px;flex:none}.step b{font-size:var(--fs-label)}.step.done{color:var(--map)}.step.done .dot{background:var(--map);color:#07111F;border-color:var(--map)}.step.active{color:var(--candidate)}.step.active .dot{border-color:var(--candidate);box-shadow:0 0 0 5px rgba(255,209,102,.12)}.step.done:not(:last-child)::after{border-color:var(--map)}
main{min-height:0;flex:1;display:flex;gap:24px}.map-panel{position:relative;flex:1.52;min-width:0;border:1px solid rgba(134,187,216,.48);background:radial-gradient(circle at 56% 36%,#102944 0,#091828 44%,#07111f 75%);overflow:hidden}.map-panel svg{width:100%;height:100%;display:block}.side{width:390px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}.instruction{border-left:4px solid var(--candidate);padding:13px 0 13px 18px}.instruction .n{font:700 var(--fs-label) var(--font-mono);color:var(--candidate);letter-spacing:.08em}.instruction h2{font-size:var(--fs-h2);line-height:1.3;margin:5px 0 6px}.instruction p,.feedback,.note{font-size:var(--fs-sec);line-height:1.48;color:#c9d6dc;margin:0}.controls{border:1px solid rgba(134,187,216,.35);border-radius:14px;padding:16px;background:rgba(14,37,57,.58)}.control-title{font-size:var(--fs-label);font-weight:700;margin:0 0 12px}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btn{appearance:none;border:1px solid #5e8295;background:#102b40;color:var(--text);border-radius:8px;padding:10px 12px;font:600 var(--fs-label) var(--font-sans);cursor:pointer}.btn:hover{border-color:var(--map)}.btn:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.btn[disabled]{opacity:.35;cursor:not-allowed}.reset{margin-left:auto;background:transparent;color:#bcd0da}.range{width:100%;accent-color:var(--candidate);margin:5px 0 10px}.feedback{min-height:49px;border-top:1px solid rgba(134,187,216,.25);padding-top:12px}.feedback strong{color:var(--candidate)}.footer{height:46px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(134,187,216,.28);padding-top:10px}.takeaway{font-size:var(--fs-body);line-height:1.35}.next{font-size:var(--fs-sec);color:var(--map)}
svg text{font-family:var(--font-sans)}.skylabel{fill:#dbeaf1;font-size:16px;font-weight:700}.tiny{fill:#91a8b6;font-size:14px}.star{fill:#eaf6f8}.const{stroke:var(--map);stroke-width:2;fill:none}.ecliptic{stroke:#86BBD8;stroke-width:7;stroke-dasharray:13 12;opacity:.74;fill:none}.horizon{stroke:#d4e4e8;stroke-width:7;fill:none}.paper{fill:#0e2639;stroke:#617d8b;stroke-width:3}.paper.aligned{stroke:var(--map);filter:drop-shadow(0 0 7px rgba(134,187,216,.45))}.target{fill:#fff7d6}.candidate-ring{fill:none;stroke:var(--candidate);stroke-width:5}.scan{fill:#86BBD8;opacity:.13}.hidden{display:none}.selectstar{cursor:pointer}.selectstar:hover circle{stroke:var(--candidate);stroke-width:4}.selected circle{stroke:var(--map);stroke-width:5;fill:#fff}.correct-dot{fill:var(--map)}
</style>
</head>
<body data-page="15" data-total="20">
<div id="stage">
<header><div><div class="kicker">FIELD DRILL</div><h1>不靠“看起来像”：按五步把候选圈出来</h1></div><div class="legend"><span class="key"><i class="swatch"></i>已配准星图</span><span class="key"><i class="ringkey"></i>当前候选</span></div></header>
<div class="process k-process" aria-label="五步现场指认流程"><div class="step active" id="node1"><span class="dot">1</span><b>对方向</b></div><div class="step" id="node2"><span class="dot">2</span><b>认图样</b></div><div class="step" id="node3"><span class="dot">3</span><b>扫黄道</b></div><div class="step" id="node4"><span class="dot">4</span><b>圈候选</b></div><div class="step" id="node5"><span class="dot">5</span><b>查星图</b></div></div>
<main><section class="map-panel min0" aria-label="同一片天空与纸质星图演练"><svg viewBox="0 0 980 590" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">夜空星图现场比对</title><desc id="svgdesc">南方地平线、黄道、三颗亮星组成的固定图样，以及黄道附近一颗未标在纸图上的亮点。</desc>
<path class="horizon" d="M55 505 Q490 350 925 505"/><text class="skylabel" x="474" y="432">S</text><text class="tiny" x="421" y="463">南方地平线</text><path class="ecliptic" d="M70 315 Q450 220 920 315"/><text class="tiny" x="708" y="254">黄道：常见的天空路径附近</text>
<g id="scanzone" class="hidden"><path class="scan" d="M70 270 Q450 175 920 270 L920 360 Q450 265 70 360Z"/></g>
<g id="pattern"><path class="const hidden" id="line1" d="M263 218 L351 164 L422 241"/><g class="selectstar" data-star="a"><circle class="star" cx="263" cy="218" r="8"/><path class="star" d="M263 201v34m-17-17h34"/></g><g class="selectstar" data-star="b"><circle class="star" cx="351" cy="164" r="8"/><path class="star" d="M351 147v34m-17-17h34"/></g><g class="selectstar" data-star="c"><circle class="star" cx="422" cy="241" r="8"/><path class="star" d="M422 224v34m-17-17h34"/></g></g>
<g opacity=".8"><circle class="star" cx="150" cy="145" r="3"/><circle class="star" cx="540" cy="120" r="3"/><circle class="star" cx="689" cy="194" r="4"/><circle class="star" cx="830" cy="160" r="3"/><circle class="star" cx="767" cy="408" r="3"/><circle class="star" cx="187" cy="391" r="3"/><circle class="star" cx="560" cy="385" r="3"/></g>
<g id="candidate" class="selectstar"><circle class="target" cx="598" cy="268" r="8"/><path class="star" d="M598 250v36m-18-18h36"/><circle id="candring" class="candidate-ring hidden" cx="598" cy="268" r="20"/></g>
<g id="paperGroup" transform="translate(733 379) rotate(38)"><circle id="paper" class="paper" cx="0" cy="0" r="88"/><text class="skylabel" x="-6" y="-52">S</text><path class="const" d="M-48 -17 L-8 -43 L25 -7"/><circle class="correct-dot" cx="-48" cy="-17" r="4"/><circle class="correct-dot" cx="-8" cy="-43" r="4"/><circle class="correct-dot" cx="25" cy="-7" r="4"/><text class="tiny" x="-51" y="62">纸质星图</text><circle id="paperSpot" class="hidden" cx="-17" cy="21" r="12" fill="none" stroke="#FFD166" stroke-width="4"/></g>
</svg></section>
<section class="side min0"><div class="instruction"><div class="n" id="stepnum">STEP 01 / 05</div><h2 id="instTitle">先让图上的 S 对着眼前南方地平线</h2><p id="instText">拖动滑块转动纸图；让两处 S 对齐。</p></div><div class="controls panel"><p class="control-title" id="controlTitle">旋转纸图</p><div id="controlArea"></div><p class="feedback" id="feedback" aria-live="polite">纸图尚未对准。把 S 转到正上方。</p></div><p class="note">前一步完成后，下一步才会亮起。错选不会重置已经留下的证据。</p></section></main>
<div class="footer"><div class="takeaway">对准方向、钉住图样、沿黄道找缺口，再查图：每一步都在排除误认。</div><div class="next">圈出的亮点，为什么还只能叫“候选”？</div></div>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script>
<script>
(()=>{const state0=()=>({step:1,angle:38,picked:[],scanned:false,circled:false,checked:false});let s=state0();const $=id=>document.getElementById(id);const data=[null,{t:'先让图上的 S 对着眼前南方地平线',x:'拖动滑块转动纸图；让两处 S 对齐。',c:'旋转纸图'},{t:'找到这组三颗亮星',x:'依次点选三颗带短芒的亮星。',c:'点选亮星'},{t:'沿宽虚线找不属于图样的亮点',x:'点击“沿黄道扫描”，只在宽虚线附近搜索。',c:'扫描黄道'},{t:'圈住黄道附近、但未被星图标出的亮点',x:'点选未被青蓝连线标出的亮点。',c:'选择亮点'},{t:'这里有对应恒星吗？',x:'点按纸图中的对应位置，查一查是否有恒星。',c:'查纸图'}];
function advance(){s.step++;render()} function feedback(msg){$('feedback').innerHTML=msg} function render(){const d=data[s.step];$('stepnum').textContent=`STEP 0${s.step} / 05`;$('instTitle').textContent=d.t;$('instText').textContent=d.x;$('controlTitle').textContent=d.c;$('controlArea').innerHTML='';for(let i=1;i<=5;i++){$('node'+i).className='step '+(i<s.step?'done':i===s.step?'active':'')}$('paperGroup').setAttribute('transform',`translate(733 379) rotate(${s.angle})`);$('paper').classList.toggle('aligned',s.step>1);$('line1').classList.toggle('hidden',s.picked.length<3);$('scanzone').classList.toggle('hidden',!s.scanned);$('candring').classList.toggle('hidden',!s.circled);$('paperSpot').classList.toggle('hidden',!s.checked);document.querySelectorAll('.selectstar[data-star]').forEach(e=>e.classList.toggle('selected',s.picked.includes(e.dataset.star)));
const a=$('controlArea');if(s.step===1){a.innerHTML='<input id="rot" class="range" type="range" min="0" max="50" value="'+s.angle+'" aria-label="旋转纸图"><div class="btnrow"><button class="btn" id="align">自动对齐 S</button><button class="btn reset" id="reset">重来</button></div>';$('rot').oninput=e=>{s.angle=+e.target.value;if(s.angle<=4){s.angle=0;feedback('<strong>方向已对齐。</strong>纸图框变为青蓝；现在认图样。');advance()}else render()};$('align').onclick=()=>{s.angle=0;feedback('<strong>方向已对齐。</strong>纸图框变为青蓝；现在认图样。');advance()}}
else if(s.step===2){a.innerHTML='<div class="btnrow"><button class="btn reset" id="reset">重来</button></div>'}else if(s.step===3){a.innerHTML='<div class="btnrow"><button class="btn" id="scan">沿黄道扫描</button><button class="btn reset" id="reset">重来</button></div>';$('scan').onclick=()=>{s.scanned=true;feedback('<strong>搜索带已显现。</strong>现在只看虚线附近的亮点。');advance()}}else if(s.step===4){a.innerHTML='<div class="btnrow"><button class="btn reset" id="reset">重来</button></div>'}else{a.innerHTML='<div class="btnrow"><button class="btn" id="check">点按纸图对应位置</button><button class="btn reset" id="reset">重来</button></div>';$('check').onclick=()=>{s.checked=true;feedback('<strong>星图无对应恒星：保留为候选。</strong>五步证据已齐；仍需之后复查。');render()}}if($('reset'))$('reset').onclick=reset}
function reset(){s=state0();render();$('rot')?.focus();feedback('已重来：纸图回到未对准状态。')}document.querySelectorAll('.selectstar[data-star]').forEach(el=>el.addEventListener('click',()=>{if(s.step===4){feedback('它属于已知图样；请找未被标出的亮点。');return}if(s.step!==2)return;let id=el.dataset.star;if(s.picked.includes(id))return;s.picked.push(id);if(s.picked.length===3){feedback('<strong>固定图样已钉住。</strong>这些星可当作稳定背景。');advance()}else{feedback('已选 '+s.picked.length+' / 3 颗；继续找同一图样中的亮星。')}render()}));$('candidate').addEventListener('click',()=>{if(s.step===4){s.circled=true;feedback('<strong>黄环已圈住亮点。</strong>它不属于已连出的图样。');advance()}else if(s.step===2)feedback('换成同一图样中的亮星。')});Deck.init({index:15,total:20});render()})();
</script>
</body></html>
