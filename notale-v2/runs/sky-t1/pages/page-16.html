<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#07111F;--text:#e7eef4;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#FFD166}
*{box-sizing:border-box}
#stage{display:flex;flex-direction:column;overflow:hidden;padding:28px 56px;color:var(--text);background:var(--bg)}
.page-head{height:112px;flex:0 0 112px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid rgba(134,187,216,.28);padding-top:6px}
.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.15em;color:var(--map);margin:3px 0 12px}
h1{font:700 var(--fs-h1)/1.22 var(--font-sans);letter-spacing:.01em;margin:0;color:var(--text)}
.head-rule{width:260px;height:1px;background:linear-gradient(90deg,transparent,rgba(134,187,216,.7));margin-top:26px}
.main{flex:1;min-height:0;position:relative;display:flex;align-items:center;padding:8px 0 6px}
.focus-field{width:100%;height:100%;position:relative;min-height:0}
.field-note{position:absolute;left:0;top:62px;width:242px;color:rgba(231,238,244,.8);font:var(--fs-sec)/1.55 var(--font-sans)}
.field-note strong{font-weight:700;color:var(--text)}
.field-note:before{content:"";display:block;width:42px;height:3px;background:var(--candidate);margin-bottom:16px}
.sky{position:absolute;left:274px;right:76px;top:10px;bottom:16px}
.sky svg{width:100%;height:100%;display:block;overflow:visible}
.state-line{position:absolute;left:316px;right:120px;bottom:43px;height:100px;display:flex;align-items:flex-start}
.state-line:before{content:"";position:absolute;top:22px;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--candidate) 0 45%,rgba(231,238,244,.28) 45% 100%)}
.state{position:absolute;top:0;transform:translateX(-50%);text-align:center;white-space:nowrap}
.state:first-child{left:26%}.state:last-child{left:76%}
.state-dot{width:14px;height:14px;border-radius:50%;margin:16px auto 12px;background:var(--candidate);box-shadow:0 0 0 5px rgba(255,209,102,.13)}
.state:last-child .state-dot{background:#71808b;box-shadow:none}
.state b{display:block;font:700 var(--fs-body)/1.2 var(--font-sans);color:var(--candidate)}
.state:last-child b{color:#8e9aa4;font-weight:600}
.state span{display:block;margin-top:6px;font:var(--fs-label)/1.25 var(--font-sans);color:#aeb9c1}
.state:last-child span{color:#77828c}
.tag{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font:700 var(--fs-label)/1 var(--font-sans);letter-spacing:.12em;color:#18202a;background:var(--candidate);padding:7px 13px;border-radius:2px}
.closing{height:112px;flex:0 0 112px;border-top:1px solid rgba(134,187,216,.28);display:flex;align-items:center;justify-content:space-between;gap:44px}
.closing .claim{font:var(--fs-lead)/1.42 var(--font-sans);color:var(--text);max-width:660px}.closing .claim strong{color:var(--candidate);font-weight:700}
.next{max-width:510px;text-align:right;font:var(--fs-sec)/1.5 var(--font-sans);color:#b8c5cd}.next em{font-style:normal;color:var(--map);font-family:var(--font-mono);font-size:var(--fs-label);margin-right:11px}
</style>
</head>
<body data-page="16" data-total="20">
<div id="stage">
  <header class="page-head">
    <div><div class="kicker">EVIDENCE PAUSE</div><h1>今晚可以圈出候选，不能急着写确认</h1></div>
    <div class="head-rule" aria-hidden="true"></div>
  </header>
  <main class="main min0">
    <section class="focus-field k-generalization min0" aria-label="候选与确认的判断关系">
      <aside class="field-note"><strong>先停在这里。</strong><br>一个亮点落在黄道附近、又不属于恒星图样时，可以先圈出；但一次看见，还不是确认。</aside>
      <div class="sky" aria-hidden="true">
        <svg viewBox="0 0 1000 530" role="img" aria-label="星图碎片中的一个候选亮点">
          <g fill="none" stroke="var(--map)" stroke-width="1.6" opacity=".72">
            <path d="M104 128 L232 198 L360 144 L476 218"/><path d="M556 112 L672 179 L815 145 L904 231"/>
            <path d="M154 358 L276 300 L400 372"/><path d="M672 346 L806 286 L914 370"/>
          </g>
          <g fill="var(--map)" opacity=".9"><circle cx="104" cy="128" r="4"/><circle cx="232" cy="198" r="3"/><circle cx="360" cy="144" r="5"/><circle cx="476" cy="218" r="3"/><circle cx="556" cy="112" r="3"/><circle cx="672" cy="179" r="5"/><circle cx="815" cy="145" r="3"/><circle cx="904" cy="231" r="4"/><circle cx="154" cy="358" r="4"/><circle cx="276" cy="300" r="3"/><circle cx="400" cy="372" r="4"/><circle cx="672" cy="346" r="3"/><circle cx="806" cy="286" r="5"/><circle cx="914" cy="370" r="3"/></g>
          <path d="M74 283 C256 225, 405 294, 540 259 S790 213, 948 275" fill="none" stroke="var(--map)" stroke-width="6" stroke-dasharray="16 14" opacity=".9"/>
          <text x="92" y="250" fill="var(--map)" font-family="var(--font-sans)" font-size="16">黄道附近</text>
          <text x="166" y="104" fill="var(--map)" font-family="var(--font-sans)" font-size="15" opacity=".82">恒星图样</text>
          <text x="700" y="108" fill="var(--map)" font-family="var(--font-sans)" font-size="15" opacity=".82">稳定背景</text>
          <text x="174" y="395" fill="var(--map)" font-family="var(--font-sans)" font-size="15" opacity=".72">细实线连起的星</text>
          <text x="732" y="412" fill="var(--map)" font-family="var(--font-sans)" font-size="15" opacity=".72">不是候选目标</text>
          <text x="432" y="333" fill="var(--candidate)" font-family="var(--font-sans)" font-size="15">圈住，不确认</text>
          <text x="586" y="300" fill="var(--text)" font-family="var(--font-sans)" font-size="15" opacity=".75">一个亮点</text>
          <g transform="translate(514 265)"><circle r="42" fill="none" stroke="var(--candidate)" stroke-width="5"/><circle r="8" fill="#f4f7f5"/><path d="M-58 0h-18M58 0h18M0-58v-18M0 58v18" stroke="var(--candidate)" stroke-width="2" opacity=".8"/></g>
        </svg>
        <div class="tag">候选</div>
      </div>
      <div class="state-line" aria-label="判断状态线：今晚只能写候选，确认还不能写">
        <div class="state"><div class="state-dot"></div><b>今晚：候选</b><span>先圈出这个亮点</span></div>
        <div class="state"><div class="state-dot"></div><b>确认：还不能写</b><span>证据还不够</span></div>
      </div>
    </section>
  </main>
  <footer class="closing"><div class="claim"><strong>一次看见只是开始：</strong>它值得复查，才先叫“候选”。</div><div class="next"><em>下一问</em>明天回到同一片恒星背景，它还在原来的位置吗？</div></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:16,total:20});</script>
</body>
</html>
