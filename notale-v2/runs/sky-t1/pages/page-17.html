<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#07111F;--text:#edf4fa;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#FFD166;--night:#07111F;--map-cyan:#86BBD8;--observe-yellow:#FFD166}
*{box-sizing:border-box} body{margin:0;overflow:hidden} button{font:inherit}
#stage{height:900px;padding:28px 56px;display:flex;flex-direction:column;color:var(--text);background:var(--bg);font-family:var(--font-sans)}
.header{height:104px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid rgba(134,187,216,.34);padding-bottom:18px}.kicker{font-size:var(--fs-label);letter-spacing:.16em;color:var(--map-cyan);font-weight:700;margin:3px 0 10px}.header h1{font-size:var(--fs-h1);line-height:1.25;margin:0;font-weight:700;letter-spacing:.01em}.header-note{margin-top:11px;font-size:var(--fs-sec);line-height:1.5;color:#b8cad7;text-align:right;max-width:310px}
.sequence{height:434px;padding:25px 0 16px;position:relative}.process-line{position:absolute;left:7%;right:7%;top:74px;height:2px;background:rgba(134,187,216,.35)}.process-line:after{content:"";position:absolute;right:-1px;top:-5px;border-left:10px solid var(--map-cyan);border-top:6px solid transparent;border-bottom:6px solid transparent}.frames{position:relative;display:flex;gap:25px;height:100%}.night{flex:1;min-width:0;position:relative;border:1px solid rgba(134,187,216,.52);background:rgba(7,17,31,.42);padding:47px 18px 15px}.night:first-child{border-left:3px solid var(--map-cyan)}.night-label{position:absolute;top:14px;left:18px;font-family:var(--font-mono,monospace);font-size:var(--fs-label);letter-spacing:.06em;color:#d8e8f0}.night-label span{color:#9db3c1;margin-left:8px;font-family:var(--font-sans)}.night.current{border-color:var(--observe-yellow);box-shadow:inset 0 0 0 1px rgba(255,209,102,.25)}.night.current .night-label{color:var(--observe-yellow)}
.sky{width:100%;height:100%;display:block;overflow:visible}.sky .constellation{fill:none;stroke:var(--map-cyan);stroke-width:1.5;opacity:.75}.sky .ecliptic{fill:none;stroke:var(--observe-yellow);stroke-width:5;stroke-dasharray:13 10;opacity:.9}.sky .star{fill:#dfeef5}.sky .bright{fill:#f4fbff}.sky .ray{stroke:#e8f7ff;stroke-width:1.4}.sky .letter{fill:#dfeef5;font:600 15px var(--font-sans)}.sky .smallnote{fill:#a9becb;font:14px var(--font-sans)}.candidate{transition:opacity 180ms ease,transform 450ms ease;transform-origin:center;opacity:0}.candidate.show{opacity:1}.candidate.enter{transform:translate(-24px,18px);opacity:0}.candidate .halo{fill:none;stroke:var(--observe-yellow);stroke-width:4}.candidate .dot{fill:#fff8dc}.candidate .pointer{stroke:var(--observe-yellow);stroke-width:2}.candidate.current-ring .halo{stroke-width:6}.await{font-size:var(--fs-sec);fill:#8299a8;letter-spacing:.05em}
.controls{height:240px;display:flex;gap:26px;padding-top:13px}.panel{border:1px solid rgba(134,187,216,.44);background:rgba(15,37,57,.52);border-radius:12px;padding:19px 22px}.control-panel{width:610px;display:flex;flex-direction:column}.panel-title{font-size:var(--fs-label);color:var(--map-cyan);font-weight:700;letter-spacing:.08em;margin-bottom:14px}.date-tabs{display:flex;gap:9px}.date-tab,.btn{border:1px solid rgba(134,187,216,.68);background:#0c2033;color:var(--text);min-height:43px;border-radius:7px;cursor:pointer;font-size:var(--fs-label);font-weight:700}.date-tab{flex:1;font-family:var(--font-mono,monospace)}.date-tab[aria-pressed="true"]{background:rgba(255,209,102,.15);border-color:var(--observe-yellow);color:var(--observe-yellow)}button:hover{border-color:var(--observe-yellow)}button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.action-row{display:flex;align-items:center;gap:12px;margin-top:17px}.btn.advance{background:var(--observe-yellow);color:#172132;border-color:var(--observe-yellow);padding:0 18px}.btn.reset{padding:0 15px}.btn:disabled{opacity:.42;cursor:not-allowed}.keyhint{font-size:var(--fs-label);color:#acc0cc;line-height:1.4;margin-left:auto}.reading{flex:1;min-width:0;position:relative;padding-left:30px}.reading:before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:3px;background:var(--observe-yellow)}.reading h2{margin:0 0 12px;font-size:var(--fs-h2);line-height:1.3}.reading p{margin:0;font-size:var(--fs-lead);line-height:1.52;color:#e7f0f5;max-width:640px}.reading strong{color:var(--observe-yellow)}.legend{display:flex;gap:20px;align-items:center;margin-top:16px;font-size:var(--fs-label);color:#bdd0db}.legend-item{display:flex;align-items:center;gap:7px;white-space:nowrap}.swatch{width:28px;height:0;border-top:2px solid var(--map-cyan)}.swatch.eclip{border-top:5px dashed var(--observe-yellow)}.swatch.ring{height:17px;width:17px;border:3px solid var(--observe-yellow);border-radius:50%}.note{position:absolute;bottom:4px;right:0;font-size:var(--fs-label);color:#91a7b5}
.footer{height:74px;border-top:1px solid rgba(134,187,216,.34);display:flex;align-items:center;justify-content:space-between;gap:35px}.takeaway{font-size:var(--fs-body);line-height:1.45;max-width:920px}.next{font-size:var(--fs-sec);color:var(--map-cyan);text-align:right;max-width:410px;line-height:1.4}.sr-status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){.candidate{transition:none}}
</style>
</head>
<body data-page="17" data-total="20">
<div id="stage">
  <header class="header"><div><div class="kicker">复核证据</div><h1>候选若相对恒星换了位置，就不只是一次猜测</h1></div><div class="header-note">让同一组亮星留在原处，<br>只复看候选的位置。</div></header>
  <main class="sequence k-process" aria-label="三次复看过程">
    <div class="process-line" aria-hidden="true"></div>
    <div class="frames">
      <section class="night" data-index="0" aria-label="第 1 晚局部天空"><div class="night-label">第 1 晚 <span>候选在 A 的左下方</span></div><svg class="sky" viewBox="0 0 420 300" aria-hidden="true"></svg></section>
      <section class="night" data-index="1" aria-label="第 8 晚局部天空"><div class="night-label">第 8 晚 <span>候选更靠近 A</span></div><svg class="sky" viewBox="0 0 420 300" aria-hidden="true"></svg></section>
      <section class="night" data-index="2" aria-label="第 15 晚局部天空"><div class="night-label">第 15 晚 <span>候选越过与 A 的连线</span></div><svg class="sky" viewBox="0 0 420 300" aria-hidden="true"></svg></section>
    </div>
  </main>
  <section class="controls" aria-label="日期推进与证据读法">
    <div class="panel control-panel" id="interaction" tabindex="0" aria-describedby="instruction">
      <div class="panel-title">日期推进 · 同尺度复看</div>
      <div class="date-tabs" role="group" aria-label="跳到某一次复看">
        <button class="date-tab" data-go="0" aria-pressed="true">第 1 晚</button><button class="date-tab" data-go="1" aria-pressed="false">第 8 晚</button><button class="date-tab" data-go="2" aria-pressed="false">第 15 晚</button>
      </div>
      <div class="action-row"><button class="btn advance" id="advance">推进一天</button><button class="btn reset" id="reset">重新开始</button><span class="keyhint" id="instruction">也可用 ← → 键</span></div>
    </div>
    <div class="reading"><h2 id="reading-title">第 1 晚：先留下相对位置</h2><p id="reading-text" aria-live="polite">候选在亮星 A 的<strong>左下方</strong>，也离亮星 B 较远。下一次仍对着同一组星，再看这个关系。</p><div class="legend" aria-label="图例"><span class="legend-item"><i class="swatch"></i>青蓝：恒星图样（背景）</span><span class="legend-item"><i class="swatch eclip"></i>黄虚线：黄道附近</span><span class="legend-item"><i class="swatch ring"></i>黄环：候选亮点</span></div><div class="note">示意位置，不按比例；实际移动快慢和方向会变。</div></div>
  </section>
  <footer class="footer"><div class="takeaway">恒星图样可作固定背景；隔日记录候选相对亮星的位置，才能复核它是否为行星。</div><div class="next">明晚回来时，你要留下哪几项信息，才能找到同一个候选？</div></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(()=>{
  const data=[
    {title:'第 1 晚：先留下相对位置',text:'候选在亮星 A 的<strong>左下方</strong>，也离亮星 B 较远。下一次仍对着同一组星，再看这个关系。',status:'第 1 晚。候选在亮星 A 的左下方。'},
    {title:'第 8 晚：它更靠近亮星 A',text:'恒星、连线和黄道都没有换位置；候选却<strong>向右上</strong>靠近了亮星 A。值得再复看。',status:'第 8 晚。候选更靠近亮星 A。'},
    {title:'第 15 晚：候选越过了 A 的连线',text:'背景仍是同一张星图。候选已<strong>越过与 A 的连线</strong>：改变的是它相对恒星的位置。',status:'第 15 晚。候选越过与 A 的连线。'}
  ];
  const stars=`<path class="constellation" d="M72 225 L175 150 L285 112 L360 58 M175 150 L330 224"/><path class="ecliptic" d="M28 253 C128 229 260 176 397 101"/><circle class="star" cx="72" cy="225" r="3"/><circle class="star" cx="285" cy="112" r="3"/><circle class="star" cx="360" cy="58" r="3"/><circle class="star" cx="330" cy="224" r="3"/><circle class="bright" cx="175" cy="150" r="6"/><path class="ray" d="M175 136v-10m0 48v-10m-14-14h-10m48 0h-10"/><text class="letter" x="188" y="143">A</text><circle class="bright" cx="330" cy="224" r="5"/><path class="ray" d="M330 211v-8m0 42v-8m-13-13h-8m42 0h-8"/><text class="letter" x="342" y="219">B</text><text class="smallnote" x="245" y="266">黄道附近</text>`;
  const poses=[[126,209],[160,180],[207,146]];
  const svgs=[...document.querySelectorAll('.sky')], nights=[...document.querySelectorAll('.night')], tabs=[...document.querySelectorAll('.date-tab')];
  const advance=document.querySelector('#advance'), reset=document.querySelector('#reset'); let state={night:0}; let timer=0;
  function candidate(i, current){const [x,y]=poses[i];return `<g class="candidate show ${current?'current-ring enter':''}" style="transform-box:fill-box"><circle class="halo" cx="${x}" cy="${y}" r="14"/><circle class="dot" cx="${x}" cy="${y}" r="3.5"/></g>`}
  function render(animate=false){clearTimeout(timer); const n=state.night; svgs.forEach((svg,i)=>{svg.innerHTML=stars+(i<=n?candidate(i,i===n):'<text class="await" x="135" y="180">等待复看</text>')}); nights.forEach((el,i)=>el.classList.toggle('current',i===n));tabs.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===n))); document.querySelector('#reading-title').textContent=data[n].title;document.querySelector('#reading-text').innerHTML=data[n].text;advance.disabled=n===2;advance.textContent=n===2?'已到第 15 晚':'推进一天';if(animate&&!Deck.reduced()){timer=setTimeout(()=>{const ring=svgs[n].querySelector('.candidate.enter');if(ring) ring.classList.remove('enter')},80)}}
  function setNight(next,animate=true){if(next<0||next>2||next===state.night)return;state={night:next};render(animate)}
  advance.addEventListener('click',()=>setNight(Math.min(2,state.night+1)));
  tabs.forEach(b=>b.addEventListener('click',()=>setNight(Number(b.dataset.go))));
  reset.addEventListener('click',()=>{state={night:0};render(false);document.querySelector('[data-go="0"]').focus();});
  document.querySelector('#interaction').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();e.stopPropagation();setNight(Math.min(2,state.night+1))}if(e.key==='ArrowLeft'){e.preventDefault();e.stopPropagation();setNight(Math.max(0,state.night-1))}});
  window.addEventListener('pagehide',()=>clearTimeout(timer),{once:true});render(false);Deck.init({index:17,total:20});
})();
</script>
</body>
</html>
