<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main { overflow: hidden; }
  progress.lec-progress { appearance: none; border: 0; padding: 0; font-size: 0; line-height: 0; }
  progress.lec-progress::-webkit-progress-bar,
  progress.lec-progress::-webkit-progress-value { height: 2px; border: 0; }
  .opening {
    position: relative;
    width: var(--content-w);
    height: var(--content-h);
    overflow: hidden;
    background: var(--bg);
  }
  .opening *, .opening *::before, .opening *::after { box-sizing: border-box; }
  .space-scene { position: absolute; inset: 0; overflow: hidden; }
  .space-scene::before {
    position: absolute;
    inset: 34% 0 6% 18%;
    opacity: .28;
    background-image:
      radial-gradient(circle, var(--text-muted) 0 1px, transparent 1.5px),
      radial-gradient(circle, var(--primary) 0 1px, transparent 1.5px);
    background-position: 0 0, 19px 13px;
    background-size: 31px 23px, 47px 37px;
    mask-image: linear-gradient(105deg, transparent, black 24%, black 72%, transparent);
    content: "";
  }
  .sunlight {
    position: absolute;
    inset: 0;
    opacity: .52;
    background: linear-gradient(24deg, var(--accent-soft), transparent 42%);
  }
  .orbit-field { position: absolute; inset: 0 0 0 13%; overflow: hidden; opacity: 0; animation: orbit-in 2.6s 1s ease-out forwards; }
  .orbit {
    position: absolute;
    left: 0;
    width: 100%;
    border: 1px solid var(--primary-line);
    border-radius: 50%;
  }
  .orbit:nth-child(1) { top: 48%; height: 30%; }
  .orbit:nth-child(2) { top: 35%; height: 48%; }
  .orbit:nth-child(3) { top: 22%; height: 64%; }
  .orbit:nth-child(4) { top: 10%; height: 80%; }
  .body {
    position: absolute;
    margin: 0;
    overflow: hidden;
    border: 1px solid var(--primary-line);
    border-radius: 50%;
    opacity: 0;
    animation: body-in 1.8s ease-out forwards;
  }
  .body img { width: 100%; height: 100%; object-fit: cover; }
  .sun {
    bottom: 0; left: 0; width: 600px; height: 600px;
    border-color: var(--accent);
    animation-delay: .2s;
  }
  .sun img { object-position: 50% 50%; }
  .jupiter { right: 1%; bottom: 1%; width: 500px; height: 500px; animation-delay: 1.55s; }
  .saturn { right: 31%; top: 1%; width: 400px; height: 400px; animation-delay: 1.8s; }
  .minor {
    position: absolute; right: 7%; top: 16%; width: 18px; height: 18px;
    border: 1px solid var(--line-strong); border-radius: 50%; background: var(--surface-raised);
    box-shadow: inset -6px -2px 0 var(--bg); opacity: 0; animation: body-in 1.2s 2.05s ease-out forwards;
  }
  .member-list { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  .member-list span {
    position: absolute; color: var(--text-muted); font-size: var(--fs-sec); line-height: var(--lh-body);
    opacity: 0; animation: name-pass 2.3s ease-in-out both;
  }
  .member-list span:nth-child(1) { left: 10%; top: 67%; animation-delay: .15s; }
  .member-list span:nth-child(2) { left: 27%; top: 51%; animation-delay: .28s; }
  .member-list span:nth-child(3) { left: 37%; top: 75%; animation-delay: .38s; }
  .member-list span:nth-child(4) { left: 49%; top: 42%; animation-delay: .5s; }
  .member-list span:nth-child(5) { left: 59%; top: 70%; animation-delay: .62s; }
  .member-list span:nth-child(6) { left: 70%; top: 32%; animation-delay: .74s; }
  .member-list span:nth-child(7) { left: 80%; top: 61%; animation-delay: .86s; }
  .member-list span:nth-child(8) { left: 87%; top: 25%; animation-delay: .98s; }
  .member-list span:nth-child(9) { left: 91%; top: 78%; animation-delay: 1.1s; }
  .thesis.k-generalization {
    position: absolute; z-index: 6; top: var(--sp-7); left: var(--sp-7); width: 920px;
    opacity: 0; animation: thesis-in 1.2s 2.6s ease-out forwards;
  }
  .thesis.k-generalization > .claim {
    max-width: 900px; margin: 0; padding: var(--sp-5) var(--sp-6);
    border-left-color: var(--accent); background: rgb(7 16 24 / 82%);
    font-size: var(--fs-h1); line-height: var(--lh-tight);
  }
  .claim .key { color: var(--accent); }
  .thesis.k-generalization > .trunk { top: 82px; bottom: 0; left: var(--sp-7); background: var(--primary-line); }
  .thesis.k-generalization > .supports { display: block; padding: var(--sp-5) 0 0 var(--sp-7); }
  .thesis.k-generalization > .supports::before { display: none; }
  .thesis.k-generalization .support {
    width: 760px; padding: var(--sp-4) var(--sp-5); border-top: 0; border-left: 3px solid var(--primary);
    background: rgb(7 16 24 / 72%); color: var(--text); font-size: var(--fs-lead);
  }
  .thesis.k-generalization .support::before { right: 100%; bottom: 50%; left: auto; width: var(--sp-7); height: 2px; }
  @keyframes body-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes orbit-in { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: .72; clip-path: inset(0 0 0 0); } }
  @keyframes name-pass { 0%,100% { opacity: 0; } 24%,54% { opacity: .8; } }
  @keyframes thesis-in { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .body, .minor, .orbit-field, .thesis.k-generalization { animation: none; opacity: 1; }
    .orbit-field { opacity: .72; }
    .member-list { display: none; }
  }
</style>
</head>
