<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main {
    overflow: hidden;
  }

  progress.lec-progress {
    overflow: visible;
    border: 0;
    padding: 0;
    appearance: none;
    -webkit-appearance: none;
  }

  progress.lec-progress::-webkit-progress-bar,
  progress.lec-progress::-webkit-progress-value {
    height: 2px;
    border: 0;
  }

  .course-map {
    position: relative;
    width: var(--content-w);
    height: var(--content-h);
  }

  .map-intro {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--sp-6);
    min-height: 64px;
    padding: 0 0 var(--sp-4) 104px;
    border-bottom: 1px solid var(--line);
  }

  .map-intro .lead {
    color: var(--text);
    font-weight: 650;
  }

  .map-intro .secondary {
    max-width: 680px;
    text-align: right;
  }

  .route-wrap {
    position: relative;
    z-index: 2;
    height: 448px;
    padding-top: var(--sp-2);
  }

  .route-line {
    position: absolute;
    z-index: 0;
    top: 0;
    bottom: 0;
    left: 47px;
    width: 2px;
    overflow: hidden;
    background: var(--line);
  }

  .route-line::after {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--primary);
    content: "";
    transform: scaleY(0);
    transform-origin: top;
    animation: draw-route 1.1s ease-out 180ms forwards;
  }

  .route-orbit {
    position: absolute;
    z-index: -1;
    top: 22px;
    right: 20px;
    width: 430px;
    height: 390px;
    border: 1px solid var(--line);
    border-radius: 50%;
    opacity: 0.42;
    transform: rotate(-12deg);
  }

  .route-orbit::before,
  .route-orbit::after {
    position: absolute;
    border: 1px solid var(--line);
    border-radius: 50%;
    content: "";
  }

  .route-orbit::before {
    inset: 46px 66px;
  }

  .route-orbit::after {
    inset: 104px 148px;
  }

  .course-ledger.k-enumeration {
    --enum-cols: 1;
    position: relative;
    z-index: 1;
    gap: 0;
    height: 100%;
  }

  .course-ledger.k-enumeration > .it {
    display: grid;
    grid-template-columns: 72px 110px 208px minmax(0, 1fr) 112px;
    align-items: center;
    min-height: 88px;
    padding: 0 var(--sp-4) 0 0;
    border: 0;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    border-left: 1px solid var(--line);
    border-radius: 0;
    background: var(--surface);
    transform: translateX(-24px);
    animation: arrive 420ms ease-out forwards;
  }

  .course-ledger.k-enumeration > .it:nth-child(1) {
    border-top: 1px solid var(--line);
    animation-delay: 260ms;
  }
  .course-ledger.k-enumeration > .it:nth-child(2) { animation-delay: 430ms; }
  .course-ledger.k-enumeration > .it:nth-child(3) { animation-delay: 600ms; }
  .course-ledger.k-enumeration > .it:nth-child(4) { animation-delay: 770ms; }
  .course-ledger.k-enumeration > .it:nth-child(5) { animation-delay: 940ms; }

  .route-node {
    position: relative;
    display: grid;
    place-items: center;
    width: 18px;
    height: 18px;
    margin-left: 39px;
    border: 2px solid var(--primary);
    border-radius: 50%;
    background: var(--bg);
  }

  .route-node::after {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--primary);
    content: "";
  }

  .it.is-current .route-node {
    border-color: var(--accent);
  }

  .it.is-current .route-node::after {
    background: var(--accent);
  }

  .step-no,
  .phase,
  .question,
  .scope {
    align-self: stretch;
    display: flex;
    align-items: center;
  }

  .step-no {
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-variant-numeric: tabular-nums;
  }

  .phase {
    padding-left: var(--sp-5);
    border-left: 1px solid var(--line);
  }

  .course-ledger.k-enumeration > .it > .phase.it-title {
    margin: 0;
  }

  .question {
    min-width: 0;
    color: var(--text-muted);
    font-size: var(--fs-body);
    line-height: var(--lh-body);
  }

  .scope {
    justify-self: stretch;
    justify-content: flex-end;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }

  .it.is-current {
    outline: 1px solid var(--accent);
    outline-offset: -1px;
    background: var(--accent-soft);
  }

  .it.is-current .step-no,
  .it.is-current .phase,
  .it.is-current .scope {
    color: var(--accent);
  }

  .map-destination {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 92px;
    padding: var(--sp-3) 0 0 104px;
  }

  .destination-label {
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
  }

  .destination-label strong {
    display: block;
    color: var(--text);
    font-size: var(--fs-lead);
    line-height: var(--lh-tight);
  }

  .destination-target {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 360px;
    min-height: 64px;
    color: var(--primary);
    font-size: var(--fs-lead);
    font-weight: 650;
    line-height: var(--lh-tight);
    clip-path: inset(0 50% 0 50%);
    animation: close-target 520ms ease-out 1.18s forwards;
  }

  @keyframes draw-route {
    to { transform: scaleY(1); }
  }

  @keyframes arrive {
    to { transform: translateX(0); }
  }

  @keyframes close-target {
    to { clip-path: inset(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .route-line::after,
    .course-ledger.k-enumeration > .it,
    .destination-target {
      animation: none;
      transform: none;
      clip-path: inset(0);
    }
  }
</style>
</head>
<body data-page="02" data-total="50">
<div id="stage">
<main id="main">
  <section class="course-map min0" aria-label="本讲五步课程地图">
    <div class="map-intro min0">
      <p class="lead">这节课不按八颗行星逐一报名字。</p>
      <p class="secondary">我们会依次看清系统的骨架、运动、世界与历史，再把这些规律迁移到新的判断中。</p>
    </div>

    <div class="route-wrap min0">
      <div class="route-line" aria-hidden="true"></div>
      <div class="route-orbit" aria-hidden="true"></div>
      <div class="course-ledger k-enumeration min0" role="list" aria-label="五个阶段">
        <article class="it is-current min0" role="listitem" aria-current="step">
          <span class="route-node" aria-hidden="true"></span>
          <span class="step-no">STEP 01</span>
          <h2 class="phase it-title">骨架</h2>
          <p class="question">东西在哪里，系统怎样分区？</p>
          <span class="scope">STRUCTURE</span>
        </article>
        <article class="it min0" role="listitem">
          <span class="route-node" aria-hidden="true"></span>
          <span class="step-no">STEP 02</span>
          <h2 class="phase it-title">运动</h2>
          <p class="question">引力与速度怎样共同产生轨道？</p>
          <span class="scope">MOTION</span>
        </article>
        <article class="it min0" role="listitem">
          <span class="route-node" aria-hidden="true"></span>
          <span class="step-no">STEP 03</span>
          <h2 class="phase it-title">世界</h2>
          <p class="question">相似起点为何形成不同环境？</p>
          <span class="scope">WORLDS</span>
        </article>
        <article class="it min0" role="listitem">
          <span class="route-node" aria-hidden="true"></span>
          <span class="step-no">STEP 04</span>
          <h2 class="phase it-title">历史</h2>
          <p class="question">碎片和表面保存了什么过去？</p>
          <span class="scope">HISTORY</span>
        </article>
        <article class="it min0" role="listitem">
          <span class="route-node" aria-hidden="true"></span>
          <span class="step-no">STEP 05</span>
          <h2 class="phase it-title">迁移</h2>
          <p class="question">这些规律怎样用于探测与陌生系统？</p>
          <span class="scope">TRANSFER</span>
        </article>
      </div>
    </div>

    <div class="map-destination min0">
      <p class="destination-label">五步共同服务于一个去向<strong>从名单走向解释</strong></p>
      <div class="destination-target target" aria-label="终点：解释未知系统">解释未知系统</div>
    </div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Lec.mount({
    index: 2,
    kicker: "COURSE MAP",
    title: "从骨架到未知系统，我们沿五步推进",
    take: "全课沿骨架、运动、世界、历史、迁移五步推进"
  });
</script>
</body>
</html>
