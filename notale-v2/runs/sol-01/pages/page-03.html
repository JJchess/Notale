<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lec-progress { appearance: none; overflow: visible; }
  .lec-progress::-webkit-progress-inner-element { height: 2px; }
  .lec-progress::-webkit-progress-bar { height: 2px; background: var(--line); }
  .lec-progress::-webkit-progress-value { height: 2px; background: var(--primary); }

  .p03-page {
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
    width: var(--content-w);
    height: var(--content-h);
  }

  .scale-scene {
    position: relative;
    display: flex;
    flex: 0 0 246px;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--surface);
  }

  .system-strip {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    overflow: hidden;
    background: linear-gradient(90deg, var(--surface-data), var(--surface) 28%, var(--surface-data));
  }

  .system-strip + .system-strip {
    border-top: 1px solid var(--line-strong);
    background: linear-gradient(90deg, var(--primary-soft), var(--surface) 38%, var(--surface-data));
  }

  .strip-head {
    position: absolute;
    z-index: 7;
    top: var(--sp-3);
    left: var(--sp-4);
    display: flex;
    align-items: baseline;
    gap: var(--sp-3);
  }

  .strip-head strong {
    color: var(--text);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
  }

  .strip-head span {
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }

  .space-axis {
    position: absolute;
    right: var(--sp-4);
    bottom: 2px;
    left: var(--sp-4);
    width: calc(100% - var(--sp-8));
    height: 88px;
    overflow: visible;
  }

  .space-axis line,
  .space-axis path { vector-effect: non-scaling-stroke; }

  .space-axis .axis-main { stroke: var(--primary); stroke-width: 2; }
  .space-axis .axis-tick { stroke: var(--primary-line); stroke-width: 1; }
  .space-axis .axis-chevron { fill: none; stroke: var(--primary); stroke-width: 2; }

  .body-mark {
    position: absolute;
    z-index: 3;
    bottom: 36px;
    width: var(--d, 22px);
    height: var(--d, 22px);
    min-width: 2px;
    min-height: 2px;
    border: 1px solid var(--primary-line);
    border-radius: 50%;
    background: var(--surface-raised);
    box-shadow: inset calc(var(--d, 22px) * -.24) calc(var(--d, 22px) * -.04) calc(var(--d, 22px) * .22) rgb(7 16 24 / 74%);
    transform: translate(-50%, 50%);
    transform-origin: center;
  }

  .body-mark::after {
    position: absolute;
    inset: 12% 22% 52% 10%;
    border-radius: 50%;
    background: rgb(255 255 255 / 22%);
    content: "";
  }

  .body-mark[data-id="sun"] { background: radial-gradient(circle at 34% 32%, #fff5b5 0 8%, var(--accent) 18%, #d98b31 72%); border-color: var(--accent); }
  .body-mark[data-id="mercury"] { background: radial-gradient(circle at 34% 28%, #c8c1b8, #665f59 72%); }
  .body-mark[data-id="venus"] { background: repeating-linear-gradient(12deg, #d9b671 0 4px, #9e7144 5px 8px); }
  .body-mark[data-id="earth"] { background: radial-gradient(ellipse at 63% 38%, #78b56e 0 15%, transparent 17%), radial-gradient(circle at 38% 54%, #3b8cb7, #173e69 76%); }
  .body-mark[data-id="mars"] { background: radial-gradient(circle at 35% 28%, #d9784c, #7e3328 75%); }
  .body-mark[data-id="jupiter"] { background: repeating-linear-gradient(0deg, #d9b895 0 5px, #9c654e 6px 10px, #eee0c4 11px 15px); }
  .body-mark[data-id="saturn"] { background: repeating-linear-gradient(0deg, #e8d7a7 0 6px, #aa946a 7px 10px); }
  .body-mark[data-id="uranus"] { background: radial-gradient(circle at 35% 30%, #b9edf0, #65aeb9 75%); }
  .body-mark[data-id="neptune"] { background: radial-gradient(circle at 35% 30%, #6d9de9, #244f9a 75%); }

  .body-mark[data-id="saturn"]::before {
    position: absolute;
    top: 45%;
    left: 50%;
    width: 150%;
    height: 30%;
    border: 1px solid var(--text-muted);
    border-radius: 50%;
    transform: translate(-50%, -50%) rotate(-9deg);
    content: "";
  }

  .body-name {
    position: absolute;
    z-index: 5;
    bottom: 5px;
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
    transform: translateX(-50%);
    white-space: nowrap;
  }

  .offscreen-flag {
    position: absolute;
    z-index: 6;
    right: var(--sp-4);
    bottom: 56px;
    display: none;
    padding: var(--sp-1) var(--sp-2);
    border-right: 3px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }

  .offscreen-flag.is-visible { display: block; }

  .scale-control {
    display: grid;
    flex: 0 0 72px;
    grid-template-columns: 190px minmax(0, 1fr) 170px 52px;
    gap: var(--sp-4);
    align-items: center;
    min-width: 0;
    padding: var(--sp-2) var(--sp-4);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--surface-data);
  }

  .scale-control > * { min-width: 0; }

  .control-label {
    color: var(--text);
    font-size: var(--fs-sec);
    font-weight: 650;
    line-height: var(--lh-tight);
  }

  .control-label small {
    display: block;
    margin-top: var(--sp-1);
    color: var(--text-muted);
    font-size: var(--fs-label);
    font-weight: 400;
  }

  .slider-zone { position: relative; padding: 18px 0 14px; }
  #scaleSlider { display: block; min-height: 44px; margin: -12px 0; }

  .snap-labels {
    position: absolute;
    inset: 0 0 auto;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
  }

  .snap-label {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }

  .snap-label::before {
    width: 10px;
    height: 10px;
    border: 2px solid var(--primary);
    border-radius: 50%;
    content: "";
  }

  .snap-label.is-done { color: var(--accent); }
  .snap-label.is-done::before { border-color: var(--accent); background: var(--accent); }
  .snap-label.is-current { color: var(--accent); }

  .scale-readout {
    border-left: 3px solid var(--primary);
    padding-left: var(--sp-3);
  }

  .scale-readout .value {
    display: block;
    color: var(--text);
    font-size: var(--fs-sec);
    font-weight: 650;
    line-height: var(--lh-tight);
  }

  .scale-readout .status {
    display: block;
    margin-top: var(--sp-1);
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }

  .reset-button {
    width: 48px;
    min-width: 48px;
    padding: 0;
    font-family: var(--font-sans);
    font-size: 24px;
  }

  .compare-wrap { flex: 1 1 0; min-height: 0; }

  .p03-compare {
    --compare-cols: 2;
    position: relative;
    grid-template-columns: 174px repeat(2, minmax(0, 1fr));
    grid-template-rows: 44px repeat(4, minmax(54px, 1fr));
    height: 100%;
  }

  .p03-compare > * { padding: var(--sp-2) var(--sp-4); }
  .p03-compare > .hdr { min-height: 44px; font-size: var(--fs-sec); }
  .p03-compare > .dim { font-size: var(--fs-label); }
  .p03-compare > .cell { display: flex; align-items: center; gap: var(--sp-3); font-size: var(--fs-sec); line-height: var(--lh-tight); }
  .p03-compare > .cell:nth-child(6n + 5),
  .p03-compare > .cell:nth-child(6n + 6) { background-color: var(--surface-data); }

  .dimension-guides {
    position: absolute;
    z-index: 0;
    top: 44px;
    right: 0;
    bottom: 0;
    left: 174px;
    width: calc(100% - 174px);
    height: calc(100% - 44px);
    pointer-events: none;
  }

  .dimension-guides line { stroke: var(--primary-line); stroke-width: 1; stroke-dasharray: 5 9; vector-effect: non-scaling-stroke; }
  .p03-compare > .dim,
  .p03-compare > .cell,
  .p03-compare > .hdr { position: relative; z-index: 1; }

  .verdict {
    flex: 0 0 auto;
    min-width: 72px;
    color: var(--text);
    font-weight: 650;
  }

  .verdict.good { color: var(--success); }
  .verdict.warn { color: var(--accent); }

  .link-state {
    flex: 1 1 auto;
    width: 100%;
    height: 42px;
    overflow: visible;
  }

  .link-state line,
  .link-state circle { vector-effect: non-scaling-stroke; }
  .link-state line { stroke: var(--line-strong); stroke-width: 2; }
  .link-state circle { fill: var(--surface); stroke: var(--line-strong); stroke-width: 2; }
  .link-state.is-on line { stroke: var(--accent); stroke-width: 3; }
  .link-state.is-on circle { fill: var(--accent); stroke: var(--accent); }

  .feedback {
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
  }

  .feedback.is-key { color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
  }
</style>
</head>
<body data-page="03" data-total="50">
<div id="stage">
<main id="main">
  <section class="p03-page min0" aria-label="教科书排列与真实同尺太阳系的比较">
    <div class="scale-scene min0" aria-label="上层整齐排列九个天体，下层按同一倍率缩放直径与半长轴距离">
      <div class="system-strip" id="textbookStrip">
        <div class="strip-head"><strong>教科书排列</strong><span>九个成员同时入镜</span></div>
        <svg class="space-axis" viewBox="0 0 1000 88" preserveAspectRatio="none" aria-hidden="true">
          <line class="axis-main" x1="0" y1="62" x2="996" y2="62"></line>
          <path class="axis-chevron" d="M988 54 L998 62 L988 70"></path>
          <g class="axis-tick"><line x1="0" y1="8" x2="0" y2="74"></line><line x1="125" y1="24" x2="125" y2="68"></line><line x1="250" y1="16" x2="250" y2="70"></line><line x1="375" y1="24" x2="375" y2="68"></line><line x1="500" y1="8" x2="500" y2="74"></line><line x1="625" y1="24" x2="625" y2="68"></line><line x1="750" y1="16" x2="750" y2="70"></line><line x1="875" y1="24" x2="875" y2="68"></line></g>
        </svg>
      </div>
      <div class="system-strip" id="trueStrip">
        <div class="strip-head"><strong>真实同尺模型</strong><span id="trueCaption">直径与间距共用一个倍率</span></div>
        <svg class="space-axis" viewBox="0 0 1000 88" preserveAspectRatio="none" aria-hidden="true">
          <line class="axis-main" x1="0" y1="62" x2="996" y2="62"></line>
          <path class="axis-chevron" d="M988 54 L998 62 L988 70"></path>
          <g class="axis-tick"><line x1="0" y1="8" x2="0" y2="74"></line><line x1="125" y1="24" x2="125" y2="68"></line><line x1="250" y1="16" x2="250" y2="70"></line><line x1="375" y1="24" x2="375" y2="68"></line><line x1="500" y1="8" x2="500" y2="74"></line><line x1="625" y1="24" x2="625" y2="68"></line><line x1="750" y1="16" x2="750" y2="70"></line><line x1="875" y1="24" x2="875" y2="68"></line></g>
        </svg>
        <div class="offscreen-flag" id="offscreenFlag">远方行星在画外 →</div>
      </div>
    </div>

    <div class="scale-control min0">
      <label class="control-label" for="scaleSlider">真实比例尺<small>拨到两端，比较同一画幅</small></label>
      <div class="slider-zone min0">
        <div class="snap-labels" aria-hidden="true">
          <span class="snap-label" id="sizeSnap">看清直径</span>
          <span class="snap-label" id="distanceSnap">装下距离</span>
        </div>
        <input id="scaleSlider" type="range" min="0" max="100" value="50" step="1" aria-describedby="scaleFeedback">
      </div>
      <div class="scale-readout" aria-live="polite">
        <span class="value" id="scaleValue">太阳直径 —</span>
        <span class="status" id="progressValue">已验证 0/2</span>
      </div>
      <button class="reset-button" id="resetButton" type="button" title="重置比例尺" aria-label="重置比例尺">↻</button>
    </div>

    <div class="compare-wrap min0">
      <div class="k-comparison p03-compare min0" role="table" aria-label="四个维度比较两种太阳系表征">
        <svg class="dimension-guides" viewBox="0 0 1000 400" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="50" x2="1000" y2="50"></line><line x1="0" y1="150" x2="1000" y2="150"></line><line x1="0" y1="250" x2="1000" y2="250"></line><line x1="0" y1="350" x2="1000" y2="350"></line></svg>
        <div class="hdr" role="columnheader">比较维度</div>
        <div class="hdr" role="columnheader">教科书排列</div>
        <div class="hdr" role="columnheader">真实同尺模型</div>

        <div class="dim" role="rowheader">天体直径</div>
        <div class="cell diff"><span class="verdict warn">不同尺</span><span class="feedback">小行星被放大</span></div>
        <div class="cell"><span class="verdict good">同一尺</span><svg class="link-state" id="diameterLink" viewBox="0 0 320 42" preserveAspectRatio="none" aria-hidden="true"><line x1="9" y1="21" x2="311" y2="21"></line><circle cx="9" cy="21" r="6"></circle><circle cx="311" cy="21" r="6"></circle></svg></div>

        <div class="dim" role="rowheader">太阳—行星间距</div>
        <div class="cell diff"><span class="verdict warn">不同尺</span><span class="feedback">远距离被压缩</span></div>
        <div class="cell"><span class="verdict good">同一尺</span><svg class="link-state" id="distanceLink" viewBox="0 0 320 42" preserveAspectRatio="none" aria-hidden="true"><line x1="9" y1="21" x2="311" y2="21"></line><circle cx="9" cy="21" r="6"></circle><circle cx="311" cy="21" r="6"></circle></svg></div>

        <div class="dim" role="rowheader">当前视口结果</div>
        <div class="cell"><span class="verdict">全入镜</span><span class="feedback">每颗都清楚</span></div>
        <div class="cell"><span class="verdict" id="viewportVerdict">两端之间</span><span class="feedback" id="viewportText">大小与距离都不完整</span></div>

        <div class="dim" role="rowheader">被牺牲的信息</div>
        <div class="cell diff is-key"><span class="verdict warn">真实比例</span><span class="feedback">大小被放大，间距被压缩</span></div>
        <div class="cell diff" id="tradeoffCell"><span class="verdict warn" id="tradeoffVerdict">两者皆损</span><span class="feedback" id="scaleFeedback">距离和直径必须使用同一个缩放倍率</span></div>
      </div>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 3,
  kicker: "SCALE CHECK",
  title: "这排得整整齐齐的太阳系，牺牲了什么？",
  take: "教科书式排列能让成员同时入镜，却同时放大了行星、压缩了间距；真实比例下，看清大小与看全距离无法在同一画幅兼得。"
});

(function () {
  var planets = Lec.K.PLANETS;
  var bodies = [Lec.K.SUN].concat(planets);
  var textbookStrip = document.getElementById('textbookStrip');
  var trueStrip = document.getElementById('trueStrip');
  var slider = document.getElementById('scaleSlider');
  var resetButton = document.getElementById('resetButton');
  var scaleValue = document.getElementById('scaleValue');
  var progressValue = document.getElementById('progressValue');
  var sizeSnap = document.getElementById('sizeSnap');
  var distanceSnap = document.getElementById('distanceSnap');
  var diameterLink = document.getElementById('diameterLink');
  var distanceLink = document.getElementById('distanceLink');
  var offscreenFlag = document.getElementById('offscreenFlag');
  var viewportVerdict = document.getElementById('viewportVerdict');
  var viewportText = document.getElementById('viewportText');
  var tradeoffVerdict = document.getElementById('tradeoffVerdict');
  var scaleFeedback = document.getElementById('scaleFeedback');
  var trueMarks = [];
  var completed = { size: false, distance: false };
  var reduced = Deck.reduced();
  var sunDiameterKm = Lec.K.SUN.radiusKm * 2;
  var neptune = planets[planets.length - 1];
  var neptuneDistanceKm = Lec.P.auToKm(neptune.semimajorAU);
  var sceneWidth = 1374;
  var axisStart = 38;
  var axisSpan = sceneWidth - 76;
  var distanceSunPx = axisSpan / (neptuneDistanceKm / sunDiameterKm);
  var sizeSunPx = 70;

  function createMark(body, strip, left, diameter, isTrue) {
    var mark = document.createElement('span');
    var label = document.createElement('span');
    mark.className = 'body-mark';
    mark.dataset.id = body.id;
    mark.setAttribute('title', body.name + '全圆盘表面纹理示意；几何尺寸由 Lec 数据计算');
    mark.style.left = left + 'px';
    mark.style.setProperty('--d', diameter + 'px');
    label.className = 'body-name';
    label.textContent = body.name;
    label.style.left = left + 'px';
    strip.appendChild(mark);
    strip.appendChild(label);
    if (isTrue) trueMarks.push({ body: body, mark: mark, label: label });
  }

  bodies.forEach(function (body, index) {
    var left = axisStart + index * (axisSpan / (bodies.length - 1));
    var diameter = body.id === 'sun' ? 58 : 14 + Math.sqrt(Lec.P.planetDiameterKm(body) / Lec.P.planetDiameterKm(planets[0])) * 5.2;
    diameter = Math.min(diameter, 44);
    createMark(body, textbookStrip, left, diameter, false);
    createMark(body, trueStrip, axisStart, 2, true);
  });

  function sunScaleAt(value) {
    var t = value / 100;
    return distanceSunPx * Math.pow(sizeSunPx / distanceSunPx, t);
  }

  function formatScale(sunPx) {
    var kmPerPx = Lec.P.scaleValue(sunDiameterKm, sunPx, 1);
    var shown = Lec.P.significant(kmPerPx, 3);
    return '1 px = ' + shown.toLocaleString('zh-CN') + ' km';
  }

  function update(value) {
    var sunPx = sunScaleAt(value);
    var farthestLeft = axisStart;
    trueMarks.forEach(function (item) {
      var scaled;
      var diameter;
      var left;
      if (item.body.id === 'sun') {
        diameter = sunPx;
        left = axisStart;
      } else {
        scaled = Lec.P.scaleSolarSystem(sunPx, item.body);
        diameter = scaled.bodyDiameter;
        left = axisStart + scaled.distanceFromSun;
      }
      farthestLeft = Math.max(farthestLeft, left);
      item.mark.style.setProperty('--d', Math.max(2, diameter) + 'px');
      if (left < sceneWidth - 12) {
        item.mark.style.display = 'block';
        item.mark.style.left = left + 'px';
      } else {
        item.mark.style.display = 'none';
      }
      if (left < sceneWidth - 22 && diameter >= 8) {
        item.label.style.display = 'block';
        item.label.style.left = left + 'px';
      } else {
        item.label.style.display = 'none';
      }
    });

    scaleValue.textContent = formatScale(sunPx);
    offscreenFlag.classList.toggle('is-visible', farthestLeft >= sceneWidth - 12);

    if (value <= 5) {
      viewportVerdict.textContent = '距离入镜';
      viewportText.textContent = '海王星轨道到达视口右端';
      tradeoffVerdict.textContent = '行星直径';
      scaleFeedback.textContent = '行星缩成近乎不可见的点';
    } else if (value >= 95) {
      viewportVerdict.textContent = '直径可见';
      viewportText.textContent = '远方成员全部越出画面';
      tradeoffVerdict.textContent = '行星间距';
      scaleFeedback.textContent = '保留大小，便无法装下距离';
    } else {
      viewportVerdict.textContent = '两端之间';
      viewportText.textContent = '大小与距离都不完整';
      tradeoffVerdict.textContent = '两者皆损';
      scaleFeedback.textContent = '距离和直径必须使用同一个缩放倍率';
    }
  }

  function refreshProgress() {
    var count = Number(completed.size) + Number(completed.distance);
    progressValue.textContent = '已验证 ' + count + '/2';
    sizeSnap.classList.toggle('is-done', completed.size);
    distanceSnap.classList.toggle('is-done', completed.distance);
    diameterLink.classList.toggle('is-on', completed.size);
    distanceLink.classList.toggle('is-on', completed.distance);
  }

  function verify(kind) {
    completed[kind] = true;
    refreshProgress();
    var target = kind === 'size' ? sizeSnap : distanceSnap;
    if (!reduced) gsap.fromTo(target, { scale: 1 }, { scale: 1.08, duration: 0.18, repeat: 1, yoyo: true, ease: 'power1.out', overwrite: true });
  }

  function settle() {
    var value = Number(slider.value);
    if (value <= 10) {
      slider.value = 0;
      update(0);
      verify('distance');
    } else if (value >= 90) {
      slider.value = 100;
      update(100);
      verify('size');
    } else if (!reduced) {
      gsap.fromTo(scaleValue, { x: -7 }, { x: 7, duration: 0.08, repeat: 3, yoyo: true, ease: 'none', clearProps: 'transform' });
      gsap.to(slider, { value: 50, duration: 0.34, ease: 'back.out(1.8)', onUpdate: function () { update(Number(slider.value)); } });
    }
  }

  slider.addEventListener('input', function () { update(Number(slider.value)); });
  slider.addEventListener('change', settle);
  slider.addEventListener('keyup', function (event) {
    if (event.key === 'Home' || event.key === 'End') settle();
  });

  resetButton.addEventListener('click', function () {
    completed.size = false;
    completed.distance = false;
    slider.value = 50;
    update(50);
    refreshProgress();
  });

  update(50);
  refreshProgress();

  if (!reduced) {
    gsap.from('.body-mark', { autoAlpha: 0, y: -10, duration: 0.32, stagger: 0.025, ease: 'power1.out' });
    gsap.from('.space-axis', { scaleX: 0, transformOrigin: 'left center', duration: 0.55, ease: 'power2.out' });
    gsap.from('.scale-control', { autoAlpha: 0, y: 8, duration: 0.3, delay: 0.35, ease: 'power1.out' });
  }
}());
</script>
</body>
</html>
