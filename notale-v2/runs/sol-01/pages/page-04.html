<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main { overflow: hidden; }
  .lec-progress::before { display: none; }
  .lec-progress > * { box-sizing: border-box; max-height: 2px; }
  .journey {
    position: relative;
    width: var(--content-w);
    height: var(--content-h);
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--surface-data);
  }
  .space-view { position: absolute; inset: 0; overflow: hidden; }
  .space-view canvas { display: block; }
  .space-shade {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(90deg, rgb(7 16 24 / 88%) 0, transparent 24%, transparent 76%, rgb(7 16 24 / 82%) 100%);
  }
  .scale-spine {
    --process-line-y: 0;
    position: absolute;
    z-index: 4;
    top: var(--sp-5);
    bottom: 92px;
    left: var(--sp-5);
    width: 238px;
    flex-direction: column;
    gap: 0;
    padding-left: var(--sp-4);
    cursor: pointer;
  }
  .scale-spine > .axis {
    top: var(--sp-4);
    right: auto;
    bottom: var(--sp-4);
    left: 4px;
    width: 2px;
    height: auto;
    transform: none;
  }
  .scale-spine > .step {
    display: flex;
    flex: 1 1 0;
    align-items: center;
    width: 100%;
    min-height: 0;
    padding: 0 var(--sp-3) 0 var(--sp-5);
    border: 0;
    border-radius: 0;
    background: transparent;
    color: var(--text-dim);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }
  .scale-spine > .step::before {
    top: 50%;
    left: -16px;
    transform: translateY(-50%);
  }
  .scale-spine > .step.is-done { filter: none; color: var(--primary); }
  .scale-spine > .step.is-current {
    border: 0;
    background: linear-gradient(90deg, var(--accent-soft), transparent);
    color: var(--accent);
  }
  .scale-spine > .arw {
    position: absolute;
    left: -5px;
    width: 20px;
    height: 16px;
    color: var(--primary);
    font-size: var(--fs-sec);
    transform: rotate(90deg);
  }
  .scale-spine > .arw:nth-of-type(3) { top: calc(16.667% - 8px); }
  .scale-spine > .arw:nth-of-type(5) { top: calc(33.333% - 8px); }
  .scale-spine > .arw:nth-of-type(7) { top: calc(50% - 8px); }
  .scale-spine > .arw:nth-of-type(9) { top: calc(66.667% - 8px); }
  .scale-spine > .arw:nth-of-type(11) { top: calc(83.333% - 8px); }
  .scale-spine:focus-visible { outline: 2px solid var(--focus); outline-offset: var(--sp-2); }
  .scale-spine.is-denied .step.denied { color: var(--danger); }
  .progress-read {
    position: absolute;
    z-index: 5;
    top: var(--sp-5);
    left: 286px;
    padding: var(--sp-2) var(--sp-3);
    border-left: 3px solid var(--accent);
    background: rgb(7 16 24 / 78%);
    color: var(--accent);
    font-size: var(--fs-sec);
    font-weight: 650;
  }
  .target-frame {
    position: absolute;
    z-index: 3;
    top: 76px;
    right: 296px;
    bottom: 112px;
    left: 286px;
    border-color: var(--primary-line);
    pointer-events: none;
  }
  .scene-caption {
    position: absolute;
    z-index: 5;
    top: var(--sp-5);
    right: 92px;
    min-width: 230px;
    text-align: right;
  }
  .scene-caption .label { display: block; margin-bottom: var(--sp-1); }
  .scene-caption strong { color: var(--accent); font-size: var(--fs-h2); line-height: var(--lh-tight); }
  .planet-labels { position: absolute; z-index: 4; inset: 0; pointer-events: none; }
  .planet-tag {
    position: absolute;
    display: none;
    min-width: 18px;
    padding: 2px var(--sp-2);
    border-left: 2px solid var(--primary);
    background: rgb(7 16 24 / 76%);
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
    white-space: nowrap;
  }
  .zoom-control {
    position: absolute;
    z-index: 6;
    top: 88px;
    right: var(--sp-5);
    bottom: 116px;
    width: 54px;
    align-items: center;
    justify-content: center;
    padding: var(--sp-2) 0;
    background: rgb(7 16 24 / 72%);
  }
  .zoom-control input {
    width: 350px;
    height: 44px;
    margin: 0;
    transform: rotate(90deg);
  }
  .zoom-control .near,
  .zoom-control .far {
    position: absolute;
    right: 62px;
    width: 80px;
    text-align: right;
  }
  .zoom-control .near { top: 0; }
  .zoom-control .far { bottom: 0; }
  .telemetry-bar {
    position: absolute;
    z-index: 7;
    right: 0;
    bottom: 0;
    left: 0;
    display: flex;
    align-items: center;
    min-height: 84px;
    gap: var(--sp-6);
    padding: var(--sp-3) var(--sp-5);
    border-top: 1px solid var(--line);
    background: rgb(11 21 29 / 94%);
  }
  .telemetry-item { min-width: 150px; }
  .telemetry-item .label { display: block; margin-bottom: var(--sp-1); }
  .telemetry-item .value { font-size: var(--fs-sec); }
  .instruction { flex: 1 1 0; color: var(--text-muted); font-size: var(--fs-sec); line-height: var(--lh-body); }
  .conclusion {
    display: none;
    flex: 1 1 0;
    color: var(--accent);
    font-size: var(--fs-lead);
    font-weight: 650;
    line-height: var(--lh-body);
  }
  .reset-btn { display: none; width: 44px; min-width: 44px; padding: 0; font-size: var(--fs-h2); }
  .reset-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .scene-caption, .planet-tag { transition: none; }
  }
</style>
</head>
<body data-page="04" data-total="50">
<div id="stage">
<main id="main">
  <section class="journey min0" aria-label="从太阳表面连续后退到海王星轨道的尺度镜头">
    <div id="spaceView" class="space-view no-pan min0" aria-hidden="true"></div>
    <div class="space-shade"></div>

    <div id="scaleSpine" class="k-process scale-spine" role="group" tabindex="0" aria-label="六层连续尺度；使用方向键控制镜头">
      <div class="axis"></div>
      <div class="step is-current" aria-current="step"><span>01　太阳表面</span></div><div class="arw"></div>
      <div class="step"><span>02　太阳全貌</span></div><div class="arw"></div>
      <div class="step"><span>03　太阳近邻轨道</span></div><div class="arw"></div>
      <div class="step"><span>04　岩石行星轨道范围</span></div><div class="arw"></div>
      <div class="step"><span>05　巨行星轨道范围</span></div><div class="arw"></div>
      <div class="step"><span>06　海王星轨道全景</span></div>
    </div>

    <div id="progressRead" class="progress-read" aria-live="polite">已抵达 1 / 6 层</div>
    <div class="target target-frame"></div>
    <div class="scene-caption">
      <span class="label">当前尺度</span>
      <strong id="sceneName">太阳表面</strong>
    </div>
    <div id="planetLabels" class="planet-labels"></div>

    <div class="ctl zoom-control">
      <span class="label near">近</span>
      <input id="zoomRange" type="range" min="0" max="1000" value="0" step="1" aria-label="镜头后退尺度" aria-valuetext="太阳表面，第 1 层">
      <span class="label far">远</span>
    </div>

    <div class="telemetry telemetry-bar">
      <div class="telemetry-item">
        <span class="label">镜头视域</span>
        <span id="viewValue" class="value is-current">太阳半径量级</span>
      </div>
      <div class="telemetry-item">
        <span class="label">目标边界</span>
        <span id="targetValue" class="value">太阳表面</span>
      </div>
      <div class="telemetry-item">
        <span class="label">缩放方式</span>
        <span class="value">对数连续</span>
      </div>
      <p id="instruction" class="instruction">拖动右侧缩放杆，或在场景中滚轮后退。每一层都来自同一组真实距离。</p>
      <p id="conclusion" class="conclusion">从太阳表面退到海王星轨道，不只是“拉远一点”，而是连续跨越多个尺度层级。</p>
      <button id="resetBtn" class="reset-btn" type="button" title="回到太阳表面" aria-label="回到太阳表面">↺</button>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/three.min.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 4,
  kicker: "SCALE JOURNEY · 04",
  title: "退后，直到看见海王星轨道",
  take: "从太阳表面退到海王星轨道，不只是“拉远一点”，而是连续跨越多个尺度层级。"
});

(function () {
  var host = document.getElementById('spaceView');
  var range = document.getElementById('zoomRange');
  var spine = document.getElementById('scaleSpine');
  var steps = Array.prototype.slice.call(spine.querySelectorAll('.step'));
  var sceneName = document.getElementById('sceneName');
  var progressRead = document.getElementById('progressRead');
  var viewValue = document.getElementById('viewValue');
  var targetValue = document.getElementById('targetValue');
  var conclusion = document.getElementById('conclusion');
  var instruction = document.getElementById('instruction');
  var resetBtn = document.getElementById('resetBtn');
  var labelLayer = document.getElementById('planetLabels');
  var reduced = Deck.reduced();

  var sunDiameterKm = Lec.K.SUN.radiusKm * 2;
  var planets = Lec.K.PLANETS;
  var neptune = planets[planets.length - 1];
  var neptuneKm = Lec.P.auToKm(neptune.semimajorAU);
  var orbitRadii = planets.map(function (planet) {
    return Lec.P.scaleValue(Lec.P.auToKm(planet.semimajorAU), Lec.K.SUN.radiusKm, 1);
  });
  var anchors = [0, 0.12, 0.29, 0.47, 0.72, 1];
  var cameraDistances = [1.18, 3.2, orbitRadii[0] * 1.45, orbitRadii[3] * 1.25, orbitRadii[5] * 1.22, orbitRadii[7] * 1.28];
  var names = ['太阳表面', '太阳全貌', '太阳近邻轨道', '岩石行星轨道范围', '巨行星轨道范围', '海王星轨道全景'];
  var targets = ['太阳表面', '完整日轮', '水星轨道', '火星轨道', '土星轨道', '海王星轨道'];
  var unlocked = reduced ? 5 : 0;
  var state = { progress: reduced ? 1 : 0 };
  var activeTween = null;
  var lastStep = -1;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(Deck.token('--bg'));
  var camera = new THREE.PerspectiveCamera(48, 1, 0.01, 100);
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.domElement.className = 'cv-fill';
  host.appendChild(renderer.domElement);

  var sun = new THREE.Mesh(
    new THREE.SphereGeometry(1, 64, 40),
    new THREE.MeshBasicMaterial({ color: 0xffc857 })
  );
  scene.add(sun);
  var glow = new THREE.Mesh(
    new THREE.SphereGeometry(1.035, 48, 32),
    new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.18, side: THREE.BackSide })
  );
  scene.add(glow);

  var orbitMaterials = [];
  var planetMeshes = [];
  var labels = [];
  planets.forEach(function (planet, index) {
    var curve = new THREE.EllipseCurve(0, 0, orbitRadii[index], orbitRadii[index], 0, Math.PI * 2, false, 0);
    var points = curve.getPoints(192).map(function (point) { return new THREE.Vector3(point.x, 0, point.y); });
    var geometry = new THREE.BufferGeometry().setFromPoints(points);
    var material = new THREE.LineBasicMaterial({ color: 0x4fc3d7, transparent: true, opacity: index < 4 ? 0.62 : 0.42 });
    orbitMaterials.push(material);
    scene.add(new THREE.LineLoop(geometry, material));

    var trueRadius = Lec.P.scaleValue(Lec.P.planetDiameterKm(planet) / 2, Lec.K.SUN.radiusKm, 1);
    var mesh = new THREE.Mesh(
      new THREE.SphereGeometry(Math.max(trueRadius, 0.002), 12, 8),
      new THREE.MeshBasicMaterial({ color: index === 2 ? 0x78d6a5 : 0xa9bac3 })
    );
    var angle = 0.5 + index * 0.72;
    mesh.position.set(Math.cos(angle) * orbitRadii[index], 0, Math.sin(angle) * orbitRadii[index]);
    planetMeshes.push(mesh);
    scene.add(mesh);

    var tag = document.createElement('span');
    tag.className = 'planet-tag';
    tag.textContent = planet.name + '定位';
    labelLayer.appendChild(tag);
    labels.push(tag);
  });

  function currentStep(progress) {
    var found = 0;
    anchors.forEach(function (anchor, index) { if (progress >= anchor - 0.025) found = index; });
    return found;
  }

  function distanceAt(progress) {
    var start = 0;
    while (start < anchors.length - 2 && progress > anchors[start + 1]) start += 1;
    var local = Deck.clamp((progress - anchors[start]) / (anchors[start + 1] - anchors[start]), 0, 1);
    return Math.exp(Deck.lerp(Math.log(cameraDistances[start]), Math.log(cameraDistances[start + 1]), local));
  }

  function formatView(distance, step) {
    var radiusKm = distance * Lec.K.SUN.radiusKm;
    if (step < 2) return Lec.P.significant(radiusKm, 3).toLocaleString('zh-CN') + ' km';
    var au = radiusKm / Lec.K.UNITS.KM_PER_AU;
    return Lec.P.significant(au, 3) + ' AU';
  }

  function updateLabels(step) {
    labels.forEach(function (tag, index) {
      var shouldShow = (step >= 2 && index === 0) || (step >= 3 && index < 4) || (step >= 4 && index < 6) || step >= 5;
      if (!shouldShow) { tag.style.display = 'none'; return; }
      var vector = planetMeshes[index].position.clone().project(camera);
      var x = (vector.x * 0.5 + 0.5) * host.clientWidth;
      var y = (-vector.y * 0.5 + 0.5) * host.clientHeight;
      if (x < 270 || x > host.clientWidth - 170 || y < 68 || y > host.clientHeight - 106 || vector.z > 1) {
        tag.style.display = 'none';
      } else {
        tag.style.display = 'block';
        tag.style.transform = 'translate(' + Math.round(x + 8) + 'px,' + Math.round(y - 10) + 'px)';
      }
    });
  }

  function render() {
    var step = currentStep(state.progress);
    var distance = distanceAt(state.progress);
    camera.position.set(distance * 0.18, distance * 0.48, distance);
    camera.near = Math.max(0.005, distance / 100000);
    camera.far = Math.max(100, distance * 2.5);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    updateLabels(step);

    range.value = Math.round(state.progress * 1000);
    range.setAttribute('aria-valuetext', names[step] + '，第 ' + (step + 1) + ' 层');
    sceneName.textContent = names[step];
    progressRead.textContent = '已抵达 ' + (Math.max(unlocked, step) + 1) + ' / 6 层';
    viewValue.textContent = formatView(distance, step);
    targetValue.textContent = targets[step];

    steps.forEach(function (item, index) {
      item.classList.toggle('is-done', index < step);
      item.classList.toggle('is-current', index === step);
      if (index === step) item.setAttribute('aria-current', 'step');
      else item.removeAttribute('aria-current');
    });

    if (step !== lastStep) {
      lastStep = step;
      unlocked = Math.max(unlocked, step);
      orbitMaterials.forEach(function (material, index) {
        var relevant = (step === 2 && index === 0) || (step === 3 && index < 4) || (step === 4 && index < 6) || (step === 5 && index === 7);
        material.color.setHex(relevant ? 0xffd166 : 0x4fc3d7);
        material.opacity = relevant ? 0.92 : (index < 4 ? 0.62 : 0.42);
      });
      if (!reduced) gsap.fromTo(sceneName, { autoAlpha: 0, y: -8 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power2.out', overwrite: true });
    }

    var done = step === 5 && state.progress > 0.985;
    conclusion.style.display = done ? 'block' : 'none';
    instruction.style.display = done ? 'none' : 'block';
    resetBtn.style.display = done ? 'inline-flex' : 'none';
  }

  function resize() {
    var width = host.clientWidth;
    var height = host.clientHeight;
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    render();
  }

  function setProgress(value, smooth) {
    value = Deck.clamp(value, 0, 1);
    if (activeTween) activeTween.kill();
    if (smooth && !reduced) {
      activeTween = gsap.to(state, { progress: value, duration: 0.42, ease: 'power2.out', overwrite: true, onUpdate: render });
    } else {
      state.progress = value;
      render();
    }
  }

  range.addEventListener('input', function () { setProgress(Number(range.value) / 1000, false); });
  host.addEventListener('wheel', function (event) {
    event.preventDefault();
    setProgress(state.progress + Math.sign(event.deltaY) * 0.035, false);
  }, { passive: false });

  var pinchDistance = null;
  host.addEventListener('touchstart', function (event) {
    if (event.touches.length === 2) pinchDistance = Math.hypot(event.touches[0].clientX - event.touches[1].clientX, event.touches[0].clientY - event.touches[1].clientY);
  }, { passive: true });
  host.addEventListener('touchmove', function (event) {
    if (event.touches.length !== 2 || pinchDistance === null) return;
    var next = Math.hypot(event.touches[0].clientX - event.touches[1].clientX, event.touches[0].clientY - event.touches[1].clientY);
    setProgress(state.progress + (pinchDistance - next) / 700, false);
    pinchDistance = next;
  }, { passive: true });
  host.addEventListener('touchend', function () { pinchDistance = null; }, { passive: true });

  spine.addEventListener('click', function (event) {
    var rect = spine.getBoundingClientRect();
    var index = Deck.clamp(Math.floor((event.clientY - rect.top) / rect.height * 6), 0, 5);
    if (index <= unlocked + 1) setProgress(anchors[index], true);
    else {
      var denied = steps[index];
      denied.classList.add('denied');
      spine.classList.add('is-denied');
      gsap.fromTo(denied, { x: -5 }, { x: 5, duration: 0.08, repeat: 3, yoyo: true, ease: 'none', onComplete: function () { denied.classList.remove('denied'); spine.classList.remove('is-denied'); gsap.set(denied, { clearProps: 'transform' }); } });
    }
  });
  spine.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowDown' || event.key === 'ArrowRight') { event.preventDefault(); setProgress(state.progress + 0.03, false); }
    if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') { event.preventDefault(); setProgress(state.progress - 0.03, false); }
    if (event.key === 'Home') { event.preventDefault(); setProgress(0, true); }
    if (event.key === 'End') { event.preventDefault(); setProgress(1, true); }
  });
  resetBtn.addEventListener('click', function () { unlocked = 0; setProgress(0, true); });

  Deck.onResize(resize);
  resize();
  if (!reduced) {
    gsap.from(steps, { autoAlpha: 0, x: -10, duration: 0.35, stagger: 0.06, ease: 'power2.out' });
    gsap.from('.target-frame', { autoAlpha: 0, duration: 0.5, delay: 0.15 });
  } else {
    setProgress(1, false);
  }
})();
</script>
</body>
</html>
