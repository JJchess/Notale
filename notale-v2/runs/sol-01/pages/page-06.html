<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .mass-page {
    position: relative;
    overflow: hidden;
  }

  .lec-progress {
    overflow: visible;
    appearance: none;
  }

  .mass-page::before {
    position: absolute;
    inset: 78px 116px 74px 276px;
    border: 1px solid var(--primary-line);
    border-radius: 50%;
    opacity: .28;
    content: "";
    pointer-events: none;
  }

  .mass-compare {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    grid-template-rows: 60px 390px 50px 50px 70px;
  }

  .mass-compare > * {
    padding: var(--sp-3) var(--sp-4);
  }

  .mass-compare > .hdr {
    min-height: 0;
    align-items: center;
  }

  .corner-label {
    color: var(--text-dim);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: var(--lh-tight);
  }

  .object-head {
    gap: var(--sp-3);
  }

  .head-disc {
    width: 30px;
    height: 30px;
    flex: 0 0 30px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 18px var(--accent-soft);
  }

  .planet-strip {
    display: flex;
    align-items: center;
    gap: var(--sp-1);
  }

  .planet-strip i {
    display: block;
    width: 8px;
    height: 8px;
    border: 1px solid var(--primary);
    border-radius: 50%;
    background: var(--surface-raised);
  }

  .mass-scene {
    grid-column: 2 / -1;
    position: relative;
    min-width: 0;
    overflow: hidden;
    padding: 0 !important;
    background: var(--surface-data);
  }

  .mass-canvas {
    z-index: 2;
    pointer-events: none;
  }

  .warehouse {
    position: absolute;
    z-index: 1;
    top: 142px;
    bottom: 62px;
    border: 2px solid var(--primary-line);
    border-top-color: transparent;
    background: var(--surface);
    pointer-events: none;
  }

  .warehouse-label {
    position: absolute;
    top: var(--sp-2);
    left: var(--sp-3);
    color: var(--text-muted);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: var(--lh-tight);
  }

  .warehouse::after {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    height: 5px;
    background: var(--primary-line);
    content: "";
  }

  .warehouse-sun {
    left: 38px;
    width: calc(64.8% - 38px);
    border-color: rgb(255 209 102 / 48%);
    border-top-color: transparent;
    background: var(--surface-raised);
  }

  .warehouse-sun::after {
    background: rgb(255 209 102 / 48%);
  }

  .warehouse-other {
    right: 38px;
    left: 66.2%;
  }

  .scene-topline {
    position: absolute;
    z-index: 3;
    top: var(--sp-3);
    right: var(--sp-4);
    left: var(--sp-4);
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
  }

  .allocation-status {
    display: flex;
    gap: var(--sp-5);
    padding: var(--sp-2) var(--sp-3);
    border-left: 3px solid var(--primary);
    background: var(--surface);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
  }

  .allocation-status strong {
    color: var(--text);
    font-family: var(--font-mono);
    font-weight: 650;
  }

  .scene-hint {
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
  }

  .scene-readouts {
    position: absolute;
    z-index: 3;
    right: 52px;
    bottom: 65px;
    left: 52px;
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
    gap: 46px;
    pointer-events: none;
  }

  .shared-scale {
    position: absolute;
    z-index: 3;
    top: 94px;
    right: 52px;
    left: 52px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    border-top: 1px solid var(--primary-line);
    pointer-events: none;
  }

  .shared-scale span {
    position: relative;
    padding-top: var(--sp-2);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-tick);
    line-height: var(--lh-tight);
    text-align: center;
  }

  .shared-scale span::before {
    position: absolute;
    top: -5px;
    left: 50%;
    width: 1px;
    height: 9px;
    background: var(--primary-line);
    content: "";
  }

  .scale-caption {
    position: absolute;
    z-index: 3;
    top: 122px;
    left: 52px;
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
    pointer-events: none;
  }

  .bin-readout {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    min-width: 0;
    padding: var(--sp-2) var(--sp-3);
    border-top: 2px solid var(--primary-line);
    background: rgb(7 16 24 / 82%);
  }

  .bin-readout .name {
    color: var(--text-muted);
    font-size: var(--fs-label);
    font-weight: 650;
  }

  .bin-readout .value {
    color: var(--text);
    font-size: var(--fs-body);
    font-weight: 650;
  }

  .scene-control {
    position: absolute;
    z-index: 4;
    right: 52px;
    bottom: 12px;
    left: 52px;
    display: grid;
    grid-template-columns: 126px minmax(0, 1fr) 48px;
    gap: var(--sp-3);
    align-items: center;
    min-width: 0;
  }

  .scene-control label {
    color: var(--text);
    font-size: var(--fs-label);
    font-weight: 650;
  }

  #splitter {
    min-height: 44px;
    cursor: ew-resize;
  }

  .reset-button {
    width: 48px;
    min-width: 48px;
    padding: 0;
    font-size: var(--fs-h2);
  }

  .reset-button span {
    line-height: 1;
  }

  .feedback {
    position: absolute;
    z-index: 5;
    top: 52px;
    left: 50%;
    width: max-content;
    max-width: 660px;
    padding: var(--sp-2) var(--sp-4);
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--text);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
    opacity: 0;
    transform: translate(-50%, 8px);
    transition: opacity 220ms ease-out, transform 220ms ease-out;
    pointer-events: none;
  }

  .feedback.is-visible {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .feedback.is-error {
    border-color: var(--danger);
  }

  .feedback.is-success {
    border-color: var(--accent);
    color: var(--accent);
  }

  .mass-compare > .dim {
    justify-content: flex-end;
  }

  .mass-compare > .cell {
    display: flex;
    align-items: center;
    min-width: 0;
  }

  .metric-value {
    color: var(--text);
    font-family: var(--font-mono);
    font-size: var(--fs-lead);
    font-weight: 650;
  }

  .metric-detail {
    margin-left: var(--sp-3);
    color: var(--text-muted);
    font-size: var(--fs-sec);
  }

  .share-cell {
    display: grid !important;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: var(--sp-3);
  }

  .share-bar {
    position: relative;
    height: 20px;
    overflow: hidden;
    border: 1px solid var(--primary-line);
    background: var(--surface-data);
  }

  .share-bar::before {
    position: absolute;
    inset: 0 auto 0 0;
    width: var(--share);
    background: var(--primary);
    content: "";
  }

  .sun-share .share-bar::before {
    background: var(--accent);
  }

  .member-cell {
    gap: var(--sp-4);
  }

  .member-cell .planet-strip {
    gap: var(--sp-2);
  }

  .member-cell .planet-strip i {
    width: 14px;
    height: 14px;
  }

  .judgment {
    align-items: flex-start !important;
    font-size: var(--fs-sec) !important;
    line-height: var(--lh-body) !important;
  }

  .judgment strong {
    color: var(--text);
    font-weight: 650;
  }

  .judgment.is-key {
    border-color: var(--accent);
  }

  .mass-page.is-correct .sun-head,
  .mass-page.is-correct .sun-cell {
    animation: sun-confirm 700ms ease-out 1;
  }

  .mass-page.is-error .mass-scene {
    animation: bin-recoil 260ms ease-out 1;
  }

  @keyframes sun-confirm {
    0%, 100% { box-shadow: none; }
    40% { box-shadow: inset 0 0 0 2px var(--accent); }
  }

  @keyframes bin-recoil {
    0%, 100% { transform: translateX(0); }
    30% { transform: translateX(5px); }
    65% { transform: translateX(-4px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .mass-page *,
    .mass-page *::before,
    .mass-page *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body data-page="06" data-total="50">
<div id="stage">
<main id="main">
  <section class="page mass-page min0" id="massPage" aria-label="太阳与其余成员的质量比较">
    <div class="k-comparison mass-compare min0" style="--compare-cols:2">
      <div class="corner-label">同一质量口径</div>
      <div class="hdr object-head sun-head row items-center min0"><span class="head-disc" aria-hidden="true"></span><span>太阳</span></div>
      <div class="hdr object-head row items-center min0"><span class="planet-strip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span>其余成员合计</span></div>

      <div class="dim">质量筹码</div>
      <div class="cell mass-scene no-pan min0" id="massScene">
        <canvas id="massCanvas" class="cv-fill mass-canvas" aria-hidden="true"></canvas>
        <div class="warehouse warehouse-sun" aria-hidden="true"><span class="warehouse-label">太阳质量仓</span></div>
        <div class="warehouse warehouse-other" aria-hidden="true"><span class="warehouse-label">其余质量仓</span></div>
        <div class="scene-topline">
          <div class="allocation-status"><span>已分配 <strong id="allocated">1000 / 1000</strong></span><span>未落定 <strong id="unsettled">1000</strong></span></div>
          <span class="scene-hint">拖动挡板，按质量分配一千份</span>
        </div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
        <div class="shared-scale measure" aria-label="共同质量基准尺"><span>0</span><span>250</span><span>500</span><span>750</span><span>1000</span></div>
        <span class="scale-caption">每枚筹码 = 总质量的千分之一</span>
        <div class="scene-readouts">
          <div class="bin-readout"><span class="name">太阳仓</span><span class="value" id="sunTokens">500 份</span></div>
          <div class="bin-readout"><span class="name">其余仓</span><span class="value" id="otherTokens">500 份</span></div>
        </div>
        <div class="scene-control ctl">
          <label for="splitter">太阳应得份数</label>
          <input id="splitter" type="range" min="0" max="1000" step="1" value="500" aria-label="太阳应得的千分位质量筹码">
          <button class="reset-button" id="resetButton" type="button" title="重置质量筹码" aria-label="重置质量筹码"><span aria-hidden="true">↻</span></button>
        </div>
      </div>

      <div class="dim">精确质量份额</div>
      <div class="cell diff share-cell sun-share sun-cell"><span class="share-bar" id="sunShareBar" aria-hidden="true"></span><span class="metric-value" id="sunExact">待校准</span></div>
      <div class="cell diff share-cell"><span class="share-bar" id="otherShareBar" aria-hidden="true"></span><span class="metric-value" id="otherExact">待校准</span></div>

      <div class="dim">所含成员</div>
      <div class="cell member-cell"><span class="head-disc" aria-hidden="true"></span><span class="metric-value">1</span><span class="metric-detail">颗恒星</span></div>
      <div class="cell member-cell"><span class="planet-strip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="metric-value">8</span><span class="metric-detail">颗行星合计</span></div>

      <div class="dim">质量分布支持的判断</div>
      <div class="cell diff judgment sun-cell"><strong>质量中心</strong><span class="metric-detail" id="ratioText">等待筹码校准</span></div>
      <div class="cell diff judgment is-key"><strong>不是同级质量成员</strong><span class="metric-detail">众多成员不等于质量相当</span></div>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/matter.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Lec.mount({
    index: 6,
    kicker: "SYSTEM / MASS",
    title: "一千份质量，太阳拿走几份？",
    take: "太阳占太阳系总质量的绝对多数，行星并非与它同级。"
  });

  (function () {
    var page = document.getElementById('massPage');
    var scene = document.getElementById('massScene');
    var canvas = document.getElementById('massCanvas');
    var slider = document.getElementById('splitter');
    var resetButton = document.getElementById('resetButton');
    var feedback = document.getElementById('feedback');
    var sunTokensEl = document.getElementById('sunTokens');
    var otherTokensEl = document.getElementById('otherTokens');
    var unsettledEl = document.getElementById('unsettled');
    var sunExactEl = document.getElementById('sunExact');
    var otherExactEl = document.getElementById('otherExact');
    var sunShareBar = document.getElementById('sunShareBar');
    var otherShareBar = document.getElementById('otherShareBar');
    var ratioTextEl = document.getElementById('ratioText');
    var ctx = Deck.fit(canvas);
    var engine = null;
    var bodies = [];
    var stopLoop = null;
    var current = 500;
    var settled = false;
    var success = false;
    var W = scene.clientWidth;
    var H = scene.clientHeight;
    var P = Lec.P;
    var planets = Lec.K.PLANETS;
    var planetMass = planets.reduce(function (sum, planet) {
      return sum + P.planetMassKg(planet);
    }, 0);
    var sunMass = Lec.K.SUN.massKg;
    var totalMass = sunMass + planetMass;
    var sunPercent = P.percent(sunMass, totalMass);
    var otherPercent = P.percent(planetMass, totalMass);
    var massRatio = P.ratio(sunMass, planetMass);
    var target = Math.round(sunPercent * 10);
    var tolerance = 5;
    var colors = {};

    function readColors() {
      colors.bg = Deck.token('--surface-data');
      colors.surface = Deck.token('--surface');
      colors.line = Deck.token('--line-strong');
      colors.primary = Deck.token('--primary');
      colors.primarySoft = Deck.rgba('--primary', .34);
      colors.accent = Deck.token('--accent');
      colors.accentSoft = Deck.rgba('--accent', .72);
      colors.textMuted = Deck.token('--text-muted');
    }

    function geometry() {
      W = scene.clientWidth;
      H = scene.clientHeight;
      return {
        floor: H - 72,
        top: 92,
        leftX: 38,
        splitX: Math.round(W * .665),
        rightX: W - 38
      };
    }

    function drawFrame() {
      var g = geometry();
      var i;
      ctx.clearRect(0, 0, W, H);
      ctx.save();
      ctx.strokeStyle = colors.primarySoft;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(W * .43, H * .55, W * .43, H * .31, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = colors.line;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(g.leftX, g.top);
      ctx.lineTo(g.leftX, g.floor);
      ctx.lineTo(g.splitX - 8, g.floor);
      ctx.lineTo(g.splitX - 8, g.top);
      ctx.moveTo(g.splitX + 8, g.top);
      ctx.lineTo(g.splitX + 8, g.floor);
      ctx.lineTo(g.rightX, g.floor);
      ctx.lineTo(g.rightX, g.top);
      ctx.stroke();

      ctx.strokeStyle = success ? colors.accent : colors.primary;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(W * .48, 58);
      ctx.lineTo(W * .48, 78);
      ctx.lineTo(g.splitX - 8, 102);
      ctx.moveTo(W * .52, 58);
      ctx.lineTo(W * .52, 78);
      ctx.lineTo(g.splitX + 8, 102);
      ctx.stroke();

      if (bodies.length) {
        for (i = 0; i < bodies.length; i += 1) {
          var body = bodies[i];
          ctx.beginPath();
          ctx.arc(body.position.x, body.position.y, body.circleRadius, 0, Math.PI * 2);
          ctx.fillStyle = body.plugin.side === 'sun' ? colors.accentSoft : colors.primary;
          ctx.fill();
        }
      } else {
        drawPreview(g, current);
      }
      ctx.restore();
    }

    function drawPreview(g, sunCount) {
      var otherCount = 1000 - sunCount;
      drawPile(g.leftX + 10, g.splitX - 18, g.floor - 3, sunCount, colors.accentSoft);
      drawPile(g.splitX + 18, g.rightX - 10, g.floor - 3, otherCount, colors.primary);
    }

    function drawPile(x1, x2, floor, count, color) {
      var spacing = 6;
      var cols = Math.max(1, Math.floor((x2 - x1) / spacing));
      var rows = Math.ceil(count / cols);
      var index = 0;
      var r;
      var c;
      ctx.fillStyle = color;
      for (r = 0; r < rows; r += 1) {
        for (c = 0; c < cols && index < count; c += 1) {
          ctx.beginPath();
          ctx.arc(x1 + c * spacing + 3, floor - r * spacing - 3, 2.25, 0, Math.PI * 2);
          ctx.fill();
          index += 1;
        }
      }
    }

    function clearPhysics() {
      if (stopLoop) {
        stopLoop();
        stopLoop = null;
      }
      if (engine) {
        Matter.Composite.clear(engine.world, false);
        Matter.Engine.clear(engine);
      }
      engine = null;
      bodies = [];
    }

    function buildPhysics() {
      var g = geometry();
      var Bodies = Matter.Bodies;
      var Composite = Matter.Composite;
      var i;
      clearPhysics();
      engine = Matter.Engine.create({ gravity: { x: 0, y: 1.35 } });
      engine.positionIterations = 4;
      engine.velocityIterations = 3;
      Composite.add(engine.world, [
        Bodies.rectangle((g.leftX + g.splitX) / 2, g.floor + 8, g.splitX - g.leftX, 16, { isStatic: true }),
        Bodies.rectangle((g.splitX + g.rightX) / 2, g.floor + 8, g.rightX - g.splitX, 16, { isStatic: true }),
        Bodies.rectangle(g.leftX - 5, (g.top + g.floor) / 2, 10, g.floor - g.top, { isStatic: true }),
        Bodies.rectangle(g.splitX - 8, (g.top + g.floor) / 2, 10, g.floor - g.top, { isStatic: true }),
        Bodies.rectangle(g.splitX + 8, (g.top + g.floor) / 2, 10, g.floor - g.top, { isStatic: true }),
        Bodies.rectangle(g.rightX + 5, (g.top + g.floor) / 2, 10, g.floor - g.top, { isStatic: true })
      ]);
      for (i = 0; i < 1000; i += 1) {
        var side = i < target ? 'sun' : 'other';
        var minX = side === 'sun' ? g.leftX + 14 : g.splitX + 22;
        var maxX = side === 'sun' ? g.splitX - 22 : g.rightX - 14;
        var col = i % 90;
        var x = minX + ((col * 37) % Math.max(20, Math.floor(maxX - minX)));
        var y = 72 - Math.floor(i / 90) * 7 - (i % 7) * 4;
        var token = Bodies.circle(x, y, 2.35, {
          restitution: .05,
          friction: .16,
          frictionAir: .018,
          density: .001,
          collisionFilter: { group: 0, category: 1, mask: 1 }
        });
        token.plugin.side = side;
        bodies.push(token);
      }
      Composite.add(engine.world, bodies);
      if (Deck.reduced()) {
        clearPhysics();
        settled = true;
        unsettledEl.textContent = '0';
        drawFrame();
        return;
      }
      var elapsed = 0;
      stopLoop = Deck.loop(function (time, dt) {
        var step = Math.min(24, dt || 16.67);
        elapsed += step;
        Matter.Engine.update(engine, step);
        drawFrame();
        unsettledEl.textContent = String(Math.max(0, Math.round(1000 * (1 - Math.min(elapsed / 2100, 1)))));
        if (elapsed >= 2300) {
          settled = true;
          unsettledEl.textContent = '0';
          stopLoop();
          stopLoop = null;
        }
      }, { still: 2400 });
    }

    function updatePreview() {
      current = Number(slider.value);
      sunTokensEl.textContent = current + ' 份';
      otherTokensEl.textContent = (1000 - current) + ' 份';
      unsettledEl.textContent = success && settled ? '0' : '1000';
      drawFrame();
    }

    function showFeedback(message, kind) {
      feedback.textContent = message;
      feedback.className = 'feedback is-visible ' + kind;
    }

    function revealResult() {
      success = true;
      page.classList.remove('is-error');
      page.classList.add('is-correct');
      slider.value = String(target);
      current = target;
      sunTokensEl.textContent = target + ' 份';
      otherTokensEl.textContent = (1000 - target) + ' 份';
      sunExactEl.textContent = P.significant(sunPercent, 4) + '%';
      otherExactEl.textContent = P.significant(otherPercent, 3) + '%';
      sunShareBar.style.setProperty('--share', sunPercent + '%');
      otherShareBar.style.setProperty('--share', Math.max(otherPercent, 1.2) + '%');
      ratioTextEl.textContent = '约为八颗行星合计的 ' + P.significant(massRatio, 3) + ' 倍';
      showFeedback('挡板已吸附：筹码按最近整份落仓，百分比仍按原始质量计算。', 'is-success');
      buildPhysics();
    }

    function rejectResult() {
      page.classList.remove('is-correct');
      page.classList.remove('is-error');
      void page.offsetWidth;
      page.classList.add('is-error');
      showFeedback('你给其余成员留得过多，请按质量而不是成员数量分配。', 'is-error');
    }

    function commit() {
      current = Number(slider.value);
      if (Math.abs(current - target) <= tolerance) {
        revealResult();
      } else {
        rejectResult();
      }
    }

    function reset() {
      clearPhysics();
      success = false;
      settled = false;
      current = 500;
      slider.value = '500';
      page.classList.remove('is-correct', 'is-error');
      feedback.className = 'feedback';
      feedback.textContent = '';
      sunExactEl.textContent = '待校准';
      otherExactEl.textContent = '待校准';
      sunShareBar.style.setProperty('--share', '50%');
      otherShareBar.style.setProperty('--share', '50%');
      ratioTextEl.textContent = '等待筹码校准';
      updatePreview();
      slider.focus();
    }

    readColors();
    sunShareBar.style.setProperty('--share', '50%');
    otherShareBar.style.setProperty('--share', '50%');
    slider.addEventListener('input', updatePreview);
    slider.addEventListener('change', commit);
    resetButton.addEventListener('click', reset);
    Deck.onResize(function () {
      ctx = Deck.fit(canvas);
      readColors();
      drawFrame();
    });
    updatePreview();
  }());
</script>
</body>
</html>
