<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .index-page { position:relative; display:flex; flex-direction:column; gap:var(--sp-4); width:var(--content-w); height:var(--content-h); min-width:0; min-height:0; }
  .index-page::before { position:absolute; inset:0; pointer-events:none; background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px); background-size:var(--sp-7) var(--sp-7); opacity:.16; content:""; -webkit-mask-image:linear-gradient(to bottom,black,transparent 78%); mask-image:linear-gradient(to bottom,black,transparent 78%); }
  .plate-routing { position:absolute; z-index:0; inset:0; width:100%; height:100%; pointer-events:none; }
  .plate-routing path { fill:none; stroke:var(--primary-line); stroke-width:1; stroke-dasharray:6 10; vector-effect:non-scaling-stroke; }
  .plate-routing circle { fill:var(--surface); stroke:var(--primary); stroke-width:1; vector-effect:non-scaling-stroke; }
  .status-bar { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; min-height:48px; padding:0 var(--sp-4); border:1px solid var(--line); border-left:3px solid var(--primary); background:var(--surface-data); }
  .status-copy { color:var(--text-muted); font-size:var(--fs-sec); line-height:var(--lh-body); }
  .status-copy strong { color:var(--accent); font-family:var(--font-mono); font-size:var(--fs-lead); }
  .reset-btn { width:var(--control-h); min-width:var(--control-h); padding:0; font-size:var(--fs-h2); }
  .reset-btn[hidden] { display:none; }
  .index-plate { position:relative; z-index:1; display:flex; align-items:stretch; min-height:380px; overflow:hidden; border:1px solid var(--line-strong); background:var(--surface); }
  .index-plate::before,.index-plate::after { position:absolute; width:var(--sp-5); height:var(--sp-5); border-color:var(--primary); pointer-events:none; content:""; }
  .index-plate::before { top:var(--sp-3); left:var(--sp-3); border-top:1px solid; border-left:1px solid; }
  .index-plate::after { right:var(--sp-3); bottom:var(--sp-3); border-right:1px solid; border-bottom:1px solid; }
  .sun-anchor { position:relative; display:flex; flex:0 0 136px; flex-direction:column; align-items:center; justify-content:center; gap:var(--sp-3); border-right:1px solid var(--line); background:var(--surface-data); }
  .sun-disc { width:76px; height:76px; border:2px solid var(--accent); border-radius:50%; background:var(--accent-soft); box-shadow:0 0 var(--sp-6) var(--accent-soft),inset 0 0 var(--sp-5) var(--accent-soft); }
  .sun-anchor .label { color:var(--text); }
  .sun-anchor .measure { padding-top:var(--sp-2); border-top:1px solid var(--primary-line); }
  .rail-shell { position:relative; display:flex; flex:1 1 0; min-width:0; padding:var(--sp-7) var(--sp-5) var(--sp-5); }
  .wireframe-map { position:absolute; top:var(--sp-6); right:var(--sp-4); bottom:var(--sp-4); left:-136px; width:calc(100% + 120px); height:calc(100% - var(--sp-7)); pointer-events:none; }
  .wireframe-map .orbit-ring { fill:none; stroke:var(--primary-line); stroke-width:1; }
  .wireframe-map .route { fill:none; stroke:var(--line-strong); stroke-width:1; stroke-dasharray:5 7; }
  .wireframe-map .tick-mark { stroke:var(--primary-line); stroke-width:1; }
  .rail-label { position:absolute; top:var(--sp-3); left:var(--sp-5); color:var(--text-muted); font-size:var(--fs-label); line-height:var(--lh-tight); }
  .rail-label::after { display:inline-block; width:var(--sp-7); margin-left:var(--sp-3); border-top:1px dashed var(--primary-line); vertical-align:middle; content:""; }
  .orbit-index { position:relative; display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); width:100%; min-width:0; }
  .rail-base,.rail-live { position:absolute; top:88px; left:6.25%; width:87.5%; height:2px; transform-origin:left center; }
  .rail-base { background:var(--line-strong); }
  .rail-live { background:var(--accent); transform:scaleX(0); }
  .orbit-index .it { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; min-width:0; padding:0 var(--sp-1); border:0; border-radius:0; background:transparent; }
  .slot-no { color:var(--text-muted); font-family:var(--font-mono); font-size:var(--fs-tick); line-height:var(--lh-tight); }
  .slot-node { width:20px; height:20px; margin:var(--sp-5) 0 var(--sp-4); border:2px solid var(--primary); border-radius:50%; background:var(--surface); }
  .slot-name { min-height:48px; color:var(--text-dim); font-size:var(--fs-sec); font-weight:650; line-height:var(--lh-body); text-align:center; }
  .slot-name::before { content:"待定位"; }
  .orbit-index .it.is-current .slot-node { border-color:var(--accent); box-shadow:0 0 var(--sp-4) var(--accent); animation:breathe 1.8s ease-in-out infinite; }
  .orbit-index .it.is-filled .slot-node { border-color:var(--accent); background:var(--accent); box-shadow:0 0 var(--sp-3) var(--accent-soft); }
  .orbit-index .it.is-filled .slot-name { color:var(--accent); }
  .orbit-index .it.is-filled .slot-name::before { content:none; }
  @keyframes breathe { 50% { box-shadow:0 0 var(--sp-5) var(--accent); } }
  .choice-zone { position:relative; z-index:2; display:flex; align-items:center; gap:var(--sp-4); min-height:90px; padding:var(--sp-3) var(--sp-4); border-top:1px solid var(--primary-line); border-bottom:1px solid var(--line); background:var(--surface-data); }
  .choice-heading { flex:0 0 148px; color:var(--text-muted); font-size:var(--fs-label); line-height:var(--lh-tight); }
  .choice-heading strong { display:block; margin-top:var(--sp-2); color:var(--text); font-size:var(--fs-sec); }
  .name-list { --enum-cols:8; flex:1 1 0; gap:var(--sp-2); min-width:0; outline:none; }
  .name-list>.it { display:flex; align-items:center; justify-content:center; min-height:var(--control-h); padding:0 var(--sp-2); border-top-width:1px; cursor:pointer; color:var(--text); font-size:var(--fs-sec); font-weight:650; line-height:var(--lh-tight); text-align:center; user-select:none; }
  .name-list>.it[aria-selected="true"] { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); outline:2px solid var(--focus); outline-offset:2px; }
  .name-list>.it.is-used { pointer-events:none; opacity:.24; }
  .name-list>.it.is-wrong { border-color:var(--danger); background:var(--surface-raised); color:var(--danger); }
  .feedback-row { position:relative; z-index:2; display:flex; align-items:center; min-height:54px; padding:0 var(--sp-4); border-left:3px solid var(--primary); background:var(--surface); color:var(--text-muted); font-size:var(--fs-sec); line-height:var(--lh-body); }
  .feedback-row.is-error { border-left-color:var(--danger); color:var(--danger); }
  .feedback-row.is-complete { border-left-color:var(--accent); color:var(--text); }
  .boundary-note { position:absolute; right:var(--sp-5); bottom:var(--sp-3); padding-left:var(--sp-3); border-left:1px solid var(--primary-line); color:var(--text-muted); font-size:var(--fs-sec); line-height:var(--lh-body); }
  .lec-progress { overflow:visible; }
  @media (prefers-reduced-motion:reduce) { .orbit-index .it.is-current .slot-node { animation:none; } }
</style>
</head>
<body data-page="08" data-total="50">
<div id="stage">
<main id="main">
  <section class="index-page min0" aria-labelledby="plate-title">
    <svg class="plate-routing" viewBox="0 0 1408 620" preserveAspectRatio="none" aria-hidden="true">
      <path d="M 18 24 H 72 V 166 H 118 M 18 596 H 86 V 518 H 168 M 1390 24 H 1336 V 166 H 1290 M 1390 596 H 1322 V 518 H 1240"/>
      <path d="M 204 52 V 92 M 704 52 V 92 M 1204 52 V 92 M 204 472 V 516 M 704 472 V 516 M 1204 472 V 516"/>
      <circle cx="204" cy="92" r="5"/><circle cx="704" cy="92" r="5"/><circle cx="1204" cy="92" r="5"/>
      <circle cx="204" cy="516" r="5"/><circle cx="704" cy="516" r="5"/><circle cx="1204" cy="516" r="5"/>
    </svg>
    <div class="status-bar">
      <div class="status-copy" aria-live="polite">已点亮 <strong id="progress-value">0 / 8</strong></div>
      <div class="label" id="plate-title">从太阳向外 · 等距序号位</div>
      <button class="reset-btn" id="reset-btn" type="button" title="重置行星序列" aria-label="重置行星序列" hidden>↻</button>
    </div>
    <div class="index-plate min0">
      <div class="sun-anchor" aria-label="索引起点：太阳">
        <div class="sun-disc" aria-hidden="true"></div><span class="label">太阳</span><span class="measure">ORIGIN / 00</span>
      </div>
      <div class="rail-shell min0">
        <svg class="wireframe-map" id="wireframe-map" viewBox="0 0 1100 210" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="rail-label">向外读取</div>
        <div class="orbit-index k-enumeration min0" id="orbit-index" aria-label="八颗行星顺序索引">
          <div class="rail-base" aria-hidden="true"></div><div class="rail-live" id="rail-live" aria-hidden="true"></div>
        </div>
        <div class="boundary-note">序号索引，不代表距离与大小</div>
      </div>
    </div>
    <div class="choice-zone">
      <div class="choice-heading">下一站是谁？<strong>点击名称定位</strong></div>
      <div class="name-list k-enumeration min0" id="name-list" role="listbox" aria-label="打乱的行星名称；用方向键选择，按 Enter 定位" aria-activedescendant=""></div>
    </div>
    <div class="feedback-row" id="feedback" role="status" aria-live="polite">请从离太阳最近的行星开始。</div>
  </section>
</main>
</div>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Lec.mount({ index:8, kicker:"ORBITAL INDEX", title:"太阳向外，依次是谁？", take:"从太阳向外记住行星顺序，是为了快速定位；真正理解太阳系，还要继续追问它们的位置、运动、组成与历史。" });
  (function () {
    var planets=Lec.K.PLANETS;
    var total=planets.length;
    var order=planets.slice().sort(function(a,b){ var ak=(a.id.charCodeAt(0)*7+a.id.length*11)%31; var bk=(b.id.charCodeAt(0)*7+b.id.length*11)%31; return ak-bk||b.order-a.order; });
    var orbitIndex=document.getElementById('orbit-index');
    var nameList=document.getElementById('name-list');
    var progressValue=document.getElementById('progress-value');
    var feedback=document.getElementById('feedback');
    var railLive=document.getElementById('rail-live');
    var resetBtn=document.getElementById('reset-btn');
    var wireframeMap=document.getElementById('wireframe-map');
    var current=0, active=0, slots=[], options=[];
    function pad(value){ return String(value).padStart(2,'0'); }
    (function buildWireframe(){
      var ns='http://www.w3.org/2000/svg';
      var route=document.createElementNS(ns,'path');
      route.setAttribute('class','route'); route.setAttribute('d','M 12 110 H 1088'); wireframeMap.appendChild(route);
      planets.forEach(function(_,index){
        var x=70+index*(960/(total-1));
        var ring=document.createElementNS(ns,'ellipse');
        ring.setAttribute('class','orbit-ring'); ring.setAttribute('cx',x); ring.setAttribute('cy','110'); ring.setAttribute('rx',26+index*2); ring.setAttribute('ry',74-index*3); wireframeMap.appendChild(ring);
        for(var t=0;t<5;t+=1){
          var mark=document.createElementNS(ns,'line');
          var tx=x-34+t*17; mark.setAttribute('class','tick-mark'); mark.setAttribute('x1',tx); mark.setAttribute('x2',tx); mark.setAttribute('y1',index%2?184:26); mark.setAttribute('y2',index%2?194:16); wireframeMap.appendChild(mark);
        }
      });
    }());
    planets.forEach(function(_,index){
      var slot=document.createElement('div'); slot.className='it';
      slot.innerHTML='<span class="slot-no">'+pad(index+1)+'</span><span class="slot-node" aria-hidden="true"></span><span class="slot-name"></span>';
      orbitIndex.appendChild(slot); slots.push(slot);
    });
    order.forEach(function(planet,index){
      var option=document.createElement('div'); option.className='it'; option.id='planet-option-'+planet.id;
      option.setAttribute('role','option'); option.setAttribute('aria-selected',index===0?'true':'false'); option.setAttribute('tabindex',index===0?'0':'-1');
      option.dataset.id=planet.id; option.textContent=planet.name;
      option.addEventListener('click',function(){ setActive(options.indexOf(option),false); choose(option); });
      nameList.appendChild(option); options.push(option);
    });
    function available(from,step){ var index=from; do { index=(index+step+options.length)%options.length; if(!options[index].classList.contains('is-used')) return index; } while(index!==from); return from; }
    function setActive(index,focus){ active=index; options.forEach(function(option,i){ option.setAttribute('aria-selected',i===active?'true':'false'); option.setAttribute('tabindex',i===active?'0':'-1'); }); nameList.setAttribute('aria-activedescendant',options[active].id); if(focus) options[active].focus(); }
    function updateCurrentSlot(){ slots.forEach(function(slot,index){ slot.classList.toggle('is-current',index===current&&current<total); }); }
    function wrong(option){
      feedback.className='feedback-row is-error';
      feedback.textContent=current===0?'请从离太阳最近的行星开始。':'顺序断了：请找比「'+planets[current-1].name+'」更外侧的下一颗行星。';
      option.classList.add('is-wrong');
      if(Deck.reduced()){ option.classList.remove('is-wrong'); return; }
      gsap.to(option,{x:0,duration:.42,ease:'power1.out',keyframes:[{x:-8,duration:.08},{x:8,duration:.08},{x:-6,duration:.08},{x:6,duration:.08},{x:0,duration:.1}],onComplete:function(){ option.classList.remove('is-wrong'); }});
    }
    function choose(option){
      if(current>=total||option.classList.contains('is-used')) return;
      if(option.dataset.id!==planets[current].id){ wrong(option); return; }
      var slot=slots[current]; slot.classList.remove('is-current'); slot.classList.add('is-filled'); slot.querySelector('.slot-name').textContent=planets[current].name;
      option.classList.add('is-used'); option.setAttribute('aria-selected','false'); option.setAttribute('tabindex','-1'); current+=1;
      progressValue.textContent=current+' / '+total;
      gsap.to(railLive,{scaleX:current/total,duration:Deck.reduced()?0:.42,ease:'power2.out',overwrite:'auto'});
      if(!Deck.reduced()) gsap.fromTo(slot.querySelector('.slot-node'),{scale:.6},{scale:1,duration:.46,ease:'back.out(1.7)',overwrite:'auto'});
      if(current===total){ complete(); } else { feedback.className='feedback-row'; feedback.textContent=planets[current-1].name+'已定位。继续向外找下一颗。'; updateCurrentSlot(); active=available(active,1); setActive(active,false); }
    }
    function complete(){
      updateCurrentSlot(); resetBtn.hidden=false; feedback.className='feedback-row is-complete'; feedback.textContent='顺序用于快速定位；还要继续追问位置、运动、组成与历史。';
      if(!Deck.reduced()) gsap.fromTo(slots,{filter:'brightness(1)'},{filter:'brightness(1.8)',duration:.28,stagger:.09,yoyo:true,repeat:1,ease:'power1.inOut',clearProps:'filter'});
    }
    function reset(){
      current=0; slots.forEach(function(slot){ slot.className='it'; slot.querySelector('.slot-name').textContent=''; }); options.forEach(function(option){ option.className='it'; });
      progressValue.textContent='0 / '+total; feedback.className='feedback-row'; feedback.textContent='请从离太阳最近的行星开始。'; resetBtn.hidden=true; gsap.set(railLive,{scaleX:0}); active=0; setActive(active,true); updateCurrentSlot();
    }
    nameList.addEventListener('keydown',function(event){
      if(event.key==='ArrowRight'||event.key==='ArrowDown'){ event.preventDefault(); setActive(available(active,1),true); }
      else if(event.key==='ArrowLeft'||event.key==='ArrowUp'){ event.preventDefault(); setActive(available(active,-1),true); }
      else if(event.key==='Enter'||event.key===' '){ event.preventDefault(); choose(options[active]); }
    });
    resetBtn.addEventListener('click',reset); progressValue.textContent='0 / '+total; setActive(0,false); updateCurrentSlot();
    if(!Deck.reduced()){
      gsap.from('.sun-disc',{autoAlpha:0,scale:.7,duration:.6,ease:'power2.out'});
      gsap.from('.rail-base',{scaleX:0,transformOrigin:'left center',duration:.8,delay:.15,ease:'power2.out'});
      gsap.from(slots,{autoAlpha:0,y:10,duration:.35,delay:.45,stagger:.06,ease:'power1.out'});
      gsap.from(options,{autoAlpha:0,y:12,duration:.35,delay:.75,stagger:.04,ease:'power1.out'});
    }
  }());
</script>
</body>
</html>
