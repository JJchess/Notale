<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .scale-page {
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
    width: var(--content-w);
    height: var(--content-h);
  }

  .scale-lead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-5);
    min-height: 54px;
    padding: var(--sp-2) var(--sp-4);
    border-left: 3px solid var(--primary);
    background: var(--surface-data);
  }

  .scale-lead p {
    max-width: 700px;
    color: var(--text-muted);
    font-size: var(--fs-sec);
  }

  .scale-legend {
    display: flex;
    align-items: center;
    gap: var(--sp-4);
    color: var(--text-muted);
    font-size: var(--fs-label);
  }

  .legend-dot,
  .legend-outline {
    display: inline-block;
    width: 12px;
    height: 12px;
    margin-right: var(--sp-2);
    border-radius: 50%;
    vertical-align: -1px;
  }

  .legend-dot {
    border: 1px solid var(--primary);
    background: var(--primary);
  }

  .legend-outline {
    border: 1px solid var(--accent);
    background: transparent;
  }

  .compare-status {
    flex: 0 0 auto;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: var(--fs-sec);
    font-variant-numeric: tabular-nums;
  }

  .scale-compare {
    --compare-cols: 2;
    grid-template-columns: 164px repeat(2, minmax(0, 1fr));
    grid-template-rows: 52px 50px 52px 52px 270px;
    flex: 1 1 auto;
    min-height: 0;
  }

  .scale-compare > * {
    padding: var(--sp-3) var(--sp-4);
  }

  .scale-compare > .hdr {
    min-height: 0;
    align-items: center;
    font-size: var(--fs-lead);
  }

  .scale-compare > .hdr:first-child {
    color: var(--text-muted);
    font-size: var(--fs-label);
  }

  .scale-compare > .dim {
    justify-content: flex-start;
    text-align: left;
  }

  .scale-compare > .cell {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
  }

  .scale-compare > .cell strong {
    color: var(--text);
    font-family: var(--font-mono);
    font-size: var(--fs-sec);
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }

  .scale-compare > .cell span {
    color: var(--text-muted);
    font-size: var(--fs-sec);
  }

  .scale-compare > .scene-cell {
    display: block;
    padding: 0;
    overflow: visible;
  }

  .lec-progress {
    overflow: visible;
  }

  .scale-compare > .is-reached {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .scale-scene {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: visible;
    background: var(--surface-data);
  }

  .scene-cell {
    overflow: visible;
  }

  .room-wall {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(90deg, transparent 72%, var(--line) 72%, var(--line) calc(72% + 1px), transparent calc(72% + 1px)),
      linear-gradient(0deg, var(--line) 1px, transparent 1px);
    background-size: 100% 100%, 100% 44px;
  }

  .door-mark {
    position: absolute;
    right: 7%;
    bottom: 42px;
    width: 54px;
    height: 112px;
    border: 1px solid var(--line-strong);
    border-bottom: 0;
  }

  .table-edge {
    position: absolute;
    right: var(--sp-4);
    bottom: 28px;
    left: var(--sp-4);
    height: 12px;
    border-top: 2px solid var(--line-strong);
    background: var(--surface);
  }

  .system-line {
    position: absolute;
    top: 88px;
    left: 44px;
    height: 2px;
    background: var(--primary-line);
    transform-origin: left center;
    transition: width 240ms ease-out, background 180ms ease-out;
  }

  .left-scene .system-line {
    width: calc(100% - 44px);
  }

  .right-scene .system-line {
    width: calc(100% - 82px);
  }

  .system-line.connected {
    background: var(--accent);
  }

  .sun-disc {
    position: absolute;
    z-index: 3;
    top: 70px;
    left: 28px;
    width: 36px;
    height: 36px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    background: var(--accent-soft);
    box-shadow: 0 0 18px var(--accent-soft);
  }

  .sun-disc::after {
    position: absolute;
    top: 41px;
    left: -8px;
    width: 50px;
    color: var(--text-muted);
    font-size: var(--fs-label);
    text-align: center;
    content: "太阳";
  }

  .planet-mark {
    position: absolute;
    z-index: 4;
    top: 72px;
    width: 32px;
    height: 32px;
    margin-left: -16px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transform: translateX(0);
    transition: left 240ms ease-out;
  }

  .planet-mark::before {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 8px;
    height: 8px;
    border: 1px solid var(--primary);
    border-radius: 50%;
    background: var(--primary);
    content: "";
  }

  .planet-key {
    position: absolute;
    z-index: 7;
    right: var(--sp-3);
    bottom: var(--sp-2);
    left: var(--sp-3);
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    border-top: 1px solid var(--line);
  }

  .planet-label {
    min-width: 0;
    padding-top: var(--sp-2);
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
    text-align: center;
  }

  .planet-label .tick {
    display: block;
    margin-top: var(--sp-1);
  }

  .scene-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .true-outline {
    position: absolute;
    z-index: 5;
    top: 15px;
    left: 15px;
    width: max(1px, var(--diameter));
    height: max(1px, var(--diameter));
    border: 1px solid var(--accent);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
  }

  .planet-mark.shake {
    animation: marker-shake 240ms ease-in-out;
  }

  .planet-mark.shake .true-outline {
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .beyond {
    position: absolute;
    top: 40px;
    right: 18px;
    color: var(--primary);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }

  .beyond::after {
    margin-left: var(--sp-2);
    content: "→";
  }

  .scene-caption {
    position: absolute;
    right: var(--sp-4);
    bottom: 50px;
    left: var(--sp-4);
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
  }

  .marker-feedback {
    position: absolute;
    z-index: 8;
    right: var(--sp-4);
    bottom: var(--sp-3);
    left: var(--sp-4);
    min-height: 24px;
    color: var(--accent);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
  }

  .scale-controls {
    display: grid;
    grid-template-columns: 164px minmax(0, 1fr) 190px 56px;
    gap: var(--sp-4);
    align-items: center;
    min-height: 68px;
    padding: var(--sp-2) var(--sp-4);
    border: 1px solid var(--line);
    background: var(--surface-data);
  }

  .scale-controls > * {
    min-width: 0;
  }

  .control-name {
    color: var(--text);
    font-size: var(--fs-sec);
    font-weight: 650;
  }

  .range-wrap {
    position: relative;
    padding: 0 0 22px;
  }

  .range-wrap input {
    display: block;
    min-height: 44px;
    margin: 0;
    cursor: grab;
  }

  .range-wrap input:active {
    cursor: grabbing;
  }

  .range-nodes {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
  }

  .range-node {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-2);
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }

  .range-node::before {
    width: 10px;
    height: 10px;
    border: 2px solid var(--primary);
    border-radius: 50%;
    content: "";
  }

  .range-node.done::before {
    border-color: var(--accent);
    background: var(--accent);
  }

  .reset-button {
    width: 44px;
    min-width: 44px;
    padding: 0;
    font-size: var(--fs-h2);
  }

  .conclusion-brace {
    position: absolute;
    z-index: 10;
    top: 6px;
    right: 10px;
    left: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    min-height: 36px;
    border: 1px solid var(--accent);
    border-bottom: 0;
    color: var(--accent);
    font-size: var(--fs-sec);
    font-weight: 650;
    line-height: var(--lh-tight);
    pointer-events: none;
  }

  .scale-compare.complete .conclusion-brace {
    display: flex;
  }

  @keyframes marker-shake {
    0%, 100% { transform: translateX(0); }
    30% { transform: translateX(-6px); }
    70% { transform: translateX(6px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .system-line,
    .planet-mark {
      transition: none;
    }

    .planet-mark.shake {
      animation: none;
    }
  }
</style>
</head>
<body data-page="09" data-total="50">
<div id="stage">
<main id="main">
  <section class="scale-page page min0" aria-labelledby="scale-question">
    <div class="scale-lead">
      <p id="scale-question">把同一组行星按两把尺子缩小，比较每一行的同一维度。</p>
      <div class="scale-legend" aria-label="图例">
        <span><i class="legend-dot"></i>最低可见定位点</span>
        <span><i class="legend-outline"></i>同比例直径轮廓</span>
      </div>
      <div id="compareStatus" class="compare-status" aria-live="polite">已比较 1 / 2</div>
    </div>

    <div id="comparison" class="k-comparison scale-compare min0" aria-label="两种太阳系缩尺方案的四项比较">
      <div class="hdr">同一维度</div>
      <div id="leftHeader" class="hdr is-reached">让地球肉眼可辨</div>
      <div id="rightHeader" class="hdr">让海王星轨道进入桌面</div>

      <div class="dim">缩放依据</div>
      <div class="cell diff"><strong>地球直径 = 8 mm</strong><span>大小优先</span></div>
      <div class="cell diff"><strong>海王星轨道 = 1.2 m</strong><span>距离优先</span></div>

      <div class="dim">太阳与行星直径</div>
      <div class="cell"><strong id="largeSun">—</strong><span>太阳直径；地球仍为 8 mm</span></div>
      <div class="cell"><strong id="tinyEarth">—</strong><span>地球同比例直径</span></div>

      <div class="dim">太阳至各轨道距离</div>
      <div class="cell"><strong id="farNeptune">—</strong><span>太阳至海王星轨道</span></div>
      <div class="cell"><strong id="nearNeptune">—</strong><span>太阳至海王星轨道</span></div>

      <div class="dim">最终可见结果</div>
      <div id="leftSceneCell" class="cell scene-cell diff is-reached min0">
        <div class="scale-scene left-scene" aria-label="大小可辨时，外行星轨道远在教室之外">
          <canvas id="leftCanvas" class="scene-canvas cv-fill" aria-hidden="true"></canvas>
          <div class="room-wall"></div>
          <div class="door-mark" aria-hidden="true"></div>
          <div class="table-edge" aria-hidden="true"></div>
          <div class="system-line"></div>
          <div class="sun-disc" aria-hidden="true"></div>
          <div id="leftPlanets"></div>
          <div id="leftKey" class="planet-key"></div>
          <div class="beyond">海王星轨道远在教室外</div>
          <div class="scene-caption">行星可辨，但真实同比例距离无法画进教室。</div>
          <div id="leftFeedback" class="marker-feedback" aria-live="polite"></div>
        </div>
      </div>
      <div id="rightSceneCell" class="cell scene-cell diff min0">
        <div class="scale-scene right-scene no-pan" aria-label="压缩距离后，海王星轨道进入桌面">
          <canvas id="rightCanvas" class="scene-canvas cv-fill" aria-hidden="true"></canvas>
          <div class="room-wall"></div>
          <div class="door-mark" aria-hidden="true"></div>
          <div class="table-edge" aria-hidden="true"></div>
          <div id="rightLine" class="system-line"></div>
          <div class="sun-disc" aria-hidden="true"></div>
          <div id="rightPlanets"></div>
          <div id="rightKey" class="planet-key"></div>
          <div id="brace" class="conclusion-brace">同一张图不能兼顾</div>
          <div id="rightCaption" class="scene-caption">拖动手柄，把距离压进桌面；行星真实轮廓不随之放大。</div>
          <div id="rightFeedback" class="marker-feedback" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <div class="scale-controls">
      <label class="control-name" for="compressRange">压缩距离</label>
      <div class="range-wrap min0">
        <input id="compressRange" type="range" min="0" max="100" step="1" value="0" aria-label="压缩距离，当前未压缩">
        <div class="range-nodes" aria-hidden="true">
          <span id="nodeSize" class="range-node done">大小可辨</span>
          <span id="nodeFit" class="range-node">距离装下</span>
        </div>
      </div>
      <div id="ratioReadout" class="readout">
        <span class="name">距离保留</span>
        <span id="ratioValue" class="value">100%</span>
      </div>
      <button id="resetButton" class="reset-button" type="button" title="重置比较" aria-label="重置比较">↺</button>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/matter.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Lec.mount({
    index: 9,
    kicker: "SCALE CONFLICT",
    title: "大小看得见，距离就放不下",
    take: "太阳系若严格等比例缩进教室，行星会小得难以看见；若把行星画到看得清，它们之间的距离就远远超出教室。"
  });

  (function () {
    var planets = Lec.K.PLANETS;
    var sun = Lec.K.SUN;
    var units = Lec.K.UNITS;
    var earth = planets.filter(function (p) { return p.id === 'earth'; })[0];
    var neptune = planets[planets.length - 1];
    var earthDiameterKm = Lec.P.planetDiameterKm(earth);
    var sunDiameterKm = sun.radiusKm * 2;
    var neptuneDistanceKm = Lec.P.auToKm(neptune.semimajorAU);
    var visibleEarthMm = 8;
    var tableLengthMm = 1200;
    var visibleSunMm = Lec.P.scaleValue(sunDiameterKm, earthDiameterKm, visibleEarthMm);
    var tableSunMm = Lec.P.scaleValue(sunDiameterKm, neptuneDistanceKm, tableLengthMm);
    var visibleScale = Lec.P.scaleSolarSystem(visibleSunMm, neptune);
    var tableScale = Lec.P.scaleSolarSystem(tableSunMm, earth);
    var compressionRatio = Lec.P.ratio(tableLengthMm, visibleScale.distanceFromSun);
    var range = document.getElementById('compressRange');
    var comparison = document.getElementById('comparison');
    var rightPlanets = document.getElementById('rightPlanets');
    var leftPlanets = document.getElementById('leftPlanets');
    var rightKey = document.getElementById('rightKey');
    var leftKey = document.getElementById('leftKey');
    var feedbackTimer = 0;
    var completed = [true, false];
    var dragging = false;

    document.getElementById('largeSun').textContent = Lec.P.significant(visibleSunMm / 1000, 3) + ' m';
    document.getElementById('tinyEarth').textContent = Lec.P.significant(tableScale.bodyDiameter * 1000, 3) + ' μm';
    document.getElementById('farNeptune').textContent = Lec.P.significant(visibleScale.distanceFromSun / 1000000, 3) + ' km';
    document.getElementById('nearNeptune').textContent = Lec.P.significant(tableLengthMm / 1000, 2) + ' m';

    function makePlanet(body, parent, side) {
      var button = document.createElement('button');
      var outline = document.createElement('span');
      var label = document.createElement('span');
      var diameterKm = Lec.P.planetDiameterKm(body);
      var diameterMm = side === 'left'
        ? Lec.P.scaleValue(diameterKm, earthDiameterKm, visibleEarthMm)
        : Lec.P.scaleValue(diameterKm, neptuneDistanceKm, tableLengthMm);
      button.type = 'button';
      button.className = 'planet-mark';
      button.dataset.au = body.semimajorAU;
      button.setAttribute('aria-label', body.name + '最低可见定位标记');
      button.style.setProperty('--diameter', Math.min(18, diameterMm) + 'px');
      outline.className = 'true-outline';
      outline.setAttribute('aria-hidden', 'true');
      label.className = 'planet-label';
      label.textContent = body.name;
      button.appendChild(outline);
      button.addEventListener('click', function () {
        var feedback = document.getElementById(side === 'left' ? 'leftFeedback' : 'rightFeedback');
        window.clearTimeout(feedbackTimer);
        button.classList.remove('shake');
        void button.offsetWidth;
        button.classList.add('shake');
        feedback.textContent = '亮点只是定位标记；细线轮廓才是同比例直径。';
        feedbackTimer = window.setTimeout(function () {
          button.classList.remove('shake');
          feedback.textContent = '';
        }, Deck.reduced() ? 1200 : 2200);
      });
      parent.appendChild(button);
      (side === 'left' ? leftKey : rightKey).appendChild(label);
      return { mark: button };
    }

    var leftMarks = planets.map(function (p) { return makePlanet(p, leftPlanets, 'left'); });
    var rightMarks = planets.map(function (p) { return makePlanet(p, rightPlanets, 'right'); });

    function drawRoom(canvas, fitted) {
      Deck.autofit(canvas, function (ctx) {
        var w = canvas.offsetWidth;
        var h = canvas.offsetHeight;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = Deck.rgba('--surface-data', 1);
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = Deck.rgba('--surface', 1);
        ctx.fillRect(0, h - 60, w, 60);
        ctx.fillStyle = Deck.rgba('--line', 0.7);
        ctx.fillRect(16, h - 76, w - 32, 18);
        ctx.strokeStyle = Deck.rgba('--line-strong', 1);
        ctx.lineWidth = 1;
        for (var x = 0; x <= w; x += 52) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, h - 44);
          ctx.stroke();
        }
        ctx.strokeStyle = Deck.rgba('--primary', fitted ? 0.78 : 0.45);
        ctx.lineWidth = fitted ? 3 : 2;
        ctx.beginPath();
        ctx.moveTo(44, 88);
        ctx.lineTo(fitted ? w - 42 : w + 80, 88);
        ctx.stroke();
        ctx.fillStyle = Deck.rgba('--primary', 0.08);
        ctx.fillRect(44, 86, Math.max(0, w - 86), 22);
      });
    }

    drawRoom(document.getElementById('leftCanvas'), false);
    drawRoom(document.getElementById('rightCanvas'), true);

    function updateMarks(value) {
      var t = value / 100;
      var innerStart = 54;
      var innerEnd = 580;
      var maxAU = neptune.semimajorAU;
      planets.forEach(function (planet, i) {
        var normalized = planet.semimajorAU / maxAU;
        var expanded = innerStart + Math.min(normalized * 3300, innerEnd - 16);
        var fitted = innerStart + normalized * (innerEnd - innerStart);
        var x = Deck.lerp(expanded, fitted, t);
        var leftX = innerStart + Math.min(normalized * 3300, innerEnd - 16);
        leftMarks[i].mark.style.left = leftX + 'px';
        rightMarks[i].mark.style.left = x + 'px';
      });
      var retained = Deck.lerp(1, compressionRatio, t);
      document.getElementById('ratioValue').textContent = retained >= 0.01
        ? Lec.P.significant(retained * 100, 3) + '%'
        : Lec.P.significant(retained, 2).toExponential(1) + '×';
      document.getElementById('ratioReadout').classList.toggle('is-current', value === 100);
      range.setAttribute('aria-label', value === 100
        ? '压缩距离，海王星轨道已装入桌面，比例为原来的 ' + Lec.P.significant(compressionRatio, 2)
        : '压缩距离，当前进度 ' + value + '%');
    }

    function setComplete(index) {
      completed[index] = true;
      document.getElementById('nodeSize').classList.toggle('done', completed[0]);
      document.getElementById('nodeFit').classList.toggle('done', completed[1]);
      document.getElementById('compareStatus').textContent = '已比较 ' + (completed[0] + completed[1]) + ' / 2';
      document.getElementById('rightHeader').classList.toggle('is-reached', completed[1]);
      document.getElementById('rightSceneCell').classList.toggle('is-reached', completed[1]);
      comparison.classList.toggle('complete', completed[0] && completed[1]);
      document.getElementById('rightLine').classList.toggle('connected', completed[1]);
      if (completed[0] && completed[1]) {
        document.getElementById('rightCaption').textContent = '轨道装进桌面后，同比例行星只剩微米级轮廓。';
      }
    }

    var engine = Matter.Engine.create({ gravity: { x: 0, y: 0 } });
    var handleBody = Matter.Bodies.circle(0, 0, 8, { frictionAir: 0.22, inertia: Infinity });
    var snapTarget = null;
    Matter.Composite.add(engine.world, handleBody);

    function beginSnap(target) {
      if (snapTarget) Matter.Composite.remove(engine.world, snapTarget);
      snapTarget = Matter.Constraint.create({
        pointA: { x: target, y: 0 },
        bodyB: handleBody,
        stiffness: Deck.reduced() ? 1 : 0.16,
        damping: 0.28,
        length: 0
      });
      Matter.Composite.add(engine.world, snapTarget);
    }

    range.addEventListener('pointerdown', function () {
      dragging = true;
      if (snapTarget) {
        Matter.Composite.remove(engine.world, snapTarget);
        snapTarget = null;
      }
    });

    range.addEventListener('input', function () {
      var value = Number(range.value);
      Matter.Body.setPosition(handleBody, { x: value, y: 0 });
      Matter.Body.setVelocity(handleBody, { x: 0, y: 0 });
      updateMarks(value);
    });

    function releaseHandle() {
      var value = Number(range.value);
      dragging = false;
      if (value <= 12) {
        beginSnap(0);
        setComplete(0);
      } else if (value >= 88) {
        beginSnap(100);
        setComplete(1);
      }
    }

    range.addEventListener('change', releaseHandle);
    range.addEventListener('pointerup', releaseHandle);
    range.addEventListener('keyup', function (event) {
      if (event.key === 'Home' || event.key === 'End' || event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        releaseHandle();
      }
    });

    document.getElementById('resetButton').addEventListener('click', function () {
      completed = [true, false];
      Matter.Body.setPosition(handleBody, { x: 0, y: 0 });
      Matter.Body.setVelocity(handleBody, { x: 0, y: 0 });
      range.value = '0';
      beginSnap(0);
      updateMarks(0);
      setComplete(0);
      document.getElementById('rightCaption').textContent = '拖动手柄，把距离压进桌面；行星真实轮廓不随之放大。';
      document.getElementById('rightHeader').classList.remove('is-reached');
      document.getElementById('rightSceneCell').classList.remove('is-reached');
    });

    Deck.loop(function (_time, dt) {
      if (!dragging && snapTarget) {
        Matter.Engine.update(engine, Math.min(dt || 16.67, 32));
        var value = Deck.clamp(handleBody.position.x, 0, 100);
        if (Math.abs(value - Number(range.value)) > 0.1) {
          range.value = String(value);
          updateMarks(value);
        }
      }
    }, { still: 100 });

    updateMarks(0);
    beginSnap(0);
  })();
</script>
</body>
</html>
