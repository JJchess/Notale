<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .motion-page {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: var(--sp-5);
    width: var(--content-w);
    height: var(--content-h);
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .motion-field {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
    border: 1px solid var(--line);
    background: var(--surface);
  }

  .orbit-figure {
    position: absolute;
    inset: var(--sp-3) 48% var(--sp-3) var(--sp-3);
    min-width: 0;
    min-height: 0;
    margin: 0;
    border-right: 1px solid var(--line);
    background: var(--surface-data);
  }

  .orbit-canvas-wrap {
    position: absolute;
    inset: 0;
    min-width: 0;
    min-height: 0;
  }

  .snapshot-tag {
    position: absolute;
    top: var(--sp-3);
    left: var(--sp-4);
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
  }

  .snapshot-tag::before {
    width: 32px;
    height: 1px;
    background: var(--line-strong);
    content: "";
  }

  .scene-keys {
    position: absolute;
    bottom: var(--sp-4);
    left: var(--sp-4);
    display: flex;
    gap: var(--sp-2);
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .scene-keys li {
    min-width: 112px;
    padding: var(--sp-2) var(--sp-3);
    border-left: 2px solid var(--primary);
    background: var(--bg);
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }

  .scene-keys strong {
    display: block;
    margin-bottom: var(--sp-1);
    color: var(--text);
    font-size: var(--fs-sec);
  }

  .motion-question {
    position: absolute;
    inset: var(--sp-3) var(--sp-3) var(--sp-3) 53%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: auto;
    min-width: 0;
    padding: var(--sp-6);
    background: var(--bg);
    color: var(--primary);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: var(--lh-tight);
  }

  .motion-question .eyebrow {
    margin: 0 0 var(--sp-3);
    color: var(--primary);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: var(--lh-tight);
  }

  .motion-question .statement {
    max-width: 29ch;
    margin: 0;
    color: var(--text);
    font-size: 28px;
    font-weight: 620;
    line-height: var(--lh-tight);
  }

  .motion-question .bridge {
    max-width: 36ch;
    margin: var(--sp-4) 0 0;
    color: var(--text-muted);
    font-size: var(--fs-body);
    line-height: var(--lh-body);
  }

  .motion-question .bridge strong {
    color: var(--accent);
    font-weight: 650;
  }

  .question-rail {
    position: relative;
    flex: 0 0 224px;
    min-width: 0;
    padding-top: var(--sp-5);
  }

  .rail-line {
    position: absolute;
    top: 33px;
    right: 8px;
    left: 8px;
    height: 2px;
    background: var(--line);
  }

  .rail-line::after {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--primary);
    content: "";
    transform: scaleX(0);
    transform-origin: left center;
    animation: rail-grow 1.2s cubic-bezier(.22,.75,.25,1) 1.25s forwards;
  }

  .question-list {
    --enum-cols: 4;
    position: relative;
    z-index: 1;
  }

  .question-list > .it {
    position: relative;
    min-height: 176px;
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
    padding: var(--sp-6) var(--sp-5) var(--sp-5);
    border-color: var(--line);
    border-top-color: var(--primary);
    opacity: 1;
    transform: none;
    animation: item-arrive 540ms ease-out forwards;
  }

  .question-list > .it:nth-child(1) { animation-delay: 1.55s; }
  .question-list > .it:nth-child(2) { animation-delay: 2.05s; }
  .question-list > .it:nth-child(3) { animation-delay: 2.55s; }
  .question-list > .it:nth-child(4) { animation-delay: 3.05s; }

  .question-list > .it::before {
    position: absolute;
    top: -8px;
    left: var(--sp-5);
    width: 12px;
    height: 12px;
    border: 2px solid var(--primary);
    border-radius: 50%;
    background: var(--surface);
    content: "";
    animation: node-flash 700ms ease-out both;
  }

  .question-list > .it:nth-child(1)::before { animation-delay: 1.55s; }
  .question-list > .it:nth-child(2)::before { animation-delay: 2.05s; }
  .question-list > .it:nth-child(3)::before { animation-delay: 2.55s; }
  .question-list > .it:nth-child(4)::before { animation-delay: 3.05s; }

  .question-list > .it:first-child {
    animation-name: first-item-arrive;
    animation-duration: 3.2s;
  }

  .question-list > .it:first-child::before {
    border-color: var(--accent);
    background: var(--accent);
  }

  .question-list .icon {
    display: block;
    margin-bottom: var(--sp-3);
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: var(--lh-tight);
  }

  .question-list > .it:first-child .icon,
  .question-list > .it:first-child .it-title {
    color: var(--accent);
  }

  .question-list > .it > .it-title {
    font-size: var(--fs-lead);
  }

  .question-list > .it > .it-body {
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
  }

  @keyframes rail-grow { to { transform: scaleX(1); } }
  @keyframes item-arrive {
    0% { border-top-color: var(--primary); background: var(--surface); }
    45% { border-top-color: var(--accent); background: var(--accent-soft); }
    100% { border-top-color: var(--primary); background: var(--surface); }
  }
  @keyframes first-item-arrive {
    0% { opacity: 1; transform: none; border-top-color: var(--primary); }
    18%, 72% { opacity: 1; transform: none; border-top-color: var(--primary); }
    100% { opacity: 1; transform: none; border-color: var(--accent); background: var(--accent-soft); }
  }
  @keyframes node-flash {
    0% { background: var(--surface); box-shadow: none; }
    45% { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 18px var(--accent); }
    100% { background: var(--primary); box-shadow: none; }
  }

  .lec-progress {
    overflow: visible;
    appearance: none;
    -webkit-appearance: none;
  }

  .lec-progress::-webkit-progress-bar,
  .lec-progress::-webkit-progress-value {
    height: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .rail-line::after,
    .question-list > .it,
    .question-list > .it::before {
      animation: none !important;
    }
    .rail-line::after { transform: scaleX(1); }
    .question-list > .it { opacity: 1; transform: none; }
    .question-list > .it:first-child {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
  }
</style>
</head>
<body data-page="12" data-total="50">
<div id="stage">
<main id="main">
  <section class="motion-page" aria-labelledby="motion-prompt">
    <div class="motion-field min0">
      <figure class="orbit-figure min0" aria-label="静止的轨道位置开始变成持续运动的行星系统示意">
        <div class="orbit-canvas-wrap min0">
          <canvas id="orbit-scene" class="cv-fill" role="img" aria-label="五条轨道上的天体开始移动并留下短弧轨迹"></canvas>
        </div>
      </figure>
      <p class="snapshot-tag">“在哪里”只是一张瞬时快照</p>
      <ul class="scene-keys" aria-label="从快照中开始关注的运动线索">
        <li><strong>位置点</strong>某一瞬间</li>
        <li><strong>运动方向</strong>下一刻去向</li>
        <li><strong>短暂轨迹</strong>位置在改变</li>
      </ul>
      <div class="motion-question min0">
        从位置，转向运动
        <h2 class="statement" id="motion-prompt">一张地图，怎样变成持续运行的系统？</h2>
        <p class="bridge">接下来追问：<strong>太阳的引力</strong>与天体当下的<strong>速度</strong>，怎样共同塑造运动？</p>
      </div>
    </div>

    <section class="question-rail" aria-label="第二幕的四个并列问题">
      <div class="rail-line" aria-hidden="true"></div>
      <div class="k-enumeration question-list">
        <article class="it min0">
          天体与太阳
          <h3 class="it-title">进入轨道</h3>
          <p class="it-body">为什么没有落向太阳？</p>
        </article>
        <article class="it min0">
          同一条轨道
          <h3 class="it-title">速度变化</h3>
          <p class="it-body">为什么有时快、有时慢？</p>
        </article>
        <article class="it min0">
          自转与公转
          <h3 class="it-title">周期与季节</h3>
          <p class="it-body">日、年和季节分别由什么造成？</p>
        </article>
        <article class="it min0">
          地球与外行星
          <h3 class="it-title">会合与逆行</h3>
          <p class="it-body">为什么看起来会倒退？</p>
        </article>
      </div>
    </section>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Lec.mount({
    index: 12,
    kicker: "MOTION / 动起来",
    title: "它们为什么这样运动？",
    take: "从“东西在哪里”转向“它们为什么这样运动”"
  });

  (function () {
    var canvas = document.getElementById("orbit-scene");
    var planets = Lec.K.PLANETS.slice(0, 5);
    var radii = [70, 116, 164, 214, 270];
    var phases = [0.45, 2.1, 3.55, 4.8, 5.7];
    var bodies = planets.map(function (planet, i) {
      return { planet: planet, radius: radii[i], phase: phases[i] };
    });

    function point(item, meanAnomaly) {
      var pos = Lec.P.orbitPosition(item.planet.semimajorAU, item.planet.eccentricity, meanAnomaly);
      var scale = item.radius / item.planet.semimajorAU;
      return { x: pos.x * scale, y: pos.y * scale * 0.44 };
    }

    function draw(t) {
      var ctx = Deck.fit(canvas);
      var w = canvas.offsetWidth;
      var h = canvas.offsetHeight;
      var cx = w * 0.48;
      var cy = h * 0.53;
      var elapsed = Math.max(0, t - 1050);
      var reveal = Deck.reduced() ? 1 : Deck.clamp(t / 1500, 0, 1);
      ctx.clearRect(0, 0, w, h);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-0.14);

      bodies.forEach(function (item) {
        ctx.beginPath();
        ctx.ellipse(0, 0, item.radius, item.radius * 0.44, 0, 0, Math.PI * 2 * reveal);
        ctx.strokeStyle = Deck.rgba("--primary", 0.12);
        ctx.lineWidth = 18;
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(0, 0, item.radius, item.radius * 0.44, 0, 0, Math.PI * 2 * reveal);
        ctx.strokeStyle = Deck.rgba("--primary", 0.58);
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });

      bodies.forEach(function (item, i) {
        var cycle = 7600 + i * 1900;
        var mean = item.phase + elapsed / cycle * Math.PI * 2;
        var p = point(item, mean);
        var start = point(item, mean - 0.28);
        var j;

        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        for (j = 9; j >= 0; j -= 1) {
          var q = point(item, mean - j * 0.028);
          ctx.lineTo(q.x, q.y);
        }
        ctx.strokeStyle = Deck.rgba("--primary", 0.72);
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.stroke();

        var previous = point(item, mean - 0.035);
        Deck.arrow(ctx, previous.x, previous.y, p.x, p.y, 8);
        ctx.strokeStyle = Deck.rgba("--primary", 0.9);
        ctx.fillStyle = Deck.rgba("--primary", 0.9);
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fill();

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.beginPath();
        ctx.arc(0, 0, 9, 0, Math.PI * 2);
        ctx.fillStyle = Deck.rgba("--primary", 1);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(2, 0, 8, -Math.PI / 2, Math.PI / 2);
        ctx.fillStyle = Deck.rgba("--bg", 0.76);
        ctx.fill();
        ctx.restore();
      });

      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, Math.PI * 2);
      ctx.fillStyle = Deck.rgba("--accent", 0.14);
      ctx.fill();
      ctx.strokeStyle = Deck.rgba("--accent", 1);
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fillStyle = Deck.rgba("--accent", 1);
      ctx.fill();
      ctx.restore();
    }

    Deck.loop(draw, { still: 5200 });
    Deck.onResize(function () { draw(Deck.reduced() ? 5200 : 0); });
  }());
</script>
</body>
</html>
