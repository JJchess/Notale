<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .orbit-page {
    width: var(--content-w);
    height: var(--content-h);
    display: flex;
    gap: var(--sp-5);
  }

  .sim-wrap {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--surface-data);
  }

  .sim-wrap::before {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image:
      linear-gradient(rgb(79 195 215 / 5%) 1px, transparent 1px),
      linear-gradient(90deg, rgb(79 195 215 / 5%) 1px, transparent 1px);
    background-size: 40px 40px;
    content: "";
  }

  #orbit-canvas { z-index: 1; }

  .sim-heading,
  .telemetry-bar,
  .gravity-tag,
  .control-dock,
  .feedback {
    position: absolute;
    z-index: 3;
  }

  .sim-heading {
    top: var(--sp-4);
    left: var(--sp-5);
  }

  .sim-heading h2 { margin-bottom: var(--sp-1); }

  .telemetry-bar {
    top: var(--sp-4);
    right: var(--sp-4);
    display: flex;
    gap: var(--sp-2);
  }

  .telemetry-chip {
    min-width: 132px;
    padding: var(--sp-2) var(--sp-3);
    border-left: 2px solid var(--primary);
    background: rgb(7 16 24 / 82%);
  }

  .telemetry-chip .value {
    display: block;
    margin-top: var(--sp-1);
    color: var(--text);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
  }

  .gravity-tag {
    left: 422px;
    top: 350px;
    padding: var(--sp-1) var(--sp-2);
    border: 1px solid var(--primary-line);
    background: rgb(7 16 24 / 84%);
    color: var(--primary);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
    pointer-events: none;
  }

  .control-dock {
    right: var(--sp-4);
    bottom: var(--sp-4);
    left: var(--sp-4);
    display: flex;
    align-items: end;
    gap: var(--sp-4);
    padding: var(--sp-3) var(--sp-4);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: rgb(7 16 24 / 92%);
  }

  .launch-control {
    display: flex;
    flex: 1 1 auto;
    min-width: 0;
    align-items: center;
    gap: var(--sp-3);
  }

  #launch-btn {
    width: 164px;
    min-height: 54px;
    flex: 0 0 auto;
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: var(--fs-sec);
    touch-action: none;
    user-select: none;
  }

  #launch-btn.is-charging { background: rgb(255 209 102 / 24%); }

  .power-zone {
    flex: 1 1 auto;
    min-width: 0;
  }

  .power-labels {
    display: flex;
    justify-content: space-between;
    margin-bottom: var(--sp-2);
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }

  .power-track {
    position: relative;
    height: 14px;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    background: var(--surface);
  }

  .power-fill {
    width: 0;
    height: 100%;
    background: var(--primary);
    transition: width 80ms linear;
  }

  .orbit-window {
    position: absolute;
    top: 0;
    right: 0;
    width: 18%;
    height: 100%;
    border-left: 2px solid var(--accent);
    background: var(--accent-soft);
  }

  .reset-btn {
    width: 48px;
    min-width: 48px;
    height: 48px;
    padding: 0;
    font-size: 25px;
  }

  .feedback {
    left: 50%;
    bottom: 106px;
    width: 620px;
    padding: var(--sp-3) var(--sp-4);
    border: 1px solid var(--accent);
    background: rgb(7 16 24 / 94%);
    color: var(--text);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
    text-align: center;
    transform: translateX(-50%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 220ms ease-out, transform 220ms ease-out;
  }

  .feedback.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }

  .feedback.success {
    border-color: var(--primary);
    color: var(--text);
    font-size: var(--fs-lead);
    font-weight: 650;
  }

  .feedback.fail { animation: short-shake 240ms ease-out; }

  .process-pane {
    width: 390px;
    flex: 0 0 390px;
    min-width: 0;
    padding: var(--sp-4);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--surface);
  }

  .process-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: var(--sp-3);
  }

  #process-count {
    color: var(--accent);
    font-size: var(--fs-sec);
  }

  .process-flow.k-process {
    --process-line-y: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    height: 510px;
    padding-left: var(--sp-3);
  }

  .process-flow.k-process > .axis {
    top: var(--sp-5);
    right: auto;
    bottom: 34px;
    left: 29px;
    width: 2px;
    height: auto;
    transform: none;
  }

  .process-flow.k-process > .step {
    flex: 0 0 auto;
    min-height: 70px;
    padding: var(--sp-3) var(--sp-3) var(--sp-3) 42px;
    border-color: var(--line);
    background: var(--surface-data);
    transition: border-color 220ms ease-out, background 220ms ease-out, opacity 220ms ease-out;
  }

  .process-flow.k-process > .step::before {
    top: 25px;
    left: 16px;
  }

  .process-flow .step-title {
    display: block;
    color: var(--text);
    font-size: var(--fs-sec);
    font-weight: 650;
    line-height: var(--lh-tight);
  }

  .process-flow .step-text {
    display: block;
    margin-top: var(--sp-1);
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
  }

  .process-flow.k-process > .arw {
    flex: 0 0 18px;
    min-height: 18px;
    margin-left: 17px;
    align-self: flex-start;
    font-size: var(--fs-sec);
    line-height: 18px;
    transition: color 220ms ease-out;
  }

  .process-flow.k-process > .arw::before { content: "↓"; }
  .process-flow.k-process > .arw.is-on { color: var(--accent); }

  .process-flow.k-process > .step.is-done {
    opacity: .72;
    filter: saturate(.65);
  }

  .loop-back {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    min-height: 40px;
    margin-top: var(--sp-2);
    padding-left: var(--sp-2);
    border-left: 2px solid var(--primary);
    border-bottom: 2px solid var(--primary);
    color: var(--primary);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: var(--lh-tight);
  }

  .loop-back .return-arrow { font-size: var(--fs-h2); }

  @keyframes short-shake {
    0%, 100% { transform: translateX(-50%); }
    30% { transform: translateX(calc(-50% - 7px)); }
    65% { transform: translateX(calc(-50% + 7px)); }
  }

  progress.lec-progress {
    display: block;
    appearance: none;
    -webkit-appearance: none;
    padding: 0;
    border: 0;
    overflow: visible;
    line-height: 0;
  }

  progress.lec-progress::-webkit-progress-bar,
  progress.lec-progress::-webkit-progress-value {
    height: 2px;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 1ms !important;
      transition-duration: 1ms !important;
    }
  }
</style>
</head>
<body data-page="13" data-total="50">
<div id="stage">
<main id="main">
  <section class="orbit-page row min0" aria-label="牛顿炮弹轨道模拟">
    <div class="sim-wrap min0 no-pan" id="sim-wrap">
      <canvas id="orbit-canvas" class="cv-fill" aria-hidden="true"></canvas>
      <div class="sim-heading">
        <h2>水平前进 + 向地心下落</h2>
        <div class="secondary">观察同一时间间隔内，速度方向怎样连续偏转。</div>
      </div>
      <div class="telemetry-bar" aria-live="polite">
        <div class="telemetry-chip">
          <span class="label">发射速度</span>
          <span class="value" id="speed-readout">待蓄力</span>
        </div>
        <div class="telemetry-chip">
          <span class="label">当前状态</span>
          <span class="value" id="state-readout">炮口就绪</span>
        </div>
      </div>
      <div class="gravity-tag">引力始终指向地心</div>
      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      <div class="control-dock">
        <div class="launch-control ctl">
          <button id="launch-btn" type="button" aria-label="按住发射杆；按住空格或回车蓄力，松开后发射">按住发射杆</button>
          <div class="power-zone">
            <div class="power-labels"><span>低</span><span id="power-value">蓄力 0%</span><span>轨道窗口</span></div>
            <div class="power-track" aria-hidden="true">
              <div class="power-fill" id="power-fill"></div>
              <div class="orbit-window"></div>
            </div>
          </div>
        </div>
        <button class="reset-btn" id="reset-btn" type="button" title="重置模拟" aria-label="重置模拟">↻</button>
      </div>
    </div>

    <aside class="process-pane min0" aria-label="形成轨道的五个连续事件">
      <div class="process-head">
        <h2>持续自由落体</h2>
        <span class="mono" id="process-count">过程 1/5</span>
      </div>
      <div class="k-process process-flow" id="process-flow">
        <span class="axis" aria-hidden="true"></span>
        <div class="step is-current" data-step="1" aria-current="step">
          <span class="step-title">1　水平发射</span>
          <span class="step-text">炮弹获得沿地表切线方向的速度。</span>
        </div>
        <span class="arw" aria-hidden="true"></span>
        <div class="step" data-step="2">
          <span class="step-title">2　引力拉拽</span>
          <span class="step-text">离开炮口后，引力始终指向地心。</span>
        </div>
        <span class="arw" aria-hidden="true"></span>
        <div class="step" data-step="3">
          <span class="step-title">3　方向偏转</span>
          <span class="step-text">速度方向连续改变，轨迹随之弯曲。</span>
        </div>
        <span class="arw" aria-hidden="true"></span>
        <div class="step" data-step="4">
          <span class="step-title">4　地面弯离</span>
          <span class="step-text">球形地面也沿前进方向向下弯去。</span>
        </div>
        <span class="arw" aria-hidden="true"></span>
        <div class="step" data-step="5">
          <span class="step-title">5　反复错过</span>
          <span class="step-text">两种弯曲配合，炮弹不再触地。</span>
        </div>
        <div class="loop-back"><span class="return-arrow">↵</span><span>轨迹闭合，回到起点继续下落</span></div>
      </div>
    </aside>
  </section>
</main>
</div>
<script src="assets/lib/matter.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 13,
  kicker: "ORBIT AS FALL",
  title: "炮弹没有停止下落，它只是不断错过地面",
  take: "轨道不是“没有重力”，而是在引力中持续自由落体，并不断错过弯曲的地面。"
});

(function () {
  var Engine = Matter.Engine;
  var Bodies = Matter.Bodies;
  var Body = Matter.Body;
  var Composite = Matter.Composite;
  var engine = Engine.create({ gravity: { x: 0, y: 0, scale: 0 } });
  engine.gravity.scale = 0;

  var canvas = document.getElementById('orbit-canvas');
  var simWrap = document.getElementById('sim-wrap');
  var launchBtn = document.getElementById('launch-btn');
  var resetBtn = document.getElementById('reset-btn');
  var powerFill = document.getElementById('power-fill');
  var powerValue = document.getElementById('power-value');
  var speedReadout = document.getElementById('speed-readout');
  var stateReadout = document.getElementById('state-readout');
  var feedback = document.getElementById('feedback');
  var processCount = document.getElementById('process-count');
  var steps = Array.prototype.slice.call(document.querySelectorAll('.process-flow .step'));
  var arrows = Array.prototype.slice.call(document.querySelectorAll('.process-flow .arw'));

  var earth = Lec.K.EARTH;
  var physics = Lec.K.PHYSICS;
  var earthRadiusM = earth.RADIUS_KM * 1000;
  var launchRadiusM = earthRadiusM * 1.08;
  var orbitSpeed = Lec.P.orbitalSpeed(launchRadiusM, earth.MASS_KG);
  var visual = { cx: 458, cy: 362, earthR: 205 };
  var launchAngle = -1.98;
  var visualOrbitR = Lec.P.scaleValue(launchRadiusM, earthRadiusM, visual.earthR);
  var meterToPx = visualOrbitR / launchRadiusM;
  var timeScale = 1020;
  var projectile = null;
  var phase = 'ready';
  var charging = false;
  var charge = 0;
  var chargeDir = 1;
  var currentStep = 1;
  var elapsed = 0;
  var angularTravel = 0;
  var lastAngle = launchAngle;
  var trail = [];
  var ghosts = [];
  var ghostClock = 0;
  var impact = null;
  var impactLife = 0;
  var successGlow = 0;
  var ctx = Deck.fit(canvas);

  function worldPoint(angle, radiusM) {
    return {
      x: visual.cx + Math.cos(angle) * radiusM * meterToPx,
      y: visual.cy + Math.sin(angle) * radiusM * meterToPx
    };
  }

  function launchPoint() {
    return worldPoint(launchAngle, launchRadiusM);
  }

  function setProcess(step) {
    currentStep = Math.max(1, Math.min(5, step));
    processCount.textContent = '过程 ' + currentStep + '/5';
    steps.forEach(function (node, index) {
      var n = index + 1;
      node.classList.toggle('is-done', n < currentStep);
      node.classList.toggle('is-current', n === currentStep);
      if (n === currentStep) node.setAttribute('aria-current', 'step');
      else node.removeAttribute('aria-current');
    });
    arrows.forEach(function (node, index) {
      node.classList.toggle('is-on', index < currentStep - 1);
    });
  }

  function showFeedback(text, kind) {
    feedback.textContent = text;
    feedback.className = 'feedback show ' + kind;
  }

  function clearFeedback() {
    feedback.textContent = '';
    feedback.className = 'feedback';
  }

  function reset() {
    if (projectile) Composite.remove(engine.world, projectile);
    projectile = null;
    phase = 'ready';
    charging = false;
    charge = 0;
    chargeDir = 1;
    elapsed = 0;
    angularTravel = 0;
    lastAngle = launchAngle;
    trail = [];
    ghosts = [];
    impact = null;
    impactLife = 0;
    successGlow = 0;
    powerFill.style.width = '0%';
    powerValue.textContent = '蓄力 0%';
    speedReadout.textContent = '待蓄力';
    stateReadout.textContent = '炮口就绪';
    launchBtn.disabled = false;
    launchBtn.classList.remove('is-charging');
    launchBtn.textContent = '按住发射杆';
    clearFeedback();
    setProcess(1);
    draw();
  }

  function beginCharge(e) {
    if (phase !== 'ready') return;
    if (e && e.type === 'pointerdown') launchBtn.setPointerCapture(e.pointerId);
    if (Deck.reduced()) {
      charge = 1;
      powerFill.style.width = '100%';
      powerValue.textContent = '蓄力 100%';
    }
    charging = true;
    launchBtn.classList.add('is-charging');
    launchBtn.textContent = '蓄力中…松开发射';
    stateReadout.textContent = '水平速度增加';
  }

  function releaseCharge() {
    if (!charging || phase !== 'ready') return;
    charging = false;
    launchBtn.classList.remove('is-charging');
    fire();
    if (Deck.reduced()) showReducedConclusion();
  }

  function showReducedConclusion() {
    var start = launchPoint();
    trail = [];
    for (var i = 0; i <= 96; i += 1) {
      var a = launchAngle + Math.PI * 2 * i / 96;
      var p = worldPoint(a, launchRadiusM);
      trail.push({ x: p.x, y: p.y, step: Math.min(5, 1 + Math.floor(i / 20)) });
    }
    if (projectile) Body.setPosition(projectile, start);
    phase = 'orbit';
    stateReadout.textContent = '闭合轨道';
    launchBtn.disabled = true;
    launchBtn.textContent = '轨道已闭合';
    setProcess(5);
    showFeedback('轨道不是“没有重力”，而是在引力中持续自由落体，并不断错过弯曲的地面。', 'success');
    draw();
  }

  function fire() {
    var speedFactor = 0.74 + charge * 0.26;
    var speed = orbitSpeed * speedFactor;
    var start = launchPoint();
    var tangent = { x: -Math.sin(launchAngle), y: Math.cos(launchAngle) };
    var visualSpeed = speed * meterToPx * timeScale / 60;

    projectile = Bodies.circle(start.x, start.y, 6, {
      frictionAir: 0,
      friction: 0,
      restitution: 0,
      inertia: Infinity,
      density: 0.001
    });
    Body.setVelocity(projectile, { x: tangent.x * visualSpeed, y: tangent.y * visualSpeed });
    Composite.add(engine.world, projectile);
    phase = 'flight';
    elapsed = 0;
    trail = [{ x: start.x, y: start.y, step: 1 }];
    ghosts = [];
    speedReadout.textContent = Lec.P.significant(speed / 1000, 3) + ' km/s';
    stateReadout.textContent = '向前，同时下落';
    launchBtn.disabled = true;
    launchBtn.textContent = '飞行中';
    setProcess(1);
  }

  function fail() {
    phase = 'failed';
    impact = { x: projectile.position.x, y: projectile.position.y };
    impactLife = 1;
    Body.setVelocity(projectile, { x: 0, y: 0 });
    Body.setStatic(projectile, true);
    stateReadout.textContent = '撞上地面';
    showFeedback('仍撞上地面：地面弯离得还不够快，请让水平位移更大。', 'fail');
    setProcess(Math.max(currentStep, 4));
  }

  function succeed() {
    phase = 'orbit';
    successGlow = 1;
    stateReadout.textContent = '闭合轨道';
    showFeedback('轨道不是“没有重力”，而是在引力中持续自由落体，并不断错过弯曲的地面。', 'success');
    setProcess(5);
  }

  function updatePhysics(dtMs) {
    if (!projectile || (phase !== 'flight' && phase !== 'orbit')) return;
    var dx = visual.cx - projectile.position.x;
    var dy = visual.cy - projectile.position.y;
    var radiusPx = Math.sqrt(dx * dx + dy * dy);
    var radiusM = radiusPx / meterToPx;
    var accelPhysical = physics.G * earth.MASS_KG / (radiusM * radiusM);
    var accelVisual = accelPhysical * meterToPx * timeScale * timeScale / 3600;
    var inv = 1 / Math.max(radiusPx, 1);
    var forceScale = projectile.mass * accelVisual;
    Body.applyForce(projectile, projectile.position, {
      x: dx * inv * forceScale,
      y: dy * inv * forceScale
    });
    Engine.update(engine, Math.min(dtMs, 24));

    elapsed += dtMs;
    ghostClock += dtMs;
    var p = projectile.position;
    var angle = Math.atan2(p.y - visual.cy, p.x - visual.cx);
    var delta = angle - lastAngle;
    if (delta > Math.PI) delta -= Math.PI * 2;
    if (delta < -Math.PI) delta += Math.PI * 2;
    angularTravel += Math.abs(delta);
    lastAngle = angle;

    trail.push({ x: p.x, y: p.y, step: currentStep });
    if (trail.length > 900) trail.shift();
    if (ghostClock >= 520) {
      ghostClock = 0;
      ghosts.push({ x: p.x, y: p.y, vx: projectile.velocity.x, vy: projectile.velocity.y });
      if (ghosts.length > 9) ghosts.shift();
    }

    var progress = Math.min(1, angularTravel / (Math.PI * 2));
    setProcess(Math.min(5, 1 + Math.floor(progress * 5)));

    if (radiusPx <= visual.earthR + 4) {
      fail();
    } else if (phase === 'flight' && angularTravel >= Math.PI * 1.92) {
      succeed();
    }
  }

  function drawEarth(c) {
    var g = c.createLinearGradient(visual.cx - visual.earthR, visual.cy, visual.cx + visual.earthR, visual.cy);
    g.addColorStop(0, Deck.rgba('--primary', .42));
    g.addColorStop(.48, '#20313b');
    g.addColorStop(.58, '#17252e');
    g.addColorStop(1, '#081119');
    c.save();
    c.beginPath();
    c.arc(visual.cx, visual.cy, visual.earthR, 0, Math.PI * 2);
    c.fillStyle = g;
    c.fill();
    c.lineWidth = 2;
    c.strokeStyle = Deck.rgba('--primary', .55);
    c.stroke();
    c.beginPath();
    c.arc(visual.cx - 25, visual.cy, visual.earthR * .94, -Math.PI / 2, Math.PI / 2);
    c.strokeStyle = Deck.rgba('--primary', .16);
    c.stroke();
    c.restore();
  }

  function drawCannon(c) {
    var p = launchPoint();
    var tangent = { x: -Math.sin(launchAngle), y: Math.cos(launchAngle) };
    var normal = { x: Math.cos(launchAngle), y: Math.sin(launchAngle) };
    c.save();
    c.translate(p.x, p.y);
    c.rotate(Math.atan2(tangent.y, tangent.x));
    c.fillStyle = Deck.rgba('--accent', .92);
    c.fillRect(-24, -7, 40, 14);
    c.fillStyle = Deck.rgba('--text', .72);
    c.beginPath();
    c.moveTo(-18, 8);
    c.lineTo(-30, 22);
    c.lineTo(2, 16);
    c.closePath();
    c.fill();
    c.restore();
    c.beginPath();
    c.moveTo(p.x - normal.x * 2, p.y - normal.y * 2);
    c.lineTo(visual.cx, visual.cy);
    c.setLineDash([5, 7]);
    c.strokeStyle = Deck.rgba('--primary', .22);
    c.stroke();
    c.setLineDash([]);
  }

  function drawTrail(c) {
    if (trail.length < 2) return;
    c.save();
    c.beginPath();
    c.moveTo(trail[0].x, trail[0].y);
    for (var i = 1; i < trail.length; i += 1) c.lineTo(trail[i].x, trail[i].y);
    c.lineWidth = phase === 'orbit' ? 4 : 2;
    c.strokeStyle = Deck.rgba('--primary', phase === 'orbit' ? .92 : .7);
    c.shadowColor = Deck.rgba('--primary', .8);
    c.shadowBlur = phase === 'orbit' ? 13 : 5;
    c.stroke();
    c.restore();
  }

  function drawVectors(c) {
    ghosts.forEach(function (g, index) {
      var alpha = .18 + index / Math.max(ghosts.length, 1) * .38;
      var speed = Math.sqrt(g.vx * g.vx + g.vy * g.vy) || 1;
      var len = 34;
      c.fillStyle = Deck.rgba('--text', alpha);
      c.beginPath();
      c.arc(g.x, g.y, 4, 0, Math.PI * 2);
      c.fill();
      c.strokeStyle = Deck.rgba('--primary', alpha);
      c.lineWidth = 1.5;
      Deck.arrow(c, g.x, g.y, g.x + g.vx / speed * len, g.y + g.vy / speed * len, 6);
      c.stroke();
    });

    if (!projectile || phase === 'failed') return;
    var p = projectile.position;
    var v = projectile.velocity;
    var mag = Math.sqrt(v.x * v.x + v.y * v.y) || 1;
    c.strokeStyle = Deck.rgba('--accent', .92);
    c.lineWidth = 2;
    Deck.arrow(c, p.x, p.y, p.x + v.x / mag * 54, p.y + v.y / mag * 54, 8);
    c.stroke();
    c.strokeStyle = Deck.rgba('--primary', .55);
    c.setLineDash([5, 5]);
    Deck.arrow(c, p.x, p.y, p.x + (visual.cx - p.x) * .34, p.y + (visual.cy - p.y) * .34, 7);
    c.stroke();
    c.setLineDash([]);
  }

  function drawProjectile(c) {
    var p = projectile ? projectile.position : launchPoint();
    c.save();
    c.beginPath();
    c.arc(p.x, p.y, phase === 'orbit' ? 8 : 7, 0, Math.PI * 2);
    c.fillStyle = Deck.rgba('--text', .95);
    c.fill();
    c.lineWidth = 3;
    c.strokeStyle = Deck.rgba('--accent', 1);
    c.shadowColor = Deck.rgba('--accent', .85);
    c.shadowBlur = 10;
    c.stroke();
    c.restore();
  }

  function drawImpact(c) {
    if (!impact || impactLife <= 0) return;
    c.save();
    c.beginPath();
    c.arc(impact.x, impact.y, 12 + (1 - impactLife) * 28, 0, Math.PI * 2);
    c.strokeStyle = Deck.rgba('--accent', impactLife);
    c.lineWidth = 3;
    c.stroke();
    c.restore();
  }

  function draw() {
    ctx = Deck.fit(canvas);
    var w = simWrap.clientWidth;
    var h = simWrap.clientHeight;
    ctx.clearRect(0, 0, w, h);

    ctx.save();
    ctx.beginPath();
    ctx.arc(visual.cx, visual.cy, visualOrbitR, 0, Math.PI * 2);
    ctx.strokeStyle = Deck.rgba('--primary', phase === 'orbit' ? .42 : .15);
    ctx.lineWidth = 1;
    ctx.setLineDash([8, 10]);
    ctx.stroke();
    ctx.restore();

    drawEarth(ctx);
    drawTrail(ctx);
    drawCannon(ctx);
    drawVectors(ctx);
    drawProjectile(ctx);
    drawImpact(ctx);
  }

  function tick(t, dt) {
    if (charging) {
      charge += chargeDir * dt / 1900;
      if (charge >= 1) { charge = 1; chargeDir = -1; }
      if (charge <= 0) { charge = 0; chargeDir = 1; }
      var pct = Math.round(charge * 100);
      powerFill.style.width = pct + '%';
      powerValue.textContent = '蓄力 ' + pct + '%';
      speedReadout.textContent = Lec.P.significant((orbitSpeed * (.74 + charge * .26)) / 1000, 3) + ' km/s';
    }
    updatePhysics(dt);
    if (impactLife > 0) impactLife = Math.max(0, impactLife - dt / 650);
    draw();
  }

  launchBtn.addEventListener('pointerdown', beginCharge);
  launchBtn.addEventListener('pointerup', releaseCharge);
  launchBtn.addEventListener('pointercancel', releaseCharge);
  launchBtn.addEventListener('keydown', function (e) {
    if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) {
      e.preventDefault();
      beginCharge(e);
    }
  });
  launchBtn.addEventListener('keyup', function (e) {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      releaseCharge();
    }
  });
  resetBtn.addEventListener('click', reset);
  Deck.onResize(draw);

  reset();
  if (Deck.reduced()) {
    charge = 1;
    powerFill.style.width = '100%';
    powerValue.textContent = '蓄力 100%';
    speedReadout.textContent = Lec.P.significant(orbitSpeed / 1000, 3) + ' km/s';
    showReducedConclusion();
  }
  Deck.loop(tick, { still: 1 });
}());
</script>
</body>
</html>
