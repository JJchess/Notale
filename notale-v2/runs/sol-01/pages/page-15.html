<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p15-page {
    --support-cols: 3;
    width: var(--content-w);
    height: var(--content-h);
  }

  .p15-page.k-generalization {
    grid-template-rows: 66px 1fr;
    gap: var(--sp-3);
  }

  .p15-page.k-generalization > .claim {
    width: 100%;
    max-width: none;
    padding: var(--sp-3) var(--sp-5);
  }

  .p15-page.k-generalization > .trunk {
    top: 54px;
  }

  .p15-page.k-generalization > .supports {
    grid-template-rows: 326px 164px;
    gap: var(--sp-3) var(--sp-4);
    padding-top: var(--sp-4);
  }

  .p15-page.k-generalization > .supports::before {
    top: var(--sp-4);
  }

  .relation-map {
    position: absolute;
    z-index: 0;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .p15-page .support {
    z-index: 1;
  }

  .lec-progress {
    background: linear-gradient(90deg, var(--primary) var(--progress, 0%), var(--line) 0);
  }

  .lec-progress::before,
  .lec-progress > * {
    display: none !important;
  }

  .p15-page .support {
    padding: var(--sp-4);
    overflow: hidden;
  }

  .orbit-support {
    grid-column: 1 / 3;
  }

  .control-support {
    grid-column: 3;
  }

  .curve-support {
    grid-column: 1 / -1;
  }

  .support-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--sp-4);
    height: 30px;
    color: var(--text);
    font-size: var(--fs-h2);
    font-weight: 650;
    line-height: var(--lh-tight);
  }

  .support-heading .label {
    font-weight: 600;
  }

  .orbit-wrap {
    position: relative;
    height: 260px;
  }

  .orbit-svg,
  .curve-svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .orbit-tag {
    position: absolute;
    top: 52px;
    left: 18px;
    padding: var(--sp-2) var(--sp-3);
    border-left: 2px solid var(--primary);
    background: rgb(7 16 24 / 82%);
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }

  .orbit-tag strong {
    display: block;
    margin-top: var(--sp-1);
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: var(--fs-sec);
  }

  .measure-stack {
    position: absolute;
    top: 128px;
    left: 18px;
    width: 222px;
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
  }

  .measure-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 34px;
    padding: var(--sp-1) var(--sp-3);
    border-left: 2px solid var(--primary-line);
    background: var(--surface);
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }

  .measure-row strong {
    color: var(--text);
    font-family: var(--font-mono);
    font-size: var(--fs-sec);
  }

  .measure-row.is-current {
    border-left-color: var(--accent);
    background: var(--accent-soft);
  }

  .measure-row.is-current strong {
    color: var(--accent);
  }

  .control-support {
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }

  .control-support .ctl {
    display: block;
    min-height: 76px;
  }

  .range-head,
  .range-scale,
  .progress-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-3);
  }

  .range-head {
    margin-bottom: var(--sp-2);
  }

  .range-head output {
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: var(--fs-sec);
    font-weight: 650;
  }

  .range-scale {
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-tick);
  }

  #mass-slider {
    min-height: 28px;
    cursor: pointer;
  }

  .compact-readouts {
    display: flex;
    gap: var(--sp-2);
  }

  .compact-readouts .readout {
    flex: 1 1 0;
    padding: var(--sp-3);
    gap: var(--sp-1);
  }

  .compact-readouts .readout .value {
    font-size: var(--fs-sec);
  }

  .task-line {
    min-height: 48px;
    padding: var(--sp-2) var(--sp-3);
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    color: var(--text);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
  }

  .progress-head {
    min-height: 44px;
  }

  .nodes {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
  }

  .node {
    display: grid;
    width: 30px;
    height: 30px;
    place-items: center;
    border: 2px solid var(--primary);
    border-radius: 50%;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-tick);
    line-height: 1;
  }

  .node.is-done {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--bg);
  }

  .reset-button {
    width: 44px;
    min-width: 44px;
    padding: 0;
    font-size: 24px;
  }

  .curve-support {
    display: grid;
    grid-template-columns: 244px minmax(0, 1fr);
    gap: var(--sp-4);
    align-items: stretch;
  }

  .curve-copy {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: var(--sp-2);
    padding: var(--sp-3);
    border-left: 3px solid var(--primary);
    background: var(--primary-soft);
  }

  .curve-copy h2 {
    font-size: var(--fs-h2);
  }

  .curve-copy p {
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
  }

  .curve-plot {
    position: relative;
    min-width: 0;
    min-height: 0;
  }

  .axis text {
    fill: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-tick);
  }

  .axis path,
  .axis line {
    stroke: var(--line-strong);
  }

  .axis-title {
    fill: var(--text-muted);
    font-family: var(--font-sans);
    font-size: var(--fs-label);
    font-weight: 600;
  }

  .verified-label {
    fill: var(--text);
    font-family: var(--font-mono);
    font-size: var(--fs-tick);
  }

  @media (prefers-reduced-motion: reduce) {
    .orbit-trail {
      display: none;
    }
  }
</style>
</head>
<body data-page="15" data-total="50">
<div id="stage">
<main id="main">
  <section class="p15-page k-generalization" aria-labelledby="main-claim">
    <div class="claim" id="main-claim">在相同轨道距离上，中心天体越重，维持稳定轨道所需的速度越高。</div>
    <div class="trunk" aria-hidden="true"></div>
    <div class="supports">
      <svg class="relation-map" viewBox="0 0 1408 506" aria-hidden="true">
        <path d="M704 0 V24 M230 24 H1178 M230 24 V318 M704 24 V318 M1178 24 V318" fill="none" stroke="var(--primary-line)" stroke-width="12" opacity="0.16"/>
        <path d="M230 318 H1178" fill="none" stroke="var(--primary-line)" stroke-width="22" opacity="0.10"/>
      </svg>
      <section class="support orbit-support min0" aria-labelledby="orbit-heading">
        <div class="support-heading">
          <span id="orbit-heading">固定轨道半径</span>
          <span class="label">只改变中心质量</span>
        </div>
        <div class="orbit-wrap min0">
          <svg id="orbit-svg" class="orbit-svg" viewBox="0 0 850 260" role="img" aria-label="固定为一个天文单位的圆轨道，中心质量改变时轨道光点与切向速度箭头同步改变">
            <title>固定半径轨道实验台</title>
            <desc>轨道半径始终不变。中心天体质量越大，光点运动越快，切向速度箭头越长。</desc>
          </svg>
          <div class="orbit-tag">控制条件<strong id="radius-tag">1 AU · 不变</strong></div>
          <div class="measure-stack" aria-label="轨道实验的三个测量量">
            <div class="measure-row"><span>测试体质量</span><strong id="orbit-test">—</strong></div>
            <div class="measure-row"><span>中心质量</span><strong id="orbit-mass">—</strong></div>
            <div class="measure-row is-current"><span>稳定速度</span><strong id="orbit-speed">—</strong></div>
          </div>
        </div>
      </section>

      <section class="support control-support min0" aria-labelledby="control-heading">
        <div class="support-heading">
          <span id="control-heading">改变中心质量</span>
          <span class="label">三轮验证</span>
        </div>
        <div class="ctl">
          <div class="range-head">
            <label for="mass-slider">中心质量</label>
            <output id="mass-output" for="mass-slider">1.00 × 太阳</output>
          </div>
          <input id="mass-slider" type="range" min="0.5" max="3" step="0.05" value="1" aria-describedby="task-line">
          <div class="range-scale" aria-hidden="true"><span>0.5×</span><span>1.0×</span><span>2.0×</span><span>3.0×</span></div>
        </div>
        <div class="compact-readouts">
          <div class="readout is-current">
            <span class="name">稳定速度</span>
            <span class="value" id="speed-output">—</span>
          </div>
          <div class="readout">
            <span class="name">测试体</span>
            <span class="value" id="test-output">—</span>
          </div>
        </div>
        <div class="task-line" id="task-line" aria-live="polite">第 1 轮：把中心质量增至 1.50 倍附近。</div>
        <div class="progress-head">
          <div>
            <div class="label" id="progress-label">关系验证 0/3</div>
            <div class="nodes" aria-hidden="true">
              <span class="node">1</span><span class="node">2</span><span class="node">3</span>
            </div>
          </div>
          <button class="reset-button" id="reset-button" type="button" title="重置三轮验证" aria-label="重置三轮验证">↻</button>
        </div>
      </section>

      <section class="support curve-support min0" aria-labelledby="curve-heading">
        <div class="curve-copy">
          <h2 id="curve-heading">三个状态，同一关系</h2>
          <p>各点来自同一固定距离。已验证状态会留在曲线上。</p>
        </div>
        <div class="curve-plot min0">
          <svg id="curve-svg" class="curve-svg" viewBox="0 0 1080 154" role="img" aria-label="中心质量与稳定轨道速度的上升关系曲线">
            <title>中心质量与稳定轨道速度</title>
            <desc>横轴是太阳质量倍数，纵轴是固定一个天文单位处的稳定轨道速度。曲线随中心质量上升。</desc>
          </svg>
        </div>
      </section>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 15,
  kicker: "ORBIT / 中心质量",
  title: "更重的中心，更快的轨道",
  take: "在相同轨道距离上，中心天体越重，维持稳定轨道所需的速度越高。"
});

(function () {
  'use strict';

  var sunMass = Lec.K.SUN.massKg;
  var earthMass = Lec.K.EARTH.MASS_KG;
  var radiusM = Lec.K.UNITS.M_PER_AU;
  var earthMasses = Lec.P.ratio(earthMass, Lec.K.EARTH.MASS_KG);
  var targets = [1.5, 2.5, 0.75];
  var taskDirections = [1, 1, -1];
  var verified = [];
  var taskIndex = 0;
  var validRatio = 1;
  var currentRatio = 1;
  var angle = -0.55;
  var reduced = Deck.reduced();

  var slider = document.getElementById('mass-slider');
  var massOutput = document.getElementById('mass-output');
  var speedOutput = document.getElementById('speed-output');
  var testOutput = document.getElementById('test-output');
  var orbitTest = document.getElementById('orbit-test');
  var orbitMass = document.getElementById('orbit-mass');
  var orbitSpeed = document.getElementById('orbit-speed');
  var taskLine = document.getElementById('task-line');
  var progressLabel = document.getElementById('progress-label');
  var resetButton = document.getElementById('reset-button');
  var nodes = Array.prototype.slice.call(document.querySelectorAll('.node'));
  var claim = document.getElementById('main-claim');

  var orbitSvg = d3.select('#orbit-svg');
  var curveSvg = d3.select('#curve-svg');
  var orbitCenter = { x: 468, y: 124 };
  var orbitRadius = 92;

  var defs = orbitSvg.append('defs');
  defs.append('radialGradient').attr('id', 'star-glow')
    .selectAll('stop').data([
      { o: '0%', c: 'var(--accent)', a: 1 },
      { o: '52%', c: 'var(--accent)', a: 0.72 },
      { o: '100%', c: 'var(--accent)', a: 0 }
    ]).join('stop')
    .attr('offset', function (d) { return d.o; })
    .attr('stop-color', function (d) { return d.c; })
    .attr('stop-opacity', function (d) { return d.a; });
  defs.append('marker').attr('id', 'arrowhead').attr('viewBox', '0 0 10 10')
    .attr('refX', 8).attr('refY', 5).attr('markerWidth', 7).attr('markerHeight', 7).attr('orient', 'auto-start-reverse')
    .append('path').attr('d', 'M 0 0 L 10 5 L 0 10 z').attr('fill', 'var(--accent)');

  var orbitGroup = orbitSvg.append('g');
  orbitGroup.append('circle').attr('cx', orbitCenter.x).attr('cy', orbitCenter.y).attr('r', orbitRadius)
    .attr('fill', 'var(--primary-soft)').attr('stroke', 'none');
  var radiusLine = orbitGroup.append('line').attr('class', 'measure-line')
    .attr('x1', orbitCenter.x).attr('y1', orbitCenter.y)
    .attr('x2', orbitCenter.x + orbitRadius).attr('y2', orbitCenter.y);
  orbitGroup.append('line').attr('class', 'measure-line')
    .attr('x1', orbitCenter.x + orbitRadius).attr('y1', orbitCenter.y - 8)
    .attr('x2', orbitCenter.x + orbitRadius).attr('y2', orbitCenter.y + 8);
  var orbitRing = orbitGroup.append('circle').attr('class', 'orbit-line')
    .attr('cx', orbitCenter.x).attr('cy', orbitCenter.y).attr('r', orbitRadius);
  var orbitBand = orbitGroup.append('circle').attr('cx', orbitCenter.x).attr('cy', orbitCenter.y).attr('r', orbitRadius)
    .attr('fill', 'none').attr('stroke', 'var(--primary-soft)').attr('stroke-width', 18);
  var trail = orbitGroup.append('path').attr('class', 'orbit-trail')
    .attr('fill', 'none').attr('stroke', 'var(--accent)').attr('stroke-width', 5).attr('stroke-linecap', 'round').attr('opacity', 0.22);
  var orbitGhostLayer = orbitGroup.append('g').attr('aria-hidden', 'true');
  var starGlow = orbitGroup.append('circle').attr('cx', orbitCenter.x).attr('cy', orbitCenter.y).attr('fill', 'url(#star-glow)');
  var starCore = orbitGroup.append('circle').attr('cx', orbitCenter.x).attr('cy', orbitCenter.y)
    .attr('fill', 'var(--accent)').attr('stroke', 'var(--text)').attr('stroke-width', 1.2);
  orbitGroup.append('text').attr('x', orbitCenter.x).attr('y', orbitCenter.y + 5)
    .attr('text-anchor', 'middle').attr('fill', 'var(--bg)').attr('font-size', 15).attr('font-weight', 700).text('中心');
  var velocityLine = orbitGroup.append('line').attr('class', 'current-line')
    .attr('marker-end', 'url(#arrowhead)');
  var planet = orbitGroup.append('circle').attr('r', 8).attr('fill', 'var(--primary)').attr('stroke', 'var(--text)').attr('stroke-width', 2);
  var velocityLabel = orbitGroup.append('text').attr('fill', 'var(--accent)').attr('font-size', 15).attr('font-weight', 650).text('切向速度');
  orbitGroup.append('text').attr('x', 628).attr('y', 232).attr('fill', 'var(--text-muted)').attr('font-size', 15).text('轨道半径锁定');
  orbitGroup.append('text').attr('x', 628).attr('y', 253).attr('fill', 'var(--primary)').attr('font-size', 15).text('残影 = 已验证质量状态');

  var cm = { top: 10, right: 30, bottom: 38, left: 72 };
  var cw = 1080 - cm.left - cm.right;
  var ch = 154 - cm.top - cm.bottom;
  var x = d3.scaleLinear().domain([0.5, 3]).range([0, cw]);
  var speedAt = function (ratio) { return Lec.P.orbitalSpeed(radiusM, sunMass * ratio) / 1000; };
  var y = d3.scaleLinear().domain([speedAt(0.5) * 0.94, speedAt(3) * 1.04]).range([ch, 0]);
  var samples = d3.range(0.5, 3.001, 0.025).map(function (ratio) { return { ratio: ratio, speed: speedAt(ratio) }; });
  var chart = curveSvg.append('g').attr('transform', 'translate(' + cm.left + ',' + cm.top + ')');
  chart.selectAll('rect.target-zone').data(targets).join('rect').attr('class', 'target-zone')
    .attr('x', function (d) { return x(d - 0.12); }).attr('width', function (d) { return x(d + 0.12) - x(d - 0.12); })
    .attr('y', 0).attr('height', ch).attr('fill', 'var(--accent-soft)');
  chart.append('line').attr('x1', 0).attr('x2', cw).attr('y1', ch).attr('y2', ch)
    .attr('stroke', 'var(--primary-line)').attr('stroke-width', 8).attr('opacity', 0.2);
  chart.append('g').attr('class', 'axis').attr('transform', 'translate(0,' + ch + ')')
    .call(d3.axisBottom(x).tickValues([0.5, 1, 1.5, 2, 2.5, 3]).tickFormat(function (d) { return d.toFixed(1) + '×'; }));
  chart.append('g').attr('class', 'axis')
    .call(d3.axisLeft(y).ticks(3).tickFormat(function (d) { return Lec.P.significant(d, 3); }));
  chart.append('text').attr('class', 'axis-title').attr('x', cw).attr('y', ch + 35).attr('text-anchor', 'end').text('中心质量 / 太阳质量');
  chart.append('text').attr('class', 'axis-title').attr('x', 0).attr('y', -1).attr('text-anchor', 'start').text('稳定速度 km/s');
  var line = d3.line().x(function (d) { return x(d.ratio); }).y(function (d) { return y(d.speed); }).curve(d3.curveMonotoneX);
  var area = d3.area().x(function (d) { return x(d.ratio); }).y0(ch).y1(function (d) { return y(d.speed); }).curve(d3.curveMonotoneX);
  chart.append('path').datum(samples).attr('d', area).attr('fill', 'var(--primary-soft)');
  var curvePath = chart.append('path').datum(samples).attr('class', 'orbit-line').attr('d', line);
  var cursorGuide = chart.append('line').attr('class', 'measure-line').attr('stroke-dasharray', '4 4');
  var cursor = chart.append('circle').attr('r', 7).attr('fill', 'var(--accent)').attr('stroke', 'var(--text)').attr('stroke-width', 2);
  var verifiedLayer = chart.append('g');

  function fmtRatio(value) {
    return Lec.P.round(value, 2).toFixed(2) + ' × 太阳';
  }

  function updateOrbit(ratio) {
    var speed = speedAt(ratio);
    var px = orbitCenter.x + Math.cos(angle) * orbitRadius;
    var py = orbitCenter.y + Math.sin(angle) * orbitRadius;
    var tx = -Math.sin(angle);
    var ty = Math.cos(angle);
    var arrowLength = 38 + 42 * (speed - speedAt(0.5)) / (speedAt(3) - speedAt(0.5));
    var coreR = 16 + 12 * Math.sqrt(ratio / 3);
    var glowR = coreR + 18;
    var trailArc = d3.arc().innerRadius(orbitRadius - 2.5).outerRadius(orbitRadius + 2.5)
      .startAngle(angle + Math.PI / 2 - 0.75).endAngle(angle + Math.PI / 2);

    planet.attr('cx', px).attr('cy', py);
    velocityLine.attr('x1', px).attr('y1', py).attr('x2', px + tx * arrowLength).attr('y2', py + ty * arrowLength);
    velocityLabel.attr('x', px + tx * (arrowLength + 13)).attr('y', py + ty * (arrowLength + 13)).attr('text-anchor', ty < -0.25 ? 'middle' : (tx < 0 ? 'end' : 'start'));
    starCore.attr('r', coreR);
    starGlow.attr('r', glowR);
    trail.attr('d', trailArc()).attr('transform', 'translate(' + orbitCenter.x + ',' + orbitCenter.y + ')');
  }

  function updateChart(ratio) {
    var cx = x(ratio);
    var cy = y(speedAt(ratio));
    cursor.attr('cx', cx).attr('cy', cy);
    cursorGuide.attr('x1', cx).attr('x2', cx).attr('y1', cy).attr('y2', ch);
  }

  function updateReadouts(ratio) {
    var speed = speedAt(ratio);
    massOutput.textContent = fmtRatio(ratio);
    speedOutput.textContent = Lec.P.significant(speed, 3) + ' km/s';
    testOutput.textContent = Lec.P.significant(earthMasses, 2) + ' 地球质量';
    orbitTest.textContent = Lec.P.significant(earthMasses, 2) + ' M⊕';
    orbitMass.textContent = Lec.P.round(ratio, 2).toFixed(2) + ' M☉';
    orbitSpeed.textContent = Lec.P.significant(speed, 3) + ' km/s';
    updateChart(ratio);
    updateOrbit(ratio);
  }

  function renderVerified() {
    var ghosts = orbitGhostLayer.selectAll('g.orbit-ghost').data(verified, function (d) { return d.step; });
    var ghostsEntered = ghosts.enter().append('g').attr('class', 'orbit-ghost');
    ghostsEntered.append('circle').attr('fill', 'none').attr('stroke', 'var(--primary)').attr('stroke-width', 2).attr('opacity', 0.55);
    ghostsEntered.append('text').attr('fill', 'var(--text)').attr('font-size', 15).attr('text-anchor', 'middle');
    ghosts = ghostsEntered.merge(ghosts);
    ghosts.select('circle').attr('cx', function (d) { return 190 + d.step * 72; }).attr('cy', 225)
      .attr('r', function (d) { return 10 + 6 * Math.sqrt(d.ratio / 3); });
    ghosts.select('text').attr('x', function (d) { return 190 + d.step * 72; }).attr('y', 255)
      .text(function (d) { return Lec.P.round(d.ratio, 2).toFixed(2) + '×'; });
    ghosts.exit().remove();

    var points = verifiedLayer.selectAll('g.verified').data(verified, function (d) { return d.step; });
    var entered = points.enter().append('g').attr('class', 'verified');
    entered.append('circle').attr('r', 6).attr('fill', 'var(--accent)').attr('stroke', 'var(--bg)').attr('stroke-width', 2);
    entered.append('text').attr('class', 'verified-label').attr('dy', -11).attr('text-anchor', 'middle');
    points = entered.merge(points);
    points.attr('transform', function (d) { return 'translate(' + x(d.ratio) + ',' + y(d.speed) + ')'; });
    points.select('text').text(function (d) { return Lec.P.round(d.ratio, 2).toFixed(2) + '×'; });
    points.exit().remove();
  }

  function currentTaskText() {
    if (taskIndex >= targets.length) {
      return '三次状态汇入同一条上升曲线：中心更重，所需速度更高。';
    }
    var verbs = ['增至', '继续增至', '减至'];
    return '第 ' + (taskIndex + 1) + ' 轮：把中心质量' + verbs[taskIndex] + ' ' + targets[taskIndex].toFixed(2) + ' 倍附近。';
  }

  function flashWrong() {
    taskLine.textContent = '轨道距离没有变；请只比较中心质量增减带来的速度变化。';
    if (!reduced) {
      gsap.fromTo(slider, { x: -7 }, { x: 0, duration: 0.34, ease: 'elastic.out(1, 0.3)', overwrite: true });
      gsap.fromTo(cursor.node(), { x: -7 }, { x: 0, duration: 0.34, ease: 'elastic.out(1, 0.3)', overwrite: true });
    }
    window.setTimeout(function () {
      slider.value = validRatio;
      currentRatio = validRatio;
      updateReadouts(validRatio);
      taskLine.textContent = currentTaskText();
    }, reduced ? 0 : 360);
  }

  function acceptTarget(target) {
    validRatio = target;
    currentRatio = target;
    slider.value = target;
    verified.push({ step: taskIndex + 1, ratio: target, speed: speedAt(target) });
    nodes[taskIndex].classList.add('is-done');
    taskIndex += 1;
    progressLabel.textContent = '关系验证 ' + taskIndex + '/3';
    renderVerified();
    updateReadouts(target);
    taskLine.textContent = taskIndex >= 3
      ? '三次状态汇入同一条上升曲线：中心更重，所需速度更高。'
      : (target > verified[Math.max(0, verified.length - 2)].ratio ? '中心更重，所需速度更高。下一轮继续比较。' : '中心变轻，所需速度随之降低。下一轮继续比较。');

    if (!reduced) {
      gsap.fromTo(cursor.node(), { scale: 1 }, { scale: 1.65, duration: 0.22, yoyo: true, repeat: 1, transformOrigin: '50% 50%', ease: 'power2.out', overwrite: true });
      gsap.fromTo(nodes[taskIndex - 1], { scale: 0.75 }, { scale: 1, duration: 0.4, ease: 'back.out(1.7)', overwrite: true });
    }
    if (taskIndex >= 3) {
      claim.classList.add('is-current');
      slider.disabled = true;
    } else {
      window.setTimeout(function () { taskLine.textContent = currentTaskText(); }, reduced ? 0 : 900);
    }
  }

  function evaluate() {
    if (taskIndex >= targets.length) return;
    var target = targets[taskIndex];
    var movedCorrectly = taskDirections[taskIndex] > 0 ? currentRatio > validRatio : currentRatio < validRatio;
    if (Math.abs(currentRatio - target) <= 0.12 && movedCorrectly) {
      acceptTarget(target);
    } else {
      flashWrong();
    }
  }

  function reset() {
    verified = [];
    taskIndex = 0;
    validRatio = 1;
    currentRatio = 1;
    slider.disabled = false;
    slider.value = 1;
    nodes.forEach(function (node) { node.classList.remove('is-done'); });
    claim.classList.remove('is-current');
    progressLabel.textContent = '关系验证 0/3';
    taskLine.textContent = currentTaskText();
    renderVerified();
    updateReadouts(1);
  }

  slider.addEventListener('input', function () {
    currentRatio = Number(slider.value);
    updateReadouts(currentRatio);
  });
  slider.addEventListener('change', evaluate);
  resetButton.addEventListener('click', reset);

  updateReadouts(1);
  if (!reduced) {
    var totalLength = curvePath.node().getTotalLength();
    gsap.from(starGlow.node(), { autoAlpha: 0, scale: 0.45, duration: 0.7, transformOrigin: '50% 50%', ease: 'power2.out' });
    gsap.from(orbitRing.node(), { strokeDasharray: '1 600', duration: 0.9, ease: 'power2.out' });
    gsap.fromTo(curvePath.node(), { strokeDasharray: totalLength, strokeDashoffset: totalLength }, { strokeDashoffset: 0, duration: 1.05, delay: 0.25, ease: 'power2.out' });
    Deck.loop(function (time, dt) {
      var speedNorm = 0.55 + 0.75 * Math.sqrt(currentRatio / 3);
      angle += dt * 0.0012 * speedNorm;
      updateOrbit(currentRatio);
    }, { still: 1000 });
  } else {
    angle = -0.55;
    updateOrbit(currentRatio);
  }
})();
</script>
</body>
</html>
