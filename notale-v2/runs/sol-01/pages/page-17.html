<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p17-page {
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }
  progress.lec-progress {
    overflow: visible;
    padding: 0;
    border: 0;
    appearance: none;
  }
  progress.lec-progress::-webkit-progress-bar,
  progress.lec-progress::-webkit-progress-value {
    height: 2px;
    border: 0;
  }
  .p17-status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 44px;
    padding: 0 var(--sp-4);
    border-left: 4px solid var(--accent);
    background: var(--surface-data);
  }
  .p17-status strong {
    color: var(--accent);
    font-size: var(--fs-body);
    line-height: var(--lh-tight);
  }
  .p17-status span {
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
  }
  .p17-reset {
    width: 44px;
    min-width: 44px;
    padding: 0;
    font-size: 24px;
  }
  .p17-compare {
    --compare-cols: 2;
    grid-template-columns: 156px 390px minmax(0, 1fr);
    flex: 1 1 0;
    min-height: 0;
  }
  .p17-compare > .hdr {
    min-height: 54px;
    padding-top: var(--sp-3);
    padding-bottom: var(--sp-3);
  }
  .p17-compare > .dim {
    justify-content: flex-start;
    text-align: left;
  }
  .p17-compare > .cell {
    padding: var(--sp-3) var(--sp-4);
  }
  .p17-visual {
    height: 310px;
    padding: 0 !important;
    overflow: hidden;
    background: var(--surface);
  }
  .p17-ruler-wrap,
  .p17-chart-wrap {
    position: relative;
    width: 100%;
    height: 100%;
  }
  #orbit-ruler,
  #curve-chart {
    width: 100%;
    height: 100%;
  }
  #orbit-ruler text {
    fill: var(--text-muted);
    font-family: var(--font-sans);
    font-size: var(--fs-label);
  }
  #orbit-ruler .ruler-value {
    fill: var(--text);
    font-family: var(--font-mono);
    font-size: var(--fs-tick);
  }
  #orbit-ruler .ruler-track {
    fill: none;
    stroke: var(--primary-line);
    stroke-width: 1.5;
  }
  #orbit-ruler .ruler-axis {
    stroke: var(--line-strong);
    stroke-width: 1;
  }
  #orbit-ruler .ruler-node {
    fill: var(--surface-data);
    stroke: var(--primary);
    stroke-width: 2;
  }
  #orbit-ruler .ruler-node.earth {
    fill: var(--accent);
    stroke: var(--accent);
  }
  #orbit-ruler .sun {
    fill: var(--accent);
  }
  .p17-drag {
    position: absolute;
    z-index: 5;
    top: 20px;
    left: 23.5%;
    width: 64px;
    height: 224px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
    color: var(--accent);
  }
  .p17-drag label {
    padding: var(--sp-1) var(--sp-2);
    background: var(--surface-data);
    color: var(--accent);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: var(--lh-tight);
    white-space: nowrap;
  }
  #align-control {
    width: 176px;
    height: 44px;
    margin: 0;
    transform: rotate(-90deg);
    accent-color: var(--accent);
    cursor: ns-resize;
  }
  .p17-cell-title {
    color: var(--text);
    font-size: var(--fs-sec);
    font-weight: 650;
    line-height: var(--lh-tight);
  }
  .p17-cell-copy {
    margin-top: var(--sp-1);
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
  }
  .p17-baseline-mark {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-2);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: var(--fs-sec);
  }
  .p17-baseline-mark::before {
    width: 12px;
    height: 12px;
    border: 2px solid var(--primary);
    border-radius: 50%;
    content: "";
  }
  .p17-period-mark::before {
    border-color: var(--accent);
    background: var(--accent);
  }
  .p17-readings {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--sp-2);
    background: var(--surface-data);
  }
  .p17-reading {
    min-width: 0;
    padding: var(--sp-2) var(--sp-3);
    border-left: 2px solid var(--line-strong);
  }
  .p17-reading.is-outer {
    border-left-color: var(--accent);
  }
  .p17-reading .name {
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }
  .p17-reading .vals {
    margin-top: var(--sp-1);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: var(--fs-tick);
    line-height: var(--lh-tight);
    white-space: nowrap;
  }
  .p17-reading .period {
    color: var(--accent);
  }
  .p17-claim {
    min-height: 44px;
    padding: var(--sp-2) var(--sp-4);
    border-left: 4px solid var(--accent);
    background: var(--accent-soft);
    color: var(--text);
    font-size: var(--fs-lead);
    font-weight: 650;
    line-height: var(--lh-body);
    visibility: hidden;
  }
  .p17-claim.is-visible {
    visibility: visible;
  }
  .p17-error {
    position: absolute;
    z-index: 6;
    right: var(--sp-4);
    bottom: var(--sp-4);
    max-width: 470px;
    padding: var(--sp-2) var(--sp-3);
    border-left: 3px solid var(--danger);
    background: var(--surface-data);
    color: var(--text);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
    visibility: hidden;
  }
  .p17-error.is-visible {
    visibility: visible;
  }
  @media (prefers-reduced-motion: reduce) {
    .p17-drag, .p17-error { transition: none; }
  }
</style>
</head>
<body data-page="17" data-total="50">
<div id="stage">
<main id="main">
  <section class="page p17-page min0" aria-labelledby="p17-visual-title">
    <div class="p17-status" role="status" aria-live="polite">
      <div>
        <strong id="status-title">选择共同基准</strong>
        <span id="status-copy">拖动黄色周期曲线，使两个地球节点重合。</span>
      </div>
      <button class="p17-reset" id="reset-btn" type="button" title="重置对齐" aria-label="重置对齐">↺</button>
    </div>

    <div class="k-comparison p17-compare min0" style="--compare-cols:2">
      <div class="hdr">比较维度</div>
      <div class="hdr" id="p17-visual-title">轨道半长轴</div>
      <div class="hdr">公转周期</div>

      <div class="dim">八颗行星</div>
      <div class="cell p17-visual min0">
        <div class="p17-ruler-wrap min0">
          <svg id="orbit-ruler" role="img" aria-label="从太阳向外排列的八颗行星轨道半长轴压缩刻度尺"></svg>
        </div>
      </div>
      <div class="cell p17-visual min0">
        <div class="p17-chart-wrap min0 no-pan">
          <div id="curve-chart" role="img" aria-label="八颗行星相对地球的距离与周期归一化曲线"></div>
          <div class="p17-drag">
            <label for="align-control">拖动周期曲线</label>
            <input id="align-control" type="range" min="0.25" max="1.75" step="0.01" value="0.52" aria-valuetext="周期曲线尚未与地球基准对齐">
          </div>
          <div class="p17-error" id="error-msg">要比较增长快慢，请先让两条曲线在同一颗行星上对齐。</div>
        </div>
      </div>

      <div class="dim">共同基准</div>
      <div class="cell baseline">
        <span class="p17-baseline-mark">地球距离 = 1</span>
      </div>
      <div class="cell baseline" id="period-baseline">
        <span class="p17-baseline-mark p17-period-mark">地球周期 × <b id="factor-readout">0.52</b></span>
      </div>

      <div class="dim">实际读数</div>
      <div class="cell" data-density="high">
        <div class="p17-readings" id="distance-readings" aria-label="各行星距离相对地球的倍数"></div>
      </div>
      <div class="cell diff" id="period-cell">
        <div class="p17-readings" id="period-readings" aria-label="各行星周期相对地球的倍数"></div>
      </div>
    </div>

    <div class="p17-claim" id="claim">离太阳越远，行星的公转周期确实越长，而且增长得比轨道距离更快。</div>
  </section>
</main>
</div>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function () {
  'use strict';

  Lec.mount({
    index: 17,
    kicker: 'KEPLER III · 周期与距离',
    title: '离太阳越远，公转周期增长得比距离更快',
    take: '离太阳越远，行星的公转周期确实越长，而且增长得比轨道距离更快。'
  });

  var planets = Lec.K.PLANETS;
  var earth = planets.filter(function (p) { return p.id === 'earth'; })[0];
  var earthPeriod = Lec.P.orbitalPeriodYears(earth.semimajorAU);
  var data = planets.map(function (p) {
    var period = Lec.P.orbitalPeriodYears(p.semimajorAU);
    return {
      id: p.id,
      name: p.name,
      distance: Lec.P.ratio(p.semimajorAU, earth.semimajorAU),
      period: Lec.P.ratio(period, earthPeriod)
    };
  });
  var aligned = false;
  var input = document.getElementById('align-control');
  var resetBtn = document.getElementById('reset-btn');
  var statusTitle = document.getElementById('status-title');
  var statusCopy = document.getElementById('status-copy');
  var factorReadout = document.getElementById('factor-readout');
  var periodCell = document.getElementById('period-cell');
  var periodBaseline = document.getElementById('period-baseline');
  var claim = document.getElementById('claim');
  var errorMsg = document.getElementById('error-msg');
  var reduced = Deck.reduced();
  var chart;

  function fmt(value) {
    return String(Lec.P.significant(value, 3));
  }

  function renderReadings() {
    var distanceHost = document.getElementById('distance-readings');
    var periodHost = document.getElementById('period-readings');
    distanceHost.innerHTML = '';
    periodHost.innerHTML = '';
    data.forEach(function (d, i) {
      var a = document.createElement('div');
      var b = document.createElement('div');
      a.className = 'p17-reading' + (i >= 4 ? ' is-outer' : '');
      b.className = 'p17-reading outer-period' + (i >= 4 ? ' is-outer' : '');
      a.innerHTML = '<div class="name">' + d.name + '</div><div class="vals">' + fmt(d.distance) + ' × 地球</div>';
      b.innerHTML = '<div class="name">' + d.name + '</div><div class="vals period">' + fmt(d.period) + ' × 地球</div>';
      distanceHost.appendChild(a);
      periodHost.appendChild(b);
    });
  }

  function drawRuler() {
    var svg = d3.select('#orbit-ruler');
    var width = 390;
    var height = 310;
    var x = d3.scaleLog().domain([0.32, 34]).range([58, 366]);
    svg.attr('viewBox', '0 0 ' + width + ' ' + height);
    svg.selectAll('*').remove();
    svg.append('circle').attr('class', 'sun').attr('cx', 20).attr('cy', 147).attr('r', 18);
    svg.append('text').attr('x', 8).attr('y', 181).text('太阳');
    svg.append('line').attr('class', 'ruler-axis').attr('x1', 44).attr('x2', 374).attr('y1', 147).attr('y2', 147);
    svg.selectAll('.ruler-track').data(data).join('path')
      .attr('class', 'ruler-track')
      .attr('d', function (d, i) {
        var xx = x(d.distance);
        var lift = 22 + i * 12;
        return 'M44,147 Q' + ((44 + xx) / 2) + ',' + (147 - lift) + ' ' + xx + ',147';
      });
    var nodes = svg.selectAll('.ruler-group').data(data).join('g').attr('class', 'ruler-group');
    nodes.append('circle').attr('class', function (d) { return 'ruler-node ' + (d.id === 'earth' ? 'earth' : ''); })
      .attr('cx', function (d) { return x(d.distance); }).attr('cy', 147).attr('r', 6);
    nodes.append('line').attr('class', 'ruler-axis')
      .attr('x1', function (d) { return x(d.distance); }).attr('x2', function (d) { return x(d.distance); })
      .attr('y1', 157).attr('y2', 178);
    svg.append('text').attr('x', 52).attr('y', 215).text('向外');
    svg.append('line').attr('class', 'ruler-axis').attr('x1', 52).attr('x2', 362).attr('y1', 194).attr('y2', 194);
    svg.append('path').attr('d', 'M362,194 l-10,-6 v12 z').attr('fill', 'var(--primary)');
  }

  function chartOption(factor) {
    var distanceValues = data.map(function (d) { return d.distance; });
    var periodValues = data.map(function (d) { return d.period * factor; });
    return {
      animation: false,
      textStyle: { color: '#eaf2f5', fontSize: 16 },
      grid: { left: 54, right: 26, top: 38, bottom: 46 },
      legend: {
        top: 4,
        right: 18,
        itemWidth: 24,
        itemHeight: 4,
        textStyle: { color: '#a9bac3', fontSize: 14 },
        data: ['距离倍数', '周期倍数']
      },
      xAxis: {
        type: 'category',
        boundaryGap: false,
        data: data.map(function (d) { return d.name; }),
        axisLine: { lineStyle: { color: '#526974' } },
        axisTick: { show: false },
        axisLabel: { color: '#a9bac3', fontSize: 14, interval: 0 },
        splitLine: { show: false }
      },
      yAxis: {
        type: 'log',
        logBase: 10,
        min: 0.08,
        max: 300,
        name: '相对地球的倍数',
        nameTextStyle: { color: '#a9bac3', fontSize: 14, padding: [0, 0, 4, 0] },
        axisLine: { show: false },
        axisTick: { show: false },
        axisLabel: { color: '#a9bac3', fontSize: 12, formatter: function (v) { return String(v); } },
        splitLine: { lineStyle: { color: '#30434d' } }
      },
      series: [
        {
          name: '距离倍数',
          type: 'line',
          data: distanceValues,
          symbol: 'circle',
          symbolSize: 9,
          lineStyle: { width: 3, color: '#4fc3d7' },
          itemStyle: { color: '#101b24', borderColor: '#4fc3d7', borderWidth: 2 },
          emphasis: { disabled: true },
          z: 3
        },
        {
          name: '周期倍数',
          type: 'line',
          data: periodValues,
          symbol: 'circle',
          symbolSize: 10,
          lineStyle: { width: 3, color: '#ffd166' },
          itemStyle: { color: '#ffd166', borderColor: '#ffd166', borderWidth: 2 },
          areaStyle: aligned ? { color: 'rgba(255,209,102,0.14)', origin: 'start' } : undefined,
          emphasis: { disabled: true },
          z: 4
        }
      ]
    };
  }

  function updateChart(factor) {
    factorReadout.textContent = fmt(factor);
    input.setAttribute('aria-valuetext', aligned ? '周期曲线已与地球基准对齐' : '周期曲线倍率 ' + fmt(factor));
    chart.setOption(chartOption(factor), true);
  }

  function showError() {
    if (aligned) return;
    errorMsg.classList.add('is-visible');
    periodBaseline.classList.add('diff');
    if (!reduced) {
      gsap.fromTo('.p17-drag', { x: -8 }, { x: 0, duration: 0.38, ease: 'elastic.out(1,0.35)', overwrite: 'auto' });
      gsap.fromTo('#period-baseline', { backgroundColor: 'rgba(255,123,114,0.28)' }, { backgroundColor: 'rgba(79,195,215,0.14)', duration: 0.7, ease: 'power2.out', overwrite: 'auto' });
    }
    window.setTimeout(function () { errorMsg.classList.remove('is-visible'); }, reduced ? 0 : 1800);
  }

  function finishAlignment() {
    aligned = true;
    input.value = '1';
    input.disabled = true;
    periodCell.classList.add('is-key');
    periodBaseline.classList.add('diff', 'is-key');
    claim.classList.add('is-visible');
    statusTitle.textContent = '已对齐，沿曲线向外比较';
    statusCopy.textContent = '共同基准都是地球 = 1；黄色周期曲线向外分离得更快。';
    updateChart(1);
    if (!reduced) {
      gsap.fromTo('#period-baseline', { scale: 0.97 }, { scale: 1, duration: 0.42, ease: 'back.out(1.7)' });
      gsap.fromTo('.outer-period', { autoAlpha: 0.35, y: 6 }, { autoAlpha: 1, y: 0, duration: 0.42, stagger: 0.1, ease: 'power2.out' });
      gsap.fromTo('#claim', { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power2.out' });
    }
  }

  function reset() {
    aligned = false;
    input.disabled = false;
    input.value = '0.52';
    periodCell.classList.remove('is-key');
    periodBaseline.classList.remove('diff', 'is-key');
    claim.classList.remove('is-visible');
    claim.style.visibility = '';
    claim.style.opacity = '';
    statusTitle.textContent = '选择共同基准';
    statusCopy.textContent = '拖动黄色周期曲线，使两个地球节点重合。';
    updateChart(0.52);
  }

  input.addEventListener('input', function () {
    var value = Number(input.value);
    errorMsg.classList.remove('is-visible');
    updateChart(value);
    if (Math.abs(value - 1) <= 0.035) finishAlignment();
  });
  input.addEventListener('change', function () {
    if (!aligned) showError();
  });
  resetBtn.addEventListener('click', reset);

  renderReadings();
  drawRuler();
  chart = echarts.init(document.getElementById('curve-chart'), null, { renderer: 'svg' });
  updateChart(Number(input.value));
  Deck.onResize(function () { chart.resize(); });

  if (reduced) {
    finishAlignment();
  } else {
    gsap.from('#orbit-ruler .sun', { autoAlpha: 0, scale: 0.4, svgOrigin: '20 147', duration: 0.45, ease: 'power2.out' });
    gsap.from('#orbit-ruler .ruler-track', { strokeDasharray: 360, strokeDashoffset: 360, duration: 0.8, stagger: 0.05, ease: 'power2.out' });
    gsap.from('#orbit-ruler .ruler-group', { autoAlpha: 0, y: 6, duration: 0.35, stagger: 0.07, ease: 'power2.out' });
  }
}());
</script>
</body>
</html>
