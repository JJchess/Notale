<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="18" data-total="50">
<div id="stage">
<main id="main">
  <escape-window-game></escape-window-game>
</main>
</div>
<script src="assets/lib/three.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
class EscapeWindowGame extends HTMLElement {
  constructor() {
    super();
    this.state = this.freshState();
    this.stopLoop = null;
  }

  freshState() {
    return { ratio: 0.82, completed: [false, false, false], task: 0, launches: 0, trace: [] };
  }

  connectedCallback() {
    this.innerHTML = `
      <style>
        :host { display:block; width:var(--content-w); height:var(--content-h); color:var(--text); font-family:var(--font-sans); }
        * { box-sizing:border-box; }
        .lec-progress { appearance:none; overflow:visible; border:0; padding:0; line-height:0; }
        .lec-progress::-webkit-progress-bar { background:var(--line); }
        .lec-progress::-webkit-progress-value { background:var(--primary); }
        .lab { position:relative; width:100%; height:100%; overflow:hidden; border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface); }
        .scene { position:absolute; inset:0; overflow:hidden; background:var(--bg); }
        canvas { display:block; width:100%; height:100%; touch-action:none; }
        .scene-label { position:absolute; z-index:2; pointer-events:none; }
        .launch-label { left:51%; top:43%; padding:var(--sp-2) var(--sp-3); border-left:2px solid var(--accent); background:var(--surface-data); font-size:var(--fs-label); line-height:var(--lh-tight); color:var(--text); }
        .sun-label { left:31%; top:52%; color:var(--accent); font-size:var(--fs-label); line-height:var(--lh-tight); }
        .tasks { position:absolute; z-index:3; top:var(--sp-4); left:var(--sp-4); display:flex; gap:var(--sp-2); }
        .task { min-width:112px; padding:var(--sp-2) var(--sp-3); border:1px solid var(--line-strong); background:var(--surface-data); color:var(--text-muted); font-size:var(--fs-label); line-height:var(--lh-tight); }
        .task::before { content:'○'; margin-right:var(--sp-2); color:var(--primary); }
        .task.current { border-color:var(--accent); color:var(--accent); }
        .task.done { border-color:var(--success); color:var(--text); }
        .task.done::before { content:'●'; color:var(--success); }
        .classification { position:absolute; z-index:4; top:var(--sp-4); right:var(--sp-4); width:390px; gap:0; }
        .classification > .box { padding:var(--sp-3); background:var(--surface-data); }
        .classification .box > .bt { margin-bottom:var(--sp-2); font-size:var(--fs-lead); }
        .root-copy { color:var(--text-muted); font-size:var(--fs-sec); line-height:var(--lh-body); }
        .classification .lv { margin-top:var(--sp-2); margin-left:var(--sp-3); padding-left:var(--sp-4); }
        .classification .lv::before { top:33px; }
        .branch { padding:var(--sp-3) !important; }
        .branch .bt { font-size:var(--fs-body) !important; }
        .branch p { color:var(--text-muted); font-size:var(--fs-sec); line-height:var(--lh-body); }
        .boundary { position:relative; z-index:1; margin:calc(var(--sp-1) * -1) var(--sp-3) calc(var(--sp-1) * -1) 46px; padding:var(--sp-2) var(--sp-3); border:1px solid var(--accent); background:var(--surface); color:var(--accent); font-size:var(--fs-label); font-weight:650; line-height:var(--lh-tight); }
        .boundary::before { content:''; position:absolute; top:50%; right:100%; width:30px; height:2px; background:var(--accent); }
        .energy { position:absolute; z-index:4; right:var(--sp-4); bottom:112px; width:390px; padding:var(--sp-3) var(--sp-4); border:1px solid var(--line); background:var(--surface-data); }
        .energy-head { display:flex; justify-content:space-between; align-items:baseline; gap:var(--sp-3); }
        .energy-title { font-size:var(--fs-label); color:var(--text-muted); }
        .energy-value { font-family:var(--font-mono); font-size:var(--fs-body); color:var(--text); }
        .energy-track { position:relative; height:28px; margin-top:var(--sp-2); border:1px solid var(--line-strong); background:linear-gradient(to right, var(--primary-soft) 0 50%, var(--accent-soft) 50% 100%); }
        .zero { position:absolute; top:-7px; bottom:-7px; left:50%; width:2px; background:var(--accent); }
        .zero-label { position:absolute; top:-26px; left:50%; transform:translateX(-50%); color:var(--accent); font-size:var(--fs-tick); font-family:var(--font-mono); }
        .needle { position:absolute; top:4px; left:50%; width:3px; height:18px; background:var(--text); transform:translateX(-50%); transition:left 160ms ease; }
        .energy-ends { display:flex; justify-content:space-between; margin-top:var(--sp-1); color:var(--text-muted); font-size:var(--fs-label); }
        .controls { position:absolute; z-index:5; left:var(--sp-4); right:422px; bottom:var(--sp-4); min-height:88px; padding:var(--sp-3) var(--sp-4); border:1px solid var(--line); background:var(--surface-data); }
        .control-top { display:flex; align-items:center; gap:var(--sp-3); }
        .speed-label { flex:0 0 auto; color:var(--text-muted); font-size:var(--fs-label); font-weight:650; }
        input[type='range'] { min-height:44px; flex:1 1 auto; }
        .speed-value { min-width:112px; text-align:right; color:var(--accent); font-family:var(--font-mono); font-size:var(--fs-body); }
        button { min-width:96px; min-height:44px; font-size:var(--fs-body); }
        .reset { min-width:44px; width:44px; padding:0; font-size:24px; }
        .feedback { margin-top:var(--sp-1); color:var(--text-muted); font-size:var(--fs-sec); line-height:var(--lh-body); }
        .feedback.good { color:var(--success); }
        .feedback.bad { color:var(--danger); }
        .conclusion { position:absolute; z-index:6; left:var(--sp-4); right:422px; bottom:116px; padding:var(--sp-3) var(--sp-4); border-left:4px solid var(--accent); background:var(--surface-data); font-size:var(--fs-lead); line-height:var(--lh-body); opacity:0; transform:translateY(6px); pointer-events:none; }
        .conclusion.show { opacity:1; transform:none; }
        .pulse { animation:pulse 700ms ease; }
        .shake { animation:shake 260ms ease; }
        button:focus-visible, input:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
        @keyframes pulse { 50% { box-shadow:0 0 24px var(--accent); } }
        @keyframes shake { 25% { transform:translateX(-5px); } 75% { transform:translateX(5px); } }
        @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
      </style>
      <section class="lab" aria-label="逃逸窗口轨道实验台">
        <div class="scene no-pan" aria-hidden="true"><div class="webgl"></div></div>
        <div class="tasks" aria-label="任务进度">
          <div class="task current" data-task="0">束缚窗口</div>
          <div class="task" data-task="1">临界窗口</div>
          <div class="task" data-task="2">逃逸窗口</div>
        </div>
        <div class="scene-label sun-label">太阳</div>
        <div class="scene-label launch-label">固定出发点 · 切向发射</div>

        <section class="k-classification classification" aria-label="总能量状态分类">
          <div class="box">
            <h2 class="bt">总能量状态</h2>
            <p class="root-copy">速度改变动能；动能与引力势能合成后，轨迹落入两条主枝。</p>
            <div class="lv">
              <div class="box branch" data-branch="bound">
                <h3 class="bt">束缚 · 总能量 &lt; 0</h3>
                <p>闭合轨道，物体最终仍会回到近处。</p>
              </div>
              <div class="boundary" data-branch="critical">逃逸临界 · 总能量 = 0</div>
              <div class="box branch" data-branch="escape">
                <h3 class="bt">非束缚 · 总能量 &gt; 0</h3>
                <p>开放轨迹，远处仍保有速度。</p>
              </div>
            </div>
          </div>
        </section>

        <section class="energy" aria-label="能量零线">
          <div class="energy-head"><span class="energy-title">单位质量总能量</span><strong class="energy-value">—</strong></div>
          <div class="energy-track"><span class="zero-label">0</span><span class="zero"></span><span class="needle"></span></div>
          <div class="energy-ends"><span>负 · 束缚</span><span>正 · 非束缚</span></div>
        </section>

        <div class="conclusion" role="status">逃逸不是引力消失，而是总能量跨过了零线。</div>

        <section class="controls" aria-label="发射控制">
          <div class="control-top">
            <label class="speed-label" for="speed">切向初速度</label>
            <input id="speed" type="range" min="0.72" max="1.22" step="0.005" value="0.82" aria-describedby="feedback">
            <output class="speed-value" for="speed">—</output>
            <button class="launch" type="button">发射</button>
            <button class="reset" type="button" title="重置任务" aria-label="重置任务">↻</button>
          </div>
          <p id="feedback" class="feedback" aria-live="polite">第 1 关：把速度调进束缚窗口，再发射。</p>
        </section>
      </section>`;

    this.els = {
      lab: this.querySelector('.lab'),
      scene: this.querySelector('.scene'),
      webgl: this.querySelector('.webgl'),
      range: this.querySelector('#speed'),
      speed: this.querySelector('.speed-value'),
      energy: this.querySelector('.energy-value'),
      needle: this.querySelector('.needle'),
      feedback: this.querySelector('.feedback'),
      conclusion: this.querySelector('.conclusion'),
      launch: this.querySelector('.launch'),
      reset: this.querySelector('.reset')
    };
    this.setupModel();
    this.setupThree();
    this.bind();
    this.render();
    this.dispatchEvent(new CustomEvent('game-start', { bubbles:true, composed:true, detail:{ state:this.getState() } }));
  }

  setupModel() {
    this.radiusM = Lec.P.auToM(1);
    this.mu = Lec.K.PHYSICS.G * Lec.K.SUN.massKg;
    this.circular = Lec.P.orbitalSpeed(this.radiusM, Lec.K.SUN.massKg);
    this.escape = Lec.P.escapeSpeed(Lec.K.SUN.massKg, this.radiusM);
  }

  setupThree() {
    const THREE = window.THREE;
    this.scene3 = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(42, 1, 0.1, 50);
    this.camera.position.set(0, 7.2, 8.5);
    this.camera.lookAt(0.7, 0, 0);
    this.renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.els.webgl.appendChild(this.renderer.domElement);

    const primary = new THREE.Color(Deck.token('--primary'));
    const accent = new THREE.Color(Deck.token('--accent'));
    const line = new THREE.Color(Deck.token('--line-strong'));
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(0.46, 40, 24),
      new THREE.MeshStandardMaterial({ color:accent, emissive:accent, emissiveIntensity:0.7, roughness:0.8 })
    );
    sun.position.x = -1.4;
    this.scene3.add(sun);
    this.scene3.add(new THREE.AmbientLight(primary, 1.2));
    const lamp = new THREE.PointLight(accent, 16, 12);
    lamp.position.set(-1.4, 1.5, 0);
    this.scene3.add(lamp);

    const orbitPts = [];
    for (let i=0; i<=128; i++) {
      const a = i / 128 * Math.PI * 2;
      orbitPts.push(new THREE.Vector3(-1.4 + 2.5*Math.cos(a), 0, 2.5*Math.sin(a)));
    }
    const orbit = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(orbitPts),
      new THREE.LineBasicMaterial({ color:line, transparent:true, opacity:0.7 })
    );
    this.scene3.add(orbit);
    this.launchPoint = new THREE.Mesh(
      new THREE.SphereGeometry(0.09, 20, 12),
      new THREE.MeshStandardMaterial({ color:accent, emissive:accent, emissiveIntensity:0.6 })
    );
    this.launchPoint.position.set(1.1, 0, 0);
    this.scene3.add(this.launchPoint);
    this.paths = [];
    this.preview = null;
    this.resizeThree();
    this.offResize = Deck.onResize(() => this.resizeThree());
    this.stopLoop = Deck.loop((t) => {
      if (!Deck.reduced()) sun.rotation.y = t * 0.00018;
      this.renderer.render(this.scene3, this.camera);
    }, { still:1000 });
    this.updateTrajectory(false);
  }

  resizeThree() {
    const w = this.els.scene.clientWidth || 1408;
    const h = this.els.scene.clientHeight || 620;
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(w, h, false);
  }

  trajectoryPoints(ratio) {
    const points = [];
    let x=1, z=0, vx=0, vz=ratio*Math.SQRT2;
    const dt=0.012;
    for (let i=0; i<1800; i++) {
      const r=Math.hypot(x,z);
      const ax=-x/(r*r*r), az=-z/(r*r*r);
      vx += ax*dt/2; vz += az*dt/2;
      x += vx*dt; z += vz*dt;
      const r2=Math.hypot(x,z);
      vx += (-x/(r2*r2*r2))*dt/2;
      vz += (-z/(r2*r2*r2))*dt/2;
      if (i%4===0) points.push(new THREE.Vector3(-1.4+2.5*x, 0, 2.5*z));
      if ((ratio < 0.985 && i>150 && z<0 && x>0.98) || r2>3.8) break;
    }
    return points;
  }

  updateTrajectory(lock) {
    const THREE = window.THREE;
    const color = new THREE.Color(lock ? Deck.token('--accent') : Deck.token('--primary'));
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(this.trajectoryPoints(this.state.ratio)),
      new THREE.LineBasicMaterial({ color, transparent:true, opacity:lock ? 1 : 0.82 })
    );
    if (lock) {
      this.paths.push(line);
    } else {
      if (this.preview) {
        this.scene3.remove(this.preview);
        this.preview.geometry.dispose();
        this.preview.material.dispose();
      }
      this.preview = line;
    }
    this.scene3.add(line);
  }

  bind() {
    this.els.range.addEventListener('input', () => {
      this.state.ratio = Number(this.els.range.value);
      this.updateTrajectory(false);
      this.render();
      this.emitProgress('speed-change');
    });
    this.els.launch.addEventListener('click', () => this.launch());
    this.els.reset.addEventListener('click', () => this.reset());
  }

  category() {
    if (Math.abs(this.state.ratio - 1) <= 0.015) return 1;
    return this.state.ratio < 1 ? 0 : 2;
  }

  inWindow(task) {
    const r=this.state.ratio;
    return task===0 ? r>=0.82 && r<=0.92 : task===1 ? Math.abs(r-1)<=0.015 : r>=1.08 && r<=1.18;
  }

  launch() {
    const task=this.state.task;
    this.state.launches++;
    if (this.inWindow(task)) {
      this.state.completed[task]=true;
      this.state.trace.push({ task, ratio:this.state.ratio, result:'hit' });
      this.updateTrajectory(true);
      this.state.task=Math.min(2, task+1);
      this.flash('pulse');
      if (task===2) {
        this.els.feedback.textContent='三类轨迹已锁定：速度先改变能量状态，再决定轨迹类别。';
        this.els.feedback.className='feedback good';
        this.els.conclusion.classList.add('show');
        this.dispatchEvent(new CustomEvent('game-complete', { bubbles:true, composed:true, detail:{ score:3, metrics:{ launches:this.state.launches }, trace:this.state.trace.slice() } }));
      } else {
        const next=task===0?'临界':'逃逸';
        this.els.feedback.textContent=`命中。第 ${task+2} 关：寻找${next}窗口。`;
        this.els.feedback.className='feedback good';
      }
    } else {
      const cat=this.category();
      const messages = task===0
        ? (cat===2 ? '已经越过零线，这不是束缚轨道。' : '束缚成立，但还没进入目标窗口。')
        : task===1
          ? (cat===0 ? '总能量仍为负，轨迹还会回来。' : '已经越过零线；把能量对准零。')
          : (cat===0 ? '总能量仍为负，轨迹还会回来。' : '已非束缚，但还没进入逃逸窗口。');
      this.state.trace.push({ task, ratio:this.state.ratio, result:'miss' });
      this.els.feedback.textContent=messages;
      this.els.feedback.className='feedback bad';
      this.flash('shake');
    }
    this.render();
    this.emitProgress('launch');
  }

  flash(name) {
    this.els.lab.classList.remove('pulse','shake');
    void this.els.lab.offsetWidth;
    this.els.lab.classList.add(name);
    window.setTimeout(() => this.els.lab.classList.remove(name), 750);
  }

  specificEnergy() {
    const speed=this.state.ratio*this.escape;
    return speed*speed/2 - this.mu/this.radiusM;
  }

  render() {
    const speed=this.state.ratio*this.escape/1000;
    const energy=this.specificEnergy()/1000000;
    this.els.speed.textContent=`${Lec.P.significant(speed, 3)} km/s`;
    this.els.energy.textContent=`${energy>=0?'+':''}${Lec.P.significant(energy, 3)} MJ/kg`;
    this.els.needle.style.left=`${Deck.clamp(50 + energy/9, 6, 94)}%`;
    const cat=this.category();
    this.querySelectorAll('[data-branch]').forEach((el) => el.classList.remove('is-current'));
    const key=cat===0?'bound':cat===1?'critical':'escape';
    this.querySelector(`[data-branch="${key}"]`).classList.add('is-current');
    this.querySelectorAll('.task').forEach((el,i) => {
      el.classList.toggle('done',this.state.completed[i]);
      el.classList.toggle('current',!this.state.completed[2] && i===this.state.task);
    });
  }

  emitProgress(action) {
    this.dispatchEvent(new CustomEvent('game-progress', { bubbles:true, composed:true, detail:{ state:this.getState(), action, metrics:{ launches:this.state.launches, completed:this.state.completed.filter(Boolean).length } } }));
  }

  start() { this.dispatchEvent(new CustomEvent('game-start', { bubbles:true, composed:true, detail:{ state:this.getState() } })); }

  reset() {
    this.state=this.freshState();
    this.els.range.value=String(this.state.ratio);
    this.paths.forEach((line) => { this.scene3.remove(line); line.geometry.dispose(); line.material.dispose(); });
    this.paths=[];
    this.els.feedback.textContent='第 1 关：把速度调进束缚窗口，再发射。';
    this.els.feedback.className='feedback';
    this.els.conclusion.classList.remove('show');
    this.updateTrajectory(false);
    this.render();
    this.dispatchEvent(new CustomEvent('game-reset', { bubbles:true, composed:true, detail:{ state:this.getState() } }));
  }

  getState() { return JSON.parse(JSON.stringify(this.state)); }

  disconnectedCallback() {
    if (this.stopLoop) this.stopLoop();
    if (this.offResize) this.offResize();
    if (this.renderer) this.renderer.dispose();
  }
}
customElements.define('escape-window-game', EscapeWindowGame);

Lec.mount({
  index: 18,
  kicker: 'ESCAPE WINDOW',
  title: '速度跨过哪条线，轨迹才不再回来？',
  take: '同一位置、同一中心天体下，临界线以下会回来，跨过临界线才不会回来。'
});
</script>
</body>
</html>
