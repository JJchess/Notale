<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p19-page {
    width: var(--content-w);
    height: var(--content-h);
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
  }

  .clock-stage {
    position: relative;
    flex: 0 0 260px;
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--surface);
  }

  .scene-canvas {
    z-index: 0;
    pointer-events: none;
  }

  progress.lec-progress {
    display: block;
    overflow: hidden;
    border: 0;
    appearance: none;
    font-size: 0;
    line-height: 0;
  }

  progress.lec-progress::-webkit-progress-bar,
  progress.lec-progress::-webkit-progress-value {
    height: 2px;
  }

  .stage-status {
    position: absolute;
    z-index: 8;
    top: var(--sp-4);
    left: var(--sp-5);
    display: flex;
    align-items: center;
    gap: var(--sp-4);
  }

  .task-count {
    min-width: 194px;
    padding: var(--sp-2) var(--sp-3);
    border-left: 3px solid var(--primary);
    background: var(--surface-data);
    color: var(--text);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
  }

  .task-count strong {
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: var(--fs-lead);
  }

  .stage-message {
    max-width: 560px;
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
  }

  .stage-message.is-error { color: var(--danger); }
  .stage-message.is-complete { color: var(--accent); font-weight: 650; }

  .reset-btn {
    position: absolute;
    z-index: 9;
    top: var(--sp-3);
    right: var(--sp-4);
    width: var(--control-h);
    min-width: var(--control-h);
    padding: 0;
    font-size: var(--fs-h2);
  }

  .sun {
    position: absolute;
    z-index: 2;
    top: 96px;
    left: 116px;
    width: 84px;
    height: 84px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 34px var(--accent-soft);
  }

  .sun-label {
    position: absolute;
    z-index: 3;
    top: 186px;
    left: 135px;
    color: var(--text-muted);
    font-size: var(--fs-label);
  }

  .orbit {
    position: absolute;
    z-index: 1;
    top: 56px;
    left: 154px;
    width: 720px;
    height: 174px;
    border: 2px solid var(--primary-line);
    border-radius: 50%;
  }

  .orbit::after {
    position: absolute;
    right: 80px;
    bottom: -30px;
    color: var(--text-muted);
    font-size: var(--fs-label);
    content: "绕太阳的位置";
  }

  .earth-orbit {
    position: absolute;
    z-index: 4;
    top: 83px;
    left: 742px;
    width: 118px;
    height: 118px;
    transform-origin: -548px 55px;
  }

  .earth-spin {
    position: absolute;
    inset: 0;
    border: 2px solid var(--primary);
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(90deg, var(--primary) 0 49%, var(--surface-data) 51% 100%);
    box-shadow: 0 0 22px var(--primary-soft);
  }

  .earth-spin::after {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 2px;
    background: var(--text);
    opacity: .72;
    content: "";
  }

  .surface-mark {
    position: absolute;
    z-index: 2;
    top: 50%;
    left: 14px;
    width: 16px;
    height: 16px;
    border: 3px solid var(--accent);
    border-radius: 50%;
    background: var(--bg);
    transform: translateY(-50%);
  }

  .earth-label {
    position: absolute;
    top: 206px;
    left: 734px;
    width: 136px;
    color: var(--text-muted);
    font-size: var(--fs-label);
    text-align: center;
  }

  .gear-zone {
    position: absolute;
    z-index: 7;
    top: 56px;
    right: 44px;
    width: 396px;
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .gear-unit {
    width: 176px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--sp-2);
  }

  .gear {
    position: relative;
    width: 128px;
    height: 128px;
    min-height: 128px;
    padding: 0;
    border: 10px dotted var(--primary);
    border-radius: 50%;
    background: var(--surface-data);
    color: var(--text);
    cursor: grab;
    touch-action: none;
  }

  .gear::before {
    position: absolute;
    inset: 26px;
    border: 3px solid var(--primary-line);
    border-radius: 50%;
    background: var(--surface);
    content: "";
  }

  .gear::after {
    position: absolute;
    inset: 48px;
    border-radius: 50%;
    background: var(--primary);
    content: "";
  }

  .gear:active { cursor: grabbing; }
  .gear.is-current { border-color: var(--accent); }
  .gear.is-current::after { background: var(--accent); }
  .gear.is-done { border-color: var(--line-strong); cursor: default; }
  .gear.is-error { border-color: var(--danger); }

  .gear-name {
    color: var(--text);
    font-size: var(--fs-sec);
    font-weight: 650;
    line-height: var(--lh-tight);
  }

  .gear-progress {
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
  }

  .effect-strip {
    flex: 0 0 92px;
    min-width: 0;
    display: flex;
    gap: var(--sp-3);
  }

  .effect-item {
    flex: 1 1 0;
    min-width: 0;
    padding: var(--sp-3) var(--sp-4);
    border-top: 3px solid var(--primary);
    background: var(--surface-data);
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
  }

  .effect-item strong {
    display: block;
    margin-bottom: var(--sp-1);
    color: var(--text);
    font-size: var(--fs-sec);
  }

  .effect-item .changes { color: var(--accent); }

  .clock-thesis {
    flex: 0 0 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-left: 6px solid var(--accent);
    background: var(--accent-soft);
    color: var(--text);
    font-size: var(--fs-lead);
    font-weight: 650;
    line-height: var(--lh-tight);
  }

  .clock-thesis strong { color: var(--accent); }

  .lanes {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }

  .motion-lane {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    align-items: stretch;
    gap: var(--sp-4);
  }

  .lane-head {
    flex: 0 0 190px;
    min-width: 0;
    padding: var(--sp-3) var(--sp-4);
    border-left: 4px solid var(--primary);
    background: var(--surface-data);
  }

  .lane-head h2 { margin-bottom: var(--sp-1); }
  .lane-head p { color: var(--text-muted); font-size: var(--fs-sec); }
  .lane-period { color: var(--accent); font-family: var(--font-mono); }

  .motion-lane .k-process {
    flex: 1 1 0;
    min-width: 0;
    gap: var(--sp-2);
  }

  .motion-lane .k-process > .step {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: var(--sp-3) var(--sp-4) var(--sp-3) var(--sp-5);
  }

  .motion-lane .k-process > .step::before {
    top: var(--sp-2);
    left: var(--sp-2);
  }

  .motion-lane .k-process > .arw {
    flex-basis: 24px;
    opacity: .28;
  }

  .motion-lane .k-process > .arw.is-live { opacity: 1; color: var(--accent); }
  .step-name { color: var(--text); font-size: var(--fs-sec); font-weight: 650; }
  .step-note { color: var(--text-muted); font-size: var(--fs-label); line-height: var(--lh-tight); }
  .motion-lane.is-complete .lane-head { border-left-color: var(--accent); background: var(--accent-soft); }
  .motion-lane.is-complete .step:last-child { border-color: var(--accent); background: var(--accent-soft); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; }
  }
</style>
</head>
<body data-page="19" data-total="50">
<div id="stage">
<main id="main">
  <section class="p19-page min0" aria-label="自转与公转的两条独立运动链">
    <div class="clock-stage no-pan" id="clockStage">
      <canvas class="scene-canvas cv-fill" id="sceneCanvas" aria-hidden="true"></canvas>
      <div class="stage-status">
        <div class="task-count">2 条运动链已完成 <strong id="doneCount">0/2</strong></div>
        <div class="stage-message" id="message" aria-live="polite">先转动昼夜齿轮，让地表标记穿过明暗分界线。</div>
      </div>
      <button class="reset-btn" id="resetBtn" type="button" title="重置两只时钟" aria-label="重置两只时钟">↺</button>

      <div class="sun" id="sun" aria-hidden="true"></div>
      <div class="sun-label">太阳 · 稳定光源</div>
      <div class="orbit" id="orbit" aria-hidden="true"></div>
      <div class="earth-orbit" id="earthOrbit" aria-hidden="true">
        <div class="earth-spin" id="earthSpin">
          <span class="surface-mark"></span>
        </div>
      </div>
      <div class="earth-label">地球 · 同时参与两种运动</div>

      <div class="gear-zone" aria-label="两只互不啮合的运动齿轮">
        <div class="gear-unit">
          <button class="gear is-current" id="spinGear" type="button" aria-label="昼夜齿轮，拖动转满一圈；方向键也可转动" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></button>
          <div class="gear-name">昼夜齿轮</div>
          <div class="gear-progress" id="spinProgress">0%</div>
        </div>
        <div class="gear-unit">
          <button class="gear" id="orbitGear" type="button" aria-label="公转齿轮，拖动转满一圈；方向键也可转动" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></button>
          <div class="gear-name">公转齿轮</div>
          <div class="gear-progress" id="orbitProgress">0%</div>
        </div>
      </div>
    </div>

    <div class="effect-strip" aria-label="两种操作分别改变的状态">
      <div class="effect-item"><strong>转动昼夜齿轮</strong><span class="changes">改变：地表点的明暗位置</span>　保持：绕太阳的位置</div>
      <div class="effect-item"><strong>转动公转齿轮</strong><span class="changes">改变：地球的绕日位置</span>　保持：地球自身转角</div>
    </div>

    <div class="lanes min0">
      <section class="motion-lane min0" id="spinLane" aria-label="自转形成昼夜的过程">
        <div class="lane-head min0">
          <h2>自转 → 昼夜</h2>
          <p>恒星自转周期 <span class="lane-period" id="rotationPeriod">—</span></p>
        </div>
        <div class="k-process min0" id="spinProcess">
          <span class="axis" aria-hidden="true"></span>
          <div class="step is-current" aria-current="step"><span class="step-name">齿轮转动</span><span class="step-note">地球绕自身轴旋转</span></div>
          <div class="arw" aria-hidden="true"></div>
          <div class="step"><span class="step-name">穿过分界线</span><span class="step-note">地表标记进入明暗两侧</span></div>
          <div class="arw" aria-hidden="true"></div>
          <div class="step"><span class="step-name">完成自转周期</span><span class="step-note">昼夜完成一次更替</span></div>
        </div>
      </section>

      <section class="motion-lane min0" id="orbitLane" aria-label="公转定义一年的过程">
        <div class="lane-head min0">
          <h2>公转 → 年</h2>
          <p>恒星公转周期 <span class="lane-period" id="orbitalPeriod">—</span></p>
        </div>
        <div class="k-process min0" id="orbitProcess">
          <span class="axis" aria-hidden="true"></span>
          <div class="step"><span class="step-name">齿轮转动</span><span class="step-note">推进绕日运动</span></div>
          <div class="arw" aria-hidden="true"></div>
          <div class="step"><span class="step-name">改变轨道位置</span><span class="step-note">地球沿轨道前进</span></div>
          <div class="arw" aria-hidden="true"></div>
          <div class="step"><span class="step-name">完成公转周期</span><span class="step-note">一整圈定义一年</span></div>
        </div>
      </section>
    </div>

    <div class="clock-thesis"><strong>两只独立的运动时钟：</strong>自转造成昼夜更替，公转定义一年；一天和一年不是同一只钟的快慢。</div>
  </section>
</main>
</div>
<script src="assets/lib/matter.min.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 19,
  kicker: "MOTION · TWO CLOCKS",
  title: "自转管昼夜，公转管一年",
  take: "自转造成昼夜，公转定义年，两种周期彼此独立"
});

(function () {
  var earth = Lec.K.EARTH;
  var rotationDays = Lec.P.rotationPeriodDays(earth);
  var rotationDirection = Lec.P.rotationDirection(earth);
  var orbitYears = Lec.P.orbitalPeriodYears(earth);
  var sig = Lec.P.significant;

  document.getElementById("rotationPeriod").textContent = sig(Math.abs(rotationDays), 3) + " 日 · " + (rotationDirection === "retrograde" || rotationDirection === -1 ? "逆行" : "顺行");
  document.getElementById("orbitalPeriod").textContent = sig(orbitYears, 3) + " 年";

  var Engine = Matter.Engine;
  var Bodies = Matter.Bodies;
  var Body = Matter.Body;
  var Composite = Matter.Composite;
  var engine = Engine.create({ gravity: { x: 0, y: 0, scale: 0 } });
  var bodies = {
    spin: Bodies.circle(0, 0, 56, { frictionAir: 0.12, inertia: 52000 }),
    orbit: Bodies.circle(0, 0, 56, { frictionAir: 0.12, inertia: 52000 })
  };
  Composite.add(engine.world, [bodies.spin, bodies.orbit]);

  var els = {
    canvas: document.getElementById("sceneCanvas"),
    spin: document.getElementById("spinGear"),
    orbit: document.getElementById("orbitGear"),
    earthSpin: document.getElementById("earthSpin"),
    earthOrbit: document.getElementById("earthOrbit"),
    spinProgress: document.getElementById("spinProgress"),
    orbitProgress: document.getElementById("orbitProgress"),
    spinLane: document.getElementById("spinLane"),
    orbitLane: document.getElementById("orbitLane"),
    spinProcess: document.getElementById("spinProcess"),
    orbitProcess: document.getElementById("orbitProcess"),
    doneCount: document.getElementById("doneCount"),
    message: document.getElementById("message")
  };

  var state = {
    active: null,
    lastAngle: 0,
    progress: { spin: 0, orbit: 0 },
    completed: { spin: false, orbit: false },
    visualAngle: { spin: 0, orbit: 0 }
  };

  function drawScene(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    var primary = Deck.rgb("--primary");
    var accent = Deck.rgb("--accent");
    var line = Deck.rgb("--line");
    var surface = Deck.rgb("--surface-data");

    ctx.fillStyle = "rgba(" + surface.join(",") + ",0.72)";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "rgba(" + primary.join(",") + ",0.07)";
    ctx.fillRect(18, 58, 900, 222);
    ctx.fillStyle = "rgba(" + accent.join(",") + ",0.055)";
    ctx.fillRect(936, 58, 454, 222);

    ctx.fillStyle = "rgba(" + line.join(",") + ",0.34)";
    ctx.fillRect(0, 48, w, 2);
    ctx.fillRect(926, 50, 2, h - 50);

    ctx.strokeStyle = "rgba(" + primary.join(",") + ",0.16)";
    ctx.lineWidth = 1;
    for (var x = 34; x < 900; x += 34) {
      ctx.beginPath(); ctx.moveTo(x, 60); ctx.lineTo(x, 278); ctx.stroke();
    }
    for (var y = 76; y < 278; y += 34) {
      ctx.beginPath(); ctx.moveTo(18, y); ctx.lineTo(918, y); ctx.stroke();
    }

    ctx.strokeStyle = "rgba(" + accent.join(",") + ",0.18)";
    ctx.lineWidth = 12;
    for (var r = 58; r <= 104; r += 23) {
      ctx.beginPath(); ctx.arc(158, 158, r, -0.45, 0.45); ctx.stroke();
    }

    ctx.strokeStyle = "rgba(" + primary.join(",") + ",0.24)";
    ctx.lineWidth = 2;
    for (var i = -3; i <= 3; i++) {
      ctx.beginPath();
      ctx.moveTo(202, 158 + i * 12);
      ctx.lineTo(732, 158 + i * 28);
      ctx.stroke();
    }

    ctx.setLineDash([8, 10]);
    ctx.strokeStyle = "rgba(" + primary.join(",") + ",0.34)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(514, 163, 356, 87, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = "rgba(" + line.join(",") + ",0.85)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(1160, 70); ctx.lineTo(1160, 266); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(956, 166); ctx.lineTo(1374, 166); ctx.stroke();

    [1050, 1270].forEach(function (cx, index) {
      var cy = index === 0 ? 117 : 215;
      ctx.strokeStyle = "rgba(" + primary.join(",") + ",0.62)";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, 62, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "rgba(" + line.join(",") + ",0.9)";
      ctx.lineWidth = 5;
      for (var mark = 0; mark < 12; mark++) {
        var a = mark * Math.PI / 6;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * 66, cy + Math.sin(a) * 66);
        ctx.lineTo(cx + Math.cos(a) * 78, cy + Math.sin(a) * 78);
        ctx.stroke();
      }
    });

    ctx.strokeStyle = "rgba(" + accent.join(",") + ",0.62)";
    ctx.lineWidth = 3;
    ctx.setLineDash([14, 10]);
    ctx.beginPath(); ctx.moveTo(1128, 117); ctx.lineTo(1192, 117); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1128, 215); ctx.lineTo(1192, 215); ctx.stroke();
    ctx.setLineDash([]);

    var spinP = state ? state.progress.spin : 0;
    var orbitP = state ? state.progress.orbit : 0;
    ctx.fillStyle = "rgba(" + primary.join(",") + ",0.12)";
    ctx.fillRect(956, 82, 190 * Math.max(0.05, spinP), 70);
    ctx.fillRect(1174, 180, 190 * Math.max(0.05, orbitP), 70);
    ctx.strokeStyle = "rgba(" + accent.join(",") + ",0.72)";
    ctx.lineWidth = 3;
    if (spinP > 0) { ctx.beginPath(); ctx.arc(1050, 117, 48, -Math.PI / 2, -Math.PI / 2 + spinP * Math.PI * 2); ctx.stroke(); }
    if (orbitP > 0) { ctx.beginPath(); ctx.arc(1270, 215, 48, -Math.PI / 2, -Math.PI / 2 + orbitP * Math.PI * 2); ctx.stroke(); }
  }

  function redrawScene() {
    drawScene(Deck.fit(els.canvas), els.canvas.offsetWidth, els.canvas.offsetHeight);
  }
  Deck.autofit(els.canvas, drawScene);

  function stageFor(kind) {
    if (state.completed[kind]) return 3;
    var p = state.progress[kind];
    return p <= 0.02 ? 0 : (p < 0.5 ? 1 : 2);
  }

  function updateProcess(kind) {
    var process = kind === "spin" ? els.spinProcess : els.orbitProcess;
    var lane = kind === "spin" ? els.spinLane : els.orbitLane;
    var steps = process.querySelectorAll(".step");
    var arrows = process.querySelectorAll(".arw");
    var current = stageFor(kind);
    steps.forEach(function (step, i) {
      step.classList.toggle("is-current", !state.completed[kind] && i === current);
      step.classList.toggle("is-done", i < current);
      if (!state.completed[kind] && i === current) step.setAttribute("aria-current", "step");
      else step.removeAttribute("aria-current");
    });
    arrows.forEach(function (arrow, i) {
      arrow.classList.toggle("is-live", state.completed[kind] || current > i);
    });
    lane.classList.toggle("is-complete", state.completed[kind]);
  }

  function render() {
    ["spin", "orbit"].forEach(function (kind) {
      var angle = state.visualAngle[kind];
      els[kind].style.transform = "rotate(" + angle + "rad)";
      if (kind === "spin") els.earthSpin.style.transform = "rotate(" + angle + "rad)";
      else els.earthOrbit.style.transform = "rotate(" + angle + "rad)";
      var percent = Math.min(100, Math.round(state.progress[kind] * 100));
      els[kind + "Progress"].textContent = percent + "%";
      els[kind].setAttribute("aria-valuenow", String(percent));
    });
    redrawScene();
  }

  function setMessage(text, type) {
    els.message.textContent = text;
    els.message.classList.toggle("is-error", type === "error");
    els.message.classList.toggle("is-complete", type === "complete");
  }

  function error(kind) {
    var text = kind === "orbit"
      ? "你移动的是公转位置，地表标记没有转过昼夜分界线。"
      : "你转动的是地球自身，还没有绕太阳一周。";
    setMessage(text, "error");
    els[kind].classList.add("is-error");
    if (!Deck.reduced()) {
      gsap.fromTo(els[kind], { x: -7, rotation: "-=8" }, { x: 0, rotation: "+=8", duration: 0.32, ease: "back.out(2)", overwrite: "auto", clearProps: "x" });
    }
    window.setTimeout(function () {
      els[kind].classList.remove("is-error");
      if (!state.completed.spin) setMessage("先转动昼夜齿轮，让地表标记穿过明暗分界线。");
    }, Deck.reduced() ? 0 : 900);
  }

  function complete(kind) {
    if (state.completed[kind]) return;
    state.completed[kind] = true;
    state.progress[kind] = 1;
    Body.setAngularVelocity(bodies[kind], 0);
    els[kind].classList.remove("is-current");
    els[kind].classList.add("is-done");
    updateProcess(kind);
    var count = (state.completed.spin ? 1 : 0) + (state.completed.orbit ? 1 : 0);
    els.doneCount.textContent = count + "/2";
    if (kind === "spin") {
      els.orbit.classList.add("is-current");
      setMessage("昼夜链已接通。现在只转动公转齿轮，让地球绕太阳一周。");
    } else {
      setMessage("两只独立时钟：自转造成昼夜更替，公转定义一年。", "complete");
    }
    if (!Deck.reduced()) {
      gsap.fromTo(kind === "spin" ? els.spinLane : els.orbitLane, { y: 5 }, { y: 0, duration: 0.38, ease: "back.out(1.8)", overwrite: "auto" });
    }
  }

  function addProgress(kind, delta) {
    if (state.completed[kind]) return;
    if (kind === "orbit" && !state.completed.spin) { error("orbit"); return; }
    if (kind === "spin" && state.completed.spin && !state.completed.orbit) { error("spin"); return; }
    var gain = Math.abs(delta) / (Math.PI * 2);
    state.progress[kind] = Math.min(1, state.progress[kind] + gain);
    state.visualAngle[kind] += delta;
    Body.setAngle(bodies[kind], state.visualAngle[kind]);
    Body.setAngularVelocity(bodies[kind], delta * 0.08);
    updateProcess(kind);
    render();
    if (state.progress[kind] >= 1) complete(kind);
  }

  function pointerAngle(el, event) {
    var pt = Deck.pt(el, event);
    return Math.atan2(pt.y - el.offsetHeight / 2, pt.x - el.offsetWidth / 2);
  }

  ["spin", "orbit"].forEach(function (kind) {
    var el = els[kind];
    el.addEventListener("pointerdown", function (event) {
      if (state.completed[kind]) return;
      if (kind === "orbit" && !state.completed.spin) { error(kind); return; }
      state.active = kind;
      state.lastAngle = pointerAngle(el, event);
      el.setPointerCapture(event.pointerId);
      event.preventDefault();
    });
    el.addEventListener("pointermove", function (event) {
      if (state.active !== kind) return;
      var next = pointerAngle(el, event);
      var delta = next - state.lastAngle;
      if (delta > Math.PI) delta -= Math.PI * 2;
      if (delta < -Math.PI) delta += Math.PI * 2;
      state.lastAngle = next;
      addProgress(kind, delta);
      event.preventDefault();
    });
    el.addEventListener("pointerup", function () { state.active = null; });
    el.addEventListener("pointercancel", function () { state.active = null; });
    el.addEventListener("keydown", function (event) {
      if (["ArrowLeft", "ArrowDown", "ArrowRight", "ArrowUp", " ", "Enter"].indexOf(event.key) === -1) return;
      event.preventDefault();
      var direction = (event.key === "ArrowLeft" || event.key === "ArrowDown") ? -1 : 1;
      addProgress(kind, direction * Math.PI / 6);
    });
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    state.active = null;
    state.progress.spin = state.progress.orbit = 0;
    state.completed.spin = state.completed.orbit = false;
    state.visualAngle.spin = state.visualAngle.orbit = 0;
    ["spin", "orbit"].forEach(function (kind) {
      Body.setAngle(bodies[kind], 0);
      Body.setAngularVelocity(bodies[kind], 0);
      els[kind].classList.remove("is-done", "is-error", "is-current");
    });
    els.spin.classList.add("is-current");
    els.doneCount.textContent = "0/2";
    setMessage("先转动昼夜齿轮，让地表标记穿过明暗分界线。");
    updateProcess("spin");
    updateProcess("orbit");
    render();
  });

  updateProcess("spin");
  updateProcess("orbit");
  render();

  if (!Deck.reduced()) {
    gsap.fromTo("#sun", { autoAlpha: 0, scale: 0.7 }, { autoAlpha: 1, scale: 1, duration: 0.55, ease: "power2.out" });
    gsap.fromTo("#orbit", { autoAlpha: 0, scaleX: 0.25, transformOrigin: "left center" }, { autoAlpha: 1, scaleX: 1, duration: 0.7, delay: 0.18, ease: "power2.out" });
    gsap.fromTo("#earthOrbit", { autoAlpha: 0, x: -48 }, { autoAlpha: 1, x: 0, duration: 0.48, delay: 0.48, ease: "power2.out" });
    gsap.fromTo(".gear-unit", { autoAlpha: 0, y: 28 }, { autoAlpha: 1, y: 0, duration: 0.42, delay: 0.62, stagger: 0.1, ease: "back.out(1.5)" });
  }

  Deck.loop(function (_t, dt) {
    Engine.update(engine, Math.min(24, Math.max(8, dt || 16.67)));
    ["spin", "orbit"].forEach(function (kind) {
      if (!state.active && !state.completed[kind] && Math.abs(bodies[kind].angularVelocity) > 0.0001) {
        state.visualAngle[kind] = bodies[kind].angle;
      }
    });
    render();
  }, { still: 1 });
})();
</script>
</body>
</html>
