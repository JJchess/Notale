<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .season-page {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
    width: var(--content-w);
    height: var(--content-h);
    min-width: 0;
    min-height: 0;
  }
  .season-scene {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .season-scene::before {
    position: absolute;
    z-index: 0;
    inset: 50% 6% auto;
    height: 1px;
    background: var(--primary-line);
    content: "";
  }
  #seasonCanvas {
    z-index: 1;
    cursor: grab;
  }
  #seasonCanvas.is-dragging { cursor: grabbing; }
  .scene-label {
    position: absolute;
    z-index: 3;
    top: var(--sp-3);
    color: var(--text-muted);
    font-size: var(--fs-label);
    font-weight: 600;
    line-height: var(--lh-tight);
    pointer-events: none;
  }
  .scene-label.left { left: 15%; }
  .scene-label.right { right: 13%; text-align: right; }
  .scene-label.center {
    top: auto;
    bottom: var(--sp-3);
    left: 50%;
    color: var(--primary);
    transform: translateX(-50%);
  }
  .axis-handle {
    position: absolute;
    z-index: 5;
    width: 48px;
    min-width: 48px;
    height: 48px;
    min-height: 48px;
    padding: 0;
    border: 2px solid var(--primary);
    border-radius: 50%;
    background: var(--surface-data);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    touch-action: none;
    transform: translate(-50%, -50%);
  }
  .axis-handle::before {
    position: absolute;
    right: 50%;
    bottom: 50%;
    width: 3px;
    height: 78px;
    background: var(--primary);
    content: "";
    transform: translateX(50%);
    transform-origin: center bottom;
  }
  .axis-handle.is-target {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .axis-handle.is-target::before { background: var(--accent); }
  .target-mark {
    position: absolute;
    z-index: 4;
    width: 18px;
    height: 18px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
  }
  .target-mark::after {
    position: absolute;
    top: 50%;
    left: 100%;
    width: 34px;
    height: 1px;
    background: var(--accent);
    content: "";
  }
  .drag-note {
    position: absolute;
    z-index: 5;
    top: var(--sp-3);
    left: 50%;
    width: 390px;
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
    text-align: center;
    transform: translateX(-50%);
    pointer-events: none;
  }
  .drag-note.error { color: var(--danger); }
  .calibration {
    position: absolute;
    z-index: 5;
    right: var(--sp-4);
    bottom: var(--sp-3);
    display: flex;
    gap: var(--sp-4);
    align-items: center;
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }
  .calibration strong { color: var(--text); font-family: var(--font-mono); }
  .calibration .done { color: var(--accent); }
  .reset-button {
    width: 44px;
    min-width: 44px;
    height: 44px;
    min-height: 44px;
    padding: 0;
    font-size: 24px;
    visibility: hidden;
  }
  .reset-button.show { visibility: visible; }
  .season-compare {
    flex: 0 0 205px;
    --compare-cols: 2;
    grid-template-columns: 160px repeat(2, minmax(0, 1fr));
  }
  .season-compare > * { padding: var(--sp-2) var(--sp-4); }
  .season-compare > .hdr {
    min-height: 48px;
    align-items: center;
    font-size: var(--fs-body);
  }
  .season-compare > .dim { font-size: var(--fs-label); }
  .season-compare > .cell {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-3);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
  }
  .cell-copy { color: var(--text-muted); }
  .cell-value {
    flex: 0 0 auto;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: var(--fs-body);
    font-weight: 650;
  }
  .season-compare .is-key .cell-value { color: var(--accent); }
  .cause-line {
    position: absolute;
    z-index: 6;
    bottom: 216px;
    left: 50%;
    display: none;
    padding: var(--sp-2) var(--sp-4);
    border: 1px solid var(--accent);
    background: var(--surface-data);
    color: var(--accent);
    font-size: var(--fs-sec);
    font-weight: 650;
    line-height: var(--lh-tight);
    transform: translateX(-50%);
  }
  .cause-line.show { display: block; }
  progress.lec-progress {
    display: block;
    appearance: none;
    border: 0;
    font-size: 0;
    line-height: 0;
  }
  progress.lec-progress::-webkit-progress-bar,
  progress.lec-progress::-webkit-progress-value {
    height: 2px;
    border: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .axis-handle, .target-mark, .cause-line { transition: none; }
  }
</style>
</head>
<body data-page="20" data-total="50">
<div id="stage">
<main id="main">
  <section class="season-page min0" aria-label="地轴倾角与季节的三维比较">
    <div class="season-scene min0 no-pan" id="sceneWrap">
      <canvas id="seasonCanvas" class="cv-fill" aria-hidden="true"></canvas>
      <span class="scene-label left">北半球朝向太阳</span>
      <span class="scene-label right">北半球背离太阳</span>
      <span class="scene-label center">相同距离 · 相同纬度 40°N · 相同光强</span>
      <p class="drag-note" id="dragNote">拖动地轴北端，对准地球真实倾角</p>
      <button class="axis-handle" id="axisHandle" type="button" aria-label="地轴倾角，方向键可调整" aria-valuemin="0" aria-valuemax="23.4" aria-valuenow="0" title="拖动或用方向键调整地轴倾角">0°</button>
      <span class="target-mark" id="targetMark" aria-hidden="true"></span>
      <div class="calibration" aria-live="polite">
        <span>倾角校准 <strong id="calState">0/1</strong></span>
        <span>太阳高度、昼长 <strong id="evidenceState">0/2</strong></span>
        <button class="reset-button" id="resetButton" type="button" aria-label="重置倾角" title="重置">↺</button>
      </div>
    </div>

    <div class="k-comparison season-compare min0" aria-label="同一纬度在轨道两侧的比较">
      <div class="hdr">比较维度</div>
      <div class="hdr">北半球朝向太阳</div>
      <div class="hdr">北半球背离太阳</div>

      <div class="dim">地轴方向</div>
      <div class="cell diff" id="axisToward"><span class="cell-copy">北端朝向太阳</span><span class="cell-value" id="tiltToward">0°</span></div>
      <div class="cell diff" id="axisAway"><span class="cell-copy">北端背离太阳</span><span class="cell-value" id="tiltAway">0°</span></div>

      <div class="dim">正午太阳高度</div>
      <div class="cell diff" id="altToward"><span class="cell-copy">光线更接近直射</span><span class="cell-value" id="altTowardValue">50°</span></div>
      <div class="cell diff" id="altAway"><span class="cell-copy">光线更倾斜</span><span class="cell-value" id="altAwayValue">50°</span></div>

      <div class="dim">白昼长度</div>
      <div class="cell diff" id="dayToward"><span class="cell-copy">受光昼弧更长</span><span class="cell-value" id="dayTowardValue">12.0 h</span></div>
      <div class="cell diff" id="dayAway"><span class="cell-copy">受光昼弧更短</span><span class="cell-value" id="dayAwayValue">12.0 h</span></div>
    </div>
    <div class="cause-line" id="causeLine">地轴倾斜 → 太阳高度与白昼长度不同</div>
  </section>
</main>
</div>
<script src="assets/lib/three.min.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 20,
  kicker: "ORBITAL MOTION / SEASONS",
  title: "同一束阳光，两种季节",
  take: "季节主要来自地轴倾斜：它让同一半球在一年中同时改变太阳高度和白昼长度。"
});

(function () {
  var earth = Lec.K.EARTH;
  var earthPlanet = Lec.K.PLANETS.find(function (planet) { return planet.id === "earth"; });
  var targetTilt = earthPlanet.axialTiltDeg;
  var latitude = 40;
  var state = { tilt: 0, locked: false, dragging: false };
  var wrap = document.getElementById("sceneWrap");
  var canvas = document.getElementById("seasonCanvas");
  var handle = document.getElementById("axisHandle");
  var targetMark = document.getElementById("targetMark");
  var dragNote = document.getElementById("dragNote");
  var resetButton = document.getElementById("resetButton");
  var causeLine = document.getElementById("causeLine");
  var reduceMotion = Deck.reduced();

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
  camera.position.set(0, 3.7, 13.2);
  camera.lookAt(0, 0, 0);
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x071018, 0);

  scene.add(new THREE.AmbientLight(0x8aa8b3, 0.48));
  var sunLight = new THREE.PointLight(0xffe4a3, 50, 30, 1.2);
  sunLight.position.set(0, 0, 0);
  scene.add(sunLight);

  var sun = new THREE.Mesh(
    new THREE.SphereGeometry(0.58, 40, 24),
    new THREE.MeshBasicMaterial({ color: 0xffd166 })
  );
  scene.add(sun);
  var sunHalo = new THREE.Mesh(
    new THREE.SphereGeometry(0.76, 32, 16),
    new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.12, side: THREE.BackSide })
  );
  scene.add(sunHalo);

  var orbit = new THREE.Mesh(
    new THREE.RingGeometry(4.15, 4.18, 96),
    new THREE.MeshBasicMaterial({ color: 0x4fc3d7, transparent: true, opacity: 0.28, side: THREE.DoubleSide })
  );
  orbit.rotation.x = Math.PI / 2;
  scene.add(orbit);

  function line(points, color, opacity) {
    var geometry = new THREE.BufferGeometry().setFromPoints(points);
    return new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: color, transparent: opacity < 1, opacity: opacity }));
  }

  var beamMaterial = new THREE.LineBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.36 });
  [-0.55, -0.18, 0.18, 0.55].forEach(function (y) {
    var leftBeam = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-0.7, y * 0.42, 0), new THREE.Vector3(-3.25, y, 0)
    ]), beamMaterial);
    var rightBeam = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0.7, y * 0.42, 0), new THREE.Vector3(3.25, y, 0)
    ]), beamMaterial);
    scene.add(leftBeam, rightBeam);
  });

  function buildEarth(x, sunwardSign) {
    var group = new THREE.Group();
    group.position.x = x;
    var globe = new THREE.Mesh(
      new THREE.SphereGeometry(1.22, 56, 36),
      new THREE.MeshStandardMaterial({ color: 0x28728a, roughness: 0.82, metalness: 0.02 })
    );
    group.add(globe);

    var night = new THREE.Mesh(
      new THREE.SphereGeometry(1.226, 56, 36, sunwardSign > 0 ? Math.PI / 2 : -Math.PI / 2, Math.PI),
      new THREE.MeshBasicMaterial({ color: 0x071018, transparent: true, opacity: 0.72, side: THREE.DoubleSide })
    );
    night.rotation.y = sunwardSign > 0 ? 0 : Math.PI;
    group.add(night);

    var latitudeCurve = new THREE.EllipseCurve(0, 0, Math.cos(Lec.P.degToRad(latitude)) * 1.23, Math.cos(Lec.P.degToRad(latitude)) * 1.23, 0, Math.PI * 2);
    var latPoints = latitudeCurve.getPoints(80).map(function (p) {
      return new THREE.Vector3(p.x, Math.sin(Lec.P.degToRad(latitude)) * 1.23, p.y);
    });
    var latitudeLine = line(latPoints, 0x4fc3d7, 0.72);
    group.add(latitudeLine);

    var axis = line([new THREE.Vector3(0, -1.72, 0), new THREE.Vector3(0, 1.72, 0)], 0x4fc3d7, 1);
    axis.material.linewidth = 2;
    group.add(axis);

    var daylight = new THREE.Mesh(
      new THREE.TorusGeometry(Math.cos(Lec.P.degToRad(latitude)) * 1.27, 0.028, 8, 96),
      new THREE.MeshBasicMaterial({ color: 0x4fc3d7 })
    );
    daylight.rotation.x = Math.PI / 2;
    daylight.position.y = Math.sin(Lec.P.degToRad(latitude)) * 1.27;
    group.add(daylight);

    var altitude = line([new THREE.Vector3(0, 1.36, 0), new THREE.Vector3(sunwardSign * 0.94, 1.36, 0)], 0x4fc3d7, 0.9);
    group.add(altitude);
    scene.add(group);
    return { group: group, globe: globe, axis: axis, daylight: daylight, altitude: altitude };
  }

  var leftEarth = buildEarth(-4.15, 1);
  var rightEarth = buildEarth(4.15, -1);

  function dayHours(declinationDeg) {
    var lat = Lec.P.degToRad(latitude);
    var dec = Lec.P.degToRad(declinationDeg);
    return 24 * Math.acos(-Math.tan(lat) * Math.tan(dec)) / Math.PI;
  }

  function rounded(value, digits) {
    return Lec.P.round(value, digits);
  }

  function setKeyState(on) {
    ["axisToward", "axisAway", "altToward", "altAway", "dayToward", "dayAway"].forEach(function (id) {
      document.getElementById(id).classList.toggle("is-key", on);
    });
  }

  function updateReadouts() {
    var t = state.tilt;
    var highAltitude = 90 - Math.abs(latitude - t);
    var lowAltitude = 90 - Math.abs(latitude + t);
    var longDay = dayHours(t);
    var shortDay = dayHours(-t);
    var tiltText = rounded(t, 1) + "°";
    handle.textContent = tiltText;
    handle.setAttribute("aria-valuenow", rounded(t, 1));
    handle.setAttribute("aria-valuetext", "地轴倾角 " + tiltText);
    document.getElementById("tiltToward").textContent = tiltText;
    document.getElementById("tiltAway").textContent = tiltText;
    document.getElementById("altTowardValue").textContent = rounded(highAltitude, 1) + "°";
    document.getElementById("altAwayValue").textContent = rounded(lowAltitude, 1) + "°";
    document.getElementById("dayTowardValue").textContent = rounded(longDay, 1) + " h";
    document.getElementById("dayAwayValue").textContent = rounded(shortDay, 1) + " h";
  }

  function positionControls() {
    var w = wrap.clientWidth;
    var h = wrap.clientHeight;
    var baseX = w * 0.245;
    var baseY = h * 0.57;
    var radius = Math.min(112, h * 0.32);
    var angle = Lec.P.degToRad(state.tilt);
    handle.style.left = (baseX - Math.sin(angle) * radius) + "px";
    handle.style.top = (baseY - Math.cos(angle) * radius) + "px";
    var targetAngle = Lec.P.degToRad(targetTilt);
    targetMark.style.left = (baseX - Math.sin(targetAngle) * radius) + "px";
    targetMark.style.top = (baseY - Math.cos(targetAngle) * radius) + "px";
  }

  function updateScene() {
    var a = Lec.P.degToRad(state.tilt);
    leftEarth.group.rotation.z = a;
    rightEarth.group.rotation.z = a;
    var dayScale = 0.72 + dayHours(state.tilt) / 24 * 0.56;
    var nightScale = 0.72 + dayHours(-state.tilt) / 24 * 0.56;
    leftEarth.daylight.scale.set(dayScale, dayScale, dayScale);
    rightEarth.daylight.scale.set(nightScale, nightScale, nightScale);
    leftEarth.daylight.material.color.setHex(state.locked ? 0xffd166 : 0x4fc3d7);
    rightEarth.daylight.material.color.setHex(state.locked ? 0xffd166 : 0x4fc3d7);
    leftEarth.altitude.material.color.setHex(state.locked ? 0xffd166 : 0x4fc3d7);
    rightEarth.altitude.material.color.setHex(state.locked ? 0xffd166 : 0x4fc3d7);
    leftEarth.axis.material.color.setHex(state.locked ? 0xffd166 : 0x4fc3d7);
    rightEarth.axis.material.color.setHex(state.locked ? 0xffd166 : 0x4fc3d7);
    updateReadouts();
    positionControls();
    renderer.render(scene, camera);
  }

  function setTilt(value) {
    state.tilt = Deck.clamp(value, 0, targetTilt);
    state.locked = false;
    handle.classList.remove("is-target");
    causeLine.classList.remove("show");
    resetButton.classList.remove("show");
    document.getElementById("calState").textContent = "0/1";
    document.getElementById("evidenceState").textContent = state.tilt > 0.5 ? "1/2" : "0/2";
    setKeyState(false);
    updateScene();
  }

  function lockTarget() {
    state.tilt = targetTilt;
    state.locked = true;
    handle.classList.add("is-target");
    causeLine.classList.add("show");
    resetButton.classList.add("show");
    document.getElementById("calState").textContent = "1/1";
    document.getElementById("evidenceState").textContent = "2/2";
    document.getElementById("calState").classList.add("done");
    document.getElementById("evidenceState").classList.add("done");
    dragNote.classList.remove("error");
    dragNote.textContent = "同一半球：太阳更高时，白昼也更长";
    setKeyState(true);
    updateScene();
    if (!reduceMotion) {
      gsap.fromTo(targetMark, { scale: 1 }, { scale: 1.45, duration: 0.22, yoyo: true, repeat: 1, ease: "power2.out" });
      gsap.fromTo(causeLine, { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out" });
    }
  }

  function releaseTilt() {
    state.dragging = false;
    canvas.classList.remove("is-dragging");
    if (targetTilt - state.tilt <= 1.2) {
      lockTarget();
    } else {
      dragNote.classList.add("error");
      dragNote.textContent = "还未对准地球倾角；继续拖动地轴端点，让刻度线与目标标记重合。";
      if (!reduceMotion) {
        gsap.fromTo(handle, { x: -5 }, { x: 0, duration: 0.12, ease: "power2.out", repeat: 2, yoyo: true, overwrite: true });
      }
    }
  }

  function tiltFromPointer(event) {
    var p = Deck.pt(wrap, event);
    var w = wrap.clientWidth;
    var h = wrap.clientHeight;
    var baseX = w * 0.245;
    var baseY = h * 0.57;
    var angle = Math.atan2(baseX - p.x, baseY - p.y) * 180 / Math.PI;
    setTilt(angle);
  }

  handle.addEventListener("pointerdown", function (event) {
    state.dragging = true;
    handle.setPointerCapture(event.pointerId);
    canvas.classList.add("is-dragging");
    dragNote.classList.remove("error");
    dragNote.textContent = "对准目标刻度 " + rounded(targetTilt, 1) + "°";
    event.preventDefault();
  });
  handle.addEventListener("pointermove", function (event) {
    if (state.dragging) tiltFromPointer(event);
  });
  handle.addEventListener("pointerup", releaseTilt);
  handle.addEventListener("pointercancel", releaseTilt);
  handle.addEventListener("keydown", function (event) {
    var step = event.shiftKey ? 5 : 1;
    if (event.key === "ArrowUp" || event.key === "ArrowRight") {
      event.preventDefault();
      setTilt(state.tilt + step);
      if (targetTilt - state.tilt <= 0.5) lockTarget();
    } else if (event.key === "ArrowDown" || event.key === "ArrowLeft") {
      event.preventDefault();
      setTilt(state.tilt - step);
    } else if (event.key === "Home") {
      event.preventDefault(); setTilt(0);
    } else if (event.key === "End") {
      event.preventDefault(); lockTarget();
    }
  });
  resetButton.addEventListener("click", function () {
    document.getElementById("calState").classList.remove("done");
    document.getElementById("evidenceState").classList.remove("done");
    dragNote.classList.remove("error");
    dragNote.textContent = "拖动地轴北端，对准地球真实倾角";
    setTilt(0);
    handle.focus();
  });

  function resize() {
    var w = wrap.clientWidth;
    var h = wrap.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    positionControls();
    renderer.render(scene, camera);
  }
  Deck.onResize(resize);
  resize();

  if (reduceMotion) {
    lockTarget();
  } else {
    gsap.fromTo(beamMaterial, { opacity: 0 }, { opacity: 0.36, duration: 0.7, ease: "power1.out" });
    gsap.fromTo([leftEarth.group.position, rightEarth.group.position], { y: -0.35 }, { y: 0, duration: 0.65, ease: "power2.out", stagger: 0.08 });
  }
  updateScene();
}());
</script>
</body>
</html>
