<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main { overflow: hidden; }
  .retro-page { position: relative; width: var(--content-w); height: var(--content-h); }
  .orbit-scene { position: relative; height: 392px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-data); }
  .orbit-scene canvas { display: block; }
  .scene-head { position: absolute; z-index: 3; top: var(--sp-4); left: var(--sp-4); pointer-events: none; }
  .scene-head h2 { margin-bottom: var(--sp-1); }
  .scene-legend { display: flex; gap: var(--sp-4); color: var(--text-muted); font-size: var(--fs-label); line-height: var(--lh-tight); }
  .scene-legend span { display: inline-flex; align-items: center; gap: var(--sp-2); }
  .legend-line { width: 24px; height: 2px; background: var(--primary); }
  .legend-line.accent { background: var(--accent); }
  .telemetry-panel { position: absolute; z-index: 3; top: var(--sp-4); right: var(--sp-4); width: 260px; padding: var(--sp-3); border: 1px solid var(--line); background: var(--surface); pointer-events: none; }
  .telemetry-row { display: flex; justify-content: space-between; gap: var(--sp-3); min-height: 28px; color: var(--text-muted); font-size: var(--fs-label); line-height: var(--lh-tight); }
  .telemetry-row strong { color: var(--text); font-family: var(--font-mono); font-size: var(--fs-sec); }
  .telemetry-row strong.current { color: var(--accent); }
  .scene-label { position: absolute; z-index: 3; transform: translate(-50%, -50%); padding: var(--sp-1) var(--sp-2); border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: var(--fs-label); font-weight: 650; line-height: var(--lh-tight); pointer-events: none; white-space: nowrap; }
  .scene-label.projection { border-color: var(--accent); color: var(--accent); }
  .scene-foot { position: absolute; z-index: 3; right: var(--sp-4); bottom: var(--sp-3); color: var(--text-muted); font-size: var(--fs-sec); line-height: var(--lh-body); pointer-events: none; }
  .game-strip { height: 212px; margin-top: var(--sp-4); }
  .motion-box { height: 100%; padding: var(--sp-3) var(--sp-4) !important; }
  .motion-box > .bt { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--sp-2) !important; }
  .motion-box > .bt span { color: var(--text-muted); font-size: var(--fs-label); font-weight: 600; }
  .motion-box > .lv { margin-top: var(--sp-2); margin-left: 0; padding-left: 0; border-left: 0; }
  .motion-box > .lv::before { display: none; }
  .phase-track { position: relative; display: flex; gap: var(--sp-2); }
  .phase-track::before { position: absolute; z-index: 0; top: 22px; right: 28px; left: 28px; height: 2px; background: var(--primary-line); content: ""; }
  .phase { position: relative; z-index: 1; flex: 1 1 0; min-width: 0; height: 48px; padding: 0 var(--sp-2) !important; display: flex; align-items: center; justify-content: center; gap: var(--sp-2); border: 1px solid var(--line) !important; border-left-width: 1px !important; border-radius: var(--radius-sm); background: var(--surface-data) !important; color: var(--text-muted); font-size: var(--fs-label); font-weight: 650; line-height: var(--lh-tight); }
  .phase::before { width: 9px; height: 9px; flex: 0 0 auto; border: 2px solid var(--primary); border-radius: 50%; background: var(--surface-data); content: ""; }
  .phase.is-found { color: var(--text); border-color: var(--primary) !important; }
  .phase.is-found::before { background: var(--primary); }
  .phase.is-current { border-color: var(--accent) !important; color: var(--accent); }
  .phase.is-current::before { border-color: var(--accent); background: var(--accent); }
  .phase.shake { animation: shake .28s ease-in-out 2; }
  .controls-row { display: flex; align-items: center; gap: var(--sp-4); margin-top: var(--sp-3); }
  .time-control { flex: 1 1 0; min-width: 0; }
  .time-control label { min-width: 120px; }
  .range-wrap { flex: 1 1 0; min-width: 0; }
  .range-marks { display: flex; justify-content: space-between; margin-top: var(--sp-1); color: var(--text-muted); font-family: var(--font-mono); font-size: var(--fs-tick); line-height: var(--lh-tight); }
  .game-actions { flex: 0 0 auto; }
  .status { width: 388px; min-height: 44px; display: flex; align-items: center; padding-left: var(--sp-3); border-left: 3px solid var(--primary); color: var(--text-muted); font-size: var(--fs-sec); line-height: var(--lh-body); }
  .status.good { border-left-color: var(--success); color: var(--text); }
  .status.bad { border-left-color: var(--danger); color: var(--text); }
  progress.lec-progress { appearance: none; display: block; border: 0; padding: 0; font-size: 0; line-height: 0; }
  .conclusion { position: absolute; z-index: 5; top: 240px; right: var(--sp-5); left: var(--sp-5); padding: var(--sp-3) var(--sp-5); border-left: 6px solid var(--accent); background: var(--surface); color: var(--text); font-size: var(--fs-lead); font-weight: 650; line-height: var(--lh-body); opacity: 0; visibility: hidden; transform: translateY(var(--sp-3)); pointer-events: none; transition: opacity .25s, transform .25s; }
  .conclusion.show { opacity: 1; visibility: visible; transform: translateY(0); }
  @keyframes shake { 0%,100% { transform: translateX(0); } 35% { transform: translateX(-7px); } 70% { transform: translateX(7px); } }
  @media (prefers-reduced-motion: reduce) { .phase.shake { animation: none; } .conclusion { transition: none; } }
</style>
</head>
<body data-page="22" data-total="50">
<div id="stage">
<main id="main">
  <section class="retro-page min0" aria-label="火星逆行相对运动实验">
    <div id="orbitScene" class="orbit-scene no-pan min0" role="img" aria-label="地球追上火星时，地火视线投向恒星背景的三维示意">
      <div class="scene-head">
        <h2>同一时刻的两层视角</h2>
        <div class="scene-legend">
          <span><i class="legend-line"></i>日心轨道与公转方向</span>
          <span><i class="legend-line accent"></i>地火视线与背景投影</span>
        </div>
      </div>
      <div class="telemetry-panel telemetry" aria-label="实时读数">
        <div class="telemetry-row"><span>距会合时刻</span><strong id="dayReadout">0 天</strong></div>
        <div class="telemetry-row"><span>背景投影方向</span><strong id="directionReadout" class="current">顺行</strong></div>
        <div class="telemetry-row"><span>地火会合周期</span><strong id="synodicReadout">—</strong></div>
      </div>
      <span id="earthLabel" class="scene-label">地球</span>
      <span id="marsLabel" class="scene-label">火星</span>
      <span id="projectionLabel" class="scene-label projection">恒星背景上的火星</span>
      <div class="scene-foot">两颗行星始终沿同一公转方向前进</div>
    </div>

    <div class="game-strip k-classification min0">
      <section id="motionBox" class="box motion-box">
        <h2 class="bt">火星相对恒星背景的视运动 <span>拖动时间，依次辨认五段</span></h2>
        <div class="lv" aria-label="视运动的五个下位阶段">
          <div class="phase-track">
            <div class="box phase is-current" data-phase="0" aria-current="step">顺行 1</div>
            <div class="box phase" data-phase="1">留 1</div>
            <div class="box phase" data-phase="2">逆行</div>
            <div class="box phase" data-phase="3">留 2</div>
            <div class="box phase" data-phase="4">顺行 2</div>
          </div>
        </div>
        <div class="controls-row">
          <div class="ctl time-control">
            <label for="timeRange">时间推进器</label>
            <div class="range-wrap">
              <input id="timeRange" type="range" min="-125" max="125" step="1" value="-125" aria-describedby="gameStatus">
              <div class="range-marks"><span>-125 天</span><span>会合</span><span>+125 天</span></div>
            </div>
          </div>
          <div class="row gap-2 game-actions">
            <button id="markButton" type="button">记录当前段</button>
            <button id="resetButton" type="button" title="重置实验" aria-label="重置实验">↺</button>
          </div>
          <div id="gameStatus" class="status" aria-live="polite">目标：找到第一次“顺行”，再记录当前段。</div>
        </div>
      </section>
    </div>
    <div id="conclusion" class="conclusion">火星没有掉头；逆行只是地球超越外行星时，观察方向在恒星背景上短暂反转。</div>
  </section>
</main>
</div>
<script src="assets/lib/three.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 22,
  kicker: "RELATIVE MOTION",
  title: "超车时，火星为什么倒退",
  take: "火星没有掉头；逆行只是地球超越外行星时，观察方向在恒星背景上短暂反转。"
});

(function () {
  var planets = Lec.K.PLANETS;
  var earth = planets.filter(function (p) { return p.id === 'earth'; })[0];
  var mars = planets.filter(function (p) { return p.id === 'mars'; })[0];
  var sceneEl = document.getElementById('orbitScene');
  var slider = document.getElementById('timeRange');
  var markButton = document.getElementById('markButton');
  var resetButton = document.getElementById('resetButton');
  var statusEl = document.getElementById('gameStatus');
  var dayReadout = document.getElementById('dayReadout');
  var directionReadout = document.getElementById('directionReadout');
  var synodicReadout = document.getElementById('synodicReadout');
  var conclusion = document.getElementById('conclusion');
  var phaseEls = Array.prototype.slice.call(document.querySelectorAll('.phase'));
  var labels = {
    earth: document.getElementById('earthLabel'),
    mars: document.getElementById('marsLabel'),
    projection: document.getElementById('projectionLabel')
  };
  var phaseNames = ['顺行 1', '留 1', '逆行', '留 2', '顺行 2'];
  var state = { day: -125, next: 0, found: [false, false, false, false, false], complete: false };
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(Deck.token('--surface-data'));
  scene.fog = new THREE.Fog(new THREE.Color(Deck.token('--surface-data')), 8, 15);
  var camera = new THREE.PerspectiveCamera(37, 1, 0.1, 30);
  camera.position.set(0, 7.1, 8.7);
  camera.lookAt(0.2, 0, 0);
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.domElement.className = 'cv-fill';
  sceneEl.insertBefore(renderer.domElement, sceneEl.firstChild);

  scene.add(new THREE.AmbientLight(0xffffff, 0.52));
  var sunLight = new THREE.PointLight(0xffd166, 32, 14, 2);
  sunLight.position.set(-0.55, 0.45, 0);
  scene.add(sunLight);

  function orbitLine(body, color, opacity) {
    var points = [];
    for (var i = 0; i <= 160; i += 1) {
      var p = Lec.P.orbitPosition(body.semimajorAU, body.eccentricity, Math.PI * 2 * i / 160);
      points.push(new THREE.Vector3(p.x * 2.25 - 0.55, 0, p.y * 2.25));
    }
    var geo = new THREE.BufferGeometry().setFromPoints(points);
    return new THREE.Line(geo, new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: opacity }));
  }

  var primaryColor = new THREE.Color(Deck.token('--primary'));
  var accentColor = new THREE.Color(Deck.token('--accent'));
  var mutedColor = new THREE.Color(Deck.token('--text-muted'));
  scene.add(orbitLine(earth, primaryColor, 0.72));
  scene.add(orbitLine(mars, primaryColor, 0.46));

  var sun = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 20), new THREE.MeshStandardMaterial({ color: accentColor, emissive: accentColor, emissiveIntensity: 1.5 }));
  sun.position.set(-0.55, 0, 0);
  scene.add(sun);
  var earthMesh = new THREE.Mesh(new THREE.SphereGeometry(0.11, 24, 16), new THREE.MeshStandardMaterial({ color: 0x4fc3d7, roughness: 0.66 }));
  var marsMesh = new THREE.Mesh(new THREE.SphereGeometry(0.14, 24, 16), new THREE.MeshStandardMaterial({ color: 0xd88962, roughness: 0.78 }));
  scene.add(earthMesh, marsMesh);

  function arrowRing(radius, y, color) {
    var curve = new THREE.EllipseCurve(-0.55, 0, radius, radius, 0.35, 1.0, false, 0);
    var pts = curve.getPoints(28).map(function (p) { return new THREE.Vector3(p.x, y, p.y); });
    var line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.8 }));
    scene.add(line);
    var tip = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.18, 10), new THREE.MeshBasicMaterial({ color: color }));
    tip.position.copy(pts[pts.length - 1]);
    tip.rotation.z = -Math.PI / 2;
    tip.rotation.y = -0.6;
    scene.add(tip);
  }
  arrowRing(2.25, 0.025, primaryColor);
  arrowRing(3.42, 0.025, primaryColor);

  var rayGeometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
  var rayLine = new THREE.Line(rayGeometry, new THREE.LineBasicMaterial({ color: accentColor, transparent: true, opacity: 0.92 }));
  scene.add(rayLine);

  var skyGroup = new THREE.Group();
  scene.add(skyGroup);
  var starGeo = new THREE.BufferGeometry();
  var starPositions = [];
  for (var s = 0; s < 120; s += 1) {
    var a = -Math.PI + (s / 119) * Math.PI * 2;
    var r = 4.7 + 0.16 * Math.sin(s * 5.7);
    starPositions.push(Math.cos(a) * r, 0.08 + (s % 5) * 0.07, Math.sin(a) * r);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
  skyGroup.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: mutedColor, size: 0.035, transparent: true, opacity: 0.58 })));
  var projectionMesh = new THREE.Mesh(new THREE.SphereGeometry(0.09, 18, 12), new THREE.MeshBasicMaterial({ color: accentColor }));
  skyGroup.add(projectionMesh);
  var trailMaterial = new THREE.LineBasicMaterial({ color: accentColor, transparent: true, opacity: 0.76 });
  var trailLine = new THREE.Line(new THREE.BufferGeometry(), trailMaterial);
  skyGroup.add(trailLine);

  function orbitalPosition(body, day) {
    var mean = Math.PI * 2 * day / body.orbitalDays;
    var p = Lec.P.orbitPosition(body.semimajorAU, body.eccentricity, mean);
    return new THREE.Vector3(p.x * 2.25 - 0.55, 0, p.y * 2.25);
  }
  function viewAngle(day) {
    var e = Lec.P.orbitPosition(earth.semimajorAU, earth.eccentricity, Math.PI * 2 * day / earth.orbitalDays);
    var m = Lec.P.orbitPosition(mars.semimajorAU, mars.eccentricity, Math.PI * 2 * day / mars.orbitalDays);
    return Math.atan2(m.y - e.y, m.x - e.x);
  }
  function angularRate(day) {
    var a = viewAngle(day - 0.2);
    var b = viewAngle(day + 0.2);
    var d = Math.atan2(Math.sin(b - a), Math.cos(b - a));
    return d / 0.4;
  }
  function category(day) {
    var rate = angularRate(day);
    if (Math.abs(rate) < 0.00055) return day < 0 ? 1 : 3;
    if (rate < 0) return 2;
    return day < 0 ? 0 : 4;
  }
  function projectedPoint(day) {
    var angle = viewAngle(day);
    return new THREE.Vector3(Math.cos(angle) * 4.7, 0.24, Math.sin(angle) * 4.7);
  }
  function buildTrail(day) {
    var points = [];
    var start = Math.max(-125, day - 76);
    for (var d = start; d <= day; d += 2) points.push(projectedPoint(d));
    trailLine.geometry.dispose();
    trailLine.geometry = new THREE.BufferGeometry().setFromPoints(points);
  }
  function placeLabel(el, object) {
    var p = object.getWorldPosition(new THREE.Vector3()).project(camera);
    el.style.left = ((p.x + 1) * 0.5 * sceneEl.clientWidth) + 'px';
    el.style.top = ((1 - p.y) * 0.5 * sceneEl.clientHeight) + 'px';
  }
  function renderScene() {
    renderer.render(scene, camera);
    placeLabel(labels.earth, earthMesh);
    placeLabel(labels.mars, marsMesh);
    placeLabel(labels.projection, projectionMesh);
  }
  function resize() {
    var w = sceneEl.clientWidth;
    var h = sceneEl.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderScene();
  }

  function update(day) {
    state.day = day;
    var e = orbitalPosition(earth, day);
    var m = orbitalPosition(mars, day);
    var dir = m.clone().sub(e).normalize();
    var proj = projectedPoint(day);
    earthMesh.position.copy(e);
    marsMesh.position.copy(m);
    skyGroup.position.copy(e);
    projectionMesh.position.copy(proj);
    buildTrail(day);
    var rayEnd = e.clone().add(dir.multiplyScalar(4.7));
    rayGeometry.setFromPoints([e, rayEnd]);
    rayGeometry.attributes.position.needsUpdate = true;
    var c = category(day);
    dayReadout.textContent = (day > 0 ? '+' : '') + Lec.P.round(day, 0) + ' 天';
    directionReadout.textContent = c === 2 ? '逆行' : (c === 1 || c === 3 ? '留' : '顺行');
    phaseEls.forEach(function (el, index) {
      el.classList.toggle('is-current', index === c);
      el.classList.toggle('is-found', state.found[index]);
      if (index === c) el.setAttribute('aria-current', 'step'); else el.removeAttribute('aria-current');
    });
    renderScene();
  }

  function mark() {
    if (state.complete) return;
    var current = category(state.day);
    var target = state.next;
    if (current !== target) {
      var targetEl = phaseEls[target];
      targetEl.classList.remove('shake');
      void targetEl.offsetWidth;
      targetEl.classList.add('shake');
      statusEl.className = 'status bad';
      statusEl.textContent = '判断的是火星相对恒星背景的方向，不是两颗行星谁离得更近。';
      return;
    }
    state.found[target] = true;
    state.next += 1;
    statusEl.className = 'status good';
    if (state.next === 5) {
      state.complete = true;
      statusEl.textContent = '五段已对齐：轨道未掉头，背景投影曾反向。';
      conclusion.classList.add('show');
      camera.position.set(0, 8.5, 10.4);
      camera.lookAt(0.2, 0, 0);
      markButton.disabled = true;
      renderScene();
    } else {
      statusEl.textContent = '已记录“' + phaseNames[target] + '”。下一段：' + phaseNames[state.next] + '。';
    }
    update(state.day);
  }

  function reset() {
    state = { day: -125, next: 0, found: [false, false, false, false, false], complete: false };
    slider.value = '-125';
    camera.position.set(0, 7.1, 8.7);
    camera.lookAt(0.2, 0, 0);
    markButton.disabled = false;
    conclusion.classList.remove('show');
    statusEl.className = 'status';
    statusEl.textContent = '目标：找到第一次“顺行”，再记录当前段。';
    update(-125);
  }

  synodicReadout.textContent = Lec.P.significant(Lec.P.planetSynodicPeriodDays('mars', 'earth'), 3) + ' 天';
  slider.addEventListener('input', function () { update(Number(slider.value)); });
  markButton.addEventListener('click', mark);
  resetButton.addEventListener('click', reset);
  Deck.onResize(resize);
  resize();
  reset();

  window.p22Game = {
    start: function () { slider.focus(); },
    reset: reset,
    getState: function () { return JSON.parse(JSON.stringify(state)); }
  };
}());
</script>
</body>
</html>
