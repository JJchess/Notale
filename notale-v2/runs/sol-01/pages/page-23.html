<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lec-progress {
    display: block;
    appearance: none;
    border: 0;
    overflow: visible;
    line-height: 0;
    vertical-align: top;
  }

  .lec-progress::-webkit-progress-bar,
  .lec-progress::-webkit-progress-value {
    height: 2px;
  }

  .p23-page {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
    width: var(--content-w);
    height: var(--content-h);
    min-width: 0;
    min-height: 0;
  }

  .p23-intro {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--sp-6);
    min-width: 0;
  }

  .p23-intro .lead {
    max-width: 820px;
    color: var(--text);
    font-weight: 620;
  }

  .p23-question {
    max-width: 510px;
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
    text-align: right;
  }

  .p23-bench {
    position: relative;
    display: grid;
    grid-template-columns: 250px minmax(0, 1fr) 360px;
    flex: 1 1 0;
    gap: var(--sp-4);
    min-width: 0;
    min-height: 0;
  }

  .p23-tracks {
    position: absolute;
    z-index: 2;
    inset: 60px 0 34px;
    width: 100%;
    height: calc(100% - 94px);
    pointer-events: none;
  }

  .p23-tracks line {
    stroke: var(--primary);
    stroke-width: 1;
    stroke-dasharray: 7 12;
    opacity: .28;
    vector-effect: non-scaling-stroke;
  }

  .p23-tracks circle {
    fill: var(--surface);
    stroke: var(--primary);
    stroke-width: 2;
    opacity: .72;
    vector-effect: non-scaling-stroke;
  }

  .p23-window {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-top: 3px solid var(--primary);
    border-radius: var(--radius-sm);
    background: var(--surface);
    animation: p23-window-in 520ms ease-out both;
  }

  .p23-window:nth-child(2) { animation-delay: 130ms; }
  .p23-window:nth-child(3) { animation-delay: 260ms; }

  .p23-window-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    min-height: 60px;
    padding: var(--sp-3) var(--sp-4);
    border-bottom: 1px solid var(--line);
    background: var(--surface-data);
  }

  .p23-window-head h2 {
    font-size: var(--fs-h2);
  }

  .p23-index {
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
  }

  .p23-conditions {
    --enum-cols: 1;
    display: flex;
    flex: 1 1 0;
    flex-direction: column;
    gap: 0;
    min-height: 0;
    padding: var(--sp-2) var(--sp-4);
  }

  .p23-conditions.k-enumeration > .it {
    position: relative;
    display: flex;
    flex: 1 1 0;
    align-items: center;
    gap: var(--sp-3);
    min-height: 0;
    padding: 0 var(--sp-2);
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    background: transparent;
  }

  .p23-conditions.k-enumeration > .it:last-child { border-bottom: 0; }

  .p23-tick {
    width: 22px;
    height: 1px;
    flex: 0 0 auto;
    background: var(--primary);
    transform: scaleX(0);
    transform-origin: left center;
    animation: p23-line-in 420ms 720ms ease-out forwards;
  }

  .p23-conditions .it-title {
    margin: 0;
    font-size: var(--fs-body);
    font-weight: 620;
  }

  .p23-samples {
    display: flex;
    flex: 1 1 0;
    flex-wrap: wrap;
    align-content: center;
    gap: var(--sp-3) var(--sp-2);
    min-height: 0;
    padding: var(--sp-2) var(--sp-4);
    background:
      radial-gradient(ellipse at center, var(--primary-soft), transparent 66%),
      var(--surface);
  }

  .p23-sample {
    display: flex;
    flex: 0 0 calc(25% - 6px);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
    min-width: 0;
    animation: p23-planet-in 420ms ease-out both;
  }

  .p23-disc {
    position: relative;
    width: 112px;
    height: 112px;
    overflow: hidden;
    border: 1px solid var(--primary-line);
    border-radius: 50%;
    background: var(--surface-data);
    box-shadow: inset -22px 0 22px rgb(7 16 24 / 64%);
  }

  .p23-disc::after {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(90deg, transparent 48%, rgb(7 16 24 / 12%) 65%, rgb(7 16 24 / 70%) 100%);
    content: "";
  }

  .p23-disc img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .p23-sample-name {
    color: var(--text);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
  }

  .p23-scale-note {
    padding: var(--sp-2) var(--sp-4) var(--sp-3);
    color: var(--text-dim);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
    text-align: center;
  }

  .p23-outcomes {
    --enum-cols: 1;
    display: flex;
    flex: 1 1 0;
    flex-direction: column;
    min-height: 0;
  }

  .p23-outcomes.k-enumeration > .it {
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    overflow: hidden;
    padding: 0;
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
  }

  .p23-outcomes.k-enumeration > .it:last-child { border-bottom: 0; }

  .p23-outcomes img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .p23-outcomes .it-title {
    position: absolute;
    right: var(--sp-3);
    bottom: var(--sp-2);
    margin: 0;
    padding: 2px var(--sp-2);
    background: rgb(7 16 24 / 78%);
    color: var(--text);
    font-size: var(--fs-label);
  }

  @keyframes p23-window-in {
    from { filter: brightness(.58); }
    to { filter: brightness(1); }
  }

  @keyframes p23-planet-in {
    from { filter: brightness(.58); transform: translateY(8px); }
    to { filter: brightness(1); transform: translateY(0); }
  }

  @keyframes p23-line-in {
    to { transform: scaleX(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .p23-window,
    .p23-sample,
    .p23-tick {
      opacity: 1;
      animation: none;
      transform: none;
      filter: none;
    }
  }
</style>
</head>

  const planets = Lec.K.PLANETS;
  const samples = document.getElementById("planetSamples");

  planets.slice(0, 8).forEach((planet, index) => {
    const name = planet.name;
    const sample = document.createElement("figure");
    sample.className = "p23-sample min0";
    sample.style.animationDelay = `${360 + index * 70}ms`;

    const disc = document.createElement("div");
    disc.className = "p23-disc";

    const image = document.createElement("img");
    image.src = planetImages[index].src;
    image.alt = `${name}全球盘面`;
    image.title = planetImages[index].title;

    const caption = document.createElement("figcaption");
    caption.className = "p23-sample-name";
    caption.textContent = name;

    disc.appendChild(image);
    sample.append(disc, caption);
    samples.appendChild(sample);
  });
</script>
