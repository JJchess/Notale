categories.forEach(function(c){var bin=document.createElement("section");bin.className="box type-bin";bin.dataset.type=c.type;bin.innerHTML='<div class="bin-head"><h2 class="bin-title">'+c.name+'</h2><span class="bin-count">0 / '+c.members.length+'</span></div><div class="basis">整体组成类型</div><div class="slots">'+c.members.map(function(p){return '<span class="slot" data-slot="'+p.id+'" aria-hidden="true"></span>'}).join("")+'</div>';row.appendChild(bin)});
planets.forEach(function(p){var b=document.createElement("button");b.type="button";b.className="planet-card";b.dataset.id=p.id;b.setAttribute("aria-label",p.name+"，按 1 归入岩石行星，2 归入气态巨行星，3 归入冰巨行星");b.innerHTML='<img class="planet-photo" alt="" src="'+media[p.id].src+'" title="'+media[p.id].title+'"><span class="planet-name">'+p.name+'</span>';b.addEventListener("keydown",function(e){if(state[p.id])return;var c=categories.find(function(x){return x.key===e.key});if(c){e.preventDefault();place(p,c.type)}if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();var i=planets.indexOf(p)+(e.key==="ArrowRight"?1:-1);cardsLayer.querySelector('[data-id="'+planets[(i+planets.length)%planets.length].id+'"]').focus()}});cardsLayer.appendChild(b)});
var kStage=new Konva.Stage({container:"konva",width:1408,height:620}),kLayer=new Konva.Layer();kStage.add(kLayer);
function localRect(el){var host=document.querySelector(".classification-page").getBoundingClientRect(),r=el.getBoundingClientRect(),s=host.width/1408;return{x:(r.left-host.left)/s,y:(r.top-host.top)/s,width:r.width/s,height:r.height/s}}
function measure(){categories.forEach(function(c){geometry[c.type]=localRect(document.querySelector('[data-type="'+c.type+'"]'))});planets.forEach(function(p,i){if(!state[p.id])geometry[p.id]={x:82+i*174,y:502}});drawBranches()}
function drawBranches(){var links=categories.map(function(c){var b=geometry[c.type];return{type:c.type,x1:704,y1:51,x2:b.x+b.width/2,y2:b.y+3}});d3.select("#branches").attr("viewBox","0 0 1408 408").selectAll("path").data(links,function(d){return d.type}).join("path").attr("class",function(d){var c=categories.find(function(x){return x.type===d.type});return"branch"+(c.members.some(function(p){return state[p.id]})?" is-lit":"")}).attr("d",function(d){return"M"+d.x1+","+d.y1+" C"+d.x1+",100 "+d.x2+",80 "+d.x2+","+d.y2})}
function slotPoint(p){var s=localRect(document.querySelector('[data-slot="'+p.id+'"]'));return{x:s.x+s.width/2,y:s.y+s.height/2+2}}
function syncCard(p){var s=shapes[p.id],b=cardsLayer.querySelector('[data-id="'+p.id+'"]');b.style.left=s.x()+46+"px";b.style.top=s.y()+58+"px"}
function makeShapes(){planets.forEach(function(p){var q=geometry[p.id],r=new Konva.Rect({x:q.x-46,y:q.y-58,width:92,height:116,fill:"rgba(255,255,255,0.001)",draggable:true});r.on("dragstart",function(){if(state[p.id]){r.stopDrag();return}cardsLayer.querySelector('[data-id="'+p.id+'"]').classList.add("is-dragging")});r.on("dragmove",function(){syncCard(p);highlightTarget(r.x()+46,r.y()+58)});r.on("dragend",function(){cardsLayer.querySelector('[data-id="'+p.id+'"]').classList.remove("is-dragging");clearTargets();var x=r.x()+46,y=r.y()+58,c=categories.find(function(c){var b=geometry[c.type];return x>=b.x&&x<=b.x+b.width&&y>=b.y&&y<=b.y+b.height});if(c)place(p,c.type);else returnToTray(p)});shapes[p.id]=r;kLayer.add(r);syncCard(p)});kLayer.draw()}
function highlightTarget(x,y){categories.forEach(function(c){var b=geometry[c.type];document.querySelector('[data-type="'+c.type+'"]').classList.toggle("is-target",x>=b.x&&x<=b.x+b.width&&y>=b.y&&y<=b.y+b.height)})}function clearTargets(){document.querySelectorAll(".type-bin").forEach(function(b){b.classList.remove("is-target")})}
function animateTo(p,q,done){var s=shapes[p.id];if(reduced){s.position({x:q.x-46,y:q.y-58});syncCard(p);kLayer.draw();if(done)done();return}new Konva.Tween({node:s,duration:.28,x:q.x-46,y:q.y-58,easing:Konva.Easings.EaseOut,onUpdate:function(){syncCard(p)},onFinish:function(){syncCard(p);if(done)done()}}).play()}
function returnToTray(p){animateTo(p,geometry[p.id])}
function place(p,type){var card=cardsLayer.querySelector('[data-id="'+p.id+'"]');if(p.type!==type){wrong[p.id]=(wrong[p.id]||0)+1;card.classList.remove("is-wrong");void card.offsetWidth;card.classList.add("is-wrong");feedback.dataset.kind="error";feedback.textContent=wrong[p.id]>1?p.name+"属于“"+categories.find(function(c){return c.type===p.type}).name+"”。":"类型不符：请区分岩石行星、气态巨行星与冰巨行星。";returnToTray(p);return}state[p.id]=type;shapes[p.id].draggable(false);document.querySelector('[data-slot="'+p.id+'"]').classList.add("is-filled");animateTo(p,slotPoint(p),function(){card.classList.add("is-correct")});update(p)}
function update(latest){var n=Object.keys(state).length;document.getElementById("progress").textContent="已归类 "+n+" / "+planets.length;categories.forEach(function(c){var f=c.members.filter(function(p){return state[p.id]}).length,b=document.querySelector('[data-type="'+c.type+'"]');b.querySelector(".bin-count").textContent=f+" / "+c.members.length;b.classList.toggle("is-complete",f===c.members.length)});drawBranches();if(n===planets.length){document.getElementById("tray").style.opacity=".18";feedback.dataset.kind="success";feedback.textContent="八颗行星按整体组成分成三类：岩石行星 4 颗，气态巨行星 2 颗，冰巨行星 2 颗。"}else{feedback.dataset.kind="";feedback.textContent="归类正确："+latest.name+"已接入对应分支。"}}
function reset(){state={};wrong={};planets.forEach(function(p,i){var s=shapes[p.id];s.draggable(true);geometry[p.id]={x:82+i*174,y:502};animateTo(p,geometry[p.id]);cardsLayer.querySelector('[data-id="'+p.id+'"]').classList.remove("is-correct","is-wrong")});document.querySelectorAll(".slot").forEach(function(s){s.classList.remove("is-filled")});document.getElementById("tray").style.opacity="1";feedback.dataset.kind="";feedback.textContent="依据只看整体组成类型；行星外观颜色不是可靠分类标准。";document.getElementById("progress").textContent="已归类 0 / "+planets.length;categories.forEach(function(c){var b=document.querySelector('[data-type="'+c.type+'"]');b.querySelector(".bin-count").textContent="0 / "+c.members.length;b.classList.remove("is-complete")});drawBranches();kLayer.draw()}
document.getElementById("reset").addEventListener("click",reset);measure();makeShapes();
}());
</script>
</body>
</html>
