<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lec-progress::before { position: absolute; inset: 0; }
  .p26-page {
    width: var(--content-w);
    height: var(--content-h);
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
  }
  .p26-lab {
    height: 396px;
    display: flex;
    gap: var(--sp-5);
    min-width: 0;
  }
  .p26-sim {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--surface-data);
  }
  .p26-sim canvas { z-index: 1; }
  .p26-sim::after {
    position: absolute;
    z-index: 2;
    right: 0;
    bottom: 0;
    left: 0;
    height: 72px;
    border-top: 1px solid var(--primary-line);
    border-radius: 50% 50% 0 0;
    background: #20313b;
    box-shadow: inset -180px 0 0 rgb(7 16 24 / 72%);
    content: "";
    pointer-events: none;
  }
  .p26-simhead {
    position: absolute;
    z-index: 4;
    top: var(--sp-4);
    right: var(--sp-4);
    left: var(--sp-4);
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
  }
  .p26-rounds { display: flex; gap: var(--sp-2); align-items: center; }
  .p26-round {
    width: 38px;
    height: 30px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    position: relative;
  }
  .p26-round::after {
    position: absolute;
    right: 7px;
    bottom: 4px;
    left: 7px;
    height: var(--fill, 8px);
    background: var(--primary-soft);
    border-top: 2px solid var(--primary);
    content: "";
  }
  .p26-round.is-current { border-color: var(--accent); }
  .p26-round.is-done::after { background: var(--primary); }
  .p26-piston {
    position: absolute;
    z-index: 6;
    left: 50%;
    width: 414px;
    height: 52px;
    min-height: 52px;
    padding: 0;
    border: 0;
    background: transparent;
    transform: translate(-50%, -50%);
    touch-action: none;
    cursor: ns-resize;
  }
  .p26-piston::before {
    position: absolute;
    top: 21px;
    right: 0;
    left: 0;
    height: 10px;
    border: 2px solid var(--accent);
    background: var(--surface-raised);
    box-shadow: 0 5px 14px rgb(0 0 0 / 35%);
    content: "";
  }
  .p26-piston::after {
    position: absolute;
    top: 4px;
    left: 50%;
    width: 74px;
    height: 17px;
    border: 1px solid var(--accent);
    border-bottom: 0;
    content: "";
    transform: translateX(-50%);
  }
  .p26-piston:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .p26-piston.is-returning { transition: top 240ms ease-out; }
  .p26-piston.is-hit::before { box-shadow: 0 0 20px rgb(255 209 102 / 55%); }
  .p26-target-line {
    position: absolute;
    z-index: 3;
    left: calc(50% - 207px);
    width: 414px;
    height: 2px;
    background: var(--accent);
    opacity: .75;
    pointer-events: none;
  }
  .p26-target-line::after {
    position: absolute;
    right: -74px;
    top: -11px;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: var(--fs-tick);
    content: "目标";
  }
  .p26-target-line.is-warn { animation: p26-pulse 260ms ease-out 2; }
  .p26-ruler {
    position: absolute;
    z-index: 4;
    top: 54px;
    bottom: 76px;
    left: calc(50% - 246px);
    width: 28px;
    border-right: 1px solid var(--primary-line);
    pointer-events: none;
  }
  .p26-ruler span {
    position: absolute;
    right: 6px;
    width: 11px;
    height: 1px;
    background: var(--primary);
  }
  .p26-ruler span:nth-child(1) { top: 0; }
  .p26-ruler span:nth-child(2) { top: 33%; }
  .p26-ruler span:nth-child(3) { top: 66%; }
  .p26-ruler span:nth-child(4) { bottom: 0; }
  .p26-ruler-label {
    position: absolute;
    z-index: 4;
    bottom: 18px;
    left: var(--sp-4);
    color: var(--text-muted);
    font-size: var(--fs-sec);
  }
  .p26-ruler-label strong { color: var(--accent); font-weight: 650; }
  .p26-side {
    flex: 0 0 368px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }
  .p26-side .readout { min-height: 68px; }
  .p26-feedback {
    flex: 1 1 auto;
    min-height: 0;
    padding: var(--sp-4);
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    color: var(--text);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
  }
  .p26-reset {
    position: absolute;
    z-index: 8;
    top: var(--sp-3);
    right: var(--sp-3);
    width: 44px;
    min-width: 44px;
    padding: 0;
    font-size: 24px;
  }
  .p26-process {
    flex: 1 1 auto;
    min-height: 0;
    --process-line-y: 25px;
  }
  .p26-process > .step {
    padding: 40px var(--sp-3) var(--sp-3);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
  }
  .p26-process > .step::before { top: 19px; left: 50%; transform: translateX(-50%); }
  .p26-process .step-num {
    display: block;
    margin-bottom: var(--sp-2);
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: var(--fs-tick);
    font-weight: 700;
  }
  .p26-process > .step.is-current .step-num { color: var(--accent); }
  .p26-summary-label {
    position: absolute;
    z-index: 5;
    bottom: 84px;
    color: var(--text);
    font-size: var(--fs-label);
    text-align: center;
    transform: translateX(-50%);
    pointer-events: none;
  }
  @keyframes p26-pulse {
    50% { opacity: 1; box-shadow: 0 0 18px var(--accent); }
  }
  @media (prefers-reduced-motion: reduce) {
    .p26-target-line.is-warn { animation: none; }
    .p26-piston.is-returning { transition: none; }
  }
</style>
</head>
<body data-page="26" data-total="50">
<div id="stage">
<main id="main">
  <section class="p26-page min0" aria-label="大气柱压力实验">
    <div class="p26-lab min0">
      <div id="sim" class="p26-sim target no-pan min0">
        <canvas id="matter-canvas" class="cv-fill" aria-hidden="true"></canvas>
        <div class="p26-simhead">
          <div class="label"><span id="round-label">三轮中的第 1 轮</span> · <span id="round-name" class="current">稀薄</span></div>
          <div class="p26-rounds" aria-label="实验进度">
            <span class="p26-round is-current" style="--fill:6px" title="稀薄大气"></span>
            <span class="p26-round" style="--fill:12px" title="基准大气"></span>
            <span class="p26-round" style="--fill:20px" title="浓厚大气"></span>
          </div>
        </div>
        <div class="p26-ruler" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <div id="target-line" class="p26-target-line"></div>
        <button id="piston" class="p26-piston" type="button" aria-label="拖动活塞压缩大气柱" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" title="拖动；聚焦后可用上下方向键"></button>
        <div class="p26-ruler-label"><strong>拖动活塞</strong>到发光刻线，比较柱底读数</div>
      </div>

      <aside class="p26-side min0 telemetry" aria-label="大气柱遥测">
        <button id="reset" class="p26-reset" type="button" aria-label="重置实验" title="重置">↻</button>
        <div class="readout">
          <span class="name">行星表面重力</span>
          <span id="gravity-value" class="value">—</span>
        </div>
        <div class="readout">
          <span class="name">柱内大气总量</span>
          <span id="amount-value" class="value">—</span>
        </div>
        <div class="readout is-current">
          <span class="name">柱底相对压力</span>
          <span id="pressure-value" class="value">—</span>
        </div>
        <div id="feedback" class="p26-feedback" role="status" aria-live="polite">同一轮中，大气总量固定。先记住柱底读数，再压低活塞。</div>
      </aside>
    </div>

    <div id="process" class="k-process p26-process min0" aria-label="表面气压的五步因果链">
      <div class="axis" aria-hidden="true"></div>
      <div class="step is-current" aria-current="step"><span class="step-num">01</span>大气粒子受到行星引力，持续被拉向地面。</div>
      <div class="arw" aria-hidden="true"></div>
      <div class="step"><span class="step-num">02</span>上层重量经粒子碰撞，逐层向下传递。</div>
      <div class="arw" aria-hidden="true"></div>
      <div class="step"><span class="step-num">03</span>柱底承受上方全部大气的重量。</div>
      <div class="arw" aria-hidden="true"></div>
      <div class="step"><span class="step-num">04</span>单位面积承受的力，表现为表面气压。</div>
      <div class="arw" aria-hidden="true"></div>
      <div class="step"><span class="step-num">05</span>大气越多或重力越强，表面气压越大。</div>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/matter.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 26,
  kicker: "ATMOSPHERE COLUMN",
  title: "表面气压，来自上方大气的重量",
  take: "表面气压不是“空气挤得多紧”的单独结果，而是地表单位面积托住了多少大气重量。"
});

(function () {
  'use strict';
  var Engine = Matter.Engine;
  var Bodies = Matter.Bodies;
  var Body = Matter.Body;
  var Composite = Matter.Composite;
  var sim = document.getElementById('sim');
  var canvas = document.getElementById('matter-canvas');
  var piston = document.getElementById('piston');
  var targetLine = document.getElementById('target-line');
  var feedback = document.getElementById('feedback');
  var processSteps = Array.prototype.slice.call(document.querySelectorAll('#process .step'));
  var roundMarks = Array.prototype.slice.call(document.querySelectorAll('.p26-round'));
  var earth = Lec.K.EARTH;
  var planets = Lec.K.PLANETS;
  var earthPlanet = planets.filter(function (p) { return p.id === 'earth'; })[0];
  var gravity = Lec.P.surfaceGravity(earth.MASS_KG, earth.RADIUS_KM * 1000);
  var gravityRatio = Lec.P.ratio(gravity, earthPlanet.surfaceGravityMS2);
  var rounds = [
    { name: '稀薄', amount: 0.55, count: 20 },
    { name: '基准', amount: 1.00, count: 32 },
    { name: '浓厚', amount: 1.65, count: 46 }
  ];
  var state = { round: 0, pistonY: 82, startY: 82, targetY: 170, dragging: false, done: false, completed: [] };
  var engine = Engine.create({ gravity: { x: 0, y: 0.72, scale: 0.001 } });
  var particles = [];
  var walls = [];
  var pistonBody = null;
  var drawCtx = null;
  var view = { w: 0, h: 0, left: 0, right: 0, bottom: 0 };
  var advanceTimer = 0;

  function fmt(value, digits) {
    return Lec.P.significant(value, digits);
  }

  function setGeometry() {
    drawCtx = Deck.fit(canvas);
    view.w = canvas.clientWidth;
    view.h = canvas.clientHeight;
    view.left = view.w / 2 - 205;
    view.right = view.w / 2 + 205;
    view.bottom = view.h - 78;
    state.startY = 84;
    state.targetY = Math.min(176, view.bottom - 88);
    if (!state.dragging && !state.done) state.pistonY = state.startY;
    targetLine.style.top = state.targetY + 'px';
    piston.style.top = state.pistonY + 'px';
    rebuildRound();
  }

  function clearWorld() {
    Composite.clear(engine.world, false, true);
    particles = [];
    walls = [];
  }

  function rebuildRound() {
    if (!view.w || state.done) return;
    clearWorld();
    var wallOpt = { isStatic: true, restitution: 0.05, friction: 0.1, render: { visible: false } };
    walls = [
      Bodies.rectangle(view.left - 9, (state.pistonY + view.bottom) / 2, 18, view.bottom - state.pistonY + 30, wallOpt),
      Bodies.rectangle(view.right + 9, (state.pistonY + view.bottom) / 2, 18, view.bottom - state.pistonY + 30, wallOpt),
      Bodies.rectangle(view.w / 2, view.bottom + 8, 430, 16, wallOpt)
    ];
    pistonBody = Bodies.rectangle(view.w / 2, state.pistonY + 5, 410, 12, wallOpt);
    Composite.add(engine.world, walls.concat([pistonBody]));
    var cfg = rounds[state.round];
    var cols = Math.ceil(Math.sqrt(cfg.count * 1.8));
    var usableH = Math.max(55, view.bottom - state.pistonY - 26);
    for (var i = 0; i < cfg.count; i += 1) {
      var col = i % cols;
      var row = Math.floor(i / cols);
      var x = view.left + 24 + col * ((view.right - view.left - 48) / Math.max(1, cols - 1));
      var y = state.pistonY + 28 + (row * 31 + (col % 2) * 9) % usableH;
      var particle = Bodies.circle(x, Math.min(view.bottom - 15, y), 7, {
        restitution: 0.22,
        friction: 0.04,
        frictionAir: 0.025,
        density: 0.0018
      });
      particles.push(particle);
    }
    Composite.add(engine.world, particles);
    updateReadouts();
  }

  function movePiston(y) {
    state.pistonY = Deck.clamp(y, state.startY, state.targetY + 8);
    piston.style.top = state.pistonY + 'px';
    piston.setAttribute('aria-valuenow', String(Math.round((state.pistonY - state.startY) / (state.targetY - state.startY) * 100)));
    if (pistonBody) Body.setPosition(pistonBody, { x: view.w / 2, y: state.pistonY + 5 });
  }

  function setProcess(active, complete) {
    processSteps.forEach(function (step, i) {
      step.classList.toggle('is-done', complete || i < active);
      step.classList.toggle('is-current', !complete && i === active);
      if (!complete && i === active) step.setAttribute('aria-current', 'step');
      else step.removeAttribute('aria-current');
    });
  }

  function updateReadouts() {
    var cfg = rounds[state.round];
    var pressure = cfg.amount * gravityRatio;
    document.getElementById('gravity-value').textContent = fmt(gravity, 3) + ' m/s²';
    document.getElementById('amount-value').textContent = fmt(cfg.amount, 2) + ' ×基准';
    document.getElementById('pressure-value').textContent = fmt(pressure, 2) + ' ×基准';
    document.getElementById('round-label').textContent = '三轮中的第 ' + (state.round + 1) + ' 轮';
    document.getElementById('round-name').textContent = cfg.name;
    roundMarks.forEach(function (mark, i) {
      mark.classList.toggle('is-current', i === state.round && !state.done);
      mark.classList.toggle('is-done', i < state.round || state.done);
    });
  }

  function failAttempt() {
    if (state.done) return;
    piston.classList.add('is-returning');
    movePiston(state.startY);
    window.setTimeout(function () { piston.classList.remove('is-returning'); rebuildRound(); }, 250);
    targetLine.classList.remove('is-warn');
    void targetLine.offsetWidth;
    targetLine.classList.add('is-warn');
    feedback.textContent = '把活塞压到发光刻线，再比较压缩前后的柱底读数。';
    setProcess(1, false);
  }

  function succeed() {
    if (state.done || state.pistonY < state.targetY - 8) return;
    state.dragging = false;
    movePiston(state.targetY);
    piston.classList.add('is-hit');
    state.completed.push(rounds[state.round].amount * gravityRatio);
    setProcess(3, false);
    feedback.textContent = '高度变了，整柱重量没有变；柱底相对压力保持 ' + fmt(rounds[state.round].amount * gravityRatio, 2) + ' ×基准。';
    if (Deck.reduced()) {
      finishOrAdvance();
    } else {
      window.clearTimeout(advanceTimer);
      advanceTimer = window.setTimeout(finishOrAdvance, 900);
    }
  }

  function finishOrAdvance() {
    piston.classList.remove('is-hit');
    if (state.round < rounds.length - 1) {
      state.round += 1;
      state.pistonY = state.startY;
      movePiston(state.startY);
      rebuildRound();
      updateReadouts();
      setProcess(state.round === 1 ? 2 : 4, false);
      feedback.textContent = '本轮大气总量变为 ' + fmt(rounds[state.round].amount, 2) + ' ×基准。压低同一轮活塞，检验柱底读数是否改变。';
    } else {
      showSummary();
    }
  }

  function showSummary() {
    state.done = true;
    clearWorld();
    piston.hidden = true;
    targetLine.hidden = true;
    document.getElementById('round-label').textContent = '三轮完成';
    document.getElementById('round-name').textContent = '总重量递增';
    feedback.textContent = '同样的行星上，大气越多，脚下承受的压力越大。压缩只改变密度，不改变整柱重量。';
    setProcess(5, true);
    updateReadouts();
    draw();
  }

  function reset() {
    window.clearTimeout(advanceTimer);
    Array.prototype.slice.call(sim.querySelectorAll('.p26-summary-label')).forEach(function (el) { el.remove(); });
    state.round = 0;
    state.done = false;
    state.dragging = false;
    state.completed = [];
    piston.hidden = false;
    targetLine.hidden = false;
    state.pistonY = state.startY;
    movePiston(state.startY);
    rebuildRound();
    updateReadouts();
    setProcess(0, false);
    feedback.textContent = '同一轮中，大气总量固定。先记住柱底读数，再压低活塞。';
  }

  function drawSummary(ctx) {
    var centers = [view.w * 0.30, view.w * 0.50, view.w * 0.70];
    rounds.forEach(function (r, i) {
      var colW = 116;
      var base = view.bottom;
      var height = 70 + r.amount * 55;
      ctx.fillStyle = Deck.rgba('--primary', 0.08 + i * 0.05);
      ctx.fillRect(centers[i] - colW / 2, base - height, colW, height);
      ctx.strokeStyle = Deck.rgba('--primary', 0.8);
      ctx.lineWidth = 2;
      ctx.strokeRect(centers[i] - colW / 2, base - height, colW, height);
      ctx.fillStyle = i === 2 ? Deck.rgba('--accent', 0.9) : Deck.rgba('--primary', 0.8);
      ctx.fillRect(centers[i] - colW / 2, base - 10, colW, 10);
      var existing = sim.querySelector('[data-summary="' + i + '"]');
      if (!existing) {
        var label = document.createElement('div');
        label.className = 'p26-summary-label';
        label.dataset.summary = String(i);
        label.style.left = centers[i] + 'px';
        label.innerHTML = r.name + '<br><span class="mono current">' + fmt(r.amount * gravityRatio, 2) + ' ×</span>';
        sim.appendChild(label);
      }
    });
  }

  function draw() {
    if (!drawCtx) return;
    var ctx = drawCtx;
    ctx.clearRect(0, 0, view.w, view.h);
    if (state.done) {
      drawSummary(ctx);
      return;
    }
    ctx.fillStyle = Deck.rgba('--primary', 0.055);
    ctx.fillRect(view.left, state.pistonY + 10, view.right - view.left, view.bottom - state.pistonY - 10);
    ctx.strokeStyle = Deck.rgba('--primary', 0.55);
    ctx.lineWidth = 2;
    ctx.strokeRect(view.left, state.pistonY + 10, view.right - view.left, view.bottom - state.pistonY - 10);
    particles.forEach(function (body, i) {
      var glow = state.pistonY >= state.targetY - 8 && i % 4 === 0;
      ctx.beginPath();
      ctx.arc(body.position.x, body.position.y, 7, 0, Math.PI * 2);
      ctx.fillStyle = glow ? Deck.rgba('--accent', 0.88) : Deck.rgba('--primary', 0.72);
      ctx.fill();
    });
    ctx.fillStyle = Deck.rgba('--accent', 0.92);
    ctx.fillRect(view.left - 6, view.bottom - 7, view.right - view.left + 12, 14);
  }

  piston.addEventListener('pointerdown', function (e) {
    if (state.done) return;
    state.dragging = true;
    piston.setPointerCapture(e.pointerId);
    setProcess(1, false);
  });
  piston.addEventListener('pointermove', function (e) {
    if (!state.dragging || state.done) return;
    var p = Deck.pt(sim, e);
    movePiston(p.y);
    setProcess(state.pistonY > state.startY + 35 ? 2 : 1, false);
  });
  piston.addEventListener('pointerup', function () {
    if (!state.dragging) return;
    state.dragging = false;
    if (state.pistonY >= state.targetY - 8) succeed();
    else failAttempt();
  });
  piston.addEventListener('pointercancel', failAttempt);
  piston.addEventListener('keydown', function (e) {
    if (state.done || (e.key !== 'ArrowDown' && e.key !== 'ArrowUp' && e.key !== 'End' && e.key !== 'Home')) return;
    e.preventDefault();
    if (e.key === 'End') movePiston(state.targetY);
    else if (e.key === 'Home') movePiston(state.startY);
    else movePiston(state.pistonY + (e.key === 'ArrowDown' ? 12 : -12));
    setProcess(state.pistonY > state.startY + 35 ? 2 : 1, false);
    if (state.pistonY >= state.targetY - 8) succeed();
  });
  document.getElementById('reset').addEventListener('click', reset);

  Deck.onResize(setGeometry);
  setGeometry();
  Deck.loop(function (t, dt) {
    if (!state.done) Engine.update(engine, Math.min(32, dt || 16.67));
    draw();
  }, { still: 1000 });
}());
</script>
</body>
</html>
