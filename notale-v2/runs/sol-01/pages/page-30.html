<style>
.origin-page{position:relative;display:flex;flex-direction:column;gap:var(--sp-4);overflow:visible}
.origin-head{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 var(--sp-4);border-left:3px solid var(--primary);background:var(--surface-data)}
.origin-head .lead{max-width:940px;color:var(--text)}
.progress-readout{color:var(--text-muted);font-size:var(--fs-sec);line-height:var(--lh-tight);white-space:nowrap}.progress-readout strong{color:var(--accent);font-family:var(--font-mono);font-size:var(--fs-lead)}
.origin-tree{position:relative;flex:0 0 350px;min-height:0;gap:0}.origin-tree>.box{position:relative;height:350px;padding:var(--sp-3) var(--sp-4) var(--sp-4);overflow:visible}.origin-tree>.box>.bt{display:flex;align-items:center;gap:var(--sp-3);min-height:30px;margin-bottom:var(--sp-2)}
.root-disc{width:24px;height:24px;box-shadow:inset -8px 0 0 rgb(7 16 24 / 72%)}
.origin-tree .branches{display:flex;gap:var(--sp-4);height:276px;margin-top:var(--sp-2);margin-left:var(--sp-5);padding-left:var(--sp-5)}
.branch.box{position:relative;display:flex;flex:1 1 0;flex-direction:column;height:276px;padding:var(--sp-3);transition:border-color 180ms ease,background 180ms ease}.branch.box>.bt{display:flex;align-items:center;justify-content:space-between;min-height:30px;margin-bottom:var(--sp-2);font-size:var(--fs-h2)}
.branch-node{width:14px;height:14px;border:2px solid var(--primary);border-radius:50%;background:var(--surface-data)}.branch.is-solved .branch-node{border-color:var(--accent);background:var(--accent);box-shadow:0 0 16px var(--accent-soft)}
.path-line{min-height:42px;padding:var(--sp-2) var(--sp-3);border-left:2px solid var(--primary-line);color:var(--text-muted);font-size:var(--fs-sec);line-height:var(--lh-tight)}.path-line strong{display:block;color:var(--primary);font-size:var(--fs-label)}
.drop-zone{position:relative;display:flex;flex:1 1 0;align-items:center;gap:var(--sp-3);min-height:0;margin-top:var(--sp-2);padding:var(--sp-3);border:1px dashed var(--line-strong);background:var(--bg);transition:border-color 160ms ease,background 160ms ease}.drop-zone.is-target{border-color:var(--accent);background:var(--accent-soft)}.drop-zone.is-wrong{border-color:var(--danger);background:rgb(255 123 114 / 10%)}
.drop-zone img{display:none;flex:0 0 84px;width:84px;height:84px;border:1px solid var(--primary-line);border-radius:50%;object-fit:cover}.branch.is-solved .drop-zone img{display:block}
.drop-copy{min-width:0;color:var(--text-muted);font-size:var(--fs-sec);line-height:var(--lh-body)}.drop-copy strong{display:block;margin-bottom:var(--sp-1);color:var(--text);font-size:var(--fs-body)}.drop-copy .support-text{display:none}.branch.is-solved .drop-copy .placeholder{display:none}.branch.is-solved .drop-copy .support-text{display:block}
.link-layer{position:absolute;z-index:4;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.evidence-link{fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round;stroke-dasharray:7 6;vector-effect:non-scaling-stroke}
.case-tray{display:flex;flex:1 1 0;gap:var(--sp-4);min-height:0}.case{position:relative;display:flex;flex:1 1 0;align-items:center;gap:var(--sp-3);min-width:0;min-height:0;padding:var(--sp-3);border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);text-align:left;cursor:grab;transition:border-color 160ms ease,background 160ms ease,opacity 160ms ease}.case:hover,.case.is-selected{border-color:var(--accent);background:var(--accent-soft)}.case.is-placed{border-color:var(--primary-line);opacity:.38;cursor:default}.case.is-shaking{animation:shake 260ms ease-in-out}.case img{flex:0 0 116px;width:116px;height:116px;border-radius:var(--radius-sm);object-fit:cover}.case-copy{min-width:0;font-size:var(--fs-sec);line-height:var(--lh-body)}.case-copy strong{display:block;margin-bottom:var(--sp-1);color:var(--text);font-size:var(--fs-body)}.case-copy span{color:var(--text-muted)}
.reset{display:none;width:44px;min-width:44px;padding:0;color:var(--accent);font-size:24px}.reset.is-visible{display:inline-flex}.complete-mark{display:none;color:var(--accent);font-size:var(--fs-lead);font-weight:650;line-height:var(--lh-tight)}.complete-mark.is-visible{display:inline}
@keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-8px)}70%{transform:translateX(8px)}}
.lec-progress{-webkit-appearance:none;appearance:none;border:0;padding:0;font-size:0;line-height:0}
.lec-progress::-webkit-progress-bar{background:var(--line)}.lec-progress::-webkit-progress-value{background:var(--primary)}
@media(prefers-reduced-motion:reduce){.branch.box,.drop-zone,.case{transition:none}.case.is-shaking{animation:none}}
</style>

<script src="assets/lib/d3.min.js"></script>

<script src="assets/lec.js"></script>
<script>
Lec.mount({index:30,kicker:"MOON ORIGINS",title:"卫星不只有一种来历",take:"卫星既可能是被捕获碎片，也可能与行星共同形成或由撞击产生"});
const sourceData={moon:Lec.K.MOON,planets:Lec.K.PLANETS,reference:Lec.K.REFERENCE};void sourceData;
const origins=["capture","coform","impact"];
const hints={capture:"检查轨道方向与倾角。",coform:"检查它是否属于规则卫星系统。",impact:"检查组成与角动量线索。"};
const cards=Array.from(document.querySelectorAll(".case"));const zones=Array.from(document.querySelectorAll(".drop-zone"));const doneCount=document.getElementById("doneCount");const completeMark=document.getElementById("completeMark");const resetBtn=document.getElementById("resetBtn");const tree=document.querySelector(".origin-tree");let selected=null;let targetIndex=0;let solved=new Set();
function announce(text){let live=document.getElementById("originLive");if(!live){live=document.createElement("div");live.id="originLive";live.className="sr-only";live.setAttribute("aria-live","polite");document.querySelector(".origin-page").appendChild(live)}live.textContent=text}
function setTarget(index){targetIndex=(index+origins.length)%origins.length;zones.forEach((zone,i)=>zone.classList.toggle("is-target",selected&&i===targetIndex))}
function drawLinks(){const svg=d3.select("#linkLayer");const tr=tree.getBoundingClientRect();const sx=tree.offsetWidth/tr.width;const sy=tree.offsetHeight/tr.height;svg.attr("viewBox",`0 0 ${tree.offsetWidth} ${tree.offsetHeight}`);const data=origins.filter(o=>solved.has(o)).map(o=>{const b=document.querySelector(`.branch[data-origin="${o}"]`);const p=b.querySelector(".path-line").getBoundingClientRect();const z=b.querySelector(".drop-zone").getBoundingClientRect();return{origin:o,x1:(p.left+p.width/2-tr.left)*sx,y1:(p.bottom-tr.top)*sy,x2:(z.left+z.width/2-tr.left)*sx,y2:(z.top+4-tr.top)*sy}});const line=d3.line().curve(d3.curveBumpY).x(d=>d[0]).y(d=>d[1]);svg.selectAll("path").data(data,d=>d.origin).join(enter=>enter.append("path").attr("class","evidence-link").attr("d",d=>line([[d.x1,d.y1],[d.x2,d.y2]])).attr("stroke-dashoffset",Deck.reduced()?0:26).call(s=>Deck.reduced()?s:s.transition().duration(420).attr("stroke-dashoffset",0)),update=>update.attr("d",d=>line([[d.x1,d.y1],[d.x2,d.y2]])),exit=>exit.remove())}
function clearSelection(){selected=null;cards.forEach(c=>c.classList.remove("is-selected"));zones.forEach(z=>z.classList.remove("is-target"))}
function reject(card,zone){card.classList.remove("is-shaking");void card.offsetWidth;card.classList.add("is-shaking");zone.classList.add("is-wrong");setTimeout(()=>{card.classList.remove("is-shaking");zone.classList.remove("is-wrong")},300);announce(hints[card.dataset.answer])}
function place(card,origin){if(!card||card.classList.contains("is-placed"))return;const zone=document.querySelector(`.drop-zone[data-origin="${origin}"]`);if(card.dataset.answer!==origin){reject(card,zone);return}solved.add(origin);card.classList.add("is-placed");card.disabled=true;document.querySelector(`.branch[data-origin="${origin}"]`).classList.add("is-solved","is-current");doneCount.textContent=`${solved.size}/3`;clearSelection();drawLinks();announce(`判定正确。${zone.querySelector(".support-text").textContent}`);if(solved.size===3){completeMark.classList.add("is-visible");resetBtn.classList.add("is-visible");resetBtn.focus()}}
cards.forEach(card=>{card.addEventListener("click",()=>{if(card.classList.contains("is-placed"))return;selected=card;cards.forEach(c=>c.classList.toggle("is-selected",c===card));setTarget(targetIndex);announce("已选择案例。用左右方向键选择起源，再按回车确认。")});card.addEventListener("keydown",e=>{if(!selected||selected!==card)return;if(e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();setTarget(targetIndex+(e.key==="ArrowRight"?1:-1));announce(`当前起源：${document.querySelector(`.branch[data-origin="${origins[targetIndex]}"] .bt span`).textContent}`)}else if(e.key==="Enter"||e.key===" "){e.preventDefault();place(card,origins[targetIndex])}else if(e.key==="Escape")clearSelection()});card.addEventListener("dragstart",e=>{if(card.classList.contains("is-placed"))return e.preventDefault();selected=card;e.dataTransfer.setData("text/plain",card.dataset.case);e.dataTransfer.effectAllowed="move";card.classList.add("is-selected")});card.addEventListener("dragend",clearSelection)});
zones.forEach((zone,index)=>{zone.addEventListener("dragover",e=>{e.preventDefault();setTarget(index)});zone.addEventListener("dragleave",()=>zone.classList.remove("is-target"));zone.addEventListener("drop",e=>{e.preventDefault();const card=cards.find(c=>c.dataset.case===e.dataTransfer.getData("text/plain"));place(card,zone.dataset.origin)})});
resetBtn.addEventListener("click",()=>{solved=new Set();cards.forEach(card=>{card.disabled=false;card.classList.remove("is-placed","is-selected","is-shaking")});document.querySelectorAll(".branch").forEach(b=>b.classList.remove("is-solved","is-current"));zones.forEach(z=>z.classList.remove("is-target","is-wrong"));doneCount.textContent="0/3";completeMark.classList.remove("is-visible");resetBtn.classList.remove("is-visible");clearSelection();drawLinks();cards[0].focus();announce("已重置三组案例。")});
Deck.onResize(drawLinks);drawLinks();
</script>
