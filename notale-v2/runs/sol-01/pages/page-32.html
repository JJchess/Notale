<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p32-page{width:var(--content-w);height:var(--content-h);--support-cols:2}
  .p32-page.k-generalization{grid-template-rows:auto 1fr;gap:var(--sp-4)}
  .p32-page.k-generalization>.claim{width:100%;max-width:none;margin:0;padding:var(--sp-3) var(--sp-5)}
  .transfer-band{display:flex;gap:var(--sp-3);margin-top:var(--sp-3);font-size:var(--fs-sec);font-weight:400}
  .transfer-item{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-1) var(--sp-2);flex:1 1 0;min-width:0;min-height:54px;padding:var(--sp-2) var(--sp-3);border-top:2px solid var(--primary);background:var(--surface-data)}
  .transfer-item b{flex:0 0 100%;color:var(--text-muted);font-size:var(--fs-label)}
  .transfer-item span{color:var(--accent)}
  .p32-page.k-generalization>.supports{grid-template-columns:720px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:var(--sp-3) var(--sp-6);padding-top:var(--sp-4);min-height:0}
  .p32-page.k-generalization>.supports:before{top:var(--sp-4)}
  .p32-page.k-generalization .support{padding:var(--sp-4);min-height:0;color:var(--text)}
  .case-support{display:flex;flex-direction:column;gap:var(--sp-3)}
  .case-head,.chain-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);min-height:44px}
  .step-readout{font-size:var(--fs-sec);color:var(--text-muted)}
  .step-readout strong{color:var(--accent);font-family:var(--font-mono)}
  .scan-layout{display:flex;align-items:center;justify-content:center;gap:var(--sp-5);min-height:0;flex:1}
  .jupiter-cue{width:88px;display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);color:var(--text-muted);font-size:var(--fs-label);line-height:var(--lh-tight)}
  .jupiter-disc{width:72px;height:72px;border-radius:50%;border:1px solid var(--primary-line);background:repeating-linear-gradient(0deg,var(--surface-raised) 0 8px,var(--accent-soft) 8px 15px);box-shadow:inset -18px 0 0 rgb(7 16 24 / 58%)}
  .gravity-line{width:80px;height:2px;background:var(--primary-line);position:relative}
  .gravity-line:after{position:absolute;right:-1px;top:-5px;color:var(--primary);content:"→";font-size:var(--fs-body)}
  .scan-shell{position:relative;width:470px;height:470px;flex:0 0 470px;border:0;border-radius:50%;padding:0;background:var(--surface-data);overflow:hidden;isolation:isolate;touch-action:none;box-shadow:0 0 0 1px var(--primary-line),inset -70px 0 70px rgb(7 16 24 / 68%);cursor:crosshair}
  .scan-shell:hover{background:var(--surface-data)}
  .scan-shell:focus-visible{outline:3px solid var(--focus);outline-offset:5px}
  .scan-shell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;border-radius:50%;pointer-events:none}
  .europa-photo{z-index:0}
  .europa-cut{z-index:1;--mx:50%;--my:50%;--mr:0px;-webkit-mask-image:radial-gradient(circle var(--mr) at var(--mx) var(--my),#000 0 44%,rgb(0 0 0/.76) 62%,rgb(0 0 0/.34) 82%,transparent 100%);mask-image:radial-gradient(circle var(--mr) at var(--mx) var(--my),#000 0 44%,rgb(0 0 0/.76) 62%,rgb(0 0 0/.34) 82%,transparent 100%);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
  .scan-shell.is-complete .europa-cut{-webkit-mask-image:none;mask-image:none;opacity:.94}
  .scan-ring{position:absolute;z-index:3;width:196px;height:196px;left:calc(var(--sx,50%) - 98px);top:calc(var(--sy,50%) - 98px);border:2px solid var(--primary);border-radius:50%;pointer-events:none;transition:border-color .2s,box-shadow .2s,transform .18s}
  .scan-shell.is-complete .scan-ring{inset:0;width:100%;height:100%;border-color:var(--accent);box-shadow:inset 0 0 36px var(--accent-soft)}
  .scan-shell.is-correct .scan-ring{border-color:var(--accent);box-shadow:0 0 24px var(--accent)}
  .scan-shell.is-wrong .scan-ring{border-color:var(--danger);transform:translateX(8px) scale(.94)}
  .layer-tag{position:absolute;z-index:4;padding:var(--sp-1) var(--sp-2);border-left:3px solid var(--primary);background:rgb(7 16 24 / 88%);color:var(--text);font-size:var(--fs-label);line-height:var(--lh-tight);pointer-events:none;opacity:0;transition:opacity .2s}
  .tag-ice{top:54px;left:190px}.tag-ocean{top:148px;left:262px}.tag-rock{top:286px;left:276px}
  .scan-shell.is-complete .layer-tag,.scan-shell[data-step="1"] .tag-ice,.scan-shell[data-step="1"] .tag-ocean,.scan-shell[data-step="2"] .tag-rock{opacity:1}
  .hit-feedback{position:absolute;z-index:6;left:var(--fx,50%);top:var(--fy,50%);max-width:250px;padding:var(--sp-2) var(--sp-3);border:1px solid var(--danger);background:var(--surface);color:var(--text);font-size:var(--fs-sec);line-height:var(--lh-body);transform:translate(-50%,12px);pointer-events:none}
  .scan-help{width:116px;padding:var(--sp-3);border-left:3px solid var(--primary);background:var(--surface);color:var(--text-muted);font-size:var(--fs-sec);line-height:var(--lh-body)}
  .scan-help strong{display:block;margin-bottom:var(--sp-2);color:var(--text);font-size:var(--fs-body)}
  .chain-support{display:flex;flex-direction:column;gap:var(--sp-3)}
  .chain{display:flex;flex-direction:column;gap:var(--sp-1);min-height:0;flex:1}
  .chain-node{position:relative;padding:var(--sp-2) var(--sp-4);border-left:4px solid var(--line-strong);background:var(--surface);color:var(--text-muted);font-size:var(--fs-sec);line-height:var(--lh-tight)}
  .chain-node strong{display:block;color:var(--text);font-size:var(--fs-body)}
  .chain-node.is-lit{border-left-color:var(--accent);background:var(--accent-soft);color:var(--text)}
  .chain-arrow{min-height:44px;width:100%;padding:0 var(--sp-3);border-color:var(--primary-line);background:transparent;color:var(--primary);font-size:var(--fs-sec);justify-content:flex-start}
  .chain-arrow:before{content:"↓";font-size:var(--fs-h2)}
  .chain-arrow.is-lit{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .chain-arrow[disabled]{opacity:.58}
  .chain-arrow.is-target{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .evidence-route{grid-column:1/-1;display:flex;align-items:stretch;gap:var(--sp-3);min-height:92px}
  .evidence-step{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:var(--sp-1);flex:1 1 0;min-width:0;padding:var(--sp-3) var(--sp-4);border:1px solid var(--line);background:var(--surface);color:var(--text-muted);font-size:var(--fs-sec);line-height:var(--lh-body)}
  .evidence-step b{color:var(--text);font-size:var(--fs-body)}
  .evidence-step em{color:var(--primary);font-style:normal;font-size:var(--fs-label);font-weight:650}
  .evidence-arrow{display:grid;place-items:center;flex:0 0 28px;color:var(--primary);font-size:var(--fs-h2)}
  .support-line{display:flex;align-items:flex-start;gap:var(--sp-3);min-height:54px;padding:var(--sp-3) var(--sp-4);border-left:3px solid var(--primary-line);background:var(--surface-raised);color:var(--text-muted);font-size:var(--fs-sec);line-height:var(--lh-body)}
  .support-line b{flex:0 0 auto;color:var(--primary);font-size:var(--fs-body)}
  .reset-icon{width:44px;min-width:44px;padding:0;font-size:var(--fs-h2);font-family:var(--font-sans)}
  progress.lec-progress{-webkit-appearance:none;appearance:none;border:0;line-height:0;overflow:visible}
  progress.lec-progress::-webkit-progress-bar{background:var(--line)}
  progress.lec-progress::-webkit-progress-value{background:var(--primary)}
  progress.lec-progress::-webkit-progress-inner-element{height:2px}
  .claim.is-current{border-left-color:var(--accent)!important;background:var(--accent-soft)!important}
  @media(prefers-reduced-motion:reduce){.scan-ring,.layer-tag{transition:none}}
</style>
</head>

  var arrowHeat=document.getElementById('arrow-heat');
  var arrowOcean=document.getElementById('arrow-ocean');
  var nodes=[document.getElementById('node-tide'),document.getElementById('node-heat'),document.getElementById('node-ocean')];
  var state={step:1,x:215,y:164,inside:false};
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)');

  function setSpot(x,y,show){
    state.x=Deck.clamp(x,42,388); state.y=Deck.clamp(y,42,388);
    scanner.style.setProperty('--sx',state.x+'px'); scanner.style.setProperty('--sy',state.y+'px');
    cutaway.style.setProperty('--mx',state.x+'px'); cutaway.style.setProperty('--my',state.y+'px');
    cutaway.style.setProperty('--mr',(show?118:0)+'px');
  }
  function showError(message,x,y){
    scanner.classList.remove('is-correct'); scanner.classList.add('is-wrong');
    scanner.style.setProperty('--fx',x+'px'); scanner.style.setProperty('--fy',y+'px');
    feedback.textContent=message; feedback.hidden=false;
    window.setTimeout(function(){scanner.classList.remove('is-wrong');feedback.hidden=true;},reduced.matches?0:850);
  }
  function flashCorrect(){scanner.classList.add('is-correct');window.setTimeout(function(){scanner.classList.remove('is-correct');},reduced.matches?0:500)}
  function setStep(next){
    state.step=next; scanner.dataset.step=String(next); count.textContent=Math.min(next,3)+'/3';
    if(next===2){
      promptTitle.textContent='热从哪里来？'; promptDetail.textContent='点击岩石内部正在反复形变的位置。';
      nodes[0].classList.add('is-lit'); arrowHeat.classList.add('is-lit');
      setSpot(248,276,true);
    }else if(next===3){
      promptTitle.textContent='哪条箭头构成完整机制？'; promptDetail.textContent='在右侧选择“形变到热，再到海洋”的连接。';
      nodes[1].classList.add('is-lit'); arrowOcean.disabled=false; arrowOcean.classList.add('is-target'); scanner.disabled=true;
    }
  }
  function finish(){
    state.step=4; scanner.disabled=false; scanner.classList.add('is-complete'); scanner.dataset.step='4';
    count.textContent='3/3'; promptTitle.textContent='完整能量链'; promptDetail.textContent='内部能量也能支持宜居环境。';
    nodes.forEach(function(n){n.classList.add('is-lit')}); arrowHeat.classList.add('is-lit'); arrowOcean.classList.add('is-lit'); arrowOcean.classList.remove('is-target'); arrowOcean.disabled=true; claim.classList.add('is-current');
  }
  function judge(x,y){
    if(state.step===1){
      if(y>112&&y<230&&x>150){flashCorrect();setStep(2)}
      else showError(y<125?'这是冰壳，不是液态水层。':'液态层位于冰壳与岩石内部之间。',x,y);
    }else if(state.step===2){
      if(y>225&&x>155){flashCorrect();setStep(3)}
      else showError('潮汐形变发生在内部，不是来自表面阳光。',x,y);
    }
  }
  scanner.addEventListener('pointerenter',function(e){state.inside=true;var p=Deck.pt(scanner,e);setSpot(p.x,p.y,true)});
  scanner.addEventListener('pointermove',function(e){if(state.step>2)return;var p=Deck.pt(scanner,e);setSpot(p.x,p.y,true)});
  scanner.addEventListener('pointerleave',function(){state.inside=false;if(state.step<3)setSpot(state.x,state.y,false)});
  scanner.addEventListener('click',function(e){if(state.step>2)return;var p=Deck.pt(scanner,e);setSpot(p.x,p.y,true);judge(p.x,p.y)});
  scanner.addEventListener('keydown',function(e){
    if(state.step>2)return; var d=18;
    if(e.key==='ArrowLeft'){setSpot(state.x-d,state.y,true)}else if(e.key==='ArrowRight'){setSpot(state.x+d,state.y,true)}else if(e.key==='ArrowUp'){setSpot(state.x,state.y-d,true)}else if(e.key==='ArrowDown'){setSpot(state.x,state.y+d,true)}else if(e.key==='Enter'||e.key===' '){judge(state.x,state.y)}else{return} e.preventDefault();
  });
  arrowHeat.addEventListener('click',function(){if(state.step===3)showError('还缺少从热到地下海洋的连接。',330,205)});
  arrowOcean.addEventListener('click',function(){if(state.step===3)finish()});
  document.getElementById('reset').addEventListener('click',function(){
    state.step=1; scanner.disabled=false; scanner.className='scan-shell no-pan'; scanner.dataset.step='1'; count.textContent='1/3'; promptTitle.textContent='液态水在哪里？'; promptDetail.textContent='移动扫描窗，点击你判断的液态层。'; feedback.hidden=true; claim.classList.remove('is-current'); nodes.forEach(function(n){n.classList.remove('is-lit')}); arrowHeat.classList.remove('is-lit'); arrowHeat.disabled=true; arrowOcean.classList.remove('is-lit','is-target'); arrowOcean.disabled=true; setSpot(215,164,reduced.matches);
  });
  setSpot(state.x,state.y,reduced.matches);
})();
</script>
</body>
</html>
