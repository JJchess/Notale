var layerNames=['外部能量','大气与水','内部与地表改造'];var clues=[{planet:'venus',layer:0,text:'更强日照',short:'更强日照'},{planet:'earth',layer:0,text:'中等日照',short:'中等日照'},{planet:'mars',layer:0,text:'较弱日照',short:'较弱日照'},{planet:'venus',layer:1,text:'浓厚二氧化碳大气与干燥高温表面',short:'浓厚 CO₂ 大气'},{planet:'earth',layer:1,text:'长期稳定的表面海洋',short:'稳定表面海洋'},{planet:'mars',layer:1,text:'稀薄大气、地表冰与古流水证据',short:'稀薄大气与古流水'},{planet:'venus',layer:2,text:'广泛火山地貌与较年轻表面',short:'广泛火山地貌'},{planet:'earth',layer:2,text:'持续活跃的地质循环',short:'活跃地质循环'},{planet:'mars',layer:2,text:'较小质量、较快冷却且大范围活动衰退',short:'较快冷却与衰退'}];var order=[3,7,2,4,0,8,1,6,5].map(function(i){return clues[i]});var index=0,placed={},targetPlanet=0,targetLayer=0;var branches=document.getElementById('branches'),card=document.getElementById('active-card'),feedback=document.getElementById('feedback');
function callP(name,args,fallback){try{return Lec.P[name].apply(null,args)}catch(e){return fallback}}function sig(v,n){return Number.isFinite(+v)?Lec.P.significant(+v,n||3):'—'}function diameter(p){return callP('planetDiameterKm',[p],NaN)}function mass(p){return callP('planetMassKg',[p],NaN)}function flux(p){var v=callP('solarFluxRatio',[p],NaN);if(!Number.isFinite(+v))v=callP('solarFluxRatio',[p.semiMajorAxisAU||p.semiMajorAxis||p.au],NaN);return v}var earthMass=mass(earth);
branches.innerHTML=planets.map(function(p){var m=mass(p.raw),ratio=callP('ratio',[m,earthMass],m/earthMass),dia=diameter(p.raw),earthDia=diameter(earth),diaDiff=callP('percentDifference',[dia,earthDia],Math.abs(dia-earthDia)/((dia+earthDia)/2)*100),detail=p.imageTitle+'；直径 '+sig(dia,3)+' km，与地球相差 '+sig(diaDiff,3)+'%';return '<div class="lv p33-branch min0"><section class="box p33-planet" data-planet="'+p.id+'"><div class="p33-head"><div class="p33-disc planet-disc"><img src="'+p.image+'" alt="'+p.zh+'全盘影像" title="'+detail+'"><span class="target p33-target"></span></div><div class="min0"><h2 class="p33-name">'+p.zh+'</h2><div class="p33-telemetry telemetry"><span>质量 <b>'+sig(ratio,3)+' M⊕</b></span><span>日照 <b>'+sig(flux(p.raw),3)+' ×地球</b></span></div></div></div><div class="lv p33-levels">'+layerNames.map(function(name,i){return '<div class="box p33-level" data-planet="'+p.id+'" data-layer="'+i+'"><span class="p33-tick"></span><span class="p33-layer-name">'+name+'</span><span class="p33-slot">等待线索</span></div>'}).join('')+'</div><div class="p33-diagnosis" id="diag-'+p.id+'">诊断尚未贯通</div></section></div>'}).join('');
var chart=echarts.init(document.getElementById('branch-chart'),null,{renderer:'svg'});
function renderChart(){var hierarchy=d3.hierarchy({children:planets.map(function(p){return{id:p.id,children:layerNames.map(function(_,i){return{id:p.id+'-'+i}})}})}),nodes=[],links=[];hierarchy.children.forEach(function(branch,pi){branch.children.forEach(function(leaf,li){var key=planets[pi].id+'-'+li,active=!!placed[key];nodes.push({id:key,x:110+pi*410,y:145+li*50,symbolSize:active?8:4,itemStyle:{color:active?'#ffd166':'#30434d'}});nodes.push({id:key+'-out',x:110+pi*410,y:315,symbolSize:active?8:4,itemStyle:{color:active?'#ffd166':'#30434d'}});links.push({source:key,target:key+'-out',lineStyle:{color:active?'#ffd166':'#30434d',width:active?2:1,opacity:active?.9:.35,curveness:(li-1)*.08}})})});chart.setOption({animation:!Deck.reduced(),textStyle:{fontSize:16},series:[{type:'graph',layout:'none',roam:false,silent:true,data:nodes,links:links,lineStyle:{opacity:.5},emphasis:{disabled:true},label:{show:false}}]},{notMerge:true})}
function current(){return order[index]}function updateTargets(){document.querySelectorAll('.p33-level').forEach(function(el){el.classList.toggle('is-target',planets[targetPlanet].id===el.dataset.planet&&+el.dataset.layer===targetLayer&&index<order.length)})}
function renderTray(){if(index>=order.length){card.textContent='三条分支已贯通';card.draggable=false;card.setAttribute('aria-disabled','true');document.getElementById('queue').innerHTML='';document.getElementById('synthesis').classList.add('show');feedback.textContent='日照、大气、水与内部演化彼此放大，塑造了不同世界。';feedback.style.color='var(--success)';return}card.textContent=current().text;card.draggable=true;card.removeAttribute('aria-disabled');document.getElementById('queue').innerHTML=order.slice(index+1).map(function(c){return '<span class="p33-q">'+c.short+'</span>'}).join('');updateTargets()}
function conflict(c,p,l){if(c.layer!==l)return '这条线索属于“'+layerNames[c.layer]+'”，请比较证据层。';if(c.planet==='earth'&&p==='venus')return '长期稳定的表面海洋不符合今天的金星，请比较大气与水这一层。';return '这条线索不符合'+planets.find(function(x){return x.id===p}).zh+'的今日状态，请比较同一证据层。'}
function place(p,l){if(index>=order.length)return;var c=current(),el=document.querySelector('.p33-level[data-planet="'+p+'"][data-layer="'+l+'"]');if(c.planet!==p||c.layer!==l){feedback.textContent=conflict(c,p,l);card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');return}var key=p+'-'+l;placed[key]=c;el.classList.add('filled');el.querySelector('.p33-slot').textContent=c.text;card.classList.remove('correct');void card.offsetWidth;card.classList.add('correct');feedback.textContent='';index++;document.getElementById('done-count').textContent=index;planets.forEach(function(x){var complete=[0,1,2].every(function(i){return placed[x.id+'-'+i]});if(complete){var d=document.getElementById('diag-'+x.id);d.textContent=x.diagnosis;d.classList.add('revealed')}});renderChart();renderTray()}
document.querySelectorAll('.p33-level').forEach(function(el){el.addEventListener('dragover',function(e){e.preventDefault()});el.addEventListener('drop',function(e){e.preventDefault();place(el.dataset.planet,+el.dataset.layer)})});card.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain','clue');e.dataTransfer.effectAllowed='move'});card.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'){targetPlanet=(targetPlanet+2)%3;e.preventDefault()}else if(e.key==='ArrowRight'){targetPlanet=(targetPlanet+1)%3;e.preventDefault()}else if(e.key==='ArrowUp'){targetLayer=(targetLayer+2)%3;e.preventDefault()}else if(e.key==='ArrowDown'){targetLayer=(targetLayer+1)%3;e.preventDefault()}else if(e.key==='Enter'||e.key===' '){place(planets[targetPlanet].id,targetLayer);e.preventDefault();return}else return;feedback.textContent='目标：'+planets[targetPlanet].zh+' · '+layerNames[targetLayer];updateTargets()});
document.getElementById('reset').addEventListener('click',function(){index=0;placed={};targetPlanet=0;targetLayer=0;feedback.textContent='';feedback.style.color='';document.getElementById('done-count').textContent='0';document.getElementById('synthesis').classList.remove('show');document.querySelectorAll('.p33-level').forEach(function(el){el.classList.remove('filled','is-target');el.querySelector('.p33-slot').textContent='等待线索'});planets.forEach(function(p){var d=document.getElementById('diag-'+p.id);d.textContent='诊断尚未贯通';d.classList.remove('revealed')});renderChart();renderTray();card.focus()});Deck.onResize(function(){chart.resize()});renderChart();renderTray();
})();
