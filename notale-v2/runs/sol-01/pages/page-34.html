<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .rewind-page {
    position: relative;
    width: var(--content-w);
    height: var(--content-h);
    overflow: hidden;
  }

  .history-scene {
    position: relative;
    height: 410px;
    overflow: hidden;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }

  .history-scene::before {
    position: absolute;
    z-index: 2;
    inset: 0;
    background: linear-gradient(90deg, var(--primary-soft), transparent 28%, transparent 72%, var(--accent-soft));
    pointer-events: none;
    content: "";
  }

  .scene-canvas {
    z-index: 1;
  }

  .scene-heading {
    position: absolute;
    z-index: 3;
    top: var(--sp-5);
    right: var(--sp-5);
    max-width: 520px;
    text-align: right;
  }

  .scene-heading .eyebrow {
    margin-bottom: var(--sp-2);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: var(--lh-tight);
  }

  .scene-heading p {
    color: var(--text);
    font-size: var(--fs-lead);
    line-height: var(--lh-body);
  }

  .scene-label {
    position: absolute;
    z-index: 3;
    top: 304px;
    width: 190px;
    color: var(--text-muted);
    font-size: var(--fs-label);
    font-weight: 600;
    line-height: var(--lh-tight);
    text-align: center;
  }

  .scene-label::before {
    display: block;
    width: 1px;
    height: 22px;
    margin: 0 auto var(--sp-2);
    background: var(--primary-line);
    content: "";
  }

  .scene-label[data-scene="formation"] { left: 89px; }
  .scene-label[data-scene="reshaping"] { left: 435px; }
  .scene-label[data-scene="record"] { left: 781px; }
  .scene-label[data-scene="today"] { left: 1127px; color: var(--accent); }
  .scene-label[data-scene="today"]::before { background: var(--accent); }

  progress.lec-progress {
    display: block;
    overflow: hidden;
    height: 2px;
    padding: 0;
    border: 0;
    appearance: none;
    -webkit-appearance: none;
    font-size: 0;
    line-height: 0;
  }

  progress.lec-progress::-webkit-progress-inner-element,
  progress.lec-progress::-webkit-progress-bar,
  progress.lec-progress::-webkit-progress-value {
    height: 2px;
    padding: 0;
    border: 0;
  }

  .direction {
    position: absolute;
    z-index: 3;
    right: var(--sp-5);
    bottom: var(--sp-4);
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
  }

  .direction-mark {
    width: 176px;
    height: 2px;
    background: var(--accent);
  }

  .direction-mark::before {
    display: block;
    width: 0;
    height: 0;
    border-top: 7px solid transparent;
    border-right: 12px solid var(--accent);
    border-bottom: 7px solid transparent;
    transform: translateY(-6px);
    content: "";
  }

  .rewind-process {
    --process-line-y: 28px;
    height: 112px;
    margin-top: var(--sp-4);
    flex-direction: row;
  }

  .rewind-process > .axis {
    background: var(--primary-line);
  }

  .rewind-process > .step {
    padding: 42px var(--sp-3) var(--sp-3);
    border-color: transparent;
    background: transparent;
    text-align: center;
  }

  .rewind-process > .step::before {
    top: 20px;
    left: 50%;
    width: 12px;
    height: 12px;
    background: var(--bg);
    transform: translateX(-50%);
  }

  .rewind-process > .arw {
    flex-basis: 48px;
    padding-bottom: 52px;
  }

  .rewind-process > .arw::before {
    content: "←";
  }

  .step-title {
    display: block;
    color: var(--text);
    font-size: var(--fs-h2);
    font-weight: 650;
    line-height: var(--lh-tight);
  }

  .step-cue {
    display: block;
    margin-top: var(--sp-1);
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }

  .rewind-process > .step.is-current {
    border-color: transparent;
    background: transparent;
  }

  .rewind-process > .step.is-current .step-title,
  .rewind-process > .step.is-current .step-cue {
    color: var(--accent);
  }

  .closing-line {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 66px;
    color: var(--text-muted);
    font-size: var(--fs-body);
    line-height: var(--lh-body);
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .history-scene::before {
      background: linear-gradient(90deg, var(--primary-soft), transparent 28%, transparent 72%, var(--accent-soft));
    }
  }
</style>
</head>
<body data-page="34" data-total="50">
<div id="stage">
<main id="main">
  <section class="rewind-page" aria-labelledby="history-scene-title">
    <div class="history-scene">
      <canvas id="history-canvas" class="scene-canvas cv-fill" aria-hidden="true"></canvas>
      <div class="scene-heading">
        <div class="eyebrow">从现在读取过去</div>
        <p id="history-scene-title">今天的行星不是历史的终点画面，也是倒推历史的证据现场。</p>
      </div>
      <span class="scene-label" data-scene="formation">尘埃盘剪影</span>
      <span class="scene-label" data-scene="reshaping">未稳定的轨道</span>
      <span class="scene-label" data-scene="record">可读取的痕迹</span>
      <span class="scene-label" data-scene="today">今日系统</span>
      <div class="direction" aria-label="时间追溯方向向左">
        <span>今日</span>
        <span class="direction-mark" aria-hidden="true"></span>
        <span>四十多亿年前</span>
      </div>
    </div>

    <div class="k-process rewind-process" aria-label="从今日向形成阶段倒推的四步过程">
      <div class="axis" aria-hidden="true"></div>
      <div class="step" data-step="3">
        <span class="step-title">形成</span>
        <span class="step-cue">年轻太阳 · 尘埃盘</span>
      </div>
      <div class="arw" aria-hidden="true"></div>
      <div class="step" data-step="2">
        <span class="step-title">改造</span>
        <span class="step-cue">轨道偏移 · 轮廓未定</span>
      </div>
      <div class="arw" aria-hidden="true"></div>
      <div class="step" data-step="1">
        <span class="step-title">记录</span>
        <span class="step-cue">撞击痕迹 · 残余碎片</span>
      </div>
      <div class="arw" aria-hidden="true"></div>
      <div class="step is-current" data-step="0" aria-current="step">
        <span class="step-title">今日</span>
        <span class="step-cue">行星圆盘 · 轨道环</span>
      </div>
    </div>

    <p class="closing-line">接下来，我们从留下来的碎片与痕迹，追问太阳系如何形成，又如何被持续改造。</p>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  Lec.mount({
    index: 34,
    kicker: "ACT IV · SYSTEM HISTORY",
    title: "把太阳系倒带",
    take: "从今日行星倒推四十多亿年的形成与改造"
  });

  (function () {
    var canvas = document.getElementById("history-canvas");
    var steps = Array.prototype.slice.call(document.querySelectorAll(".rewind-process .step"));
    var age = Lec.K.TIME.SOLAR_SYSTEM_AGE_YEARS;
    var ageScale = Lec.P.ageFraction(age, age);
    var span = Lec.P.compressTimeline(0, age, 1);
    var reduced = Deck.reduced();
    var duration = 9200;
    var start = null;
    var lastStep = -1;

    function ease(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function setCurrent(index) {
      if (index === lastStep) return;
      lastStep = index;
      steps.forEach(function (step) {
        var active = Number(step.dataset.step) === index;
        step.classList.toggle("is-current", active);
        if (active) step.setAttribute("aria-current", "step");
        else step.removeAttribute("aria-current");
      });
    }

    function dot(ctx, x, y, r, color) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }

    function orbit(ctx, x, y, rx, ry, color, width, rotation) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation || 0);
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();
      ctx.restore();
    }

    function drawDust(ctx, cx, cy, time, alpha) {
      var primary = Deck.rgb("--primary");
      var accent = Deck.rgb("--accent");
      for (var i = 0; i < 92; i += 1) {
        var f = (i * 0.61803398875) % 1;
        var angle = i * 2.399 + time * (0.055 + f * 0.035);
        var radius = 28 + f * 160;
        var x = cx + Math.cos(angle) * radius;
        var y = cy + Math.sin(angle) * radius * 0.28;
        var c = i % 7 === 0 ? accent : primary;
        dot(ctx, x, y, i % 9 === 0 ? 2.7 : 1.5, "rgba(" + c.join(",") + "," + alpha * (0.34 + f * 0.5) + ")");
      }
      dot(ctx, cx, cy, 20, Deck.rgba("--accent", 0.95));
      dot(ctx, cx - 5, cy - 5, 7, Deck.rgba("--text", 0.9));
    }

    function drawProto(ctx, cx, cy, time) {
      orbit(ctx, cx, cy, 72, 24, Deck.rgba("--primary", 0.34), 2, -0.1);
      orbit(ctx, cx, cy, 118, 38, Deck.rgba("--primary", 0.42), 2, 0.12);
      orbit(ctx, cx, cy, 158, 53, Deck.rgba("--primary", 0.26), 2, -0.18);
      dot(ctx, cx, cy, 13, Deck.rgba("--accent", 0.9));
      [[-92, -16, 9], [78, 20, 12], [136, -24, 7], [-138, 31, 6]].forEach(function (p, i) {
        dot(ctx, cx + p[0] + Math.sin(time * 0.3 + i) * 4, cy + p[1], p[2], Deck.rgba("--text-muted", 0.76));
      });
    }

    function drawRecord(ctx, cx, cy, time) {
      orbit(ctx, cx, cy, 72, 23, Deck.rgba("--primary", 0.38), 2, 0);
      orbit(ctx, cx, cy, 132, 44, Deck.rgba("--primary", 0.28), 2, 0);
      dot(ctx, cx, cy, 15, Deck.rgba("--accent", 0.92));
      dot(ctx, cx + 86, cy - 9, 34, Deck.rgba("--text-muted", 0.92));
      ctx.strokeStyle = Deck.rgba("--bg", 0.72);
      ctx.lineWidth = 3;
      [[75, -17, 7], [94, -2, 5], [81, 8, 4]].forEach(function (p) {
        ctx.beginPath();
        ctx.arc(cx + p[0], cy + p[1], p[2], 0, Math.PI * 2);
        ctx.stroke();
      });
      for (var i = 0; i < 15; i += 1) {
        var a = i * 1.71 + time * 0.035;
        dot(ctx, cx + Math.cos(a) * (112 + (i % 4) * 12), cy + Math.sin(a) * 42, 2 + (i % 3), Deck.rgba("--primary", 0.58));
      }
    }

    function drawToday(ctx, cx, cy, time) {
      dot(ctx, cx, cy, 17, Deck.rgba("--accent", 0.96));
      var radii = [54, 78, 104, 132, 164];
      radii.forEach(function (r, i) {
        orbit(ctx, cx, cy, r, r * 0.31, Deck.rgba("--primary", 0.32 + i * 0.045), i === 2 ? 2.5 : 1.5, 0);
        var a = time * (0.12 - i * 0.012) + i * 1.34;
        var sizes = [4, 6, 7, 10, 13];
        dot(ctx, cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.31, sizes[i], i === 2 ? Deck.rgba("--primary", 0.98) : Deck.rgba("--text", 0.84));
      });
    }

    function drawFrame(ctx, time, dt) {
      var w = canvas.offsetWidth;
      var h = canvas.offsetHeight;
      if (!w || !h) return;
      ctx.clearRect(0, 0, w, h);

      if (start === null) start = time;
      var elapsed = reduced ? duration : Math.min(duration, time - start);
      var raw = Math.min(1, elapsed / duration) * span * ageScale;
      var progress = ease(raw);
      var current = Math.min(3, Math.floor(raw * 4));
      setCurrent(current);

      var y = 236;
      var xs = [184, 530, 876, 1222];
      ctx.beginPath();
      ctx.moveTo(1260, y);
      ctx.lineTo(148, y);
      ctx.strokeStyle = Deck.rgba("--primary", 0.34);
      ctx.lineWidth = 2;
      ctx.stroke();
      Deck.arrow(ctx, 1260, y, 148, y, 12);
      ctx.strokeStyle = Deck.rgba("--accent", 0.9);
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(1260, y);
      ctx.lineTo(1260 - 1112 * progress, y);
      ctx.stroke();

      var tracerX = 1260 - 1112 * progress;
      dot(ctx, tracerX, y, 6, Deck.rgba("--accent", 1));
      dot(ctx, tracerX, y, 14, Deck.rgba("--accent", 0.15));

      drawDust(ctx, xs[0], y, time / 1000, 0.96);
      drawProto(ctx, xs[1], y, time / 1000);
      drawRecord(ctx, xs[2], y, time / 1000);
      drawToday(ctx, xs[3], y, time / 1000);

      xs.forEach(function (x, i) {
        var phase = 3 - i;
        if (phase === current) {
          orbit(ctx, x, y, 184, 82, Deck.rgba("--accent", 0.3), 2, 0);
        }
      });
    }

    var ctx = Deck.fit(canvas);
    Deck.onResize(function () {
      ctx = Deck.fit(canvas);
      drawFrame(ctx, reduced ? duration : (start === null ? 0 : start), 0);
    });
    Deck.loop(function (time, dt) {
      drawFrame(ctx, time, dt);
    }, { still: duration });
  }());
</script>
</body>
</html>
