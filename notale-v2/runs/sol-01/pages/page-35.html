<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .sorting-page {
    width: var(--content-w);
    height: var(--content-h);
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }
  .brief-line {
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-5);
    padding: 0 var(--sp-4);
    border-left: 3px solid var(--primary);
    background: var(--primary-soft);
  }
  .brief-line p { color: var(--text); font-size: var(--fs-sec); line-height: var(--lh-body); }
  .progress-readout { flex: 0 0 auto; color: var(--accent); font-family: var(--font-mono); font-size: var(--fs-body); font-weight: 650; }
  .sorting-world { flex: 1 1 0; min-height: 0; display: flex; gap: var(--sp-4); }
  .classification-ledger { flex: 1 1 0; min-width: 0; }
  .k-classification.ledger-root { height: 100%; gap: 0; }
  .ledger-root > .box { height: 100%; padding: var(--sp-3) var(--sp-4); overflow: hidden; }
  .ledger-root > .box > .bt { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--sp-2); font-size: var(--fs-body); }
  .dimension-key { color: var(--text-muted); font-size: var(--fs-label); font-weight: 600; }
  .ledger-root .lv { height: calc(100% - 36px); margin: 0 0 0 var(--sp-3); padding-left: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-1); }
  .ledger-root .lv::before { top: 20px; width: var(--sp-3); }
  .class-row {
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    display: grid;
    grid-template-columns: 34px 126px 150px minmax(0, 1fr);
    align-items: center;
    gap: var(--sp-3);
    padding: var(--sp-2) 84px var(--sp-2) var(--sp-3);
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: 1.4;
    border: 1px solid var(--line);
    border-left: 2px solid var(--primary);
    background:
      linear-gradient(90deg, transparent 0 8%, var(--primary-line) 8% calc(8% + 1px), transparent calc(8% + 1px) 100%),
      repeating-linear-gradient(90deg, transparent 0 72px, rgb(79 195 215 / 18%) 72px 73px),
      var(--surface-data);
    transition: border-color 160ms ease, background 160ms ease;
  }
  .class-row::after { position: absolute; right: var(--sp-3); bottom: 7px; left: var(--sp-3); height: 2px; background: var(--primary-line); content: ""; opacity: .85; }
  .class-row.is-over { border-color: var(--accent); background: var(--accent-soft); }
  .class-row.is-done { border-color: var(--accent); background: var(--accent-soft); }
  .orbit-mark { width: 26px; height: 14px; border: 2px solid var(--primary); border-radius: 50%; position: relative; }
  .orbit-mark::after { position: absolute; top: 3px; left: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--primary); content: ""; }
  .is-done .orbit-mark { border-color: var(--accent); }
  .is-done .orbit-mark::after { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .class-name { color: var(--text); font-size: var(--fs-body); font-weight: 650; }
  .basis { color: var(--primary); font-size: var(--fs-label); font-weight: 650; }
  .evidence-mini { display: none; position: absolute; z-index: 2; top: 50%; right: var(--sp-3); width: 62px; height: 42px; object-fit: cover; border: 1px solid var(--accent); transform: translateY(-50%); }
  .is-done .evidence-mini { display: block; }
  .sample-tray {
    flex: 0 0 430px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: var(--sp-3);
    border: 1px solid var(--line-strong);
    background: var(--surface);
  }
  .tray-head { display: flex; align-items: center; justify-content: space-between; min-height: 34px; margin-bottom: var(--sp-2); }
  .tray-head h2 { font-size: var(--fs-body); }
  .reset-btn { width: 44px; min-width: 44px; height: 44px; padding: 0; font-size: 24px; line-height: 1; }
  .sample-list { flex: 1 1 0; min-height: 0; display: flex; flex-wrap: wrap; align-content: flex-start; gap: var(--sp-2); }
  .sample {
    width: calc(50% - var(--sp-1));
    height: 128px;
    padding: 0;
    overflow: hidden;
    display: grid;
    grid-template-columns: 92px minmax(0, 1fr);
    text-align: left;
    background: var(--surface-data);
    cursor: grab;
    touch-action: none;
  }
  .sample:last-child { width: 100%; height: 102px; grid-template-columns: 120px minmax(0, 1fr); }
  .sample:active { cursor: grabbing; }
  .sample img { width: 100%; height: 100%; object-fit: cover; border-right: 1px solid var(--line); }
  .sample-copy { min-width: 0; padding: var(--sp-2); display: flex; flex-direction: column; justify-content: center; gap: var(--sp-1); }
  .sample-name { color: var(--text); font-size: var(--fs-sec); font-weight: 650; line-height: 1.35; }
  .sample-clue { color: var(--text-muted); font-size: var(--fs-label); line-height: 1.35; }
  .sample[aria-disabled="true"] { visibility: hidden; pointer-events: none; }
  .sample.is-dragging { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); opacity: .86; }
  .sample.is-wrong { animation: wrong-shake 260ms ease; border-color: var(--danger); }
  .feedback { min-height: 40px; display: flex; align-items: center; padding: 0 var(--sp-3); border-left: 3px solid var(--primary); color: var(--text-muted); font-size: var(--fs-sec); line-height: 1.4; background: var(--surface-data); }
  .feedback.is-error { border-left-color: var(--danger); color: var(--text); }
  .feedback.is-complete { border-left-color: var(--accent); color: var(--accent); font-size: var(--fs-body); font-weight: 650; }
  .pulse { animation: line-pulse 420ms ease; }
  .lec-progress { overflow: visible; }
  .lec-progress > * { box-sizing: border-box; height: 2px; border: 0; }
  @keyframes wrong-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @keyframes line-pulse { 0% { box-shadow: inset 0 0 0 0 var(--accent-soft); } 50% { box-shadow: inset 0 0 26px 0 var(--accent); } 100% { box-shadow: inset 0 0 0 0 var(--accent-soft); } }
  @media (prefers-reduced-motion: reduce) { .sample, .class-row { transition: none; } .sample.is-wrong, .pulse { animation: none; } }
</style>
</head>

<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 35,
  kicker: "SMALL-BODY SORTING",
  title: "它们不都是“太空碎石”",
  take: "小行星、彗星、流星体、矮行星和卫星不是同一种“碎石”"
});

(function () {
  var knowledge = {
    reference: Lec.K.REFERENCE,
    dwarfPlanets: Lec.K.DWARF_PLANETS,
    moon: Lec.K.MOON
  };
  var categories = ["asteroid", "comet", "meteoroid", "dwarf", "moon"];
  var conflict = {
    asteroid: "它以岩石为主并绕太阳运行吗？先看组成与绕行对象。",
    comet: "它富含挥发物并在近太阳时活动吗？先看喷流线索。",
    meteoroid: "它是行星际空间中的较小固体吗？先看所在环境。",
    dwarf: "它近球形且未清空轨道邻域吗？先看轨道状态。",
    moon: "它绕行星或矮行星运行吗？先看它绕谁运行。"
  };
  var state;
  var dragged = null;
  var samples = Array.from(document.querySelectorAll(".sample"));
  var rows = Array.from(document.querySelectorAll(".class-row"));
  var feedback = document.getElementById("feedback");
  var count = document.getElementById("placed-count");

  function freshState() { return { started: false, placed: {}, attempts: 0, complete: false }; }
  function snapshot() { return JSON.parse(JSON.stringify(state)); }
  function emit(name, detail) { document.dispatchEvent(new CustomEvent(name, { bubbles: true, detail: detail })); }

  function start() {
    if (state.started) return;
    state.started = true;
    emit("game-start", { state: snapshot() });
  }

  function render() {
    samples.forEach(function (sample) {
      var done = !!state.placed[sample.dataset.id];
      sample.setAttribute("aria-disabled", done ? "true" : "false");
      sample.draggable = !done;
    });
    rows.forEach(function (row) {
      var sample = samples.find(function (item) { return state.placed[item.dataset.id] === row.dataset.category; });
      row.classList.toggle("is-done", !!sample);
      var mini = row.querySelector(".evidence-mini");
      if (sample) {
        mini.src = sample.querySelector("img").src;
        mini.alt = sample.querySelector(".sample-name").textContent + "证物";
      } else {
        mini.removeAttribute("src");
        mini.alt = "";
      }
    });
    count.textContent = Object.keys(state.placed).length;
  }

  function classify(sample, category) {
    if (!sample || state.placed[sample.dataset.id]) return;
    start();
    state.attempts += 1;
    if (sample.dataset.category !== category) {
      sample.classList.remove("is-wrong");
      void sample.offsetWidth;
      sample.classList.add("is-wrong");
      feedback.className = "feedback is-error";
      feedback.textContent = conflict[sample.dataset.category];
      window.setTimeout(function () { sample.classList.remove("is-wrong"); }, Deck.reduced() ? 0 : 300);
      emit("game-progress", { state: snapshot(), action: "incorrect", metrics: { placed: Object.keys(state.placed).length, attempts: state.attempts } });
      return;
    }
    state.placed[sample.dataset.id] = category;
    var row = rows.find(function (item) { return item.dataset.category === category; });
    row.classList.add("pulse");
    window.setTimeout(function () { row.classList.remove("pulse"); }, Deck.reduced() ? 0 : 450);
    render();
    var placed = Object.keys(state.placed).length;
    feedback.className = "feedback";
    feedback.textContent = sample.querySelector(".sample-name").textContent + "已接通：“" + row.querySelector(".basis").textContent + "”是关键判据。";
    emit("game-progress", { state: snapshot(), action: "correct", metrics: { placed: placed, attempts: state.attempts } });
    if (placed === 5) {
      state.complete = true;
      feedback.className = "feedback is-complete";
      feedback.textContent = "同是小天体，分类依据不同：先问判据，不能只看外观。";
      emit("game-complete", { score: 5, metrics: { placed: 5, attempts: state.attempts }, trace: Object.assign({}, state.placed) });
    }
  }

  function reset() {
    state = freshState();
    dragged = null;
    samples.forEach(function (sample) { sample.classList.remove("is-dragging", "is-wrong"); });
    rows.forEach(function (row) { row.classList.remove("is-over", "pulse"); });
    feedback.className = "feedback";
    feedback.textContent = "拖入对应行；键盘聚焦样本后按 1–5。";
    render();
    emit("game-reset", { state: snapshot() });
  }

  samples.forEach(function (sample) {
    sample.addEventListener("dragstart", function (event) {
      dragged = sample;
      sample.classList.add("is-dragging", "is-current");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", sample.dataset.id);
    });
    sample.addEventListener("dragend", function () {
      sample.classList.remove("is-dragging", "is-current");
      rows.forEach(function (row) { row.classList.remove("is-over"); });
      dragged = null;
    });
    sample.addEventListener("keydown", function (event) {
      var index = Number(event.key) - 1;
      if (index >= 0 && index < categories.length) {
        event.preventDefault();
        classify(sample, categories[index]);
      }
    });
  });

  rows.forEach(function (row) {
    row.addEventListener("dragover", function (event) { event.preventDefault(); row.classList.add("is-over"); });
    row.addEventListener("dragleave", function () { row.classList.remove("is-over"); });
    row.addEventListener("drop", function (event) {
      event.preventDefault();
      row.classList.remove("is-over");
      var id = event.dataTransfer.getData("text/plain");
      var sample = dragged || samples.find(function (item) { return item.dataset.id === id; });
      classify(sample, row.dataset.category);
    });
  });

  document.getElementById("reset").addEventListener("click", reset);
  window.p35Game = { start: start, reset: reset, getState: snapshot, knowledge: knowledge };
  reset();
}());
</script>
