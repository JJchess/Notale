<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .formation-page {
    position: relative;
    width: var(--content-w);
    height: var(--content-h);
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--surface-data);
  }
  .disk-scene {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .disk-scene::after {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg, rgb(7 16 24 / 72%) 0, transparent 31%, transparent 67%, rgb(7 16 24 / 90%) 100%);
    content: "";
  }
  #diskCanvas { display: block; }
  .process-rail {
    --process-line-y: 60%;
    position: absolute;
    z-index: 4;
    top: var(--sp-4);
    right: var(--sp-4);
    left: var(--sp-4);
    height: 112px;
  }
  .process-rail.k-process { gap: var(--sp-2); }
  .process-rail.k-process > .step {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: var(--sp-3) var(--sp-3) var(--sp-2) 30px;
    background: rgb(16 27 36 / 90%);
    backdrop-filter: blur(5px);
  }
  .process-rail.k-process > .step::before { top: var(--sp-3); left: var(--sp-3); }
  .process-rail.k-process > .arw { flex-basis: 22px; }
  .step-no { color: var(--text-dim); font: 600 var(--fs-tick)/var(--lh-tight) var(--font-mono); }
  .step-text { color: var(--text); font-size: var(--fs-sec); line-height: var(--lh-tight); }
  .scene-label {
    position: absolute;
    z-index: 3;
    min-width: 132px;
    padding: var(--sp-2) var(--sp-3);
    border-left: 2px solid var(--primary);
    background: rgb(7 16 24 / 78%);
    color: var(--text);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
    transition: opacity 220ms ease, border-color 220ms ease, transform 220ms ease;
  }
  .scene-label small {
    display: block;
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }
  .scene-label.is-current { border-left-color: var(--accent); color: var(--accent); }
  .scene-label.is-pending { opacity: .36; transform: translateY(4px); }
  #labelRock { left: 320px; top: 245px; }
  #labelIce { left: 760px; top: 300px; }
  #labelVolatile { right: 92px; top: 353px; }
  .thermal-axis {
    position: absolute;
    z-index: 3;
    top: 184px;
    right: 108px;
    left: 238px;
    height: 28px;
    border-top: 1px solid var(--primary-line);
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }
  .thermal-axis::after {
    position: absolute;
    top: -5px;
    right: 0;
    width: 9px;
    height: 9px;
    border-top: 1px solid var(--primary);
    border-right: 1px solid var(--primary);
    transform: rotate(45deg);
    content: "";
  }
  .thermal-axis .hot { position: absolute; top: var(--sp-2); left: 0; }
  .thermal-axis .cold { position: absolute; top: var(--sp-2); right: 0; }
  .summary-tag {
    position: absolute;
    z-index: 4;
    right: var(--sp-5);
    bottom: 126px;
    max-width: 380px;
    padding: var(--sp-3) var(--sp-4);
    border: 1px solid var(--accent);
    background: rgb(16 27 36 / 92%);
    color: var(--accent);
    font-size: var(--fs-lead);
    font-weight: 650;
    line-height: var(--lh-tight);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 250ms ease, transform 250ms ease;
  }
  .summary-tag.is-visible { opacity: 1; transform: translateY(0); }
  .control-band {
    position: absolute;
    z-index: 5;
    right: 0;
    bottom: 0;
    left: 0;
    min-height: 112px;
    padding: var(--sp-3) var(--sp-4);
    border-top: 1px solid var(--line-strong);
    background: rgb(11 21 29 / 96%);
  }
  .temperature-control { flex: 1 1 600px; min-width: 0; }
  .temperature-control .ctl { min-width: 0; }
  .temperature-control input { min-width: 320px; }
  .temperature-state {
    width: 64px;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: var(--fs-body);
    font-weight: 650;
    text-align: right;
  }
  .range-ends { padding-left: 54px; color: var(--text-muted); font-size: var(--fs-label); line-height: var(--lh-tight); }
  .feedback { min-height: 22px; color: var(--text-muted); font-size: var(--fs-sec); line-height: var(--lh-tight); }
  .feedback.is-wrong { color: var(--danger); }
  .material-progress { flex: 0 0 510px; min-width: 0; }
  .progress-title { color: var(--text-muted); font-size: var(--fs-label); line-height: var(--lh-tight); }
  .progress-segments { display: flex; gap: var(--sp-2); }
  .progress-segment {
    flex: 1 1 0;
    min-width: 0;
    padding: var(--sp-2);
    border-top: 3px solid var(--line-strong);
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }
  .progress-segment.is-done { border-top-color: var(--primary); color: var(--text); }
  .progress-segment.is-current { border-top-color: var(--accent); color: var(--accent); }
  .reset-button { flex: 0 0 44px; width: 44px; padding: 0; font-size: 24px; }
  .birth-note {
    position: absolute;
    z-index: 5;
    left: var(--sp-4);
    bottom: 122px;
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
  }
  progress.lec-progress {
    padding: 0;
    border: 0;
    overflow: visible;
    appearance: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .scene-label, .summary-tag { transition: none; }
  }
</style>
</head>
<body data-page="37" data-total="50">
<div id="stage">
<main id="main">
  <section class="formation-page content min0" aria-label="斜俯视原行星盘从中心向外逐渐变冷。拖动盘温后，金属与硅酸盐、水冰和低温挥发物依次凝结，凝结边界向太阳靠近。">
    <div class="disk-scene min0" id="diskScene">
      <canvas id="diskCanvas" class="cv-fill" aria-hidden="true"></canvas>
    </div>

    <div class="k-process process-rail" aria-label="温度梯度形成材料梯度的五步过程">
      <div class="axis" aria-hidden="true"></div>
      <div class="step is-done" data-step="0"><span class="step-no">01</span><span class="step-text">太阳加热盘面</span></div>
      <div class="arw" aria-hidden="true"></div>
      <div class="step is-current" data-step="1" aria-current="step"><span class="step-no">02</span><span class="step-text">向外温度下降</span></div>
      <div class="arw" aria-hidden="true"></div>
      <div class="step" data-step="2"><span class="step-no">03</span><span class="step-text">耐高温固体凝结</span></div>
      <div class="arw" aria-hidden="true"></div>
      <div class="step" data-step="3"><span class="step-no">04</span><span class="step-text">水冰加入固体</span></div>
      <div class="arw" aria-hidden="true"></div>
      <div class="step" data-step="4"><span class="step-no">05</span><span class="step-text">低温挥发物凝结</span></div>
    </div>

    <div class="thermal-axis" aria-hidden="true"><span class="hot">更热 · 内侧</span><span class="cold">更冷 · 外侧</span></div>
    <div class="scene-label" id="labelRock"><strong>金属与硅酸盐</strong><small>耐高温固体</small></div>
    <div class="scene-label is-pending" id="labelIce"><strong>水冰</strong><small>较冷处凝结</small></div>
    <div class="scene-label is-pending" id="labelVolatile"><strong>低温挥发物</strong><small>更冷处凝结</small></div>
    <div class="summary-tag" id="summaryTag">初始材料梯度：不同位置可用的固体材料不同</div>
    <p class="birth-note">这是出生材料条件，不是今日轨道地图。</p>

    <div class="control-band row items-center gap-5">
      <div class="temperature-control col gap-1 min0">
        <div class="ctl">
          <label for="tempRange">盘温</label>
          <input id="tempRange" type="range" min="0" max="100" step="1" value="8" aria-describedby="tempFeedback">
          <output id="tempState" class="temperature-state" for="tempRange">热态</output>
        </div>
        <div class="range-ends row justify-between"><span>较热盘</span><span>较冷盘</span></div>
        <div class="feedback" id="tempFeedback" aria-live="polite">向右拖动，让盘整体冷却。</div>
      </div>
      <div class="material-progress col gap-2 min0" aria-label="凝结进度">
        <div class="progress-title">当地固体材料</div>
        <div class="progress-segments">
          <div class="progress-segment is-current" data-progress="0">耐高温固体</div>
          <div class="progress-segment" data-progress="1">水冰</div>
          <div class="progress-segment" data-progress="2">低温挥发物</div>
        </div>
      </div>
      <button class="reset-button" id="resetButton" type="button" title="重置到热态" aria-label="重置到热态">↺</button>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/three.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 37,
  kicker: "FORMATION · MATERIAL GRADIENT",
  title: "冷下来，材料才有落脚处",
  take: "原行星盘越远越冷，因此不同位置最初能够凝结成固体的材料并不相同。"
});

(function () {
  "use strict";

  var sunData = Lec.K.SUN;
  var unitData = Lec.K.UNITS;
  var timeData = Lec.K.TIME;
  var referenceData = Lec.K.REFERENCE;
  var ageMap = Lec.P.ageFraction;
  var timelineMap = Lec.P.compressTimeline;
  void sunData; void unitData; void timeData; void referenceData; void ageMap; void timelineMap;

  var canvas = document.getElementById("diskCanvas");
  var host = document.getElementById("diskScene");
  var slider = document.getElementById("tempRange");
  var stateOut = document.getElementById("tempState");
  var feedback = document.getElementById("tempFeedback");
  var reset = document.getElementById("resetButton");
  var summary = document.getElementById("summaryTag");
  var labels = [document.getElementById("labelRock"), document.getElementById("labelIce"), document.getElementById("labelVolatile")];
  var progressEls = Array.prototype.slice.call(document.querySelectorAll("[data-progress]"));
  var stepEls = Array.prototype.slice.call(document.querySelectorAll("[data-step]"));
  var reduced = Deck.reduced();

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(Deck.token("--surface-data"));
  scene.fog = new THREE.FogExp2(Deck.token("--bg"), 0.028);

  var camera = new THREE.PerspectiveCamera(38, 1, 0.1, 120);
  camera.position.set(1.5, 19, 27);
  camera.lookAt(1.5, 0, 0);

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  scene.add(new THREE.HemisphereLight(0x8ecad3, 0x071018, 1.15));
  var sunLight = new THREE.PointLight(0xffd166, 80, 45, 1.7);
  sunLight.position.set(-7.3, 1.2, 0);
  scene.add(sunLight);

  var diskGroup = new THREE.Group();
  diskGroup.position.x = -1.5;
  diskGroup.rotation.z = -0.05;
  scene.add(diskGroup);

  var diskGeo = new THREE.RingGeometry(2.1, 15.8, 128, 10);
  var diskMat = new THREE.ShaderMaterial({
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
    uniforms: { uCool: { value: 0.08 } },
    vertexShader: "varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
    fragmentShader: "varying vec2 vUv; uniform float uCool; void main(){float r=length(vUv-vec2(.5))*2.0; vec3 hot=vec3(.72,.25,.10); vec3 mid=vec3(.18,.42,.48); vec3 cold=vec3(.08,.18,.28); vec3 c=mix(hot,mid,smoothstep(.08,.58,r)); c=mix(c,cold,smoothstep(.50,1.1,r)); c=mix(c,vec3(.10,.28,.34),uCool*.28); float a=(1.0-smoothstep(.88,1.1,r))*(.48+.18*sin(r*52.0)); gl_FragColor=vec4(c,a); }"
  });
  var disk = new THREE.Mesh(diskGeo, diskMat);
  disk.rotation.x = -Math.PI / 2;
  diskGroup.add(disk);

  var sun = new THREE.Mesh(new THREE.SphereGeometry(1.45, 40, 28), new THREE.MeshBasicMaterial({ color: 0xffd166 }));
  sun.position.set(-7.3, 0.55, 0);
  scene.add(sun);
  var corona = new THREE.Mesh(new THREE.SphereGeometry(1.9, 32, 20), new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.12, depthWrite: false }));
  corona.position.copy(sun.position);
  scene.add(corona);

  var ringRadii = [5.4, 9.2, 13.3];
  var rings = ringRadii.map(function (radius) {
    var ring = new THREE.Mesh(
      new THREE.RingGeometry(radius - 0.045, radius + 0.045, 128),
      new THREE.MeshBasicMaterial({ color: 0x4fc3d7, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.06;
    diskGroup.add(ring);
    return ring;
  });

  var dustCount = 1500;
  var dustPos = new Float32Array(dustCount * 3);
  var dustSeed = [];
  for (var i = 0; i < dustCount; i++) {
    var radius = 2.3 + Math.pow((i * 0.61803398875) % 1, 0.72) * 13.2;
    var angle = i * 2.39996323;
    var height = (((i * 0.754877666) % 1) - 0.5) * (0.35 + radius * 0.055);
    dustSeed.push({ r: radius, a: angle, h: height });
    dustPos[i * 3] = Math.cos(angle) * radius;
    dustPos[i * 3 + 1] = height;
    dustPos[i * 3 + 2] = Math.sin(angle) * radius;
  }
  var dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
  var dustMat = new THREE.PointsMaterial({ color: 0xa9bac3, size: 0.075, transparent: true, opacity: 0.52, depthWrite: false, sizeAttenuation: true });
  var dust = new THREE.Points(dustGeo, dustMat);
  diskGroup.add(dust);

  var solidGroups = ringRadii.map(function (_, groupIndex) {
    var count = 170;
    var positions = new Float32Array(count * 3);
    var points = new THREE.Points(
      new THREE.BufferGeometry(),
      new THREE.PointsMaterial({ color: groupIndex === 0 ? 0xffd166 : 0x9de3ed, size: groupIndex === 0 ? 0.12 : 0.15, transparent: true, opacity: 0, depthWrite: false })
    );
    for (var j = 0; j < count; j++) {
      var baseR = ringRadii[groupIndex] + (((j * 0.41421356) % 1) - 0.5) * (2.0 + groupIndex * 0.6);
      var a = j * 2.39996323 + groupIndex;
      positions[j * 3] = Math.cos(a) * baseR;
      positions[j * 3 + 1] = 0.10 + ((j * 0.2718) % 1) * 0.08;
      positions[j * 3 + 2] = Math.sin(a) * baseR;
    }
    points.geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    diskGroup.add(points);
    return points;
  });

  function resizeScene() {
    var w = host.clientWidth;
    var h = host.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
  }
  Deck.onResize(resizeScene);
  resizeScene();

  var maxReached = 8;
  var lastValue = 8;
  var wrongTimer = 0;
  var thresholds = [18, 48, 78];

  function activeCount(value) {
    var count = 0;
    thresholds.forEach(function (t) { if (value >= t) count++; });
    return count;
  }

  function updateProcess(value) {
    var count = activeCount(value);
    var currentStep = Math.min(4, count + 1);
    stepEls.forEach(function (el, index) {
      el.classList.toggle("is-done", index < currentStep);
      el.classList.toggle("is-current", index === currentStep);
      if (index === currentStep) el.setAttribute("aria-current", "step");
      else el.removeAttribute("aria-current");
    });
    progressEls.forEach(function (el, index) {
      el.classList.toggle("is-done", index < count);
      el.classList.toggle("is-current", index === Math.min(count, 2) && count < 3);
    });
    labels.forEach(function (el, index) {
      el.classList.toggle("is-pending", index >= count);
      el.classList.toggle("is-current", index === count - 1);
    });
    summary.classList.toggle("is-visible", count === 3);
  }

  function applyTemperature(value) {
    var cool = value / 100;
    diskMat.uniforms.uCool.value = cool;
    var count = activeCount(value);
    stateOut.textContent = value < 34 ? "热态" : value < 72 ? "冷却中" : "冷态";
    ringRadii.forEach(function (base, index) {
      var local = Math.max(0, cool - index * 0.18);
      var radius = base - local * (2.2 + index * 0.45);
      rings[index].scale.setScalar(radius / base);
      rings[index].material.opacity = value >= thresholds[index] ? 0.78 : 0.16;
      rings[index].material.color.setHex(value >= thresholds[index] ? 0xffd166 : 0x4fc3d7);
      solidGroups[index].material.opacity = value >= thresholds[index] ? 0.78 : 0;
    });
    dustMat.opacity = 0.52 - cool * 0.20;
    updateProcess(value);
    renderer.render(scene, camera);
  }

  slider.addEventListener("input", function () {
    var value = Number(slider.value);
    if (value < lastValue - 2 && maxReached < 100) {
      value = Math.max(0, lastValue - 1);
      slider.value = String(value);
      feedback.textContent = "方向反了：冷却会让凝结边界向太阳靠近。";
      feedback.classList.add("is-wrong");
      window.clearTimeout(wrongTimer);
      wrongTimer = window.setTimeout(function () {
        feedback.textContent = "继续向较冷盘推进。";
        feedback.classList.remove("is-wrong");
      }, 1100);
    } else {
      feedback.classList.remove("is-wrong");
      var count = activeCount(value);
      feedback.textContent = count === 0 ? "向右拖动，让盘整体冷却。" : count === 1 ? "耐高温材料已成为固体。" : count === 2 ? "更外侧的固体中加入水冰。" : "三类材料已形成由内向外的梯度。";
    }
    lastValue = value;
    maxReached = Math.max(maxReached, value);
    applyTemperature(value);
  });

  reset.addEventListener("click", function () {
    slider.value = "8";
    maxReached = 8;
    lastValue = 8;
    feedback.textContent = "向右拖动，让盘整体冷却。";
    feedback.classList.remove("is-wrong");
    camera.position.set(1.5, 19, 27);
    camera.lookAt(1.5, 0, 0);
    applyTemperature(8);
    slider.focus();
  });

  var lastStage = activeCount(8);
  slider.addEventListener("change", function () {
    var now = activeCount(Number(slider.value));
    if (now > lastStage) feedback.textContent = now === 3 ? "完整材料分区已经显现。" : feedback.textContent;
    lastStage = now;
  });

  applyTemperature(8);

  if (reduced) {
    renderer.render(scene, camera);
  } else {
    Deck.loop(function (t, dt) {
      var positions = dustGeo.attributes.position.array;
      for (var k = 0; k < dustCount; k++) {
        var seed = dustSeed[k];
        var a = seed.a + t * (0.018 + 0.08 / seed.r);
        positions[k * 3] = Math.cos(a) * seed.r;
        positions[k * 3 + 1] = seed.h + Math.sin(t * 0.34 + k) * 0.025;
        positions[k * 3 + 2] = Math.sin(a) * seed.r;
      }
      dustGeo.attributes.position.needsUpdate = true;
      corona.scale.setScalar(1 + Math.sin(t * 1.3) * 0.025);
      renderer.render(scene, camera);
    }, { still: 2.4 });
  }
}());
</script>
</body>
</html>
