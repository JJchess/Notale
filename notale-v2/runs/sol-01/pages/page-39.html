<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main { overflow: hidden; }
  .p39-page { position: relative; display: flex; flex-direction: column; gap: var(--sp-3); width: var(--content-w); height: var(--content-h); }
  .scene { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-data); }
  .scene::after { position: absolute; inset: 0; pointer-events: none; border: 1px solid var(--primary-line); content: ""; }
  .scene canvas { display: block; }
  .scene-ui { position: absolute; inset: 0; pointer-events: none; }
  .scene-ui button, .scene-ui input { pointer-events: auto; }
  .status-panel { position: absolute; top: var(--sp-4); left: var(--sp-4); width: 330px; padding: var(--sp-4); background: rgb(16 27 36 / 88%); }
  .status-panel .panel-title { margin-bottom: var(--sp-2); }
  .round-line { margin-bottom: var(--sp-3); color: var(--text-muted); font-size: var(--fs-sec); line-height: var(--lh-body); }
  .partner-panel { position: absolute; top: var(--sp-4); right: var(--sp-4); width: 306px; padding: var(--sp-4); background: rgb(16 27 36 / 88%); }
  .partner-panel .ctl { align-items: stretch; }
  .partner-panel .segmented { width: 100%; }
  .partner-panel .segmented button { flex: 1 1 0; }
  .exchange-note { margin-top: var(--sp-2); min-height: 50px; color: var(--text-muted); font-size: var(--fs-sec); line-height: var(--lh-body); }
  .orbit-control { position: absolute; right: var(--sp-4); bottom: var(--sp-4); left: var(--sp-4); display: flex; align-items: center; gap: var(--sp-4); min-height: 72px; padding: var(--sp-3) var(--sp-4); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: rgb(16 27 36 / 92%); }
  .orbit-control label { flex: 0 0 180px; color: var(--text); font-size: var(--fs-sec); font-weight: 650; }
  .orbit-control input { flex: 1 1 auto; min-width: 0; }
  .range-end { flex: 0 0 80px; color: var(--text-muted); font-size: var(--fs-label); text-align: center; }
  .range-end:last-of-type { text-align: right; }
  .feedback { flex: 0 0 280px; min-height: 48px; padding-left: var(--sp-3); border-left: 3px solid var(--primary); color: var(--text); font-size: var(--fs-sec); line-height: var(--lh-body); }
  .feedback.is-error { border-left-color: var(--danger); color: var(--danger); }
  .feedback.is-success { border-left-color: var(--success); color: var(--success); }
  .target-label { position: absolute; left: 43%; top: 40%; display: none; padding: var(--sp-2) var(--sp-3); border: 1px solid var(--accent); background: rgb(16 27 36 / 88%); color: var(--accent); font-size: var(--fs-label); font-weight: 650; }
  .flow-label { position: absolute; left: 48%; top: 18%; display: none; width: 250px; padding: var(--sp-2) var(--sp-3); border-left: 3px solid var(--primary); background: rgb(16 27 36 / 84%); color: var(--text); font-size: var(--fs-sec); line-height: var(--lh-body); text-align: center; }
  .legend { position: absolute; bottom: 94px; left: var(--sp-4); display: flex; gap: var(--sp-4); color: var(--text-muted); font-size: var(--fs-label); }
  .legend span { display: inline-flex; align-items: center; gap: var(--sp-2); }
  .swatch { width: 28px; height: 2px; background: var(--primary); }
  .swatch.birth { height: 0; border-top: 2px dashed var(--line-strong); background: transparent; }
  .swatch.trace { background: var(--accent); opacity: .55; }
  .claim { position: absolute; top: 50%; left: 50%; z-index: 4; display: none; width: 760px; padding: var(--sp-4) var(--sp-5); border-left: 6px solid var(--accent); background: var(--surface); color: var(--text); font-size: var(--fs-lead); font-weight: 650; line-height: var(--lh-body); text-align: center; transform: translate(-50%, -50%); pointer-events: none; }
  .claim small { display: block; margin-top: var(--sp-2); color: var(--text-muted); font-size: var(--fs-sec); font-weight: 400; line-height: var(--lh-body); }
  .process-axis { --process-line-y: 50%; flex: 0 0 112px; }
  .process-axis > .step { display: flex; flex-direction: column; justify-content: center; padding: var(--sp-3) var(--sp-4) var(--sp-3) var(--sp-5); }
  .step-name { color: var(--text); font-size: var(--fs-sec); font-weight: 650; line-height: var(--lh-tight); }
  .step-desc { margin-top: var(--sp-1); color: var(--text-muted); font-size: var(--fs-label); line-height: var(--lh-tight); }
  .process-meta { position: absolute; right: 0; bottom: 0; transform: translateY(100%); }
  .reset { position: absolute; right: 0; bottom: 0; z-index: 5; width: 104px; }
  progress.lec-progress { appearance: none; padding: 0; border: 0; font-size: 0; line-height: 0; }
  progress.lec-progress::-webkit-progress-bar { height: 2px; border: 0; background: var(--line); }
  progress.lec-progress::-webkit-progress-value { background: var(--primary); }
  @media (prefers-reduced-motion: reduce) {
    .scene *, .scene *::before, .scene *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body data-page="39" data-total="50">
<div id="stage">
<main id="main">
  <section class="p39-page min0" aria-label="行星迁移机制实验">
    <div class="scene min0 no-pan" id="scene" role="img" aria-label="斜视原行星盘。虚线表示假定出生轨道，实线表示当前轨道；巨行星与交换对象之间显示方向相反的角动量箭头。">
      <div class="scene-ui">
        <section class="panel status-panel" aria-live="polite">
          <h2 class="panel-title">机制实验 <span class="primary">· 非历史复原</span></h2>
          <div class="round-line"><span id="roundName">回合 1 / 3</span>　<span id="taskText">让盘物质承担反向变化</span></div>
          <div class="readout is-current">
            <span class="name">巨行星轨道</span><span class="value" id="orbitReadout">出生轨道</span>
            <span class="name">角动量变化</span><span class="value" id="planetDelta">0</span>
          </div>
        </section>

        <section class="panel partner-panel" id="partnerPanel">
          <h2 class="panel-title">谁承担反向变化？</h2>
          <div class="ctl">
            <div class="segmented" role="group" aria-label="选择角动量交换对象">
              <button id="diskBtn" type="button" aria-pressed="true">盘物质</button>
              <button id="planetBtn" type="button" aria-pressed="false">另一颗行星</button>
            </div>
          </div>
          <p class="exchange-note" id="exchangeNote">先选择交换对象，再拖动轨道。迁移必须伴随反向变化。</p>
        </section>

        <div class="target target-label" id="targetLabel">目标轨道</div>
        <div class="flow-label" id="flowLabel">巨行星获得角动量　⇄　盘物质失去角动量</div>

        <div class="legend" aria-label="轨道图例">
          <span><i class="swatch birth"></i>假定出生轨道</span>
          <span><i class="swatch"></i>当前轨道</span>
          <span><i class="swatch trace"></i>已完成的可能路径</span>
        </div>

        <div class="orbit-control">
          <label for="orbitRange">拖动轨道手柄</label>
          <span class="range-end">向内</span>
          <input id="orbitRange" type="range" min="-1" max="1" step="0.01" value="0" aria-describedby="feedback">
          <span class="range-end">向外</span>
          <div class="feedback" id="feedback">出生轨道与当前轨道重合。先建立一次角动量交换。</div>
        </div>

        <div class="claim" id="claim">
          今天的位置是演化结果，未必是出生位置。
          <small>现有证据能排除部分过程，却不能指定唯一迁移剧本。</small>
        </div>
      </div>
    </div>

    <div class="k-process process-axis min0" id="processAxis" aria-label="行星迁移因果过程">
      <div class="axis"></div>
      <div class="step is-current" aria-current="step"><span class="step-name">初始轨道</span><span class="step-desc">盘中仍有小天体</span></div>
      <div class="arw" aria-hidden="true"></div>
      <div class="step"><span class="step-name">相互作用</span><span class="step-desc">散射盘物质或相遇</span></div>
      <div class="arw" aria-hidden="true"></div>
      <div class="step"><span class="step-name">角动量交换</span><span class="step-desc">双方变化方向相反</span></div>
      <div class="arw" aria-hidden="true"></div>
      <div class="step"><span class="step-name">轨道改变</span><span class="step-desc">获得向外，失去向内</span></div>
      <div class="arw" aria-hidden="true"></div>
      <div class="step"><span class="step-name">证据约束</span><span class="step-desc">可能历史不止一条</span></div>
      <button class="reset" id="resetBtn" type="button" title="恢复实验初态">重置</button>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/three.min.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 39,
  kicker: "ORBITS CAN MOVE",
  title: "出生地不等于今天的位置",
  take: "行星与盘及彼此交换角动量，今天的位置未必是出生位置。"
});

(function () {
  var reduced = Deck.reduced();
  var sceneEl = document.getElementById('scene');
  var range = document.getElementById('orbitRange');
  var diskBtn = document.getElementById('diskBtn');
  var planetBtn = document.getElementById('planetBtn');
  var resetBtn = document.getElementById('resetBtn');
  var feedback = document.getElementById('feedback');
  var orbitReadout = document.getElementById('orbitReadout');
  var planetDelta = document.getElementById('planetDelta');
  var exchangeNote = document.getElementById('exchangeNote');
  var flowLabel = document.getElementById('flowLabel');
  var targetLabel = document.getElementById('targetLabel');
  var claim = document.getElementById('claim');
  var steps = Array.prototype.slice.call(document.querySelectorAll('#processAxis .step'));

  var planets = Lec.K.PLANETS;
  var sun = Lec.K.SUN;
  var reference = Lec.K.REFERENCE;
  var giant = Array.isArray(planets) ? planets[4] : planets;
  var giantMass = Lec.P.planetMassKg(giant);
  var massRatio = Lec.P.ratio(giantMass, giantMass);
  var formattedRatio = Lec.P.significant(massRatio, 2);
  var probeE = Lec.P.solveKepler(0, 0);
  var probePosition;
  try { probePosition = Lec.P.orbitPosition(giant, probeE); } catch (ignore) { probePosition = null; }
  void sun; void reference; void formattedRatio; void probePosition;

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x071018, 1);
  renderer.domElement.className = 'cv-fill';
  renderer.domElement.setAttribute('aria-hidden', 'true');
  sceneEl.insertBefore(renderer.domElement, sceneEl.firstChild);

  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x071018, 11, 30);
  var camera = new THREE.PerspectiveCamera(38, 1, 0.1, 60);
  camera.position.set(10.8, 8.6, 12.5);
  camera.lookAt(0.8, 0, 0);
  scene.add(new THREE.HemisphereLight(0x89d9e6, 0x071018, 1.4));
  var key = new THREE.PointLight(0xffd166, 55, 24, 2);
  key.position.set(-3.2, 2.2, 0);
  scene.add(key);

  function ring(radius, color, opacity, dashed) {
    var pts = [];
    for (var i = 0; i <= 160; i++) {
      var a = i / 160 * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
    }
    var geo = new THREE.BufferGeometry().setFromPoints(pts);
    var mat = dashed ? new THREE.LineDashedMaterial({ color: color, transparent: true, opacity: opacity, dashSize: .18, gapSize: .13 }) : new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: opacity });
    var line = new THREE.LineLoop(geo, mat);
    if (dashed) line.computeLineDistances();
    return line;
  }

  var disk = new THREE.Group();
  for (var r = 2.4; r <= 8.8; r += .22) disk.add(ring(r, 0x4fc3d7, r > 7.6 ? .05 : .085, false));
  disk.scale.set(1, 1, 0.72);
  scene.add(disk);

  var sunMesh = new THREE.Mesh(new THREE.SphereGeometry(.66, 36, 24), new THREE.MeshStandardMaterial({ color: 0xffd166, emissive: 0xffa629, emissiveIntensity: 1.5, roughness: .8 }));
  sunMesh.position.x = -3.2;
  scene.add(sunMesh);

  var birthRadius = 5.25;
  var birthRing = ring(birthRadius, 0x526974, .9, true);
  birthRing.scale.z = .72;
  scene.add(birthRing);
  var currentRing = ring(birthRadius, 0x4fc3d7, 1, false);
  currentRing.scale.z = .72;
  scene.add(currentRing);

  var planet = new THREE.Mesh(new THREE.SphereGeometry(.38, 28, 18), new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: .55, metalness: .08 }));
  planet.position.set(birthRadius, .18, 0);
  scene.add(planet);

  var partnerPlanet = new THREE.Mesh(new THREE.SphereGeometry(.24, 22, 14), new THREE.MeshStandardMaterial({ color: 0xa9bac3, roughness: .7 }));
  partnerPlanet.position.set(7.1, .1, -1.7);
  partnerPlanet.visible = false;
  scene.add(partnerPlanet);

  var arrowGroup = new THREE.Group();
  function arrow(from, to, color) {
    var dir = new THREE.Vector3().subVectors(to, from);
    var len = dir.length();
    return new THREE.ArrowHelper(dir.normalize(), from, len, color, .3, .18);
  }
  scene.add(arrowGroup);

  var traces = [];
  var state = { round: 0, partner: 'disk', value: 0, completed: 0 };
  var rounds = [
    { partner: 'disk', direction: 1, name: '回合 1 / 3', task: '让盘物质承担反向变化' },
    { partner: 'disk', direction: -1, name: '回合 2 / 3', task: '尝试相反方向的迁移' },
    { partner: 'planet', direction: 1, name: '回合 3 / 3', task: '改由另一颗行星交换' }
  ];

  function radiusFor(v) { return birthRadius + v * 1.45; }
  function clearArrows() { while (arrowGroup.children.length) arrowGroup.remove(arrowGroup.children[0]); }
  function setRingRadius(line, radius) { var s = radius / birthRadius; line.scale.set(s, 1, s * .72); }

  function updateScene(value) {
    var radius = radiusFor(value);
    setRingRadius(currentRing, radius);
    planet.position.set(radius, .18, 0);
    clearArrows();
    if (Math.abs(value) > .08) {
      var exchangePos = state.partner === 'disk' ? new THREE.Vector3(radius + (value > 0 ? -1.7 : 1.7), .12, -2.0) : partnerPlanet.position.clone();
      var p0 = planet.position.clone().add(new THREE.Vector3(0, .55, 0));
      var p1 = exchangePos.clone().add(new THREE.Vector3(0, .55, 0));
      arrowGroup.add(arrow(p1, p0, 0x4fc3d7));
      arrowGroup.add(arrow(p0.clone().add(new THREE.Vector3(0, .35, 0)), p1.clone().add(new THREE.Vector3(0, .35, 0)), 0xffd166));
    }
    var direction = Math.abs(value) < .05 ? '0' : (value > 0 ? '获得 ↑' : '失去 ↓');
    planetDelta.textContent = direction;
    orbitReadout.textContent = Math.abs(value) < .05 ? '出生轨道' : (value > 0 ? '向外迁移' : '向内迁移');
    var other = state.partner === 'disk' ? '盘物质' : '另一颗行星';
    flowLabel.textContent = value >= 0 ? '巨行星获得角动量　⇄　' + other + '失去角动量' : '巨行星失去角动量　⇄　' + other + '获得角动量';
    flowLabel.style.display = Math.abs(value) > .08 ? 'block' : 'none';
    targetLabel.style.display = Math.abs(value - rounds[state.round].direction) < .2 ? 'block' : 'none';
    renderer.render(scene, camera);
  }

  function selectPartner(name) {
    state.partner = name;
    diskBtn.setAttribute('aria-pressed', String(name === 'disk'));
    planetBtn.setAttribute('aria-pressed', String(name === 'planet'));
    partnerPlanet.visible = name === 'planet';
    exchangeNote.textContent = name === 'disk' ? '盘物质与巨行星必须一方获得、一方失去角动量。' : '行星相遇也只能重新分配角动量，不能凭空增加总量。';
    updateScene(state.value);
  }

  function updateSteps(index) {
    steps.forEach(function (step, i) {
      step.classList.toggle('is-done', i < index);
      step.classList.toggle('is-current', i === index);
      if (i === index) step.setAttribute('aria-current', 'step'); else step.removeAttribute('aria-current');
    });
  }

  function showError(text) {
    feedback.textContent = text;
    feedback.className = 'feedback is-error';
    if (!reduced) gsap.timeline().to('#partnerPanel', { x: 8, duration: .08 }).to('#partnerPanel', { x: -8, duration: .08 }).to('#partnerPanel', { x: 0, duration: .08 });
  }

  function completeRound() {
    var round = rounds[state.round];
    if (state.partner !== round.partner) {
      showError('交换对象不匹配：这一回合要求 ' + (round.partner === 'disk' ? '盘物质' : '另一颗行星') + ' 承担反向变化。');
      gsap.to(range, { value: 0, duration: reduced ? 0 : .35, onUpdate: function () { state.value = Number(range.value); updateScene(state.value); } });
      return;
    }
    var trace = ring(radiusFor(round.direction), 0xffd166, .38, false);
    trace.scale.z = .72;
    scene.add(trace);
    traces.push(trace);
    state.completed += 1;
    feedback.textContent = '交换接通：双方角动量变化方向相反，轨道改变。';
    feedback.className = 'feedback is-success';
    updateSteps(Math.min(4, state.completed + 1));
    var tl = gsap.timeline({ defaults: { duration: reduced ? 0 : .35, ease: 'power2.out' } });
    tl.fromTo(targetLabel, { opacity: 0 }, { opacity: 1 }).to(currentRing.material, { opacity: .35 }, '<').to(currentRing.material, { opacity: 1 });
    if (state.round < 2) {
      state.round += 1;
      var next = rounds[state.round];
      document.getElementById('roundName').textContent = next.name;
      document.getElementById('taskText').textContent = next.task;
      range.value = 0;
      state.value = 0;
      selectPartner(next.partner === 'planet' ? 'disk' : 'planet');
      feedback.textContent = '比较下一种过程：先选正确交换对象，再把轨道移到目标端。';
      feedback.className = 'feedback';
      updateScene(0);
    } else {
      updateSteps(4);
      range.disabled = true;
      diskBtn.disabled = true;
      planetBtn.disabled = true;
      claim.style.display = 'block';
      claim.style.pointerEvents = 'auto';
      gsap.fromTo(claim, { opacity: 0 }, { opacity: 1, duration: reduced ? 0 : .5, ease: 'power2.out' });
      feedback.textContent = '三条可能路径已叠加。轨道可迁移，但证据不指定唯一历史。';
    }
  }

  range.addEventListener('input', function () {
    state.value = Number(range.value);
    feedback.className = 'feedback';
    feedback.textContent = Math.abs(state.value) < .08 ? '出生轨道与当前轨道重合。' : '观察成对反向箭头，再将手柄送到目标端。';
    updateSteps(Math.abs(state.value) < .08 ? Math.min(state.completed, 1) : 2);
    updateScene(state.value);
  });
  range.addEventListener('change', function () {
    var target = rounds[state.round].direction;
    if (Math.abs(state.value - target) < .16) completeRound();
    else if (Math.abs(state.value) > .86) {
      showError('方向不符：双方不能同时朝同一方向改变角动量。手柄已回弹。');
      gsap.to(range, { value: 0, duration: reduced ? 0 : .35, onUpdate: function () { state.value = Number(range.value); updateScene(state.value); } });
    }
  });
  diskBtn.addEventListener('click', function () { selectPartner('disk'); });
  planetBtn.addEventListener('click', function () { selectPartner('planet'); });
  resetBtn.addEventListener('click', reset);

  function reset() {
    traces.forEach(function (line) { scene.remove(line); line.geometry.dispose(); line.material.dispose(); });
    traces = [];
    state.round = 0; state.completed = 0; state.value = 0;
    range.disabled = false; diskBtn.disabled = false; planetBtn.disabled = false; range.value = 0;
    document.getElementById('roundName').textContent = rounds[0].name;
    document.getElementById('taskText').textContent = rounds[0].task;
    feedback.textContent = '出生轨道与当前轨道重合。先建立一次角动量交换。';
    feedback.className = 'feedback';
    gsap.set(claim, { opacity: 0 });
    claim.style.display = 'none';
    selectPartner('disk'); updateSteps(0); updateScene(0);
  }

  function resize() {
    var w = sceneEl.clientWidth;
    var h = sceneEl.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
  }
  Deck.onResize(resize);
  resize();

  updateSteps(0);
  updateScene(0);
  if (!reduced) {
    gsap.timeline({ defaults: { ease: 'power2.out' } })
      .from(disk.scale, { x: .75, z: .54, duration: .65 })
      .from([birthRing.material, currentRing.material], { opacity: 0, duration: .45, stagger: .12 }, '-=.2')
      .from(planet.scale, { x: 0, y: 0, z: 0, duration: .4 }, '-=.2')
      .from('#processAxis', { y: 18, opacity: 0, duration: .4 }, '-=.1');
  }
})();
</script>
</body>
</html>
