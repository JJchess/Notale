<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lec-progress::before{display:none}
  .page40{width:var(--content-w);height:var(--content-h);display:flex;flex-direction:column;gap:var(--sp-4)}
  .rounds{height:54px;display:flex;align-items:stretch;gap:var(--sp-3)}
  .prompt{min-height:42px;padding:var(--sp-2) var(--sp-4);border-left:4px solid var(--accent);background:var(--accent-soft);color:var(--text);font-size:var(--fs-lead);line-height:var(--lh-tight)}
  .round{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-4);border:1px solid var(--line);background:var(--surface);color:var(--text-muted);font-size:var(--fs-label);line-height:var(--lh-tight)}
  .round b{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line-strong);border-radius:50%;font-family:var(--font-mono);color:var(--text)}
  .round.is-current{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
  .round.is-current b{border-color:var(--accent);color:var(--accent)}
  .round.is-done b{border-color:var(--success);color:var(--success)}
  .reset{width:54px;min-width:54px;padding:0;font-size:24px}
  .workspace{display:flex;gap:var(--sp-4);flex:1 1 0;min-height:0}
  .evidence{width:500px;display:flex;flex-direction:column;gap:var(--sp-3);min-width:0}
  .photos{height:146px;display:flex;gap:var(--sp-3)}
  .photo{position:relative;flex:1 1 0;min-width:0;overflow:hidden;border:1px solid var(--line);background:var(--surface-data)}
  .photo img{width:100%;height:100%;object-fit:cover;filter:contrast(1.08)}
  .photo .target{position:absolute;inset:18px 42px 28px}
  .photo-label{position:absolute;right:0;bottom:0;left:0;padding:var(--sp-2) var(--sp-3);background:rgb(7 16 24 / 82%);font-size:var(--fs-label);line-height:var(--lh-tight)}
  .sim-wrap{position:relative;display:flex;gap:var(--sp-3);height:174px;padding:var(--sp-3);border:1px solid var(--line);background:var(--surface-data)}
  .field{position:relative;flex:1 1 0;min-width:0;border:2px solid var(--primary);background:#0c151c}
  .field.target-field{border-color:var(--accent)}
  .field svg{display:block;width:100%;height:100%}
  .field-name{position:absolute;top:var(--sp-2);left:var(--sp-2);z-index:2;padding:2px 7px;background:rgb(7 16 24 / 80%);font-size:var(--fs-label);line-height:var(--lh-tight)}
  .field-count{position:absolute;right:var(--sp-2);bottom:var(--sp-2);z-index:2;padding:2px 7px;background:rgb(7 16 24 / 80%);font-family:var(--font-mono);font-size:var(--fs-sec);line-height:var(--lh-tight)}
  .controls{display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);border:1px solid var(--line);background:var(--surface)}
  .ctl{min-height:44px}.ctl label{width:96px}.ctl output{width:58px;color:var(--accent);font-size:var(--fs-sec);text-align:right}
  .feedback{min-height:48px;padding-left:var(--sp-3);border-left:3px solid var(--primary);color:var(--text-muted);font-size:var(--fs-sec);line-height:var(--lh-body)}
  .feedback.good{border-color:var(--success);color:var(--text)}
  .matrix-area{display:flex;flex:1 1 0;min-width:0;flex-direction:column;gap:var(--sp-3)}
  .model-band{display:flex;align-items:center;justify-content:center;gap:var(--sp-3);min-height:54px;border:1px solid var(--primary-line);background:var(--primary-soft);font-size:var(--fs-sec);line-height:var(--lh-tight)}
  .model-band{color:var(--text);font-size:var(--fs-lead)}
  .k-comparison{flex:1 1 0;grid-template-columns:170px repeat(2,minmax(0,1fr))}
  .k-comparison>*{padding:var(--sp-3)}
  .k-comparison>.hdr{min-height:52px;font-size:var(--fs-h2)}
  .k-comparison>.cell{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);text-align:center;font-size:var(--fs-sec)}
  .k-comparison>.cell::after{width:9px;height:9px;flex:0 0 9px;border:2px solid var(--primary);border-radius:50%;content:""}
  .k-comparison>.cell.connected::after{border-color:var(--accent);background:var(--accent)}
  .round-records{display:flex;gap:var(--sp-2);min-height:62px}
  .record{flex:1 1 0;min-width:0;padding:var(--sp-2) var(--sp-3);border:1px solid var(--line);background:var(--surface-data);color:var(--text-muted);font-size:var(--fs-label);line-height:var(--lh-tight)}
  .record{white-space:pre-line}
  .record.is-done{border-color:var(--success);background:rgb(120 214 165 / 10%)}
  .summary{min-height:72px;padding:var(--sp-3) var(--sp-4);border-left:4px solid var(--primary);background:var(--surface);font-size:var(--fs-sec);line-height:var(--lh-body)}
  .summary strong{display:block;color:var(--text);font-size:var(--fs-lead)}
  .summary.solved{border-color:var(--accent);background:var(--accent-soft)}
  .shake{animation:shake .24s ease-in-out 2}.flash{animation:flash .35s ease-in-out 2}
  @keyframes shake{50%{transform:translateX(7px)}}
  @keyframes flash{50%{border-color:var(--danger)}}
  @media (prefers-reduced-motion:reduce){.shake,.flash{animation:none}}
</style>
</head>
<body data-page="40" data-total="50">

<script src="assets/lib/d3.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 40,
  kicker: "CRATER CLOCK?",
  title: "撞击坑不是简单日历",
  take: "在撞击速率和保存状况相近时，坑更密的表面通常暴露得更久。"
});

(function(){
  var reference = Lec.K.REFERENCE;
  void reference;
  var rounds = [
    {a:{time:"较短",rate:"中等",keep:"完整",raw:7}, b:{time:"较长",keep:"完整",factor:3,target:3}, note:"条件相近时，坑更密支持暴露更久。"},
    {a:{time:"较长",rate:"中等",keep:"完整",raw:14}, b:{time:"较短",keep:"完整",factor:3,target:5}, note:"暴露较短也可能因撞击速率较高而坑数相近。"},
    {a:{time:"较长",rate:"中等",keep:"完整",raw:14}, b:{time:"较长",keep:"部分丢失",factor:2,target:5}, note:"覆盖或抹除会让旧坑退出可见记录。"}
  ];
  var labels=["较低","偏低","中等","偏高","较高"];
  var state={round:0,done:[false,false,false],rate:1};
  var rate=document.getElementById("rate");
  var feedback=document.getElementById("feedback");

  function craterData(count, variant){
    return d3.range(count).map(function(i){
      var x=12+((i*47+variant*23)%176);
      var y=14+((i*71+variant*17)%126);
      var r=4+((i*11+variant*3)%12);
      return {x:x,y:y,r:r};
    });
  }
  function drawField(id,count,variant){
    var svg=d3.select(id+" svg").attr("viewBox","0 0 200 154");
    svg.selectAll("*").remove();
    var g=svg.append("g");
    var craters=g.selectAll("g.crater").data(craterData(count,variant)).join("g").attr("class","crater").attr("transform",function(d){return "translate("+d.x+","+d.y+")";});
    craters.append("circle").attr("r",function(d){return d.r;}).attr("fill","#182832").attr("stroke","#78909a").attr("stroke-width",1.4);
    craters.append("path").attr("d",function(d){return "M"+(-d.r*.65)+","+(-d.r*.48)+" A"+d.r+","+d.r+" 0 0 1 "+(d.r*.62)+","+(d.r*.52);}).attr("fill","none").attr("stroke","#b4c2c8").attr("stroke-width",1);
  }
  function bCount(r,round){
    var value=round.b.factor*r;
    if(round.b.keep==="部分丢失") value=Math.round(value*0.7);
    return value;
  }
  function render(){
    var r=rounds[state.round];
    var bc=bCount(state.rate,r);
    drawField("#fieldA",r.a.raw,1+state.round);
    drawField("#fieldB",bc,7+state.round);
    document.getElementById("countA").textContent=r.a.raw+" 个可见";
    document.getElementById("countB").textContent=bc+" 个可见";
    document.getElementById("rateLabel").textContent=labels[state.rate-1];
    document.getElementById("aCountCell").textContent=r.a.raw+" 个";
    document.getElementById("bCountCell").textContent=bc+" 个";
    document.getElementById("aTime").textContent=r.a.time;
    document.getElementById("bTime").textContent=r.b.time;
    document.getElementById("aRate").textContent=r.a.rate;
    document.getElementById("bRate").textContent=labels[state.rate-1];
    document.getElementById("aKeep").textContent=r.a.keep;
    document.getElementById("bKeep").textContent=r.b.keep;
    document.querySelectorAll(".round").forEach(function(el,i){el.classList.toggle("is-current",i===state.round);el.classList.toggle("is-done",state.done[i]);});
    document.querySelectorAll(".record").forEach(function(el,i){el.classList.toggle("is-done",state.done[i]);});
  }
  function test(){
    var r=rounds[state.round];
    var ok=state.rate===r.b.target;
    if(ok){
      state.done[state.round]=true;
      feedback.className="feedback good";
      feedback.textContent=r.note;
      document.querySelectorAll("#matrix .diff").forEach(function(el){el.classList.add("connected");});
      document.getElementById("fieldB").classList.add("flash");
      setTimeout(function(){
        document.getElementById("fieldB").classList.remove("flash");
        if(state.round<2){state.round++;state.rate=1;rate.value="1";document.querySelectorAll("#matrix .diff").forEach(function(el){el.classList.remove("connected");});feedback.className="feedback";feedback.textContent="下一轮：调整速率，使 B 的可见坑密度与目标吻合。";render();}
        else{var s=document.getElementById("summary");s.classList.add("solved");s.innerHTML="<strong>仅在速率相近、保存相近时，可作相对年龄比较</strong><span>否则，坑数不再是一张可直接读取日期的日历。</span>";rate.disabled=true;}
      },Deck.reduced()?0:450);
    }else{
      feedback.className="feedback";
      feedback.textContent="坑密度还不符：检查速率能否抵消暴露时间或记录丢失。";
      rate.classList.remove("shake");document.getElementById("fieldB").classList.remove("flash");
      void rate.offsetWidth;rate.classList.add("shake");document.getElementById("fieldB").classList.add("flash");
    }
  }
  rate.addEventListener("input",function(){state.rate=Number(rate.value);render();});
  rate.addEventListener("change",test);
  document.getElementById("reset").addEventListener("click",function(){state={round:0,done:[false,false,false],rate:1};rate.value="1";rate.disabled=false;feedback.className="feedback";feedback.textContent="拖动速率，使 B 的可见坑密度与目标吻合。";document.getElementById("summary").className="summary";document.getElementById("summary").innerHTML="<strong>坑数是条件化证据</strong><span>先校准三轮，再判断什么时候能比较相对年龄。</span>";document.querySelectorAll("#matrix .diff").forEach(function(el){el.classList.remove("connected");});render();rate.focus();});
  render();
})();
</script>
</body>
</html>
