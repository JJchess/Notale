<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #main { overflow: hidden; }
  progress.lec-progress {
    appearance: none;
    display: block;
    height: 2px;
    padding: 0;
    border: 0;
    line-height: 0;
    color: transparent;
    background: var(--line);
  }
  progress.lec-progress::-webkit-progress-bar { height: 2px; border: 0; background: var(--line); }
  progress.lec-progress::-webkit-progress-value { height: 2px; border: 0; background: var(--primary); }
  progress.lec-progress::-moz-progress-bar { height: 2px; border: 0; background: var(--primary); }
  .evidence-page {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
    width: var(--content-w);
    height: var(--content-h);
  }
  .evidence-page::before,
  .evidence-page::after {
    position: absolute;
    z-index: -1;
    border: 1px solid var(--primary-line);
    border-radius: 50%;
    content: "";
    opacity: .18;
  }
  .evidence-page::before { top: -180px; left: 140px; width: 860px; height: 360px; transform: rotate(-5deg); }
  .evidence-page::after { top: -138px; left: 250px; width: 620px; height: 250px; transform: rotate(7deg); }
  .history-zone {
    position: relative;
    flex: 0 0 176px;
    min-width: 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .history-head {
    position: absolute;
    z-index: 5;
    top: var(--sp-3);
    right: var(--sp-4);
    left: var(--sp-4);
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
  }
  .history-label { color: var(--text-muted); font-size: var(--fs-label); font-weight: 650; line-height: var(--lh-tight); }
  .counter { color: var(--text); font-family: var(--font-mono); font-size: var(--fs-sec); line-height: var(--lh-tight); }
  .counter strong { color: var(--accent); font-weight: 700; }
  #historyChart { position: absolute; inset: 0; }
  .drop-layer {
    position: absolute;
    z-index: 6;
    inset: 52px 18px 12px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--sp-3);
    pointer-events: none;
  }
  .drop-target {
    min-width: 0;
    min-height: 104px;
    border: 1px dashed transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: transparent;
    pointer-events: auto;
  }
  .drop-target:focus-visible,
  .drop-target.is-key-target { border-color: var(--accent); outline: 2px solid var(--focus); outline-offset: 2px; }
  .drop-target.is-hover { border-color: var(--accent); background: var(--accent-soft); }
  .matrix-shell { flex: 0 0 280px; min-width: 0; }
  .evidence-matrix {
    --compare-cols: 3;
    grid-template-columns: 220px 360px 360px minmax(0, 1fr);
    height: 100%;
  }
  .evidence-matrix > * { padding: var(--sp-2) var(--sp-3); }
  .evidence-matrix > .hdr {
    min-height: 48px;
    align-items: center;
    font-size: var(--fs-sec);
  }
  .evidence-matrix > .dim {
    justify-content: flex-start;
    font-size: var(--fs-sec);
    text-align: left;
  }
  .evidence-matrix > .cell {
    display: flex;
    align-items: center;
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
  }
  .evidence-matrix > .cell.constraint { color: var(--text-muted); }
  .evidence-matrix > .cell.limit {
    color: var(--text-dim);
    opacity: .28;
    transition: opacity 220ms ease, color 220ms ease, background 220ms ease;
  }
  .evidence-matrix > .cell.limit.is-revealed { color: var(--text); opacity: 1; background: var(--primary-soft); }
  .evidence-matrix .row-done { background: var(--primary-soft); color: var(--text); }
  .tray {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
  }
  .tray-head { display: flex; align-items: center; justify-content: space-between; min-height: 28px; }
  .instruction { color: var(--text-muted); font-size: var(--fs-sec); line-height: var(--lh-tight); }
  #status { color: var(--accent); font-size: var(--fs-sec); line-height: var(--lh-tight); text-align: right; }
  .evidence-items {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--sp-3);
    min-height: 64px;
  }
  .evidence-item {
    min-width: 0;
    min-height: 60px;
    padding: var(--sp-2) var(--sp-3);
    border-left: 3px solid var(--primary);
    background: var(--surface-data);
    color: var(--text);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
    touch-action: none;
    user-select: none;
  }
  .evidence-item:hover { border-color: var(--accent); background: var(--primary-soft); }
  .evidence-item.is-selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .evidence-item.is-placed { border-color: var(--success); color: var(--text-muted); opacity: .62; cursor: default; }
  .evidence-item.is-dragging { z-index: 30; border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 12px 28px rgb(0 0 0 / 35%); cursor: grabbing; }
  .evidence-item.is-wrong { border-color: var(--danger); }
  .icon-button {
    position: absolute;
    z-index: 8;
    top: var(--sp-2);
    right: var(--sp-3);
    width: var(--control-h);
    min-width: var(--control-h);
    padding: 0;
    font-size: var(--fs-h2);
  }
  .claim-bar {
    position: absolute;
    z-index: 12;
    right: 62px;
    bottom: 0;
    left: 0;
    display: none;
    min-height: 48px;
    align-items: center;
    padding: var(--sp-2) var(--sp-4);
    border-left: 5px solid var(--accent);
    background: var(--surface-raised);
    color: var(--text);
    font-size: var(--fs-sec);
    font-weight: 650;
    line-height: var(--lh-tight);
  }
  .claim-bar.is-visible { display: flex; }
  @keyframes wrong-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .evidence-item.is-wrong { animation: wrong-shake 180ms ease 2; }
  @media (prefers-reduced-motion: reduce) {
    .evidence-matrix > .cell.limit { transition: none; }
    .evidence-item.is-wrong { animation: none; }
  }
</style>
</head>
<body data-page="43" data-total="50">
<div id="stage">
<main id="main">
  <section class="evidence-page min0" aria-label="太阳系形成证据账本">
    <section class="history-zone min0" aria-label="形成史主干">
      <div class="history-head">
        <span class="history-label">形成史主干 · 把证据接到它真正约束的位置</span>
        <span class="counter">已接通 <strong id="doneCount">0</strong> / 4 条证据</span>
      </div>
      <div id="historyChart" aria-hidden="true"></div>
      <div class="drop-layer" aria-label="四个历史位置">
        <button class="drop-target" data-target="disk" aria-label="共同盘背景"></button>
        <button class="drop-target" data-target="materials" aria-label="材料分区"></button>
        <button class="drop-target" data-target="anchor" aria-label="形成时间锚点"></button>
        <button class="drop-target" data-target="late" aria-label="晚期持续改造"></button>
      </div>
    </section>

    <section class="matrix-shell min0" aria-label="四类证据比较矩阵">
      <div id="matrix" class="k-comparison evidence-matrix">
        <div class="hdr">证据</div><div class="hdr">今天看见什么</div><div class="hdr">它约束哪段历史</div><div class="hdr">它不能单独证明什么</div>
      </div>
    </section>

    <section class="tray min0" aria-label="待归位证据">
      <div class="tray-head">
        <p class="instruction">拖动证据到主干；键盘可先选证据，再选历史位置。</p>
        <p id="status" role="status" aria-live="polite">四条证据都来自前面的学习场景。</p>
      </div>
      <div id="evidenceItems" class="evidence-items min0"></div>
    </section>

    <button id="resetBtn" class="icon-button" type="button" title="重置证据账本" aria-label="重置证据账本">↻</button>
    <div id="claim" class="claim-bar">可靠的形成史，是多类证据能够同时容纳的解释。</div>
  </section>
</main>
</div>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 43,
  kicker: "EVIDENCE CHAIN",
  title: "四类证据，一段历史",
  take: "盘面、材料梯度、陨石年龄和撞击记录彼此约束同一段历史。"
});

(function normalizeProgress() {
  var nativeProgress = document.querySelector("progress.lec-progress");
  if (!nativeProgress) return;
  var progress = document.createElement("div");
  progress.className = nativeProgress.className;
  progress.setAttribute("role", "progressbar");
  progress.setAttribute("aria-label", nativeProgress.getAttribute("aria-label") || "课程进度");
  progress.setAttribute("aria-valuemin", "0");
  progress.setAttribute("aria-valuemax", "50");
  progress.setAttribute("aria-valuenow", "43");
  progress.style.setProperty("--progress", Lec.P.percent(43, 50) + "%");
  nativeProgress.replaceWith(progress);
}());

(function () {
  "use strict";

  var planets = Lec.K.PLANETS;
  var timeData = Lec.K.TIME;
  var reference = Lec.K.REFERENCE;
  var systemAge = timeData.SOLAR_SYSTEM_AGE_YEARS;
  var ageProbe = Lec.P.ageFraction(systemAge, systemAge);
  var compressedProbe = Lec.P.compressTimeline(systemAge, systemAge, 1);
  void planets; void reference; void ageProbe; void compressedProbe;

  var evidence = [
    { id: "orbits", target: "disk", name: "盘面", seen: "行星轨道接近同一盘面", constraint: "共同原行星盘背景", limit: "具体形成次序" },
    { id: "gradient", target: "materials", name: "材料梯度", seen: "盘内材料呈凝结梯度", constraint: "不同距离的材料分区", limit: "今日轨道就是出生位置" },
    { id: "meteorite", target: "anchor", name: "陨石年龄", seen: "原始陨石给出早期年龄", constraint: "早期形成的时间锚点", limit: "每颗行星完成形成的时刻" },
    { id: "craters", target: "late", name: "撞击记录", seen: "坑数量与保存状态不同", constraint: "持续撞击与改造的先后", limit: "未标定表面的绝对年龄" }
  ];
  var targets = [
    { id: "disk", label: "共同盘背景", sub: "共同起点" },
    { id: "materials", label: "材料分区", sub: "位置约束" },
    { id: "anchor", label: "形成时间锚点", sub: "早期时间" },
    { id: "late", label: "晚期持续改造", sub: "后续记录" }
  ];
  var initialOrder = ["meteorite", "orbits", "craters", "gradient"];
  var state = freshState();
  var selectedId = null;
  var keyTargetIndex = 0;
  var chart = echarts.init(document.getElementById("historyChart"), null, { renderer: "svg" });
  var reduceMotion = Deck.reduced();

  function freshState() { return { placed: {}, trace: [], complete: false }; }

  function buildMatrix() {
    var matrix = d3.select("#matrix");
    evidence.forEach(function (d) {
      matrix.append("div").attr("class", "dim").attr("data-row", d.id).text(d.name);
      matrix.append("div").attr("class", "cell").attr("data-row", d.id).text(d.seen);
      matrix.append("div").attr("class", "cell constraint").attr("data-row", d.id).text(d.constraint);
      matrix.append("div").attr("class", "cell limit").attr("data-row", d.id).text(d.limit);
    });
  }

  function buildItems() {
    var byId = new Map(evidence.map(function (d) { return [d.id, d]; }));
    d3.select("#evidenceItems").selectAll("button")
      .data(initialOrder.map(function (id) { return byId.get(id); }), function (d) { return d.id; })
      .join("button")
      .attr("type", "button")
      .attr("class", "evidence-item no-pan")
      .attr("data-id", function (d) { return d.id; })
      .attr("aria-pressed", "false")
      .attr("aria-label", function (d) { return d.name + "：" + d.seen; })
      .text(function (d) { return d.seen; })
      .on("click", function (event, d) {
        if (state.placed[d.id]) return;
        selectEvidence(d.id, true);
      })
      .on("keydown", function (event, d) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          if (!state.placed[d.id]) selectEvidence(d.id, true);
        }
      })
      .call(d3.drag()
        .filter(function (event, d) { return !state.placed[d.id] && event.button !== 2; })
        .on("start", dragStarted)
        .on("drag", dragged)
        .on("end", dragEnded));
  }

  function chartOption(pulseTarget) {
    var done = Object.keys(state.placed).length;
    var axisStart = 150 + compressedProbe;
    var axisSpan = 1050 * ageProbe;
    var nodes = targets.map(function (t, i) {
      var filled = Object.values(state.placed).indexOf(t.id) >= 0;
      return {
        id: t.id,
        name: t.label,
        x: axisStart + i * axisSpan / (targets.length - 1),
        y: 95,
        symbolSize: filled ? 27 : 20,
        itemStyle: {
          color: filled ? "#4fc3d7" : "#101b24",
          borderColor: pulseTarget === t.id ? "#ffd166" : "#4fc3d7",
          borderWidth: pulseTarget === t.id ? 4 : 2
        },
        label: { show: true, position: "bottom", distance: 10, formatter: "{name|" + t.label + "}\n{sub|" + t.sub + "}", rich: {
          name: { color: "#eaf2f5", fontSize: 16, fontWeight: 650, lineHeight: 23 },
          sub: { color: "#a9bac3", fontSize: 14, lineHeight: 20 }
        }}
      };
    });
    nodes.push(
      { id: "bound-top", x: 150, y: 20, symbolSize: 1, itemStyle: { opacity: 0 }, label: { show: false } },
      { id: "bound-bottom", x: 1200, y: 150, symbolSize: 1, itemStyle: { opacity: 0 }, label: { show: false } }
    );
    var links = [];
    for (var i = 0; i < targets.length - 1; i++) links.push({ source: targets[i].id, target: targets[i + 1].id });
    Object.keys(state.placed).forEach(function (evidenceId) {
      links.push({ source: evidenceId, target: state.placed[evidenceId], lineStyle: { color: "#4fc3d7", width: state.complete ? 4 : 2, opacity: 1, curveness: .16 } });
      var d = evidence.find(function (item) { return item.id === evidenceId; });
      nodes.push({ id: d.id, name: d.name, x: axisStart + targets.findIndex(function (t) { return t.id === d.target; }) * axisSpan / (targets.length - 1), y: 26, symbol: "roundRect", symbolSize: [116, 30], itemStyle: { color: "#16232d", borderColor: "#4fc3d7", borderWidth: 1 }, label: { show: true, color: "#eaf2f5", fontSize: 14, formatter: d.name } });
    });
    return {
      animation: !reduceMotion,
      animationDurationUpdate: 320,
      textStyle: { fontFamily: "Inter, Noto Sans SC, Microsoft YaHei, sans-serif", fontSize: 16, color: "#eaf2f5" },
      tooltip: { show: false, textStyle: { fontSize: 16 } },
      series: [{
        type: "graph",
        layout: "none",
        roam: false,
        left: 68,
        right: 68,
        top: 43,
        bottom: 18,
        data: nodes,
        links: links,
        lineStyle: { color: "#4fc3d7", width: 3, opacity: done ? .72 : .42 },
        edgeSymbol: ["none", "arrow"],
        edgeSymbolSize: [0, 8],
        emphasis: { disabled: true },
        silent: true
      }]
    };
  }

  function render(pulseTarget) {
    var done = Object.keys(state.placed).length;
    state.complete = done === evidence.length;
    document.getElementById("doneCount").textContent = done;
    chart.setOption(chartOption(pulseTarget), true);

    d3.selectAll(".evidence-item")
      .classed("is-selected", function (d) { return selectedId === d.id; })
      .classed("is-placed", function (d) { return Boolean(state.placed[d.id]); })
      .attr("aria-pressed", function (d) { return selectedId === d.id ? "true" : "false"; })
      .attr("aria-disabled", function (d) { return state.placed[d.id] ? "true" : "false"; });

    evidence.forEach(function (d) {
      var placed = Boolean(state.placed[d.id]);
      d3.selectAll('[data-row="' + d.id + '"]').classed("row-done", placed);
    });
    d3.selectAll(".cell.limit").classed("is-revealed", state.complete);
    document.getElementById("claim").classList.toggle("is-visible", state.complete);
    if (state.complete) document.getElementById("status").textContent = "四条证据已共同接入形成史。";
  }

  function selectEvidence(id, moveFocus) {
    selectedId = id;
    keyTargetIndex = 0;
    document.getElementById("status").textContent = "已选证据。请选择它约束的历史位置。";
    d3.selectAll(".drop-target").classed("is-key-target", function (d, i) { return i === keyTargetIndex; });
    render();
    if (moveFocus) document.querySelectorAll(".drop-target")[0].focus();
  }

  function attempt(id, targetId) {
    var item = evidence.find(function (d) { return d.id === id; });
    if (!item || state.placed[id]) return;
    if (item.target !== targetId) {
      var node = document.querySelector('[data-id="' + id + '"]');
      node.classList.add("is-wrong");
      setTimeout(function () { node.classList.remove("is-wrong"); }, reduceMotion ? 0 : 400);
      document.getElementById("status").textContent = "这条证据约束的是「" + targets.find(function (t) { return t.id === item.target; }).label + "」，不是「" + targets.find(function (t) { return t.id === targetId; }).label + "」。";
      selectedId = null;
      d3.selectAll(".drop-target").classed("is-key-target", false);
      render();
      node.focus();
      return;
    }
    state.placed[id] = targetId;
    state.trace.push({ evidence: id, target: targetId });
    selectedId = null;
    d3.selectAll(".drop-target").classed("is-key-target", false);
    document.getElementById("status").textContent = "已接通「" + item.name + " → " + targets.find(function (t) { return t.id === targetId; }).label + "」。";
    render(targetId);
  }

  function dragStarted(event, d) {
    selectEvidence(d.id, false);
    d.dragX = 0;
    d.dragY = 0;
    d3.select(this).classed("is-dragging", true).style("transform", "translate(0px, 0px)");
  }
  function dragged(event, d) {
    d.dragX += event.dx;
    d.dragY += event.dy;
    d3.select(this).style("transform", "translate(" + d.dragX + "px," + d.dragY + "px)");
    var hit = targetAt(event.sourceEvent.clientX, event.sourceEvent.clientY);
    d3.selectAll(".drop-target").classed("is-hover", function () { return this === hit; });
  }
  function dragEnded(event, d) {
    var hit = targetAt(event.sourceEvent.clientX, event.sourceEvent.clientY);
    d3.select(this).classed("is-dragging", false).style("transform", null);
    d3.selectAll(".drop-target").classed("is-hover", false);
    if (hit) attempt(d.id, hit.dataset.target);
    else {
      selectedId = null;
      d3.selectAll(".drop-target").classed("is-key-target", false);
      document.getElementById("status").textContent = "证据已回到样本匣。";
      render();
    }
  }
  function targetAt(clientX, clientY) {
    return Array.from(document.querySelectorAll(".drop-target")).find(function (el) {
      var r = el.getBoundingClientRect();
      return clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom;
    }) || null;
  }

  document.querySelectorAll(".drop-target").forEach(function (target, index) {
    target.addEventListener("click", function () { if (selectedId) attempt(selectedId, target.dataset.target); });
    target.addEventListener("keydown", function (event) {
      if (!selectedId) return;
      if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
        event.preventDefault();
        keyTargetIndex = (index + (event.key === "ArrowRight" ? 1 : 3)) % 4;
        var nodes = document.querySelectorAll(".drop-target");
        d3.selectAll(".drop-target").classed("is-key-target", function (d, i) { return i === keyTargetIndex; });
        nodes[keyTargetIndex].focus();
      } else if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        attempt(selectedId, target.dataset.target);
      } else if (event.key === "Escape") {
        selectedId = null;
        d3.selectAll(".drop-target").classed("is-key-target", false);
        render();
      }
    });
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    state = freshState();
    selectedId = null;
    keyTargetIndex = 0;
    document.getElementById("status").textContent = "证据账本已重置。";
    render();
  });

  buildMatrix();
  buildItems();
  render();
  Deck.onResize(function () { chart.resize(); });
})();
</script>
</body>
</html>
