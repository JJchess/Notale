<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lec-progress::before { display: none; }

  .mission-view {
    position: relative;
    width: var(--content-w);
    height: var(--content-h);
    overflow: hidden;
    background: var(--surface-data);
  }

  .mission-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    opacity: 0;
    filter: brightness(.68) saturate(.84) contrast(1.08);
    animation: image-reveal 1.15s ease-out .08s forwards;
  }

  .mission-shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgb(7 16 24 / 96%) 0%, rgb(7 16 24 / 84%) 34%, rgb(7 16 24 / 32%) 66%, rgb(7 16 24 / 8%) 100%);
  }

  .scanlines {
    position: absolute;
    inset: 0;
    opacity: .17;
    background: repeating-linear-gradient(0deg, transparent 0 27px, var(--primary-line) 28px 29px);
    mask-image: linear-gradient(90deg, black, transparent 76%);
  }

  .view-label {
    position: absolute;
    top: var(--sp-4);
    left: var(--sp-5);
    z-index: 5;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }

  .view-status {
    position: absolute;
    right: var(--sp-5);
    bottom: var(--sp-4);
    z-index: 5;
    display: flex;
    gap: var(--sp-5);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }

  .view-status strong { color: var(--primary); font-weight: 650; }

  .target-lock {
    position: absolute;
    z-index: 2;
    top: 68px;
    right: 44px;
    width: 510px;
    height: 470px;
    opacity: 0;
    animation: lock-in .85s cubic-bezier(.2,.8,.2,1) .7s forwards;
  }

  .target-lock::before,
  .target-lock::after {
    position: absolute;
    background: var(--primary-line);
    content: "";
  }

  .target-lock::before { top: 50%; right: -18px; left: -18px; height: 1px; }
  .target-lock::after { top: -18px; bottom: -18px; left: 50%; width: 1px; }

  .orbit-ring {
    position: absolute;
    z-index: 1;
    right: 28px;
    bottom: 28px;
    width: 650px;
    height: 250px;
    border: 2px solid var(--primary-line);
    border-radius: 50%;
    transform: rotate(-5deg);
  }

  .orbit-ring::after {
    position: absolute;
    inset: 24px 62px;
    border: 1px solid var(--primary-line);
    border-radius: 50%;
    content: "";
  }

  .application-map {
    --support-cols: 3;
    position: absolute;
    z-index: 4;
    top: 76px;
    left: 48px;
    width: 1010px;
    min-height: 468px;
    opacity: 0;
    animation: map-reveal .5s ease-out 1.3s forwards;
  }

  .application-map.k-generalization > .claim {
    width: 438px;
    margin-left: 0;
    margin-right: auto;
    padding: var(--sp-5) var(--sp-6);
    border-left-color: var(--accent);
    background: rgb(16 27 36 / 94%);
    box-shadow: 0 16px 40px rgb(7 16 24 / 46%);
  }

  .claim-kicker {
    display: block;
    margin-bottom: var(--sp-2);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: var(--lh-tight);
  }

  .claim-title {
    display: block;
    color: var(--text);
    font-size: 28px;
    line-height: var(--lh-tight);
  }

  .application-map.k-generalization > .trunk {
    left: 219px;
    background: var(--primary);
    transform-origin: top;
    animation: trunk-live .65s ease-out 1.65s both;
  }

  .application-map.k-generalization > .supports {
    gap: var(--sp-4);
    padding-top: var(--sp-6);
  }

  .application-map.k-generalization > .supports::before {
    background: var(--primary);
    transform-origin: left;
    animation: line-live .85s ease-out 1.95s both;
  }

  .application-map.k-generalization .support {
    min-height: 232px;
    padding: var(--sp-5);
    border-top-color: var(--primary);
    background: rgb(22 35 45 / 92%);
    color: var(--text-muted);
    opacity: 0;
    transform: translateY(10px);
    animation: support-live .48s ease-out forwards;
  }

  .application-map.k-generalization .support:nth-child(1) { animation-delay: 2.2s; }
  .application-map.k-generalization .support:nth-child(2) { animation-delay: 2.52s; }
  .application-map.k-generalization .support:nth-child(3) { animation-delay: 2.84s; }
  .application-map.k-generalization .support::before { background: var(--primary); }

  .route-mark {
    display: block;
    margin-bottom: var(--sp-3);
    color: var(--primary);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: var(--lh-tight);
  }

  .support:first-child .route-mark { color: var(--accent); }
  .support:first-child { border-top-color: var(--accent); }

  .support h2 {
    margin: 0 0 var(--sp-3);
    font-size: var(--fs-h2);
  }

  .support p {
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
  }

  .application-turn {
    position: absolute;
    z-index: 5;
    left: 72px;
    bottom: 24px;
    width: 940px;
    color: var(--text);
    font-size: var(--fs-lead);
    font-weight: 650;
    line-height: var(--lh-body);
    opacity: 0;
    animation: statement-in .7s ease-out 3.25s forwards;
  }

  @keyframes image-reveal { from { opacity: 0; } to { opacity: 1; } }
  @keyframes lock-in { from { opacity: 0; transform: scale(1.16); } to { opacity: .76; transform: scale(1); } }
  @keyframes map-reveal { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes trunk-live { from { transform: translateX(-50%) scaleY(0); } to { transform: translateX(-50%) scaleY(1); } }
  @keyframes line-live { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes support-live { to { opacity: 1; transform: translateY(0); } }
  @keyframes statement-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .mission-image,
    .target-lock,
    .application-map,
    .application-map.k-generalization > .trunk,
    .application-map.k-generalization > .supports::before,
    .application-map.k-generalization .support,
    .application-turn {
      animation: none;
      opacity: 1;
      transform: none;
    }
    .application-map.k-generalization > .trunk { transform: translateX(-50%); }
  }
</style>
</head>
