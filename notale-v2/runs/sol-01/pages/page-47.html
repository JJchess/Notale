<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage { --classifier-w: 500px; }
  .page47 { width: var(--content-w); height: var(--content-h); }
  .intro { min-height: 54px; }
  .intro p { max-width: 920px; }
  .progress-block { min-width: 196px; text-align: right; }
  .round-dots { display: flex; justify-content: flex-end; gap: var(--sp-2); margin-top: var(--sp-2); }
  .round-dot { width: 34px; height: 4px; background: var(--line-strong); }
  .round-dot.is-done, .round-dot.is-current { background: var(--accent); }
  .workspace { height: 550px; }
  progress.lec-progress { appearance: none; display: block; padding: 0; border: 0; line-height: 0; }
  progress.lec-progress::-webkit-progress-bar,
  progress.lec-progress::-webkit-progress-value { height: 2px; border: 0; }
  .plot-region { position: relative; min-width: 0; overflow: hidden; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface-data); }
  .plot-head { position: absolute; z-index: 3; top: var(--sp-3); right: var(--sp-4); left: var(--sp-4); pointer-events: none; }
  .system-id { color: var(--accent); font-family: var(--font-mono); font-size: var(--fs-lead); font-weight: 650; line-height: var(--lh-tight); }
  .plot-hint { color: var(--text-muted); font-size: var(--fs-label); line-height: var(--lh-tight); }
  #chart { display: block; width: 100%; height: 100%; }
  #chart text { font-family: var(--font-sans); }
  #chart .tick text { fill: var(--text-muted); font-family: var(--font-mono); font-size: var(--fs-tick); }
  #chart .domain, #chart .tick line { stroke: var(--line-strong); }
  #chart .grid line { stroke: var(--line); }
  #chart .axis-title { fill: var(--text-muted); font-size: var(--fs-label); font-weight: 600; }
  #chart .anon-label { fill: var(--text); font-family: var(--font-mono); font-size: var(--fs-label); font-weight: 650; }
  #chart .mini-title { fill: var(--text); font-size: var(--fs-sec); font-weight: 650; }
  #chart .mini-sub { fill: var(--text-muted); font-size: var(--fs-label); }
  .legend { position: absolute; z-index: 3; top: 48px; right: var(--sp-4); left: 250px; display: flex; align-items: center; justify-content: flex-end; gap: var(--sp-5); color: var(--text-muted); font-size: var(--fs-label); line-height: var(--lh-tight); pointer-events: none; }
  .legend-item { display: inline-flex; align-items: center; gap: var(--sp-2); }
  .mass-key { display: inline-flex; align-items: end; gap: var(--sp-1); height: 22px; }
  .mass-key i { display: block; border: 1px solid var(--text-muted); border-radius: 50%; }
  .mass-key i:first-child { width: 10px; height: 10px; }
  .mass-key i:last-child { width: 20px; height: 20px; }
  .temp-key { width: 74px; height: 8px; background: linear-gradient(90deg, var(--primary), var(--accent), var(--danger)); }
  .classifier { width: var(--classifier-w); }
  .classifier > .box { box-sizing: border-box; height: 100%; padding: var(--sp-3); }
  .classifier .root-title { margin-bottom: var(--sp-2); }
  .classifier .lv { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-2); margin-left: var(--sp-3); padding-left: var(--sp-4); }
  .class-branch { padding: var(--sp-2) var(--sp-3) !important; transition: opacity 120ms ease, transform 120ms ease; }
  .class-branch .bt { margin: 0 !important; }
  .class-choice { width: 100%; justify-content: flex-start; border: 0; background: transparent; color: var(--text); font-size: var(--fs-sec); font-weight: 650; }
  .class-choice:hover { background: var(--primary-soft); }
  .class-choice.is-attached { color: var(--accent); }
  .criteria { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-1) var(--sp-3); margin-top: var(--sp-1); padding-left: var(--sp-2); border-left: 2px solid var(--primary-line); }
  .criterion { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: var(--sp-1); min-width: 0; }
  .criterion span { min-width: 0; padding: 2px 0; color: var(--text-muted); font-size: var(--fs-label); line-height: var(--lh-tight); }
  .criterion .criterion-name { color: var(--primary); font-weight: 650; }
  .criterion:hover span, .criterion:focus span { color: var(--accent); }
  .criterion[tabindex] { outline: none; }
  .classifier-feedback { min-height: 54px; padding: var(--sp-2) var(--sp-3); border-left: 3px solid var(--primary); background: var(--surface-data); color: var(--text-muted); font-size: var(--fs-sec); line-height: var(--lh-tight); }
  .classifier-feedback.is-error { border-left-color: var(--danger); color: var(--text); }
  .classifier-feedback.is-ok { border-left-color: var(--success); color: var(--text); }
  .reset-wrap { min-height: 0; }
  #reset { width: 100%; }
  #reset[hidden] { display: none; }
  .shake { animation: shake 220ms linear; opacity: .58; }
  @keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  @media (prefers-reduced-motion: reduce) { .class-branch { transition: none; } .shake { animation: none; } }
</style>
</head>
<body data-page="47" data-total="50">
<div id="stage">
<main id="main">
  <section class="page47 col gap-4" aria-labelledby="lesson-prompt">
    <div class="intro row items-start justify-between gap-5">
      <p id="lesson-prompt" class="lead">未知系统不必先认出每颗行星：轨道、质量、半径和温度的组合，已经能显出它的结构。</p>
      <div class="progress-block shrink0" aria-live="polite">
        <div class="label">识别进度</div>
        <div id="score" class="system-id">已识别 0/3</div>
        <div class="round-dots" aria-hidden="true"><i class="round-dot is-current"></i><i class="round-dot"></i><i class="round-dot"></i></div>
      </div>
    </div>

    <div class="workspace row gap-5 min0">
      <section class="plot-region grow min0" aria-labelledby="system-label">
        <div class="plot-head row justify-between items-start gap-4">
          <div><div id="system-label" class="system-id">匿名系统 01</div><div id="plot-state" class="plot-hint">先读整体分布，再综合四项指标</div></div>
          <div class="plot-hint mono">遥测目标 / 去名化</div>
        </div>
        <svg id="chart" role="img" aria-label="匿名行星系统散点图，横轴是轨道半长轴，纵轴是相对地球半径，点面积表示相对地球质量，颜色表示估算平衡温度"></svg>
        <div class="legend" aria-label="图例">
          <span class="legend-item"><span class="mass-key" aria-hidden="true"><i></i><i></i></span>点面积＝质量</span>
          <span class="legend-item"><span class="temp-key" aria-hidden="true"></span>冷 → 热</span>
          <span>半径与质量均相对地球</span>
        </div>
      </section>

      <aside class="classifier k-classification shrink0 min0" aria-label="系统结构分类树">
        <div class="box">
          <h2 class="bt root-title">陌生行星系</h2>
          <div class="lv" id="branches">
            <div class="box class-branch" data-kind="ordered">
              <h3 class="bt"><button class="class-choice" type="button" data-choice="ordered">内小外大型</button></h3>
              <div class="criteria">
                <div class="criterion" tabindex="0" data-channel="orbit"><span class="criterion-name">轨道</span><span>内外分区明显</span></div>
                <div class="criterion" tabindex="0" data-channel="mass"><span class="criterion-name">质量</span><span>外侧更高</span></div>
                <div class="criterion" tabindex="0" data-channel="radius"><span class="criterion-name">半径</span><span>外侧更大</span></div>
                <div class="criterion" tabindex="0" data-channel="temp"><span class="criterion-name">温度</span><span>由内向外降低</span></div>
              </div>
            </div>
            <div class="box class-branch" data-kind="compact">
              <h3 class="bt"><button class="class-choice" type="button" data-choice="compact">紧凑小行星型</button></h3>
              <div class="criteria">
                <div class="criterion" tabindex="0" data-channel="orbit"><span class="criterion-name">轨道</span><span>集中在近轨道</span></div>
                <div class="criterion" tabindex="0" data-channel="mass"><span class="criterion-name">质量</span><span>整体较低</span></div>
                <div class="criterion" tabindex="0" data-channel="radius"><span class="criterion-name">半径</span><span>整体较小</span></div>
                <div class="criterion" tabindex="0" data-channel="temp"><span class="criterion-name">温度</span><span>整体偏高</span></div>
              </div>
            </div>
            <div class="box class-branch" data-kind="hot">
              <h3 class="bt"><button class="class-choice" type="button" data-choice="hot">热巨行星型</button></h3>
              <div class="criteria">
                <div class="criterion" tabindex="0" data-channel="orbit"><span class="criterion-name">轨道</span><span>巨行星在最内侧</span></div>
                <div class="criterion" tabindex="0" data-channel="mass"><span class="criterion-name">质量</span><span>内侧成员很高</span></div>
                <div class="criterion" tabindex="0" data-channel="radius"><span class="criterion-name">半径</span><span>内侧成员很大</span></div>
                <div class="criterion" tabindex="0" data-channel="temp"><span class="criterion-name">温度</span><span>内侧巨行星高温</span></div>
              </div>
            </div>
          </div>
          <div id="feedback" class="classifier-feedback" aria-live="polite">单个指标只给线索，多个指标互相印证才支持分类。</div>
          <div class="reset-wrap"><button id="reset" type="button" hidden aria-label="重置分类">↻ 重置三轮</button></div>
        </div>
      </aside>
    </div>
  </section>
</main>
</div>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 47,
  kicker: "TRANSFER / SYSTEM CLASSIFIER",
  title: "不见名字，也能看出系统骨架",
  take: "轨道、质量、半径和温度的组合，已经能显出未知行星系统的结构。"
});

(function normalizeProgressTrack() {
  var nativeTrack = document.querySelector("progress.lec-progress");
  if (!nativeTrack) return;
  var track = document.createElement("div");
  Array.prototype.slice.call(nativeTrack.attributes).forEach(function (attr) {
    if (attr.name !== "value" && attr.name !== "max") track.setAttribute(attr.name, attr.value);
  });
  track.setAttribute("role", "progressbar");
  track.setAttribute("aria-valuemin", "0");
  track.setAttribute("aria-valuemax", nativeTrack.max || "50");
  track.setAttribute("aria-valuenow", nativeTrack.value || "47");
  nativeTrack.replaceWith(track);
}());

(function () {
  var planets = Lec.K.PLANETS;
  var earth = Lec.K.EARTH;
  var earthPlanet = planets.filter(function (p) { return p.id === "earth"; })[0];
  var rocky = planets.filter(function (p) { return p.type === "terrestrial"; });
  var giants = planets.filter(function (p) { return p.type !== "terrestrial"; });
  var commonAlbedo = earthPlanet.albedo;
  var redistribution = 4;

  function point(body, orbit, index) {
    var massKg = Lec.P.planetMassKg(body);
    var diameterKm = Lec.P.planetDiameterKm(body);
    return {
      key: "T-" + String(index + 1).padStart(2, "0"),
      orbit: orbit,
      mass: Lec.P.ratio(massKg, earth.MASS_KG),
      radius: Lec.P.ratio(diameterKm, earth.DIAMETER_KM),
      temp: Lec.P.equilibriumTemperature(orbit, commonAlbedo, redistribution)
    };
  }

  var orderedData = planets.map(function (p, i) { return point(p, p.semimajorAU, i); });
  var compactData = rocky.map(function (p, i) { return point(p, p.semimajorAU, i); });
  var innerOrbits = rocky.map(function (p) { return p.semimajorAU; });
  var hotData = giants.map(function (p, i) { return point(p, innerOrbits[i], i); });
  var systems = [
    { kind: "compact", title: "紧凑小行星型", data: compactData },
    { kind: "hot", title: "热巨行星型", data: hotData },
    { kind: "ordered", title: "内小外大型", data: orderedData }
  ];

  var state = { round: 0, solved: [], complete: false, channel: null };
  var svg = d3.select("#chart");
  var score = document.getElementById("score");
  var systemLabel = document.getElementById("system-label");
  var plotState = document.getElementById("plot-state");
  var feedback = document.getElementById("feedback");
  var reset = document.getElementById("reset");
  var dots = Array.prototype.slice.call(document.querySelectorAll(".round-dot"));
  var choices = Array.prototype.slice.call(document.querySelectorAll(".class-choice"));
  var branches = Array.prototype.slice.call(document.querySelectorAll(".class-branch"));
  var criteria = Array.prototype.slice.call(document.querySelectorAll(".criterion"));
  var style = getComputedStyle(document.documentElement);
  var colors = {
    bg: style.getPropertyValue("--surface-data").trim(),
    line: style.getPropertyValue("--line").trim(),
    lineStrong: style.getPropertyValue("--line-strong").trim(),
    primary: style.getPropertyValue("--primary").trim(),
    accent: style.getPropertyValue("--accent").trim(),
    danger: style.getPropertyValue("--danger").trim(),
    text: style.getPropertyValue("--text").trim(),
    muted: style.getPropertyValue("--text-muted").trim()
  };
  var all = orderedData.concat(hotData);
  var tempExtent = d3.extent(all, function (d) { return d.temp; });
  var massExtent = d3.extent(all, function (d) { return d.mass; });
  var x = d3.scaleLog().domain(d3.extent(orderedData, function (d) { return d.orbit; })).nice();
  var y = d3.scaleLinear().domain([0, d3.max(all, function (d) { return d.radius; }) * 1.12]).nice();
  var radius = d3.scaleSqrt().domain(massExtent).range([7, 25]);
  var heat = d3.scaleLinear().domain([tempExtent[0], (tempExtent[0] + tempExtent[1]) / 2, tempExtent[1]])
    .range([colors.primary, colors.accent, colors.danger]).interpolate(d3.interpolateRgb);

  function activeData() { return systems[state.round].data; }

  function renderMain() {
    var node = document.getElementById("chart");
    var w = node.clientWidth || 940;
    var h = node.clientHeight || 550;
    var margin = { top: 74, right: 32, bottom: 74, left: 72 };
    var iw = w - margin.left - margin.right;
    var ih = h - margin.top - margin.bottom;
    x.range([0, iw]);
    y.range([ih, 0]);
    svg.attr("viewBox", "0 0 " + w + " " + h).selectAll("*").remove();
    svg.append("title").text("匿名系统 " + String(state.round + 1).padStart(2, "0"));
    svg.append("desc").text("比较轨道、相对质量、相对半径和估算平衡温度，选择系统结构类别。");
    var g = svg.append("g").attr("transform", "translate(" + margin.left + "," + margin.top + ")");

    g.append("g").attr("class", "grid")
      .call(d3.axisLeft(y).ticks(5).tickSize(-iw).tickFormat(""))
      .call(function (s) { s.select(".domain").remove(); });
    var xAxis = d3.axisBottom(x).tickValues([0.4, 1, 5, 10, 30]).tickFormat(function (d) { return d; });
    var yAxis = d3.axisLeft(y).ticks(5).tickFormat(function (d) { return Lec.P.significant(d, 2); });
    g.append("g").attr("class", "tick").attr("transform", "translate(0," + ih + ")").call(xAxis);
    g.append("g").attr("class", "tick").call(yAxis);
    g.append("text").attr("class", "axis-title").attr("x", iw / 2).attr("y", ih + 48).attr("text-anchor", "middle").text("轨道半长轴（AU，对数尺度）");
    g.append("text").attr("class", "axis-title").attr("transform", "rotate(-90)").attr("x", -ih / 2).attr("y", -52).attr("text-anchor", "middle").text("半径（地球＝1）");
    g.append("circle").attr("cx", -34).attr("cy", ih).attr("r", 8).attr("fill", colors.accent);

    var data = activeData();
    var points = g.append("g").selectAll("g.point").data(data).join("g")
      .attr("class", "point")
      .attr("transform", function (d) { return "translate(" + x(d.orbit) + "," + y(d.radius) + ")"; })
      .attr("opacity", function (d) { return pointOpacity(d); });
    points.append("circle")
      .attr("r", Deck.reduced() ? function (d) { return radius(d.mass); } : 0)
      .attr("fill", function (d) { return heat(d.temp); })
      .attr("fill-opacity", 0.78)
      .attr("stroke", state.solved[state.round] ? colors.accent : colors.bg)
      .attr("stroke-width", state.solved[state.round] ? 4 : 2);
    points.append("text").attr("class", "anon-label").attr("x", 10).attr("y", -10).text(function (d) { return d.key; });
    if (!Deck.reduced()) {
      points.select("circle").transition().delay(function (d) { return x(d.orbit) * 0.35; }).duration(420).attr("r", function (d) { return radius(d.mass); });
    }
  }

  function pointOpacity(d) {
    if (!state.channel) return 1;
    if (state.channel === "orbit") return 1;
    if (state.channel === "mass") return 0.35 + 0.65 * radius(d.mass) / 25;
    if (state.channel === "radius") return 0.38 + 0.62 * d.radius / y.domain()[1];
    return 0.4 + 0.6 * (d.temp - tempExtent[0]) / (tempExtent[1] - tempExtent[0]);
  }

  function renderMiniatures() {
    var node = document.getElementById("chart");
    var w = node.clientWidth || 940;
    var h = node.clientHeight || 550;
    svg.attr("viewBox", "0 0 " + w + " " + h).selectAll("*").remove();
    svg.append("title").text("三类系统结构对照");
    svg.append("desc").text("三幅使用相同尺度的微型散点图，对齐比较三类结构。");
    var top = 88, bottom = 82, gap = 20, side = 28;
    var pw = (w - side * 2 - gap * 2) / 3;
    var ph = h - top - bottom;
    x.range([12, pw - 12]);
    y.range([ph - 28, 14]);
    systems.forEach(function (sys, i) {
      var g = svg.append("g").attr("transform", "translate(" + (side + i * (pw + gap)) + "," + top + ")");
      g.append("rect").attr("width", pw).attr("height", ph).attr("fill", "none").attr("stroke", colors.lineStrong);
      g.append("text").attr("class", "mini-title").attr("x", pw / 2).attr("y", -24).attr("text-anchor", "middle").text(sys.title);
      g.append("text").attr("class", "mini-sub").attr("x", pw / 2).attr("y", ph + 25).attr("text-anchor", "middle").text("轨道位置 →");
      g.selectAll("circle").data(sys.data).join("circle")
        .attr("cx", function (d) { return x(d.orbit); }).attr("cy", function (d) { return y(d.radius); })
        .attr("r", function (d) { return Math.max(5, radius(d.mass) * 0.62); })
        .attr("fill", function (d) { return heat(d.temp); }).attr("fill-opacity", 0.82)
        .attr("stroke", colors.accent).attr("stroke-width", 2);
    });
  }

  function updateUI() {
    score.textContent = "已识别 " + state.solved.length + "/3";
    dots.forEach(function (dot, i) {
      dot.className = "round-dot" + (i < state.solved.length ? " is-done" : (i === state.round && !state.complete ? " is-current" : ""));
    });
    choices.forEach(function (button) {
      var attached = state.solved.indexOf(button.dataset.choice) >= 0;
      button.classList.toggle("is-attached", attached);
      button.textContent = (attached ? "✓ " : "") + button.dataset.choice.replace("ordered", "内小外大型").replace("compact", "紧凑小行星型").replace("hot", "热巨行星型");
      button.disabled = state.complete || attached;
    });
    reset.hidden = !state.complete;
    if (state.complete) {
      systemLabel.textContent = "三类结构 / 同尺度对照";
      plotState.textContent = "同一视觉编码下，结构差异直接可比";
      feedback.className = "classifier-feedback is-ok";
      feedback.textContent = "分类来自四项指标的组合，不是凭单个点猜测。";
      renderMiniatures();
    } else {
      systemLabel.textContent = "匿名系统 " + String(state.round + 1).padStart(2, "0");
      plotState.textContent = "先读整体分布，再综合四项指标";
      renderMain();
    }
  }

  function choose(kind, button) {
    if (state.complete) return;
    var expected = systems[state.round].kind;
    if (kind !== expected) {
      var branch = button.closest(".class-branch");
      branch.classList.remove("shake");
      void branch.offsetWidth;
      branch.classList.add("shake");
      feedback.className = "classifier-feedback is-error";
      feedback.textContent = "这个判断与最内侧行星的质量和半径不符。请同时检查位置与大小。";
      return;
    }
    state.solved.push(kind);
    branches.forEach(function (branch) { branch.classList.toggle("is-current", branch.dataset.kind === kind); });
    feedback.className = "classifier-feedback is-ok";
    feedback.textContent = "四项判据已接通：" + systems[state.round].title + "。";
    renderMain();
    window.setTimeout(function () {
      branches.forEach(function (branch) { branch.classList.remove("is-current"); });
      if (state.round === systems.length - 1) state.complete = true;
      else state.round += 1;
      updateUI();
    }, Deck.reduced() ? 0 : 650);
  }

  choices.forEach(function (button) {
    button.addEventListener("click", function () { choose(button.dataset.choice, button); });
  });
  criteria.forEach(function (row) {
    function on() { state.channel = row.dataset.channel; if (!state.complete) renderMain(); }
    function off() { state.channel = null; if (!state.complete) renderMain(); }
    row.addEventListener("mouseenter", on);
    row.addEventListener("mouseleave", off);
    row.addEventListener("focus", on);
    row.addEventListener("blur", off);
  });
  reset.addEventListener("click", function () {
    state = { round: 0, solved: [], complete: false, channel: null };
    feedback.className = "classifier-feedback";
    feedback.textContent = "单个指标只给线索，多个指标互相印证才支持分类。";
    updateUI();
  });
  Deck.onResize(function () { if (state.complete) renderMiniatures(); else renderMain(); });
  updateUI();
}());
</script>
</body>
</html>
