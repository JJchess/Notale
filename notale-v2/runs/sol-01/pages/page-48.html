<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .diagnosis-page {
    width: var(--content-w);
    height: var(--content-h);
    display: flex;
    gap: var(--sp-5);
  }

  .evidence-field {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    height: 100%;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--surface-data);
  }

  .evidence-field.k-generalization {
    grid-template-rows: 64px 1fr;
    gap: 0;
  }

  .evidence-field.k-generalization > .claim {
    width: 78%;
    min-height: 64px;
    margin-top: 0;
    padding: var(--sp-3) var(--sp-5);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .evidence-field.k-generalization > .trunk {
    top: 64px;
    bottom: 112px;
  }

  .system-space {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  #network {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .orbit-shell {
    position: absolute;
    top: 28px;
    left: 50%;
    width: 510px;
    height: 300px;
    transform: translateX(-50%);
  }

  .orbit-shell svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .scale-caption {
    position: absolute;
    top: 14px;
    left: 18px;
    color: var(--text-muted);
    font-size: var(--fs-label);
    line-height: var(--lh-tight);
  }

  .scale-caption strong {
    color: var(--primary);
    font-family: var(--font-mono);
  }

  .evidence-node {
    position: absolute;
    z-index: 5;
    width: 214px;
    min-height: 64px;
    padding: var(--sp-2) var(--sp-3);
    border-left: 4px solid var(--primary);
    background: var(--surface-raised);
    color: var(--text);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
    text-align: left;
    touch-action: none;
    user-select: none;
  }

  .evidence-node .node-tag {
    display: block;
    margin-bottom: var(--sp-1);
    color: var(--primary);
    font-size: var(--fs-label);
    font-weight: 650;
  }

  .evidence-node.is-linked {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .evidence-node.is-linked .node-tag {
    color: var(--accent);
  }

  .evidence-node.is-error {
    border-color: var(--danger);
  }

  .node-position { top: 30px; left: 22px; }
  .node-motion { top: 30px; right: 22px; }
  .node-composition { top: 174px; left: 22px; }
  .node-history { top: 174px; right: 22px; }

  .evidence-field.k-generalization > .supports {
    --support-cols: 4;
    position: absolute;
    right: var(--sp-4);
    bottom: var(--sp-4);
    left: var(--sp-4);
    height: 96px;
    gap: var(--sp-3);
    padding-top: var(--sp-4);
  }

  .evidence-field.k-generalization > .supports::before {
    top: var(--sp-4);
  }

  .evidence-field.k-generalization .support {
    padding: var(--sp-3);
    border: 1px solid var(--line-strong);
    border-top: 3px solid var(--primary);
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-tight);
    text-align: center;
  }

  .evidence-field.k-generalization .support::before {
    height: var(--sp-4);
  }

  .support strong {
    display: block;
    color: var(--text);
    font-size: var(--fs-body);
  }

  .support.is-filled {
    border-color: var(--accent);
    border-top-color: var(--accent);
    background: var(--accent-soft);
  }

  .support.is-reject {
    border-color: var(--danger);
  }

  .diagnosis-rail {
    flex: 0 0 376px;
    min-width: 0;
    height: 100%;
    padding: var(--sp-5);
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
    border: 1px solid var(--line);
    background: var(--surface);
  }

  .diagnosis-rail .panel-title {
    margin: 0;
  }

  .argument-select {
    width: 100%;
    min-height: 48px;
    font-size: var(--fs-sec);
  }

  .progress-readout {
    border-left-color: var(--accent);
  }

  .progress-readout .value {
    color: var(--accent);
  }

  .feedback {
    min-height: 98px;
    padding: var(--sp-4);
    border-left: 3px solid var(--primary);
    background: var(--surface-data);
    color: var(--text);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
  }

  .feedback.is-error {
    border-left-color: var(--danger);
  }

  .feedback.is-complete {
    border-left-color: var(--success);
  }

  .rail-actions {
    margin-top: auto;
  }

  .rail-actions button {
    width: 100%;
    font-size: var(--fs-sec);
  }

  .claim-sub {
    margin-left: var(--sp-3);
    color: var(--text-muted);
    font-size: var(--fs-sec);
    font-weight: 400;
  }

  progress.lec-progress {
    appearance: none;
    width: 100%;
    border: 0;
    overflow: visible;
    background: var(--line);
  }

  progress.lec-progress::-webkit-progress-bar { background: var(--line); }
  progress.lec-progress::-webkit-progress-value { background: var(--primary); }
  progress.lec-progress::-moz-progress-bar { background: var(--primary); }

  .link-base {
    fill: none;
    stroke: var(--primary-line);
    stroke-width: 2;
  }

  .link-live {
    fill: none;
    stroke: var(--accent);
    stroke-width: 3;
  }

  .pulse-dot {
    fill: var(--accent);
  }

  @keyframes node-shake {
    0%, 100% { transform: translateX(0); }
    30% { transform: translateX(-7px); }
    65% { transform: translateX(7px); }
  }

  .evidence-node.is-error {
    animation: node-shake 240ms ease-out;
  }

  @media (prefers-reduced-motion: reduce) {
    .evidence-node.is-error { animation: none; }
  }
</style>
</head>
<body data-page="48" data-total="50">
<div id="stage">
<main id="main">
  <div class="diagnosis-page page min0">
    <section class="evidence-field k-generalization min0 no-pan" id="evidenceField" aria-label="新生行星系证据关系图">
      <div class="claim" id="claim">
        <span id="claimText">主张：这套系统经历了向内迁移</span>
        <span class="claim-sub" id="claimSub">等待四类证据汇合</span>
      </div>
      <div class="trunk" aria-hidden="true"></div>

      <div class="system-space min0" id="systemSpace">
        <svg id="network" role="img" aria-label="证据节点通往四类支撑，再汇入系统历史主张的关系网"></svg>
        <div class="scale-caption">虚构系统 · 恒星质量 <strong id="starMass">1.00 M☉</strong> · 轨道尺 <strong>AU</strong></div>
        <div class="orbit-shell" aria-hidden="true"><svg id="orbitPlot"></svg></div>

        <button class="evidence-node node-position" data-id="position" type="button" aria-label="位置证据，拖到位置支撑，或用方向键选择分支后按回车">
          <span class="node-tag">证据 A · 位置</span><span id="positionText">巨行星贴近恒星</span>
        </button>
        <button class="evidence-node node-motion" data-id="motion" type="button" aria-label="运动证据，拖到运动支撑，或用方向键选择分支后按回车">
          <span class="node-tag">证据 B · 运动</span><span id="motionText">轨道近圆且与盘面对齐</span>
        </button>
        <button class="evidence-node node-composition" data-id="composition" type="button" aria-label="组成证据，拖到组成支撑，或用方向键选择分支后按回车">
          <span class="node-tag">证据 C · 组成</span><span id="compositionText">低密度显示富含气体</span>
        </button>
        <button class="evidence-node node-history" data-id="history" type="button" aria-label="历史证据，拖到历史支撑，或用方向键选择分支后按回车">
          <span class="node-tag">证据 D · 历史</span><span id="historyText">外侧碎屑带存在缺口</span>
        </button>
      </div>

      <div class="supports" aria-label="四条支撑分支">
        <div class="support" data-branch="position"><strong>位置</strong><span>轨道分区与梯度</span></div>
        <div class="support" data-branch="motion"><strong>运动</strong><span>周期与轨道偏离</span></div>
        <div class="support" data-branch="composition"><strong>组成</strong><span>质量、半径与密度</span></div>
        <div class="support" data-branch="history"><strong>历史</strong><span>聚积、碰撞或迁移</span></div>
      </div>
    </section>

    <aside class="diagnosis-rail min0" aria-label="解释与论证进度">
      <h2 class="panel-title">选择系统解释</h2>
      <label class="label" for="explanation">当前主张</label>
      <select class="argument-select" id="explanation">
        <option value="migration">巨行星在盘中向内迁移</option>
        <option value="scattering">散射后又被盘面阻尼</option>
        <option value="insitu">巨行星始终在当前位置形成</option>
      </select>

      <div class="readout progress-readout">
        <span class="name">论证进度</span><span class="value" id="progress">0 / 4 类</span>
      </div>

      <div class="feedback" id="feedback" aria-live="polite">
        把证据拖到它所属的支撑。方向键可选择分支，按回车接入。
      </div>

      <p class="note">单条异常可以有多种解释。跨类别证据互相支持，解释才更可辩护。</p>
      <p class="secondary">科学判断不要求唯一答案，但必须说明证据支持什么，又不能排除什么。</p>

      <div class="rail-actions ctl">
        <button id="reset" type="button">重置同一案例</button>
      </div>
    </aside>
  </div>
</main>
</div>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Lec.mount({
  index: 48,
  kicker: "SYSTEM DIAGNOSIS",
  title: "这套系统经历了什么？",
  take: "位置、运动、组成和历史证据互相支持时，解释才更可辩护。"
});

(function () {
  var seed = "solar-system-lecture-p48";
  var categories = ["position", "motion", "composition", "history"];
  var categoryNames = { position: "位置", motion: "运动", composition: "组成", history: "历史" };
  var explanations = {
    migration: {
      title: "这套系统经历了向内迁移",
      compatible: categories,
      alternate: "散射后再被盘面阻尼，也仍可兼容这些证据。"
    },
    scattering: {
      title: "这套系统经历了散射与阻尼",
      compatible: categories,
      alternate: "盘驱动的平缓向内迁移，也仍未被排除。"
    },
    insitu: {
      title: "巨行星始终在当前位置形成",
      compatible: ["motion", "composition"],
      alternate: "位置与历史证据仍要求考虑迁移或散射。"
    }
  };
  var supportCopy = {
    position: "近恒星巨行星偏离材料梯度，支持它改变过出生位置。",
    motion: "近圆且共面的轨道，允许迁移或散射后阻尼两条路径。",
    composition: "低密度巨行星需要大量气体，约束它的形成环境。",
    history: "碎屑带缺口说明系统曾发生重排，但不指定唯一机制。"
  };

  var state = freshState();
  var selectedBranch = {};
  var field = document.getElementById("evidenceField");
  var systemSpace = document.getElementById("systemSpace");
  var feedback = document.getElementById("feedback");
  var explanation = document.getElementById("explanation");
  var nodes = d3.selectAll(".evidence-node");

  function planetList() {
    var source = Lec.K.PLANETS;
    return Array.isArray(source) ? source : Object.keys(source).map(function (key) { return source[key]; });
  }

  function safeNumber(fn, fallback) {
    try {
      var value = fn();
      return Number.isFinite(value) ? value : fallback;
    } catch (err) {
      return fallback;
    }
  }

  function freshState() {
    var rng = new Math.seedrandom(seed);
    var planets = planetList();
    var earth = planets[2];
    var jupiter = planets[4];
    var earthYear = safeNumber(function () { return Lec.P.orbitalPeriodYears(earth); }, 1);
    var jupiterMass = safeNumber(function () { return Lec.P.planetMassKg(jupiter); }, 1.898e27);
    var jupiterRadiusKm = safeNumber(function () { return Lec.P.planetDiameterKm(jupiter) / 2; }, 69911);
    var orbitAU = 0.11 + rng() * 0.025;
    var massKg = jupiterMass * (0.72 + rng() * 0.18);
    var radiusM = jupiterRadiusKm * (0.95 + rng() * 0.08) * 1000;
    var densityKgM3 = safeNumber(function () { return Lec.P.density(massKg, radiusM); }, massKg / ((4 / 3) * Math.PI * Math.pow(radiusM, 3)));
    var periodDays = earthYear * Math.sqrt(Math.pow(orbitAU, 3)) * 365.25;
    var flux = safeNumber(function () { return Lec.P.solarFluxRatio(orbitAU); }, 1 / (orbitAU * orbitAU));
    var massEarth = safeNumber(function () {
      return Lec.P.ratio(massKg, Lec.P.planetMassKg(earth));
    }, 286);
    return {
      explanation: "migration",
      attached: {},
      trace: [],
      system: { orbitAU: orbitAU, periodDays: periodDays, densityKgM3: densityKgM3, flux: flux, massEarth: massEarth }
    };
  }

  function fmt(value, digits) {
    return String(Lec.P.significant(value, digits));
  }

  function updateCaseText() {
    var s = state.system;
    document.getElementById("positionText").textContent = "气体巨行星位于 " + fmt(s.orbitAU, 3) + " AU";
    document.getElementById("motionText").textContent = "周期 " + fmt(s.periodDays, 3) + " 天，轨道近圆共面";
    document.getElementById("compositionText").textContent = fmt(s.massEarth, 3) + " 地球质量，密度 " + fmt(s.densityKgM3 / 1000, 3) + " g/cm³";
    document.getElementById("historyText").textContent = "外侧碎屑带在 " + fmt(2.1 + s.orbitAU * 2, 2) + " AU 出现缺口";
    document.getElementById("starMass").textContent = fmt(Lec.P.ratio(1, 1), 3) + " M☉";
  }

  function drawOrbit() {
    var svg = d3.select("#orbitPlot").attr("viewBox", "0 0 510 300");
    svg.selectAll("*").remove();
    var cx = 255, cy = 150;
    var rings = [42, 78, 122, 170, 218];
    svg.append("line").attr("x1", 18).attr("x2", 492).attr("y1", cy).attr("y2", cy).attr("class", "axis-line");
    svg.selectAll("ellipse.orbit").data(rings).join("ellipse")
      .attr("cx", cx).attr("cy", cy).attr("rx", function (d) { return d; }).attr("ry", function (d) { return d * 0.43; })
      .attr("class", "orbit-line").attr("opacity", function (d, i) { return i === 0 ? 0.95 : 0.32; });
    svg.append("ellipse").attr("cx", cx).attr("cy", cy).attr("rx", 196).attr("ry", 58)
      .attr("fill", "none").attr("stroke", "var(--text-dim)").attr("stroke-width", 12).attr("stroke-dasharray", "2 10").attr("opacity", 0.28);
    svg.append("circle").attr("cx", cx).attr("cy", cy).attr("r", 16).attr("fill", "var(--accent)");
    svg.append("circle").attr("cx", cx + 34).attr("cy", cy - 14).attr("r", 10).attr("fill", "var(--primary)").attr("stroke", "var(--text)").attr("stroke-width", 2);
    svg.append("rect").attr("x", cx + 16).attr("y", cy - 34).attr("width", 54).attr("height", 42).attr("class", "target").attr("fill", "none");
    [0, 1, 2, 3, 4].forEach(function (i) {
      svg.append("text").attr("x", cx + rings[i]).attr("y", cy + 22).attr("fill", "var(--text-muted)")
        .attr("font-size", 13).attr("font-family", "var(--font-mono)").attr("text-anchor", "middle").text(i === 0 ? "0.12" : String(i));
    });
  }

  function centerIn(el, root) {
    var a = el.getBoundingClientRect();
    var b = root.getBoundingClientRect();
    var scale = Deck.s || 1;
    return { x: (a.left + a.width / 2 - b.left) / scale, y: (a.top + a.height / 2 - b.top) / scale };
  }

  function drawNetwork() {
    var root = systemSpace;
    var width = root.offsetWidth;
    var height = root.offsetHeight;
    var svg = d3.select("#network").attr("viewBox", "0 0 " + width + " " + height);
    svg.selectAll("*").remove();
    var claimPoint = centerIn(document.getElementById("claim"), root);
    categories.forEach(function (id) {
      var nodeEl = document.querySelector('.evidence-node[data-id="' + id + '"]');
      var branchEl = document.querySelector('.support[data-branch="' + id + '"]');
      var a = centerIn(nodeEl, root);
      var b = centerIn(branchEl, root);
      var path = "M" + a.x + "," + a.y + " C" + a.x + "," + (a.y + 54) + " " + b.x + "," + (b.y - 54) + " " + b.x + "," + b.y;
      svg.append("path").attr("d", path).attr("class", state.attached[id] ? "link-live" : "link-base").attr("opacity", state.attached[id] ? 1 : 0.24);
      if (state.attached[id]) {
        var toClaim = "M" + b.x + "," + b.y + " C" + b.x + "," + (b.y - 100) + " " + claimPoint.x + "," + (claimPoint.y + 80) + " " + claimPoint.x + "," + claimPoint.y;
        svg.append("path").attr("d", toClaim).attr("class", "link-live");
      }
    });
  }

  function setFeedback(text, kind) {
    feedback.textContent = text;
    feedback.classList.toggle("is-error", kind === "error");
    feedback.classList.toggle("is-complete", kind === "complete");
  }

  function attachEvidence(id, branch) {
    var node = document.querySelector('.evidence-node[data-id="' + id + '"]');
    var branchEl = document.querySelector('.support[data-branch="' + branch + '"]');
    if (id !== branch) {
      reject(node, branchEl, "这条证据描述的是" + categoryNames[id] + "，不是" + categoryNames[branch] + "。");
      return;
    }
    if (explanations[state.explanation].compatible.indexOf(id) < 0) {
      reject(node, branchEl, "它与当前解释矛盾。请改选解释，或换一条证据路径。");
      return;
    }
    if (state.attached[id]) {
      setFeedback(supportCopy[id], "normal");
      return;
    }
    state.attached[id] = true;
    state.trace.push({ evidence: id, explanation: state.explanation });
    node.classList.add("is-linked");
    branchEl.classList.add("is-filled");
    setFeedback(supportCopy[id], "normal");
    updateProgress();
    drawNetwork();
  }

  function reject(node, branchEl, message) {
    node.classList.remove("is-error");
    branchEl.classList.add("is-reject");
    void node.offsetWidth;
    node.classList.add("is-error");
    setTimeout(function () {
      node.classList.remove("is-error");
      branchEl.classList.remove("is-reject");
    }, Deck.reduced() ? 0 : 280);
    setFeedback(message, "error");
  }

  function updateProgress() {
    var count = Object.keys(state.attached).length;
    document.getElementById("progress").textContent = count + " / 4 类";
    document.getElementById("claimSub").textContent = count === 4 ? "四类支撑已经汇合" : "已建立 " + count + "/4 类支撑";
    if (count === 4) {
      document.getElementById("claim").classList.add("is-current");
      setFeedback("解释成立，但不是唯一答案。" + explanations[state.explanation].alternate, "complete");
      field.dispatchEvent(new CustomEvent("game-complete", { bubbles: true, detail: { score: 4, metrics: { categories: 4 }, trace: state.trace.slice() } }));
    }
  }

  function clearLinks(message) {
    state.attached = {};
    state.trace = [];
    document.querySelectorAll(".evidence-node").forEach(function (el) { el.classList.remove("is-linked", "is-error"); el.style.transform = ""; });
    document.querySelectorAll(".support").forEach(function (el) { el.classList.remove("is-filled", "is-reject"); });
    document.getElementById("claim").classList.remove("is-current");
    document.getElementById("progress").textContent = "0 / 4 类";
    document.getElementById("claimSub").textContent = "等待四类证据汇合";
    setFeedback(message, "normal");
    drawNetwork();
  }

  explanation.addEventListener("change", function () {
    state.explanation = explanation.value;
    document.getElementById("claimText").textContent = "主张：" + explanations[state.explanation].title;
    clearLinks("案例不变，连线已清空。重新选择能支持这项主张的证据。");
    field.dispatchEvent(new CustomEvent("game-progress", { bubbles: true, detail: { state: snapshot(), action: "change-explanation", metrics: { categories: 0 } } }));
  });

  document.getElementById("reset").addEventListener("click", function () {
    state = freshState();
    explanation.value = state.explanation;
    document.getElementById("claimText").textContent = "主张：" + explanations[state.explanation].title;
    updateCaseText();
    clearLinks("同一种子已复现同一案例。把证据接入四类支撑。");
    field.dispatchEvent(new CustomEvent("game-reset", { bubbles: true, detail: { state: snapshot() } }));
  });

  nodes.each(function () {
    var node = this;
    var id = node.dataset.id;
    selectedBranch[id] = categories.indexOf(id);
    node.addEventListener("keydown", function (event) {
      if (["ArrowLeft", "ArrowUp", "ArrowRight", "ArrowDown"].indexOf(event.key) >= 0) {
        event.preventDefault();
        var delta = (event.key === "ArrowLeft" || event.key === "ArrowUp") ? -1 : 1;
        selectedBranch[id] = (selectedBranch[id] + delta + categories.length) % categories.length;
        setFeedback("已选择“" + categoryNames[categories[selectedBranch[id]]] + "”分支，按回车接入。", "normal");
      } else if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        attachEvidence(id, categories[selectedBranch[id]]);
      }
    });
  });

  nodes.call(d3.drag()
    .on("start", function (event) {
      event.subject.originX = event.x;
      event.subject.originY = event.y;
      d3.select(this).raise();
    })
    .on("drag", function (event) {
      var dx = event.x - event.subject.originX;
      var dy = event.y - event.subject.originY;
      d3.select(this).style("transform", "translate(" + dx + "px," + dy + "px)");
    })
    .on("end", function (event) {
      var source = event.sourceEvent;
      var point = source.changedTouches && source.changedTouches[0] ? source.changedTouches[0] : source;
      var hit = categories.find(function (branch) {
        var rect = document.querySelector('.support[data-branch="' + branch + '"]').getBoundingClientRect();
        return point.clientX >= rect.left && point.clientX <= rect.right && point.clientY >= rect.top && point.clientY <= rect.bottom;
      });
      d3.select(this).style("transform", "");
      if (hit) attachEvidence(this.dataset.id, hit);
      else setFeedback("把证据放到下方四条支撑之一。", "normal");
      drawNetwork();
    }));

  function snapshot() {
    return JSON.parse(JSON.stringify(state));
  }

  field.start = function () {
    field.dispatchEvent(new CustomEvent("game-start", { bubbles: true, detail: { state: snapshot() } }));
    return snapshot();
  };
  field.reset = function () { document.getElementById("reset").click(); return snapshot(); };
  field.getState = snapshot;

  updateCaseText();
  drawOrbit();
  requestAnimationFrame(drawNetwork);
  Deck.onResize(drawNetwork);
})();
</script>
</body>
</html>
