<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .finale {
    position: relative;
    width: var(--content-w);
    height: var(--content-h);
    overflow: hidden;
  }

  .system-arc {
    position: absolute;
    z-index: 0;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }

  .system-arc .orbit-line {
    stroke-dasharray: 1800;
    stroke-dashoffset: 1800;
    opacity: 0.45;
    animation: draw-orbit 1.2s ease-out 3.2s forwards;
  }

  .system-arc .measure-line {
    stroke-dasharray: 360;
    stroke-dashoffset: 360;
    animation: draw-support 0.8s ease-out var(--line-delay) forwards;
  }

  .system-arc .join {
    fill: var(--accent);
    opacity: 0;
    animation: settle-join 0.45s ease-out 4.9s forwards;
  }

  progress.lec-progress {
    overflow: visible;
  }

  .join-label {
    position: absolute;
    z-index: 3;
    top: 62px;
    left: 50%;
    padding: var(--sp-1) var(--sp-2);
    background: var(--bg);
    color: var(--accent);
    font-size: var(--fs-label);
    font-weight: 650;
    line-height: var(--lh-tight);
    transform: translateX(-50%);
  }

  .finale.k-generalization {
    grid-template-rows: auto 1fr auto;
    gap: var(--sp-4);
  }

  .finale.k-generalization > .claim {
    width: 900px;
    max-width: none;
    padding: var(--sp-3) var(--sp-5);
    border-left-color: var(--accent);
    background: var(--surface);
    text-align: center;
    opacity: 0;
    transform: translateY(8px);
    animation: reveal-claim 0.9s ease-out 5.05s forwards;
  }

  .claim-muted {
    color: var(--text-dim);
    font-weight: 500;
  }

  .claim-key {
    color: var(--accent);
    font-size: var(--fs-h2);
    font-weight: 700;
  }

  .finale.k-generalization > .trunk {
    top: 44px;
    bottom: 72px;
  }

  .finale.k-generalization > .supports {
    --support-cols: 4;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--sp-5);
    padding-top: var(--sp-4);
  }

  .finale.k-generalization > .supports::before {
    top: var(--sp-4);
  }

  .finale.k-generalization .support {
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
    padding: var(--sp-3);
    border-top-color: var(--primary);
    background: var(--surface-data);
    opacity: 0;
    transform: translateY(12px);
    animation: reveal-support 0.65s ease-out var(--delay) forwards;
  }

  .finale.k-generalization .support::before {
    height: var(--sp-4);
  }

  .evidence-media {
    position: relative;
    height: 190px;
    flex: 0 0 190px;
    overflow: hidden;
    border: 1px solid var(--primary-line);
    border-radius: 50%;
    background: var(--surface);
  }

  .evidence-media img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .evidence-media::after {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow: inset -28px 0 32px var(--bg);
    content: "";
    pointer-events: none;
  }

  .image-tag {
    position: absolute;
    z-index: 1;
    right: var(--sp-3);
    bottom: var(--sp-2);
    padding: var(--sp-1) var(--sp-2);
    background: var(--surface);
    color: var(--text-muted);
    font-size: var(--fs-label);
    font-weight: 600;
    line-height: var(--lh-tight);
  }

  .support-title {
    color: var(--text);
    font-size: var(--fs-h2);
    font-weight: 650;
    line-height: var(--lh-tight);
  }

  .support-text {
    color: var(--text-muted);
    font-size: var(--fs-sec);
    line-height: var(--lh-body);
  }

  .closing {
    position: relative;
    z-index: 2;
    align-self: center;
    max-width: 1100px;
    margin: 0 auto;
    color: var(--text);
    font-size: var(--fs-lead);
    font-weight: 600;
    line-height: var(--lh-body);
    text-align: center;
    opacity: 0;
    animation: reveal-closing 0.8s ease-out 5.55s forwards;
  }

  .closing strong {
    color: var(--accent);
    font-weight: 700;
  }

  @keyframes reveal-support { to { opacity: 1; transform: translateY(0); } }
  @keyframes draw-orbit { to { stroke-dashoffset: 0; } }
  @keyframes draw-support { to { stroke-dashoffset: 0; } }
  @keyframes settle-join { to { opacity: 1; } }
  @keyframes reveal-claim { to { opacity: 1; transform: translateY(0); } }
  @keyframes reveal-closing { to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .system-arc .orbit-line,
    .system-arc .measure-line {
      stroke-dashoffset: 0;
      animation: none;
    }

    .system-arc .join,
    .finale.k-generalization > .claim,
    .finale.k-generalization .support,
    .closing {
      opacity: 1;
      transform: none;
      animation: none;
    }
  }
</style>
</head>
