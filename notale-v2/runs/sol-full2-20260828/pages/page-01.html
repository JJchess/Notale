<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>神经网络是怎么学会的？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{background-image:none}
    .focus{grid-template-rows:auto minmax(0,1fr) auto;gap:12px}
    .head{padding-top:2px}
    .head h1{margin-bottom:8px;font-size:var(--fs-h1)}
    .head .lead{margin:0;color:var(--muted)}
    .main{position:relative;min-height:0}
    .loop-figure{width:100%;height:100%;min-height:0;position:relative}
    .loop-figure svg{display:block;width:100%;height:100%}
    .loop-figure .node{fill:var(--paper);stroke:var(--rule-strong);stroke-width:2}
    .loop-figure .node-model{stroke:var(--model)}
    .loop-figure .node-target{stroke:var(--target)}
    .loop-figure .node-gradient{stroke:var(--gradient)}
    .loop-figure .forward{stroke:var(--model);stroke-width:5;fill:none}
    .loop-figure .target-path{stroke:var(--target);stroke-width:4;fill:none}
    .loop-figure .backward{stroke:var(--gradient);stroke-width:5;fill:none;stroke-dasharray:none}
    .loop-figure .node-title{font-family:var(--font-display);font-size:24px;font-weight:700;text-anchor:middle}
    .loop-figure .node-sub{font-size:16px;fill:var(--muted);text-anchor:middle}
    .loop-figure .path-label{font-size:16px;font-weight:700;text-anchor:middle}
    .loop-figure .equation{font-family:var(--font-num);font-size:21px;font-weight:650;text-anchor:middle}
    .loop-figure .loss-before{fill:var(--muted)}
    .loop-figure .loss-after{fill:var(--gradient)}
    .loop-figure .evidence-line{stroke:var(--rule-strong);stroke-width:2}
    .loop-figure .evidence-box{fill:var(--bg);stroke:var(--text);stroke-width:2}
    .loop-figure .evidence-title{font-size:16px;font-weight:700;text-anchor:middle;fill:var(--text)}
    .loop-figure .flow-number{font-family:var(--font-num);font-size:15px;font-weight:700;fill:var(--muted);text-anchor:middle}
    .promise{display:flex;align-items:center;justify-content:center;gap:18px;min-height:74px;margin:0 70px;padding:14px 24px;border-top:2px solid var(--rule-strong);border-bottom:2px solid var(--rule-strong);font-size:var(--fs-lead);line-height:1.4;text-align:center}
    .promise b{color:var(--model);font-family:var(--font-display)}
    .promise .time{font-family:var(--font-num);font-size:24px;color:var(--attention);white-space:nowrap}
  </style>
</head>
<body data-page="01" data-total="22">
  <div id="stage">
    <main class="focus min0" aria-labelledby="page-title">
      <header class="head">
        <span class="kicker">课程起点 · 一个可检查的闭环</span>
        <h1 id="page-title">神经网络是怎么学会的？</h1>
        <p class="lead">“学习”就是重复执行一组数值计算，让下一次预测的损失更小。</p>
      </header>

      <section class="main min0" aria-label="神经网络学习闭环">
        <figure class="loop-figure" role="img" aria-label="输入经模型计算得到预测，预测与已知答案比较产生损失，误差再告诉每个参数该往哪边动。参数更新后，下一次预测的损失更小。">
          <svg viewBox="0 0 1488 620" aria-hidden="true">
            <defs>
              <marker id="arrowModel" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L11 6 L1 11 Z" fill="#165D9C"/></marker>
              <marker id="arrowTarget" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L11 6 L1 11 Z" fill="#B2482F"/></marker>
              <marker id="arrowGradient" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L11 6 L1 11 Z" fill="#72516F"/></marker>
            </defs>

            <path class="forward" marker-end="url(#arrowModel)" d="M260 270 H450"/>
            <path class="forward" marker-end="url(#arrowModel)" d="M690 270 H845"/>
            <path class="target-path" marker-end="url(#arrowTarget)" d="M1060 112 V195"/>
            <path class="backward" marker-end="url(#arrowGradient)" d="M1000 350 C970 495 805 535 670 472"/>
            <path class="forward" marker-end="url(#arrowModel)" d="M490 430 C350 500 210 438 178 352"/>

            <text class="path-label is-model" x="355" y="243">模型计算</text>
            <text class="path-label is-target" x="1144" y="157">已知答案</text>
            <text class="path-label is-gradient" x="842" y="514">误差告诉每个参数该往哪边动</text>
            <text class="path-label is-model" x="320" y="485">用新参数再算一次</text>

            <g transform="translate(80 212)">
              <rect class="node" width="180" height="116" rx="8"/>
              <text class="node-title" x="90" y="48">输入</text>
              <text class="node-sub" x="90" y="80">一组已知数值</text>
            </g>
            <g transform="translate(450 200)">
              <rect class="node node-model" width="240" height="140" rx="8"/>
              <text class="node-title is-model" x="120" y="46">参数 θ</text>
              <text class="equation is-model" x="120" y="82">ŷ = f(x; θ)</text>
              <text class="node-sub" x="120" y="113">决定模型怎么算</text>
            </g>
            <g transform="translate(845 212)">
              <rect class="node node-model" width="210" height="116" rx="8"/>
              <text class="node-title" x="105" y="48">预测 ŷ</text>
              <text class="node-sub" x="105" y="80">模型给出的答案</text>
            </g>
            <g transform="translate(1055 34)">
              <rect class="node node-target" width="210" height="78" rx="8"/>
              <text class="node-title is-target" x="105" y="48">目标 y</text>
            </g>
            <g transform="translate(1115 200)">
              <rect class="node node-gradient" width="285" height="140" rx="8"/>
              <text class="node-title" x="142.5" y="43">与目标比较</text>
              <text class="equation is-gradient" x="142.5" y="79">L(ŷ, y)</text>
              <text class="node-sub" x="142.5" y="111">算出这次错了多少</text>
            </g>
            <g transform="translate(490 402)">
              <rect class="node node-gradient" width="260" height="118" rx="8"/>
              <text class="node-title is-gradient" x="130" y="47">调参数</text>
              <text class="equation is-gradient" x="130" y="83">θᵗ → θᵗ⁺¹</text>
            </g>

            <g transform="translate(1080 410)">
              <rect class="evidence-box" width="320" height="130" rx="8"/>
              <text class="evidence-title" x="160" y="34">闭环前后，损失可直接核对</text>
              <line class="evidence-line" x1="34" y1="58" x2="286" y2="58"/>
              <text class="equation loss-before" x="160" y="88">L(θᵗ)</text>
              <text class="equation loss-after" x="160" y="118">L(θᵗ⁺¹) &lt; L(θᵗ)</text>
            </g>
          </svg>
        </figure>
      </section>

      <footer class="promise" aria-label="本课承诺">
        <span class="time">30 分钟后</span>
        <b>你能手算一个神经元的一次前向、反向与更新</b>
      </footer>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:1,total:22});</script>
</body>
</html>
