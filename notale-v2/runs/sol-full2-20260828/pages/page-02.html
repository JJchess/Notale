<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>先拆开一个神经元</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .page-head{flex:0 0 104px;padding-top:2px}
    .page-head h1{margin-bottom:0}
    .split{flex:1;min-height:0;grid-template-columns:minmax(0,1.72fr) minmax(390px,.72fr);gap:42px}
    .neuron-field{position:relative;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:8px 0 4px}
    .diagram{width:100%;height:auto;max-height:610px;display:block;overflow:visible}
    .diagram .wire{fill:none;stroke:var(--model);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .diagram .wire-muted{fill:none;stroke:var(--rule-strong);stroke-width:3;stroke-linecap:round}
    .diagram .node{fill:var(--paper-strong);stroke:var(--text);stroke-width:3}
    .diagram .port{fill:var(--paper-strong);stroke:var(--model);stroke-width:3}
    .diagram .bias-port{fill:var(--paper-strong);stroke:var(--target);stroke-width:3}
    .diagram .activation{fill:var(--paper);stroke:var(--model);stroke-width:3}
    .diagram .label{font-size:18px;font-weight:650}
    .diagram .sub{font-size:15px;fill:var(--muted)}
    .diagram .formula-text{font-family:var(--font-num);font-size:18px;font-weight:600}
    .diagram .symbol{font-family:var(--font-num);font-size:28px;font-weight:700}
    .diagram .sigma{font-family:var(--font-num);font-size:32px;font-weight:700;fill:var(--model)}
    .diagram .out{font-family:var(--font-num);font-size:21px;font-weight:700;fill:var(--model)}
    .diagram .weight{font-family:var(--font-num);font-size:16px;font-weight:700;fill:var(--model)}
    .diagram .bias{fill:var(--target)}
    .equation-strip{display:flex;align-items:center;gap:18px;margin:0 24px 0 44px;padding:14px 0;border-top:2px solid var(--rule-strong);border-bottom:2px solid var(--rule-strong)}
    .equation-strip .tagline{flex:0 0 auto;color:var(--muted);font-size:var(--fs-label);font-weight:700;letter-spacing:.04em}
    .equation-strip .formula{font-size:20px;font-weight:650;color:var(--text)}
    .side{border-left:2px solid var(--rule);padding-left:30px;justify-content:center!important}
    .claim{margin:0 0 32px;font-family:var(--font-display);font-size:27px;line-height:1.5;font-weight:700}
    .claim .w{color:var(--model)}
    .claim .b{color:var(--target)}
    .claim .a{color:var(--gradient)}
    .shape-title{margin:0 0 12px;color:var(--muted);font-size:var(--fs-label);font-weight:700;letter-spacing:.08em}
    .shapes{margin:0;border-top:2px solid var(--rule-strong)}
    .shape-row{display:grid;grid-template-columns:92px 1fr;align-items:baseline;gap:12px;padding:13px 2px;border-bottom:1px solid var(--rule)}
    .shape-row dt,.shape-row dd{margin:0}
    .shape-row dt{color:var(--muted);font-size:var(--fs-sec)}
    .shape-row dd{font-family:var(--font-num);font-size:21px;font-weight:650}
    .definition{margin-top:24px;padding-top:12px;border-top:1px solid var(--rule);color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  </style>
</head>
<body data-page="02" data-total="22">
  <div id="stage">
    <header class="page-head">
      <span class="kicker">计算单元 · 端口与形状</span>
      <h1>先拆开一个神经元</h1>
    </header>

    <main class="split min0" aria-label="单个神经元的计算结构">
      <section class="neuron-field min0" aria-label="两个输入经过加权求和与激活函数得到输出">
        <svg class="diagram" viewBox="0 0 980 560" role="img" aria-labelledby="svg-title svg-desc">
          <title id="svg-title">神经元的端口、公式与输出</title>
          <desc id="svg-desc">输入 x1、x2 分别乘权重 w1、w2，与偏置 b 一起进入求和节点，得到加权和 z，再经过激活函数 sigma，输出 y hat。</desc>
          <defs>
            <marker id="arrow-model" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
              <path d="M1,1 L11,6 L1,11 Z" fill="var(--model)"></path>
            </marker>
            <marker id="arrow-target" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
              <path d="M1,1 L11,6 L1,11 Z" fill="var(--target)"></path>
            </marker>
          </defs>

          <text x="26" y="57" class="label">输入 x₁、x₂</text>
          <text x="26" y="80" class="sub">两个独立端口</text>
          <circle cx="118" cy="177" r="34" class="port"></circle>
          <circle cx="118" cy="363" r="34" class="port"></circle>
          <text x="118" y="185" text-anchor="middle" class="symbol">x₁</text>
          <text x="118" y="371" text-anchor="middle" class="symbol">x₂</text>

          <path d="M152 177 C260 177 292 227 390 255" class="wire" marker-end="url(#arrow-model)"></path>
          <path d="M152 363 C260 363 292 313 390 285" class="wire" marker-end="url(#arrow-model)"></path>
          <text x="252" y="184" class="weight">w₁</text>
          <text x="252" y="360" class="weight">w₂</text>
          <text x="222" y="114" class="label">权重 w₁、w₂</text>
          <path d="M300 126 L270 164" class="wire-muted"></path>

          <circle cx="430" cy="270" r="58" class="node"></circle>
          <text x="430" y="281" text-anchor="middle" class="symbol">Σ</text>
          <text x="430" y="352" text-anchor="middle" class="label">加权和</text>
          <text x="430" y="378" text-anchor="middle" class="formula-text">z = w₁x₁ + w₂x₂ + b</text>

          <circle cx="430" cy="92" r="29" class="bias-port"></circle>
          <text x="430" y="100" text-anchor="middle" class="symbol bias">b</text>
          <text x="477" y="98" class="label">偏置 b</text>
          <path d="M430 121 L430 204" fill="none" stroke="var(--target)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-target)"></path>

          <path d="M488 270 L594 270" class="wire" marker-end="url(#arrow-model)"></path>
          <rect x="608" y="213" width="130" height="114" rx="8" class="activation"></rect>
          <text x="673" y="263" text-anchor="middle" class="sigma">σ(z)</text>
          <text x="673" y="294" text-anchor="middle" class="sub">激活函数</text>

          <path d="M738 270 L842 270" class="wire" marker-end="url(#arrow-model)"></path>
          <circle cx="884" cy="270" r="38" class="port"></circle>
          <text x="884" y="278" text-anchor="middle" class="symbol">ŷ</text>
          <text x="884" y="338" text-anchor="middle" class="out">输出 ŷ = σ(z)</text>
        </svg>
        <div class="equation-strip" aria-label="完整计算式">
          <span class="tagline">一个可计算函数</span>
          <span class="formula">ŷ = σ(w₁x₁ + w₂x₂ + b)</span>
        </div>
      </section>

      <aside class="side min0" aria-label="作用与变量形状">
        <p class="claim"><span class="w">权重决定听谁的</span>，<span class="b">偏置决定整体门槛</span>，<span class="a">激活函数决定怎样响应</span>。</p>
        <p class="shape-title">变量形状</p>
        <dl class="shapes">
          <div class="shape-row"><dt>输入</dt><dd>x ∈ ℝ²</dd></div>
          <div class="shape-row"><dt>权重</dt><dd>w ∈ ℝ²</dd></div>
          <div class="shape-row"><dt>偏置</dt><dd>b ∈ ℝ</dd></div>
          <div class="shape-row"><dt>输出</dt><dd>ŷ ∈ (0,1)</dd></div>
        </dl>
        <p class="definition">所有量均为无量纲教学变量；数值与形状由本页定义。</p>
      </aside>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:2,total:22});</script>
</body>
</html>
