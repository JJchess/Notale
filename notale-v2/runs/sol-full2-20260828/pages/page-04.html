<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{background-image:none}
    .page-head{flex:0 0 104px;display:flex;flex-direction:column;justify-content:flex-start}
    .page-head h1{margin-bottom:8px}
    .page-head .lead{margin:0;color:var(--muted)}
    .matrix{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) 410px}
    .plot-panel{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;padding:0;overflow:hidden}
    .formula-band{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:17px 24px;border-bottom:var(--line) solid var(--rule-strong);background:var(--paper)}
    .formula-main{font-family:var(--font-num);font-size:27px;font-weight:650;letter-spacing:-.02em;color:var(--text)}
    .formula-main .coef{color:var(--model)}
    .formula-link{max-width:410px;text-align:right;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
    .plot-wrap{position:relative;min-width:0;min-height:0;background:rgba(248,251,253,.48)}
    .plot-wrap svg{display:block;width:100%;height:100%}
    .axis{stroke:var(--text);stroke-width:2.2}
    .grid{stroke:var(--rule);stroke-width:1.2;stroke-dasharray:5 7}
    .boundary{stroke:var(--model);stroke-width:5;fill:none}
    .tickmark{stroke:var(--text);stroke-width:2}
    .tick-label{font-family:var(--font-num);font-size:16px;fill:var(--muted)}
    .axis-label{font-family:var(--font-num);font-size:21px;font-weight:700;fill:var(--text)}
    .zone-label{font-family:var(--font-display);font-size:23px;font-weight:700}
    .zone-sub{font-size:16px;fill:var(--muted)}
    .point{fill:var(--paper-strong);stroke:var(--text);stroke-width:3}
    .point-label{font-family:var(--font-num);font-size:17px;font-weight:650;fill:var(--text);paint-order:stroke;stroke:var(--paper-strong);stroke-width:5px;stroke-linejoin:round}
    .line-label{font-family:var(--font-num);font-size:18px;font-weight:700;fill:var(--model);paint-order:stroke;stroke:var(--paper-strong);stroke-width:7px;stroke-linejoin:round}
    .rail{display:flex;flex-direction:column;justify-content:center;gap:0}
    .rail h2{margin-bottom:8px}
    .rail-intro{margin:0 0 8px;color:var(--muted);font-size:var(--fs-sec)}
    .role{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;align-items:center;padding:22px 0;border-bottom:1px solid var(--rule)}
    .role:last-child{border-bottom:0}
    .role-symbol{font-family:var(--font-num);font-size:31px;font-weight:700;text-align:center;color:var(--text)}
    .role:first-of-type .role-symbol{color:var(--model)}
    .role:nth-of-type(3) .role-symbol{color:var(--attention)}
    .role:nth-of-type(4) .role-symbol{color:var(--gradient)}
    .role h3{margin:0 0 5px;font-size:20px;line-height:1.3}
    .role p{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.48}
    .source-note{margin-top:auto;padding-top:12px;border-top:1px solid var(--rule);color:var(--muted);font-size:var(--fs-label)}
  </style>
</head>
<body data-page="04" data-total="22">
  <div id="stage">
    <header class="page-head">
      <span class="kicker">单个神经元 · 几何视角</span>
      <h1>同一个公式，也是一条决策边界</h1>
      <p class="lead">令 <span class="formula">z=w·x+b</span>。当 <span class="formula">z=0</span>，输出正好落在 <span class="formula">σ(z)=0.5</span>。</p>
    </header>

    <main class="matrix min0" aria-label="神经元公式与决策边界的对应关系">
      <section class="panel plot-panel min0" aria-labelledby="plot-title">
        <div class="formula-band">
          <div id="plot-title" class="formula-main">
            <span class="coef">w=(2,−1)</span>，b=−0.5　⇒　z=2x₁−x₂−0.5
          </div>
          <div class="formula-link">令 z=0，移项得到同一条直线<br><strong class="is-model formula">x₂=2x₁−0.5</strong></div>
        </div>
        <div class="plot-wrap min0">
          <svg viewBox="0 0 1000 650" role="img" aria-labelledby="chart-title chart-desc" preserveAspectRatio="xMidYMid meet">
            <title id="chart-title">x₁–x₂ 平面上的线性决策边界</title>
            <desc id="chart-desc">直线 x₂ 等于 2x₁ 减 0.5 将平面分成输出大于 0.5 与小于 0.5 两侧。四个样本点是零零、零一、一零和一一。</desc>

            <!-- 两侧区域在同一坐标系内相接 -->
            <path d="M130 80 H722 L258 620 H130 Z" fill="rgba(169,187,199,.18)"/>
            <path d="M722 80 H930 V620 H258 Z" fill="rgba(22,93,156,.11)"/>

            <!-- 0 与 1 的同尺度参照线 -->
            <line class="grid" x1="194" y1="80" x2="194" y2="620"/>
            <line class="grid" x1="834" y1="80" x2="834" y2="620"/>
            <line class="grid" x1="130" y1="577" x2="930" y2="577"/>
            <line class="grid" x1="130" y1="145" x2="930" y2="145"/>

            <!-- 坐标轴 -->
            <line class="axis" x1="130" y1="577" x2="950" y2="577"/>
            <path d="M950 577 l-13 -7 v14 z" fill="var(--text)"/>
            <line class="axis" x1="194" y1="630" x2="194" y2="62"/>
            <path d="M194 62 l-7 13 h14 z" fill="var(--text)"/>
            <line class="tickmark" x1="194" y1="570" x2="194" y2="584"/>
            <line class="tickmark" x1="834" y1="570" x2="834" y2="584"/>
            <line class="tickmark" x1="187" y1="577" x2="201" y2="577"/>
            <line class="tickmark" x1="187" y1="145" x2="201" y2="145"/>
            <text class="tick-label" x="194" y="606" text-anchor="middle">0</text>
            <text class="tick-label" x="834" y="606" text-anchor="middle">1</text>
            <text class="tick-label" x="172" y="583" text-anchor="end">0</text>
            <text class="tick-label" x="172" y="151" text-anchor="end">1</text>
            <text class="axis-label" x="958" y="583">x₁</text>
            <text class="axis-label" x="178" y="54">x₂</text>

            <!-- 决策边界 -->
            <line class="boundary" x1="258" y1="620" x2="722" y2="80"/>
            <text class="line-label" x="535" y="315" transform="rotate(-49 535 315)">z=0　x₂=2x₁−0.5</text>

            <!-- 两侧结论 -->
            <text class="zone-label" x="356" y="152" text-anchor="middle" fill="var(--muted)">ŷ&lt;0.5</text>
            <text class="zone-sub" x="356" y="179" text-anchor="middle">z&lt;0</text>
            <text class="zone-label" x="765" y="466" text-anchor="middle" fill="var(--model)">ŷ&gt;0.5</text>
            <text class="zone-sub" x="765" y="493" text-anchor="middle">z&gt;0</text>

            <!-- 四个合成样本 -->
            <circle class="point" cx="194" cy="577" r="9"/>
            <text class="point-label" x="214" y="555">(0,0)</text>
            <circle class="point" cx="194" cy="145" r="9"/>
            <text class="point-label" x="214" y="126">(0,1)</text>
            <circle class="point" cx="834" cy="577" r="9"/>
            <text class="point-label" x="804" y="550" text-anchor="end">(1,0)</text>
            <circle class="point" cx="834" cy="145" r="9"/>
            <text class="point-label" x="854" y="126">(1,1)</text>
          </svg>
        </div>
      </section>

      <aside class="rail min0" aria-labelledby="roles-title">
        <h2 id="roles-title">三个部件各管什么</h2>
        <p class="rail-intro">公式里的变化，直接对应图上的几何变化。</p>

        <div class="role">
          <div class="role-symbol" aria-hidden="true">w</div>
          <div>
            <h3>w 改方向</h3>
            <p>权重决定直线的斜率，也就是边界朝哪个方向倾斜。</p>
          </div>
        </div>

        <div class="role">
          <div class="role-symbol" aria-hidden="true">b</div>
          <div>
            <h3>b 平移边界</h3>
            <p>偏置改变截距，边界整体移动，方向保持不变。</p>
          </div>
        </div>

        <div class="role">
          <div class="role-symbol" aria-hidden="true">σ</div>
          <div>
            <h3>σ 压缩输出</h3>
            <p>σ 只把 z 压到 0–1，不改变 z=0 的位置。</p>
          </div>
        </div>

        <div class="source-note">坐标与输出均无量纲；数据为本页合成示例。</div>
      </aside>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:4,total:22});</script>
</body>
</html>
