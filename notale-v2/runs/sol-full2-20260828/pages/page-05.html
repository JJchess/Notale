<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>为什么还要激活函数？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{background-image:none}
    .compare{gap:14px}
    .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;border-bottom:2px solid var(--rule-strong);padding-bottom:14px}
    .page-head h1{margin-bottom:0}
    .page-head .lead{max-width:720px;margin:0 0 2px;text-align:right;color:var(--muted)}
    .workspace{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(410px,.72fr);gap:24px;min-height:0}
    .plot-side{display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;min-height:0}
    .function-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .fn-tab{position:relative;min-height:74px;padding:11px 15px;border:2px solid var(--rule);border-radius:var(--radius);background:transparent;color:var(--text);text-align:left;cursor:pointer;font-family:var(--font-sans)}
    .fn-tab:hover{border-color:var(--attention)}
    .fn-tab[aria-pressed="true"]{border-color:var(--attention);background:var(--paper);box-shadow:inset 0 -4px 0 var(--attention)}
    .fn-name{display:block;font-family:var(--font-display);font-size:var(--fs-body);font-weight:750;line-height:1.2}
    .fn-formula{display:block;margin-top:5px;color:var(--muted);font-family:var(--font-num);font-size:var(--fs-label);line-height:1.3}
    .chart-frame{position:relative;min-height:0;border:2px solid var(--rule-strong);border-radius:var(--radius);background:rgba(248,251,253,.72);overflow:hidden}
    #chart{position:absolute;inset:10px 12px 44px}
    .chart-caption{position:absolute;left:22px;right:22px;bottom:9px;margin:0;padding-top:8px;border-top:1px solid var(--rule);color:var(--muted);font-size:var(--fs-label);line-height:1.35}
    .rail{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:13px;min-height:0}
    .selected-readout{padding:17px 18px;border:2px solid var(--text);border-radius:var(--radius);background:var(--paper)}
    .selected-readout .label{display:block;color:var(--muted);font-size:var(--fs-label);font-weight:700}
    .selected-readout h2{margin:3px 0 4px;font-size:28px}
    .selected-readout p{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
    .property-list{display:grid;grid-template-columns:1fr auto;margin:0;border-top:2px solid var(--rule-strong)}
    .property-list dt,.property-list dd{margin:0;padding:10px 3px;border-bottom:1px solid var(--rule);font-size:var(--fs-sec);line-height:1.3}
    .property-list dt{color:var(--muted)}
    .property-list dd{padding-left:14px;text-align:right;font-weight:700}
    .data-block{min-height:0;display:flex;flex-direction:column}
    .data-block h2{margin-bottom:8px;font-size:var(--fs-body)}
    .value-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:var(--fs-sec)}
    .value-table th,.value-table td{padding:8px 8px;border-bottom:1px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums}
    .value-table th:first-child,.value-table td:first-child{text-align:left;width:24%}
    .value-table thead th{border-top:2px solid var(--rule-strong);border-bottom:2px solid var(--rule-strong);font-weight:750}
    .value-table .active-col{background:rgba(215,122,0,.10);font-weight:750;color:var(--text)}
    .rail-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding-top:10px;border-top:1px solid var(--rule)}
    .rail-foot .small{margin:0;max-width:300px}
    .reset{flex:0 0 auto}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body data-page="05" data-total="22">
  <div id="stage">
    <main class="compare" aria-labelledby="page-title">
      <header class="page-head">
        <div>
          <span class="kicker">一个神经元 · 非线性变换</span>
          <h1 id="page-title">为什么还要激活函数？</h1>
        </div>
        <p class="lead">训练要用当前位置的斜率调整参数；输出需随输入平滑或分段平滑地改变。</p>
      </header>

      <section class="workspace min0" aria-label="三种激活函数比较">
        <div class="plot-side min0">
          <div class="function-tabs" role="group" aria-label="选择要突出的激活函数">
            <button class="fn-tab" type="button" data-fn="step" aria-pressed="false">
              <span class="fn-name">阶跃函数</span><span class="fn-formula">z ≥ 0 时输出 1</span>
            </button>
            <button class="fn-tab" type="button" data-fn="sigmoid" aria-pressed="true">
              <span class="fn-name">sigmoid</span><span class="fn-formula">1 / (1 + e⁻ᶻ)</span>
            </button>
            <button class="fn-tab" type="button" data-fn="relu" aria-pressed="false">
              <span class="fn-name">ReLU</span><span class="fn-formula">max(0, z)</span>
            </button>
          </div>

          <figure class="chart-frame min0" aria-labelledby="chart-caption">
            <div id="chart" role="img" aria-label="阶跃函数、sigmoid 与 ReLU 在共同 z 轴上的曲线；当前突出 sigmoid"></div>
            <figcaption id="chart-caption" class="chart-caption">同一输入轴 z；圆点标出 z = −2、0、2 的直接计算结果。数值无量纲。</figcaption>
          </figure>
        </div>

        <aside class="rail min0" aria-label="所选函数属性与数表">
          <section class="selected-readout" aria-live="polite">
            <span class="label">当前突出</span>
            <h2 id="active-name">sigmoid</h2>
            <p id="active-note">处处平滑，局部斜率可用于反向传播。</p>
          </section>

          <dl class="property-list">
            <dt>是否连续</dt><dd id="prop-continuous">是</dd>
            <dt>几乎处处可导</dt><dd id="prop-diff">是</dd>
            <dt>输出范围</dt><dd id="prop-range" class="num">(0, 1)</dd>
          </dl>

          <section class="data-block" aria-labelledby="values-title">
            <h2 id="values-title">三个输入点的输出</h2>
            <table class="value-table">
              <thead><tr><th scope="col">z</th><th scope="col" data-col="step">阶跃</th><th scope="col" data-col="sigmoid" class="active-col">sigmoid</th><th scope="col" data-col="relu">ReLU</th></tr></thead>
              <tbody>
                <tr><th scope="row" class="num">−2</th><td data-col="step" class="num">0</td><td data-col="sigmoid" class="num active-col">0.119</td><td data-col="relu" class="num">0</td></tr>
                <tr><th scope="row" class="num">0</th><td data-col="step" class="num">1</td><td data-col="sigmoid" class="num active-col">0.500</td><td data-col="relu" class="num">0</td></tr>
                <tr><th scope="row" class="num">2</th><td data-col="step" class="num">1</td><td data-col="sigmoid" class="num active-col">0.881</td><td data-col="relu" class="num">2</td></tr>
              </tbody>
            </table>
          </section>

          <div class="rail-foot">
            <p class="small">来源：三条函数定义的直接计算。本页不展开导数链条。</p>
            <button id="reset" class="btn reset" type="button">恢复 sigmoid</button>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
  (function(){
    'use strict';
    Deck.init({index:5,total:22});

    var meta = {
      step: {name:'阶跃函数', continuous:'否，z = 0 处跳变', diff:'否', range:'{0, 1}', note:'在 z = 0 处突然跳变，那里没有可用的局部斜率。'},
      sigmoid: {name:'sigmoid', continuous:'是', diff:'是', range:'(0, 1)', note:'处处平滑，局部斜率可用于反向传播。'},
      relu: {name:'ReLU', continuous:'是', diff:'是，除 z = 0', range:'[0, +∞)', note:'分段平滑；除 z = 0 外，局部斜率明确。'}
    };
    var colors = {step:'#B2482F', sigmoid:'#165D9C', relu:'#72516F'};
    var names = {step:'阶跃函数', sigmoid:'sigmoid', relu:'ReLU'};
    var state = {selected:'sigmoid'};
    var xs = [];
    for(var i=0;i<=160;i++) xs.push(-4 + i * 0.05);
    function calc(id,z){
      if(id==='step') return z>=0 ? 1 : 0;
      if(id==='sigmoid') return 1/(1+Math.exp(-z));
      return Math.max(0,z);
    }
    function curve(id){ return xs.map(function(z){ return [Number(z.toFixed(2)), calc(id,z)]; }); }
    var sampleX = [-2,0,2];
    var chartEl = document.getElementById('chart');
    var chart = echarts.init(chartEl,null,{renderer:'svg'});

    function seriesFor(id){
      var active = state.selected===id;
      return [
        {
          id:id, name:names[id], type:'line', data:curve(id), showSymbol:false,
          step:id==='step'?'end':false, silent:true, clip:true,
          lineStyle:{color:colors[id],width:active?5:2,opacity:active?1:.24},
          emphasis:{disabled:true}, z:active?5:1
        },
        {
          id:id+'-samples', name:names[id]+' 样本点', type:'scatter',
          data:sampleX.map(function(z){return [z,calc(id,z)];}), symbolSize:active?12:7, silent:true,
          itemStyle:{color:colors[id],opacity:active?1:.2,borderColor:'#F8FBFD',borderWidth:2}, z:active?7:2
        }
      ];
    }
    function render(){
      var m=meta[state.selected];
      document.querySelectorAll('.fn-tab').forEach(function(btn){btn.setAttribute('aria-pressed',String(btn.dataset.fn===state.selected));});
      document.querySelectorAll('[data-col]').forEach(function(el){el.classList.toggle('active-col',el.dataset.col===state.selected);});
      document.getElementById('active-name').textContent=m.name;
      document.getElementById('active-note').textContent=m.note;
      document.getElementById('prop-continuous').textContent=m.continuous;
      document.getElementById('prop-diff').textContent=m.diff;
      document.getElementById('prop-range').textContent=m.range;
      chartEl.setAttribute('aria-label','阶跃函数、sigmoid 与 ReLU 在共同 z 轴上的曲线；当前突出'+m.name);
      chart.setOption({
        animation:false,
        backgroundColor:'transparent',
        textStyle:{fontFamily:'Source Han Sans SC, Noto Sans CJK SC, sans-serif',fontSize:16,color:'#132636'},
        aria:{enabled:true,description:'三种激活函数在负四到四的共同输入轴上比较。当前突出'+m.name+'。'},
        grid:{left:62,right:28,top:28,bottom:52,containLabel:false},
        tooltip:{trigger:'axis',confine:true,textStyle:{fontSize:16},valueFormatter:function(v){return Number(v).toFixed(3);}},
        xAxis:{type:'value',name:'输入 z',min:-4,max:4,interval:1,nameLocation:'middle',nameGap:34,
          nameTextStyle:{fontSize:15,fontWeight:650,color:'#4D6575'},axisLabel:{fontSize:13,color:'#4D6575'},
          axisLine:{lineStyle:{color:'#718A9A',width:2}},axisTick:{lineStyle:{color:'#718A9A'}},splitLine:{show:true,lineStyle:{color:'#A9BBC7',width:1,opacity:.48}}},
        yAxis:{type:'value',name:'输出',min:0,max:4,interval:1,nameGap:16,
          nameTextStyle:{fontSize:15,fontWeight:650,color:'#4D6575'},axisLabel:{fontSize:13,color:'#4D6575'},
          axisLine:{show:true,lineStyle:{color:'#718A9A',width:2}},axisTick:{show:true,lineStyle:{color:'#718A9A'}},splitLine:{show:true,lineStyle:{color:'#A9BBC7',width:1,opacity:.48}}},
        series:[].concat(seriesFor('step'),seriesFor('sigmoid'),seriesFor('relu'))
      },true);
    }
    function setState(patch){state=Object.assign({},state,patch);render();}
    document.querySelectorAll('.fn-tab').forEach(function(btn){
      btn.addEventListener('click',function(){setState({selected:btn.dataset.fn});});
    });
    document.getElementById('reset').addEventListener('click',function(){setState({selected:'sigmoid'});});
    var ro = new ResizeObserver(function(){chart.resize();});
    ro.observe(chartEl);
    window.addEventListener('beforeunload',function(){ro.disconnect();chart.dispose();},{once:true});
    render();
  })();
  </script>
</body>
</html>
