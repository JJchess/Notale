<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{background-image:none}
  .focus{grid-template-rows:auto minmax(0,1fr);gap:18px}
  .head{padding-top:2px}
  .head h1{margin-bottom:8px}
  .head .lead{margin:0;color:var(--muted)}
  .lesson-map{width:100%;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:16px;padding:0}
  .root-line{display:flex;align-items:center;gap:18px}
  .root-node{padding:13px 20px;border:2px solid var(--text);border-radius:var(--radius);background:var(--paper);font-family:var(--font-display);font-size:var(--fs-h2);font-weight:700;box-shadow:0 5px 14px var(--shadow)}
  .root-note{color:var(--muted);font-size:var(--fs-sec)}
  .branches{position:relative;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:42px;padding:24px 0 0 52px;min-height:0}
  .branches::before{content:"";position:absolute;left:22px;top:0;bottom:28px;border-left:2px solid var(--rule-strong)}
  .branch{position:relative;min-width:0}
  .branch::before{content:"";position:absolute;left:-30px;top:30px;width:30px;border-top:2px solid var(--rule-strong)}
  .branch-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 0 10px;border-bottom:2px solid var(--rule-strong)}
  .branch-title h2{margin:0}
  .fixed{color:var(--target);font-size:var(--fs-label);font-weight:700;letter-spacing:.04em}
  .data-pair{display:grid;grid-template-columns:minmax(0,1fr) 116px;gap:0;margin-top:12px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .data-pair>*{padding:10px 16px;border-bottom:1px solid var(--rule)}
  .data-pair>*:nth-last-child(-n+2){border-bottom:0}
  .data-pair .xcell{border-right:1px solid var(--rule)}
  .data-pair .hdr{font-family:var(--font-display);font-weight:700;color:var(--model);background:rgba(22,93,156,.055)}
  .data-pair .hdr.y{color:var(--target);background:rgba(178,72,47,.055)}
  .tuple{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600}
  .answer{font-family:var(--font-num);font-size:22px;font-weight:700;color:var(--target)}
  .table-note{margin:10px 0 0;color:var(--muted);font-size:var(--fs-label)}
  .parameter-body{display:flex;flex-direction:column;align-items:stretch;justify-content:center;height:calc(100% - 52px);min-height:270px;padding:18px 0}
  .theta{align-self:flex-start;padding:17px 20px;border:2px solid var(--model);border-radius:var(--radius);background:var(--paper);font-family:var(--font-num);font-size:25px;font-weight:650;color:var(--model)}
  .model-link{position:relative;height:82px;margin-left:48px;border-left:3px solid var(--model)}
  .model-link::after{content:"";position:absolute;left:-7px;bottom:0;border-top:11px solid var(--model);border-left:6px solid transparent;border-right:6px solid transparent}
  .model-link span{position:absolute;left:16px;top:24px;color:var(--muted);font-size:var(--fs-label);white-space:nowrap}
  .model-box{padding:20px;border:2px solid var(--model);border-radius:var(--radius);background:transparent}
  .model-box strong{display:block;margin-bottom:5px;font-family:var(--font-display);font-size:var(--fs-h2);color:var(--model)}
  .model-box p{margin:0;color:var(--muted);font-size:var(--fs-sec)}
  .claim{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:14px 20px;border-top:3px solid var(--text);border-bottom:3px solid var(--text);background:rgba(248,251,253,.62)}
  .claim strong{font-family:var(--font-display);font-size:26px}
  .claim .ruleline{height:1px;background:var(--rule)}
  .claim .next{color:var(--muted);font-size:var(--fs-label)}
  .source{position:absolute;right:0;top:3px;color:var(--muted);font-size:var(--fs-label)}
</style>
</head>
<body data-page="06" data-total="22">
<div id="stage">
  <main class="focus min0" aria-labelledby="page-title">
    <header class="head">
      <span class="kicker">监督学习 · 训练材料</span>
      <h1 id="page-title">有答案的学习：样本、标签、参数</h1>
      <p class="lead">数据给出问题 <span class="is-model">x</span> 和答案 <span class="is-target">y</span>；模型能调整的只有自己的参数 <span class="is-model">θ</span>。</p>
    </header>

    <section class="main min0" aria-label="监督学习训练材料的归属关系">
      <div class="k-classification lesson-map min0">
        <div class="root-line">
          <div class="root-node">监督学习的一次训练材料</div>
          <div class="root-note">一份材料同时包含给定数据与当前模型状态</div>
        </div>

        <div class="branches min0">
          <section class="branch min0" aria-labelledby="given-data">
            <div class="branch-title">
              <h2 id="given-data">给定数据：样本 <span class="is-model">x</span> ＋ 标签 <span class="is-target">y</span></h2>
              <span class="fixed">训练时不可移动</span>
            </div>
            <div class="data-pair" role="table" aria-label="布尔 OR 真值表">
              <div class="hdr xcell" role="columnheader">样本 x</div>
              <div class="hdr y" role="columnheader">标签 y</div>
              <div class="xcell tuple" role="cell">(0, 0)</div><div class="answer" role="cell">0</div>
              <div class="xcell tuple" role="cell">(0, 1)</div><div class="answer" role="cell">1</div>
              <div class="xcell tuple" role="cell">(1, 0)</div><div class="answer" role="cell">1</div>
              <div class="xcell tuple" role="cell">(1, 1)</div><div class="answer" role="cell">1</div>
            </div>
            <p class="table-note">布尔 OR 真值表 · 全部数值无量纲</p>
          </section>

          <section class="branch min0" aria-labelledby="current-parameter">
            <div class="branch-title">
              <h2 id="current-parameter">当前参数 <span class="is-model">θ</span></h2>
            </div>
            <div class="parameter-body">
              <div class="theta">θ = {w₁, w₂, b}</div>
              <div class="model-link" aria-hidden="true"><span>归模型所有，可被训练调整</span></div>
              <div class="model-box">
                <strong>模型</strong>
                <p>用 θ 处理样本 x，产生预测。</p>
              </div>
            </div>
          </section>
          <div class="source">数据出处：布尔 OR 真值表</div>
        </div>

        <footer class="claim">
          <strong>训练改变 <span class="is-model">θ</span>，不改变 <span class="is-model">x</span> 与 <span class="is-target">y</span>。</strong>
          <span class="ruleline" aria-hidden="true"></span>
          <span class="next">下一页：用损失衡量预测离答案有多远</span>
        </footer>
      </div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script>Deck.init({index:6,total:22});</script>
</body>
</html>
