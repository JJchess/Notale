<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage { background-image: none; }
    .sequence { gap: 18px; }
    .head { max-width: 1120px; }
    .head h1 { margin-bottom: 8px; }
    .lead { margin: 0; color: var(--muted); }
    .loop-board {
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 18px;
      padding-top: 4px;
    }
    .process-field {
      position: relative;
      min-height: 0;
      border-top: var(--line) solid var(--rule-strong);
      border-bottom: var(--line) solid var(--rule-strong);
      background: rgba(248,251,253,.56);
      overflow: hidden;
    }
    .process-field::before {
      content: "训练循环";
      position: absolute;
      left: 26px;
      top: 20px;
      color: var(--muted);
      font-size: var(--fs-label);
      font-weight: 700;
      letter-spacing: .08em;
    }
    .k-process {
      position: absolute;
      left: 42px;
      right: 42px;
      top: 88px;
      height: 250px;
      padding: 0;
      gap: 30px;
      align-items: center;
    }
    .k-process .axis { left: 2%; right: 2%; top: 50%; background: var(--rule-strong); }
    .k-process .step {
      height: 176px;
      padding: 25px 22px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--paper-strong);
      box-shadow: 0 5px 14px var(--shadow);
    }
    .k-process .step::before { top: -8px; }
    .step .step-title {
      display: block;
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      line-height: 1.25;
      font-weight: 700;
    }
    .step .formula {
      display: block;
      margin-top: 16px;
      font-size: 27px;
      line-height: 1.25;
      font-weight: 650;
      white-space: nowrap;
    }
    .step.forward-step { border-top: 5px solid var(--model); }
    .step.compare-step { border-top: 5px solid var(--target); }
    .step.backward-step, .step.update-step { border-top: 5px dashed var(--gradient); }
    .k-process .arw { flex-basis: 34px; }
    .k-process .arw.to-loss { background: var(--target); }
    .k-process .arw.to-loss::after { border-left-color: var(--target); }
    .k-process .arw.backward-link {
      height: 0;
      border-top: 4px dashed var(--gradient);
      background: transparent;
    }
    .k-process .arw.backward-link::after { top: -8px; border-left-color: var(--gradient); }
    .signal-key {
      position: absolute;
      right: 28px;
      top: 18px;
      display: flex;
      gap: 24px;
      align-items: center;
      color: var(--muted);
      font-size: var(--fs-label);
    }
    .signal-key span { display: inline-flex; align-items: center; gap: 9px; }
    .sample { width: 34px; height: 0; border-top: 4px solid var(--model); }
    .sample.backward { border-top-style: dashed; border-top-color: var(--gradient); }
    .return-loop {
      position: absolute;
      left: 102px;
      right: 102px;
      bottom: 68px;
      height: 116px;
      color: var(--text);
    }
    .return-loop svg { width: 100%; height: 100%; overflow: visible; }
    .return-loop .loop-path { fill: none; stroke: var(--rule-strong); stroke-width: 3; }
    .return-loop .loop-label {
      position: absolute;
      left: 50%;
      bottom: 2px;
      transform: translateX(-50%);
      padding: 3px 14px;
      background: var(--paper);
      color: var(--text);
      font-size: var(--fs-sec);
      font-weight: 700;
    }
    .unit-band {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: var(--line) solid var(--text);
      border-bottom: var(--line) solid var(--text);
      background: rgba(248,251,253,.42);
    }
    .unit-band > div { padding: 17px 24px; min-width: 0; }
    .unit-band > div + div { border-left: 1px solid var(--rule); }
    .unit-name {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: var(--fs-label);
      font-weight: 700;
      letter-spacing: .04em;
    }
    .unit-def { margin: 0; font-size: var(--fs-body); line-height: 1.4; }
    .eta-note {
      position: absolute;
      right: 30px;
      bottom: 22px;
      margin: 0;
      color: var(--muted);
      font-size: var(--fs-label);
    }
  </style>
</head>
<body data-page="08" data-total="22">
  <div id="stage">
    <main class="sequence min0" aria-labelledby="page-title">
      <header class="head">
        <span class="kicker">训练的重复单位</span>
        <h1 id="page-title">训练循环只有四步</h1>
        <p class="lead">每个批次沿同一条闭环完成计算、比较、反传与更新。</p>
      </header>

      <section class="loop-board min0" aria-label="神经网络训练循环">
        <div class="process-field min0">
          <div class="signal-key" aria-label="方向图例">
            <span><i class="sample" aria-hidden="true"></i>前向实线</span>
            <span><i class="sample backward" aria-hidden="true"></i>反向虚线</span>
          </div>

          <div class="k-process" aria-label="四步训练过程">
            <div class="axis" aria-hidden="true"></div>
            <article class="step forward-step min0">
              <span class="step-title">① 前向</span>
              <span class="formula is-model">算 ŷ</span>
            </article>
            <span class="arw" aria-hidden="true"></span>
            <article class="step compare-step min0">
              <span class="step-title">② 比较</span>
              <span class="formula is-target">算 L</span>
            </article>
            <span class="arw to-loss" aria-hidden="true"></span>
            <article class="step backward-step min0">
              <span class="step-title">③ 反向</span>
              <span class="formula is-gradient">算 ∂L/∂θ</span>
            </article>
            <span class="arw backward-link" aria-hidden="true"></span>
            <article class="step update-step min0">
              <span class="step-title">④ 更新</span>
              <span class="formula is-gradient">θ←θ−η∂L/∂θ</span>
            </article>
          </div>

          <div class="return-loop" aria-label="更新后进入下一批数据">
            <svg viewBox="0 0 1280 116" role="img" aria-label="从更新步骤返回前向步骤的闭环箭头">
              <defs>
                <marker id="return-head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
                  <path d="M0,0 L12,6 L0,12 Z" fill="#718A9A"></path>
                </marker>
              </defs>
              <path class="loop-path" d="M1190 5 V58 Q1190 86 1162 86 H115 Q88 86 88 58 V20" marker-end="url(#return-head)"></path>
            </svg>
            <span class="loop-label">下一批数据</span>
          </div>
          <p class="eta-note"><span class="formula">η</span>：无量纲学习率</p>
        </div>

        <div class="unit-band" aria-label="迭代与训练轮次的定义">
          <div>
            <span class="unit-name">1 次迭代</span>
            <p class="unit-def">用 1 个批次完成四步</p>
          </div>
          <div>
            <span class="unit-name">1 个 epoch</span>
            <p class="unit-def">全部训练样本各用过一次</p>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({ index: 8, total: 22 });</script>
</body>
</html>
