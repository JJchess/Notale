<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>导数就是：轻推一下，结果怎么变</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{background-image:none}
    .page-head{flex:0 0 auto;margin-bottom:18px}
    .page-head h1{margin-bottom:0}
    .lesson{flex:1;min-height:0}
    .plot-side{display:flex;flex-direction:column;min-width:0;min-height:0}
    .formula-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:10px}
    .formula-main{font-family:var(--font-num);font-size:var(--fs-lead);font-weight:650}
    .legend{justify-content:flex-end}
    .chart-shell{flex:1;min-height:0;position:relative;border:var(--line) solid var(--rule-strong);border-radius:var(--radius);background:rgba(248,251,253,.72);overflow:hidden}
    #chart{position:absolute;inset:0}
    .chart-caption{margin:9px 0 0;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
    .side{justify-content:flex-start!important;gap:18px;padding-top:4px}
    .readout{padding:20px;border:var(--line) solid var(--rule-strong);border-radius:var(--radius);background:var(--paper)}
    .readout h2{margin-bottom:16px}
    .slope-line{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
    .slope-label{font-size:var(--fs-sec);color:var(--muted)}
    .slope-value{font-family:var(--font-num);font-size:42px;line-height:1;color:var(--model);font-weight:700;font-variant-numeric:tabular-nums}
    .derivative{display:flex;justify-content:space-between;gap:16px;margin-top:12px;font-size:var(--fs-sec)}
    .derivative strong{font-family:var(--font-num);color:var(--gradient);font-size:20px}
    .ctl{grid-template-columns:90px minmax(130px,1fr)72px;margin:18px 0 8px}
    .ctl label{font-weight:700}
    .action-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px}
    .claim{padding:18px 0;border-top:3px solid var(--text);border-bottom:1px solid var(--rule)}
    .claim p{margin:0;font-family:var(--font-display);font-size:var(--fs-lead);line-height:1.42;font-weight:700}
    .claim .verb{color:var(--model)}
    .evidence{margin:0;padding:0;list-style:none}
    .evidence li{display:flex;justify-content:space-between;gap:18px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:var(--fs-sec)}
    .evidence .num{color:var(--muted)}
    .evidence li.is-current .num{color:var(--attention)}
    .sr-table{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body data-page="09" data-total="22">
  <div id="stage">
    <header class="page-head">
      <span class="kicker">局部敏感度</span>
      <h1>导数就是：轻推一下，结果怎么变</h1>
    </header>

    <main class="split lesson min0">
      <figure class="plot-side min0" aria-labelledby="figure-title" aria-describedby="chart-caption">
        <div class="formula-row">
          <div id="figure-title" class="formula-main">L(w) = ½(wx − y)²　<span class="small">x = 2，y = 1</span></div>
          <div class="legend" aria-label="图例">
            <span class="li is-model"><span class="sw line"></span>损失曲线</span>
            <span class="li is-attention"><span class="sw line"></span>割线</span>
            <span class="li is-gradient"><span class="sw line"></span>切线</span>
          </div>
        </div>
        <div class="chart-shell min0">
          <div id="chart" role="img" aria-label="损失函数曲线，以及随 h 改变而逼近切线的割线"></div>
        </div>
        <figcaption id="chart-caption" class="chart-caption">固定 w = 0.40。橙色割线连接 L(w) 与 L(w+h)；h 越小，它越贴近紫色切线。</figcaption>
        <table class="sr-table">
          <caption>有限差分与解析导数</caption>
          <thead><tr><th>h</th><th>割线斜率</th><th>解析导数</th></tr></thead>
          <tbody><tr><td>0.20</td><td>0.000</td><td>-0.400</td></tr><tr><td>0.10</td><td>-0.200</td><td>-0.400</td></tr><tr><td>0.01</td><td>-0.380</td><td>-0.400</td></tr></tbody>
        </table>
      </figure>

      <aside class="side min0" aria-label="有限差分控制与解释">
        <section class="readout">
          <h2>把 h 缩小，看割线贴近切线</h2>
          <div class="ctl">
            <label for="h-control">轻推量 h</label>
            <input id="h-control" type="range" min="0.01" max="0.20" step="0.01" value="0.10">
            <output id="h-output" for="h-control">0.10</output>
          </div>
          <div class="slope-line">
            <span class="slope-label">割线斜率</span>
            <output id="slope-output" class="slope-value" aria-live="polite">−0.200</output>
          </div>
          <div class="derivative">
            <span>解析导数<br><span class="formula">(wx−y)x</span></span>
            <strong>−0.400</strong>
          </div>
          <div class="action-row">
            <span class="hint">向左拖动 h</span>
            <button class="btn" id="reset" type="button">重置 h</button>
          </div>
        </section>

        <section class="claim" aria-label="斜率解释">
          <p><span class="verb">负斜率</span>：增大 w 会让 L 下降。</p>
        </section>

        <ul class="evidence" aria-label="两个参照值">
          <li id="ref-010"><span>h = 0.10</span><span class="num">割线 −0.200</span></li>
          <li id="ref-001"><span>h = 0.01</span><span class="num">割线 −0.380</span></li>
        </ul>
        <p class="small">w = 0.40 时，L = 0.020。有限差分只比较一次小幅改动前后的损失。</p>
      </aside>
    </main>
  </div>

  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
  (function(){
    'use strict';
    Deck.init({index:9,total:22});
    var W = 0.40, X = 2, Y = 1;
    function loss(w){ return 0.5 * Math.pow(w * X - Y, 2); }
    function derivative(w){ return (w * X - Y) * X; }
    function secant(h){ return (loss(W + h) - loss(W)) / h; }
    function fmtSigned(v){ return (v < 0 ? '−' : '') + Math.abs(v).toFixed(3); }

    var state = {h:0.10};
    var curve = [];
    for(var i=0;i<=124;i++){
      var w = 0.19 + i * 0.005;
      curve.push([+w.toFixed(3), loss(w)]);
    }

    var el = document.getElementById('chart');
    var chart = echarts.init(el, null, {renderer:'svg'});
    var control = document.getElementById('h-control');
    var hOut = document.getElementById('h-output');
    var slopeOut = document.getElementById('slope-output');
    var ref010 = document.getElementById('ref-010');
    var ref001 = document.getElementById('ref-001');

    function render(s){
      var h = s.h;
      var m = secant(h);
      var p0 = [W, loss(W)];
      var p1 = [W+h, loss(W+h)];
      var d = derivative(W);
      var tx0 = 0.24, tx1 = 0.63;
      var tangent = [[tx0, loss(W)+d*(tx0-W)], [tx1, loss(W)+d*(tx1-W)]];
      hOut.textContent = h.toFixed(2);
      slopeOut.textContent = fmtSigned(m);
      ref010.classList.toggle('is-current', Math.abs(h-0.10)<0.001);
      ref001.classList.toggle('is-current', Math.abs(h-0.01)<0.001);

      chart.setOption({
        animation:false,
        textStyle:{fontFamily:'Source Han Sans SC, Noto Sans CJK SC, sans-serif',fontSize:16,color:'#132636'},
        grid:{left:78,right:34,top:42,bottom:68},
        tooltip:{trigger:'axis',confine:true,textStyle:{fontSize:16},formatter:function(params){
          var p=params[0]; return 'w = '+Number(p.value[0]).toFixed(2)+'<br>L = '+Number(p.value[1]).toFixed(3);
        }},
        xAxis:{type:'value',min:0.10,max:0.82,interval:0.10,name:'权重 w',nameLocation:'middle',nameGap:42,nameTextStyle:{fontSize:16,fontWeight:650,color:'#132636'},axisLabel:{fontSize:13,formatter:function(v){return v.toFixed(1);}},axisLine:{lineStyle:{color:'#718A9A',width:2}},splitLine:{show:false}},
        yAxis:{type:'value',min:-0.03,max:0.20,interval:0.05,name:'损失 L',nameGap:48,nameTextStyle:{fontSize:16,fontWeight:650,color:'#132636'},axisLabel:{fontSize:13,formatter:function(v){return v.toFixed(2);}},axisLine:{show:true,lineStyle:{color:'#718A9A',width:2}},splitLine:{lineStyle:{color:'#A9BBC7',width:1}}},
        series:[
          {name:'损失曲线',type:'line',data:curve,showSymbol:false,silent:false,lineStyle:{color:'#165D9C',width:4},itemStyle:{color:'#165D9C'},z:2},
          {name:'切线',type:'line',data:tangent,showSymbol:false,silent:true,lineStyle:{color:'#72516F',width:4,type:'dashed'},z:3},
          {name:'割线',type:'line',data:[p0,p1],showSymbol:false,silent:true,lineStyle:{color:'#D77A00',width:5},z:5},
          {name:'当前点',type:'scatter',data:[p0],symbolSize:15,silent:true,itemStyle:{color:'#165D9C',borderColor:'#FFFFFF',borderWidth:3},label:{show:true,position:'left',distance:12,fontSize:14,fontWeight:700,color:'#132636',backgroundColor:'#F8FBFD',padding:[6,8],borderColor:'#A9BBC7',borderWidth:1,borderRadius:4,formatter:'w = 0.40\nL = 0.020'},z:7},
          {name:'轻推后的点',type:'scatter',data:[p1],symbolSize:14,silent:true,itemStyle:{color:'#D77A00',borderColor:'#FFFFFF',borderWidth:3},label:{show:true,position:'top',distance:10,fontSize:14,fontWeight:650,color:'#132636',formatter:'w+h = '+(W+h).toFixed(2)},z:7}
        ]
      }, true);
    }

    function setState(patch){
      if(typeof patch.h === 'number') state.h = Math.max(0.01,Math.min(0.20,Math.round(patch.h*100)/100));
      control.value = state.h.toFixed(2);
      render(state);
    }
    control.addEventListener('input',function(){setState({h:Number(this.value)});});
    document.getElementById('reset').addEventListener('click',function(){setState({h:0.10});control.focus();});
    var ro = new ResizeObserver(function(){chart.resize();});
    ro.observe(el);
    window.addEventListener('pagehide',function cleanup(){ro.disconnect();chart.dispose();},{once:true});
    setState({h:0.10});
  })();
  </script>
</body>
</html>
