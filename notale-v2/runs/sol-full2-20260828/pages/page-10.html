<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>链式法则：沿计算路径乘局部斜率</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .page10 { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .page10 .head { flex: 0 0 auto; padding-top: 4px; }
    .page10 .head h1 { margin-bottom: 8px; }
    .page10 .lead { max-width: 1000px; margin-bottom: 0; color: var(--muted); }
    .page10 .main { flex: 1; min-height: 0; display: flex; align-items: center; padding: 22px 18px 16px; }
    .page10 .k-generalization { width: 100%; min-height: 520px; grid-template-columns: minmax(500px, .9fr) minmax(0, 1.1fr); gap: 76px; }
    .page10 .k-generalization .trunk { left: calc(45% - 1px); top: 8%; bottom: 8%; }
    .claim-wrap { position: relative; min-width: 0; }
    .claim-wrap::after { content: ""; position: absolute; right: -76px; top: 50%; width: 76px; border-top: var(--line) solid var(--rule-strong); }
    .page10 .claim { padding: 30px 30px 28px; background: var(--paper); box-shadow: 0 5px 14px var(--shadow); }
    .claim-label { display: block; margin-bottom: 18px; color: var(--muted); font-size: var(--fs-label); font-weight: 700; letter-spacing: .06em; }
    .claim-text { display: block; font-family: var(--font-display); font-size: var(--fs-lead); line-height: 1.45; font-weight: 700; }
    .equation { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--rule); color: var(--gradient); font-family: var(--font-num); font-size: var(--fs-h2); font-weight: 700; white-space: nowrap; }
    .frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.08; vertical-align: middle; }
    .frac > span:first-child { padding: 0 7px 5px; border-bottom: 2px solid currentColor; }
    .frac > span:last-child { padding-top: 5px; }
    .path-map { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 18px; color: var(--muted); font-size: var(--fs-label); font-weight: 650; }
    .edge { width: 74px; height: 2px; background: var(--rule-strong); position: relative; }
    .edge::after { content: ""; position: absolute; right: 0; top: -5px; border-left: 9px solid var(--rule-strong); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
    .node { min-width: 42px; text-align: center; color: var(--text); font-family: var(--font-num); font-size: var(--fs-body); font-weight: 700; }
    .supports { gap: 0 !important; }
    .page10 .support { min-height: 116px; padding: 20px 20px 20px 24px; display: flex; align-items: center; gap: 22px; }
    .support-mark { flex: 0 0 64px; color: var(--model); font-family: var(--font-num); font-size: var(--fs-h2); font-weight: 700; text-align: center; }
    .support:nth-child(2) .support-mark { color: var(--gradient); }
    .support:nth-child(3) .support-mark { color: var(--target); }
    .support-copy { min-width: 0; }
    .support-copy strong { display: block; font-family: var(--font-display); font-size: var(--fs-lead); line-height: 1.35; }
    .support-copy span { display: block; margin-top: 5px; color: var(--muted); font-size: var(--fs-sec); line-height: 1.4; }
    .mini-chain { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
    .mini-chain i { width: 24px; border-top: 2px solid currentColor; position: relative; }
    .mini-chain i::after { content: ""; position: absolute; right: -1px; top: -4px; border-left: 7px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
    .times { letter-spacing: .08em; }
    .sum { font-size: var(--fs-h1); line-height: 1; }
    .analogy { flex: 0 0 auto; display: flex; align-items: center; gap: 18px; margin: 0 18px 2px; padding: 16px 22px; border-top: var(--line) solid var(--rule-strong); border-bottom: var(--line) solid var(--rule-strong); background: rgba(248,251,253,.5); }
    .analogy-title { color: var(--attention); font-size: var(--fs-label); font-weight: 750; letter-spacing: .06em; }
    .thermo { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: var(--fs-sec); }
    .thermo .link { width: 42px; border-top: 2px solid var(--rule-strong); position: relative; }
    .thermo .link::after { content: ""; position: absolute; right: -1px; top: -5px; border-left: 8px solid var(--rule-strong); border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
    .analogy p { margin: 0 0 0 auto; font-size: var(--fs-body); font-weight: 650; }
  </style>
</head>
<body data-page="10" data-total="22">
  <div id="stage">
    <main class="page10" aria-labelledby="page-title">
      <header class="head">
        <span class="kicker">反向传播 · 数学工具</span>
        <h1 id="page-title">链式法则：沿计算路径乘局部斜率</h1>
        <p class="lead">复杂网络可以拆成一段段局部变化率，再按计算路径拼回整体导数。</p>
      </header>

      <section class="main min0" aria-label="链式法则的路径与局部导数关系">
        <div class="k-generalization min0">
          <div class="trunk" aria-hidden="true"></div>

          <div class="claim-wrap min0">
            <div class="claim">
              <span class="claim-label">沿同一条计算路径</span>
              <span class="claim-text">若 <span class="formula">w</span> 通过 <span class="formula">z</span> 再影响 <span class="formula">L</span>，则</span>
              <div class="equation" aria-label="L 对 w 的偏导，等于 L 对 z 的偏导乘以 z 对 w 的偏导">
                <span class="frac"><span>∂L</span><span>∂w</span></span>
                <span>=</span>
                <span class="frac"><span>∂L</span><span>∂z</span></span>
                <span>·</span>
                <span class="frac"><span>∂z</span><span>∂w</span></span>
              </div>
              <div class="path-map" aria-hidden="true">
                <span class="node">w</span><span class="edge"></span><span class="node">z</span><span class="edge"></span><span class="node">L</span>
              </div>
            </div>
          </div>

          <div class="supports min0">
            <div class="support">
              <div class="support-mark" aria-hidden="true"><span class="mini-chain">w<i></i>z<i></i>L</span></div>
              <div class="support-copy">
                <strong>路径：<span class="formula">w → z → L</span></strong>
                <span>公式中的两个因子，对应路径上的两条边。</span>
              </div>
            </div>
            <div class="support">
              <div class="support-mark times" aria-hidden="true">×</div>
              <div class="support-copy">
                <strong>每条边只负责自己的局部导数</strong>
                <span>相邻节点之间先各自求斜率，再沿路径相乘。</span>
              </div>
            </div>
            <div class="support">
              <div class="support-mark sum" aria-hidden="true">Σ</div>
              <div class="support-copy">
                <strong>分叉时，各条路径贡献相加</strong>
                <span>同一变量影响损失的多条路径，最终汇总到同一个导数。</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside class="analogy" aria-label="温度换算类比">
        <span class="analogy-title">温度换算类比</span>
        <div class="thermo" aria-hidden="true"><span>原刻度</span><span class="link"></span><span>中间刻度</span><span class="link"></span><span>目标刻度</span></div>
        <p>单位变化率也沿转换链相乘。</p>
      </aside>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({ index: 10, total: 22 });</script>
</body>
</html>
