<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梯度指向最陡上升，更新要走反方向</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:18px}
    .head{flex:0 0 auto;max-width:1280px}
    .head h1{margin-bottom:7px}
    .head .lead{margin:0;color:var(--muted)}
    .split{flex:1;min-height:0;grid-template-columns:minmax(0,2fr) minmax(390px,.92fr);gap:32px}
    .plot-panel{position:relative;min-height:0;border:var(--line) solid var(--rule-strong);border-radius:var(--radius);background:rgba(248,251,253,.82);overflow:hidden}
    .plot-head{position:absolute;z-index:2;left:22px;top:17px;display:flex;align-items:baseline;gap:20px;pointer-events:none}
    .formula-title{font-family:var(--font-num);font-size:20px;font-weight:650}
    .plot-note{color:var(--muted);font-size:var(--fs-label)}
    #chart{position:absolute;inset:54px 12px 10px 12px}
    .side{justify-content:flex-start!important;gap:16px;padding-top:2px}
    .readout{padding:17px 20px;border:var(--line) solid var(--text);border-radius:var(--radius);background:var(--paper)}
    .readout-label{display:block;color:var(--muted);font-size:var(--fs-label);font-weight:650;margin-bottom:3px}
    .readout .big{font-size:48px;color:var(--text)}
    .vector-list{border-top:var(--line) solid var(--rule-strong);border-bottom:var(--line) solid var(--rule-strong)}
    .vector{padding:17px 2px 18px}
    .vector+.vector{border-top:1px solid var(--rule)}
    .vector-head{display:flex;align-items:center;gap:12px;margin-bottom:8px;font:700 20px/1.3 var(--font-display)}
    .arrow-key{position:relative;display:inline-block;width:62px;height:4px;flex:0 0 62px;background:currentColor}
    .arrow-key:after{content:"";position:absolute;right:-1px;top:-6px;border-left:11px solid currentColor;border-top:8px solid transparent;border-bottom:8px solid transparent}
    .vector p{margin:0 0 0 74px;font-size:var(--fs-body);line-height:1.45;font-weight:650}
    .evidence{padding-top:2px}
    .evidence h2{font-size:20px;margin-bottom:8px}
    .evidence p{margin-bottom:10px;font-size:var(--fs-sec);line-height:1.48;color:var(--muted)}
    .evidence strong{color:var(--text)}
    .source{margin-top:auto;padding-top:10px;border-top:1px solid var(--rule);color:var(--muted);font-size:var(--fs-label);line-height:1.4}
    .fallback{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  </style>
</head>
<body data-page="13" data-total="22">
  <div id="stage">
    <header class="head">
      <span class="kicker">参数空间 · 梯度方向</span>
      <h1>梯度指向最陡上升，更新要走反方向</h1>
      <p class="lead">两个偏导数组成一个方向；它垂直穿过等高线，指向损失增长最快的一侧。</p>
    </header>

    <main class="split min0">
      <figure class="plot-panel min0" aria-labelledby="plot-title">
        <div class="plot-head">
          <span id="plot-title" class="formula-title">L = (w₁ − 1)² + 0.5(w₂ + 1)²</span>
          <span class="plot-note">等高线：相同损失的位置</span>
        </div>
        <div id="chart" role="img" aria-label="损失函数的椭圆等高线。在参数点 w1 等于 0、w2 等于 1 处，梯度负二逗号二指向左上，负梯度二逗号负二指向右下，两支箭头都垂直于当前位置的等高线。"></div>
      </figure>

      <aside class="side min0" aria-label="方向解释">
        <section class="readout" aria-label="当前位置损失">
          <span class="readout-label">当前位置 (w₁, w₂) = (0, 1)</span>
          <span class="big"><span class="num">L = 3.000</span></span>
        </section>

        <section class="vector-list" aria-label="两个方向的含义">
          <div class="vector">
            <div class="vector-head is-gradient"><span class="arrow-key" aria-hidden="true"></span><span>∇L = (−2, 2)</span></div>
            <p>沿梯度：损失增得最快</p>
          </div>
          <div class="vector">
            <div class="vector-head is-model"><span class="arrow-key" aria-hidden="true"></span><span>−∇L = (2, −2)</span></div>
            <p>沿负梯度：局部下降最快</p>
          </div>
        </section>

        <section class="evidence">
          <h2>为什么不是“两个参数的分数”</h2>
          <p><strong>偏导给分量：</strong>∂L/∂w₁ = −2，∂L/∂w₂ = 2。</p>
          <p><strong>合在一起才是方向：</strong>(−2, 2) 与等高线的法向一致；反向后，两个参数同时改变，损失下降最快。</p>
        </section>
        <p class="source">所有量无量纲。等高线、损失与梯度均由本页解析函数直接计算；此页不移动参数点。</p>
      </aside>
    </main>
  </div>

  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
    (function(){
      Deck.init({index:13,total:22});
      var el=document.getElementById('chart');
      var chart=echarts.init(el,null,{renderer:'svg'});
      var css=getComputedStyle(document.documentElement);
      function token(n){return css.getPropertyValue(n).trim();}
      var levels=[0.5,1,2,3,4,6,8];
      function contour(level){
        var a=[];
        for(var i=0;i<=160;i++){
          var t=Math.PI*2*i/160;
          a.push([1+Math.sqrt(level)*Math.cos(t),-1+Math.sqrt(level*2)*Math.sin(t)]);
        }
        return a;
      }
      var series=levels.map(function(level){
        return {type:'line',name:'L='+level,data:contour(level),showSymbol:false,silent:true,lineStyle:{color:level===3?token('--rule-strong'):token('--rule'),width:level===3?3:1.5,opacity:level===3?1:.72},emphasis:{disabled:true}};
      });
      series.push({type:'scatter',name:'当前位置',data:[[0,1]],symbolSize:17,z:8,itemStyle:{color:token('--attention'),borderColor:token('--paper-strong'),borderWidth:4},label:{show:true,formatter:'当前位置  (0, 1)',position:'right',distance:12,color:token('--text'),fontSize:16,fontWeight:700}});
      series.push({type:'line',name:'梯度',data:[[0,1],[-1.18,2.18]],symbol:['none','arrow'],symbolSize:[0,18],z:7,lineStyle:{color:token('--gradient'),width:5},label:{show:true,formatter:'∇L  (−2, 2)',position:'end',color:token('--gradient'),fontSize:16,fontWeight:700,distance:10}});
      series.push({type:'line',name:'负梯度',data:[[0,1],[1.18,-.18]],symbol:['none','arrow'],symbolSize:[0,18],z:7,lineStyle:{color:token('--model'),width:5},label:{show:true,formatter:'−∇L  (2, −2)',position:'end',color:token('--model'),fontSize:16,fontWeight:700,distance:10}});
      chart.setOption({
        animation:false,
        textStyle:{fontFamily:token('--font-sans'),fontSize:16,color:token('--text')},
        grid:{left:180,top:18,width:500,height:500},
        xAxis:{type:'value',min:-3,max:3,interval:1,name:'w₁',nameLocation:'end',nameGap:12,nameTextStyle:{fontSize:16,fontWeight:700,color:token('--text')},axisLine:{onZero:true,lineStyle:{color:token('--rule-strong'),width:2}},axisTick:{lineStyle:{color:token('--rule-strong')}},axisLabel:{fontSize:13,color:token('--muted')},splitLine:{show:false}},
        yAxis:{type:'value',min:-3,max:3,interval:1,name:'w₂',nameLocation:'end',nameGap:10,nameTextStyle:{fontSize:16,fontWeight:700,color:token('--text')},axisLine:{onZero:true,lineStyle:{color:token('--rule-strong'),width:2}},axisTick:{lineStyle:{color:token('--rule-strong')}},axisLabel:{fontSize:13,color:token('--muted')},splitLine:{show:false}},
        tooltip:{show:false},
        series:series
      });
      var ro=new ResizeObserver(function(){chart.resize();});
      ro.observe(el);
      window.addEventListener('pagehide',function(){ro.disconnect();chart.dispose();},{once:true});
    })();
  </script>
</body>
</html>
