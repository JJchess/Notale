<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .compare{grid-template-rows:auto minmax(0,1fr);gap:14px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:34px}
  .head-copy{max-width:930px}
  .head h1{margin-bottom:9px}
  .head .lead{margin:0;color:var(--muted)}
  .method{flex:0 0 420px;margin:0 0 2px;padding:12px 0 0;border-top:1px solid var(--rule);font-size:var(--fs-sec);line-height:1.45;color:var(--muted)}
  .figure{min-height:0;margin:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:10px}
  .batch-heads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;padding:0 34px 0 78px}
  .batch-choice{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 8px 8px;border-bottom:2px solid var(--rule)}
  .batch-choice.active{border-bottom-color:var(--attention)}
  .batch-choice .btn{min-width:142px}
  .update-label{font-size:var(--fs-label);color:var(--muted);white-space:nowrap}
  .chart-wrap{position:relative;min-height:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:rgba(248,251,253,.48)}
  #chart{position:absolute;inset:0}
  .y-title{position:absolute;left:4px;top:8px;z-index:2;color:var(--muted);font-size:var(--fs-label);font-weight:650;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.02em;pointer-events:none}
  .readout{display:grid;grid-template-columns:1.05fr .8fr 1.1fr 1.1fr;align-items:stretch;padding:0;overflow:hidden}
  .meter{padding:13px 18px;border-right:1px solid var(--rule)}
  .meter:last-child{border-right:0}
  .meter .lab{display:block;margin-bottom:3px;color:var(--muted);font-size:var(--fs-label)}
  .meter .val{display:block;font-family:var(--font-num);font-size:26px;line-height:1.15;font-weight:650;font-variant-numeric:tabular-nums}
  .meter .val.loss{color:var(--model)}
  .meter .val.updates{color:var(--gradient)}
  .control-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center}
  .epoch-control{display:grid;grid-template-columns:160px minmax(260px,1fr) 88px;gap:14px;align-items:center}
  .epoch-control label{font-size:var(--fs-label);font-weight:650}
  .epoch-control output{text-align:right;font-family:var(--font-num);font-size:var(--fs-label);font-weight:650}
  .actions{display:flex;gap:10px}
  figcaption{display:flex;justify-content:space-between;gap:28px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
  figcaption strong{color:var(--text)}
  .caption-main{max-width:940px}
  .caution{max-width:420px;text-align:right}
  .sr-table{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
</style>
</head>
<body data-page="16" data-total="22">
<div id="stage">
  <main class="compare min0" aria-labelledby="page-title">
    <header class="head">
      <div class="head-copy min0">
        <span class="kicker">MINI-BATCH · 梯度估计</span>
        <h1 id="page-title">批次大小改变的是梯度噪声</h1>
        <p class="lead">同一批样本、同一起点、同一学习率；批次越小，每轮更新越频繁，单次方向也越容易抖动。</p>
      </div>
      <p class="method"><strong>实验固定项</strong><br>64 个二维点，<span class="formula">y=1[x₁+x₂&gt;0]</span>；单 sigmoid 神经元，参数从 0 开始，<span class="num">η=0.20</span>，随机种子 <span class="num">42</span>。</p>
    </header>

    <figure class="figure min0" aria-labelledby="chart-caption">
      <div class="batch-heads" role="group" aria-label="选择要重放的批次大小">
        <div class="batch-choice" data-batch="1">
          <button class="btn batch-btn" type="button" data-batch="1" aria-pressed="false">batch size = 1</button>
          <span class="update-label"><span class="num">64</span> 次/epoch</span>
        </div>
        <div class="batch-choice active" data-batch="8">
          <button class="btn batch-btn" type="button" data-batch="8" aria-pressed="true">batch size = 8</button>
          <span class="update-label"><span class="num">8</span> 次/epoch</span>
        </div>
        <div class="batch-choice" data-batch="64">
          <button class="btn batch-btn" type="button" data-batch="64" aria-pressed="false">batch size = 64</button>
          <span class="update-label"><span class="num">1</span> 次/epoch</span>
        </div>
      </div>

      <div class="chart-wrap min0">
        <span class="y-title">平均二元交叉熵 / nat</span>
        <div id="chart" role="img" aria-label="三列共享坐标轴的训练损失曲线，比较批次大小 1、8、64 在 epoch 0 到 30 的变化"></div>
      </div>

      <section class="readout panel" aria-label="当前训练读数" aria-live="polite">
        <div class="meter"><span class="lab">当前批次</span><span class="val" id="batch-read">8</span></div>
        <div class="meter"><span class="lab">当前 epoch</span><span class="val" id="epoch-read">30</span></div>
        <div class="meter"><span class="lab">当前损失</span><span class="val loss"><span id="loss-read">—</span><span class="unit">nat</span></span></div>
        <div class="meter"><span class="lab">每 epoch 更新次数</span><span class="val updates" id="updates-read">8</span></div>
      </section>

      <div class="control-row">
        <div class="epoch-control">
          <label for="epoch">沿训练过程查看读数</label>
          <input id="epoch" type="range" min="0" max="30" step="1" value="30">
          <output id="epoch-out" for="epoch">epoch 30</output>
        </div>
        <div class="actions">
          <button class="btn" id="replay" type="button">重放当前批次</button>
          <button class="btn" id="reset" type="button">恢复初始比较</button>
        </div>
      </div>

      <figcaption id="chart-caption">
        <span class="caption-main"><strong>怎么看：</strong>曲线记录每次参数更新后的全数据平均损失。batch size = 1 的线在一个 epoch 内留下更多细小折返；batch size = 64 每轮只走一步。</span>
        <span class="caution">本例只比较梯度噪声与更新频率；下降更快不等于某个批次大小永远最好。</span>
      </figcaption>

      <table class="sr-table">
        <caption>三种批次大小的更新频率</caption>
        <thead><tr><th>批次大小</th><th>每 epoch 更新次数</th></tr></thead>
        <tbody><tr><td>1</td><td>64</td></tr><tr><td>8</td><td>8</td></tr><tr><td>64</td><td>1</td></tr></tbody>
      </table>
    </figure>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:16,total:22});

  var batches=[1,8,64];
  var updates={1:64,8:8,64:1};
  var state={batch:8,epoch:30,playing:false};
  var curves={};
  var timer=0;

  function makeData(){
    var rng=new Math.seedrandom('42');
    var a=[];
    for(var i=0;i<64;i++){
      var x1=rng()*2-1, x2=rng()*2-1;
      a.push({x1:x1,x2:x2,y:(x1+x2>0?1:0)});
    }
    return a;
  }
  var samples=makeData();

  function train(batch){
    var w1=0,w2=0,bias=0,eta=0.20;
    var points=[];
    function sigmoid(z){return z>=0?1/(1+Math.exp(-z)):Math.exp(z)/(1+Math.exp(z));}
    function loss(){
      var sum=0;
      for(var i=0;i<samples.length;i++){
        var p=samples[i],q=sigmoid(w1*p.x1+w2*p.x2+bias);
        q=Math.max(1e-12,Math.min(1-1e-12,q));
        sum+=-(p.y*Math.log(q)+(1-p.y)*Math.log(1-q));
      }
      return sum/samples.length;
    }
    points.push([0,loss()]);
    for(var epoch=0;epoch<30;epoch++){
      for(var start=0;start<64;start+=batch){
        var n=Math.min(batch,64-start),g1=0,g2=0,gb=0;
        for(var k=start;k<start+n;k++){
          var p=samples[k],pred=sigmoid(w1*p.x1+w2*p.x2+bias),d=pred-p.y;
          g1+=d*p.x1; g2+=d*p.x2; gb+=d;
        }
        w1-=eta*g1/n; w2-=eta*g2/n; bias-=eta*gb/n;
        points.push([epoch+(start+n)/64,loss()]);
      }
    }
    return points;
  }
  function recompute(batch){curves[batch]=train(batch);}
  batches.forEach(recompute);

  var el=document.getElementById('chart');
  var chart=echarts.init(el,null,{renderer:'svg'});
  var css=getComputedStyle(document.documentElement);
  function token(n){return css.getPropertyValue(n).trim();}

  function visibleData(batch){
    var all=curves[batch];
    if(batch!==state.batch || state.epoch>=30 || !state.playing) return all;
    return all.filter(function(p){return p[0]<=state.epoch+1e-9;});
  }
  function endpoint(batch,epoch){
    var a=curves[batch],best=a[0];
    for(var i=1;i<a.length&&a[i][0]<=epoch+1e-9;i++) best=a[i];
    return best;
  }
  function seriesFor(batch,index){
    var selected=batch===state.batch;
    return {
      type:'line',name:'batch size = '+batch,xAxisIndex:index,yAxisIndex:index,
      data:visibleData(batch),showSymbol:false,silent:false,clip:true,
      sampling:'none',animation:false,
      lineStyle:{color:token('--model'),width:selected?3.5:2,opacity:selected?1:.66},
      emphasis:{lineStyle:{width:4,color:token('--model')}},
      markPoint:{silent:true,symbol:'circle',symbolSize:selected?11:8,
        itemStyle:{color:selected?token('--attention'):token('--paper-strong'),borderColor:selected?token('--attention'):token('--model'),borderWidth:2},
        label:{show:false},data:[{coord:endpoint(batch,state.epoch)}]}
    };
  }
  function render(){
    document.querySelectorAll('.batch-btn').forEach(function(btn){
      var on=Number(btn.dataset.batch)===state.batch;
      btn.setAttribute('aria-pressed',on?'true':'false');
      btn.closest('.batch-choice').classList.toggle('active',on);
    });
    document.getElementById('batch-read').textContent=state.batch;
    document.getElementById('epoch-read').textContent=state.epoch;
    document.getElementById('epoch').value=state.epoch;
    document.getElementById('epoch-out').textContent='epoch '+state.epoch;
    document.getElementById('updates-read').textContent=updates[state.batch];
    document.getElementById('loss-read').textContent=endpoint(state.batch,state.epoch)[1].toFixed(4);

    var grids=[{left:'5.2%',top:22,width:'27.2%',bottom:52},{left:'37.2%',top:22,width:'27.2%',bottom:52},{left:'69.2%',top:22,width:'27.2%',bottom:52}];
    var xAxes=batches.map(function(_,i){return {
      type:'value',gridIndex:i,min:0,max:30,interval:10,name:'epoch 0–30',nameLocation:'middle',nameGap:31,
      nameTextStyle:{fontSize:14,color:token('--muted'),fontWeight:600},
      axisLabel:{fontSize:13,color:token('--muted')},axisLine:{lineStyle:{color:token('--rule-strong'),width:1}},
      axisTick:{show:true,lineStyle:{color:token('--rule-strong')}},splitLine:{show:false}
    };});
    var yAxes=batches.map(function(_,i){return {
      type:'value',gridIndex:i,min:0,max:0.7,interval:0.1,
      axisLabel:{show:i===0,fontSize:13,color:token('--muted'),formatter:function(v){return v.toFixed(1);}},
      axisLine:{show:true,lineStyle:{color:token('--rule-strong'),width:1}},axisTick:{show:i===0},
      splitLine:{show:true,lineStyle:{color:token('--rule'),width:1,opacity:.55}}
    };});
    chart.setOption({
      backgroundColor:'transparent',textStyle:{fontFamily:token('--font-sans'),fontSize:16,color:token('--text')},
      animation:false,grid:grids,xAxis:xAxes,yAxis:yAxes,
      tooltip:{trigger:'axis',confine:true,backgroundColor:token('--paper-strong'),borderColor:token('--rule-strong'),textStyle:{fontSize:16,color:token('--text')},
        valueFormatter:function(v){return Number(v).toFixed(4)+' nat';}},
      axisPointer:{link:[{xAxisIndex:'all'}],lineStyle:{color:token('--attention'),width:1}},
      series:batches.map(seriesFor)
    },true);
  }
  function stop(){if(timer){clearInterval(timer);timer=0;}state.playing=false;}
  function play(){
    stop(); state.epoch=0; state.playing=true; render();
    if(Deck.reduced()){state.epoch=30;state.playing=false;render();return;}
    timer=setInterval(function(){
      state.epoch+=1;
      if(state.epoch>=30){state.epoch=30;stop();}
      render();
    },85);
  }
  function selectBatch(batch){stop();state.batch=batch;recompute(batch);play();}

  document.querySelectorAll('.batch-btn').forEach(function(btn){
    btn.addEventListener('click',function(){selectBatch(Number(btn.dataset.batch));});
  });
  document.getElementById('epoch').addEventListener('input',function(){stop();state.epoch=Number(this.value);render();});
  document.getElementById('replay').addEventListener('click',function(){recompute(state.batch);play();});
  document.getElementById('reset').addEventListener('click',function(){stop();batches.forEach(recompute);state={batch:8,epoch:30,playing:false};render();});

  var ro=new ResizeObserver(function(){chart.resize();});
  ro.observe(el);
  window.addEventListener('beforeunload',function(){stop();ro.disconnect();chart.dispose();},{once:true});
  render();
})();
</script>
</body>
</html>
