<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一个神经元学不会 XOR</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{background-image:none}
#xor-widget{flex:1;min-height:0;display:flex;flex-direction:column}
#xor-widget .page-head{flex:0 0 auto;padding:0 0 18px;border-bottom:2px solid var(--rule-strong)}
#xor-widget .page-head h1{margin-bottom:8px}
#xor-widget .page-head .lead{margin:0;max-width:980px;color:var(--muted)}
#xor-widget .matrix{flex:1;min-height:0;padding-top:20px;grid-template-columns:minmax(0,1fr) 390px;gap:32px}
#xor-widget .plot-shell{position:relative;min-height:0;display:flex;flex-direction:column;border:2px solid var(--rule-strong);border-radius:var(--radius);background:var(--paper)}
#xor-widget .plot-top{height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--rule)}
#xor-widget .plot-top strong{font-family:var(--font-display);font-size:var(--fs-body)}
#xor-widget .plot-top .hint{margin:0}
#xor-widget .svg-wrap{flex:1;min-height:0;position:relative}
#xor-widget svg{display:block;width:100%;height:100%;touch-action:none;user-select:none}
#xor-widget .axis{stroke:var(--rule-strong);stroke-width:2}
#xor-widget .guide{stroke:var(--rule);stroke-width:1;stroke-dasharray:5 7}
#xor-widget .boundary{stroke:var(--model);stroke-width:7;stroke-linecap:round;cursor:grab}
#xor-widget .boundary:active{cursor:grabbing}
#xor-widget .handle{fill:var(--paper-strong);stroke:var(--attention);stroke-width:5;cursor:crosshair}
#xor-widget .pt0{fill:var(--paper-strong);stroke:var(--target);stroke-width:6}
#xor-widget .pt1{fill:var(--target);stroke:var(--target);stroke-width:4}
#xor-widget .wrong-ring{fill:none;stroke:var(--attention);stroke-width:4;stroke-dasharray:7 5}
#xor-widget .coord{font-family:var(--font-num);font-size:17px;fill:var(--muted)}
#xor-widget .truth{font-family:var(--font-display);font-size:22px;font-weight:700;fill:var(--target)}
#xor-widget .pred{font-family:var(--font-num);font-size:15px;font-weight:650;fill:var(--model)}
#xor-widget .axis-label{font-family:var(--font-display);font-size:18px;font-weight:700;fill:var(--text)}
#xor-widget .rail{min-height:0;display:flex;flex-direction:column;justify-content:flex-start;padding-left:28px}
#xor-widget .readout{padding-bottom:18px;border-bottom:2px solid var(--rule-strong)}
#xor-widget .readout-label{display:block;color:var(--muted);font-size:var(--fs-label);font-weight:700;letter-spacing:.05em}
#xor-widget .score-row{display:flex;align-items:end;gap:12px;margin:8px 0 4px}
#xor-widget .score-row .big{color:var(--attention)}
#xor-widget .score-row .denom{padding-bottom:8px;color:var(--muted);font-size:var(--fs-sec)}
#xor-widget .best{margin:0;color:var(--muted);font-size:var(--fs-sec)}
#xor-widget .best strong{color:var(--text);font-family:var(--font-num)}
#xor-widget .explain{padding:18px 0 14px;border-bottom:1px solid var(--rule)}
#xor-widget .explain h2{margin-bottom:8px}
#xor-widget .explain p{margin:0;font-size:var(--fs-sec);line-height:1.48}
#xor-widget .equation{display:block;margin:12px 0 0;padding:10px 0;color:var(--model);font-size:17px;border-top:1px solid var(--rule)}
#xor-widget .controls{padding-top:16px}
#xor-widget .controls .ctl{grid-template-columns:72px minmax(120px,1fr) 70px;margin:8px 0}
#xor-widget .controls label{font-weight:650}
#xor-widget .btns{margin-top:12px}
#xor-widget .btn{flex:1}
#xor-widget .result-note{margin-top:auto;padding-top:14px;border-top:1px solid var(--rule);color:var(--muted);font-size:var(--fs-label);line-height:1.42}
#xor-widget .result-note strong{color:var(--gradient)}
#xor-widget .sr-status{position:absolute}
</style>
</head>
<body data-page="17" data-total="22">
<div id="stage">
  <main id="xor-widget">
    <header class="page-head">
      <span class="kicker">表示能力 · XOR</span>
      <h1>一个神经元学不会 XOR</h1>
      <p class="lead">拖动直线、转动方向，试着把标签 <span class="is-target">0</span> 与 <span class="is-target">1</span> 完全分开。</p>
    </header>

    <section class="matrix min0" aria-label="XOR 线性分类实验">
      <div class="plot-shell min0">
        <div class="plot-top">
          <strong>四点平面</strong>
          <p class="hint">拖直线平移；拖橙色端点旋转</p>
        </div>
        <div class="svg-wrap min0">
          <svg id="xor-plane" viewBox="0 0 900 590" role="img" aria-labelledby="plot-title plot-desc">
            <title id="plot-title">XOR 四点与可拖动的直线边界</title>
            <desc id="plot-desc">四个点位于正方形四角，对角点标签相同。蓝色直线代表单神经元的零点五分类边界。</desc>
            <rect x="145" y="45" width="620" height="500" fill="none" stroke="var(--rule)" stroke-width="2"/>
            <line class="guide" x1="300" y1="45" x2="300" y2="545"/>
            <line class="guide" x1="650" y1="45" x2="650" y2="545"/>
            <line class="guide" x1="145" y1="450" x2="765" y2="450"/>
            <line class="guide" x1="145" y1="130" x2="765" y2="130"/>
            <line class="axis" x1="145" y1="545" x2="785" y2="545"/>
            <line class="axis" x1="145" y1="545" x2="145" y2="28"/>
            <text class="axis-label" x="790" y="552">x₁</text>
            <text class="axis-label" x="128" y="25">x₂</text>
            <text class="coord" x="294" y="572">0</text>
            <text class="coord" x="644" y="572">1</text>
            <text class="coord" x="116" y="456">0</text>
            <text class="coord" x="116" y="136">1</text>
            <g id="point-layer"></g>
            <line id="boundary" class="boundary" tabindex="0" role="slider" aria-label="平移分类边界" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0" x1="145" y1="290" x2="765" y2="290"/>
            <circle id="rotate-handle" class="handle" tabindex="0" role="slider" aria-label="旋转分类边界" aria-valuemin="-180" aria-valuemax="180" aria-valuenow="90" cx="745" cy="290" r="13"/>
          </svg>
        </div>
      </div>

      <aside class="rail min0" aria-live="polite">
        <div class="readout">
          <span class="readout-label">当前错分点</span>
          <div class="score-row"><output id="error-count" class="big">2</output><span class="denom">/ 4 个点</span></div>
          <p class="best">本次拖动最低：<strong id="best-count">2</strong></p>
        </div>

        <div class="explain">
          <h2 id="verdict">还没有完全分开</h2>
          <p id="reason">边界两侧各混有一个标签 0 和一个标签 1。</p>
          <span class="equation formula">σ(w·x+b) = 0.5</span>
        </div>

        <div class="controls" aria-label="分类边界精确控制">
          <div class="ctl">
            <label for="angle">边界角度</label>
            <input id="angle" type="range" min="-180" max="180" step="1" value="0">
            <output id="angle-out">0°</output>
          </div>
          <div class="ctl">
            <label for="offset">法向位置</label>
            <input id="offset" type="range" min="-100" max="100" step="1" value="0">
            <output id="offset-out">0.00</output>
          </div>
          <div class="btns">
            <button id="search" class="btn" type="button">穷尽搜索最佳直线</button>
            <button id="reset" class="btn" type="button">复位到 x₂=0.5</button>
          </div>
        </div>

        <p class="result-note"><strong>限制来自表示能力：</strong>任意单神经元的 0.5 边界都是直线；XOR 的同类点分处对角，最低仍错分 1 点。</p>
      </aside>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script>
(() => {
  'use strict';
  const root = document.getElementById('xor-widget');
  const svg = root.querySelector('#xor-plane');
  const line = root.querySelector('#boundary');
  const handle = root.querySelector('#rotate-handle');
  const layer = root.querySelector('#point-layer');
  const angleInput = root.querySelector('#angle');
  const offsetInput = root.querySelector('#offset');
  const angleOut = root.querySelector('#angle-out');
  const offsetOut = root.querySelector('#offset-out');
  const errorOut = root.querySelector('#error-count');
  const bestOut = root.querySelector('#best-count');
  const verdict = root.querySelector('#verdict');
  const reason = root.querySelector('#reason');
  const rail = root.querySelector('.rail');
  const searchBtn = root.querySelector('#search');
  const resetBtn = root.querySelector('#reset');

  const points = [
    {x:0,y:0,t:0,key:'(0,0)'}, {x:0,y:1,t:1,key:'(0,1)'},
    {x:1,y:0,t:1,key:'(1,0)'}, {x:1,y:1,t:0,key:'(1,1)'}
  ];
  const box = {xmin:-0.443, xmax:1.329, ymin:-0.297, ymax:1.266};
  const mapX = x => 300 + x * 350;
  const mapY = y => 450 - y * 320;
  const unmapX = x => (x - 300) / 350;
  const unmapY = y => (450 - y) / 320;
  const state = {theta:Math.PI/2, b:0, best:2, drag:null};

  function classify(p, theta=state.theta, b=state.b){
    const nX=Math.cos(theta), nY=Math.sin(theta);
    return nX*(p.x-.5)+nY*(p.y-.5) >= b ? 1 : 0;
  }
  function errors(theta=state.theta,b=state.b){
    return points.reduce((n,p)=>n+(classify(p,theta,b)!==p.t),0);
  }
  function endpoints(theta,b){
    const nx=Math.cos(theta), ny=Math.sin(theta), hits=[];
    const add=(x,y)=>{ if(x>=box.xmin-.001&&x<=box.xmax+.001&&y>=box.ymin-.001&&y<=box.ymax+.001&&!hits.some(q=>Math.hypot(q.x-x,q.y-y)<.001)) hits.push({x,y}); };
    if(Math.abs(ny)>.0001){ add(box.xmin,.5+(b-nx*(box.xmin-.5))/ny); add(box.xmax,.5+(b-nx*(box.xmax-.5))/ny); }
    if(Math.abs(nx)>.0001){ add(.5+(b-ny*(box.ymin-.5))/nx,box.ymin); add(.5+(b-ny*(box.ymax-.5))/nx,box.ymax); }
    if(hits.length<2) return [{x:box.xmin,y:.5},{x:box.xmax,y:.5}];
    let pair=[hits[0],hits[1]], max=0;
    for(let i=0;i<hits.length;i++) for(let j=i+1;j<hits.length;j++){
      const d=(hits[i].x-hits[j].x)**2+(hits[i].y-hits[j].y)**2;
      if(d>max){max=d;pair=[hits[i],hits[j]];}
    }
    return pair;
  }
  function render(announce=false){
    const ep=endpoints(state.theta,state.b);
    line.setAttribute('x1',mapX(ep[0].x)); line.setAttribute('y1',mapY(ep[0].y));
    line.setAttribute('x2',mapX(ep[1].x)); line.setAttribute('y2',mapY(ep[1].y));
    const hp=ep[1]; handle.setAttribute('cx',mapX(hp.x)); handle.setAttribute('cy',mapY(hp.y));
    const deg=Math.round((state.theta*180/Math.PI)-90);
    const wrapped=((deg+180)%360+360)%360-180;
    angleInput.value=wrapped; offsetInput.value=Math.round(state.b*100);
    angleOut.textContent=wrapped+'°'; offsetOut.textContent=state.b.toFixed(2);
    line.setAttribute('aria-valuenow',Math.round(state.b*100));
    handle.setAttribute('aria-valuenow',wrapped);

    let markup='';
    points.forEach(p=>{
      const px=mapX(p.x), py=mapY(p.y), pred=classify(p), wrong=pred!==p.t;
      markup += `<g aria-label="${p.key}，标签 ${p.t}，预测 ${pred}${wrong?'，错分':''}">`+
        (wrong?`<circle class="wrong-ring" cx="${px}" cy="${py}" r="34"/>`:'')+
        `<circle class="pt${p.t}" cx="${px}" cy="${py}" r="21"/>`+
        `<text class="truth" x="${px}" y="${py+8}" text-anchor="middle" style="fill:${p.t?'var(--paper-strong)':'var(--target)'}">${p.t}</text>`+
        `<text class="coord" x="${px}" y="${py-38}" text-anchor="middle">${p.key} → ${p.t}</text>`+
        `<text class="pred" x="${px}" y="${py+52}" text-anchor="middle">预测 ${pred}</text></g>`;
    });
    layer.innerHTML=markup;
    const e=errors(); state.best=Math.min(state.best,e);
    errorOut.textContent=e; bestOut.textContent=state.best;
    if(e===1){ verdict.textContent='最低仍错分 1 点'; reason.textContent='旋转或平移能换掉错分对象，却不能让四点同时正确。'; }
    else if(e===2){ verdict.textContent='两点仍在错误一侧'; reason.textContent='边界两侧各混入了一个相反标签。继续旋转或平移。'; }
    else { verdict.textContent='这条线错得更多'; reason.textContent='平移越过数据点会改变预测，但不会得到零错分。'; }
    if(announce) rail.setAttribute('aria-label',`当前错分 ${e} 点，本次最低 ${state.best} 点。`);
  }
  function svgPoint(e){
    const p=Deck.pt(svg,e);
    return {x:p.x*900/svg.offsetWidth, y:p.y*590/svg.offsetHeight};
  }
  function beginDrag(kind,e){
    e.preventDefault(); e.currentTarget.setPointerCapture(e.pointerId);
    const p=svgPoint(e);
    state.drag={kind,id:e.pointerId,start:p,b:state.b,theta:state.theta};
  }
  line.addEventListener('pointerdown',e=>beginDrag('move',e));
  handle.addEventListener('pointerdown',e=>beginDrag('rotate',e));
  svg.addEventListener('pointermove',e=>{
    if(!state.drag||state.drag.id!==e.pointerId)return;
    const p=svgPoint(e), d=state.drag;
    if(d.kind==='move'){
      const dx=unmapX(p.x)-unmapX(d.start.x), dy=unmapY(p.y)-unmapY(d.start.y);
      state.b=Deck.clamp(d.b+Math.cos(d.theta)*dx+Math.sin(d.theta)*dy,-1,1);
    }else{
      const cp={x:.5+state.b*Math.cos(state.theta),y:.5+state.b*Math.sin(state.theta)};
      const q={x:unmapX(p.x),y:unmapY(p.y)};
      const dir=Math.atan2(q.y-cp.y,q.x-cp.x);
      state.theta=dir+Math.PI/2;
      state.b=Math.cos(state.theta)*(cp.x-.5)+Math.sin(state.theta)*(cp.y-.5);
    }
    render(false);
  });
  function endDrag(e){ if(state.drag&&state.drag.id===e.pointerId){state.drag=null;render(true);} }
  svg.addEventListener('pointerup',endDrag); svg.addEventListener('pointercancel',endDrag);

  angleInput.addEventListener('input',()=>{state.theta=(Number(angleInput.value)+90)*Math.PI/180;render(true);});
  offsetInput.addEventListener('input',()=>{state.b=Number(offsetInput.value)/100;render(true);});
  root.querySelector('.controls').addEventListener('keydown',e=>{if(e.key.startsWith('Arrow'))e.stopPropagation();});
  line.addEventListener('keydown',e=>{
    if(!['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key))return;
    e.preventDefault(); e.stopPropagation(); state.b=Deck.clamp(state.b+((e.key==='ArrowUp'||e.key==='ArrowRight')?.03:-.03),-1,1); render(true);
  });
  handle.addEventListener('keydown',e=>{
    if(!['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key))return;
    e.preventDefault(); e.stopPropagation(); state.theta+=((e.key==='ArrowUp'||e.key==='ArrowRight')?1:-1)*Math.PI/90; render(true);
  });
  searchBtn.addEventListener('click',()=>{
    let best={e:5,theta:0,b:0};
    for(let deg=-180;deg<180;deg++){
      const t=deg*Math.PI/180, vals=points.map(p=>Math.cos(t)*(p.x-.5)+Math.sin(t)*(p.y-.5)).sort((a,b)=>a-b);
      const candidates=[vals[0]-.05,...vals.slice(0,-1).map((v,i)=>(v+vals[i+1])/2),vals[3]+.05];
      for(const b of candidates){const e=errors(t,b);if(e<best.e)best={e,theta:t,b};}
    }
    state.theta=best.theta;state.b=best.b;state.best=best.e;render(true);
    rail.setAttribute('aria-label',`穷尽直线位置与方向后，最低错分 ${best.e} 点。`);
  });
  resetBtn.addEventListener('click',()=>{state.theta=Math.PI/2;state.b=0;state.best=2;render(true);rail.setAttribute('aria-label','已复位到水平边界 x₂ 等于 0.5。当前错分 2 点。');});
  render(false);
  Deck.init({index:17,total:22});
})();
</script>
</body>
</html>
