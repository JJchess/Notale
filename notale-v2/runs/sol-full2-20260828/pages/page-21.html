<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>最后一题：你能预测更新方向吗？</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage { gap: 24px; }
    .page-head { flex: 0 0 auto; max-width: 1160px; }
    .page-head h1 { margin-bottom: 8px; }
    .page-head .lead { margin: 0; color: var(--muted); }

    #direction-quiz { flex: 1; min-height: 0; }
    #direction-quiz.split { grid-template-columns: minmax(0, 1.48fr) minmax(420px, .72fr); gap: 54px; }
    #direction-quiz .evidence { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
    #direction-quiz .case-line { display: flex; align-items: baseline; gap: 30px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: var(--line) solid var(--rule-strong); }
    #direction-quiz .case-item { display: flex; align-items: baseline; gap: 8px; color: var(--muted); font-size: var(--fs-sec); }
    #direction-quiz .case-item strong { color: var(--text); font-family: var(--font-num); font-size: 30px; line-height: 1; }
    #direction-quiz .case-item.target strong { color: var(--target); }
    #direction-quiz .case-item.model strong { color: var(--model); }

    #direction-quiz .chain { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 54px minmax(0, 1.06fr); align-items: stretch; }
    #direction-quiz .calc { min-width: 0; padding: 28px 28px 24px; border: var(--line) solid var(--rule-strong); background: var(--paper); }
    #direction-quiz .calc:first-child { border-radius: var(--radius) 0 0 var(--radius); }
    #direction-quiz .calc:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
    #direction-quiz .calc-label { display: block; margin-bottom: 18px; color: var(--muted); font-size: var(--fs-label); font-weight: 700; letter-spacing: .03em; }
    #direction-quiz .formula { margin: 0; font-size: 30px; line-height: 1.32; white-space: nowrap; }
    #direction-quiz .formula + .formula { margin-top: 10px; }
    #direction-quiz .formula .neg { color: var(--gradient); font-weight: 700; }
    #direction-quiz .bridge { position: relative; align-self: center; height: 4px; background: var(--gradient); }
    #direction-quiz .bridge::after { content: ""; position: absolute; right: -1px; top: -7px; border-left: 13px solid var(--gradient); border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
    #direction-quiz .bridge-label { position: absolute; left: 50%; top: -31px; transform: translateX(-50%); color: var(--muted); font-size: var(--fs-label); white-space: nowrap; }
    #direction-quiz .sign-reading { margin: 0; padding: 15px 18px; border-top: 1px solid var(--rule); color: var(--muted); font-size: var(--fs-sec); }
    #direction-quiz .sign-reading strong { color: var(--gradient); }

    #direction-quiz .side { min-width: 0; justify-content: center; padding-left: 32px; border-left: var(--line) solid var(--rule-strong); }
    #direction-quiz .question { margin-bottom: 18px; }
    #direction-quiz .question h2 { margin-bottom: 8px; }
    #direction-quiz .question p { margin: 0; color: var(--muted); font-size: var(--fs-sec); }
    #direction-quiz .quiz { gap: 12px; }
    #direction-quiz .opt { background: rgba(248,251,253,.48); }
    #direction-quiz .opt:focus-visible,
    #direction-quiz .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    #direction-quiz .actions { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
    #direction-quiz #submit { border-color: var(--attention); }
    #direction-quiz #reset[hidden] { display: none; }
    #direction-quiz .fb { margin-top: 18px; min-height: 80px; color: var(--text); }
    #direction-quiz .fb strong { color: var(--gradient); }
    #direction-quiz .follow { margin: 12px 0 0; color: var(--muted); font-size: var(--fs-sec); }
    #direction-quiz .follow strong { color: var(--text); }
    #direction-quiz .state-note { min-height: 24px; margin: 10px 0 0; color: var(--muted); font-size: var(--fs-label); }
  </style>
</head>
<body data-page="21" data-total="22">
  <div id="stage">
    <header class="page-head">
      <span class="kicker">迁移检查</span>
      <h1>最后一题：你能预测更新方向吗？</h1>
      <p class="lead">先看梯度的符号，再把它代入更新式。</p>
    </header>

    <main id="direction-quiz" class="split" aria-labelledby="quiz-title">
      <section class="evidence min0" aria-label="题面与梯度推导">
        <div class="case-line" aria-label="单样本条件">
          <span class="tag">单样本</span>
          <span class="case-item target">标签 <strong>y = 1</strong></span>
          <span class="case-item model">预测 <strong>ŷ = 0.20</strong></span>
          <span class="case-item">输入 <strong>x = 3.0</strong></span>
        </div>

        <div class="chain" aria-label="从局部梯度算到权重梯度">
          <div class="calc">
            <span class="calc-label">sigmoid 配二元交叉熵</span>
            <p class="formula">∂L/∂z = ŷ − y</p>
            <p class="formula">= 0.20 − 1 = <span class="neg">−0.80</span></p>
          </div>
          <div class="bridge" aria-hidden="true"><span class="bridge-label">乘以 x</span></div>
          <div class="calc">
            <span class="calc-label">权重的局部梯度</span>
            <p class="formula">∂L/∂w = (−0.80)(3.0)</p>
            <p class="formula">= <span class="neg">−2.40</span></p>
          </div>
        </div>

        <p class="sign-reading">已知 <strong>∂L/∂w 为负</strong>。现在只需判断更新式会把 w 推向哪边。</p>
      </section>

      <section class="side min0" aria-label="方向选择">
        <div class="question">
          <h2 id="quiz-title">更新后，w 怎么变？</h2>
          <p>选中一个方向，再提交判断。</p>
        </div>

        <div class="quiz" role="radiogroup" aria-labelledby="quiz-title">
          <button class="opt" type="button" role="radio" aria-checked="false" data-value="up">w 增大</button>
          <button class="opt" type="button" role="radio" aria-checked="false" data-value="same">w 不变</button>
          <button class="opt" type="button" role="radio" aria-checked="false" data-value="down">w 减小</button>
        </div>

        <p class="state-note" id="state-note" aria-live="polite">尚未选择</p>
        <div class="actions">
          <button class="btn" id="submit" type="button" disabled>提交判断</button>
          <button class="btn" id="reset" type="button" hidden>重做</button>
        </div>

        <div class="fb" id="feedback" role="status" aria-live="polite" hidden>
          <strong>w ← w − η(−2.40)</strong>，只要 η &gt; 0，w 增大。
          <p class="follow">若 <strong>x = −3.0</strong>，方向会反过来。</p>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script>
    (() => {
      const root = document.getElementById('direction-quiz');
      const options = Array.from(root.querySelectorAll('.opt'));
      const submit = root.querySelector('#submit');
      const reset = root.querySelector('#reset');
      const feedback = root.querySelector('#feedback');
      const stateNote = root.querySelector('#state-note');
      let selected = null;
      let submitted = false;

      function render() {
        options.forEach((option) => {
          const isSelected = option.dataset.value === selected;
          option.setAttribute('aria-checked', String(isSelected));
          option.classList.toggle('is-selected', isSelected);
          option.disabled = submitted;
          option.removeAttribute('data-result');
          if (submitted && option.dataset.value === 'up') option.dataset.result = 'correct';
          if (submitted && isSelected && option.dataset.value !== 'up') option.dataset.result = 'incorrect';
        });
        submit.disabled = !selected || submitted;
        submit.hidden = submitted;
        reset.hidden = !submitted;
        feedback.hidden = !submitted;
        if (!selected) stateNote.textContent = '尚未选择';
        else if (!submitted) stateNote.textContent = `已选择“${options.find(o => o.dataset.value === selected).textContent}”，尚未提交`;
        else stateNote.textContent = selected === 'up' ? '判断正确' : '请沿更新式检查减去负数的结果';
      }

      function select(option) {
        if (submitted) return;
        selected = option.dataset.value;
        render();
      }

      options.forEach((option, index) => {
        option.addEventListener('click', () => select(option));
        option.addEventListener('keydown', (event) => {
          if (!['ArrowDown', 'ArrowRight', 'ArrowUp', 'ArrowLeft'].includes(event.key)) return;
          event.preventDefault();
          const step = (event.key === 'ArrowDown' || event.key === 'ArrowRight') ? 1 : -1;
          const next = options[(index + step + options.length) % options.length];
          next.focus();
          select(next);
        });
      });

      submit.addEventListener('click', () => {
        if (!selected || submitted) return;
        submitted = true;
        render();
        reset.focus();
      });

      reset.addEventListener('click', () => {
        selected = null;
        submitted = false;
        render();
        options[0].focus();
      });

      render();
      Deck.init({ index: 21, total: 22 });
    })();
  </script>
</body>
</html>
