<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>把“学会”还原成四句话</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .page-head{flex:0 0 auto;padding-bottom:16px;border-bottom:2px solid var(--rule-strong)}
    .page-head h1{margin-bottom:0}
    .closing{flex:1;min-height:0;padding-top:24px;grid-template-columns:minmax(0,1.48fr) minmax(360px,.52fr);gap:34px}
    .summary{min-height:0;display:flex;align-items:stretch}
    .summary .k-generalization{width:100%;grid-template-columns:minmax(390px,.94fr) minmax(0,1.06fr);gap:46px}
    .summary .k-generalization .trunk{left:calc(47% - 1px);top:7%;bottom:7%}
    .summary .claim{padding:28px 30px;border-color:var(--text);font-size:25px;line-height:1.48;background:var(--paper)}
    .claim .equation{display:block;margin-bottom:14px;color:var(--model);font-family:var(--font-display);font-size:19px;letter-spacing:.02em}
    .summary .supports{gap:12px}
    .summary .support{min-height:102px;padding:15px 16px 14px 20px;border-bottom:2px solid var(--rule);display:flex;flex-direction:column;justify-content:center}
    .summary .support::before{left:-46px;width:34px}
    .support strong{display:block;margin-bottom:4px;font-family:var(--font-display);font-size:19px;line-height:1.25}
    .support .detail{color:var(--muted);font-size:16px;line-height:1.38}
    .side{min-width:0;justify-content:center}
    .takeaway{padding:24px 24px 22px;border:2px solid var(--rule-strong);border-radius:var(--radius);background:var(--paper);box-shadow:0 5px 14px var(--shadow)}
    .takeaway h2{margin-bottom:18px}
    .checkpath{list-style:none;margin:0;padding:0;counter-reset:path}
    .checkpath li{position:relative;padding:12px 0 12px 42px;border-top:1px solid var(--rule);font-size:18px;font-weight:650;line-height:1.35}
    .checkpath li:first-child{border-top:0}
    .checkpath li::before{counter-increment:path;content:counter(path);position:absolute;left:0;top:11px;width:26px;height:26px;border:2px solid var(--text);border-radius:50%;display:grid;place-items:center;font:650 14px/1 var(--font-num);color:var(--text)}
    .finish{margin-top:22px;padding-top:18px;border-top:2px solid var(--rule-strong)}
    .finish-label{display:block;margin-bottom:7px;color:var(--muted);font-size:15px;font-weight:700;letter-spacing:.06em}
    .finish p{margin:0;font-size:19px;line-height:1.42;font-weight:700}
    .route-note{margin:18px 2px 0;color:var(--muted);font-size:16px;line-height:1.45}
  </style>
</head>
<body data-page="22" data-total="22">
  <div id="stage">
    <header class="page-head">
      <span class="kicker">课程收束</span>
      <h1>把“学会”还原成四句话</h1>
    </header>

    <main class="closing min0" aria-labelledby="main-claim">
      <section class="summary min0" aria-label="从单神经元到多层网络的共同主干">
        <div class="k-generalization min0">
          <div class="trunk" aria-hidden="true"></div>
          <div class="claim min0" id="main-claim">
            <span class="equation">神经网络学习 =</span>
            用损失衡量预测，再用反向传播计算每个参数的责任，沿负梯度小步更新
          </div>
          <div class="supports min0">
            <div class="support">
              <strong>一个神经元</strong>
              <span class="detail formula">z = w·x + b</span>
            </div>
            <div class="support">
              <strong>前向传播</strong>
              <span class="detail">保存中间值</span>
            </div>
            <div class="support">
              <strong>反向传播</strong>
              <span class="detail">链式法则复用局部导数</span>
            </div>
            <div class="support">
              <strong>隐藏层</strong>
              <span class="detail">学习可组合的新表示</span>
            </div>
          </div>
        </div>
      </section>

      <aside class="side min0" aria-label="可带走的检查路径">
        <div class="takeaway">
          <span class="kicker">可带走的检查路径</span>
          <h2>逐项定位一轮学习</h2>
          <ol class="checkpath">
            <li>形状对不对？</li>
            <li>前向值对不对？</li>
            <li>局部导数对不对？</li>
            <li>更新方向对不对？</li>
          </ol>
          <div class="finish">
            <span class="finish-label">本课完成标准</span>
            <p>能手算 page-11 至 page-14 的一轮</p>
          </div>
        </div>
        <p class="route-note">网络变深后，核心机制不变；新增的是更多中间值与可组合表示。</p>
      </aside>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:22,total:22});</script>
</body>
</html>
