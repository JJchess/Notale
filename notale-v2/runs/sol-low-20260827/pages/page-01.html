<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{display:flex;flex-direction:column;gap:0;overflow:hidden;}
  .opening-head{height:196px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-bottom:1px solid var(--line);}
  .kicker{font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;letter-spacing:.16em;color:var(--muted);margin:0 0 18px;}
  h1{max-width:1160px;margin:0;font-family:var(--font-sans);font-size:var(--fs-h1);line-height:1.28;letter-spacing:.01em;font-weight:750;color:var(--text);}
  .relationship{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding-top:48px;}
  .trunk{width:1020px;height:76px;position:relative;display:flex;justify-content:center;align-items:flex-start;}
  .trunk::before,.trunk::after{display:none;}
  .relation-lines{position:absolute;top:0;left:50%;width:1320px;height:454px;transform:translateX(-50%);pointer-events:none;}
  .relation-lines path{fill:none;stroke:var(--text);stroke-width:2;}
  .branches{position:relative;width:1320px;display:grid;grid-template-columns:repeat(3,1fr);align-items:stretch;border:1px solid var(--text);background:var(--panel-bg);}
  .ledger-grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .ledger-grid line{stroke:var(--line);stroke-width:1;}
  .support{z-index:1;}
  .support{position:relative;min-width:0;height:330px;display:flex;flex-direction:column;align-items:center;padding:34px 34px 26px;text-align:center;}
  .support + .support{border-left:1px solid var(--text);}
  .support::before{display:none;}
  .tag{align-self:flex-start;display:flex;gap:8px;align-items:center;font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;letter-spacing:.04em;}
  .mark{height:116px;width:220px;margin:18px auto 12px;display:flex;align-items:center;justify-content:center;color:var(--text);}
  .support p{margin:0;max-width:340px;font-size:var(--fs-lead);line-height:1.45;font-weight:650;display:flex;flex-direction:column;align-items:center;}
  .dial{position:relative;width:104px;height:104px;border:2px solid var(--text);border-radius:50%;}
  .dial::before{content:"";position:absolute;width:3px;height:38px;background:var(--text);left:50%;bottom:50%;transform-origin:50% 100%;transform:translateX(-50%) rotate(36deg);}
  .dial::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--text);left:50%;top:50%;transform:translate(-50%,-50%);}
  .ticks{position:absolute;inset:-15px;border-radius:50%;background:repeating-conic-gradient(from -60deg,var(--text) 0 1deg,transparent 1deg 15deg);mask:radial-gradient(circle,transparent 0 55px,#000 56px 63px,transparent 64px);-webkit-mask:radial-gradient(circle,transparent 0 55px,#000 56px 63px,transparent 64px);}
  .ledger-mark{width:214px;height:78px;border:1px solid var(--text);display:grid;grid-template-columns:1fr 42px 1fr;align-items:center;font-size:var(--fs-label);font-weight:700;}
  .ledger-mark span{display:flex;align-items:center;justify-content:center;height:100%;}
  .ledger-mark .arrow{font-size:30px;color:var(--focus);font-weight:500;}
  .cycle{width:206px;height:104px;overflow:visible;}
  .cycle path{fill:none;stroke:var(--text);stroke-width:2.2;stroke-linecap:square;stroke-linejoin:miter;}
  .closing{height:136px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:64px;align-items:center;padding:0 72px;}
  .takeaway{font-family:var(--font-serif);font-size:var(--fs-lead);line-height:1.45;margin:0;max-width:900px;}
  .next{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.4;text-align:right;white-space:nowrap;}
  .next strong{display:block;color:var(--text);font-size:var(--fs-body);margin-top:5px;}
</style>
</head>
<body data-page="01" data-total="21">
<div id="stage">
  <header class="opening-head">
    <p class="kicker">OPENING NOTE</p>
    <h1>神经网络的“学习”，可以拆成几次看得见的参数修改</h1>
  </header>

  <main class="relationship k-generalization focus min0" aria-label="一条主张由可调、可见、可重复三点支撑">
    <svg class="relation-lines" viewBox="0 0 1320 454" preserveAspectRatio="none" aria-hidden="true">
      <path d="M660 0 V28 H220 V124 M660 28 V124 M1100 28 V124"/>
    </svg>
    <div class="trunk" aria-hidden="true"></div>
    <div class="branches">
      <svg class="ledger-grid" viewBox="0 0 1320 330" preserveAspectRatio="none" aria-hidden="true">
        <line x1="0" y1="88" x2="1320" y2="88"/>
        <line x1="0" y1="250" x2="1320" y2="250"/>
      </svg>
      <section class="support min0">
        <span class="tag"><span>01</span><span>可调</span></span>
        <div class="mark" aria-hidden="true"><div class="dial"><div class="ticks"></div></div></div>
        <p><span>模型里有</span><span>可以改变的参数</span></p>
      </section>
      <section class="support min0">
        <span class="tag"><span>02</span><span>可见</span></span>
        <div class="mark" aria-hidden="true">
          <div class="ledger-mark"><span>修改前</span><span class="arrow">→</span><span>修改后</span></div>
        </div>
        <p><span>每次修改前后</span><span>都能留下记录</span></p>
      </section>
      <section class="support min0">
        <span class="tag"><span>03</span><span>可重复</span></span>
        <div class="mark" aria-hidden="true">
          <svg class="cycle" viewBox="0 0 206 104" role="img" aria-label="三段首尾相接的循环箭头">
            <defs><marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="var(--text)" stroke-width="1.5"/></marker></defs>
            <path d="M42 76 Q15 48 43 22 Q68 4 99 18" marker-end="url(#arrowhead)"/>
            <path d="M111 18 Q153 3 176 34 Q190 55 173 76" marker-end="url(#arrowhead)"/>
            <path d="M162 84 Q103 112 48 84" marker-end="url(#arrowhead)"/>
          </svg>
        </div>
        <p><span>同样的动作</span><span>可以一轮轮继续</span></p>
      </section>
    </div>
  </main>

  <footer class="closing">
    <p class="takeaway">它不是突然“懂了”，而是在一次次尝试后修改可调参数。</p>
    <p class="next">下一问<strong>这些修改串起来，究竟经过哪几步？</strong></p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:1,total:21});</script>
</body>
</html>
