<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="02" data-total="21">
<div id="stage" data-state="entering">
  <style>
    #stage{display:flex;flex-direction:column;overflow:hidden;color:var(--text)}
    .p02-head{height:116px;flex:0 0 116px;display:flex;flex-direction:column;justify-content:flex-start;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--text) 14%,var(--bg));margin: -28px -56px 0;padding:28px 56px 0}
    .p02-kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.12em;color:var(--action);margin:0 0 10px}
    .p02-head h1{font:700 var(--fs-h1)/1.18 var(--font-sans);letter-spacing:-.02em;margin:0;max-width:1320px}
    .p02-main{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:26px}
    .p02-route{position:relative;flex:1;min-height:0;padding:42px 0 84px;background:linear-gradient(to bottom,transparent 0,transparent 24px,color-mix(in srgb,var(--text) 5%,var(--bg)) 24px,color-mix(in srgb,var(--text) 5%,var(--bg)) 94px,transparent 94px)}
    .p02-axis{position:absolute;left:34px;right:34px;top:66px;height:4px;background:var(--line);z-index:0}
    .p02-axis::before{content:"";position:absolute;left:-4px;top:-5px;width:14px;height:14px;background:var(--text)}
    .p02-axis-label{position:absolute;left:34px;top:30px;font:700 var(--fs-label)/1 var(--font-sans);color:var(--muted);letter-spacing:.08em}
    .stage-cards{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:38px;height:410px;margin-top:42px}
    .step{position:relative;min-width:0;background:color-mix(in srgb,var(--text) 18%,var(--bg));border:1px solid var(--text);padding:26px 24px 24px;display:flex;flex-direction:column;opacity:0;transform:translateX(-16px);transition:opacity 220ms ease-out,transform 220ms cubic-bezier(.22,.8,.3,1)}
    #stage[data-state="ready"] .step{opacity:1;transform:translateX(0)}
    .step:nth-child(1){transition-delay:0ms}.step:nth-child(2){transition-delay:140ms}.step:nth-child(3){transition-delay:280ms}.step:nth-child(4){transition-delay:420ms}
    .step::before{content:"";position:absolute;left:50%;top:-51px;width:1px;height:50px;background:var(--text)}
    .step::after{content:"";position:absolute;left:calc(50% - 6px);top:-57px;width:13px;height:13px;background:var(--bg);border:2px solid var(--text);border-radius:50%}
    .step .tag{align-self:flex-start;margin-bottom:18px;padding:8px 13px;border-radius:0;background:var(--text);color:var(--bg);font:700 34px/1 var(--font-mono);letter-spacing:.04em}
    .step h2{font:700 34px/1.2 var(--font-sans);margin:0 -24px 14px;padding:12px 24px;background:var(--text);color:var(--bg)}
    .step p{font:500 var(--fs-lead)/1.5 var(--font-sans);margin:0;color:var(--text);min-height:66px}
    .handoff{margin-top:14px;display:grid;gap:6px;padding:10px 12px;border:1px solid var(--line);font:500 var(--fs-sec)/1.35 var(--font-sans)}.handoff strong{display:block;margin:0 -12px -10px;padding:9px 12px;background:var(--forward);color:var(--bg)}
    .glyph{margin-top:auto;height:112px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:700 24px/1.2 var(--font-sans);color:var(--text)}
    .glyph-output{gap:11px}.glyph-output .dot{width:18px;height:18px;border-radius:50%;background:var(--forward)}
    .glyph-error{gap:9px}.glyph-error b{font:700 30px/1 var(--font-mono);color:var(--action)}
    .glyph-direction svg{width:150px;height:56px;overflow:visible}
    .glyph-update{flex-direction:column;gap:12px}.knob-row{display:flex;align-items:center;gap:12px;font:700 var(--fs-label)/1 var(--font-mono)}
    .knob{width:50px;height:50px;border:2px solid var(--text);border-radius:50%;position:relative}.knob::after{content:"";position:absolute;width:2px;height:20px;background:var(--text);left:23px;top:5px;transform:rotate(35deg);transform-origin:bottom}
    .knob.after{border-color:var(--action)}.knob.after::after{background:var(--action);transform:rotate(75deg)}
    .flow-arrow{position:absolute;z-index:4;top:219px;width:39px;height:20px;opacity:0;transition:opacity 160ms ease-out}
    #stage[data-state="ready"] .flow-arrow{opacity:1}
    .a1{left:calc(25% - 19px);transition-delay:300ms}.a2{left:calc(50% - 19px);transition-delay:440ms}.a3{left:calc(75% - 19px);transition-delay:580ms}
    .return-svg{position:absolute;left:150px;right:150px;bottom:16px;width:calc(100% - 300px);height:100px;overflow:visible}
    .return-path{fill:none;stroke:var(--text);stroke-width:2;stroke-dasharray:1400;stroke-dashoffset:1400;transition:stroke-dashoffset 600ms ease-out 650ms}
    #stage[data-state="ready"] .return-path{stroke-dashoffset:0}
    .artifacts{position:absolute;left:90px;right:90px;bottom:53px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;text-align:center;font:700 var(--fs-body)/1.2 var(--font-sans)}.artifacts span,.artifacts b{padding:9px 6px;background:var(--bg);border:1px solid var(--line)}.artifacts b{color:var(--forward)}
    .return-label{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);padding:4px 12px;background:var(--bg);font:600 var(--fs-label)/1.2 var(--font-sans);color:var(--muted);opacity:0;transition:opacity 180ms ease-out 1020ms}
    #stage[data-state="ready"] .return-label{opacity:1}
    .p02-foot{height:108px;flex:0 0 108px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 520px;gap:56px;align-items:center;background:color-mix(in srgb,var(--text) 14%,var(--bg));margin:0 -56px -28px;padding:0 56px 28px}
    .p02-claim{font:600 var(--fs-lead)/1.45 var(--font-sans);margin:0}.p02-next{font:600 var(--fs-body)/1.4 var(--font-sans);margin:0;padding-left:22px;border-left:1px solid var(--line);color:var(--forward)}
    @media(prefers-reduced-motion:reduce){.step,.flow-arrow,.return-path,.return-label{transition-duration:1ms!important;transition-delay:0ms!important}}
  </style>

  <header class="p02-head">
    <p class="p02-kicker">ROUTE 01</p>
    <h1>接下来只追踪一条主线：预测、计错、找方向、改参数</h1>
  </header>

  <main class="p02-main min0">
    <section class="p02-route min0" aria-label="学习的四步循环">
      <div class="p02-axis-label">一次修改</div>
      <div class="p02-axis" aria-hidden="true"></div>
      <div class="stage-cards k-process">
        <article class="step min0">
          <span class="tag">01</span><h2>预测</h2>
          <p>用当前参数给出一个预测</p>
          <div class="handoff"><span>接过：当前参数</span><strong>交出：预测值</strong></div>
          <div class="glyph glyph-output" aria-label="预测输出从零到一"><span class="dot"></span><span>预测 0–1</span></div>
        </article>
        <article class="step min0">
          <span class="tag">02</span><h2>计错</h2>
          <p>把预测与答案的差距记成一个数</p>
          <div class="handoff"><span>接过：预测与答案</span><strong>交出：错误数</strong></div>
          <div class="glyph glyph-error" aria-label="把错误记为数"><span>错误</span><b>→</b><span>数</span></div>
        </article>
        <article class="step min0">
          <span class="tag">03</span><h2>找方向</h2>
          <p>判断怎样改会让错误下降</p>
          <div class="handoff"><span>接过：错误的变化</span><strong>交出：下降方向</strong></div>
          <div class="glyph glyph-direction" aria-label="寻找下降方向"><svg viewBox="0 0 150 56" role="img" aria-hidden="true"><path d="M8 16 H92 V6 L140 28 92 50 V40 H8Z" fill="none" stroke="currentColor" stroke-width="3"/><text x="25" y="34" font-size="18" font-family="sans-serif">往哪边？</text></svg></div>
        </article>
        <article class="step min0">
          <span class="tag">04</span><h2>改参数</h2>
          <p>沿下降方向迈一小步</p>
          <div class="handoff"><span>接过：下降方向</span><strong>交出：新参数</strong></div>
          <div class="glyph glyph-update" aria-label="参数从更新前变到更新后"><div class="knob-row"><span>更新前</span><span>→</span><span>更新后</span></div><div class="knob-row"><span class="knob"></span><span>→</span><span class="knob after"></span></div></div>
        </article>
      </div>
      <svg class="flow-arrow a1" viewBox="0 0 39 20" aria-hidden="true"><path d="M1 10h30M23 3l8 7-8 7" fill="none" stroke="var(--forward)" stroke-width="3"/></svg>
      <svg class="flow-arrow a2" viewBox="0 0 39 20" aria-hidden="true"><path d="M1 10h30M23 3l8 7-8 7" fill="none" stroke="var(--forward)" stroke-width="3"/></svg>
      <svg class="flow-arrow a3" viewBox="0 0 39 20" aria-hidden="true"><path d="M1 10h30M23 3l8 7-8 7" fill="none" stroke="var(--forward)" stroke-width="3"/></svg>
      <svg class="return-svg" viewBox="0 0 1188 100" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="returnArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="var(--text)"/></marker></defs><path class="return-path" d="M1080 4 V58 H108 Q68 58 68 24" marker-end="url(#returnArrow)"/></svg>
      <div class="artifacts" aria-label="四步之间交接的结果"><span>当前参数</span><b>预测值</b><b>错误数</b><b>下降方向</b><span>新参数</span></div>
      <span class="return-label">新参数回到起点，再预测一次</span>
    </section>
  </main>

  <footer class="p02-foot">
    <p class="p02-claim">“学习”不是突然想通，而是沿着这四步反复修改可调参数。</p>
    <p class="p02-next">下一问：第一步里，0–1 的输出究竟在说什么？</p>
  </footer>
  <script>
    window.addEventListener('DOMContentLoaded',function(){
      Deck.init({index:2,total:21});
      var stage=document.getElementById('stage');
      requestAnimationFrame(function(){requestAnimationFrame(function(){stage.dataset.state='ready';});});
    },{once:true});
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
