<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:20px}
.p03-head{height:112px;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:1px solid var(--line);padding-bottom:18px}
.p03-kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--muted);margin-bottom:11px}
.p03-head h1{margin:0;font:700 var(--fs-h1)/1.2 var(--font-sans);max-width:1320px;color:var(--text)}
.p03-widget{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px}
.p03-widget .control-line{height:86px;display:grid;grid-template-columns:145px minmax(0,1fr) 92px 132px;align-items:center;gap:18px;padding:0 22px;background:var(--panel-bg);border:1px solid var(--line)}
.p03-widget .control-line label{font:600 var(--fs-body)/1.2 var(--font-sans)}
.p03-widget input[type=range]{width:100%;accent-color:var(--action)}
.p03-widget .control-value{font:700 28px/1 var(--font-mono);color:var(--forward);text-align:right;font-variant-numeric:tabular-nums}
.p03-widget .compare{flex:1;min-height:0;position:relative;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.p03-widget .shared-link{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.p03-widget .reading{z-index:1}
.p03-widget .reading{position:relative;min-width:0;padding:26px 38px 24px;display:flex;flex-direction:column}
.p03-widget .reading+ .reading{border-left:1px solid var(--line)}
.p03-widget .reading h2{margin:0;font:650 var(--fs-h2)/1.2 var(--font-sans)}
.p03-widget .sub{margin:6px 0 0;color:var(--muted);font-size:var(--fs-sec);line-height:1.35}
.p03-widget .big-read{margin-top:20px;display:flex;align-items:baseline;gap:16px}
.p03-widget .big-read .num{font:750 66px/1 var(--font-mono);color:var(--forward)}
.p03-widget .big-read .unit{font-size:var(--fs-body);color:var(--muted)}
.p03-widget .freq{margin:12px 0 14px;font-size:var(--fs-lead);line-height:1.4}
.p03-widget .freq strong{color:var(--forward);font-family:var(--font-mono)}
.p03-widget .hundred{display:block;width:100%;height:220px;border:1px solid var(--line);background:var(--panel-bg)}
.p03-widget .dot{fill:rgba(32,37,43,.12)}
.p03-widget .dot.on{fill:var(--forward)}
.p03-widget .scale{margin-top:auto;position:relative;height:92px}
.p03-widget .track{position:absolute;left:0;right:0;top:27px;height:4px;background:var(--line)}
.p03-widget .fill{position:absolute;left:0;top:27px;height:4px;background:var(--forward);width:72%;transition:width 120ms linear}
.p03-widget .cursor{position:absolute;top:16px;left:72%;width:4px;height:27px;background:var(--action);transform:translateX(-2px);transition:left 120ms linear}
.p03-widget .cursor::after{content:"";position:absolute;left:50%;top:-7px;width:12px;height:12px;border:3px solid var(--action);background:var(--paper);border-radius:50%;transform:translate(-50%,-50%)}
.p03-widget .ticks{position:absolute;left:0;right:0;top:45px;display:grid;grid-template-columns:1fr 1fr 1fr;color:var(--muted);font-size:var(--fs-label);line-height:1.25}
.p03-widget .ticks span:nth-child(2){text-align:center}.p03-widget .ticks span:last-child{text-align:right}
.p03-widget .decision{margin:22px 0 18px;min-height:170px;border:3px solid var(--text);display:flex;align-items:center;justify-content:center;gap:18px;font-size:28px;transition:border-color 240ms ease;background:var(--panel-bg)}
.p03-widget .decision.flip{border-color:var(--action)}
.p03-widget .decision .num{font:800 66px/1 var(--font-mono);color:var(--forward)}
.p03-widget .classbar{position:relative;margin-top:auto;height:92px}
.p03-widget .zones{position:absolute;left:0;right:0;top:27px;height:32px;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.p03-widget .zone{display:flex;align-items:center;padding:0 14px;font:600 var(--fs-label)/1 var(--font-sans);background:rgba(32,37,43,.035)}
.p03-widget .zone:last-child{justify-content:flex-end;border-left:2px solid var(--text);background:rgba(36,87,166,.08)}
.p03-widget .threshold{position:absolute;left:50%;top:0;transform:translateX(-50%);font:600 var(--fs-label)/1 var(--font-mono);color:var(--text)}
.p03-widget .classbar .cursor{top:17px}
.p03-widget .rule{display:flex;justify-content:space-between;gap:16px;margin-top:10px;font:500 var(--fs-sec)/1.35 var(--font-mono);color:var(--muted)}
.p03-widget .classmap{display:block;width:100%;height:150px;margin-top:auto}
.p03-widget .classmap text{font:600 16px var(--font-sans);fill:var(--text)}
.p03-widget .foot{height:54px;display:flex;align-items:center;justify-content:space-between;gap:28px;border-top:1px solid var(--line);font-size:var(--fs-sec);line-height:1.35}
.p03-widget .takeaway{font-weight:600;color:var(--text)}
.p03-widget .next{color:var(--muted);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.p03-widget .fill,.p03-widget .cursor,.p03-widget .decision{transition:none}}
</style>
</head>
<body data-page="03" data-total="21">
<div id="stage">
  <header class="p03-head">
    <div class="p03-kicker">READOUT 03</div>
    <h1>同一个 0–1 输出，既表示“更像哪一类”，也能变成二选一判断</h1>
  </header>

  <main class="p03-widget min0" data-widget>
    <div class="control-line ctl">
      <label for="p03-output">模型输出</label>
      <input id="p03-output" data-range type="range" min="0" max="1" step="0.01" value="0.72" aria-label="模型输出，范围零到一，方向键每次调整零点零一">
      <output class="control-value" data-control-value for="p03-output">0.72</output>
      <button class="btn" data-reset type="button">回到 0.72</button>
    </div>

    <section class="compare k-comparison min0" aria-label="同一输出的两种读法">
      <svg class="shared-link" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true">
        <line x1="475" y1="252" x2="525" y2="252" stroke="var(--text)" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <circle cx="475" cy="252" r="4" fill="var(--paper)" stroke="var(--text)" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <circle cx="525" cy="252" r="4" fill="var(--paper)" stroke="var(--text)" stroke-width="2" vector-effect="non-scaling-stroke"/>
      </svg>
      <article class="reading min0">
        <h2>连续读法</h2>
        <p class="sub">输出保留细微差别</p>
        <div class="big-read"><span class="num" data-prob>0.72</span><span class="unit">倾向答案 1</span></div>
        <p class="freq">100 次相似情况中，约 <strong data-count>72</strong> 次答案为 1</p>
        <svg class="hundred" data-hundred viewBox="0 0 500 118" role="img" aria-label="一百个方格中的七十二个表示答案为一"></svg>
        <div class="scale" aria-hidden="true">
          <div class="track"></div><div class="fill" data-fill></div><div class="cursor" data-cursor></div>
          <div class="ticks"><span>0<br>更倾向答案 0</span><span>0.5<br>分界</span><span>1<br>更倾向答案 1</span></div>
        </div>
      </article>

      <article class="reading min0">
        <h2>二选一读法</h2>
        <p class="sub">同一数值经过固定阈值</p>
        <div class="decision" data-decision><span>判断：</span><span class="num" data-class>1</span></div>
        <div class="rule"><span>输出 &lt; 0.5 → 判断 0</span><span>输出 ≥ 0.5 → 判断 1</span></div>
        <svg class="classmap" viewBox="0 0 500 150" role="img" aria-label="输出从零到一；零点五左侧判断为零，右侧含零点五判断为一">
          <rect x="1" y="34" width="249" height="82" fill="rgba(32,37,43,.035)" stroke="var(--line)"/>
          <rect x="250" y="34" width="249" height="82" fill="rgba(36,87,166,.08)" stroke="var(--line)"/>
          <line x1="250" y1="18" x2="250" y2="130" stroke="var(--text)" stroke-width="3"/>
          <text x="250" y="14" text-anchor="middle">判断阈值 0.50</text>
          <text x="22" y="82">判断 0</text><text x="478" y="82" text-anchor="end">判断 1</text>
          <line data-svg-cursor x1="360" y1="27" x2="360" y2="125" stroke="var(--action)" stroke-width="5"/>
          <circle data-svg-dot cx="360" cy="27" r="7" fill="var(--paper)" stroke="var(--action)" stroke-width="4"/>
        </svg>
      </article>
    </section>

    <div class="hint" data-status aria-live="polite">拖动输出，特别观察跨过 0.50 的一刻。</div>
    <footer class="foot">
      <div class="takeaway">输出越接近 1，模型越倾向答案 1；以 0.5 为界，不小于 0.5 判为 1，否则判为 0。</div>
      <div class="next">这个 0–1 输出，是怎样从输入一步步算出来的？</div>
    </footer>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  const root=document.querySelector('[data-widget]');
  if(!root) return;
  const q=s=>root.querySelector(s), qa=s=>[...root.querySelectorAll(s)];
  const range=q('[data-range]'), reset=q('[data-reset]'), decision=q('[data-decision]'), status=q('[data-status]');
  const initial=.72, threshold=Lec.K.BINARY_CLASSIFICATION_THRESHOLD;
  let state={value:initial,klass:initial>=threshold?1:0}, flashTimer=0, destroyed=false;
  const hundred=q('[data-hundred]');
  for(let i=0;i<100;i++){const dot=document.createElementNS('http://www.w3.org/2000/svg','rect');dot.setAttribute('class','dot');dot.setAttribute('x',10+(i%20)*24);dot.setAttribute('y',10+Math.floor(i/20)*21);dot.setAttribute('width','18');dot.setAttribute('height','15');hundred.appendChild(dot)}
  function clamp(v){return Math.max(0,Math.min(1,Math.round(v*100)/100))}
  function render(previous){
    const v=state.value, text=v.toFixed(2), pct=`${v*100}%`;
    range.value=text;q('[data-control-value]').textContent=text;q('[data-prob]').textContent=text;
    const count=Math.round(v*100);q('[data-count]').textContent=String(count);q('[data-class]').textContent=String(state.klass);
    hundred.setAttribute('aria-label',`一百个方格中的${count}个表示答案为一`);
    [...hundred.children].forEach((dot,i)=>dot.classList.toggle('on',i<count));
    q('[data-fill]').style.width=pct;qa('[data-cursor]').forEach(el=>el.style.left=pct);
    const sx=1+v*498;q('[data-svg-cursor]').setAttribute('x1',sx);q('[data-svg-cursor]').setAttribute('x2',sx);q('[data-svg-dot]').setAttribute('cx',sx);
    if(previous!==undefined && previous!==state.klass){
      decision.classList.remove('flip');void decision.offsetWidth;decision.classList.add('flip');
      clearTimeout(flashTimer);flashTimer=setTimeout(()=>decision.classList.remove('flip'),240);
    }
  }
  function setValue(value,announce=false){
    if(destroyed)return;const old=state.klass,v=clamp(value);state={value:v,klass:v>=threshold?1:0};render(old);
    if(announce)status.textContent=`模型输出 ${v.toFixed(2)}，判断为 ${state.klass}`;
  }
  function onInput(){setValue(Number(range.value))}
  function onChange(){setValue(Number(range.value),true)}
  function onReset(){clearTimeout(flashTimer);decision.classList.remove('flip');state={value:initial,klass:1};render();status.textContent='已回到模型输出 0.72，判断为 1'}
  range.addEventListener('input',onInput);range.addEventListener('change',onChange);reset.addEventListener('click',onReset);
  render();
  root.destroyWidget=()=>{if(destroyed)return;destroyed=true;clearTimeout(flashTimer);range.removeEventListener('input',onInput);range.removeEventListener('change',onChange);reset.removeEventListener('click',onReset);delete root.destroyWidget};
})();
Deck.init({index:3,total:21});
</script>
</body>
</html>
