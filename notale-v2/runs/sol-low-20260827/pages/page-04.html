<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>输入怎样变成预测</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}
#stage .p04-head{height:108px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;border-bottom:1px solid var(--line);padding-bottom:16px}
#stage .p04-kicker{font:600 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.08em;color:var(--muted)}
#stage .p04-head h1{margin:0;font:700 var(--fs-h1)/1.18 var(--font-sans);color:var(--text)}
#stage .p04-widget{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
#stage .p04-context{height:48px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);padding:0 18px;background:var(--panel-bg)}
#stage .p04-context strong{font-size:var(--fs-body)}
#stage .p04-context span{font-size:var(--fs-label);color:var(--muted)}
#stage .p04-pipeline{flex:1;min-height:0;display:grid;grid-template-columns:390px 90px 470px 90px 1fr;align-items:stretch;border:1px solid var(--line);background-color:#E7E2D6;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(32,37,43,.10) 31px,rgba(32,37,43,.10) 32px);padding:26px 28px;position:relative;isolation:isolate}
#stage .p04-map{position:absolute;inset:20px;width:calc(100% - 40px);height:calc(100% - 40px);z-index:-1}
#stage .p04-map rect{fill:rgba(36,87,166,.07);stroke:rgba(36,87,166,.25);stroke-width:1;vector-effect:non-scaling-stroke}
#stage .p04-map line{stroke:rgba(36,87,166,.22);stroke-width:90;vector-effect:non-scaling-stroke}
#stage .p04-inputs{display:flex;flex-direction:column;justify-content:center;gap:22px;background:#DCD6C8;padding:22px}
#stage .p04-input{border:1px solid var(--line);padding:22px 20px;background:var(--bg);transition:border-color 120ms,background-color 120ms}
#stage .p04-input.active{border:2px solid var(--focus);padding:21px 19px;background:var(--panel-bg)}
#stage .p04-inputtop{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
#stage .p04-inputtop label{font-weight:700;font-size:var(--fs-h2)}
#stage .p04-value{font:700 26px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--focus)}
#stage .p04-scale{display:flex;justify-content:space-between;margin-top:7px;font:var(--fs-tick)/1 var(--font-mono);color:var(--muted)}
#stage .p04-arrow{display:flex;align-items:center;justify-content:center;color:var(--line);transition:color 160ms}
#stage .p04-arrow svg{width:78px;height:36px;overflow:visible}
#stage .p04-arrow line{stroke:currentColor;stroke-width:3}
#stage .p04-arrow polygon{fill:currentColor}
#stage .p04-widget.flow .p04-arrow{color:var(--forward)}
#stage .p04-neuron{align-self:center;height:330px;position:relative;display:flex;align-items:center;justify-content:center}
#stage .p04-neuron svg{position:absolute;inset:0;width:100%;height:100%}
#stage .p04-neuron polygon{fill:#DCD6C8;stroke:var(--text);stroke-width:2;vector-effect:non-scaling-stroke;transition:stroke 160ms}
#stage .p04-widget.phase-merge .p04-neuron polygon,#stage .p04-widget.phase-score .p04-neuron polygon{stroke:var(--forward);stroke-width:4}
#stage .p04-neuronbody{position:relative;z-index:1;width:300px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
#stage .p04-neuronbody .prompt{font-size:var(--fs-body);line-height:1.4;max-width:260px}
#stage .p04-score{padding:13px 18px;border:1px solid var(--line);min-width:250px;background:var(--bg);font-size:var(--fs-label);transition:border-color 160ms}
#stage .p04-score output{display:block;margin-top:7px;font:700 34px/1 var(--font-mono);font-variant-numeric:tabular-nums}
#stage .p04-widget.phase-score .p04-score{border:2px solid var(--forward);padding:12px 17px}
#stage .p04-port{font-size:var(--fs-label);color:var(--muted)}
#stage .p04-output{align-self:center;border:1px solid var(--line);height:360px;padding:28px;display:flex;flex-direction:column;justify-content:center;gap:22px;background:#DCD6C8;transition:border-color 180ms}
#stage .p04-widget.phase-output .p04-output{border:3px solid var(--forward);padding:26px}
#stage .p04-output h2{margin:0;font-size:var(--fs-h2)}
#stage .p04-pred{font:700 42px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--forward)}
#stage .p04-meter{height:30px;border:1px solid var(--line);position:relative;background:var(--panel-bg)}
#stage .p04-fill{position:absolute;inset:0 auto 0 0;background:var(--forward);transition:width 180ms ease}
#stage .p04-meterlabels{display:flex;justify-content:space-between;font:var(--fs-tick)/1 var(--font-mono);color:var(--muted);margin-top:-14px}
#stage .p04-reading{font-size:var(--fs-sec);line-height:1.45;min-height:46px}
#stage .p04-foot{height:88px;display:flex;align-items:center;justify-content:space-between;gap:26px;border-top:1px solid var(--line);padding-top:14px}
#stage .p04-claim{font-size:var(--fs-lead);font-weight:650;flex:1}
#stage .p04-next{font-size:var(--fs-sec);color:var(--muted);white-space:nowrap}
#stage .p04-reset{flex:0 0 auto}
@media (prefers-reduced-motion:reduce){#stage .p04-fill,#stage .p04-arrow,#stage .p04-neuron polygon,#stage .p04-output{transition:none}}
</style>
</head>
<body data-page="04" data-total="21">
<div id="stage">
  <header class="p04-head">
    <div class="p04-kicker">STEP 02 · 一个神经元</div>
    <h1>两项输入先汇合成一个分数，再变成 0–1 的预测</h1>
  </header>

  <main class="p04-widget canvas-full k-process" data-widget>
    <div class="p04-context"><strong>预测：这株植物会开花吗？</strong><span>拨动任一输入，沿左 → 右观察变化</span></div>

    <div class="p04-pipeline min0">
      <svg class="p04-map" viewBox="0 0 1400 500" preserveAspectRatio="none" aria-hidden="true"><line x1="45" y1="250" x2="1355" y2="250"/><rect x="10" y="25" width="365" height="450"/><rect x="490" y="25" width="440" height="450"/><rect x="1045" y="25" width="345" height="450"/></svg>
      <section class="p04-inputs min0" aria-label="两项输入">
        <div class="p04-input" data-card="light">
          <div class="p04-inputtop"><label for="p04-light">光照</label><output class="p04-value" data-value="light">0.50</output></div>
          <div class="ctl"><input id="p04-light" data-input="light" type="range" min="0" max="1" step="0.01" value="0.50" aria-label="光照，范围 0 到 1"></div>
          <div class="p04-scale"><span>0.00</span><span>1.00</span></div>
        </div>
        <div class="p04-input" data-card="water">
          <div class="p04-inputtop"><label for="p04-water">水分</label><output class="p04-value" data-value="water">0.50</output></div>
          <div class="ctl"><input id="p04-water" data-input="water" type="range" min="0" max="1" step="0.01" value="0.50" aria-label="水分，范围 0 到 1"></div>
          <div class="p04-scale"><span>0.00</span><span>1.00</span></div>
        </div>
      </section>

      <div class="p04-arrow" aria-hidden="true"><svg viewBox="0 0 80 36"><line x1="2" y1="18" x2="66" y2="18"/><polygon points="66,10 79,18 66,26"/></svg></div>

      <section class="p04-neuron min0" aria-label="神经元：把两项输入汇成一个内部得分">
        <svg viewBox="0 0 470 330" aria-hidden="true"><polygon points="72,18 398,18 454,165 398,312 72,312 16,165"/></svg>
        <div class="p04-neuronbody">
          <div class="prompt">把两项输入汇成一个内部得分</div>
          <div class="p04-score">内部得分<output data-score>0.00</output></div>
          <div class="p04-port">压到 0–1</div>
        </div>
      </section>

      <div class="p04-arrow" aria-hidden="true"><svg viewBox="0 0 80 36"><line x1="2" y1="18" x2="66" y2="18"/><polygon points="66,10 79,18 66,26"/></svg></div>

      <section class="p04-output min0" aria-label="开花预测">
        <h2>开花预测</h2>
        <output class="p04-pred" data-prediction>0.500</output>
        <div class="p04-meter" role="meter" aria-label="开花预测" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.5"><div class="p04-fill" data-fill style="width:50%"></div></div>
        <div class="p04-meterlabels"><span>0</span><span>1</span></div>
        <div class="p04-reading" data-reading aria-live="polite">约等于 100 次相似情况中有 50 次开花</div>
      </section>
    </div>

    <div class="p04-foot">
      <div class="p04-claim">一个神经元就是一条可调的数值流水线：输入 → 内部得分 → 预测。</div>
      <button class="btn p04-reset" type="button" data-reset>回到中间值</button>
      <div class="p04-next">汇合时，为什么有的输入影响大，有的影响小？</div>
    </div>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  const root = document.querySelector('#stage [data-widget]');
  if (!root || !window.Lec || !Lec.P) return;
  const els = {
    light: root.querySelector('[data-input="light"]'), water: root.querySelector('[data-input="water"]'),
    lightValue: root.querySelector('[data-value="light"]'), waterValue: root.querySelector('[data-value="water"]'),
    score: root.querySelector('[data-score]'), prediction: root.querySelector('[data-prediction]'),
    fill: root.querySelector('[data-fill]'), meter: root.querySelector('[role="meter"]'),
    reading: root.querySelector('[data-reading]'), status: root.querySelector('[data-reading]'), reset: root.querySelector('[data-reset]')
  };
  const initial = () => ({light:.5, water:.5, active:null});
  let state = initial(), timers = [], destroyed = false;
  function clearPhases(){ timers.forEach(clearTimeout); timers=[]; root.classList.remove('flow','phase-merge','phase-score','phase-output'); }
  function calculate(){ return Lec.P.neuronForward([state.light,state.water],[2,1],-1.5,'sigmoid'); }
  function render(){
    const r=calculate();
    els.light.value=state.light; els.water.value=state.water;
    els.lightValue.textContent=state.light.toFixed(2); els.waterValue.textContent=state.water.toFixed(2);
    els.score.textContent=r.preActivation.toFixed(2); els.prediction.textContent=r.output.toFixed(3);
    els.fill.style.width=(r.output*100).toFixed(3)+'%'; els.meter.setAttribute('aria-valuenow',r.output.toFixed(3));
    els.reading.textContent=`约等于 100 次相似情况中有 ${Math.round(r.output*100)} 次开花`;
    root.querySelectorAll('[data-card]').forEach(n=>n.classList.toggle('active',n.dataset.card===state.active));
  }
  function animateFlow(){
    clearPhases(); root.classList.add('flow');
    if(Deck.reduced()){ root.classList.add('phase-output'); return; }
    timers.push(setTimeout(()=>root.classList.add('phase-merge'),70));
    timers.push(setTimeout(()=>root.classList.add('phase-score'),230));
    timers.push(setTimeout(()=>root.classList.add('phase-output'),390));
    timers.push(setTimeout(()=>clearPhases(),720));
  }
  function setValue(name,value,announce=false){
    if(destroyed)return; state={...state,[name]:Math.max(0,Math.min(1,Number(value))),active:name}; render(); animateFlow();
  }
  function onInput(e){setValue(e.currentTarget.dataset.input,e.currentTarget.value,false)}
  function onChange(e){setValue(e.currentTarget.dataset.input,e.currentTarget.value,true)}
  function reset(){clearPhases();state=initial();render();}
  [els.light,els.water].forEach(el=>{el.addEventListener('input',onInput);el.addEventListener('change',onChange)});
  els.reset.addEventListener('click',reset); render();
  root.destroyP04=()=>{if(destroyed)return;destroyed=true;clearPhases();[els.light,els.water].forEach(el=>{el.removeEventListener('input',onInput);el.removeEventListener('change',onChange)});els.reset.removeEventListener('click',reset);delete root.destroyP04;};
  Deck.init({index:4,total:21});
})();
</script>
</body>
</html>
