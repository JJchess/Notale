<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>错得越自信，代价越大</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:18px}
    .head{height:104px;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:1px solid var(--line);padding-bottom:14px}
    .kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.08em;color:var(--action);margin-bottom:8px}
    h1{font:700 var(--fs-h1)/1.2 var(--font-sans);margin:0;color:var(--text)}
    .main{flex:1;display:grid;grid-template-rows:248px minmax(0,1fr);gap:18px}
    .bet{position:relative;display:grid;grid-template-columns:1.08fr .92fr;gap:64px;border:1px solid var(--line);padding:8px 16px 42px;box-sizing:border-box}
    .invariant{position:absolute;left:16px;right:16px;bottom:8px;display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;border-top:1px solid var(--line);padding-top:7px;font:var(--fs-label)/1.2 var(--font-sans);color:var(--muted)}
    .invariant span{text-align:center}.invariant b{color:var(--text)}
    .control-area{display:flex;flex-direction:column;justify-content:center}
    .ctl-title{font:700 var(--fs-h2)/1.3 var(--font-sans);margin:0 0 10px}
    .truth{display:inline-flex;align-items:center;gap:10px;font:600 var(--fs-body)/1.3 var(--font-sans);margin-bottom:20px}
    .truth b{font:700 22px/1 var(--font-mono);color:var(--forward);border:1px solid var(--forward);padding:7px 12px}
    .range-row{display:grid;grid-template-columns:170px 1fr 64px;align-items:center;gap:16px}
    .range-row label{font:600 var(--fs-label)/1.3 var(--font-sans)}
    .range-row output{font:700 22px/1 var(--font-mono);color:var(--forward);text-align:right}
    input[type=range]{width:100%;accent-color:var(--action)}
    .scale{display:flex;justify-content:space-between;margin:5px 64px 15px 186px;font:var(--fs-tick)/1 var(--font-mono);color:var(--muted)}
    .quick{display:flex;align-items:center;gap:10px}
    .quick .label{font:var(--fs-label)/1.2 var(--font-sans);color:var(--muted);margin-right:4px}
    .btn[aria-pressed=true]{border:2px solid var(--action);font-weight:700}
    .readout{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:center}
    .metric{border:1px solid var(--line);padding:18px 20px;min-height:102px;background:var(--panel-bg)}
    .metric .lab{font:var(--fs-label)/1.2 var(--font-sans);color:var(--muted);margin-bottom:10px}
    .metric .value{font:700 38px/1 var(--font-mono);color:var(--forward)}
    .metric.loss .value{color:var(--text)}
    .plain{grid-column:1/-1;border:1px solid var(--line);padding:13px 18px;font:var(--fs-sec)/1.4 var(--font-sans);background:var(--paper)}
    .compare{display:grid;grid-template-columns:minmax(0,1fr) 382px;gap:48px;min-height:0;border:1px solid var(--line);padding:12px 16px;box-sizing:border-box}
    .chart-wrap{display:flex;flex-direction:column;min-height:0}
    .section-title{display:flex;align-items:baseline;justify-content:space-between;height:34px}
    .section-title h2{font:700 var(--fs-h2)/1.2 var(--font-sans);margin:0}
    .section-title span{font:var(--fs-label)/1.2 var(--font-sans);color:var(--muted)}
    #chart{height:276px;width:100%;border-bottom:1px solid var(--line)}
    .evidence{display:flex;flex-direction:column;min-height:0;padding:4px 0 0 16px;border-left:1px solid var(--line)}
    .evidence h2{font:700 var(--fs-h2)/1.2 var(--font-sans);margin:0 0 14px}
    table{width:100%;border-collapse:collapse;font:var(--fs-label)/1.35 var(--font-sans)}
    th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}
    th{color:var(--muted);font-weight:600}
    td.num{font:700 var(--fs-label)/1.2 var(--font-mono)}
    .read-guide{margin:10px 0 0;padding:9px 14px;border:1px solid var(--line);font:var(--fs-sec)/1.35 var(--font-sans)}
    .read-guide b{display:block;margin-bottom:5px}
    .read-guide ul{margin:0;padding-left:20px}
    .read-guide li+li{margin-top:1px}
    .claim{margin:14px 0 0;border-top:2px solid var(--text);padding-top:12px;font:600 var(--fs-body)/1.45 var(--font-sans)}
    .next{margin-top:auto;padding-top:8px;font:var(--fs-sec)/1.35 var(--font-sans);color:var(--muted)}
    .next b{color:var(--text)}
    .chart-caption{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font:var(--fs-label)/1.35 var(--font-sans);color:var(--muted);margin-top:4px}
    .chart-caption span{border:1px solid var(--line);padding:4px 7px;text-align:center}
  </style>
</head>
<body data-page="07" data-total="21">
  <div id="stage">
    <header class="head">
      <div class="kicker">LOSS / 预测押注</div>
      <h1>真实答案是 1：越坚信错误答案，损失越大</h1>
    </header>

    <main class="main split-tb min0">
      <section class="bet" aria-labelledby="bet-title">
        <div class="control-area min0">
          <h2 class="ctl-title" id="bet-title">给同一个样本押一次答案</h2>
          <div class="truth">真实答案固定为 <b>1</b></div>
          <div class="ctl">
            <div class="range-row">
              <label for="prob">我押真实答案是 1</label>
              <input id="prob" type="range" min="0.1" max="0.9" step="0.1" value="0.5" aria-describedby="read-desc">
              <output id="prob-out" for="prob">0.5</output>
            </div>
            <div class="scale" aria-hidden="true"><span>0.1</span><span>0.5</span><span>0.9</span></div>
            <div class="quick"><span class="label">快捷押注</span><button class="btn" data-p="0.9">押 0.9</button><button class="btn" data-p="0.5" aria-pressed="true">押 0.5</button><button class="btn" data-p="0.1">押 0.1</button><button class="btn" id="reset">重置</button></div>
          </div>
        </div>
        <div class="readout min0" id="read-desc" aria-live="polite">
          <div class="metric"><div class="lab">当前预测为 1 的把握</div><div class="value" id="p-big">0.5</div></div>
          <div class="metric loss"><div class="lab">当前损失 / 样本</div><div class="value" id="loss-big">0.693</div></div>
          <div class="plain" id="plain">两边各半：这次押注不确定。</div>
        </div>
        <div class="invariant" aria-label="比较条件"><span><b>样本</b>不变</span><i>→</i><span><b>真实答案 1</b> 不变</span><i>→</i><span>只改变<b>押注</b></span></div>
      </section>

      <section class="compare k-comparison min0" aria-labelledby="compare-title">
        <figure class="chart-wrap min0" style="margin:0">
          <div class="section-title"><h2 id="compare-title">三次押注，共用同一把尺</h2><span>损失越小越好</span></div>
          <div id="chart" role="img" aria-label="真实答案为一时，三个预测概率及当前押注的二元交叉熵损失柱状图"></div>
          <figcaption class="chart-caption"><span>0.9｜答对且有把握</span><span>0.5｜两边各半</span><span>0.1｜自信地答错</span></figcaption>
        </figure>
        <aside class="evidence">
          <h2>可核对的三次结果</h2>
          <table aria-label="三次基准押注与损失">
            <thead><tr><th>押注</th><th>读法</th><th>损失</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="read-guide"><b>比较时保持什么不变？</b><ul><li>同一个样本，真实答案始终是 1</li><li>只改变押注，再读同一纵轴的柱高</li><li>柱越高，这次预测的损失越大</li></ul></div>
          <p class="claim">损失把“错得多严重”压成一个数；自信地答错会受到更重惩罚。</p>
          <p class="next"><b>下一问</b>　知道损失之后，怎样判断参数该往哪边调？</p>
        </aside>
      </section>
    </main>
  </div>
  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
  (function(){
    'use strict';
    Deck.init({index:7,total:21});
    var refs=[
      {id:'p09',p:0.9,short:'答对且有把握',plain:'100 次相似情况中约 90 次选 1'},
      {id:'p05',p:0.5,short:'不确定',plain:'两边各半'},
      {id:'p01',p:0.1,short:'自信地答错',plain:'100 次相似情况中约 10 次选 1'}
    ];
    refs.forEach(function(d){d.loss=Lec.P.binaryCrossEntropy([d.p],[1]).value;});
    var state={p:0.5};
    var range=document.getElementById('prob');
    var chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
    var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.getElementById('rows').innerHTML=refs.map(function(d){return '<tr><td class="num">'+d.p.toFixed(1)+'</td><td>'+d.short+'</td><td class="num">'+d.loss.toFixed(3)+'</td></tr>';}).join('');

    function currentCopy(p){
      var hit=refs.find(function(d){return Math.abs(d.p-p)<1e-8;});
      if(hit)return hit.plain+'：'+hit.short+'。';
      return '100 次相似情况中约 '+Math.round(p*100)+' 次选 1。';
    }
    function render(s){
      var p=s.p;
      var loss=Lec.P.binaryCrossEntropy([p],[1]).value;
      range.value=p.toFixed(1);
      document.getElementById('prob-out').textContent=p.toFixed(1);
      document.getElementById('p-big').textContent=p.toFixed(1);
      document.getElementById('loss-big').textContent=loss.toFixed(3);
      document.getElementById('plain').textContent=currentCopy(p);
      document.querySelectorAll('[data-p]').forEach(function(b){b.setAttribute('aria-pressed',Math.abs(Number(b.dataset.p)-p)<1e-8?'true':'false');});
      var isBase=refs.some(function(d){return Math.abs(d.p-p)<1e-8;});
      var cats=refs.map(function(d){return d.p.toFixed(1);});
      var vals=refs.map(function(d){return {value:d.loss,itemStyle:{color:'#2457A6',borderColor:Math.abs(d.p-p)<1e-8?'#E56B2F':'#2457A6',borderWidth:Math.abs(d.p-p)<1e-8?4:1}};});
      if(!isBase){cats.push('当前 '+p.toFixed(1));vals.push({value:loss,itemStyle:{color:'#F4F1E8',borderColor:'#E56B2F',borderWidth:4}});}
      chart.setOption({
        animation:!reduce,animationDurationUpdate:220,
        textStyle:{fontFamily:'Noto Sans SC, system-ui, sans-serif',fontSize:16,color:'#20252B'},
        grid:{left:72,right:24,top:28,bottom:64,containLabel:false},
        tooltip:{trigger:'axis',textStyle:{fontSize:16},formatter:function(ps){return '押注 '+ps[0].axisValue+'<br>损失 / 样本：'+Number(ps[0].value).toFixed(3);}},
        xAxis:{type:'category',name:'预测为 1 的把握',nameLocation:'middle',nameGap:42,nameTextStyle:{fontSize:14,fontWeight:600},data:cats,axisLabel:{fontSize:14,color:'#20252B'},axisLine:{lineStyle:{color:'#787D82'}},axisTick:{alignWithLabel:true}},
        yAxis:{type:'value',min:0,max:2.5,interval:0.5,name:'损失 / 样本',nameTextStyle:{fontSize:14,fontWeight:600,padding:[0,0,4,0]},axisLabel:{fontSize:12,formatter:function(v){return v.toFixed(1);}},splitLine:{lineStyle:{color:'#D7D2C7'}},axisLine:{show:true,lineStyle:{color:'#787D82'}}},
        series:[{id:'loss-bars',name:'损失',type:'bar',barMaxWidth:190,data:vals,label:{show:true,position:'top',fontSize:15,fontFamily:'ui-monospace, monospace',fontWeight:700,formatter:function(x){return Number(x.value).toFixed(3);}},markLine:{silent:true,symbol:'none',lineStyle:{color:'#E56B2F',width:2,type:'dashed'},label:{show:true,position:'insideEndTop',fontSize:14,color:'#20252B',formatter:'当前损失 '+loss.toFixed(3)},data:[{yAxis:loss}]}}]
      },{notMerge:true});
    }
    function setState(patch){state=Object.assign({},state,patch);render(state);}
    range.addEventListener('input',function(){setState({p:Number(range.value)});});
    document.querySelectorAll('[data-p]').forEach(function(b){b.addEventListener('click',function(){setState({p:Number(b.dataset.p)});});});
    document.getElementById('reset').addEventListener('click',function(){setState({p:0.5});});
    var ro=new ResizeObserver(function(){chart.resize();});ro.observe(document.getElementById('chart'));
    window.addEventListener('pagehide',function cleanup(){ro.disconnect();chart.dispose();},{once:true});
    render(state);
  })();
  </script>
</body>
</html>
