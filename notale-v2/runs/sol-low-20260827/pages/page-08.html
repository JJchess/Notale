<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>左右一试，找到下坡</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F4F1E8;--text:#20252B;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E56B2F}
#stage{padding:28px 56px;box-sizing:border-box;gap:18px}
.head{height:102px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--line)}
.kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
h1{font:700 var(--fs-h1)/1.18 var(--font-sans);margin:0;max-width:1240px}
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 338px;gap:64px}
.figure{margin:0;display:flex;flex-direction:column;min-width:0;min-height:0}
.readouts{height:116px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:0 76px 4px 82px}
.readout{border:1px solid var(--line);background:var(--panel-bg);padding:12px 16px;display:flex;flex-direction:column;justify-content:center;text-align:center;opacity:.46;transition:opacity 80ms linear,border-color 80ms linear}
.readout.current,.readout.seen{opacity:1}.readout.best{border:3px solid var(--focus);padding:10px 14px}
.r-title{font:700 var(--fs-label)/1.25 var(--font-sans);margin-bottom:7px}.r-values{font:600 var(--fs-sec)/1.35 var(--font-mono)}.r-compare{font:600 var(--fs-label)/1.25 var(--font-sans);min-height:19px;color:var(--muted);margin-top:3px}.best .r-compare{color:var(--focus)}
.chart-wrap{position:relative;flex:1;min-height:0;border:1px solid var(--line);background:rgba(255,255,255,.28)}
#chart{position:absolute;inset:0}
.direction{position:absolute;right:28px;top:20px;border:2px solid var(--focus);background:var(--bg);padding:8px 13px;font:700 var(--fs-sec)/1.2 var(--font-sans);color:var(--focus);opacity:0;transform:translateX(-24px);transition:opacity 300ms,transform 300ms}.direction.on{opacity:1;transform:none}
figcaption{font:var(--fs-label)/1.35 var(--font-sans);color:var(--muted);padding-top:7px}
.side{display:flex;flex-direction:column;gap:16px;border-left:1px solid var(--line);padding-left:28px}
.fixed{border:1px solid var(--line);padding:16px 18px}.fixed h2,.controls h2{font:700 var(--fs-h2)/1.2 var(--font-sans);margin:0 0 11px}.facts{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font:var(--fs-sec)/1.35 var(--font-sans)}.facts strong{font-family:var(--font-mono)}
.controls{padding-top:4px}.btns{display:flex;flex-direction:column;gap:10px}.btn{width:100%;justify-content:center;font-size:var(--fs-sec)}.btn.reset{margin-top:6px;background:transparent}
.status{border:1px solid var(--line);padding:14px 16px;min-height:60px;font:var(--fs-sec)/1.4 var(--font-sans);background:var(--panel-bg)}
.takeaway{margin-top:auto;border-top:1px solid var(--line);padding-top:16px;font:700 var(--fs-body)/1.45 var(--font-sans)}
.next{font:var(--fs-sec)/1.4 var(--font-sans);color:var(--muted)}
.data-alt{border-collapse:collapse;font-size:var(--fs-label)}.data-alt.sr-only{width:1px!important;height:1px!important}.data-alt th,.data-alt td{border:1px solid var(--line);padding:5px 8px;text-align:right}.data-alt th:first-child,.data-alt td:first-child{text-align:left}
@media (prefers-reduced-motion:reduce){.readout,.direction{transition:none!important}}
</style>
</head>
<body data-page="08" data-total="21">
<div id="stage">
  <header class="head">
    <div class="kicker">LOCAL PROBE｜局部试探</div>
    <h1>同一个旋钮左右各试一点，损失更小的一侧就是下坡</h1>
  </header>
  <main class="main min0">
    <figure class="figure min0" aria-labelledby="figcap">
      <div class="readouts" aria-label="三个位置的读数">
        <div class="readout" id="card-left"><div class="r-title">向左试一点｜w = −0.5</div><div class="r-values">预测 <span>—</span>　损失 <span>—</span></div><div class="r-compare">尚未试探</div></div>
        <div class="readout current" id="card-center"><div class="r-title">当前位置｜w = 0.0</div><div class="r-values">预测 <span id="cp">0.500</span>　损失 <span id="cl">0.693</span></div><div class="r-compare">比较基准</div></div>
        <div class="readout" id="card-right"><div class="r-title">向右试一点｜w = +0.5</div><div class="r-values">预测 <span>—</span>　损失 <span>—</span></div><div class="r-compare">尚未试探</div></div>
      </div>
      <div class="chart-wrap min0">
        <div id="chart" role="img" aria-label="参数 w 从负二到二时的损失曲线。当前位置为零，可向左右各试零点五。"></div>
        <div id="direction" class="direction">局部下坡：向右 →</div>
      </div>
      <figcaption id="figcap">三点共用同一坐标轴；试探距离相同，比较的是各点的预测与损失。</figcaption>
    </figure>
    <aside class="side min0">
      <section class="fixed"><h2>固定条件</h2><div class="facts"><span>输入 x</span><strong>1</strong><span>偏置 b</span><strong>0</strong><span>真实答案</span><strong>1</strong></div></section>
      <section class="controls"><h2>从当前位置出发</h2><div class="btns"><button class="btn" id="leftBtn" type="button">向左试 −0.5</button><button class="btn" id="rightBtn" type="button">向右试 +0.5</button><button class="btn reset" id="resetBtn" type="button">重新试探</button></div></section>
      <div class="status" id="status" role="status" aria-live="polite">当前位置 w = 0.0，损失 0.693。请分别向左、向右试一点。</div>
      <table class="data-alt sr-only" aria-label="试探数据表"><thead><tr><th>位置</th><th>参数 w</th><th>预测</th><th>损失</th></tr></thead><tbody id="fallback"></tbody></table>
      <p class="takeaway">“学习方向”不是猜出来的：比较参数附近的损失，就能知道此刻该往哪边调。</p>
      <p class="next">方向找到了，怎样让参数不再靠一次次手动试探？</p>
    </aside>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function(){
  Deck.init({index:8,total:21});
  const calc=w=>{const p=Lec.P.neuronForward([1],[w],0,'sigmoid').output;const loss=Lec.P.binaryCrossEntropy([p],[1]).value;return {w,p,loss}};
  const records=[calc(-.5),calc(0),calc(.5)];
  const curve=[];for(let i=0;i<=80;i++){const w=-2+i*.05;curve.push([+w.toFixed(2),calc(w).loss]);}
  document.getElementById('fallback').innerHTML=records.map((d,i)=>`<tr><td>${['向左试','当前位置','向右试'][i]}</td><td>${d.w.toFixed(1)}</td><td>${d.p.toFixed(3)}</td><td>${d.loss.toFixed(3)}</td></tr>`).join('');
  const initial={left:false,right:false};let state={...initial};
  const host=document.getElementById('chart');const chart=echarts.init(host,null,{renderer:'svg'});
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function probeSeries(d,name,seen,color){return {id:'probe-'+name,name,type:'scatter',data:seen?[[d.w,d.loss]]:[],symbolSize:18,itemStyle:{color,borderColor:'#F4F1E8',borderWidth:3},z:8,animationDuration:reduced?0:360};}
  function render(s){
    const both=s.left&&s.right;
    chart.setOption({animation:!reduced,animationDurationUpdate:reduced?0:360,textStyle:{fontFamily:'Noto Sans SC,system-ui,sans-serif',fontSize:16,color:'#20252B'},grid:{left:82,right:50,top:42,bottom:66},tooltip:{trigger:'item',confine:true,textStyle:{fontSize:16},formatter:p=>p.seriesId==='curve'?'损失 '+Number(p.value[1]).toFixed(3):p.seriesName+'<br>参数 w '+Number(p.value[0]).toFixed(1)+'<br>损失 '+Number(p.value[1]).toFixed(3)},xAxis:{type:'value',min:-2,max:2,interval:.5,name:'参数 w',nameLocation:'middle',nameGap:40,nameTextStyle:{fontSize:16,fontWeight:700},axisLabel:{fontSize:13,formatter:v=>v.toFixed(1)},axisLine:{lineStyle:{color:'#687078'}},splitLine:{show:false}},yAxis:{type:'value',min:0,max:2.2,interval:.5,name:'损失',nameGap:18,nameTextStyle:{fontSize:16,fontWeight:700},axisLabel:{fontSize:13},axisLine:{show:true,lineStyle:{color:'#687078'}},splitLine:{lineStyle:{color:'#D7D2C7',type:'dashed'}}},series:[{id:'curve',type:'line',data:curve,showSymbol:false,smooth:true,lineStyle:{width:3,color:'#20252B'},silent:true,animation:false},{id:'origin',name:'当前位置',type:'scatter',data:[[records[1].w,records[1].loss]],symbolSize:20,itemStyle:{color:'#2457A6',borderColor:'#F4F1E8',borderWidth:3},z:9,animation:false},probeSeries(records[0],'向左试',s.left,'#E56B2F'),probeSeries(records[2],'向右试',s.right,both?'#E56B2F':'#E56B2F')],graphic:[{id:'left-link',type:'line',invisible:!s.left,shape:{x1:0,y1:0,x2:0,y2:0},style:{stroke:'transparent'}},{id:'guide',type:'text',right:28,bottom:18,style:{text:both?'两侧都已试过':'点击按钮显示试探点',font:'15px Noto Sans SC',fill:'#687078'}}]}, {notMerge:true});
    updateCard('left',records[0],s.left,'比当前位置高');updateCard('right',records[2],s.right,'比当前位置低');
    document.getElementById('card-right').classList.toggle('best',both);document.getElementById('direction').classList.toggle('on',both);
  }
  function updateCard(side,d,seen,comparison){const el=document.getElementById('card-'+side);el.classList.toggle('seen',seen);const spans=el.querySelectorAll('.r-values span');spans[0].textContent=seen?d.p.toFixed(3):'—';spans[1].textContent=seen?d.loss.toFixed(3):'—';el.querySelector('.r-compare').textContent=seen?comparison:'尚未试探';}
  function setState(patch,msg){state=Object.assign({},state,patch);render(state);if(msg)document.getElementById('status').textContent=msg;}
  leftBtn.addEventListener('click',()=>setState({left:true},`向左试：参数 w = −0.5，损失 ${records[0].loss.toFixed(3)}，比当前位置高。`));
  rightBtn.addEventListener('click',()=>setState({right:true},`向右试：参数 w = +0.5，损失 ${records[2].loss.toFixed(3)}，比当前位置低。`));
  resetBtn.addEventListener('click',()=>{state={...initial};render(state);document.getElementById('status').textContent='已重新试探。当前位置 w = 0.0，损失 0.693。';});
  render(state);
  const ro=new ResizeObserver(()=>chart.resize());ro.observe(host);
  window.addEventListener('pagehide',()=>{ro.disconnect();chart.dispose();},{once:true});
})();
</script>
</body>
</html>
