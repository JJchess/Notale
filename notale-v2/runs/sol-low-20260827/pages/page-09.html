<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{display:flex;flex-direction:column;gap:0}
  .head{height:106px;flex:0 0 106px;display:flex;flex-direction:column;justify-content:flex-start;border-bottom:1px solid var(--line)}
  .kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.08em;color:var(--muted);margin:0 0 9px}
  h1{font:700 var(--fs-h1)/1.15 var(--font-sans);margin:0;color:var(--text)}
  .main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:26px 0 18px}
  .diagram{width:1380px;height:560px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel-bg);border:1px solid var(--line)}
  .claim{font:600 var(--fs-h1)/1.25 var(--font-serif);color:var(--text);margin:0 0 18px;position:relative;padding:0 26px}
  .claim:before,.claim:after{content:"";position:absolute;top:50%;width:96px;height:1px;background:var(--line)}
  .claim:before{right:100%}.claim:after{left:100%}
  .route{width:1320px;height:342px;position:relative;display:grid;grid-template-columns:420px 1fr 420px;align-items:center}
  .route:before{content:"";position:absolute;left:210px;right:210px;top:171px;border-top:1px solid var(--line);z-index:0}
  .state{height:320px;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;background:transparent}
  .state-label{font:700 var(--fs-h1)/1.2 var(--font-sans);margin-bottom:18px;color:var(--text)}
  .dial{width:350px;height:200px;border:3px solid var(--line);border-radius:28px;position:relative;background:var(--paper)}
  .ticks{position:absolute;left:42px;right:42px;top:42px;height:54px;display:flex;justify-content:space-between;align-items:flex-start}
  .tick{width:3px;height:30px;background:var(--line)}
  .tick.major{height:52px;background:var(--text)}
  .track{position:absolute;left:42px;right:42px;top:122px;height:6px;background:var(--line)}
  .knob{position:absolute;top:91px;width:58px;height:58px;border:7px solid var(--text);border-radius:50%;background:var(--paper);transform:translateX(-50%)}
  .before .knob{left:38%}.after .knob{left:62%;border-color:var(--focus)}
  .before .major:nth-child(3){background:var(--text);height:24px}.after .major:nth-child(4){background:var(--focus);height:24px}
  .basis{height:270px;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:28px}
  .basis-label{font:600 var(--fs-h2)/1.3 var(--font-sans);color:var(--focus);background:var(--panel-bg);padding:0 12px;z-index:2}
  .arrow-svg{position:absolute;left:0;top:55px;width:460px;height:190px;overflow:visible}
  #downPath{fill:none;stroke:var(--focus);stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:520;stroke-dashoffset:0}
  .evidence{font:700 var(--fs-h1)/1.25 var(--font-sans);color:var(--focus);margin-top:19px;min-height:26px}
  .under{width:1320px;display:grid;grid-template-columns:1fr 74px 1fr 74px 1fr;align-items:center;text-align:center;margin-top:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-height:82px;background:var(--paper)}
  .logic{font:600 var(--fs-h2)/1.35 var(--font-sans);color:var(--text);padding:0 18px}.logic small{display:block;font:400 var(--fs-label)/1.35 var(--font-sans);color:var(--muted);margin-bottom:4px}.logic span{display:block;font:400 var(--fs-sec)/1.35 var(--font-sans);color:var(--muted);margin-top:3px}.logic-arrow{font:700 var(--fs-h2)/1 var(--font-sans);color:var(--focus)}
  .change-label{display:none;grid-column:1/4;font:600 var(--fs-body)/1.3 var(--font-sans);color:var(--muted);letter-spacing:.02em}
  .change-label b{color:var(--text);font-weight:700}
  .foot{height:112px;flex:0 0 112px;border-top:1px solid var(--line);display:grid;grid-template-columns:1.15fr .85fr;align-items:center;column-gap:84px}
  .takeaway{font:600 var(--fs-lead)/1.45 var(--font-sans);margin:0;color:var(--text)}
  .next{font:400 var(--fs-sec)/1.45 var(--font-sans);margin:0;color:var(--muted)}
  .next strong{color:var(--text);font-weight:700}
  @media (prefers-reduced-motion:reduce){#downPath{stroke-dashoffset:0!important}.before,.basis,.after,.evidence{opacity:1!important}.after .knob{transform:translateX(-50%)!important}}
</style>
</head>
<body data-page="09" data-total="21">
<div id="stage">
  <header class="head">
    <p class="kicker">STEP 03 · 找方向</p>
    <h1>从现在起，参数不再靠猜</h1>
  </header>
  <main class="main min0">
    <section class="diagram focus k-generalization" aria-label="参数沿损失的下坡方向更新">
      <p class="claim">跟随下坡</p>
      <div class="route">
        <div class="state before panel q" id="beforeState">
          <div class="state-label">当前参数</div>
          <div class="dial" aria-hidden="true">
            <div class="ticks"><i class="tick"></i><i class="tick"></i><i class="tick major"></i><i class="tick"></i><i class="tick major"></i><i class="tick"></i></div>
            <div class="track"></div><div class="knob"></div>
          </div>
          <div class="small">起点 · 同一组刻度</div>
        </div>
        <div class="basis" id="basisState">
          <div class="basis-label">损失的下坡方向</div>
          <svg class="arrow-svg" viewBox="0 0 460 190" aria-hidden="true">
            <path id="downPath" d="M28 34 C132 42 150 132 294 138 L399 138 M399 138 L370 116 M399 138 L370 160"/>
          </svg>
        </div>
        <div class="state after panel q" id="afterState">
          <div class="state-label">更新后参数</div>
          <div class="dial" aria-hidden="true">
            <div class="ticks"><i class="tick"></i><i class="tick"></i><i class="tick major"></i><i class="tick major"></i><i class="tick"></i><i class="tick"></i></div>
            <div class="track"></div><div class="knob" id="newKnob"></div>
          </div>
          <div class="evidence" id="evidence">损失更小</div>
          <div class="small">落点 · 相邻刻度</div>
        </div>
      </div>
      <div class="under" aria-label="参数更新的因果链">
        <div class="logic"><small>观察依据</small>损失往哪边下降<span>先固定当前参数</span><span>只判断左右方向</span></div><div class="logic-arrow">→</div>
        <div class="logic"><small>修改动作</small>参数向同一方向移动<span>不跳到远处</span><span>只迈一个小格</span></div><div class="logic-arrow">→</div>
        <div class="logic"><small>结果检验</small>新位置的损失更小<span>比较修改前后</span><span>更小才算下坡</span></div>
      </div>
    </section>
  </main>
  <footer class="foot">
    <p class="takeaway">损失的下坡箭头指向哪里，参数就向哪里迈一小步。</p>
    <p class="next"><strong>下一问</strong>　如果有很多个参数，怎样为每个旋钮画出自己的箭头？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:9,total:21});
  const before = document.getElementById('beforeState');
  const basis = document.getElementById('basisState');
  const after = document.getElementById('afterState');
  const path = document.getElementById('downPath');
  const knob = document.getElementById('newKnob');
  const evidence = document.getElementById('evidence');
  let active = [];
  const cancel = () => { active.forEach(a => a.cancel()); active = []; };
  const settled = () => {
    before.style.opacity='1'; basis.style.opacity='1'; after.style.opacity='1';
    path.style.strokeDashoffset='0'; knob.style.transform='translateX(-50%)'; evidence.style.opacity='1';
  };
  const play = () => {
    cancel();
    if (Deck.reduced()) { settled(); return; }
    before.style.opacity='0'; basis.style.opacity='1'; after.style.opacity='1';
    path.style.strokeDashoffset='520'; knob.style.transform='translateX(-78px)'; evidence.style.opacity='0';
    active.push(before.animate([{opacity:0},{opacity:1}],{delay:60,duration:300,fill:'forwards',easing:'ease-out'}));
    active.push(path.animate([{strokeDashoffset:520},{strokeDashoffset:0}],{delay:360,duration:450,fill:'forwards',easing:'ease-in-out'}));
    active.push(knob.animate([{transform:'translateX(-78px)'},{transform:'translateX(-50%)'}],{delay:690,duration:500,fill:'forwards',easing:'cubic-bezier(.22,.8,.3,1)'}));
    const last=evidence.animate([{opacity:0},{opacity:1}],{delay:1190,duration:180,fill:'forwards',easing:'ease-out'});
    active.push(last); last.finished.then(settled).catch(()=>{});
  };
  requestAnimationFrame(play);
  addEventListener('pagehide',cancel,{once:true});
})();
</script>
</body>
</html>
