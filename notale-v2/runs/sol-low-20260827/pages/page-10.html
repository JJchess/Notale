<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}
.p10-head{height:112px;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:1px solid var(--line);padding-bottom:16px}
.p10-kicker{font:600 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.p10-head h1{font:700 var(--fs-h1)/1.18 var(--font-sans);margin:0;max-width:1120px;color:var(--text)}
#gradient-widget{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
#gradient-widget .gw-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.42fr) minmax(430px,.78fr);gap:64px}
#gradient-widget .gw-left{display:flex;flex-direction:column;min-height:0}
#gradient-widget .gw-rail{height:74px;display:grid;grid-template-columns:auto 1fr 74px auto;gap:18px;align-items:center}
#gradient-widget .gw-rail label{font:600 var(--fs-body)/1.2 var(--font-sans)}
#gradient-widget output{font:700 var(--fs-body)/1 var(--font-mono);font-variant-numeric:tabular-nums}
#gradient-widget .gw-stage{flex:1;min-height:0;width:100%;display:block;background:rgba(255,255,255,.26);border:1px solid var(--line)}
#gradient-widget .gw-grid{stroke:var(--line);stroke-width:1;stroke-dasharray:4 7;vector-effect:non-scaling-stroke}
#gradient-widget .gw-axis{stroke:var(--text);stroke-width:1.5;vector-effect:non-scaling-stroke}
#gradient-widget .gw-curve{fill:none;stroke:var(--forward);stroke-width:4;vector-effect:non-scaling-stroke}
#gradient-widget .gw-guide{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5;vector-effect:non-scaling-stroke}
#gradient-widget .gw-probe{fill:var(--paper);stroke:var(--text);stroke-width:3;vector-effect:non-scaling-stroke}
#gradient-widget .gw-probe.current{fill:var(--forward);stroke:var(--forward)}
#gradient-widget .gw-svg-label{font:15px var(--font-sans);fill:var(--muted)}
#gradient-widget .gw-formula{font:600 18px var(--font-mono);fill:var(--text)}
#gradient-widget .gw-right{display:flex;flex-direction:column;gap:14px;min-height:0}
#gradient-widget .gw-right h2{font:700 var(--fs-h2)/1.25 var(--font-sans);margin:0 0 2px}
#gradient-widget .gw-compare{display:grid;grid-template-columns:1fr;gap:8px}
#gradient-widget .gw-reading{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;min-height:76px;padding:12px 16px;border:1px solid var(--line);background:rgba(255,255,255,.18)}
#gradient-widget .gw-reading.best{outline:3px solid var(--focus);outline-offset:-3px}
#gradient-widget .gw-reading strong{font:600 var(--fs-sec)/1.25 var(--font-sans)}
#gradient-widget .gw-reading span{display:block;color:var(--muted);font:var(--fs-label)/1.3 var(--font-sans);margin-top:5px}
#gradient-widget .gw-reading output{font-size:22px;color:var(--text)}
#gradient-widget .gw-meter{flex:1;min-height:0;padding:18px 20px;border:2px solid var(--text);background:var(--panel-bg);display:flex;flex-direction:column;justify-content:center;gap:14px}
#gradient-widget .gw-tag{font:600 var(--fs-label)/1.2 var(--font-mono);color:var(--muted)}
#gradient-widget .gw-direction{display:flex;align-items:center;gap:14px;font:700 26px/1.2 var(--font-sans)}
#gradient-widget .gw-arrow{display:inline-flex;width:78px;height:34px;align-items:center;justify-content:center;color:var(--focus);font:700 38px/1 var(--font-sans);transition:transform 160ms ease,width 160ms ease}
#gradient-widget .gw-sensitivity{font:var(--fs-body)/1.45 var(--font-sans)}
#gradient-widget .gw-sensitivity b{font:700 27px/1 var(--font-mono);font-variant-numeric:tabular-nums}
#gradient-widget .gw-foot{height:74px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:32px}
#gradient-widget .gw-foot .claim{font:600 var(--fs-body)/1.4 var(--font-sans);max-width:920px}
#gradient-widget .gw-next{font:var(--fs-sec)/1.35 var(--font-sans);color:var(--muted);text-align:right;max-width:470px}
#gradient-widget .btn{white-space:nowrap}
#gradient-widget #gw-status{position:absolute;left:56px;top:145px;width:420px;height:30px;overflow:hidden;opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){#gradient-widget .gw-arrow{transition:none}}
</style>
</head>
<body data-page="10" data-total="21">
<div id="stage">
  <header class="p10-head">
    <div class="p10-kicker">STEP 03 · 找方向</div>
    <h1>梯度告诉旋钮往哪边转，也告诉它此刻有多敏感</h1>
  </header>

  <section id="gradient-widget" aria-label="梯度方向与敏感度探针">
    <div class="gw-main split-lr">
      <div class="gw-left min0">
        <div class="gw-rail">
          <label for="gw-range">参数旋钮 <span class="num">w</span></label>
          <input id="gw-range" type="range" min="-1" max="5" step="0.1" value="4" aria-describedby="gw-hint">
          <output id="gw-w" for="gw-range">4.0</output>
          <button class="btn" id="gw-reset" type="button">回到 4.0</button>
        </div>
        <svg class="gw-stage no-pan" viewBox="0 0 900 470" role="img" aria-labelledby="gw-svg-title gw-svg-desc">
          <title id="gw-svg-title">损失曲线与三个同步探针</title>
          <desc id="gw-svg-desc">拖动参数旋钮，当前位置与左右各零点二的探针沿损失曲线移动。</desc>
          <g id="gw-grid"></g>
          <line class="gw-axis" x1="76" y1="410" x2="852" y2="410"/>
          <line class="gw-axis" x1="76" y1="54" x2="76" y2="410"/>
          <text class="gw-svg-label" x="840" y="442">w</text>
          <text class="gw-svg-label" x="28" y="65">损失</text>
          <text class="gw-formula" x="104" y="86">损失 = (w − 2)²</text>
          <path class="gw-curve" id="gw-curve"/>
          <g id="gw-probes"></g>
        </svg>
        <div class="hint" id="gw-hint">拖动 w；比较左右探针，再看箭头和敏感度。</div>
      </div>

      <div class="gw-right min0">
        <h2>同一位置的三次读数</h2>
        <div class="gw-compare k-comparison">
          <div class="gw-reading" data-reading="left"><div><strong>向左试 0.2</strong><span data-param></span></div><output data-loss></output></div>
          <div class="gw-reading" data-reading="center"><div><strong>当前位置</strong><span data-param></span></div><output data-loss></output></div>
          <div class="gw-reading" data-reading="right"><div><strong>向右试 0.2</strong><span data-param></span></div><output data-loss></output></div>
        </div>
        <div class="gw-meter panel">
          <div class="gw-tag">梯度 = 方向 + 敏感度</div>
          <div class="gw-direction"><span>此刻应向：</span><span class="gw-arrow" id="gw-arrow" aria-hidden="true">←</span><output id="gw-direction">左</output></div>
          <div class="gw-sensitivity">敏感度：每转 1 格，损失约变化 <b id="gw-gradient">4.00</b></div>
        </div>
      </div>
    </div>
    <footer class="gw-foot">
      <div class="claim">箭头方向指向损失下降的一侧；数值越大，同样转一点，损失变化越明显。</div>
      <div class="gw-next">如果模型有很多旋钮，怎样同时记下它们各自的箭头？</div>
    </footer>
    <div class="sr-only" id="gw-status" aria-live="polite"></div>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  const root=document.getElementById('gradient-widget');
  const range=root.querySelector('#gw-range'), wOut=root.querySelector('#gw-w'), reset=root.querySelector('#gw-reset');
  const curve=root.querySelector('#gw-curve'), grid=root.querySelector('#gw-grid'), probes=root.querySelector('#gw-probes');
  const directionOut=root.querySelector('#gw-direction'), arrow=root.querySelector('#gw-arrow'), gradOut=root.querySelector('#gw-gradient'), status=root.querySelector('#gw-status');
  const readings=[...root.querySelectorAll('[data-reading]')];
  const initial=4, delta=.2, x0=76, x1=852, y0=410, y1=54, maxLoss=9.5;
  let state={w:initial}, destroyed=false;
  const loss=w=>Lec.P.meanSquaredError([w],[2]).value;
  const X=w=>x0+(w+1)/6*(x1-x0);
  const Y=v=>y0-v/maxLoss*(y0-y1);
  function buildStatic(){
    let g='';
    for(let w=-1;w<=5;w++){const x=X(w);g+=`<line class="gw-grid" x1="${x}" y1="54" x2="${x}" y2="410"/><text class="gw-svg-label" x="${x}" y="437" text-anchor="middle">${w}</text>`}
    for(let v=0;v<=8;v+=2){const y=Y(v);g+=`<line class="gw-grid" x1="76" y1="${y}" x2="852" y2="${y}"/><text class="gw-svg-label" x="62" y="${y+5}" text-anchor="end">${v}</text>`}
    grid.innerHTML=g;
    let d='';for(let i=0;i<=120;i++){const w=-1+i/20;d+=(i?'L':'M')+X(w)+' '+Y(loss(w))+' '};curve.setAttribute('d',d);
  }
  function transition(action){if(action.type==='set')state={w:Math.max(-1,Math.min(5,Math.round(action.value*10)/10))};if(action.type==='reset')state={w:initial};render()}
  function render(){
    const w=state.w, vals=[w-delta,w,w+delta], losses=vals.map(loss);
    const gradient=Math.abs(Lec.P.finiteDifferenceGradient(v=>loss(v[0]),[w],Lec.K.FINITE_DIFFERENCE_STEP)[0]);
    let dir='flat';if(losses[0]<losses[1]-1e-9)dir='left';else if(losses[2]<losses[1]-1e-9)dir='right';
    range.value=w;wOut.textContent=w.toFixed(1);
    readings.forEach((el,i)=>{el.querySelector('[data-param]').textContent=`w = ${vals[i].toFixed(1)}`;el.querySelector('[data-loss]').textContent=losses[i].toFixed(2);el.classList.toggle('best',(dir==='left'&&i===0)||(dir==='right'&&i===2));});
    probes.innerHTML=vals.map((v,i)=>{const x=X(v),y=Y(losses[i]),name=['左','当前','右'][i],dy=-15;return `<line class="gw-guide" x1="${x}" y1="${y}" x2="${x}" y2="410"/><circle class="gw-probe ${i===1?'current':''}" cx="${x}" cy="${y}" r="${i===1?8:7}"/><text class="gw-svg-label" x="${x}" y="${Math.max(112,y+dy)}" text-anchor="middle">${name}</text>`}).join('');
    const text=dir==='left'?'左':dir==='right'?'右':'两侧都不更低';directionOut.textContent=text;arrow.textContent=dir==='left'?'←':dir==='right'?'→':'—';arrow.style.transform=`scaleX(${dir==='flat'?'.42':'1'})`;gradOut.textContent=gradient.toFixed(2);
  }
  function announce(){status.textContent=`参数 ${state.w.toFixed(1)}，应向${directionOut.textContent}，敏感度 ${gradOut.textContent}`}
  function onInput(){transition({type:'set',value:Number(range.value)})}
  function onChange(){announce()}
  function onReset(){transition({type:'reset'});announce();range.focus()}
  range.addEventListener('input',onInput);range.addEventListener('change',onChange);reset.addEventListener('click',onReset);
  buildStatic();render();Deck.init({index:10,total:21});
  root.destroyGradientWidget=()=>{if(destroyed)return;destroyed=true;range.removeEventListener('input',onInput);range.removeEventListener('change',onChange);reset.removeEventListener('click',onReset);delete root.destroyGradientWidget};
})();
</script>
</body>
</html>
