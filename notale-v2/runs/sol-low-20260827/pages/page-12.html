<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F4F1E8;--text:#20252B;--font-sans:"Noto Sans SC",system-ui,sans-serif}
#stage{gap:14px}
.head{height:88px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--line)}
.kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.08em;color:var(--muted);margin-bottom:7px}
h1{font-size:var(--fs-h1);line-height:1.15;margin:0;font-weight:750;max-width:1340px}
.rulebar{height:50px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);padding:0 18px;background:var(--panel-bg)}
.rule{font-size:var(--fs-lead);font-weight:650}.scope{font-size:var(--fs-sec);color:var(--muted)}
.compare{height:452px;display:grid;grid-template-columns:repeat(3,1fr);gap:64px}
.case{min-width:0;display:flex;flex-direction:column;border:1px solid var(--line);background:rgba(255,255,255,.18);padding:12px 12px 10px;transition:border-color .12s}
.case.active{border:3px solid var(--focus);padding:10px 10px 8px}
.casehead{height:58px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.casehead h2{font-size:var(--fs-h2);margin:0 0 4px}.lr{font:700 var(--fs-body)/1 var(--font-mono);white-space:nowrap}.verdict{font-size:var(--fs-label);color:var(--muted)}
.chart{height:305px;min-height:0}.readout{height:58px;border-top:1px solid var(--line);padding-top:9px;display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:7px}
.metric{font-size:var(--fs-label);color:var(--muted)}.metric b{display:block;margin-top:3px;color:var(--text);font:650 var(--fs-sec)/1.1 var(--font-mono)}.metric b.rise{color:var(--focus)}
.controlrow{height:112px;display:grid;grid-template-columns:500px 1fr;gap:64px;border-top:1px solid var(--line);padding-top:12px}
.ctl{display:grid;grid-template-columns:126px 1fr;align-items:center;gap:14px}.ctl label{font-weight:700;font-size:var(--fs-body)}
.rangebox{position:relative;padding:0 4px 24px}.rangebox input{width:100%;accent-color:var(--focus)}.ticks{position:absolute;left:4px;right:4px;bottom:0;display:flex;justify-content:space-between;font:600 var(--fs-label)/1 var(--font-mono)}
.actions{display:flex;align-items:center;gap:12px}.btn{min-width:120px}.btn.primary{border-color:var(--focus);color:var(--text)}.status{margin-left:auto;min-width:260px;text-align:right}.status strong{display:block;font:700 var(--fs-body)/1.3 var(--font-mono)}.status span{font-size:var(--fs-label);color:var(--muted)}
.foot{height:76px;display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;border-top:1px solid var(--line)}.claim{font-size:var(--fs-body);font-weight:650}.next{font-size:var(--fs-sec);color:var(--muted)}
.fallback{position:absolute;left:-9999px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-page="12" data-total="21">
<div id="stage">
  <header class="head">
    <div class="kicker">STEP 03 · 学习率</div>
    <h1>方向相同，步子不同：太小走得慢，太大可能越过低处</h1>
  </header>
  <div class="rulebar" aria-label="参数更新关系">
    <div class="rule">新参数 = 旧参数 − 学习率 × 下坡建议</div>
    <div class="scope">同一起点 · 同一损失地形 · 同样更新 12 次</div>
  </div>
  <main class="compare canvas-full k-comparison" aria-label="三种学习率的损失轨迹比较">
    <figure class="case min0" data-rate="0.03"><figcaption class="casehead"><div><h2>步子很小</h2><div class="verdict">慢，不等于方向错</div></div><div class="lr">η 0.03</div></figcaption><div class="chart" data-chart="0.03" role="img" aria-label="学习率0.03的参数更新次数与损失折线图"></div><div class="readout"></div></figure>
    <figure class="case min0 active" data-rate="0.3"><figcaption class="casehead"><div><h2>步子适中</h2><div class="verdict">这次示例中较稳</div></div><div class="lr">η 0.3</div></figcaption><div class="chart" data-chart="0.3" role="img" aria-label="学习率0.3的参数更新次数与损失折线图"></div><div class="readout"></div></figure>
    <figure class="case min0" data-rate="30"><figcaption class="casehead"><div><h2>步子很大</h2><div class="verdict">大步可能破坏下降</div></div><div class="lr">η 30</div></figcaption><div class="chart" data-chart="30" role="img" aria-label="学习率30的参数更新次数与损失折线图"></div><div class="readout"></div></figure>
  </main>
  <section class="controlrow" aria-label="轨迹控制">
    <div class="ctl"><label for="rate">选择学习率</label><div class="rangebox"><input id="rate" type="range" min="0" max="2" step="1" value="1" aria-valuetext="0.3"><div class="ticks"><span>0.03</span><span>0.3</span><span>30</span></div></div></div>
    <div class="actions"><button class="btn primary" id="step">走一步</button><button class="btn" id="play">连续走 12 步</button><button class="btn" id="reset">重新开始</button><div class="status" aria-live="polite"><strong id="live">学习率 0.3 · 第 0 次更新</strong><span>拖动学习率，再比较橙色落点</span></div></div>
  </section>
  <footer class="foot"><div class="claim">学习率不改变下坡方向，只把方向放大成这一次实际迈出的步子。</div><div class="next">下一问：选好步长后，模型怎样把“预测—计错—改参数”连续重复起来？</div></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:12,total:21});
  var rates=[0.03,0.3,30], state={rateIndex:1,step:0,playing:false}, timer=null;
  function loss(t){return 1-Math.cos(t)}
  function makeTrack(rate){var out=[],theta=2;out.push({step:0,theta:theta,loss:loss(theta),delta:null});for(var i=1;i<=12;i++){var g=Lec.P.finiteDifferenceGradient(function(v){return loss(v[0])},[theta],1e-5)[0];var next=theta-rate*g;var nl=loss(next);out.push({step:i,theta:next,loss:nl,delta:nl-out[out.length-1].loss});theta=next}return out}
  var tracks=rates.map(makeTrack), charts=[];
  function option(track,active){var shown=track.slice(0,active+1);var last=shown[shown.length-1];return {animation:!Deck.reduced(),animationDurationUpdate:420,textStyle:{fontFamily:'Noto Sans SC, sans-serif',fontSize:16,color:'#20252B'},grid:{left:57,right:18,top:18,bottom:47},tooltip:{trigger:'axis',confine:true,textStyle:{fontSize:16},formatter:function(p){var d=track[p[0].dataIndex];return '第 '+d.step+' 次更新<br>参数 '+d.theta.toFixed(4)+'<br>损失 '+d.loss.toFixed(4)}},xAxis:{type:'value',name:'参数更新次数',min:0,max:12,interval:4,nameLocation:'middle',nameGap:30,nameTextStyle:{fontSize:14},axisLabel:{fontSize:12},axisLine:{lineStyle:{color:'#70757A'}},splitLine:{show:false}},yAxis:{type:'value',name:'损失',min:0,max:2,interval:1,nameTextStyle:{fontSize:14},axisLabel:{fontSize:12,formatter:function(v){return v.toFixed(1)}},axisLine:{show:true,lineStyle:{color:'#70757A'}},splitLine:{lineStyle:{color:'#D8D3C7'}}},series:[{id:'full',type:'line',data:track.map(function(d){return [d.step,d.loss]}),symbol:'none',silent:true,lineStyle:{color:'#9BA3AA',width:2,opacity:.45}},{id:'walk',type:'line',data:shown.map(function(d){return [d.step,d.loss]}),showSymbol:true,symbolSize:7,lineStyle:{color:'#2457A6',width:3},itemStyle:{color:'#2457A6'}},{id:'point',type:'scatter',data:[[last.step,last.loss]],symbolSize:14,itemStyle:{color:'#E56B2F',borderColor:'#F4F1E8',borderWidth:2},z:5}]};}
  document.querySelectorAll('.chart').forEach(function(el,i){charts[i]=echarts.init(el,null,{renderer:'svg'})});
  function render(){var selected=state.rateIndex;document.querySelectorAll('.case').forEach(function(el,i){el.classList.toggle('active',i===selected);var d=tracks[i][i===selected?state.step:0];var change=d.delta===null?'—':(d.delta>0?'上升 +':'下降 ')+Math.abs(d.delta).toFixed(4);el.querySelector('.readout').innerHTML='<div class="metric">参数 θ<b>'+d.theta.toFixed(4)+'</b></div><div class="metric">当前损失<b>'+d.loss.toFixed(4)+'</b></div><div class="metric">本步变化<b class="'+(d.delta>0?'rise':'')+'">'+change+'</b></div>';charts[i].setOption(option(tracks[i],i===selected?state.step:0),{notMerge:true})});var rate=rates[selected];var input=document.getElementById('rate');input.value=selected;input.setAttribute('aria-valuetext',String(rate));document.getElementById('live').textContent='学习率 '+rate+' · 第 '+state.step+' 次更新';document.getElementById('play').textContent=state.playing?'暂停':'连续走 12 步';}
  function setState(patch){Object.keys(patch).forEach(function(k){state[k]=patch[k]});render()}
  function stop(){if(timer){clearInterval(timer);timer=null}state.playing=false}
  document.getElementById('rate').addEventListener('input',function(){stop();setState({rateIndex:+this.value,step:0,playing:false})});
  document.getElementById('step').addEventListener('click',function(){stop();setState({step:Math.min(12,state.step+1),playing:false})});
  document.getElementById('play').addEventListener('click',function(){if(state.playing){stop();render();return}if(state.step>=12)state.step=0;state.playing=true;render();timer=setInterval(function(){if(state.step>=12){stop();render()}else setState({step:state.step+1})},Deck.reduced()?40:650)});
  document.getElementById('reset').addEventListener('click',function(){stop();state={rateIndex:1,step:0,playing:false};render()});
  var ro=new ResizeObserver(function(){charts.forEach(function(c){c.resize()})});document.querySelectorAll('.chart').forEach(function(el){ro.observe(el)});
  window.addEventListener('beforeunload',function(){stop();ro.disconnect();charts.forEach(function(c){c.dispose()})},{once:true});
  render();
})();
</script>
</body>
</html>
