<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="14" data-total="21">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:0;overflow:hidden}
    .p14-head{height:112px;flex:none;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-start}
    .p14-kicker{font:600 var(--fs-label)/1.2 var(--font-sans);letter-spacing:.09em;color:var(--muted);margin:0 0 11px}
    .p14-head h1{font:700 var(--fs-h1)/1.18 var(--font-sans);margin:0;color:var(--text)}
    .p14-main.focus.k-generalization{flex:1;min-height:0;width:100%;max-width:none;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding-top:24px}
    .p14-claim{height:50px;flex:none;display:flex;align-items:center;justify-content:center;font:700 var(--fs-h2)/1.2 var(--font-sans);letter-spacing:.04em}
    .p14-visual{position:relative;flex:1;min-height:0;width:100%;align-self:stretch;background:var(--panel-bg);border-top:1px solid var(--line)}
    .p14-visual:after{content:"";position:absolute;inset:28px 14px;border:1px solid var(--line);pointer-events:none}
    .p14-spine{position:absolute;left:6%;right:6%;top:48%;height:1px;background:var(--text)}
    .p14-spine:before,.p14-spine:after{content:"";position:absolute;top:-4px;width:9px;height:9px;background:var(--text);transform:rotate(45deg)}
    .p14-spine:before{left:-2px}.p14-spine:after{right:-2px}
    .p14-layout{position:absolute;inset:0;width:100%;z-index:1;display:grid;grid-template-columns:240px minmax(0,1fr) 300px;column-gap:24px;align-items:center}
    .p14-end{height:360px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line)}
    .p14-tag{margin-bottom:18px}
    .p14-note{margin:17px 0 0;font:500 var(--fs-sec)/1.35 var(--font-sans);color:var(--muted)}
    .p14-neuron{width:240px;height:210px;display:block}
    .p14-network{width:330px;height:230px;display:block}
    .p14-flow{height:430px;background:var(--panel-bg);display:flex;flex-direction:column;justify-content:center;align-items:stretch;padding:0 10px}
    .p14-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;align-items:center}
    .p14-step{position:relative;height:290px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:11px;align-items:center;justify-content:center;font:650 var(--fs-body)/1 var(--font-sans)}
    .p14-step span{font:500 var(--fs-sec)/1.2 var(--font-sans);color:var(--muted)}
    .p14-step:not(:last-child):after{content:"";position:absolute;width:20px;height:1px;background:var(--text);right:-21px;top:144px}
    .p14-step:not(:last-child):before{content:"";position:absolute;right:-21px;top:140px;width:8px;height:8px;border-top:1px solid var(--text);border-right:1px solid var(--text);transform:rotate(45deg)}
    .p14-diff{height:46px;flex:none;display:flex;align-items:center;justify-content:center;font:650 var(--fs-lead)/1.3 var(--font-sans);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .p14-diff strong{color:var(--action);margin-left:.25em}
    .p14-foot{height:104px;flex:none;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:64px}
    .p14-take{font:600 var(--fs-lead)/1.4 var(--font-sans);margin:0;max-width:980px}
    .p14-next{font:500 var(--fs-sec)/1.35 var(--font-sans);color:var(--muted);margin:0;text-align:right}
    .p14-next b{display:block;font-weight:650;color:var(--text);margin-top:5px}
    svg{overflow:visible}
  </style>

  <header class="p14-head">
    <p class="p14-kicker">IV · 从一个神经元到一张网络</p>
    <h1>网络变深了，学习的动作没有变</h1>
  </header>

  <main class="p14-main min0 focus k-generalization" aria-label="从一个神经元到多层网络，学习动作保持不变">
    <div class="p14-claim">同一套动作</div>
    <section class="p14-visual min0" aria-label="单个神经元与多层网络共享四步学习主干">
      <div class="p14-spine" aria-hidden="true"></div>
      <div class="p14-layout">
        <div class="p14-end min0">
          <span class="tag p14-tag">1 个神经元</span>
          <svg class="p14-neuron" viewBox="0 0 170 112" role="img" aria-label="一个带输入和输出连接的神经元">
            <g fill="none" stroke="var(--text)" stroke-width="2">
              <path d="M2 33H31M2 79H31M139 56H168"/>
              <path d="M31 20L55 7H116L139 28V84L116 105H55L31 92Z" fill="var(--bg)"/>
              <path d="M31 33H50M31 79H50"/>
            </g>
            <circle cx="84" cy="56" r="18" fill="none" stroke="var(--forward)" stroke-width="3"/>
            <path d="M75 56h18M89 51l5 5-5 5" fill="none" stroke="var(--forward)" stroke-width="2"/>
          </svg>
          <p class="p14-note">少量可调参数</p>
        </div>

        <div class="p14-flow min0">
          <div class="p14-steps" aria-label="学习的四个动作">
            <div class="p14-step">预测<span>得到预测</span></div>
            <div class="p14-step">计错<span>得到错误</span></div>
            <div class="p14-step">找方向<span>朝向降错</span></div>
            <div class="p14-step">改参数<span>修改连接</span></div>
          </div>
        </div>

        <div class="p14-end min0">
          <span class="tag p14-tag">更多连接</span>
          <svg class="p14-network" viewBox="0 0 300 150" role="img" aria-label="三列神经元组成的多层网络">
            <g fill="none" stroke="var(--line)" stroke-width="1.5">
              <path d="M43 30L142 22M43 30L142 75M43 30L142 128M43 75L142 22M43 75L142 75M43 75L142 128M43 120L142 22M43 120L142 75M43 120L142 128"/>
              <path d="M158 22L257 45M158 22L257 105M158 75L257 45M158 75L257 105M158 128L257 45M158 128L257 105"/>
            </g>
            <g fill="var(--bg)" stroke="var(--text)" stroke-width="2">
              <circle cx="35" cy="30" r="9"/><circle cx="35" cy="75" r="9"/><circle cx="35" cy="120" r="9"/>
              <circle cx="150" cy="22" r="9"/><circle cx="150" cy="75" r="9"/><circle cx="150" cy="128" r="9"/>
              <circle cx="265" cy="45" r="9"/><circle cx="265" cy="105" r="9"/>
            </g>
            <path d="M274 75H298" stroke="var(--forward)" stroke-width="3"/>
          </svg>
          <p class="p14-note">更多可调参数</p>
        </div>
      </div>
    </section>
    <div class="p14-diff">同一份错误，要通知<strong>更多连接</strong></div>
  </main>

  <footer class="p14-foot">
    <p class="p14-take">仍是先得到一份错误，再让更多可调连接一起朝降错方向修改。</p>
    <p class="p14-next">下一问<b>隐藏层里的神经元，究竟为预测多做了什么？</b></p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
