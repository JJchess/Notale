<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:20px}
    .p15-head{height:104px;display:flex;flex-direction:column;justify-content:flex-end;gap:7px}
    .p15-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--muted)}
    .p15-head h1{margin:0;font:700 var(--fs-h1)/1.2 var(--font-sans);color:var(--text)}
    #comboLab{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
    #comboLab .p15-flow{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:72px}
    #comboLab .p15-panel{position:relative;z-index:1;min-width:0;min-height:0;border:1px solid var(--line);background:var(--panel-bg);padding:22px;display:flex;flex-direction:column}
    #comboLab h2{margin:0 0 18px;font:700 var(--fs-h2)/1.2 var(--font-sans)}
    #comboLab .inputs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:auto 0}
    #comboLab .input-btn{height:72px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:700 24px/1 var(--font-mono);cursor:pointer;border-radius:8px}
    #comboLab .input-btn[aria-pressed="true"]{border:4px solid var(--action);color:var(--action)}
    #comboLab button:focus-visible,#comboLab input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    #comboLab .input-note{margin-top:18px;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
    #comboLab .units{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}
    #comboLab .unitbox{border:1px solid var(--line);background:var(--bg);padding:18px;display:flex;flex-direction:column;gap:13px;min-width:0}
    #comboLab .unit-name{font-size:var(--fs-body);font-weight:700;min-height:48px;line-height:1.35}
    #comboLab .meter{position:relative;height:150px;border:1px solid var(--line);background:var(--paper);overflow:hidden}
    #comboLab .meter:after{content:"0.5";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--muted);padding-left:6px;font:var(--fs-tick)/1 var(--font-mono);color:var(--muted)}
    #comboLab .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--forward);transition:height 240ms ease}
    #comboLab .reading{display:flex;align-items:center;justify-content:space-between;gap:8px}
    #comboLab .reading output{font:700 25px/1 var(--font-mono);color:var(--forward)}
    #comboLab .state-tag{font-size:var(--fs-label);font-weight:700;border:1px solid var(--line);padding:5px 8px;border-radius:999px;white-space:nowrap}
    #comboLab .switch{display:flex;align-items:center;gap:8px;font-size:var(--fs-label);line-height:1.25;margin-top:auto;cursor:pointer}
    #comboLab .switch input{width:22px;height:22px;accent-color:var(--action)}
    #comboLab .out-question{font-size:var(--fs-body);line-height:1.4;color:var(--muted)}
    #comboLab .out-core{margin:auto 0;text-align:center}
    #comboLab .out-value{font:700 64px/1 var(--font-mono);color:var(--forward);font-variant-numeric:tabular-nums}
    #comboLab .answer{display:inline-block;margin-top:16px;border:3px solid var(--forward);padding:9px 24px;font-size:26px;font-weight:800}
    #comboLab .threshold{margin-top:16px;color:var(--muted);font-size:var(--fs-label)}
    #comboLab .reset{align-self:center;margin-top:auto}
    #comboLab .links{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:visible}
    #comboLab .link{fill:none;stroke:var(--forward);stroke-width:3;marker-end:url(#p15arrow);transition:stroke-width 140ms,opacity 140ms}
    #comboLab .link.off{stroke:var(--muted);stroke-dasharray:9 8;marker-end:url(#p15arrowMute)}
    #comboLab .link.pulse{stroke:var(--action);stroke-width:7}
    #comboLab .foot{height:86px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:44px;align-items:center}
    #comboLab .claim{font-size:var(--fs-lead);line-height:1.4;font-weight:650}
    #comboLab .next{font-size:var(--fs-sec);line-height:1.4;color:var(--muted);text-align:right;max-width:430px}
    @media (prefers-reduced-motion:reduce){#comboLab .fill,#comboLab .link{transition:none}}
  </style>
</head>
<body data-page="15" data-total="21">
  <div id="stage">
    <header class="p15-head">
      <div class="p15-kicker">HIDDEN COMBINATIONS</div>
      <h1>一个神经元认一种组合，合起来就能认出更复杂的模式</h1>
    </header>

    <main id="comboLab" aria-label="隐藏单元组合实验">
      <div class="p15-flow triptych k-classification min0">
        <svg class="links" viewBox="0 0 1488 570" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <marker id="p15arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2457A6"/></marker>
            <marker id="p15arrowMute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#73777d"/></marker>
          </defs>
          <path class="link in-link" data-in="a" d="M416 285 C450 285 456 188 490 188"/>
          <path class="link in-link" data-in="b" d="M416 285 C450 285 456 382 490 382"/>
          <path class="link out-link" data-out="a" d="M998 188 C1033 188 1036 285 1072 285"/>
          <path class="link out-link" data-out="b" d="M998 382 C1033 382 1036 285 1072 285"/>
        </svg>

        <section class="p15-panel panel q min0">
          <h2>输入组合</h2>
          <div class="inputs" role="group" aria-label="选择二元输入">
            <button class="input-btn" type="button" data-x="0,0" aria-pressed="false">0, 0</button>
            <button class="input-btn" type="button" data-x="1,0" aria-pressed="true">1, 0</button>
            <button class="input-btn" type="button" data-x="0,1" aria-pressed="false">0, 1</button>
            <button class="input-btn" type="button" data-x="1,1" aria-pressed="false">1, 1</button>
          </div>
          <p class="input-note">选择一种输入，比较两个隐藏单元分别“认出”了什么。</p>
        </section>

        <section class="p15-panel panel q min0">
          <h2>隐藏层：先认局部模式</h2>
          <div class="units">
            <article class="unitbox">
              <div class="unit-name">单元 A<br>“更像 1, 0”</div>
              <div class="meter" aria-hidden="true"><div class="fill" data-fill="a"></div></div>
              <div class="reading"><output data-value="a">0.953</output><span class="state-tag" data-tag="a">强响应</span></div>
              <label class="switch"><input type="checkbox" data-toggle="a" checked>参与合成</label>
            </article>
            <article class="unitbox">
              <div class="unit-name">单元 B<br>“更像 0, 1”</div>
              <div class="meter" aria-hidden="true"><div class="fill" data-fill="b"></div></div>
              <div class="reading"><output data-value="b">0.000</output><span class="state-tag" data-tag="b">弱响应</span></div>
              <label class="switch"><input type="checkbox" data-toggle="b" checked>参与合成</label>
            </article>
          </div>
        </section>

        <section class="p15-panel panel q min0">
          <h2>合成预测</h2>
          <div class="out-question">两个输入是否不同？</div>
          <div class="out-core">
            <output class="out-value" data-output aria-live="polite">0.938</output>
            <div><span class="answer" data-answer>是</span></div>
            <div class="threshold">固定阈值 0.5</div>
          </div>
          <button class="btn reset" type="button" data-reset>恢复两个单元</button>
        </section>
      </div>

      <footer class="foot">
        <div class="claim">隐藏层不是最终答案：它把输入改写成多个“中间响应”，再交给下一层组合。</div>
        <div class="next">下一问：这些中间结果究竟怎样一层层流到最终预测？</div>
      </footer>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
  (()=>{
    const root=document.getElementById('comboLab');
    const initial=()=>({x:[1,0],onA:true,onB:true});
    let state=initial(),timers=[],destroyed=false;
    const q=s=>root.querySelector(s), qa=s=>[...root.querySelectorAll(s)];
    function calc(){
      const a=Lec.P.neuronForward(state.x,[6,-6],-3,'sigmoid').output;
      const b=Lec.P.neuronForward(state.x,[-6,6],-3,'sigmoid').output;
      const y=Lec.P.neuronForward([state.onA?a:0,state.onB?b:0],[6,6],-3,'sigmoid').output;
      return {a,b,y};
    }
    function clearTimers(){timers.forEach(clearTimeout);timers=[];qa('.link').forEach(n=>n.classList.remove('pulse'))}
    function pulse(selector,delay){if(Deck.reduced())return;timers.push(setTimeout(()=>{qa(selector).forEach(n=>n.classList.add('pulse'));timers.push(setTimeout(()=>qa(selector).forEach(n=>n.classList.remove('pulse')),150))},delay))}
    function render(announce=false,animate=false){
      if(destroyed)return; const v=calc(), threshold=Lec.K.BINARY_CLASSIFICATION_THRESHOLD;
      qa('.input-btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.x===state.x.join(','))));
      ['a','b'].forEach(k=>{q(`[data-value="${k}"]`).textContent=v[k].toFixed(3);q(`[data-fill="${k}"]`).style.height=`${v[k]*100}%`;q(`[data-tag="${k}"]`).textContent=v[k]<threshold?'弱响应':'强响应';q(`[data-toggle="${k}"]`).checked=state['on'+k.toUpperCase()];q(`[data-out="${k}"]`).classList.toggle('off',!state['on'+k.toUpperCase()])});
      q('[data-output]').textContent=v.y.toFixed(3);q('[data-answer]').textContent=v.y<threshold?'否':'是';
      if(animate){clearTimers();pulse('[data-in="a"]',0);pulse('[data-in="b"]',90);pulse('.out-link:not(.off)',330)}
      if(announce)q('[data-output]').setAttribute('aria-label',`输入 ${state.x.join('、')}；单元 A ${v.a.toFixed(3)}；单元 B ${v.b.toFixed(3)}；预测 ${v.y.toFixed(3)}；判断${v.y<threshold?'否':'是'}`);
    }
    function setInput(e){state={...state,x:e.currentTarget.dataset.x.split(',').map(Number)};render(true,true)}
    function setToggle(e){const k=e.currentTarget.dataset.toggle.toUpperCase();state={...state,['on'+k]:e.currentTarget.checked};clearTimers();render(true,false)}
    function reset(){clearTimers();state=initial();render(true,false)}
    qa('.input-btn').forEach(b=>b.addEventListener('click',setInput));
    qa('[data-toggle]').forEach(c=>c.addEventListener('change',setToggle));
    q('[data-reset]').addEventListener('click',reset);
    render(false,false);
    root.destroyComboLab=()=>{if(destroyed)return;destroyed=true;clearTimers();qa('.input-btn').forEach(b=>b.removeEventListener('click',setInput));qa('[data-toggle]').forEach(c=>c.removeEventListener('change',setToggle));q('[data-reset]').removeEventListener('click',reset);delete root.destroyComboLab};
    Deck.init({index:15,total:21});
  })();
  </script>
</body>
</html>
