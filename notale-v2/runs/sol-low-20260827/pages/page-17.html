<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:16px}
    .p17-head{height:96px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px}
    .p17-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--muted)}
    .p17-head h1{margin:0;font:700 var(--fs-h1)/1.18 var(--font-sans);color:var(--text)}
    #bp-widget{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
    #bp-widget .bp-board{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:64px}
    #bp-widget .bp-main{min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);background:rgba(255,255,255,.18)}
    #bp-widget .bp-strip{height:172px;padding:16px 24px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
    #bp-widget .bp-strip h2,#bp-widget .bp-trace h2,#bp-widget .bp-ledger h2{margin:0;font:700 var(--fs-h2)/1.2 var(--font-sans)}
    #bp-widget .bp-strip p{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.35}
    #bp-widget .bp-trace{flex:1;min-height:0;padding:16px 24px;display:flex;flex-direction:column;gap:8px}
    #bp-widget svg{width:100%;display:block;overflow:visible}
    #bp-widget .forward-svg{height:108px}
    #bp-widget .back-svg{flex:1;min-height:210px}
    #bp-widget .node{fill:var(--bg);stroke:var(--text);stroke-width:1.6}
    #bp-widget .loss{fill:var(--panel-bg);stroke:var(--text);stroke-width:1.6}
    #bp-widget .fwd{stroke:var(--forward);stroke-width:3;fill:none}
    #bp-widget .back-base{stroke:var(--line);stroke-width:6;fill:none;cursor:pointer}
    #bp-widget .back-inner{stroke:var(--bg);stroke-width:2;fill:none;pointer-events:none}
    #bp-widget .back-done{stroke:var(--text)}
    #bp-widget .back-active{stroke:var(--focus);stroke-width:8}
    #bp-widget .svg-label{font:600 16px var(--font-sans);fill:var(--text);text-anchor:middle}
    #bp-widget .svg-val{font:700 16px var(--font-mono);fill:var(--forward);text-anchor:middle}
    #bp-widget .param{font:600 15px var(--font-mono);fill:var(--muted);text-anchor:middle}
    #bp-widget .bp-side{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}
    #bp-widget .bp-current{height:190px;padding:18px 20px;border:2px solid var(--text);background:var(--panel-bg)}
    #bp-widget .stepno{font:700 var(--fs-label)/1 var(--font-mono);color:var(--focus);min-height:18px}
    #bp-widget .bp-current h3{margin:10px 0 8px;font:700 var(--fs-h2)/1.25 var(--font-sans)}
    #bp-widget .bp-current p{margin:0;font-size:var(--fs-body);line-height:1.45;color:var(--muted)}
    #bp-widget .bp-ledger{flex:1;min-height:0;padding:18px 20px;border:1px solid var(--line)}
    #bp-widget .ledger-list{margin-top:14px;display:flex;flex-direction:column;gap:9px}
    #bp-widget .ledger-row{height:42px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:var(--fs-body);opacity:.25}
    #bp-widget .ledger-row.shown{opacity:1}
    #bp-widget .ledger-row b{font:700 20px var(--font-mono);color:var(--focus)}
    #bp-widget .bp-controls{height:54px;display:flex;align-items:center;gap:12px}
    #bp-widget .bp-controls .hint{margin-left:auto}
    #bp-widget .bp-close{height:58px;display:grid;grid-template-columns:1fr 520px;gap:64px;align-items:start;border-top:1px solid var(--line);padding-top:11px}
    #bp-widget .claim{font-size:var(--fs-sec);line-height:1.42;color:var(--text)}
    #bp-widget .next{font-size:var(--fs-sec);line-height:1.42;color:var(--muted)}
    #bp-widget .next b{color:var(--text)}
    @media (prefers-reduced-motion:no-preference){#bp-widget .ledger-row{transition:opacity 180ms ease}}
  </style>
</head>
<body data-page="17" data-total="21">
  <div id="stage">
    <header class="p17-head">
      <div class="p17-kicker">BACKWARD PASS</div>
      <h1>一份输出错误，倒着分成每条连接的改参方向</h1>
    </header>

    <section id="bp-widget" aria-label="反向传播逐段追踪器">
      <div class="bp-board">
        <div class="bp-main min0 split-tb">
          <section class="bp-strip">
            <h2>已知的前向快照</h2>
            <p>同一个样本、同一组参数；上栏数值在追踪时保持不变。</p>
            <svg class="forward-svg" viewBox="0 0 940 110" role="img" aria-label="输入一，隐藏输出零点七三一，预测零点六七五，目标一，损失零点三九三">
              <defs><marker id="p17-fwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--forward)"/></marker></defs>
              <path class="fwd" d="M145 55H330" marker-end="url(#p17-fwd)"/><path class="fwd" d="M470 55H655" marker-end="url(#p17-fwd)"/>
              <path class="node" d="M55 28H125L145 55L125 82H55L35 55Z"/><path class="node" d="M350 28H450L470 55L450 82H350L330 55Z"/><path class="node" d="M675 28H775L795 55L775 82H675L655 55Z"/><rect class="loss" x="825" y="18" width="110" height="74"/>
              <text class="svg-label" x="90" y="50">输入 x</text><text class="svg-val" x="90" y="72">1.000</text>
              <text class="svg-label" x="400" y="50">隐藏输出 h</text><text class="svg-val" x="400" y="72">0.731</text>
              <text class="svg-label" x="725" y="50">预测 p</text><text class="svg-val" x="725" y="72">0.675</text>
              <text class="svg-label" x="880" y="43">这次错了多少</text><text class="svg-val" x="880" y="68">0.393</text>
              <text class="param" x="238" y="42">w₁ 1.000</text><text class="param" x="238" y="78">b₁ 0.000</text><text class="param" x="563" y="42">w₂ 1.000</text><text class="param" x="563" y="78">b₂ 0.000</text><text class="param" x="878" y="107">目标 y = 1</text>
            </svg>
          </section>
          <section class="bp-trace k-process">
            <h2>逐段反传追踪</h2>
            <svg class="back-svg no-pan" data-back viewBox="0 0 940 270" role="img" aria-label="从损失框向输出、隐藏、输入逐段传递责任">
              <path class="node" d="M55 106H125L145 135L125 164H55L35 135Z"/><path class="node" d="M350 106H450L470 135L450 164H350L330 135Z"/><path class="node" d="M675 106H775L795 135L775 164H675L655 135Z"/><rect class="loss" x="825" y="98" width="110" height="74"/>
              <text class="svg-label" x="90" y="141">输入侧</text><text class="svg-label" x="400" y="141">隐藏层</text><text class="svg-label" x="725" y="141">输出层</text><text class="svg-label" x="880" y="141">损失</text>
              <g data-edge="1" tabindex="0" role="button" aria-label="追踪损失到输出层"><path class="back-base" d="M825 135H795"/><path class="back-inner" d="M825 135H795"/><path d="M804 127L795 135L804 143" fill="none" stroke="var(--text)" stroke-width="2"/></g>
              <g data-edge="2" tabindex="0" role="button" aria-label="追踪输出层到隐藏层"><path class="back-base" d="M655 135H470"/><path class="back-inner" d="M655 135H470"/><path d="M480 127L470 135L480 143" fill="none" stroke="var(--text)" stroke-width="2"/></g>
              <g data-edge="3" tabindex="0" role="button" aria-label="追踪隐藏层到输入侧"><path class="back-base" d="M330 135H145"/><path class="back-inner" d="M330 135H145"/><path d="M155 127L145 135L155 143" fill="none" stroke="var(--text)" stroke-width="2"/></g>
              <text class="param" x="810" y="105">输出责任</text><text class="param" x="563" y="112">沿 w₂</text><text class="param" x="238" y="112">分给 w₁、b₁</text>
            </svg>
          </section>
        </div>
        <aside class="bp-side min0">
          <section class="bp-current panel" aria-live="polite"><div class="stepno" data-stepno>尚未开始</div><h3 data-title>从这次错误出发</h3><p data-desc>蓝色前向结果已经固定。开始后，橙色双线将从右向左逐段追踪责任。</p></section>
          <section class="bp-ledger"><h2>参数方向账页</h2><div class="ledger-list">
            <div class="ledger-row" data-param="w2"><span>w₂</span><b>↑</b></div><div class="ledger-row" data-param="b2"><span>b₂</span><b>↑</b></div><div class="ledger-row" data-param="w1"><span>w₁</span><b>↑</b></div><div class="ledger-row" data-param="b1"><span>b₁</span><b>↑</b></div>
          </div><p class="small" data-complete style="margin:13px 0 0;min-height:24px"></p></section>
          <div class="bp-controls btns"><button class="btn" type="button" data-primary>开始反传</button><button class="btn" type="button" data-reset>重新追踪</button><span class="hint">Enter 推进；← → 回看或前进</span></div>
        </aside>
      </div>
      <footer class="bp-close"><div class="claim">反向传播不是把答案倒放，而是沿连接逐层计算：谁影响了错误、参数该往哪边改。</div><div class="next"><b>下一问：</b>把这些方向真的用来更新，多层网络的边界会怎样变化？</div></footer>
    </section>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
  (()=>{
    const root=document.getElementById('bp-widget');
    const q=s=>root.querySelector(s), qa=s=>Array.from(root.querySelectorAll(s));
    const stages=[
      {title:'输出端先接到错误责任',desc:'预测偏低：应把输出推高。',announce:'阶段一，输出端接到错误责任'},
      {title:'责任沿 w₂ 传给隐藏层',desc:'隐藏输出也应提高。',announce:'阶段二，责任沿 w₂ 传给隐藏层'},
      {title:'各参数得到本次改参方向',desc:'w₁ ↑　b₁ ↑　w₂ ↑　b₂ ↑',announce:'阶段三，四个参数都应增加'}
    ];
    const layers=[{weights:[[1]],biases:[0],activation:'sigmoid'},{weights:[[1]],biases:[0],activation:'sigmoid'}];
    const forward=Lec.P.networkForward([1],layers);
    const loss=Lec.P.binaryCrossEntropy(forward.outputs,[1]);
    const backward=Lec.P.networkBackward(loss.dProbabilities,forward.cache);
    root.dataset.loss=loss.value.toFixed(6);
    root.dataset.gradients=JSON.stringify(backward.layerGradients);
    let state={step:0}, destroyed=false, timer=0;
    const primary=q('[data-primary]'), reset=q('[data-reset]');
    function clearWork(){if(timer){clearTimeout(timer);timer=0;} d3.select(root).selectAll('.back-base').interrupt();}
    function render(animate=false){
      clearWork();
      qa('[data-edge]').forEach((g,i)=>{const path=g.querySelector('.back-base');path.classList.remove('back-active','back-done');if(i<state.step)path.classList.add(i===state.step-1?'back-active':'back-done');});
      if(animate&&state.step>0&&!Deck.reduced()){
        const path=q(`[data-edge="${state.step}"] .back-base`),len=path.getTotalLength();
        d3.select(path).attr('stroke-dasharray',`${len} ${len}`).attr('stroke-dashoffset',-len).transition().duration(420).ease(d3.easeCubicOut).attr('stroke-dashoffset',0).on('end',()=>d3.select(path).attr('stroke-dasharray',null).attr('stroke-dashoffset',null));
      }
      q('[data-stepno]').textContent=state.step?`阶段 ${state.step} / 3`:'尚未开始';
      q('[data-title]').textContent=state.step?stages[state.step-1].title:'从这次错误出发';
      q('[data-desc]').textContent=state.step?stages[state.step-1].desc:'蓝色前向结果已经固定。开始后，橙色双线将从右向左逐段追踪责任。';
      qa('.ledger-row').forEach(r=>r.classList.remove('shown'));
      if(state.step>=1){q('[data-param="w2"]').classList.add('shown');q('[data-param="b2"]').classList.add('shown')}
      if(state.step>=3){q('[data-param="w1"]').classList.add('shown');q('[data-param="b1"]').classList.add('shown')}
      q('[data-complete]').textContent=state.step===3?'四个参数都已收到方向':'';
      primary.textContent=state.step===0?'开始反传':state.step===3?'已完成':'下一段';primary.disabled=state.step===3;
    }
    function setStep(n,animate=false){if(destroyed)return;state={step:Math.max(0,Math.min(3,n))};render(animate);}
    function advance(){setStep(state.step+1,true)}
    primary.addEventListener('click',advance);reset.addEventListener('click',()=>setStep(0));
    qa('[data-edge]').forEach(g=>{const go=()=>setStep(Number(g.dataset.edge),true);g.addEventListener('click',go);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();go()}})});
    root.addEventListener('keydown',e=>{if(e.target.matches('button,[data-edge]'))return;if(e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();e.stopPropagation();setStep(state.step+1,true)}else if(e.key==='ArrowLeft'){e.preventDefault();e.stopPropagation();setStep(state.step-1)}});
    root.tabIndex=0;render();Deck.init({index:17,total:21});
    root.destroyBackwardWidget=()=>{if(destroyed)return;destroyed=true;clearWork();delete root.destroyBackwardWidget};
  })();
  </script>
</body>
</html>
