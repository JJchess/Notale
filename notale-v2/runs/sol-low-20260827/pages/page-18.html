<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:14px}
.p18-head{height:104px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--line)}
.p18-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--action);margin-bottom:10px}
.p18-head h1{font:700 var(--fs-h1)/1.2 var(--font-sans);margin:0;max-width:1240px}
#trainer{flex:1;min-height:0;width:100%;display:flex!important;flex-direction:column;gap:12px}
#trainer .meta{height:34px;display:flex;align-items:center;gap:22px;color:var(--muted);font-size:var(--fs-label)}
#trainer .meta strong{font-family:var(--font-mono);font-size:var(--fs-body);color:var(--text)}
#trainer .meta .limit{margin-left:auto;border:1px solid var(--line);padding:5px 10px}
#trainer .views{flex:1;min-height:0;width:100%!important;align-self:stretch;display:grid!important;grid-template-columns:minmax(0,1.14fr) minmax(0,.86fr)!important;gap:64px}
#trainer .panel{min-width:0;min-height:0;border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;box-shadow:none}
#trainer .panel.q{background:transparent}
#trainer h2{font:650 var(--fs-h2)/1.25 var(--font-sans);margin:0 0 8px}
#trainer .chart{flex:1;min-height:0;width:100%}
#trainer .right-body{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) 88px;gap:8px}
#trainer .ledger-row{border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);align-items:center}
#trainer .metric{padding:8px 14px;border-right:1px solid var(--line)}
#trainer .metric:last-child{border-right:0}
#trainer .metric span{display:block;color:var(--muted);font-size:var(--fs-label);margin-bottom:3px}
#trainer .metric output{font:700 25px/1 var(--font-mono);font-variant-numeric:tabular-nums}
#trainer .controls{height:50px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:10px}
#trainer .controls .hint{margin-left:auto;color:var(--muted);font-size:var(--fs-label)}
#trainer .btn{min-width:116px}
#trainer .btn.primary{background:var(--action);color:#fff;border-color:var(--action)}
.p18-foot{height:74px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;align-items:center;gap:42px}
.p18-claim{font:600 var(--fs-lead)/1.4 var(--font-sans)}
.p18-next{font-size:var(--fs-sec);color:var(--muted);max-width:520px;text-align:right}
@media (prefers-reduced-motion:reduce){#trainer *{transition:none!important}}
</style>
</head>
<body data-page="18" data-total="21">
<div id="stage">
  <header class="p18-head">
    <div class="p18-kicker">LIVE BACKPROP</div>
    <h1>反向传播每改一次参数，弯曲边界就更贴近两类样本</h1>
  </header>

  <main id="trainer" class="canvas-full k-comparison" data-trainer>
    <div class="meta">
      <strong>2 → 10 → 10 → 1</strong>
      <span>固定训练样本 200 个</span>
      <span>mini-batch <strong>16</strong></span>
      <span>学习率 <strong>0.3</strong></span>
      <span>分类阈值 <strong>0.5</strong></span>
      <span class="limit">仅针对这 200 个训练样本</span>
    </div>
    <div class="views min0">
      <section class="panel q min0" aria-labelledby="field-title">
        <h2 id="field-title">决策场：背景表示预测为第 1 类的程度</h2>
        <div id="fieldChart" class="chart min0" role="img" aria-label="固定的两类弯月样本与神经网络当前决策场"></div>
      </section>
      <section class="panel min0" aria-labelledby="loss-title">
        <h2 id="loss-title">训练损失</h2>
        <div class="right-body min0">
          <div id="lossChart" class="chart min0" role="img" aria-label="平均损失随参数更新次数变化的折线"></div>
          <div class="ledger-row" aria-label="实时训练账页">
            <div class="metric"><span>更新次数</span><output data-step>0</output></div>
            <div class="metric"><span>平均损失</span><output data-loss>—</output></div>
            <div class="metric"><span>训练准确率</span><output data-acc>—</output></div>
          </div>
        </div>
      </section>
    </div>
    <div class="controls btns">
      <button class="btn primary" type="button" data-toggle>开始训练</button>
      <button class="btn" type="button" data-once>再更新 1 次</button>
      <button class="btn" type="button" data-reset>重置</button>
      <span class="hint" aria-live="polite" data-status>训练时观察左侧 0.5 边界；暂停后可逐次更新。</span>
    </div>
  </main>

  <footer class="p18-foot">
    <div class="p18-claim">多层网络仍在重复同一个动作：用损失为全部参数指出方向，再更新一小步。</div>
    <div class="p18-next">如果遮住动画，你还能把这套训练动作按因果顺序排出来吗？</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script src="assets/lib/mlp.js"></script>
<script>
(() => {
  const root=document.querySelector('[data-trainer]');
  const fieldEl=root.querySelector('#fieldChart'), lossEl=root.querySelector('#lossChart');
  const fieldChart=echarts.init(fieldEl,null,{renderer:'svg'}), lossChart=echarts.init(lossEl,null,{renderer:'svg'});
  const btnToggle=root.querySelector('[data-toggle]'), btnOnce=root.querySelector('[data-once]'), btnReset=root.querySelector('[data-reset]');
  const outStep=root.querySelector('[data-step]'), outLoss=root.querySelector('[data-loss]'), outAcc=root.querySelector('[data-acc]'), status=root.querySelector('[data-status]');
  const threshold=Lec.K.BINARY_CLASSIFICATION_THRESHOLD;
  const rng=new Math.seedrandom('page-18-moons');
  const samples=[];
  for(let i=0;i<100;i++){
    const a=Math.PI*i/99, n1=(rng()-.5)*.13, n2=(rng()-.5)*.13;
    samples.push({x:[Math.cos(a)+n1,Math.sin(a)+n2-.28],t:0});
  }
  for(let i=0;i<100;i++){
    const a=Math.PI*i/99, n1=(rng()-.5)*.13, n2=(rng()-.5)*.13;
    samples.push({x:[.52-Math.cos(a)+n1,.45-Math.sin(a)+n2],t:1});
  }
  let net,updates,history,running=false,stopLoop=null,frame=0,destroyed=false;
  function makeNet(){return MLP.create({sizes:[2,10,10,1],act:'tanh',lr:.3,seed:1});}
  function metrics(){
    const probabilities=samples.map(d=>net.predict(d.x));
    const targets=samples.map(d=>d.t);
    const loss=Lec.P.binaryCrossEntropy(probabilities,targets).value;
    let right=0; for(let i=0;i<200;i++) if((probabilities[i]>=threshold?1:0)===targets[i]) right++;
    return {loss,acc:right/200};
  }
  function contour(field,n){
    const seg=[]; const lo=-1.5, step=3/(n-1);
    function cross(a,b){return (a<threshold&&b>=threshold)||(b<threshold&&a>=threshold)}
    function interp(x1,y1,v1,x2,y2,v2){const t=(threshold-v1)/(v2-v1);return [x1+(x2-x1)*t,y1+(y2-y1)*t]}
    for(let y=0;y<n-1;y++)for(let x=0;x<n-1;x++){
      const x0=lo+x*step,x1=x0+step,y0=lo+y*step,y1=y0+step;
      const a=field[y*n+x],b=field[y*n+x+1],c=field[(y+1)*n+x+1],d=field[(y+1)*n+x]; const p=[];
      if(cross(a,b))p.push(interp(x0,y0,a,x1,y0,b)); if(cross(b,c))p.push(interp(x1,y0,b,x1,y1,c));
      if(cross(c,d))p.push(interp(x1,y1,c,x0,y1,d)); if(cross(d,a))p.push(interp(x0,y1,d,x0,y0,a));
      if(p.length>=2)seg.push([p[0],p[1]]); if(p.length===4)seg.push([p[2],p[3]]);
    } return seg;
  }
  function drawField(){
    const n=80, f=net.field(-1.5,-1.5,1.5,1.5,n,n), heat=[], st=3/(n-1);
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)heat.push([-1.5+x*st,-1.5+y*st,f[y*n+x]]);
    const lines=contour(f,n).map(s=>({coords:s}));
    fieldChart.setOption({animationDurationUpdate:Deck.reduced()?0:160,textStyle:{fontSize:16,fontFamily:'sans-serif',color:'#20252B'},grid:{left:58,right:20,top:18,bottom:52},xAxis:{type:'value',name:'输入 1',min:-1.5,max:1.5,nameLocation:'middle',nameGap:34,nameTextStyle:{fontSize:14},axisLabel:{fontSize:12},splitLine:{lineStyle:{color:'rgba(32,37,43,.12)'}}},yAxis:{type:'value',name:'输入 2',min:-1.5,max:1.5,nameLocation:'middle',nameGap:42,nameTextStyle:{fontSize:14},axisLabel:{fontSize:12},splitLine:{lineStyle:{color:'rgba(32,37,43,.12)'}}},visualMap:{show:false,min:0,max:1,inRange:{color:['#e5e8eb','#d6dfec','#8ba8d2','#2457A6']}},series:[{type:'heatmap',data:heat,silent:true,progressive:0,itemStyle:{opacity:.72}},{type:'lines',coordinateSystem:'cartesian2d',polyline:false,data:lines,silent:true,lineStyle:{color:'#20252B',width:2,opacity:.9}},{name:'第 0 类',type:'scatter',data:samples.filter(d=>d.t===0).map(d=>d.x),symbolSize:8,itemStyle:{color:'#F4F1E8',borderColor:'#20252B',borderWidth:1.5}},{name:'第 1 类',type:'scatter',data:samples.filter(d=>d.t===1).map(d=>d.x),symbolSize:8,itemStyle:{color:'#20252B'}},{name:'0.5 边界',type:'line',data:[],lineStyle:{color:'#20252B',width:2},symbol:'none'}],legend:{bottom:0,left:'center',itemWidth:18,itemHeight:10,textStyle:{fontSize:14}}},true);
  }
  function drawLoss(){
    lossChart.setOption({animationDurationUpdate:Deck.reduced()?0:120,textStyle:{fontSize:16,fontFamily:'sans-serif',color:'#20252B'},grid:{left:60,right:20,top:18,bottom:50},xAxis:{type:'value',name:'参数更新次数',min:0,nameLocation:'middle',nameGap:34,nameTextStyle:{fontSize:14},axisLabel:{fontSize:12},splitLine:{lineStyle:{color:'rgba(32,37,43,.12)'}}},yAxis:{type:'value',name:'平均损失',min:0,nameLocation:'middle',nameGap:42,nameTextStyle:{fontSize:14},axisLabel:{fontSize:12},splitLine:{lineStyle:{color:'rgba(32,37,43,.12)'}}},series:[{type:'line',data:history,showSymbol:false,symbolSize:6,lineStyle:{color:'#E56B2F',width:3},itemStyle:{color:'#E56B2F'},areaStyle:{color:'rgba(229,107,47,.08)'}}]},true);
  }
  function sync(refreshField,announce){
    const m=metrics(); history.push([updates,m.loss]); if(history.length>420)history.shift();
    outStep.textContent=String(updates); outLoss.textContent=m.loss.toFixed(3); outAcc.textContent=(m.acc*100).toFixed(1)+'%';
    drawLoss(); if(refreshField)drawField();
    if(announce)status.textContent=`更新 ${updates} 次，平均损失 ${m.loss.toFixed(3)}，训练准确率 ${(m.acc*100).toFixed(1)}%`;
  }
  function trainBatches(n){for(let i=0;i<n;i++){net.step(samples,16);updates++;} frame++; sync(frame%8===0||n===1,n===1);}
  function stop(){if(stopLoop){stopLoop();stopLoop=null;} running=false;btnToggle.textContent='开始训练';btnOnce.disabled=false;}
  function start(){if(running)return;running=true;btnToggle.textContent='暂停';btnOnce.disabled=true;stopLoop=Deck.loop(()=>{if(!running||net.diverged){stop();return;}trainBatches(12);},{still:0});}
  function reset(){stop();net=makeNet();updates=0;frame=0;history=[];sync(true,true);}
  function toggle(){running?stop():start();}
  btnToggle.addEventListener('click',toggle); btnOnce.addEventListener('click',()=>{stop();trainBatches(1)}); btnReset.addEventListener('click',reset);
  const offResize=Deck.onResize(()=>{fieldChart.resize();lossChart.resize()});
  root.destroyTrainer=()=>{if(destroyed)return;destroyed=true;stop();offResize();fieldChart.dispose();lossChart.dispose();};
  reset(); Deck.init({index:18,total:21});
})();
</script>
</body>
</html>
