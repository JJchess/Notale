<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}.p19-head{height:116px;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:1px solid var(--line);padding-bottom:15px}.p19-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.14em;color:var(--action);margin-bottom:10px}.p19-head h1{font:700 var(--fs-h1)/1.2 var(--font-sans);margin:0;max-width:1200px}.loop-layout{flex:1;display:flex;gap:64px;min-height:0}.loop-copy{width:420px;flex:0 0 420px;display:flex;flex-direction:column;justify-content:space-between;padding:28px 30px 22px;border:1px solid var(--line);background:color-mix(in srgb,var(--text) 9%,var(--bg))}.loop-copy .lead{font-size:var(--fs-lead);line-height:1.55;margin:0}.loop-copy .method{margin:22px 0 auto;border-top:1px solid var(--line)}.loop-copy .method h2{font-size:var(--fs-h2);margin:18px 0}.loop-copy .method-row{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;min-height:68px;border-top:1px solid var(--line);font-size:var(--fs-sec);line-height:1.4}.loop-copy .method-row b{font:700 var(--fs-label)/1.2 var(--font-mono);color:var(--forward)}.loop-copy .claim{font-size:var(--fs-body);line-height:1.55;border-top:1px solid var(--line);padding-top:18px;margin:0}.loop-copy .next{font-size:var(--fs-sec);line-height:1.45;color:var(--muted);margin:20px 0 0}.loop-widget{flex:1;min-width:0;display:flex;flex-direction:column;padding:16px 0 8px}.loop-widget .toolbar{height:48px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.loop-widget .toolbar .hint{margin:0}.loop-widget .btns{display:flex;gap:10px}.loop-widget .btn{min-height:40px}.loop-widget .quiz{position:relative;flex:1;min-height:0;padding:0 96px 0 0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,color-mix(in srgb,var(--line) 50%,transparent) 28px)}.loop-widget .ledger{height:100%;display:flex;flex-direction:column;gap:10px;position:relative}.loop-widget .opt{height:112px;flex:0 0 112px;width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:0;background:color-mix(in srgb,var(--text) 9%,var(--bg));display:grid;grid-template-columns:70px minmax(0,1fr) 138px 100px;align-items:center;padding:12px 14px;cursor:grab;transition:transform 180ms ease,border-color 140ms ease,background 140ms ease}.loop-widget .opt:focus-within{outline:2px solid var(--focus);outline-offset:2px}.loop-widget .opt.dragging{opacity:.55;cursor:grabbing}.loop-widget .opt.bad{border-color:var(--action);background:color-mix(in srgb,var(--action) 7%,transparent)}.loop-widget .opt.good{border-color:var(--text)}.loop-widget .grip{font:700 22px/1 var(--font-mono);color:var(--muted);letter-spacing:-3px}.loop-widget .step-title{font-size:var(--fs-h2);font-weight:700;margin-bottom:6px}.loop-widget .step-body{font-size:var(--fs-sec);line-height:1.4;color:var(--muted)}.loop-widget .relay{font:700 var(--fs-body)/1.3 var(--font-mono);color:var(--forward);text-align:center}.loop-widget .moves{display:flex;gap:6px;justify-content:flex-end}.loop-widget .moves button{width:42px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--panel-bg);font-size:20px;color:var(--text)}.loop-widget .moves button:disabled{opacity:.28}.loop-widget .seq{display:none;font:700 var(--fs-h2)/1 var(--font-mono);color:var(--action);margin-right:12px}.loop-widget.solved .seq{display:inline}.loop-widget .flow-svg{position:absolute;inset:0 0 0 auto;width:90px;height:100%;overflow:visible;pointer-events:none}.loop-widget .flow{fill:none;stroke:var(--line);stroke-width:2}.loop-widget .break{fill:var(--action);opacity:0}.loop-widget .loopback{fill:none;stroke:var(--text);stroke-width:2;stroke-dasharray:520;stroke-dashoffset:520;opacity:0}.loop-widget.solved .loopback{opacity:1;stroke-dashoffset:0;transition:stroke-dashoffset 420ms ease}.loop-widget .fb{min-height:38px;margin:9px 96px 0 0;font-size:var(--fs-sec);line-height:1.4;color:var(--muted)}.loop-widget .fb.success{color:var(--text);font-weight:600}.cause-label{font-size:14px;fill:var(--muted);font-family:var(--font-sans)}
@media(prefers-reduced-motion:reduce){.loop-widget .opt,.loop-widget .loopback{transition:none!important}}
</style>
</head>
<body data-page="19" data-total="21">
<div id="stage">
  <header class="p19-head"><div class="p19-kicker">LOOP CHECK</div><h1>把四步排对，你就复原了神经网络的“学习”</h1></header>
  <main class="loop-layout min0">
    <section class="loop-copy min0">
      <div><p class="lead">把四张账条排成因果链。每一步的产物，必须正好是下一步需要的输入。</p><div class="method"><h2>核验相邻两步</h2><div class="method-row"><b>上一条</b><span>先读它交出的接力标签</span></div><div class="method-row"><b>下一条</b><span>再看正文需要什么输入</span></div><div class="method-row"><b>连接处</b><span>两者一致，因果箭头才成立</span></div></div></div>
      <div><p class="claim">学习的数学动作，就是用损失指出改参方向，再让更新后的参数进入下一次预测。</p><p class="next">误差真的下降了，模型就一定理解、可靠且公平吗？</p></div>
    </section>
    <section class="loop-widget min0" data-loop-widget aria-label="训练循环排序活动">
      <div class="toolbar"><p class="hint">拖动账条，或聚焦后用上移／下移调整</p><div class="btns"><button class="btn" type="button" data-check>检查顺序</button><button class="btn" type="button" data-reset>重新打乱</button></div></div>
      <div class="quiz min0">
        <div class="ledger k-process" data-list></div>
        <svg class="flow-svg" viewBox="0 0 90 478" preserveAspectRatio="none" aria-hidden="true">
          <defs><marker id="p19arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--line)"/></marker></defs>
          <path class="flow" d="M18 56V423" marker-end="url(#p19arrow)"/>
          <circle class="break" data-break="0" cx="18" cy="117" r="6"/><circle class="break" data-break="1" cx="18" cy="239" r="6"/><circle class="break" data-break="2" cx="18" cy="361" r="6"/>
          <path class="loopback" d="M28 423H70V56H28" marker-end="url(#p19arrow)"/>
        </svg>
      </div>
      <div class="fb" data-feedback aria-live="polite">尚未核验。先判断每张账条交出了什么。</div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(()=>{
 const root=document.querySelector('[data-loop-widget]'); if(!root)return;
 const list=root.querySelector('[data-list]'),fb=root.querySelector('[data-feedback]'),status={set textContent(value){fb.setAttribute('aria-label',value)}};
 const data={u:{title:'更新：让参数迈一小步',body:'按方向和步长修改参数，再进入下一轮预测。',relay:'新参数 ↩',seq:'04'},f:{title:'前向：做出预测',body:'样本从输入经过各层，得到一个预测。',relay:'预测 →',seq:'01'},b:{title:'反传：分配改参方向',body:'从输出错误倒着追踪，得到每个参数应怎样改。',relay:'方向 →',seq:'03'},l:{title:'损失：把错误变成数',body:'把预测与真实答案比较，得到损失。',relay:'损失 →',seq:'02'}};
 const initial=['u','f','b','l'], correct=['f','l','b','u']; let state={order:[...initial],checked:false};let dragId=null,destroyed=false;
 function card(id,i){const d=data[id],el=document.createElement('article');el.className='opt';el.draggable=true;el.tabIndex=0;el.dataset.id=id;el.setAttribute('aria-label',`${d.title}，当前位置 ${i+1}`);el.innerHTML=`<div class="grip" aria-hidden="true"><span class="seq">${d.seq}</span>⋮⋮</div><div><div class="step-title">${d.title}</div><div class="step-body">${d.body}</div></div><div class="relay">${d.relay}</div><div class="moves"><button type="button" data-move="-1" aria-label="上移 ${d.title}">↑</button><button type="button" data-move="1" aria-label="下移 ${d.title}">↓</button></div>`;return el}
 function links(){return state.order.slice(0,3).map((id,i)=>id===correct[i]&&state.order[i+1]===correct[i+1])}
 function render(focusId){list.replaceChildren(...state.order.map(card));root.classList.toggle('solved',state.checked&&state.order.every((x,i)=>x===correct[i]));const ls=links();root.querySelectorAll('[data-break]').forEach((n,i)=>n.style.opacity=state.checked&&!ls[i]?'1':'0');[...list.children].forEach((el,i)=>{el.classList.toggle('bad',state.checked&&i<3&&!ls[i]);el.classList.toggle('good',state.checked&&(i===3||ls[i]));el.querySelector('[data-move="-1"]').disabled=i===0;el.querySelector('[data-move="1"]').disabled=i===3});if(focusId)list.querySelector(`[data-id="${focusId}"]`)?.focus()}
 function move(id,to){const from=state.order.indexOf(id);to=Math.max(0,Math.min(3,to));if(from===to)return;state.order.splice(from,1);state.order.splice(to,0,id);state.checked=false;fb.className='fb';fb.textContent='顺序已改变，重新检查相邻因果关系。';render(id);status.textContent=`${data[id].title} 已移到第 ${to+1} 位`}
 function check(){state.checked=true;render();const ok=state.order.every((x,i)=>x===correct[i]);if(ok){fb.className='fb success';fb.textContent='顺序成立：更新后的参数回到前向，下一轮损失才可能继续下降。';status.textContent='顺序全部正确，训练循环已经闭合。'}else{fb.className='fb';fb.textContent='这里接不上：下一步需要什么输入？橙色断点标出了不成立的相邻关系。';status.textContent=`有 ${links().filter(x=>!x).length} 处相邻关系接不上。`}}
 function reset(){state={order:[...initial],checked:false};fb.className='fb';fb.textContent='尚未核验。先判断每张账条交出了什么。';render();status.textContent='已恢复初始乱序。'}
 list.addEventListener('click',e=>{const b=e.target.closest('[data-move]');if(b){const el=b.closest('.opt');move(el.dataset.id,state.order.indexOf(el.dataset.id)+Number(b.dataset.move))}});
 list.addEventListener('keydown',e=>{const el=e.target.closest('.opt');if(!el||e.target.tagName==='BUTTON')return;if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();e.stopPropagation();move(el.dataset.id,state.order.indexOf(el.dataset.id)+(e.key==='ArrowUp'?-1:1))}});
 list.addEventListener('dragstart',e=>{const el=e.target.closest('.opt');if(!el)return;dragId=el.dataset.id;el.classList.add('dragging');e.dataTransfer.effectAllowed='move'});list.addEventListener('dragover',e=>{e.preventDefault()});list.addEventListener('drop',e=>{e.preventDefault();const target=e.target.closest('.opt');if(dragId&&target)move(dragId,state.order.indexOf(target.dataset.id));dragId=null});list.addEventListener('dragend',e=>{e.target.closest('.opt')?.classList.remove('dragging');dragId=null});
 root.querySelector('[data-check]').addEventListener('click',check);root.querySelector('[data-reset]').addEventListener('click',reset);render();Deck.init({index:19,total:21});root.destroyLoopWidget=()=>{if(destroyed)return;destroyed=true;dragId=null;delete root.destroyLoopWidget};
})();
</script>
</body>
</html>
