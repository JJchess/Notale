<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{display:flex;flex-direction:column;gap:0;overflow:hidden;background:var(--bg);color:var(--text);}
  .page-head{height:112px;flex:0 0 112px;display:flex;flex-direction:column;justify-content:flex-start;border-bottom:1px solid var(--line);}
  .kicker{font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.12em;color:var(--muted);margin:0 0 9px;}
  h1{font:700 var(--fs-h1)/1.2 var(--font-sans);margin:0;max-width:1240px;letter-spacing:-.02em;}
  .comparison{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 104px minmax(0,1fr);align-items:stretch;padding:30px 0 24px;}
  .side{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel-bg);}
  .side-head{height:48px;flex:0 0 48px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding:0 14px;background:color-mix(in srgb,var(--text) 8%,var(--bg));}
  .eyebrow{font:700 var(--fs-label)/1.2 var(--font-sans);letter-spacing:.08em;color:var(--bg);opacity:.72;}
  .side-title{font:700 var(--fs-h2)/1.2 var(--font-sans);}
  .logic{height:66px;flex:0 0 66px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);font:700 var(--fs-h2)/1.2 var(--font-sans);letter-spacing:.01em;}
  .logic .arrow{margin:0 18px;color:var(--forward);font-size:34px;line-height:1;}
  .logic .break{margin:0 18px;color:var(--text);font-size:34px;line-height:1;}
  .left-body{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:20px;padding-top:22px;}
  .plot{position:relative;min-height:0;border:1px solid var(--line);background:color-mix(in srgb,var(--forward) 12%,var(--bg));padding:18px 20px 14px;}
  .plot-label{position:absolute;left:28px;top:22px;font:700 var(--fs-h2)/1.2 var(--font-sans);color:var(--forward);}
  .plot svg{display:block;width:100%;height:100%;min-height:250px;}
  .allowed{border:2px solid var(--forward);padding:18px 22px 20px;background:transparent;}
  .allowed .cap{font:700 var(--fs-label)/1.2 var(--font-sans);color:var(--forward);letter-spacing:.08em;margin-bottom:8px;}
  .allowed p{font:700 var(--fs-h1)/1.25 var(--font-sans);margin:0;}
  .not-equal{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--text);}
  .not-equal::before,.not-equal::after{content:"";width:1px;flex:1;background:var(--line);}
  .neq{font:700 64px/1 var(--font-sans);}
  .right-body{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:22px;}
  .claims{flex:1;min-height:0;display:grid;grid-template-rows:repeat(3,1fr);border:1px solid var(--line);background:color-mix(in srgb,var(--text) 8%,var(--bg));}
  .claim{display:grid;grid-template-columns:72px 1fr;align-items:center;column-gap:18px;padding:18px 22px;}
  .claim+.claim{border-top:1px solid var(--line);}
  .qid{align-self:stretch;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:5px;font-family:var(--font-mono);}
  .qid .n{font-size:var(--fs-label);font-weight:700;color:var(--muted);}
  .qid .q{font-size:30px;font-weight:700;line-height:1;color:var(--text);}
  .claim p{font:700 var(--fs-h1)/1.25 var(--font-sans);margin:0;}
  .baseline{height:76px;flex:0 0 76px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:64px;}
  .boundary{font:400 var(--fs-sec)/1.45 var(--font-sans);color:var(--muted);margin:0;}
  .takeaway{font:600 var(--fs-body)/1.45 var(--font-sans);margin:0;text-align:right;}
  .next{height:56px;flex:0 0 56px;border-top:1px solid var(--line);display:flex;align-items:flex-end;justify-content:flex-end;font:700 var(--fs-body)/1.3 var(--font-sans);color:var(--text);}
  .next span{color:var(--focus);margin-right:10px;}
</style>
</head>
<body data-page="20" data-total="21">
<div id="stage">
  <header class="page-head">
    <p class="kicker">FIT ≠ UNDERSTAND</p>
    <h1>误差下降，只证明模型更贴合这份数据与目标</h1>
  </header>

  <main class="comparison split-lr k-comparison min0" aria-label="误差下降能说明与不能说明的对照">
    <section class="side panel q min0" aria-labelledby="seen-title">
      <div class="side-head">
        <span class="eyebrow">观察到</span>
        <span class="side-title" id="seen-title">训练误差下降</span>
      </div>
      <div class="logic" aria-label="训练误差下降支持拟合更贴近"><span>训练误差下降</span><span class="arrow">→</span><span>拟合更贴近</span></div>
      <div class="left-body min0">
        <div class="plot" role="img" aria-label="一条从左上向右下的曲线，表示训练误差下降">
          <span class="plot-label">误差下降</span>
          <svg viewBox="0 0 560 290" preserveAspectRatio="none" aria-hidden="true">
            <path d="M28 36 H532 M28 145 H532 M28 254 H532" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="5 8"/>
            <path d="M36 58 C112 62 120 105 194 112 S286 171 352 176 S430 220 510 232" fill="none" stroke="var(--forward)" stroke-width="6" stroke-linecap="square"/>
            <circle cx="510" cy="232" r="11" fill="var(--panel-bg)" stroke="var(--focus)" stroke-width="5"/>
          </svg>
        </div>
        <div class="allowed">
          <div class="cap">可以说</div>
          <p>模型更贴合给定目标与这批数据</p>
        </div>
      </div>
    </section>

    <div class="not-equal" aria-label="不等于"><span class="neq">≠</span></div>

    <section class="side panel q min0" aria-labelledby="cannot-title">
      <div class="side-head">
        <span class="eyebrow">边界</span>
        <span class="side-title" id="cannot-title">不能自动推出</span>
      </div>
      <div class="logic" aria-label="训练误差下降不能推出理解、因果或公平"><span>训练误差下降</span><span class="break">⇏</span><span>三项待证</span></div>
      <div class="right-body min0">
        <div class="claims">
          <div class="claim">
            <div class="qid"><span class="n">01</span><span class="q">?</span></div>
            <p>模型理解了“为什么”</p>
          </div>
          <div class="claim">
            <div class="qid"><span class="n">02</span><span class="q">?</span></div>
            <p>模型找到了因果关系</p>
          </div>
          <div class="claim">
            <div class="qid"><span class="n">03</span><span class="q">?</span></div>
            <p>模型对不同人群都公平</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <section class="baseline" aria-label="结论边界">
    <p class="boundary">要回答右边的问题，还需要训练误差之外的证据。</p>
    <p class="takeaway">它不自动证明模型理解了世界、找到了因果，或对不同人都公平。</p>
  </section>
  <footer class="next"><span>下一问</span>那么，“学习”最准确的数学表述是什么？</footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:20,total:21});</script>
</body>
</html>
