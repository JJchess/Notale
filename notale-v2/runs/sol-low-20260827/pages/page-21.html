<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{display:flex;flex-direction:column;}
    .page-head{height:112px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;border-bottom:1px solid var(--line);}
    .kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.16em;color:var(--muted);margin:2px 0 12px;}
    h1{margin:0;max-width:1320px;font:700 var(--fs-h1)/1.22 var(--font-sans);color:var(--text);}
    .main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
    .focus-wrap{width:1420px;min-height:580px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 12px 18px;position:relative;isolation:isolate;}.focus-wrap::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(to right,transparent 79px,var(--line) 80px),linear-gradient(to bottom,transparent 47px,var(--line) 48px);background-size:80px 48px;opacity:.42;}.focus-wrap::after{content:"";position:absolute;inset:22px 0;z-index:-1;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
    .relationship-map{position:absolute;inset:0;width:100%;height:100%;z-index:-1;}.claim-label{display:flex;align-items:center;gap:14px;margin-bottom:24px;color:var(--muted);font:600 var(--fs-label)/1 var(--font-sans);}
    .claim-label::before,.claim-label::after{content:"";width:78px;height:1px;background:var(--line);}
    .support-line{width:100%;display:grid;grid-template-columns:1fr 112px 1fr 112px 1fr;align-items:stretch;}
    .support{min-width:0;height:320px;border:1px solid var(--line);background:var(--panel-bg);display:flex;flex-direction:column;justify-content:center;padding:34px 38px;position:relative;}
    .support .tag{position:absolute;left:22px;top:18px;font-family:var(--font-mono);}
    .support h2{margin:18px 0 12px;font:700 28px/1.2 var(--font-sans);color:var(--text);}
    .support p{margin:0;font:400 var(--fs-lead)/1.45 var(--font-sans);color:var(--muted);}
    .connector{position:relative;align-self:center;height:2px;background:var(--text);}
    .connector::after{content:"";position:absolute;right:-1px;top:-6px;border-left:10px solid var(--text);border-top:7px solid transparent;border-bottom:7px solid transparent;}
    .trunk{width:1px;height:48px;background:var(--line);}
    .takeaway{width:1180px;min-height:92px;border-top:2px solid var(--text);border-bottom:1px solid var(--line);background:var(--panel-bg);padding:24px 32px;text-align:center;font:650 24px/1.45 var(--font-sans);color:var(--text);}
    .takeaway .cycle{color:var(--forward);font-weight:750;white-space:nowrap;}.cycle-step{display:inline-block;}.cycle-step:not(:last-child)::after{content:" → ";color:var(--forward);padding:0 5px;}
    .next{height:82px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:18px;font:600 var(--fs-body)/1.4 var(--font-sans);color:var(--text);}
    .next-label{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.1em;color:var(--focus);}
  </style>
</head>
<body data-page="21" data-total="21">
  <div id="stage">
    <header class="page-head">
      <div class="kicker">TAKEAWAY</div>
      <h1>神经网络学习，就是用错误为每个参数指出方向，再反复迈小步</h1>
    </header>

    <main class="main min0">
      <section class="focus focus-wrap k-generalization min0" aria-label="神经网络学习的三个动作">
        <svg class="relationship-map" viewBox="0 0 1420 580" aria-hidden="true"><path d="M30 510 V548 H1390 V510" fill="none" stroke="var(--line)" stroke-width="1"/><path d="M710 34 V74" fill="none" stroke="var(--text)" stroke-width="2"/></svg><div class="claim-label"><span>一条可复述的学习主干</span></div>
        <div class="support-line">
          <article class="support min0">
            <span class="tag">01</span>
            <h2>错误变成数</h2>
            <p>比较预测与答案</p>
          </article>
          <div class="connector" aria-hidden="true"></div>
          <article class="support min0">
            <span class="tag">02</span>
            <h2>错误指出方向</h2>
            <p>分给每个可调参数</p>
          </article>
          <div class="connector" aria-hidden="true"></div>
          <article class="support min0">
            <span class="tag">03</span>
            <h2>参数迈一小步</h2>
            <p>更新后再次预测</p>
          </article>
        </div>
        <div class="trunk" aria-hidden="true"></div>
        <div class="takeaway"><span class="cycle"><span class="cycle-step">预测</span><span class="cycle-step">计错</span><span class="cycle-step">反传</span><span class="cycle-step">更新</span></span><span>；所谓“学会”，</span><span>就是这套循环不断改变参数。</span></div>
      </section>
    </main>

    <footer class="next">
      <span class="next-label">下一问</span>
      <span>当你再次听到“模型在学习”，能否指出它究竟改了什么？</span>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>Deck.init({index:21,total:21});</script>
</body>
</html>
