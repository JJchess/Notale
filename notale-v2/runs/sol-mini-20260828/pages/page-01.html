<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一次错误，怎样变成每个参数的改变量</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:22px}
    .page-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--rule-strong);padding-bottom:18px}
    .page-head h1{max-width:1050px;font-size:54px}
    .head-note{width:330px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45;text-align:right}
    .main-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr);gap:42px}
    .question{display:flex;flex-direction:column;min-height:0;padding:28px 30px;border:2px solid var(--text);border-radius:var(--radius);background:var(--paper)}
    .question h2{font-size:34px;line-height:1.25;margin-bottom:16px}
    .question .lead{max-width:none;color:var(--muted)}
    .route{margin-top:28px;display:grid;gap:10px}
    .route-btn{position:relative;width:100%;min-height:60px;padding:12px 44px 12px 18px;border:0;border-top:2px solid var(--rule);background:transparent;color:var(--muted);font-size:var(--fs-sec);font-weight:700;text-align:left;cursor:pointer}
    .route-btn:last-child{border-bottom:2px solid var(--rule)}
    .route-btn::after{content:'';position:absolute;right:18px;top:50%;width:10px;height:10px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:translateY(-50%) rotate(45deg)}
    .route-btn:hover{color:var(--text);background:var(--bg)}
    .route-btn[aria-pressed="true"]{color:var(--text);background:var(--attention-soft);box-shadow:inset 5px 0 0 var(--attention)}
    .route-btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
    .prompt{margin-top:auto;padding-top:20px;color:var(--muted);font-size:var(--fs-label)}
    .prompt strong{display:block;margin-top:6px;color:var(--text);font-size:var(--fs-sec)}
    .diagram-wrap{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:16px;min-height:0}
    .diagram{position:relative;min-height:0;overflow:hidden;border-top:4px solid var(--text);border-bottom:2px solid var(--rule-strong);background:rgba(247,250,250,.45)}
    .diagram svg{display:block;width:100%;height:100%}
    .wire{fill:none;stroke:var(--rule);stroke-width:3;transition:stroke .22s ease,stroke-width .22s ease,opacity .22s ease}
    .wire.model.active{stroke:var(--model);stroke-width:7}
    .wire.loss.active{stroke:var(--target);stroke-width:7}
    .wire.grad.active{stroke:var(--gradient);stroke-width:8}
    .node{fill:var(--paper);stroke:var(--rule-strong);stroke-width:3;transition:stroke .2s ease,fill .2s ease}
    .node.active{stroke:var(--attention);stroke-width:6;fill:var(--attention-soft)}
    .param{fill:var(--paper);stroke:var(--rule-strong);stroke-width:3;transition:transform .2s ease,fill .2s ease,stroke .2s ease;transform-box:fill-box;transform-origin:center}
    .param.active{fill:var(--gradient-soft);stroke:var(--gradient);stroke-width:6;transform:scale(1.07)}
    .svg-title{font:700 24px var(--font-sans);fill:var(--text)}
    .svg-label{font:600 17px var(--font-sans);fill:var(--muted)}
    .svg-small{font:600 15px var(--font-sans);fill:var(--muted)}
    .signal{opacity:0;transition:opacity .2s ease}
    .signal.active{opacity:1}
    .stage-copy{min-height:102px;display:grid;grid-template-columns:190px minmax(0,1fr);gap:22px;align-items:start;padding:18px 20px;border:2px solid var(--rule);border-radius:var(--radius);background:var(--paper)}
    .stage-copy .eyebrow{color:var(--attention);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:600;letter-spacing:.04em}
    .stage-copy h3{margin-top:5px;font-size:var(--fs-h2)}
    .stage-copy p{font-size:var(--fs-sec);line-height:1.5}
    .stage-copy strong{color:var(--gradient)}
    @media (prefers-reduced-motion:reduce){.wire,.node,.param,.signal{transition:none}}
  </style>
</head>
<body data-page="01" data-total="24">
  <div id="stage">
    <header class="page-head">
      <div>
        <span class="kicker">全程问题</span>
        <h1>一次错误，怎样变成每个参数的改变量？</h1>
      </div>
      <p class="head-note">从单个神经元出发，追踪预测、误差、梯度和参数更新之间的因果链。</p>
    </header>

    <main class="main-grid min0">
      <section class="question min0" aria-labelledby="route-title">
        <h2 id="route-title">沿着一次学习，先后追问四件事</h2>
        <p class="lead">点选一段路径，查看信息此刻往哪里走，以及它回答什么问题。</p>
        <nav class="route" aria-label="学习路径">
          <button class="route-btn" data-step="forward" aria-pressed="true">先看模型怎样给出预测</button>
          <button class="route-btn" data-step="loss" aria-pressed="false">比较预测与目标的差距</button>
          <button class="route-btn" data-step="backward" aria-pressed="false">沿连接把误差信号传回</button>
          <button class="route-btn" data-step="update" aria-pressed="false">按梯度方向调整每个参数</button>
        </nav>
        <p class="prompt">读完整套讲义后，你应该能解释：<strong>为什么同一次错误会让不同参数改动不同？</strong></p>
      </section>

      <section class="diagram-wrap min0" aria-label="从输入到参数更新的学习路径">
        <div class="diagram min0">
          <svg viewBox="0 0 900 500" role="img" aria-labelledby="diag-title diag-desc">
            <title id="diag-title">神经网络一次学习的往返路径</title>
            <desc id="diag-desc">输入和参数先向右产生预测，预测与目标形成误差，误差再沿连接向左传回，最后更新各个参数。</desc>
            <defs>
              <marker id="arrowModel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--model)"/></marker>
              <marker id="arrowTarget" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--target)"/></marker>
              <marker id="arrowGrad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--gradient)"/></marker>
            </defs>

            <text x="76" y="54" class="svg-title">参数</text>
            <rect id="p1" class="param" x="58" y="80" width="110" height="66" rx="6"/>
            <rect id="p2" class="param" x="58" y="178" width="110" height="66" rx="6"/>
            <rect id="p3" class="param" x="58" y="276" width="110" height="66" rx="6"/>
            <text x="113" y="121" text-anchor="middle" class="svg-label">权重</text>
            <text x="113" y="219" text-anchor="middle" class="svg-label">权重</text>
            <text x="113" y="317" text-anchor="middle" class="svg-label">偏置</text>

            <path class="wire model" d="M168 113 C260 113 270 185 360 210"/>
            <path class="wire model" d="M168 211 C255 211 280 218 360 225"/>
            <path class="wire model" d="M168 309 C260 309 270 250 360 235"/>
            <circle id="neuron" class="node" cx="420" cy="225" r="60"/>
            <text x="420" y="219" text-anchor="middle" class="svg-title">神经元</text>
            <text x="420" y="247" text-anchor="middle" class="svg-small">计算输出</text>

            <path class="wire model" d="M480 225 L595 225" marker-end="url(#arrowModel)"/>
            <rect id="prediction" class="node" x="610" y="177" width="130" height="96" rx="6"/>
            <text x="675" y="218" text-anchor="middle" class="svg-title">预测</text>
            <text x="675" y="245" text-anchor="middle" class="svg-small">模型给出</text>

            <rect id="target" class="node" x="610" y="55" width="130" height="78" rx="6"/>
            <text x="675" y="88" text-anchor="middle" class="svg-title">目标</text>
            <text x="675" y="112" text-anchor="middle" class="svg-small">数据给出</text>
            <path class="wire loss" d="M675 133 L675 168" marker-end="url(#arrowTarget)"/>

            <path class="wire loss" d="M740 225 L790 225" marker-end="url(#arrowTarget)"/>
            <circle id="loss" class="node" cx="832" cy="225" r="42"/>
            <text x="832" y="232" text-anchor="middle" class="svg-title">误差</text>

            <path class="wire grad" d="M830 284 C810 400 675 424 530 390 C365 352 275 390 175 400" marker-end="url(#arrowGrad)"/>
            <path class="wire grad" d="M175 400 C135 393 112 363 112 345" marker-end="url(#arrowGrad)"/>
            <text x="495" y="429" text-anchor="middle" class="svg-label signal">每条连接收到自己的梯度</text>
            <text x="495" y="458" text-anchor="middle" class="svg-small signal">反向信息决定各参数下一步改多少</text>
          </svg>
        </div>
        <div class="stage-copy" aria-live="polite">
          <div><span class="eyebrow" id="phase-kicker">信息向右</span><h3 id="phase-title">产生预测</h3></div>
          <p id="phase-body">输入经过参数和神经元，得到当前预测。此时追问：<strong>每个参数怎样参与了这次输出？</strong></p>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      const states = {
        forward: {
          kicker: '信息向右', title: '产生预测',
          body: '输入经过参数和神经元，得到当前预测。此时追问：<strong>每个参数怎样参与了这次输出？</strong>',
          wires: 'model', nodes: ['neuron','prediction'], params: false, signal: false
        },
        loss: {
          kicker: '建立参照', title: '算出误差',
          body: '把模型预测和数据给出的目标放在一起比较，误差把“偏了多少”变成可计算的量。',
          wires: 'loss', nodes: ['prediction','target','loss'], params: false, signal: false
        },
        backward: {
          kicker: '信息向左', title: '分配责任',
          body: '误差信号沿计算关系反向传递。导数回答：<strong>某个参数稍微变化，误差会怎样变化？</strong>',
          wires: 'grad', nodes: ['loss','neuron'], params: false, signal: true
        },
        update: {
          kicker: '准备下一次', title: '更新参数',
          body: '每个参数依据自己的梯度调整。梯度的方向与大小不同，所以同一次错误会产生不同改变量。',
          wires: 'grad', nodes: [], params: true, signal: true
        }
      };
      const buttons = [...document.querySelectorAll('.route-btn')];
      const wires = [...document.querySelectorAll('.wire')];
      const nodes = [...document.querySelectorAll('.node')];
      const params = [...document.querySelectorAll('.param')];
      const signals = [...document.querySelectorAll('.signal')];
      function setStep(key){
        const s = states[key];
        buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.step === key)));
        wires.forEach(w => w.classList.toggle('active', w.classList.contains(s.wires)));
        nodes.forEach(n => n.classList.toggle('active', s.nodes.includes(n.id)));
        params.forEach(p => p.classList.toggle('active', s.params));
        signals.forEach(el => el.classList.toggle('active', s.signal));
        document.getElementById('phase-kicker').textContent = s.kicker;
        document.getElementById('phase-title').textContent = s.title;
        document.getElementById('phase-body').innerHTML = s.body;
      }
      buttons.forEach(b => b.addEventListener('click', () => setStep(b.dataset.step)));
      setStep('forward');
      Deck.init({index:1,total:24});
    })();
  </script>
</body>
</html>
