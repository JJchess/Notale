<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page-head{flex:0 0 auto;margin-bottom:22px}
  .page-head h1{max-width:1200px}
  .leadline{margin-top:10px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  .comparison{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;border-top:var(--line-strong) solid var(--text);border-bottom:var(--line) solid var(--rule-strong)}
  .case{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:22px 30px 20px}
  .case + .case{border-left:var(--line) solid var(--rule-strong)}
  .case-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding-bottom:14px;border-bottom:var(--line) solid var(--rule)}
  .case-title{font-size:var(--fs-h2);font-weight:700;line-height:1.2}
  .case-title .math{display:block;margin-top:5px;font-family:var(--font-mono);font-size:var(--fs-sec);font-weight:500;color:var(--muted)}
  .marker{flex:0 0 auto;font-family:var(--font-mono);font-size:var(--fs-label);font-weight:600;color:var(--muted);letter-spacing:.04em}
  .marker.active{color:var(--attention)}
  .diagram{min-height:0;display:grid;place-items:center;padding:18px 0 12px}
  .diagram svg{display:block;width:100%;height:100%;max-height:410px}
  .formula{padding-top:15px;border-top:var(--line) solid var(--rule);font-family:var(--font-mono);font-size:var(--fs-body);line-height:1.45;color:var(--text)}
  .formula strong{font-weight:600}
  .formula .collapse{color:var(--model)}
  .formula .survive{color:var(--gradient)}
  .conclusion{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:18px 0 0}
  .conclusion .label{font-family:var(--font-mono);font-size:var(--fs-label);font-weight:600;letter-spacing:.05em;color:var(--muted)}
  .conclusion p{font-size:var(--fs-lead);font-weight:700;line-height:1.35}
  .conclusion em{font-style:normal;color:var(--gradient)}
  .svg-label{font-family:var(--font-sans);font-size:16px;fill:var(--muted)}
  .svg-node{fill:var(--paper);stroke:var(--rule-strong);stroke-width:2}
  .svg-node-hot{fill:var(--attention-soft);stroke:var(--attention);stroke-width:3}
  .svg-wire{fill:none;stroke:var(--model);stroke-width:4}
  .svg-wire-faint{fill:none;stroke:var(--rule-strong);stroke-width:2}
  .svg-output{fill:none;stroke:var(--gradient);stroke-width:5}
  .svg-axis{stroke:var(--rule);stroke-width:2}
  .svg-tick{font-family:var(--font-mono);font-size:14px;fill:var(--muted)}
</style>
</head>
<body data-page="05" data-total="24">
<div id="stage">
  <header class="page-head">
    <span class="kicker">激活函数 · 线性与非线性</span>
    <h1>激活函数让多层网络保留“弯曲”</h1>
    <p class="leadline">层与层之间只做线性汇总，连续叠加仍能合并成一次线性变换；插入非线性响应后，这种合并不再成立。</p>
  </header>

  <main class="comparison" aria-label="不使用激活函数与使用激活函数的对照">
    <section class="case min0" aria-labelledby="linear-title">
      <div class="case-head">
        <h2 class="case-title" id="linear-title">只叠加线性层<span class="math">z = Wx + b</span></h2>
        <span class="marker">可合并</span>
      </div>
      <div class="diagram min0">
        <svg viewBox="0 0 650 360" role="img" aria-label="两个线性变换合并后，输入与输出仍为直线关系">
          <defs>
            <marker id="arrow-model" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
              <path d="M0,0 L10,5 L0,10 Z" fill="var(--model)"/>
            </marker>
          </defs>
          <text x="35" y="39" class="svg-label">网络中的运算</text>
          <circle cx="75" cy="116" r="30" class="svg-node"/>
          <text x="75" y="122" text-anchor="middle" class="svg-label">输入 x</text>
          <path d="M105 116 H220" class="svg-wire" marker-end="url(#arrow-model)"/>
          <rect x="230" y="80" width="126" height="72" rx="6" class="svg-node"/>
          <text x="293" y="110" text-anchor="middle" class="svg-label">线性汇总</text>
          <text x="293" y="136" text-anchor="middle" class="svg-tick">W₁x + b₁</text>
          <path d="M356 116 H458" class="svg-wire" marker-end="url(#arrow-model)"/>
          <rect x="468" y="80" width="144" height="72" rx="6" class="svg-node"/>
          <text x="540" y="110" text-anchor="middle" class="svg-label">线性汇总</text>
          <text x="540" y="136" text-anchor="middle" class="svg-tick">W₂h + b₂</text>

          <text x="35" y="207" class="svg-label">合并后的输入—输出关系</text>
          <line x1="65" y1="316" x2="606" y2="316" class="svg-axis"/>
          <line x1="65" y1="316" x2="65" y2="224" class="svg-axis"/>
          <path d="M91 300 L575 238" class="svg-wire"/>
          <text x="585" y="241" class="svg-tick">y = W′x + b′</text>
          <text x="603" y="340" class="svg-tick">x</text>
          <text x="42" y="228" class="svg-tick">y</text>
        </svg>
      </div>
      <p class="formula"><strong>W₂(W₁x + b₁) + b₂</strong> = <span class="collapse">W′x + b′</span><br>深度增加了，表达仍是一条直线。</p>
    </section>

    <section class="case min0" aria-labelledby="nonlinear-title">
      <div class="case-head">
        <h2 class="case-title" id="nonlinear-title">在线性层之间插入激活<span class="math">h = σ(Wx + b)</span></h2>
        <span class="marker active">不能合并</span>
      </div>
      <div class="diagram min0">
        <svg viewBox="0 0 650 360" role="img" aria-label="激活函数把线性汇总弯折，后续层保留非线性关系">
          <defs>
            <marker id="arrow-model-r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
              <path d="M0,0 L10,5 L0,10 Z" fill="var(--model)"/>
            </marker>
            <marker id="arrow-grad-r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
              <path d="M0,0 L10,5 L0,10 Z" fill="var(--gradient)"/>
            </marker>
          </defs>
          <text x="35" y="39" class="svg-label">网络中的运算</text>
          <circle cx="70" cy="116" r="30" class="svg-node"/>
          <text x="70" y="122" text-anchor="middle" class="svg-label">输入 x</text>
          <path d="M100 116 H190" class="svg-wire" marker-end="url(#arrow-model-r)"/>
          <rect x="200" y="80" width="116" height="72" rx="6" class="svg-node"/>
          <text x="258" y="110" text-anchor="middle" class="svg-label">线性汇总</text>
          <text x="258" y="136" text-anchor="middle" class="svg-tick">Wx + b</text>
          <path d="M316 116 H379" class="svg-wire" marker-end="url(#arrow-model-r)"/>
          <circle cx="423" cy="116" r="37" class="svg-node-hot"/>
          <text x="423" y="111" text-anchor="middle" class="svg-label">激活</text>
          <text x="423" y="136" text-anchor="middle" class="svg-tick">σ(z)</text>
          <path d="M460 116 H548" class="svg-output" marker-end="url(#arrow-grad-r)"/>
          <text x="558" y="121" class="svg-label">下一层</text>

          <text x="35" y="207" class="svg-label">保留下来的输入—输出关系</text>
          <line x1="65" y1="316" x2="606" y2="316" class="svg-axis"/>
          <line x1="65" y1="316" x2="65" y2="224" class="svg-axis"/>
          <path d="M91 300 L320 300 L570 238" class="svg-output"/>
          <circle cx="320" cy="300" r="6" fill="var(--attention)"/>
          <text x="331" y="287" class="svg-tick">响应在此转折</text>
          <text x="603" y="340" class="svg-tick">x</text>
          <text x="42" y="228" class="svg-tick">y</text>
        </svg>
      </div>
      <p class="formula"><strong>W₂ σ(W₁x + b₁) + b₂</strong> <span class="survive">无法改写为 W′x + b′</span><br>每层都能在前一层的转折上继续组合。</p>
    </section>
  </main>

  <footer class="conclusion">
    <span class="label">判断</span>
    <p>多层网络获得表达能力，靠的是层间的<em>非线性激活</em>，不是线性层数量本身。</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script>Deck.init({index:5,total:24});</script>
</body>
</html>
