<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .page-head{flex:0 0 auto;margin-bottom:22px}
    .page-head h1{max-width:1180px}
    .page-head .lead{margin-top:12px;max-width:1160px;color:var(--muted)}
    .lesson{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.38fr) minmax(360px,.62fr);gap:34px}
    .landscape{position:relative;min-width:0;min-height:0;border-top:var(--line-strong) solid var(--text);border-bottom:var(--line) solid var(--rule-strong);background:var(--paper)}
    .landscape svg{display:block;width:100%;height:100%}
    .diagram-label{font-family:var(--font-sans);font-size:17px;font-weight:600;fill:var(--text)}
    .diagram-note{font-family:var(--font-sans);font-size:15px;font-weight:500;fill:var(--muted)}
    .axis-label{font-family:var(--font-mono);font-size:15px;font-weight:600;fill:var(--muted)}
    .contour{fill:none;stroke:var(--rule);stroke-width:2}
    .contour.strong{stroke:var(--model);stroke-width:3}
    .pathline{fill:none;stroke:var(--gradient);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .path-halo{fill:none;stroke:var(--gradient-soft);stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
    .guide{stroke:var(--rule-strong);stroke-width:2;stroke-dasharray:7 7}
    .callout-line{stroke:var(--text);stroke-width:2;fill:none}
    .rail{min-width:0;min-height:0;display:flex;flex-direction:column;border-top:var(--line-strong) solid var(--text)}
    .rail-block{padding:20px 4px 20px 0;border-bottom:var(--line) solid var(--rule)}
    .rail-block h2{margin-bottom:10px}
    .rail-block p{font-size:var(--fs-sec);line-height:1.55;color:var(--muted)}
    .reframe{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:start}
    .reframe .term{font-family:var(--font-mono);font-size:var(--fs-label);font-weight:600;color:var(--muted);padding-top:3px}
    .reframe strong{font-size:var(--fs-lead);line-height:1.38}
    .wrong{text-decoration:line-through;text-decoration-color:var(--target);text-decoration-thickness:3px;color:var(--muted)}
    .right{color:var(--model)}
    .takeaway{margin-top:auto;padding:22px 0 2px;border-top:var(--line-strong) solid var(--text);font-size:var(--fs-lead);font-weight:700;line-height:1.45}
    .takeaway .accent{color:var(--gradient)}
  </style>
</head>
<body data-page="09" data-total="24">
  <div id="stage">
    <header class="page-head">
      <span class="kicker">训练的几何视角</span>
      <h1>训练是在参数空间里寻找更低的损失</h1>
      <p class="lead">每一组参数对应一个位置；损失函数给这个位置标出“高度”。学习，就是沿着下降方向移动参数。</p>
    </header>

    <main class="lesson min0" aria-label="参数空间中的损失地形与训练路径">
      <figure class="landscape min0" aria-labelledby="map-title map-desc">
        <svg viewBox="0 0 990 650" role="img">
          <title id="map-title">参数空间中的损失等高线与训练路径</title>
          <desc id="map-desc">横纵轴表示两个参数方向。闭合等高线表示损失地形，橙红色路径从较高损失位置逐步移动到低损失盆地。</desc>
          <defs>
            <marker id="arrowGradient" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--gradient)"/>
            </marker>
          </defs>

          <line x1="74" y1="576" x2="930" y2="576" stroke="var(--text)" stroke-width="3"/>
          <line x1="74" y1="576" x2="74" y2="54" stroke="var(--text)" stroke-width="3"/>
          <path d="M930 576 l-14 -8 v16 z" fill="var(--text)"/>
          <path d="M74 54 l-8 14 h16 z" fill="var(--text)"/>
          <text x="895" y="612" class="axis-label">参数 θ₁</text>
          <text x="28" y="84" class="axis-label" transform="rotate(-90 28 84)">参数 θ₂</text>

          <path class="contour" d="M137 465 C98 330 165 151 340 100 C523 47 785 95 887 238 C978 366 873 518 692 548 C477 584 190 562 137 465Z"/>
          <path class="contour" d="M209 434 C176 333 229 205 354 163 C489 117 699 147 788 247 C867 335 800 455 665 494 C506 540 256 523 209 434Z"/>
          <path class="contour" d="M290 408 C267 337 305 255 397 226 C494 195 642 213 706 275 C762 330 718 410 622 444 C509 484 324 472 290 408Z"/>
          <path class="contour strong" d="M375 386 C360 344 387 299 445 282 C510 263 600 278 634 315 C665 349 639 394 577 414 C507 437 397 432 375 386Z"/>
          <path d="M446 369 C437 347 453 326 484 318 C519 309 560 319 574 338 C586 355 570 376 539 385 C503 395 455 389 446 369Z" fill="var(--model-soft)" stroke="var(--model)" stroke-width="3"/>

          <text x="764" y="170" class="diagram-label">较高损失</text>
          <path d="M755 177 L710 217" class="callout-line"/>
          <text x="482" y="357" class="diagram-label" fill="var(--model)">较低损失</text>
          <text x="452" y="408" class="diagram-note">可接受的参数区域</text>

          <path class="path-halo" d="M820 214 C770 255 755 321 690 315 C620 308 652 375 580 374 C538 374 529 360 512 352"/>
          <path class="pathline" marker-end="url(#arrowGradient)" d="M820 214 C770 255 755 321 690 315 C620 308 652 375 580 374 C538 374 529 360 512 352"/>
          <circle cx="820" cy="214" r="10" fill="var(--paper)" stroke="var(--gradient)" stroke-width="5"/>
          <text x="788" y="192" class="diagram-label">初始参数</text>
          <text x="658" y="289" class="diagram-note">更新参数</text>

          <line x1="512" y1="352" x2="512" y2="576" class="guide"/>
          <line x1="74" y1="352" x2="512" y2="352" class="guide"/>
          <circle cx="512" cy="576" r="5" fill="var(--model)"/>
          <circle cx="74" cy="352" r="5" fill="var(--model)"/>
        </svg>
      </figure>

      <aside class="rail min0" aria-label="训练视角的重新表述">
        <section class="rail-block">
          <h2>把说法换成几何问题</h2>
          <div class="reframe">
            <span class="term">不要说</span>
            <strong class="wrong">记住每个样本的口令</strong>
          </div>
          <div class="reframe" style="margin-top:18px">
            <span class="term">改成说</span>
            <strong class="right">调整参数，让整体损失降低</strong>
          </div>
        </section>

        <section class="rail-block">
          <h2>图上每个对象是什么</h2>
          <p><span class="is-model">位置</span>是一组参数；等高线连接损失相近的位置；<span class="is-gradient">路径</span>是连续更新后的参数轨迹。</p>
        </section>

        <section class="rail-block">
          <h2>低损失意味着什么</h2>
          <p>同一组参数要共同处理训练样本。目标是找到让整体预测误差较小的区域，不是为每个样本保存一条独立答案。</p>
        </section>

        <p class="takeaway">训练改变的是<span class="accent">参数的位置</span>，损失提供移动方向。</p>
      </aside>
    </main>
  </div>
  <script src="assets/base.js"></script>
</body>
</html>
