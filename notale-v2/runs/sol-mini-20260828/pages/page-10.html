<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css" disabled>
<style>
  :root { --pad-x:56px; --pad-y:28px; --bg:#E7EEF0; --paper:#F7FAFA; --paper-strong:#FFFFFF; --text:#14282E; --muted:#526A71; --rule:#9DB0B5; --rule-strong:#687E84; --model:#1D5C78; --gradient:#C64F2B; --attention:#D98B16; --focus:#0E6C86; --shadow:rgba(20,40,46,.12); --font-display:'Arial Narrow','Noto Sans SC',sans-serif; --font-sans:'Noto Sans SC','Microsoft YaHei',sans-serif; --font-mono:Consolas,monospace; --fs-h1:42px; --fs-h2:27px; --fs-body:19px; --fs-sec:17px; --fs-label:15px; --radius:6px; --line:2px; --line-strong:4px; }
  html,body { background:var(--bg); color:var(--text); font-family:var(--font-sans); }
  #stage { display:flex; flex-direction:column; padding:28px 56px; position:relative; overflow:hidden; background:var(--bg); color:var(--text); font-size:var(--fs-body); line-height:1.5; }
  h1,h2,p { margin:0; } h1,h2 { color:var(--text); }
  h1 { font-family:var(--font-display); font-size:var(--fs-h1); font-weight:700; line-height:1.04; letter-spacing:.01em; }
  h2 { font-size:var(--fs-h2); font-weight:700; line-height:1.18; }
  .kicker { display:block; margin:0 0 8px; color:var(--muted); font-family:var(--font-mono); font-size:var(--fs-label); font-weight:600; letter-spacing:.06em; }
  .page { flex: 1; min-height: 0; display: grid; grid-template-rows: auto minmax(0,1fr) auto; gap: 20px; }
  .head { display: flex; align-items: end; justify-content: space-between; gap: 36px; padding-bottom: 14px; border-bottom: var(--line-strong) solid var(--text); }
  .head-copy { min-width: 0; }
  .leadline { max-width: 520px; color: var(--muted); font-size: var(--fs-sec); line-height: 1.5; text-align: right; }
  .body { display: grid; grid-template-columns: minmax(0, 1fr) 382px; gap: 28px; min-height: 0; }
  .plot { position: relative; min-height: 0; background: var(--paper); border: var(--line) solid var(--rule); border-radius: var(--radius); box-shadow: 0 5px 0 var(--shadow); overflow: hidden; }
  .plot svg { width: 100%; height: 100%; display: block; }
  .axis { stroke: var(--rule-strong); stroke-width: 2; }
  .curve { fill: none; stroke: var(--model); stroke-width: 7; stroke-linecap: round; }
  .tangent { fill: none; stroke: var(--gradient); stroke-width: 5; stroke-linecap: round; }
  .guide { stroke: var(--rule); stroke-width: 2; stroke-dasharray: 7 7; }
  .move { fill: none; stroke: var(--attention); stroke-width: 5; stroke-linecap: round; }
  .point { fill: var(--paper-strong); stroke: var(--gradient); stroke-width: 5; }
  .minpoint { fill: var(--model); }
  .svg-title { fill: var(--text); font-family: var(--font-sans); font-size: 20px; font-weight: 700; }
  .svg-label { fill: var(--muted); font-family: var(--font-sans); font-size: 16px; font-weight: 600; }
  .svg-eq { fill: var(--gradient); font-family: var(--font-mono); font-size: 20px; font-weight: 600; }
  .svg-move { fill: var(--attention); font-family: var(--font-sans); font-size: 17px; font-weight: 700; }
  .rail { display: grid; grid-template-rows: 1fr 1fr; min-height: 0; border-top: var(--line-strong) solid var(--text); border-bottom: var(--line) solid var(--rule-strong); }
  .ruleblock { display: grid; align-content: center; gap: 12px; padding: 22px 8px; }
  .ruleblock + .ruleblock { border-top: var(--line) solid var(--rule); }
  .rule-head { display: flex; align-items: baseline; gap: 14px; }
  .rule-key { color: var(--gradient); font-family: var(--font-display); font-size: 48px; line-height: 1; font-weight: 700; }
  .ruleblock:nth-child(2) .rule-key { color: var(--model); }
  .ruleblock h2 { font-size: var(--fs-h2); }
  .ruleblock p { color: var(--muted); font-size: var(--fs-sec); line-height: 1.55; }
  .rail-eq { font-family: var(--font-mono); font-size: var(--fs-body); font-weight: 600; color: var(--text); }
  .bottom { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 28px; min-height: 92px; padding: 14px 22px; border: var(--line) solid var(--rule-strong); border-radius: var(--radius); background: var(--paper); }
  .case { display: flex; align-items: center; gap: 15px; min-width: 0; }
  .sign { flex: 0 0 auto; color: var(--gradient); font-family: var(--font-mono); font-size: 25px; font-weight: 600; }
  .case strong { display: block; font-size: var(--fs-body); }
  .case span:last-child { color: var(--muted); font-size: var(--fs-label); }
  .divider { width: var(--line); height: 54px; background: var(--rule); }
  .opposite { color: var(--attention); }
</style>
</head>
<body data-page="10" data-total="24">
<div id="stage">
  <main class="page">
    <header class="head">
      <div class="head-copy">
        <span class="kicker">导数 · 局部读数</span>
        <h1>切线的斜率：符号指方向，大小量敏感</h1>
      </div>
      <p class="leadline">导数只描述当前位置附近：权重稍微移动，损失会朝哪边变、变化有多快。</p>
    </header>

    <section class="body min0" aria-label="损失曲线与两处切线">
      <figure class="plot min0" aria-labelledby="plot-title">
        <svg viewBox="0 0 1030 570" role="img" aria-labelledby="plot-title plot-desc">
          <title id="plot-title">损失曲线左右两侧的切线</title>
          <desc id="plot-desc">左侧切线斜率为负，减小损失应向右移动；右侧切线斜率为正，减小损失应向左移动。切线越陡，局部敏感程度越高。</desc>
          <defs>
            <marker id="axisArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#687E84"/>
            </marker>
            <marker id="moveArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#D98B16"/>
            </marker>
          </defs>

          <text x="50" y="42" class="svg-title">同一条损失曲线 L(w)，在两个位置读取局部斜率</text>
          <line x1="92" y1="505" x2="966" y2="505" class="axis" marker-end="url(#axisArrow)"/>
          <line x1="92" y1="505" x2="92" y2="82" class="axis" marker-end="url(#axisArrow)"/>
          <text x="970" y="511" class="svg-title">w</text>
          <text x="56" y="79" class="svg-title">L</text>

          <path d="M 140 125 C 265 278, 350 455, 526 466 C 705 478, 786 250, 918 112" class="curve"/>
          <text x="823" y="87" class="svg-label">损失曲线</text>

          <line x1="178" y1="150" x2="444" y2="424" class="tangent"/>
          <circle cx="292" cy="267" r="10" class="point"/>
          <line x1="292" y1="277" x2="292" y2="505" class="guide"/>
          <text x="148" y="205" class="svg-eq">dL/dw &lt; 0</text>
          <text x="160" y="232" class="svg-label">向右时，损失下降</text>
          <line x1="254" y1="334" x2="390" y2="334" class="move" marker-end="url(#moveArrow)"/>
          <text x="259" y="365" class="svg-move">降损失：w 向右</text>

          <line x1="652" y1="405" x2="899" y2="134" class="tangent"/>
          <circle cx="790" cy="254" r="10" class="point"/>
          <line x1="790" y1="265" x2="790" y2="505" class="guide"/>
          <text x="805" y="290" class="svg-eq">dL/dw &gt; 0</text>
          <text x="805" y="317" class="svg-label">向右时，损失上升</text>
          <line x1="850" y1="361" x2="714" y2="361" class="move" marker-end="url(#moveArrow)"/>
          <text x="706" y="392" class="svg-move">降损失：w 向左</text>

          <circle cx="526" cy="466" r="8" class="minpoint"/>
          <text x="492" y="497" class="svg-label">斜率接近 0</text>
        </svg>
      </figure>

      <aside class="rail min0" aria-label="导数的两个读法">
        <section class="ruleblock">
          <div class="rule-head"><span class="rule-key">±</span><h2>符号读方向</h2></div>
          <div class="rail-eq">dL/dw</div>
          <p>符号说明增大权重时，损失会上升还是下降。要降低损失，就沿导数符号的<span class="opposite">反方向</span>移动。</p>
        </section>
        <section class="ruleblock">
          <div class="rule-head"><span class="rule-key">|·|</span><h2>绝对值读敏感</h2></div>
          <div class="rail-eq">|dL/dw|</div>
          <p>切线越陡，权重的小变化引起的损失变化越大；切线越平，当前位置越不敏感。</p>
        </section>
      </aside>
    </section>

    <footer class="bottom" aria-label="梯度下降的方向规则">
      <div class="case">
        <span class="sign">dL/dw &lt; 0</span>
        <div><strong>增大 w 可降低损失</strong><span>更新方向向右</span></div>
      </div>
      <div class="divider" aria-hidden="true"></div>
      <div class="case">
        <span class="sign">dL/dw &gt; 0</span>
        <div><strong>减小 w 可降低损失</strong><span>更新方向向左</span></div>
      </div>
    </footer>
  </main>
</div>
<script src="assets/base.js"></script>
<script>Deck.init({index:10,total:24});</script>
</body>
</html>
