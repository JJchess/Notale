<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .page-head{flex:0 0 auto;margin-bottom:22px}
    .page-head h1{max-width:1180px}
    .page-head .lead{margin-top:12px;max-width:46em;color:var(--muted)}
    .lesson{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) 112px;gap:20px}
    .main-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(360px,.55fr);gap:28px;min-height:0}
    .landscape{position:relative;min-height:0;border-top:var(--line-strong) solid var(--text);border-bottom:var(--line) solid var(--rule-strong);background:var(--paper)}
    .landscape svg{display:block;width:100%;height:100%}
    .formula-rail{display:flex;flex-direction:column;justify-content:center;gap:22px;min-width:0;padding:8px 2px}
    .formula{padding:24px 0 22px;border-top:var(--line-strong) solid var(--text);border-bottom:var(--line) solid var(--rule)}
    .eq{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;font-family:var(--font-mono);font-size:34px;font-weight:600;line-height:1.25;letter-spacing:-.025em}
    .eq .minus{color:var(--gradient);font-size:42px}
    .eq .eta{color:var(--attention)}
    .decode{display:grid;gap:0;border-bottom:var(--line) solid var(--rule)}
    .decode-row{display:grid;grid-template-columns:66px minmax(0,1fr);gap:14px;padding:15px 0;border-top:var(--line) solid var(--rule);align-items:start}
    .decode-row strong{font-family:var(--font-mono);font-size:22px;line-height:1.2}
    .decode-row p{font-size:var(--fs-sec);line-height:1.45}
    .minus-key{color:var(--gradient)}
    .eta-key{color:var(--attention)}
    .summary{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:24px;padding:18px 24px;border:var(--line) solid var(--rule-strong);background:var(--paper)}
    .summary-block{min-width:0}
    .summary-block .label{display:block;margin-bottom:4px;color:var(--muted);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:600;letter-spacing:.04em}
    .summary-block strong{font-size:var(--fs-lead);line-height:1.3}
    .summary .divider{width:var(--line);height:58px;background:var(--rule)}
    .summary .direction strong{color:var(--gradient)}
    .summary .distance strong{color:var(--attention)}
    .plot-title{font-family:var(--font-sans);font-size:19px;font-weight:700;fill:var(--text)}
    .plot-label{font-family:var(--font-sans);font-size:17px;font-weight:600;fill:var(--text)}
    .plot-note{font-family:var(--font-sans);font-size:15px;font-weight:500;fill:var(--muted)}
    .plot-math{font-family:var(--font-mono);font-size:18px;font-weight:600;fill:var(--text)}
  </style>
</head>
<body data-page="12" data-total="24">
  <div id="stage">
    <header class="page-head">
      <span class="kicker">梯度下降 · 参数更新</span>
      <h1>负梯度定方向，学习率定步长</h1>
      <p class="lead">梯度指向损失上升最快的方向；更新时取它的反方向，让参数朝更低的损失移动。</p>
    </header>

    <main class="lesson min0">
      <section class="main-grid min0" aria-label="梯度下降的方向与步长">
        <figure class="landscape min0" aria-label="损失曲线上的一次参数更新：从当前参数沿负梯度移动，学习率改变移动距离。">
          <svg viewBox="0 0 1000 560" role="img" aria-labelledby="plot-title plot-desc">
            <title id="plot-title">损失曲线上的一次参数更新</title>
            <desc id="plot-desc">参数当前位于损失曲线右坡。梯度箭头朝右，负梯度更新箭头朝左并靠近最低点。较小和较大的学习率沿同一方向产生不同步长。</desc>
            <defs>
              <marker id="arrowGradient" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
                <path d="M1,1 L11,6 L1,11 Z" fill="var(--gradient)"/>
              </marker>
              <marker id="arrowAttention" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
                <path d="M1,1 L11,6 L1,11 Z" fill="var(--attention)"/>
              </marker>
              <marker id="arrowRule" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
                <path d="M1,1 L9,5 L1,9 Z" fill="var(--rule-strong)"/>
              </marker>
            </defs>

            <text x="44" y="40" class="plot-title">一次更新发生在损失曲线的斜坡上</text>
            <line x1="88" y1="486" x2="930" y2="486" stroke="var(--rule-strong)" stroke-width="2" marker-end="url(#arrowRule)"/>
            <line x1="88" y1="486" x2="88" y2="76" stroke="var(--rule-strong)" stroke-width="2" marker-end="url(#arrowRule)"/>
            <text x="920" y="522" class="plot-math">参数 θ</text>
            <text x="22" y="86" class="plot-label">损失 L</text>

            <path d="M150 112 C235 263 305 410 465 432 C635 456 730 270 868 100" fill="none" stroke="var(--model)" stroke-width="6" stroke-linecap="round"/>
            <line x1="112" y1="414" x2="900" y2="414" stroke="var(--rule)" stroke-width="2" stroke-dasharray="7 9"/>
            <circle cx="514" cy="432" r="8" fill="var(--paper)" stroke="var(--model)" stroke-width="4"/>
            <text x="466" y="470" class="plot-note">损失最低处</text>

            <circle cx="760" cy="258" r="11" fill="var(--target)" stroke="var(--paper)" stroke-width="4"/>
            <line x1="670" y1="356" x2="850" y2="160" stroke="var(--target)" stroke-width="3" stroke-dasharray="9 7"/>
            <text x="774" y="285" class="plot-math">θₜ</text>
            <text x="812" y="318" class="plot-note">当前参数</text>

            <line x1="760" y1="226" x2="885" y2="226" stroke="var(--gradient)" stroke-width="5" marker-end="url(#arrowGradient)"/>
            <text x="770" y="192" class="plot-label" fill="var(--gradient)" style="fill:var(--gradient)">梯度 ∇L：损失上升</text>

            <line x1="748" y1="306" x2="650" y2="306" stroke="var(--attention)" stroke-width="4" marker-end="url(#arrowAttention)"/>
            <circle cx="650" cy="376" r="8" fill="var(--attention)"/>
            <text x="630" y="402" class="plot-math" style="fill:var(--attention)">小 η</text>

            <line x1="748" y1="350" x2="535" y2="350" stroke="var(--attention)" stroke-width="6" marker-end="url(#arrowAttention)"/>
            <circle cx="535" cy="430" r="9" fill="var(--attention)"/>
            <text x="496" y="402" class="plot-math" style="fill:var(--attention)">大 η</text>
            <text x="548" y="326" class="plot-label" style="fill:var(--gradient)">−∇L：更新方向</text>

            <path d="M650 376 Q704 329 748 306" fill="none" stroke="var(--rule)" stroke-width="2" stroke-dasharray="5 6"/>
            <path d="M535 430 Q652 376 748 350" fill="none" stroke="var(--rule)" stroke-width="2" stroke-dasharray="5 6"/>
          </svg>
        </figure>

        <aside class="formula-rail min0" aria-label="更新公式拆解">
          <div>
            <span class="kicker">更新规则</span>
            <div class="formula">
              <div class="eq" aria-label="theta t 加一等于 theta t 减去 eta 乘损失对 theta 的梯度">
                <span>θₜ₊₁</span><span>=</span><span>θₜ</span><span class="minus">−</span><span class="eta">η</span><span>∇L(θₜ)</span>
              </div>
            </div>
          </div>
          <div class="decode">
            <div class="decode-row">
              <strong class="minus-key">−</strong>
              <p><b>反向</b><br>不顺着梯度上坡，而是朝损失下降的方向走。</p>
            </div>
            <div class="decode-row">
              <strong class="eta-key">η</strong>
              <p><b>缩放</b><br>学习率为正，只放大或缩小这一步，不改变方向。</p>
            </div>
          </div>
          <p class="note">同一个梯度下，改变 η 只会让箭头变长或变短。</p>
        </aside>
      </section>

      <section class="summary" aria-label="结论">
        <div class="summary-block direction">
          <span class="label">方向由谁决定</span>
          <strong>负梯度 −∇L</strong>
        </div>
        <div class="divider" aria-hidden="true"></div>
        <div class="summary-block distance">
          <span class="label">一步走多远</span>
          <strong>学习率 η</strong>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:12,total:24});</script>
</body>
</html>
