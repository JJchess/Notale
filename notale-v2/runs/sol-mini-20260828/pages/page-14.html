<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梯度：从斜率到最陡方向</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:22px}
    .page-head{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px;border-bottom:2px solid var(--rule);padding-bottom:18px}
    .head-copy{min-width:0}
    .head-note{flex:0 0 440px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45;padding-bottom:2px}
    .lesson{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.72fr) 72px minmax(0,1.28fr);gap:24px;align-items:stretch}
    .zone{min-width:0;min-height:0;display:flex;flex-direction:column}
    .zone-head{display:flex;align-items:baseline;justify-content:space-between;gap:18px;margin-bottom:10px}
    .zone-label{color:var(--muted);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:600;letter-spacing:.04em}
    .curve-box{flex:1;min-height:0;position:relative;border-bottom:2px solid var(--rule-strong);background:var(--paper)}
    .curve-box svg,.surface-box svg{display:block;width:100%;height:100%}
    .one-read{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
    .formula{font-family:var(--font-mono);font-size:var(--fs-lead);font-weight:600;white-space:nowrap}
    .formula .grad{color:var(--gradient)}
    .one-read p{color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
    .bridge{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--rule-strong);gap:10px}
    .bridge-line{width:54px;height:2px;background:currentColor;position:relative}
    .bridge-line::after{content:"";position:absolute;right:0;top:50%;width:12px;height:12px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:translateY(-50%) rotate(45deg)}
    .bridge span{font-size:var(--fs-label);font-weight:700;writing-mode:vertical-rl;letter-spacing:.08em}
    .surface-wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:18px}
    .surface-box{position:relative;min-width:0;min-height:0;background:var(--paper);border-bottom:2px solid var(--rule-strong)}
    .side-note{display:flex;flex-direction:column;justify-content:center;gap:20px;padding:4px 0}
    .vector-formula{padding:18px 0;border-top:4px solid var(--gradient);border-bottom:2px solid var(--rule)}
    .vector-formula .sym{display:block;color:var(--gradient);font-family:var(--font-mono);font-size:32px;font-weight:600;line-height:1.2}
    .vector-formula .matrix{display:block;margin-top:10px;font-family:var(--font-mono);font-size:var(--fs-sec);font-weight:600;line-height:1.65}
    .side-note p{font-size:var(--fs-sec);line-height:1.45;color:var(--muted)}
    .side-note strong{color:var(--text)}
    .bottom-claim{grid-column:1/-1;display:flex;align-items:center;gap:22px;padding-top:16px;border-top:2px solid var(--text)}
    .claim-key{flex:0 0 auto;color:var(--gradient);font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1}
    .bottom-claim p{font-size:var(--fs-lead);font-weight:600;line-height:1.35}
    .bottom-claim .muted{color:var(--muted);font-weight:500}
    .svg-label{font-family:var(--font-sans);font-size:16px;fill:var(--muted)}
    .svg-strong{font-family:var(--font-sans);font-size:17px;font-weight:700;fill:var(--text)}
    .svg-mono{font-family:var(--font-mono);font-size:16px;font-weight:600;fill:var(--text)}
  </style>
</head>
<body data-page="14" data-total="24">
  <div id="stage">
    <header class="page-head">
      <div class="head-copy min0">
        <span class="kicker">从一维斜率到多维梯度</span>
        <h1>参数变多后，“往哪边升得最快”由梯度回答</h1>
      </div>
      <p class="head-note">一条曲线上只有一个参数方向；损失曲面上，每个参数都有自己的偏导数。</p>
    </header>

    <main class="lesson min0">
      <section class="zone min0" aria-labelledby="curve-title">
        <div class="zone-head">
          <h2 id="curve-title">一个参数：斜率是一个数</h2>
          <span class="zone-label">L(w)</span>
        </div>
        <div class="curve-box">
          <svg viewBox="0 0 520 430" role="img" aria-label="损失随单个参数变化的曲线，在当前位置用切线表示导数">
            <defs>
              <marker id="axisArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#687E84"/></marker>
              <marker id="gradArrow1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C64F2B"/></marker>
            </defs>
            <line x1="68" y1="365" x2="480" y2="365" stroke="#687E84" stroke-width="2" marker-end="url(#axisArrow)"/>
            <line x1="68" y1="365" x2="68" y2="36" stroke="#687E84" stroke-width="2" marker-end="url(#axisArrow)"/>
            <text x="468" y="399" class="svg-mono">w</text><text x="32" y="48" class="svg-mono">L</text>
            <path d="M94 102 C166 121 204 285 270 294 C333 303 364 209 450 64" fill="none" stroke="#1D5C78" stroke-width="6"/>
            <line x1="181" y1="307" x2="358" y2="191" stroke="#C64F2B" stroke-width="4"/>
            <circle cx="270" cy="249" r="8" fill="#F7FAFA" stroke="#C64F2B" stroke-width="5"/>
            <line x1="270" y1="249" x2="350" y2="197" stroke="#C64F2B" stroke-width="5" marker-end="url(#gradArrow1)"/>
            <line x1="270" y1="249" x2="270" y2="365" stroke="#9DB0B5" stroke-width="2" stroke-dasharray="7 7"/>
            <text x="286" y="278" class="svg-strong">当前位置</text>
            <text x="330" y="174" class="svg-strong" fill="#C64F2B">上升方向</text>
            <text x="160" y="331" class="svg-label">切线斜率</text>
          </svg>
        </div>
        <div class="one-read">
          <div class="formula"><span class="grad">dL</span> / dw</div>
          <p>导数的正负给出方向，绝对值表示局部变化有多快。</p>
        </div>
      </section>

      <div class="bridge" aria-hidden="true"><div class="bridge-line"></div><span>增加参数</span></div>

      <section class="zone min0" aria-labelledby="surface-title">
        <div class="zone-head">
          <h2 id="surface-title">多个参数：每个方向各算一个偏导</h2>
          <span class="zone-label">L(w₁, w₂, …)</span>
        </div>
        <div class="surface-wrap min0">
          <div class="surface-box">
            <svg viewBox="0 0 700 520" role="img" aria-label="损失曲面的等高线图，梯度向量由两个偏导分量组成，并垂直穿过等高线指向上升最快方向">
              <defs>
                <marker id="axisArrow2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#687E84"/></marker>
                <marker id="gradArrow2" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#C64F2B"/></marker>
                <marker id="compArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#D98B16"/></marker>
              </defs>
              <line x1="82" y1="447" x2="640" y2="447" stroke="#687E84" stroke-width="2" marker-end="url(#axisArrow2)"/>
              <line x1="82" y1="447" x2="82" y2="48" stroke="#687E84" stroke-width="2" marker-end="url(#axisArrow2)"/>
              <text x="620" y="481" class="svg-mono">w₁</text><text x="40" y="61" class="svg-mono">w₂</text>
              <g fill="none" stroke="#1D5C78">
                <ellipse cx="376" cy="263" rx="240" ry="164" stroke-width="2" opacity=".35" transform="rotate(-18 376 263)"/>
                <ellipse cx="376" cy="263" rx="190" ry="128" stroke-width="3" opacity=".48" transform="rotate(-18 376 263)"/>
                <ellipse cx="376" cy="263" rx="140" ry="92" stroke-width="4" opacity=".64" transform="rotate(-18 376 263)"/>
                <ellipse cx="376" cy="263" rx="88" ry="56" stroke-width="5" opacity=".82" transform="rotate(-18 376 263)"/>
                <ellipse cx="376" cy="263" rx="38" ry="23" stroke-width="6" transform="rotate(-18 376 263)"/>
              </g>
              <text x="395" y="271" class="svg-strong" fill="#1D5C78">高损失</text>
              <circle cx="254" cy="354" r="9" fill="#F7FAFA" stroke="#14282E" stroke-width="4"/>
              <text x="184" y="388" class="svg-strong">当前位置</text>
              <line x1="254" y1="354" x2="254" y2="178" stroke="#D98B16" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#compArrow)"/>
              <line x1="254" y1="354" x2="456" y2="354" stroke="#D98B16" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#compArrow)"/>
              <text x="274" y="206" class="svg-mono" fill="#D98B16">∂L/∂w₂</text>
              <text x="360" y="384" class="svg-mono" fill="#D98B16">∂L/∂w₁</text>
              <line x1="254" y1="354" x2="454" y2="178" stroke="#C64F2B" stroke-width="7" marker-end="url(#gradArrow2)"/>
              <path d="M412 204 Q441 221 463 249" fill="none" stroke="#14282E" stroke-width="2"/>
              <text x="475" y="245" class="svg-strong">穿过等高线</text>
              <text x="475" y="270" class="svg-label">局部上升最快</text>
              <text x="350" y="155" class="svg-mono" fill="#C64F2B">∇L</text>
            </svg>
          </div>
          <aside class="side-note" aria-label="梯度定义">
            <div class="vector-formula">
              <span class="sym">∇L =</span>
              <span class="matrix">[ ∂L/∂w₁,<br>&nbsp; ∂L/∂w₂,<br>&nbsp; … ]ᵀ</span>
            </div>
            <p><strong>每个偏导是一个分量。</strong><br>把它们排成向量，就同时保留了各参数方向的变化率。</p>
          </aside>
        </div>
      </section>

      <div class="bottom-claim">
        <div class="claim-key">梯度 ∇L</div>
        <p>由所有偏导数组成，指向损失增长最快的方向。<span class="muted">反方向 −∇L 则让损失下降最快。</span></p>
      </div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:14,total:24});</script>
</body>
</html>
