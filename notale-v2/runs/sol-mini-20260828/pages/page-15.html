<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page-head{flex:0 0 auto;padding-top:2px}
  .page-head h1{max-width:1100px}
  .page-head .lead{margin-top:12px;max-width:48em;color:var(--muted)}
  .chain-stage{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:22px;margin-top:20px}
  .diagram{position:relative;min-height:0;border-top:var(--line-strong) solid var(--text);border-bottom:var(--line) solid var(--rule-strong);background:rgba(247,250,250,.58)}
  .diagram svg{display:block;width:100%;height:100%}
  .equation-band{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:24px;padding:18px 26px;border:var(--line) solid var(--rule-strong);border-radius:var(--radius);background:var(--paper)}
  .eq-part{display:flex;align-items:baseline;justify-content:center;gap:12px;min-width:0}
  .eq-main{font-family:var(--font-mono);font-size:38px;font-weight:600;line-height:1;color:var(--gradient);white-space:nowrap}
  .eq-note{font-size:var(--fs-label);font-weight:700;color:var(--muted);white-space:nowrap}
  .times{font-family:var(--font-display);font-size:46px;font-weight:700;color:var(--text)}
  .result{color:var(--text)}
  .takeaway{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;color:var(--text);font-size:var(--fs-lead);font-weight:700;white-space:nowrap}
  .takeaway::before{content:'';width:46px;height:4px;background:var(--gradient)}
  .formula{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
</style>
</head>
<body data-page="15" data-total="24">
<div id="stage">
  <header class="page-head">
    <span class="kicker">链式法则 · 复合计算</span>
    <h1>总影响等于沿路径把各段局部影响相乘</h1>
    <p class="lead">变量先影响中间量，再由中间量影响输出。反向追问输入对输出的影响时，逐段接上局部导数。</p>
  </header>

  <main class="chain-stage min0">
    <section class="diagram min0" aria-label="复合函数的链式法则路径图">
      <svg viewBox="0 0 1488 570" role="img" aria-label="输入 x 经过函数 g 得到中间量 u，再经过函数 f 得到输出 y。局部影响分别是 u 对 x 的导数和 y 对 u 的导数。">
        <defs>
          <marker id="forwardArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M1,1 L11,6 L1,11" fill="none" stroke="var(--model)" stroke-width="2"/>
          </marker>
          <marker id="backArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M1,1 L11,6 L1,11" fill="none" stroke="var(--gradient)" stroke-width="2"/>
          </marker>
        </defs>

        <text x="744" y="48" text-anchor="middle" fill="var(--muted)" font-family="var(--font-sans)" font-size="17" font-weight="700">前向计算：把值依次送过两个函数</text>

        <line x1="250" y1="215" x2="617" y2="215" stroke="var(--model)" stroke-width="5" marker-end="url(#forwardArrow)"/>
        <line x1="870" y1="215" x2="1237" y2="215" stroke="var(--model)" stroke-width="5" marker-end="url(#forwardArrow)"/>
        <text x="434" y="176" text-anchor="middle" fill="var(--model)" font-family="var(--font-mono)" font-size="23" font-weight="600">u = g(x)</text>
        <text x="1054" y="176" text-anchor="middle" fill="var(--model)" font-family="var(--font-mono)" font-size="23" font-weight="600">y = f(u)</text>

        <circle cx="175" cy="215" r="73" fill="var(--paper)" stroke="var(--text)" stroke-width="4"/>
        <circle cx="744" cy="215" r="91" fill="var(--paper)" stroke="var(--text)" stroke-width="4"/>
        <circle cx="1313" cy="215" r="73" fill="var(--paper)" stroke="var(--text)" stroke-width="4"/>
        <text x="175" y="226" text-anchor="middle" fill="var(--text)" font-family="var(--font-mono)" font-size="48" font-weight="600">x</text>
        <text x="744" y="208" text-anchor="middle" fill="var(--text)" font-family="var(--font-mono)" font-size="48" font-weight="600">u</text>
        <text x="744" y="242" text-anchor="middle" fill="var(--muted)" font-family="var(--font-sans)" font-size="16" font-weight="700">中间量</text>
        <text x="1313" y="226" text-anchor="middle" fill="var(--text)" font-family="var(--font-mono)" font-size="48" font-weight="600">y</text>

        <path d="M1238 349 C1110 450, 946 450, 824 349" fill="none" stroke="var(--gradient)" stroke-width="5" marker-end="url(#backArrow)"/>
        <path d="M664 349 C542 450, 378 450, 250 349" fill="none" stroke="var(--gradient)" stroke-width="5" marker-end="url(#backArrow)"/>

        <text x="1033" y="414" text-anchor="middle" fill="var(--gradient)" font-family="var(--font-mono)" font-size="28" font-weight="600">∂y/∂u</text>
        <text x="1033" y="443" text-anchor="middle" fill="var(--muted)" font-family="var(--font-sans)" font-size="16" font-weight="700">这一段的局部影响</text>
        <text x="455" y="414" text-anchor="middle" fill="var(--gradient)" font-family="var(--font-mono)" font-size="28" font-weight="600">∂u/∂x</text>
        <text x="455" y="443" text-anchor="middle" fill="var(--muted)" font-family="var(--font-sans)" font-size="16" font-weight="700">这一段的局部影响</text>

      </svg>
      <div class="takeaway"><span class="formula">∂y/∂x</span> 要把路径上的两段影响接起来</div>
    </section>

    <section class="equation-band" aria-label="链式法则公式拆解">
      <div class="eq-part">
        <span class="eq-main">∂y/∂u</span>
        <span class="eq-note">输出对中间量</span>
      </div>
      <span class="times" aria-hidden="true">×</span>
      <div class="eq-part">
        <span class="eq-main">∂u/∂x</span>
        <span class="eq-note">中间量对输入</span>
      </div>
      <span class="times" aria-hidden="true">=</span>
      <div class="eq-part">
        <span class="eq-main result">∂y/∂x</span>
        <span class="eq-note">输出对输入的总影响</span>
      </div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script>Deck.init({index:15,total:24});</script>
</body>
</html>
