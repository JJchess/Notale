<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:18px}
    .head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:36px}
    .head-copy{min-width:0}
    .head h1{max-width:1020px}
    .head .lead{max-width:430px;text-align:right;color:var(--muted);font-size:var(--fs-sec)}
    .studio{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.44fr) minmax(420px,.72fr);gap:24px}
    .boundary{position:relative;min-height:0;background:var(--paper)}
    .boundary canvas{position:absolute;inset:0;width:100%;height:100%}
    .plot-label{position:absolute;z-index:2;left:18px;top:14px;display:flex;align-items:center;gap:16px;padding:6px 10px;background:rgba(247,250,250,.9);border-radius:var(--radius);font-size:var(--fs-label);font-weight:700;pointer-events:none}
    .plot-label .pair{display:inline-flex;gap:7px;align-items:center;color:var(--muted)}
    .dot{width:12px;height:12px;border:2px solid var(--text);border-radius:50%;background:var(--swatch)}
    .axis-name{position:absolute;z-index:2;color:var(--muted);font-size:var(--fs-label);font-weight:700;pointer-events:none}
    .axis-name.x{right:15px;bottom:10px}.axis-name.y{left:12px;bottom:12px}
    .rail{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);gap:14px}
    .meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:var(--line-strong) solid var(--text);border-bottom:var(--line) solid var(--rule)}
    .meter{padding:12px 13px;min-width:0;border-right:var(--line) solid var(--rule)}
    .meter:last-child{border-right:0}.meter .name{display:block;color:var(--muted);font-size:var(--fs-label);font-weight:700;margin-bottom:4px}
    .meter .value{font-family:var(--font-mono);font-size:27px;line-height:1.05;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
    .mini{position:relative;min-height:0;border-top:var(--line-strong) solid var(--text);border-bottom:var(--line) solid var(--rule);background:rgba(247,250,250,.45)}
    .mini h2{position:absolute;z-index:2;left:13px;top:9px;font-size:var(--fs-sec);padding:2px 7px;background:rgba(231,238,240,.92)}
    .mini .sub{position:absolute;z-index:2;right:12px;top:11px;color:var(--muted);font-size:var(--fs-label)}
    .mini canvas{position:absolute;inset:0;width:100%;height:100%}
    .controls{flex:0 0 86px;display:grid;grid-template-columns:auto minmax(300px,1fr) auto;align-items:center;gap:24px;padding:15px 18px;border-top:var(--line-strong) solid var(--text);border-bottom:var(--line) solid var(--rule);background:var(--paper)}
    .controls .btns{flex-wrap:nowrap}.controls .btn{min-width:112px}
    .state{min-width:0}.state strong{display:block;font-size:var(--fs-sec);margin-bottom:2px}.state span{display:block;color:var(--muted);font-size:var(--fs-label)}
    .arch{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:var(--fs-label);white-space:nowrap}
    .arch b{font-family:var(--font-mono);font-size:var(--fs-sec);color:var(--text)}
  </style>
</head>
<body data-page="21" data-total="24">
  <div id="stage">
    <header class="head">
      <div class="head-copy min0">
        <span class="kicker">训练现场</span>
        <h1>一次参数更新，三种证据同时移动</h1>
      </div>
      <p class="lead">运行小网络：边界重画、损失下降、参数沿轨迹寻找更合适的位置。</p>
    </header>

    <main class="studio min0" aria-label="小型神经网络训练实验台">
      <section class="boundary cvbox min0" aria-labelledby="boundary-title">
        <div class="plot-label" id="boundary-title">
          <span>决策边界</span>
          <span class="pair"><i class="dot" style="--swatch:var(--model-soft)"></i>类别 A</span>
          <span class="pair"><i class="dot" style="--swatch:var(--target-soft)"></i>类别 B</span>
        </div>
        <canvas id="field" aria-label="分类样本与网络当前决策区域"></canvas>
        <span class="axis-name x">特征 x</span><span class="axis-name y">特征 y</span>
      </section>

      <aside class="rail min0" aria-label="训练读数">
        <div class="meters">
          <div class="meter"><span class="name">更新次数</span><span class="value" id="iter">0</span></div>
          <div class="meter"><span class="name">交叉熵损失</span><span class="value" id="loss">—</span></div>
          <div class="meter"><span class="name">分类正确率</span><span class="value" id="acc">—</span></div>
        </div>
        <section class="mini min0" aria-labelledby="loss-title">
          <h2 id="loss-title">损失随更新变化</h2><span class="sub">越低越好</span>
          <canvas id="lossPlot" aria-label="训练损失折线"></canvas>
        </section>
        <section class="mini min0" aria-labelledby="param-title">
          <h2 id="param-title">两个参数的联合轨迹</h2><span class="sub">当前点为橙色</span>
          <canvas id="paramPlot" aria-label="两个网络权重构成的参数轨迹"></canvas>
        </section>
      </aside>
    </main>

    <footer class="controls" aria-label="训练控制">
      <div class="btns">
        <button class="btn" id="run" type="button" aria-pressed="false">开始训练</button>
        <button class="btn" id="step" type="button">单次更新</button>
        <button class="btn" id="reset" type="button">恢复初始参数</button>
      </div>
      <div class="state" aria-live="polite"><strong id="status">尚未更新：先比较初始边界与样本</strong><span id="explain">单次更新可看清三幅图如何同步变化。</span></div>
      <div class="arch"><span>网络结构</span><b>2 → 8 → 1</b><span>tanh · 交叉熵</span></div>
    </footer>
  </div>

  <script src="assets/base.js"></script>
  <script src="assets/lib/mlp.js"></script>
  <script>
  (function(){
    'use strict';
    Deck.init({index:21,total:24});
    var net, running=false, rngState=21621, history=[], path=[], lastFrame=0;
    var data=[];
    for(var c=0;c<4;c++){
      var sx=(c===0||c===3)?-0.66:0.66, sy=(c<2)?-0.66:0.66, t=(c===0||c===2)?0:1;
      for(var i=0;i<16;i++){
        var a=i*2.3999632297+c*.43, r=.08+.16*((i%5)/4);
        data.push({x:[sx+Math.cos(a)*r,sy+Math.sin(a)*r],t:t});
      }
    }
    var fieldCv=document.getElementById('field'), lossCv=document.getElementById('lossPlot'), paramCv=document.getElementById('paramPlot');
    var els={iter:document.getElementById('iter'),loss:document.getElementById('loss'),acc:document.getElementById('acc'),run:document.getElementById('run'),step:document.getElementById('step'),status:document.getElementById('status'),explain:document.getElementById('explain')};
    function rand(){rngState^=rngState<<13;rngState^=rngState>>>17;rngState^=rngState<<5;return (rngState>>>0)/4294967296}
    function withSeededStep(){var old=Math.random;Math.random=rand;net.step(data,16);Math.random=old}
    function reset(){running=false;rngState=21621;net=MLP.create({sizes:[2,8,1],act:'tanh',lr:.32,seed:2108});history=[];path=[];record();els.run.textContent='开始训练';els.run.setAttribute('aria-pressed','false');els.status.textContent='尚未更新：先比较初始边界与样本';els.explain.textContent='单次更新可看清三幅图如何同步变化。';update()}
    function record(){var ev=net.evaluate(data);history.push(ev.loss);path.push([net.layers[0].W[0],net.layers[0].W[1]]);return ev}
    function trainOne(){withSeededStep();var ev=record();if(net.diverged){running=false;els.status.textContent='参数已失稳';els.explain.textContent='恢复初始参数后再训练。'}return ev}
    function fit(cv){var ctx=Deck.fit(cv), w=cv.offsetWidth,h=cv.offsetHeight;return {ctx:ctx,w:w,h:h}}
    function drawField(){
      var o=fit(fieldCv),ctx=o.ctx,w=o.w,h=o.h,nx=62,ny=42,f=net.field(-1.15,-1.15,1.15,1.15,nx,ny),cw=w/nx,ch=h/ny;
      var m=Deck.rgb('--model-soft'),t=Deck.rgb('--target-soft');
      for(var j=0;j<ny;j++)for(var i=0;i<nx;i++){var p=f[j*nx+i],q=Math.max(0,Math.min(1,p));ctx.fillStyle='rgb('+Math.round(m[0]*(1-q)+t[0]*q)+','+Math.round(m[1]*(1-q)+t[1]*q)+','+Math.round(m[2]*(1-q)+t[2]*q)+')';ctx.fillRect(i*cw,h-(j+1)*ch,cw+1,ch+1)}
      ctx.strokeStyle=Deck.token('--text');ctx.lineWidth=2;ctx.beginPath();
      for(i=0;i<nx;i++){var found=-1;for(j=1;j<ny;j++){var p0=f[(j-1)*nx+i],p1=f[j*nx+i];if((p0-.5)*(p1-.5)<=0){found=j;break}}if(found>=0){var x=(i+.5)*cw,y=h-(found+.5)*ch;if(i===0||ctx._gap)ctx.moveTo(x,y);else ctx.lineTo(x,y);ctx._gap=false}else ctx._gap=true}ctx.stroke();delete ctx._gap;
      ctx.strokeStyle=Deck.rgba('--rule-strong',.5);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
      data.forEach(function(d){var x=(d.x[0]+1.15)/2.3*w,y=h-(d.x[1]+1.15)/2.3*h;ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fillStyle=d.t?Deck.token('--target'):Deck.token('--model');ctx.fill();ctx.strokeStyle=Deck.token('--paper-strong');ctx.lineWidth=2;ctx.stroke()})
    }
    function linePlot(cv,pts,color,type){
      var o=fit(cv),ctx=o.ctx,w=o.w,h=o.h,L=46,R=16,T=42,B=24;ctx.clearRect(0,0,w,h);ctx.strokeStyle=Deck.token('--rule');ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,h-B);ctx.lineTo(w-R,h-B);ctx.stroke();
      if(!pts.length)return;
      if(type==='loss'){
        var max=Math.max.apply(null,pts.concat([.7])),min=Math.min.apply(null,pts.concat([0]));ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();pts.forEach(function(v,i){var x=L+(w-L-R)*(pts.length===1?0:i/(pts.length-1)),y=T+(h-T-B)*(max-v)/(max-min||1);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
      }else{
        var xs=pts.map(function(p){return p[0]}),ys=pts.map(function(p){return p[1]}),xmin=Math.min.apply(null,xs)-.12,xmax=Math.max.apply(null,xs)+.12,ymin=Math.min.apply(null,ys)-.12,ymax=Math.max.apply(null,ys)+.12;ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();pts.forEach(function(p,i){var x=L+(w-L-R)*(p[0]-xmin)/(xmax-xmin||1),y=h-B-(h-T-B)*(p[1]-ymin)/(ymax-ymin||1);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();var p=pts[pts.length-1],x=L+(w-L-R)*(p[0]-xmin)/(xmax-xmin||1),y=h-B-(h-T-B)*(p[1]-ymin)/(ymax-ymin||1);ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fillStyle=Deck.token('--attention');ctx.fill();
      }
    }
    function update(){var ev=net.evaluate(data);els.iter.textContent=String(net.iter);els.loss.textContent=ev.loss.toFixed(3);els.acc.textContent=Math.round(ev.acc*100)+'%';drawField();linePlot(lossCv,history,Deck.token('--gradient'),'loss');linePlot(paramCv,path,Deck.token('--model'),'param')}
    els.run.addEventListener('click',function(){running=!running;els.run.textContent=running?'暂停训练':'继续训练';els.run.setAttribute('aria-pressed',String(running));els.status.textContent=running?'训练进行中：三种证据同步刷新':'训练已暂停';els.explain.textContent=running?'观察深浅交界线如何绕开异类样本。':'可单次更新，或继续训练。'});
    els.step.addEventListener('click',function(){running=false;els.run.textContent='继续训练';els.run.setAttribute('aria-pressed','false');trainOne();els.status.textContent='已完成一次参数更新';els.explain.textContent='边界、损失点与参数位置来自同一组新参数。';update()});
    document.getElementById('reset').addEventListener('click',reset);
    Deck.onResize(update);
    function frame(ts){if(running&&ts-lastFrame>75){for(var i=0;i<3;i++)trainOne();lastFrame=ts;update()}requestAnimationFrame(frame)}
    reset();requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
