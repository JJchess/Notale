<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>网络的能力来自逐层复合</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .page-head{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
    .head-copy{min-width:0;max-width:980px}
    .page-head .lead{max-width:520px;padding-bottom:3px;color:var(--muted)}
    .network-field{display:grid;grid-template-rows:minmax(0,1fr) 138px;gap:18px}
    .diagram{position:relative;min-width:0;min-height:0;border-top:2px solid var(--rule);border-bottom:2px solid var(--rule);background:var(--paper)}
    .diagram svg{width:100%;height:100%;display:block}
    .layer-label{font:650 17px var(--font-sans);fill:var(--text)}
    .layer-note{font:15px var(--font-sans);fill:var(--muted)}
    .node{fill:var(--paper);stroke:var(--text);stroke-width:2.5}
    .node.active{fill:var(--model-soft);stroke:var(--model);stroke-width:4}
    .input-node{fill:var(--bg);stroke:var(--rule-strong);stroke-width:2.5}
    .wire{fill:none;stroke:var(--rule);stroke-width:2;opacity:.72}
    .wire.active{stroke:var(--model);stroke-width:4;opacity:1}
    .divider{stroke:var(--rule);stroke-width:1.5;stroke-dasharray:5 8}
    .flow-arrow{fill:none;stroke:var(--model);stroke-width:3}
    .math{font:600 21px var(--font-num);fill:var(--model)}
    .math-muted{font:500 16px var(--font-num);fill:var(--muted)}
    .callout-line{stroke:var(--attention);stroke-width:2;fill:none}
    .callout-dot{fill:var(--attention)}
    .callout-title{font:650 17px var(--font-sans);fill:#713A00}
    .callout-copy{font:15px var(--font-sans);fill:var(--muted)}
    .evidence{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(360px,.6fr);gap:34px;align-items:center}
    .compose{min-width:0}
    .compose-label{margin-bottom:8px;color:var(--muted);font-size:var(--fs-label);font-weight:650;letter-spacing:.04em}
    .equation{display:flex;align-items:center;gap:14px;white-space:nowrap;color:var(--model);font:600 34px/1.2 var(--font-num)}
    .equation .op{color:var(--rule-strong);font-family:var(--font-sans);font-weight:500}
    .takeaway{min-width:0;padding-left:28px;border-left:1px solid var(--rule)}
    .takeaway strong{display:block;margin-bottom:5px;font:650 var(--fs-lead)/1.3 var(--font-display);color:var(--text)}
    .takeaway p{color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  </style>
</head>
<body data-page="07" data-total="24">
  <div id="stage">
    <header class="page-head">
      <div class="head-copy min0">
        <p class="kicker">从神经元到网络</p>
        <h1>网络的能力来自简单变换的逐层复合</h1>
      </div>
      <p class="lead min0">把多个神经元归入层，再把一层的输出交给下一层。</p>
    </header>

    <main class="focus network-field min0" aria-label="神经网络逐层复合示意图">
      <section class="diagram min0">
        <svg viewBox="0 0 1488 560" role="img" aria-labelledby="net-title net-desc" preserveAspectRatio="xMidYMid meet">
          <title id="net-title">多个神经元组成层，并由前一层连接到后一层</title>
          <desc id="net-desc">输入依次经过第一变换层、第二变换层和输出层。蓝色路径显示一个信号连续经过多个简单变换，最终形成复合函数。</desc>
          <defs>
            <marker id="arrow-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#2457A6"/>
            </marker>
          </defs>

          <line class="divider" x1="205" y1="82" x2="205" y2="502"/>
          <line class="divider" x1="580" y1="82" x2="580" y2="502"/>
          <line class="divider" x1="990" y1="82" x2="990" y2="502"/>
          <line class="divider" x1="1300" y1="82" x2="1300" y2="502"/>

          <text class="layer-label" x="85" y="46" text-anchor="middle">输入</text>
          <text class="layer-note" x="85" y="69" text-anchor="middle">一组特征</text>
          <text class="layer-label" x="390" y="46" text-anchor="middle">第一变换层</text>
          <text class="layer-note" x="390" y="69" text-anchor="middle">并行的简单变换</text>
          <text class="layer-label" x="785" y="46" text-anchor="middle">第二变换层</text>
          <text class="layer-note" x="785" y="69" text-anchor="middle">组合上一层结果</text>
          <text class="layer-label" x="1145" y="46" text-anchor="middle">输出层</text>
          <text class="layer-note" x="1145" y="69" text-anchor="middle">再做一次变换</text>
          <text class="layer-label" x="1394" y="46" text-anchor="middle">网络输出</text>
          <text class="layer-note" x="1394" y="69" text-anchor="middle">复合后的结果</text>

          <!-- complete connectivity: input to first layer -->
          <g aria-hidden="true">
            <path class="wire" d="M111 190 L347 143"/><path class="wire" d="M111 190 L347 240"/><path class="wire" d="M111 190 L347 337"/><path class="wire" d="M111 190 L347 434"/>
            <path class="wire" d="M111 385 L347 143"/><path class="wire active" d="M111 385 L347 240"/><path class="wire" d="M111 385 L347 337"/><path class="wire" d="M111 385 L347 434"/>
            <!-- first to second -->
            <path class="wire" d="M433 143 L742 170"/><path class="wire" d="M433 143 L742 288"/><path class="wire" d="M433 143 L742 406"/>
            <path class="wire active" d="M433 240 L742 170"/><path class="wire" d="M433 240 L742 288"/><path class="wire" d="M433 240 L742 406"/>
            <path class="wire" d="M433 337 L742 170"/><path class="wire" d="M433 337 L742 288"/><path class="wire" d="M433 337 L742 406"/>
            <path class="wire" d="M433 434 L742 170"/><path class="wire" d="M433 434 L742 288"/><path class="wire" d="M433 434 L742 406"/>
            <!-- second to output -->
            <path class="wire active" d="M828 170 L1102 288"/><path class="wire" d="M828 288 L1102 288"/><path class="wire" d="M828 406 L1102 288"/>
            <path class="flow-arrow" d="M1188 288 L1360 288" marker-end="url(#arrow-model)"/>
          </g>

          <!-- input nodes -->
          <circle class="input-node" cx="85" cy="190" r="26"/>
          <circle class="input-node" cx="85" cy="385" r="26"/>
          <text class="math-muted" x="85" y="197" text-anchor="middle">x</text>
          <text class="math-muted" x="85" y="392" text-anchor="middle">x</text>

          <!-- layer nodes -->
          <circle class="node" cx="390" cy="143" r="43"/>
          <circle class="node active" cx="390" cy="240" r="43"/>
          <circle class="node" cx="390" cy="337" r="43"/>
          <circle class="node" cx="390" cy="434" r="43"/>
          <text class="math" x="390" y="247" text-anchor="middle">f₁</text>

          <circle class="node active" cx="785" cy="170" r="43"/>
          <circle class="node" cx="785" cy="288" r="43"/>
          <circle class="node" cx="785" cy="406" r="43"/>
          <text class="math" x="785" y="177" text-anchor="middle">f₂</text>

          <circle class="node active" cx="1145" cy="288" r="43"/>
          <text class="math" x="1145" y="295" text-anchor="middle">f₃</text>
          <circle class="node active" cx="1394" cy="288" r="35"/>
          <text class="math" x="1394" y="295" text-anchor="middle">ŷ</text>

          <!-- local neuron explanation -->
          <path class="callout-line" d="M350 472 L305 505 L305 524"/>
          <circle class="callout-dot" cx="350" cy="472" r="5"/>
          <text class="callout-title" x="326" y="520">每个神经元：加权求和，再激活</text>

          <path class="callout-line" d="M785 121 L785 101 L917 101"/>
          <circle class="callout-dot" cx="785" cy="121" r="5"/>
          <text class="callout-copy" x="927" y="107">蓝线追踪同一条前向路径</text>
        </svg>
      </section>

      <section class="evidence min0" aria-label="逐层复合的函数表达">
        <div class="compose min0">
          <div class="compose-label">首尾相接后，一层的输出成为下一层的输入</div>
          <div class="equation" aria-label="y帽等于f3作用于f2作用于f1作用于x">
            <span>x</span><span class="op">经过</span><span>f₁</span><span class="op">再经过</span><span>f₂</span><span class="op">再经过</span><span>f₃</span><span class="op">得到</span><span>ŷ</span>
          </div>
        </div>
        <div class="takeaway min0">
          <strong>单个神经元很简单，串联后的函数不再简单。</strong>
          <p>层数增加，就是把更多变换依次套在前面的结果上。</p>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:7,total:24});</script>
</body>
</html>
