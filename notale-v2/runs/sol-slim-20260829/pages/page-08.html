<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>前向传播：逐层接力</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .head{flex:0 0 104px;display:flex;flex-direction:column;justify-content:flex-start}
    .head h1{max-width:1100px}
    .head .lead{margin-top:10px;max-width:none;color:var(--muted)}
    .route{flex:1;min-height:0;margin-top:18px;display:grid;grid-template-rows:minmax(0,1fr) 126px;gap:18px}
    .field{position:relative;min-width:0;min-height:0;border-top:2px solid var(--rule);border-bottom:2px solid var(--rule);background:var(--paper)}
    .field-label{position:absolute;left:24px;top:18px;color:var(--muted);font-size:var(--fs-label);font-weight:650;letter-spacing:.06em}
    .flow{position:absolute;inset:54px 22px 24px;display:grid;grid-template-columns:170px 1fr 246px 1fr 246px 1fr 170px;align-items:center}
    .layer{height:100%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative}
    .layer-name{font-family:var(--font-display);font-size:var(--fs-h2);font-weight:650;line-height:1.15;text-align:center}
    .symbol{min-width:104px;height:104px;box-sizing:border-box;border:3px solid var(--text);border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--paper);font:600 34px/1 var(--font-num)}
    .hidden .symbol,.output .symbol{border-color:var(--model);color:var(--model);background:var(--model-soft)}
    .layer-note{color:var(--muted);font-size:var(--fs-label);line-height:1.35;text-align:center}
    .op{height:76%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
    .op::before{content:"";position:absolute;left:8px;right:8px;top:50%;border-top:4px solid var(--model)}
    .op::after{content:"";position:absolute;right:4px;top:calc(50% - 8px);width:13px;height:13px;border-top:4px solid var(--model);border-right:4px solid var(--model);transform:rotate(45deg)}
    .formula{position:relative;z-index:1;margin-top:-90px;padding:8px 12px;background:var(--paper);color:var(--model);font:600 22px/1.25 var(--font-num);white-space:nowrap}
    .handoff{position:relative;z-index:1;margin-top:74px;padding:5px 9px;background:var(--paper);color:var(--muted);font-size:var(--fs-label);font-weight:650;white-space:nowrap}
    .boundary{position:absolute;top:56px;bottom:42px;width:1px;background:var(--rule);opacity:.7}
    .b1{left:27%}.b2{left:58.5%}.b3{left:86.5%;display:none}
    .ruleband{display:grid;grid-template-columns:300px minmax(0,1fr) 360px;align-items:center;gap:28px;padding:0 28px;border:2px solid var(--rule);background:transparent}
    .ruleband h2{font-size:var(--fs-h2)}
    .generic{color:var(--model);font:600 30px/1.2 var(--font-num);text-align:center;white-space:nowrap}
    .constraint{padding-left:28px;border-left:1px solid var(--rule);font-size:var(--fs-sec);line-height:1.45;color:var(--muted)}
    .constraint strong{color:var(--text);font-weight:650}
    .local-mark{display:inline-block;width:10px;height:10px;margin-right:9px;background:var(--attention);vertical-align:1px}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
  </style>
</head>
<body data-page="08" data-total="24">
  <div id="stage">
    <header class="head">
      <div class="kicker">前向传播 · 计算顺序</div>
      <h1>每一层只接过上一层的结果</h1>
      <p class="lead">输入沿网络单向传递；当前层算完激活值，再交给下一层。</p>
    </header>

    <main class="route min0" aria-label="前向传播逐层计算图">
      <section class="field min0">
        <div class="field-label">同一条前向路径</div>
        <div class="flow">
          <div class="layer min0">
            <div class="layer-name">输入</div>
            <div class="symbol">x</div>
            <div class="layer-note">原始特征</div>
          </div>

          <div class="op min0" aria-label="第一层计算">
            <div class="formula">h¹ = f(W¹x + b¹)</div>
            <div class="handoff">交出 h¹</div>
          </div>

          <div class="layer hidden min0">
            <div class="layer-name">隐层甲</div>
            <div class="symbol">h¹</div>
            <div class="layer-note">只读取 x</div>
          </div>

          <div class="op min0" aria-label="第二层计算">
            <div class="formula">h² = f(W²h¹ + b²)</div>
            <div class="handoff">交出 h²</div>
          </div>

          <div class="layer hidden min0">
            <div class="layer-name">隐层乙</div>
            <div class="symbol">h²</div>
            <div class="layer-note">只读取 h¹</div>
          </div>

          <div class="op min0" aria-label="输出层计算">
            <div class="formula">ŷ = g(W³h² + b³)</div>
            <div class="handoff">交出 ŷ</div>
          </div>

          <div class="layer output min0">
            <div class="layer-name">输出</div>
            <div class="symbol">ŷ</div>
            <div class="layer-note">模型预测</div>
          </div>
        </div>
      </section>

      <section class="ruleband min0" aria-label="每层共同的局部计算规则">
        <h2><span class="local-mark" aria-hidden="true"></span>每层的本地工作</h2>
        <div class="generic">a⁽ˡ⁾ = f(W⁽ˡ⁾a⁽ˡ⁻¹⁾ + b⁽ˡ⁾)</div>
        <p class="constraint"><strong>可用：</strong>上一层的 a⁽ˡ⁻¹⁾ 与本层参数 W⁽ˡ⁾、b⁽ˡ⁾。<br><strong>不可用：</strong>后续层尚未算出的结果。</p>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:8,total:24});</script>
</body>
</html>
