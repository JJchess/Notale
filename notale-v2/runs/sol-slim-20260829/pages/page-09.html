<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>先定义差多少，模型才知道错了多少</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .head{flex:0 0 auto}
    .head h1{max-width:1180px}
    .lead{margin-top:12px;max-width:980px}
    .lesson{flex:1;min-height:0;margin-top:22px;display:grid;grid-template-rows:minmax(0,1fr) 196px;gap:20px}
    .measure{position:relative;min-height:0;border:2px solid var(--rule);border-radius:var(--radius);background:var(--paper);overflow:hidden}
    .measure svg{display:block;width:100%;height:100%}
    .measure text{font-family:var(--font-sans);fill:var(--text)}
    .measure .mono{font-family:var(--font-num);font-variant-numeric:tabular-nums}
    .measure .muted{fill:var(--muted)}
    .measure .model{fill:var(--model)}
    .measure .loss{fill:var(--loss)}
    .measure .axis{stroke:var(--rule-strong);stroke-width:3}
    .measure .tick{stroke:var(--rule);stroke-width:2}
    .measure .guide{stroke:var(--rule);stroke-width:2;stroke-dasharray:7 7}
    .measure .prediction{stroke:var(--model);stroke-width:5}
    .measure .target{stroke:var(--text);stroke-width:5}
    .measure .gapline{stroke:var(--loss);stroke-width:5}
    .measure .cap{stroke:var(--loss);stroke-width:3}
    .evidence{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:20px;min-height:0}
    .formula{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:14px;padding:18px 26px;border:2px solid var(--loss);border-radius:var(--radius);background:var(--loss-soft)}
    .formula-label{color:var(--loss);font-size:var(--fs-label);font-weight:650;letter-spacing:.04em;white-space:nowrap}
    .equation{font-family:var(--font-num);font-size:40px;font-weight:600;line-height:1;white-space:nowrap}
    .equation .lossv{color:var(--loss)}
    .reading{display:flex;flex-direction:column;justify-content:center;padding:18px 24px;border-top:2px solid var(--rule);border-bottom:2px solid var(--rule)}
    .reading strong{font-family:var(--font-display);font-size:var(--fs-h2);line-height:1.2}
    .reading p{margin-top:8px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  </style>
</head>
<body data-page="09" data-total="24">
  <div id="stage">
    <header class="head">
      <p class="kicker">监督学习 · 损失函数</p>
      <h1>先定义“差多少”，模型才知道错了多少</h1>
      <p class="lead">同一个已标注样本：目标是 <span class="num">1.00</span>，模型预测为 <span class="num" style="color:var(--model)">0.70</span>。</p>
    </header>

    <main class="lesson min0" aria-label="预测、目标与损失的计算关系">
      <section class="measure min0" aria-labelledby="scale-title">
        <svg viewBox="0 0 1484 488" role="img" aria-labelledby="scale-title scale-desc" preserveAspectRatio="none">
          <title id="scale-title">预测值与目标值在同一概率刻度上的距离</title>
          <desc id="scale-desc">概率刻度从零到一。模型预测位于零点七，已知目标位于一点零，两者相差零点三。平方误差把这个差距变成损失零点零九。</desc>

          <text x="56" y="58" font-size="18" font-weight="650">把两者放到同一把尺上</text>
          <text x="1428" y="58" text-anchor="end" font-size="16" class="muted">示例：二分类样本，标签 y = 1</text>

          <line x1="128" y1="304" x2="1356" y2="304" class="axis"/>
          <line x1="128" y1="292" x2="128" y2="320" class="tick"/>
          <line x1="374" y1="292" x2="374" y2="320" class="tick"/>
          <line x1="619" y1="292" x2="619" y2="320" class="tick"/>
          <line x1="865" y1="292" x2="865" y2="320" class="tick"/>
          <line x1="1110" y1="292" x2="1110" y2="320" class="tick"/>
          <line x1="1356" y1="292" x2="1356" y2="320" class="tick"/>
          <text x="128" y="354" text-anchor="middle" font-size="15" class="mono muted">0.0</text>
          <text x="374" y="354" text-anchor="middle" font-size="15" class="mono muted">0.2</text>
          <text x="619" y="354" text-anchor="middle" font-size="15" class="mono muted">0.4</text>
          <text x="865" y="354" text-anchor="middle" font-size="15" class="mono muted">0.6</text>
          <text x="1110" y="354" text-anchor="middle" font-size="15" class="mono muted">0.8</text>
          <text x="1356" y="354" text-anchor="middle" font-size="15" class="mono muted">1.0</text>
          <text x="742" y="405" text-anchor="middle" font-size="16" class="muted">模型给出“属于正类”的概率</text>

          <line x1="988" y1="170" x2="988" y2="304" class="prediction"/>
          <circle cx="988" cy="304" r="10" fill="var(--model)"/>
          <text x="988" y="128" text-anchor="middle" font-size="18" font-weight="650" class="model">模型预测 ŷ</text>
          <text x="988" y="161" text-anchor="middle" font-size="34" font-weight="650" class="mono model">0.70</text>

          <line x1="1356" y1="170" x2="1356" y2="304" class="target"/>
          <circle cx="1356" cy="304" r="10" fill="var(--text)"/>
          <text x="1356" y="128" text-anchor="middle" font-size="18" font-weight="650">已知目标 y</text>
          <text x="1356" y="161" text-anchor="middle" font-size="34" font-weight="650" class="mono">1.00</text>

          <line x1="988" y1="222" x2="1356" y2="222" class="gapline"/>
          <line x1="988" y1="208" x2="988" y2="236" class="cap"/>
          <line x1="1356" y1="208" x2="1356" y2="236" class="cap"/>
          <rect x="1097" y="190" width="150" height="64" rx="6" fill="var(--paper)"/>
          <text x="1172" y="216" text-anchor="middle" font-size="16" font-weight="650" class="loss">预测误差</text>
          <text x="1172" y="244" text-anchor="middle" font-size="26" font-weight="650" class="mono loss">−0.30</text>
        </svg>
      </section>

      <section class="evidence min0" aria-label="损失计算与解释">
        <div class="formula min0">
          <div class="formula-label">平方误差损失</div>
          <div class="equation" aria-label="损失等于预测值减目标值的平方，等于零点零九">L = (ŷ − y)² = (0.70 − 1.00)² = <span class="lossv">0.09</span></div>
        </div>
        <div class="reading min0">
          <strong>损失把“差距”压成一个可计算的数</strong>
          <p>训练接下来会调整参数，让同一计算规则得到的 <span style="color:var(--loss);font-weight:650">L 更小</span>。</p>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:9,total:24});</script>
</body>
</html>
