<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>偏得越远，平方损失增长越快</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage > header { flex: 0 0 auto; }
    #stage > header .lead { margin-top: 10px; }
    #loss-lab { display:grid; grid-template-columns:minmax(0,1.68fr) minmax(360px,.72fr); gap:30px; flex:1; min-height:0; margin-top:20px; }
    #loss-lab .plot-panel { display:flex; flex-direction:column; min-width:0; min-height:0; padding:18px 20px 16px; }
    #loss-lab .plot-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:8px; }
    #loss-lab .plot-head h2 { font-size:var(--fs-h2); }
    #loss-lab .plot-note { max-width:430px; text-align:right; color:var(--muted); font-size:var(--fs-label); line-height:1.4; }
    #loss-lab .graph { flex:1; min-height:0; position:relative; }
    #loss-lab svg { display:block; width:100%; height:100%; overflow:visible; touch-action:none; }
    #loss-lab .axis { stroke:var(--rule-strong); stroke-width:2; vector-effect:non-scaling-stroke; }
    #loss-lab .gridline { stroke:var(--rule); stroke-width:1; vector-effect:non-scaling-stroke; }
    #loss-lab .curve { fill:none; stroke:var(--loss); stroke-width:5; vector-effect:non-scaling-stroke; }
    #loss-lab .loss-fill { fill:var(--loss-soft); }
    #loss-lab .target-line { stroke:var(--text); stroke-width:2; stroke-dasharray:8 8; vector-effect:non-scaling-stroke; }
    #loss-lab .guide { stroke:var(--attention); stroke-width:2; stroke-dasharray:6 6; vector-effect:non-scaling-stroke; }
    #loss-lab .loss-bar { stroke:var(--loss); stroke-width:9; vector-effect:non-scaling-stroke; }
    #loss-lab .point { fill:var(--paper); stroke:var(--attention); stroke-width:5; vector-effect:non-scaling-stroke; cursor:ew-resize; }
    #loss-lab .point:focus { outline:none; filter:drop-shadow(0 0 0.5px var(--attention)); }
    #loss-lab .hit { fill:transparent; cursor:ew-resize; }
    #loss-lab .tick { fill:var(--muted); font:13px var(--font-num); }
    #loss-lab .axis-label { fill:var(--text); font:600 15px var(--font-sans); }
    #loss-lab .curve-label { fill:var(--loss); font:650 17px var(--font-sans); }
    #loss-lab .target-label { fill:var(--text); font:650 15px var(--font-sans); }
    #loss-lab .point-label { fill:var(--attention); font:650 15px var(--font-sans); }
    #loss-lab .rail { display:flex; flex-direction:column; min-width:0; min-height:0; gap:18px; }
    #loss-lab .readout { display:grid; grid-template-columns:1fr 1fr; gap:0; padding:0; overflow:hidden; }
    #loss-lab .metric { padding:14px 20px; min-width:0; }
    #loss-lab .metric:nth-child(odd) { border-right:1px solid var(--rule); }
    #loss-lab .metric:nth-child(-n+2) { border-bottom:1px solid var(--rule); }
    #loss-lab .metric .name { color:var(--muted); font-size:var(--fs-label); margin-bottom:8px; }
    #loss-lab .metric .value { font:600 34px/1 var(--font-num); font-variant-numeric:tabular-nums; }
    #loss-lab .metric.pred .value { color:var(--model); }
    #loss-lab .metric.loss .value { color:var(--loss); }
    #loss-lab .control-panel { display:flex; flex-direction:column; gap:16px; }
    #loss-lab .control-panel label { font-size:var(--fs-sec); font-weight:650; }
    #loss-lab .range-row { display:grid; grid-template-columns:minmax(0,1fr) 64px; align-items:center; gap:12px; }
    #loss-lab .range-value { color:var(--attention); font:650 var(--fs-body)/1 var(--font-num); text-align:right; }
    #loss-lab .ticks-row { display:flex; justify-content:space-between; margin-top:-10px; padding-right:76px; color:var(--muted); font:var(--fs-tick)/1 var(--font-num); }
    #loss-lab .presets { display:flex; flex-wrap:wrap; gap:8px; }
    #loss-lab .presets .btn { flex:1 1 96px; }
    #loss-lab .reset { align-self:flex-start; }
    #loss-lab .formula { padding:18px 20px; }
    #loss-lab .formula h2 { margin-bottom:12px; }
    #loss-lab .equation { font:600 27px/1.4 var(--font-num); font-variant-numeric:tabular-nums; white-space:nowrap; }
    #loss-lab .equation .pred-term { color:var(--model); }
    #loss-lab .equation .loss-term { color:var(--loss); }
    #loss-lab .relation { min-height:50px; margin-top:10px; padding-top:10px; border-top:1px solid var(--rule); color:var(--text); font-size:var(--fs-sec); line-height:1.45; }
    #loss-lab .relation strong { color:var(--loss); }
    #loss-lab .legend { margin-top:8px; }
    #loss-lab .legend .model-key { color:var(--model); }
    #loss-lab .legend .loss-key { color:var(--loss); }
    #loss-lab .legend .attention-key { color:var(--attention); }
  </style>
</head>
<body data-page="10" data-total="24">
  <div id="stage">
    <header>
      <p class="kicker">损失函数</p>
      <h1>偏得越远，平方损失增长越快</h1>
      <p class="lead">目标固定为 <span class="num">0.70</span>。移动预测值，观察误差如何变成惩罚。</p>
    </header>

    <main id="loss-lab" aria-label="平方损失互动实验">
      <section class="panel plot-panel min0" aria-labelledby="curve-heading">
        <div class="plot-head">
          <h2 id="curve-heading">预测值在损失曲线上的位置</h2>
          <p class="plot-note">拖动橙色圆点；横向距离是误差，红色高度是损失。</p>
        </div>
        <div class="graph min0">
          <svg id="loss-plot" viewBox="0 0 960 520" role="img" aria-labelledby="plot-title plot-desc">
            <title id="plot-title">预测值与平方损失曲线</title>
            <desc id="plot-desc">目标值固定为0.70。预测值可在0到1之间移动，损失等于预测值与目标值之差的平方。</desc>
            <g aria-hidden="true">
              <line class="gridline" x1="88" y1="403" x2="912" y2="403"/>
              <line class="gridline" x1="88" y1="298" x2="912" y2="298"/>
              <line class="gridline" x1="88" y1="193" x2="912" y2="193"/>
              <line class="gridline" x1="88" y1="88" x2="912" y2="88"/>
              <line class="axis" x1="88" y1="456" x2="920" y2="456"/>
              <line class="axis" x1="88" y1="456" x2="88" y2="42"/>
              <text class="tick" x="88" y="481" text-anchor="middle">0.0</text>
              <text class="tick" x="294" y="481" text-anchor="middle">0.25</text>
              <text class="tick" x="500" y="481" text-anchor="middle">0.50</text>
              <text class="tick" x="706" y="481" text-anchor="middle">0.75</text>
              <text class="tick" x="912" y="481" text-anchor="middle">1.0</text>
              <text class="tick" x="72" y="460" text-anchor="end">0</text>
              <text class="tick" x="72" y="407" text-anchor="end">0.125</text>
              <text class="tick" x="72" y="302" text-anchor="end">0.25</text>
              <text class="tick" x="72" y="197" text-anchor="end">0.375</text>
              <text class="tick" x="72" y="92" text-anchor="end">0.50</text>
              <text class="axis-label" x="500" y="511" text-anchor="middle">预测值 ŷ</text>
              <text class="axis-label" x="24" y="250" text-anchor="middle" transform="rotate(-90 24 250)">平方损失 L</text>
              <path id="area-path" class="loss-fill"/>
              <path id="curve-path" class="curve"/>
              <line id="target-line" class="target-line" y1="456" y2="42"/>
              <text id="target-label" class="target-label" y="68" text-anchor="middle">目标 y = 0.70</text>
              <text class="curve-label" x="144" y="92">L = (ŷ − y)²</text>
              <line id="x-guide" class="guide" y1="456"/>
              <line id="loss-bar" class="loss-bar"/>
              <line id="error-bracket" class="guide" y1="438" y2="438"/>
              <text id="error-label" class="point-label" y="424" text-anchor="middle"></text>
            </g>
            <circle id="point-hit" class="hit" r="28" tabindex="-1" aria-hidden="true"/>
            <circle id="point" class="point" r="11" tabindex="0" role="slider" aria-label="预测值" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.25" aria-valuetext="预测值0.25，损失0.2025"/>
            <text id="point-label" class="point-label" text-anchor="middle" aria-hidden="true"></text>
          </svg>
        </div>
        <div class="legend" aria-label="图例">
          <span class="li model-key"><i class="sw"></i>预测值</span>
          <span class="li attention-key"><i class="sw line"></i>当前误差</span>
          <span class="li loss-key"><i class="sw line"></i>平方损失</span>
        </div>
      </section>

      <aside class="rail min0">
        <section class="panel readout" aria-label="当前读数">
          <div class="metric"><div class="name">固定目标 y</div><div class="value">0.70</div></div>
          <div class="metric pred"><div class="name">预测值 ŷ</div><div class="value" id="pred-read">0.25</div></div>
          <div class="metric"><div class="name">误差 |ŷ − y|</div><div class="value" id="error-read">0.45</div></div>
          <div class="metric loss"><div class="name">损失 L</div><div class="value" id="loss-read">0.2025</div></div>
        </section>

        <section class="panel control-panel" aria-label="预测值控制">
          <label for="prediction">移动预测，范围 0 到 1</label>
          <div class="range-row">
            <input id="prediction" type="range" min="0" max="1" step="0.01" value="0.25">
            <output id="range-read" class="range-value" for="prediction">0.25</output>
          </div>
          <div class="ticks-row" aria-hidden="true"><span>0</span><span>0.5</span><span>1</span></div>
          <div class="presets" aria-label="典型位置">
            <button class="btn" type="button" data-value="0.70">正好命中</button>
            <button class="btn" type="button" data-value="0.55">误差 0.15</button>
            <button class="btn" type="button" data-value="0.10">误差 0.60</button>
          </div>
          <button id="reset" class="btn reset" type="button">恢复初始预测</button>
          <p class="hint">也可聚焦曲线圆点，用左右方向键微调。</p>
        </section>

        <section class="panel formula" aria-labelledby="calc-heading">
          <h2 id="calc-heading">当前计算</h2>
          <div class="equation"><span class="loss-term">L</span> = (<span id="eq-pred" class="pred-term">0.25</span> − 0.70)² = <span id="eq-loss" class="loss-term">0.2025</span></div>
          <p id="relation" class="relation" aria-live="polite">误差为 <span class="num">0.45</span>，平方后得到损失 <strong class="num">0.2025</strong>。</p>
        </section>
      </aside>
    </main>
  </div>

  <script src="assets/base.js"></script>
  <script>
  (() => {
    const root = document.getElementById('loss-lab');
    const svg = root.querySelector('#loss-plot');
    const input = root.querySelector('#prediction');
    const point = root.querySelector('#point');
    const hit = root.querySelector('#point-hit');
    const target = 0.70;
    const initial = 0.25;
    const plot = { left:88, right:912, top:42, bottom:456, maxLoss:0.50 };
    let state = { prediction: initial };
    let activePointer = null;
    const els = {
      curve: root.querySelector('#curve-path'), area: root.querySelector('#area-path'),
      targetLine: root.querySelector('#target-line'), targetLabel: root.querySelector('#target-label'),
      xGuide: root.querySelector('#x-guide'), lossBar: root.querySelector('#loss-bar'),
      bracket: root.querySelector('#error-bracket'), errorLabel: root.querySelector('#error-label'),
      pointLabel: root.querySelector('#point-label'), pred: root.querySelector('#pred-read'),
      error: root.querySelector('#error-read'), loss: root.querySelector('#loss-read'),
      range: root.querySelector('#range-read'), eqPred: root.querySelector('#eq-pred'),
      eqLoss: root.querySelector('#eq-loss'), relation: root.querySelector('#relation'),
      reset: root.querySelector('#reset')
    };
    const x = v => plot.left + v * (plot.right - plot.left);
    const y = loss => plot.bottom - (loss / plot.maxLoss) * (plot.bottom - plot.top);
    const lossAt = v => (v - target) * (v - target);

    function buildCurve() {
      let d = '';
      for (let i = 0; i <= 100; i++) {
        const v = i / 100;
        d += (i ? 'L' : 'M') + x(v).toFixed(1) + ',' + y(lossAt(v)).toFixed(1);
      }
      els.curve.setAttribute('d', d);
      els.area.setAttribute('d', d + `L${x(1)},${plot.bottom}L${x(0)},${plot.bottom}Z`);
      const tx = x(target);
      els.targetLine.setAttribute('x1', tx); els.targetLine.setAttribute('x2', tx);
      els.targetLabel.setAttribute('x', tx);
    }

    function interpretation(error, loss) {
      if (error < 0.005) return '预测命中目标：误差为 0，平方损失也为 0。';
      if (error <= 0.16) return `误差只有 ${error.toFixed(2)}，平方后损失缩小到 ${loss.toFixed(4)}。`;
      if (error >= 0.55) return `误差达到 ${error.toFixed(2)}，平方损失升到 ${loss.toFixed(4)}，大偏差受到更强惩罚。`;
      return `误差为 ${error.toFixed(2)}，平方后得到损失 ${loss.toFixed(4)}。`;
    }

    function render(announce) {
      const p = state.prediction;
      const loss = lossAt(p);
      const error = Math.abs(p - target);
      const px = x(p), py = y(loss), tx = x(target);
      input.value = p.toFixed(2);
      point.setAttribute('cx', px); point.setAttribute('cy', py);
      hit.setAttribute('cx', px); hit.setAttribute('cy', py);
      point.setAttribute('aria-valuenow', p.toFixed(2));
      point.setAttribute('aria-valuetext', `预测值${p.toFixed(2)}，误差${error.toFixed(2)}，损失${loss.toFixed(4)}`);
      els.xGuide.setAttribute('x1', px); els.xGuide.setAttribute('x2', px);
      els.xGuide.setAttribute('y2', py);
      els.lossBar.setAttribute('x1', px); els.lossBar.setAttribute('x2', px);
      els.lossBar.setAttribute('y1', plot.bottom); els.lossBar.setAttribute('y2', py);
      els.bracket.setAttribute('x1', Math.min(px, tx)); els.bracket.setAttribute('x2', Math.max(px, tx));
      els.errorLabel.setAttribute('x', (px + tx) / 2);
      els.errorLabel.textContent = `误差 ${error.toFixed(2)}`;
      els.pointLabel.setAttribute('x', px);
      els.pointLabel.setAttribute('y', Math.max(plot.top + 24, py - 20));
      els.pointLabel.textContent = `ŷ ${p.toFixed(2)}`;
      els.pred.textContent = p.toFixed(2);
      els.error.textContent = error.toFixed(2);
      els.loss.textContent = loss.toFixed(4);
      els.range.textContent = p.toFixed(2);
      els.eqPred.textContent = p.toFixed(2);
      els.eqLoss.textContent = loss.toFixed(4);
      els.relation.innerHTML = interpretation(error, loss).replace(/(0\.\d{2,4})/g, '<strong class="num">$1</strong>');
      root.querySelectorAll('[data-value]').forEach(btn => btn.setAttribute('aria-pressed', Math.abs(+btn.dataset.value - p) < .001 ? 'true' : 'false'));
      if (announce) els.relation.setAttribute('data-committed', p.toFixed(2));
    }

    function setPrediction(value, announce=false) {
      state = { prediction: Math.max(0, Math.min(1, Math.round(value * 100) / 100)) };
      render(announce);
    }

    function fromPointer(e) {
      const p = Deck.pt(svg, e);
      const width = svg.offsetWidth || 1;
      const vx = p.x / width * 960;
      return (vx - plot.left) / (plot.right - plot.left);
    }

    function down(e) {
      if (e.button !== undefined && e.button !== 0) return;
      activePointer = e.pointerId;
      svg.setPointerCapture?.(e.pointerId);
      setPrediction(fromPointer(e));
      e.preventDefault();
    }
    function move(e) {
      if (e.pointerId !== activePointer) return;
      setPrediction(fromPointer(e));
    }
    function up(e) {
      if (e.pointerId !== activePointer) return;
      setPrediction(fromPointer(e), true);
      try { svg.releasePointerCapture?.(e.pointerId); } catch (_) {}
      activePointer = null;
    }
    [point, hit].forEach(el => el.addEventListener('pointerdown', down));
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerup', up);
    svg.addEventListener('pointercancel', e => { if (e.pointerId === activePointer) activePointer = null; });
    input.addEventListener('input', () => setPrediction(+input.value));
    input.addEventListener('change', () => render(true));
    point.addEventListener('keydown', e => {
      if (!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
      e.stopPropagation(); e.preventDefault();
      const next = e.key === 'Home' ? 0 : e.key === 'End' ? 1 : state.prediction + (e.key === 'ArrowRight' ? .01 : -.01);
      setPrediction(next, true);
    });
    root.querySelectorAll('[data-value]').forEach(btn => btn.addEventListener('click', () => setPrediction(+btn.dataset.value, true)));
    els.reset.addEventListener('click', () => setPrediction(initial, true));
    buildCurve();
    render(false);
    Deck.init({ index:10, total:24 });
  })();
  </script>
</body>
</html>
