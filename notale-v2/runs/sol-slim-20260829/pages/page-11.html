<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>训练是在参数空间里寻找低损失位置</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page-head{flex:0 0 auto;max-width:1120px}
  .page-head h1{max-width:1100px}
  .page-head .lead{margin-top:10px;color:var(--muted)}
  .space-layout{flex:1;min-height:0;margin-top:20px;display:grid;grid-template-columns:minmax(0,1.72fr) minmax(360px,.68fr);gap:30px}
  .map-panel{position:relative;min-width:0;min-height:0;border:2px solid var(--rule);border-radius:var(--radius);background:var(--paper);overflow:hidden}
  .map-title{position:absolute;left:24px;top:18px;z-index:2;font-size:var(--fs-label);font-weight:650;color:var(--muted);letter-spacing:.04em}
  .map-panel svg{display:block;width:100%;height:100%}
  .rail{min-width:0;min-height:0;display:flex;flex-direction:column;padding:4px 0 2px}
  .rail h2{margin-bottom:18px}
  .meaning{display:grid;gap:0;border-top:1px solid var(--rule)}
  .meaning-row{display:grid;grid-template-columns:74px minmax(0,1fr);gap:14px;padding:17px 0;border-bottom:1px solid var(--rule)}
  .meaning-row dt{margin:0;font:650 var(--fs-label)/1.4 var(--font-sans);color:var(--muted)}
  .meaning-row dd{margin:0;font-size:var(--fs-body);line-height:1.45}
  .formula{margin-top:22px;padding:18px 0;border-top:2px solid var(--text);border-bottom:1px solid var(--rule)}
  .formula .eq{font-family:var(--font-num);font-size:25px;line-height:1.4;white-space:nowrap;color:var(--model)}
  .formula p:last-child{margin-top:8px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  .takeaway{margin-top:auto;padding-top:20px;font-size:var(--fs-lead);line-height:1.45;font-weight:600}
  .takeaway strong{color:var(--loss);font-weight:700}
  .axis{stroke:var(--rule-strong);stroke-width:2;fill:none}
  .axis-label{fill:var(--muted);font:15px var(--font-sans)}
  .contour{fill:none;stroke:var(--loss);stroke-width:2}
  .contour.high{opacity:.26}.contour.mid{opacity:.44}.contour.low{opacity:.7}
  .contour-fill{fill:var(--loss-soft);opacity:.62}
  .path-shadow{fill:none;stroke:var(--paper);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  .descent{fill:none;stroke:var(--model);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .step-dot{fill:var(--paper);stroke:var(--model);stroke-width:4}
  .start-dot{fill:var(--model)}
  .best-dot{fill:var(--loss);stroke:var(--paper);stroke-width:5}
  .svg-label{font:600 18px var(--font-sans);fill:var(--text)}
  .svg-small{font:15px var(--font-sans);fill:var(--muted)}
  .loss-label{font:650 16px var(--font-sans);fill:var(--loss)}
  .guide{stroke:var(--rule);stroke-width:1.5;stroke-dasharray:7 7}
  .call-line{stroke:var(--text);stroke-width:1.5;fill:none}
</style>
</head>
<body data-page="11" data-total="24">
<div id="stage">
  <header class="page-head">
    <p class="kicker">训练的几何图景</p>
    <h1>训练是在参数空间里寻找低损失位置</h1>
    <p class="lead">每次更新都移动整组参数，让网络在训练样本上的预测误差变小。</p>
  </header>

  <main class="space-layout min0" aria-label="参数空间与训练更新示意">
    <figure class="map-panel min0" aria-labelledby="map-caption">
      <figcaption id="map-caption" class="map-title">参数空间示意 · 每个位置代表一整组权重与偏置</figcaption>
      <svg viewBox="0 0 1040 650" role="img" aria-label="参数空间中的损失等高线。参数从初始位置沿更新路径走向低损失区域。">
        <defs>
          <marker id="arrow-model" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0 0L10 5L0 10Z" fill="#2457A6"/>
          </marker>
        </defs>

        <line class="axis" x1="92" y1="568" x2="956" y2="568"/>
        <line class="axis" x1="92" y1="568" x2="92" y2="92"/>
        <path class="axis" d="M956 568l-12-7v14zM92 92l-7 12h14z" fill="#73858E"/>
        <text class="axis-label" x="932" y="601">参数 θ₁</text>
        <text class="axis-label" x="36" y="106">参数 θ₂</text>

        <path class="contour-fill" d="M503 358C546 287 679 272 746 323C813 375 772 466 689 491C606 516 485 465 503 358Z"/>
        <path class="contour high" d="M265 190C386 72 710 71 863 188C1019 308 943 525 772 581C584 643 269 568 191 403C153 321 191 262 265 190Z"/>
        <path class="contour high" d="M342 235C438 142 692 132 812 226C927 316 867 483 732 531C585 583 345 523 283 399C250 333 280 294 342 235Z"/>
        <path class="contour mid" d="M420 279C494 210 681 201 766 267C850 332 807 452 709 493C603 537 425 491 383 404C357 350 381 315 420 279Z"/>
        <path class="contour low" d="M494 324C547 276 676 268 736 312C795 356 764 438 692 465C616 493 497 461 470 402C452 362 469 346 494 324Z"/>
        <path class="contour low" d="M562 356C593 329 661 325 693 347C724 370 708 414 670 428C630 442 570 426 554 396C545 378 551 366 562 356Z"/>

        <text class="loss-label" x="795" y="166">较高损失</text>
        <path class="call-line" d="M787 174L751 213"/>
        <text class="loss-label" x="693" y="467">低损失区域</text>
        <path class="call-line" d="M686 452L657 410"/>

        <path class="path-shadow" d="M278 198C354 224 360 293 431 312S493 367 552 374S597 391 631 386"/>
        <path class="descent" marker-end="url(#arrow-model)" d="M278 198C354 224 360 293 431 312S493 367 552 374S597 391 631 386"/>
        <circle class="start-dot" cx="278" cy="198" r="10"/>
        <circle class="step-dot" cx="431" cy="312" r="9"/>
        <circle class="step-dot" cx="552" cy="374" r="9"/>
        <circle class="best-dot" cx="640" cy="387" r="13"/>

        <path class="guide" d="M278 198H174"/>
        <text class="svg-label" x="132" y="190">初始参数</text>
        <text class="svg-small" x="132" y="214">预测误差较大</text>
        <path class="guide" d="M640 387V529"/>
        <text class="svg-label" x="569" y="552">更新后的参数</text>
        <text class="svg-small" x="560" y="577">在当前样本上损失更低</text>

        <text class="svg-label" x="352" y="260" fill="#2457A6">沿负梯度方向更新</text>
      </svg>
    </figure>

    <aside class="rail min0" aria-label="图中对象的含义">
      <h2>图上的三种对象</h2>
      <dl class="meaning">
        <div class="meaning-row">
          <dt>位置</dt>
          <dd>网络全部参数的一种取值</dd>
        </div>
        <div class="meaning-row">
          <dt>高度</dt>
          <dd>这组参数产生的损失</dd>
        </div>
        <div class="meaning-row">
          <dt>路径</dt>
          <dd>优化器连续给出的参数更新</dd>
        </div>
      </dl>

      <section class="formula" aria-label="梯度下降更新式">
        <p class="eq">θ<tspan aria-hidden="true">ₜ₊₁</tspan> = θ<tspan aria-hidden="true">ₜ</tspan> − η∇L(θ<tspan aria-hidden="true">ₜ</tspan>)</p>
        <p>梯度指出损失上升最快的方向；减去它，参数就朝更低处移动。</p>
      </section>

      <p class="takeaway">网络没有接收一条人为编写的判定规则；它在样本定义的损失地形中<strong>调整参数</strong>。</p>
    </aside>
  </main>
</div>
<script src="assets/base.js"></script>
<script>Deck.init({index:11,total:24});</script>
</body>
</html>
