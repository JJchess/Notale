<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>沿着哪边走，损失降得最快？</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #gradient-lab{display:contents}
  #gradient-lab .page-head{flex:0 0 auto}
  #gradient-lab .page-head .lead{margin-top:10px;max-width:58em}
  #gradient-lab .lab{grid-template-columns:minmax(0,1.65fr) minmax(390px,.72fr);gap:28px}
  #gradient-lab .field{position:relative;display:flex;flex-direction:column;padding:14px 18px 12px}
  #gradient-lab .field-top{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:38px}
  #gradient-lab .field-title{font-size:var(--fs-label);font-weight:650;color:var(--muted)}
  #gradient-lab .field-title strong{color:var(--text)}
  #gradient-lab .plot{flex:1;min-height:0;margin-top:4px}
  #gradient-lab svg{touch-action:none;user-select:none}
  #gradient-lab .contour{fill:none;stroke:var(--rule);stroke-width:1.5;vector-effect:non-scaling-stroke}
  #gradient-lab .axis{stroke:var(--rule);stroke-width:1.2;vector-effect:non-scaling-stroke}
  #gradient-lab .axis-label,#gradient-lab .plot-label{fill:var(--muted);font:15px var(--font-sans)}
  #gradient-lab .tick-label{fill:var(--muted);font:13px var(--font-num)}
  #gradient-lab .gradient{stroke:var(--loss);stroke-width:4;vector-effect:non-scaling-stroke}
  #gradient-lab .negative-guide{stroke:var(--loss);stroke-width:2;stroke-dasharray:7 7;opacity:.62;vector-effect:non-scaling-stroke}
  #gradient-lab .step-line{stroke:var(--attention);stroke-width:5;vector-effect:non-scaling-stroke}
  #gradient-lab .step-hit{stroke:transparent;stroke-width:30;cursor:grab}
  #gradient-lab .step-hit:active{cursor:grabbing}
  #gradient-lab .start-dot{fill:var(--text);stroke:var(--paper);stroke-width:4;vector-effect:non-scaling-stroke}
  #gradient-lab .end-dot{fill:var(--attention);stroke:var(--paper);stroke-width:4;vector-effect:non-scaling-stroke}
  #gradient-lab .handle-ring{fill:var(--paper);stroke:var(--attention);stroke-width:4;vector-effect:non-scaling-stroke;cursor:grab}
  #gradient-lab .handle-ring:focus{outline:none;stroke:var(--focus);stroke-width:7}
  #gradient-lab .loss-band{fill:var(--loss-soft);opacity:.72}
  #gradient-lab .guide-label{fill:var(--loss);font:650 15px var(--font-sans)}
  #gradient-lab .step-label{fill:#854500;font:650 15px var(--font-sans)}
  #gradient-lab .plot-caption{display:flex;justify-content:space-between;gap:18px;padding-top:8px;border-top:1px solid var(--rule);font-size:var(--fs-label);color:var(--muted)}
  #gradient-lab .inspector{display:flex;flex-direction:column;min-height:0;padding:4px 0}
  #gradient-lab .inspector h2{margin-bottom:16px}
  #gradient-lab .formula{padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font:600 24px/1.35 var(--font-num);color:var(--text)}
  #gradient-lab .formula .cause{color:var(--attention)}
  #gradient-lab .formula .effect{color:var(--loss)}
  #gradient-lab .readouts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}
  #gradient-lab .readout{min-width:0}
  #gradient-lab .readout .small{margin-bottom:5px}
  #gradient-lab .readout .big{font-size:40px}
  #gradient-lab .readout.loss .big{color:var(--loss)}
  #gradient-lab .control-block{padding-top:18px;border-top:1px solid var(--rule)}
  #gradient-lab .ctl{grid-template-columns:90px minmax(0,1fr) 58px}
  #gradient-lab .presets{margin-top:13px}
  #gradient-lab .presets .btn{flex:1;white-space:nowrap}
  #gradient-lab .result{min-height:78px;margin-top:18px;padding:14px 16px;border:1px solid var(--rule);border-radius:var(--radius);font-size:var(--fs-sec);line-height:1.45;background:var(--paper)}
  #gradient-lab .result strong{color:var(--loss)}
  #gradient-lab .result.found{border-color:var(--loss);background:var(--loss-soft)}
  #gradient-lab .bottom-actions{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:auto;padding-top:16px}
  #gradient-lab .angle-gap{font-size:var(--fs-label);color:var(--muted)}
</style>
</head>
<body data-page="12" data-total="24">
<div id="stage">
  <main id="gradient-lab">
    <header class="page-head">
      <p class="kicker">参数更新 · 局部坡度</p>
      <h1>沿着哪边走，损失降得最快？</h1>
      <p class="lead">固定起点和步长，只改变更新方向。拖动橙色箭头，比较每个方向的局部斜率。</p>
    </header>

    <section class="lab min0" aria-label="负梯度方向实验">
      <div class="field panel min0">
        <div class="field-top">
          <div class="field-title"><strong>损失曲面俯视图</strong>　同一条线上的点损失相同</div>
          <div class="legend" aria-label="图例">
            <span class="li" style="color:var(--attention)"><span class="sw line"></span>你的更新</span>
            <span class="li" style="color:var(--loss)"><span class="sw line"></span>梯度 ∇L</span>
          </div>
        </div>
        <div class="plot cvbox no-pan min0">
          <svg id="lossPlot" viewBox="0 0 930 570" role="img" aria-labelledby="plotTitle plotDesc">
            <title id="plotTitle">二维损失曲面的等高线与可拖动更新向量</title>
            <desc id="plotDesc">固定起点位于碗形损失曲面右上方。橙色箭头表示固定步长的参数更新，红色箭头表示此处梯度。</desc>
            <defs>
              <marker id="p12ArrowLoss" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A33D3D"/></marker>
              <marker id="p12ArrowAttention" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#CC6A00"/></marker>
            </defs>
            <g aria-hidden="true">
              <line class="axis" x1="70" y1="300" x2="870" y2="300"/>
              <line class="axis" x1="455" y1="42" x2="455" y2="530"/>
              <text class="axis-label" x="872" y="291">参数 w₁</text>
              <text class="axis-label" x="469" y="54">参数 w₂</text>
              <circle class="loss-band" cx="455" cy="300" r="50"/>
              <circle class="contour" cx="455" cy="300" r="50"/>
              <circle class="contour" cx="455" cy="300" r="100"/>
              <circle class="contour" cx="455" cy="300" r="150"/>
              <circle class="contour" cx="455" cy="300" r="200"/>
              <circle class="contour" cx="455" cy="300" r="250"/>
              <text class="tick-label" x="462" y="291">L = 0</text>
              <text class="plot-label" x="746" y="116">越向外，损失越高</text>
            </g>
            <g id="vectorLayer">
              <line id="negGuide" class="negative-guide" marker-end="url(#p12ArrowLoss)"/>
              <text id="negLabel" class="guide-label">−∇L</text>
              <line id="gradLine" class="gradient" marker-end="url(#p12ArrowLoss)"/>
              <text id="gradLabel" class="guide-label">∇L</text>
              <line id="stepLine" class="step-line" marker-end="url(#p12ArrowAttention)"/>
              <line id="stepHit" class="step-hit"/>
              <circle id="startDot" class="start-dot" r="9"/>
              <circle id="endDot" class="end-dot" r="8"/>
              <circle id="dragHandle" class="handle-ring" r="13" tabindex="0" role="slider" aria-label="更新方向角度" aria-valuemin="0" aria-valuemax="359" aria-valuenow="150"/>
              <text id="stepLabel" class="step-label">固定步长 α</text>
            </g>
          </svg>
        </div>
        <div class="plot-caption">
          <span>损失函数：<span class="num">L = ½(w₁² + w₂²)</span></span>
          <span>起点与步长保持不变：<span class="num">α = 0.70</span></span>
        </div>
      </div>

      <aside class="inspector min0" aria-label="方向与斜率读数">
        <h2>用斜率判断方向</h2>
        <div class="formula"><span class="effect">局部斜率</span> = ∇L · <span class="cause">d</span></div>
        <div class="readouts">
          <div class="readout loss">
            <p class="small">当前方向斜率</p>
            <div class="big sm num" id="slopeValue">−1.22</div>
          </div>
          <div class="readout">
            <p class="small">一步后的损失</p>
            <div class="big sm num" id="nextLoss">1.72</div>
          </div>
        </div>

        <div class="control-block">
          <label class="ctl" for="angleRange">
            <span>更新方向</span>
            <input id="angleRange" type="range" min="0" max="359" step="1" value="150">
            <output id="angleValue" class="num">150°</output>
          </label>
          <div class="btns presets" aria-label="方向预设">
            <button class="btn" type="button" data-angle="33.0">顺着梯度</button>
            <button class="btn" type="button" data-angle="123.0">沿等高线</button>
            <button class="btn" type="button" id="negativeBtn">对准负梯度</button>
          </div>
        </div>

        <div id="result" class="result" aria-live="polite">当前方向能让损失下降，但还不是局部最快。继续旋转，观察斜率能否更负。</div>
        <div class="bottom-actions">
          <span class="angle-gap">与 −∇L 相差 <strong id="gapValue" class="num">63.0°</strong></span>
          <button class="btn" id="resetBtn" type="button">恢复初始方向</button>
        </div>
      </aside>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script>
(() => {
  const root = document.getElementById('gradient-lab');
  const svg = root.querySelector('#lossPlot');
  const range = root.querySelector('#angleRange');
  const handle = root.querySelector('#dragHandle');
  const els = {
    negGuide: root.querySelector('#negGuide'), negLabel: root.querySelector('#negLabel'),
    gradLine: root.querySelector('#gradLine'), gradLabel: root.querySelector('#gradLabel'),
    stepLine: root.querySelector('#stepLine'), stepHit: root.querySelector('#stepHit'),
    startDot: root.querySelector('#startDot'), endDot: root.querySelector('#endDot'),
    stepLabel: root.querySelector('#stepLabel'), slope: root.querySelector('#slopeValue'),
    nextLoss: root.querySelector('#nextLoss'), angle: root.querySelector('#angleValue'),
    gap: root.querySelector('#gapValue'), result: root.querySelector('#result')
  };

  const model = Object.freeze({ w1: 2.25, w2: 1.45, alpha: 0.70, cx: 455, cy: 300, scale: 85 });
  const optimum = (Math.atan2(-model.w2, -model.w1) * 180 / Math.PI + 360) % 360;
  const initial = 150;
  let state = { angle: initial, touched: false };
  let activePointer = null;

  const fmtSigned = v => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(2);
  const normAngle = a => (a % 360 + 360) % 360;
  const angleGap = a => Math.abs(((a - optimum + 540) % 360) - 180);
  const xy = (x, y) => ({ x: model.cx + x * model.scale, y: model.cy - y * model.scale });

  function setLine(el, a, b) {
    el.setAttribute('x1', a.x); el.setAttribute('y1', a.y);
    el.setAttribute('x2', b.x); el.setAttribute('y2', b.y);
  }

  function render(announce = false) {
    const a = state.angle * Math.PI / 180;
    const d = { x: Math.cos(a), y: Math.sin(a) };
    const start = xy(model.w1, model.w2);
    const endWorld = { x: model.w1 + model.alpha * d.x, y: model.w2 + model.alpha * d.y };
    const end = xy(endWorld.x, endWorld.y);
    const gNorm = Math.hypot(model.w1, model.w2);
    const g = { x: model.w1 / gNorm, y: model.w2 / gNorm };
    const gradEnd = { x: start.x + g.x * 105, y: start.y - g.y * 105 };
    const negEnd = { x: start.x - g.x * 126, y: start.y + g.y * 126 };
    const slope = model.w1 * d.x + model.w2 * d.y;
    const loss2 = .5 * (endWorld.x * endWorld.x + endWorld.y * endWorld.y);
    const gap = angleGap(state.angle);

    setLine(els.gradLine, start, gradEnd);
    setLine(els.negGuide, start, negEnd);
    setLine(els.stepLine, start, end);
    setLine(els.stepHit, start, end);
    [els.startDot].forEach(el => { el.setAttribute('cx', start.x); el.setAttribute('cy', start.y); });
    [els.endDot, handle].forEach(el => { el.setAttribute('cx', end.x); el.setAttribute('cy', end.y); });
    els.gradLabel.setAttribute('x', gradEnd.x + 8); els.gradLabel.setAttribute('y', gradEnd.y - 7);
    els.negLabel.setAttribute('x', negEnd.x - 42); els.negLabel.setAttribute('y', negEnd.y + 24);
    els.stepLabel.setAttribute('x', (start.x + end.x) / 2 + 9); els.stepLabel.setAttribute('y', (start.y + end.y) / 2 - 12);

    range.value = Math.round(state.angle);
    handle.setAttribute('aria-valuenow', Math.round(state.angle));
    handle.setAttribute('aria-valuetext', Math.round(state.angle) + '度，与负梯度相差' + gap.toFixed(1) + '度');
    els.angle.value = Math.round(state.angle) + '°';
    els.slope.textContent = fmtSigned(slope);
    els.nextLoss.textContent = loss2.toFixed(2);
    els.gap.textContent = gap.toFixed(1) + '°';

    let message;
    let found = false;
    if (gap <= 2) {
      found = true;
      message = '<strong>负梯度给出最小局部斜率 −' + gNorm.toFixed(2) + '</strong>。在固定步长下，没有其他方向能降得更快。';
    } else if (slope >= 0.05) {
      message = '这个方向的斜率为正，更新后损失会上升。把箭头转向红色梯度的反方向。';
    } else if (Math.abs(slope) < 0.05) {
      message = '箭头贴着等高线移动，局部斜率接近 0；这一步几乎没有下降。';
    } else {
      message = '当前方向能让损失下降，但还不是局部最快。继续旋转，观察斜率能否更负。';
    }
    els.result.innerHTML = message;
    els.result.classList.toggle('found', found);
  }

  function setAngle(value, touched = true, announce = false) {
    state = { angle: normAngle(Number(value)), touched };
    render(announce);
  }

  function pointerAngle(e) {
    const p = Deck.pt(svg, e);
    const x = p.x * 930 / svg.offsetWidth;
    const y = p.y * 570 / svg.offsetHeight;
    const start = xy(model.w1, model.w2);
    return normAngle(Math.atan2(-(y - start.y), x - start.x) * 180 / Math.PI);
  }

  function onPointerDown(e) {
    if (activePointer !== null || (e.button !== undefined && e.button !== 0)) return;
    activePointer = e.pointerId;
    svg.setPointerCapture(e.pointerId);
    setAngle(pointerAngle(e));
    e.preventDefault();
  }
  function onPointerMove(e) {
    if (e.pointerId !== activePointer) return;
    setAngle(pointerAngle(e));
  }
  function finishPointer(e) {
    if (e.pointerId !== activePointer) return;
    if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId);
    activePointer = null;
    render(true);
  }

  els.stepHit.addEventListener('pointerdown', onPointerDown);
  handle.addEventListener('pointerdown', onPointerDown);
  svg.addEventListener('pointermove', onPointerMove);
  svg.addEventListener('pointerup', finishPointer);
  svg.addEventListener('pointercancel', finishPointer);
  range.addEventListener('input', e => setAngle(e.target.value));
  range.addEventListener('change', () => render(true));
  handle.addEventListener('keydown', e => {
    let delta = 0;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') delta = -1;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') delta = 1;
    if (e.key === 'PageDown') delta = -10;
    if (e.key === 'PageUp') delta = 10;
    if (!delta) return;
    e.preventDefault(); e.stopPropagation();
    setAngle(state.angle + delta, true, true);
  });
  root.querySelectorAll('[data-angle]').forEach(btn => btn.addEventListener('click', () => setAngle(btn.dataset.angle, true, true)));
  root.querySelector('#negativeBtn').addEventListener('click', () => setAngle(optimum, true, true));
  root.querySelector('#resetBtn').addEventListener('click', () => setAngle(initial, false, true));

  render();
  Deck.init({ index: 12, total: 24 });
})();
</script>
</body>
</html>
