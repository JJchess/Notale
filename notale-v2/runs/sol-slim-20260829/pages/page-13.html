<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:0}
    .head{flex:0 0 112px;display:flex;align-items:flex-start;justify-content:space-between;gap:44px;border-bottom:1px solid var(--rule);padding-bottom:18px}
    .head-copy{min-width:0}
    .head h1{max-width:1050px}
    .formula{flex:0 0 330px;align-self:flex-end;text-align:right;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
    .formula strong{color:var(--text);font-family:var(--font-num);font-size:24px;font-weight:600}
    .main{flex:1;min-height:0;display:grid;grid-template-rows:92px minmax(0,1fr) 126px;gap:14px;padding-top:18px}
    .setup{display:flex;align-items:center;justify-content:space-between;gap:30px}
    .setup .lead{max-width:910px}
    .setup-key{display:flex;align-items:center;gap:28px;flex:0 0 auto;color:var(--muted);font-size:var(--fs-label)}
    .key-item{display:flex;align-items:center;gap:9px;white-space:nowrap}
    .key-line{width:30px;border-top:3px solid var(--model)}
    .key-zero{width:30px;border-top:2px dashed var(--rule-strong)}
    .chart-wrap{position:relative;min-height:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--paper)}
    #compareSvg{display:block;width:100%;height:100%}
    .outcomes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;align-items:stretch}
    .outcome{min-width:0;padding:13px 30px 8px 0;display:grid;grid-template-columns:58px minmax(0,1fr);column-gap:14px;align-content:start}
    .outcome+.outcome{padding-left:30px;border-left:1px solid var(--rule)}
    .outcome-mark{font-family:var(--font-num);font-size:34px;line-height:1;color:var(--muted);font-weight:600}
    .outcome:nth-child(2) .outcome-mark{color:var(--model)}
    .outcome:nth-child(3) .outcome-mark{color:var(--attention)}
    .outcome h2{font-size:var(--fs-h2);margin-bottom:3px}
    .outcome p{color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
    svg text{font-family:var(--font-sans);fill:var(--text)}
    .axis-label{font-size:13px;fill:var(--muted)}
    .row-title{font-family:var(--font-display);font-size:24px;font-weight:650}
    .eta{font-family:var(--font-num);font-size:15px;fill:var(--muted)}
    .status{font-size:16px;font-weight:650}
    .value{font-family:var(--font-num);font-size:14px;fill:var(--muted)}
    .gridline{stroke:var(--rule);stroke-width:1}
    .zero{stroke:var(--rule-strong);stroke-width:1.5;stroke-dasharray:7 7}
    .trajectory{fill:none;stroke:var(--model);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .stepdot{fill:var(--paper);stroke:var(--model);stroke-width:3}
    .finaldot{fill:var(--attention);stroke:var(--paper);stroke-width:3}
    .bracket{fill:none;stroke:var(--attention);stroke-width:2}
    .callout{font-size:15px;fill:var(--attention);font-weight:650}
  </style>
</head>
<body data-page="13" data-total="24">
  <div id="stage">
    <header class="head">
      <div class="head-copy min0">
        <p class="kicker">梯度下降 · 步长对照</p>
        <h1>学习率决定每次改多少：太小停滞，适中收敛，太大震荡</h1>
      </div>
      <p class="formula"><strong>w<sub>t+1</sub> = w<sub>t</sub> − ηw<sub>t</sub></strong><br>同一损失函数 L(w)=½w²，起点 w₀=1</p>
    </header>

    <main class="main min0">
      <section class="setup" aria-label="比较说明">
        <p class="lead">只改变学习率 η，连续更新 10 次。三条轨迹共用同一尺度，虚线是最优位置 <span class="num">w=0</span>。</p>
        <div class="setup-key" aria-label="图例">
          <span class="key-item"><i class="key-line" aria-hidden="true"></i>参数轨迹 w</span>
          <span class="key-item"><i class="key-zero" aria-hidden="true"></i>最优位置</span>
        </div>
      </section>

      <section class="chart-wrap min0" aria-label="三种学习率的参数更新轨迹">
        <svg id="compareSvg" role="img" aria-labelledby="chartTitle chartDesc" viewBox="0 0 1488 448" preserveAspectRatio="none">
          <title id="chartTitle">学习率过小、适中与过大时的十次参数更新</title>
          <desc id="chartDesc">学习率零点零八时参数缓慢靠近零；零点六五时迅速收敛；一点六五时参数跨过零点并来回震荡。</desc>
        </svg>
      </section>

      <section class="outcomes" aria-label="三种学习率的结论">
        <article class="outcome">
          <div class="outcome-mark">慢</div>
          <div><h2>步子太小</h2><p>方向没错，但 10 次后仍离最优点较远；训练像“停住”。</p></div>
        </article>
        <article class="outcome">
          <div class="outcome-mark">稳</div>
          <div><h2>步子适中</h2><p>每次都缩短距离，不跨过最优点；快速贴近 <span class="num">w=0</span>。</p></div>
        </article>
        <article class="outcome">
          <div class="outcome-mark">摆</div>
          <div><h2>步子过大</h2><p>一次跨得太远，参数反复越过最优点；学习路线来回震荡。</p></div>
        </article>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      const svg = document.getElementById('compareSvg');
      const NS = 'http://www.w3.org/2000/svg';
      const W = 1488, left = 242, right = 92, plotW = W - left - right;
      const rows = [
        {eta:0.08, name:'过小', note:'10 次后 w = 0.434', cy:76},
        {eta:0.65, name:'适中', note:'10 次后 w ≈ 0.00003', cy:224},
        {eta:1.65, name:'过大', note:'正负交替，振幅逐步缩小', cy:372}
      ];
      const make = (tag, attrs={}, text='') => {
        const el = document.createElementNS(NS, tag);
        Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k,v));
        if(text) el.textContent = text;
        svg.appendChild(el);
        return el;
      };
      const x = i => left + plotW * i / 10;
      const y = (v, cy) => cy - v * 54;

      for(let i=0;i<=10;i++){
        make('line',{x1:x(i),y1:20,x2:x(i),y2:421,class:'gridline',opacity:i===0||i===10?.75:.3});
        make('text',{x:x(i),y:442,'text-anchor':'middle',class:'axis-label'},String(i));
      }
      make('text',{x:left-18,y:442,'text-anchor':'end',class:'axis-label'},'更新次数 t');

      rows.forEach((r, ri) => {
        if(ri<2) make('line',{x1:0,y1:r.cy+74,x2:W,y2:r.cy+74,class:'gridline',opacity:.7});
        make('line',{x1:left,y1:r.cy,x2:W-right,y2:r.cy,class:'zero'});
        make('text',{x:0,y:r.cy-18,class:'row-title'},r.name);
        make('text',{x:0,y:r.cy+10,class:'eta'},`η = ${r.eta.toFixed(2)}`);
        make('text',{x:0,y:r.cy+39,class:'status'},ri===0?'推进缓慢':ri===1?'快速收敛':'越界反复');

        const values=[1];
        for(let i=0;i<10;i++) values.push(values[values.length-1]*(1-r.eta));
        const pts=values.map((v,i)=>`${x(i)},${y(v,r.cy)}`).join(' ');
        make('polyline',{points:pts,class:'trajectory'});
        values.forEach((v,i)=>make('circle',{cx:x(i),cy:y(v,r.cy),r:i===10?7:4.5,class:i===10?'finaldot':'stepdot'}));
        make('text',{x:W-10,y:r.cy+5,'text-anchor':'end',class:'value'},r.note);

        if(ri===2){
          make('path',{d:`M ${x(1)-20} ${y(values[1],r.cy)-9} Q ${x(1)+32} ${r.cy-86} ${x(2)-10} ${y(values[2],r.cy)-10}`,class:'bracket'});
          make('text',{x:x(1)+34,y:r.cy-62,class:'callout'},'每一步都跨过最优点');
        }
      });
      Deck.init({index:13,total:24});
    })();
  </script>
</body>
</html>
