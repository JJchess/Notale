<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>导数与链式法则</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .page-head{flex:0 0 102px;display:flex;flex-direction:column;justify-content:flex-end}
    .page-head .kicker{color:var(--attention)}
    .page-head h1{max-width:1180px}
    .main{flex:1;min-height:0;margin-top:20px;display:grid;grid-template-rows:minmax(0,1fr) 146px;gap:18px}
    .diagram{position:relative;min-height:0;border-top:2px solid var(--rule);border-bottom:2px solid var(--rule);background:var(--paper)}
    .diagram svg{display:block;width:100%;height:100%}
    .diagram text{font-family:var(--font-sans);fill:var(--text)}
    .diagram .mono{font-family:var(--font-num);font-variant-numeric:tabular-nums}
    .diagram .muted{fill:var(--muted)}
    .diagram .model{fill:var(--model)}
    .diagram .attn{fill:var(--attention)}
    .diagram .path{stroke:var(--model);stroke-width:5;fill:none}
    .diagram .guide{stroke:var(--rule);stroke-width:2;fill:none}
    .diagram .delta{stroke:var(--attention);stroke-width:4;fill:none}
    .diagram .node{fill:var(--paper);stroke:var(--text);stroke-width:2}
    .diagram .op{fill:var(--model-soft);stroke:var(--model);stroke-width:2}
    .formula-row{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(0,.72fr);gap:18px;min-height:0}
    .equation{display:flex;align-items:center;justify-content:center;gap:20px;padding:18px 26px;border:2px solid var(--attention);border-radius:var(--radius);background:var(--attention-soft)}
    .equation .eq-label{max-width:210px;color:#713A00;font-size:var(--fs-sec);font-weight:650;line-height:1.35}
    .equation .eq{font-family:var(--font-num);font-size:36px;font-weight:650;line-height:1.1;white-space:nowrap}
    .takeaway{display:flex;flex-direction:column;justify-content:center;padding:16px 22px;border-top:2px solid var(--rule);border-bottom:2px solid var(--rule)}
    .takeaway strong{font-size:var(--fs-lead);line-height:1.35}
    .takeaway p{margin-top:7px;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
  </style>
</head>
<body data-page="15" data-total="24">
  <div id="stage">
    <header class="page-head">
      <p class="kicker">导数 · 局部敏感度</p>
      <h1>上游动一点，下游会改变多少？</h1>
    </header>

    <main class="main min0" aria-label="用局部变化解释导数与链式法则">
      <section class="diagram min0" aria-label="两段函数的变化沿计算链传递">
        <svg viewBox="0 0 1488 556" role="img" aria-labelledby="svg-title svg-desc">
          <title id="svg-title">输入变化经过两段计算后被连续放大</title>
          <desc id="svg-desc">x 从2变为2.1，经过乘3得到 h 从6变为6.3，再经过乘2得到 y 从12变为12.6。两段局部敏感度3和2相乘，得到整体敏感度6。</desc>
          <defs>
            <marker id="arrow-model" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#2457A6"/>
            </marker>
            <marker id="arrow-attn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#CC6A00"/>
            </marker>
          </defs>

          <text x="72" y="63" font-size="17" font-weight="650" class="muted">原来的前向计算</text>
          <path d="M180 174 H608" class="path" marker-end="url(#arrow-model)"/>
          <path d="M872 174 H1300" class="path" marker-end="url(#arrow-model)"/>

          <circle cx="142" cy="174" r="62" class="node"/>
          <text x="142" y="157" text-anchor="middle" font-size="19" class="muted">输入 x</text>
          <text x="142" y="199" text-anchor="middle" font-size="38" font-weight="650" class="mono model">2.00</text>

          <rect x="332" y="123" width="166" height="102" rx="6" class="op"/>
          <text x="415" y="161" text-anchor="middle" font-size="17" class="muted">局部计算</text>
          <text x="415" y="199" text-anchor="middle" font-size="32" font-weight="650" class="mono model">h = 3x</text>

          <circle cx="744" cy="174" r="62" class="node"/>
          <text x="744" y="157" text-anchor="middle" font-size="19" class="muted">中间量 h</text>
          <text x="744" y="199" text-anchor="middle" font-size="38" font-weight="650" class="mono model">6.00</text>

          <rect x="990" y="123" width="166" height="102" rx="6" class="op"/>
          <text x="1073" y="161" text-anchor="middle" font-size="17" class="muted">局部计算</text>
          <text x="1073" y="199" text-anchor="middle" font-size="32" font-weight="650" class="mono model">y = 2h</text>

          <circle cx="1346" cy="174" r="62" class="node"/>
          <text x="1346" y="157" text-anchor="middle" font-size="19" class="muted">输出 y</text>
          <text x="1346" y="199" text-anchor="middle" font-size="38" font-weight="650" class="mono model">12.00</text>

          <line x1="64" y1="285" x2="1424" y2="285" class="guide"/>
          <text x="72" y="331" font-size="17" font-weight="650" class="attn">给输入一个微小变化</text>

          <path d="M166 403 H622" class="delta" marker-end="url(#arrow-attn)"/>
          <path d="M866 403 H1322" class="delta" marker-end="url(#arrow-attn)"/>

          <text x="142" y="390" text-anchor="middle" font-size="18" class="muted">Δx</text>
          <text x="142" y="429" text-anchor="middle" font-size="34" font-weight="650" class="mono attn">+0.10</text>

          <text x="415" y="376" text-anchor="middle" font-size="17" class="muted">这一小段放大</text>
          <text x="415" y="422" text-anchor="middle" font-size="34" font-weight="650" class="mono attn">dh/dx = 3</text>
          <text x="415" y="451" text-anchor="middle" font-size="15" class="muted">局部敏感度</text>

          <text x="744" y="390" text-anchor="middle" font-size="18" class="muted">Δh</text>
          <text x="744" y="429" text-anchor="middle" font-size="34" font-weight="650" class="mono attn">+0.30</text>

          <text x="1073" y="376" text-anchor="middle" font-size="17" class="muted">下一小段再放大</text>
          <text x="1073" y="422" text-anchor="middle" font-size="34" font-weight="650" class="mono attn">dy/dh = 2</text>
          <text x="1073" y="451" text-anchor="middle" font-size="15" class="muted">局部敏感度</text>

          <text x="1346" y="390" text-anchor="middle" font-size="18" class="muted">Δy</text>
          <text x="1346" y="429" text-anchor="middle" font-size="34" font-weight="650" class="mono attn">+0.60</text>

          <path d="M142 484 V515 H1346 V484" class="guide"/>
          <text x="744" y="542" text-anchor="middle" font-size="18" class="muted">整体：输入每增加 1，输出增加 6</text>
        </svg>
      </section>

      <section class="formula-row min0" aria-label="链式法则结论">
        <div class="equation min0">
          <div class="eq-label">链式法则把沿途的局部敏感度相乘</div>
          <div class="eq" aria-label="d y 除以 d x 等于 d y 除以 d h 乘以 d h 除以 d x，等于二乘三等于六">dy/dx = dy/dh × dh/dx = 2 × 3 = <span style="color:var(--attention)">6</span></div>
        </div>
        <div class="takeaway min0">
          <strong>导数就是“动一点，会带来多少变化”。</strong>
          <p>神经网络很长；反向传播逐段计算这种敏感度，再沿计算链相乘。</p>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:15,total:24});</script>
</body>
</html>
