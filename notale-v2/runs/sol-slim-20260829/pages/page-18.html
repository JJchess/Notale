<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>反向传播：先汇总，再继续传递</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .page-head{flex:0 0 auto}
    .page-head h1{max-width:1120px}
    .page-head .lead{margin-top:9px;max-width:980px}
    .diagram-wrap{display:flex;flex-direction:column;flex:1;min-height:0;margin-top:18px;border:2px solid var(--rule);border-radius:var(--radius);background:var(--paper)}
    .order{display:grid;grid-template-columns:1.05fr 1fr 1fr 1fr;align-items:center;min-height:70px;padding:0 44px;border-bottom:1px solid var(--rule);counter-reset:reverse}
    .order-item{position:relative;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:var(--fs-label);font-weight:650;letter-spacing:.02em;counter-increment:reverse}
    .order-item::before{content:counter(reverse);display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--rule-strong);border-radius:50%;color:var(--loss);font-family:var(--font-num);font-weight:650;background:var(--paper)}
    .order-item:not(:last-child)::after{content:"";position:absolute;right:22px;width:42px;height:1px;background:var(--rule)}
    .order-item:not(:last-child) span::after{content:"";position:absolute;right:22px;top:50%;width:8px;height:8px;border-top:1px solid var(--rule-strong);border-right:1px solid var(--rule-strong);transform:translateY(-50%) rotate(45deg)}
    .diagram{flex:1;min-height:0;padding:10px 26px 2px}
    .diagram svg{display:block;width:100%;height:100%}
    .formula-band{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:34px;align-items:center;min-height:112px;padding:12px 34px 14px;border-top:1px solid var(--rule)}
    .formula{display:flex;align-items:baseline;gap:14px;white-space:nowrap;font-family:var(--font-num);font-size:28px;color:var(--text)}
    .formula .lhs{color:var(--attention);font-weight:700}
    .formula .term{color:var(--loss)}
    .formula .op{color:var(--text);font-weight:700}
    .rule-copy{padding-left:26px;border-left:1px solid var(--rule);font-size:var(--fs-sec);line-height:1.5;color:var(--muted)}
    .rule-copy strong{display:block;margin-bottom:2px;color:var(--text);font-size:var(--fs-lead);font-weight:650}
    .node-label{font:650 18px var(--font-sans);fill:var(--text)}
    .minor-label{font:15px var(--font-sans);fill:var(--muted)}
    .signal-label{font:650 16px var(--font-num);fill:var(--loss)}
    .sum-label{font:700 25px var(--font-num);fill:#713A00}
    .layer-label{font:650 15px var(--font-sans);fill:var(--muted);letter-spacing:.08em}
    .callout{font:650 18px var(--font-sans);fill:var(--text)}
    .callout-small{font:15px var(--font-sans);fill:var(--muted)}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body data-page="18" data-total="24">
  <div id="stage">
    <header class="page-head">
      <p class="kicker">反向传播 · 逆序计算</p>
      <h1>同一节点收到多条误差信号：先相加，再继续传</h1>
      <p class="lead">从损失端向输入端倒着算；分支汇入节点时，每条路径的贡献都不能漏。</p>
    </header>

    <main class="diagram-wrap min0" aria-labelledby="diagram-title">
      <div class="order" aria-label="反向传播的计算顺序">
        <div class="order-item"><span>从损失出发</span></div>
        <div class="order-item"><span>求输出层误差</span></div>
        <div class="order-item"><span>在隐藏节点汇总</span></div>
        <div class="order-item"><span>传给更早一层</span></div>
      </div>

      <section class="diagram min0" aria-label="误差信号在共享隐藏节点累加的示意图">
        <svg viewBox="0 0 1400 500" role="img" aria-labelledby="svgTitle svgDesc" preserveAspectRatio="xMidYMid meet">
          <title id="svgTitle">两条输出误差信号在隐藏节点 h 处相加</title>
          <desc id="svgDesc">前向结构从输入 x1 和 x2 到隐藏节点 h，再分到输出 o1 和 o2，最后形成损失 L。反向传播从 L 返回，两条输出路径的贡献在 h 处相加为 delta h，然后再向输入侧传递。</desc>
          <defs>
            <marker id="arrowLoss" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#A33D3D"/>
            </marker>
            <marker id="arrowMuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#73858E"/>
            </marker>
          </defs>

          <text x="120" y="38" class="layer-label">输入侧</text>
          <text x="555" y="38" class="layer-label">共享隐藏节点</text>
          <text x="930" y="38" class="layer-label">输出层</text>
          <text x="1270" y="38" class="layer-label">损失</text>
          <line x1="350" y1="24" x2="350" y2="452" stroke="#AEBBC1" stroke-width="1" stroke-dasharray="5 8"/>
          <line x1="800" y1="24" x2="800" y2="452" stroke="#AEBBC1" stroke-width="1" stroke-dasharray="5 8"/>
          <line x1="1190" y1="24" x2="1190" y2="452" stroke="#AEBBC1" stroke-width="1" stroke-dasharray="5 8"/>

          <!-- forward structure -->
          <path d="M 210 165 C 350 165, 405 240, 535 240" fill="none" stroke="#2457A6" stroke-width="3" opacity=".38" marker-end="url(#arrowMuted)"/>
          <path d="M 210 340 C 350 340, 405 260, 535 260" fill="none" stroke="#2457A6" stroke-width="3" opacity=".38" marker-end="url(#arrowMuted)"/>
          <path d="M 665 240 C 790 220, 825 145, 930 145" fill="none" stroke="#2457A6" stroke-width="3" opacity=".38" marker-end="url(#arrowMuted)"/>
          <path d="M 665 260 C 790 280, 825 355, 930 355" fill="none" stroke="#2457A6" stroke-width="3" opacity=".38" marker-end="url(#arrowMuted)"/>
          <path d="M 1050 145 C 1130 145, 1165 218, 1244 236" fill="none" stroke="#2457A6" stroke-width="3" opacity=".38" marker-end="url(#arrowMuted)"/>
          <path d="M 1050 355 C 1130 355, 1165 282, 1244 264" fill="none" stroke="#2457A6" stroke-width="3" opacity=".38" marker-end="url(#arrowMuted)"/>

          <!-- nodes -->
          <circle cx="160" cy="165" r="50" fill="#F8FAFB" stroke="#73858E" stroke-width="2"/>
          <circle cx="160" cy="340" r="50" fill="#F8FAFB" stroke="#73858E" stroke-width="2"/>
          <text x="160" y="171" text-anchor="middle" class="node-label">x₁</text>
          <text x="160" y="346" text-anchor="middle" class="node-label">x₂</text>

          <circle cx="600" cy="250" r="65" fill="#F5E5D2" stroke="#CC6A00" stroke-width="3"/>
          <text x="600" y="244" text-anchor="middle" class="node-label">h</text>
          <text x="600" y="277" text-anchor="middle" class="sum-label">Σ</text>

          <circle cx="990" cy="145" r="58" fill="#F8FAFB" stroke="#2457A6" stroke-width="2"/>
          <circle cx="990" cy="355" r="58" fill="#F8FAFB" stroke="#2457A6" stroke-width="2"/>
          <text x="990" y="151" text-anchor="middle" class="node-label">o₁</text>
          <text x="990" y="361" text-anchor="middle" class="node-label">o₂</text>

          <circle cx="1300" cy="250" r="62" fill="#F1DDDD" stroke="#A33D3D" stroke-width="3"/>
          <text x="1300" y="257" text-anchor="middle" class="node-label">L</text>

          <!-- backward paths -->
          <path d="M 1255 216 C 1165 180, 1130 124, 1050 124" fill="none" stroke="#A33D3D" stroke-width="5" marker-end="url(#arrowLoss)"/>
          <path d="M 1255 284 C 1165 320, 1130 376, 1050 376" fill="none" stroke="#A33D3D" stroke-width="5" marker-end="url(#arrowLoss)"/>
          <path d="M 932 124 C 815 124, 785 207, 665 225" fill="none" stroke="#A33D3D" stroke-width="5" marker-end="url(#arrowLoss)"/>
          <path d="M 932 376 C 815 376, 785 293, 665 275" fill="none" stroke="#A33D3D" stroke-width="5" marker-end="url(#arrowLoss)"/>
          <text x="795" y="123" text-anchor="middle" class="signal-label">δ₁ · ∂o₁/∂h</text>
          <text x="795" y="397" text-anchor="middle" class="signal-label">δ₂ · ∂o₂/∂h</text>

          <path d="M 535 226 C 400 205, 345 145, 210 145" fill="none" stroke="#A33D3D" stroke-width="5" marker-end="url(#arrowLoss)"/>
          <path d="M 535 274 C 400 295, 345 360, 210 360" fill="none" stroke="#A33D3D" stroke-width="5" marker-end="url(#arrowLoss)"/>
          <text x="362" y="126" text-anchor="middle" class="signal-label">δh · ∂h/∂x₁</text>
          <text x="362" y="401" text-anchor="middle" class="signal-label">δh · ∂h/∂x₂</text>

          <!-- central annotation -->
          <path d="M 600 332 L 600 382 L 500 382" fill="none" stroke="#CC6A00" stroke-width="2"/>
          <text x="520" y="414" class="callout">两路贡献在 h 相遇</text>
          <text x="520" y="439" class="callout-small">两项相加后，δh 才能继续向左传</text>

          <g transform="translate(1015 443)">
            <line x1="0" y1="0" x2="28" y2="0" stroke="#2457A6" stroke-width="3" opacity=".55"/>
            <text x="39" y="5" class="minor-label">前向连接</text>
            <line x1="150" y1="0" x2="178" y2="0" stroke="#A33D3D" stroke-width="5"/>
            <text x="189" y="5" class="minor-label">反向误差信号</text>
          </g>
        </svg>
      </section>

      <footer class="formula-band">
        <div class="formula" aria-label="隐藏节点误差等于两条输出路径贡献之和">
          <span class="lhs">δh</span><span>=</span><span class="term">δ₁ · ∂o₁/∂h</span><span class="op">+</span><span class="term">δ₂ · ∂o₂/∂h</span>
        </div>
        <div class="rule-copy">
          <strong>分支处做加法，不是二选一</strong>
          h 同时影响 o₁、o₂；损失沿两条路径对 h 的影响都要计入。
        </div>
      </footer>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:18,total:24});</script>
</body>
</html>
