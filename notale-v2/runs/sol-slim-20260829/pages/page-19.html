<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>逐节点传回梯度</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage > header{flex:0 0 auto}
    #stage > header .lead{margin-top:9px;max-width:55em}
    #grad-tracer{flex:1;min-height:0;margin-top:20px;display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:24px}
    #grad-tracer .graph-shell{min-width:0;min-height:0;display:flex;flex-direction:column;border:2px solid var(--rule);border-radius:var(--radius);background:var(--paper)}
    #grad-tracer .graph-top{height:54px;box-sizing:border-box;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule)}
    #grad-tracer .graph-top strong{font-size:var(--fs-sec)}
    #grad-tracer .graph-top .legend{gap:18px}
    #grad-tracer .model{flex:1;min-height:0;padding:8px 12px 0}
    #grad-tracer svg{display:block;width:100%;height:100%;overflow:visible}
    #grad-tracer .edge{fill:none;stroke:var(--rule-strong);stroke-width:2.5;marker-end:url(#gt-arrow-forward)}
    #grad-tracer .back-edge{fill:none;stroke:var(--loss);stroke-width:4;marker-end:url(#gt-arrow-back);opacity:0}
    #grad-tracer .back-edge.done{opacity:1}
    #grad-tracer .back-edge.current{opacity:1;stroke:var(--attention);stroke-dasharray:10 7}
    #grad-tracer .node rect{fill:var(--paper);stroke:var(--rule-strong);stroke-width:2}
    #grad-tracer .node.compute rect{fill:var(--model-soft);stroke:var(--model)}
    #grad-tracer .node.loss rect{fill:var(--loss-soft);stroke:var(--loss)}
    #grad-tracer .node text{font-family:var(--font-sans);fill:var(--text);text-anchor:middle;pointer-events:none}
    #grad-tracer .node .name{font-size:17px;font-weight:650}
    #grad-tracer .node .value{font-family:var(--font-num);font-size:22px;font-weight:600}
    #grad-tracer .node.target rect{stroke:var(--attention);stroke-width:4}
    #grad-tracer .node.available{cursor:pointer}
    #grad-tracer .node.available rect{stroke:var(--attention);stroke-width:4;stroke-dasharray:9 6}
    #grad-tracer .node.done rect{stroke:var(--loss);stroke-width:3}
    #grad-tracer .grad-label{font-family:var(--font-num);font-size:16px;font-weight:650;fill:var(--loss);text-anchor:middle}
    #grad-tracer .quiet-label{font-family:var(--font-sans);font-size:14px;fill:var(--muted);text-anchor:middle}
    #grad-tracer .direction{font-size:14px;font-weight:650;letter-spacing:.06em}
    #grad-tracer .forward{fill:var(--model)}
    #grad-tracer .backward{fill:var(--loss)}
    #grad-tracer .graph-foot{height:78px;box-sizing:border-box;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-top:1px solid var(--rule)}
    #grad-tracer .graph-foot .hint{max-width:560px}
    #grad-tracer .rail{min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px}
    #grad-tracer .rule-box{padding:18px 20px;border:2px solid var(--attention);border-radius:var(--radius);background:var(--attention-soft)}
    #grad-tracer .rule-box h2{font-size:var(--fs-h2);margin-bottom:13px}
    #grad-tracer .equation{display:grid;grid-template-columns:1fr 22px 1fr;align-items:center;gap:7px;margin-top:10px}
    #grad-tracer .term{min-width:0}
    #grad-tracer .term .cap{display:block;color:var(--muted);font-size:var(--fs-label);line-height:1.3}
    #grad-tracer .term .val{display:block;margin-top:4px;font:600 30px/1.1 var(--font-num);color:var(--text)}
    #grad-tracer .times{text-align:center;font-size:24px;color:var(--muted)}
    #grad-tracer .result{margin-top:15px;padding-top:13px;border-top:1px solid var(--rule-strong);display:flex;align-items:baseline;justify-content:space-between;gap:10px}
    #grad-tracer .result .val{font:650 34px/1 var(--font-num);color:var(--loss)}
    #grad-tracer .trace{flex:1;min-height:0;padding:17px 20px;border:2px solid var(--rule);border-radius:var(--radius);background:transparent;display:flex;flex-direction:column}
    #grad-tracer .trace h2{font-size:var(--fs-h2);margin-bottom:12px}
    #grad-tracer .trace-list{list-style:none;padding:0;margin:0;display:grid;gap:0}
    #grad-tracer .trace-list li{min-height:53px;box-sizing:border-box;padding:9px 0 9px 29px;position:relative;border-top:1px solid var(--rule);color:var(--muted);font-size:var(--fs-label);line-height:1.35}
    #grad-tracer .trace-list li:first-child{border-top:0}
    #grad-tracer .trace-list li::before{content:"";position:absolute;left:2px;top:16px;width:12px;height:12px;border:2px solid var(--rule-strong);border-radius:50%;background:var(--bg)}
    #grad-tracer .trace-list li.done{color:var(--text)}
    #grad-tracer .trace-list li.done::before{border-color:var(--loss);background:var(--loss)}
    #grad-tracer .trace-list li.current{color:#713A00;font-weight:650}
    #grad-tracer .trace-list li.current::before{border-color:var(--attention);background:var(--attention-soft)}
    #grad-tracer .trace-list .calc{display:block;margin-top:2px;font-family:var(--font-num);font-weight:600}
    #grad-tracer .conclusion{min-height:48px;margin-top:auto;padding-top:12px;border-top:1px solid var(--rule);color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
    #grad-tracer .conclusion.complete{color:var(--text);font-weight:600}
    #grad-tracer button:focus-visible,#grad-tracer .node:focus-visible rect{outline:none;stroke:var(--focus);stroke-width:5}
    #grad-tracer .sw.fwd{color:var(--model)}
    #grad-tracer .sw.bwd{color:var(--loss)}
  </style>
</head>
<body data-page="19" data-total="24">
  <div id="stage">
    <header>
      <p class="kicker">反向传播 · 局部计算</p>
      <h1>每个权重只接收两样东西</h1>
      <p class="lead">沿计算图向左传：把上游梯度乘上眼前这一步的局部导数。</p>
    </header>

    <main id="grad-tracer" class="min0" aria-label="逐节点传回梯度互动">
      <section class="graph-shell min0" aria-labelledby="graph-title">
        <div class="graph-top">
          <strong id="graph-title">固定的前向计算图</strong>
          <div class="legend" aria-label="图例">
            <span class="li"><i class="sw line fwd"></i>前向数值</span>
            <span class="li"><i class="sw line bwd"></i>反向梯度</span>
          </div>
        </div>
        <div class="model min0">
          <svg id="gt-svg" viewBox="0 0 1030 500" role="img" aria-labelledby="gt-svg-title gt-svg-desc">
            <title id="gt-svg-title">两次乘法和一个平方损失组成的计算图</title>
            <desc id="gt-svg-desc">输入二乘权重三得到中间值六，再乘权重负零点五得到预测负三；目标负一，平方损失为二。反向传播从损失向左逐步计算两个权重的梯度。</desc>
            <defs>
              <marker id="gt-arrow-forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2457A6"/></marker>
              <marker id="gt-arrow-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10Z" fill="context-stroke"/></marker>
            </defs>

            <text x="488" y="33" class="direction forward">前向计算</text>
            <text x="488" y="477" class="direction backward">梯度传回</text>

            <path class="edge" d="M135 220H245"/>
            <path class="edge" d="M135 330C190 330 196 275 245 275"/>
            <path class="edge" d="M385 247H493"/>
            <path class="edge" d="M383 365C448 365 455 295 493 295"/>
            <path class="edge" d="M635 270H752"/>
            <path class="edge" d="M840 315V358"/>
            <path class="edge" d="M930 403H965"/>

            <path class="back-edge" data-route="3" d="M272 294C238 333 196 350 136 350"/>
            <path class="back-edge" data-route="2" d="M510 314C468 360 435 382 383 382"/>
            <path class="back-edge" data-route="1" d="M512 330C470 410 407 429 345 407"/>
            <path class="back-edge" data-route="0" d="M760 250C708 250 684 277 635 288"/>

            <g class="node input" data-id="x" transform="translate(25 180)"><rect width="110" height="80" rx="6"/><text class="name" x="55" y="28">输入 x</text><text class="value" x="55" y="58">2</text></g>
            <g class="node input" data-id="w1" transform="translate(25 300)"><rect width="110" height="80" rx="6"/><text class="name" x="55" y="28">权重 w₁</text><text class="value" x="55" y="58">3</text></g>
            <g class="node compute" data-id="a" transform="translate(245 205)" tabindex="-1" role="button"><rect width="140" height="105" rx="6"/><text class="name" x="70" y="31">a = x · w₁</text><text class="value" x="70" y="68">6</text><text class="quiet-label" x="70" y="92">乘法节点</text></g>
            <g class="node input" data-id="w2" transform="translate(273 335)" tabindex="-1" role="button"><rect width="110" height="80" rx="6"/><text class="name" x="55" y="28">权重 w₂</text><text class="value" x="55" y="58">−0.5</text></g>
            <g class="node compute" data-id="y" transform="translate(493 225)" tabindex="-1" role="button"><rect width="142" height="105" rx="6"/><text class="name" x="71" y="31">ŷ = a · w₂</text><text class="value" x="71" y="68">−3</text><text class="quiet-label" x="71" y="92">预测节点</text></g>
            <g class="node input" data-id="t" transform="translate(785 358)"><rect width="145" height="90" rx="6"/><text class="name" x="72.5" y="31">目标 t</text><text class="value" x="72.5" y="65">−1</text></g>
            <g class="node loss" data-id="loss" transform="translate(752 185)"><rect width="178" height="130" rx="6"/><text class="name" x="89" y="31">L = ½(ŷ−t)²</text><text class="value" x="89" y="76">2</text><text class="quiet-label" x="89" y="107">起点 ∂L/∂L = 1</text></g>

            <text id="grad-y" class="grad-label" x="697" y="225"></text>
            <text id="grad-w2" class="grad-label" x="444" y="414"></text>
            <text id="grad-a" class="grad-label" x="438" y="352"></text>
            <text id="grad-w1" class="grad-label" x="206" y="398"></text>
          </svg>
        </div>
        <div class="graph-foot">
          <p id="gt-hint" class="hint">从损失出发。点击虚线框中的节点，或用按钮传回一站。</p>
          <div class="btns">
            <button id="gt-next" class="btn" type="button">传回到预测 ŷ</button>
            <button id="gt-reset" class="btn" type="button">恢复初始图</button>
          </div>
        </div>
      </section>

      <aside class="rail min0" aria-label="当前局部计算与轨迹">
        <section class="rule-box" aria-labelledby="local-title">
          <h2 id="local-title">当前只算这一小段</h2>
          <p id="local-name" class="small" aria-live="polite">损失 L → 预测 ŷ</p>
          <div class="equation" aria-label="上游梯度乘局部导数">
            <span class="term"><span class="cap">上游梯度</span><span id="upstream" class="val">1</span></span>
            <span class="times">×</span>
            <span class="term"><span class="cap">局部导数</span><span id="local" class="val">−2</span></span>
          </div>
          <div class="result"><span class="small">将得到</span><span id="result" class="val">∂L/∂ŷ = −2</span></div>
        </section>

        <section class="trace" aria-labelledby="trace-title">
          <h2 id="trace-title">传回轨迹</h2>
          <ol class="trace-list">
            <li data-log="0">把误差传给预测<span class="calc">1 × (ŷ−t) = −2</span></li>
            <li data-log="1">算权重 w₂ 的梯度<span class="calc">−2 × a = −12</span></li>
            <li data-log="2">把梯度传给中间值 a<span class="calc">−2 × w₂ = 1</span></li>
            <li data-log="3">算权重 w₁ 的梯度<span class="calc">1 × x = 2</span></li>
          </ol>
          <p id="gt-conclusion" class="conclusion">图的结构不变；每一站只读取相邻的上游梯度和局部导数。</p>
        </section>
      </aside>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      const root = document.getElementById('grad-tracer');
      const q = s => root.querySelector(s);
      const qa = s => [...root.querySelectorAll(s)];
      const initial = () => ({ step: 0, destroyed: false });
      let state = initial();
      const controller = new AbortController();
      const steps = [
        { target:'y', name:'损失 L → 预测 ŷ', up:'1', local:'−2', result:'∂L/∂ŷ = −2', button:'计算权重 w₂ 的梯度', status:'预测节点收到梯度负二。下一站计算权重 w₂。' },
        { target:'w2', name:'预测 ŷ → 权重 w₂', up:'−2', local:'6', result:'∂L/∂w₂ = −12', button:'传回到中间值 a', status:'权重 w₂ 的梯度是负十二。它只用了上游梯度负二和局部导数六。' },
        { target:'a', name:'预测 ŷ → 中间值 a', up:'−2', local:'−0.5', result:'∂L/∂a = 1', button:'计算权重 w₁ 的梯度', status:'中间值 a 收到梯度一。下一站计算权重 w₁。' },
        { target:'w1', name:'中间值 a → 权重 w₁', up:'1', local:'2', result:'∂L/∂w₁ = 2', button:'已传完两个权重', status:'完成。权重 w₁ 的梯度是二，权重 w₂ 的梯度是负十二。' }
      ];
      const gradText = ['−2','−12','1','2'];
      const gradIds = ['#grad-y','#grad-w2','#grad-a','#grad-w1'];

      function render(announce=false){
        const complete = state.step === steps.length;
        const view = steps[Math.min(state.step, steps.length - 1)];
        q('#local-name').textContent = complete ? '两个权重都已收到梯度' : view.name;
        q('#upstream').textContent = view.up;
        q('#local').textContent = view.local;
        q('#result').textContent = view.result;
        q('#gt-next').textContent = complete ? '已完成传回' : view.button.replace('计算权重 w₂ 的梯度','传回到预测 ŷ');
        if(state.step === 1) q('#gt-next').textContent = '计算权重 w₂ 的梯度';
        q('#gt-next').disabled = complete;
        qa('.back-edge').forEach(el => { const i = Number(el.dataset.route); el.classList.toggle('done', i < state.step); el.classList.toggle('current', i === state.step && !complete); });
        qa('.node[role="button"]').forEach(el => {
          const isDone = steps.slice(0,state.step).some(s => s.target === el.dataset.id);
          const available = !complete && el.dataset.id === view.target;
          el.classList.toggle('done', isDone);
          el.classList.toggle('available', available);
          el.classList.toggle('target', available);
          el.setAttribute('tabindex', available ? '0' : '-1');
          el.setAttribute('aria-disabled', available ? 'false' : 'true');
          el.setAttribute('aria-label', available ? `传回到${view.name.split('→')[1].trim()}` : el.dataset.id);
        });
        gradIds.forEach((id,i) => q(id).textContent = i < state.step ? gradText[i] : '');
        qa('[data-log]').forEach((el,i) => { el.classList.toggle('done', i < state.step); el.classList.toggle('current', i === state.step && !complete); });
        q('#gt-hint').textContent = complete ? '反向路径保留在图上，两个权重的梯度都可追溯到一次局部乘法。' : '点击虚线框中的节点，或用按钮传回一站。';
        q('#gt-conclusion').classList.toggle('complete', complete);
        q('#gt-conclusion').textContent = complete ? 'w₂：−2 × 6 = −12；w₁：1 × 2 = 2。两次都只用了上游梯度与本地输入。' : '图的结构不变；每一站只读取相邻的上游梯度和局部导数。';
      }
      function advance(){
        if(state.destroyed || state.step >= steps.length) return;
        state = {...state, step: state.step + 1};
        render(true);
      }
      function reset(){
        if(state.destroyed) return;
        state = initial();
        render(false);
      }
      q('#gt-next').addEventListener('click', advance, {signal:controller.signal});
      q('#gt-reset').addEventListener('click', reset, {signal:controller.signal});
      qa('.node[role="button"]').forEach(el => {
        el.addEventListener('click', () => { if(el.classList.contains('available')) advance(); }, {signal:controller.signal});
        el.addEventListener('keydown', e => {
          if((e.key === 'Enter' || e.key === ' ') && el.classList.contains('available')){ e.preventDefault(); e.stopPropagation(); advance(); }
        }, {signal:controller.signal});
      });
      function destroy(){ if(state.destroyed) return; state.destroyed = true; controller.abort(); }
      window.addEventListener('pagehide', destroy, {once:true});
      render();
      Deck.init({index:19,total:24});
    })();
  </script>
</body>
</html>
