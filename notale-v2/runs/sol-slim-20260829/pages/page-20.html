<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .page-head{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px;border-bottom:1px solid var(--rule);padding-bottom:18px}
    .page-head .lead{max-width:570px;padding-bottom:3px;color:var(--muted)}
    .loop-field{position:relative;flex:1;min-height:0;margin-top:24px;border:2px solid var(--rule);border-radius:var(--radius);background:var(--paper);overflow:hidden}
    .loop-field svg{display:block;width:100%;height:100%}
    .node-title{font-family:var(--font-display);font-size:25px;font-weight:650;fill:var(--text)}
    .node-copy{font-family:var(--font-sans);font-size:16px;fill:var(--muted)}
    .math{font-family:var(--font-num);font-size:20px;font-weight:600;fill:var(--text)}
    .lane-label{font-family:var(--font-display);font-size:17px;font-weight:650;letter-spacing:.06em}
    .center-kicker{font-family:var(--font-display);font-size:15px;font-weight:650;letter-spacing:.11em;fill:var(--muted)}
    .center-main{font-family:var(--font-display);font-size:34px;font-weight:650;fill:var(--text)}
    .center-copy{font-family:var(--font-sans);font-size:17px;fill:var(--muted)}
    .repeat-note{position:absolute;right:28px;bottom:20px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:var(--fs-label)}
    .repeat-note::before{content:"";width:28px;border-top:3px solid var(--attention)}
  </style>
</head>
<body data-page="20" data-total="24">
  <div id="stage">
    <header class="page-head">
      <div>
        <p class="kicker">一次完整训练</p>
        <h1>学习是一条反复运行的计算闭环</h1>
      </div>
      <p class="lead">先得到预测，再用误差追查每个参数的责任；参数更新后，同一批计算重新开始。</p>
    </header>

    <main class="loop-field min0" aria-labelledby="loop-title">
      <svg viewBox="0 0 1484 684" role="img" aria-labelledby="loop-title loop-desc">
        <title id="loop-title">神经网络一次训练迭代的闭环</title>
        <desc id="loop-desc">流程依次为前向计算、求损失、反向求梯度、更新参数，然后用新参数重新前向计算。</desc>
        <defs>
          <marker id="arrow-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2457A6"/></marker>
          <marker id="arrow-loss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A33D3D"/></marker>
          <marker id="arrow-attn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#CC6A00"/></marker>
        </defs>

        <text x="92" y="64" class="lane-label" fill="#2457A6">正向：用当前参数算出结果</text>
        <text x="92" y="650" class="lane-label" fill="#A33D3D">反向：把误差分摊给每个参数</text>

        <path d="M 350 196 H 564" fill="none" stroke="#2457A6" stroke-width="5" marker-end="url(#arrow-model)"/>
        <path d="M 878 196 H 1092" fill="none" stroke="#A33D3D" stroke-width="5" marker-end="url(#arrow-loss)"/>
        <path d="M 1248 275 V 424" fill="none" stroke="#A33D3D" stroke-width="5" marker-end="url(#arrow-loss)"/>
        <path d="M 1092 511 H 878" fill="none" stroke="#A33D3D" stroke-width="5" marker-end="url(#arrow-loss)"/>
        <path d="M 564 511 H 350" fill="none" stroke="#CC6A00" stroke-width="5" marker-end="url(#arrow-attn)"/>
        <path d="M 194 424 V 275" fill="none" stroke="#CC6A00" stroke-width="5" marker-end="url(#arrow-attn)"/>

        <g transform="translate(38 116)">
          <rect width="312" height="160" rx="6" fill="#DCE7F5" stroke="#2457A6" stroke-width="2"/>
          <text x="24" y="42" class="node-title">前向计算</text>
          <text x="24" y="75" class="node-copy">输入逐层经过权重与激活函数</text>
          <text x="24" y="121" class="math">x → ŷ</text>
        </g>

        <g transform="translate(564 116)">
          <rect width="314" height="160" rx="6" fill="#F1DDDD" stroke="#A33D3D" stroke-width="2"/>
          <text x="24" y="42" class="node-title">求损失</text>
          <text x="24" y="75" class="node-copy">比较预测 ŷ 与目标 y 的差距</text>
          <text x="24" y="121" class="math">L(ŷ, y)</text>
        </g>

        <g transform="translate(1092 116)">
          <rect width="312" height="160" rx="6" fill="#F1DDDD" stroke="#A33D3D" stroke-width="2"/>
          <text x="24" y="42" class="node-title">反向求梯度</text>
          <text x="24" y="75" class="node-copy">链式法则把损失逐层传回</text>
          <text x="24" y="121" class="math">∂L / ∂θ</text>
        </g>

        <g transform="translate(1092 424)">
          <rect width="312" height="174" rx="6" fill="#F1DDDD" stroke="#A33D3D" stroke-width="2"/>
          <text x="24" y="42" class="node-title">得到参数方向</text>
          <text x="24" y="75" class="node-copy">梯度指出参数增大时损失如何变</text>
          <text x="24" y="125" class="math">∇θL</text>
        </g>

        <g transform="translate(564 424)">
          <rect width="314" height="174" rx="6" fill="#F5E5D2" stroke="#CC6A00" stroke-width="2"/>
          <text x="24" y="42" class="node-title">更新参数</text>
          <text x="24" y="75" class="node-copy">沿降低损失的方向迈一小步</text>
          <text x="24" y="125" class="math">θ ← θ − η∇θL</text>
        </g>

        <g transform="translate(38 424)">
          <rect width="312" height="174" rx="6" fill="#F5E5D2" stroke="#CC6A00" stroke-width="2"/>
          <text x="24" y="42" class="node-title">带新参数重复</text>
          <text x="24" y="75" class="node-copy">下一轮前向计算从更新后的 θ 开始</text>
          <text x="24" y="125" class="math">θ<tspan baseline-shift="sub" font-size="14">t+1</tspan> → ŷ<tspan baseline-shift="sub" font-size="14">new</tspan></text>
        </g>

        <g text-anchor="middle">
          <text x="721" y="326" class="center-kicker">一轮训练迭代</text>
          <text x="721" y="369" class="center-main">算结果 → 找责任 → 改参数</text>
          <text x="721" y="403" class="center-copy">损失不直接修改预测，它先产生梯度，再由优化器更新参数。</text>
        </g>
      </svg>
      <div class="repeat-note">训练数据按批次进入闭环，直到满足停止条件</div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:20,total:24});</script>
</body>
</html>
