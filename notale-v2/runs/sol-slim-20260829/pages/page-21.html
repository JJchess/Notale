<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{gap:0}
    .page-head{flex:0 0 116px;display:flex;align-items:flex-end;justify-content:space-between;gap:40px;border-bottom:2px solid var(--rule);padding-bottom:18px}
    .page-head .lead{max-width:530px;padding-bottom:2px;color:var(--muted)}
    #trainer{flex:1;min-height:0;padding-top:18px;display:grid;grid-template-rows:52px minmax(0,1fr) 132px;gap:14px}
    #trainer .rail{display:flex;align-items:center;gap:10px;min-width:0}
    #trainer .run{border-color:var(--model);background:var(--model);color:#fff;min-width:138px}
    #trainer .run:hover{border-color:#163f82}
    #trainer .iter{margin-left:8px;color:var(--muted);font-size:var(--fs-label);white-space:nowrap}
    #trainer .iter strong{color:var(--text);font:600 22px/1 var(--font-num)}
    #trainer .status{margin-left:auto;min-width:390px;text-align:right;color:var(--muted);font-size:var(--fs-sec)}
    #trainer .status b{color:var(--text)}
    #trainer .main{display:grid;grid-template-columns:minmax(0,1.48fr) minmax(430px,.82fr);gap:24px;min-height:0}
    #trainer .field{position:relative;min-height:0;border:2px solid var(--rule);border-radius:var(--radius);background:var(--paper);overflow:hidden}
    #trainer .field-head{position:absolute;z-index:2;left:20px;right:20px;top:14px;display:flex;justify-content:space-between;align-items:start;pointer-events:none}
    #trainer h2{font-size:var(--fs-h2)}
    #trainer .field-note{font-size:var(--fs-label);color:var(--muted);text-align:right;line-height:1.35}
    #trainer #map{position:absolute;inset:54px 18px 16px;width:calc(100% - 36px);height:calc(100% - 70px)}
    #trainer .side{display:grid;grid-template-rows:196px minmax(0,1fr);gap:14px;min-height:0}
    #trainer .network,#trainer .grad{border:2px solid var(--rule);border-radius:var(--radius);background:var(--paper);min-height:0;overflow:hidden}
    #trainer .network{position:relative;padding:14px 16px}
    #trainer .network h2,#trainer .grad h2{font-size:22px}
    #trainer #net{width:100%;height:132px;display:block}
    #trainer .grad{padding:14px 16px;display:flex;flex-direction:column}
    #trainer .grad-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
    #trainer .formula{font:500 var(--fs-label)/1.35 var(--font-num);color:var(--muted);white-space:nowrap}
    #trainer .formula em{font-style:normal;color:var(--loss)}
    #trainer .contrib{display:grid;grid-template-columns:54px minmax(0,1fr) 76px;gap:6px 10px;align-items:center;margin-top:12px;font-size:var(--fs-label)}
    #trainer .sample{font-family:var(--font-num);color:var(--muted)}
    #trainer .gtrack{height:12px;position:relative;background:var(--paper-deep);border-radius:2px}
    #trainer .gtrack::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--rule-strong)}
    #trainer .gbar{position:absolute;top:2px;height:8px;background:var(--loss)}
    #trainer .gval{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
    #trainer .sumline{margin-top:auto;padding-top:10px;border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
    #trainer .sumline .label{font-size:var(--fs-label);color:var(--muted)}
    #trainer .sumline .value{font:600 20px/1.2 var(--font-num)}
    #trainer .sumline .update{color:var(--model)}
    #trainer .history{border-top:2px solid var(--rule);display:grid;grid-template-columns:205px minmax(0,1fr);gap:20px;padding-top:12px;min-height:0}
    #trainer .history-copy{display:flex;flex-direction:column;justify-content:center}
    #trainer .lossread{font:600 36px/1 var(--font-num);color:var(--loss);margin-top:5px}
    #trainer #lossPlot{width:100%;height:100%;display:block;overflow:visible}
    #trainer svg text{font-family:var(--font-sans);fill:var(--muted);font-size:15px}
    #trainer svg .mono{font-family:var(--font-num);font-variant-numeric:tabular-nums}
    #trainer button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
    @media (prefers-reduced-motion:reduce){#trainer *{transition:none!important}}
  </style>
</head>
<body data-page="21" data-total="24">
  <div id="stage">
    <header class="page-head">
      <div>
        <p class="kicker">反向传播 · 全批量训练</p>
        <h1>四份局部梯度，合成网络的一次学习</h1>
      </div>
      <p class="lead">训练同一个 XOR 小网络：每次更新都同时改变损失、决策区域和参数。</p>
    </header>

    <section id="trainer" aria-label="小型神经网络训练实验">
      <div class="rail" aria-label="训练控制">
        <button class="btn" id="stepBtn" type="button">训练 1 次</button>
        <button class="btn run" id="runBtn" type="button" aria-pressed="false">连续训练 25 次</button>
        <button class="btn" id="resetBtn" type="button">重置网络</button>
        <span class="iter">更新次数 <strong id="iter">0</strong></span>
        <div class="status" id="status" aria-live="polite"><b>当前判对 2 / 4</b>　训练集固定，四个样本共同决定更新</div>
      </div>

      <div class="main min0">
        <section class="field min0" aria-labelledby="fieldTitle">
          <div class="field-head">
            <h2 id="fieldTitle">决策结果</h2>
            <div class="field-note">蓝色越深，输出 ŷ 越接近 1<br>圆点 y=1　方点 y=0</div>
          </div>
          <svg id="map" viewBox="0 0 800 420" role="img" aria-label="XOR 网络在二维输入平面上的预测区域"></svg>
        </section>

        <aside class="side min0">
          <section class="network" aria-labelledby="networkTitle">
            <h2 id="networkTitle">同一时刻的网络</h2>
            <svg id="net" viewBox="0 0 460 150" role="img" aria-label="两个输入、两个隐藏神经元和一个输出的网络"></svg>
          </section>
          <section class="grad" aria-labelledby="gradTitle">
            <div class="grad-top">
              <h2 id="gradTitle">输出权重 v₁ 的梯度累积</h2>
              <div class="formula"><em>(ŷ−y)</em> · h₁</div>
            </div>
            <div class="contrib" id="contrib" aria-label="四个训练样本对梯度的贡献"></div>
            <div class="sumline">
              <span class="label">取四份贡献的平均</span><span class="value" id="gmean">0.000</span>
              <span class="label">参数更新 Δv₁ = −η · 平均梯度</span><span class="value update" id="delta">0.000</span>
            </div>
          </section>
        </aside>
      </div>

      <section class="history" aria-labelledby="lossTitle">
        <div class="history-copy">
          <div class="small" id="lossTitle">平均交叉熵损失</div>
          <div class="lossread" id="loss">0.659</div>
          <div class="note">横轴：更新次数　固定学习率 η = 1.2</div>
        </div>
        <svg id="lossPlot" viewBox="0 0 1240 112" role="img" aria-label="训练过程中平均损失的历史曲线"></svg>
      </section>
    </section>
  </div>
  <script src="assets/base.js"></script>
  <script>
  (()=>{
    const root=document.getElementById('trainer');
    const $=s=>root.querySelector(s);
    const X=[[0,0],[0,1],[1,0],[1,1]],Y=[0,1,1,0],lr=1.2;
    const initial=()=>({w:[[2.4,-2.2],[-2.0,2.5]],b:[-.7,-.8],v:[1.6,1.7],bo:-.8,iter:0,history:[],last:null,running:false});
    let state=initial(),timer=null,destroyed=false;
    const sig=z=>1/(1+Math.exp(-z));
    function forward(x,s=state){const h=s.w.map((r,j)=>sig(r[0]*x[0]+r[1]*x[1]+s.b[j]));return {h,p:sig(s.v[0]*h[0]+s.v[1]*h[1]+s.bo)}}
    function evaluate(s=state){
      const rows=X.map((x,i)=>{const q=forward(x,s);return {...q,x,y:Y[i],g:(q.p-Y[i])*q.h[0]}});
      const loss=rows.reduce((a,r)=>a-(r.y*Math.log(Math.max(r.p,1e-9))+(1-r.y)*Math.log(Math.max(1-r.p,1e-9))),0)/4;
      const correct=rows.filter(r=>(r.p>=.5?1:0)===r.y).length;
      return {rows,loss,correct,gmean:rows.reduce((a,r)=>a+r.g,0)/4};
    }
    function trainOne(){
      const ev=evaluate(),gw=[[0,0],[0,0]],gb=[0,0],gv=[0,0];let gbo=0;
      ev.rows.forEach(r=>{const dz=r.p-r.y;gbo+=dz;for(let j=0;j<2;j++){gv[j]+=dz*r.h[j];const dh=dz*state.v[j]*r.h[j]*(1-r.h[j]);gb[j]+=dh;for(let k=0;k<2;k++)gw[j][k]+=dh*r.x[k]}});
      state.last={rows:ev.rows.map(r=>({...r})),gmean:ev.gmean,delta:-lr*ev.gmean};
      state.bo-=lr*gbo/4;
      for(let j=0;j<2;j++){state.v[j]-=lr*gv[j]/4;state.b[j]-=lr*gb[j]/4;for(let k=0;k<2;k++)state.w[j][k]-=lr*gw[j][k]/4}
      state.iter++;state.history.push(evaluate().loss);if(state.history.length>220)state.history.shift();render();
    }
    function stop(){if(timer){clearInterval(timer);timer=null}state.running=false;$('#runBtn').setAttribute('aria-pressed','false');$('#runBtn').textContent='连续训练 25 次'}
    function run(){
      if(state.running){stop();render();return}
      state.running=true;let remaining=25;$('#runBtn').setAttribute('aria-pressed','true');$('#runBtn').textContent='暂停训练';
      const tick=()=>{if(!state.running||destroyed)return;trainOne();remaining--;if(remaining<=0){stop();render();$('#status').setAttribute('data-announcement',`连续训练完成，当前判对 ${evaluate().correct} 个样本，损失 ${evaluate().loss.toFixed(3)}`)}};
      tick();if(remaining>0)timer=setInterval(tick,Deck.reduced()?40:180);
    }
    function reset(){stop();state=initial();render();$('#status').setAttribute('data-announcement','网络已重置到相同初始参数')}
    function el(name,attrs={},text=''){const n=document.createElementNS('http://www.w3.org/2000/svg',name);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(text)n.textContent=text;return n}
    function renderMap(ev){
      const svg=$('#map');svg.replaceChildren();const x0=74,y0=22,W=664,H=344,n=18;
      svg.append(el('rect',{x:x0,y:y0,width:W,height:H,fill:'#F8FAFB',stroke:'#AEBBC1','stroke-width':2}));
      for(let iy=0;iy<n;iy++)for(let ix=0;ix<n;ix++){
        const x=ix/(n-1),y=1-iy/(n-1),p=forward([x,y]).p;
        svg.append(el('rect',{x:x0+ix*W/n,y:y0+iy*H/n,width:W/n+.5,height:H/n+.5,fill:'#2457A6','fill-opacity':Math.max(0,(p-.35)*1.35).toFixed(2)}));
      }
      [0,.5,1].forEach(t=>{
        const xx=x0+t*W,yy=y0+(1-t)*H;
        svg.append(el('line',{x1:xx,y1:y0,x2:xx,y2:y0+H,stroke:'#AEBBC1','stroke-width':1,'stroke-opacity':.65}));
        svg.append(el('line',{x1:x0,y1:yy,x2:x0+W,y2:yy,stroke:'#AEBBC1','stroke-width':1,'stroke-opacity':.65}));
        svg.append(el('text',{x:xx,y:y0+H+24,'text-anchor':'middle',class:'mono'},t.toFixed(1)));
        svg.append(el('text',{x:x0-14,y:yy+5,'text-anchor':'end',class:'mono'},t.toFixed(1)));
      });
      svg.append(el('text',{x:x0+W/2,y:414,'text-anchor':'middle'},'输入 x₁'));
      svg.append(el('text',{x:18,y:y0+H/2,'text-anchor':'middle',transform:`rotate(-90 18 ${y0+H/2})`},'输入 x₂'));
      ev.rows.forEach(r=>{const cx=x0+r.x[0]*W,cy=y0+(1-r.x[1])*H,ok=(r.p>=.5?1:0)===r.y;
        if(r.y===1)svg.append(el('circle',{cx,cy,r:16,fill:'#15222A',stroke:'#F8FAFB','stroke-width':4}));
        else svg.append(el('rect',{x:cx-15,y:cy-15,width:30,height:30,fill:'#F8FAFB',stroke:'#15222A','stroke-width':4}));
        svg.append(el('text',{x:cx+(r.x[0]===0?24:-24),y:cy+(r.x[1]===0?-21:31),'text-anchor':r.x[0]===0?'start':'end',class:'mono',fill:ok?'#15222A':'#A33D3D'},`ŷ ${r.p.toFixed(2)}`));
      });
    }
    function renderNet(ev){
      const svg=$('#net');svg.replaceChildren();const xs=[55,225,405],ys=[[48,112],[48,112],[80]];
      const vals=[['x₁','x₂'],[ev.rows[3].h[0].toFixed(2),ev.rows[3].h[1].toFixed(2)],[ev.rows[3].p.toFixed(2)]];
      for(let a=0;a<2;a++)for(let b=0;b<2;b++)svg.append(el('line',{x1:xs[0]+20,y1:ys[0][a],x2:xs[1]-20,y2:ys[1][b],stroke:'#73858E','stroke-width':Math.min(6,1+Math.abs(state.w[b][a])*1.2),'stroke-opacity':.7}));
      for(let b=0;b<2;b++)svg.append(el('line',{x1:xs[1]+20,y1:ys[1][b],x2:xs[2]-22,y2:ys[2][0],stroke:b===0?'#A33D3D':'#73858E','stroke-width':Math.min(7,1+Math.abs(state.v[b])*1.4)}));
      [['输入',xs[0]],['隐藏层',xs[1]],['输出 ŷ',xs[2]]].forEach(a=>svg.append(el('text',{x:a[1],y:16,'text-anchor':'middle'},a[0])));
      for(let c=0;c<3;c++)ys[c].forEach((y,i)=>{svg.append(el(c===2?'rect':'circle',c===2?{x:xs[c]-24,y:y-22,width:48,height:44,rx:5,fill:c===1?'#DCE7F5':'#F8FAFB',stroke:c===2?'#2457A6':'#15222A','stroke-width':2}:{cx:xs[c],cy:y,r:21,fill:c===1?'#DCE7F5':'#F8FAFB',stroke:'#15222A','stroke-width':2}));svg.append(el('text',{x:xs[c],y:y+5,'text-anchor':'middle',class:'mono'},vals[c][i]))});
      svg.append(el('text',{x:316,y:48,'text-anchor':'middle',fill:'#A33D3D',class:'mono'},`v₁ ${state.v[0].toFixed(2)}`));
      svg.append(el('text',{x:230,y:145,'text-anchor':'middle'},'读数以样本 (1,1) 为例'));
    }
    function renderGrad(ev){
      const box=$('#contrib');box.replaceChildren();const rows=(state.last?state.last.rows:ev.rows),max=Math.max(.32,...rows.map(r=>Math.abs(r.g)));
      rows.forEach((r,i)=>{const lab=document.createElement('span');lab.className='sample';lab.textContent=`(${r.x.join(',')})`;const track=document.createElement('span');track.className='gtrack';const bar=document.createElement('i');bar.className='gbar';const pct=Math.abs(r.g)/max*48;bar.style.width=pct+'%';bar.style.left=(r.g<0?50-pct:50)+'%';track.append(bar);const val=document.createElement('span');val.className='gval';val.textContent=(r.g>=0?'+':'')+r.g.toFixed(3);box.append(lab,track,val)});
      const gm=state.last?state.last.gmean:ev.gmean;$('#gmean').textContent=(gm>=0?'+':'')+gm.toFixed(3);$('#delta').textContent=((state.last?state.last.delta:-lr*gm)>=0?'+':'')+(state.last?state.last.delta:-lr*gm).toFixed(3);
    }
    function renderHistory(ev){
      const svg=$('#lossPlot');svg.replaceChildren();const all=[.72,...state.history],W=1240,H=112,left=8,right=14,top=8,bottom=24,max=.75,min=0;
      [0,.35,.7].forEach(v=>{const y=top+(max-v)/(max-min)*(H-top-bottom);svg.append(el('line',{x1:left,y1:y,x2:W-right,y2:y,stroke:'#AEBBC1','stroke-width':1}));svg.append(el('text',{x:W-right,y:y-4,'text-anchor':'end',class:'mono'},v.toFixed(2)))});
      if(state.history.length){const pts=state.history.map((v,i)=>`${left+i/Math.max(210,state.history.length-1)*(W-left-right)},${top+(max-Math.min(max,v))/(max-min)*(H-top-bottom)}`).join(' ');svg.append(el('polyline',{points:pts,fill:'none',stroke:'#A33D3D','stroke-width':4,'stroke-linejoin':'round','stroke-linecap':'round'}));const last=pts.split(' ').pop().split(',');svg.append(el('circle',{cx:last[0],cy:last[1],r:5,fill:'#A33D3D'}))}else svg.append(el('text',{x:20,y:57},'训练后，损失轨迹会从这里延伸'));
    }
    function render(){const ev=evaluate();$('#iter').textContent=state.iter;$('#loss').textContent=ev.loss.toFixed(3);$('#status').innerHTML=`<b>当前判对 ${ev.correct} / 4</b>　训练集固定，四个样本共同决定更新`;renderMap(ev);renderNet(ev);renderGrad(ev);renderHistory(ev)}
    $('#stepBtn').addEventListener('click',()=>{stop();trainOne();$('#status').setAttribute('data-announcement',`完成第 ${state.iter} 次更新，判对 ${evaluate().correct} 个样本`)});
    $('#runBtn').addEventListener('click',run);$('#resetBtn').addEventListener('click',reset);
    document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
    window.addEventListener('pagehide',()=>{destroyed=true;stop()},{once:true});
    Deck.init({index:21,total:24});render();
  })();
  </script>
</body>
</html>
