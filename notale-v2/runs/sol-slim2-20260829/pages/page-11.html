<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .title-zone{flex:0 0 auto;max-width:1180px}.title-zone h1{max-width:1120px}.title-zone .lead{margin-top:12px;color:var(--muted)}
    .search-field{position:relative;flex:1;min-height:0;margin-top:20px;border-top:2px solid var(--text);border-bottom:1px solid var(--rule);background:var(--paper)}
    .map{position:absolute;inset:0 390px 0 0}.map svg{width:100%;height:100%;display:block}.axis-label{font-family:var(--font-sans);font-size:17px;fill:var(--muted)}.map-label{font-family:var(--font-sans);font-size:18px;font-weight:650;fill:var(--text)}.point-label{font-family:var(--font-num);font-size:18px;font-weight:600;fill:var(--text)}.loss-label{font-family:var(--font-display);font-size:22px;font-weight:650;fill:var(--loss)}
    .rail{position:absolute;right:0;top:0;bottom:0;width:390px;box-sizing:border-box;border-left:1px solid var(--rule);padding:30px 30px 26px;display:flex;flex-direction:column;justify-content:space-between}.rail h2{font-size:var(--fs-h2);margin-bottom:14px}.rail .question{font-size:var(--fs-lead);line-height:1.45;color:var(--text)}.rail .answer{margin-top:14px;color:var(--model);font-family:var(--font-display);font-size:28px;font-weight:650;line-height:1.28}.not-rule{padding-top:20px;border-top:1px solid var(--rule)}.not-rule .label{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:var(--fs-label);font-weight:650;letter-spacing:.04em}.strike{width:26px;height:2px;background:var(--loss);transform:rotate(-18deg);flex:0 0 auto}.not-rule p{margin-top:9px;font-size:var(--fs-sec);line-height:1.48;color:var(--muted)}
    .update-strip{position:absolute;left:42px;right:424px;bottom:24px;display:flex;align-items:center;gap:13px;padding:13px 16px;border:1px solid var(--rule);background:rgba(248,250,251,.94);font-size:var(--fs-label);color:var(--muted)}.update-strip strong{color:var(--text);font-size:var(--fs-sec)}.update-strip .eq{margin-left:auto;color:var(--model);font-family:var(--font-num);font-size:18px;white-space:nowrap}
  </style>
</head>
<body data-page="11" data-total="24">
  <div id="stage">
    <header class="title-zone"><p class="kicker">训练的几何视角</p><h1>学习，就是在参数空间里走向更低的损失</h1><p class="lead">一组权重对应一个位置；训练反复调整权重，让预测误差下降。</p></header>
    <main class="search-field min0" aria-label="参数空间中的损失下降示意图">
      <figure class="map min0" style="margin:0">
        <svg viewBox="0 0 1098 650" role="img" aria-labelledby="mapTitle mapDesc">
          <title id="mapTitle">参数空间中的下降路径</title><desc id="mapDesc">同心损失等高线从外向内降低。参数从初始位置沿梯度方向逐步移动到低损失区域。</desc>
          <defs><marker id="arrowLoss" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#A33D3D"/></marker><marker id="arrowModel" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#2457A6"/></marker></defs>
          <line x1="92" y1="548" x2="1002" y2="548" stroke="#73858E" stroke-width="2"/><line x1="92" y1="548" x2="92" y2="68" stroke="#73858E" stroke-width="2"/><path d="M1002 548 l-12 -6 v12 z" fill="#73858E"/><path d="M92 68 l-6 12 h12 z" fill="#73858E"/><text x="925" y="581" class="axis-label">参数方向 θ₁</text><text x="35" y="100" class="axis-label" transform="rotate(-90 35 100)">参数方向 θ₂</text>
          <path d="M178 251 C239 119 478 76 721 123 C919 161 1001 305 908 423 C811 546 544 535 318 466 C150 414 117 331 178 251Z" fill="#F1DDDD" fill-opacity=".52" stroke="#A33D3D" stroke-width="2"/><path d="M260 267 C310 170 486 142 675 174 C824 199 889 300 820 386 C747 477 555 464 390 421 C268 389 221 337 260 267Z" fill="#F8FAFB" stroke="#AEBBC1" stroke-width="2"/><path d="M350 279 C393 218 504 205 621 225 C715 241 763 298 722 350 C677 406 562 398 459 375 C380 357 322 320 350 279Z" fill="#DCE7F5" fill-opacity=".72" stroke="#73858E" stroke-width="2"/><path d="M449 287 C476 257 536 252 595 265 C644 276 665 306 643 332 C617 362 558 357 505 345 C463 336 431 308 449 287Z" fill="#C7D8EE" stroke="#2457A6" stroke-width="2.5"/>
          <text x="202" y="202" class="loss-label">高损失</text><line x1="262" y1="211" x2="331" y2="248" stroke="#A33D3D" stroke-width="2" marker-end="url(#arrowLoss)"/><text x="509" y="316" class="map-label" fill="#2457A6">低损失区域</text>
          <path d="M804 182 C748 200 773 251 708 262 S664 330 610 333 S566 309 537 314" fill="none" stroke="#2457A6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowModel)"/><circle cx="804" cy="182" r="10" fill="#F8FAFB" stroke="#2457A6" stroke-width="4"/><circle cx="708" cy="262" r="7" fill="#2457A6"/><circle cx="610" cy="333" r="7" fill="#2457A6"/><circle cx="537" cy="314" r="11" fill="#2457A6"/><text x="820" y="174" class="point-label">θ₀</text><text x="679" y="244" class="point-label">θ₁</text><text x="575" y="366" class="point-label">θ₂</text><text x="507" y="290" class="point-label">θ*</text><text x="752" y="330" class="map-label" fill="#2457A6">每一步都让 L(θ) 下降</text><path d="M753 338 C716 354 687 354 650 345" fill="none" stroke="#2457A6" stroke-width="2" marker-end="url(#arrowModel)"/>
        </svg>
      </figure>
      <div class="update-strip" aria-label="一次参数更新"><strong>一次更新</strong><span>计算当前位置的坡度，再向损失下降的方向移动</span><span class="eq">θ ← θ − η∇L(θ)</span></div>
      <aside class="rail min0"><div><h2>训练每次只解决一个局部问题</h2><p class="question">“参数往哪边改一点，损失会更小？”</p><p class="answer">重复回答，路径就逐渐进入低损失区域。</p></div><div class="not-rule"><div class="label"><span class="strike" aria-hidden="true"></span><span>不是把人为规则写进网络</span></div><p>网络保存的是找到的参数值；规则表现来自这些参数共同产生的预测。</p></div></aside>
    </main>
  </div>
  <script src="assets/base.js"></script><script>Deck.init({index:11,total:24});</script>
</body>
</html>
