<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>把网络整理成计算图</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .page-head{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
    .head-copy{min-width:0}
    .head-note{max-width:520px;padding-bottom:4px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45;text-align:right}
    .graph-wrap{position:relative;display:grid;grid-template-rows:74px minmax(0,1fr) 82px;gap:0;flex:1;min-height:0;margin-top:20px;border-top:2px solid var(--rule);border-bottom:2px solid var(--rule);background:var(--paper)}
    .lane-head{display:grid;grid-template-columns:190px minmax(0,1fr);align-items:center;border-bottom:1px solid var(--rule)}
    .lane-title{align-self:stretch;display:flex;align-items:center;gap:12px;padding:0 24px;border-right:1px solid var(--rule);font-family:var(--font-display);font-size:var(--fs-h2);font-weight:650}
    .lane-title .line{width:32px;border-top:4px solid currentColor}
    .lane-title.forward{color:var(--model)}
    .lane-summary{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 26px;color:var(--muted);font-size:var(--fs-sec)}
    .legend{flex-wrap:nowrap}
    .diagram{position:relative;min-height:0;overflow:hidden}
    .diagram svg{display:block;width:100%;height:100%}
    .bottom-strip{display:grid;grid-template-columns:190px minmax(0,1fr);border-top:1px solid var(--rule)}
    .back-title{display:flex;align-items:center;gap:12px;padding:0 24px;border-right:1px solid var(--rule);color:var(--loss);font-family:var(--font-display);font-size:var(--fs-h2);font-weight:650}
    .back-title .line{width:32px;border-top:4px solid currentColor}
    .back-copy{display:flex;align-items:center;justify-content:space-between;gap:28px;padding:0 26px;color:var(--muted);font-size:var(--fs-sec)}
    .rule-note{display:flex;align-items:center;gap:12px;color:var(--text);font-weight:650;white-space:nowrap}
    .rule-note .multiply{color:var(--loss);font-family:var(--font-num);font-size:26px}
    .node-box{fill:var(--paper);stroke:var(--text);stroke-width:2}
    .op-box{fill:var(--paper-deep);stroke:var(--rule-strong);stroke-width:2}
    .loss-box{fill:var(--loss-soft);stroke:var(--loss);stroke-width:2}
    .fwd{fill:none;stroke:var(--model);stroke-width:5;marker-end:url(#arrowBlue)}
    .bwd{fill:none;stroke:var(--loss);stroke-width:4;marker-end:url(#arrowRed)}
    .node-label{fill:var(--text);font:650 23px var(--font-sans)}
    .formula{fill:var(--text);font:500 18px var(--font-num)}
    .value{fill:var(--model);font:650 18px var(--font-num)}
    .cache{fill:var(--model-soft);stroke:var(--model);stroke-width:1.5}
    .cache-text{fill:var(--model);font:650 15px var(--font-sans)}
    .grad-label{fill:var(--loss);font:650 18px var(--font-num)}
    .local-box{fill:var(--attention-soft);stroke:var(--attention);stroke-width:1.5}
    .local-text{fill:#713A00;font:650 15px var(--font-num)}
    .guide{stroke:var(--rule);stroke-width:1;stroke-dasharray:5 7}
    .tiny{fill:var(--muted);font:500 15px var(--font-sans)}
    .phase-label{fill:var(--muted);font:650 15px var(--font-sans);letter-spacing:.08em}
  </style>
</head>
<body data-page="17" data-total="24">
  <div id="stage">
    <header class="page-head">
      <div class="head-copy">
        <p class="kicker">计算图 · 两次经过同一组节点</p>
        <h1>前向保存结果，反向计算局部导数</h1>
      </div>
      <p class="head-note">把每次运算拆成节点后，网络训练所需的两类信息会沿相反方向流动。</p>
    </header>

    <main class="graph-wrap min0" aria-label="一个神经元的前向与反向计算图">
      <div class="lane-head">
        <div class="lane-title forward"><span class="line"></span>前向</div>
        <div class="lane-summary">
          <span>从输入算到损失，并把反向会用到的中间结果留在节点旁。</span>
          <div class="legend" aria-label="图例">
            <span class="li" style="color:var(--model)"><span class="sw line"></span>数值与前向路径</span>
            <span class="li" style="color:var(--attention)"><span class="sw"></span>局部导数</span>
          </div>
        </div>
      </div>

      <div class="diagram min0">
        <svg viewBox="0 0 1488 596" role="img" aria-labelledby="svg-title svg-desc">
          <title id="svg-title">一个神经元的计算图</title>
          <desc id="svg-desc">输入 x 和权重 w 先相乘得到 z，再经过激活函数得到 a，最后与目标 y 比较得到损失 L。蓝色箭头从左向右传递数值，红色箭头从右向左传递梯度；每个运算节点下方标出局部导数。</desc>
          <defs>
            <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2457A6"/></marker>
            <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A33D3D"/></marker>
          </defs>

          <text x="34" y="62" class="phase-label">保存的中间结果</text>
          <line x1="190" y1="54" x2="1448" y2="54" class="guide"/>

          <!-- forward arrows -->
          <path d="M168 191 H315" class="fwd"/>
          <path d="M168 321 C240 321 245 241 315 241" class="fwd"/>
          <path d="M505 216 H665" class="fwd"/>
          <path d="M855 216 H1320" class="fwd"/>
          <path d="M1180 331 C1260 331 1254 241 1320 241" class="fwd"/>

          <!-- input nodes -->
          <rect x="34" y="150" width="134" height="82" rx="6" class="node-box"/>
          <text x="101" y="182" text-anchor="middle" class="node-label">输入 x</text>
          <text x="101" y="211" text-anchor="middle" class="value">x = 0.8</text>
          <rect x="34" y="280" width="134" height="82" rx="6" class="node-box"/>
          <text x="101" y="312" text-anchor="middle" class="node-label">权重 w</text>
          <text x="101" y="341" text-anchor="middle" class="value">w = 0.5</text>

          <!-- multiply -->
          <rect x="315" y="157" width="190" height="118" rx="6" class="op-box"/>
          <text x="410" y="190" text-anchor="middle" class="node-label">乘法</text>
          <text x="410" y="221" text-anchor="middle" class="formula">z = w · x</text>
          <text x="410" y="252" text-anchor="middle" class="value">z = 0.4</text>
          <rect x="342" y="85" width="136" height="40" rx="4" class="cache"/>
          <text x="410" y="111" text-anchor="middle" class="cache-text">保存 x、w</text>
          <line x1="410" y1="125" x2="410" y2="157" class="guide"/>

          <!-- activation -->
          <rect x="665" y="157" width="190" height="118" rx="6" class="op-box"/>
          <text x="760" y="190" text-anchor="middle" class="node-label">激活</text>
          <text x="760" y="221" text-anchor="middle" class="formula">a = σ(z)</text>
          <text x="760" y="252" text-anchor="middle" class="value">a = 0.60</text>
          <rect x="692" y="85" width="136" height="40" rx="4" class="cache"/>
          <text x="760" y="111" text-anchor="middle" class="cache-text">保存 z</text>
          <line x1="760" y1="125" x2="760" y2="157" class="guide"/>

          <!-- target -->
          <rect x="1030" y="290" width="150" height="80" rx="6" class="node-box"/>
          <text x="1105" y="321" text-anchor="middle" class="node-label">目标 y</text>
          <text x="1105" y="351" text-anchor="middle" class="value">y = 1</text>

          <!-- loss -->
          <rect x="1320" y="157" width="134" height="118" rx="6" class="loss-box"/>
          <text x="1387" y="190" text-anchor="middle" class="node-label">损失</text>
          <text x="1387" y="221" text-anchor="middle" class="formula">L(a,y)</text>
          <text x="1387" y="252" text-anchor="middle" class="value" style="fill:var(--loss)">L = 0.16</text>
          <rect x="1319" y="85" width="136" height="40" rx="4" class="cache"/>
          <text x="1387" y="111" text-anchor="middle" class="cache-text">保存 a、y</text>
          <line x1="1387" y1="125" x2="1387" y2="157" class="guide"/>

          <!-- local derivative boxes -->
          <text x="34" y="410" class="phase-label">当场计算的局部导数</text>
          <line x1="238" y1="402" x2="1448" y2="402" class="guide"/>
          <rect x="328" y="430" width="164" height="44" rx="4" class="local-box"/>
          <text x="410" y="458" text-anchor="middle" class="local-text">∂z/∂w = x</text>
          <rect x="678" y="430" width="164" height="44" rx="4" class="local-box"/>
          <text x="760" y="458" text-anchor="middle" class="local-text">∂a/∂z = σ′(z)</text>
          <rect x="1292" y="430" width="190" height="44" rx="4" class="local-box"/>
          <text x="1387" y="458" text-anchor="middle" class="local-text">∂L/∂a = 2(a−y)</text>

          <!-- backward arrows and labels -->
          <path d="M1387 486 C1387 530 1198 530 1094 530" class="bwd"/>
          <path d="M1094 530 H778" class="bwd"/>
          <path d="M742 530 H428" class="bwd"/>
          <path d="M392 530 H104" class="bwd"/>
          <text x="1238" y="516" text-anchor="middle" class="grad-label">∂L/∂a</text>
          <text x="936" y="516" text-anchor="middle" class="grad-label">∂L/∂z</text>
          <text x="582" y="516" text-anchor="middle" class="grad-label">∂L/∂w</text>
          <text x="34" y="570" class="tiny">每到一个节点：收到上游梯度，再乘该节点的局部导数。</text>
        </svg>
      </div>

      <div class="bottom-strip">
        <div class="back-title"><span class="line"></span>反向</div>
        <div class="back-copy">
          <span>从损失返回参数；局部导数读取前向保存的值，不必重算整条网络。</span>
          <span class="rule-note"><span>上游梯度</span><span class="multiply">×</span><span>局部导数</span><span class="multiply">=</span><span style="color:var(--loss)">传给前一节点的梯度</span></span>
        </div>
      </div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({index:17,total:24});</script>
</body>
</html>
