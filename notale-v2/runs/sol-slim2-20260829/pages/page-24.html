<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page-head{flex:0 0 112px;display:flex;align-items:flex-end;justify-content:space-between;gap:40px;border-bottom:1px solid var(--rule);padding-bottom:18px}
  .title-wrap{min-width:0}
  .title-wrap .kicker{margin-bottom:6px;color:var(--model)}
  .head-note{flex:0 0 410px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45;text-align:right;padding-bottom:2px}
  .lesson{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:24px}
  .claim{display:flex;align-items:baseline;justify-content:space-between;gap:28px;margin-bottom:18px}
  .claim h2{font-size:var(--fs-h2)}
  .claim p{color:var(--muted);font-size:var(--fs-label)}
  .chain{position:relative;flex:0 0 356px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:2px solid var(--rule);border-radius:var(--radius);background:var(--paper);overflow:hidden}
  .rail{position:absolute;left:13%;right:13%;top:95px;height:3px;background:var(--rule);z-index:0}
  .rail-fill{position:absolute;left:13%;top:95px;height:3px;width:0;background:var(--attention);z-index:1;transition:width .35s ease}
  .step-btn{position:relative;z-index:2;min-width:0;border:0;border-right:1px solid var(--rule);background:transparent;color:var(--text);font:inherit;text-align:left;padding:28px 24px 24px;cursor:pointer}
  .step-btn:last-child{border-right:0}
  .step-btn:hover{background:#f1f5f7}
  .step-btn:focus-visible{outline:3px solid var(--focus);outline-offset:-5px}
  .marker{width:54px;height:54px;margin:40px auto 27px;display:flex;align-items:center;justify-content:center;border:3px solid var(--rule-strong);border-radius:50%;background:var(--paper);color:var(--muted);transition:border-color .2s ease,background .2s ease,color .2s ease,transform .2s ease}
  .marker svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .step-btn[data-tone="model"] .eyebrow{color:var(--model)}
  .step-btn[data-tone="loss"] .eyebrow{color:var(--loss)}
  .step-btn[data-tone="attention"] .eyebrow{color:var(--attention)}
  .step-btn[aria-selected="true"]{background:var(--attention-soft)}
  .step-btn[aria-selected="true"] .marker{border-color:var(--attention);background:var(--attention);color:#fff;transform:scale(1.08)}
  .step-btn.is-passed .marker{border-color:var(--attention);color:var(--attention)}
  .eyebrow{font-size:var(--fs-label);font-weight:700;letter-spacing:.06em}
  .step-btn h3{margin-top:5px;font-size:28px}
  .step-btn p{margin-top:10px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  .arrow{position:absolute;right:-15px;top:88px;z-index:4;width:28px;height:18px;color:var(--rule-strong);pointer-events:none}
  .arrow svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2}
  .step-btn:last-child .arrow{display:none}
  .lower{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(400px,.75fr);gap:26px;padding-top:22px}
  .explain{min-width:0;display:grid;grid-template-columns:178px minmax(0,1fr);align-items:center;border-top:2px solid var(--text);border-bottom:1px solid var(--rule);padding:18px 0}
  .focus-label{align-self:stretch;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--rule);padding-right:22px}
  .focus-label .num{color:var(--attention);font-size:var(--fs-label);font-weight:700;letter-spacing:.08em}
  .focus-label strong{margin-top:5px;font-family:var(--font-display);font-size:var(--fs-h2);line-height:1.15}
  .detail{min-width:0;padding-left:28px}
  .detail-main{font-size:var(--fs-lead);font-weight:650;line-height:1.45}
  .detail-why{margin-top:8px;color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
  .controls{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:13px;padding:18px 0 18px 24px;border-left:1px solid var(--rule)}
  .controls .btn{align-self:flex-start;min-width:172px}
  .status{min-height:25px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
  .recall{color:var(--text);font-size:var(--fs-sec);line-height:1.5}
  .recall strong{color:var(--attention)}
  @media (prefers-reduced-motion:reduce){.rail-fill,.marker{transition:none}}
</style>
</head>
<body data-page="24" data-total="24">
<div id="stage">
  <header class="page-head">
    <div class="title-wrap min0">
      <p class="kicker">全课收束 · 一条学习链</p>
      <h1>神经网络反复沿这条链修正参数</h1>
    </div>
    <p class="head-note">能按顺序说清四个动作，就能解释“神经网络怎么学会”。</p>
  </header>

  <main class="lesson min0">
    <div class="claim">
      <h2>一次训练迭代</h2>
      <p>点选任一动作查看它承接什么、产出什么</p>
    </div>

    <section class="chain" aria-label="神经网络训练的四个连续动作">
      <div class="rail" aria-hidden="true"></div>
      <div class="rail-fill" id="railFill" aria-hidden="true"></div>

      <button class="step-btn" type="button" data-step="0" data-tone="model" aria-selected="true">
        <span class="marker" aria-hidden="true">
          <svg viewBox="0 0 32 32"><circle cx="7" cy="16" r="3"></circle><circle cx="16" cy="8" r="3"></circle><circle cx="16" cy="24" r="3"></circle><circle cx="26" cy="16" r="3"></circle><path d="M10 15l3-5M10 17l3 5M19 9l4 5M19 23l4-5"></path></svg>
        </span>
        <span class="eyebrow">前向传播</span>
        <h3>算预测</h3>
        <p>输入逐层变换，得到模型当前的输出。</p>
        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 28 18"><path d="M1 9h23M18 3l6 6-6 6"></path></svg></span>
      </button>

      <button class="step-btn" type="button" data-step="1" data-tone="loss" aria-selected="false">
        <span class="marker" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M5 8h9M18 8h9M9.5 4v8M23 4v8M6 24l7-7 5 4 8-10"></path></svg>
        </span>
        <span class="eyebrow">损失函数</span>
        <h3>量差距</h3>
        <p>把预测与目标比较，压成一个可计算的损失。</p>
        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 28 18"><path d="M1 9h23M18 3l6 6-6 6"></path></svg></span>
      </button>

      <button class="step-btn" type="button" data-step="2" data-tone="loss" aria-selected="false">
        <span class="marker" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M27 16H7M13 10l-6 6 6 6M22 7l5 9-5 9"></path></svg>
        </span>
        <span class="eyebrow">反向传播</span>
        <h3>传责任</h3>
        <p>梯度从输出往回传，指出每个参数影响了多少。</p>
        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 28 18"><path d="M1 9h23M18 3l6 6-6 6"></path></svg></span>
      </button>

      <button class="step-btn" type="button" data-step="3" data-tone="attention" aria-selected="false">
        <span class="marker" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M5 10h15M24 10h3M5 22h3M12 22h15"></path><circle cx="22" cy="10" r="3"></circle><circle cx="10" cy="22" r="3"></circle></svg>
        </span>
        <span class="eyebrow">优化器</span>
        <h3>改参数</h3>
        <p>沿降低损失的方向走一小步，再用新参数预测。</p>
      </button>
    </section>

    <section class="lower min0">
      <div class="explain min0" aria-live="polite">
        <div class="focus-label">
          <span class="num" id="stepNo">动作 1 / 4</span>
          <strong id="stepTitle">算预测</strong>
        </div>
        <div class="detail">
          <p class="detail-main" id="detailMain">输入与当前参数共同决定预测值。</p>
          <p class="detail-why" id="detailWhy">产出：预测。没有预测，就没有可供比较的结果。</p>
        </div>
      </div>
      <div class="controls">
        <button class="btn" id="playBtn" type="button">顺着因果链播放</button>
        <p class="status" id="status" role="status">当前停在“算预测”。</p>
        <p class="recall"><strong>口述句式：</strong>先算预测，再量差距；按差距传责任，再据此改参数。</p>
      </div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script>
(() => {
  const steps = [
    {title:'算预测', main:'输入与当前参数共同决定预测值。', why:'产出：预测。没有预测，就没有可供比较的结果。'},
    {title:'量差距', main:'损失函数把预测与目标之间的差距变成一个数。', why:'产出：损失。这个数给学习提供“要减小什么”的目标。'},
    {title:'传责任', main:'反向传播用链式法则算出损失对每个参数的梯度。', why:'产出：梯度。它说明参数变一点，损失会怎样变。'},
    {title:'改参数', main:'优化器根据梯度调整参数，使下一次预测更可能减小损失。', why:'产出：新参数。新参数回到链首，开始下一次迭代。'}
  ];
  const buttons = [...document.querySelectorAll('.step-btn')];
  const railFill = document.getElementById('railFill');
  const playBtn = document.getElementById('playBtn');
  const status = document.getElementById('status');
  const stepNo = document.getElementById('stepNo');
  const stepTitle = document.getElementById('stepTitle');
  const detailMain = document.getElementById('detailMain');
  const detailWhy = document.getElementById('detailWhy');
  let current = 0;
  let timer = null;
  let playing = false;

  function select(i, source='manual') {
    current = i;
    buttons.forEach((b, n) => {
      b.setAttribute('aria-selected', n === i ? 'true' : 'false');
      b.classList.toggle('is-passed', n < i);
    });
    railFill.style.width = `${i * 24.67}%`;
    stepNo.textContent = `动作 ${i + 1} / 4`;
    stepTitle.textContent = steps[i].title;
    detailMain.textContent = steps[i].main;
    detailWhy.textContent = steps[i].why;
    status.textContent = source === 'play' ? `正在说明“${steps[i].title}”。` : `当前停在“${steps[i].title}”。`;
  }

  function stop(completed=false) {
    if (timer) clearTimeout(timer);
    timer = null;
    playing = false;
    playBtn.textContent = completed ? '重新播放因果链' : '顺着因果链播放';
    if (completed) status.textContent = '一轮结束：新参数回到链首，继续下一次迭代。';
  }

  function advance(i) {
    if (!playing) return;
    select(i, 'play');
    if (i === steps.length - 1) {
      timer = setTimeout(() => stop(true), Deck.reduced() ? 50 : 1500);
    } else {
      timer = setTimeout(() => advance(i + 1), Deck.reduced() ? 60 : 1200);
    }
  }

  buttons.forEach((button, i) => button.addEventListener('click', () => {
    stop(false);
    select(i);
  }));

  playBtn.addEventListener('click', () => {
    stop(false);
    playing = true;
    playBtn.textContent = '播放中…';
    select(0, 'play');
    timer = setTimeout(() => advance(1), Deck.reduced() ? 60 : 1200);
  });

  window.addEventListener('pagehide', () => stop(false), {once:true});
  Deck.init({index:24,total:24});
})();
</script>
</body>
</html>
