<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{position:relative;isolation:isolate;}
  #stage::before{content:"";position:absolute;inset:0;z-index:-2;background-image:radial-gradient(circle at 16% 22%,rgba(234,244,255,.7) 0 1px,transparent 2px),radial-gradient(circle at 65% 28%,rgba(77,182,255,.55) 0 1px,transparent 2px),radial-gradient(circle at 84% 74%,rgba(234,244,255,.5) 0 1px,transparent 2px);background-size:317px 223px,431px 307px,557px 389px;animation:drift 18s linear infinite alternate;}
  .orbit-field{position:absolute;left:0;top:100px;width:1500px;height:700px;z-index:-1;pointer-events:none;}
  .orbit-field path{fill:none;stroke:var(--track-blue-line);stroke-width:2;filter:drop-shadow(0 0 7px rgba(77,182,255,.22));stroke-dasharray:2200;stroke-dashoffset:2200;animation:draw 1.05s ease-out .18s forwards;}
  .orbit-field path:nth-child(2){animation-delay:.28s;opacity:.72}.orbit-field path:nth-child(3){animation-delay:.38s;opacity:.5}
  .sun{position:absolute;left:0;bottom:0;width:620px;height:430px;border-radius:0 100% 0 0;background:radial-gradient(ellipse at 0 100%,#fff3bf 0 5%,var(--sun-gold) 24%,#d88720 54%,#783711 72%,transparent 73%);filter:drop-shadow(20px -20px 42px rgba(255,200,87,.36));opacity:1;animation:sunrise .5s ease-out forwards;}
  .eyebrow{letter-spacing:.2em;color:var(--text-muted);font-family:var(--font-mono);font-size:16px;line-height:1.4;font-weight:650;}
  .hero{width:min(1120px,calc(100% - 160px));margin:auto;justify-content:center;}
  .hero.k-generalization{gap:var(--sp-3);}
  .hero .claim{padding:var(--sp-5) var(--sp-6);background:linear-gradient(90deg,transparent,rgba(13,27,46,.7),transparent);border:0;border-radius:var(--radius-lg);box-shadow:none;text-align:center;opacity:1;transform:translateY(12px);animation:title-in .55s ease-out .85s forwards;}
  .title{font-size:clamp(40px,6vw,84px);line-height:1.02;font-weight:750;letter-spacing:-.045em;text-wrap:balance;}
  .title .accent{white-space:nowrap;}
  .hero .trunk{min-height:40px;width:2px;background:linear-gradient(var(--track-blue),transparent);}
  .hero .supports{padding-top:var(--sp-4);gap:var(--sp-6);}
  .hero .supports::before{background:linear-gradient(90deg,transparent,var(--track-blue),transparent);height:2px;}
  .hero .support{min-height:132px;display:flex;align-items:center;justify-content:center;padding:var(--sp-3) var(--sp-4);text-align:center;color:var(--track-blue);font-size:24px;line-height:1.4;font-weight:720;background:rgba(13,27,46,.84);border-color:var(--track-blue-line);box-shadow:var(--glow-blue);opacity:1;transform:translateY(8px);animation:support-in .42s ease-out forwards;}
  .hero .support:nth-child(1){animation-delay:.48s}.hero .support:nth-child(2){animation-delay:.60s}.hero .support:nth-child(3){animation-delay:.72s}
  .take{font-size:clamp(18px,2vw,28px);line-height:1.45;color:var(--text);text-align:center;letter-spacing:.01em;}
  .take strong{color:var(--sun-gold);font-weight:760;}
  .statement{max-width:1000px;text-align:center;color:var(--text-muted);font-size:18px;line-height:1.5;}
  @keyframes draw{to{stroke-dashoffset:0}}@keyframes sunrise{to{opacity:1}}@keyframes support-in{to{opacity:1;transform:none}}@keyframes title-in{to{opacity:1;transform:none}}@keyframes drift{to{transform:translate3d(18px,10px,0)}}
  @media(prefers-reduced-motion:reduce){#stage::before,.orbit-field path,.sun,.hero .claim,.hero .support{animation:none!important;transform:none;opacity:1}.orbit-field path{stroke-dashoffset:0}}
</style>
</head>
<body data-page="01" data-total="32">
<div id="stage">
  <div class="sun" aria-hidden="true"></div>
  <svg class="orbit-field" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
    <path d="M 0 880 C 260 390, 910 120, 1600 300"/>
    <path d="M 0 895 C 310 280, 1020 40, 1600 190"/>
    <path d="M 0 900 C 420 130, 1140 8, 1600 100"/>
  </svg>
  <header class="row items-center justify-between" style="height:104px;padding:0 var(--sp-8)">
    <div class="eyebrow"><span>SOLAR SYSTEM</span><span aria-hidden="true"> · </span><span>02</span></div>
    <div class="eyebrow"><span>天文学通识课</span><span aria-hidden="true"> / </span><span>第二讲</span></div>
  </header>
  <main class="hero k-generalization min0" style="flex:1">
    <div class="claim">
      <h1 class="title"><span>太阳系，</span><span class="accent">不只是</span><span>八颗球</span></h1>
    </div>
    <div class="trunk" aria-hidden="true"></div>
    <div class="supports" style="--support-cols:3">
      <div class="support"><span>有</span><span>结构</span></div>
      <div class="support"><span>有</span><span>历史</span></div>
      <div class="support"><span>仍在</span><span>变化</span></div>
    </div>
    <p class="take"><span>一个由</span><strong>共同关系</strong><span>组织起来的系统</span></p>
    <p class="statement"><span>认识太阳系，不是背诵八颗行星，</span><span>而是看见一个有结构、有历史、仍在变化的系统。</span></p>
  </main>
  <div aria-hidden="true" style="height:88px"></div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:1,total:32});</script>
</body>
</html>
