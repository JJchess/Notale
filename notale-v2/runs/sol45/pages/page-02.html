<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .route-head{position:relative;z-index:2;padding:58px 112px 22px}
  .kicker{margin-bottom:8px;color:var(--track-blue);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.16em}
  .route-head h1{font-size:clamp(32px,4vw,56px);line-height:1.18}
  .route-head .lead{margin-top:12px;color:var(--text-muted)}
  .route-wrap{position:relative;z-index:2;display:flex;align-items:stretch;padding:10px 72px 18px}
  .ledger{position:relative;width:100%;margin:auto;padding:18px 30px 18px 0;background:linear-gradient(90deg,var(--panel-raised),var(--panel));border:1px solid var(--track-blue-line);border-radius:var(--radius-md);box-shadow:var(--shadow-panel)}
  .ledger::before{position:absolute;top:56px;bottom:42px;left:88px;width:2px;content:"";background:linear-gradient(var(--sun-gold),var(--track-blue) 18%,var(--track-blue-line));box-shadow:var(--glow-blue);transform-origin:top;animation:draw .55s .28s both}
  .ledger-head,.route-item{display:grid;grid-template-columns:130px 260px minmax(0,1fr);align-items:center;min-width:0}
  .ledger-head{height:40px;color:var(--text-dim);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.08em}
  .ledger-head span:first-child{text-align:center}
  .k-enumeration > .route-item{position:relative;display:grid;grid-template-columns:130px 260px minmax(0,1fr);height:96px;padding:0;gap:0;background:var(--track-blue-soft);border:0;border-top:1px solid var(--line);border-radius:0;opacity:0;animation:arrive .38s both}
  .route-item:nth-of-type(2){animation-delay:.48s}.route-item:nth-of-type(3){animation-delay:.56s}.route-item:nth-of-type(4){animation-delay:.64s}.route-item:nth-of-type(5){animation-delay:.72s}.route-item:nth-of-type(6){animation-delay:.8s}
  .route-item .num{position:relative;z-index:2;display:flex;width:46px;height:46px;margin:auto;align-items:center;justify-content:center;color:var(--track-blue);font:700 14px/1 var(--font-mono);background:var(--panel-deep);border:2px solid var(--track-blue);border-radius:50%;box-shadow:var(--glow-blue)}
  .route-item .name{color:var(--track-blue);font-size:26px;font-weight:760}
  .route-item .question{color:var(--text);font-size:var(--fs-body);line-height:1.5}
  .route-item .question small{display:block;margin-top:4px;color:var(--text-muted);font-size:var(--fs-sec);line-height:1.5}
  .route-item.is-current{background:linear-gradient(90deg,var(--sun-gold-soft),transparent 70%)}
  .route-item.is-current .num{color:var(--bg);background:var(--sun-gold);border-color:var(--sun-gold);animation:pulse .6s .92s both}
  .route-item.is-current .name{color:var(--sun-gold)}
  .route-foot{position:relative;z-index:2;display:flex;align-items:center;padding:0 112px 28px;color:var(--text-muted);font-size:var(--fs-sec)}
  .route-foot::before{width:34px;height:2px;margin-right:14px;content:"";background:var(--sun-gold)}
  .orbit{position:absolute;border-color:rgba(77,182,255,.14);pointer-events:none}
  .orbit.a{width:520px;height:520px;right:24px;top:26px}
  .orbit.b{width:760px;height:300px;left:22px;bottom:18px}
  .route-head{opacity:0;animation:fade .35s .05s both}
  @keyframes fade{to{opacity:1}}
  @keyframes draw{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes arrive{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
  @keyframes pulse{50%{box-shadow:0 0 38px rgba(255,200,87,.58)}to{box-shadow:var(--glow-gold)}}
  @media(prefers-reduced-motion:reduce){.route-head,.route-item,.ledger::before,.route-item.is-current .num{animation:none;opacity:1;transform:none}}
</style>
</head>
<body data-page="02" data-total="32">
<div id="stage">
  <div class="orbit orbit-ring a" aria-hidden="true"></div>
  <div class="orbit orbit-ring b" aria-hidden="true"></div>
  <header class="route-head" style="height:170px">
    <div class="kicker">TODAY’S ROUTE</div>
    <h1>用五个镜头，重新认识太阳系</h1>
    <p class="lead">本讲不按行星顺序逐颗点名，而是依次打开五个观察窗口。</p>
  </header>
  <main class="route-wrap min0" style="flex:1">
    <section class="ledger k-enumeration" style="--enum-cols:1" aria-label="本讲五个观察窗口">
      <div class="ledger-head"><span>序号</span><span>观察窗口</span><span>引导问题</span></div>
      <div class="route-item it is-current"><span class="num">01</span><span class="name">结构</span><span class="question">谁在组织整个太阳系？<small>先看系统的整体结构</small></span></div>
      <div class="route-item it"><span class="num">02</span><span class="name">成员</span><span class="question">这里不只有八颗行星<small>再看系统里有哪些成员</small></span></div>
      <div class="route-item it"><span class="num">03</span><span class="name">运动</span><span class="question">天体为什么持续绕行？<small>接着看彼此的运动关系</small></span></div>
      <div class="route-item it"><span class="num">04</span><span class="name">形成</span><span class="question">不同世界为何如此不同？<small>随后追问共同起源与差异</small></span></div>
      <div class="route-item it"><span class="num">05</span><span class="name">边界</span><span class="question">什么算行星，太阳系到哪里？<small>最后检视分类与范围问题</small></span></div>
    </section>
  </main>
  <footer class="route-foot" style="height:60px">接下来：先从“谁在组织这个系统”开始。</footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:2,total:32});</script>
</body>
</html>
