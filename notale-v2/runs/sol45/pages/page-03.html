<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page-head{padding:32px 48px 18px;border-bottom:1px solid var(--line)}
  .kicker{color:var(--track-blue);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.14em}
  .main-split{padding:24px 48px 18px;gap:24px}
  .visual-side{flex:0 0 40%;padding:24px;transition:opacity .45s ease}
  .mass-side{flex:1;padding:24px}
  .section-cap{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
  .planet-field{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:var(--radius-md);background:radial-gradient(circle at 50% 46%,var(--track-blue-soft),transparent 63%),var(--panel-deep);overflow:hidden}
  #planets{width:100%;height:100%;display:block}
  .planet-label{fill:var(--text);font:600 16px var(--font-sans);text-anchor:middle}
  .mass-chart{position:relative;height:168px;margin-top:12px;padding:38px 0 0}
  #massSvg{width:100%;height:112px;display:block;overflow:visible}
  .guess-tag{position:absolute;top:0;transform:translateX(-50%);color:var(--track-blue);font:700 15px/1.4 var(--font-mono);white-space:nowrap}
  .result-number{font:750 48px/1.05 var(--font-mono);color:var(--sun-gold)}
  .control-stack{margin-top:16px;padding:16px 18px;background:var(--panel-deep);border:1px solid var(--line);border-radius:var(--radius-sm)}
  .control-stack input[type="range"]{height:28px}
  .feedback{min-height:27px;margin-top:10px;color:var(--text-muted);font-size:var(--fs-sec);line-height:1.5}
  .feedback.good{color:var(--success)} .feedback.low{color:var(--sun-gold)}
  .comparison-wrap{height:226px;padding:0 48px 30px}
  .k-comparison{height:100%;grid-template-rows:44px 1fr 1px 1fr}
  .k-comparison > *{padding:10px 18px}
  .k-comparison .dim{display:flex;align-items:center;justify-content:flex-end}
  .k-comparison .cell{display:flex;align-items:center;justify-content:center}
  .conclusion{opacity:0;transform:translateY(6px);transition:opacity .35s ease,transform .35s ease;color:var(--sun-gold);font-weight:750}
  .revealed .conclusion{opacity:1;transform:none}
  .revealed .visual-side{opacity:.35}
  button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="03" data-total="32">
<div id="stage">
  <header class="page-head shrink0" style="height:116px">
    <div class="kicker">MASS SHARE · 03</div>
    <div class="row items-end justify-between gap-4">
      <h1>谁真正占据太阳系？</h1>
      <p class="lead muted">先估质量，不要被画面大小带走</p>
    </div>
  </header>

  <main class="main-split row min0" style="flex:1">
    <section class="visual-side panel col min0" aria-labelledby="visual-title">
      <div class="section-cap shrink0">
        <h2 id="visual-title">看起来：八颗行星很醒目</h2>
        <span class="chip">非比例圆盘</span>
      </div>
      <div class="planet-field min0">
        <svg id="planets" role="img" aria-label="八颗行星的非比例圆盘陈列"></svg>
      </div>
      <p class="note" style="margin-top:12px">圆盘只保证容易辨认，不编码真实大小或质量。</p>
    </section>

    <section class="mass-side panel col min0" aria-labelledby="mass-title">
      <div class="section-cap shrink0">
        <div>
          <div class="label">同一问题，换一把尺子</div>
          <h2 id="mass-title">实际上：质量份额</h2>
        </div>
        <div class="result-number" id="sunReadout" aria-live="polite">？</div>
      </div>

      <div class="mass-chart shrink0" id="massChart">
        <div class="guess-tag" id="guessTag">你的估值 50%</div>
        <svg id="massSvg" role="img" aria-label="太阳与八颗行星合计的质量份额条"></svg>
      </div>

      <div class="control-stack shrink0">
        <div class="ctl">
          <label for="guess">你猜太阳占多少质量？</label>
          <input id="guess" type="range" min="0" max="100" step="1" value="50">
          <output id="guessOut" for="guess">50%</output>
        </div>
        <div class="row items-center justify-between gap-3" style="margin-top:10px">
          <p class="feedback" id="feedback" aria-live="polite">拖动滑杆，再提交你的估值。</p>
          <div class="row gap-2 shrink0">
            <button class="btn is-primary" id="submit" type="button">先拖动估值</button>
            <button class="btn" id="reset" type="button" hidden>重新估一次</button>
          </div>
        </div>
      </div>
      <p class="conclusion lead" style="margin-top:14px">行星体积醒目，但太阳占太阳系绝大部分质量。</p>
      <p class="note" style="margin-top:auto">口径：太阳与八颗行星质量合计</p>
    </section>
  </main>

  <section class="comparison-wrap shrink0" aria-label="视觉印象与质量比较" style="height:226px">
    <div class="k-comparison" style="--compare-cols:2">
      <div class="hdr">比较维度</div><div class="hdr">八颗行星</div><div class="hdr accent">太阳</div>
      <div class="dim">画面印象</div><div class="cell">八个清晰、醒目的圆盘</div><div class="cell">一个主要圆盘</div>
      <div class="rowline"></div>
      <div class="dim">质量份额</div><div class="cell diff" id="planetCell">揭晓后显示</div><div class="cell diff" id="sunCell">揭晓后显示</div>
    </div>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  Deck.init({index:3,total:32});
  const planetMass=Lec.P.totalPlanetMassKg();
  const sunMass=Lec.K.sun.massKg;
  const sunShare=Lec.P.percent(sunMass,sunMass+planetMass);
  const shownShare=Lec.P.significantFigures(sunShare,4);
  const shownPlanets=Lec.P.significantFigures(100-shownShare,2);
  const names=['水星','金星','地球','火星','木星','土星','天王星','海王星'];
  const radii=[22,31,33,26,56,51,43,42];
  const colors=['#8DA0AE','#D7A85B','#4DB6FF','#D36C4B','#D9B36C','#E4C58A','#76CBD4','#527DCF'];

  const psvg=d3.select('#planets').attr('viewBox','0 0 580 420');
  const positions=[[85,105],[220,105],[365,105],[500,105],[85,292],[220,292],[365,292],[500,292]];
  const groups=psvg.selectAll('g').data(names).join('g').attr('transform',(d,i)=>`translate(${positions[i][0]},${positions[i][1]})`).style('opacity',Deck.reduced()?1:0);
  groups.append('circle').attr('r',(d,i)=>radii[i]).attr('fill',(d,i)=>colors[i]).attr('stroke','rgba(234,244,255,.45)').attr('stroke-width',2);
  groups.append('text').attr('class','planet-label').attr('y',78).text(d=>d);
  if(!Deck.reduced()) groups.transition().delay((d,i)=>i*65).duration(380).style('opacity',1);

  const svg=d3.select('#massSvg').attr('viewBox','0 0 760 112');
  const chartWidth=760, barY=16, barH=56;
  const scale=d3.scaleLinear().domain([0,100]).range([0,chartWidth]).clamp(true);
  svg.append('rect').attr('x',0).attr('y',barY).attr('width',chartWidth).attr('height',barH).attr('rx',8).attr('fill','var(--panel-raised)').attr('stroke','var(--line-strong)');
  const sunBar=svg.append('rect').attr('x',0).attr('y',barY).attr('width',0).attr('height',barH).attr('rx',8).attr('fill','var(--sun-gold)');
  const planetBar=svg.append('rect').attr('x',chartWidth).attr('y',barY).attr('width',0).attr('height',barH).attr('fill','var(--track-blue)');
  const trueLine=svg.append('line').attr('y1',8).attr('y2',82).attr('stroke','var(--text)').attr('stroke-width',3).attr('opacity',0);
  const guessLine=svg.append('line').attr('y1',8).attr('y2',82).attr('stroke','var(--track-blue)').attr('stroke-width',3).attr('stroke-dasharray','7 5');
  svg.append('text').attr('x',0).attr('y',106).attr('fill','var(--text-muted)').style('font-size','16px').text('太阳质量份额');
  svg.append('text').attr('x',chartWidth).attr('y',106).attr('text-anchor','end').attr('fill','var(--text-muted)').style('font-size','16px').text('八颗行星合计');

  const guess=document.getElementById('guess'), out=document.getElementById('guessOut'), tag=document.getElementById('guessTag');
  const submit=document.getElementById('submit'), reset=document.getElementById('reset'), feedback=document.getElementById('feedback');
  let moved=false,revealed=false;
  function updateGuess(){
    const v=+guess.value; out.textContent=v+'%'; tag.textContent='你的估值 '+v+'%';
    tag.style.left=(v/100*100)+'%'; guessLine.attr('x1',scale(v)).attr('x2',scale(v));
    if(!revealed){moved=true;submit.disabled=false;submit.textContent='提交估值';}
  }
  guess.addEventListener('input',updateGuess);
  submit.disabled=true;
  updateGuess(); moved=false; submit.disabled=true; submit.textContent='先拖动估值';

  function reveal(){
    if(!moved||revealed)return; revealed=true; guess.disabled=true; submit.disabled=true; submit.textContent='已揭晓'; reset.hidden=false;
    document.getElementById('stage').classList.add('revealed');
    const target=scale(sunShare), duration=Deck.reduced()?0:700;
    sunBar.transition().duration(duration).ease(d3.easeCubicOut).attr('width',target);
    planetBar.attr('x',target).transition().duration(duration).ease(d3.easeCubicOut).attr('width',chartWidth-target);
    trueLine.attr('x1',target).attr('x2',target).transition().delay(duration).duration(120).attr('opacity',1);
    const close=Math.abs(+guess.value-sunShare)<=1;
    if(close){
      guessLine.attr('x1',target).attr('x2',target).attr('stroke','var(--sun-gold)').attr('stroke-dasharray',null);
      feedback.className='feedback good'; feedback.textContent='很接近：太阳约占 '+shownShare+'%';
    }else{
      feedback.className='feedback low'; feedback.textContent='低估了太阳：画面醒目，不代表质量份额大。';
      if(!Deck.reduced()) guessLine.transition().duration(70).attr('transform','translate(-6,0)').transition().duration(70).attr('transform','translate(6,0)').transition().duration(70).attr('transform','translate(0,0)');
    }
    document.getElementById('sunReadout').textContent=shownShare+'%';
    document.getElementById('planetCell').textContent='约 '+shownPlanets+'%';
    document.getElementById('sunCell').textContent='约 '+shownShare+'%';
  }
  submit.addEventListener('click',reveal);
  reset.addEventListener('click',function(){
    revealed=false;moved=false;guess.disabled=false;guess.value=50;out.textContent='50%';tag.textContent='你的估值 50%';tag.style.left='50%';
    guessLine.attr('x1',scale(50)).attr('x2',scale(50)).attr('stroke','var(--track-blue)').attr('stroke-dasharray','7 5').attr('transform',null);
    sunBar.interrupt().attr('width',0);planetBar.interrupt().attr('x',chartWidth).attr('width',0);trueLine.attr('opacity',0);
    document.getElementById('stage').classList.remove('revealed');document.getElementById('sunReadout').textContent='？';
    document.getElementById('planetCell').textContent='揭晓后显示';document.getElementById('sunCell').textContent='揭晓后显示';
    feedback.className='feedback';feedback.textContent='拖动滑杆，再提交你的估值。';submit.textContent='先拖动估值';submit.disabled=true;reset.hidden=true;guess.focus();
  });
})();
</script>
</body>
</html>
