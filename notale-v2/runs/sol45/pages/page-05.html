<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:24px 32px 28px;gap:14px}
  .eyebrow{font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.14em;color:var(--track-blue)}
  .head-note{max-width:620px;text-align:right;color:var(--text-muted);font-size:var(--fs-sec);line-height:1.5}
  .process-strip .step{padding:10px 18px;text-align:center;font-size:var(--fs-sec);font-weight:700;background:var(--panel-deep)}
  .process-strip .axis::before{height:3px}
  .process-strip .arw{flex-basis:34px}
  .map-shell{position:relative;overflow:hidden;background:rgba(9,23,40,.76);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-panel)}
  #map-stage{position:absolute;inset:0 0 126px 0}
  #map-stage canvas{border-radius:var(--radius-lg)}
  .map-labels{position:absolute;inset:0 0 126px 0;pointer-events:none}
  .sun-label{position:absolute;left:64px;top:48%;transform:translateY(-50%);font-size:var(--fs-sec);font-weight:750;color:var(--sun-gold)}
  .region-label{position:absolute;top:18px;padding:5px 12px;border:1px solid var(--track-blue-line);border-radius:999px;color:var(--track-blue);font-size:var(--fs-label);font-weight:700;opacity:0;transition:opacity 260ms ease}
  .region-label.show{opacity:1}.region-inner{left:32%}.region-belt{left:59%}.region-outer{right:7%;top:62px}
  .status-box{position:absolute;right:18px;top:16px;z-index:5;min-width:162px;padding:10px 14px;background:var(--panel);border:1px solid var(--sun-gold-line);border-radius:var(--radius-sm);font-size:var(--fs-label);font-weight:700;color:var(--sun-gold)}
  .feedback{position:absolute;left:50%;bottom:136px;z-index:5;transform:translateX(-50%);min-width:440px;padding:9px 18px;text-align:center;color:var(--text);font-size:var(--fs-sec);line-height:1.5;background:rgba(13,27,46,.94);border:1px solid var(--track-blue-line);border-radius:999px}
  .tray{position:absolute;left:16px;right:16px;bottom:14px;height:98px;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--radius-md)}
  .tray-title{width:110px;color:var(--text-muted);font-size:var(--fs-label);line-height:1.4}
  .piece-labels{display:flex;flex:1;justify-content:space-around;align-items:center;min-width:0}
  .piece-label{width:82px;text-align:center;font-size:var(--fs-label);font-weight:700;color:var(--text)}
  .piece-label.direction{width:118px;color:var(--sun-gold)}
  .kbd-help{position:absolute;left:20px;bottom:120px;color:var(--text-muted);font-size:var(--fs-label)}
  .conclusion{position:absolute;z-index:7;left:50%;top:48%;width:720px;transform:translate(-50%,-50%);padding:22px 30px;text-align:center;font-size:var(--fs-lead);line-height:1.5;font-weight:750;background:rgba(13,27,46,.97);border-left:7px solid var(--sun-gold);border-radius:0 var(--radius-md) var(--radius-md) 0;box-shadow:var(--glow-gold);opacity:0;pointer-events:none;transition:opacity 260ms ease}
  .conclusion.show{opacity:1}
  .reset{position:absolute;right:28px;bottom:34px;z-index:8;display:none}.reset.show{display:inline-flex}
  .map-shell:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition-duration:0ms!important}}
</style>
</head>
<body data-page="05" data-total="32">
<div id="stage">
  <header class="row items-end justify-between shrink0" style="height:70px">
    <div><div class="eyebrow">MAP LAB · 关系制图台</div><h1>拼出一张会动的太阳系地图</h1></div>
    <p class="head-note">拖动拼件到轨道槽；也可用方向键选择，按 Enter 放置。</p>
  </header>
  <section class="k-process process-strip shrink0" style="height:68px" aria-label="地图建构步骤">
    <div class="axis">
      <div class="step is-current" data-step="1"><span class="accent">1</span>　摆顺序</div><span class="arw" aria-hidden="true"></span>
      <div class="step" data-step="2"><span class="track">2</span>　看聚集</div><span class="arw" aria-hidden="true"></span>
      <div class="step" data-step="3"><span class="track">3</span>　让系统运动</div>
    </div>
  </section>
  <main class="map-shell min0 no-pan" style="flex:1" id="map-shell" tabindex="0" role="application" aria-label="太阳系地图拼图。方向键选择拼件，回车放置。">
    <div id="map-stage" aria-hidden="true"></div>
    <div class="map-labels"><span class="sun-label">太阳</span><span class="region-label region-inner">四颗靠内成员</span><span class="region-label region-belt">小天体密集带</span><span class="region-label region-outer">四颗靠外成员</span></div>
    <div class="status-box" id="status">已就位 0 / 8</div>
    <div class="feedback" id="feedback" aria-live="polite">先从太阳向外，摆出八颗行星的顺序。</div>
    <div class="kbd-help">键盘：← → 选拼件 · Enter 放置</div>
    <div class="tray"><div class="tray-title">待放置拼件</div><div class="piece-labels" id="piece-labels"></div></div>
    <div class="conclusion" id="conclusion">一张有用的太阳系地图，不只回答“谁在谁外面”，还要让人看见成员怎样成区、怎样绕太阳运动。</div>
    <button class="btn reset" id="reset" type="button">重拼一次</button>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script>
(function(){
  Deck.init({index:5,total:32});
  var raw=Array.isArray(Lec.K.planets)?Lec.K.planets:Object.values(Lec.K.planets);
  var planets=raw.slice().sort(function(a,b){return (a.semimajorAxisAU||a.distanceAU||a.orbitAU)-(b.semimajorAxisAU||b.distanceAU||b.orbitAU)});
  var names=planets.map(function(p){return p.nameZh||p.zh||p.name_cn||p.name});
  var total=planets.length, directionName='共同绕行';
  var shell=document.getElementById('map-shell'), host=document.getElementById('map-stage');
  var labels=document.getElementById('piece-labels'), status=document.getElementById('status'), feedback=document.getElementById('feedback');
  names.concat([directionName]).forEach(function(n,i){var s=document.createElement('span');s.className='piece-label'+(i===total?' direction':'');s.textContent=n;labels.appendChild(s)});
  var W=host.clientWidth,H=host.clientHeight, stage=new Konva.Stage({container:'map-stage',width:W,height:H});
  var backgroundLayer=new Konva.Layer(),orbitLayer=new Konva.Layer(),tokenLayer=new Konva.Layer(),feedbackLayer=new Konva.Layer();
  stage.add(backgroundLayer,orbitLayer,tokenLayer,feedbackLayer);
  var colors={blue:Deck.token('--track-blue'),gold:Deck.token('--sun-gold'),text:Deck.token('--text'),muted:Deck.token('--text-muted'),danger:Deck.token('--danger')};
  var cy=Math.round(H*.47),sunX=90,trayY=H-48, targets=[],tokens=[], state={placed:[],direction:false,errors:0,selected:0};
  var bgInner=new Konva.Rect({x:155,y:65,width:500,height:H-115,fill:Deck.rgba('--track-blue',.055),cornerRadius:28,opacity:0});
  var bgOuter=new Konva.Rect({x:760,y:65,width:W-800,height:H-115,fill:Deck.rgba('--sun-gold',.045),cornerRadius:28,opacity:0});
  backgroundLayer.add(bgInner,bgOuter);
  backgroundLayer.add(new Konva.Circle({x:sunX,y:cy,radius:42,fill:colors.gold,shadowColor:colors.gold,shadowBlur:38,shadowOpacity:.8}));
  for(var i=0;i<total;i++){
    var rx=180+i*82, ry=58+i*18, tx=sunX+rx;
    targets.push({x:tx,y:cy});
    orbitLayer.add(new Konva.Ellipse({x:sunX,y:cy,radiusX:rx,radiusY:ry,stroke:Deck.rgba('--track-blue',.34),strokeWidth:2}));
    orbitLayer.add(new Konva.Circle({x:tx,y:cy,radius:24,stroke:Deck.rgba('--track-blue',.55),dash:[5,5],strokeWidth:2}));
  }
  var connector=new Konva.Line({points:[sunX+48,cy,sunX+48,cy-60],stroke:colors.gold,strokeWidth:3,opacity:0});orbitLayer.add(connector);
  function tokenShape(i,isDirection){
    var x=174+i*((W-220)/(total+1)), y=trayY;
    var g=new Konva.Group({x:x,y:y,draggable:true,name:'piece'});
    if(isDirection){g.add(new Konva.Arc({innerRadius:19,outerRadius:25,angle:285,rotation:35,fill:colors.gold}));g.add(new Konva.RegularPolygon({x:-17,y:-18,sides:3,radius:8,rotation:-25,fill:colors.gold}));}
    else {g.add(new Konva.Circle({radius:23,fill:i<4?colors.blue:colors.gold,stroke:colors.text,strokeWidth:2,shadowColor:colors.blue,shadowBlur:12}));g.add(new Konva.Text({x:-18,y:-10,width:36,text:String(i+1),align:'center',fontSize:16,fontStyle:'bold',fill:'#07111F'}));}
    g.home={x:x,y:y};g.idx=i;g.isDirection=isDirection;g.on('dragend',function(){attempt(g)});g.on('dragstart',function(){state.selected=i;drawSelection()});tokenLayer.add(g);tokens.push(g);return g;
  }
  for(i=0;i<total;i++)tokenShape(i,false);var dir=tokenShape(total,true);
  function drawSelection(){tokens.forEach(function(t,j){t.opacity(j===state.selected?1:.72);t.scale({x:j===state.selected?1.12:1,y:j===state.selected?1.12:1})});tokenLayer.batchDraw()}
  function shakeBack(g,msg){state.errors++;feedback.textContent=msg;var home=g.home;if(Deck.reduced()){g.position(home);tokenLayer.draw();return}var base=g.x(),n=0;var iv=setInterval(function(){n++;g.x(base+(n%2?8:-8));tokenLayer.batchDraw();if(n===6){clearInterval(iv);g.to({x:home.x,y:home.y,duration:.26,easing:Konva.Easings.EaseOut})}},38)}
  function placePlanet(g){var t=targets[g.idx];g.draggable(false);g.to({x:t.x,y:t.y,duration:Deck.reduced()?0:.18,easing:Konva.Easings.EaseOut});state.placed[g.idx]=true;var pulse=new Konva.Circle({x:t.x,y:t.y,radius:25,stroke:colors.gold,strokeWidth:4});feedbackLayer.add(pulse);if(!Deck.reduced())pulse.to({radius:55,opacity:0,duration:.42,onFinish:function(){pulse.destroy()}});update()}
  function attempt(g){if(g.isDirection){if(state.placed.filter(Boolean).length<total){shakeBack(g,'先让八位成员各就各位。');return}g.draggable(false);g.to({x:sunX+48,y:cy-60,duration:Deck.reduced()?0:.18});state.direction=true;connector.opacity(1);update();return}
    var t=targets[g.idx],d=Math.hypot(g.x()-t.x,g.y()-t.y);if(d<=28&&!state.placed[g.idx])placePlanet(g);else shakeBack(g,'这颗行星与太阳的远近顺序不在这里。')
  }
  function setSteps(step){document.querySelectorAll('[data-step]').forEach(function(el){var n=+el.dataset.step;el.classList.toggle('is-current',n===step);el.classList.toggle('is-past',n<step)})}
  var moving=[];function addMotion(){if(moving.length)return;for(var j=0;j<total;j++){var dot=new Konva.Circle({radius:4,fill:colors.blue,shadowColor:colors.blue,shadowBlur:10});orbitLayer.add(dot);moving.push({node:dot,rx:180+j*82,ry:58+j*18,phase:j*.55})}Deck.loop(function(t){moving.forEach(function(o){var a=t*.00022+o.phase;o.node.position({x:sunX+Math.cos(a)*o.rx,y:cy+Math.sin(a)*o.ry})});orbitLayer.batchDraw()},{still:4000})}
  function update(){var count=state.placed.filter(Boolean).length;if(count>=4){bgInner.opacity(Math.min(1,(count-3)/2));document.querySelector('.region-inner').classList.add('show')}if(count>=6){bgOuter.opacity(Math.min(1,(count-5)/2));document.querySelector('.region-belt').classList.add('show');document.querySelector('.region-outer').classList.add('show')}backgroundLayer.draw();
    if(count<total){status.textContent='已就位 '+count+' / '+total;feedback.textContent=count?'继续向外摆放，观察成员开始聚成两片。':'先从太阳向外，摆出八颗行星的顺序。';setSteps(count<4?1:2)}else if(!state.direction){status.textContent='方向 0 / 1';feedback.textContent='顺序与聚集已经出现。把“共同绕行”接到太阳旁。';setSteps(3)}else{status.textContent='方向 1 / 1';feedback.textContent='地图完成：顺序、分区和运动已经接在一起。';document.getElementById('conclusion').classList.add('show');document.getElementById('reset').classList.add('show');setSteps(3);addMotion()}}
  shell.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();state.selected=(state.selected+(e.key==='ArrowRight'?1:-1)+tokens.length)%tokens.length;drawSelection()}if(e.key==='Enter'||e.key===' '){e.preventDefault();var g=tokens[state.selected];if(g.isDirection){g.position({x:sunX+48,y:cy-60})}else g.position(targets[g.idx]);attempt(g)}});
  document.getElementById('reset').addEventListener('click',function(){state.placed=[];state.direction=false;tokens.forEach(function(g){g.stopDrag();g.draggable(true);g.position(g.home)});connector.opacity(0);moving.forEach(function(o){o.node.destroy()});moving=[];bgInner.opacity(0);bgOuter.opacity(0);document.querySelectorAll('.region-label').forEach(function(x){x.classList.remove('show')});document.getElementById('conclusion').classList.remove('show');this.classList.remove('show');orbitLayer.draw();tokenLayer.draw();update();shell.focus()});
  function resize(){W=host.clientWidth;H=host.clientHeight;stage.size({width:W,height:H})}Deck.onResize(resize);drawSelection();update();
  if(!Deck.reduced()){backgroundLayer.opacity(0);orbitLayer.opacity(0);tokenLayer.opacity(0);backgroundLayer.to({opacity:1,duration:.45});orbitLayer.to({opacity:1,duration:.8});tokenLayer.to({opacity:1,duration:.6,delay:.35})}
})();
</script>
</body>
</html>
