<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#07111F;--text:#EAF4FF;--font-sans:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;--motion-ease:cubic-bezier(.22,.8,.24,1)}
#stage{position:relative}
.head{position:relative;z-index:5;padding:var(--sp-5) var(--sp-7) 0}
.kicker{color:var(--track-blue);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.16em}
.head h1{margin-top:var(--sp-1);font-size:clamp(36px,5vw,68px);line-height:1.12;max-width:1200px}
.head .lead{margin-top:var(--sp-2);color:var(--text-muted);max-width:1050px}
.scene{position:relative;display:flex;flex-direction:column;overflow:hidden;margin:var(--sp-2) var(--sp-6) 0;min-height:0;background:linear-gradient(180deg,rgba(13,27,46,.38),rgba(9,23,40,.7));border-top:1px solid var(--track-blue-line);border-bottom:1px solid var(--line)}
.region{position:absolute;border:1px solid var(--track-blue-line);background:linear-gradient(90deg,transparent,var(--track-blue-soft),transparent);opacity:0;transform:scaleX(.72);animation:regionIn 1s var(--motion-ease) 1.5s forwards}
.region.r1{inset:11% 62% 15% 3%;border-radius:50%}
.region.r2{inset:4% 30% 6% 28%;border-radius:50%}
.region.r3{inset:0 2% 0 55%;border-radius:50%}
.orbit{position:absolute;left:3%;top:49%;height:220px;border:2px solid var(--track-blue-line);border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;opacity:0;transform:translateY(-50%) rotate(-8deg) scale(.65);animation:orbitIn 1.2s var(--motion-ease) 1.15s forwards}
.orbit.o1{width:36%}.orbit.o2{width:62%;height:320px;top:48%;animation-delay:1.3s}.orbit.o3{width:91%;height:410px;top:47%;animation-delay:1.45s}
.queue{position:absolute;left:7%;right:7%;top:48%;height:190px;transform:translateY(-50%);display:flex;align-items:center;justify-content:space-between}
.queue::before{position:absolute;left:0;right:0;top:50%;height:2px;content:"";background:repeating-linear-gradient(90deg,var(--line-strong) 0 9%,transparent 9% 12.5%);animation:lineBreak .8s var(--motion-ease) .8s forwards}
.slot{position:relative;width:10%;height:100%;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);animation:slotOut .8s var(--motion-ease) .8s forwards}
.slot:first-child{border-left:1px solid var(--line)}
.planet{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#A7B5C3,#71849A 55%,#40546A);box-shadow:0 0 22px rgba(113,132,154,.35);opacity:0;transform:translateY(-80px);animation:drop .55s var(--motion-ease) forwards,scatter 1.05s var(--motion-ease) .92s forwards}
.slot:nth-child(2) .planet{animation-delay:.08s,.98s}.slot:nth-child(3) .planet{animation-delay:.16s,1.04s}.slot:nth-child(4) .planet{animation-delay:.24s,1.10s}.slot:nth-child(5) .planet{animation-delay:.32s,1.16s}.slot:nth-child(6) .planet{animation-delay:.40s,1.22s}.slot:nth-child(7) .planet{animation-delay:.48s,1.28s}.slot:nth-child(8) .planet{animation-delay:.56s,1.34s}
.slot:nth-child(1){--dx:-30px;--dy:68px;--sc:.66}.slot:nth-child(2){--dx:-12px;--dy:-76px;--sc:.88}.slot:nth-child(3){--dx:18px;--dy:38px;--sc:.58}.slot:nth-child(4){--dx:72px;--dy:-40px;--sc:1.08}.slot:nth-child(5){--dx:25px;--dy:82px;--sc:.78}.slot:nth-child(6){--dx:95px;--dy:-70px;--sc:.62}.slot:nth-child(7){--dx:125px;--dy:42px;--sc:.92}.slot:nth-child(8){--dx:180px;--dy:-24px;--sc:.7}
.phase{position:absolute;z-index:2;top:17%;width:460px;min-height:150px;padding:var(--sp-3) var(--sp-4);font-size:var(--fs-sec);line-height:1.5;background:rgba(13,27,46,.9);border:1px solid var(--line)}.phase b{display:block;margin-bottom:var(--sp-1);font-size:var(--fs-h2)}.phase-old{left:4%;color:var(--text-muted)}.phase-new{right:4%;color:var(--text);border-color:var(--sun-gold-line);box-shadow:var(--glow-gold);opacity:.45;animation:fadeRise .55s var(--motion-ease) 1.65s forwards}.phase-new b{color:var(--sun-gold)}
.state-tag{position:absolute;top:6%;padding:6px var(--sp-2);font-size:var(--fs-label);font-weight:700;border-radius:999px}
.old-tag{left:1%;color:var(--text-dim);border:1px solid var(--line-strong);animation:oldFade .7s var(--motion-ease) .8s forwards}
.new-tag{right:1%;color:var(--sun-gold);border:1px solid var(--sun-gold-line);background:var(--sun-gold-soft);opacity:0;animation:fadeRise .55s var(--motion-ease) 1.65s forwards}
.labels-title{position:relative;z-index:3;margin:auto 4% var(--sp-2);color:var(--track-blue);font-size:var(--fs-label);font-weight:700;letter-spacing:.08em}.labels{position:relative;z-index:3;height:150px;margin:0 4%;display:flex;justify-content:space-between;align-items:stretch;gap:var(--sp-3)}
.pin{position:relative;flex:1;min-width:0;min-height:140px;padding:var(--sp-3) var(--sp-3);font-size:var(--fs-sec);line-height:1.5;color:var(--text);background:rgba(13,27,46,.94);border-top:2px solid var(--track-blue);opacity:.45;transform:translateY(0);animation:fadeRise .55s var(--motion-ease) forwards}
.pin::before{content:"";position:absolute;left:50%;bottom:100%;height:28px;border-left:1px solid var(--track-blue-line)}
.pin b{display:block;color:var(--text-dim);font-size:var(--fs-label);font-weight:600}.pin:nth-child(1){animation-delay:1.9s}.pin:nth-child(2){animation-delay:2.08s}.pin:nth-child(3){animation-delay:2.26s}.pin:nth-child(4){animation-delay:2.44s}
.summary{position:relative;z-index:4;margin:0 var(--sp-6) var(--sp-5);gap:var(--sp-2)}
.summary .trunk{min-height:var(--sp-3)}
.summary .supports{padding-top:var(--sp-2);gap:var(--sp-3)}
.summary .support{min-height:54px;padding:var(--sp-2) var(--sp-3);text-align:center;opacity:.45;animation:fadeRise .45s var(--motion-ease) forwards}
.summary .support::before{height:var(--sp-2)}
.summary .support:nth-child(1){animation-delay:2.3s}.summary .support:nth-child(2){animation-delay:2.48s}.summary .support:nth-child(3){animation-delay:2.66s}.summary .support:nth-child(4){animation-delay:2.84s}
.summary .claim{font-size:clamp(20px,2.4vw,30px);padding:var(--sp-3) var(--sp-4);opacity:.45;animation:fadeRise .55s var(--motion-ease) 2.85s forwards}
.concept-note{position:absolute;left:50%;top:6%;transform:translateX(-50%);color:var(--text-muted);font-size:var(--fs-label)}
@keyframes drop{to{opacity:1;transform:translateY(0)}}
@keyframes scatter{to{transform:translate(var(--dx),var(--dy)) scale(var(--sc));background:radial-gradient(circle at 34% 30%,#D8E8F5,#71849A 55%,#40546A);box-shadow:0 0 22px rgba(77,182,255,.3)}}
@keyframes slotOut{to{border-color:transparent}}
@keyframes lineBreak{to{opacity:0;transform:translateY(55px) scaleX(.84)}}
@keyframes orbitIn{to{opacity:1;transform:translateY(-50%) rotate(-8deg) scale(1)}}
@keyframes regionIn{to{opacity:.32;transform:scaleX(1)}}
@keyframes fadeRise{to{opacity:1;transform:translateY(0)}}
@keyframes oldFade{to{opacity:.3}}
@media(prefers-reduced-motion:reduce){*{animation-duration:160ms!important;animation-delay:0ms!important}.planet{opacity:1;transform:translate(var(--dx),var(--dy)) scale(var(--sc))}.slot{border-color:transparent}.queue::before{opacity:0}.orbit{opacity:1;transform:translateY(-50%) rotate(-8deg) scale(1)}.region{opacity:.32;transform:scaleX(1)}.pin,.summary .support,.summary .claim,.new-tag{opacity:1;transform:none}.old-tag{opacity:.3}}
</style>
</head>
<body data-page="06" data-total="32">
<div id="stage">
  <header class="head shrink0" style="height:190px">
    <div class="kicker">RESET THE PICTURE</div>
    <h1>太阳系不是八颗球等距排开</h1>
    <p class="lead">那种图只方便记顺序，却把一个系统压成了静态队列。</p>
  </header>

  <main class="scene min0" style="flex:1" aria-label="八颗等大等距圆球散开，轨道和区域关系显现的概念动画">
    <div class="state-tag old-tag">旧图像 · 排排坐</div>
    <div class="state-tag new-tag">重新观察 · 看系统</div>
    <div class="phase phase-old"><b>旧图像</b>顺序清楚，关系消失</div>
    <div class="phase phase-new"><b>新框架</b>从队列转向系统</div>
    <div class="region r1"></div><div class="region r2"></div><div class="region r3"></div>
    <div class="orbit o1"></div><div class="orbit o2"></div><div class="orbit o3"></div>
    <div class="queue" aria-hidden="true">
      <div class="slot"><i class="planet"></i></div><div class="slot"><i class="planet"></i></div>
      <div class="slot"><i class="planet"></i></div><div class="slot"><i class="planet"></i></div>
      <div class="slot"><i class="planet"></i></div><div class="slot"><i class="planet"></i></div>
      <div class="slot"><i class="planet"></i></div><div class="slot"><i class="planet"></i></div>
    </div>
    <div class="labels-title">旧图压扁了四种关系</div>
    <div class="labels" aria-label="四种遗漏">
      <div class="pin"><b>错觉：差不多大</b>大小不能这样读</div>
      <div class="pin"><b>错觉：等间隔</b>距离不能这样读</div>
      <div class="pin"><b>错觉：彼此独立</b>还要看分区与关系</div>
      <div class="pin"><b>错觉：静止成列</b>实际都在运动</div>
    </div>
    <div class="concept-note">概念纠偏，不按比例</div>
  </main>

  <section class="k-generalization summary shrink0" style="height:190px;--support-cols:4">
    <div class="supports">
      <div class="support">大小</div><div class="support">距离</div><div class="support">分区</div><div class="support">运动</div>
    </div>
    <div class="trunk"></div>
    <div class="claim">太阳系不是八颗球的静态队列；要认识它，必须重新看见这些关系。</div>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>

</body>
</html>
