<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page-head{padding:28px 48px 14px}
  .kicker{font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.16em;color:var(--track-blue)}
  .model-wrap{margin:0 48px;min-height:0;--compare-cols:2;background:rgba(7,17,31,.56)}
  .model-wrap .corner{background:var(--panel-raised);border-bottom:1px solid var(--track-blue-line)}
  .model-wrap .hdr{display:flex;align-items:center;justify-content:center;gap:12px}
  #modelSvg{grid-column:1/-1;width:100%;height:100%;min-height:0;display:block}
  .axis text{fill:var(--text-muted);font:14px var(--font-mono)}
  .axis path,.axis line{stroke:var(--track-blue-line)}
  .planet-name{fill:var(--text);font:700 18px var(--font-sans)}
  .value-label{fill:var(--track-blue);font:700 16px var(--font-mono)}
  .small-label{fill:var(--text-muted);font:15px var(--font-sans)}
  .control-deck{margin:14px 48px 26px;padding:16px 22px}
  .control-deck input{height:26px}
  .point-strip{display:flex;align-items:center;gap:18px;margin-top:8px;color:var(--text-muted);font-size:var(--fs-label)}
  .point{font-family:var(--font-mono)}
  .point.seen{color:var(--sun-gold)}
  .feedback{min-height:27px;color:var(--sun-gold);font-size:var(--fs-sec)}
  .conclusion{opacity:0;transform:translateY(8px);transition:opacity 260ms ease-out,transform 260ms ease-out;color:var(--sun-gold);font-size:var(--fs-lead);font-weight:750}
  .conclusion.show{opacity:1;transform:none}
  .pulse{animation:pulse 360ms ease-out}
  @keyframes pulse{0%{stroke-width:2;opacity:.3}50%{stroke-width:7;opacity:1}100%{stroke-width:2;opacity:.3}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.intro{opacity:1!important;transform:none!important}}
  .intro{opacity:0;transform:translateY(12px);animation:enter 480ms ease-out forwards}
  @keyframes enter{to{opacity:1;transform:none}}
</style>
</head>
<body data-page="09" data-total="32">
<div id="stage">
  <header class="page-head shrink0" style="height:104px">
    <div class="kicker">SCALE GAP · 09</div>
    <div class="row items-end justify-between gap-4">
      <h1>把太阳放大，行星仍然又小又远</h1>
      <span class="chip is-current">大小与距离使用同一比例</span>
    </div>
  </header>

  <main class="k-comparison model-wrap min0" style="flex:1;grid-template-rows:58px minmax(0,1fr)">
    <div class="corner"></div>
    <div class="hdr">模型直径 <span class="label">几何大小</span></div>
    <div class="hdr">模型距离 <span class="label">到太阳的平均距离</span></div>
    <svg id="modelSvg" viewBox="0 0 720 500" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="vizTitle vizDesc">
      <title id="vizTitle">同一比例下，三颗行星的模型直径与模型距离对照</title>
      <desc id="vizDesc">地球、木星、海王星每颗各占一行。左边显示模型直径，右边显示到太阳的模型距离，两侧由连线绑定。</desc>
    </svg>
  </main>

  <section class="panel control-deck shrink0" style="height:150px">
    <div class="ctl">
      <label for="sunSize">模型太阳直径</label>
      <input id="sunSize" class="no-pan" type="range" min="1" max="100" value="14" step="1" aria-describedby="rangeHelp feedback">
      <output id="sunOut" for="sunSize">14 cm</output>
      <button id="reset" class="btn" type="button">重置到 14 cm</button>
    </div>
    <div class="row justify-between items-center gap-4">
      <div>
        <div id="rangeHelp" class="point-strip"><span>三个观察点</span><span class="point" data-point="1">○ 1 cm</span><span class="point seen" data-point="14">● 14 cm</span><span class="point" data-point="100">○ 100 cm</span></div>
        <div id="feedback" class="feedback" aria-live="polite">拖动后比较：两列数值怎样一起变化？</div>
      </div>
      <div id="conclusion" class="conclusion">无论整体放大或缩小，直径与距离的巨大落差都不会消失。</div>
    </div>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  Deck.init({index:9,total:32});
  var svg=d3.select('#modelSvg'), input=document.getElementById('sunSize');
  var output=document.getElementById('sunOut'), feedback=document.getElementById('feedback');
  var conclusion=document.getElementById('conclusion');
  var keys=['earth','jupiter','neptune'];
  var colors=['#4DB6FF','#FFC857','#75D6B2'];
  var data=keys.map(function(k,i){var p=Lec.K.planets.find(function(x){return x.key===k});return {key:k,name:p.name,r:p.meanRadiusKm,au:p.semimajorAxisAU,color:colors[i]};});
  var y=[130,260,390], dist=d3.scaleLog().domain([0.3,31]).range([446,680]);
  var visited=new Set([14]), current=14, scheduled=false;
  var root=svg.append('g').attr('class','intro');
  root.append('line').attr('x1',360).attr('x2',360).attr('y1',20).attr('y2',465).attr('stroke','rgba(255,200,87,.58)').attr('stroke-width',1);
  root.append('text').attr('x',378).attr('y',35).attr('class','small-label').text('轴为对数，仅用于容纳画面');
  root.append('text').attr('x',42).attr('y',35).attr('class','small-label').text('太阳圆盘作为共同标尺');
  root.append('circle').attr('cx',72).attr('cy',70).attr('r',25).attr('fill','#FFC857');
  root.append('text').attr('x',108).attr('y',76).attr('class','planet-name').text('太阳');
  var axis=root.append('g').attr('class','axis').attr('transform','translate(0,454)').call(d3.axisBottom(dist).tickValues([0.3,1,5,10,30]).tickFormat(function(d){return d+' AU'}));
  axis.selectAll('text').style('font-size','14px');
  var rows=root.selectAll('.planet-row').data(data).join('g').attr('class','planet-row').attr('transform',function(d,i){return 'translate(0,'+y[i]+')'}).style('opacity',Deck.reduced()?1:0);
  rows.append('line').attr('class','row-link').attr('x1',48).attr('x2',680).attr('stroke','rgba(77,182,255,.3)').attr('stroke-width',2).attr('stroke-dasharray','5 6');
  rows.append('text').attr('x',48).attr('y',-35).attr('class','planet-name').text(function(d){return d.name});
  rows.append('circle').attr('class','body-ring').attr('cx',190).attr('fill','none').attr('stroke',function(d){return d.color}).attr('stroke-width',2);
  rows.append('circle').attr('class','body').attr('cx',190).attr('fill',function(d){return d.color});
  rows.append('text').attr('class','diam value-label').attr('x',235).attr('y',6);
  rows.append('circle').attr('class','distance-dot').attr('r',7).attr('fill',function(d){return d.color});
  rows.append('text').attr('class','distance value-label').attr('text-anchor','end').attr('x',680).attr('y',-13);
  rows.append('text').attr('class','au small-label').attr('text-anchor','end').attr('x',680).attr('y',24).text(function(d){return Lec.P.significantFigures(d.au,3)+' AU'});
  if(!Deck.reduced()) rows.transition().delay(function(d,i){return 180+i*90}).duration(420).style('opacity',1);

  function fmtMeters(m){return m>=1000?Lec.P.significantFigures(m/1000,3)+' km':Lec.P.significantFigures(m,3)+' m'}
  function fmtDiameter(m){var mm=m*1000;return mm>=1000?Lec.P.significantFigures(mm/1000,3)+' m':mm>=10?Lec.P.significantFigures(mm/10,3)+' cm':Lec.P.significantFigures(mm,3)+' mm'}
  function render(value,animate){
    current=value; output.value=Lec.P.significantFigures(value,3)+' cm';
    var sunM=value/100;
    var sel=animate&&!Deck.reduced()?rows.transition().duration(180):rows;
    sel.select('.body').attr('r',function(d){return Math.max(0.8,Lec.P.scaleBodyDiameterForSunDiameter(d.r,sunM)*1000*0.85)});
    sel.select('.body-ring').attr('r',function(d){return Math.max(8,Lec.P.scaleBodyDiameterForSunDiameter(d.r,sunM)*1000*0.85)});
    rows.select('.diam').text(function(d){return fmtDiameter(Lec.P.scaleBodyDiameterForSunDiameter(d.r,sunM))});
    sel.select('.distance-dot').attr('cx',function(d){return dist(d.au)});
    rows.select('.distance').text(function(d){return fmtMeters(Lec.P.scaleDistanceForSunDiameter(d.au,sunM))});
  }
  function updateProgress(hit){
    document.querySelectorAll('.point').forEach(function(el){var v=+el.dataset.point, seen=visited.has(v);el.classList.toggle('seen',seen);el.textContent=(seen?'● ':'○ ')+v+' cm'});
    if(hit){feedback.textContent='比例变了，落差没变';rows.selectAll('.row-link').classed('pulse',false);void document.body.offsetWidth;rows.selectAll('.row-link').classed('pulse',true)}
    if(visited.size===3) conclusion.classList.add('show');
  }
  function commit(){scheduled=false;var raw=+input.value, snap=[1,14,100].find(function(v){return Math.abs(v-raw)<=1});if(snap!==undefined){raw=snap;input.value=raw;visited.add(raw);updateProgress(true)}render(raw,true)}
  input.addEventListener('input',function(){if(!scheduled){scheduled=true;requestAnimationFrame(commit)}});
  input.addEventListener('keydown',function(e){if((e.key==='ArrowLeft'||e.key==='ArrowDown')&&+input.value<=1||(e.key==='ArrowRight'||e.key==='ArrowUp')&&+input.value>=100){feedback.textContent='模型太阳直径范围是 1–100 cm'}});
  document.getElementById('reset').addEventListener('click',function(){input.value=14;visited.add(14);render(14,true);updateProgress(true);input.focus()});
  render(14,false); updateProgress(false);
})();
</script>
</body>
</html>
