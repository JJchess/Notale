<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page-head{padding:var(--sp-5) var(--sp-6) var(--sp-2)}
  .kicker{color:var(--track-blue);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}
  .status-wrap{min-width:260px;align-items:flex-end}
  .progress-dots{display:flex;gap:var(--sp-1)}
  .progress-dots i{display:block;width:12px;height:12px;border:1px solid var(--track-blue);border-radius:50%;background:var(--panel-deep)}
  .progress-dots i.on{background:var(--sun-gold);border-color:var(--sun-gold);box-shadow:var(--glow-gold)}
  .viz-wrap{position:relative;margin:0 var(--sp-6);min-height:0;border:1px solid var(--line);border-radius:var(--radius-md);background:rgba(9,23,40,.78);box-shadow:var(--shadow-panel)}
  #route{display:block;width:100%;height:100%}
  #route text{font-family:var(--font-sans);fill:var(--text-muted);font-size:14px}
  #route .planet-label{fill:var(--text);font-size:16px;font-weight:700}
  #route .station{cursor:pointer;outline:none}
  #route .station:focus-visible .hit{stroke:var(--focus);stroke-width:3}
  .ledger{margin:var(--sp-3) var(--sp-6) 0;--enum-cols:1;gap:6px!important}
  .ledger>.it{display:grid;grid-template-columns:60px 170px 1fr 1fr;align-items:center;gap:var(--sp-3);padding:7px var(--sp-4);border-top-width:1px;border-left:4px solid var(--track-blue);transition:border-color .2s,background .2s,box-shadow .2s}
  .ledger>.it.is-current{border-left-color:var(--sun-gold);background:linear-gradient(90deg,var(--sun-gold-soft),var(--panel))}
  .ordinal{color:var(--text-dim);font:700 var(--fs-label)/1.4 var(--font-mono)}
  .planet{font-size:var(--fs-body);font-weight:700;color:var(--track-blue)}
  .ledger>.it.is-current .planet{color:var(--sun-gold)}
  .distance,.time{font:700 var(--fs-sec)/1.4 var(--font-mono);font-variant-numeric:tabular-nums}
  .distance{color:var(--text-muted)}
  .time{color:var(--text-dim)}
  .it.is-current .time{color:var(--sun-gold)}
  .foot{height:82px;padding:var(--sp-2) var(--sp-6) var(--sp-4)}
  .take{padding-left:var(--sp-3);border-left:5px solid var(--sun-gold);font-size:var(--fs-lead);line-height:1.5;font-weight:700}
  #completion{color:var(--sun-gold);font:700 var(--fs-lead)/1.4 var(--font-mono);opacity:0}
  #completion.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-page="10" data-total="32">
<div id="stage">
  <header class="page-head row items-end justify-between shrink0" style="height:154px;box-sizing:border-box">
    <div class="col gap-1 min0">
      <div class="kicker">LIGHT-TIME LEDGER</div>
      <h1>从太阳出发，光要走多久？</h1>
      <p class="note">点击任意站牌，观察单程光行时间如何从分钟增至小时。</p>
    </div>
    <div class="status-wrap col gap-2 shrink0" aria-live="polite">
      <span id="status" class="chip">已点亮</span>
      <div id="progress" class="progress-dots" aria-hidden="true"></div>
    </div>
  </header>

  <main class="viz-wrap min0" style="flex:1">
    <svg id="route" viewBox="0 0 1200 520" role="group" aria-label="太阳到八颗行星的对数距离尺；可点击各行星站牌"></svg>
  </main>

  <section id="ledger" class="ledger k-enumeration min0" style="height:360px" aria-label="八颗行星光程账本"></section>

  <footer class="foot row items-center justify-between gap-4">
    <p class="take">到地球约 8 分钟，到海王星已超过 4 小时。</p>
    <div class="row items-center gap-3 shrink0">
      <span id="completion" aria-live="polite"></span>
      <button id="reset" class="btn" type="button">全部熄灭，重看一次</button>
    </div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  Deck.init({index:10,total:32});
  var planets=Lec.K.planets.slice().sort(function(a,b){return a.order-b.order;});
  var data=planets.map(function(p){
    return {key:p.key,name:p.name,order:p.order,au:p.semimajorAxisAU,minutes:Lec.P.lightTravelTimeFromAUMinutes(p.semimajorAxisAU)};
  });
  var lit=new Set(), current=null;
  var status=document.getElementById('status'), progress=document.getElementById('progress');
  var ledger=document.getElementById('ledger'), completion=document.getElementById('completion');
  var reduced=Deck.reduced();
  function sig(v){return Lec.P.significantFigures(v,3);}
  function timeText(v){
    var mins=sig(v);
    if(v<60) return mins+' 分钟';
    var h=Math.floor(v/60), m=Lec.P.round(v-h*60,0);
    return mins+' 分钟（'+h+' 小时 '+m+' 分）';
  }
  data.forEach(function(d){
    var row=document.createElement('div'); row.className='it'; row.id='row-'+d.key;
    row.innerHTML='<span class="ordinal"></span><span class="planet"></span><span class="distance"></span><span class="time">等待点亮</span>';
    row.querySelector('.ordinal').textContent=String(d.order).padStart(2,'0');
    row.querySelector('.planet').textContent=d.name;
    row.querySelector('.distance').textContent=sig(d.au)+' AU';
    ledger.appendChild(row);
    var dot=document.createElement('i'); progress.appendChild(dot);
  });
  function update(){
    status.textContent='已点亮 '+lit.size+' / '+data.length;
    data.forEach(function(d,i){
      var on=lit.has(d.key), row=document.getElementById('row-'+d.key);
      row.classList.toggle('is-current',on);
      row.querySelector('.time').textContent=on?timeText(d.minutes):'等待点亮';
      progress.children[i].classList.toggle('on',on);
    });
    d3.selectAll('.station .core').attr('fill',function(d){return lit.has(d.key)?'#FFC857':'#4DB6FF';});
    if(lit.size===data.length){completion.textContent='8 分钟 → 4 小时以上';completion.classList.add('show');d3.select('#mainline').attr('stroke','#FFC857').attr('opacity',.78);}
    else{completion.textContent='';completion.classList.remove('show');d3.select('#mainline').attr('stroke','#4DB6FF').attr('opacity',.8);}
  }
  var svg=d3.select('#route'), x=d3.scaleLog().domain([0.3,31]).range([0,1]).clamp(true);
  var x0=126,x1=1148,y=236;
  svg.append('defs').append('filter').attr('id','glow').append('feGaussianBlur').attr('stdDeviation',6).attr('result','b');
  svg.append('circle').attr('cx',74).attr('cy',y).attr('r',34).attr('fill','#FFC857').attr('opacity',.22);
  svg.append('circle').attr('cx',74).attr('cy',y).attr('r',20).attr('fill','#FFC857');
  svg.append('text').attr('x',74).attr('y',300).attr('text-anchor','middle').attr('class','planet-label').text('太阳');
  svg.append('line').attr('id','mainline').attr('x1',x0).attr('x2',x1).attr('y1',y).attr('y2',y).attr('stroke','#4DB6FF').attr('stroke-width',2).attr('opacity',.8);
  var stations=svg.selectAll('.station').data(data).join('g').attr('class','station').attr('tabindex',0).attr('role','button')
    .attr('aria-label',function(d){return '点亮'+d.name+'光程站牌';})
    .attr('transform',function(d){return 'translate('+(x0+x(d.au)*(x1-x0))+','+y+')';})
    .on('click',function(e,d){activate(d);})
    .on('keydown',function(e,d){if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(d);}});
  stations.append('line').attr('y1',-62).attr('y2',62).attr('stroke','#4DB6FF').attr('stroke-opacity',.36).attr('stroke-width',2);
  stations.append('circle').attr('class','hit').attr('r',22).attr('fill','transparent');
  stations.append('circle').attr('class','core').attr('r',7).attr('fill','#4DB6FF');
  stations.append('text').attr('class','planet-label').attr('text-anchor','middle').attr('y',-76).text(function(d){return d.name;});
  stations.append('text').attr('text-anchor','middle').attr('y',88).text(function(d){return sig(d.au)+' AU';});
  var pulse=svg.append('circle').attr('r',10).attr('cy',y).attr('fill','#FFC857').attr('filter','url(#glow)').attr('opacity',0);
  function activate(d){
    var repeated=lit.has(d.key); current=d.key;
    var tx=x0+x(d.au)*(x1-x0), duration=450+x(d.au)*950;
    if(reduced){lit.add(d.key);update();status.textContent=repeated?'这个站牌已点亮，可比较另一颗行星':'已点亮 '+lit.size+' / '+data.length;return;}
    pulse.interrupt().attr('cx',x0).attr('opacity',1).transition().duration(duration).ease(d3.easeCubicInOut).attr('cx',tx).on('end',function(){
      pulse.attr('opacity',0);lit.add(d.key);update();
      status.textContent=repeated?'这个站牌已点亮，可比较另一颗行星':'已点亮 '+lit.size+' / '+data.length;
      d3.select(stations.nodes()[d.order-1]).select('.core').transition().duration(150).attr('r',8.12).transition().duration(180).attr('r',7);
    });
  }
  document.getElementById('reset').addEventListener('click',function(){pulse.interrupt().attr('opacity',0);lit.clear();current=null;update();status.textContent='已点亮 '+lit.size+' / '+data.length;});
  update();
})();
</script>
</body>
</html>
