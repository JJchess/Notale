<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .scene{position:relative;isolation:isolate;padding:0 var(--sp-7) var(--sp-5);}
  .scene::before{position:absolute;inset:0;z-index:-2;content:"";background:radial-gradient(circle at 12% 54%,rgba(255,200,87,.10),transparent 16%),linear-gradient(90deg,transparent 35%,rgba(7,17,31,.78) 45%,rgba(7,17,31,.94) 55%,transparent 72%);}
  .eyebrow{color:var(--track-blue);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;letter-spacing:.14em;}
  .distance-field{position:absolute;z-index:-1;left:var(--sp-6);right:var(--sp-6);top:25%;height:450px;background:linear-gradient(180deg,transparent,rgba(77,182,255,.07) 28%,rgba(77,182,255,.07) 72%,transparent);mask-image:linear-gradient(90deg,transparent 0%,#000 14%,#000 86%,transparent 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 14%,#000 86%,transparent 100%);}
  .axis-line{position:absolute;top:178px;left:0;right:0;height:2px;background:rgba(77,182,255,.28);box-shadow:0 -64px 90px rgba(77,182,255,.12),0 64px 90px rgba(77,182,255,.12);transform-origin:left center;animation:drawline 900ms ease-out both;}
  .sun{position:absolute;left:12%;top:167px;width:22px;height:22px;border-radius:50%;background:var(--sun-gold);box-shadow:0 0 14px var(--sun-gold),0 0 42px rgba(255,200,87,.48);animation:ignite 520ms ease-out both;}
  .planet{position:absolute;top:173px;width:10px;height:10px;border:2px solid var(--track-blue);border-radius:50%;background:var(--bg);opacity:0;animation:pointin 300ms ease-out forwards;}
  .p1{left:18%;animation-delay:.25s}.p2{left:22%;animation-delay:.32s}.p3{left:27%;animation-delay:.39s}.p4{left:33%;animation-delay:.46s}.p5{left:46%;animation-delay:.53s}.p6{left:60%;animation-delay:.60s}.p7{left:76%;animation-delay:.67s}.p8{left:90%;animation-delay:.74s}
  .focus-copy{text-align:center;align-items:center;justify-content:center;padding-top:var(--sp-6);}
  .focus-copy .claim{max-width:18ch;padding:0;color:var(--sun-gold);font-size:clamp(40px,6vw,82px);line-height:1.12;background:none;border:0;border-radius:0;box-shadow:none;text-wrap:balance;animation:settle 420ms .85s ease-out both;}
  .thesis{max-width:18ch;color:var(--text);font-size:var(--fs-lead);line-height:1.5;font-weight:700;animation:settle 420ms .95s ease-out both;}
  .k-generalization{height:100%;justify-content:space-between;}
  .k-generalization .trunk{min-height:34px;background:linear-gradient(var(--track-blue),rgba(77,182,255,.28));}
  .k-generalization .supports{--support-cols:4;padding-top:var(--sp-4);gap:var(--sp-5);}
  .k-generalization .support{display:flex;min-height:240px;flex-direction:column;justify-content:center;padding:var(--sp-4);background:rgba(9,23,40,.76);border-color:var(--line);}
  .support-tag{display:block;margin-bottom:var(--sp-1);color:var(--track-blue);font-size:var(--fs-label);font-weight:700;}
  .support-main{display:block;color:var(--text);font-size:var(--fs-sec);line-height:1.5;}
  .support-result{display:block;margin-top:var(--sp-1);color:var(--text-muted);font-size:var(--fs-label);line-height:1.4;}
  .next{align-self:center;padding:var(--sp-2) var(--sp-4);color:var(--text);font-size:var(--fs-body);line-height:1.5;border-top:1px solid var(--sun-gold-line);}
  @keyframes drawline{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
  @keyframes ignite{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:scale(1)}}
  @keyframes pointin{to{opacity:1}}
  @keyframes settle{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){.axis-line,.sun,.planet,.focus-copy .claim,.thesis{animation:none;opacity:1;transform:none}}
</style>
</head>
<body data-page="11" data-total="32">
<div id="stage">
  <header class="row items-center justify-between" style="height:104px;padding:0 var(--sp-7)">
    <span class="eyebrow">SCALE · CONCLUSION</span>
    <span class="label">第二章 · 尺度的结论</span>
  </header>

  <main class="scene min0" style="flex:1">
    <div class="distance-field" aria-hidden="true">
      <svg viewBox="0 0 1472 360" width="100%" height="100%" preserveAspectRatio="none"><path d="M0 180 H1472" stroke="rgba(77,182,255,.16)" stroke-width="2"/><path d="M176 52 V308 M265 88 V272 M397 112 V248 M677 132 V228 M1118 144 V216" stroke="rgba(77,182,255,.10)" stroke-width="1"/></svg>
      <div class="axis-line"></div><i class="sun"></i>
      <i class="planet p1"></i><i class="planet p2"></i><i class="planet p3"></i><i class="planet p4"></i>
      <i class="planet p5"></i><i class="planet p6"></i><i class="planet p7"></i><i class="planet p8"></i>
    </div>

    <section class="k-generalization" aria-labelledby="main-claim">
      <div class="focus-copy col gap-3">
        <span class="eyebrow">由四次尺度体验归纳</span>
        <h1 id="main-claim" class="claim">空旷，才是太阳系的主体</h1>
        <p class="thesis">太阳系不是紧凑摆件</p>
        <p class="lead muted">天体很小，间隔很大</p>
        <span class="label">尺度变化 · 结论不变</span>
      </div>

      <div class="trunk" aria-hidden="true"></div>
      <div class="supports">
        <div class="support min0">
          <span class="support-tag">两种比例</span>
          <span class="support-main">同一张图，容不下两种真实比例</span>
          <span class="support-result">空旷不是画法失误</span>
        </div>
        <div class="support min0">
          <span class="support-tag">走入模型</span>
          <span class="support-main">缩小天体，间隔依然漫长</span>
          <span class="support-result">距离远大于直径</span>
        </div>
        <div class="support min0">
          <span class="support-tag">连续缩放</span>
          <span class="support-main">怎么缩放，落差都不会消失</span>
          <span class="support-result">空旷不随模型消失</span>
        </div>
        <div class="support min0">
          <span class="support-tag">光程站牌</span>
          <span class="support-main">连光都要穿行一段时间</span>
          <span class="support-result">间隔具有物理意义</span>
        </div>
      </div>
      <p class="next">下一步：空旷中分布着哪些成员？</p>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:11,total:32});</script>
</body>
</html>
