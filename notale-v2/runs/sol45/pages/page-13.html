<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--motion-fast:180ms;--motion-main:560ms;--motion-ease:cubic-bezier(.2,.8,.2,1)}
#stage{padding:22px 32px 18px;gap:12px}
.head{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.kicker{font-size:var(--fs-label);font-weight:750;letter-spacing:.16em;color:var(--track-blue)}
.progress{min-width:160px;text-align:center}
.lab{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 330px minmax(0,1fr);gap:16px;min-height:0}
.wing{min-width:0;display:flex;flex-direction:column;padding:14px;border:1px solid var(--track-blue-line);border-radius:var(--radius-lg);background:rgba(9,23,40,.72);box-shadow:var(--glow-blue);animation:wingIn var(--motion-main) var(--motion-ease) both}
.wing.right{animation-name:wingInR}.wing-title{height:44px;display:flex;align-items:center;justify-content:space-between}.wing-title h2{color:var(--track-blue)}
.slots{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:10px;min-height:0}
.slot{position:relative;min-width:0;display:grid;grid-template-columns:128px minmax(0,1fr);grid-template-rows:auto 1fr;padding:10px;border:1px dashed var(--line-strong);border-radius:var(--radius-md);background:rgba(13,27,46,.5);transition:border-color var(--motion-fast),box-shadow var(--motion-fast)}
.slot:focus-visible,.slot.target{outline:3px solid var(--focus);outline-offset:2px}.slot.matched{border-style:solid;border-color:var(--sun-gold-line);box-shadow:inset 0 0 24px var(--sun-gold-soft)}
.planet-photo{grid-row:1/3;width:120px;height:120px;align-self:center;object-fit:contain;background:#02070d;border-radius:50%;filter:saturate(.7);transition:filter var(--motion-main),box-shadow var(--motion-main)}
.slot.matched .planet-photo{filter:none;box-shadow:0 0 22px rgba(255,200,87,.32)}
.pname{font-size:var(--fs-body);font-weight:750;align-self:center}.sub{font-size:var(--fs-label);color:var(--text-muted)}
.metrics{grid-column:1/-1;align-self:end;padding-top:7px;border-top:1px solid var(--line);font-family:var(--font-mono);font-size:14px;line-height:1.45;color:var(--text-muted);opacity:.18}
.matched .metrics{opacity:1;color:var(--text)}
.bar{height:5px;margin-top:3px;background:var(--panel-raised);border-radius:9px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:var(--sun-gold);transition:width var(--motion-main) var(--motion-ease)}.matched .bar i{width:var(--w)}
.pool{min-width:0;display:flex;flex-direction:column;gap:10px;padding:14px;background:rgba(13,27,46,.92);border:1px solid var(--sun-gold-line);border-radius:var(--radius-lg);box-shadow:var(--shadow-panel)}
.pool-head{text-align:center}.pool-head p{font-size:var(--fs-sec);line-height:1.5;color:var(--text-muted)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0}.match-card{min-width:0;padding:9px 10px;text-align:left;color:var(--text);font:inherit;background:var(--panel-raised);border:1px solid var(--line-strong);border-radius:var(--radius-sm);cursor:grab;touch-action:none;animation:cardUp 480ms var(--motion-ease) both;animation-delay:calc(var(--i)*55ms)}
.match-card strong{display:block;font-size:var(--fs-sec)}.match-card span{display:block;font-family:var(--font-mono);font-size:14px;color:var(--track-blue)}.match-card.dragging{z-index:10;cursor:grabbing;box-shadow:var(--glow-gold);transition:none}.match-card.wrong{animation:shake 260ms ease}.match-card.done{visibility:hidden}
.feedback{min-height:50px;padding:8px 10px;font-size:var(--fs-sec);line-height:1.45;color:var(--text-muted);border-top:1px solid var(--line)}
.footer{height:112px;display:flex;align-items:center;gap:16px}.comparison{flex:1;--compare-cols:2;grid-template-columns:150px repeat(2,minmax(0,1fr))}.comparison>*{padding:6px 14px}.comparison .hdr{font-size:var(--fs-body)}.comparison .dim{font-size:var(--fs-label)}
.conclusion{display:none;flex:0 0 430px;padding:12px 16px;border-left:6px solid var(--sun-gold);background:var(--sun-gold-soft);border-radius:var(--radius-sm)}.complete .conclusion{display:block}.reset{display:none}.complete .reset{display:inline-flex}
@keyframes wingIn{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}@keyframes wingInR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}@keyframes cardUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

const planets=Object.fromEntries(Lec.K.planets.map(p=>[p.key,p]));
const state={matched:[],target:0}; let active=null,drag=null;
const slots=[...terrestrial,...giant];
function fmt(v){return Lec.P.significantFigures(v,3)}
function diameter(p){return Lec.P.diameter(p.meanRadiusKm)}
const widths={}; const ds=slots.map(k=>diameter(planets[k])); const lo=Math.log(Math.min(...ds)),hi=Math.log(Math.max(...ds)); slots.forEach(k=>widths[k]=22+78*(Math.log(diameter(planets[k]))-lo)/(hi-lo));
function slotHTML(k){const p=planets[k];return `<div class="slot" data-key="${k}" tabindex="0" role="button" aria-label="${p.name}照片，接收同名属性卡"><img class="planet-photo astro-photo" src="${photos[k]}" alt="${p.name}全盘图" title="NASA/JPL 公共领域图像，经 Wikimedia Commons 获取"><div><div class="pname">${p.name}</div><div class="sub">${subtype[k]||'类地行星'}</div></div><div class="metrics">直径 ${fmt(diameter(p))} km · 密度 ${fmt(p.meanDensityKgM3)} kg/m³<br>${matter[k]}<div class="bar"><i style="--w:${widths[k]}%"></i></div></div></div>`}
document.querySelector('#leftSlots').innerHTML=terrestrial.map(slotHTML).join('');document.querySelector('#rightSlots').innerHTML=giant.map(slotHTML).join('');
const cards=document.querySelector('#cards');cards.innerHTML=order.map((k,i)=>{const p=planets[k];return `<button type="button" class="match-card" style="--i:${i}" data-key="${k}"><strong>${p.name}</strong><span>直径 ${fmt(diameter(p))} km<br>密度 ${fmt(p.meanDensityKgM3)} kg/m³</span></button>`}).join('');
const feedback=document.querySelector('#feedback'),progress=document.querySelector('.progress');
function focusTarget(i){state.target=(i+slots.length)%slots.length;document.querySelectorAll('.slot').forEach((s,n)=>s.classList.toggle('target',n===state.target));}
function attempt(key,target,card){if(key===target){state.matched.push(key);document.querySelector(`.slot[data-key="${key}"]`).classList.add('matched');card.classList.add('done');progress.textContent=`已配对 ${state.matched.length} / ${slots.length}`;feedback.textContent=`${planets[key].name}已归位：直径、密度与主要物质现在连成一组。`;card.dispatchEvent(new CustomEvent('game-progress',{bubbles:true,detail:{state:{...state},action:'match'}}));if(state.matched.length===slots.length){document.querySelector('#stage').classList.add('complete');feedback.textContent='配对完成：沿同一行比较两类行星的体格与密度。';card.dispatchEvent(new CustomEvent('game-complete',{bubbles:true,detail:{score:slots.length,metrics:{matched:slots.length},trace:[...state.matched]}}));}else{const next=[...cards.querySelectorAll('.match-card:not(.done)')][0];next&&next.focus();}}else{feedback.textContent='密度或直径对不上这颗行星，请比较数字，不要只凭颜色猜。';card.classList.remove('wrong');void card.offsetWidth;card.classList.add('wrong');}}
cards.addEventListener('pointerdown',e=>{const c=e.target.closest('.match-card:not(.done)');if(!c)return;active=c;drag={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId);c.classList.add('dragging');});
cards.addEventListener('pointermove',e=>{if(!drag||!active)return;active.style.transform=`translate(${(e.clientX-drag.x)/Deck.s}px,${(e.clientY-drag.y)/Deck.s}px)`;});
cards.addEventListener('pointerup',e=>{if(!drag||!active)return;const c=active;c.classList.remove('dragging');c.style.transform='';c.releasePointerCapture(e.pointerId);const el=document.elementFromPoint(e.clientX,e.clientY);const s=el&&el.closest('.slot');if(s)attempt(c.dataset.key,s.dataset.key,c);active=null;drag=null;});
cards.addEventListener('keydown',e=>{const c=e.target.closest('.match-card:not(.done)');if(!c)return;if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();focusTarget(state.target-1)}if(['ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();focusTarget(state.target+1)}if(e.key==='Enter'){e.preventDefault();attempt(c.dataset.key,slots[state.target],c)}});
document.querySelectorAll('.slot').forEach((s,i)=>s.addEventListener('click',()=>{const c=document.activeElement.closest&&document.activeElement.closest('.match-card:not(.done)');if(c)attempt(c.dataset.key,s.dataset.key,c);focusTarget(i)}));
document.querySelector('.reset').addEventListener('click',()=>{state.matched=[];state.target=0;document.querySelector('#stage').classList.remove('complete');document.querySelectorAll('.slot').forEach(s=>s.classList.remove('matched','target'));document.querySelectorAll('.match-card').forEach(c=>c.classList.remove('done','wrong'));progress.textContent='已配对 0 / 8';feedback.textContent='先比较直径与密度，再决定卡片属于哪颗行星。';cards.querySelector('.match-card').focus();document.dispatchEvent(new CustomEvent('game-reset'));});
focusTarget(0);
})();
</script>
</body></html>
