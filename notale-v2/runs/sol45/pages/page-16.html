<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#07111F;--text:#EAF4FF;--font-sans:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
#stage{padding:48px 64px 42px}
.eyebrow{color:var(--track-blue);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.16em}
.page-title{font-size:clamp(34px,4vw,60px);line-height:1.18;max-width:1080px}
.intro{color:var(--text-muted);font-size:var(--fs-lead);line-height:1.5}
.plate{position:relative;isolation:isolate;min-height:0;border:1px solid var(--line);border-radius:var(--radius-lg);background:linear-gradient(145deg,rgba(13,27,46,.78),rgba(9,23,40,.48));box-shadow:var(--shadow-panel);overflow:hidden}
.plate:before,.plate:after{content:"";position:absolute;border:1px solid rgba(77,182,255,.09);border-radius:50%;pointer-events:none}
.plate:before{width:620px;height:220px;right:70px;top:115px;transform:rotate(-11deg)}
.plate:after{width:850px;height:310px;left:260px;top:80px;transform:rotate(-11deg)}
.corner{position:absolute;width:22px;height:22px;border-color:var(--track-blue-line);z-index:3}
.c1{left:18px;top:18px;border-left:1px solid;border-top:1px solid}.c2{right:18px;bottom:18px;border-right:1px solid;border-bottom:1px solid}
.topology{position:absolute;inset:0;z-index:1;width:100%;height:100%}
.plate .supports{position:absolute;inset:0;display:block;padding:0}
.plate .supports:before{display:none}
.plate .supports .branch{position:absolute}
.plate .spine{width:824px;right:auto;min-height:0;align-self:auto}
.route{fill:none;stroke:var(--track-blue);stroke-width:1.5;stroke-dasharray:620;stroke-dashoffset:620;opacity:.72;animation:route-in .65s ease-out forwards;animation-delay:1.05s}
.route-dot{fill:var(--track-blue)}
.mainline{fill:none;stroke:var(--sun-gold);stroke-width:3;filter:drop-shadow(0 0 8px rgba(255,200,87,.4));stroke-dasharray:1000;stroke-dashoffset:1000;animation:route-in .8s ease-out forwards}
.branch{position:absolute;z-index:2;width:310px;padding:15px 18px 14px;background:rgba(13,27,46,.92);border:1px solid var(--track-blue-line);border-radius:var(--radius-sm);opacity:0;transform:translateY(8px);animation:label-in .4s ease-out forwards;animation-delay:1.25s}
.branch strong{display:block;color:var(--track-blue);font-size:var(--fs-sec);line-height:1.5;letter-spacing:.05em}.branch span{display:block;color:var(--text-muted);font-size:var(--fs-sec);line-height:1.5}
.star{left:62px;top:72px}.dwarf{right:66px;top:48px}.moons{left:110px;bottom:72px}.small{right:52px;bottom:188px}
.spine{position:absolute;z-index:3;left:330px;right:318px;top:46%;height:118px;transform:rotate(-6deg);transform-origin:center}
.spine-title{position:absolute;left:0;top:-38px;color:var(--sun-gold);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}
.planets{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between}
.planet{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--text);font-size:var(--fs-label);line-height:1.4;white-space:nowrap;opacity:0;animation:node-in .25s ease-out forwards}
.planet:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sun-gold);box-shadow:var(--glow-gold)}
.planet:nth-child(1){animation-delay:.35s}.planet:nth-child(2){animation-delay:.43s}.planet:nth-child(3){animation-delay:.51s}.planet:nth-child(4){animation-delay:.59s}.planet:nth-child(5){animation-delay:.67s}.planet:nth-child(6){animation-delay:.75s}.planet:nth-child(7){animation-delay:.83s}.planet:nth-child(8){animation-delay:.91s}
.family{position:absolute;z-index:3;left:50%;bottom:22px;transform:translateX(-50%);padding:7px 18px;color:var(--track-blue);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.1em;background:var(--panel-deep);border:1px solid var(--track-blue-line);border-radius:999px}
.plate .claimbox{position:absolute;z-index:4;right:34px;bottom:30px;width:500px;padding:18px 24px!important;font-size:22px!important;opacity:0;animation:claim-in .45s ease-out 1.35s forwards}
.transition{position:absolute;z-index:4;left:36px;bottom:24px;width:470px;color:var(--text-muted);font-size:var(--fs-sec);line-height:1.5}
@keyframes route-in{to{stroke-dashoffset:0}}@keyframes node-in{to{opacity:1}}@keyframes label-in{to{opacity:1;transform:none}}@keyframes claim-in{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.route,.mainline,.branch,.planet,.claimbox{animation:none;stroke-dashoffset:0;opacity:1;transform:none}}
</style>
</head>
<body data-page="16" data-total="32">
<div id="stage">
  <header class="col gap-2 shrink0" style="height:148px">
    <div class="eyebrow">MEMBER LINEAGE · CHAPTER III</div>
    <h1 class="page-title"><span id="planet-count">八</span>颗行星是主干，不是全部</h1>
    <p class="intro">太阳系是一套有层级、有分支的成员谱系。</p>
  </header>
  <main class="k-generalization plate min0" style="flex:1" aria-label="太阳系成员谱系技术线框图">
    <i class="corner c1" aria-hidden="true"></i><i class="corner c2" aria-hidden="true"></i>
    <svg class="topology" viewBox="0 0 1472 662" preserveAspectRatio="none" aria-hidden="true">
      <path class="mainline" d="M330 354 L1154 267"/>
      <path class="route" d="M330 354 L286 198 L372 198"/><circle class="route-dot" cx="330" cy="354" r="4"/>
      <path class="route" d="M805 304 L1050 178 L1136 178"/>
      <path class="route" d="M660 319 L480 475 L392 475"/>
      <path class="route" d="M987 285 L1110 450 L1195 450"/>
      <path class="route" d="M740 311 L740 612" stroke-dasharray="5 7"/>
    </svg>
    <section class="supports" aria-label="四条成员分支">
      <div class="support branch star"><strong>恒星</strong><span>太阳：系统的中心恒星</span><span>组织整个成员谱系</span></div>
      <div class="support branch dwarf"><strong>矮行星</strong><span>已正式承认 <b id="dwarf-count">—</b> 颗</span><span>与行星相邻，但分类不同</span></div>
      <div class="support branch moons"><strong>卫星</strong><span>绕行星或矮行星运行的世界</span><span>展开出次级系统</span></div>
      <div class="support branch small"><strong>小天体</strong><span>小行星、彗星、海王星外天体</span><span>数量庞大的成员群</span></div>
    </section>
    <div class="trunk spine" aria-label="八颗行星主干">
      <span class="spine-title">PLANETARY TRUNK</span>
      <div class="planets">
        <span class="planet">水星</span><span class="planet">金星</span><span class="planet">地球</span><span class="planet">火星</span>
        <span class="planet">木星</span><span class="planet">土星</span><span class="planet">天王星</span><span class="planet">海王星</span>
      </div>
    </div>
    <div class="family">太阳系成员谱系</div>
    <p class="transition">下一步：从“有哪些成员”，转向“它们为什么能够持续绕行”。</p>
    <p class="claim claimbox">八颗行星是认识太阳系的主干，却不是太阳系的全部。</p>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function(){
  const values = x => Array.isArray(x) ? x : Object.values(x || {});
  const planets = values(Lec.K.planets);
  const dwarfs = values(Lec.K.dwarfPlanets);
  document.getElementById('planet-count').textContent = planets.length === 8 ? '八' : String(planets.length);
  document.getElementById('dwarf-count').textContent = String(dwarfs.length);
  Deck.init({index:16,total:32});
})();
</script>
</body>
</html>
