<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .hero{padding:24px 36px 12px;align-items:flex-end}
  .eyebrow{color:var(--track-blue);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}
  .scene{position:relative;margin:0 36px;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:radial-gradient(circle at 39% 50%,rgba(77,182,255,.07),transparent 42%),rgba(3,10,19,.58)}
  #space{position:absolute;inset:0;width:100%;height:100%}
  .legend{position:absolute;left:22px;top:18px;display:flex;gap:18px;color:var(--text-muted);font-size:var(--fs-label)}
  .legend i{display:inline-block;width:26px;margin-right:7px;vertical-align:middle;border-top:2px solid var(--track-blue)}
  .legend .grav i{border-color:var(--sun-gold)}
  .score{position:absolute;right:20px;top:18px;width:390px;padding:16px 18px;background:rgba(9,23,40,.9)}
  .score-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .score .axis{gap:7px}
  .score .step{padding:9px 10px;text-align:center;font-size:var(--fs-label)}
  .score .arw{flex-basis:20px;font-size:18px}
  .dot{display:inline-block;width:9px;height:9px;margin-right:6px;border:1px solid var(--text-dim);border-radius:50%}
  .step.is-current .dot{background:var(--sun-gold);border-color:var(--sun-gold);box-shadow:var(--glow-gold)}
  .status{position:absolute;left:22px;bottom:18px;max-width:650px;padding:10px 14px;border-left:4px solid var(--track-blue);background:rgba(9,23,40,.88);font-size:var(--fs-sec);line-height:1.5}
  .scene-label{position:absolute;color:var(--text-muted);font-size:var(--fs-label);line-height:1.4;pointer-events:none}
  .status.good{border-color:var(--sun-gold);color:var(--sun-gold)}
  .console{margin:12px 36px 20px;padding:16px 20px;align-items:center}
  .console .ctl{flex:1}
  input[type=range]{height:34px}
  .speed{min-width:150px;color:var(--sun-gold);font:700 var(--fs-h2)/1.3 var(--font-mono)}
  .take{max-width:470px;padding-left:20px;border-left:1px solid var(--line);font-size:var(--fs-sec);line-height:1.5;color:var(--text-muted)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){.hero,.scene,.console{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="17" data-total="32">
<div id="stage">
  <header class="hero row justify-between shrink0" style="height:78px">
    <div><div class="eyebrow">ORBIT AS FALLING · 17</div><h1>一直落下，却没有撞上</h1></div>
    <p class="lead">只改变横向初速度，观察三种去向。</p>
  </header>
  <main class="scene min0 no-pan" style="flex:1">
    <canvas id="space" class="cv-fill" aria-label="太阳引力下的横向发射轨迹"></canvas>
    <div class="legend"><span><i></i>运动轨迹</span><span class="grav"><i></i>引力方向</span></div>
    <span class="scene-label" style="left:35%;top:58%">引力中心｜太阳</span>
    <span class="scene-label" style="left:52%;top:47%">固定发射点</span>
    <span class="scene-label" style="left:53%;top:39%">切线方向 ↑</span>
    <span class="scene-label" style="left:12%;top:84%">淡蓝虚线｜逃逸观察圈</span>
    <section class="score panel" aria-label="发现记录">
      <div class="score-top"><strong>轨迹结果</strong><span id="count" class="chip">已发现 0/3</span></div>
      <div class="k-process"><div class="axis">
        <div id="fallStep" class="step"><span class="dot"></span>坠落</div><span class="arw"></span>
        <div id="orbitStep" class="step"><span class="dot"></span>绕行</div><span class="arw"></span>
        <div id="escapeStep" class="step"><span class="dot"></span>逃逸</div>
      </div></div>
    </section>
    <div id="status" class="status" aria-live="polite">拖动横向速度，再按“发射”；留意轨迹如何不断弯向太阳。</div>
  </main>
  <section class="console panel row gap-4 shrink0" style="height:92px">
    <div class="ctl"><label for="speed">横向速度</label><input id="speed" type="range" min="0.55" max="1.55" step="0.05" value="0.80"><output id="speedOut" class="speed">—</output></div>
    <button id="launch" class="btn is-primary" type="button">发射</button>
    <button id="reset" class="btn" type="button">重置实验</button>
    <p class="take">轨道不是被圆环托住：天体在太阳引力中不断下落，却因横向运动持续错过太阳。</p>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:17,total:32});
  var Engine=Matter.Engine, Bodies=Matter.Bodies, Body=Matter.Body, Composite=Matter.Composite;
  var engine=Engine.create({gravity:{x:0,y:0,scale:0},positionIterations:8,velocityIterations:6});
  var cv=document.getElementById('space'), ctx, W=1000,H=560,cx=400,cy=290,R=215,sunR=86,mu=1900;
  var projectile=null, trail=[], running=false, angleSum=0,lastAngle=0, factor=.8, result='', found={fall:false,orbit:false,escape:false};
  var speed=document.getElementById('speed'), out=document.getElementById('speedOut'), status=document.getElementById('status');
  var vcReal=Lec.P.circularOrbitalVelocity(Lec.K.sun.massKg,Lec.P.auToM(1));
  var veReal=Lec.P.escapeVelocity(Lec.K.sun.massKg,Lec.P.auToM(1));
  var sig=function(v){return Lec.P.significantFigures(v,3)};
  function fit(){ctx=Deck.fit(cv);W=cv.offsetWidth;H=cv.offsetHeight;cx=W*.39;cy=H*.52;R=Math.min(220,H*.34);sunR=R*.39;draw();}
  function displayPoint(p){var dx=p.x-cx,dy=p.y-cy,r=Math.hypot(dx,dy);if(r<=R*1.55)return p;var rr=R*1.55+Math.log(1+(r-R*1.55)/R)*R*.48;return{x:cx+dx/r*rr,y:cy+dy/r*rr};}
  function updateReadout(){factor=Number(speed.value);out.textContent=sig(factor)+' × 圆轨道速度';}
  function launch(){
    if(projectile) Composite.remove(engine.world,projectile);
    factor=Number(speed.value);trail=[];result='';angleSum=0;lastAngle=0;running=true;
    projectile=Bodies.circle(cx+R,cy,7,{frictionAir:0,restitution:0,inertia:Infinity,collisionFilter:{mask:0}});
    Composite.add(engine.world,projectile);
    Body.setVelocity(projectile,{x:0,y:-Math.sqrt(mu/R)*factor});
    status.className='status';status.textContent='已发射：金色短箭头持续指向太阳，蓝色尾迹显示运动方向。';
  }
  function finish(kind,msg){running=false;result=kind;found[kind]=true;status.textContent=msg;status.className='status'+(kind==='orbit'?' good':'');renderScore();draw();}
  function renderScore(){var n=0;['fall','orbit','escape'].forEach(function(k){if(found[k])n++;document.getElementById(k+'Step').classList.toggle('is-current',found[k]);});document.getElementById('count').textContent='已发现 '+n+'/3';if(n===3){status.textContent='三种轨迹都已找到：坠落、持续绕行与逃逸由初速度决定。';status.className='status good';}}
  function reset(){running=false;result='';trail=[];found={fall:false,orbit:false,escape:false};if(projectile){Composite.remove(engine.world,projectile);projectile=null;}speed.value='0.80';updateReadout();renderScore();status.className='status';status.textContent='拖动横向速度，再按“发射”；留意轨迹如何不断弯向太阳。';draw();speed.focus();}
  function step(){if(!running||!projectile)return;var p=projectile.position,dx=cx-p.x,dy=cy-p.y,r=Math.hypot(dx,dy);var force=mu*projectile.mass/(r*r);Body.applyForce(projectile,p,{x:force*dx/r,y:force*dy/r});Engine.update(engine,1000/60);p=projectile.position;r=Math.hypot(p.x-cx,p.y-cy);trail.push({x:p.x,y:p.y});if(trail.length>520)trail.shift();var a=Math.atan2(p.y-cy,p.x-cx),da=a-lastAngle;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;if(lastAngle)angleSum+=Math.abs(da);lastAngle=a;
    if(r<=sunR)finish('fall','横向速度不足，炮弹在错过太阳前撞上了。');
    else if(angleSum>=Math.PI*2.5)finish('orbit','一直下落，一直错过：已经连续绕行 1.25 圈。');
    else {var v=projectile.velocity,energy=.5*(v.x*v.x+v.y*v.y)-mu/r;if(energy>0&&r>R*2.15&&dx*v.x+dy*v.y<0)finish('escape','横向速度过大，轨迹没有再弯回太阳。');}
  }
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);ctx.save();
    ctx.strokeStyle=Deck.rgba('--track-blue',.22);ctx.lineWidth=2;ctx.setLineDash([9,10]);ctx.beginPath();ctx.arc(cx,cy,Math.min(W-cx-18,cx-18,H*.48),0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    var g=ctx.createRadialGradient(cx,cy,4,cx,cy,sunR);g.addColorStop(0,Deck.rgba('--sun-gold',1));g.addColorStop(.55,Deck.rgba('--sun-gold',.92));g.addColorStop(1,Deck.rgba('--sun-gold',.12));ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,sunR,0,Math.PI*2);ctx.fill();
    if(trail.length>1){ctx.strokeStyle=result==='orbit'?Deck.rgba('--track-blue',1):Deck.rgba('--track-blue',.75);ctx.lineWidth=result==='orbit'?4:3;ctx.beginPath();trail.forEach(function(p,i){var q=displayPoint(p);if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y);});ctx.stroke();}
    if(projectile){var q=displayPoint(projectile.position);ctx.fillStyle=Deck.rgba('--text',1);ctx.beginPath();ctx.arc(q.x,q.y,7,0,Math.PI*2);ctx.fill();if(running){var dx=cx-q.x,dy=cy-q.y,l=Math.hypot(dx,dy);Deck.arrow(ctx,q.x,q.y,q.x+dx/l*58,q.y+dy/l*58,8);ctx.strokeStyle=Deck.rgba('--sun-gold',.9);ctx.lineWidth=2;ctx.stroke();}}
    ctx.restore();
  }
  speed.addEventListener('input',updateReadout);document.getElementById('launch').addEventListener('click',launch);document.getElementById('reset').addEventListener('click',reset);
  Deck.onResize(fit);fit();updateReadout();
  Deck.loop(function(){if(running&&!Deck.reduced())step();draw();},{still:1});
  window.__orbitGame={launch:launch,reset:reset,getState:function(){return{factor:factor,result:result,found:Object.assign({},found)}}};
})();
</script>
</body>
</html>
