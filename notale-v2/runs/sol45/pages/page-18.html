<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page-head{padding:24px 44px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
  .kicker{color:var(--track-blue);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}
  .head-note{max-width:760px;color:var(--text-muted);font-size:var(--fs-sec);line-height:1.5;text-align:right}
  .lab{padding:0 44px 24px;display:flex;flex-direction:column;gap:12px;min-height:0}
  .compare-stage{position:relative;display:grid;flex:1;grid-template-columns:1fr 1fr;grid-template-rows:218px 1fr;gap:12px;min-height:0}
  .compare-stage > *{padding:0}
  .compare-stage > .sr-only{position:absolute}
  .scene{position:relative;min-width:0;min-height:0;overflow:hidden;background:rgba(9,23,40,.86);border:1px solid var(--line);border-radius:var(--radius-md);transition:border-color 240ms ease-out,opacity 240ms ease-out,box-shadow 240ms ease-out}
  .scene.is-current{border-color:var(--sun-gold);box-shadow:var(--glow-gold)}
  .scene.is-muted{opacity:.46}
  .scene-wide{grid-column:1/-1}
  .scene-title{position:absolute;z-index:3;top:13px;left:16px;display:flex;align-items:center;gap:10px}
  .scene-title strong{font-size:var(--fs-h2);line-height:1.4}
  .scene-title span{font-size:var(--fs-label);color:var(--text-muted)}
  .effect-key{position:absolute;z-index:3;right:16px;top:15px;display:flex;gap:14px;font-size:var(--fs-label);color:var(--text-muted)}
  .key-line{display:inline-flex;align-items:center;gap:7px}.key-line::before{content:"";width:22px;height:2px;background:var(--track-blue)}
  .key-line.gold::before{background:var(--sun-gold)}
  .result{position:absolute;z-index:3;right:16px;bottom:12px;padding:5px 10px;border-radius:999px;background:var(--panel-raised);color:var(--text);font-size:var(--fs-sec);line-height:1.5}
  .start-guide{position:absolute;z-index:2;left:50%;top:52px;bottom:12px;border-left:1px dashed var(--line-strong);pointer-events:none}
  canvas{transition:opacity 240ms ease-out}
  .controls{min-height:58px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md)}
  .mode-group{display:flex;gap:8px}.btn{font-size:var(--fs-sec)}
  .feedback{min-width:330px;text-align:center;color:var(--text-muted);font-size:var(--fs-sec);line-height:1.5}
  .feedback.hot{color:var(--sun-gold)}
  .progress{display:flex;align-items:center;gap:12px;color:var(--text-muted);font-size:var(--fs-label)}
  .dot{width:11px;height:11px;border:1px solid var(--track-blue);border-radius:50%}.dot.done{background:var(--track-blue);box-shadow:var(--glow-blue)}
  .conclusion{min-height:76px;padding:13px 18px;display:flex;align-items:center;gap:16px;background:linear-gradient(90deg,var(--sun-gold-soft),var(--panel));border-left:6px solid var(--sun-gold);border-radius:0 var(--radius-md) var(--radius-md) 0;font-size:var(--fs-lead);line-height:1.5}
  .conclusion strong{color:var(--sun-gold);white-space:nowrap}.conclusion.waiting{opacity:.55;border-left-color:var(--line-strong)}
  button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){.scene,canvas{transition:none}}
</style>
</head>
<body data-page="18" data-total="32">
<div id="stage">
  <header class="page-head" style="height:92px">
    <div><div class="kicker">ORBIT / CAUSAL CONTRAST</div><h1>两种作用，一条轨道</h1></div>
    <p class="head-note">切换三种条件，比较同一出发位置与同一初速度下，运动方向怎样改变。</p>
  </header>

  <main class="lab min0" style="flex:1">
    <section class="compare-stage k-comparison min0" style="--compare-cols:2" aria-label="惯性、引力与共同作用的因果对照">
      <article class="scene min0" data-scene="inertia">
        <div class="scene-title"><strong>只有惯性</strong><span>保留横向前进</span></div>
        <div class="effect-key"><span class="key-line">速度方向</span></div>
        <div class="start-guide" aria-hidden="true"></div>
        <canvas class="cv-fill" id="cv-inertia" aria-hidden="true"></canvas>
        <span class="result">不会自行转弯</span>
      </article>
      <article class="scene min0" data-scene="gravity">
        <div class="scene-title"><strong>只有引力</strong><span>保留向心拉动</span></div>
        <div class="effect-key"><span class="key-line gold">引力方向</span></div>
        <div class="start-guide" aria-hidden="true"></div>
        <canvas class="cv-fill" id="cv-gravity" aria-hidden="true"></canvas>
        <span class="result">会坠向中心</span>
      </article>
      <article class="scene scene-wide min0" data-scene="both">
        <div class="scene-title"><strong>惯性＋引力</strong><span>横向前进，同时持续向内偏转</span></div>
        <div class="effect-key"><span class="key-line">速度方向</span><span class="key-line gold">引力方向</span></div>
        <div class="start-guide" aria-hidden="true"></div>
        <canvas class="cv-fill" id="cv-both" aria-hidden="true"></canvas>
        <span class="result">下落，但一直错过太阳</span>
      </article>
    </section>

    <section class="controls" aria-label="演示控制">
      <div class="mode-group" role="group" aria-label="选择作用条件">
        <button class="btn" data-mode="inertia" aria-pressed="false">只有惯性</button>
        <button class="btn" data-mode="gravity" aria-pressed="false">只有引力</button>
        <button class="btn" data-mode="both" aria-pressed="true">惯性＋引力</button>
      </div>
      <p class="feedback" id="feedback" aria-live="polite">正在观察：两种作用共同改变运动方向</p>
      <div class="progress" aria-label="观察进度"><span id="progressText">已观察 1/3</span><i class="dot" data-dot="inertia"></i><i class="dot" data-dot="gravity"></i><i class="dot done" data-dot="both"></i></div>
      <button class="btn" id="playBtn">暂停演示</button>
      <button class="btn" id="resetBtn" hidden>从同一初态重播</button>
    </section>

    <section class="conclusion waiting" id="conclusion">
      <strong>轨道来自共同作用</strong>
      <span>天体一边沿原方向前进，一边被太阳持续拉向中心，于是不断下落、又不断错过太阳。</span>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:18,total:32});
  const modes=['inertia','gravity','both'];
  const canvases=Object.fromEntries(modes.map(m=>[m,document.getElementById('cv-'+m)]));
  const ctxs={};
  let mode='both', visited=new Set(['both']), phase=0, paused=false, completed=false, idleTimer=0;
  const reduced=Deck.reduced();

  function pathPoint(kind,t,w,h){
    const cx=w/2, cy=h*.58, r=Math.min(h*.31,w*.13), sx=cx, sy=cy-r;
    if(kind==='inertia') return {x:sx+t*w*.42,y:sy};
    if(kind==='gravity') return {x:sx,y:sy+t*r};
    const a=-Math.PI/2+t*Math.PI*2;
    return {x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r};
  }
  function draw(kind,t){
    const cv=canvases[kind], c=ctxs[kind]||Deck.fit(cv);ctxs[kind]=c;
    const w=cv.offsetWidth,h=cv.offsetHeight;c.clearRect(0,0,w,h);
    const blue=Deck.token('--track-blue'), gold=Deck.token('--sun-gold');
    const cx=w/2,cy=h*.58,r=Math.min(h*.31,w*.13), start=pathPoint(kind,0,w,h);
    c.fillStyle=Deck.rgba('--sun-gold',.12);c.beginPath();c.arc(cx,cy,25,0,Math.PI*2);c.fill();
    c.fillStyle=gold;c.beginPath();c.arc(cx,cy,11,0,Math.PI*2);c.fill();
    c.strokeStyle=Deck.rgba('--text-muted',.34);c.setLineDash([5,7]);c.beginPath();c.moveTo(start.x,start.y);c.lineTo(start.x,start.y+Math.max(24,r));c.stroke();c.setLineDash([]);
    c.strokeStyle=blue;c.lineWidth=3;c.beginPath();
    const steps=70;
    for(let i=0;i<=steps;i++){const q=pathPoint(kind,t*i/steps,w,h);i?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y)}c.stroke();
    if(reduced){for(let i=0;i<8;i++){const q=pathPoint(kind,i/7,w,h);c.fillStyle=Deck.rgba('--track-blue',.5);c.beginPath();c.arc(q.x,q.y,4,0,Math.PI*2);c.fill()}}
    const p=pathPoint(kind,t,w,h);c.fillStyle=blue;c.beginPath();c.arc(p.x,p.y,7,0,Math.PI*2);c.fill();
    if(kind!=='gravity'){let p2=pathPoint(kind,Math.min(1,t+.04),w,h);c.strokeStyle=blue;c.lineWidth=2;Deck.arrow(c,p.x,p.y,p.x+(p2.x-p.x)*2.5,p.y+(p2.y-p.y)*2.5,8);c.stroke()}
    if(kind!=='inertia'){c.strokeStyle=gold;c.lineWidth=2;Deck.arrow(c,p.x,p.y,p.x+(cx-p.x)*.22,p.y+(cy-p.y)*.22,8);c.stroke()}
  }
  modes.forEach(m=>Deck.autofit(canvases[m],()=>draw(m,reduced?1:phase)));
  function paint(){modes.forEach(m=>draw(m,reduced?1:phase))}
  const stop=Deck.loop((time,dt)=>{if(!paused&&!completed&&!reduced){phase=(phase+dt/6000)%1;paint()}},{still:1});

  function update(){
    document.querySelectorAll('[data-scene]').forEach(el=>{const own=el.dataset.scene;el.classList.toggle('is-current',own===mode&&!completed);el.classList.toggle('is-muted',!completed&&own!==mode)});
    document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
    document.querySelectorAll('[data-dot]').forEach(d=>d.classList.toggle('done',visited.has(d.dataset.dot)));
    document.getElementById('progressText').textContent='已观察 '+visited.size+'/3';
    const labels={inertia:'正在观察：运动保持原方向',gravity:'正在观察：运动转向太阳',both:'正在观察：两种作用共同改变运动方向'};
    document.getElementById('feedback').textContent=labels[mode];
    document.getElementById('feedback').classList.toggle('hot',mode==='both');
    phase=0;paint();
  }
  function choose(next){
    mode=next;visited.add(next);idleTimer++;
    const stamp=idleTimer;update();
    if(next!=='both') setTimeout(()=>{if(stamp===idleTimer&&!completed&&mode===next)document.getElementById('feedback').textContent='这里只保留了一种作用，所以还不会形成轨道。'},4000);
    if(visited.size===3&&!completed)setTimeout(finish,500);
  }
  function finish(){completed=true;mode='both';paused=true;document.getElementById('playBtn').hidden=true;document.getElementById('resetBtn').hidden=false;document.getElementById('conclusion').classList.remove('waiting');document.getElementById('feedback').textContent='三种条件已对齐：共同作用才形成持续绕行';phase=1;update()}
  document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.mode)));
  document.getElementById('playBtn').addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'继续演示':'暂停演示'});
  document.getElementById('resetBtn').addEventListener('click',()=>{completed=false;paused=false;visited=new Set(['both']);mode='both';phase=0;document.getElementById('playBtn').hidden=false;document.getElementById('playBtn').textContent='暂停演示';document.getElementById('resetBtn').hidden=true;document.getElementById('conclusion').classList.add('waiting');update()});
  update();
})();
</script>
</body>
</html>
