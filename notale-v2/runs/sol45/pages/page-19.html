<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:var(--sp-4) var(--sp-5);gap:var(--sp-3)}
  .eyebrow{font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.14em;color:var(--track-blue)}
  .hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-lg);background:rgba(9,23,40,.72);box-shadow:var(--shadow-panel)}
  #space{position:absolute;inset:0}
  .hud{position:absolute;z-index:3;top:var(--sp-3);right:var(--sp-3);width:330px;padding:var(--sp-3);background:rgba(9,23,40,.9);border:1px solid var(--line);border-radius:var(--radius-md)}
  .badges{display:flex;gap:var(--sp-1);margin-top:var(--sp-2)}
  .badge{flex:1;padding:var(--sp-1);text-align:center;color:var(--text-dim);font-size:var(--fs-label);border:1px solid var(--line);border-radius:999px}
  .badge.on{color:var(--sun-gold);border-color:var(--sun-gold);box-shadow:var(--glow-gold)}
  .scene-label{position:absolute;z-index:2;padding:5px var(--sp-2);font-size:var(--fs-label);color:var(--text);background:rgba(7,17,31,.82);border:1px solid var(--line);border-radius:999px;pointer-events:none}
  #sunLabel{left:25%;top:49%} #startLabel{left:68%;top:55%}
  #handle{position:absolute;z-index:5;left:70%;top:58%;width:190px;height:190px;transform:translate(-50%,-50%);touch-action:none;cursor:grab;border-radius:50%;outline:none}
  #handle:focus-visible{box-shadow:0 0 0 3px var(--focus)}
  #arrow{position:absolute;left:50%;top:50%;height:5px;width:92px;transform-origin:0 50%;transform:rotate(-90deg);background:var(--sun-gold);box-shadow:var(--glow-gold)}
  #arrow:after{content:"";position:absolute;right:-2px;top:-7px;border-left:14px solid var(--sun-gold);border-top:9px solid transparent;border-bottom:9px solid transparent}
  #tip{position:absolute;left:50%;top:50%;width:24px;height:24px;transform:translate(80px,-12px);border-radius:50%;background:var(--sun-gold);box-shadow:var(--glow-gold)}
  .prompt{position:absolute;z-index:3;left:var(--sp-4);bottom:var(--sp-4);max-width:460px;padding:var(--sp-3) var(--sp-4);font-size:var(--fs-sec);line-height:1.5;background:rgba(9,23,40,.9);border-left:4px solid var(--sun-gold);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
  .controls{position:absolute;z-index:4;right:var(--sp-3);bottom:var(--sp-3);display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2);background:rgba(9,23,40,.92);border:1px solid var(--line);border-radius:var(--radius-md)}
  .metric{min-width:118px;padding:0 var(--sp-2);font-size:var(--fs-label);color:var(--text-muted)}
  .metric b{display:block;color:var(--sun-gold);font:700 var(--fs-body)/1.4 var(--font-mono)}
  .k-process .step{padding:var(--sp-2);text-align:center;font-size:var(--fs-label)}
  .k-process .step b{display:block;color:var(--track-blue);font-size:var(--fs-sec)}
  .k-process .step.is-current b{color:var(--sun-gold)}
  .result{position:absolute;z-index:6;left:50%;top:50%;width:560px;transform:translate(-50%,-50%);padding:var(--sp-4);text-align:center;font-size:var(--fs-lead);font-weight:750;background:var(--panel);border:2px solid var(--sun-gold);border-radius:var(--radius-md);box-shadow:var(--glow-gold);display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-page="19" data-total="32">
<div id="stage">
  <header class="row items-end justify-between" style="height:76px">
    <div><div class="eyebrow">ORBIT SHAPES · 19</div><h1>一推之差，轨道不同</h1></div>
    <p class="lead accent">圆轨道只是许多可能轨道中的一种</p>
  </header>
  <main class="hero min0 no-pan" style="flex:1">
    <div id="space" aria-hidden="true"></div>
    <div id="sunLabel" class="scene-label">太阳｜引力中心</div>
    <div id="startLabel" class="scene-label">初始位置｜1 AU</div>
    <div id="handle" tabindex="0" role="slider" aria-label="初始速度箭头；方向键改变长度与方向" aria-valuemin="45" aria-valuemax="145" aria-valuenow="100">
      <div id="arrow"><span id="tip"></span></div>
    </div>
    <section class="hud" aria-label="发现进度">
      <div class="row justify-between"><strong>轨道发现</strong><span id="count" class="mono accent">0 / 3</span></div>
      <div class="badges"><span class="badge" data-kind="round">近圆</span><span class="badge" data-kind="ellipse">椭圆</span><span class="badge" data-kind="open">非闭合</span></div>
      <p id="status" class="sec muted" style="margin-top:var(--sp-2)" aria-live="polite">拖动箭头：长度改速度，转动改方向。</p>
    </section>
    <div class="prompt">释放箭头后，观察引力怎样持续改变运动方向，并留下新的轨迹。</div>
    <div class="controls">
      <span class="metric">速度倍率<b id="speedOut">1.00 ×</b></span>
      <span class="metric">偏离切向<b id="angleOut">0°</b></span>
      <button id="reset" class="btn" type="button">重置并再试</button>
    </div>
    <div id="result" class="result">同一起点，初速度不同，轨道不同</div>
  </main>
  <section class="k-process" aria-label="轨道形成过程" style="height:92px">
    <div class="axis">
      <div class="step is-current"><b>1 设定初态</b><span>固定起点</span></div><span class="arw"></span>
      <div class="step"><b>2 释放</b><span>给出速度</span></div><span class="arw"></span>
      <div class="step"><b>3 引力改向</b><span>持续下落</span></div><span class="arw"></span>
      <div class="step"><b>4 轨迹累积</b><span>路径显现</span></div><span class="arw"></span>
      <div class="step"><b>5 比较形状</b><span>同点异轨</span></div>
    </div>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script>
(function(){
  Deck.init({index:19,total:32});
  const host=document.getElementById('space'), handle=document.getElementById('handle'), arrow=document.getElementById('arrow');
  const speedOut=document.getElementById('speedOut'),angleOut=document.getElementById('angleOut'),status=document.getElementById('status');
  const steps=[...document.querySelectorAll('.k-process .step')], found=new Set();
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(38,1,.1,200); camera.position.set(0,10,13); camera.lookAt(0,0,0);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputColorSpace=THREE.SRGBColorSpace; host.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0x9ecfff,1.2)); const lamp=new THREE.PointLight(0xffc857,22,30); scene.add(lamp);
  const sun=new THREE.Mesh(new THREE.SphereGeometry(.48,32,32),new THREE.MeshBasicMaterial({color:0xffc857})); sun.position.x=-2; scene.add(sun); lamp.position.copy(sun.position);
  const plane=new THREE.GridHelper(12,12,0x244c70,0x17344f); plane.material.transparent=true; plane.material.opacity=.32; scene.add(plane);
  const refPts=[]; for(let i=0;i<=128;i++){let a=i/128*Math.PI*2;refPts.push(new THREE.Vector3(-2+4*Math.cos(a),.01,4*Math.sin(a)))}
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(refPts),new THREE.LineBasicMaterial({color:0x4db6ff,transparent:true,opacity:.3})));
  const body=new THREE.Mesh(new THREE.SphereGeometry(.16,20,20),new THREE.MeshStandardMaterial({color:0xeaf4ff,emissive:0x16446d})); scene.add(body);
  let currentLine=null, oldLine=null, running=false, dragging=false, mult=1, deg=0, pts=[], sim=null, elapsed=0;
  const auM=Lec.P.auToM(1), vc=Lec.P.circularOrbitalVelocity(Lec.K.sun.massKg,auM);
  function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
  Deck.onResize(resize); resize();
  function initial(){body.position.set(2,0,0);pts=[body.position.clone()];sim={x:1,y:0,vx:-Math.sin(deg*Math.PI/180)*mult,vy:Math.cos(deg*Math.PI/180)*mult};elapsed=0;}
  function setStep(n){steps.forEach((s,i)=>{s.classList.toggle('is-current',i===n);s.classList.toggle('is-past',i<n)})}
  function setHandle(){const len=54+(mult-.45)/1*82, rot=-90+deg;arrow.style.width=len+'px';arrow.style.transform='rotate('+rot+'deg)';document.getElementById('tip').style.transform='translate('+(len-12)+'px,-12px)';speedOut.textContent=Lec.P.round(mult,2).toFixed(2)+' ×';angleOut.textContent=(deg>0?'+':'')+Lec.P.round(deg,0)+'°';handle.setAttribute('aria-valuenow',Math.round(mult*100));}
  function classify(){let r=Math.hypot(sim.x,sim.y), radial=Math.abs(r-1); if(r<.18)return 'fall'; if(r>3.1)return 'open'; if(elapsed>7){return radial<.12?'round':'ellipse'} return null;}
  function finish(kind){running=false;setStep(4);let msg=''; if(kind==='fall'){msg='速度方向过于朝向太阳：它没有足够的横向运动持续错过太阳。';currentLine.material.color.set(0xff7a8a)} else {found.add(kind);msg=kind==='round'?'得到近圆轨道：速度接近切向圆轨道速度。':kind==='ellipse'?'得到椭圆轨道：天体仍被太阳束缚。':'得到非闭合轨迹：天体没有返回起点。';document.querySelector('[data-kind="'+kind+'"]').classList.add('on')}
    status.textContent=msg;document.getElementById('count').textContent=found.size+' / 3'; if(found.size===3)document.getElementById('result').style.display='block';
  }
  function release(){if(running)return;if(currentLine){if(oldLine)scene.remove(oldLine);oldLine=currentLine;oldLine.material=new THREE.LineBasicMaterial({color:0x4db6ff,transparent:true,opacity:.42})} initial();currentLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffc857}));scene.add(currentLine);running=true;setStep(2);status.textContent='引力持续改向，轨迹正在累积。';}
  function movePointer(e){if(!dragging)return;const p=Deck.pt(handle,e),cx=handle.offsetWidth/2,cy=handle.offsetHeight/2,dx=p.x-cx,dy=p.y-cy;const len=Math.hypot(dx,dy);mult=Deck.clamp(.45+(len-54)/82, .45,1.45);deg=Deck.clamp(Math.atan2(dy,dx)*180/Math.PI+90,-35,35);setHandle();setStep(1)}
  handle.addEventListener('pointerdown',e=>{dragging=true;handle.setPointerCapture(e.pointerId);movePointer(e)});handle.addEventListener('pointermove',movePointer);handle.addEventListener('pointerup',()=>{dragging=false;release()});
  handle.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowUp')mult=Deck.clamp(mult+.05,.45,1.45);if(e.key==='ArrowDown')mult=Deck.clamp(mult-.05,.45,1.45);if(e.key==='ArrowLeft')deg=Deck.clamp(deg-5,-35,35);if(e.key==='ArrowRight')deg=Deck.clamp(deg+5,-35,35);setHandle();if(e.key==='Enter'||e.key===' ')release()});
  document.getElementById('reset').addEventListener('click',()=>{running=false;mult=1;deg=0;setHandle();initial();setStep(0);status.textContent='已恢复圆轨道初速度；发现徽章保留。';document.getElementById('result').style.display='none'});
  initial();setHandle();
  Deck.loop((t,dt)=>{if(running){let total=Math.min(dt/1000,.04)*2.2, h=.004;for(let q=0;q<total;q+=h){let r=Math.hypot(sim.x,sim.y),a=-1/(r*r*r);sim.vx+=a*sim.x*h;sim.vy+=a*sim.y*h;sim.x+=sim.vx*h;sim.y+=sim.vy*h;elapsed+=h}body.position.set(-2+4*sim.x,0,4*sim.y);pts.push(body.position.clone());if(pts.length>720)pts.shift();currentLine.geometry.dispose();currentLine.geometry=new THREE.BufferGeometry().setFromPoints(pts);setStep(pts.length<20?2:3);let kind=classify();if(kind)finish(kind)}renderer.render(scene,camera)},{still:1});
})();
</script>
</body>
</html>
