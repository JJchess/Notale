<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page-head{padding:28px 42px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-5)}
  .kicker{font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.14em;color:var(--track-blue)}
  .main{padding:0 42px 16px;display:flex;gap:var(--sp-4)}
  .orbit-panel{flex:0 0 38%;position:relative;overflow:hidden;padding:var(--sp-4)}
  .charts-panel{flex:1;position:relative;padding:var(--sp-3) var(--sp-4);display:flex;flex-direction:column}
  #orbitSvg,#chartSvg{width:100%;height:100%;display:block}
  .vizbox{position:relative;flex:1;min-height:0}
  .readouts{position:absolute;top:86px;right:20px;width:185px;z-index:2}
  .readouts .value{font-size:24px}
  .chart-key{display:grid;grid-template-columns:145px 1fr;align-items:center;gap:var(--sp-2);height:40px}
  .chart-key strong{font-size:var(--fs-sec)}
  .speed-key{color:var(--track-blue)} .period-key{color:var(--sun-gold)}
  .control-band{height:88px;padding:10px 42px 12px;display:flex;align-items:center;gap:var(--sp-4)}
  .control-band .ctl{flex:1}
  input[type=range]{height:32px}
  .stations{height:166px;margin:0 42px 20px;display:grid;grid-template-columns:160px repeat(4,1fr);align-content:stretch}
  .stations>*{padding:7px 12px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);font-size:var(--fs-sec)}
  .stations .dim{justify-content:flex-end;color:var(--text-muted);font-size:var(--fs-label);font-weight:700;border-right:1px solid var(--line)}
  .stations .hdr{color:var(--track-blue);font-weight:700;background:var(--panel-raised)}
  .stations .station.current{color:var(--sun-gold);background:var(--sun-gold-soft)}
  .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--track-blue);display:inline-block;margin-right:7px}
  .visited .dot{background:var(--sun-gold);border-color:var(--sun-gold);box-shadow:var(--glow-gold)}
  .claim{height:54px;padding:0 42px 18px;color:var(--text);font-size:var(--fs-lead);font-weight:700;display:flex;align-items:center}
  .axis text{fill:var(--text-muted);font-size:14px;font-family:var(--font-mono)}
  .axis path,.axis line{stroke:var(--line-strong)}
  .grid line{stroke:var(--line);stroke-dasharray:3 5}.grid path{display:none}
  .pulse{animation:pulse 360ms ease-out}
  @keyframes pulse{50%{filter:drop-shadow(0 0 14px var(--sun-gold));transform:scale(1.02)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="20" data-total="32">
<div id="stage">
  <header class="page-head" style="height:92px">
    <div><div class="kicker">ORBITAL RHYTHM</div><h1>越远，绕得越慢也越久</h1></div>
    <p class="lead muted">拖动半径，比较同一位置上的两种变化</p>
  </header>

  <main class="main min0" style="flex:1">
    <section class="panel orbit-panel min0" aria-labelledby="orbitTitle">
      <h2 id="orbitTitle">轨道半径</h2>
      <p class="note">俯视示意；圆环间距按对数距离显示</p>
      <div class="vizbox"><svg id="orbitSvg" role="img" aria-label="太阳与当前圆轨道的俯视示意"></svg></div>
      <div class="readouts col gap-2">
        <div class="readout is-key"><span class="label">当前半径</span><span class="value" id="radiusOut"></span></div>
      </div>
    </section>

    <section class="panel charts-panel min0" aria-labelledby="compareTitle">
      <div class="chart-key"><h2 id="compareTitle">同一半径，两种节奏</h2><span class="note">共享横轴 · 距离轴为对数刻度</span></div>
      <div class="chart-key"><strong class="speed-key">速度 ↓</strong><div class="readout"><span class="label">圆轨道速度</span><span class="value" id="speedOut"></span></div></div>
      <div class="vizbox"><svg id="chartSvg" role="img" aria-label="圆轨道速度和公转周期随轨道半径变化的两幅对齐曲线"></svg></div>
      <div class="chart-key"><strong class="period-key">周期 ↑</strong><div class="readout is-key"><span class="label">公转周期</span><span class="value" id="periodOut"></span></div></div>
    </section>
  </main>

  <section class="control-band panel" aria-label="轨道半径控制">
    <div class="ctl"><label for="radius">轨道半径</label><input id="radius" class="no-pan" type="range"><output id="sliderOut"></output></div>
    <span class="chip" id="progress">已经过 0 / 4</span>
    <button class="btn" id="reset" type="button">重置到地球轨道</button>
  </section>

  <section class="k-comparison stations" style="--compare-cols:4" aria-label="四个行星距离站的平均数据">
    <div class="hdr">参照站</div><div class="hdr station" data-key="mercury"><span class="dot"></span>水星</div><div class="hdr station" data-key="earth"><span class="dot"></span>地球</div><div class="hdr station" data-key="jupiter"><span class="dot"></span>木星</div><div class="hdr station" data-key="neptune"><span class="dot"></span>海王星</div>
    <div class="dim">平均距离</div><div class="cell distance"></div><div class="cell distance"></div><div class="cell distance"></div><div class="cell distance"></div>
    <div class="dim">平均公转速度</div><div class="cell velocity"></div><div class="cell velocity"></div><div class="cell velocity"></div><div class="cell velocity"></div>
    <div class="dim">公转周期</div><div class="cell period"></div><div class="cell period"></div><div class="cell period"></div><div class="cell period"></div>
  </section>
  <div class="claim"><span class="accent">结论：</span>&nbsp;离太阳越远，公转速度通常越慢；公转周期增长得更快。<span class="note" style="margin-left:auto">表中为行星平均数据；滑杆显示同半径圆轨道模型。</span></div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  Deck.init({index:20,total:32});
  var keys=['mercury','earth','jupiter','neptune'];
  var stations=keys.map(function(k){return Lec.K.planets.find(function(p){return p.key===k;});});
  var rMin=stations[0].semimajorAxisAU, rMax=stations[3].semimajorAxisAU;
  var slider=document.getElementById('radius');
  slider.min=Math.log(rMin); slider.max=Math.log(rMax); slider.step=(Math.log(rMax)-Math.log(rMin))/1000; slider.value=Math.log(stations[1].semimajorAxisAU);
  var visited=new Set(), lastR=stations[1].semimajorAxisAU;
  function sig(v){return Lec.P.significantFigures(v,3);}
  function years(r){return Lec.P.keplerPeriodYears(r);}
  function speed(r){return Lec.P.circularOrbitalVelocity(Lec.K.sun.massKg,Lec.P.auToM(r))/1000;}
  function periodText(days){return days<Lec.K.units.daysPerJulianYear?sig(days)+' 日':sig(Lec.P.daysToYears(days))+' 年';}
  var distCells=document.querySelectorAll('.distance'), velCells=document.querySelectorAll('.velocity'), perCells=document.querySelectorAll('.period');
  stations.forEach(function(p,i){distCells[i].textContent=sig(p.semimajorAxisAU)+' AU';velCells[i].textContent=sig(p.meanOrbitalSpeedKmS)+' km/s';perCells[i].textContent=periodText(p.orbitalPeriodDays);});

  var xChart=d3.scaleLog().domain([rMin,rMax]), xOrbit=d3.scaleLog().domain([rMin,rMax]), yV=d3.scaleLinear().domain([5,50]), yT=d3.scaleLog().domain([.2,200]);
  var samples=d3.range(180).map(function(i){var r=rMin*Math.pow(rMax/rMin,i/179);return {r:r,v:speed(r),t:years(r)};});
  function draw(){
    drawOrbit(); drawCharts(); update(false);
  }
  function drawOrbit(){
    var svg=d3.select('#orbitSvg'), n=svg.node(), w=n.clientWidth,h=n.clientHeight; svg.attr('viewBox','0 0 '+w+' '+h).selectAll('*').remove();
    var cx=w*.34,cy=h*.57,maxR=Math.min(w*.55,h*.44); xOrbit.range([56,maxR]);
    var g=svg.append('g');
    stations.forEach(function(p){g.append('circle').attr('cx',cx).attr('cy',cy).attr('r',xOrbit(p.semimajorAxisAU)).attr('fill','none').attr('stroke','var(--track-blue-line)').attr('stroke-width',2).attr('stroke-dasharray','4 6');});
    g.append('circle').attr('cx',cx).attr('cy',cy).attr('r',23).attr('fill','var(--sun-gold)').style('filter','drop-shadow(0 0 18px var(--sun-gold))');
    g.append('text').attr('x',cx).attr('y',cy+48).attr('text-anchor','middle').attr('fill','var(--text-muted)').attr('font-size',15).text('太阳');
    g.append('circle').attr('id','currentOrbit').attr('cx',cx).attr('cy',cy).attr('fill','none').attr('stroke','var(--sun-gold)').attr('stroke-width',3);
    g.append('circle').attr('id','planet').attr('r',8).attr('fill','var(--sun-gold)').attr('stroke','var(--text)').attr('stroke-width',2);
    g.append('line').attr('id','radial').attr('x1',cx).attr('y1',cy).attr('stroke','var(--sun-gold-line)').attr('stroke-width',2);
    svg.node().dataset.cx=cx;svg.node().dataset.cy=cy;
  }
  function drawCharts(){
    var svg=d3.select('#chartSvg'),n=svg.node(),w=n.clientWidth,h=n.clientHeight;svg.attr('viewBox','0 0 '+w+' '+h).selectAll('*').remove();
    var m={l:66,r:28,t:18,b:42},iw=w-m.l-m.r,half=(h-m.t-m.b-38)/2;xChart.range([0,iw]);yV.range([half,0]);yT.range([half,0]);
    var g=svg.append('g').attr('transform','translate('+m.l+','+m.t+')');
    [0,half+38].forEach(function(off){g.append('g').attr('class','grid').attr('transform','translate(0,'+off+')').call(d3.axisLeft(off?yT:yV).ticks(4).tickSize(-iw).tickFormat(''));});
    g.append('path').datum(samples).attr('d',d3.line().x(function(d){return xChart(d.r)}).y(function(d){return yV(d.v)})).attr('fill','none').attr('stroke','var(--track-blue)').attr('stroke-width',3);
    g.append('path').datum(samples).attr('d',d3.line().x(function(d){return xChart(d.r)}).y(function(d){return half+38+yT(d.t)})).attr('fill','none').attr('stroke','var(--sun-gold)').attr('stroke-width',3);
    g.append('g').attr('class','axis').call(d3.axisLeft(yV).ticks(4));
    g.append('g').attr('class','axis').attr('transform','translate(0,'+(half+38)+')').call(d3.axisLeft(yT).ticks(4,'~g'));
    g.append('g').attr('class','axis').attr('transform','translate(0,'+(half*2+38)+')').call(d3.axisBottom(xChart).tickValues(stations.map(function(p){return p.semimajorAxisAU;})).tickFormat(function(d,i){return stations[i].name;}));
    g.append('text').attr('x',iw/2).attr('y',half*2+76).attr('text-anchor','middle').attr('fill','var(--text-muted)').attr('font-size',14).text('距太阳的轨道半径（AU，对数刻度）');
    g.append('line').attr('id','guide').attr('y1',0).attr('y2',half*2+38).attr('stroke','var(--sun-gold)').attr('stroke-width',2);
    g.append('circle').attr('id','vPoint').attr('r',7).attr('fill','var(--sun-gold)').attr('stroke','var(--text)').attr('stroke-width',2);
    g.append('circle').attr('id','tPoint').attr('r',7).attr('fill','var(--sun-gold)').attr('stroke','var(--text)').attr('stroke-width',2);
    svg.node().dataset.half=half;
  }
  function update(check){
    var r=Math.exp(+slider.value),v=speed(r),t=years(r);
    document.getElementById('radiusOut').textContent=sig(r)+' AU';document.getElementById('sliderOut').textContent=sig(r)+' AU';document.getElementById('speedOut').textContent=sig(v)+' km/s';document.getElementById('periodOut').textContent=sig(t)+' 年';
    var os=document.getElementById('orbitSvg'),cx=+os.dataset.cx,cy=+os.dataset.cy,rr=xOrbit(r);d3.select('#currentOrbit').attr('r',rr);d3.select('#planet').attr('cx',cx+rr).attr('cy',cy);d3.select('#radial').attr('x2',cx+rr).attr('y2',cy);
    var half=+document.getElementById('chartSvg').dataset.half,xx=xChart(r);d3.select('#guide').attr('x1',xx).attr('x2',xx);d3.select('#vPoint').attr('cx',xx).attr('cy',yV(v));d3.select('#tPoint').attr('cx',xx).attr('cy',half+38+yT(t));
    if(check){stations.forEach(function(p){if((lastR<=p.semimajorAxisAU&&r>=p.semimajorAxisAU)||(lastR>=p.semimajorAxisAU&&r<=p.semimajorAxisAU)){visited.add(p.key);var el=document.querySelector('[data-key="'+p.key+'"]');el.classList.add('visited','current');setTimeout(function(){el.classList.remove('current');},180);}});document.getElementById('progress').textContent='已经过 '+visited.size+' / '+stations.length;}
    lastR=r;
  }
  slider.addEventListener('input',function(){update(true);});
  document.getElementById('reset').addEventListener('click',function(){slider.value=Math.log(stations[1].semimajorAxisAU);update(false);slider.focus();});
  window.addEventListener('resize',draw);draw();
})();
</script>
</body>
</html>
