<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p21-head{padding:34px 56px 8px;display:flex;align-items:flex-end;justify-content:space-between}
  .p21-kicker{color:var(--track-blue);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em}
  .p21-chapter{color:var(--text-dim);font:700 var(--fs-label)/1.4 var(--font-mono)}
  .p21-main{padding:16px 56px 18px;display:flex;gap:48px;min-height:0}
  .orbit-field{position:relative;flex:1.45;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-lg);background:radial-gradient(circle at 43% 49%,var(--sun-gold-soft),transparent 11%),linear-gradient(145deg,rgba(13,27,46,.72),rgba(7,17,31,.25));box-shadow:var(--shadow-panel)}
  .orbit-field svg{display:block;width:100%;height:100%}
  .orbit{fill:none;stroke:var(--track-blue);stroke-width:1.5;opacity:.28;vector-effect:non-scaling-stroke}
  .radial{stroke:var(--sun-gold);stroke-width:1.4;opacity:.7;marker-end:url(#arrowGold)}
  .planet{filter:drop-shadow(0 0 5px rgba(77,182,255,.8))}
  .sun{filter:drop-shadow(0 0 20px rgba(255,200,87,.65))}
  .field-label{position:absolute;left:24px;top:20px;color:var(--text-muted);font-size:var(--fs-label);line-height:1.4}
  .field-note{position:absolute;left:24px;bottom:18px;color:var(--text-dim);font-size:var(--fs-sec);line-height:1.5}
  .reasoning{flex:.82;min-width:0;justify-content:center}
  .reasoning .supports{display:flex;flex-direction:column;gap:14px;padding:0 0 0 31px}
  .reasoning .supports::before{top:26px;bottom:26px;left:10px;right:auto;width:2px;height:auto;background:var(--track-blue-line)}
  .reasoning .support{padding:14px 18px 14px 22px;background:rgba(13,27,46,.72)}
  .reasoning .support::before{left:-22px;top:50%;bottom:auto;width:22px;height:2px}
  .support-top{display:flex;align-items:center;gap:12px}
  .support-num{color:var(--track-blue);font:700 var(--fs-label)/1.4 var(--font-mono)}
  .support h2{font-size:var(--fs-h2)}
  .support p{margin-top:4px;color:var(--text-muted);font-size:var(--fs-body);line-height:1.5}
  .p21-claim{box-sizing:border-box;margin:0 56px 34px;padding:18px 30px!important;display:flex;align-items:center;gap:26px;border-left-width:8px!important}
  .claim-tag{flex:0 0 auto;color:var(--sun-gold);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.1em}
  .claim-copy{font-size:clamp(30px,4vw,56px);line-height:1.16;font-weight:780;letter-spacing:-.035em}
  .claim-copy span{display:block}
  .claim-copy .second{margin-top:5px;color:var(--text-muted);font-size:.51em;line-height:1.4;font-weight:600;letter-spacing:0}
  @media (prefers-reduced-motion:reduce){.orbit{opacity:.06}.planet,.sun,.support,.p21-claim{opacity:1!important;transform:none!important}}
</style>
</head>
<body data-page="21" data-total="32">
<div id="stage">
  <header class="p21-head shrink0" style="height:104px">
    <div>
      <div class="p21-kicker">ORBITAL SYNTHESIS</div>
      <h1>轨道不是托住行星的线</h1>
    </div>
    <div class="p21-chapter">IV · 为什么它没有散架</div>
  </header>

  <main class="p21-main min0" style="flex:1">
    <section class="orbit-field min0" aria-label="八颗行星围绕同一太阳运动的示意图">
      <div class="field-label">共享中心 · 示意路径</div>
      <svg id="orbitSvg" viewBox="0 0 920 560" role="img" aria-labelledby="orbitTitle orbitDesc">
        <title id="orbitTitle">八颗行星共享太阳引力中心</title>
        <desc id="orbitDesc">轨道线淡去后，行星仍继续运动；金色箭头表示引力指向太阳。</desc>
        <defs><marker id="arrowGold" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#FFC857"/></marker></defs>
        <g id="rings"></g><g id="arrows"></g>
        <circle class="sun" cx="395" cy="278" r="27" fill="#FFC857"/>
        <circle cx="395" cy="278" r="10" fill="#fff3c4" opacity=".9"/>
        <g id="planets"></g>
      </svg>
      <div class="field-note">轨道线只是把运动路径画出来。</div>
    </section>

    <section class="reasoning k-generalization col min0" aria-label="从共同中心到结论的四层推理">
      <div class="supports" style="--support-cols:1">
        <article class="support">
          <div class="support-top"><span class="support-num">01</span><h2>共同中心</h2></div>
          <p>都受太阳引力支配</p>
        </article>
        <article class="support">
          <div class="support-top"><span class="support-num">02</span><h2>同一规则</h2></div>
          <p>引力持续指向太阳</p>
        </article>
        <article class="support">
          <div class="support-top"><span class="support-num">03</span><h2>不同路径</h2></div>
          <p>距离与初始运动不同，各走各的轨道</p>
        </article>
        <article class="support">
          <div class="support-top"><span class="support-num">04</span><h2>一个结论</h2></div>
          <p>轨道是运动留下的路径，不是实体支架</p>
        </article>
      </div>
    </section>
  </main>

  <section class="p21-claim claim k-generalization shrink0" style="height:142px" aria-label="本章结论">
    <div class="claim-tag">CHAPTER CLAIM</div>
    <div class="claim-copy"><span>行星不是被轨道线托着。</span><span class="second">它们都在向太阳持续下落，又凭横向运动不断错过太阳。</span></div>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
(function(){
  Deck.init({index:21,total:32});
  var NS='http://www.w3.org/2000/svg', cx=395, cy=278;
  var rx=[58,84,112,143,184,229,278,331], ry=[32,47,63,80,103,128,155,184];
  var colors=['#b8c4cf','#e5b06b','#4DB6FF','#d7795c','#d9b56d','#d7c19b','#84cde7','#6e91d8'];
  var rings=document.getElementById('rings'), planets=document.getElementById('planets'), arrows=document.getElementById('arrows');
  var nodes=[], angles=[];
  rx.forEach(function(r,i){
    var e=document.createElementNS(NS,'ellipse'); e.setAttribute('class','orbit'); e.setAttribute('cx',cx); e.setAttribute('cy',cy); e.setAttribute('rx',r); e.setAttribute('ry',ry[i]); e.setAttribute('pathLength','100'); rings.appendChild(e);
    var a=0.35+i*.76, p=document.createElementNS(NS,'circle');
    p.setAttribute('class','planet'); p.setAttribute('r',i<4?4+i*.35:7-i*.25); p.setAttribute('fill',colors[i]); planets.appendChild(p);
    nodes.push(p); angles.push(a);
    if(i===1||i===3||i===5||i===7){var line=document.createElementNS(NS,'line'); line.setAttribute('class','radial'); arrows.appendChild(line); p._line=line;}
  });
  function place(){nodes.forEach(function(p,i){var x=cx+rx[i]*Math.cos(angles[i]),y=cy+ry[i]*Math.sin(angles[i]);p.setAttribute('cx',x);p.setAttribute('cy',y);if(p._line){var dx=cx-x,dy=cy-y,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;p._line.setAttribute('x1',x+ux*8);p._line.setAttribute('y1',y+uy*8);p._line.setAttribute('x2',x+ux*30);p._line.setAttribute('y2',y+uy*30);}})}
  place();
  var reduced=Deck.reduced();
  if(reduced){gsap.set('.sun',{opacity:1});gsap.set('.support',{opacity:1});gsap.set('.p21-claim',{opacity:1});return;}
  gsap.set('.sun',{transformOrigin:'center',scale:.7,opacity:0});
  gsap.set('.orbit',{strokeDasharray:100,strokeDashoffset:100});
  gsap.set('.planet,.radial',{opacity:0}); gsap.set('.support',{opacity:0,x:24}); gsap.set('.p21-claim',{opacity:0,clipPath:'inset(100% 0 0 0)'});
  var tl=gsap.timeline({defaults:{ease:'power2.out'}});
  tl.addLabel('center').to('.sun',{scale:1,opacity:1,duration:.55},'center')
    .to('.orbit',{strokeDashoffset:0,duration:.75,stagger:.08},'center+=.22')
    .to('.planet,.radial',{opacity:1,duration:.45},'-=.22')
    .to('.support',{opacity:1,x:0,duration:.48,stagger:.24},'-=.12')
    .addLabel('proof')
    .to('.orbit',{opacity:.06,duration:.8},'proof+=.35')
    .to('.p21-claim',{opacity:1,clipPath:'inset(0% 0 0 0)',duration:.7},'proof+=.48');
  Deck.loop(function(t,dt){var step=Math.min(dt,.05);nodes.forEach(function(p,i){angles[i]+=step*(.34/(1+i*.36));});place();},{still:4});
})();
</script>
</body>
</html>
