<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p22-head{padding:28px 44px 16px;display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-5)}
  .p22-kicker{color:var(--track-blue);font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.16em}
  .p22-scene{position:relative;margin:0 44px;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:rgba(9,23,40,.66);box-shadow:var(--shadow-panel)}
  .p22-scene canvas{z-index:0}
  .p22-overlay{position:absolute;inset:0;z-index:2;pointer-events:none;padding:24px 28px}
  .p22-stage-name{display:table;width:max-content;font-size:var(--fs-h2);font-weight:750;color:var(--sun-gold);text-shadow:0 2px 18px var(--bg)}
  .p22-stage-line{margin-top:6px;font-size:var(--fs-sec);line-height:1.5;color:var(--text);text-shadow:0 2px 12px var(--bg)}
  .p22-model{position:absolute;right:24px;top:22px}
  .p22-temp{position:absolute;right:30px;top:92px;width:270px;opacity:0;transition:opacity 400ms cubic-bezier(.4,0,.2,1)}
  .p22-temp.on{opacity:1}
  .p22-temp-line{height:3px;margin:8px 0;background:linear-gradient(90deg,var(--sun-gold),var(--track-blue),#274B78);position:relative}
  .p22-temp-line:after{content:"→";position:absolute;right:-4px;top:-17px;color:var(--track-blue);font-size:24px}
  .p22-bottom{height:238px;padding:18px 44px 22px}
  .p22-controls{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:14px}
  .p22-controls input{flex:1;accent-color:var(--sun-gold);height:26px}
  .p22-status{min-width:108px;color:var(--sun-gold);font:700 var(--fs-label)/1.4 var(--font-mono)}
  .p22-steps .step{padding:12px 14px;min-height:70px;transition:opacity 220ms ease-out,border-color 220ms ease-out,background 220ms ease-out}
  .p22-steps .step.is-past{opacity:.72;filter:none;border-color:var(--track-blue)}
  .p22-steps .step-title{font-size:var(--fs-sec);font-weight:700;line-height:1.4}
  .p22-steps .step-note{font-size:var(--fs-label);line-height:1.4;color:var(--text-muted);margin-top:3px}
  .p22-conclusion{position:absolute;left:28px;right:28px;bottom:20px;padding:12px 18px;background:linear-gradient(90deg,rgba(255,200,87,.18),rgba(13,27,46,.92));border-left:5px solid var(--sun-gold);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:var(--fs-sec);line-height:1.5;opacity:0;transform:translateY(14px);transition:opacity 420ms cubic-bezier(.4,0,.2,1),transform 420ms cubic-bezier(.4,0,.2,1)}
  .p22-conclusion.on{opacity:1;transform:none}
  .p22-hint{font-size:var(--fs-sec);line-height:1.5;color:var(--text-muted);min-width:285px}
  .p22-hint.warn{color:var(--sun-gold)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){.p22-temp,.p22-conclusion,.p22-steps .step{transition:none!important}}
</style>
</head>
<body data-page="22" data-total="32">
<div id="stage">
  <header class="p22-head" style="height:112px">
    <div>
      <div class="p22-kicker">COMMON ORIGIN · 共同起源</div>
      <h1>同一张旋转的盘，冷暖不同的出生地</h1>
    </div>
    <p class="lead muted" style="max-width:560px">太阳与行星形成于旋转的气体尘埃盘，盘内温度由内向外总体降低。</p>
  </header>

  <main class="p22-scene min0" style="flex:1" aria-label="原行星盘四阶段动态剖视图">
    <canvas id="disk" class="cv-fill" aria-hidden="true"></canvas>
    <div class="p22-overlay">
      <div id="stageName" class="p22-stage-name">气体尘埃云</div>
      <div id="stageLine" class="p22-stage-line">原料来自同一团云</div>
      <span class="chip p22-model">简化形成模型</span>
      <div id="tempKey" class="p22-temp" aria-hidden="true">
        <div class="row justify-between label"><span>较热 · 靠近中心</span><span>较冷 · 远离中心</span></div>
        <div class="p22-temp-line"></div>
        <div class="note">温度总体由内向外降低</div>
      </div>
      <div id="conclusion" class="p22-conclusion">今天性质不同的行星，可以追溯到同一张旋转盘中冷暖不同的位置；这是一幅抓住共同起源与温度梯度的简化模型。</div>
    </div>
  </main>

  <section class="p22-bottom" aria-label="冷却盘时间轴">
    <div class="p22-controls">
      <button id="play" class="btn is-primary" type="button">▶ 播放 4 个阶段</button>
      <label class="label" for="timeline">冷却盘时间轴</label>
      <input id="timeline" class="no-pan" type="range" min="0" max="3" step="0.01" value="0" aria-label="冷却盘时间轴，共四阶段">
      <output id="status" class="p22-status" for="timeline">阶段 1 / 4</output>
      <span id="hint" class="p22-hint" aria-live="polite">拖动到阶段节点，比较盘的前后变化。</span>
    </div>
    <div class="k-process p22-steps">
      <div class="axis">
        <div class="step is-current"><div class="step-title">气体尘埃云</div><div class="step-note">共同原料</div></div><span class="arw" aria-hidden="true"></span>
        <div class="step"><div class="step-title">收缩与压扁</div><div class="step-note">旋转加快</div></div><span class="arw" aria-hidden="true"></span>
        <div class="step"><div class="step-title">原行星盘</div><div class="step-note">中心亮起</div></div><span class="arw" aria-hidden="true"></span>
        <div class="step"><div class="step-title">温度梯度</div><div class="step-note">内热外冷</div></div>
      </div>
    </div>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
Deck.init({index:22,total:32});
const cv=document.getElementById('disk'), slider=document.getElementById('timeline');
const play=document.getElementById('play'), status=document.getElementById('status');
const nameEl=document.getElementById('stageName'), lineEl=document.getElementById('stageLine');
const hint=document.getElementById('hint'), tempKey=document.getElementById('tempKey'), conclusion=document.getElementById('conclusion');
const steps=[...document.querySelectorAll('.p22-steps .step')];
const names=['气体尘埃云','收缩与压扁','原行星盘','温度梯度'];
const lines=['原料来自同一团云','收缩中的旋转使结构逐渐成盘','太阳与造行星材料共享起源','总体上：离中心越远，盘越冷'];
let value=0, seen=0, playing=false, stopPlay=null, playElapsed=0, lastT=0, pulse=0;
function setValue(v, snapped=false){
  value=Deck.clamp(v,0,3); slider.value=value;
  const s=Math.round(value); if(snapped) seen=Math.max(seen,s);
  nameEl.textContent=names[s]; lineEl.textContent=lines[s]; status.textContent=`阶段 ${s+1} / 4`;
  steps.forEach((el,i)=>{el.classList.toggle('is-current',i===s);el.classList.toggle('is-past',i<s&&i<=seen)});
  tempKey.classList.toggle('on',s===3); conclusion.classList.toggle('on',s===3);
  if(s===3&&snapped){pulse=1;play.textContent='↺ 从云团重看';}
  draw(performance.now()/1000);
}
function snap(){
  const before=value, target=Math.round(value); setValue(target,true);
  if(Math.abs(before-target)>.18){hint.textContent='停在阶段节点，比较前后变化。';hint.classList.add('warn');slider.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'none'}],{duration:240,iterations:2});}
  else {hint.textContent=lines[target];hint.classList.remove('warn');}
}
slider.addEventListener('input',()=>{if(playing) endPlay();setValue(Number(slider.value),false)});
slider.addEventListener('change',snap);
function endPlay(){playing=false;if(stopPlay){stopPlay();stopPlay=null}play.setAttribute('aria-pressed','false')}
play.addEventListener('click',()=>{
  if(playing){endPlay();play.textContent='▶ 播放 4 个阶段';return}
  if(Math.round(value)===3){seen=0;setValue(0,true);play.textContent='▶ 播放 4 个阶段';hint.textContent='已回到共同的气体尘埃云。';return}
  playing=true;playElapsed=value/3*8000;lastT=0;play.setAttribute('aria-pressed','true');play.textContent='暂停';
  if(Deck.reduced()){setValue(3,true);endPlay();return}
  stopPlay=Deck.loop((t,dt)=>{if(!lastT)lastT=t;playElapsed+=dt;const p=Deck.clamp(playElapsed/8000,0,1);setValue(p*3,false);const node=Math.floor(p*4);seen=Math.max(seen,Math.min(3,node));if(p>=1){setValue(3,true);endPlay();hint.textContent=lines[3];}}, {still:1});
});
function draw(t=0){
 const ctx=Deck.fit(cv),w=cv.offsetWidth,h=cv.offsetHeight,cx=w*.5,cy=h*.54;
 ctx.clearRect(0,0,w,h); const p=value/3, flatten=Deck.lerp(.7,.18,Deck.clamp(value/2,0,1)), radius=Deck.lerp(w*.28,w*.39,Deck.clamp(value/2,0,1));
 const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,radius*1.4);bg.addColorStop(0,Deck.rgba('--sun-gold',.08));bg.addColorStop(1,'rgba(7,17,31,0)');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
 ctx.save();ctx.translate(cx,cy);ctx.scale(1,flatten);
 for(let ring=8;ring>=1;ring--){const r=radius*ring/8;ctx.beginPath();ctx.ellipse(0,0,r,r,0,0,Math.PI*2);const grad=ctx.createLinearGradient(-r,0,r,0);if(value>=2.5){grad.addColorStop(0,'#274B78');grad.addColorStop(.58,Deck.rgba('--track-blue',.42));grad.addColorStop(1,Deck.rgba('--sun-gold',.62));}else{grad.addColorStop(0,Deck.rgba('--track-blue',.12));grad.addColorStop(1,Deck.rgba('--track-blue',.42));}ctx.strokeStyle=grad;ctx.lineWidth=Deck.lerp(14,6,p);ctx.stroke();}
 const count=54;for(let i=0;i<count;i++){const a=i*2.399+(Deck.reduced()?0:t*.08*(1+p));const spread=(.25+((i*37)%100)/100*.75)*radius;const cloud=Deck.lerp(1.22,1,Deck.clamp(value,0,1));const x=Math.cos(a)*spread*cloud,y=Math.sin(a)*spread*cloud;ctx.beginPath();ctx.arc(x,y,Deck.lerp(4,2,p),0,Math.PI*2);ctx.fillStyle=i%5===0?Deck.rgba('--sun-gold',.55):Deck.rgba('--track-blue',.34);ctx.fill();}
 ctx.restore();
 const sunR=Deck.lerp(12,34,Deck.clamp(value-1,0,1));const sg=ctx.createRadialGradient(cx,cy,0,cx,cy,sunR*3);sg.addColorStop(0,Deck.rgba('--sun-gold',1));sg.addColorStop(.25,Deck.rgba('--sun-gold',.72));sg.addColorStop(1,Deck.rgba('--sun-gold',0));ctx.fillStyle=sg;ctx.beginPath();ctx.arc(cx,cy,sunR*3*(1+pulse*.12),0,Math.PI*2);ctx.fill();pulse*=.88;
 if(value>2.5){ctx.strokeStyle=Deck.rgba('--sun-gold',.8);ctx.lineWidth=2;Deck.arrow(ctx,cx+65,cy-18,cx+radius*.78,cy-18,10);ctx.stroke();}
}
Deck.autofit(cv,()=>draw(0));
let stopAmbient=Deck.loop((t)=>draw(t),{still:0});
setValue(0,true);
</script>
</body>
</html>
