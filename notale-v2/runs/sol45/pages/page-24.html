<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .eyebrow{font-size:var(--fs-label);color:var(--track-blue);font-weight:700;letter-spacing:.12em}
  .process-strip .step{padding:var(--sp-2) var(--sp-3);text-align:center;font-size:var(--fs-sec)}
  .process-strip .branch{display:flex;gap:var(--sp-2);justify-content:center;margin-top:var(--sp-1);font-size:var(--fs-label)}
  .process-strip .branch span{padding:3px var(--sp-2);border:1px solid var(--line);border-radius:999px;background:var(--panel-deep)}
  .sim-shell{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(77,182,255,.08),rgba(9,23,40,.94));border:1px solid var(--track-blue-line);border-radius:var(--radius-lg);box-shadow:var(--shadow-panel)}
  .sim-shell:before,.sim-shell:after{content:"";position:absolute;left:0;width:100%;height:170px;border:2px solid var(--track-blue-line);border-radius:50%;opacity:.42;pointer-events:none}
  .sim-shell:before{top:18%}.sim-shell:after{top:55%}
  .sim-label{position:absolute;z-index:3;left:var(--sp-4);top:var(--sp-3)}
  .launch-help{position:absolute;z-index:3;left:var(--sp-4);bottom:var(--sp-3);max-width:430px;padding:var(--sp-2) var(--sp-3);background:rgba(7,17,31,.86);border-left:3px solid var(--sun-gold);border-radius:var(--radius-sm);font-size:var(--fs-sec);line-height:1.5}
  .result-toast{position:absolute;z-index:4;left:50%;top:18%;transform:translate(-50%,-8px);opacity:0;padding:var(--sp-2) var(--sp-4);font-size:var(--fs-body);font-weight:700;background:var(--panel-raised);border:1px solid var(--sun-gold);border-radius:999px;transition:opacity 220ms ease-out,transform 220ms ease-out;pointer-events:none}
  .result-toast.show{opacity:1;transform:translate(-50%,0)}
  canvas{display:block;max-width:100%;max-height:100%;cursor:grab}.dragging canvas{cursor:grabbing}
  .stats{display:flex;flex-direction:column;gap:var(--sp-3)}
  .meter{height:12px;overflow:hidden;background:var(--panel-deep);border:1px solid var(--line);border-radius:999px}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--track-blue),var(--sun-gold));transition:width 260ms ease-out}
  .counter-row{display:flex;justify-content:space-between;padding:var(--sp-2) 0;border-bottom:1px solid var(--line);font-size:var(--fs-sec)}
  .counter-row strong{font-family:var(--font-mono);color:var(--track-blue)}
  .summary{display:none;border-color:var(--sun-gold-line)}.summary.show{display:block}
  button:focus-visible,canvas:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}.sim-shell:before,.sim-shell:after{opacity:.28}}
</style>
</head>
<body data-page="24" data-total="32">
<div id="stage">
  <header class="row items-end justify-between" style="height:96px;padding:24px 40px 10px">
    <div><div class="eyebrow">FROM DUST TO WORLDS · 24</div><h1>碰撞不总是长大</h1></div>
    <p class="lead" style="max-width:720px;text-align:right">天体可以通过反复碰撞与吸积逐步长大；速度和方向不合适时，也会反弹或损失材料。</p>
  </header>

  <section class="k-process process-strip" style="height:104px;padding:8px 40px 12px" aria-label="吸积过程">
    <div class="axis">
      <div class="step is-past">微粒</div><span class="arw"></span>
      <div class="step is-current">碰撞<div class="branch"><span>黏结</span><span>反弹</span><span>碎裂</span></div></div><span class="arw"></span>
      <div class="step">小团块</div><span class="arw"></span><div class="step">更大团块</div>
    </div>
  </section>

  <main class="row gap-4 min0" style="flex:1;padding:0 40px 18px">
    <section id="simShell" class="sim-shell grow min0 no-pan" aria-label="碰撞吸积实验区">
      <canvas id="sim" class="cv-fill" tabindex="0" aria-label="拖动左下方金色粒子，松开发射；键盘用方向键调整，空格发射"></canvas>
      <div class="sim-label row gap-2"><span class="chip is-current" id="trial">实验 1/3</span><span class="chip" id="speedTag">拖得短：低速</span></div>
      <div id="toast" class="result-toast" role="status" aria-live="polite">准备发射</div>
      <div class="launch-help"><strong class="accent">拖动金色粒子，松开发射。</strong> 拖得越远，碰撞越快；改变方向，比较正撞与擦边。</div>
    </section>

    <aside class="stats shrink0 min0" style="width:300px" aria-label="实验读数">
      <div class="panel pad-4">
        <div class="row justify-between items-center"><h2>团块增长</h2><span class="label">成员数</span></div>
        <div class="readout is-key" style="margin-top:12px"><span class="label">主团块成员</span><span class="value" id="members">8 粒</span></div>
        <div class="label" style="margin-top:12px">净增长</div><div class="meter"><span id="growthBar"></span></div>
      </div>
      <div class="panel pad-4 grow">
        <div class="counter-row"><span>黏结</span><strong id="stick">0</strong></div>
        <div class="counter-row"><span>反弹</span><strong id="bounce">0</strong></div>
        <div class="counter-row"><span>剥落</span><strong id="shed">0</strong></div>
        <p class="note" style="margin-top:14px">接触较慢且持续，粒子才会由短键黏结。</p>
      </div>
      <div id="summary" class="panel summary pad-4">
        <strong class="accent">增长并非一路平顺</strong>
        <p class="sec" style="margin-top:8px">多轮之后，大团块与残余微粒仍会并存。</p>
      </div>
      <button id="reset" class="btn" type="button">用同一种子重置</button>
      <p class="note">机制模型：尺寸、时间与黏结阈值均经教学简化。</p>
    </aside>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/matter.min.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:24,total:32});
  const {Engine,Bodies,Body,Composite,Constraint,Events}=Matter;
  const cv=document.getElementById('sim'), shell=document.getElementById('simShell');
  const W=1280,H=720, baseCount=8;
  let engine, cluster=[], loose=[], bonds=[], projectile=null, drag=null, trial=0, counts={stick:0,bounce:0,shed:0}, traces=[], flash=null, done=false;
  let rng;

  function makeParticle(x,y,r,color){
    const b=Bodies.circle(x,y,r,{restitution:.35,friction:.08,frictionAir:.006,label:'grain'});
    b.renderColor=color; return b;
  }
  function fresh(){
    rng=new Math.seedrandom('page-24');
    engine=Engine.create({gravity:{x:0,y:0,scale:0}}); engine.gravity.scale=0;
    cluster=[];loose=[];bonds=[];traces=[];flash=null;trial=0;counts={stick:0,bounce:0,shed:0};done=false;
    const cx=880,cy=350;
    for(let i=0;i<baseCount;i++){
      const a=i*Math.PI*2/baseCount, b=makeParticle(cx+Math.cos(a)*34,cy+Math.sin(a)*34,14,'blue');cluster.push(b);
    }
    for(let i=0;i<cluster.length;i++){
      const c=Constraint.create({bodyA:cluster[i],bodyB:cluster[(i+1)%cluster.length],length:28,stiffness:.72,damping:.18});bonds.push(c);
    }
    for(let i=0;i<12;i++){const b=makeParticle(250+rng()*750,90+rng()*520,6+rng()*7,'dim');Body.setVelocity(b,{x:(rng()-.5)*.45,y:(rng()-.5)*.45});loose.push(b);}
    Composite.add(engine.world,[...cluster,...loose,...bonds]); spawn(); updateUI(); document.getElementById('summary').classList.remove('show');
  }
  function spawn(){
    if(projectile) Composite.remove(engine.world,projectile);
    projectile=makeParticle(170,570,18,'gold'); Body.setStatic(projectile,true); Composite.add(engine.world,projectile); drag=null;
  }
  function point(e){const p=Deck.pt(cv,e),sx=cv.offsetWidth/W,sy=cv.offsetHeight/H;return{x:p.x/sx,y:p.y/sy};}
  function start(e){if(done||!projectile)return;const p=point(e);if(Math.hypot(p.x-projectile.position.x,p.y-projectile.position.y)<44){drag=p;shell.classList.add('dragging');cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);e.preventDefault();}}
  function move(e){if(!drag)return;drag=point(e);e.preventDefault();}
  function release(e){if(!drag||done)return; const p=point(e), dx=projectile.position.x-p.x,dy=projectile.position.y-p.y,mag=Math.hypot(dx,dy)||1;let speed=Math.min(9,Math.max(2.5,mag/28));
    Body.setStatic(projectile,false);Body.setVelocity(projectile,{x:dx/mag*speed,y:dy/mag*speed});drag=null;shell.classList.remove('dragging');trial++;document.getElementById('trial').textContent='实验 '+trial+'/3';document.getElementById('speedTag').textContent=speed<=4?'低速：可黏结':speed<7?'中速：看角度':'高速：易反弹';
    projectile.launchSpeed=speed;projectile.resolved=false;setTimeout(()=>{if(projectile&&!projectile.resolved)resolve('bounce',projectile.position.x,projectile.position.y);},1500);
  }
  function resolve(type,x,y){if(!projectile||projectile.resolved)return;projectile.resolved=true;traces.push({x:projectile.position.x,y:projectile.position.y});
    if(type==='stick'){
      counts.stick++; cluster.push(projectile);const near=cluster.reduce((a,b)=>a===projectile||Matter.Vector.magnitude(Matter.Vector.sub(b.position,projectile.position))>Matter.Vector.magnitude(Matter.Vector.sub(a.position,projectile.position))?a:b,cluster[0]);
      const c=Constraint.create({bodyA:projectile,bodyB:near,length:30,stiffness:.72,damping:.18});bonds.push(c);Composite.add(engine.world,c);flash={x,y,type:'stick',t:0};toast('黏结：团块长大了');
    }else{
      counts.bounce++;flash={x,y,type:'bounce',t:0};
      if(projectile.launchSpeed>=7&&cluster.length>baseCount){const n=Math.min(cluster.length-baseCount,1+Math.floor(rng()*3));for(let i=0;i<n;i++){const b=cluster.pop();counts.shed++;Body.setVelocity(b,{x:-3-rng()*3,y:(rng()-.5)*5});loose.push(b);}}
      toast('速度过高或角度太偏：这次没有净增长');
    }
    updateUI();setTimeout(()=>{if(trial>=3){done=true;document.getElementById('summary').classList.add('show');document.getElementById('trial').textContent='实验 3/3 · 完成';}else spawn();},700);
  }
  function collisionHandler(ev){ev.pairs.forEach(pair=>{if(!projectile||projectile.resolved)return;const other=pair.bodyA===projectile?pair.bodyB:pair.bodyB===projectile?pair.bodyA:null;if(other&&cluster.includes(other)){const rel=Matter.Vector.magnitude(Matter.Vector.sub(projectile.velocity,other.velocity));resolve(rel<=4?'stick':'bounce',projectile.position.x,projectile.position.y);}});}
  function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),650);}
  function updateUI(){document.getElementById('members').textContent=cluster.length+' 粒';document.getElementById('stick').textContent=counts.stick;document.getElementById('bounce').textContent=counts.bounce;document.getElementById('shed').textContent=counts.shed;document.getElementById('growthBar').style.width=Math.min(100,Math.max(0,(cluster.length-baseCount)*24))+'%';}
  function draw(){const ctx=Deck.fit(cv),sx=cv.offsetWidth/W,sy=cv.offsetHeight/H;ctx.save();ctx.scale(sx,sy);ctx.clearRect(0,0,W,H);
    traces.forEach((t,i)=>{ctx.strokeStyle=Deck.rgba('--text-muted',.22);ctx.lineWidth=2;ctx.beginPath();ctx.arc(t.x,t.y,25+i*3,0,Math.PI*2);ctx.stroke();});
    bonds.forEach(c=>{if(!c.bodyA||!c.bodyB)return;ctx.strokeStyle=Deck.rgba('--sun-gold',.62);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(c.bodyA.position.x,c.bodyA.position.y);ctx.lineTo(c.bodyB.position.x,c.bodyB.position.y);ctx.stroke();});
    [...loose,...cluster,projectile].filter(Boolean).forEach(b=>{ctx.beginPath();ctx.arc(b.position.x,b.position.y,b.circleRadius,0,Math.PI*2);ctx.fillStyle=b.renderColor==='gold'?Deck.token('--sun-gold'):b.renderColor==='blue'?Deck.token('--track-blue'):Deck.rgba('--text-muted',.55);ctx.fill();});
    if(drag&&projectile){ctx.strokeStyle=Deck.token('--sun-gold');ctx.lineWidth=3;ctx.setLineDash([10,8]);Deck.arrow(ctx,projectile.position.x,projectile.position.y,2*projectile.position.x-drag.x,2*projectile.position.y-drag.y,14);ctx.setLineDash([]);}
    if(flash){flash.t+=1;ctx.strokeStyle=flash.type==='stick'?Deck.token('--sun-gold'):Deck.token('--text');ctx.lineWidth=4;ctx.beginPath();ctx.arc(flash.x,flash.y,22+flash.t*2,0,Math.PI*2);ctx.stroke();if(flash.t>18)flash=null;}
    ctx.restore();
  }
  fresh();Events.on(engine,'collisionStart',collisionHandler);
  let acc=0;Deck.loop((t,dt)=>{if(!Deck.reduced()){acc+=Math.min(dt,32);while(acc>=16.666){Engine.update(engine,16.666);acc-=16.666;}}draw();},{still:1});
  cv.addEventListener('pointerdown',start);cv.addEventListener('pointermove',move);cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
  cv.addEventListener('keydown',e=>{if(done||!projectile)return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();drag=drag||{x:projectile.position.x-100,y:projectile.position.y};if(e.key==='ArrowUp')drag.y-=12;if(e.key==='ArrowDown')drag.y+=12;if(e.key==='ArrowLeft')drag.x-=12;if(e.key==='ArrowRight')drag.x+=12;}if(e.key===' '||e.key==='Enter'){e.preventDefault();drag=drag||{x:projectile.position.x-110,y:projectile.position.y};release({});}});
  document.getElementById('reset').addEventListener('click',()=>{fresh();Events.on(engine,'collisionStart',collisionHandler);toast('已恢复同一种子初态');});
})();
</script>
</body>
</html>
