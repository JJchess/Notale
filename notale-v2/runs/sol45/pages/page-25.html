<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#07111F;--text:#EAF4FF;--font-sans:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
.head{padding:24px 40px 16px;border-bottom:1px solid var(--line)}
.kicker{font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.14em;color:var(--track-blue)}
.main{padding:18px 40px 22px;display:flex;gap:16px}
.selector{width:278px;padding:16px}.planet-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;outline:none}
.planet-option{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel-deep);cursor:pointer;transition:transform .2s,border-color .2s}
.planet-option[aria-selected="true"]{border-color:var(--sun-gold);box-shadow:var(--glow-gold);color:var(--sun-gold)}
.planet-option:focus-visible,.planet-list:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.planet-option img{width:46px;height:46px}.planet-option span{font-size:var(--fs-sec);font-weight:700}
.shake{animation:shake .28s linear 2}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.chart-panel{flex:1;position:relative;padding:12px;display:flex;flex-direction:column}.chart{flex:1;min-height:0}.legend-note{display:flex;justify-content:center;gap:22px;font-size:var(--fs-label);color:var(--text-muted)}
.profile{width:410px;padding:14px;display:flex;flex-direction:column;gap:10px}.world-head{height:72px;display:flex;align-items:center;gap:12px}.world-head img{width:64px;height:64px}.world-head strong{font-size:var(--fs-h2)}
.k-comparison{--compare-cols:2;flex:1;grid-template-columns:112px repeat(2,minmax(0,1fr))}.k-comparison>*{padding:9px 8px}.k-comparison .hdr{font-size:var(--fs-sec)}
.feedback{min-height:48px;padding:10px 14px;border-left:4px solid var(--track-blue);background:var(--track-blue-soft);font-size:var(--fs-sec);line-height:1.5}.feedback.done{border-color:var(--sun-gold);background:var(--sun-gold-soft)}
.btn{font-size:var(--fs-sec)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="stage">
<header class="head row items-end justify-between" style="height:116px">
 <div><div class="kicker">WORLD PROFILES · 25</div><h1>世界不是排行榜</h1><p class="lead muted">大小、密度、大气和温度的组合，比单项排名更能解释行星差异。</p></div>
 <div class="row gap-3 items-center"><span id="count" class="chip">已选 0/2</span><button id="reset" class="btn" type="button">换一组</button></div>
</header>
<main class="main min0" style="flex:1">
 <section class="selector panel min0"><h2>选择两个世界</h2><p class="note">点击圆盘；键盘用方向键移动，空格选择。</p><div id="list" class="planet-list" role="listbox" aria-label="行星选择架" aria-multiselectable="true" tabindex="0"></div><p id="warning" class="feedback" aria-live="polite">先选择一个世界，再选择另一个作对照。</p></section>
 <section class="chart-panel panel min0"><div class="row justify-between items-center"><h2>四轴属性轮廓</h2><span class="label">同一轴、同一基准</span></div><div id="chart" class="chart min0" aria-label="所选行星的四维属性雷达图"></div><div class="legend-note"><span>靠外＝该维度相对更高</span><span>大气轴＝展示用类别，不是连续测量</span></div></section>
 <section class="profile panel min0"><h2>原值对齐比较</h2><div id="heads" class="row gap-3"></div><div id="matrix" class="k-comparison"></div><p id="result" class="feedback" aria-live="polite">单项最大、最密或最热，都不能概括一个世界。</p></section>
</main>

const atmosphere={mercury:['近乎无','近乎无'],venus:['浓厚岩质大气','浓厚 CO₂'],earth:['浓厚岩质大气','浓厚 N₂/O₂'],mars:['稀薄','稀薄 CO₂'],jupiter:['巨行星包层','H₂/He 包层'],saturn:['巨行星包层','H₂/He 包层'],uranus:['巨行星包层','H₂/He/CH₄ 包层'],neptune:['巨行星包层','H₂/He/CH₄ 包层']};
const levelNames=['近乎无','稀薄','浓厚岩质大气','巨行星包层'];
const planets=Lec.K.planets.map(p=>({...p,diameter:p.meanRadiusKm*2,atm:levelNames.indexOf(atmosphere[p.key][0])}));
const ext=(field)=>[Math.min(...planets.map(p=>p[field])),Math.max(...planets.map(p=>p[field]))];
const dExt=ext('diameter'),rhoExt=ext('meanDensityKgM3'),tExt=ext('meanSurfaceTemperatureK');
const selected=[]; let cursor=0;
const list=document.getElementById('list');
planets.forEach((p,i)=>{const el=document.createElement('div');el.className='planet-option';el.role='option';el.setAttribute('aria-selected','false');el.dataset.key=p.key;el.innerHTML=`<img class="astro-photo" src="${photos[p.key]}" alt=""><span>${p.name}</span>`;el.title='真实行星影像；NASA / Wikimedia Commons';el.onclick=()=>toggle(p.key,el);list.appendChild(el)});
const chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
function norm(p){return [Lec.P.normalizedLog(p.diameter,...dExt),Lec.P.normalizedLinear(p.meanDensityKgM3,...rhoExt),p.atm/3,Lec.P.normalizedLinear(p.meanSurfaceTemperatureK,...tExt)]}
function fmt(v){return Lec.P.significantFigures(v,4)}
function render(){
 document.getElementById('count').textContent=`已选 ${selected.length}/2`;
 [...list.children].forEach(el=>el.setAttribute('aria-selected',String(selected.includes(el.dataset.key))));
 const ps=selected.map(k=>planets.find(p=>p.key===k));
 chart.setOption({animationDuration:Deck.reduced()?0:420,color:['#FFC857','#4DB6FF'],tooltip:{textStyle:{fontSize:16}},radar:{shape:'polygon',splitNumber:4,indicator:[{name:'直径',max:1},{name:'密度',max:1},{name:'大气',max:1},{name:'平均温度',max:1}],axisName:{color:'#C9D8E8',fontSize:14},splitLine:{lineStyle:{color:'#27415E'}},axisLine:{lineStyle:{color:'#27415E'}},splitArea:{areaStyle:{color:['rgba(13,27,46,.25)','rgba(13,27,46,.55)']}}},series:[{type:'radar',symbolSize:7,lineStyle:{width:3},areaStyle:{opacity:.16},data:ps.map(p=>({name:p.name,value:norm(p)}))}]},true);
 document.getElementById('heads').innerHTML=ps.map(p=>`<div class="world-head grow"><img class="astro-photo" src="${photos[p.key]}" alt="${p.name}真实影像"><strong>${p.name}</strong></div>`).join('')+(ps.length<2?'<div class="world-head grow muted">等待选择</div>':'');
 const dims=[['直径',p=>fmt(p.diameter)+' km'],['密度',p=>fmt(p.meanDensityKgM3)+' kg/m³'],['大气',p=>atmosphere[p.key][1]],['平均温度',p=>fmt(p.meanSurfaceTemperatureK)+' K']];
 let m='<div class="dim">维度</div>'+[0,1].map(i=>`<div class="hdr">${ps[i]?.name||'—'}</div>`).join('');
 dims.forEach(([n,f])=>{m+='<div class="rowline"></div><div class="dim">'+n+'</div>'+[0,1].map(i=>`<div class="cell">${ps[i]?f(ps[i]):'—'}</div>`).join('')});document.getElementById('matrix').innerHTML=m;
 const out=document.getElementById('result');out.classList.toggle('done',ps.length===2);
 if(ps.length===2){const labels=['直径','密度','大气','平均温度'];const dif=labels.map((n,i)=>[n,Math.abs(norm(ps[0])[i]-norm(ps[1])[i])]).sort((a,b)=>b[1]-a[1]);out.textContent=`比较完成：差异最大的两个维度是${dif[0][0]}与${dif[1][0]}。属性组合是共同起源与后续演化留下的线索，不是单一原因的指纹。`}
 else out.textContent='单项最大、最密或最热，都不能概括一个世界。';
}
function toggle(key,el){const i=selected.indexOf(key);if(i>=0)selected.splice(i,1);else if(selected.length<2)selected.push(key);else{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');document.getElementById('warning').textContent='已选两个世界；先取消一个再比较。';return}document.getElementById('warning').textContent=selected.length===2?'两条轮廓已按同一组轴叠加。':'再选择一个世界形成对照。';render()}
list.addEventListener('keydown',e=>{const opts=[...list.children];if(['ArrowRight','ArrowDown'].includes(e.key)){cursor=(cursor+1)%opts.length;e.preventDefault()}else if(['ArrowLeft','ArrowUp'].includes(e.key)){cursor=(cursor+opts.length-1)%opts.length;e.preventDefault()}else if(e.key===' '||e.key==='Enter'){toggle(opts[cursor].dataset.key,opts[cursor]);e.preventDefault()}opts.forEach((o,i)=>o.style.outline=i===cursor?'2px solid var(--track-blue)':'none')});
document.getElementById('reset').onclick=()=>{selected.length=0;document.getElementById('warning').textContent='先选择一个世界，再选择另一个作对照。';render()};
Deck.onResize(()=>chart.resize());Deck.init({index:25,total:32});render();
</script>
