<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .plate{position:relative;min-height:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(77,182,255,.035),transparent 28%,transparent 72%,rgba(77,182,255,.035));overflow:hidden}
  .plate::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:80px 80px;opacity:.16;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
  .diagram{position:absolute;inset:0;width:100%;height:100%}
  .path{fill:none;stroke:var(--track-blue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 7px rgba(77,182,255,.35));stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.45s .35s ease-out forwards}
  .path.soft{stroke:var(--track-blue-line);stroke-width:2;animation-delay:.72s}
  .guide{fill:none;stroke:var(--track-blue-line);stroke-width:1.5;stroke-dasharray:6 8}
  .disk{opacity:0;transform-box:fill-box;transform-origin:center;animation:arrive .35s ease-out forwards}
  .event{opacity:0;animation:pulse .55s 2.15s ease-out forwards}
  .origin{opacity:0;animation:appear .45s ease-out forwards}
  .anno{position:absolute;max-width:260px;padding:var(--sp-2) var(--sp-3);background:rgba(7,17,31,.88);border-left:2px solid var(--track-blue-line)}
  .anno b{display:block;color:var(--track-blue);font-size:var(--fs-label);line-height:1.4;margin-bottom:4px}
  .anno span{display:block;color:var(--text-muted);font-size:var(--fs-sec);line-height:1.45}
  .anno.gold{border-left-color:var(--sun-gold)} .anno.gold b{color:var(--sun-gold)}
  .planet-row{position:absolute;left:610px;right:58px;bottom:22px;display:flex;justify-content:space-between;align-items:flex-start}
  .planet{width:88px;text-align:center;opacity:0;animation:appear .32s ease-out forwards}
  .planet i{display:block;width:58px;height:18px;margin:0 auto var(--sp-1);border:2px solid var(--track-blue);border-radius:50%;background:rgba(77,182,255,.08);box-shadow:0 0 14px rgba(77,182,255,.18)}
  .planet span{font-size:var(--fs-label);color:var(--text);line-height:1.4}
  .claim{opacity:0;animation:appear .5s 2.3s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes arrive{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}
  @keyframes appear{to{opacity:1}}
  @keyframes pulse{0%{opacity:0;transform:scale(.5)}55%{opacity:1;transform:scale(1.5)}100%{opacity:1;transform:scale(1)}}
  @media(prefers-reduced-motion:reduce){.path{stroke-dashoffset:0;animation:none}.origin,.disk,.event,.planet,.claim{opacity:1;animation:none}}
</style>
</head>
