<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:32px 44px 34px;gap:20px}
  .casehead{height:92px}
  .kicker{font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.12em;color:var(--track-blue)}
  .progress{min-width:230px;text-align:right}.dots{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.dot{width:11px;height:11px;border:1px solid var(--track-blue);border-radius:50%}.dot.on{background:var(--sun-gold);border-color:var(--sun-gold);box-shadow:var(--glow-gold)}
  .main{gap:32px}.evidence{width:42%;gap:14px}.orbit{width:58%;position:relative;overflow:hidden}
  .photo-row{height:172px;gap:22px;padding:18px 22px}.pluto{width:134px;height:134px;flex:0 0 134px;border-radius:50%;background:radial-gradient(circle at 42% 38%,#eee0c9 0 9%,#ba8d71 10% 18%,#e3c7a7 19% 31%,#8a5e52 32% 39%,#d9b996 40% 55%,#674951 56% 64%,#bf9077 65% 78%,#302c39 79% 100%);box-shadow:0 0 34px rgba(77,182,255,.2);border:1px solid var(--line)}
  .fact{display:flex;gap:18px;margin-top:12px}.fact span{display:flex;flex-direction:column}.fact b{font:700 var(--fs-sec)/1.4 var(--font-mono);color:var(--track-blue)}
  .k-comparison{flex:1;grid-template-columns:minmax(170px,.9fr) minmax(130px,.65fr) minmax(190px,1fr)}
  .k-comparison>*{padding:11px 14px}.k-comparison .hdr{font-size:var(--fs-sec)}.k-comparison .dim{text-align:left;font-size:var(--fs-sec)}
  .vote{width:100%;min-height:42px;color:var(--text);font:700 var(--fs-sec)/1.4 var(--font-sans);background:var(--panel-raised);border:1px solid var(--track-blue-line);border-radius:var(--radius-sm);padding:7px 10px}.vote:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.vote.locked{border-color:var(--sun-gold);color:var(--sun-gold)}
  .verdict{color:var(--text-dim)}.revealed{color:var(--text)}.third.revealed{color:var(--sun-gold);font-weight:700;background:var(--sun-gold-soft)}
  .charthead{position:absolute;z-index:2;left:26px;right:26px;top:20px}.charthead .note{max-width:530px}.orbit svg{position:absolute;inset:95px 12px 72px;width:calc(100% - 24px);height:calc(100% - 167px)}
  .orbit-label{font:700 15px var(--font-sans);fill:var(--text-muted)}.orbit-num{font:700 14px var(--font-mono);fill:var(--track-blue)}
  .chartfoot{position:absolute;left:26px;right:26px;bottom:18px;padding-top:12px;border-top:1px solid var(--line)}
  .decision{display:none;align-items:center;gap:16px}.decision.show{display:flex}.stamp{padding:6px 18px;border:2px solid var(--sun-gold);color:var(--sun-gold);font-weight:800;font-size:var(--fs-h2);letter-spacing:.12em;transform:rotate(-2deg)}
  .shake{animation:shake .32s ease-out}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  .e-line{stroke:var(--sun-gold);stroke-width:3;stroke-dasharray:260;stroke-dashoffset:260}.e-line.on{stroke-dashoffset:0;transition:stroke-dashoffset .24s ease-out}.neighbor{fill:var(--text-muted);opacity:.42}.neighbor.hot{fill:var(--sun-gold);opacity:.9}
  @media(prefers-reduced-motion:reduce){.shake{animation:none}.e-line.on{transition:none}}
</style>
</head>
<body data-page="28" data-total="32">
<div id="stage">
  <header class="casehead row items-center justify-between shrink0">
    <div><div class="kicker">CASE 01 · PLUTO</div><h1>冥王星为何不是行星？</h1></div>
    <div class="progress label"><span id="progressText">陪审进度 0/3</span><div class="dots" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div></div>
  </header>
  <main class="main row min0" style="flex:1">
    <section class="evidence col min0">
      <div class="photo-row panel row items-center shrink0">
        <div class="pluto" role="img" aria-label="冥王星全盘近球形外观示意" title="New Horizons 的冥王星全盘影像因离线资源限制以色调示意呈现"></div>
        <div class="min0"><span class="chip">证物 A · 冥王星</span><p class="body" style="margin-top:10px">逐项应用定义，不凭大小或名气分类。</p><div class="fact label"><span>平均半径<b id="radius">—</b></span><span>所在区域<b id="region">—</b></span></div></div>
      </div>
      <div class="k-comparison min0" aria-label="冥王星三项行星判据陪审表">
        <div class="hdr">判据</div><div class="hdr">你的票</div><div class="hdr">证据含义</div>
        <div class="dim">绕太阳运行</div><div class="cell"><select class="vote" data-i="0" aria-label="判断冥王星是否绕太阳运行"><option value="">请选择</option><option value="yes">满足</option><option value="no">不满足</option></select></div><div class="cell verdict" id="v0">等待表决</div><div class="rowline"></div>
        <div class="dim">自身引力使其接近球形</div><div class="cell"><select class="vote" data-i="1" aria-label="判断冥王星是否接近球形"><option value="">请选择</option><option value="yes">满足</option><option value="no">不满足</option></select></div><div class="cell verdict" id="v1">等待表决</div><div class="rowline"></div>
        <div class="dim">清空轨道附近区域</div><div class="cell"><select class="vote" data-i="2" aria-label="判断冥王星是否清空轨道邻域"><option value="">请选择</option><option value="yes">满足</option><option value="no">不满足</option></select></div><div class="cell verdict third" id="v2">等待表决</div>
      </div>
      <p id="feedback" class="note" aria-live="polite">依次投票；右图会接通对应证据。</p>
    </section>
    <section class="orbit panel min0" aria-label="柯伊伯带轨道邻域简化俯视图">
      <div class="charthead row justify-between items-start"><div><h2>轨道邻域：有没有邻居，不是关键</h2><p class="note">散点只表示共处同一区域的小天体，不是完整测绘。</p></div><span class="chip">俯视 · 简化</span></div>
      <svg id="orbitSvg" viewBox="0 0 720 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="海王星轨道、冥王星轨道与柯伊伯带小天体的简化关系图"></svg>
      <div class="chartfoot row justify-between items-center"><p class="sec"><strong class="accent">“清空”</strong>指长期取得动力学主导，不是附近绝对没有物体。</p><div class="decision" id="decision"><span class="stamp">矮行星</span><button class="btn" id="reset">重新审理</button></div></div>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
Deck.init({index:28,total:32});
(function(){
  var p=Lec.P.dwarfPlanet('pluto'), criteria=Lec.K.iauPlanetCriteria;
  document.getElementById('radius').textContent=Lec.P.significantFigures(p.meanRadiusKm,5)+' km';
  document.getElementById('region').textContent=p.region;
  var svg=d3.select('#orbitSvg'), answers=['yes','yes','no'], done=[false,false,false];
  var g=svg.append('g').attr('transform','translate(360,220)');
  g.append('circle').attr('r',108).attr('fill','none').attr('stroke','#4DB6FF').attr('stroke-width',2).attr('opacity',.75);
  g.append('text').attr('class','orbit-label').attr('x',-96).attr('y',-82).text('海王星轨道 · 参照');
  g.append('ellipse').attr('rx',245).attr('ry',145).attr('transform','rotate(-18)').attr('fill','none').attr('stroke','#4DB6FF').attr('stroke-width',2);
  g.append('text').attr('class','orbit-label').attr('x',125).attr('y',-130).text('冥王星轨道');
  g.append('text').attr('class','orbit-num').attr('x',125).attr('y',-106).text(Lec.P.significantFigures(p.semimajorAxisAU,5)+' AU');
  var pts=d3.range(34).map(function(i){var a=i*.87,r=178+(i%7)*13;return{x:Math.cos(a)*r,y:Math.sin(a)*r*.62};});
  g.selectAll('.neighbor').data(pts).join('circle').attr('class','neighbor').attr('cx',function(d){return d.x}).attr('cy',function(d){return d.y}).attr('r',function(d,i){return 3+i%3});
  var lines=[[70,-70,205,-128],[-120,70,-230,126],[55,100,220,152]];
  lines.forEach(function(d,i){g.append('line').attr('class','e-line line-'+i).attr('x1',d[0]).attr('y1',d[1]).attr('x2',d[2]).attr('y2',d[3]);});
  function update(){var n=done.filter(Boolean).length;document.getElementById('progressText').textContent='陪审进度 '+n+'/3';document.querySelectorAll('.dot').forEach(function(el,i){el.classList.toggle('on',done[i]);});if(n===3)document.getElementById('decision').classList.add('show');}
  var evidence=[function(){return '满足 · 半长轴 '+Lec.P.significantFigures(p.semimajorAxisAU,5)+' AU，周期 '+Lec.P.significantFigures(p.orbitalPeriodDays,5)+' 日';},function(){return '满足 · 近球形，平均半径 '+Lec.P.significantFigures(p.meanRadiusKm,5)+' km';},function(){return '不满足 · 位于'+p.region+'，未取得动力学主导';}];
  var hints=['它确实绕太阳运行','近球形看自身引力，不看它是否够大','附近有别的物体不等于自动失败；请判断谁动力学主导'];
  document.querySelectorAll('.vote').forEach(function(sel){sel.addEventListener('change',function(){var i=+sel.dataset.i;if(done[i])return;if(sel.value===answers[i]){done[i]=true;sel.disabled=true;sel.classList.add('locked');var v=document.getElementById('v'+i);v.textContent=evidence[i]();v.classList.add('revealed');g.select('.line-'+i).classed('on',true);if(i===2)g.selectAll('.neighbor').classed('hot',true);document.getElementById('feedback').textContent=i===2?'冥王星满足前两项，但未在轨道邻域取得动力学主导地位。':'证据成立，继续下一项。';update();}else{sel.classList.remove('shake');void sel.offsetWidth;sel.classList.add('shake');document.getElementById('feedback').textContent=hints[i];sel.value='';}});});
  document.getElementById('reset').addEventListener('click',function(){done=[false,false,false];document.querySelectorAll('.vote').forEach(function(s){s.disabled=false;s.value='';s.classList.remove('locked');});document.querySelectorAll('.verdict').forEach(function(v){v.textContent='等待表决';v.classList.remove('revealed');});g.selectAll('.e-line').classed('on',false);g.selectAll('.neighbor').classed('hot',false);document.getElementById('decision').classList.remove('show');document.getElementById('feedback').textContent='依次投票；右图会接通对应证据。';update();document.querySelector('.vote').focus();});
  update();
})();
</script>
</body>
</html>
