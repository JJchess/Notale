<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .hero{padding:24px 40px 12px;position:relative;z-index:3}
  .eyebrow{font:700 var(--fs-label)/1.4 var(--font-mono);letter-spacing:.16em;color:var(--track-blue)}
  .scene{position:relative;overflow:hidden;margin:0 40px;border:1px solid var(--line);border-radius:var(--radius-lg);background:linear-gradient(135deg,rgba(9,23,40,.42),rgba(7,17,31,.84));box-shadow:var(--shadow-panel)}
  #space{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
  #space:active{cursor:grabbing}
  #space:focus-visible{box-shadow:inset 0 0 0 3px var(--focus)}
  .scene-copy{position:absolute;left:24px;top:20px;z-index:2;pointer-events:none}
  .scene-copy strong{display:block;color:var(--sun-gold);font-size:var(--fs-lead)}
  .scene-copy span{font-size:var(--fs-label);color:var(--text-muted)}
  .compare-wrap{position:absolute;right:24px;top:20px;width:470px;z-index:3}
  .k-comparison{--compare-cols:1;background:rgba(7,17,31,.9);backdrop-filter:blur(10px)}
  .k-comparison .dim{width:auto}
  .k-comparison .cell{text-align:left}
  .fade-shell{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 34% 58%,transparent 0 38%,rgba(77,182,255,.08) 60%,rgba(77,182,255,.16) 74%,transparent 94%);mask-image:radial-gradient(circle,black 48%,rgba(0,0,0,.7) 72%,transparent 96%);-webkit-mask-image:radial-gradient(circle,black 48%,rgba(0,0,0,.7) 72%,transparent 96%)}
  .status{position:absolute;left:24px;bottom:18px;right:24px;z-index:4;display:flex;align-items:center;gap:16px}
  .status-msg{font-size:var(--fs-sec);color:var(--text-muted);flex:1}
  .status-msg.good{color:var(--sun-gold)}
  .scale{height:132px;padding:12px 40px 18px}
  .scale-line{position:relative;height:56px;margin-top:8px;border-top:2px solid var(--track-blue-line)}
  .mark{position:absolute;top:-7px;transform:translateX(-50%);text-align:center;white-space:nowrap}
  .mark::before{content:"";display:block;width:12px;height:12px;margin:0 auto 7px;background:var(--bg);border:2px solid var(--track-blue);border-radius:50%}
  .mark.seen::before{background:var(--sun-gold);border-color:var(--sun-gold);box-shadow:var(--glow-gold)}
  .mark.current{color:var(--sun-gold)}
  .axis-label{display:flex;justify-content:space-between;color:var(--text-dim);font-size:var(--fs-label)}
  .conclusion{position:absolute;left:50%;top:50%;z-index:6;transform:translate(-50%,-50%) scale(.98);padding:24px 34px;text-align:center;background:var(--panel);border:1px solid var(--sun-gold);border-radius:var(--radius-md);box-shadow:var(--glow-gold);opacity:0;pointer-events:none;transition:opacity 260ms ease-out,transform 260ms ease-out}
  .conclusion.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
  .conclusion strong{display:block;font-size:var(--fs-h2);color:var(--sun-gold);margin-bottom:8px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="30" data-total="32">
<div id="stage">
  <header class="hero" style="height:112px">
    <div class="eyebrow">WHERE DOES IT END?</div>
    <div class="row items-end justify-between gap-4">
      <h1>太阳系到底在哪里结束？</h1>
      <p class="lead muted">边界不是一堵围墙，而是问题所选的观察窗口。</p>
    </div>
  </header>

  <main class="scene min0 no-pan" style="flex:1" aria-label="太阳系四种边界的三维比较">
    <canvas id="space" class="cv-fill" tabindex="0" role="slider" aria-label="拖动太阳系边界" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" aria-valuetext="行星区外缘"></canvas>
    <div class="fade-shell"></div>
    <div class="scene-copy"><strong id="distance">30.11 AU</strong><span>拖动金色边界环 · 方向键可切换</span></div>

    <aside class="compare-wrap min0" aria-live="polite">
      <div class="k-comparison" style="--compare-cols:1">
        <div class="dim">观察窗口</div><div class="hdr diff" id="name">行星区外缘</div>
        <div class="rowline"></div>
        <div class="dim">约多远</div><div class="cell mono" id="range">海王星约 30.11 AU</div>
        <div class="rowline"></div>
        <div class="dim">划分什么</div><div class="cell" id="shape">扁平轨道盘止于最外行星</div>
        <div class="rowline"></div>
        <div class="dim">回答什么</div><div class="cell diff" id="question">八颗行星分布到哪里？</div>
      </div>
    </aside>

    <div class="status">
      <span class="chip is-current" id="progress">已比较 1 / 4</span>
      <span class="status-msg" id="feedback">沿对数距离拖动；松手后会吸附到一种定义。</span>
    </div>
    <div class="conclusion" id="done"><strong>没有唯一终极边界</strong><span class="sec">换一个研究问题，边界就会改变。</span><br><button class="btn" id="reset" style="margin-top:12px">重新比较</button></div>
  </main>

  <section class="scale" style="height:132px" aria-label="对数距离尺">
    <div class="axis-label"><span>靠近太阳</span><span>对数距离主干（AU）</span><span>遥远、也更不确定</span></div>
    <div class="scale-line" id="scaleLine"></div>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/three.min.js"></script>
<script>
(function(){
  Deck.init({index:30,total:32});
  const R=Lec.K.regions, neptune=Lec.K.planets.find(p=>p.key==='neptune');
  const min=R.terrestrialInnerEdgeAU, max=R.oortCloudOuterAU;
  const fmt=v=>Lec.P.significantFigures(v,4);
  const items=[
    {name:'行星区外缘',au:neptune.semimajorAxisAU,range:'海王星约 '+fmt(neptune.semimajorAxisAU)+' AU',shape:'扁平轨道盘止于最外行星',q:'八颗行星分布到哪里？'},
    {name:'柯伊伯带外缘',au:R.kuiperBeltOuterAU,range:fmt(R.kuiperBeltInnerAU)+'–'+fmt(R.kuiperBeltOuterAU)+' AU',shape:'海王星外的扁平小天体带',q:'近外太阳系的小天体区域到哪里？'},
    {name:'日球层边界',au:R.heliopauseAU,range:'约 '+fmt(R.heliopauseAU)+' AU',shape:'包围行星与柯伊伯带的风压泡',q:'太阳风主导的空间到哪里？'},
    {name:'奥尔特云外缘',au:R.oortCloudOuterAU,range:'约 '+fmt(R.oortCloudInnerAU)+'–'+fmt(R.oortCloudOuterAU)+' AU',shape:'稀疏渐隐的近球形概率云',q:'遥远彗星储库可能到哪里？'}
  ];
  const ticks=[min,30,R.kuiperBeltOuterAU,R.heliopauseAU,R.oortCloudInnerAU,R.oortCloudOuterAU];
  const scale=document.getElementById('scaleLine');
  const marks=[];
  ticks.forEach(v=>{const m=document.createElement('div');m.className='mark tick';m.style.left=(Lec.P.normalizedLog(v,min,max)*100)+'%';m.textContent=(v>=1000?fmt(v):fmt(v))+' AU';scale.appendChild(m);marks.push(m)});

  const canvas=document.getElementById('space'), host=canvas.parentElement;
  const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true}); renderer.outputColorSpace=THREE.SRGBColorSpace;
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(42,1,.1,2000); camera.position.set(0,36,72); camera.lookAt(0,0,0);
  scene.add(new THREE.AmbientLight(0x4db6ff,.45)); const light=new THREE.PointLight(0xffc857,28,90); light.position.set(-8,5,5); scene.add(light);
  const root=new THREE.Group(); root.position.x=-10; scene.add(root);
  const sun=new THREE.Mesh(new THREE.SphereGeometry(1.25,32,20),new THREE.MeshBasicMaterial({color:0xffc857})); root.add(sun);
  const blue=new THREE.LineBasicMaterial({color:0x4db6ff,transparent:true,opacity:.32});
  [2.8,4.1,5.4,6.7,8,9.5,11,12.3].forEach((r,i)=>{const c=new THREE.EllipseCurve(0,0,r,r*.72,0,Math.PI*2);const pts=c.getPoints(96).map(p=>new THREE.Vector3(p.x,0,p.y));root.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),blue.clone()));});
  const zoneMat=new THREE.MeshBasicMaterial({color:0x4db6ff,transparent:true,opacity:.08,side:THREE.DoubleSide,depthWrite:false});
  const kuiper=new THREE.Mesh(new THREE.RingGeometry(12.5,15.2,96),zoneMat);kuiper.rotation.x=-Math.PI/2;root.add(kuiper);
  const helio=new THREE.Mesh(new THREE.SphereGeometry(17,48,24),new THREE.MeshBasicMaterial({color:0x4db6ff,wireframe:true,transparent:true,opacity:.07}));root.add(helio);
  const oort=new THREE.Mesh(new THREE.SphereGeometry(25,48,24),new THREE.MeshBasicMaterial({color:0x4db6ff,wireframe:true,transparent:true,opacity:.1,depthWrite:false}));root.add(oort);
  const goldMat=new THREE.MeshBasicMaterial({color:0xffc857,transparent:true,opacity:1});
  let ring=new THREE.Mesh(new THREE.TorusGeometry(1,0.018,10,100),goldMat);ring.rotation.x=Math.PI/2;root.add(ring);
  const hit=new THREE.Mesh(new THREE.TorusGeometry(1,.12,8,64),new THREE.MeshBasicMaterial({visible:false}));hit.rotation.x=Math.PI/2;root.add(hit);
  const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2(), plane=new THREE.Plane(new THREE.Vector3(0,1,0),0), point=new THREE.Vector3();
  let idx=0,currentNorm=Lec.P.normalizedLog(items[0].au,min,max), dragging=false, visited=new Set([0]), camTarget=72;
  function radius(n){return 3+n*22}
  function setRing(n){currentNorm=Deck.clamp(n,0,1);const r=radius(currentNorm);ring.scale.set(r,r,r);hit.scale.set(r,r,r);camTarget=72+currentNorm*38;}
  function show(i){idx=i;const d=items[i];['name','range','shape','question'].forEach(k=>document.getElementById(k).textContent=d[k==='question'?'q':k]);document.getElementById('distance').textContent=fmt(d.au)+' AU';canvas.setAttribute('aria-valuenow',i);canvas.setAttribute('aria-valuetext',d.name);visited.add(i);document.getElementById('progress').textContent='已比较 '+visited.size+' / 4'; marks.forEach((m,j)=>{m.classList.toggle('seen',visited.has(j===1?0:j===2?1:j===3?2:j===5?3:-1));m.classList.toggle('current',(i===0&&j===1)||(i===1&&j===2)||(i===2&&j===3)||(i===3&&j===5));});document.getElementById('feedback').textContent=i===3?'最远不等于最确定：奥尔特云由彗星轨道推断，并非逐体测绘。':'已吸附到“'+d.name+'”：比较右侧三个共同维度。';document.getElementById('feedback').className='status-msg good';if(visited.size===4)document.getElementById('done').classList.add('show');}
  function snap(){let best=0,dist=Infinity;items.forEach((d,i)=>{const n=Lec.P.normalizedLog(d.au,min,max),q=Math.abs(n-currentNorm);if(q<dist){dist=q;best=i}});if(dist<.105){setRing(Lec.P.normalizedLog(items[best].au,min,max));show(best);}else{setRing(Lec.P.normalizedLog(items[idx].au,min,max));const f=document.getElementById('feedback');f.textContent='这里没有对应的定义边界；先问你要划分行星、太阳风，还是遥远彗星储库。';f.className='status-msg';host.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:220});}}
  function aim(e){const rect=canvas.getBoundingClientRect();pointer.x=((e.clientX-rect.left)/rect.width)*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);return raycaster.ray.intersectPlane(plane,point)}
  canvas.addEventListener('pointerdown',e=>{aim(e);if(raycaster.intersectObject(hit).length){dragging=true;canvas.setPointerCapture(e.pointerId)}});
  canvas.addEventListener('pointermove',e=>{if(!dragging||!aim(e))return;setRing((Math.hypot(point.x-root.position.x,point.z)-3)/22)});
  canvas.addEventListener('pointerup',()=>{if(dragging){dragging=false;snap()}});
  canvas.addEventListener('keydown',e=>{if(['ArrowRight','ArrowUp','ArrowLeft','ArrowDown'].includes(e.key)){e.preventDefault();const dir=(e.key==='ArrowRight'||e.key==='ArrowUp')?1:-1;idx=Deck.clamp(idx+dir,0,3);setRing(Lec.P.normalizedLog(items[idx].au,min,max));show(idx)}});
  document.getElementById('reset').addEventListener('click',()=>{visited=new Set([0]);document.getElementById('done').classList.remove('show');idx=0;setRing(Lec.P.normalizedLog(items[0].au,min,max));show(0)});
  function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
  Deck.onResize(resize);resize();setRing(currentNorm);show(0);
  Deck.loop((t,dt)=>{if(!Deck.reduced())camera.position.z=Deck.lerp(camera.position.z,camTarget,Math.min(1,dt*3));camera.lookAt(-7,0,0);renderer.render(scene,camera)},{still:1});
})();
</script>
</body>
</html>
