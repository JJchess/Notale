<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root{--bg:#07111F;--text:#EAF4FF;--font-sans:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;--focus:#FFC857}
  #stage{padding:42px 76px 26px}
  .transfer-head{display:flex;align-items:flex-end;justify-content:space-between;max-width:1448px;width:100%;margin:0 auto}
  .kicker{font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;letter-spacing:.14em;color:var(--track-blue)}
  .transfer-head h1{margin-top:8px;font-size:clamp(32px,4.2vw,64px);line-height:1.15;max-width:1120px}
  .head-mark{font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.1em;color:var(--text-dim);padding-bottom:9px}
  .question-field{position:relative;width:1120px;max-width:1120px;margin:0 auto;min-height:0}
  .question-field::after{position:absolute;inset:10% 17%;content:"";background:radial-gradient(circle,rgba(77,182,255,.055),transparent 64%);pointer-events:none}
  .map-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:0}
  .orbit-path,.branch-path{fill:none;stroke:var(--track-blue);vector-effect:non-scaling-stroke}
  .orbit-path{stroke-width:2;stroke-dasharray:10 12;opacity:.42;filter:drop-shadow(0 0 7px rgba(77,182,255,.45));stroke-dashoffset:280;animation:drawOrbit .42s ease-out .3s forwards}
  .branch-path{stroke-width:1.5;opacity:.7;stroke-dasharray:230;stroke-dashoffset:230;animation:drawLine .38s ease-out .56s forwards}
  .branch-dot{fill:var(--track-blue);opacity:.85}
  .center-object{position:absolute;z-index:3;left:50%;top:50%;width:188px;height:188px;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff4c8 0 4%,var(--sun-gold) 18%,#D89125 66%,#7A4518 100%);border:3px solid var(--sun-gold);box-shadow:0 0 22px rgba(255,200,87,.55),0 0 76px rgba(255,200,87,.2);animation:objectIn .3s ease-out both}
  .center-object strong{font-size:28px;line-height:1.2;color:var(--bg);letter-spacing:.04em;text-shadow:0 1px rgba(255,255,255,.28)}
  .center-caption{position:absolute;z-index:3;left:50%;top:calc(50% + 112px);transform:translateX(-50%);width:390px;text-align:center;color:var(--text-muted);font-size:var(--fs-sec);line-height:1.5}
  .support{position:absolute!important;z-index:2;width:370px;min-height:132px!important;padding:18px 22px!important;background:linear-gradient(135deg,rgba(13,27,46,.96),rgba(9,23,40,.86))!important;border:1px solid var(--track-blue-line)!important;box-shadow:var(--shadow-panel),inset 0 0 26px rgba(77,182,255,.035);opacity:0;animation:nodeIn .34s ease-out forwards}
  .support::before{display:none!important}
  .support.where{left:0;top:34px;animation-delay:.64s}
  .support.motion{right:0;top:34px;animation-delay:.72s}
  .support.material{left:0;bottom:26px;animation-delay:.8s}
  .support.rule{right:0;bottom:26px;animation-delay:.88s}
  .eyebrow{display:flex;align-items:center;gap:10px;color:var(--track-blue);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;letter-spacing:.12em}
  .eyebrow i{display:block;width:18px;height:2px;background:var(--track-blue);box-shadow:var(--glow-blue)}
  .support h2{margin-top:6px;font-size:20px;line-height:1.4;color:var(--text)}
  .support p{margin-top:5px;color:var(--text-muted);font-size:var(--fs-sec);line-height:1.5}
  .closing{display:flex;align-items:flex-end;justify-content:space-between;width:100%;max-width:1448px;margin:0 auto;border-top:1px solid var(--line);padding-top:16px}
  .claim-line{max-width:1130px;font-size:var(--fs-lead);line-height:1.5;font-weight:700;color:var(--text)}
  .claim-line em{font-style:normal;color:var(--sun-gold)}
  .folio{text-align:right;font-family:var(--font-mono);font-size:var(--fs-label);line-height:1.4;color:var(--text-dim);white-space:nowrap}
  @keyframes objectIn{from{opacity:0;transform:translate(-50%,-50%) scale(.72);filter:brightness(.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1);filter:brightness(1)}}
  @keyframes drawOrbit{to{stroke-dashoffset:0}}
  @keyframes drawLine{to{stroke-dashoffset:0}}
  @keyframes nodeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.center-object,.support,.orbit-path,.branch-path{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
</head>
<body data-page="32" data-total="32">
<div id="stage">
  <header class="transfer-head shrink0" style="height:112px">
    <div>
      <div class="kicker">TRANSFER · 迁移</div>
      <h1>遇见一个新天体，先问四件事</h1>
    </div>
    <div class="head-mark">SOLAR SYSTEM / OPEN QUESTION</div>
  </header>

  <main class="question-field k-generalization min0" style="flex:1" aria-label="面对新发现天体的四个提问方向">
    <div class="trunk sr-only" aria-hidden="true"></div>
    <svg class="map-lines" viewBox="0 0 1120 610" preserveAspectRatio="none" aria-hidden="true">
      <path class="orbit-path" d="M360 350 C390 170 735 130 810 295 C870 425 655 520 480 438 C335 370 405 238 585 225"/>
      <path class="branch-path" d="M485 260 C430 218 388 180 340 142"/>
      <path class="branch-path" d="M635 260 C690 218 732 180 780 142"/>
      <path class="branch-path" d="M485 350 C430 395 388 430 340 470"/>
      <path class="branch-path" d="M635 350 C690 395 732 430 780 470"/>
      <circle class="branch-dot" cx="340" cy="142" r="4"/><circle class="branch-dot" cx="780" cy="142" r="4"/>
      <circle class="branch-dot" cx="340" cy="470" r="4"/><circle class="branch-dot" cx="780" cy="470" r="4"/>
    </svg>

    <div class="center-object observation-window"><strong>新天体？</strong></div>
    <p class="center-caption">先提问，再命名它在系统中的位置。</p>

    <div class="supports" style="display:contents">
      <section class="support where">
        <div class="eyebrow"><i></i><span>WHERE</span></div>
        <h2>它在哪里？</h2>
        <p>位于太阳系哪个区域，与哪些成员为邻？</p>
      </section>
      <section class="support motion">
        <div class="eyebrow"><i></i><span>MOTION</span></div>
        <h2>它如何运动？</h2>
        <p>绕谁运行，轨道呈现什么关系？</p>
      </section>
      <section class="support material">
        <div class="eyebrow"><i></i><span>MATERIAL</span></div>
        <h2>它由什么构成？</h2>
        <p>岩石、冰、气体，还是它们的组合？</p>
      </section>
      <section class="support rule">
        <div class="eyebrow"><i></i><span>RULE</span></div>
        <h2>它如何分类？</h2>
        <p>使用哪套判据，归入哪一类？</p>
      </section>
    </div>
  </main>

  <footer class="closing shrink0" style="height:92px">
    <p class="claim-line">认识太阳系，不是把新名字塞进行星顺序表，<em>而是把它放回一个有结构、会演化的系统。</em></p>
    <div class="folio"><span>认识太阳系</span><br><span>32 / 32</span></div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:32,total:32});</script>
</body>
</html>
