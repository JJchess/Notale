<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="01" data-total="32">
<div id="stage">
  <style>
    #stage{padding:56px 68px 48px;position:relative;isolation:isolate}
    .opening-kicker{height:34px;font-family:var(--font-mono);font-size:14px;line-height:1.35;letter-spacing:.18em;color:var(--orbit-bright)}
    .opening-main{position:relative;display:flex;flex:1;min-height:0}
    .opening-copy{position:relative;z-index:3;width:48%;display:flex;flex-direction:column;justify-content:center;min-width:0;padding-bottom:40px}
    .opening-title{max-width:11ch;font-size:clamp(42px,6vw,88px);font-weight:750;line-height:1.08;letter-spacing:-.045em}
    .opening-title .system-word{color:var(--sun);text-shadow:0 0 26px var(--sun-glow);animation:word-on 2.2s both}
    .opening-take{height:82px;display:flex;align-items:center;border-top:1px solid var(--line);font-size:clamp(18px,2vw,28px);line-height:1.4;color:var(--muted)}
    .opening-take strong{color:var(--text);font-weight:650}
    .system-map{position:absolute;inset:0 0 0 34%;z-index:1;min-width:0}
    .system-map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    .route{fill:none;stroke:var(--orbit);stroke-width:2;stroke-linecap:round;opacity:.68;stroke-dasharray:1;stroke-dashoffset:1;animation:route-in 1.05s cubic-bezier(.22,.7,.2,1) forwards}
    .route.r2{animation-delay:.16s}.route.r3{animation-delay:.32s}.route.r4{animation-delay:.48s}
    .member{position:absolute;z-index:2;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:16px;font-weight:650;letter-spacing:.04em;opacity:0;animation:member-in .48s ease-out forwards}
    .member::before{content:"";width:8px;height:8px;border:1px solid var(--orbit);background:var(--bg);transform:rotate(45deg);box-shadow:0 0 10px var(--orbit-glow)}
    .list-state{position:absolute;left:28%;top:7%;z-index:2;color:var(--quiet);font-family:var(--font-mono);font-size:14px;letter-spacing:.12em}
    .m1{left:32%;top:17%;animation-delay:.05s}.m2{left:27%;top:36%;animation-delay:.15s}.m3{left:34%;top:57%;animation-delay:.25s}.m4{left:29%;top:69%;animation-delay:.35s}
    .orbit-field{position:absolute;right:1%;top:50%;width:510px;height:510px;transform:translateY(-50%);opacity:0;animation:field-in .9s 1.05s ease-out forwards}
    .ring{position:absolute;left:50%;top:50%;border:1px solid var(--orbit-dim);border-radius:50%;transform:translate(-50%,-50%) rotate(-12deg);box-shadow:0 0 18px rgba(85,185,255,.09)}
    .ring-a{width:470px;height:250px}.ring-b{width:380px;height:190px;transform:translate(-50%,-50%) rotate(12deg)}.ring-c{width:284px;height:142px;transform:translate(-50%,-50%) rotate(-28deg)}.ring-d{width:190px;height:96px;transform:translate(-50%,-50%) rotate(24deg)}
    .sun-point{position:absolute;left:50%;top:50%;width:26px;height:26px;border-radius:50%;background:var(--sun);transform:translate(-50%,-50%);box-shadow:0 0 18px var(--sun),0 0 58px var(--sun-glow);animation:breathe 5s 2.2s ease-in-out infinite}
    .system-node{position:absolute;right:164px;top:calc(50% + 54px);color:var(--sun-soft);font-size:22px;font-weight:760;letter-spacing:.12em;opacity:0;animation:node-in .18s 2.02s forwards}
    .support-rail{position:absolute;left:43%;bottom:28px;width:430px;z-index:4}
    .support-rail.k-generalization{gap:8px}
    .support-rail>.claim{padding:8px 14px;border-left-width:4px;background:rgba(13,27,45,.88);font-size:16px}
    .support-rail>.supports{--support-cols:4;gap:8px;padding-top:16px}
    .support-rail>.supports::before{top:16px}
    .support-rail>.supports>.trunk{bottom:56%}
    .support-rail .support{padding:10px 8px;text-align:center;background:rgba(13,27,45,.9);font-size:14px;line-height:1.4}
    .support-rail .support::before{top:-16px;height:16px}
    .support span{display:block}.support .from{color:var(--quiet)}.support .to{color:var(--orbit-bright);font-weight:700}
    @keyframes member-in{from{opacity:0;transform:translate(-14px,8px)}to{opacity:1;transform:none}}
    @keyframes route-in{to{stroke-dashoffset:0}}
    @keyframes field-in{from{opacity:0;transform:translateY(-50%) scale(.9)}to{opacity:1;transform:translateY(-50%) scale(1)}}
    @keyframes node-in{to{opacity:1}}
    @keyframes word-on{0%,84%{color:var(--text);text-shadow:none}100%{color:var(--sun);text-shadow:0 0 26px var(--sun-glow)}}
    @keyframes breathe{0%,100%{box-shadow:0 0 18px var(--sun),0 0 50px var(--sun-glow)}50%{box-shadow:0 0 24px var(--sun),0 0 72px var(--sun-glow)}}
    @media (prefers-reduced-motion:reduce){.member,.route,.orbit-field,.system-node,.opening-title .system-word{animation:none;opacity:1}.route{stroke-dashoffset:0}.sun-point{animation:none}}
  </style>

  <div class="opening-kicker">SOLAR SYSTEM · LECTURE 02</div>

  <main class="opening-main min0" aria-labelledby="opening-title">
    <section class="opening-copy min0">
      <h1 id="opening-title" class="opening-title">别只认成员，<br>要看见<span class="system-word">系统</span></h1>
    </section>

    <section class="system-map min0" aria-label="四类成员由零散名单汇入同一个太阳系整体">
      <svg viewBox="0 0 1000 680" preserveAspectRatio="none" aria-hidden="true">
        <path class="route r1" pathLength="1" d="M120 132 C350 145 470 250 680 330"/>
        <path class="route r2" pathLength="1" d="M55 252 C330 260 470 292 680 330"/>
        <path class="route r3" pathLength="1" d="M140 420 C360 405 500 360 680 330"/>
        <path class="route r4" pathLength="1" d="M75 535 C330 510 510 395 680 330"/>
      </svg>
      <div class="list-state">零散名单</div>
      <div class="member m1"><span>太阳</span></div>
      <div class="member m2"><span>行星</span></div>
      <div class="member m3"><span>卫星</span></div>
      <div class="member m4"><span>小天体</span></div>
      <div class="orbit-field" aria-hidden="true">
        <div class="ring ring-a"></div><div class="ring ring-b"></div>
        <div class="ring ring-c"></div><div class="ring ring-d"></div>
        <div class="sun-point"></div>
      </div>
      <div class="system-node">太阳系</div>
    </section>

    <section class="support-rail k-generalization" aria-label="从名单转向系统的四种理解升级">
      <div class="claim">从名单，转向系统</div>
      <div class="supports">
        <div class="trunk" aria-hidden="true"></div>
        <div class="support"><span class="from">记住名字</span><span class="to">追问联系</span></div>
        <div class="support"><span class="from">逐个辨认</span><span class="to">放进整体</span></div>
        <div class="support"><span class="from">看见对象</span><span class="to">看见关系</span></div>
        <div class="support"><span class="from">背出成员</span><span class="to">解释系统</span></div>
      </div>
    </section>
  </main>

  <div class="opening-take"><strong>太阳系要被理解成一个系统</strong>，而不是一张成员名单。</div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
