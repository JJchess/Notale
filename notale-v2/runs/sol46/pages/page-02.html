<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="02" data-total="32">
<div id="stage">
  <style>
    .route-head{padding:48px 76px 22px;position:relative;z-index:2}
    .route-kicker{color:var(--orbit);font:700 15px/1.35 var(--font-mono);letter-spacing:.15em;margin-bottom:12px}
    .route-head h1{font-size:clamp(34px,4vw,58px)}
    .route-lead{max-width:1080px;margin:12px 0 0;color:var(--muted);font-size:var(--fs-lead);line-height:1.45}
    .route-shell{position:relative;margin:0 76px 20px;padding:0 24px 0 72px;min-height:0;border:1px solid rgba(85,185,255,.24);border-radius:var(--r-md);background:linear-gradient(110deg,rgba(85,185,255,.055),transparent 34%),var(--panel);box-shadow:0 18px 42px var(--shadow);overflow:hidden}
    .route-shell:before,.route-shell:after{content:"";position:absolute;border:1px solid rgba(85,185,255,.1);border-radius:50%;pointer-events:none}
    .route-shell:before{width:560px;height:560px;right:18px;top:-300px}
    .route-shell:after{width:390px;height:390px;right:103px;top:-210px}
    .route-table{height:100%;display:flex;flex-direction:column;position:relative;z-index:1}
    .route-cols,.route-item{display:grid;grid-template-columns:72px minmax(180px,.75fr) minmax(280px,1.35fr) minmax(220px,1fr) 96px;align-items:center;column-gap:18px}
    .route-cols{height:46px;border-bottom:1px solid var(--line);color:var(--quiet);font:650 15px/1.35 var(--font-sans);letter-spacing:.08em}
    .route-list{--enum-cols:1;position:relative;display:grid;grid-template-columns:1fr;gap:0;flex:1;min-height:0}
    .route-list:before{content:"";position:absolute;left:35px;top:0;bottom:0;width:2px;background:linear-gradient(var(--orbit),var(--orbit-dim));box-shadow:0 0 12px var(--orbit-glow);transform-origin:top;animation:trunk .5s ease-out both}
    .route-list>.it.route-item{position:relative;border:0;border-radius:0;border-bottom:1px solid var(--line);background:transparent;padding:0;min-height:76px;animation:rowIn .42s ease-out both}
    .route-list>.it:last-child{border-bottom:0}
    .route-list>.it:nth-child(2){animation-delay:.09s}.route-list>.it:nth-child(3){animation-delay:.18s}.route-list>.it:nth-child(4){animation-delay:.27s}
    .route-num{position:relative;z-index:2;width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--orbit);border-radius:50%;background:var(--panel-deep);color:var(--orbit-bright);font:750 16px/1 var(--font-mono);box-shadow:0 0 15px var(--orbit-glow)}
    .route-num:after{content:"";position:absolute;left:47px;width:25px;border-top:1px solid var(--orbit-dim)}
    .route-question{color:var(--text);font-size:clamp(24px,2.2vw,34px);font-weight:740;line-height:1.2}
    .route-chapter{font-size:18px;line-height:1.4;font-weight:650}
    .route-chapter small{display:block;margin-top:3px;color:var(--muted);font-size:16px;line-height:1.4;font-weight:500}
    .route-cue{color:var(--orbit-bright);font-size:16px;line-height:1.4}
    .route-pages{justify-self:end;color:var(--sun);font:700 16px/1.3 var(--font-mono)}
    .sun-node{position:absolute;left:22px;top:17px;width:28px;height:28px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 8px rgba(255,200,87,.08),0 0 28px var(--sun-glow);animation:sunOn .5s ease-out both}
    .route-status{margin:0 76px 32px;height:54px;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--muted);font:700 15px/1.35 var(--font-mono);letter-spacing:.1em}
    .route-status strong{color:var(--orbit-bright);font:inherit}
    @keyframes trunk{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes rowIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
    @keyframes sunOn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){.route-list:before,.route-list>.it,.sun-node{animation:none}}
  </style>

  <header class="route-head" style="height:176px">
    <div class="route-kicker">ROUTE / 04 QUESTIONS</div>
    <h1>这一讲，沿四个问题认识太阳系</h1>
    <p class="route-lead">我们不按行星名单逐颗参观，而是依次追问：太阳系在哪里、怎样动、为何形成不同世界，以及这些解释如何被证据检验。</p>
  </header>

  <main class="route-shell grow min0" aria-label="本讲四问航线">
    <span class="sun-node" aria-hidden="true"></span>
    <div class="route-table min0">
      <div class="route-cols" aria-hidden="true">
        <span>顺序</span><span>问题</span><span>章节</span><span>关注点</span><span style="text-align:right">页码</span>
      </div>
      <div class="k-enumeration route-list min0" id="route-list"></div>
    </div>
  </main>

  <footer class="route-status" style="height:54px">
    <span>本讲 <strong id="minutes"></strong></span>
    <span><strong id="questions"></strong> QUESTIONS</span>
    <span><strong id="pages"></strong> PAGES</span>
  </footer>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const route = [
        {n:'01',q:'在哪里？',chapter:'I 看见系统的骨架',pages:'03–08',cue:'中心 · 尺度 · 分区'},
        {n:'02',q:'怎样动？',chapter:'II 让系统运转起来',pages:'09–16',cue:'引力 · 轨道 · 周期'},
        {n:'03',q:'为何不同？',chapter:'III 为什么会有不同的世界',pages:'17–24',cue:'温度 · 材料 · 演化'},
        {n:'04',q:'如何验证？',chapter:'IV 边疆、遗迹与我们的坐标',pages:'25–32',cue:'小天体 · 撞击 · 探测'}
      ];
      const list = document.getElementById('route-list');
      route.forEach(r => {
        const item = document.createElement('section');
        item.className = 'it route-item min0';
        item.innerHTML = `<span class="route-num">${r.n}</span><span class="route-question">${r.q}</span><span class="route-chapter">${r.chapter}<small>章节任务</small></span><span class="route-cue">${r.cue}</span><span class="route-pages">${r.pages}</span>`;
        list.appendChild(item);
      });
      document.getElementById('minutes').textContent = '45 MIN';
      document.getElementById('questions').textContent = route.length;
      document.getElementById('pages').textContent = document.body.dataset.total;
      Deck.init({index:Number(document.body.dataset.page),total:Number(document.body.dataset.total)});
    });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
