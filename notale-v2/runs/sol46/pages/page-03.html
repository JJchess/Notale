<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="03" data-total="32">
<div id="stage">
  <style>
    .p03-head{padding:28px 54px 12px;position:relative;z-index:2}
    .p03-kicker{display:inline-block;font:700 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.16em;color:var(--orbit-bright)}
    .p03-take{margin:5px 0 0;color:var(--muted);font-size:var(--fs-lead);line-height:1.45}
    .p03-status{position:absolute;right:54px;top:32px;text-align:right}
    .p03-dots{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
    .p03-dots i{width:10px;height:10px;border:1px solid var(--orbit);border-radius:50%;background:transparent}
    .p03-dots i.on{border-color:var(--sun);background:var(--sun);box-shadow:0 0 10px var(--sun-glow)}
    .p03-main{position:relative;margin:0 54px;min-height:0}
    .p03-main:before,.p03-main:after{content:"";position:absolute;border:1px solid rgba(85,185,255,.12);border-radius:50%;pointer-events:none}
    .p03-main:before{width:1180px;height:430px;left:150px;top:-215px}
    .p03-main:after{width:900px;height:330px;left:290px;top:-165px}
    #rosterSvg{position:absolute;inset:0 0 auto;width:100%;height:230px;overflow:visible}
    .p03-root{position:absolute;left:50%;top:10px;transform:translateX(-50%);min-width:260px;text-align:center;border:1px solid var(--orbit);border-radius:999px;background:var(--panel-deep);padding:13px 24px;color:var(--orbit-bright);font-size:var(--fs-h2);font-weight:760;box-shadow:0 0 24px var(--orbit-glow)}
    .p03-root.done{border-color:var(--sun);color:var(--sun);box-shadow:0 0 28px var(--sun-glow)}
    .p03-root small{display:block;margin-top:2px;color:var(--muted);font-size:var(--fs-label);line-height:1.35;font-weight:650}
    .p03-classes{position:absolute;left:0;right:0;top:205px;display:flex;gap:14px;align-items:stretch}
    .p03-class{flex:1 1 0;min-width:0;margin:0!important;padding:0!important;border:0!important;opacity:.42;transition:opacity .2s ease}
    .p03-class:before{display:none}
    .p03-class .box{height:340px;padding:14px;overflow:visible}
    .p03-class .bt{display:flex;align-items:center;gap:9px;margin:-14px -14px 12px;padding:10px 14px;font-size:20px}
    .p03-class.active{opacity:1}
    .p03-class.active .box{border-color:var(--sun);box-shadow:0 0 20px var(--sun-glow)}
    .p03-seal{width:26px;height:26px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;font:800 14px/1 var(--font-mono);flex:0 0 auto}
    .p03-desc{margin:0 0 10px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
    .p03-members{display:flex;flex-wrap:wrap;gap:7px}
    .p03-member{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:var(--fs-label);line-height:1.35;color:var(--text);opacity:.28}
    .p03-member:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orbit)}
    .active .p03-member{opacity:1}
    .p03-sub{margin:9px 0 0 6px!important;padding:7px 0 0 12px!important;border-left-width:2px!important;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
    .p03-controls{height:154px;padding:10px 54px 20px}
    .p03-prompt{height:30px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45;text-align:center}
    .p03-buttons{display:flex;align-items:center;justify-content:center;gap:12px}
    .p03-buttons .btn{min-width:148px}
    .p03-buttons .btn.registered{border-color:var(--sun);color:var(--sun);background:rgba(255,200,87,.1)}
    #resetBtn{min-width:auto}
    .p03-message{height:28px;margin-top:7px;text-align:center;color:var(--sun);font-size:var(--fs-sec);line-height:1.45}
    .p03-link{fill:none;stroke:var(--orbit);stroke-width:1.5;opacity:.28}
    .p03-link.active{stroke:var(--sun);stroke-width:2.5;opacity:1;filter:drop-shadow(0 0 5px rgba(255,200,87,.55))}
    .p03-node{fill:var(--panel-deep);stroke:var(--orbit);stroke-width:1.5;opacity:.28}
    .p03-node.root{r:10;opacity:1}
    .p03-node.active{stroke:var(--sun);stroke-width:2.5;fill:var(--sun);opacity:1}
    @media (prefers-reduced-motion:reduce){.p03-class{transition:none}}
  </style>

  <section class="p03-head" style="height:112px">
    <div class="p03-kicker">SYSTEM ROSTER</div>
    <h1>谁住在太阳系里？</h1>
    <p class="p03-take">太阳系成员不只八颗行星。</p>
    <div class="p03-status" aria-live="polite"><span class="badge">成员户籍 <b id="count">0/5</b></span><div class="p03-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
  </section>

  <main class="p03-main grow min0 k-classification" aria-label="太阳系成员分类树">
    <svg id="rosterSvg" viewBox="0 0 1492 230" role="img" aria-label="太阳系成员向五类成员分支的树状图"></svg>
    <div id="rootLabel" class="p03-root">太阳系成员<small>一套系统包含多类成员</small></div>
    <div id="classes" class="p03-classes min0"></div>
  </main>

  <section class="p03-controls" style="height:154px">
    <div class="p03-prompt">依次点击五枚户籍章，点亮它们在系统中的分支。</div>
    <div id="buttons" class="p03-buttons"></div>
    <div id="message" class="p03-message" aria-live="polite"></div>
  </section>

  <script src="assets/lib/d3.min.js"></script>
  <script src="assets/lib/anime.min.js"></script>
  <script>
  window.addEventListener('DOMContentLoaded',function(){
    Deck.init({index:3,total:32});
    var names=function(ids){return ids.map(function(id){return Lec.K.bodies[id].name;});};
    var planets=names(Lec.K.planetOrder);
    var roster={name:'太阳系成员',children:[
      {id:'star',name:Lec.K.categories.STAR,desc:'自身发光的中心天体',members:[Lec.K.bodies.sun.name],note:'太阳系中此类代表：太阳'},
      {id:'planet',name:'行星',desc:'绕太阳运行的主要天体',members:planets,subs:[Lec.K.categories.TERRESTRIAL_PLANET+'：'+planets.slice(0,4).join('、'),Lec.K.categories.GIANT_PLANET+'：'+planets.slice(4).join('、')]},
      {id:'dwarf',name:Lec.K.categories.DWARF_PLANET,desc:'与行星并列的正式成员类型',members:[Lec.K.bodies.ceres.name,Lec.K.bodies.pluto.name],note:'不是“第九颗行星”栏'},
      {id:'moon',name:Lec.K.categories.SATELLITE,desc:'绕行星或矮行星运行的天体',members:[Lec.K.bodies.moon.name],note:'月球的母天体：'+Lec.K.bodies.earth.name},
      {id:'small',name:Lec.K.categories.SMALL_BODY,desc:'数量众多的小型成员总类',members:['小行星','彗星','流星体'],note:'本页只登记类型'}
    ]};
    var root=d3.hierarchy(roster);
    d3.tree().size([1320,150])(root);
    root.descendants().forEach(function(d){d.x+=86;d.y+=40;});
    var svg=d3.select('#rosterSvg');
    var link=d3.linkVertical().x(function(d){return d.x;}).y(function(d){return d.y;});
    svg.selectAll('path').data(root.links()).join('path').attr('class',function(d){return 'p03-link link-'+d.target.data.id;}).attr('d',link);
    svg.selectAll('circle').data(root.descendants()).join('circle').attr('class',function(d){return 'p03-node '+(d.depth===0?'root':'node-'+d.data.id);}).attr('cx',function(d){return d.x;}).attr('cy',function(d){return d.y;}).attr('r',function(d){return d.depth===0?10:6;});

    var cards=d3.select('#classes').selectAll('section').data(roster.children).join('section').attr('class','p03-class lv').attr('data-id',function(d){return d.id;});
    cards.each(function(d){
      var box=d3.select(this).append('div').attr('class','box');
      box.append('div').attr('class','bt').html('<span class="p03-seal">'+d.name.slice(0,1)+'</span><span>'+d.name+'</span>');
      box.append('p').attr('class','p03-desc').text(d.desc);
      box.append('div').attr('class','p03-members').selectAll('span').data(d.members).join('span').attr('class','p03-member').text(function(x){return x;});
      if(d.subs){box.selectAll('.p03-sub').data(d.subs).join('div').attr('class','p03-sub lv').text(function(x){return x;});}
      if(d.note){box.append('div').attr('class','p03-sub lv').text(d.note);}
    });

    var active=new Set(), message=document.getElementById('message');
    var buttons=d3.select('#buttons').selectAll('button.reg').data(roster.children).join('button').attr('class','btn reg').attr('type','button').attr('data-id',function(d){return d.id;}).text(function(d){return '登记 '+d.name;}).on('click',function(event,d){register(d,this);});
    d3.select('#buttons').append('button').attr('id','resetBtn').attr('class','btn').attr('type','button').text('重新点亮').on('click',reset);

    function register(d,button){
      if(active.has(d.id)){
        message.textContent='这一户已经登记，请点亮另一类成员。';
        if(!Deck.reduced()) anime({targets:'[data-id="'+d.id+'"] .box',translateX:[-4,4,-2,0],duration:240,easing:'easeInOutSine'});
        return;
      }
      active.add(d.id); message.textContent=d.name+'已登记：代表成员同时点亮。';
      d3.select('[data-id="'+d.id+'"]').classed('active',true);
      d3.select('.link-'+d.id).classed('active',true);
      d3.select('.node-'+d.id).classed('active',true);
      d3.select(button).classed('registered',true).attr('aria-pressed','true');
      update();
      if(!Deck.reduced()) anime({targets:'[data-id="'+d.id+'"] .p03-member',opacity:[0,1],translateY:[8,0],delay:anime.stagger(55),duration:320,easing:'easeOutQuad'});
    }
    function update(){
      document.getElementById('count').textContent=active.size+'/5';
      d3.selectAll('.p03-dots i').classed('on',function(d,i){return i<active.size;});
      if(active.size===5){
        d3.selectAll('.p03-link,.p03-node').classed('active',true);
        document.getElementById('rootLabel').classList.add('done');
        document.querySelector('#rootLabel small').textContent='太阳系 ≠ 八颗行星';
        message.textContent='全部登记完成：五类成员共同构成太阳系。';
      }
    }
    function reset(){
      active.clear();
      d3.selectAll('.p03-class,.p03-link,.p03-node').classed('active',false);
      d3.select('.p03-node.root').classed('root',true);
      d3.selectAll('.reg').classed('registered',false).attr('aria-pressed','false');
      document.getElementById('rootLabel').classList.remove('done');
      document.querySelector('#rootLabel small').textContent='一套系统包含多类成员';
      message.textContent=''; update();
    }
    if(!Deck.reduced()){
      anime({targets:'.p03-link',strokeDashoffset:[anime.setDashoffset,0],duration:700,easing:'easeInOutQuad'});
      anime({targets:'.p03-class',translateY:[24,0],opacity:[0,.42],delay:anime.stagger(80),duration:520,easing:'easeOutQuad'});
    }
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
