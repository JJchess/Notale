<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="04" data-total="32">
<div id="stage">
  <style>
    .p04-head{height:112px;padding:26px 40px 12px;box-sizing:border-box;display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
    .p04-kicker{font:700 var(--fs-label)/1.3 var(--font-mono);letter-spacing:.15em;color:var(--orbit)}
    .p04-head p{margin:5px 0 0;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .p04-status{display:flex;gap:12px;align-items:center}.p04-status .badge::before{content:'○';font-size:18px}.p04-status .seen{border-color:var(--sun);color:var(--sun);background:rgba(255,200,87,.12)}.p04-status .seen::before{content:'●'}
    .p04-main{position:relative;margin:0 40px 12px;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-md);background:linear-gradient(180deg,rgba(85,185,255,.045),transparent 45%),var(--panel-deep)}
    .p04-main::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(143,210,255,.25) .8px,transparent .8px);background-size:42px 42px;opacity:.22}
    #space{position:absolute;inset:0;width:100%;height:100%}
    .p04-overlay{position:absolute;inset:0;padding:18px 24px;box-sizing:border-box;pointer-events:none;display:grid;grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:12px}
    .p04-rail{position:relative;border:1px solid var(--line);border-radius:var(--r-sm);transition:border-color 260ms cubic-bezier(.2,.8,.2,1),opacity 260ms}.p04-rail.active{border-color:var(--sun);box-shadow:inset 0 0 22px rgba(255,200,87,.06)}
    .p04-rail-head{position:absolute;left:14px;top:10px;display:flex;gap:9px;align-items:center}.p04-rail-title{font-size:var(--fs-h2);font-weight:720}.p04-rail-meta{font-size:var(--fs-label);color:var(--muted)}
    .p04-end{position:absolute;right:14px;top:10px;font-size:var(--fs-label);font-weight:700;color:var(--muted)}.active .p04-end{color:var(--sun)}
    .p04-names{position:absolute;left:5%;right:3%;bottom:8px;height:23px}.p04-name{position:absolute;transform:translateX(-50%);font-size:14px;line-height:1.2;color:var(--muted);white-space:nowrap}.p04-name:first-child{transform:none}
    .p04-callout{position:absolute;font-size:var(--fs-label);line-height:1.35;color:var(--orbit-bright);padding:4px 8px;background:rgba(9,22,37,.86);border-left:2px solid var(--orbit)}
    #earthNote{left:10%;top:46%}#neptuneNote{right:2%;bottom:15%}#namesR .p04-name:nth-child(-n+5){bottom:0;border-left:1px solid var(--orbit-dim);padding-left:4px}#namesR .p04-name:nth-child(1){left:0!important;transform:none}#namesR .p04-name:nth-child(2){left:5%!important}#namesR .p04-name:nth-child(3){left:10%!important}#namesR .p04-name:nth-child(4){left:15%!important}#namesR .p04-name:nth-child(5){left:20%!important}
    .p04-control{height:150px;margin:0 40px 24px;padding:14px 20px;box-sizing:border-box}
    .p04-control .ctl{gap:18px}.p04-control input{height:28px}.p04-endlabel{width:185px;font-size:var(--fs-label);line-height:1.35}.p04-endlabel:last-of-type{text-align:right}
    .p04-msg{height:28px;margin-top:6px;text-align:center;font-size:var(--fs-sec);line-height:28px;color:var(--muted)}.p04-msg.warn{color:var(--danger)}
    .p04-conclusion{margin-top:4px;text-align:center;font-size:var(--fs-lead);font-weight:720;line-height:1.4;color:var(--sun);opacity:0;transform:translateY(8px);transition:opacity 320ms,transform 320ms}.p04-conclusion.show{opacity:1;transform:none}
    .p04-shake{animation:p04shake 360ms ease}@keyframes p04shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.p04-conclusion{transform:none}}
  </style>
  <header class="p04-head">
    <div><div class="p04-kicker">SCALE CHECK · 04</div><h1>一张图，两种真相</h1><p>拖动“双尺度”，观察同一组天体在两条共同标尺上的取舍。</p></div>
    <div class="p04-status" aria-label="查看进度"><span id="seenD" class="badge">已查看直径尺度</span><span id="seenR" class="badge">已查看距离尺度</span></div>
  </header>
  <main class="p04-main grow min0 no-pan" aria-label="太阳与八颗行星的双尺度三维比较图">
    <canvas id="space" class="cv-fill"></canvas>
    <div class="p04-overlay k-comparison" style="--compare-cols:2">
      <section id="railD" class="p04-rail active"><div class="p04-rail-head"><span class="p04-rail-title">直径标尺</span><span class="p04-rail-meta">直径比例 1:1</span></div><div class="p04-end">距离已压缩</div><div id="namesD" class="p04-names"></div></section>
      <section id="railR" class="p04-rail"><div class="p04-rail-head"><span class="p04-rail-title">距离标尺</span><span class="p04-rail-meta">距离比例 1:1</span></div><div class="p04-end">行星直径已放大</div><div id="namesR" class="p04-names"></div></section>
    </div>
    <div id="earthNote" class="p04-callout"></div><div id="neptuneNote" class="p04-callout"></div>
  </main>
  <section class="p04-control panel">
    <div id="controlRow" class="ctl"><span class="p04-endlabel"><b>保住大小</b><br><span class="muted">牺牲距离</span></span><input id="scaleMix" aria-label="双尺度：从保住大小到保住距离" type="range" min="0" max="1" step="0.01" value="0"><span class="p04-endlabel"><b>保住距离</b><br><span class="muted">牺牲大小</span></span><button id="reset" class="btn" type="button">重置比较</button></div>
    <div id="msg" class="p04-msg">当前：直径尺度。拖到另一端比较距离尺度。</div>
    <div id="conclusion" class="p04-conclusion">普通横图只能保住大小关系或距离关系；若两者都看得清，至少一种比例已被改写。</div>
  </section>
  <script src="assets/lib/three.min.js"></script>
  <script>
  window.addEventListener('load',function(){
    Deck.init({index:4,total:32});
    var ids=['sun'].concat(Lec.K.planetOrder), namesD=document.getElementById('namesD'), namesR=document.getElementById('namesR');
    var bodies=ids.map(function(id){return {id:id,name:Lec.K.bodies[id].name,diam:Lec.P.bodyDiameterKm(id),au:id==='sun'?0:Lec.K.bodies[id].semimajorAxisAU};});
    var maxAu=bodies[bodies.length-1].au, sunD=bodies[0].diam, earth=bodies.filter(function(b){return b.id==='earth'})[0];
    document.getElementById('earthNote').textContent='地球直径≈太阳的 1/'+Lec.P.significantFigures(sunD/earth.diam,3);
    document.getElementById('neptuneNote').textContent='海王星距离≈地球的 '+Lec.P.significantFigures(maxAu/earth.au,3)+' 倍';
    function addNames(host,distance){bodies.forEach(function(b,i){var s=document.createElement('span');s.className='p04-name';s.textContent=b.name;var pct=distance?Lec.P.linearScale(b.au,0,maxAu,0,100):Lec.P.linearScale(i,0,bodies.length-1,0,100);s.style.left=pct+'%';host.appendChild(s);});}
    addNames(namesD,false);addNames(namesR,true);
    var canvas=document.getElementById('space'), box=canvas.parentElement;
    var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true,powerPreference:'high-performance'});renderer.outputColorSpace=THREE.SRGBColorSpace;
    var scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(42,1,.01,5000);camera.position.set(0,9,28);camera.lookAt(0,0,0);
    scene.add(new THREE.AmbientLight(0x9fcfff,1.3));var light=new THREE.PointLight(0xffc857,70,80);light.position.set(-13,4,8);scene.add(light);
    var groups=[new THREE.Group(),new THREE.Group()];groups[0].position.y=3.3;groups[1].position.y=-4.0;scene.add(groups[0],groups[1]);
    var orbitMat=new THREE.LineBasicMaterial({color:0x55b9ff,transparent:true,opacity:.45});
    function railLine(g){var geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-14,0,0),new THREE.Vector3(14,0,0)]);g.add(new THREE.Line(geo,orbitMat.clone()));}
    railLine(groups[0]);railLine(groups[1]);
    var palette={sun:0xffc857,mercury:0xb8b1a8,venus:0xe7b878,earth:0x55b9ff,mars:0xd97955,jupiter:0xd7b38d,saturn:0xe9d19b,uranus:0x84d8e8,neptune:0x537eea};
    var meshes=[[],[]];
    bodies.forEach(function(b,i){
      var trueR=Math.max(.045,2.0*b.diam/sunD), visibleR=b.id==='sun'?1.65:.18;
      [0,1].forEach(function(row){var r=row===0?trueR:visibleR;var geo=new THREE.SphereGeometry(r,24,16);var mat=new THREE.MeshStandardMaterial({color:palette[b.id]||0xddeeff,emissive:b.id==='sun'?0x9b5b00:0x07111f,emissiveIntensity:b.id==='sun'?1.1:.2,roughness:.7});var m=new THREE.Mesh(geo,mat);var x=row===0?Lec.P.linearScale(i,0,bodies.length-1,-13.5,13.5):Lec.P.linearScale(b.au,0,maxAu,-13.5,13.5);m.position.set(x,0,0);groups[row].add(m);meshes[row].push(m);if(b.id==='saturn'){var ring=new THREE.Mesh(new THREE.RingGeometry(r*1.35,r*2.05,48),new THREE.MeshBasicMaterial({color:0xdacb9d,side:THREE.DoubleSide,transparent:true,opacity:.72}));ring.rotation.x=Math.PI/2.5;m.add(ring);}}
      );
    });
    function resize(){var w=box.clientWidth,h=box.clientHeight;renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();render();}
    function render(){renderer.render(scene,camera);}Deck.onResize(resize);resize();
    var slider=document.getElementById('scaleMix'), railD=document.getElementById('railD'),railR=document.getElementById('railR'),msg=document.getElementById('msg'),seenD=document.getElementById('seenD'),seenR=document.getElementById('seenR'),conclusion=document.getElementById('conclusion'),controlRow=document.getElementById('controlRow');
    var visitedD=true,visitedR=false,timer=0;
    function update(){var v=Number(slider.value);groups[0].traverse(function(o){if(o.material&&o.material.opacity!==undefined){o.material.transparent=true;o.material.opacity=.22+.78*(1-v);}});groups[1].traverse(function(o){if(o.material&&o.material.opacity!==undefined){o.material.transparent=true;o.material.opacity=.22+.78*v;}});railD.classList.toggle('active',v<.5);railR.classList.toggle('active',v>=.5);if(v===0){visitedD=true;seenD.classList.add('seen');msg.className='p04-msg';msg.textContent='当前：直径尺度。距离为了容纳画幅而被压缩。';}else if(v===1){visitedR=true;seenR.classList.add('seen');msg.className='p04-msg';msg.textContent='当前：距离尺度。行星直径必须放大才看得见。';}else{msg.className='p04-msg';msg.textContent='过渡中：大小与距离都不是同一真实比例。';clearTimeout(timer);timer=setTimeout(function(){if(Number(slider.value)>0&&Number(slider.value)<1){controlRow.classList.add('p04-shake');msg.className='p04-msg warn';msg.textContent='这是过渡视图：大小和距离都不是同一真实比例。';setTimeout(function(){controlRow.classList.remove('p04-shake');},400);}},2000);}if(visitedD&&visitedR)conclusion.classList.add('show');render();}
    slider.addEventListener('input',update);slider.addEventListener('change',function(){var v=Number(slider.value);if(v<.08)slider.value=0;else if(v>.92)slider.value=1;update();});
    document.getElementById('reset').addEventListener('click',function(){clearTimeout(timer);slider.value=0;visitedD=true;visitedR=false;seenD.classList.add('seen');seenR.classList.remove('seen');conclusion.classList.remove('show');update();slider.focus();});
    if(Deck.reduced()){slider.value=0;}update();
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
