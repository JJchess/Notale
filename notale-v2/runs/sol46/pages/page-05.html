<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="05" data-total="32">
<div id="stage">
  <style>
    .p05-head{padding:28px 40px 14px}.p05-kicker{color:var(--orbit);font:700 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.12em}.p05-take{margin:7px 0 0;color:var(--muted)}
    .p05-main{padding:0 40px 34px}.p05-scene{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-lg);background:linear-gradient(180deg,#091625 0 48%,#0d2233 48% 100%);box-shadow:0 14px 34px var(--shadow)}
    .p05-sky{position:absolute;inset:0;background:radial-gradient(circle at 17% 45%,var(--sun-glow),transparent 18%),linear-gradient(165deg,transparent 50%,rgba(85,185,255,.08) 50.2%,transparent 51%)}
    .p05-building{position:absolute;left:43%;top:15%;width:31%;height:42%;border:2px solid var(--line-strong);border-bottom:0;background:linear-gradient(90deg,var(--panel-deep),var(--panel));clip-path:polygon(0 18%,18% 18%,18% 0,82% 0,82% 18%,100% 18%,100% 100%,0 100%)}
    .p05-door{position:absolute;left:55%;top:30%;width:9%;height:27%;border:2px solid var(--orbit-dim);border-bottom:0;background:#07111f}
    .p05-path{position:absolute;left:0;right:0;top:48%;bottom:0;background:linear-gradient(105deg,transparent 0 14%,rgba(85,185,255,.09) 14.2% 78%,transparent 78.2%),repeating-linear-gradient(90deg,transparent 0 72px,rgba(85,185,255,.08) 73px 75px)}
    .p05-sun{position:absolute;left:42px;top:calc(48% - 54px);width:108px;height:108px;border-radius:50%;background:radial-gradient(circle at 34% 30%,var(--sun-soft),var(--sun) 48%,#d88917);box-shadow:0 0 42px var(--sun-glow);display:grid;place-items:center;color:#07111f;font-weight:800}
    .p05-line{position:absolute;left:150px;right:34px;top:61%;height:4px;background:linear-gradient(90deg,var(--orbit),var(--orbit-dim));box-shadow:0 0 12px var(--orbit-glow)}.p05-line:after{content:"";position:absolute;right:-1px;top:-5px;border:7px solid transparent;border-left-color:var(--orbit)}
    .p05-guess{position:absolute;left:150px;right:34px;top:calc(61% - 25px);height:54px;margin:0;appearance:none;background:transparent;z-index:4}.p05-guess::-webkit-slider-thumb{appearance:none;width:22px;height:22px;border:4px solid var(--text);border-radius:50%;background:var(--orbit);box-shadow:0 0 15px var(--orbit);cursor:grab}.p05-guess::-moz-range-thumb{width:16px;height:16px;border:4px solid var(--text);border-radius:50%;background:var(--orbit);cursor:grab}
    .p05-tickmark{position:absolute;z-index:3;top:calc(61% - 17px);width:3px;height:38px;background:var(--sun);box-shadow:0 0 14px var(--sun);opacity:0;transition:opacity 220ms ease-out}.p05-tickmark.show{opacity:1}.p05-earth-label{position:absolute;left:50%;top:calc(61% + 28px);transform:translateX(-50%);color:var(--sun);font-size:var(--fs-label);font-weight:700;opacity:0}.p05-earth-label.show{opacity:1}
    .p05-near{position:absolute;left:168px;top:calc(61% + 33px)}.p05-far{position:absolute;right:26px;top:calc(61% + 33px);text-align:right}.p05-scene-note{position:absolute;left:38px;bottom:26px;max-width:610px;color:var(--muted)}
    .p05-side{width:550px}.p05-process{--process-cols:4}.p05-process>.step{padding:10px 8px;text-align:center;font-size:var(--fs-label)}
    .p05-values{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}.p05-metric{padding:12px 14px;border-left:3px solid var(--orbit-dim);background:var(--panel-deep)}.p05-metric strong{display:block;color:var(--orbit-bright);font:700 var(--fs-lead)/1.25 var(--font-mono)}.p05-extended{opacity:.42;transition:opacity 260ms ease-out}.p05-extended.on{opacity:1}.p05-feedback{min-height:70px;border-left:4px solid var(--orbit);padding:10px 14px;background:var(--panel-deep)}.p05-feedback.good{border-color:var(--success)}.p05-feedback.bad{border-color:var(--danger)}
    .p05-shake{animation:p05shake 260ms ease-out}@keyframes p05shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
    .p05-enter{animation:p05in 620ms ease-out both}.p05-delay{animation-delay:160ms}@keyframes p05in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){.p05-enter,.p05-shake{animation:none!important}.p05-tickmark,.p05-extended{transition:none}}
  </style>
  <header class="p05-head" style="height:108px">
    <div class="p05-kicker">WALKING SCALE · 05</div>
    <div class="row items-end justify-between gap-4"><h1>把太阳装进教室</h1><p class="lead p05-take">同一缩尺，大小与间距却落入两种直觉尺度。</p></div>
  </header>
  <main class="p05-main row gap-4 grow min0">
    <section class="p05-scene grow min0 no-pan p05-enter" aria-label="校园步道缩尺模型">
      <div class="p05-sky"></div><div class="p05-building"></div><div class="p05-door"></div><div class="p05-path"></div>
      <div class="p05-sun"><span>模型太阳</span></div><div class="p05-line"></div>
      <div id="trueTick" class="p05-tickmark"></div><div id="earthLabel" class="p05-earth-label">真实位置 · 地球</div>
      <input id="guess" class="p05-guess" type="range" min="0" max="150" step="1" value="38" aria-label="拖动地球标记，猜测它离太阳有多远">
      <div class="p05-near label">太阳起点</div><div class="p05-far label">街区方向 →</div>
      <p class="p05-scene-note sec">拖动蓝色地球标记，猜它应落在步道的哪里。松手后显示真实位置。</p>
    </section>
    <aside class="p05-side col gap-3 min0 p05-enter p05-delay">
      <div class="k-process p05-process" aria-label="缩尺模型步骤">
        <div class="axis"></div><div class="step current" data-step="1">1 选尺度<span class="arw"></span></div><div class="step" data-step="2">2 猜位置<span class="arw"></span></div><div class="step" data-step="3">3 揭示<span class="arw"></span></div><div class="step" data-step="4">4 比较</div>
      </div>
      <section class="panel col gap-3 grow min0">
        <div class="ctl"><label for="sunSize">模型太阳直径</label><input id="sunSize" type="range" min="0.1" max="1.5" step="0.1" value="1"><output id="sunOut" class="readout" for="sunSize"></output></div>
        <div class="scale diameter"><span>太阳</span><div class="track"></div><span>地球颗粒</span></div>
        <div class="p05-values">
          <div class="p05-metric"><span class="label muted">地球直径</span><strong id="earthD"></strong></div>
          <div class="p05-metric"><span class="label muted">日地距离</span><strong id="earthR"></strong></div>
          <div class="p05-metric p05-extended"><span class="label muted">木星直径</span><strong id="jupiterD"></strong></div>
          <div class="p05-metric p05-extended"><span class="label muted">海王星距离</span><strong id="neptuneR"></strong></div>
        </div>
        <div class="scale distance"><span>毫米级天体</span><div class="track"></div><span>百米至街区距离</span></div>
        <div id="feedback" class="p05-feedback sec" aria-live="polite">先选太阳大小，再拖动地球标记。</div>
        <button id="reset" class="btn primary" type="button" hidden>换个太阳再走一次</button>
      </section>
      <p class="lead" style="margin:0">把太阳缩到直径 <span id="claimSun" class="accent mono"></span>，地球只有约 <span id="claimEarth" class="accent mono"></span>，却要放在约 <span id="claimDistance" class="accent mono"></span> 外。</p>
    </aside>
  </main>
  <script>
  document.addEventListener('DOMContentLoaded',function(){
    Deck.init({index:5,total:32});
    const presets=[0.1,0.2,0.5,1,1.5];
    const sun=document.getElementById('sunSize'), guess=document.getElementById('guess'), feedback=document.getElementById('feedback'), reset=document.getElementById('reset');
    const steps=[...document.querySelectorAll('.p05-process .step')];
    let scale, attempted=false;
    const sig=v=>Lec.P.significantFigures(v,3);
    function length(m){return m<1?sig(m*1000)+' mm':m<1000?sig(m)+' m':sig(m/1000)+' km'}
    function setStep(n){steps.forEach((el,i)=>{el.classList.toggle('current',i===n-1);el.classList.toggle('done',i<n-1)})}
    function update(){
      const d=Number(sun.value); scale=Lec.P.solarSystemScaleFromSunDiameter(d); attempted=false;
      document.getElementById('sunOut').textContent=sig(d)+' m'; document.getElementById('earthD').textContent=length(scale.earthDiameterM);
      document.getElementById('earthR').textContent=length(scale.earthDistanceM); document.getElementById('jupiterD').textContent=length(scale.jupiterDiameterM); document.getElementById('neptuneR').textContent=length(scale.neptuneDistanceM);
      document.getElementById('claimSun').textContent=sig(d)+' m'; document.getElementById('claimEarth').textContent=length(scale.earthDiameterM); document.getElementById('claimDistance').textContent=length(scale.earthDistanceM);
      hideReveal(); setStep(2); feedback.className='p05-feedback sec'; feedback.textContent='拖动地球标记，猜它应落在步道的哪里。';
    }
    function hideReveal(){document.getElementById('trueTick').classList.remove('show');document.getElementById('earthLabel').classList.remove('show');document.querySelectorAll('.p05-extended').forEach(x=>x.classList.remove('on'));reset.hidden=true}
    function check(){
      attempted=true; const guessed=Number(guess.value)/100*scale.earthDistanceM*1.5; const err=Math.abs(guessed-scale.earthDistanceM)/scale.earthDistanceM; const pct=(2/3)*100;
      const tick=document.getElementById('trueTick'), lab=document.getElementById('earthLabel'); tick.style.left='calc(150px + (100% - 184px) * '+pct/100+')';lab.style.left=tick.style.left;tick.classList.add('show');lab.classList.add('show');setStep(3);
      if(err<=0.1){feedback.className='p05-feedback sec good';feedback.textContent='误差 ≤10%：走到这里才是地球。';document.querySelectorAll('.p05-extended').forEach(x=>x.classList.add('on'));reset.hidden=false;setStep(4)}
      else{feedback.className='p05-feedback sec bad p05-shake';feedback.textContent='你把地球放得太'+(guessed<scale.earthDistanceM?'近':'远')+'；距离也按同一比例缩小。';setTimeout(()=>feedback.classList.remove('p05-shake'),300)}
    }
    sun.addEventListener('input',update); guess.addEventListener('change',check);
    reset.addEventListener('click',()=>{guess.value=38;sun.value=presets[3];update();sun.focus()});
    update();
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
