<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="06" data-total="32">
<div id="stage">
  <style>
    #stage{padding:28px 42px 30px;gap:18px}
    .page-title{font-size:40px}
    .eyebrow{color:var(--orbit-bright);font:700 var(--fs-label)/1.3 var(--font-mono);letter-spacing:.12em}
    .hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-md);background:linear-gradient(180deg,rgba(85,185,255,.05),rgba(9,22,37,.78));min-height:0}
    .route{position:absolute;left:84px;right:44px;top:92px;height:3px;background:linear-gradient(90deg,var(--sun),var(--orbit) 18%,var(--orbit-dim));box-shadow:0 0 14px var(--orbit-glow);transform-origin:left center}
    .sun-node{position:absolute;left:31px;top:64px;width:58px;height:58px;border-radius:50%;background:var(--sun);box-shadow:0 0 30px var(--sun-glow);color:var(--bg);font-size:15px;font-weight:800;display:grid;place-items:center}
    .stations{position:absolute;left:108px;right:30px;top:43px;display:flex;justify-content:space-between;align-items:start}
    .station{width:104px;text-align:center;opacity:.42}
    .station-dot{width:18px;height:18px;margin:40px auto 8px;border:2px solid var(--orbit);border-radius:50%;background:var(--panel-deep)}
    .station.live{opacity:1}.station.live .station-dot{border-color:var(--sun);background:var(--sun);box-shadow:0 0 18px var(--sun-glow)}
    .station-name{font-size:18px;font-weight:720;line-height:1.25}
    .station-time{font:700 16px/1.25 var(--font-mono);color:var(--sun);min-height:20px}
    .break-mark{position:absolute;left:59%;top:80px;color:var(--muted);font:700 18px/1 var(--font-mono);letter-spacing:3px;background:var(--panel-deep);padding:4px 8px}
    .light-pulse{position:absolute;left:78px;top:82px;width:23px;height:23px;border-radius:50%;background:var(--sun);box-shadow:0 0 22px var(--sun);opacity:0;z-index:4}
    .hero-meta{position:absolute;left:116px;right:34px;bottom:18px;display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
    .technical-line{position:absolute;left:15px;right:15px;top:14px;border-top:1px dashed var(--line)}
    .table-panel{padding:14px 18px 16px}
    .ledger{display:grid;grid-template-columns:62px 150px 160px 245px 1fr;align-items:center}
    .ledger>div{min-width:0;padding:6px 12px;border-bottom:1px solid var(--line);font-size:16px;line-height:1.35}
    .ledger .hdr{color:var(--muted);font-size:14px;font-weight:700;background:var(--panel-raised)}
    .ledger .planet{font-size:18px;font-weight:720;color:var(--orbit-bright)}
    .ledger .time{font-size:20px;color:var(--text)}
    .ledger .pending{color:var(--quiet)}
    .ledger .revealed{color:var(--sun)}
    .control-panel{width:390px;padding:18px 20px}
    .choice-card{border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--panel-deep);padding:12px 14px;font-size:18px;font-weight:720;will-change:transform}
    .select{width:100%;min-height:46px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--panel-deep);color:var(--text);padding:8px 12px;font:650 16px/1.35 var(--font-sans)}
    .status{min-height:46px;color:var(--muted);font-size:16px;line-height:1.4}
    .complete{color:var(--sun);font-size:22px;font-weight:760}
    @media(prefers-reduced-motion:reduce){.light-pulse{display:none}}
  </style>

  <header class="row items-end justify-between" style="height:82px">
    <div class="col gap-1"><div class="eyebrow">LIGHT-TIME RELAY · 单程</div><h1 class="page-title">光要走多久？</h1></div>
    <div class="lead" style="max-width:690px;text-align:right">即使信息以光速传播，从太阳到各行星仍需要数分钟到数小时。</div>
  </header>

  <section class="hero" style="height:210px" aria-label="太阳到八颗行星的压缩光行时间轴">
    <div class="technical-line"></div><div class="route"></div><div class="sun-node">太阳</div>
    <div class="light-pulse" aria-hidden="true"></div><div class="stations k-enumeration" id="stations" style="--enum-cols:8"></div>
    <div class="break-mark" title="外行星距离经过压缩">// //</div>
    <div class="hero-meta"><span>共同起点：太阳</span><span>轨道距离采用压缩标尺，不能从屏幕间距读取比例</span><span>外行星段</span></div>
  </section>

  <main class="row gap-3 grow min0">
    <section class="panel table-panel grow min0" aria-label="八颗行星平均日距和单程光行时间">
      <div class="ledger" id="ledger"></div>
    </section>
    <aside class="panel control-panel col gap-3 min0">
      <div class="row justify-between items-center"><h2>选择下一站</h2><span class="badge" id="progress">已接通 0 / 8</span></div>
      <div class="note">按离太阳由近到远选择。选对后，光脉冲会接通下一站。</div>
      <div class="choice-card" id="choiceCard">等待选择</div>
      <label class="label" for="planetSelect">候选行星</label>
      <select class="select" id="planetSelect" aria-describedby="feedback"></select>
      <button class="btn primary" id="connectBtn">接通这一站</button>
      <div class="status" id="feedback" aria-live="polite">从离太阳最近的行星开始。</div>
      <div class="complete" id="complete" hidden>3 分钟 → 4 小时</div>
      <button class="btn" id="resetBtn">重新接力</button>
      <div class="note" style="margin-top:auto">这里是单程光行时间，不是飞船航行时间。<br>以平均轨道距离计算 · 光速约 <span id="cValue" class="mono"></span></div>
    </aside>
  </main>
  <script src="assets/lib/anime.min.js"></script>
  <script>
  window.addEventListener('DOMContentLoaded',function(){
    Deck.init({index:6,total:32});
    var ids=['mercury','venus','earth','mars','jupiter','saturn','uranus','neptune'];
    var zh=['水星','金星','地球','火星','木星','土星','天王星','海王星'];
    var data=ids.map(function(id,i){
      var b=Lec.K.bodies[id], sec=Lec.P.lightTravelTimeFromAU(b.semimajorAxisAU), p=Lec.P.lightTravelTimeParts(sec);
      return {id:id,name:zh[i],au:b.semimajorAxisAU,sec:sec,parts:p};
    });
    var stations=document.getElementById('stations'), ledger=document.getElementById('ledger'), select=document.getElementById('planetSelect');
    function exact(d){var p=d.parts;if(p.hours){return p.hours+' 时 '+String(p.minutes).padStart(2,'0')+' 分 '+String(Math.round(p.seconds)).padStart(2,'0')+' 秒';}return p.minutes+' 分 '+String(Math.round(p.seconds)).padStart(2,'0')+' 秒';}
    function spoken(i,d){if(i===0)return '约 3 分钟';if(i===1)return '约 6 分钟';if(i===2)return '约 8 分钟';if(i===3)return '约 13 分钟';if(i===4)return '约 43 分钟';if(i===5)return '超过 1 小时';if(i===6)return '约 2.7 小时';return '超过 4 小时';}
    stations.innerHTML=data.map(function(d,i){return '<div class="station it" data-i="'+i+'"><div class="station-dot"></div><div class="station-name">'+d.name+'</div><div class="station-time">—</div></div>';}).join('');
    ledger.innerHTML='<div class="hdr">顺序</div><div class="hdr">行星</div><div class="hdr">平均日距</div><div class="hdr">单程光时</div><div class="hdr">口语读法</div>'+data.map(function(d,i){return '<div class="mono">'+(i+1)+'</div><div class="planet">'+d.name+'</div><div class="mono">'+Lec.P.significantFigures(d.au,3)+' AU</div><div class="time pending" data-time="'+i+'">等待接通</div><div class="pending" data-say="'+i+'">—</div>';}).join('');
    select.innerHTML=data.map(function(d){return '<option value="'+d.id+'">'+d.name+'</option>';}).join('');
    document.getElementById('cValue').textContent=Lec.P.significantFigures(Lec.P.mToKm(Lec.K.physics.C),6)+' km/s';
    var step=0, card=document.getElementById('choiceCard'), feedback=document.getElementById('feedback'), pulse=document.querySelector('.light-pulse');
    function reset(){step=0;document.querySelectorAll('.station').forEach(function(el){el.classList.remove('live');el.querySelector('.station-time').textContent='—';});document.querySelectorAll('[data-time]').forEach(function(el){el.textContent='等待接通';el.className='time pending';});document.querySelectorAll('[data-say]').forEach(function(el){el.textContent='—';el.className='pending';});data.forEach(function(d){select.querySelector('[value="'+d.id+'"]').disabled=false;});select.value=data[0].id;card.textContent='等待选择';feedback.textContent='从离太阳最近的行星开始。';document.getElementById('progress').textContent='已接通 0 / 8';document.getElementById('complete').hidden=true;document.getElementById('connectBtn').disabled=false;}
    function choose(){if(step>=data.length)return;var d=data[step];card.textContent=select.options[select.selectedIndex].text+' · 候选';if(select.value!==d.id){feedback.textContent='这颗行星不在下一站：按离太阳由近到远选择。';if(!Deck.reduced())anime({targets:card,translateX:[0,-8,8,-5,5,0],duration:360,easing:'easeInOutSine'});return;}
      var station=document.querySelector('.station[data-i="'+step+'"]'), targetX=station.offsetLeft+station.offsetWidth/2-pulse.offsetLeft;
      function finish(){station.classList.add('live');station.querySelector('.station-time').textContent=exact(d);var t=document.querySelector('[data-time="'+step+'"]'),s=document.querySelector('[data-say="'+step+'"]');t.textContent=exact(d);t.className='time revealed';s.textContent=spoken(step,d);s.className='revealed';select.querySelector('[value="'+d.id+'"]').disabled=true;step++;document.getElementById('progress').textContent='已接通 '+step+' / 8';feedback.textContent=d.name+'：单程约 '+spoken(step-1,d).replace('约 ','')+'。';if(!Deck.reduced())anime({targets:card,scale:[1,1.06,1],boxShadow:['0 0 0 #FFC857','0 0 22px #FFC857'],duration:420,easing:'easeOutQuad'});if(step<data.length){select.value=data[step].id;}else{document.getElementById('complete').hidden=false;document.getElementById('connectBtn').disabled=true;feedback.textContent='八站全部接通：等待从分钟跨入小时。';if(!Deck.reduced())anime({targets:'.station',opacity:[.75,1],duration:500,delay:anime.stagger(70)});}}
      if(Deck.reduced()){finish();}else{pulse.style.opacity=1;anime({targets:pulse,translateX:[0,targetX],duration:900+180*step,easing:'linear',complete:function(){pulse.style.opacity=0;pulse.style.transform='translateX(0)';finish();}});}
    }
    select.addEventListener('change',function(){card.textContent=select.options[select.selectedIndex].text+' · 候选';});
    document.getElementById('connectBtn').addEventListener('click',choose);document.getElementById('resetBtn').addEventListener('click',reset);
    if(!Deck.reduced())anime.timeline({easing:'easeOutQuad'}).add({targets:'.sun-node',scale:[.4,1],opacity:[0,1],duration:420}).add({targets:'.station',opacity:[0,.42],translateY:[-8,0],delay:anime.stagger(90),duration:360},'-=180').add({targets:'.route',scaleX:[0,1],duration:650},'-=250');
    reset();
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
