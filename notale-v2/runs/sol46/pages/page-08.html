    <div class="cell min0"><div class="p08-panel"><h2>太阳占多少？</h2><div class="p08-options" id="choices"></div><button class="btn primary" id="commit" disabled>锁定猜测</button><div class="p08-feedback" id="feedback" aria-live="polite">选择一个质量份额，再锁定答案。</div></div></div>
    <div class="cell min0"><div class="p08-panel p08-reveal" id="reveal"><h2>太阳 vs. 其余全部成员</h2><div class="p08-ringwrap"><svg id="massRing" viewBox="0 0 320 320" role="img" aria-label="太阳与太阳系其余成员的质量份额环"></svg><div class="p08-ringlabel"><strong id="sunPct"></strong><span class="label">太阳</span></div><div class="p08-callout"><strong id="restPct"></strong><span>其余全部成员</span></div></div><div class="p08-orbits"><span class="orbit o1"></span><span class="orbit o2"></span><span class="orbit o3"></span><span class="p08-sun" role="img" aria-label="金色太阳居中，蓝色轨道环围绕"></span></div></div></div>
    <div class="rowline"></div>
    <div class="dim">质量份额</div><div class="cell muted">暂不从照片判断</div><div class="cell">用三档答案定位</div><div class="cell diff" id="shareCell">等待揭示</div>
    <div class="dim">数量印象</div><div class="cell">行星很多</div><div class="cell">容易高估行星合计</div><div class="cell diff">数量不等于质量份额</div>
    <div class="dim">结构含义</div><div class="cell">尚未判断</div><div class="cell">谁最能主导？</div><div class="cell diff">高度中心化于太阳</div>
    <div class="axis"><span class="a0" id="axis0"></span><span class="a1" id="axisMid"></span><span class="a2" id="axisMax"></span></div>
  </section>
  <div class="row gap-3 items-center"><div class="p08-conclusion grow" id="conclusion">太阳占太阳系总质量约 <span class="accent mono" id="conclusionPct"></span>；因此引力骨架高度中心化，而不是八颗行星彼此势均力敌。</div><button class="btn" id="reset" hidden>重新猜一次</button></div>

<script src="assets/lib/d3.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded',function(){
  Deck.init({index:8,total:32});
  const fraction=Lec.K.keyValues.SUN_MASS_FRACTION_OF_SOLAR_SYSTEM;
  const pct=v=>Lec.P.significantFigures(Lec.P.percent(v,1),3)+'%';
  const actualLabel=pct(fraction);
  const displayLabel=Lec.P.significantFigures(Lec.P.percent(fraction,1),3)+'%';
  const restLabel=pct(1-fraction);
  const optionValues=[.5,.9,fraction];
  const choices=document.getElementById('choices');
  let selected=null, revealed=false;
  optionValues.forEach((v,i)=>{
    const b=document.createElement('button'); b.className='btn p08-choice'; b.type='button'; b.dataset.value=String(v);
    b.innerHTML='<span>'+pct(v)+'</span><small>'+(i===0?'一半':i===1?'绝大部分':'几乎全部')+'</small>';
    b.addEventListener('click',()=>select(v,b)); choices.appendChild(b);
  });
  document.getElementById('axis0').textContent=pct(0);
  document.getElementById('axisMid').textContent=pct(.5);
  document.getElementById('axisMax').textContent=pct(1)+' 太阳系总质量';
  document.getElementById('sunPct').textContent=actualLabel;
  document.getElementById('restPct').textContent=restLabel;
  document.getElementById('conclusionPct').textContent=actualLabel;
  function select(v,b){if(revealed)return;selected=v;choices.querySelectorAll('button').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',x===b)});document.getElementById('commit').disabled=false;document.getElementById('s1').classList.remove('current');document.getElementById('s2').classList.add('current');}
  function drawRing(animate){
    const data=[{name:'太阳',value:fraction,color:'#FFC857'},{name:'其余',value:1-fraction,color:'#55B9FF'}];
    const pie=d3.pie().sort(null).value(d=>d.value), arc=d3.arc().innerRadius(92).outerRadius(138).padAngle(.004);
    const svg=d3.select('#massRing');svg.selectAll('*').remove();const g=svg.append('g').attr('transform','translate(160,160)');
    const paths=g.selectAll('path').data(pie(data)).join('path').attr('fill',d=>d.data.color).attr('stroke','#07111F').attr('stroke-width',2);
    if(animate&&!Deck.reduced()) paths.attr('d',d=>arc({startAngle:d.startAngle,endAngle:d.startAngle})).transition().duration(700).attrTween('d',function(d){const it=d3.interpolate(d.startAngle,d.endAngle);return t=>arc({startAngle:d.startAngle,endAngle:it(t),padAngle:d.padAngle});}); else paths.attr('d',arc);
    g.append('text').attr('x',110).attr('y',-88).attr('fill','#8FD2FF').style('font-size','16px').text(restLabel);
    g.append('line').attr('x1',104).attr('y1',-94).attr('x2',139).attr('y2',-111).attr('stroke','#55B9FF').attr('stroke-width',2);
  }
  function reveal(){if(selected===null)return;revealed=true;choices.querySelectorAll('button').forEach(b=>b.disabled=true);const chosen=[...choices.children].find(b=>Number(b.dataset.value)===selected);const good=selected===fraction;chosen.classList.add(good?'correct':'wrong');document.getElementById('feedback').textContent=good?'判断正确：几乎全部质量都集中在太阳。':'你低估了太阳：所有行星合在一起，仍只占极小份额。';document.getElementById('shareCell').textContent='太阳 '+actualLabel+' · 其余 '+restLabel;document.getElementById('reveal').classList.add('open');document.getElementById('conclusion').classList.add('open');document.getElementById('reset').hidden=false;document.getElementById('commit').hidden=true;document.getElementById('s2').classList.remove('current');document.getElementById('s3').classList.add('current');drawRing(true);}
  function reset(){revealed=false;selected=null;choices.querySelectorAll('button').forEach(b=>{b.disabled=false;b.classList.remove('selected','wrong','correct');b.setAttribute('aria-pressed','false')});document.getElementById('feedback').textContent='选择一个质量份额，再锁定答案。';document.getElementById('shareCell').textContent='等待揭示';document.getElementById('reveal').classList.remove('open');document.getElementById('conclusion').classList.remove('open');document.getElementById('reset').hidden=true;document.getElementById('commit').hidden=false;document.getElementById('commit').disabled=true;document.getElementById('s3').classList.remove('current');document.getElementById('s1').classList.add('current');drawRing(false);}
  document.getElementById('commit').addEventListener('click',reveal);document.getElementById('reset').addEventListener('click',reset);drawRing(false);
});
</script>
