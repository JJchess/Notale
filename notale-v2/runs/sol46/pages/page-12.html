<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="12" data-total="32">
<div id="stage">
  <style>
    .p12-head{padding:28px 42px 14px;position:relative;z-index:2}
    .p12-kicker{color:var(--orbit);letter-spacing:.16em;font:700 var(--fs-label)/1.3 var(--font-mono)}
    .p12-status{min-width:122px;text-align:center}
    .p12-main{padding:0 42px 28px;position:relative}
    .p12-sun{position:absolute;width:210px;height:210px;border-radius:50%;left:0;top:0;background:radial-gradient(circle at 65% 62%,var(--sun-soft),var(--sun) 25%,rgba(255,200,87,.13) 61%,transparent 70%);filter:drop-shadow(0 0 24px var(--sun-glow));pointer-events:none}
    .p12-ledger{position:relative;z-index:1;padding:14px 18px 12px;background:rgba(9,22,37,.92);display:flex;flex-direction:column;min-height:0}
    .p12-headrow,.p12-line{display:grid;grid-template-columns:64px 190px 205px 210px minmax(220px,1fr);align-items:center;column-gap:16px}
    .p12-headrow{height:38px;color:var(--muted);font-size:var(--fs-label);font-weight:700;border-bottom:1px solid var(--line)}
    .p12-lines{flex:1;display:flex;flex-direction:column;min-height:0}
    .p12-line{position:relative;flex:1;min-height:49px;padding:0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;transition:border-color 220ms ease,background 220ms ease}
    .p12-line:last-child{border-bottom:0}
    .p12-line.ready{border-color:var(--sun);background:linear-gradient(90deg,rgba(255,200,87,.08),transparent 72%)}
    .p12-rank{width:30px;height:30px;border:1px solid var(--line-strong);border-radius:50%;display:grid;place-items:center;color:var(--muted);font:700 var(--fs-label)/1 var(--font-mono)}
    .p12-line.ready .p12-rank{background:var(--sun);border-color:var(--sun);color:var(--bg)}
    .p12-slot{height:38px;border:1px dashed var(--orbit-dim);border-radius:var(--r-sm);display:flex;align-items:center;padding:0 12px;color:var(--quiet);font-size:var(--fs-label);background:rgba(85,185,255,.035)}
    .p12-slot:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
    .p12-slot.filled{border-style:solid;border-color:var(--sun);color:var(--sun);font-size:var(--fs-body);font-weight:750;background:rgba(255,200,87,.08)}
    .p12-value{font:650 var(--fs-sec)/1.35 var(--font-mono);color:var(--orbit-bright);opacity:0;transform:translateX(-8px);transition:opacity 300ms ease,transform 300ms ease}
    .revealed .p12-value{opacity:1;transform:none}
    .p12-barcell{height:26px;position:relative;opacity:0;transition:opacity 300ms ease}
    .revealed .p12-barcell{opacity:1}
    .p12-barcell svg{display:block;width:100%;height:100%;overflow:visible}
    .p12-summary{height:58px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}
    .p12-ratio{color:var(--sun);font-size:var(--fs-sec);font-weight:700}
    .p12-controls{display:none;align-items:center;gap:8px}
    .revealed .p12-controls{display:flex}
    .p12-tray{height:120px;padding:12px 18px;position:relative;z-index:1}
    .p12-cards{display:flex;align-items:center;justify-content:center;gap:14px;height:58px}
    .p12-card{width:128px;height:48px;border:1px solid var(--orbit);border-radius:var(--r-sm);background:var(--panel-raised);color:var(--text);font-size:var(--fs-body);font-weight:730;cursor:grab;box-shadow:0 7px 18px var(--shadow);transition:transform 180ms ease,opacity 180ms ease,border-color 180ms ease}
    .p12-card:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    .p12-card.selected{border-color:var(--sun);transform:translateY(-6px);color:var(--sun)}
    .p12-card.placed{opacity:.2;pointer-events:none}
    .p12-card.wrong{animation:p12shake 320ms ease}
    .p12-help{height:32px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:var(--fs-sec)}
    .p12-error{color:var(--danger)}
    @keyframes p12shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
    @media(prefers-reduced-motion:reduce){.p12-card,.p12-value,.p12-barcell,.p12-line{transition:none}.p12-card.wrong{animation:none}}
  </style>

  <header class="p12-head row items-end justify-between" style="height:112px">
    <div class="col gap-1">
      <div class="p12-kicker">ORBITAL PERIOD · 12</div>
      <h1>把八颗行星按“一年”排序</h1>
    </div>
    <div class="row gap-3 items-center">
      <div class="lead">越远，一年长得更快</div>
      <div id="status" class="badge current p12-status" aria-live="polite">已就位 0 / 8</div>
    </div>
  </header>

  <main class="p12-main col gap-3 grow min0">
    <div class="p12-sun" aria-hidden="true"></div>
    <section id="ledger" class="panel p12-ledger grow min0" aria-label="八颗行星公转周期排序台账">
      <div class="p12-headrow">
        <span>序位</span><span>行星</span><span>平均日距</span><span id="periodHead">公转周期（地球年）</span><span>周期长度</span>
      </div>
      <div id="lines" class="p12-lines k-enumeration min0" style="--enum-cols:1;gap:0"></div>
      <div class="p12-summary">
        <div id="ratioText" class="row gap-5" style="visibility:hidden">
          <span class="p12-ratio">水星→海王星：距离约 <span id="distanceRatio" class="mono"></span></span>
          <span class="p12-ratio">一年约 <span id="periodRatio" class="mono"></span></span>
        </div>
        <div id="legend" class="note" style="visibility:hidden">条长采用对数尺度，仅帮助同时看清八项</div>
        <div class="p12-controls ctl" id="controls">
          <span>单位</span>
          <button class="btn correct" id="yearsBtn" aria-pressed="true">地球年</button>
          <button class="btn" id="daysBtn" aria-pressed="false">天</button>
          <button class="btn" id="resetBtn">重置排序</button>
        </div>
      </div>
    </section>

    <section class="panel p12-tray" aria-label="待排序行星卡片">
      <div id="cards" class="p12-cards"></div>
      <div class="p12-help">
        <span>拖动行星卡到空序位；也可先选卡片，再选择序位。</span>
        <span id="feedback" aria-live="assertive">比较的是绕太阳一周所需的时间。</span>
      </div>
    </section>
  </main>

  <script src="assets/lib/d3.min.js"></script>
  <script>
  window.addEventListener('load',function(){
    Deck.init({index:12,total:32});
    const planets=Lec.K.planetOrder.map(id=>Lec.P.body(id));
    const shuffled=[planets[4],planets[0],planets[6],planets[2],planets[7],planets[1],planets[5],planets[3]];
    const scale=d3.scaleLog().domain([80,70000]).range([0,1]);
    const lines=document.getElementById('lines');
    const cards=document.getElementById('cards');
    const ledger=document.getElementById('ledger');
    const feedback=document.getElementById('feedback');
    let selected=null, placed=0, unit='years';
    const fmt=v=>String(Lec.P.significantFigures(v,3));

    planets.forEach((p,i)=>{
      const row=document.createElement('div');
      row.className='it p12-line';
      row.dataset.id=p.id;
      row.innerHTML='<span class="p12-rank">'+(i+1)+'</span><div class="p12-slot" tabindex="0" role="button" aria-label="第 '+(i+1)+' 序位，空位"></div><span class="p12-value distance"></span><span class="p12-value period"></span><span class="p12-barcell"><svg aria-hidden="true"></svg></span>';
      const slot=row.querySelector('.p12-slot');
      slot.addEventListener('dragover',e=>e.preventDefault());
      slot.addEventListener('drop',e=>{e.preventDefault();attempt(e.dataTransfer.getData('text/plain'),i);});
      slot.addEventListener('click',()=>{if(selected)attempt(selected,i);});
      slot.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&selected){e.preventDefault();attempt(selected,i);}});
      lines.appendChild(row);
    });

    shuffled.forEach(p=>{
      const b=document.createElement('button');
      b.className='p12-card'; b.draggable=true; b.dataset.id=p.id; b.textContent=p.name;
      b.setAttribute('aria-label',p.name+'，拖到对应公转周期序位');
      b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',p.id));
      b.addEventListener('click',()=>selectCard(p.id));
      cards.appendChild(b);
    });

    function selectCard(id){
      if(document.querySelector('.p12-card[data-id="'+id+'"]').classList.contains('placed'))return;
      selected=selected===id?null:id;
      document.querySelectorAll('.p12-card').forEach(el=>el.classList.toggle('selected',el.dataset.id===selected));
      feedback.textContent=selected?'已选择'+Lec.P.body(selected).name+'，请选择一个序位。':'比较的是绕太阳一周所需的时间。';
    }

    function attempt(id,index){
      if(!id)return;
      const card=document.querySelector('.p12-card[data-id="'+id+'"]');
      if(id!==planets[index].id){
        card.classList.remove('wrong'); void card.offsetWidth; card.classList.add('wrong');
        feedback.className='p12-error';
        feedback.textContent='这里比较的是绕太阳一周，不是自转一天。再比较它与相邻行星。';
        return;
      }
      const row=lines.children[index],slot=row.querySelector('.p12-slot');
      if(row.classList.contains('ready'))return;
      row.classList.add('ready'); slot.classList.add('filled'); slot.textContent=planets[index].name;
      slot.setAttribute('aria-label','第 '+(index+1)+' 序位，'+planets[index].name+'，已就位');
      card.classList.add('placed'); card.classList.remove('selected'); card.draggable=false;
      selected=null; placed++;
      document.getElementById('status').textContent='已就位 '+placed+' / '+planets.length;
      feedback.className=''; feedback.textContent=planets[index].name+'已就位。';
      if(placed===planets.length)reveal();
    }

    function reveal(){
      ledger.classList.add('revealed');
      document.getElementById('distanceRatio').textContent='×'+fmt(Lec.P.ratio(planets[7].semimajorAxisAU,planets[0].semimajorAxisAU));
      document.getElementById('periodRatio').textContent='×'+fmt(Lec.P.ratio(planets[7].orbitalPeriodDays,planets[0].orbitalPeriodDays));
      document.getElementById('ratioText').style.visibility='visible';
      document.getElementById('legend').style.visibility='visible';
      document.getElementById('status').textContent='排序完成';
      feedback.textContent='越远的行星绕太阳一周通常越久；距离与周期并非等比例增长。';
      renderValues();
    }

    function renderValues(){
      planets.forEach((p,i)=>{
        const row=lines.children[i];
        row.querySelector('.distance').textContent=fmt(p.semimajorAxisAU)+' AU';
        row.querySelector('.period').textContent=unit==='years'?fmt(Lec.P.daysToYears(p.orbitalPeriodDays))+' 年':fmt(p.orbitalPeriodDays)+' 天';
        const svg=d3.select(row.querySelector('svg'));
        const target=Math.max(8,scale(p.orbitalPeriodDays)*100);
        const rect=svg.selectAll('rect').data([p]).join('rect').attr('x',0).attr('y',5).attr('height',16).attr('rx',4).attr('fill','var(--orbit)');
        if(Deck.reduced()) rect.attr('width',target+'%');
        else rect.attr('width',0).transition().delay(i*45).duration(500).ease(d3.easeCubicOut).attr('width',target+'%');
      });
      document.getElementById('periodHead').textContent=unit==='years'?'公转周期（地球年）':'公转周期（天）';
    }

    function setUnit(next){
      unit=next;
      document.getElementById('yearsBtn').classList.toggle('correct',unit==='years');
      document.getElementById('daysBtn').classList.toggle('correct',unit==='days');
      document.getElementById('yearsBtn').setAttribute('aria-pressed',unit==='years');
      document.getElementById('daysBtn').setAttribute('aria-pressed',unit==='days');
      renderValues();
    }
    document.getElementById('yearsBtn').onclick=()=>setUnit('years');
    document.getElementById('daysBtn').onclick=()=>setUnit('days');
    document.getElementById('resetBtn').onclick=()=>location.reload();
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
