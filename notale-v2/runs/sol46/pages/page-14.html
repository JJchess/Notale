<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="14" data-total="32">
<div id="stage">
  <style>
    .p14-head{box-sizing:border-box;padding:22px 30px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
    .p14-kicker{color:var(--orbit);font:700 var(--fs-label)/1.3 var(--font-mono);letter-spacing:.12em;margin-bottom:4px}
    .p14-progress{white-space:nowrap}
    .p14-main{box-sizing:border-box;padding:0 30px 24px;display:flex;flex-direction:column;gap:14px}
    .p14-real{box-sizing:border-box;position:relative;height:274px;padding:12px 18px 8px}
    .p14-real svg{display:block;width:100%;height:100%;overflow:visible}.p14-lens svg{display:block;width:100%;height:calc(100% - 62px);overflow:visible}
    .p14-real-title{position:absolute;left:22px;top:14px;z-index:2}
    .p14-help{position:absolute;right:20px;top:14px;z-index:2;max-width:380px;text-align:right}
    .p14-bottom{display:flex;gap:14px;min-height:0}
    .p14-lens{position:relative;flex:0 0 39%;padding:12px 14px 10px}
    .p14-table-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
    .p14-table{--compare-cols:6;grid-template-columns:90px 80px 98px 98px 98px 112px minmax(130px,1fr);flex:1}
    .p14-table>.hdr,.p14-table>.dim,.p14-table>.cell{padding:6px 8px;font-size:14px;line-height:1.25}
    .p14-table>.dim{text-align:center;color:var(--text);cursor:pointer}
    .p14-table>.cell{cursor:pointer;font-family:var(--font-mono)}
    .p14-table>.case{transition:background 180ms ease,color 180ms ease}
    .p14-table>.case.sel{background:rgba(85,185,255,.15);color:var(--orbit-bright)}
    .p14-table>.case.done{color:var(--sun-soft)}
    .p14-table>.case:focus{outline:2px solid var(--focus);outline-offset:-3px}
    .p14-table .verdict{font-family:var(--font-sans)}
    .p14-status{height:38px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .p14-feedback{font-size:var(--fs-sec);line-height:1.4;color:var(--muted)}
    .p14-feedback.ok{color:var(--success)}.p14-feedback.bad{color:var(--danger)}
    .p14-conclusion{display:none;border-left:5px solid var(--sun);padding-left:12px;color:var(--sun-soft);font-size:var(--fs-sec);font-weight:700}
    .p14-reset{display:none}
    .orbit-path{fill:none;stroke:var(--orbit);stroke-width:2;filter:drop-shadow(0 0 5px rgba(85,185,255,.3))}
    .orbit-path.trace{stroke-dasharray:2200;stroke-dashoffset:2200;animation:p14draw 1.1s ease-out forwards}
    .guide{stroke:var(--line-strong);stroke-width:1.5;stroke-dasharray:7 7}
    .focus-line{stroke:var(--sun);stroke-width:2;opacity:0}.focus-line.on{opacity:1}
    .center-mark{stroke:var(--orbit-bright);stroke-width:2}.center-mark.wrong{stroke:var(--danger);animation:p14flash .22s 2 alternate}
    .sun-dot{fill:var(--sun);stroke:var(--sun-soft);stroke-width:3;cursor:grab;filter:drop-shadow(0 0 9px rgba(255,200,87,.7))}.sun-dot:focus{outline:none;stroke-width:6}
    .point{fill:var(--orbit-bright)}
    .svg-label{fill:var(--muted);font:600 15px var(--font-sans)}
    .svg-label.gold{fill:var(--sun-soft)}
    .halo{fill:none;stroke:var(--sun);stroke-width:4;opacity:0}.halo.run{animation:p14halo .7s ease-out}
    @keyframes p14draw{to{stroke-dashoffset:0}}@keyframes p14flash{to{opacity:.2}}@keyframes p14halo{0%{opacity:0;stroke-dashoffset:350}40%{opacity:1}100%{opacity:0;stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.orbit-path.trace{animation:none;stroke-dashoffset:0}.center-mark.wrong,.halo.run{animation:none}}
  </style>

  <header class="p14-head" style="height:92px">
    <div>
      <div class="p14-kicker">ORBIT SHAPE CHECK</div>
      <h1>圆得像，不等于圆</h1>
    </div>
    <div class="lead muted">多数行星轨道肉眼看起来几乎是圆。<br>但太阳位于椭圆的一个焦点，而不是几何中心。</div>
    <div id="progress" class="badge p14-progress">已体检 0 / 8</div>
  </header>

  <main class="p14-main grow min0">
    <section class="panel p14-real min0" aria-labelledby="realTitle">
      <h2 id="realTitle" class="p14-real-title">真实比例轨道 · 地球</h2>
      <div class="p14-help note">点击病例，再拖动金色太阳到正确位置。键盘可用 ← → 调整，Enter 提交。</div>
      <svg id="realSvg" viewBox="0 0 1200 500" role="img" aria-label="当前行星的真实比例椭圆轨道，可拖动太阳定位焦点"></svg>
    </section>

    <section class="p14-bottom grow min0">
      <div class="panel p14-lens min0">
        <div class="row justify-between items-center"><h2>诊断放大镜</h2><span id="magBadge" class="badge key">偏心率 ×4</span></div>
        <svg id="lensSvg" viewBox="0 0 1200 500" role="img" aria-label="偏心率放大后的诊断轨道"></svg>
        <div class="note">仅放大形变用于辨认；标注值不是真实偏心率。</div>
      </div>

      <div class="p14-table-wrap min0">
        <div id="examTable" class="k-comparison p14-table" aria-label="八颗行星圆度体检表"></div>
        <div class="p14-status">
          <div id="feedback" class="p14-feedback" aria-live="polite">把太阳从中心拖向焦点，再松开。</div>
          <div id="conclusion" class="p14-conclusion">近圆仍有“中心—焦点”之别：只要偏心率不为零，太阳就不在中心。</div>
          <button id="reset" class="btn p14-reset" type="button">重新体检</button>
        </div>
        <div class="note">日距摆幅大，不必代表形状更扁；还要相对轨道尺度看偏心率。</div>
      </div>
    </section>
  </main>

  <script src="assets/lib/d3.min.js"></script>
  <script>
  ;window.addEventListener('DOMContentLoaded',function(){
    'use strict';
    Deck.init({index:14,total:32});
    var ids=Lec.K.planetOrder;
    var verdict={mercury:'八行星中最显椭圆',venus:'最接近圆',earth:'肉眼近圆',mars:'椭圆较明显',jupiter:'接近圆',saturn:'接近圆',uranus:'接近圆',neptune:'非常接近圆'};
    var rows=ids.map(function(id){var b=Lec.K.bodies[id],a=b.semimajorAxisAU,e=b.eccentricity;return{id:id,name:b.name,a:a,e:e,peri:Lec.P.periapsisDistance(a,e),apo:Lec.P.apoapsisDistance(a,e),swing:Lec.P.apoapsisDistance(a,e)-Lec.P.periapsisDistance(a,e),offset:Lec.P.percent(e,Lec.K.math.ONE),verdict:verdict[id]};});
    var selected='earth',done=new Set(),dragNorm=0;
    var fmt=function(v,n){return Lec.P.significantFigures(v,n);};
    var table=d3.select('#examTable');
    ['行星','偏心率 e','近日点 / AU','远日点 / AU','摆幅 / AU','焦点偏移','体检结论'].forEach(function(t){table.append('div').attr('class','hdr').text(t);});
    rows.forEach(function(d){
      var vals=[d.name,fmt(d.e,3),fmt(d.peri,4),fmt(d.apo,4),fmt(d.swing,3),fmt(d.offset,3)+'%',d.verdict];
      vals.forEach(function(v,i){table.append('div').datum(d).attr('class',(i===0?'dim ':'cell ')+(i===6?'verdict ':'')+'case case-'+d.id).attr('tabindex',i===0?0:null).attr('role',i===0?'button':null).attr('aria-label',i===0?'查看'+d.name+'轨道':null).text(v).on('click',function(){select(d.id);}).on('keydown',function(ev){if(i===0&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();select(d.id);}});});
    });
    function current(){return rows.find(function(d){return d.id===selected;});}
    function select(id){selected=id;dragNorm=0;d3.selectAll('.case').classed('sel',false);d3.selectAll('.case-'+id).classed('sel',true);document.getElementById('feedback').className='p14-feedback';document.getElementById('feedback').textContent='把太阳从中心拖向焦点，再松开。';drawAll(false);}
    function scene(svgId,amplified,animate){
      var d=current(),e=amplified?Math.min(d.e*4,.82):d.e,ell=Lec.P.orbitEllipse(Lec.K.math.ONE,e);
      var svg=d3.select(svgId).attr('viewBox','0 0 1200 500');svg.selectAll('*').remove();
      var x=d3.scaleLinear().domain([-1.12,1.12]).range([80,1120]),cy=270,ys=(x(1)-x(0));
      var pts=d3.range(0,361,2).map(function(deg){var r=deg*Math.PI/180;return[x(ell.semimajorAxis*Math.cos(r)),cy-ell.semiminorAxis*Math.sin(r)*ys];});
      var path=svg.append('path').attr('class','orbit-path'+(animate&&!Deck.reduced()?' trace':'')).attr('d',d3.line().curve(d3.curveLinearClosed)(pts));
      svg.append('path').attr('class','halo').attr('d',path.attr('d')).attr('stroke-dasharray','24 18');
      var cx=x(0),fx=x(-ell.focalDistance),left=x(-1),right=x(1),sunx=x(dragNorm);
      svg.append('line').attr('class','guide').attr('x1',cx).attr('x2',fx).attr('y1',cy).attr('y2',cy);
      svg.append('line').attr('class','focus-line '+(done.has(d.id)?'on':'')).attr('x1',cx).attr('x2',fx).attr('y1',cy).attr('y2',cy);
      svg.append('path').attr('class','center-mark').attr('d','M'+(cx-10)+','+cy+'H'+(cx+10)+'M'+cx+','+(cy-10)+'V'+(cy+10));
      svg.append('circle').attr('class','point').attr('cx',fx).attr('cy',cy).attr('r',5);
      svg.append('circle').attr('class','point').attr('cx',left).attr('cy',cy).attr('r',5);svg.append('circle').attr('class','point').attr('cx',right).attr('cy',cy).attr('r',5);
      [['几何中心',cx,cy-22,''],['太阳焦点',fx,cy+34,'gold'],['近日点',left,cy+34,''],['远日点',right,cy+34,'']].forEach(function(q){svg.append('text').attr('class','svg-label '+q[3]).attr('x',q[1]).attr('y',q[2]).attr('text-anchor','middle').text(q[0]);});
      var sun=svg.append('circle').attr('class','sun-dot').attr('cx',sunx).attr('cy',cy).attr('r',17).attr('tabindex',0).attr('role','slider').attr('aria-label','拖动太阳定位焦点').attr('aria-valuemin',-1).attr('aria-valuemax',1).attr('aria-valuenow',dragNorm);
      if(!amplified){sun.call(d3.drag().on('drag',function(ev){dragNorm=Math.max(-1,Math.min(1,(ev.x-x(0))/(x(1)-x(0))));drawAll(false);}).on('end',check));sun.on('keydown',function(ev){if(ev.key==='ArrowLeft'||ev.key==='ArrowRight'){ev.preventDefault();dragNorm=Math.max(-1,Math.min(1,dragNorm+(ev.key==='ArrowLeft'?-.01:.01)));drawAll(false);d3.select('#realSvg .sun-dot').node().focus();}else if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();check();}});}
    }
    function drawAll(animate){var d=current();document.getElementById('realTitle').textContent='真实比例轨道 · '+d.name;document.getElementById('magBadge').textContent='偏心率 ×4（显示 '+fmt(Math.min(d.e*4,.82),3)+'）';scene('#realSvg',false,animate);scene('#lensSvg',true,animate);}
    function check(){var d=current(),target=-d.e,tol=Math.max(.025,d.e*.28);if(Math.abs(dragNorm-target)<=tol){dragNorm=target;done.add(d.id);document.getElementById('feedback').className='p14-feedback ok';document.getElementById('feedback').textContent='太阳在焦点：中心—焦点连线已标出。';drawAll(false);d3.selectAll('.halo').classed('run',true);}else{dragNorm=0;document.getElementById('feedback').className='p14-feedback bad';document.getElementById('feedback').textContent='你放在了几何中心附近；太阳应在椭圆的焦点。';drawAll(false);d3.selectAll('.center-mark').classed('wrong',true);}
      d3.selectAll('.case').classed('done',function(x){return x&&done.has(x.id);});document.getElementById('progress').textContent='已体检 '+done.size+' / '+ids.length;
      if(done.size===ids.length){document.getElementById('conclusion').style.display='block';document.getElementById('reset').style.display='inline-flex';document.getElementById('feedback').style.display='none';}
    }
    document.getElementById('reset').addEventListener('click',function(){done.clear();selected='earth';dragNorm=0;document.getElementById('conclusion').style.display='none';this.style.display='none';document.getElementById('feedback').style.display='block';document.getElementById('progress').textContent='已体检 0 / '+ids.length;select(selected);});
    select(selected);drawAll(true);
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
