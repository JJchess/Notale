<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="15" data-total="32">
<div id="stage">
  <style>
    .p15-head{padding:26px 40px 14px}
    .p15-main{padding:0 40px 34px}
    .p15-plot{position:relative;overflow:hidden;padding:12px 16px 14px}
    #chart{width:100%;height:100%;min-height:0;cursor:crosshair;outline:none}
    #chart:focus-visible{box-shadow:inset 0 0 0 3px var(--focus);border-radius:var(--r-sm)}
    .p15-side{width:510px;padding:20px}
    .p15-table{width:100%;border-collapse:collapse;font-size:var(--fs-sec);line-height:1.35;font-variant-numeric:tabular-nums}
    .p15-table th{color:var(--muted);font-size:var(--fs-label);font-weight:650;text-align:right;padding:8px 7px;border-bottom:1px solid var(--line)}
    .p15-table th:first-child,.p15-table td:first-child{text-align:left}
    .p15-table td{text-align:right;padding:8px 7px;border-bottom:1px solid var(--line);transition:color 180ms ease-out,background 180ms ease-out}
    .p15-table tr.hit td{color:var(--sun-soft);background:rgba(255,200,87,.07)}
    .pred{color:var(--quiet)}
    .solved .pred{color:var(--sun);font-weight:700}
    .status{min-height:48px}
    .draw-help{position:absolute;left:84px;top:24px;z-index:2;pointer-events:none}
    .shake{animation:p15shake 180ms ease-in-out}
    @keyframes p15shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
    @media (prefers-reduced-motion:reduce){.p15-table td{transition:none}.shake{animation:none}}
  </style>
  <header class="p15-head col gap-1" style="height:112px">
    <div class="label orbit-color">COMMON ORBITS · 共同轨道规律</div>
    <div class="row items-end justify-between gap-4">
      <h1>一条线，预测八颗行星的年</h1>
      <div class="badge current" id="score" aria-live="polite">命中 0 / 8</div>
    </div>
  </header>
  <main class="p15-main row gap-4 grow min0">
    <section class="panel p15-plot grow min0 no-pan" aria-label="轨道半径与绕日周期双对数散点图">
      <div class="draw-help label muted" id="help">从左下拖向右上，让线同时靠近内、外行星</div>
      <div id="chart" tabindex="0" role="application" aria-label="拖动画出预测线。键盘按空格可画出标准趋势线。"></div>
    </section>
    <aside class="panel p15-side col gap-3 min0">
      <div class="row items-center justify-between">
        <h2>同一条线，检验八个世界</h2>
        <button class="btn" id="reset" type="button">重画</button>
      </div>
      <div class="status note" id="feedback">实际值与预测值逐行对照；允许少量近似误差。</div>
      <table class="p15-table" aria-label="八颗行星的实际周期与预测周期">
        <thead><tr><th>行星</th><th>半径 / AU</th><th>实际 / 年</th><th>预测 / 年</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </aside>
  </main>
  <section class="k-generalization" style="height:120px;padding:0 40px 28px">
    <div class="claim">八颗行星不是各走各的：只知道轨道半径，就能用同一条规律粗略预测绕日周期。</div>
    <div class="supports" style="display:none"><div class="trunk"></div><div class="support"></div></div>
  </section>
  <script src="assets/lib/echarts.min.js"></script>
  <script>
  window.addEventListener('load',function(){
    Deck.init({index:15,total:32});
    var ids=Lec.K.planetOrder;
    function body(id){return Lec.K.bodies[id];}
    function field(o,names){for(var i=0;i<names.length;i++)if(o[names[i]]!=null)return o[names[i]];}
    var planets=ids.map(function(id){
      var b=body(id), a=field(b,['semimajorAxisAU','semiMajorAxisAU','orbitAU']), d=field(b,['orbitalPeriodDays','orbitPeriodDays']);
      return {id:id,name:field(b,['nameZh','nameCN','zhName','name'])||id,a:a,actual:Lec.P.daysToYears(d),pred:Lec.P.keplerPeriodYearsApprox(a)};
    });
    function fmt(v){return Lec.P.significantFigures(v,3);}
    var tbody=document.getElementById('rows');
    planets.forEach(function(p,i){var tr=document.createElement('tr');tr.dataset.i=i;tr.innerHTML='<td>'+p.name+'</td><td class="mono">'+fmt(p.a)+'</td><td class="mono">'+fmt(p.actual)+'</td><td class="mono pred">'+fmt(p.pred)+'</td>';tbody.appendChild(tr);});
    var chartEl=document.getElementById('chart');
    var chart=echarts.init(chartEl,null,{renderer:'svg'}), reduced=Deck.reduced();
    var actual=planets.map(function(p){return {name:p.name,value:[p.a,p.actual]};});
    var standard=[]; for(var i=0;i<=48;i++){var a=.3*Math.pow(40/.3,i/48);standard.push([a,Lec.P.keplerPeriodYearsApprox(a)]);}
    var drawn=[];
    function option(){return {
      animation:!reduced,animationDuration:700,textStyle:{fontSize:16,color:'#EAF4FF'},
      grid:{left:68,right:24,top:38,bottom:58},
      xAxis:{type:'log',name:'轨道半径（AU）',min:.3,max:40,nameLocation:'middle',nameGap:40,nameTextStyle:{fontSize:14,color:'#B8C9DA'},axisLabel:{fontSize:14,color:'#B8C9DA'},axisLine:{lineStyle:{color:'#39749E'}},splitLine:{lineStyle:{color:'#18314A'}}},
      yAxis:{type:'log',name:'绕日周期（地球年）',min:.15,max:250,nameTextStyle:{fontSize:14,color:'#B8C9DA'},axisLabel:{fontSize:14,color:'#B8C9DA'},axisLine:{lineStyle:{color:'#39749E'}},splitLine:{lineStyle:{color:'#18314A'}}},
      tooltip:{trigger:'item',textStyle:{fontSize:16},formatter:function(x){return x.seriesName==='八颗行星'?x.name+'<br>半径 '+fmt(x.value[0])+' AU<br>实际 '+fmt(x.value[1])+' 年':'';}},
      series:[
        {name:'八颗行星',type:'scatter',data:actual,symbolSize:10,itemStyle:{color:'#55B9FF'},z:4},
        {name:'你的预测',type:'line',data:drawn,showSymbol:false,silent:true,lineStyle:{color:'#FFC857',width:3},z:3}
      ]
    };}
    chart.setOption(option());
    var start=null,dragging=false,locked=false;
    function inside(px){var v=chart.convertFromPixel({xAxisIndex:0,yAxisIndex:0},px);return v&&v[0]>=.3&&v[0]<=40&&v[1]>=.15&&v[1]<=250;}
    function scoreLine(a,b){
      var x1=Math.log(a[0]),y1=Math.log(a[1]),x2=Math.log(b[0]),y2=Math.log(b[1]);
      if(Math.abs(x2-x1)<.12)return 0;
      var m=(y2-y1)/(x2-x1), hit=0;
      planets.forEach(function(p,i){var yp=y1+m*(Math.log(p.a)-x1),ok=Math.abs(yp-Math.log(p.actual))<Math.log(1.45);document.querySelector('[data-i="'+i+'"]').classList.toggle('hit',ok);if(ok)hit++;});
      document.getElementById('score').textContent='命中 '+hit+' / '+planets.length; return hit;
    }
    function update(end){drawn=[start,end];chart.setOption({series:[{}, {data:drawn,lineStyle:{color:'#FFC857',width:3,type:'solid'}}]});scoreLine(start,end);}
    function solve(){locked=true;drawn=standard;chart.setOption({series:[{}, {data:standard,lineStyle:{color:'#FFC857',width:3,type:'solid'}}]});planets.forEach(function(p,i){document.querySelector('[data-i="'+i+'"]').classList.add('hit');});document.getElementById('score').textContent='命中 '+planets.length+' / '+planets.length;document.getElementById('feedback').textContent='共同规律已建立：一条预测线同时贴近八个实际值。';document.querySelector('.p15-side').classList.add('solved');document.getElementById('help').style.display='none';}
    var zr=chart.getZr();
    zr.on('mousedown',function(e){if(locked)return;var p=[e.offsetX,e.offsetY];if(inside(p)){start=chart.convertFromPixel({xAxisIndex:0,yAxisIndex:0},p);dragging=true;drawn=[];}});
    zr.on('mousemove',function(e){if(!dragging)return;var p=[e.offsetX,e.offsetY];if(inside(p))update(chart.convertFromPixel({xAxisIndex:0,yAxisIndex:0},p));});
    zr.on('mouseup',function(e){if(!dragging)return;dragging=false;var p=[e.offsetX,e.offsetY];if(!inside(p)||drawn.length<2)return;var hit=scoreLine(drawn[0],drawn[1]);if(hit>=7)solve();else{chartEl.classList.remove('shake');void chartEl.offsetWidth;chartEl.classList.add('shake');document.getElementById('feedback').textContent='这条线只贴近一端；让它同时靠近内、外行星。';}});
    chartEl.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();solve();}});
    document.getElementById('reset').addEventListener('click',function(){locked=false;start=null;drawn=[];chart.setOption({series:[{}, {data:[]}]});document.querySelectorAll('#rows tr').forEach(function(r){r.classList.remove('hit')});document.querySelector('.p15-side').classList.remove('solved');document.getElementById('score').textContent='命中 0 / '+planets.length;document.getElementById('feedback').textContent='实际值与预测值逐行对照；允许少量近似误差。';document.getElementById('help').style.display='block';chartEl.focus();});
    Deck.onResize(function(){chart.resize();});
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
