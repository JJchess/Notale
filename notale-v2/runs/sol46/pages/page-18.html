<div id="stage">
<style>
  .p18-head{height:104px;padding:24px 40px 10px;display:flex;align-items:flex-start;justify-content:space-between}
  .p18-kicker{color:var(--orbit);font:700 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.14em;margin-bottom:4px}
  .p18-claim{max-width:760px;text-align:right;color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-sec)}
  .p18-main{padding:0 40px 14px;display:grid;grid-template-columns:390px minmax(0,1fr) 390px;gap:18px;min-height:0}
  .family{position:relative;padding:14px 14px 12px;min-height:0}
  .family.rock{border-top:3px solid var(--orbit)} .family.giant{border-top:3px solid var(--sun)}
  .family-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .family-summary{font-size:var(--fs-label);line-height:1.35;color:var(--muted);text-align:right}
  .planet-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .planet{position:relative;height:130px;padding:0;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--panel-deep);cursor:pointer;color:var(--text)}
  .planet img{display:block;width:100%;height:100%;object-fit:cover;background:#02070d}
  .planet span{position:absolute;left:0;right:0;bottom:0;padding:6px 9px;background:linear-gradient(transparent,rgba(0,0,0,.92));font-size:var(--fs-label);font-weight:750;text-align:left}
  .planet:hover,.planet:focus-visible{border-color:var(--orbit-bright)} .giant .planet:hover,.giant .planet:focus-visible{border-color:var(--sun)}
  .planet.selected{border:3px solid var(--orbit);box-shadow:0 0 18px var(--orbit-glow)} .giant .planet.selected{border-color:var(--sun);box-shadow:0 0 18px var(--sun-glow)}
  .planet.seen::after{content:'•';position:absolute;right:8px;top:4px;color:var(--success);font-size:24px;text-shadow:0 1px 4px #000}
  .shake{animation:shake .18s linear 1}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .side-msg{height:23px;margin-top:7px;color:var(--sun);font-size:var(--fs-label);line-height:1.35;text-align:center}
  .radar-panel{position:relative;min-width:0;min-height:0;padding:10px 12px;overflow:hidden;background:radial-gradient(circle at 50% 43%,rgba(85,185,255,.1),transparent 52%),var(--panel)}
  #radar{width:100%;height:100%;display:block}
  #radar text{font-family:var(--font-sans);font-size:14px;fill:var(--muted)}
  .status{position:absolute;top:12px;left:12px;z-index:2}.radar-note{position:absolute;left:16px;right:16px;bottom:10px;text-align:center;color:var(--muted);font-size:var(--fs-label);line-height:1.35}
  .p18-bottom{height:246px;padding:0 40px 22px;display:flex;gap:14px;align-items:stretch}
  .p18-table{flex:1;--compare-cols:2}
  .p18-table>.hdr,.p18-table>.dim,.p18-table>.cell{padding:7px 14px}
  .p18-table>.cell{font-family:var(--font-mono);font-size:var(--fs-label)}
  .actions{width:210px;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
  .actions .btn{width:100%;margin-top:8px}.conclusion{font-size:var(--fs-sec);line-height:var(--lh-sec);color:var(--muted)}
  .conclusion strong{display:block;color:var(--sun);font-size:var(--fs-lead);margin-bottom:4px}
  @media (prefers-reduced-motion:reduce){.shake{animation:none!important}*{transition:none!important}}
</style>
<header class="p18-head">
  <div><div class="p18-kicker">WORLD FAMILIES · 18</div><h1>两类行星，两组属性</h1></div>
  <div class="p18-claim">八颗行星不是八种互不相干的组合，<br>而是明显聚成两个属性家族。</div>
</header>
<main class="p18-main grow min0">
  <section class="family rock panel min0" aria-labelledby="rock-title">
    <div class="family-title"><h2 id="rock-title">岩石行星</h2><div class="family-summary">较小 · 高密度<br>有固体表面 · 卫星少</div></div>
    <div class="planet-list" id="rock-list"></div><div class="side-msg" id="rock-msg" aria-live="polite"></div>
  </section>
  <section class="radar-panel panel min0" aria-label="四维属性雷达比较">
    <div class="badge status" id="status">已选 0/2</div>
    <svg id="radar" role="img" aria-label="大小、密度、固体表面和卫星系统四轴雷达"></svg>
    <div class="radar-note">从左右各选一颗；雷达面积只作模式提示，请同时读下方原始值。</div>
  </section>
  <section class="family giant panel min0" aria-labelledby="giant-title">
    <div class="family-title"><h2 id="giant-title">巨行星</h2><div class="family-summary">较大 · 低密度<br>无固体表面 · 卫星丰富</div></div>
    <div class="planet-list" id="giant-list"></div><div class="side-msg" id="giant-msg" aria-live="polite"></div>
  </section>
</main>
<section class="p18-bottom">
  <div class="k-comparison p18-table min0" id="compare-table">
    <div class="hdr">共同维度</div><div class="hdr orbit-color" id="rock-hdr">岩石行星 — 待选</div><div class="hdr accent" id="giant-hdr">巨行星 — 待选</div>
    <div class="dim">大小（直径）</div><div class="cell" id="r-size">—</div><div class="cell diff" id="g-size">—</div><div class="rowline"></div>
    <div class="dim">密度</div><div class="cell diff" id="r-density">—</div><div class="cell" id="g-density">—</div><div class="rowline"></div>
    <div class="dim">可站立的固体表面</div><div class="cell diff" id="r-surface">—</div><div class="cell" id="g-surface">—</div><div class="rowline"></div>
    <div class="dim">已知卫星</div><div class="cell" id="r-moons">—</div><div class="cell diff" id="g-moons">—</div>
  </div>
  <aside class="actions panel">
    <div class="conclusion" id="conclusion"><strong>差异成组出现</strong>这里先看见差异；原因留到接下来的形成与演化。</div>
    <div><button class="btn primary" id="change" type="button">换一组</button><button class="btn" id="reset" type="button">重置</button></div>
  </aside>
</section>
