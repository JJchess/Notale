<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="20" data-total="32">
<div id="stage">
  <style>
    .p20-head{padding:28px 54px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
    .p20-kicker{color:var(--orbit);font:700 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.14em;margin-bottom:5px}
    .p20-claim{max-width:760px;color:var(--sun-soft);font-size:var(--fs-lead);line-height:1.45;text-align:right}
    .p20-main{position:relative;margin:0 54px 14px;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-lg);background:linear-gradient(90deg,rgba(255,200,87,.12),rgba(85,185,255,.08) 72%,rgba(13,27,45,.96));box-shadow:0 18px 46px var(--shadow)}
    .p20-main:before{content:"";position:absolute;left:22px;top:70px;width:105px;height:105px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--sun-soft),var(--sun) 42%,rgba(255,200,87,.12) 70%,transparent 72%);box-shadow:0 0 55px var(--sun-glow)}
    .p20-axis{position:absolute;left:116px;right:28px;top:55px;height:2px;background:linear-gradient(90deg,var(--sun),var(--orbit));opacity:.8}
    .p20-axis:after{content:"距离太阳更远 · 温度通常更低 →";position:absolute;right:0;top:-28px;color:var(--muted);font-size:var(--fs-label);font-weight:650}
    .p20-canvas{position:absolute;left:50%;top:50%;width:960px;height:540px;transform:translate(-50%,-48%)}
    #material-sort{position:absolute;inset:0}
    .p20-progress{position:absolute;left:50%;top:13px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:7px 14px;border:1px solid var(--line-strong);border-radius:999px;background:var(--panel-deep);font-size:var(--fs-label);font-weight:700}
    .dots{display:flex;gap:6px}.dot{width:9px;height:9px;border:1px solid var(--orbit);border-radius:50%}.dot.on{background:var(--sun);border-color:var(--sun)}
    .p20-basis{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);color:var(--muted);font-size:var(--fs-sec)}
    .p20-feedback{position:absolute;left:50%;top:69px;transform:translateX(-50%);min-width:460px;text-align:center;color:var(--sun-soft);font-size:var(--fs-sec);font-weight:650}
    .p20-reset{position:absolute;right:18px;bottom:10px;display:none}.p20-reset.show{display:block}
    .p20-foot{padding:0 54px 22px;display:flex;align-items:center;justify-content:space-between;gap:28px}
    .p20-foot .note{max-width:750px}.p20-foot strong{color:var(--text)}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
  <header class="p20-head" style="height:108px">
    <div><div class="p20-kicker">MATERIAL SORT</div><h1>冷下来，能留下什么？</h1></div>
    <div class="p20-claim">低温不是把岩石换成冰，而是让可成为固体的材料种类增加。</div>
  </header>
  <main class="p20-main grow min0 no-pan" aria-label="材料凝结分类互动">
    <div class="p20-axis"></div>
    <div class="p20-canvas k-classification">
      <div id="material-sort" tabindex="0" role="application" aria-label="材料卡分类区。按数字键选择材料，再按 H 放入高温区或按 L 放入低温区。"></div>
      <div class="p20-progress"><span id="count">已判断 0 / 8</span><span class="dots" id="dots"></span></div>
      <div class="p20-feedback" id="feedback" aria-live="polite">拖动材料卡，判断它在哪个区域能成为固体。</div>
      <div class="p20-basis">分类依据：能否在当地温度下成为固体</div>
      <button class="btn p20-reset" id="reset">重置卡组</button>
    </div>
  </main>
  <footer class="p20-foot" style="height:76px">
    <div class="note"><strong>高温区：</strong>主要留下金属、岩石等耐高温固体。</div>
    <div class="note"><strong>挥发物不等于消失：</strong>高温时多以气体存在，更冷处才可形成冰。</div>
  </footer>
  <script src="assets/lib/konva.min.js"></script>
  <script>
  window.addEventListener('DOMContentLoaded',()=>{
    Deck.init({index:20,total:32});
    const materials=[
      {n:'金属颗粒',t:'耐高温固体',both:true},{n:'岩石颗粒',t:'耐高温固体',both:true},
      {n:'硅酸盐尘埃',t:'耐高温固体',both:true},{n:'耐热氧化物',t:'耐高温固体',both:true},
      {n:'水',t:'挥发物',both:false},{n:'二氧化碳',t:'挥发物',both:false},
      {n:'氨',t:'挥发物',both:false},{n:'甲烷',t:'挥发物',both:false}
    ];
    const total=materials.length, stage=new Konva.Stage({container:'material-sort',width:960,height:540});
    const layer=new Konva.Layer(); stage.add(layer);
    const zones={high:{x:40,y:110,width:410,height:300},low:{x:510,y:110,width:410,height:300}};
    function zone(key,title,sub,stroke){
      const z=zones[key]; const g=new Konva.Group({name:'zone-'+key});
      g.add(new Konva.Rect({x:z.x,y:z.y,width:z.width,height:z.height,cornerRadius:12,fill:'rgba(13,27,45,.78)',stroke,strokeWidth:2}));
      g.add(new Konva.Text({x:z.x+18,y:z.y+14,width:z.width-36,text:title,fontFamily:'sans-serif',fontSize:22,fontStyle:'bold',fill:'#EAF4FF'}));
      g.add(new Konva.Text({x:z.x+18,y:z.y+46,width:z.width-36,text:sub,fontFamily:'sans-serif',fontSize:16,fill:'#A8BED1'}));
      if(key==='low'){
        g.add(new Konva.Text({x:z.x+20,y:z.y+84,text:'耐高温固体',fontSize:14,fontStyle:'bold',fill:'#8FD2FF'}));
        g.add(new Konva.Text({x:z.x+220,y:z.y+84,text:'冰与挥发物',fontSize:14,fontStyle:'bold',fill:'#FFC857'}));
        g.add(new Konva.Line({points:[z.x+202,z.y+82,z.x+202,z.y+278],stroke:'#24425F',strokeWidth:1}));
      }
      layer.add(g);
    }
    zone('high','靠近太阳的高温区','固体原料较少','#FFC857');
    zone('low','更远的低温区','岩石、金属仍在，另增多种冰','#55B9FF');
    const cards=[], placed=new Set();
    materials.forEach((m,i)=>{
      const x=54+(i%4)*224,y=430+Math.floor(i/4)*50;
      const g=new Konva.Group({x,y,draggable:true}); g.home={x,y}; g.mat=m;
      g.add(new Konva.Rect({width:204,height:40,cornerRadius:12,fill:'#11243A',stroke:'#39749E',strokeWidth:1.5,shadowColor:'#000',shadowBlur:8,shadowOpacity:.3}));
      g.add(new Konva.Text({x:12,y:7,width:116,text:m.n,fontFamily:'sans-serif',fontSize:16,fontStyle:'bold',fill:'#EAF4FF'}));
      g.add(new Konva.Text({x:127,y:10,width:68,align:'right',text:m.t,fontFamily:'sans-serif',fontSize:14,fill:m.both?'#8FD2FF':'#FFE09A'}));
      g.on('dragend',()=>judge(g)); cards.push(g); layer.add(g);
    });
    function inside(p,z){return p.x+102>z.x&&p.x+102<z.x+z.width&&p.y+20>z.y&&p.y+20<z.y+z.height}
    function judge(g,key){
      if(placed.has(g))return;
      key=key||(inside(g.position(),zones.high)?'high':inside(g.position(),zones.low)?'low':null);
      const ok=key==='low'||(key==='high'&&g.mat.both);
      if(!key){g.to({...g.home,duration:.18});return}
      if(!ok){document.querySelector('#feedback').textContent='这里太热，它主要仍是气体；试试更冷的区域。';g.to({x:g.home.x+10,duration:.06,onFinish:()=>g.to({x:g.home.x-10,duration:.06,onFinish:()=>g.to({...g.home,duration:.06})})});return}
      placed.add(g);g.zone=key;g.draggable(false);
      const col=key==='high'?0:(g.mat.both?0:1);
      const slot=cards.filter(c=>placed.has(c)&&c.zone===key&&(key==='high'||c.mat.both===g.mat.both)).length-1;
      const z=zones[key],tx=z.x+18+col*202,ty=z.y+114+(slot%4)*43;
      g.to({x:tx,y:ty,duration:Deck.reduced()?0:.18,easing:Konva.Easings.EaseOut});g.findOne('Rect').stroke('#FFC857');update();
    }
    function update(){
      document.querySelector('#count').textContent=`已判断 ${placed.size} / ${total}`;
      [...document.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('on',i<placed.size));
      if(placed.size===total){document.querySelector('#feedback').textContent=`完成：低温区在耐高温固体之外，新增 ${materials.filter(m=>!m.both).length} 类冰。`;document.querySelector('#reset').classList.add('show');}
      else document.querySelector('#feedback').textContent='正确：这类材料能在该区域成为固体。';
    }
    document.querySelector('#dots').innerHTML=materials.map(()=>'<span class="dot"></span>').join('');
    let keyboardCard=0;
    document.querySelector('#material-sort').addEventListener('keydown',e=>{
      const digit=Number(e.key);
      if(digit>=1&&digit<=total){keyboardCard=digit-1;document.querySelector('#feedback').textContent=`已选择：${materials[keyboardCard].n}。按 H 或 L 分类。`;return}
      const k=e.key.toLowerCase();if(k==='h'||k==='l'){e.preventDefault();judge(cards[keyboardCard],k==='h'?'high':'low')}
    });
    document.querySelector('#reset').onclick=()=>{placed.clear();cards.forEach(g=>{g.draggable(true);g.zone=null;g.position(g.home);g.findOne('Rect').stroke('#39749E')});document.querySelector('#reset').classList.remove('show');document.querySelector('#feedback').textContent='拖动材料卡，判断它在哪个区域能成为固体。';update();layer.draw()};
    layer.draw();
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
