<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="21" data-total="32">
<div id="stage">
  <style>
    .p21-head{height:82px;padding:22px 32px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
    .p21-head p{margin:0;max-width:620px;text-align:right}
    .p21-chain{height:84px;margin:0 32px 12px;--process-cols:5;gap:34px}
    .p21-chain>.step{padding:10px 12px;text-align:center;display:grid;place-items:center;font-size:var(--fs-label);font-weight:700}
    .p21-chain>.arw{right:-27px}
    .game{position:relative;flex:1;min-height:620px;margin:0 32px 24px;border:1px solid var(--line-strong);border-radius:var(--r-lg);background:var(--panel-deep);overflow:hidden;box-shadow:0 18px 44px var(--shadow)}
    .game canvas{cursor:grab}.game canvas:active{cursor:grabbing}
    .hud{position:absolute;inset:16px 18px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
    .hud-group{display:flex;gap:10px;align-items:center}.hud .badge,.hud .readout{background:rgba(9,22,37,.92)}
    .lane-label{position:absolute;left:24px;padding:6px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line-strong);font-size:var(--fs-label);font-weight:750}
    .lane-label.rich{top:315px}.lane-label.sparse{top:112px}
    .lane-label span{display:block;color:var(--muted);font-size:var(--fs-label);font-weight:600}
    .threshold{position:absolute;right:24px;top:226px;width:138px;text-align:center;color:var(--sun);font-size:var(--fs-label);font-weight:750;pointer-events:none}
    .threshold:before{content:"";display:block;height:82px;border:2px dashed var(--sun);border-radius:50%;margin:0 auto 6px;width:82px;box-shadow:0 0 20px var(--sun-glow)}
    .bottom{position:absolute;left:18px;right:18px;bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .bottom .note{max-width:800px;margin:0;background:rgba(9,22,37,.9);padding:8px 12px;border-radius:var(--r-sm)}
    .status{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);min-width:480px;text-align:center;background:rgba(13,27,45,.94);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 14px;font-size:var(--fs-sec);line-height:var(--lh-sec)}
    .game:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
  <header class="p21-head min0">
    <div><div class="badge">WORLD BUILDING · 21</div><h1>核心长大之后，才抓得住气体</h1></div>
    <p class="lead muted">拖动当前核心收集固体；也可用方向键移动。</p>
  </header>
  <section class="k-process p21-chain min0" aria-label="核心增长的因果链">
    <div class="axis"></div>
    <div class="step current">局部固体丰度<span class="arw"></span></div>
    <div class="step">碰撞机会<span class="arw"></span></div>
    <div class="step">核心增长速度<span class="arw"></span></div>
    <div class="step">达到捕气阈值<span class="arw"></span></div>
    <div class="step">气体捕获</div>
  </section>
  <main id="game" class="game min0 no-pan" tabindex="0" role="application" aria-label="行星核心成长赛。拖动核心收集固体，方向键也可移动。">
    <canvas id="cv" class="cv-fill" aria-hidden="true"></canvas>
    <div class="hud">
      <div class="hud-group"><span id="round" class="badge current">第 1 / 2 轮</span><span class="badge">气体背景相同</span></div>
      <div class="hud-group"><span class="readout"><span id="time">20.0</span><span class="unit">s 剩余</span></span><span class="readout"><span id="mass">1 / 8</span><span class="unit">核心质量（模型单位）</span></span><span class="readout"><span id="hits">0 / 6</span><span class="unit">碰撞计数</span></span></div>
    </div>
    <div class="lane-label sparse">稀疏区<span>同样的初始核心 · 6 块固体</span></div>
    <div class="lane-label rich">固体丰富区<span>同样的初始核心 · 12 块固体</span></div>
    <div class="threshold">捕气阈值 8</div>
    <div id="status" class="status" aria-live="polite">先在稀疏区收集；两轮使用同一条时间轴。</div>
    <div class="bottom"><p class="note">局部固体越丰富，核心越可能更快长大；跨过捕气条件后，增长路径会明显分叉。阈值与质量均为教学模型单位。这是简化模型，并非形成史的唯一版本。</p><button id="reset" class="btn primary" type="button">用同一种子重赛</button></div>
  </main>
  <script src="assets/lib/matter.min.js"></script>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script>
  window.addEventListener('DOMContentLoaded',function(){
    var M=Matter, cv=document.getElementById('cv'), box=document.getElementById('game');
    var engine, cores, pieces, state, drag=null, ctx, stopLoop;
    var duration=20, threshold=8, counts=[6,12], step=1000/60;
    function fresh(){return {round:0,elapsed:0,hits:[0,0],mass:[1,1],done:false,thresholdAt:[null,null],last:performance.now(),acc:0};}
    function setup(){
      if(stopLoop)stopLoop();
      engine=M.Engine.create({gravity:{x:0,y:0.18,scale:0.001}}); state=fresh(); cores=[]; pieces=[];
      var rng=new Math.seedrandom('p21-core-growth-v1'), w=box.clientWidth,h=box.clientHeight;
      [0,1].forEach(function(lane){
        var y=lane?385:185;
        var core=M.Bodies.circle(w*.47,y,24,{isStatic:true,isSensor:true,label:'core'+lane}); cores.push(core);
        for(var i=0;i<counts[lane];i++){
          var p=M.Bodies.polygon(210+rng()*(w-470),y-55+rng()*110,4,10+rng()*5,{restitution:.15,friction:.08,frictionAir:.025,label:'piece'+lane});
          M.Body.setVelocity(p,{x:(rng()-.5)*.7,y:(rng()-.5)*.25}); p.lane=lane;p.collected=false; pieces.push(p);
        }
      });
      M.Composite.add(engine.world,cores.concat(pieces)); updateHud(); draw();
      stopLoop=Deck.loop(tick,{still:duration*1000});
    }
    function collect(p,lane){
      if(p.collected||lane!==state.round||state.done)return;
      p.collected=true; state.hits[lane]++;state.mass[lane]++;
      M.Composite.remove(engine.world,p);
      if(state.mass[lane]>=threshold&&state.thresholdAt[lane]===null){state.thresholdAt[lane]=state.elapsed;document.getElementById('status').textContent='已跨过阈值：气体开始向核心汇聚。';}
      updateHud();
    }
    function tick(t,dt){
      if(state.done){draw();return}
      state.acc+=Math.min(dt,50); while(state.acc>=step){M.Engine.update(engine,step);state.acc-=step}
      state.elapsed+=dt/1000;
      var lane=state.round,c=cores[lane];
      pieces.forEach(function(p){if(!p.collected&&p.lane===lane){var dx=p.position.x-c.position.x,dy=p.position.y-c.position.y;if(dx*dx+dy*dy<1600)collect(p,lane)}});
      if(state.elapsed>=duration){
        if(state.round===0){state.round=1;state.elapsed=0;document.getElementById('status').textContent='第 2 轮：固体更多，比较达到阈值所需时间。';}
        else{state.done=true;document.getElementById('status').textContent=state.thresholdAt[1]!==null?'丰富区先跨过阈值，固体 → 增长 → 捕气。':'两轮结束；重赛并主动追赶更多固体。';}
      }
      updateHud();draw();
    }
    function updateHud(){var r=state.round;document.getElementById('round').textContent='第 '+(r+1)+' / 2 轮';document.getElementById('time').textContent=Math.max(0,duration-state.elapsed).toFixed(1);document.getElementById('mass').textContent=state.mass[r]+' / '+threshold;document.getElementById('hits').textContent=state.hits[r]+' / '+counts[r];}
    function draw(){ctx=Deck.fit(cv);var w=cv.offsetWidth,h=cv.offsetHeight;ctx.clearRect(0,0,w,h);
      var orbit=Deck.rgb('--orbit'),sun=Deck.rgb('--sun'),muted=Deck.rgb('--muted');
      ctx.lineWidth=2;[185,385].forEach(function(y,i){ctx.strokeStyle='rgba('+orbit.join(',')+','+(state.round===i?.8:.28)+')';ctx.beginPath();ctx.moveTo(150,y);ctx.lineTo(w-130,y);ctx.stroke()});
      pieces.forEach(function(p){if(p.collected)return;ctx.save();ctx.translate(p.position.x,p.position.y);ctx.rotate(p.angle);ctx.fillStyle='rgba('+orbit.join(',')+',.85)';ctx.fillRect(-11,-9,22,18);ctx.restore()});
      cores.forEach(function(c,i){var rad=24+state.hits[i]*2.2;ctx.beginPath();ctx.arc(c.position.x,c.position.y,rad,0,Math.PI*2);ctx.fillStyle=i===state.round?'rgb('+sun.join(',')+')':'rgb('+muted.join(',')+')';ctx.fill();if(state.mass[i]>=threshold){ctx.beginPath();ctx.arc(c.position.x,c.position.y,rad+18,0,Math.PI*2);ctx.strokeStyle='rgba('+sun.join(',')+',.72)';ctx.lineWidth=9;ctx.stroke()}});
    }
    function moveTo(x,y){if(state.done)return;var lane=state.round,minY=lane?320:120,maxY=lane?450:250,w=box.clientWidth;if(x<150||x>w-150||y<minY||y>maxY){document.getElementById('status').textContent='核心只能在自己的材料区内移动。';return}M.Body.setPosition(cores[lane],{x:x,y:y});draw()}
    cv.addEventListener('pointerdown',function(e){drag=e.pointerId;cv.setPointerCapture(drag);var p=Deck.pt(cv,e);moveTo(p.x,p.y)});
    cv.addEventListener('pointermove',function(e){if(e.pointerId===drag){var p=Deck.pt(cv,e);moveTo(p.x,p.y)}});cv.addEventListener('pointerup',function(){drag=null});
    box.addEventListener('keydown',function(e){var keys={ArrowLeft:[-18,0],ArrowRight:[18,0],ArrowUp:[0,-18],ArrowDown:[0,18]};if(keys[e.key]){e.preventDefault();var c=cores[state.round];moveTo(c.position.x+keys[e.key][0],c.position.y+keys[e.key][1])}});
    document.getElementById('reset').addEventListener('click',setup);Deck.onResize(setup);setup();Deck.init({index:21,total:32});
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
