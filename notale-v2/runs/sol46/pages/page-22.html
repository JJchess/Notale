<div id="stage">
  <style>
    .hero-shell{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-lg);background:radial-gradient(circle at 42% 45%,rgba(85,185,255,.12),transparent 36%),var(--panel-deep)}
    .hero-shell canvas{display:block;width:100%;height:100%}
    .photo-proof{position:absolute;right:24px;top:22px;width:190px;height:150px;box-shadow:0 14px 34px var(--shadow)}
    .photo-proof img{position:absolute;inset:0}.photo-proof:after{content:"";position:absolute;left:0;bottom:16px;width:1px;border-top:2px solid var(--orbit)}
    .photo-caption{position:absolute;left:10px;right:10px;bottom:8px;padding:5px 8px;border-radius:var(--r-sm);background:rgba(7,17,31,.8);font-size:var(--fs-label);font-weight:650;line-height:1.35}
    .layer-tag{position:absolute;left:72%;top:56%;max-width:245px;padding:9px 13px;border:1px solid var(--sun);border-radius:var(--r-sm);background:rgba(7,17,31,.9);color:var(--sun);font-size:var(--fs-label);font-weight:750;line-height:1.35;box-shadow:0 0 22px var(--sun-glow)}
    .layer-tag:before{content:"";position:absolute;right:100%;top:50%;width:70px;border-top:2px solid var(--sun)}
    .progress-dots{display:flex;gap:8px}.progress-dots i{width:13px;height:13px;border:2px solid var(--orbit);border-radius:50%;background:var(--panel-deep)}.progress-dots i.on{border-color:var(--sun);background:var(--sun);box-shadow:0 0 10px var(--sun-glow)}
    .layer-ledger{--enum-cols:5}.layer-ledger>.it{padding:12px 14px;border-top-width:3px;transition:border-color .2s,background .2s,transform .2s}.layer-ledger>.it.current{transform:translateY(-3px);background:var(--panel-raised)}
    .layer-ledger .it-title{margin-bottom:5px;font-size:var(--fs-sec)}.field{display:flex;gap:6px;font-size:var(--fs-label);line-height:1.35}.field b{color:var(--quiet);font-weight:650}.field span{color:var(--muted)}
    .planet-tags{display:flex;gap:12px}.planet-tags .badge{border-radius:var(--r-sm)}
    input[type=range]{accent-color:var(--sun)}
    @media(prefers-reduced-motion:reduce){.layer-ledger>.it{transition:none}}
  </style>

        <span class="badge">木星 · 外层氢氦 · 金属氢区显著 · 核心可能弥散</span>
        <span class="badge">土星 · 外层氢氦 · 深部高度压缩 · 分层细节不同</span>
      </div>
      <p id="take" class="lead" style="margin:0;max-width:660px;text-align:right">“气态”描述主要成分，不表示整颗都是常温常压的气体。</p>

  <script src="assets/lib/three.min.js"></script>
  <script>
  window.addEventListener('DOMContentLoaded',function(){
    Deck.init({index:22,total:32});
    const layers=[
      {name:'云顶与天气层',place:'最外侧薄层',state:'气体、云粒与风暴',seen:'望远镜可见',key:'条纹和大红斑只是外观'},
      {name:'分子氢氦层',place:'云顶以下',state:'被压缩的氢氦流体',seen:'不可直接看见',key:'已不是日常空气般稀薄'},
      {name:'深部过渡区',place:'更深处',state:'更热、更密的导电流体',seen:'依靠模型推断',key:'层间不是清晰壳壁'},
      {name:'金属氢区域',place:'深部主体',state:'高压下呈金属性的氢',seen:'由重力场与磁场约束',key:'与强磁场形成有关'},
      {name:'核心区域',place:'中央附近',state:'重元素富集物',seen:'结构仍有不确定性',key:'不是可站立的固体表面'}
    ];
    const ledger=document.getElementById('ledger'),dots=document.getElementById('dots');
    layers.forEach((d,i)=>{
      const item=document.createElement('article'); item.className='it';
      item.innerHTML='<div class="it-title">'+(i+1)+' · '+d.name+'</div><div class="field"><b>位置</b><span>'+d.place+'</span></div><div class="field"><b>状态</b><span>'+d.state+'</span></div><div class="field"><b>可见</b><span>'+d.seen+'</span></div><div class="field"><b>认识</b><span>'+d.key+'</span></div>';
      ledger.appendChild(item); dots.appendChild(document.createElement('i'));
    });
    const slider=document.getElementById('depth'),tag=document.getElementById('layerTag'),count=document.getElementById('count'),reset=document.getElementById('reset');
    slider.min=0; slider.max=layers.length-1; slider.step=1; slider.value=0;
    const canvas=document.getElementById('globe');
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
    renderer.setClearColor(0x07111F,0); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.08;
    const scene=new THREE.Scene(); const camera=new THREE.PerspectiveCamera(35,1,.1,100); camera.position.set(0,0,6);
    scene.add(new THREE.AmbientLight(0x557799,1));
    const key=new THREE.DirectionalLight(0xFFC857,2.2); key.position.set(3,2,4); scene.add(key);
    const rim=new THREE.DirectionalLight(0x55B9FF,1.2); rim.position.set(-3,1,-2); scene.add(rim);
    const group=new THREE.Group(); group.position.x=-.35; group.rotation.set(-.16,-.35,.08); scene.add(group);
    const radii=[1.72,1.48,1.20,.90,.57], colors=[0xC89A72,0xD5B080,0x55B9FF,0xDFC15A,0xB48B72], meshes=[];
    radii.forEach((r,i)=>{
      const geom=new THREE.SphereGeometry(r,96,64,THREE.MathUtils.degToRad(55),THREE.MathUtils.degToRad(250));
      const mat=new THREE.MeshStandardMaterial({color:colors[i],roughness:.56,metalness:i===3?.42:.08,side:THREE.DoubleSide,transparent:true,opacity:i===0?.92:.97,emissive:i===3?0x513900:0x07111F,emissiveIntensity:.18});
      const m=new THREE.Mesh(geom,mat); group.add(m); meshes.push(m);
      const cut=new THREE.Mesh(new THREE.RingGeometry(i===layers.length-1?0:radii[i+1],r,96,1,THREE.MathUtils.degToRad(-55),THREE.MathUtils.degToRad(110)),new THREE.MeshBasicMaterial({color:i===0?0xFFC857:colors[i],side:THREE.DoubleSide,transparent:true,opacity:.88}));
      cut.rotation.y=Math.PI/2; cut.rotation.z=Math.PI; group.add(cut); m.userData.cut=cut;
    });
    const reduced=Deck.reduced(); let current=0,furthest=0,stop=null;
    function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.render(scene,camera)}
    function update(){current=Number(slider.value); furthest=Math.max(furthest,current); const d=layers[current];
      meshes.forEach((m,i)=>{m.visible=i>=current;m.userData.cut.visible=i>=current;m.userData.cut.material.color.setHex(i===current?0xFFC857:colors[i]);});
      [...ledger.children].forEach((el,i)=>el.classList.toggle('current',i===current)); [...dots.children].forEach((el,i)=>el.classList.toggle('on',i<=furthest));
      tag.textContent=d.name+'｜'+d.state; count.textContent='已识别 '+(furthest+1)+' / '+layers.length+' 层';
      const done=furthest===layers.length-1; reset.hidden=!done; document.getElementById('take').textContent=done?'向内加深，氢氦进入高压流体与金属氢区域；中心还有重元素富集区。':'“气态”描述主要成分，不表示整颗都是常温常压的气体。';
      renderer.render(scene,camera);
    }
    slider.addEventListener('input',update); reset.addEventListener('click',()=>{furthest=0;slider.value=0;update();slider.focus()});
    Deck.onResize(resize); resize(); update();
    stop=Deck.loop((t,dt)=>{if(!reduced){group.rotation.y+=dt*.00008;}renderer.render(scene,camera)},{still:0});
    window.addEventListener('pagehide',()=>{if(stop)stop();meshes.forEach(m=>{m.geometry.dispose();m.material.dispose();m.userData.cut.geometry.dispose();m.userData.cut.material.dispose()});renderer.dispose()},{once:true});
  });
  </script>
