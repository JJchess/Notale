<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="23" data-total="32">
<div id="stage">
  <style>
    .ledger-head{height:126px;padding:26px 42px 12px;box-sizing:border-box;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
    .kicker{font:700 var(--fs-label)/1.3 var(--font-mono);letter-spacing:.14em;color:var(--orbit)}
    .status{min-width:166px;text-align:right}
    .progress{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}.progress i{width:42px;height:4px;background:var(--line);border-radius:4px}.progress i.on{background:var(--sun);box-shadow:0 0 12px var(--sun-glow)}
    .workspace{padding:14px 42px 24px;box-sizing:border-box;position:relative;overflow:hidden}
    .sun-edge{position:absolute;left:0;top:20px;width:86px;height:560px;border-radius:50%;background:radial-gradient(circle at 70% 50%,var(--sun-soft),var(--sun) 38%,rgba(255,200,87,.16) 70%,transparent 72%);filter:drop-shadow(0 0 24px var(--sun-glow));pointer-events:none}
    .light-band{position:absolute;left:55px;right:42px;top:72px;height:110px;background:linear-gradient(90deg,rgba(255,200,87,.16),rgba(255,200,87,.03),transparent);clip-path:polygon(0 40%,100% 0,100% 100%,0 60%);pointer-events:none}
    .controls{height:58px;margin-left:68px}.stamp{position:relative;transition:transform 180ms ease-out,box-shadow 220ms ease-out,opacity 220ms}.stamp.locked{opacity:.58;border-style:dashed}.stamp.booked{border-color:var(--sun);color:var(--sun);background:rgba(255,200,87,.10)}.stamp.hit{animation:press .34s ease-out}.stamp.shake{animation:shake .32s ease-out}.msg{min-width:420px;color:var(--danger)}
    @keyframes press{45%{transform:scale(.94)}100%{transform:scale(1)}}@keyframes shake{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
    .ledger{margin-left:68px;--compare-cols:3;grid-template-columns:190px repeat(3,minmax(0,1fr));box-shadow:0 16px 38px var(--shadow)}
    .ledger>.hdr,.ledger>.dim,.ledger>.cell{padding:8px 16px}.ledger>.hdr{padding-top:10px;padding-bottom:10px}.ledger .planet{font-size:var(--fs-h2);color:var(--text)}
    .planet-dot{display:inline-block;width:14px;height:14px;border:2px solid var(--orbit);border-radius:50%;margin-right:9px;vertical-align:-1px;box-shadow:0 0 10px var(--orbit-glow)}
    .stage-row{transition:opacity 240ms ease-out,background 240ms}.stage-row.hidden{opacity:.18}.stage-row.active{background:rgba(85,185,255,.035)}
    .chart-panel{margin-left:68px;padding:10px 16px 8px;min-height:0;position:relative}.chart-title{height:30px}.chart{height:180px;width:100%}
    .legendline{height:30px;gap:24px}.legendline span{white-space:nowrap}.blue-dot,.gold-dia,.thin-line{display:inline-block;margin-right:7px;vertical-align:1px}.blue-dot{width:10px;height:10px;border-radius:50%;background:var(--orbit)}.gold-dia{width:10px;height:10px;background:var(--sun);transform:rotate(45deg)}.thin-line{width:24px;height:2px;background:var(--sun)}
    .conclusion{margin-left:68px;border-left:5px solid var(--sun);background:linear-gradient(90deg,rgba(255,200,87,.13),transparent);padding:9px 16px;opacity:0;transform:translateY(12px);transition:opacity 320ms ease-out,transform 320ms ease-out}.conclusion.show{opacity:1;transform:none}
    @media(prefers-reduced-motion:reduce){.stamp,.stage-row,.conclusion{transition:none!important;animation:none!important}.light-band{display:none}}
  </style>
  <header class="ledger-head row items-center justify-between min0">
    <div class="min0">
      <div class="kicker">ENERGY LEDGER · 23</div>
      <h1>温度不只看远近</h1>
      <div class="lead muted">离太阳近通常获得更多日照，但不直接等于表面更热。</div>
    </div>
    <div class="status min0"><span id="count" class="badge current" aria-live="polite">已入账 1/3</span><div class="progress" aria-hidden="true"><i class="on"></i><i></i><i></i></div></div>
  </header>
  <main class="workspace grow col gap-2 min0">
    <div class="sun-edge" aria-hidden="true"></div><div class="light-band" aria-hidden="true"></div>
    <div class="controls row items-center gap-2 min0">
      <button class="btn stamp booked" data-step="1" aria-pressed="true">① 日距入账</button>
      <button class="btn stamp locked" data-step="2" aria-pressed="false">② 反照率入账</button>
      <button class="btn stamp locked" data-step="3" aria-pressed="false">③ 大气入账</button>
      <button id="reset" class="btn">重置能量账</button>
      <span id="msg" class="sec msg" aria-live="polite">先横向比较日距与收到的日照。</span>
    </div>
    <section id="ledger" class="k-comparison ledger min0" aria-label="金星、地球和火星能量账比较表">
      <div class="hdr">输入与结果</div><div class="hdr planet"><span class="planet-dot"></span>金星</div><div class="hdr planet"><span class="planet-dot"></span>地球</div><div class="hdr planet"><span class="planet-dot"></span>火星</div>
      <div class="dim stage-row s1">日距</div><div class="cell mono stage-row s1" data-key="distance" data-id="venus"></div><div class="cell mono stage-row s1" data-key="distance" data-id="earth"></div><div class="cell mono stage-row s1" data-key="distance" data-id="mars"></div>
      <div class="dim stage-row s1">日照 / 地球</div><div class="cell mono stage-row s1" data-key="flux" data-id="venus"></div><div class="cell mono stage-row s1" data-key="flux" data-id="earth"></div><div class="cell mono stage-row s1" data-key="flux" data-id="mars"></div>
      <div class="rowline"></div>
      <div class="dim stage-row s2 hidden">反照率</div><div class="cell mono stage-row s2 hidden" data-key="albedo" data-id="venus"></div><div class="cell mono stage-row s2 hidden" data-key="albedo" data-id="earth"></div><div class="cell mono stage-row s2 hidden" data-key="albedo" data-id="mars"></div>
      <div class="dim stage-row s2 hidden">吸收比例</div><div class="cell mono stage-row s2 hidden" data-key="absorb" data-id="venus"></div><div class="cell mono stage-row s2 hidden" data-key="absorb" data-id="earth"></div><div class="cell mono stage-row s2 hidden" data-key="absorb" data-id="mars"></div>
      <div class="dim stage-row s2 hidden">平衡温度</div><div class="cell mono stage-row s2 hidden" data-key="eq" data-id="venus"></div><div class="cell mono stage-row s2 hidden" data-key="eq" data-id="earth"></div><div class="cell mono stage-row s2 hidden" data-key="eq" data-id="mars"></div>
      <div class="rowline"></div>
      <div class="dim stage-row s3 hidden">平均表面温度</div><div class="cell mono stage-row s3 hidden diff" data-key="surface" data-id="venus"></div><div class="cell mono stage-row s3 hidden" data-key="surface" data-id="earth"></div><div class="cell mono stage-row s3 hidden" data-key="surface" data-id="mars"></div>
      <div class="dim stage-row s3 hidden">温室增温差额</div><div class="cell mono stage-row s3 hidden diff" data-key="warm" data-id="venus"></div><div class="cell mono stage-row s3 hidden" data-key="warm" data-id="earth"></div><div class="cell mono stage-row s3 hidden" data-key="warm" data-id="mars"></div>
    </section>
    <div class="note" style="margin-left:68px">反照率越高，反射回太空的日光越多。</div>
    <section class="panel chart-panel grow min0 col" aria-label="平衡温度与平均表面温度哑铃图">
      <div class="chart-title row items-center justify-between"><h2>共享温标</h2><span class="label muted">由近到远不是表面温度的完整答案</span></div>
      <div id="chart" class="chart grow min0"></div>
      <div class="legendline row items-center label muted"><span><i class="blue-dot"></i>蓝点＝只计日照与反照率的平衡温度</span><span><i class="gold-dia"></i>金菱形＝平均表面温度</span><span><i class="thin-line"></i>连线＝简化温室增温</span></div>
    </section>
    <div id="conclusion" class="conclusion lead">金星平衡温度并不突出；极高的表面温度，主要体现在巨大的温室增温差额上。</div>
  </main>
  <script src="assets/lib/echarts.min.js"></script>
  <script>
  window.addEventListener('DOMContentLoaded',function(){
    Deck.init({index:23,total:32});
    var ids=['venus','earth','mars'], chartOrder=['mars','earth','venus'], step=1;
    var rows=ids.map(function(id){
      var b=Lec.K.bodies[id], eq=Lec.P.equilibriumTemperature(b.semimajorAxisAU,b.albedo,4);
      return {id:id,name:b.name,d:b.semimajorAxisAU,flux:Lec.P.solarFluxRatio(b.semimajorAxisAU),a:b.albedo,abs:1-b.albedo,eq:eq,surface:b.meanSurfaceTemperatureK,warm:Lec.P.greenhouseWarming(b.meanSurfaceTemperatureK,eq)};
    });
    function sf(v){return Lec.P.significantFigures(v,3)}
    var units={distance:' AU',flux:'×',albedo:'',abs:'%',eq:' K',surface:' K',warm:' K'};
    document.querySelectorAll('[data-key]').forEach(function(el){var r=rows.find(function(x){return x.id===el.dataset.id}),k=el.dataset.key,v=k==='distance'?r.d:k==='albedo'?r.a:k==='absorb'?r.abs*100:r[k];el.textContent=(k==='warm'&&v>0?'+':'')+sf(v)+units[k]});
    var chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
    function option(){
      var rr=chartOrder.map(function(id){return rows.find(function(x){return x.id===id})});
      var lines=step<3?[]:rr.map(function(r,i){return [r.eq,i,r.surface,i]});
      return {animationDuration:500,textStyle:{fontSize:16,color:'#EAF4FF'},grid:{left:64,right:28,top:24,bottom:42},tooltip:{show:step>=2,textStyle:{fontSize:16}},xAxis:{type:'value',min:180,max:760,name:'温度 / K',nameTextStyle:{fontSize:14,color:'#A8BED1'},axisLabel:{fontSize:14,color:'#A8BED1'},axisLine:{lineStyle:{color:'#39749E'}},splitLine:{lineStyle:{color:'#24425F'}}},yAxis:{type:'category',data:['火星','地球','金星'],axisLabel:{fontSize:15,color:'#EAF4FF'},axisLine:{lineStyle:{color:'#39749E'}}},series:(step<3?[]:rr.map(function(r,i){return {type:'line',silent:true,showSymbol:false,data:[[r.eq,i],[r.surface,i]],lineStyle:{color:'#FFC857',width:2,opacity:.72}}})).concat([{name:'平衡温度',type:'scatter',symbolSize:14,data:step>=2?rr.map(function(r,i){return [r.eq,i]}):[],itemStyle:{color:'#55B9FF'}},{name:'平均表面温度',type:'scatter',symbol:'diamond',symbolSize:18,data:step>=3?rr.map(function(r,i){return [r.surface,i]}):[],itemStyle:{color:'#FFC857'}}])};
    }
    function render(){
      document.querySelectorAll('.stage-row').forEach(function(el){var n=+el.className.match(/s(\d)/)[1];el.classList.toggle('hidden',n>step);el.classList.toggle('active',n===step)});
      document.querySelectorAll('.stamp').forEach(function(b){var n=+b.dataset.step;b.classList.toggle('booked',n<=step);b.classList.toggle('locked',n>step+1);b.setAttribute('aria-pressed',n<=step)});
      document.getElementById('count').textContent='已入账 '+step+'/3';document.querySelectorAll('.progress i').forEach(function(x,i){x.classList.toggle('on',i<step)});
      document.getElementById('conclusion').classList.toggle('show',step===3);chart.setOption(option(),true);
    }
    document.querySelectorAll('.stamp').forEach(function(b){b.addEventListener('click',function(){var n=+b.dataset.step;if(n>step+1){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');document.getElementById('msg').textContent='先把上一项入账：能量账必须按日距→反照率→大气读取。';return}if(n===step+1){step=n;b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');document.getElementById('msg').textContent=n===2?'反照率改变真正吸收的日照。':'差额定义为表面温度减平衡温度，是课堂比较量。';render()}})});
    document.getElementById('reset').addEventListener('click',function(){step=1;document.getElementById('msg').textContent='先横向比较日距与收到的日照。';render()});
    Deck.onResize(function(){chart.resize()});render();
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
