<script>
window.addEventListener('DOMContentLoaded',function(){
  Deck.init({index:document.body.dataset.page,total:document.body.dataset.total});
  const cards=[...document.querySelectorAll('.phenom')],slots=[...document.querySelectorAll('.slot')],dots=[...document.querySelectorAll('.dot')],count=document.getElementById('count'),feedback=document.getElementById('feedback'),take=document.getElementById('take');
  let done=0, chosen=0;
  function update(){count.textContent='已配对 '+done+'/'+slots.length;dots.forEach((d,i)=>d.classList.toggle('on',i<done));take.classList.toggle('show',done===slots.length)}
  function attempt(card,slot){if(!slot||slot.classList.contains('correct'))return false;const ok=card.dataset.feature===slot.dataset.answer;if(ok){slot.textContent=card.dataset.feature;slot.classList.add('correct');slot.closest('.box').querySelector('.reading').classList.add('show');slot.closest('.box').querySelector('.chip').classList.add('show');card.classList.add('used');done++;feedback.textContent='证据与世界特征已接通。';update();return true}card.classList.add('wrong');setTimeout(()=>card.classList.remove('wrong'),240);feedback.textContent='这项证据对应的是“'+card.dataset.feature+'”，再看照片上的标注。';return false}
  cards.forEach(card=>{let sx=0,sy=0,active=false;card.addEventListener('pointerdown',e=>{active=true;sx=e.clientX;sy=e.clientY;card.setPointerCapture(e.pointerId);card.classList.add('moving')});card.addEventListener('pointermove',e=>{if(!active)return;card.style.transform=`translate(${(e.clientX-sx)/Deck.s}px,${(e.clientY-sy)/Deck.s}px)`});card.addEventListener('pointerup',e=>{if(!active)return;active=false;card.classList.remove('moving');const r=card.getBoundingClientRect(),cx=(r.left+r.right)/2,cy=(r.top+r.bottom)/2;let target=null,best=Infinity;slots.forEach(s=>{const q=s.getBoundingClientRect(),d=Math.hypot(cx-(q.left+q.right)/2,cy-(q.top+q.bottom)/2);if(d<best){best=d;target=s}});if(best<=36*Deck.s)attempt(card,target);card.style.transform=''});card.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){chosen=(chosen+1)%slots.length;feedback.textContent='目标：'+slots[chosen].dataset.answer;e.preventDefault()}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){chosen=(chosen+slots.length-1)%slots.length;feedback.textContent='目标：'+slots[chosen].dataset.answer;e.preventDefault()}if(e.key==='Enter'||e.key===' '){attempt(card,slots[chosen]);e.preventDefault()}})});
  document.getElementById('reset').addEventListener('click',()=>{done=0;chosen=0;slots.forEach(s=>{s.classList.remove('correct');s.textContent='拖入现象卡';s.closest('.box').querySelector('.reading').classList.remove('show');s.closest('.box').querySelector('.chip').classList.remove('show')});cards.forEach(c=>{c.classList.remove('used','wrong');c.style.transform=''});feedback.textContent='可拖动卡片；聚焦卡片后，用方向键选择目标，按回车配对。';update()});
  document.querySelectorAll('[data-reveal-hover]').forEach(el=>{let frame=0,x=0,y=0,tx=0,ty=0,r=0,tr=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)');function tick(){frame=0;const e=reduced.matches?1:.18;x+=(tx-x)*e;y+=(ty-y)*e;r+=(tr-r)*e;el.style.setProperty('--reveal-x',x+'px');el.style.setProperty('--reveal-y',y+'px');el.style.setProperty('--reveal-radius',r+'px');if(Math.abs(tx-x)+Math.abs(ty-y)+Math.abs(tr-r)>.3)frame=requestAnimationFrame(tick)}function point(ev){const b=el.getBoundingClientRect();tx=(ev.clientX-b.left)/Deck.s;ty=(ev.clientY-b.top)/Deck.s;if(!r){x=tx;y=ty}tr=110;if(!frame)frame=requestAnimationFrame(tick)}el.addEventListener('pointerenter',point);el.addEventListener('pointermove',point);el.addEventListener('pointerleave',()=>{tr=0;if(!frame)frame=requestAnimationFrame(tick)});el.addEventListener('blur',()=>{tr=0;if(!frame)frame=requestAnimationFrame(tick)})});update();
});
