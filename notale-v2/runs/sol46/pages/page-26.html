<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="26" data-total="32">
<div id="stage">
  <style>
    .p26-head{height:86px;padding:22px 38px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
    .p26-kicker{color:var(--orbit);font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.12em;margin-bottom:5px}
    .p26-head .lead{max-width:720px;margin:0;color:var(--muted);text-align:right}
    .p26-main{position:relative;margin:0 38px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--panel-deep);box-shadow:0 18px 48px var(--shadow)}
    #scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
    .p26-process{position:absolute;z-index:3;left:20px;right:20px;top:18px;--process-cols:6;gap:28px;pointer-events:none}
    .p26-process>.step{padding:9px 11px;background:rgba(9,22,37,.86);font-size:var(--fs-label);line-height:1.3;text-align:center}
    .p26-process>.step b{display:block;color:var(--sun-soft);font:700 var(--fs-tick)/1.2 var(--font-mono);margin-bottom:3px}
    .scene-label{position:absolute;z-index:3;padding:5px 9px;border-radius:999px;background:rgba(7,17,31,.82);border:1px solid var(--line);font-size:var(--fs-label);font-weight:700;pointer-events:none;white-space:nowrap}
    #sunLabel{left:12%;top:49%;color:var(--sun)} #cometLabel{left:48%;top:47%;color:var(--text)}
    #tailLabel{right:9%;top:56%;color:var(--orbit-bright)} #velocityLabel{left:47%;top:68%;color:var(--orbit-bright)}
    .p26-hint{position:absolute;z-index:3;left:20px;bottom:18px;margin:0;max-width:520px;padding:10px 14px;border-left:3px solid var(--orbit);background:rgba(7,17,31,.84)}
    .p26-controls{height:144px;padding:14px 38px 18px;display:flex;gap:18px;align-items:stretch}
    .p26-controls>.panel{padding:12px 16px;box-shadow:none}
    .sun-control{flex:1.25}.switches{flex:.8;display:flex;align-items:center;justify-content:center;gap:22px}.progress-wrap{flex:1.25}.reset-wrap{display:flex;align-items:center}
    .sun-control .ctl{gap:14px}.sun-control output{min-width:54px;color:var(--sun);font-family:var(--font-mono);font-size:var(--fs-sec)}
    .progress{display:flex;gap:7px;margin-top:8px}.milestone{flex:1;text-align:center;padding:7px 5px;border:1px solid var(--line);border-radius:var(--r-sm);color:var(--quiet);font-size:var(--fs-label);font-weight:700}.milestone.done{border-color:var(--success);color:var(--success);background:rgba(113,214,174,.1)}
    #feedback{margin-top:7px;color:var(--muted);font-size:var(--fs-sec);line-height:1.35}
    #feedback.success{color:var(--sun-soft)}
    .shake{animation:shake .35s ease-out}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
    @media(prefers-reduced-motion:reduce){.shake{animation:none}}
  </style>

  <header class="p26-head">
    <div><div class="p26-kicker">SOLAR WIND / COMET TAIL</div><h1>尾巴不等于来路</h1></div>
    <p class="lead">彗尾主要背向太阳，并不标示彗星的运动轨迹。</p>
  </header>

  <main class="p26-main grow min0 no-pan" aria-label="彗尾方向三维实验">
    <div class="k-process p26-process">
      <div class="axis"></div>
      <div class="step"><b>01</b>太阳输入<span class="arw"></span></div>
      <div class="step"><b>02</b>彗核受热<span class="arw"></span></div>
      <div class="step"><b>03</b>释放物质<span class="arw"></span></div>
      <div class="step"><b>04</b>两种作用塑形<span class="arw"></span></div>
      <div class="step"><b>05</b>尾部背日<span class="arw"></span></div>
      <div class="step"><b>06</b>与运动方向比较</div>
    </div>
    <div id="scene"></div>
    <div id="sunLabel" class="scene-label">太阳在哪边？</div>
    <div id="cometLabel" class="scene-label">受热 · 彗发</div>
    <div id="tailLabel" class="scene-label">尘尾 + 离子尾：主要背日</div>
    <div id="velocityLabel" class="scene-label" tabindex="0" role="slider" aria-label="运动方向" aria-valuemin="0" aria-valuemax="359" aria-valuenow="35">拖动蓝箭头：运动方向</div>
    <p class="p26-hint sec">旋转太阳、拖动蓝色运动箭头，再分别关闭两种作用。比较：什么会改变尾向？</p>
  </main>

  <section class="p26-controls">
    <div class="panel sun-control min0">
      <div class="label">太阳方向</div>
      <div class="ctl"><label for="sunAngle">旋转金色太阳</label><input id="sunAngle" type="range" min="0" max="359" step="1"><output id="sunOut"></output></div>
    </div>
    <div class="panel switches min0">
      <label class="ctl"><input id="radiation" type="checkbox" checked>太阳辐射</label>
      <label class="ctl"><input id="wind" type="checkbox" checked>太阳风</label>
    </div>
    <div class="panel progress-wrap min0">
      <div class="label">实验进度</div>
      <div class="progress"><span class="milestone" data-p="sun">转太阳</span><span class="milestone" data-p="speed">转速度</span><span class="milestone" data-p="rad">仅辐射</span><span class="milestone" data-p="wind">仅太阳风</span></div>
      <div id="feedback">尾向由太阳决定；蓝箭头只表示彗星此刻怎样运动。</div>
    </div>
    <div class="reset-wrap"><button id="reset" class="btn">重做实验</button></div>
  </section>

  <script src="assets/lib/three.min.js"></script>
  <script>
  window.addEventListener('load',function(){
    Deck.init({index:26,total:32});
    const norm=Lec.P.normalizeAngleDeg;
    const initialSun=norm(215), initialVelocity=norm(35);
    const host=document.getElementById('scene'), range=document.getElementById('sunAngle'), out=document.getElementById('sunOut');
    const radiation=document.getElementById('radiation'), wind=document.getElementById('wind'), velocityLabel=document.getElementById('velocityLabel');
    const feedback=document.getElementById('feedback'), milestones={};
    document.querySelectorAll('.milestone').forEach(x=>milestones[x.dataset.p]=x);
    const state={sun:initialSun,velocity:initialVelocity,done:{sun:false,speed:false,rad:false,wind:false},drag:false};
    range.value=state.sun;
    const scene=new THREE.Scene();
    scene.fog=new THREE.FogExp2(0x07111f,.035);
    const camera=new THREE.PerspectiveCamera(38,1,.1,100); camera.position.set(0,7,12); camera.lookAt(0,0,0);
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputColorSpace=THREE.SRGBColorSpace; host.appendChild(renderer.domElement);
    const ambient=new THREE.AmbientLight(0x8fbddd,.45);scene.add(ambient);
    const sunlight=new THREE.DirectionalLight(0xffc857,2.2);scene.add(sunlight);scene.add(sunlight.target);
    const orbit=new THREE.Mesh(new THREE.RingGeometry(5.75,5.79,128),new THREE.MeshBasicMaterial({color:0x245d86,transparent:true,opacity:.65,side:THREE.DoubleSide}));orbit.rotation.x=-Math.PI/2;scene.add(orbit);
    const nucleus=new THREE.Mesh(new THREE.IcosahedronGeometry(.42,2),new THREE.MeshStandardMaterial({color:0x263747,roughness:.92}));scene.add(nucleus);
    const coma=new THREE.Mesh(new THREE.SphereGeometry(.72,32,20),new THREE.MeshBasicMaterial({color:0xffe09a,transparent:true,opacity:.2,depthWrite:false}));scene.add(coma);
    const sun=new THREE.Mesh(new THREE.SphereGeometry(.52,32,20),new THREE.MeshBasicMaterial({color:0xffc857}));scene.add(sun);
    const sunGlow=new THREE.Mesh(new THREE.SphereGeometry(.82,24,16),new THREE.MeshBasicMaterial({color:0xffc857,transparent:true,opacity:.16,depthWrite:false}));sun.add(sunGlow);
    const dustMat=new THREE.MeshBasicMaterial({color:0xffc857,transparent:true,opacity:.48,side:THREE.DoubleSide,depthWrite:false});
    const dust=new THREE.Mesh(new THREE.ConeGeometry(1.0,5.3,36,1,true),dustMat);scene.add(dust);
    const ionMat=new THREE.MeshBasicMaterial({color:0x55b9ff,transparent:true,opacity:.72,side:THREE.DoubleSide,depthWrite:false});
    const ion=new THREE.Mesh(new THREE.ConeGeometry(.28,6.2,24,1,true),ionMat);scene.add(ion);
    const velocityArrow=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(0,.18,0),2.3,0x55b9ff,.42,.22);scene.add(velocityArrow);
    const antiArrow=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(0,-.22,0),3.3,0xffc857,.42,.24);scene.add(antiArrow);
    const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2(), plane=new THREE.Plane(new THREE.Vector3(0,1,0),0), hit=new THREE.Vector3();
    function vFor(deg){const a=deg*Math.PI/180;return new THREE.Vector3(Math.cos(a),0,Math.sin(a));}
    function orientCone(mesh,dir,len){mesh.position.copy(dir).multiplyScalar(len/2);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0),dir);}
    function update(){
      out.textContent=Math.round(state.sun)+'°'; range.value=Math.round(state.sun);
      const toSun=vFor(state.sun).multiplyScalar(5.8), anti=toSun.clone().normalize().multiplyScalar(-1), vel=vFor(state.velocity);
      sun.position.copy(toSun);sunlight.position.copy(toSun);sunlight.target.position.set(0,0,0);
      orientCone(dust,anti.clone().applyAxisAngle(new THREE.Vector3(0,1,0),.10),5.3);orientCone(ion,anti,6.2);
      dust.visible=radiation.checked;ion.visible=wind.checked;coma.visible=radiation.checked||wind.checked;
      velocityArrow.setDirection(vel);antiArrow.setDirection(anti);
      velocityLabel.setAttribute('aria-valuenow',Math.round(state.velocity));
      Object.keys(state.done).forEach(k=>milestones[k].classList.toggle('done',state.done[k]));
      const complete=Object.values(state.done).every(Boolean);
      feedback.className=complete?'success':'';
      feedback.textContent=complete?'彗尾由太阳辐射与太阳风塑造，主要背向太阳；它不是轨迹线。':'尾向由太阳决定；蓝箭头只表示彗星此刻怎样运动。';
    }
    function resize(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);renderer.render(scene,camera);}
    range.addEventListener('input',()=>{state.sun=norm(Number(range.value));state.done.sun=true;update();});
    function switchUpdate(){if(radiation.checked&&!wind.checked)state.done.rad=true;if(!radiation.checked&&wind.checked)state.done.wind=true;update();}
    radiation.addEventListener('change',switchUpdate);wind.addEventListener('change',switchUpdate);
    function pointerHit(e){const p=Deck.pt(renderer.domElement,e);pointer.x=p.x/renderer.domElement.clientWidth*2-1;pointer.y=-(p.y/renderer.domElement.clientHeight)*2+1;raycaster.setFromCamera(pointer,camera);return raycaster.ray.intersectPlane(plane,hit);}
    renderer.domElement.addEventListener('pointerdown',e=>{if(pointerHit(e)&&hit.length()<3.2){state.drag=true;renderer.domElement.setPointerCapture(e.pointerId);}});
    renderer.domElement.addEventListener('pointermove',e=>{if(!state.drag||!pointerHit(e))return;state.velocity=norm(Math.atan2(hit.z,hit.x)*180/Math.PI);state.done.speed=true;update();});
    renderer.domElement.addEventListener('pointerup',()=>state.drag=false);
    velocityLabel.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowDown'||e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();state.velocity=norm(state.velocity+((e.key==='ArrowRight'||e.key==='ArrowUp')?1:-1));state.done.speed=true;update();}});
    document.getElementById('reset').addEventListener('click',()=>{state.sun=initialSun;state.velocity=initialVelocity;state.done={sun:false,speed:false,rad:false,wind:false};radiation.checked=true;wind.checked=true;update();});
    Deck.onResize(resize);resize();update();
    Deck.loop((t)=>{if(!Deck.reduced()){coma.scale.setScalar(1+.04*Math.sin(t/650));nucleus.rotation.y=t/4000;}renderer.render(scene,camera);},{still:900});
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
