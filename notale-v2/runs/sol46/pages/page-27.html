<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="27" data-total="32">
<div id="stage">
  <style>
    .p27-head{padding:24px 34px 12px;display:flex;align-items:flex-end;justify-content:space-between}
    .p27-kicker{color:var(--orbit);font:700 var(--fs-label)/1.3 var(--font-mono);letter-spacing:.14em;margin-bottom:5px}
    .p27-progress{display:flex;align-items:center;gap:10px;font-size:var(--fs-sec)}
    .p27-dot{width:12px;height:12px;border:1px solid var(--line-strong);border-radius:50%}.p27-dot.on{background:var(--sun);border-color:var(--sun)}
    .p27-main{padding:0 34px 16px;display:flex;gap:20px}.p27-viz{position:relative;flex:1.62;overflow:hidden;padding:0}.p27-side{flex:1;display:flex;flex-direction:column;gap:10px;padding:14px}
    #orbitSvg{width:100%;height:100%;display:block}.p27-viz text{font-family:var(--font-sans)}
    .p27-note{position:absolute;left:18px;bottom:12px;max-width:540px;background:rgba(7,17,31,.86);padding:7px 10px;border-radius:var(--r-sm)}
    .p27-family{display:grid;grid-template-columns:82px repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--panel-deep)}
    .p27-family>.hdr,.p27-family>.dim,.p27-family>div{padding:7px 8px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.25;text-align:center}.p27-family .dim{text-align:right;color:var(--muted);border-right:1px solid var(--line)}
    .p27-family .hdr{font-weight:750;color:var(--orbit-bright);background:var(--panel-raised)}.p27-family .last{border-bottom:0}
    .p27-cards{display:flex;gap:8px}.p27-card{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--panel-raised);color:var(--text);padding:8px;cursor:grab;text-align:left;font:650 14px/1.3 var(--font-sans)}
    .p27-card strong{display:block;color:var(--sun);font:700 16px/1.25 var(--font-mono);margin-bottom:3px}.p27-card.selected{outline:2px solid var(--sun)}.p27-card.done{opacity:.42;cursor:default}.p27-card.bad{animation:p27shake 240ms ease}
    .p27-slots{display:flex;gap:8px}.p27-slot{flex:1;min-height:56px;border:1px dashed var(--line-strong);border-radius:var(--r-sm);background:rgba(85,185,255,.05);color:var(--muted);font:700 14px/1.3 var(--font-sans);padding:7px}.p27-slot.ok{border-style:solid;color:var(--text)}
    .p27-help{min-height:24px;margin:0}.p27-foot{height:68px;padding:0 34px 18px;display:flex;align-items:center;justify-content:space-between;gap:24px}.p27-claim{font-size:var(--fs-lead);font-weight:700;border-left:5px solid var(--sun);padding-left:14px}.p27-sub{font-size:var(--fs-sec);color:var(--muted)}
    @keyframes p27shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
    @media(prefers-reduced-motion:reduce){.p27-card{transition:none}.p27-card.bad{animation:none}}
  </style>
  <header class="p27-head" style="height:94px">
    <div><div class="p27-kicker">ORBIT FAMILIES · E4</div><h1>轨道不是户籍</h1></div>
    <div class="p27-progress" aria-live="polite"><span id="progressText">已判断 0/3</span><span class="p27-dot"></span><span class="p27-dot"></span><span class="p27-dot"></span></div>
  </header>
  <main class="p27-main grow min0">
    <section class="panel p27-viz min0" aria-label="九条小天体教学轨道的俯视比较">
      <svg id="orbitSvg"></svg>
      <div class="note p27-note">半径按对数压缩，读数仍为天文单位。线的明暗与节点短标提示倾角，不代表完整三维形状。</div>
    </section>
    <aside class="panel p27-side min0">
      <div class="row items-center justify-between"><h2>同一维度比较</h2><button id="reset" class="btn">重置三题</button></div>
      <div class="k-comparison p27-family" style="--compare-cols:3">
        <div class="hdr"></div><div class="hdr">小行星式</div><div class="hdr">彗星式</div><div class="hdr">海王星外式</div>
        <div class="dim">典型位置</div><div>内侧集中</div><div class="diff">跨度可很大</div><div>外侧集中</div>
        <div class="dim">离心率</div><div>多较小</div><div class="diff">常较大</div><div>低到高皆有</div>
        <div class="dim">倾角</div><div class="last">多较低</div><div class="last diff">可含逆行</div><div class="last">低到较高</div>
      </div>
      <div class="label">拖动未知卡到候选槽；也可先选卡，再点槽。</div>
      <div id="cards" class="p27-cards"></div>
      <div id="slots" class="p27-slots">
        <button class="p27-slot" data-family="A">小行星</button><button class="p27-slot" data-family="C">彗星</button><button class="p27-slot" data-family="T">海王星外天体</button>
      </div>
      <p id="help" class="sec p27-help muted" aria-live="polite">结合轨道形状、离心率与近日点判断。</p>
      <div id="sampleRows" class="col gap-1" aria-label="九条示例轨道参数"></div>
      <p class="note" style="margin:0">以上为固定种子生成的教学样本，不代表族群硬边界。</p>
    </aside>
  </main>
  <footer class="p27-foot">
    <div class="p27-claim">小天体更像彼此重叠的轨道族群，而不是三只互不相交的抽屉。</div>
    <div class="p27-sub">名称提供线索；单看一个参数，通常不足以判定来源与历史。</div>
  </footer>
  <script src="assets/lib/d3.min.js"></script>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script>
  window.addEventListener('load',function(){
    Deck.init({index:27,total:32});
    const rng=new Math.seedrandom('lec-p27-orbit-families-v1');
    const samples=[
      {id:'A1',family:'A',name:'小行星带样本',a:2.30,e:.08,i:4},{id:'A2',family:'A',name:'小行星带样本',a:2.77,e:.16,i:11},{id:'A3',family:'A',name:'近地小行星式样本',a:1.45,e:.42,i:7},
      {id:'C1',family:'C',name:'短周期彗星式样本',a:4.20,e:.72,i:13},{id:'C2',family:'C',name:'高离心彗星式样本',a:18,e:.94,i:62},{id:'C3',family:'C',name:'逆行彗星式样本',a:32,e:.97,i:128},
      {id:'T1',family:'T',name:'柯伊伯带式样本',a:39.5,e:.25,i:17},{id:'T2',family:'T',name:'海王星外近圆样本',a:44,e:.08,i:3},{id:'T3',family:'T',name:'离散盘式样本',a:68,e:.55,i:28}
    ];
    const colors={A:'#55B9FF',C:'#FFC857',T:'#B78CFF'}, svg=d3.select('#orbitSvg').attr('viewBox','0 0 760 560').attr('role','img').attr('aria-label','太阳共焦点的九条教学轨道，三类轨道范围彼此重叠');
    svg.append('title').text('小天体轨道族群比较');svg.append('desc').text('小行星、彗星与海王星外天体的九条教学轨道，共用太阳焦点。');
    const cx=380,cy=280,rad=d3.scaleLog().domain([.3,100]).range([74,350]);
    const bg=svg.append('g');
    [{v:2.1,t:'小行星带 2.1–3.3 AU'},{v:30.1104,t:'海王星轨道 30.1104 AU'},{v:50,t:'柯伊伯带 30–50 AU'},{v:100,t:'离散盘向外延伸'}].forEach((d,j)=>{bg.append('circle').attr('cx',cx).attr('cy',cy).attr('r',rad(d.v)).attr('fill','none').attr('stroke','#24425F').attr('stroke-dasharray',j===1?'none':'5 7');bg.append('text').attr('x',cx+rad(d.v)*.72).attr('y',cy-rad(d.v)*.69).attr('fill','#A8BED1').attr('font-size',14).text(d.t)});
    const og=svg.append('g').attr('transform',`translate(${cx} ${cy}) scale(.52) translate(${-cx} ${-cy})`);
    function pathFor(d){const el=Lec.P.orbitEllipse(d.a,d.e), ra=rad(el.semimajorAxis), rb=ra*Math.sqrt(1-d.e*d.e), f=ra*d.e, rot=0*rng();return {path:`M ${cx-f-ra} ${cy} a ${ra} ${rb} 0 1 0 ${2*ra} 0 a ${ra} ${rb} 0 1 0 ${-2*ra} 0`,rot};}
    samples.forEach(d=>Object.assign(d,pathFor(d)));
    const paths=og.selectAll('path').data(samples).join('path').attr('class',d=>'orb '+d.id).attr('d',d=>d.path).attr('transform',d=>`rotate(${d.rot} ${cx} ${cy})`).attr('fill','none').attr('stroke',d=>colors[d.family]).attr('stroke-width',1.5).attr('opacity',.7).attr('stroke-dasharray',function(){return this.getTotalLength()}).attr('stroke-dashoffset',function(){return Deck.reduced()?0:this.getTotalLength()});
    if(!Deck.reduced()) paths.transition().delay((d,j)=>180+Math.floor(j/3)*270+(j%3)*90).duration(700).ease(d3.easeCubicOut).attr('stroke-dashoffset',0);
    svg.append('circle').attr('cx',cx).attr('cy',cy).attr('r',11).attr('fill','#FFC857');svg.append('text').attr('x',cx+18).attr('y',cy+5).attr('fill','#FFE09A').attr('font-size',15).text('太阳焦点');
    const rows=d3.select('#sampleRows').selectAll('div').data(samples).join('div').attr('class','row justify-between').style('font-size','14px').style('line-height','1.25').style('color',d=>colors[d.family]);
    rows.html(d=>`<span><b>${d.id}</b> ${d.name}</span><span class="mono">a ${Lec.P.significantFigures(d.a,3)} · e ${Lec.P.significantFigures(d.e,2)} · i ${d.i}° · q/Q ${Lec.P.significantFigures(Lec.P.periapsisDistance(d.a,d.e),3)}/${Lec.P.significantFigures(Lec.P.apoapsisDistance(d.a,d.e),3)} AU</span>`);
    const unknown=samples.filter(d=>['A3','C2','T1'].includes(d.id));let selected=null,done=new Set();
    const cards=d3.select('#cards').selectAll('button').data(unknown).join('button').attr('class','p27-card').attr('draggable','true').attr('data-id',d=>d.id).html(d=>`<strong>${d.id}</strong><span class="mono">a ${d.a} · e ${d.e}<br>i ${d.i}° · q ${Lec.P.significantFigures(Lec.P.periapsisDistance(d.a,d.e),2)} AU</span>`).on('click',(ev,d)=>{if(done.has(d.id))return;selected=d;cards.classed('selected',x=>x.id===d.id);highlight(d)}).on('dragstart',(ev,d)=>{selected=d;ev.dataTransfer.setData('text/plain',d.id);highlight(d)});
    function highlight(d){paths.attr('opacity',x=>x.id===d.id?1:.16).attr('stroke-width',x=>x.id===d.id?4:1.5);rows.style('opacity',x=>x.id===d.id?1:.22).style('font-weight',x=>x.id===d.id?700:400)}
    function place(family,slot){if(!selected||done.has(selected.id))return;if(selected.family===family){done.add(selected.id);slot.classList.add('ok');slot.textContent+=' · '+selected.id;d3.select(`[data-id="${selected.id}"]`).classed('done',true).classed('selected',false);d3.select('.orb.'+selected.id).attr('opacity',1).attr('stroke-width',4);document.querySelector('#help').textContent='形状与参数共同支持这个归位。';selected=null;update()}else{const el=document.querySelector(`[data-id="${selected.id}"]`);el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');document.querySelector('#help').textContent='只看远近不够：再比较离心率与近日点。'}}
    document.querySelectorAll('.p27-slot').forEach(slot=>{slot.addEventListener('dragover',e=>e.preventDefault());slot.addEventListener('drop',e=>{e.preventDefault();place(slot.dataset.family,slot)});slot.addEventListener('click',()=>place(slot.dataset.family,slot))});
    function update(){document.querySelector('#progressText').textContent=`已判断 ${done.size}/3`;document.querySelectorAll('.p27-dot').forEach((x,j)=>x.classList.toggle('on',j<done.size));if(done.size===3){paths.attr('opacity',.92).attr('stroke-width',2.4);rows.style('opacity',1);document.querySelector('#help').textContent='边界重叠：类别是轨道线索，不是互斥抽屉。'}}
    document.querySelector('#reset').addEventListener('click',()=>{done.clear();selected=null;cards.classed('done selected bad',false);document.querySelectorAll('.p27-slot').forEach((s,j)=>{s.classList.remove('ok');s.textContent=['小行星','彗星','海王星外天体'][j]});document.querySelector('#help').textContent='结合轨道形状、离心率与近日点判断。';paths.attr('opacity',.7).attr('stroke-width',1.5);rows.style('opacity',1).style('font-weight',400);update()});
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
