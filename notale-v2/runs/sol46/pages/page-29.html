<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="29" data-total="32">
<div id="stage">
  <style>
    .mission-head{box-sizing:border-box;padding:24px 32px 12px}.mission-head .kicker{letter-spacing:.14em;color:var(--orbit);font-size:var(--fs-label);font-weight:750}.mission-head .lead{margin:5px 0 0;color:var(--muted)}
    .mission-flow{--process-cols:6;margin:0 32px 12px;gap:22px}.mission-flow>.step{padding:8px 10px;text-align:center;font-size:var(--fs-label);line-height:1.35}.mission-flow>.step b{display:block;color:var(--orbit-bright)}.mission-flow>.arw{right:-21px}
    .mission-main{position:relative;margin:0 32px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--panel-deep)}
    #space{position:absolute;inset:0}#labJupiter{transform:translate(34px,28px)}.scene-note{position:absolute;left:18px;top:16px;display:flex;gap:8px;flex-wrap:wrap}.scene-note .badge{background:rgba(7,17,31,.86)}
    .planet-label{position:absolute;pointer-events:none;padding:3px 7px;border-radius:var(--r-sm);background:rgba(7,17,31,.82);font-size:var(--fs-label);font-weight:700}
    .mission-meter{position:absolute;right:18px;top:16px;width:285px;padding:16px}.mission-meter h2{margin-bottom:10px}.metric{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:var(--fs-sec)}.metric strong{font-family:var(--font-mono);color:var(--orbit-bright)}
    .status{margin-top:12px;padding:10px;border-left:4px solid var(--orbit);background:rgba(85,185,255,.08);font-size:var(--fs-sec);line-height:1.45}.status.ok{border-color:var(--success);color:var(--success)}.status.bad{border-color:var(--danger);color:var(--danger)}
    .mission-controls{box-sizing:border-box;height:128px;padding:10px 32px 10px}.controller{flex:1;padding:12px 16px}.controller .ctl{height:44px}.controller select{flex:1}.launch-read{min-width:104px;text-align:right;font-family:var(--font-mono);color:var(--sun)}
    .action-box{flex:0 0 290px;padding:12px 16px}.action-box .btn{flex:1}.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--orbit)}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
  <header class="mission-head" style="height:80px;padding-top:14px">
    <div class="kicker">MISSION WINDOW · 外太阳系任务</div>
    <div class="row items-end justify-between gap-4"><h1>不能直飞的远方</h1><p class="lead">飞船在走，目标也在走；任务必须瞄准未来的交会位置。</p></div>
  </header>
  <section class="k-process mission-flow" style="height:64px" aria-label="任务规划六步">
    <div class="axis"></div>
    <div class="step done"><b>1 定目标</b><span>海王星</span><i class="arw"></i></div>
    <div class="step done"><b>2 看位置</b><span>行星经度</span><i class="arw"></i></div>
    <div class="step current"><b>3 等窗口</b><span>发射日</span><i class="arw"></i></div>
    <div class="step"><b>4 配预算</b><span>航速档</span><i class="arw"></i></div>
    <div class="step"><b>5 选路线</b><span>中途节点</span><i class="arw"></i></div>
    <div class="step"><b>6 推进时间</b><span>检验交会</span></div>
  </section>
  <main class="mission-main grow min0" aria-label="三维俯视轨道沙盘">
    <div id="space" class="min0"></div>
    <div class="scene-note"><span class="badge">教学简化：共面、近圆轨道</span><span class="badge">轨道距离已压缩</span><span class="badge">不是实际任务导航解</span></div>
    <div id="labEarth" class="planet-label">地球 · <span class="mono">1.00 AU</span></div>
    <div id="labJupiter" class="planet-label">木星</div><div id="labNeptune" class="planet-label">海王星</div>
    <aside class="panel mission-meter" aria-live="polite">
      <h2>任务仪表 <span id="progress" class="badge current">规划 3/6</span></h2>
      <div class="metric"><span>模拟时刻</span><strong id="elapsed">待发射</strong></div>
      <div class="metric"><span>预计飞行</span><strong id="flight">—</strong></div>
      <div class="metric"><span>木星会合周期</span><strong id="synodic">—</strong></div>
      <div class="metric"><span>交会误差</span><strong id="error">—</strong></div>
      <div id="status" class="status">设置窗口、航速与路线，再启动模拟。</div>
    </aside>
  </main>
  <section class="mission-controls row gap-3" style="height:144px" aria-label="任务控制器">
    <div class="panel controller min0"><div class="label">发射窗口</div><div class="ctl"><label for="launch">发射日</label><input id="launch" type="range"><output id="launchOut" class="launch-read"></output></div></div>
    <div class="panel controller min0"><div class="label">航速预算代理</div><div class="ctl"><label for="speed">巡航假设</label><select id="speed"></select></div></div>
    <div class="panel controller min0"><div class="label">路线几何</div><div class="ctl"><label for="route">航迹</label><select id="route"><option value="direct">转移弧 · 节点少</option><option value="jupiter">经木星 · 需按时相遇</option></select></div></div>
    <div class="panel action-box col gap-2"><div class="row gap-2"><button id="start" class="btn primary">启动时间推进</button><button id="reset" class="btn">重置任务</button></div><div class="note">速度、等待与行星位置共同决定结果。</div></div>
  </section>
  <script src="assets/lib/three.min.js"></script>
  <script>
  window.addEventListener('load',function(){
    Deck.init({index:29,total:32});
    const K=Lec.K,P=Lec.P, bodies=K.bodies, U=K.units;
    const earth=bodies.earth,jupiter=bodies.jupiter,neptune=bodies.neptune;
    const speeds=[U.HOUR_PER_DAY/2,U.HOUR_PER_DAY*3/4,U.HOUR_PER_DAY];
    const maxDay=P.roundTo(jupiter.orbitalPeriodDays,-3), timeRate=speeds[0]*10, hitRadius=speeds[0]/10;
    const el=id=>document.getElementById(id), host=el('space'), launch=el('launch'), speed=el('speed'), route=el('route');
    launch.min=0; launch.max=maxDay; launch.step=U.MINUTE_PER_HOUR; launch.value=0;
    ['低','中','高'].forEach((n,i)=>{const o=document.createElement('option');o.value=i;o.textContent=n+'档 · '+speeds[i]+' km·s⁻¹';speed.appendChild(o)}); speed.value=1;
    el('synodic').textContent=P.significantFigures(P.planetSynodicPeriodDays('jupiter'),3)+' d';
    const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(42,1,.1,240); camera.position.set(0,48,34);camera.lookAt(0,0,0);
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0x8fd2ff,1.2)); const light=new THREE.PointLight(0xffc857,90,80);scene.add(light);
    const r=au=>P.compressedOrbitRadius(au,neptune.semimajorAxisAU,22,.55);
    function ring(rad){const pts=[];for(let i=0;i<=128;i++){let a=i/128*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*rad,0,Math.sin(a)*rad))}scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x55b9ff,transparent:true,opacity:.38})))}
    [earth,jupiter,neptune].forEach(b=>ring(r(b.semimajorAxisAU)));
    const sun=new THREE.Mesh(new THREE.SphereGeometry(1.15,24,16),new THREE.MeshBasicMaterial({color:0xffc857}));scene.add(sun);
    function planet(color,size){const m=new THREE.Mesh(new THREE.SphereGeometry(size,20,14),new THREE.MeshStandardMaterial({color,roughness:.62}));scene.add(m);return m}
    const meshes={earth:planet(0x55b9ff,.42),jupiter:planet(0xffc857,.7),neptune:planet(0x477dff,.58)};
    let path=null,state={running:false,done:false,t:0,flight:0,error:0};
    function lon(body,day){return P.normalizeAngleDeg(P.meanOrbitalLongitudeDeg(day,body.orbitalPeriodDays,0))*K.math.RAD_PER_DEG}
    function setPlanet(body,mesh,day){const a=lon(body,day),rr=r(body.semimajorAxisAU);mesh.position.set(Math.cos(a)*rr,0,Math.sin(a)*rr)}
    function project(mesh,label){const v=mesh.position.clone().project(camera);label.style.left=((v.x+1)*host.clientWidth/2+8)+'px';label.style.top=((-v.y+1)*host.clientHeight/2-10)+'px'}
    function metrics(){const idx=+speed.value,v=speeds[idx], directAU=neptune.semimajorAxisAU-earth.semimajorAxisAU;const lengthAU=route.value==='direct'?directAU:(jupiter.semimajorAxisAU-earth.semimajorAxisAU)+(neptune.semimajorAxisAU-jupiter.semimajorAxisAU);const days=P.travelTimeDays(lengthAU*U.KM_PER_AU,v);return {v,days}}
    function buildPath(finalDay){if(path){scene.remove(path);path.geometry.dispose();path.material.dispose()}const a0=lon(earth,+launch.value), a1=a0+Math.PI*(route.value==='direct'?1:1.5), pts=[];for(let i=0;i<=100;i++){const q=i/100,rad=r(earth.semimajorAxisAU)+(r(neptune.semimajorAxisAU)-r(earth.semimajorAxisAU))*q;let a=a0+(a1-a0)*q;pts.push(new THREE.Vector3(Math.cos(a)*rad,.15,Math.sin(a)*rad))}const target=lon(neptune,finalDay),end=a1;state.error=2*neptune.semimajorAxisAU*Math.abs(Math.sin((target-end)/2));const ok=state.error<hitRadius;path=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:ok?0xffc857:0xff667a,transparent:true,opacity:.95}));path.geometry.setDrawRange(0,1);scene.add(path);return ok}
    function updateLabels(){project(meshes.earth,el('labEarth'));project(meshes.jupiter,el('labJupiter'));project(meshes.neptune,el('labNeptune'))}
    function refresh(){el('launchOut').textContent=launch.value+' d';const m=metrics();el('flight').textContent=P.significantFigures(m.days,3)+' d';if(!state.running&&!state.done){setPlanet(earth,meshes.earth,+launch.value);setPlanet(jupiter,meshes.jupiter,+launch.value);setPlanet(neptune,meshes.neptune,+launch.value);el('progress').textContent='规划 3/6';el('error').textContent='—'}updateLabels();renderer.render(scene,camera)}
    function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();refresh()}Deck.onResize(resize);
    [launch,speed,route].forEach(x=>x.addEventListener('input',refresh));
    let stop=null;
    el('start').addEventListener('click',()=>{if(stop)stop();const m=metrics(),startDay=+launch.value,finalDay=startDay+m.days,ok=buildPath(finalDay);state={running:true,done:false,t:0,flight:m.days,error:state.error};el('progress').textContent='推进 6/6';el('status').className='status';el('status').textContent='时间推进中：行星与飞船同步移动。';el('start').disabled=true;stop=Deck.loop((t,dt)=>{state.t=Math.min(state.flight,state.t+(Deck.reduced()?state.flight:dt/1000*timeRate));const day=startDay+state.t;setPlanet(earth,meshes.earth,day);setPlanet(jupiter,meshes.jupiter,day);setPlanet(neptune,meshes.neptune,day);path.geometry.setDrawRange(0,Math.max(1,Math.floor(101*state.t/state.flight)));el('elapsed').textContent=P.significantFigures(state.t,3)+' d';el('error').textContent=P.significantFigures(state.error,3)+' AU';updateLabels();renderer.render(scene,camera);if(state.t>=state.flight){stop();state.running=false;state.done=true;el('start').disabled=false;el('progress').textContent='结算 6/6';el('status').className='status '+(ok?'ok':'bad');el('status').textContent=ok?'按时交会：航迹进入目标判定圈。':'错过海王星：抵达时目标已经离开。'}},{still:m.days})});
    el('reset').addEventListener('click',()=>{if(stop)stop();launch.value=0;speed.value=1;route.value='direct';state={running:false,done:false,t:0,flight:0,error:0};if(path){scene.remove(path);path.geometry.dispose();path.material.dispose();path=null}el('elapsed').textContent='待发射';el('status').className='status';el('status').textContent='设置窗口、航速与路线，再启动模拟。';el('start').disabled=false;refresh()});
    resize();refresh();
  });
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
