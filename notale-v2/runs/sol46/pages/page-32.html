<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="32" data-total="32">
<div id="stage"><style>
  #stage{--fs-h1:58px;--fs-h2:28px;--fs-body:22px;--fs-sec:16px;position:relative;padding:52px 68px 44px;background:radial-gradient(circle at 23% 52%,rgba(255,200,87,.10),transparent 16%),radial-gradient(circle at 77% 22%,rgba(85,185,255,.10),transparent 28%),var(--bg)}
  .exit-head{position:relative;z-index:3}
  .exit-kicker{color:var(--orbit-bright);font:700 15px/1.35 var(--font-mono);letter-spacing:.18em}
  .exit-head h1{margin-top:8px;font-size:clamp(34px,4vw,58px)}
  .exit-head .lead{margin:10px 0 0;color:var(--muted)}
  .system-field{position:relative;overflow:hidden}
  .solar-motif{position:absolute;inset:0;pointer-events:none}
  .sun-core{position:absolute;left:38px;top:50%;width:82px;height:82px;border-radius:50%;background:radial-gradient(circle at 35% 32%,var(--sun-soft),var(--sun) 42%,#D98D1B 75%);box-shadow:0 0 22px var(--sun),0 0 74px var(--sun-glow);transform:translateY(-50%);animation:sun-in .9s ease-out both}
  .arc{position:absolute;left:75px;border:2px solid var(--orbit);border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;opacity:.38;filter:drop-shadow(0 0 6px var(--orbit-glow));transform:rotate(7deg);clip-path:inset(0 0 0 50%);animation:arc-in .9s ease-out both}
  .arc.a1{top:112px;width:450px;height:260px}.arc.a2{top:74px;width:710px;height:350px;animation-delay:80ms}.arc.a3{top:35px;width:970px;height:440px;animation-delay:160ms}.arc.a4{top:-5px;width:1230px;height:530px;animation-delay:240ms}
  .planet-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--orbit-bright);box-shadow:0 0 8px var(--orbit);opacity:.55}
  .exit-list{--enum-cols:1;position:relative;z-index:2;width:1160px;margin-left:166px;align-self:center;gap:12px}
  .exit-list>.it{display:grid;grid-template-columns:76px 150px minmax(0,1fr) 202px;align-items:center;min-height:94px;padding:13px 22px;border:1px solid var(--line);border-left:3px solid var(--orbit);border-top:1px solid var(--line);background:linear-gradient(90deg,rgba(13,27,45,.96),rgba(13,27,45,.84));box-shadow:0 10px 26px rgba(0,0,0,.22);opacity:0;animation:item-in .55s ease-out forwards}
  .exit-list>.it:nth-child(2){animation-delay:80ms}.exit-list>.it:nth-child(3){animation-delay:160ms}.exit-list>.it:nth-child(4){animation-delay:240ms}
  .num{color:var(--orbit-bright);font:700 19px/1 var(--font-mono);letter-spacing:.08em}
  .key{color:var(--sun);font-size:28px;font-weight:760;line-height:1.2}
  .sentence{font-size:22px;line-height:1.42;padding-right:24px}
  .recall{position:relative;color:var(--muted);font-size:16px;line-height:1.45;padding-left:23px}
  .recall:before{content:"";position:absolute;left:0;top:50%;width:15px;border-top:1px solid var(--orbit)}
  .join{position:absolute;z-index:1;right:119px;top:71px;bottom:69px;width:78px;border-right:2px solid var(--orbit-dim);border-top:2px solid var(--orbit-dim);border-bottom:2px solid var(--orbit-dim);border-radius:0 34px 34px 0}
  .join:after{content:"";position:absolute;right:-50px;top:50%;width:48px;border-top:2px solid var(--orbit);box-shadow:0 0 8px var(--orbit-glow)}
  .system-stamp{position:absolute;z-index:3;right:4px;top:50%;width:154px;height:154px;display:grid;place-content:center;text-align:center;border:2px solid var(--orbit);border-radius:50%;background:var(--panel-deep);box-shadow:0 0 26px var(--orbit-glow);font-size:16px;font-weight:700;line-height:1.45;letter-spacing:.08em;opacity:0;animation:stamp-in .2s 700ms ease-out forwards}
  .system-stamp strong{display:block;color:var(--orbit-bright);font-size:25px;letter-spacing:0}
  .closing{position:relative;z-index:3;border-top:1px solid var(--line);padding-top:20px;text-align:center;font-size:24px;font-weight:660;line-height:1.4}
  .closing strong{color:var(--sun)}
  @keyframes sun-in{from{opacity:0;transform:translateY(-50%) scale(.55)}to{opacity:1;transform:translateY(-50%) scale(1)}}
  @keyframes arc-in{from{opacity:0;clip-path:inset(0 100% 0 50%)}to{opacity:.38;clip-path:inset(0 0 0 50%)}}
  @keyframes item-in{from{opacity:0}to{opacity:1}}
  @keyframes stamp-in{from{opacity:0;transform:translateY(-50%) scale(.82)}to{opacity:1;transform:translateY(-50%) scale(1)}}
  @media(prefers-reduced-motion:reduce){.sun-core,.arc,.exit-list>.it,.system-stamp{animation:none;opacity:1}.system-stamp{transform:translateY(-50%)}}
</style>
<header class="exit-head" style="height:126px">
  <div class="exit-kicker">EXIT FRAME</div>
  <h1>四句话，重建太阳系</h1>
  <p class="lead">离场时，带走系统框架，而不是八颗行星的名单。</p>
</header>
<main class="system-field grow min0">
  <div class="solar-motif" aria-hidden="true">
    <div class="sun-core"></div><div class="arc a1"></div><div class="arc a2"></div><div class="arc a3"></div><div class="arc a4"></div>
    <i class="planet-dot" style="left:298px;top:120px"></i><i class="planet-dot" style="left:454px;top:466px"></i><i class="planet-dot" style="left:696px;top:66px"></i><i class="planet-dot" style="left:902px;top:490px"></i><i class="planet-dot" style="left:1120px;top:42px"></i><i class="planet-dot" style="left:1280px;top:458px"></i><i class="planet-dot" style="left:1392px;top:132px"></i><i class="planet-dot" style="left:1452px;top:378px"></i>
  </div>
  <section class="k-enumeration exit-list" aria-label="太阳系的四个并列特征">
    <article class="it min0"><span class="num">01</span><span class="key">有骨架</span><span class="sentence">太阳主导中心，成员分布在跨越巨大尺度的不同区域。</span><span class="recall">中心 · 尺度 · 分区</span></article>
    <article class="it min0"><span class="num">02</span><span class="key">同规律</span><span class="sentence">所有主要天体都在引力下运动，距离关联速度与周期。</span><span class="recall">引力 · 轨道 · 周期</span></article>
    <article class="it min0"><span class="num">03</span><span class="key">会分化</span><span class="sentence">形成位置先筛选材料，质量与能量收支再塑造不同世界。</span><span class="recall">温度 · 材料 · 演化</span></article>
    <article class="it min0"><span class="num">04</span><span class="key">留记录</span><span class="sentence">小天体、撞击痕迹与探测数据让太阳系历史可以被检验。</span><span class="recall">遗迹 · 变化 · 探测</span></article>
  </section>
  <div class="join" aria-hidden="true"></div>
  <div class="system-stamp"><span>太阳系＝</span><strong>系统</strong></div>
</main>
<footer class="closing" style="height:74px">不是八个名字，而是一个<strong>有结构、按规律运行、持续分化并留下历史</strong>的系统。</footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
