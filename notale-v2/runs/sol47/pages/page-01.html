<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{background:var(--canvas-deep)}
  .opening{position:relative;display:flex;flex:1;min-height:0;overflow:hidden;background:radial-gradient(circle at 73% 49%,rgba(67,199,217,.055),transparent 37%),var(--canvas-deep)}
  .words{position:relative;z-index:3;display:flex;flex:0 0 44%;flex-direction:column;justify-content:center;min-width:0;padding:72px 0 72px 84px}
  .kicker{display:flex;gap:9px;align-items:center;color:var(--muted);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:650;letter-spacing:.16em}
  .kicker i{display:block;width:34px;height:1px;background:var(--accent);box-shadow:0 0 9px rgba(255,181,71,.45)}
  h1{max-width:560px;margin-top:28px;font-size:var(--fs-h1)}
  h1 span{display:block}
  h1 .gold{color:var(--accent)}
  .lead{max-width:510px;margin-top:44px}
  .lead span{display:inline-block}
  .system{position:relative;flex:1;min-width:0;overflow:hidden;margin:0}
  .system svg{display:block;width:100%;height:100%}
  .k-generalization{position:absolute;inset:0;display:block;pointer-events:none}
  .k-generalization .claim{position:absolute;left:4%;top:42%;width:1px;height:1px;padding:0;border:0;border-radius:50%;background:var(--accent);box-shadow:0 0 22px 8px rgba(255,181,71,.28)}
  .k-generalization .trunk{position:absolute;left:5%;top:42%;width:43%;height:2px;margin:0;background:linear-gradient(90deg,var(--line),var(--line-soft));transform-origin:left;animation:trunkIn .45s .62s both}
  .k-generalization .supports{position:absolute;inset:0;display:block;padding:0}
  .relation-label{position:absolute;left:18%;top:calc(42% - 31px);color:var(--line);font-size:var(--fs-label);font-weight:650;letter-spacing:.12em}
  .k-generalization .supports::before{display:none}
  .k-generalization .supports > .support{position:absolute;width:auto;min-width:0;padding:7px 12px;border:1px solid var(--line-soft);border-radius:999px;background:rgba(3,7,13,.88);color:var(--text);font-size:var(--fs-sec);font-weight:650;line-height:1.35;white-space:nowrap;opacity:0;animation:supportIn .34s both}
  .k-generalization .support::before{left:-52px;bottom:50%;width:52px;height:1px;background:var(--line-soft);transform:none}
  .k-generalization .support:nth-child(1){left:38%;top:30%;animation-delay:.82s}
  .k-generalization .support:nth-child(2){left:53%;top:52%;animation-delay:.96s}
  .k-generalization .support:nth-child(3){left:72%;top:24%;animation-delay:1.08s}
  .support span{display:inline-block}
  .handoff{position:absolute;z-index:4;right:52px;bottom:36px;color:var(--muted-2);font-size:var(--fs-sec);line-height:1.45}
  .sun{transform-origin:680px 430px;animation:sunIn .4s both}
  .orbit{fill:none;stroke:var(--line);stroke-width:2;stroke-opacity:.5;stroke-dasharray:1500;stroke-dashoffset:1500;animation:draw .7s both}
  .orbit.o2{animation-delay:.15s}.orbit.o3{animation-delay:.25s}.orbit.o4{animation-delay:.35s}.orbit.o5{animation-delay:.45s}
  .node{fill:var(--line);opacity:.65}
  @keyframes sunIn{from{opacity:.08;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes trunkIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes supportIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.sun,.orbit,.k-generalization .trunk,.k-generalization .support{animation:none!important;opacity:1;stroke-dashoffset:0;transform:none}}
</style>
</head>
<body data-page="01" data-total="31">
<div id="stage">
  <main class="opening min0" aria-labelledby="page-title">
    <section class="words min0">
      <div class="kicker" aria-label="Solar System 02"><span>SOLAR</span><span>SYSTEM</span><span>·</span><i aria-hidden="true"></i><span>02</span></div>
      <h1 id="page-title"><span>太阳系，</span><span class="gold">不是</span><span>八颗球的</span><span>名册</span></h1>
      <p class="lead"><span>太阳系</span><span>是一套</span><span>仍在演化的关系。</span></p>
    </section>
    <figure class="system min0" aria-label="太阳与稀疏轨道环组成的抽象关系图">
      <svg viewBox="0 0 1050 900" role="img" aria-labelledby="diagram-title diagram-desc">
        <title id="diagram-title">关系中的太阳系</title>
        <desc id="diagram-desc">太阳位于多条相互交叠的抽象轨道中央，轨道不表示真实比例。</desc>
        <defs>
          <radialGradient id="sunGlow">
            <stop offset="0" stop-color="var(--text)"/><stop offset=".22" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
          </radialGradient>
          <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
        </defs>
        <g transform="rotate(-8 680 430)">
          <ellipse class="orbit o5" cx="610" cy="440" rx="360" ry="228"/>
          <ellipse class="orbit o4" cx="630" cy="438" rx="300" ry="166" transform="rotate(15 630 438)"/>
          <ellipse class="orbit o3" cx="651" cy="434" rx="232" ry="119" transform="rotate(-12 651 434)"/>
          <ellipse class="orbit o2" cx="666" cy="431" rx="160" ry="72" transform="rotate(18 666 431)"/>
          <ellipse class="orbit" cx="674" cy="430" rx="96" ry="41" transform="rotate(-18 674 430)"/>
        </g>
        <circle class="sun" cx="680" cy="430" r="76" fill="url(#sunGlow)" filter="url(#softGlow)" opacity=".82"/>
        <circle class="sun" cx="680" cy="430" r="31" fill="var(--accent)"/>
        <circle class="node" cx="494" cy="334" r="4"/><circle class="node" cx="745" cy="548" r="4"/><circle class="node" cx="825" cy="278" r="4"/>
      </svg>
      <div class="k-generalization" aria-label="主张与三条支撑">
        <div class="claim" aria-hidden="true"></div><div class="trunk" aria-hidden="true"></div><div class="relation-label">关系</div>
        <div class="supports">
          <div class="support"><span>彼此</span><span>牵连</span></div>
          <div class="support"><span>持续</span><span>运动</span></div>
          <div class="support"><span>仍在</span><span>演化</span></div>
        </div>
      </div>
    </figure>
    <p class="handoff"><span>下一步：</span><span>沿哪五步重建太阳系？</span></p>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
