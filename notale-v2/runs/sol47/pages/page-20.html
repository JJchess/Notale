<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{padding:28px 42px 24px;gap:14px;background:
    radial-gradient(ellipse at 2% 42%,var(--accent-soft),transparent 24%),
    linear-gradient(100deg,rgba(255,181,71,.08),transparent 58%),var(--bg)}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-5)}
  .kicker{color:var(--line);font:700 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.16em;margin-bottom:5px}
  .status{color:var(--muted);font-size:var(--fs-sec)}
  .status strong{color:var(--accent);font-family:var(--font-mono);font-size:var(--fs-h2)}
  .ledger{display:flex;flex-direction:row;gap:var(--sp-4);min-height:0}
  .ledger>.lv{flex:1 1 0;padding-left:16px;min-width:0}
  .ledger>.lv::before{width:12px}
  .planet{height:100%;display:flex;flex-direction:column;gap:6px;padding:14px!important;background:var(--surface-raised)!important;border-color:var(--line-soft)!important;transition:border-color 180ms ease,box-shadow 180ms ease}
  .planet.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft),var(--shadow)}
  .planet.balanced{border-color:var(--accent);box-shadow:0 0 20px var(--accent-soft)}
  .planet>.bt{display:flex;justify-content:space-between;align-items:center;margin:-14px -14px 0!important;padding:10px 14px!important}
  .planet>.bt span{color:var(--muted);font:500 var(--fs-label)/1.2 var(--font-mono)}
  .account{padding:10px 12px!important;background:var(--surface)!important;border-color:var(--line-soft)!important}
  .account>.bt{font-size:var(--fs-sec)!important;padding:8px 10px!important;margin:-10px -12px 9px!important;display:flex;justify-content:space-between}
  .flow{width:100%;height:250px;display:block;overflow:visible;background:linear-gradient(90deg,var(--accent-soft),transparent);border-radius:var(--radius-sm)}
  .facts{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:var(--fs-label);line-height:1.25}
  .facts b{color:var(--text);font-weight:600}
  .surface{margin-top:auto;display:flex;align-items:end;justify-content:space-between;padding-top:9px;border-top:1px solid var(--line-soft)}
  .surface .caption{color:var(--muted);font-size:var(--fs-sec)}
  .surface .big{color:var(--accent)}
  .controls{display:flex;align-items:center;gap:var(--sp-4);padding:11px 16px}
  .controls .btns{flex:0 0 auto}
  .controls .ctl{flex:1;grid-template-columns:110px 1fr 82px}
  .feedback{min-width:360px;max-width:420px;font-size:var(--fs-sec);line-height:1.4;color:var(--muted)}
  .conclusion{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-5);padding:10px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);font-size:var(--fs-lead);line-height:1.4}
  .next{color:var(--muted);font-size:var(--fs-sec);white-space:nowrap}
  .shake{animation:shake 220ms ease-in-out}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="20" data-total="31">
<div id="stage">
  <header class="top" style="height:67px">
    <div><div class="kicker">ENERGY LEDGER</div><h1>平衡气候账本</h1></div>
    <div class="status" aria-live="polite">已平衡 <strong id="count">0/3</strong></div>
  </header>

  <main id="ledger" class="k-classification ledger min0" style="flex:1" aria-label="金星、地球与火星的气候分类账本"></main>

  <section class="panel controls min0" style="height:82px" aria-label="账本调节台">
    <div class="btns" id="worldBtns" aria-label="选择行星"></div>
    <div class="ctl min0"><label for="albedo">反照率</label><input id="albedo" type="range" min="0" max="1" step="0.001"><output id="albedoOut"></output></div>
    <div class="ctl min0"><label for="greenhouse">温室增量</label><input id="greenhouse" type="range" min="0" step="1"><output id="greenhouseOut"></output></div>
    <button class="btn" id="reset" type="button">重置账本</button>
  </section>

  <footer id="conclusion" class="conclusion" style="height:54px">
    <span>反照率决定吸收多少阳光，大气决定热量怎样离开；平衡温度不等于地表温度。</span>
    <span id="feedback" class="hint feedback" aria-live="polite">选择一颗行星，分别调节吸收阳光与大气留热。</span>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  const K=Lec.K,P=Lec.P, AU=K.units.astronomicalUnitM;
  const defs=[['venus','金星'],['earth','地球'],['mars','火星']].map(([key,name])=>{
    const b=K.bodies[key], flux=P.solarFluxWm2(b.semiMajorAxisM), teq=P.equilibriumTemperatureK(b.semiMajorAxisM,b.bondAlbedo);
    return {key,name,distance:b.semiMajorAxisM/AU,flux,targetA:b.bondAlbedo,targetG:b.meanTemperatureK-teq,targetSurface:b.meanTemperatureK};
  });
  const maxG=Math.ceil(d3.max(defs,d=>d.targetG)/100)*100;
  defs.forEach((d,i)=>{d.a=defs[(i+1)%defs.length].targetA;d.g=defs[(i+1)%defs.length].targetG;d.done=false});
  let selected=0;
  const ledger=d3.select('#ledger');
  const cols=ledger.selectAll('.lv').data(defs).join('section').attr('class','lv min0');
  cols.html(d=>`<div class="box planet" id="planet-${d.key}">
    <div class="bt">${d.name}<span>${d.distance.toFixed(3)} AU</span></div>
    <div class="box account"><div class="bt"><span>太阳输入</span><span class="num flux"></span></div><svg class="flow" viewBox="0 0 420 54" preserveAspectRatio="none" role="img" aria-label="太阳通量经过反照率后成为平均吸收能量"></svg><div class="facts"><span>反照率 <b class="aval"></b></span><span>平均吸收 <b class="absorbed"></b></span></div></div>
    <div class="box account"><div class="bt"><span>无温室的辐射基线</span>课堂账本模型</div><svg class="tempflow" viewBox="0 0 420 76" preserveAspectRatio="none" style="width:100%;height:90px" role="img" aria-label="平衡温度加上温室增量得到地表温度"></svg><div class="facts"><span>Teq = [S(1−A)/(4σ)]^¼</span><span><b class="teq"></b></span></div><div class="facts"><span>大气温室增量</span><span><b class="gval"></b></span></div></div>
    <div class="surface"><span class="caption delta">地表温度</span><span><span class="big sm surfaceK"></span><span class="unit">K</span></span></div>
  </div>`);
  const buttons=d3.select('#worldBtns').selectAll('button').data(defs).join('button').attr('class','btn').attr('type','button').text(d=>d.name).on('click',(e,d)=>{selected=defs.indexOf(d);syncControls();render()});
  const alb=document.querySelector('#albedo'),green=document.querySelector('#greenhouse'); green.max=maxG;
  function calc(d){const teq=P.equilibriumTemperatureK(K.bodies[d.key].semiMajorAxisM,d.a);return {teq,abs:d.flux*(1-d.a)/4,surface:teq+d.g}}
  function render(){
    defs.forEach(d=>{const c=calc(d),target=Math.abs(d.a-d.targetA)<=.01&&Math.abs(c.surface-d.targetSurface)<=3;if(target)d.done=true;
      const p=d3.select('#planet-'+d.key).classed('active',d===defs[selected]).classed('balanced',d.done);
      p.select('.flux').text(Math.round(d.flux)+' W/m²');p.select('.aval').text(d.a.toFixed(3));p.select('.absorbed').text(Math.round(c.abs)+' W/m²');p.select('.teq').text(Math.round(c.teq)+' K');p.select('.gval').text('+'+Math.round(d.g)+' K');p.select('.surfaceK').text(Math.round(c.surface));p.select('.delta').html('地表温度<br>距目标 '+(c.surface-d.targetSurface>=0?'+':'')+Math.round(c.surface-d.targetSurface)+' K');
      const temp=p.select('.tempflow');temp.selectAll('*').remove();const ts=d3.scaleLinear().domain([0,maxG+300]).range([0,390]);temp.append('rect').attr('x',8).attr('y',10).attr('width',ts(c.teq)).attr('height',22).attr('rx',6).attr('fill','var(--line)');temp.append('rect').attr('x',8).attr('y',42).attr('width',ts(c.surface)).attr('height',22).attr('rx',6).attr('fill','var(--accent)');temp.append('line').attr('x1',ts(c.teq)+8).attr('x2',ts(c.teq)+8).attr('y1',32).attr('y2',42).attr('stroke','var(--line)').attr('stroke-width',3);
      const svg=p.select('.flow'), scale=d3.scaleLinear().domain([0,d.flux]).range([0,390]);
      svg.selectAll('*').remove();svg.append('rect').attr('x',8).attr('y',4).attr('width',390).attr('height',22).attr('rx',7).attr('fill','var(--line-faint)');svg.append('rect').attr('x',8).attr('y',8).attr('width',scale(d.flux)).attr('height',14).attr('rx',7).attr('fill','var(--accent)');svg.append('path').attr('d','M203 25V38H390').attr('fill','none').attr('stroke','var(--line)').attr('stroke-width',2);svg.append('rect').attr('x',8).attr('y',32).attr('width',Math.max(2,scale(c.abs*4))).attr('height',18).attr('rx',5).attr('fill','var(--line)');
    });
    buttons.attr('aria-pressed',d=>d===defs[selected]?'true':'false');
    const n=defs.filter(d=>d.done).length;document.querySelector('#count').textContent=n+'/3';
    if(n===3)document.querySelector('#feedback').textContent='三本账已接通：太阳输入与大气留热必须分开核算。';
  }
  function syncControls(){const d=defs[selected];alb.value=d.a;green.value=d.g;document.querySelector('#albedoOut').textContent=d.a.toFixed(3);document.querySelector('#greenhouseOut').textContent='+'+Math.round(d.g)+' K'}
  function input(which){const d=defs[selected];if(which==='a')d.a=+alb.value;else d.g=+green.value;syncControls();render();const c=calc(d),off=Math.abs(c.surface-d.targetSurface);const fb=document.querySelector('#feedback');if(off>3){fb.textContent='温度对不上：先判断差在吸收阳光，还是大气留热。';fb.classList.remove('shake');void fb.offsetWidth;fb.classList.add('shake')}else fb.textContent='地表温度已接近目标，再核对反照率。'}
  alb.addEventListener('input',()=>input('a'));green.addEventListener('input',()=>input('g'));
  document.querySelector('#reset').addEventListener('click',()=>{defs.forEach((d,i)=>{d.a=defs[(i+1)%defs.length].targetA;d.g=defs[(i+1)%defs.length].targetG;d.done=false});selected=0;syncControls();document.querySelector('#feedback').textContent='选择一颗行星，分别调节吸收阳光与大气留热。';render()});
  syncControls();render();Deck.init({index:20,total:31});
})();
</script>
</body>
</html>
