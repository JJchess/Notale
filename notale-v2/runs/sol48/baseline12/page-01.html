<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .opening-head{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start}
    .kicker{margin:0 0 10px;color:var(--orbit);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:650;line-height:1.4;letter-spacing:.12em}
    .opening-head h1{margin:0}
    .opening-head h1 span:first-child{color:var(--muted);font-weight:560}
    .system-map{width:1280px;max-width:100%;align-self:center;align-content:center}
    .system-map.k-generalization{grid-template-rows:auto 62px minmax(0,1fr)}
    .system-map.k-generalization>.claim{position:relative;width:760px;padding:22px 32px;border-left-width:6px;font-size:var(--fs-h1);text-align:center;text-shadow:0 0 34px rgba(255,183,3,.22)}
    .claim-label{display:block;margin-bottom:5px;color:var(--sun);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:650;line-height:1.4;letter-spacing:.1em;text-align:left}
    .claim-core{color:var(--sun)}
    .system-map.k-generalization>.trunk{position:relative;height:62px;transform-origin:top}
    .trunk-label{position:absolute;top:18px;left:18px;width:max-content;color:var(--orbit);font-size:var(--fs-label);font-weight:650;line-height:1.4}
    .system-map.k-generalization>.supports{--support-cols:2;min-height:300px;align-self:start}
    .system-map.k-generalization>.supports>.support{display:flex;min-height:270px;margin:0 34px;padding:34px 28px 18px;flex-direction:column;justify-content:center;border-right:1px solid rgba(76,201,240,.22);border-bottom:1px solid rgba(76,201,240,.22);border-left:1px solid rgba(76,201,240,.22);text-align:center}
    .support-index{display:block;margin-bottom:9px;color:var(--orbit);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:650;line-height:1.4;letter-spacing:.08em}
    .support-key{display:block;margin-bottom:8px;color:var(--text);font-size:var(--fs-h2);font-weight:720;line-height:1.35}
    .support-desc{display:block;color:var(--muted);font-size:var(--fs-body);line-height:1.5}
    .closing{display:flex;align-items:flex-end;justify-content:space-between;gap:48px;border-top:1px solid rgba(76,201,240,.25)}
    .closing-line{display:flex;flex-wrap:wrap;align-items:baseline;margin:0;padding-top:22px;color:var(--text);font-size:var(--fs-lead);line-height:1.5}
    .closing-line span{margin-right:.3em}
    .closing-line .em{color:var(--sun);font-weight:720}
    .next-cue{max-width:500px;margin:0;padding-top:22px;color:var(--muted);font-size:var(--fs-sec);line-height:1.5;text-align:right}
    .next-cue b{display:block;color:var(--orbit);font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.08em}
    .backdrop{opacity:.18}
    .backdrop-note{font-size:var(--fs-label)}
    @keyframes bgIn{from{opacity:.04}to{opacity:.18}}
    @keyframes lineIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes branchIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes closeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .backdrop{animation:bgIn 900ms ease-out both}
    .system-map>.trunk{animation:lineIn 520ms 420ms ease-out both}
    .support{animation:branchIn 560ms ease-out both}
    .support:nth-child(1){animation-delay:760ms}
    .support:nth-child(2){animation-delay:900ms}
    .closing{animation:closeIn 520ms 1120ms ease-out both}
    @media (prefers-reduced-motion:reduce){.backdrop,.system-map>.trunk,.support,.closing{animation:none}}
  </style>
</head>
<body data-page="01" data-total="34">
  <div id="stage">
    <img class="backdrop" src="assets/img/orbit-rings-bg.png" alt="" title="生成插画（非真实照片）">
    <div class="backdrop-note" aria-hidden="true">生成插画 · 非真实照片</div>

    <header class="opening-head" style="height:145px">
      <p class="kicker"><span>LECTURE 02</span><span> · </span><span>SOLAR SYSTEM</span></p>
      <h1><span>不是名单，</span><span>是系统</span></h1>
    </header>

    <main class="k-generalization system-map min0" style="flex:1" aria-label="太阳系是一套系统，由有结构和会演化两个特征支撑">
      <div class="claim">
        <span class="claim-label">上位主张</span>
        <span>太阳系</span><span>是一套</span><span class="claim-core">系统</span>
      </div>
      <div class="trunk" aria-hidden="true"><span class="trunk-label">太阳系</span></div>
      <div class="supports">
        <section class="support min0">
          <span class="support-index">支撑 01</span>
          <span class="support-key">有结构</span>
          <span class="support-desc">成员之间存在整体关系</span>
        </section>
        <section class="support min0">
          <span class="support-index">支撑 02</span>
          <span class="support-key">会演化</span>
          <span class="support-desc">形成之后仍持续改变</span>
        </section>
      </div>
    </main>

    <footer class="closing" style="height:118px">
      <p class="closing-line"><span>太阳系不是八颗行星的名单，</span><span>而是一套</span><span class="em">有结构、会演化</span><span>的系统。</span></p>
      <p class="next-cue"><b>下一页</b><span>我们沿哪条路线认识这套系统？</span></p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>Deck.init({index:1,total:34});</script>
</body>
</html>
