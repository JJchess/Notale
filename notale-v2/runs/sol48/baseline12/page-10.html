<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .chapter-kicker{margin:0 0 6px;color:var(--orbit);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:650;letter-spacing:.14em;line-height:1.35}
  .page-title{margin:0}
  .transition-map{position:relative;display:flex;flex-direction:column;align-items:stretch;justify-content:center;overflow:visible}
  .flow-field{position:absolute;z-index:-1;inset:0;width:100%;height:100%;color:var(--orbit);pointer-events:none}
  .flow-field .stream{fill:currentColor;opacity:.11}
  .flow-field .core{fill:currentColor;opacity:.18}
  .transition-map .supports{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:42px;width:100%;padding-bottom:68px;border:0}
  .transition-map .supports::after{position:absolute;right:16.66%;bottom:34px;left:16.66%;height:1px;background:var(--orbit);content:"";opacity:.72;transform:scaleX(0);transform-origin:center}
  .transition-map .support{position:relative;display:flex;min-width:0;min-height:126px;margin:0;padding:20px 22px;flex-direction:column;justify-content:center;border-top:1px solid rgba(76,201,240,.48);border-bottom:1px solid rgba(76,201,240,.2);color:var(--text);text-align:center;opacity:0;transform:translateY(-12px)}
  .transition-map .support::after{position:absolute;bottom:-35px;left:50%;width:1px;height:35px;background:var(--orbit);content:""}
  .support-index{color:var(--orbit);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:650;letter-spacing:.08em;line-height:1.35}
  .support-kind{margin-top:5px;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
  .support-text{margin-top:9px;color:var(--text);font-size:var(--fs-lead);font-weight:650;line-height:1.45}
  .merge-label{position:absolute;bottom:4px;left:50%;color:var(--muted);font-size:var(--fs-label);line-height:1.35;transform:translateX(-50%);opacity:0}
  .transition-map>.trunk{width:2px;height:46px;flex:0 0 46px;background:var(--orbit);opacity:0;transform:scaleY(0);transform-origin:top}
  .transition-map>.claim{width:min(100%,980px);margin:0 auto;padding:17px 26px;border-left:5px solid var(--orbit);border-right:1px solid rgba(76,201,240,.25);color:var(--text);font-size:var(--fs-h2);font-weight:720;line-height:1.4;text-align:center;opacity:0}
  .claim-prefix{display:block;margin-bottom:4px;color:var(--orbit);font-size:var(--fs-label);font-weight:650;letter-spacing:.08em;line-height:1.35}
  .to-question{display:flex;height:66px;flex:0 0 66px;flex-direction:column;align-items:center;opacity:0}
  .to-question::before{width:2px;height:40px;background:linear-gradient(var(--orbit),var(--sun));content:""}
  .to-question::after{width:0;height:0;border-top:10px solid var(--sun);border-right:7px solid transparent;border-left:7px solid transparent;content:""}
  .question{margin:0;color:var(--sun);font-size:30px;font-weight:740;line-height:1.3;text-align:center;opacity:0;transform:translateY(10px)}
  .question-label{display:block;margin-bottom:6px;color:var(--muted);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:600;letter-spacing:.12em;line-height:1.35}
  .bridge-copy{display:flex;align-items:flex-start;justify-content:space-between;gap:40px;border-top:1px solid rgba(76,201,240,.24);padding-top:14px}
  .bridge-copy p{margin:0;font-size:var(--fs-sec);line-height:1.45}
  .bridge-copy .recap{max-width:760px;color:var(--text)}
  .bridge-copy .next{max-width:610px;color:var(--muted);text-align:right}
  .bridge-copy strong{color:var(--sun);font-weight:680}
  @keyframes supportIn{to{opacity:1;transform:none}}
  @keyframes lineIn{to{opacity:1;transform:none}}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes questionIn{to{opacity:1;transform:none}}
  .support:nth-child(1){animation:supportIn .38s ease-out .08s forwards}
  .support:nth-child(2){animation:supportIn .38s ease-out .25s forwards}
  .support:nth-child(3){animation:supportIn .38s ease-out .42s forwards}
  .transition-map .supports::after{animation:lineIn .34s ease-out .68s forwards}
  .merge-label,.transition-map>.trunk{animation:lineIn .25s ease-out .83s forwards}
  .transition-map>.claim{animation:fadeIn .32s ease-out 1.02s forwards}
  .to-question{animation:fadeIn .24s ease-out 1.27s forwards}
  .question{animation:questionIn .38s ease-out 1.42s forwards}
  @media (prefers-reduced-motion:reduce){.transition-map .support,.transition-map .supports::after,.merge-label,.transition-map>.trunk,.transition-map>.claim,.to-question,.question{animation:none;opacity:1;transform:none}}
</style>
</head>
<body data-page="10" data-total="34">
<div id="stage">
  <img class="backdrop" src="assets/img/orbit-rings-bg.png" alt="" title="生成插画（非真实照片）" style="opacity:.18">

  <header style="height:96px;flex:0 0 96px">
    <p class="chapter-kicker">CHAPTER I · TRANSITION</p>
    <h1 class="page-title">这些规律来自哪里？</h1>
  </header>

  <main class="k-generalization transition-map min0" style="flex:1" aria-label="三条太阳系结构规律汇成一个关于共同起源的问题">
    <svg class="flow-field" viewBox="0 0 1488 662" preserveAspectRatio="none" aria-hidden="true">
      <path class="stream" d="M40 58 H456 L660 338 H568 Z"/>
      <path class="stream" d="M536 58 H952 L824 338 H664 Z"/>
      <path class="stream" d="M1032 58 H1448 L920 338 H828 Z"/>
      <path class="core" d="M568 338 H920 L820 530 H668 Z"/>
    </svg>
    <div class="supports" style="--support-cols:3">
      <section class="support min0">
        <span class="support-index">线索 01</span>
        <span class="support-kind">轨道姿态</span>
        <span class="support-text">大体同向、近乎共面</span>
      </section>
      <section class="support min0">
        <span class="support-index">线索 02</span>
        <span class="support-kind">空间分布</span>
        <span class="support-text">内侧以岩质行星为主，外侧是巨行星</span>
      </section>
      <section class="support min0">
        <span class="support-index">线索 03</span>
        <span class="support-kind">物质性质</span>
        <span class="support-text">大小、密度与成分呈系统分区</span>
      </section>
      <span class="merge-label"><span>三条规律</span><span style="margin-left:8px">彼此呼应</span></span>
    </div>
    <div class="trunk" aria-hidden="true"></div>
    <div class="claim">
      <span class="claim-prefix">共同指向</span>
      太阳系的结构不是随机拼盘
    </div>
    <div class="to-question" aria-hidden="true"></div>
    <p class="question"><span class="question-label">NEXT QUESTION</span>共同的形成起点，为何产生不同世界？</p>
  </main>

  <footer class="bridge-copy" style="height:86px;flex:0 0 86px">
    <p class="recap">这些规律像是共同形成史留下的线索。<br>但共同起源只解释“从哪里开始”；接下来要追问，不同世界怎样分化出来。</p>
    <p class="next"><strong>下一步</strong><br>年轻恒星周围的盘，能否提供“共同起点”的现实证据？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:10,total:34});</script>
</body>
</html>
