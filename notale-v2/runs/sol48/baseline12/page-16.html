<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .kicker{color:var(--orbit);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.16em;margin:0 0 5px}
  .hero{display:flex;gap:34px;align-items:stretch;min-height:0}
  .evidence-window{display:flex;flex:0 0 540px;min-width:0;flex-direction:column;align-items:center;justify-content:center}
  .photo-note{color:var(--muted);font-size:var(--fs-sec);line-height:1.4;margin:0 0 10px}
  .reveal{position:relative;width:500px;height:500px;overflow:hidden;border:1px solid rgba(76,201,240,.5);border-radius:50%;isolation:isolate;background:var(--surface);touch-action:none;box-shadow:0 0 0 10px rgba(76,201,240,.04)}
  .reveal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  .reveal .venus{z-index:2;clip-path:inset(0 calc(100% - var(--split)) 0 0);filter:brightness(1.05)}
  .reveal .divider{position:absolute;z-index:4;top:0;bottom:0;left:var(--split);width:3px;transform:translateX(-1.5px);background:var(--sun);box-shadow:0 0 18px rgba(255,183,3,.7);pointer-events:none}
  .reveal .divider::after{position:absolute;top:50%;left:50%;width:22px;height:50px;border:2px solid var(--sun);border-radius:9px;background:var(--bg);content:"↔";display:grid;place-items:center;transform:translate(-50%,-50%);color:var(--sun);font:700 15px/1 var(--font-mono)}
  .reveal input{position:absolute;z-index:5;inset:0;width:100%;height:100%;margin:0;opacity:.001;cursor:ew-resize}
  .reveal:focus-within{outline:3px solid var(--focus);outline-offset:6px}
  .edge-label{position:absolute;z-index:4;top:18px;padding:5px 10px;border:1px solid currentColor;border-radius:999px;background:rgba(5,9,20,.78);font-size:var(--fs-label);font-weight:680;line-height:1.35;pointer-events:none;transition:color 180ms,opacity 180ms}
  .edge-label.ven{left:22px}.edge-label.ear{right:22px}
  .hero[data-side="venus"] .ven,.hero[data-side="earth"] .ear{color:var(--sun);opacity:1}
  .hero[data-side="venus"] .ear,.hero[data-side="earth"] .ven{color:var(--muted);opacity:.58}
  .model{display:flex;flex:1;min-width:0;flex-direction:column;justify-content:center}
  .k-comparison{--compare-cols:2;grid-template-columns:205px repeat(2,minmax(0,1fr));align-content:center}
  .k-comparison .cell{align-self:center;padding:10px 18px;color:var(--text);font-size:var(--fs-sec);line-height:1.4}
  .k-comparison .temp{padding-block:12px;text-align:center;transition:color 180ms,opacity 180ms}
  .k-comparison .hdr{transition:color 180ms,opacity 180ms}
  .hero[data-side="venus"] .venus-state,.hero[data-side="earth"] .earth-state{color:var(--sun);opacity:1}
  .hero[data-side="venus"] .earth-state,.hero[data-side="earth"] .venus-state{color:var(--muted);opacity:.58}
  .uncertainty{margin:8px 0 0 221px;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
  .controls{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:16px}
  .status{color:var(--text);font-size:var(--fs-sec);line-height:1.4}
  .bottom{display:flex;align-items:center;justify-content:space-between;gap:34px;border-top:1px solid rgba(76,201,240,.3);padding-top:14px}
  .bottom p{margin:0}
  .next{flex:0 0 460px;color:var(--muted);font-size:var(--fs-sec);line-height:1.4;text-align:right}
  @media (prefers-reduced-motion:reduce){.k-comparison .temp,.k-comparison .hdr,.edge-label{transition:none}}
</style>
</head>
<body data-page="16" data-total="34">
<div id="stage">
  <header style="height:94px">
    <p class="kicker">SISTER WORLDS</p>
    <h1>大小相近，为何表面相差 <span id="titleDiff" class="num"></span>？</h1>
  </header>

  <main id="hero" class="hero min0" data-side="venus" style="flex:1">
    <section class="evidence-window min0" aria-labelledby="photoCaption">
      <p id="photoCaption" class="photo-note">真实照片窗口｜外观不代表自然色一致</p>
      <div id="reveal" class="reveal no-pan" style="--split:50%">
        <img src="assets/img/earth-apollo17.jpg" alt="地球影像" title="Apollo 17 Harrison H. Schmitt and Tracy's Rock - AS17-140-21493+AS17-140-21497 2025.jpg · Eugene A. CernanPhotomontage by User:Grunpfnul · Public domain">
        <img class="venus" src="assets/img/venus-magellan.jpg" alt="" aria-hidden="true" title="Cylindrical Map of Venus.jpg · NASA / Jet Propulsion Laboratory · Public domain">
        <span class="edge-label ven">金星</span><span class="edge-label ear">地球</span>
        <span class="divider" aria-hidden="true"></span>
        <input id="splitControl" type="range" min="10" max="90" value="50" step="1" aria-label="拖动揭示线；向左露出更多地球，向右露出更多金星">
      </div>
      <div class="controls" style="width:500px">
        <p class="hint" style="margin:0">拖动揭示线，或用方向键比较</p>
        <button id="reset" class="btn" type="button">复位对半</button>
      </div>
    </section>

    <section class="model min0" aria-label="金星与地球同维度比较">
      <div class="k-comparison">
        <div></div><div class="hdr venus-state">金星</div><div class="hdr earth-state">地球</div>
        <div class="dim">平均直径</div><div id="vDiameter" class="cell num"></div><div id="eDiameter" class="cell num"></div><div class="rowline"></div>
        <div class="dim">距太阳与所受辐照</div><div id="vFlux" class="cell"></div><div id="eFlux" class="cell"></div><div class="rowline"></div>
        <div class="dim">大气与表面水</div><div class="cell">浓厚、以 CO₂ 为主；<br>今天无稳定表面海洋</div><div class="cell">以 N₂、O₂ 为主；<br>海洋参与持续水循环</div><div class="rowline"></div>
        <div class="dim diff">全球典型表面温度</div><div class="temp diff venus-state"><span id="vTemp" class="big sm num"></span><span class="unit">°C</span></div><div class="temp diff earth-state"><span id="eTemp" class="big sm num"></span><span class="unit">°C</span></div>
        <div class="axis"></div>
      </div>
      <p class="uncertainty">金星早期水的数量与流失路径仍有研究不确定性。</p>
      <p id="status" class="status" aria-live="polite" style="margin:10px 0 0 221px">当前对半比较：两颗行星直径接近，表面状态却相距甚远。</p>
    </section>
  </main>

  <footer class="bottom" style="height:92px">
    <p class="lead">大小相近，不等于环境相近。金星和地球因日照、大气与水循环历史共同作用，成为约 <span id="sumV" class="num"></span> 与约 <span id="sumE" class="num"></span> 的两种表面。</p>
    <p class="next">下一问：液态环境一定要位于行星表面，并只靠与太阳的距离维持吗？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:16,total:34});
  const venus=Lec.K.planets.venus, earth=Lec.K.planets.earth;
  const celsius=b=>Math.round(b.meanSurfaceTemperatureK-273.15);
  const vd=Math.round(Lec.P.diameterKm(venus));
  const ed=Math.round(Lec.P.diameterKm(earth));
  const vt=celsius(venus), et=celsius(earth), diff=vt-et;
  const fluxV=Lec.P.solarFluxRelativeToEarth(venus.semimajorAxisAU);
  const fluxE=Lec.P.solarFluxRelativeToEarth(earth.semimajorAxisAU);
  const fmt=n=>n.toLocaleString('zh-CN');
  titleDiff.textContent=fmt(diff)+'°C';
  vDiameter.textContent='约 '+fmt(vd)+' km'; eDiameter.textContent='约 '+fmt(ed)+' km';
  vFlux.innerHTML='<span class="num">'+venus.semimajorAxisAU.toFixed(3)+' AU</span>；约地球的 <span class="num">'+fluxV.toFixed(2)+' 倍</span>';
  eFlux.innerHTML='<span class="num">'+earth.semimajorAxisAU.toFixed(3)+' AU</span>；<span class="num">'+fluxE.toFixed(2)+' 倍</span>';
  vTemp.textContent='约 '+fmt(vt); eTemp.textContent='约 '+fmt(et);
  sumV.textContent=fmt(vt)+'°C'; sumE.textContent=fmt(et)+'°C';

  const input=document.getElementById('splitControl'), reveal=document.getElementById('reveal'), hero=document.getElementById('hero'), status=document.getElementById('status');
  function update(value){
    const v=Deck.clamp(Number(value),10,90);
    input.value=String(v); reveal.style.setProperty('--split',v+'%');
    const side=v>=50?'venus':'earth'; hero.dataset.side=side;
    status.textContent=v===50?'当前对半比较：两颗行星直径接近，表面状态却相距甚远。':'当前露出更多'+(side==='venus'?'金星':'地球')+'：四项数据保持同一行基准。';
  }
  input.addEventListener('input',e=>update(e.target.value));
  reveal.addEventListener('pointermove',e=>{
    if(e.pointerType==='mouse' || e.buttons===1){const p=Deck.pt(reveal,e);update(10+80*Deck.clamp(p.x/reveal.offsetWidth,0,1));}
  });
  document.getElementById('reset').addEventListener('click',()=>{update(50);input.focus();});
  update(50);
})();
</script>
</body>
</html>
