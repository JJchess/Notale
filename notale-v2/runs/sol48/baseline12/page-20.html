<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .kicker{color:var(--orbit);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.12em}
    .chart-wrap{display:flex;gap:24px;min-height:0}
    #chart{width:100%;height:100%;display:block}
    .axis text{fill:var(--muted);font:13px var(--font-mono)}
    .axis path,.axis line{stroke:var(--line)}
    .grid line{stroke:var(--line);stroke-opacity:.58;stroke-dasharray:3 7}.grid path{display:none}
    .chart-label{fill:var(--muted);font:15px var(--font-sans)}
    .chart-note{fill:var(--text);font:16px var(--font-sans)}
    .point-label{fill:var(--muted);font:15px var(--font-sans)}
    .table-value{display:flex;justify-content:center;align-items:baseline;font-size:var(--fs-sec);line-height:1.4;text-align:center}
    input[type=number]{width:118px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:var(--bg);font:650 var(--fs-body)/1.3 var(--font-mono)}
    input[type=number]:focus-visible,.btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    .closing{margin:0;border-left:4px solid var(--sun);padding-left:16px;color:var(--text);font-size:var(--fs-lead);line-height:1.5}
  </style>
</head>
<body data-page="20" data-total="34">
  <div id="stage">
    <header style="height:82px">
      <div class="kicker">DYNAMIC SYSTEM · E3</div>
      <h1 style="margin-top:6px">离太阳越远，一年增长得越快</h1>
    </header>

    <section class="chart-wrap min0" style="flex:1" aria-label="半长轴与公转周期关系">
      <div class="cvbox min0" style="flex:1;border:1px solid var(--line)">
        <svg id="chart" role="img" aria-label="半长轴从0.3到35天文单位，公转周期随距离向上弯曲增长"></svg>
      </div>
      <aside class="panel min0" style="width:350px;display:flex;flex-direction:column;justify-content:center;gap:15px">
        <div class="small">自定义轨道的一年</div>
        <div><span id="periodBig" class="big">1.00</span><span class="unit">地球年</span></div>
        <div class="ctl" style="display:flex;gap:10px">
          <label for="axisInput">轨道平均尺度 a</label>
          <input id="axisInput" type="number" min="0.3" max="35" step="0.1" value="1.00" aria-describedby="rangeHint">
          <span class="unit">AU</span>
        </div>
        <div class="ctl" style="display:block">
          <input id="axisRange" type="range" min="0.3" max="35" step="0.1" value="1.00" aria-label="拖动轨道平均尺度">
        </div>
        <div id="rangeHint" class="hint">输入或拖动 0.3–35 AU，观察曲线斜率</div>
        <div class="btns"><button id="reset" class="btn" type="button">复位到地球</button></div>
      </aside>
    </section>

    <section class="k-comparison min0" style="height:220px;--compare-cols:4;margin-top:16px" aria-label="四种轨道的对齐比较">
      <div class="dim">比较对象</div><div class="hdr diff">自定义轨道</div><div class="hdr">地球</div><div class="hdr">木星</div><div class="hdr">海王星</div>
      <div class="rowline"></div>
      <div class="dim">半长轴 a</div><div class="table-value diff"><span id="customA" class="num">1.00</span><span class="unit">AU</span></div><div class="table-value"><span id="earthA" class="num"></span><span class="unit">AU</span></div><div class="table-value"><span id="jupiterA" class="num"></span><span class="unit">AU</span></div><div class="table-value"><span id="neptuneA" class="num"></span><span class="unit">AU</span></div>
      <div class="rowline"></div>
      <div class="dim">公转周期 P</div><div class="table-value diff"><span id="customP" class="num">1.00</span><span class="unit">地球年</span></div><div class="table-value"><span id="earthP" class="num"></span><span class="unit">地球年</span></div><div class="table-value"><span id="jupiterP" class="num"></span><span class="unit">地球年</span></div><div class="table-value"><span id="neptuneP" class="num"></span><span class="unit">地球年</span></div>
    </section>

    <footer style="height:100px;display:flex;align-items:center;justify-content:space-between;gap:36px">
      <p class="closing" style="flex:1">轨道尺度增大一倍，一年不只增大一倍；更远的行星既要走更大的轨道，通常也运行得更慢。</p>
      <p class="small" style="width:440px;margin:0">半长轴越大，公转周期增长得更快：海王星的一年约等于 165 个地球年。<br>下一问：行星会始终以同样速度前进吗？</p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script src="assets/lib/gsap.min.js"></script>
  <script>
    Deck.init({index:20,total:34});
    const planets=Lec.K.planets;
    const yearDays=planets.earth.orbitalPeriodDays;
    const refs=[planets.earth,planets.jupiter,planets.neptune];
    const ids=['earth','jupiter','neptune'];
    refs.forEach((p,i)=>{
      document.getElementById(ids[i]+'A').textContent=p.semimajorAxisAU.toFixed(i===0?8:4);
      document.getElementById(ids[i]+'P').textContent=(p.orbitalPeriodDays/yearDays).toFixed(i===2?1:2);
    });

    const svg=d3.select('#chart'), W=1050, H=390, m={top:42,right:38,bottom:58,left:78};
    svg.attr('viewBox',`0 0 ${W} ${H}`);
    svg.append('title').text('轨道平均尺度与公转周期');
    svg.append('desc').text('青色曲线表示课堂近似关系，琥珀色游标由输入控制。');
    const x=d3.scaleLinear().domain([0.3,35]).range([m.left,W-m.right]);
    const y=d3.scaleLinear().domain([0,210]).range([H-m.bottom,m.top]);
    svg.append('g').attr('class','grid').attr('transform',`translate(0,${H-m.bottom})`).call(d3.axisBottom(x).tickValues([1,5,10,20,30,35]).tickSize(-(H-m.top-m.bottom)).tickFormat(''));
    svg.append('g').attr('class','grid').attr('transform',`translate(${m.left},0)`).call(d3.axisLeft(y).tickValues([0,50,100,150,200]).tickSize(-(W-m.left-m.right)).tickFormat(''));
    svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.bottom})`).call(d3.axisBottom(x).tickValues([1,5,10,20,30,35]));
    svg.append('g').attr('class','axis').attr('transform',`translate(${m.left},0)`).call(d3.axisLeft(y).tickValues([0,50,100,150,200]));
    svg.append('text').attr('class','chart-label').attr('x',(m.left+W-m.right)/2).attr('y',H-13).attr('text-anchor','middle').text('半长轴 a（AU）');
    svg.append('text').attr('class','chart-label').attr('transform','rotate(-90)').attr('x',-(m.top+H-m.bottom)/2).attr('y',20).attr('text-anchor','middle').text('公转周期 P（地球年）');
    svg.append('text').attr('class','chart-note').attr('x',m.left+16).attr('y',m.top-13).text('课堂近似 P²=a³');
    svg.append('text').attr('class','chart-label').attr('x',W-m.right).attr('y',m.top-13).attr('text-anchor','end').text('绕太阳；a 用 AU，P 用地球年');
    const data=d3.range(0.3,35.01,0.08).map(a=>({a,p:Lec.P.keplerPeriodYearsFromAU(a)}));
    const path=svg.append('path').datum(data).attr('fill','none').attr('stroke','var(--orbit)').attr('stroke-width',4).attr('d',d3.line().x(d=>x(d.a)).y(d=>y(d.p)));
    const refG=svg.append('g');
    refs.forEach(p=>{const py=Lec.P.keplerPeriodYearsFromAU(p.semimajorAxisAU);refG.append('circle').attr('cx',x(p.semimajorAxisAU)).attr('cy',y(py)).attr('r',6).attr('fill','var(--orbit)');refG.append('text').attr('class','point-label').attr('x',x(p.semimajorAxisAU)+10).attr('y',y(py)-9).text(p.nameZh);});
    const guideX=svg.append('line').attr('stroke','var(--sun)').attr('stroke-dasharray','5 6');
    const guideY=svg.append('line').attr('stroke','var(--sun)').attr('stroke-dasharray','5 6');
    const cursor=svg.append('g');cursor.append('circle').attr('r',11).attr('fill','var(--sun)').attr('stroke','var(--bg)').attr('stroke-width',4);cursor.append('path').attr('d','M-18 0H18M0-18V18').attr('stroke','var(--sun)').attr('stroke-width',1.5);
    const input=document.getElementById('axisInput'), range=document.getElementById('axisRange');
    let state={a:planets.earth.semimajorAxisAU,p:Lec.P.keplerPeriodYearsFromAU(planets.earth.semimajorAxisAU)};
    function render(a,animate=true){a=Deck.clamp(Number(a)||0.3,0.3,35);const p=Lec.P.keplerPeriodYearsFromAU(a);const next={a,p};input.value=a.toFixed(2);range.value=a;document.getElementById('customA').textContent=a.toFixed(2);document.getElementById('customP').textContent=p.toFixed(2);gsap.to(state,{a,p,duration:animate&&!Deck.reduced()?.35:0,ease:'power2.out',overwrite:'auto',onUpdate(){const px=x(state.a),py=y(state.p);cursor.attr('transform',`translate(${px},${py})`);guideX.attr('x1',px).attr('x2',px).attr('y1',py).attr('y2',H-m.bottom);guideY.attr('x1',m.left).attr('x2',px).attr('y1',py).attr('y2',py);document.getElementById('periodBig').textContent=state.p.toFixed(2);}});}
    input.addEventListener('change',()=>render(input.value));range.addEventListener('input',()=>render(range.value));document.getElementById('reset').addEventListener('click',()=>render(planets.earth.semimajorAxisAU));
    render(state.a,false);
    if(!Deck.reduced()){const len=path.node().getTotalLength();gsap.fromTo(path.node(),{strokeDasharray:len,strokeDashoffset:len},{strokeDashoffset:0,duration:1.1,ease:'power2.out'});gsap.from(refG.selectAll('circle,text').nodes(),{autoAlpha:0,y:8,duration:.45,stagger:.12,delay:.5});}
  </script>
</body>
</html>
