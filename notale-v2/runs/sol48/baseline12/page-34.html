<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page-head{display:flex;flex-direction:column;justify-content:flex-start}
  .kicker{margin:0 0 8px;color:var(--orbit);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.14em}
  .page-head h1{margin:0}
  .closing-generalization{position:relative;display:flex;align-items:center;justify-content:center;margin:0 auto;width:100%;border-top:1px solid var(--line);color:var(--text);font-size:var(--fs-lead);font-weight:650;line-height:1.5;text-align:center;text-shadow:0 2px 14px var(--bg)}
  .k-generalization{align-self:center;width:min(1320px,100%);grid-template-rows:auto 62px minmax(0,1fr)}
  .k-generalization>.claim{position:relative;width:100%;padding:20px 28px;border-left-width:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--sun) 12%,transparent),transparent 72%);font-size:var(--fs-h2);text-align:center}
  .claim .claim-mark{display:block;margin-bottom:5px;color:var(--sun);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.12em}
  .k-generalization>.trunk{height:62px;transform-origin:bottom}
  .k-generalization>.supports{--support-cols:4;align-items:stretch}
  .k-generalization>.supports>.support{display:flex;min-height:430px;flex-direction:column;align-items:center;justify-content:center;gap:12px;margin:0 2px;padding:30px 18px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-left:1px solid var(--line);color:var(--text);text-align:center}
  .support .support-title{display:flex;width:100%;flex:1;align-items:center;justify-content:center;color:var(--text);font-size:var(--fs-body);font-weight:700;line-height:1.4}
  .support .support-line{display:flex;width:100%;flex:1;align-items:center;justify-content:center;margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
  .support .tag{margin-bottom:1px}
  .backdrop{opacity:.18;object-position:center bottom}
  @keyframes backdrop-in{from{opacity:0}to{opacity:.18}}
  @keyframes trunk-grow{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
  @keyframes support-in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes settle-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .backdrop{animation:backdrop-in 420ms ease-out both}
  .trunk{animation:trunk-grow 420ms cubic-bezier(.2,.75,.25,1) 220ms both}
  .support{animation:support-in 400ms ease-out both}
  .support:nth-child(1){animation-delay:420ms}.support:nth-child(2){animation-delay:500ms}.support:nth-child(3){animation-delay:580ms}.support:nth-child(4){animation-delay:660ms}
  .claim{animation:settle-in 430ms ease-out 760ms both}
  .closing-generalization{animation:settle-in 430ms ease-out 850ms both}
  @media (prefers-reduced-motion:reduce){.backdrop,.trunk,.support,.claim,.closing-generalization{animation:none!important;opacity:1;transform:none}}
</style>
</head>
<body data-page="34" data-total="34">
<div id="stage">
  <img class="backdrop" src="assets/img/planet-horizon-bg.png" alt="" title="生成插画（非真实照片）">

  <header class="page-head" style="height:88px">
    <p class="kicker">SYSTEM / HISTORY / EVIDENCE</p>
    <h1>把行星看成结果，也看成证据</h1>
  </header>

  <main class="k-generalization min0" style="flex:1" aria-label="太阳系共同历史的主张与四类支撑">
    <div class="claim">
      <span class="claim-mark">共同主张</span>
      太阳系不是一份成员名单，而是一段共同历史留下的系统。
    </div>
    <div class="trunk" aria-hidden="true"></div>
    <div class="supports min0">
      <section class="support min0">
        <span class="tag structure">结构</span>
        <div class="support-title">共同形成史的线索</div>
        <p class="support-line">同向、近共面与内外分区</p>
        <p class="support-line">让整体秩序显现出来</p>
      </section>
      <section class="support min0">
        <span class="tag structure">分化</span>
        <div class="support-title">同源世界的不同结果</div>
        <p class="support-line">日照、质量、物质与大气</p>
        <p class="support-line">让相邻世界走向不同</p>
      </section>
      <section class="support min0">
        <span class="tag evidence">演化</span>
        <div class="support-title">仍在变化的系统</div>
        <p class="support-line">引力、共振、碰撞与输运</p>
        <p class="support-line">至今仍在改写太阳系</p>
      </section>
      <section class="support min0">
        <span class="tag evidence">检验</span>
        <div class="support-title">可核验的证据链</div>
        <p class="support-line">飞越、环绕、着陆与采样返回</p>
        <p class="support-line">把解释交给测量检验</p>
      </section>
    </div>
  </main>

  <p class="closing-generalization" style="height:104px">每颗行星既是形成与演化的结果，也是我们检验这段历史的一份证据。</p>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:34,total:34});</script>
</body>
</html>
