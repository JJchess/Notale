<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .backdrop { opacity: .18; animation: scene-in 900ms ease-out forwards; }
    .opening-head { display:flex; flex-direction:column; justify-content:flex-end; }
    .kicker { margin:0 0 12px; color:var(--muted); font-family:var(--font-mono); font-size:var(--fs-label); line-height:1.4; letter-spacing:.12em; }
    .opening-head h1 { margin:0; }
    .opening-model { position:relative; width:1120px; margin-left:96px; align-self:flex-start; padding-top:30px; }
    .opening-model::before { position:absolute; z-index:-1; inset:-70px -170px -60px -150px; background:radial-gradient(ellipse at 22% 30%, color-mix(in srgb, var(--sun) 16%, transparent), transparent 58%), linear-gradient(90deg, color-mix(in srgb, var(--orbit) 7%, transparent), transparent 78%); content:""; }
    .system-field { position:absolute; z-index:-2; inset:-80px -190px -70px -140px; width:calc(100% + 330px); height:calc(100% + 150px); object-fit:cover; opacity:.16; pointer-events:none; }
    .opening-model > .claim { width:760px; padding:22px 28px; font-size:32px; background:linear-gradient(90deg, color-mix(in srgb, var(--sun) 10%, transparent), transparent); animation: claim-in 300ms 80ms ease-out forwards; }
    .opening-model > .trunk { position:relative; transform-origin:center top; animation:trunk-in 300ms 180ms ease-out forwards; }
    .opening-model > .trunk::after { position:absolute; left:18px; top:8px; width:76px; color:var(--orbit); content:"太阳系"; font-size:var(--fs-sec); font-weight:650; line-height:1.4; white-space:nowrap; }
    .opening-model > .supports { --support-cols:2; transform-origin:center top; animation:line-in 280ms 260ms ease-out forwards; }
    .opening-model > .supports > .support { margin:0; padding:36px 34px 12px; animation:support-in 520ms ease-out forwards; }
    .opening-model > .supports > .support:first-child { animation-delay:330ms; }
    .opening-model > .supports > .support:last-child { animation-delay:400ms; }
    .support strong { display:block; margin-bottom:8px; color:var(--text); font-size:26px; line-height:1.3; }
    .support > span { display:block; color:var(--muted); font-size:var(--fs-body); line-height:1.5; }
    .closing { display:flex; align-items:flex-end; margin:0; padding:0 0 14px 96px; color:var(--text); font-size:var(--fs-lead); line-height:1.5; animation:closing-in 320ms 480ms ease-out forwards; }
    .closing::before { width:42px; height:2px; margin:0 16px 12px 0; flex:0 0 auto; background:var(--sun); content:""; }
    @keyframes scene-in { from{opacity:0} to{opacity:.18} }
    @keyframes claim-in { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
    @keyframes line-in { from{opacity:0;transform:scaleX(0)} to{opacity:1;transform:scaleX(1)} }
    @keyframes trunk-in { from{opacity:0;transform:scaleY(0)} to{opacity:1;transform:scaleY(1)} }
    @keyframes support-in { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
    @keyframes closing-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    @media (prefers-reduced-motion: reduce) {
      .backdrop,.opening-model > .claim,.opening-model > .trunk,.opening-model > .supports,.opening-model > .supports > .support,.closing { animation:none; opacity:1; transform:none; }
      .backdrop { opacity:.18; }
    }
  </style>
</head>
<body data-page="1" data-total="34">
  <div id="stage">
    <img class="backdrop" src="assets/img/orbit-rings-bg.png" alt="" title="生成插画（非真实照片）">
    <div class="backdrop-note" aria-hidden="true">生成插画 · 非真实照片</div>

    <header class="opening-head" style="height:154px">
      <p class="kicker"><span>LECTURE 02</span><span> · </span><span>SOLAR SYSTEM</span></p>
      <h1><span>不是名单，</span><span>是系统</span></h1>
    </header>

    <main class="k-generalization opening-model min0" style="flex:1" aria-label="太阳系作为系统的主张与两个支撑">
      <img class="system-field" src="assets/img/orbit-rings-bg.png" alt="" aria-hidden="true">
      <div class="claim"><span>太阳系</span><span>是一套</span><span>系统</span></div>
      <div class="trunk" aria-hidden="true"></div>
      <div class="supports">
        <div class="support">
          <strong><span>有</span><span>结构</span></strong>
          <span><span>成员之间</span><span>存在整体关系</span></span>
        </div>
        <div class="support">
          <strong><span>会</span><span>演化</span></strong>
          <span><span>形成之后</span><span>仍持续改变</span></span>
        </div>
      </div>
    </main>

    <p class="closing" style="height:104px"><span>太阳系</span><span>不是八颗行星的名单，</span><span>而是一套</span><span>有结构、</span><span>会演化的</span><span>系统。</span></p>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>Deck.init({index:1,total:34});</script>
</body>
</html>
