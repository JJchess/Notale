<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .chapter-kicker{color:var(--orbit);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.12em;margin-bottom:8px}
    .flow-map{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:8px 70px 0}
    .flow-map.k-generalization{grid-template-rows:auto 78px auto 42px auto;justify-items:stretch}
    .flow-map .supports{border-top:0;border-bottom:1px solid rgba(76,201,240,.62);align-items:end}
    .flow-map.k-generalization>.supports>.support{display:flex;min-height:210px;padding:18px 24px 30px;flex-direction:column;justify-content:center;color:var(--text);text-align:center;border-inline:1px solid rgba(76,201,240,.24);border-top:1px solid rgba(76,201,240,.24)}
    .flow-map.k-generalization>.supports>.support::before{top:auto;bottom:0;height:22px}
    .support-index{color:var(--orbit);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.08em}
    .support-kind{margin-top:7px;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
    .support-text{margin-top:5px;font-size:var(--fs-lead);font-weight:650;line-height:1.4}
    .flow-map>.trunk{height:78px;background:linear-gradient(var(--orbit),var(--orbit));transform-origin:top;animation:grow-trunk .35s .9s both}
    .flow-map>.claim{width:min(100%,920px);padding:16px 24px;border-left:0;border-top:2px solid var(--orbit);border-bottom:2px solid var(--orbit);text-align:center;background:rgba(5,9,20,.56);animation:claim-in .32s 1.05s both}
    .claim-label{display:block;margin-bottom:4px;color:var(--orbit);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.1em}
    .flow-map>.question-trunk{justify-self:center;width:2px;height:42px;background:var(--sun);transform-origin:top;animation:grow-trunk .25s 1.3s both}
    .question{justify-self:center;width:min(100%,980px);padding:14px 24px;color:var(--sun);font-size:28px;font-weight:720;line-height:1.35;text-align:center;animation:question-in .4s 1.4s both}
    .question-label{display:block;margin-bottom:3px;font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.12em}
    .support{animation:support-in .42s both}.support:nth-child(1){animation-delay:.1s}.support:nth-child(2){animation-delay:.32s}.support:nth-child(3){animation-delay:.54s}
    .closing{display:flex;align-items:flex-end;justify-content:space-between;gap:50px;border-top:1px solid var(--line);padding-top:14px}
    .closing p{margin:0}.closing .lead{max-width:830px}.handoff{max-width:540px;color:var(--muted);font-size:var(--fs-sec);line-height:1.5;text-align:right}
    @keyframes support-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes grow-trunk{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes claim-in{from{opacity:0}to{opacity:1}}
    @keyframes question-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.support,.flow-map>.trunk,.flow-map>.claim,.flow-map>.question-trunk,.question{animation:none}}
  </style>
</head>
<body data-page="10" data-total="34">
  <div id="stage">
    <img class="backdrop" src="assets/img/orbit-rings-bg.png" alt="" title="生成插画（非真实照片）" style="opacity:.18">
    <div class="backdrop-note">AI生成</div>

    <header style="height:92px">
      <div class="chapter-kicker">CHAPTER I · TRANSITION</div>
      <h1>这些规律来自哪里？</h1>
    </header>

    <main class="flow-map k-generalization min0" style="flex:1" aria-label="三条太阳系结构规律汇入共同形成史问题">
      <svg aria-hidden="true" viewBox="0 0 1348 570" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible">
        <path d="M125 86 C125 225 470 245 674 330" fill="none" stroke="var(--orbit)" stroke-opacity=".42" stroke-width="2"/>
        <path d="M674 86 L674 330" fill="none" stroke="var(--orbit)" stroke-opacity=".55" stroke-width="2"/>
        <path d="M1223 86 C1223 225 878 245 674 330" fill="none" stroke="var(--orbit)" stroke-opacity=".42" stroke-width="2"/>
        <circle cx="674" cy="330" r="8" fill="var(--bg)" stroke="var(--orbit)" stroke-width="2"/>
        <path d="M674 380 L674 505" fill="none" stroke="var(--sun)" stroke-opacity=".75" stroke-width="2"/>
      </svg>
      <div class="supports" style="--support-cols:3">
        <span style="position:absolute;left:0;top:-34px;color:var(--orbit);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.1em">已知结构 · 三条相互呼应的线索</span>
        <section class="support">
          <span class="support-index">线索 01</span>
          <span class="support-kind">轨道秩序</span>
          <span class="support-text">大体同向、近乎共面</span>
        </section>
        <section class="support">
          <span class="support-index">线索 02</span>
          <span class="support-kind">内外分区</span>
          <span class="support-text">内侧以岩质行星为主，外侧是巨行星</span>
        </section>
        <section class="support">
          <span class="support-index">线索 03</span>
          <span class="support-kind">性质关联</span>
          <span class="support-text">大小、密度与成分呈系统分区</span>
        </section>
      </div>
      <div class="trunk" aria-hidden="true"></div>
      <div class="claim">
        <span class="claim-label">三条线索共同指向</span>
        <span>太阳系的结构不是随机拼盘</span>
      </div>
      <div class="question-trunk" aria-hidden="true"></div>
      <div class="question">
        <span class="question-label">NEXT QUESTION</span>
        <span>共同的形成起点，为何产生不同世界？</span>
      </div>
    </main>

    <footer class="closing" style="height:112px">
      <p class="lead">这些规律彼此呼应，像是共同形成史留下的线索。结构给出线索，下一步要问：同一套起点为何长成不同世界。</p>
      <p class="handoff"><span style="display:block;color:var(--orbit);font-weight:650">下一章</span><span>先看年轻恒星周围今天仍能观测到的盘。</span></p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>Deck.init({index:10,total:34});</script>
</body>
</html>
