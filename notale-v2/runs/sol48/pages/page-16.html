<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .kicker{margin:0;color:var(--orbit);font:700 var(--fs-label)/1.3 var(--font-mono);letter-spacing:.14em}
    .hero{display:flex;gap:28px;align-items:stretch;min-height:0}
    .visual{display:flex;flex:0 0 570px;min-width:0;flex-direction:column;align-items:center;justify-content:center}
    .photo-note{margin:0 0 8px;color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
    .reveal{--cut:50%;position:relative;width:510px;height:510px;overflow:hidden;border:1px solid var(--line);border-radius:50%;background:var(--surface);isolation:isolate;touch-action:none;cursor:ew-resize;box-shadow:0 0 0 1px rgba(76,201,240,.18)}
    .reveal:focus-visible{outline:3px solid var(--focus);outline-offset:6px}
    .reveal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none;pointer-events:none}
    .reveal .venus{z-index:2;clip-path:inset(0 calc(100% - var(--cut)) 0 0);filter:brightness(1.04)}
    .reveal .earth{z-index:1}
    .divider{position:absolute;z-index:3;top:0;bottom:0;left:var(--cut);width:3px;transform:translateX(-1.5px);background:var(--sun);box-shadow:0 0 16px rgba(255,183,3,.75);pointer-events:none}
    .divider::after{position:absolute;top:50%;left:50%;width:30px;height:54px;transform:translate(-50%,-50%);border:2px solid var(--sun);border-radius:999px;background:var(--bg);content:"↔";display:grid;place-items:center;color:var(--sun);font:700 18px/50px var(--font-mono);text-align:center}
    .edge-label{position:absolute;z-index:4;top:24px;padding:5px 10px;border:1px solid currentColor;border-radius:999px;background:var(--bg);font-size:var(--fs-label);font-weight:700;line-height:1.35;transition:color 180ms,opacity 180ms}
    .edge-label.v{left:25px}.edge-label.e{right:25px}
    .comparison-wrap{display:flex;flex:1;min-width:0;flex-direction:column;justify-content:center}
    .k-comparison{grid-template-columns:190px repeat(2,minmax(0,1fr));align-content:center}
    .k-comparison>.cell{display:flex;align-items:center;justify-content:center;min-height:61px;color:var(--text);font-size:var(--fs-sec);line-height:1.4;text-align:center;transition:color 180ms,opacity 180ms}
    .k-comparison>.hdr{padding-top:5px}
    .k-comparison>.temp{min-height:84px}
    .k-comparison>.temp .unit{font-size:var(--fs-body)}
    .k-comparison>.note-cell{justify-content:flex-start;text-align:left;color:var(--muted)}
    .k-comparison .active{color:var(--sun)!important;opacity:1}
    .k-comparison .quiet{opacity:.52}
    .controls{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:18px}
    .controls .hint{margin:0;font-size:var(--fs-sec)}
    .closing{display:flex;align-items:center;justify-content:space-between;gap:28px;border-top:1px solid var(--line)}
    .closing p{margin:0;font-size:var(--fs-lead);line-height:1.45}
    .next{flex:0 0 auto;color:var(--muted)!important;font-size:var(--fs-sec)!important}
    @media (prefers-reduced-motion:reduce){.k-comparison>*,.edge-label{transition:none}}
  </style>
</head>
<body data-page="16" data-total="34">
  <div id="stage">
    <header style="height:82px">
      <p class="kicker">SISTER WORLDS</p>
      <h1 style="margin-top:4px">大小相近，为何表面相差 <span id="titleDiff" class="num">—</span>°C？</h1>
    </header>

    <main class="hero min0" style="flex:1">
      <section class="visual min0" aria-labelledby="photoCaption">
        <p id="photoCaption" class="photo-note">真实照片窗口｜外观不代表自然色一致</p>
        <div id="reveal" class="reveal no-pan" role="slider" tabindex="0" aria-label="金星与地球照片揭示线" aria-valuemin="10" aria-valuemax="90" aria-valuenow="50" aria-valuetext="金星与地球各显示一半">
          <img class="earth" src="assets/img/earth-apollo17.jpg" alt="阿波罗任务拍摄的地球真实照片" title="Apollo 17 Harrison H. Schmitt and Tracy's Rock - AS17-140-21493+AS17-140-21497 2025.jpg · Eugene A. CernanPhotomontage by User:Grunpfnul · Public domain">
          <img class="venus" src="assets/img/venus-magellan.jpg" alt="" aria-hidden="true" title="Cylindrical Map of Venus.jpg · NASA / Jet Propulsion Laboratory · Public domain">
          <span id="venusEdge" class="edge-label v">金星</span>
          <span id="earthEdge" class="edge-label e">地球</span>
          <span class="divider" aria-hidden="true"></span>
        </div>
      </section>

      <section class="comparison-wrap min0" aria-label="金星与地球四项对齐比较">
        <div class="k-comparison" style="--compare-cols:2">
          <div></div><div id="venusHdr" class="hdr">金星</div><div id="earthHdr" class="hdr">地球</div>
          <div class="axis"></div>
          <div class="dim">平均直径</div><div id="venusDiameter" class="cell num">—</div><div id="earthDiameter" class="cell num">—</div>
          <div class="rowline"></div>
          <div class="dim">距太阳与所受辐照</div><div id="venusFlux" class="cell">—</div><div id="earthFlux" class="cell">—</div>
          <div class="rowline"></div>
          <div class="dim">大气与表面水</div><div id="venusAir" class="cell">浓厚、以 CO₂ 为主；<br>今天无稳定表面海洋</div><div id="earthAir" class="cell">以 N₂、O₂ 为主；<br>海洋参与持续水循环</div>
          <div class="rowline"></div>
          <div class="dim diff">全球典型表面温度</div><div id="venusTemp" class="cell temp diff"><span class="big sm"><span class="num">—</span><span class="unit">°C</span></span></div><div id="earthTemp" class="cell temp diff"><span class="big sm"><span class="num">—</span><span class="unit">°C</span></span></div>
          <div class="rowline"></div>
          <div class="dim">历史不确定性</div><div class="cell note-cell" style="grid-column:2/-1">金星早期水的数量与流失路径仍有研究不确定性。</div>
        </div>
        <div class="controls">
          <p class="hint">悬停或拖动揭示线；方向键也可逐步比较</p>
          <button id="reset" class="btn" type="button">复位对半</button>
        </div>
      </section>
    </main>

    <footer class="closing" style="height:94px">
      <p>金星和地球大小相近，却因日照、大气与水循环历史共同作用，成为两种表面。温差不是一个旋钮造成的。</p>
      <p class="next">下一问：液态环境一定要在行星表面吗？</p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    (() => {
      Deck.init({index:16,total:34});
      const venus=Lec.K.planets.venus, earth=Lec.K.planets.earth;
      const c=k=>k.meanSurfaceTemperatureK-273.15;
      const vTemp=Math.round(c(venus)), eTemp=Math.round(c(earth));
      const fmtKm=v=>Math.round(v).toLocaleString('zh-CN');
      document.querySelector('#venusDiameter').textContent=`约 ${fmtKm(Lec.P.diameterKm(venus))} km`;
      document.querySelector('#earthDiameter').textContent=`约 ${fmtKm(Lec.P.diameterKm(earth))} km`;
      document.querySelector('#venusFlux').textContent=`${venus.semimajorAxisAU.toFixed(3)} AU；约地球的 ${Lec.P.solarFluxRelativeToEarth(venus.semimajorAxisAU).toFixed(2)} 倍`;
      document.querySelector('#earthFlux').textContent=`${earth.semimajorAxisAU.toFixed(3)} AU；${Lec.P.solarFluxRelativeToEarth(earth.semimajorAxisAU).toFixed(2)} 倍`;
      document.querySelector('#venusTemp .num').textContent=`约 ${vTemp}`;
      document.querySelector('#earthTemp .num').textContent=`约 ${eTemp}`;
      document.querySelector('#titleDiff').textContent=Math.round(c(venus)-c(earth));

      const el=document.querySelector('#reveal');
      const groups={venus:['#venusHdr','#venusDiameter','#venusFlux','#venusAir','#venusTemp','#venusEdge'],earth:['#earthHdr','#earthDiameter','#earthFlux','#earthAir','#earthTemp','#earthEdge']};
      let value=50, dragging=false;
      function set(v){
        value=Deck.clamp(v,10,90); el.style.setProperty('--cut',`${value}%`); el.setAttribute('aria-valuenow',Math.round(value));
        const side=value>50?'venus':value<50?'earth':'both';
        el.setAttribute('aria-valuetext',side==='both'?'金星与地球各显示一半':side==='venus'?'显示更多金星':'显示更多地球');
        for(const [name,selectors] of Object.entries(groups)) selectors.forEach(s=>{const n=document.querySelector(s);n.classList.toggle('active',side===name);n.classList.toggle('quiet',side!=='both'&&side!==name)});
      }
      function fromEvent(e){const p=Deck.pt(el,e);set(p.x/el.offsetWidth*100)}
      el.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')fromEvent(e)});
      el.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||dragging)fromEvent(e)});
      el.addEventListener('pointerdown',e=>{dragging=true;el.setPointerCapture(e.pointerId);fromEvent(e)});
      el.addEventListener('pointerup',()=>dragging=false); el.addEventListener('pointercancel',()=>dragging=false);
      el.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();set(value+(e.key==='ArrowRight'?2:-2))}else if(e.key==='Home'){e.preventDefault();set(10)}else if(e.key==='End'){e.preventDefault();set(90)}});
      document.querySelector('#reset').addEventListener('click',()=>{set(50);el.focus()});
      set(50);
    })();
  </script>
</body>
</html>
