<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .kicker{color:var(--orbit);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:650;letter-spacing:.12em;line-height:1.35}
  .process-wrap{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:hidden}
  .system-field{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;opacity:.34;mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);pointer-events:none}
  .process-wrap>.time-ends,.process-wrap>.k-process{position:relative;z-index:1}
  .process-wrap::before{position:absolute;left:-56px;top:8%;width:390px;height:84%;background:linear-gradient(90deg,rgba(255,183,3,.14),rgba(255,183,3,0));clip-path:polygon(0 22%,100% 0,100% 100%,0 78%);content:"";pointer-events:none}
  .time-ends{display:flex;justify-content:space-between;margin:0 18px 14px;color:var(--muted);font-family:var(--font-mono);font-size:var(--fs-label);line-height:1.35}
  .k-process{min-height:310px;flex:none}
  .k-process>.axis{top:76%;transform:scaleX(0);transform-origin:left;animation:axis-in 1.15s .18s ease-out forwards}
  .k-process>.axis::after{position:absolute;right:0;top:-6px;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid var(--orbit);content:""}
  .step{opacity:0;transform:translateY(16px);animation:step-in .48s ease-out forwards}
  .step:nth-of-type(2){animation-delay:.18s}.step:nth-of-type(4){animation-delay:.48s}.step:nth-of-type(6){animation-delay:.78s}
  .step h2{margin:12px 0 8px;font-size:28px}
  .step p{max-width:330px;margin:0;color:inherit;font-size:var(--fs-lead);line-height:1.5}
  .stage-visual{display:block;width:100%;height:126px;margin:12px 0 4px;color:var(--orbit);overflow:visible}
  .stage-visual .faint{opacity:.22}.stage-visual .mid{opacity:.48}.stage-visual .hot{color:inherit}
  .step .phase{color:var(--faint);font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.08em;line-height:1.35}
  .step[aria-current="step"] h2,.step[aria-current="step"] .stage-visual .hot{color:var(--sun)}
  .arw{flex-direction:column;gap:11px}
  .arw span{position:absolute;top:31%;left:50%;width:128px;transform:translateX(-50%);color:var(--muted);font-family:var(--font-sans);font-size:var(--fs-sec);font-weight:620;line-height:1.4;text-align:center}
  .orbit-dot{position:absolute;z-index:3;left:0;top:calc(76% - 7px);width:14px;height:14px;border:3px solid var(--bg);border-radius:50%;background:var(--sun);box-shadow:0 0 22px rgba(255,183,3,.75);animation:dot-run 1.25s .25s cubic-bezier(.2,.72,.25,1) both}
  .closing{display:flex;align-items:center;gap:34px;border-top:1px solid rgba(76,201,240,.25)}
  .closing .marker{width:7px;height:78px;flex:0 0 auto;background:var(--sun)}
  .closing p{margin:0}.closing .lead{font-weight:650}
  .handoff{display:flex;align-items:center;justify-content:flex-end;border-top:1px solid rgba(76,201,240,.18);color:var(--muted)}
  .handoff strong{margin-left:12px;color:var(--text);font-size:var(--fs-lead);font-weight:650}
  @keyframes step-in{to{opacity:1;transform:none}}
  @keyframes axis-in{to{transform:scaleX(1)}}
  @keyframes dot-run{from{left:0;opacity:0}15%{opacity:1}to{left:84%;opacity:1}}
  @media (prefers-reduced-motion:reduce){.step,.k-process>.axis,.orbit-dot{animation:none;opacity:1;transform:none}.orbit-dot{left:84%}}
</style>
</head>
<body data-page="19" data-total="34">
<div id="stage">
  <img class="backdrop" src="assets/img/orbit-rings-bg.png" alt="" title="生成插画（非真实照片）" style="opacity:.18">
  <span class="backdrop-note">生成插画</span>

  <header style="height:122px">
    <div class="kicker">CHAPTER II · TRANSITION</div>
    <h1 style="margin-top:12px">太阳系没有冻结在诞生那一天</h1>
  </header>

  <main class="process-wrap min0" style="flex:1" aria-label="从形成到持续运行的过程">
    <img class="system-field" src="assets/img/orbit-rings-bg.png" alt="" aria-hidden="true">
    <div class="time-ends" aria-hidden="true"><span>形成时</span><span>形成后的格局</span><span>今天</span></div>
    <div class="k-process min0">
      <div class="axis"></div>
      <section class="step done min0">
        <span class="phase">01 · INITIAL</span>
        <span class="tag structure" style="align-self:flex-start">共同形成</span>
        <svg class="stage-visual" viewBox="0 0 360 126" aria-hidden="true">
          <ellipse class="faint" cx="180" cy="64" rx="154" ry="48" fill="currentColor"/>
          <ellipse cx="180" cy="64" rx="154" ry="48" fill="none" stroke="currentColor" stroke-width="2"/>
          <ellipse class="mid" cx="180" cy="64" rx="104" ry="30" fill="none" stroke="currentColor" stroke-width="3"/>
          <circle class="hot" cx="180" cy="64" r="13" fill="currentColor"/>
        </svg>
        <h2>原行星盘提供共同起点</h2>
      </section>
      <div class="arw" aria-label="塑造"><span>塑造</span></div>
      <section class="step done min0">
        <span class="phase">02 · PATTERN</span>
        <span class="tag structure" style="align-self:flex-start">总体分区</span>
        <svg class="stage-visual" viewBox="0 0 360 126" aria-hidden="true">
          <circle class="hot" cx="48" cy="63" r="15" fill="currentColor"/>
          <ellipse class="mid" cx="48" cy="63" rx="72" ry="27" fill="none" stroke="currentColor" stroke-width="3"/>
          <ellipse cx="48" cy="63" rx="126" ry="45" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="111" cy="63" r="7" fill="currentColor"/><circle cx="170" cy="63" r="10" fill="currentColor"/>
          <circle class="faint" cx="260" cy="63" r="28" fill="currentColor"/><circle cx="260" cy="63" r="13" fill="currentColor"/>
        </svg>
        <h2>距离、材料与质量留下结构差异</h2>
      </section>
      <div class="arw" aria-label="但没有定格"><span>但没有定格</span></div>
      <section class="step min0" aria-current="step">
        <span class="phase">03 · ONGOING</span>
        <span class="tag attention" style="align-self:flex-start">持续运行</span>
        <svg class="stage-visual" viewBox="0 0 360 126" aria-hidden="true">
          <circle class="hot" cx="72" cy="63" r="15" fill="currentColor"/>
          <ellipse cx="72" cy="63" rx="112" ry="44" fill="none" stroke="currentColor" stroke-width="3"/>
          <ellipse class="mid" cx="72" cy="63" rx="166" ry="58" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle class="hot" cx="179" cy="50" r="9" fill="currentColor"/>
          <path d="M190 46 L218 37" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M211 31 L221 36 L214 45" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="228" cy="86" r="6" fill="currentColor"/>
        </svg>
        <h2>引力仍让轨道与天体彼此影响</h2>
      </section>
      <span class="orbit-dot" aria-hidden="true"></span>
    </div>
  </main>

  <section class="closing min0" style="height:154px" aria-label="本章收束">
    <span class="marker" aria-hidden="true"></span>
    <div>
      <p class="lead">共同形成史解释了太阳系为何呈现总体分区。</p>
      <p class="small" style="margin-top:6px">形成解释了总体分区，却没有把太阳系冻结在诞生那一天。</p>
      <p class="small" style="margin-top:6px">形成只给出起点；太阳系今天仍是一套正在运行、继续变化的系统。</p>
    </div>
  </section>

  <footer class="handoff min0" style="height:88px">
    <span class="tag structure">下一步</span>
    <strong>距离太阳更远时，“一年”会怎样改变？</strong>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>

</body>
</html>
