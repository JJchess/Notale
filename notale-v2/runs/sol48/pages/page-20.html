<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .kicker{color:var(--orbit);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.12em}
    .chart-svg{display:block;width:100%;height:100%}
    .chart-svg text{font-family:var(--font-sans);fill:var(--muted);font-size:14px}
    .chart-svg .tick text{font-family:var(--font-mono);font-size:13px}
    .chart-svg .domain,.chart-svg .tick line{stroke:var(--line)}
    .chart-svg .grid line{stroke:var(--line);stroke-dasharray:3 7;opacity:.7}
    .chart-svg .curve{fill:none;stroke:var(--orbit);stroke-width:4}
    .chart-svg .guide{stroke:var(--sun);stroke-width:2;stroke-dasharray:6 6}
    .chart-svg .base-dot{fill:var(--bg);stroke:var(--orbit);stroke-width:3}
    .chart-svg .cursor{fill:var(--sun);stroke:var(--bg);stroke-width:4}
    .number-input{width:132px;min-height:42px;padding:6px 10px;border:1px solid var(--orbit);border-radius:8px;color:var(--text);background:var(--bg);font:650 var(--fs-body)/1.4 var(--font-mono)}
    .number-input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    .value-cell{text-align:center;font:650 var(--fs-body)/1.4 var(--font-mono)}
    .summary{border-left:4px solid var(--sun);padding-left:16px;color:var(--text);font-size:var(--fs-lead);line-height:1.45}
  </style>
</head>
<body data-page="20" data-total="34">
  <div id="stage">
    <header style="height:82px">
      <div class="kicker">DYNAMIC SYSTEM · E3</div>
      <h1 style="margin:6px 0 0">离太阳越远，一年增长得越快</h1>
    </header>

    <main class="min0" style="flex:1;display:flex;flex-direction:column;gap:14px">
      <section class="min0" style="height:360px;display:flex;gap:20px">
        <div class="cvbox min0" style="flex:1;border:1px solid var(--line)" aria-label="半长轴与公转周期函数图">
          <svg id="chart" class="chart-svg" role="img" aria-labelledby="chart-title chart-desc">
            <title id="chart-title">半长轴越大，公转周期向上弯曲增长</title>
            <desc id="chart-desc">横轴为半长轴，纵轴为地球年；标出地球、木星、海王星和当前输入。</desc>
          </svg>
        </div>
        <aside class="panel min0" style="width:420px;display:flex;flex-direction:column;justify-content:space-between">
          <div>
            <div class="small">轨道平均尺度</div>
            <div style="display:flex;align-items:baseline;gap:8px;margin-top:4px">
              <input id="axisInput" class="number-input" type="number" min="0.3" max="35" step="0.1" value="1.00" aria-label="半长轴，单位 AU">
              <span class="unit">AU</span>
            </div>
          </div>
          <div>
            <div class="small">这一轨道的一年</div>
            <div><span id="periodRead" class="big sm">1.00</span><span class="unit">地球年</span></div>
          </div>
          <div class="ctl" style="display:block">
            <label for="axisRange" style="display:block;margin-bottom:6px">拖动并比较</label>
            <input id="axisRange" type="range" min="0.3" max="35" step="0.1" value="1" style="width:100%">
          </div>
          <div class="hint">半长轴是轨道的平均尺度，不是此刻距离。</div>
          <button id="resetBtn" class="btn" type="button">复位到地球</button>
        </aside>
      </section>

      <section class="k-comparison min0" style="--compare-cols:4;height:226px">
        <div></div>
        <div class="hdr diff">自定义轨道</div><div class="hdr">地球</div><div class="hdr">木星</div><div class="hdr">海王星</div>
        <div class="dim">半长轴 a</div>
        <div id="customA" class="value-cell diff">1.00 AU</div><div id="earthA" class="value-cell"></div><div id="jupiterA" class="value-cell"></div><div id="neptuneA" class="value-cell"></div>
        <div class="rowline"></div>
        <div class="dim">公转周期 P</div>
        <div id="customP" class="value-cell diff">1.00 地球年</div><div id="earthP" class="value-cell"></div><div id="jupiterP" class="value-cell"></div><div id="neptuneP" class="value-cell"></div>
        <div class="axis"></div>
      </section>
    </main>

    <footer style="height:112px;display:flex;flex-direction:column;justify-content:flex-end;gap:7px">
      <div class="summary">轨道尺度增大一倍，一年不只增大一倍；更远的行星既要走更大的轨道，通常也运行得更慢。</div>
      <div class="lead" style="margin:0">半长轴越大，公转周期增长得更快：海王星的一年约等于 165 个地球年。</div>
      <div class="small">下一步：行星在这一年里，会不会始终以同样速度前进？</div>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script src="assets/lib/gsap.min.js"></script>
  <script>
  (function(){
    Deck.init({index:20,total:34});
    var planets=Lec.K.planets;
    var refs=[
      {key:'earth',name:'地球',a:planets.earth.semimajorAxisAU},
      {key:'jupiter',name:'木星',a:planets.jupiter.semimajorAxisAU},
      {key:'neptune',name:'海王星',a:planets.neptune.semimajorAxisAU}
    ];
    refs.forEach(function(d){d.p=Lec.P.keplerPeriodYearsFromAU(d.a);});
    function aText(v){return v.toFixed(v<2?8:4)+' AU';}
    function pText(v){return v.toFixed(v<2?2:(v<100?2:1))+' 地球年';}
    refs.forEach(function(d){
      document.getElementById(d.key+'A').textContent=aText(d.a);
      document.getElementById(d.key+'P').textContent=pText(d.p);
    });

    var svg=d3.select('#chart'), W=1028,H=358,m={top:34,right:34,bottom:54,left:78};
    svg.attr('viewBox','0 0 '+W+' '+H);
    var iw=W-m.left-m.right, ih=H-m.top-m.bottom;
    var x=d3.scaleLinear().domain([0.3,35]).range([0,iw]);
    var y=d3.scaleLinear().domain([0,210]).range([ih,0]);
    var g=svg.append('g').attr('transform','translate('+m.left+','+m.top+')');
    g.append('g').attr('class','grid').call(d3.axisLeft(y).ticks(5).tickSize(-iw).tickFormat(''));
    g.append('g').attr('transform','translate(0,'+ih+')').call(d3.axisBottom(x).tickValues([0.3,5,10,20,30,35]));
    g.append('g').call(d3.axisLeft(y).ticks(5));
    g.append('text').attr('x',iw/2).attr('y',ih+44).attr('text-anchor','middle').text('半长轴 a（AU）');
    g.append('text').attr('transform','rotate(-90)').attr('x',-ih/2).attr('y',-54).attr('text-anchor','middle').text('公转周期 P（地球年）');
    g.append('text').attr('x',12).attr('y',-12).style('fill','var(--orbit)').style('font-size','16px').text('课堂近似 P²=a³');
    g.append('text').attr('x',iw).attr('y',-12).attr('text-anchor','end').text('绕太阳；a 用 AU，P 用地球年');
    var data=d3.range(0.3,35.01,0.08).map(function(a){return {a:a,p:Lec.P.keplerPeriodYearsFromAU(a)};});
    var line=d3.line().x(function(d){return x(d.a)}).y(function(d){return y(d.p)});
    var path=g.append('path').datum(data).attr('class','curve').attr('d',line);
    var rg=g.selectAll('.ref').data(refs).join('g').attr('class','ref').attr('transform',function(d){return 'translate('+x(d.a)+','+y(d.p)+')'});
    rg.append('circle').attr('class','base-dot').attr('r',7);
    rg.append('text').attr('x',function(d){return d.key==='neptune'?-10:10}).attr('y',function(d){return d.key==='earth'?-12:5}).attr('text-anchor',function(d){return d.key==='neptune'?'end':'start'}).style('fill','var(--text)').text(function(d){return d.name});
    var vline=g.append('line').attr('class','guide'), hline=g.append('line').attr('class','guide'), cursor=g.append('circle').attr('class','cursor').attr('r',9);
    var range=document.getElementById('axisRange'), input=document.getElementById('axisInput');
    var state={a:1,p:1};
    function render(a,animate){
      a=Math.max(0.3,Math.min(35,Number(a)||1)); var p=Lec.P.keplerPeriodYearsFromAU(a);
      state.a=a;state.p=p; range.value=a; input.value=a.toFixed(2);
      document.getElementById('customA').textContent=a.toFixed(2)+' AU';
      document.getElementById('customP').textContent=pText(p);
      var target={v:parseFloat(document.getElementById('periodRead').textContent)||p};
      if(animate&&!Deck.reduced()) gsap.to(target,{v:p,duration:.35,ease:'power2.out',overwrite:true,onUpdate:function(){document.getElementById('periodRead').textContent=target.v.toFixed(target.v<10?2:1);}});
      else document.getElementById('periodRead').textContent=p.toFixed(p<10?2:1);
      var attrs={x:x(a),yp:y(p)};
      if(animate&&!Deck.reduced()){
        gsap.to(vline.node(),{attr:{x1:attrs.x,x2:attrs.x,y1:attrs.yp,y2:ih},duration:.35,ease:'power2.out',overwrite:true});
        gsap.to(hline.node(),{attr:{x1:0,x2:attrs.x,y1:attrs.yp,y2:attrs.yp},duration:.35,ease:'power2.out',overwrite:true});
        gsap.to(cursor.node(),{attr:{cx:attrs.x,cy:attrs.yp},duration:.35,ease:'power2.out',overwrite:true});
      }else{vline.attr('x1',attrs.x).attr('x2',attrs.x).attr('y1',attrs.yp).attr('y2',ih);hline.attr('x1',0).attr('x2',attrs.x).attr('y1',attrs.yp).attr('y2',attrs.yp);cursor.attr('cx',attrs.x).attr('cy',attrs.yp);}
    }
    range.addEventListener('input',function(){render(this.value,true)});
    input.addEventListener('input',function(){if(this.value!=='')render(this.value,true)});
    input.addEventListener('change',function(){render(this.value,true)});
    document.getElementById('resetBtn').addEventListener('click',function(){render(1,true);range.focus();});
    render(1,false);
    if(!Deck.reduced()){
      var len=path.node().getTotalLength();
      gsap.fromTo(path.node(),{strokeDasharray:len,strokeDashoffset:len},{strokeDashoffset:0,duration:1.1,ease:'power2.out'});
      gsap.from(rg.nodes(),{scale:0,transformOrigin:'center',duration:.35,stagger:.16,delay:.65,ease:'back.out(1.7)'});
    }
  })();
  </script>
</body>
</html>
