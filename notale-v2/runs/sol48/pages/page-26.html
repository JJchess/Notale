<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .kicker{color:var(--orbit);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.12em;margin-bottom:5px}
    .decision{--compare-cols:3;grid-template-columns:150px repeat(3,minmax(0,1fr));font-size:var(--fs-sec)}
    .decision>div:not(.dim):not(.hdr):not(.rowline):not(.axis){font-size:var(--fs-sec);line-height:1.4;text-align:center;transition:color 200ms ease-out,box-shadow 200ms ease-out}
    .decision .hdr{padding-top:7px;padding-bottom:9px}
    .decision .dim,.decision>div{padding-top:7px;padding-bottom:7px}
    .decision [data-col].chosen{box-shadow:inset 3px 0 0 var(--sun);color:var(--sun)}
    .decision [data-col]{opacity:0;transform:translateY(12px);animation:enter 520ms ease-out forwards}
    .decision [data-col="1"]{animation-delay:80ms}.decision [data-col="2"]{animation-delay:150ms}.decision [data-col="3"]{animation-delay:220ms}
    @keyframes enter{to{opacity:1;transform:none}}
    .sim{display:flex;gap:18px;min-height:0}
    .orbit-view{flex:1;min-width:0;position:relative;border:1px solid rgba(76,201,240,.34);border-radius:12px;overflow:hidden}
    .orbit-view svg{width:100%;height:100%;display:block}
    .base-path{fill:none;stroke:var(--orbit);stroke-width:3;opacity:.62;stroke-dasharray:9 8}
    .branch{fill:none;stroke:var(--orbit);stroke-width:4;stroke-dasharray:520;stroke-dashoffset:520;transition:stroke-dashoffset 700ms ease-out}
    .branch.show{stroke-dashoffset:0}.measure{stroke:var(--sun);stroke-width:2;opacity:0;transition:opacity 200ms}.measure.show{opacity:1}
    .readout{width:310px;display:flex;flex-direction:column;justify-content:center}.status{min-height:48px;color:var(--text);font-size:var(--fs-sec);line-height:1.5;margin-top:8px}
    .evidence-window{width:250px;display:flex;flex-direction:column;gap:7px}.evidence-window img{width:100%;height:146px;object-fit:cover}.caption{color:var(--muted);font-size:var(--fs-sec);line-height:1.4}
    .chosen-head{border-color:var(--sun)!important;color:var(--sun)!important}
    @media (prefers-reduced-motion:reduce){.decision [data-col]{opacity:1;transform:none;animation:none}.branch,.measure{transition:none}}
  </style>
</head>
<body data-page="26" data-total="34">
  <div id="stage">
    <header style="height:74px">
      <div class="kicker">PLANETARY DEFENSE</div>
      <h1 style="margin:0">提前一点，偏开很远</h1>
    </header>

    <main class="min0" style="flex:1;display:flex;flex-direction:column;gap:12px">
      <section class="k-comparison decision min0" aria-label="三种偏转决策的逐项比较">
        <div class="dim">距离预计相撞</div>
        <div class="hdr" data-col="1">提前 10 年</div>
        <div class="hdr" data-col="2">提前 1 年</div>
        <div class="hdr" data-col="3">最后 1 个月</div>
        <div class="rowline"></div>
        <div class="dim">行动</div><div data-col="1">动能撞击，轻推轨道</div><div data-col="2">动能撞击，轻推轨道</div><div data-col="3">试图爆破解体</div>
        <div class="rowline"></div>
        <div class="dim">速度变化</div><div data-col="1"><span class="num">1</span> cm/s</div><div data-col="2"><span class="num">1</span> cm/s</div><div data-col="3">碎片速度与方向难控</div>
        <div class="rowline"></div>
        <div class="dim">线性累积偏移</div><div data-col="1" id="cell10">—</div><div data-col="2" id="cell1">—</div><div data-col="3">不作可靠偏移估算</div>
        <div class="rowline"></div>
        <div class="dim">决策余量</div><div data-col="1">可复测、可追加行动</div><div data-col="2">修正窗口较窄</div><div data-col="3">碎片仍可能威胁地球</div>
        <div class="rowline"></div>
        <div class="dim">本页判断</div><div data-col="1">优先选择</div><div data-col="2">备选但余量小</div><div data-col="3">不应作为默认答案</div>
      </section>

      <section class="sim min0" style="flex:1" aria-label="偏转决策小游戏">
        <div class="orbit-view min0">
          <svg viewBox="0 0 820 205" role="img" aria-label="基准预测轨道与选择后出现的偏转轨道，非按比例">
            <path class="base-path" d="M34 163 C205 38 510 35 786 100"/>
            <path id="branch" class="branch" d="M345 61 C490 63 640 107 786 151"/>
            <line id="measure" class="measure" x1="780" y1="101" x2="780" y2="150"/>
            <circle cx="345" cy="61" r="7" fill="var(--sun)"/>
            <circle id="target" cx="786" cy="100" r="8" fill="var(--orbit)"/>
            <text x="24" y="28" fill="var(--muted)" font-size="16">课堂线性模型 · 非按真实轨道比例</text>
            <text x="356" y="49" fill="var(--sun)" font-size="15">施加微小速度变化</text>
            <text x="664" y="87" fill="var(--muted)" font-size="15">原预测位置</text>
            <text id="offsetLabel" x="650" y="180" fill="var(--orbit)" font-size="16">选择方案后比较偏移</text>
          </svg>
        </div>
        <div class="panel readout min0">
          <div class="small">线性累积偏移</div>
          <div class="big sm"><span id="readNum" class="num">—</span><span id="readUnit" class="unit"></span></div>
          <div id="status" class="status" aria-live="polite">请选择一个方案，比较时间带来的决策余量。</div>
          <div class="btns" role="group" aria-label="选择偏转方案">
            <button class="btn" data-choice="1" aria-pressed="false">提前 10 年</button>
            <button class="btn" data-choice="2" aria-pressed="false">提前 1 年</button>
            <button class="btn" data-choice="3" aria-pressed="false">最后 1 个月</button>
            <button class="btn" id="reset">重新选择</button>
          </div>
        </div>
        <figure class="evidence-window min0" style="margin:0" title="OSIRIS-REx Sample from Asteroid Bennu - jsc2024e023025.tiff · NASA Johnson Space Center / Erika Blumenfeld &amp; Joseph Aebersold · Public domain">
          <div class="cvbox"><img src="assets/img/asteroid-bennu.jpg" alt="OSIRIS-REx 任务带回的贝努小行星样品"></div>
          <figcaption class="caption">贝努返回样品（真实照片）</figcaption>
        </figure>
      </section>
    </main>

    <footer style="height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px">
      <p class="lead" style="margin:0">行星防御的关键是尽早发现并施加微小速度变化，而不是最后时刻“炸掉目标”。</p>
      <div class="hint" style="white-space:nowrap">选择方案，观察同一微小推力如何累积</div>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Deck.init({index:26,total:34});
    const yearSeconds=Lec.K.units.julianYearDays*Lec.K.units.daySeconds;
    const dvMetresPerSecond=1/100;
    const km10=dvMetresPerSecond*yearSeconds*10/Lec.K.units.kilometreMetres;
    const km1=dvMetresPerSecond*yearSeconds/Lec.K.units.kilometreMetres;
    const rounded=v=>Lec.P.round(v,0).toLocaleString('zh-CN');
    document.getElementById('cell10').textContent='约 '+rounded(km10)+' km';
    document.getElementById('cell1').textContent='约 '+rounded(km1)+' km';
    const buttons=[...document.querySelectorAll('[data-choice]')];
    const branch=document.getElementById('branch'), measure=document.getElementById('measure');
    function choose(choice){
      buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.choice===choice)));
      document.querySelectorAll('[data-col]').forEach(el=>el.classList.toggle('chosen',el.dataset.col===choice));
      branch.classList.add('show'); measure.classList.add('show');
      const num=document.getElementById('readNum'),unit=document.getElementById('readUnit'),status=document.getElementById('status'),label=document.getElementById('offsetLabel');
      if(choice==='1'){num.textContent=rounded(km10);unit.textContent='km';status.textContent='达成目标：留出复测与追加行动的时间。';label.textContent='提前十年：偏移约 '+rounded(km10)+' km';}
      if(choice==='2'){num.textContent=rounded(km1);unit.textContent='km';status.textContent='同样推力，时间少十倍；修正余量明显变窄。';label.textContent='提前一年：偏移约 '+rounded(km1)+' km';}
      if(choice==='3'){num.textContent='不可可靠估算';unit.textContent='';status.textContent='碎片不等于风险消失，物质不会凭空消失。';label.textContent='方向与碎片速度难以控制';}
    }
    function reset(){buttons.forEach(b=>b.setAttribute('aria-pressed','false'));document.querySelectorAll('[data-col]').forEach(el=>el.classList.remove('chosen'));branch.classList.remove('show');measure.classList.remove('show');document.getElementById('readNum').textContent='—';document.getElementById('readUnit').textContent='';document.getElementById('status').textContent='请选择一个方案，比较时间带来的决策余量。';document.getElementById('offsetLabel').textContent='选择方案后比较偏移';}
    buttons.forEach(b=>b.addEventListener('click',()=>choose(b.dataset.choice)));
    document.getElementById('reset').addEventListener('click',reset);
  </script>
</body>
</html>
