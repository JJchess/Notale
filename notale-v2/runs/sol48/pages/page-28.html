<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .mission-row{display:flex;gap:18px;min-height:0;flex:1;padding-top:16px}
    .mission{position:relative;display:flex;flex:1;min-width:0;flex-direction:column;padding:18px 16px 14px;border-color:rgba(76,201,240,.38);transition:border-color .18s,box-shadow .18s}
    .mission::before{position:absolute;top:9px;right:12px;width:18px;height:18px;border-top:1px solid var(--orbit);border-right:1px solid var(--orbit);content:"";opacity:.55}
    .mission .bt{margin-top:-31px}
    .mission .scope{min-height:49px;margin:0 0 11px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
    .mission .landing{display:flex;min-height:0;flex:1;align-items:stretch;justify-content:center;border-top:1px solid rgba(76,201,240,.25);padding-top:11px}
    .mission .empty{align-self:center;color:var(--faint);font-size:var(--fs-label)}
    .target-guide{display:flex;width:100%;flex-direction:column;justify-content:center;gap:10px}
    .target-guide div{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid rgba(76,201,240,.18);color:var(--muted);font-size:var(--fs-label);line-height:1.4}
    .target-guide b{color:var(--evidence);font-weight:650}
    .mission.is-target{border-color:var(--sun);box-shadow:inset 0 0 0 2px rgba(255,183,3,.18)}
    .mission.is-filled{border-color:var(--orbit)}
    .mission.is-filled::after{position:absolute;left:50%;bottom:-18px;width:1px;height:18px;background:var(--orbit);content:""}
    .mission .result-note{margin-top:9px;color:var(--orbit);font-size:var(--fs-sec);line-height:1.4}
    .tray{display:flex;gap:14px;min-height:150px;align-items:stretch}
    .e-card{display:grid;flex:1;min-width:0;grid-template-rows:230px minmax(0,1fr);gap:10px;align-items:start;padding:10px!important;touch-action:none;user-select:none}
    .e-card img{width:100%;height:230px;border-radius:7px;object-fit:cover}
    .e-card strong{display:block;margin-bottom:5px;font-size:var(--fs-sec);line-height:1.35}
    .e-card span{display:block;color:var(--muted);font-size:var(--fs-label);font-weight:500;line-height:1.4}
    .e-card[aria-pressed="true"]{border-color:var(--sun)!important;color:var(--sun);box-shadow:inset 4px 0 0 var(--sun)}
    .e-card.in-box{grid-template-columns:88px minmax(0,1fr);grid-template-rows:none;cursor:default}
    .e-card.in-box img{width:88px;height:104px}
    .e-card.in-box span{font-size:var(--fs-sec);color:var(--text)}
    .shake{animation:shake .28s ease}
    @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
    @media (prefers-reduced-motion:reduce){.mission{transition:none}.shake{animation:none}}
  </style>
</head>
<body data-page="28" data-total="34">
  <div id="stage">
    <header style="height:92px">
      <div style="color:var(--orbit);font:650 var(--fs-label)/1.3 var(--font-mono);letter-spacing:.12em">EVIDENCE × MISSION</div>
      <h1 style="margin-top:6px">先问要什么证据，再选怎么去</h1>
    </header>

    <main class="k-classification min0" style="flex:1" aria-label="把证据目标匹配给任务类型">
      <div style="height:34px;display:flex;align-items:center;gap:12px">
        <span class="tag evidence">想取得的证据</span>
        <span class="hint">拖动证据卡到任务框；也可选卡后点框。键盘用方向键选择、Enter 放置。</span>
      </div>
      <div class="mission-row min0" id="missions">
        <section class="box mission min0" data-kind="flyby" aria-label="飞越任务框">
          <h2 class="bt">飞越</h2><p class="scope">陌生世界的首批近景</p><div class="landing"><div class="target-guide"><div><span>覆盖</span><b>广域掠影</b></div><div><span>时间</span><b>单次接近</b></div><span class="empty">等待证据</span></div></div>
        </section>
        <section class="box mission min0" data-kind="orbit" aria-label="环绕任务框">
          <h2 class="bt">环绕</h2><p class="scope">喷流、天气或表面的长期变化</p><div class="landing"><div class="target-guide"><div><span>覆盖</span><b>全球地图</b></div><div><span>时间</span><b>反复重访</b></div><span class="empty">等待证据</span></div></div>
        </section>
        <section class="box mission min0" data-kind="land" aria-label="着陆任务框">
          <h2 class="bt">着陆</h2><p class="scope">岩石、土壤与地层的现场关系</p><div class="landing"><div class="target-guide"><div><span>覆盖</span><b>一个地点</b></div><div><span>背景</span><b>现场保留</b></div><span class="empty">等待证据</span></div></div>
        </section>
        <section class="box mission min0" data-kind="sample" aria-label="采样返回任务框">
          <h2 class="bt">采样返回</h2><p class="scope">可在地球实验室反复分析的样品</p><div class="landing"><div class="target-guide"><div><span>材料</span><b>少量样品</b></div><div><span>分析</span><b>实验室反复</b></div><span class="empty">等待证据</span></div></div>
        </section>
      </div>

      <div class="quiz" style="height:345px;padding-top:18px">
        <div class="tray" id="tray" aria-label="待匹配证据卡槽">
          <button class="opt e-card no-pan" data-kind="land" draggable="true" aria-pressed="false"><img src="assets/img/curiosity-selfie.jpg" alt="好奇号火星车自拍" title="Curiosity rover selfie at Rafael Navarro Mountain (54230174671).jpg · semeion.photo · Public domain"><span><strong>火星车所在局地</strong>直接检查一个地点，并保留现场背景</span></button>
          <button class="opt e-card no-pan" data-kind="flyby" draggable="true" aria-pressed="false"><img src="assets/img/europa-galileo.jpg" alt="木卫二近景" title="Europa Hemispherical Globes PIA03526.jpg · NASA/JPL/USGS · Public domain"><span><strong>木卫二近景</strong>在短暂接近中取得首批近景</span></button>
          <button class="opt e-card no-pan" data-kind="sample" draggable="true" aria-pressed="false"><img src="assets/img/asteroid-bennu.jpg" alt="贝努返回样品" title="OSIRIS-REx Sample from Asteroid Bennu - jsc2024e023025.tiff · NASA Johnson Space Center / Erika Blumenfeld &amp; Joseph Aebersold · Public domain"><span><strong>贝努返回样品</strong>带回实验室进行高精度反复分析</span></button>
          <button class="opt e-card no-pan" data-kind="orbit" draggable="true" aria-pressed="false"><img src="assets/img/enceladus-plumes.jpg" alt="土卫二喷流" title="Enceladus - November 21 2009 (37371602166).jpg · Kevin Gill from Los Angeles, CA, United States · CC BY 2.0"><span><strong>土卫二喷流</strong>反复观察并比较随时间的变化</span></button>
        </div>
        <div style="height:40px;display:flex;align-items:center;justify-content:space-between;gap:18px">
          <div class="fb" id="feedback" aria-live="polite">先确定需要全球、长期、局地还是实验室证据。</div>
          <div class="btns"><button class="btn" id="reset">重新匹配</button></div>
        </div>
      </div>
    </main>

    <footer style="height:74px;display:flex;align-items:center;border-top:1px solid var(--line)">
      <p class="lead" id="conclusion" style="margin:0">任务类型不是“越复杂越好”的排行榜。证据目标决定抵达和取证方式。</p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Deck.init({index:28,total:34});
    const tray=document.querySelector('#tray');
    const cards=[...document.querySelectorAll('.e-card')];
    const boxes=[...document.querySelectorAll('.mission')];
    const feedback=document.querySelector('#feedback');
    const conclusion=document.querySelector('#conclusion');
    const initialGuides=Object.fromEntries(boxes.map(b=>[b.dataset.kind,b.querySelector('.landing').innerHTML]));
    const notes={flyby:'快速初识；覆盖广，重访受限',orbit:'长期重访；比较时间变化',land:'局地细查；保留现场背景',sample:'样品有限；实验能力最强'};
    let selected=null,dragged=null,placed=0;
    function select(card){if(card.classList.contains('in-box'))return;cards.forEach(c=>c.setAttribute('aria-pressed','false'));selected=card;card.setAttribute('aria-pressed','true');feedback.textContent='已选择“'+card.querySelector('strong').textContent+'”，请选择任务框。'}
    function attempt(box,card){if(!card||card.classList.contains('in-box'))return;if(card.dataset.kind!==box.dataset.kind){box.classList.add('is-target');card.classList.add('shake');feedback.textContent='证据目标与这种抵达方式不匹配，再比较一次。';setTimeout(()=>{box.classList.remove('is-target');card.classList.remove('shake')},320);return}const landing=box.querySelector('.landing');landing.innerHTML='';card.classList.add('in-box');card.draggable=false;card.setAttribute('aria-pressed','false');landing.append(card);box.classList.add('is-filled');const n=document.createElement('div');n.className='result-note';n.textContent=notes[box.dataset.kind];box.append(n);selected=null;placed++;feedback.textContent='匹配成立：'+notes[box.dataset.kind]+'。';if(placed===4){feedback.textContent='全部匹配完成。四种任务取得的是互补证据。';conclusion.textContent='飞越、环绕、着陆和采样返回回答的问题不同，任务形式必须匹配证据目标。'}}
    cards.forEach(card=>{card.addEventListener('click',()=>select(card));card.addEventListener('dragstart',e=>{dragged=card;select(card);e.dataTransfer.setData('text/plain',card.dataset.kind)});card.addEventListener('keydown',e=>{if(card.classList.contains('in-box'))return;let i=boxes.findIndex(b=>b.dataset.kind===card.dataset.kind);if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const d=e.key==='ArrowRight'?1:-1;i=(i+d+boxes.length)%boxes.length;boxes.forEach(b=>b.classList.remove('is-target'));boxes[i].classList.add('is-target');card.dataset.target=String(i);feedback.textContent='当前任务框：'+boxes[i].querySelector('.bt').textContent}else if(e.key==='Enter'&&card.dataset.target){e.preventDefault();attempt(boxes[Number(card.dataset.target)],card)}})});
    boxes.forEach(box=>{box.addEventListener('dragover',e=>{e.preventDefault();box.classList.add('is-target')});box.addEventListener('dragleave',()=>box.classList.remove('is-target'));box.addEventListener('drop',e=>{e.preventDefault();box.classList.remove('is-target');attempt(box,dragged);dragged=null});box.addEventListener('click',()=>attempt(box,selected))});
    document.querySelector('#reset').addEventListener('click',()=>{cards.forEach(c=>{c.classList.remove('in-box','shake');c.draggable=true;c.setAttribute('aria-pressed','false');delete c.dataset.target;tray.append(c)});boxes.forEach(b=>{b.classList.remove('is-filled','is-target');b.querySelector('.landing').innerHTML=initialGuides[b.dataset.kind];b.querySelector('.result-note')?.remove()});selected=null;dragged=null;placed=0;feedback.textContent='先确定需要全球、长期、局地还是实验室证据。';conclusion.textContent='任务类型不是“越复杂越好”的排行榜。证据目标决定抵达和取证方式。'});
  </script>
</body>
</html>
