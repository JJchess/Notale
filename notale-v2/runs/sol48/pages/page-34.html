<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .closing-kicker {
      color: var(--orbit);
      font-family: var(--font-mono);
      font-size: var(--fs-label);
      font-weight: 650;
      letter-spacing: .14em;
      line-height: 1.35;
    }
    .closing-head h1 { margin: 8px 0 0; }
    .closing-map { position: relative; padding: 10px 82px 0; }
    .system-orbits {
      position: absolute;
      z-index: -1;
      inset: 8px 28px 10px;
      width: calc(100% - 56px);
      height: calc(100% - 18px);
      overflow: visible;
      pointer-events: none;
    }
    .system-orbits ellipse {
      fill: none;
      stroke: var(--orbit);
      stroke-width: 2;
      opacity: .2;
    }
    .closing-map .claim {
      background: linear-gradient(90deg, rgba(255,183,3,.11), transparent 72%);
      text-align: center;
    }
    .closing-map .claim strong { color: var(--sun); }
    .closing-map .supports { --support-cols: 4; }
    .closing-map .support { text-align: center; }
    .closing-map .support .tag { margin-bottom: 12px; }
    .support-kind {
      margin: 0 0 8px;
      color: var(--evidence);
      font-size: var(--fs-label);
      font-weight: 650;
      letter-spacing: .08em;
      line-height: 1.4;
    }
    .support-line {
      margin: 0;
      color: var(--muted);
      font-size: var(--fs-sec);
      line-height: 1.5;
    }
    .closing-line {
      align-self: center;
      width: min(100%, 1180px);
      margin: 0;
      padding: 14px 26px;
      border-top: 1px solid rgba(255,183,3,.48);
      color: var(--text);
      font-size: var(--fs-lead);
      font-weight: 620;
      line-height: 1.5;
      text-align: center;
      text-shadow: 0 2px 18px var(--bg);
    }
    .backdrop { opacity: .18; animation: bg-in 700ms ease-out both; }
    .closing-map .trunk { transform-origin: bottom; animation: trunk-in 620ms 520ms cubic-bezier(.22,.8,.3,1) both; }
    .closing-map .supports { transform-origin: center top; animation: branch-in 520ms 920ms ease-out both; }
    .closing-map .support { animation: item-in 520ms ease-out both; }
    .closing-map .support:nth-child(1) { animation-delay: 1080ms; }
    .closing-map .support:nth-child(2) { animation-delay: 1160ms; }
    .closing-map .support:nth-child(3) { animation-delay: 1240ms; }
    .closing-map .support:nth-child(4) { animation-delay: 1320ms; }
    .closing-map .claim { animation: rise-in 620ms 1520ms ease-out both; }
    .closing-line { animation: rise-in 620ms 1650ms ease-out both; }
    @keyframes bg-in { from { opacity: 0; } to { opacity: .18; } }
    @keyframes trunk-in { from { opacity: 0; transform: scaleY(0); } to { opacity: 1; transform: scaleY(1); } }
    @keyframes branch-in { from { opacity: 0; transform: scaleX(.25); } to { opacity: 1; transform: scaleX(1); } }
    @keyframes item-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes rise-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .backdrop, .closing-map .trunk, .closing-map .supports,
      .closing-map .support, .closing-map .claim, .closing-line { animation: none; }
    }
  </style>
</head>
<body data-page="34" data-total="34">
  <div id="stage">
    <img class="backdrop" src="assets/img/planet-horizon-bg.png" alt="" title="生成插画（非真实照片）">

    <header class="closing-head" style="height:92px">
      <div class="closing-kicker">SYSTEM / HISTORY / EVIDENCE</div>
      <h1>把行星看成结果，也看成证据</h1>
    </header>

    <main class="k-generalization closing-map min0" style="flex:1" aria-label="太阳系共同历史的主张与四类支撑">
      <svg class="system-orbits" viewBox="0 0 1400 610" preserveAspectRatio="none" aria-hidden="true">
        <ellipse cx="700" cy="330" rx="665" ry="245"></ellipse>
        <ellipse cx="700" cy="330" rx="535" ry="196"></ellipse>
        <ellipse cx="700" cy="330" rx="400" ry="145"></ellipse>
        <ellipse cx="700" cy="330" rx="270" ry="96"></ellipse>
      </svg>
      <div class="claim">
        <div>太阳系不是一份成员名单，而是<strong>一段共同历史留下的系统</strong>。</div>
        <div>每颗行星既是形成与演化的结果，也是检验这段历史的一份证据。</div>
      </div>
      <div class="trunk" aria-hidden="true"></div>
      <div class="supports min0">
        <section class="support min0">
          <span class="tag structure">结构</span>
          <div class="support-kind">形成线索</div>
          <p class="support-line">同向、近共面与内外分区，</p>
          <p class="support-line">留下共同形成史的线索。</p>
        </section>
        <section class="support min0">
          <span class="tag evidence">分化</span>
          <div class="support-kind">分化机制</div>
          <p class="support-line">日照、质量、物质与大气，</p>
          <p class="support-line">让同源世界走向不同结果。</p>
        </section>
        <section class="support min0">
          <span class="tag structure">演化</span>
          <div class="support-kind">动态痕迹</div>
          <p class="support-line">引力、共振、碰撞与小天体输运，</p>
          <p class="support-line">使系统至今仍在变化。</p>
        </section>
        <section class="support min0">
          <span class="tag evidence">检验</span>
          <div class="support-kind">任务证据</div>
          <p class="support-line">飞越、环绕、着陆与采样返回，</p>
          <p class="support-line">把解释变成可核验的证据链。</p>
        </section>
      </div>
    </main>

    <p class="closing-line" style="height:72px">离开课堂时，应把每颗行星看成同一系统历史中的一个结果和一份证据。</p>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>Deck.init({ index: 34, total: 34 });</script>
</body>
</html>
