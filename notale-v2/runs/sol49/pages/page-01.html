<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .opening-head { display:flex; flex-direction:column; justify-content:flex-end; }
    .kicker { margin:0 0 8px; color:var(--sun); font-family:var(--font-mono); font-size:var(--fs-label); font-weight:700; line-height:1.35; letter-spacing:.18em; }
    .opening-head h1 { margin:0; }
    .system-map { align-self:center; width:min(100%, 1180px); padding-top:38px; background:radial-gradient(ellipse at 50% 54%, color-mix(in srgb, var(--orbit) 11%, transparent) 0 28%, color-mix(in srgb, var(--orbit) 5%, transparent) 29% 46%, transparent 47%); }
    .system-map.k-generalization { grid-template-rows:auto 86px minmax(0,1fr); }
    .system-map.k-generalization > .claim { width:min(100%, 900px); padding:20px 28px; border-top:1px solid color-mix(in srgb, var(--sun) 44%, transparent); border-right:1px solid color-mix(in srgb, var(--sun) 24%, transparent); border-bottom:1px solid color-mix(in srgb, var(--sun) 24%, transparent); font-size:28px; text-align:center; background:color-mix(in srgb, var(--bg) 72%, transparent); }
    .system-map.k-generalization > .trunk { position:relative; display:flex; width:230px; height:48px; align-self:end; align-items:center; justify-content:center; border:1px solid var(--orbit); border-radius:999px; color:var(--text); background:var(--bg); font-size:var(--fs-body); font-weight:680; line-height:1.4; }
    .system-map.k-generalization > .trunk::before { position:absolute; bottom:100%; left:50%; width:2px; height:38px; background:var(--orbit); content:""; }
    .system-map.k-generalization > .trunk::after { position:absolute; top:100%; left:50%; width:2px; height:38px; background:var(--orbit); content:""; }
    .system-map.k-generalization > .supports { padding-top:0; align-items:start; }
    .system-map.k-generalization > .supports > .support { min-height:230px; margin:0 24px; padding:42px 24px 18px; border-right:1px solid color-mix(in srgb, var(--orbit) 26%, transparent); border-bottom:1px solid color-mix(in srgb, var(--orbit) 40%, transparent); border-left:1px solid color-mix(in srgb, var(--orbit) 26%, transparent); text-align:center; }
    .system-map.k-generalization > .supports > .support::before { height:28px; }
    .support strong { display:block; margin-bottom:10px; color:var(--text); font-size:var(--fs-h2); font-weight:700; line-height:1.3; }
    .support span { display:inline; color:var(--muted); font-size:var(--fs-sec); line-height:1.5; }
    .closing { display:flex; align-items:flex-end; }
    .closing p { width:min(100%, 980px); margin:0; color:var(--text); font-size:var(--fs-lead); line-height:1.5; }
    .system-map > img.opening-orbits { position:absolute; z-index:-1; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; opacity:.18; pointer-events:none; user-select:none; animation:sky-in .7s ease-out both; }
    .claim { animation:rise-in .38s .28s ease-out both; }
    .trunk { animation:rise-in .32s .48s ease-out both; }
    .support { animation:rise-in .34s ease-out both; }
    .support:nth-child(1) { animation-delay:.64s; }
    .support:nth-child(2) { animation-delay:.76s; }
    .support:nth-child(3) { animation-delay:.88s; }
    @keyframes sky-in { from { opacity:0; } to { opacity:.18; } }
    @keyframes rise-in { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @media (prefers-reduced-motion:reduce) { .opening-orbits,.claim,.trunk,.support { animation:none; } }
  </style>
</head>
<body data-page="01" data-total="34">
  <div id="stage">
    <header class="opening-head" style="height:112px">
      <p class="kicker"><span>SYSTEM</span> <span>VIEW</span></p>
      <h1><span>太阳系，</span><span>不只是一张名单</span></h1>
    </header>

    <main class="k-generalization system-map min0" style="flex:1" aria-label="太阳系是一套彼此关联的系统">
      <img class="opening-orbits" src="assets/img/orbit-rings-bg.png" alt="" title="深色空间中的轨道环示意背景">
      <div class="claim"><span>太阳系是一套</span><span>彼此关联的系统</span></div>
      <div class="trunk"><span>同一套</span><span>太阳系</span></div>
      <div class="supports min0" style="--support-cols:3">
        <section class="support min0">
          <strong><span>有</span><span>结构</span></strong>
          <span>成员并非</span><span>随意排列</span>
        </section>
        <section class="support min0">
          <strong><span>有</span><span>历史</span></strong>
          <span>不同世界来自</span><span>相联系的过去</span>
        </section>
        <section class="support min0">
          <strong><span>会</span><span>演化</span></strong>
          <span>今天的太阳系</span><span>仍在变化</span>
        </section>
      </div>
    </main>

    <footer class="closing" style="height:104px">
      <p><span>太阳系不是八颗行星的名单，</span><span>而是一套有结构、会演化的系统。</span></p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>Deck.init({index:1,total:34});</script>
</body>
</html>
