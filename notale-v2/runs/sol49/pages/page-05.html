<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .page-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line)}
    .kicker{color:var(--orbit);font:650 var(--fs-label)/1.3 var(--font-mono);letter-spacing:.12em}
    .plate-note{color:var(--muted);font-size:var(--fs-sec)}
    .visuals{position:relative;display:grid;grid-template-columns:170px repeat(4,minmax(0,1fr));min-height:0;border-bottom:1px solid var(--line)}
    .visuals>svg{position:absolute;z-index:0;inset:0;width:100%;height:100%;pointer-events:none}
    .visuals>div,.visuals>article{z-index:1}
    .visual-dim{display:flex;flex-direction:column;justify-content:space-between;padding:18px 18px 22px 0;color:var(--muted);font-size:var(--fs-sec);text-align:right}
    .planet-col{position:relative;display:grid;grid-template-rows:102px 1fr;min-width:0;padding:14px 12px 10px;border-left:1px solid var(--line)}
    .photo-window{display:flex;align-items:center;justify-content:center;gap:12px;min-width:0}
    .photo-window img{width:132px;height:92px;object-fit:contain}
    .photo-window span{font-size:var(--fs-label);color:var(--muted)}
    .model-zone{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:0;padding-bottom:20px}
    .model-zone::after{position:absolute;right:0;bottom:19px;left:0;border-top:1px solid var(--orbit);content:""}
    .disc{position:relative;z-index:1;flex:none;border:2px solid var(--orbit);border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transform-origin:50% 100%}
    .planet-col.is-earth .disc{border-color:var(--sun);box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 20%,transparent)}
    .baseline-label{position:absolute;right:10px;bottom:0;color:var(--orbit);font-size:var(--fs-label)}
    .matrix{--compare-cols:4;align-content:stretch}
    .matrix .hdr{padding-top:8px;padding-bottom:8px}
    .matrix .value{text-align:center;font-size:var(--fs-body);align-self:center}
    .matrix .value .num{font-size:24px;font-weight:700}
    .distance-result{grid-column:2/-1;display:flex;align-items:center;justify-content:space-around;gap:22px;color:var(--text);font-size:var(--fs-sec)}
    .distance-result strong{font-size:22px;color:var(--sun)}
    .control-panel{display:flex;align-items:center;gap:24px}
    .control-panel .ctl{flex:1}
    .control-panel .btns{flex:none}
    .closing{display:flex;align-items:center;justify-content:space-between;gap:34px;border-top:1px solid var(--line)}
    .closing .lead{margin:0;max-width:1080px}
    .next{color:var(--muted);font-size:var(--fs-sec);white-space:nowrap}
  </style>
</head>
<body data-page="05" data-total="34">
  <div id="stage">
    <header class="page-head" style="height:82px">
      <div><div class="kicker">STRUCTURE · SIZE</div><h1 style="margin:4px 0 10px">把地球缩成 1 cm</h1></div>
      <div class="plate-note">真实照片窗口 ↔ 直径比例示意</div>
    </header>

    <main class="min0" style="flex:1;display:flex;flex-direction:column">
      <section class="visuals min0" style="flex:1" aria-label="四颗行星的真实照片与同比例直径模型">
        <svg viewBox="0 0 1488 404" preserveAspectRatio="none" aria-hidden="true">
          <g fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="5 9">
            <path d="M170 112H1488M170 202H1488M170 292H1488"/>
            <path d="M335 102V384M665 102V384M995 102V384M1325 102V384"/>
          </g>
          <g fill="none" stroke="var(--orbit)" stroke-width="1" opacity=".5">
            <path d="M170 380H1488"/><path d="M170 374v12M500 374v12M830 374v12M1160 374v12M1487 374v12"/>
          </g>
        </svg>
        <div class="visual-dim"><span>真实外观<br>照片不缩放</span><span>模型圆盘<br>共用直径基线</span></div>
        <article class="planet-col min0" data-key="mars">
          <div class="photo-window"><img src="assets/img/mars-global.jpg" alt="火星全球影像" title="NASA 火星全球影像"><span>火星</span></div>
          <div class="model-zone"><div class="disc" aria-hidden="true"></div></div>
        </article>
        <article class="planet-col min0 is-earth" data-key="earth">
          <div class="photo-window"><img src="assets/img/earth-apollo17.jpg" alt="阿波罗17号拍摄的地球" title="NASA Apollo 17 地球影像"><span>地球</span></div>
          <div class="model-zone"><div class="disc" aria-hidden="true"></div></div>
        </article>
        <article class="planet-col min0" data-key="saturn">
          <div class="photo-window"><img src="assets/img/saturn-cassini.jpg" alt="卡西尼号拍摄的土星" title="NASA/JPL-Caltech/SSI 卡西尼土星影像"><span>土星</span></div>
          <div class="model-zone"><div class="disc" aria-hidden="true"></div></div>
        </article>
        <article class="planet-col min0" data-key="jupiter">
          <div class="photo-window"><img src="assets/img/jupiter-juno.jpg" alt="朱诺号拍摄的木星" title="NASA/JPL-Caltech/SwRI/MSSS 朱诺木星影像"><span>木星</span></div>
          <div class="model-zone"><div class="disc" aria-hidden="true"></div><span class="baseline-label">共同基线</span></div>
        </article>
      </section>

      <section class="k-comparison matrix min0" style="height:174px" aria-label="同比例直径与距离比较表">
        <div class="dim">比较维度</div><div class="hdr">火星</div><div class="hdr diff">地球</div><div class="hdr">土星</div><div class="hdr diff">木星</div>
        <div class="dim">模型直径</div>
        <div class="value panel"><span class="num" data-out="mars">—</span><span class="unit">cm</span></div>
        <div class="value panel diff"><span class="num" data-out="earth">—</span><span class="unit">cm</span></div>
        <div class="value panel"><span class="num" data-out="saturn">—</span><span class="unit">cm</span><br><span class="small">球体本体，不含环</span></div>
        <div class="value panel diff"><span class="num" data-out="jupiter">—</span><span class="unit">cm</span></div>
        <div class="rowline"></div>
        <div class="dim">同尺度距离</div>
        <div class="distance-result panel" id="distanceRow"><span>地球—太阳约 <strong><span class="num" data-out="earthDistance">—</span> m</strong></span><span>木星—太阳约 <strong><span class="num" data-out="jupiterDistance">—</span> m</strong></span><span class="small">普通教室通常容不下</span></div>
      </section>

      <section class="panel control-panel" style="height:88px">
        <div class="ctl min0"><label for="earthSize">模型中的地球直径</label><input id="earthSize" type="range" min="0.5" max="2" step="0.1" value="1" aria-describedby="scaleHint"><output id="earthSizeOut">1.0 cm</output></div>
        <div class="btns"><button class="btn" id="reset" type="button">复位到 1 cm</button></div>
        <div class="hint" id="scaleHint">拖动并比较；屏幕圆盘只表达比例，不冒充实物厘米</div>
      </section>
    </main>

    <footer class="closing" style="height:96px">
      <p class="lead">地球若是 1 cm，木星约 11.2 cm；但同尺度的行星距离仍塞不进普通教室。大小与距离不能在教室里同时使用同一比例。</p>
      <div class="next">下一问：体积更大，同样一杯材料一定更重吗？</div>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/gsap.min.js"></script>
  <script>
    Deck.init({index:5,total:34});
    const keys=['mars','earth','saturn','jupiter'];
    const earthKm=Lec.P.diameterKm('earth');
    const ratios=Object.fromEntries(keys.map(k=>[k,Lec.P.diameterKm(k)/earthKm]));
    const slider=document.getElementById('earthSize');
    const sizeOut=document.getElementById('earthSizeOut');
    const distanceRow=document.getElementById('distanceRow');
    const pxPerCm=13.5;
    function distanceMetres(key,earthCm){
      const distanceKm=Lec.P.kilometresFromAU(Lec.K.planets[key].semimajorAxisAU);
      return distanceKm/earthKm*earthCm/100;
    }
    function update(animate){
      const earthCm=Number(slider.value);
      sizeOut.value=earthCm.toFixed(1)+' cm';
      keys.forEach(k=>{
        const cm=ratios[k]*earthCm;
        const el=document.querySelector('[data-out="'+k+'"]');
        el.textContent=k==='earth'?cm.toFixed(2):(cm<1?cm.toFixed(2):cm.toFixed(1));
        const disc=document.querySelector('[data-key="'+k+'"] .disc');
        const d=Math.max(7,cm*pxPerCm);
        gsap.to(disc,{width:d,height:d,duration:animate&&!Deck.reduced()?0.32:0,ease:'power2.out',overwrite:'auto'});
      });
      document.querySelector('[data-out="earthDistance"]').textContent=distanceMetres('earth',earthCm).toFixed(0);
      document.querySelector('[data-out="jupiterDistance"]').textContent=distanceMetres('jupiter',earthCm).toFixed(0);
      if(animate&&!Deck.reduced()) gsap.fromTo(distanceRow,{color:'var(--sun)'},{color:'var(--text)',duration:.65,ease:'power1.out',overwrite:true});
    }
    slider.addEventListener('input',()=>update(true));
    document.getElementById('reset').addEventListener('click',()=>{slider.value='1';update(true);slider.focus();});
    update(false);
    if(!Deck.reduced()){
      gsap.from('.visuals svg path',{scaleX:0,duration:.6,stagger:.04,transformOrigin:'left center',ease:'power1.out'});
      gsap.from('.disc',{autoAlpha:0,scale:.72,duration:.45,stagger:.1,ease:'power2.out',delay:.15});
      gsap.from('.matrix .value, .distance-result',{autoAlpha:0,y:8,duration:.35,stagger:.04,delay:.45});
    }
  </script>
</body>
</html>
