<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page-kicker{
    margin:0 0 7px;color:var(--orbit);font-family:var(--font-mono);
    font-size:var(--fs-label);font-weight:650;line-height:1.35;letter-spacing:.14em;
  }
  .page-head h1{margin:0;}
  .light-entry{
    position:absolute;z-index:0;left:0;top:110px;width:450px;height:620px;
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,183,3,.16) 0,rgba(255,183,3,.05) 37%,transparent 70%);
  }
  .thesis-map{
    align-content:center;padding:14px 92px 6px;
    background:radial-gradient(ellipse at 50% 38%,rgba(76,201,240,.11) 0,rgba(76,201,240,.035) 42%,transparent 72%);
  }
  .thesis-map>.claim{
    display:flex;align-items:baseline;justify-content:center;gap:14px;
    width:min(100%,980px);padding:20px 28px;border-left-width:6px;
  }
  .claim-lead{font-size:28px;font-weight:760;line-height:1.35;}
  .claim-turn{color:var(--sun);font-size:28px;font-weight:760;line-height:1.35;}
  .thesis-map>.trunk{
    position:relative;width:3px;background:var(--orbit);
  }
  .trunk-note{
    position:absolute;left:50%;top:50%;display:flex;width:max-content;
    align-items:center;gap:12px;transform:translate(-50%,-100%);
    padding:7px 14px;background:var(--bg);color:var(--text);
    font-size:var(--fs-body);font-weight:680;line-height:1.4;
  }
  .trunk-note b{color:var(--orbit);font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.08em;}
  .thesis-map>.supports{align-items:stretch;}
  .thesis-map>.supports>.support{
    display:flex;min-height:0;flex-direction:column;align-items:center;
    justify-content:flex-start;padding-top:34px;text-align:center;
    background:linear-gradient(180deg,rgba(76,201,240,.15),rgba(76,201,240,.035) 72%,transparent);
    clip-path:polygon(45% 0,55% 0,96% 100%,4% 100%);
  }
  .evidence-no{margin-bottom:12px;color:var(--orbit);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:650;letter-spacing:.08em;}
  .evidence-main{color:var(--text);font-size:var(--fs-h2);font-weight:680;line-height:1.4;}
  .evidence-sub{margin-top:5px;color:var(--muted);font-size:var(--fs-sec);line-height:1.5;}
  .bridge{
    display:flex;height:76px;align-items:center;justify-content:center;color:var(--muted);
    font-size:var(--fs-sec);line-height:1.5;
  }
  .bridge-mark{margin-right:12px;color:var(--orbit);font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.08em;}
  .closing{
    display:flex;height:112px;align-items:center;border-top:1px solid rgba(76,201,240,.34);
  }
  .closing-label{
    flex:0 0 180px;color:var(--sun);font-family:var(--font-mono);
    font-size:var(--fs-label);font-weight:700;letter-spacing:.12em;
  }
  .closing p{margin:0;color:var(--text);font-size:var(--fs-lead);font-weight:620;line-height:1.5;}
  .closing strong{color:var(--sun);font-weight:760;}

  @keyframes backdropIn{from{opacity:0}to{opacity:.18}}
  @keyframes supportIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes lineIn{from{opacity:0;transform:scaleX(.05)}to{opacity:1;transform:scaleX(1)}}
  @keyframes claimIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .backdrop{left:1.1%;width:97.8%;opacity:0;animation:backdropIn 650ms ease-out forwards;}
  .thesis-map>.supports{transform-origin:center;opacity:0;animation:lineIn 260ms 180ms ease-out forwards;}
  .support{opacity:0;animation:supportIn 300ms ease-out forwards;}
  .support:nth-child(1){animation-delay:40ms}.support:nth-child(2){animation-delay:90ms}.support:nth-child(3){animation-delay:140ms}
  .thesis-map>.trunk{opacity:0;animation:claimIn 240ms 270ms ease-out forwards;}
  .thesis-map>.claim{opacity:0;animation:claimIn 300ms 360ms ease-out forwards;}
  .bridge,.closing{opacity:0;animation:claimIn 280ms 440ms ease-out forwards;}
  .closing{animation-delay:500ms;}
  @media (prefers-reduced-motion:reduce){
    .backdrop,.support,.thesis-map>.supports,.thesis-map>.trunk,.thesis-map>.claim,.bridge,.closing{animation:none;opacity:1;transform:none;}
  }
</style>
</head>
<body data-page="10" data-total="34">
<div id="stage">
  <img class="backdrop" src="assets/img/orbit-rings-bg.png" alt="" title="深色空间中的轨道环示意背景">
  <div class="light-entry" aria-hidden="true"></div>

  <div class="page-head" style="height:82px">
    <p class="page-kicker">FROM STRUCTURE TO ORIGIN</p>
    <h1>结构是线索，不是终点</h1>
  </div>

  <main class="k-generalization thesis-map min0" style="flex:1" aria-label="由三条结构证据汇聚出的推断">
    <div class="claim">
      <span class="claim-lead">共同起点</span>
      <span class="claim-turn">并不等于相同结果</span>
    </div>
    <div class="trunk" aria-hidden="true">
      <span class="trunk-note"><b>推断</b><span>共同形成史的线索</span></span>
    </div>
    <div class="supports" style="--support-cols:3">
      <div class="support min0">
        <span class="evidence-no">结构证据 01</span>
        <span class="evidence-main">大体同向</span>
        <span class="evidence-sub">近乎共面</span>
      </div>
      <div class="support min0">
        <span class="evidence-no">结构证据 02</span>
        <span class="evidence-main">内侧岩质</span>
        <span class="evidence-sub">外侧巨行星</span>
      </div>
      <div class="support min0">
        <span class="evidence-no">结构证据 03</span>
        <span class="evidence-main">大小与密度</span>
        <span class="evidence-sub">成分呈系统差异</span>
      </div>
    </div>
  </main>

  <div class="bridge" style="height:76px">
    <span class="bridge-mark">由结构到解释</span>
    <span>结构不是答案，而是共同形成史留下的线索。</span>
  </div>

  <div class="closing" style="height:112px">
    <span class="closing-label">NEXT QUESTION</span>
    <p><span>结构给出线索，下一步要问：</span><strong>同一套起点为何长成不同世界？</strong></p>
  </div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:10,total:34});</script>
</body>
</html>
