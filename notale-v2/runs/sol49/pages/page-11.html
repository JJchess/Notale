<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .kicker{color:var(--orbit);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.12em;margin:0 0 5px}
  .head h1{margin:0}
  .process-strip{height:104px;flex:none}
  .process-strip .step{padding:10px 18px;justify-content:flex-start}
  .step-no{color:var(--faint);font:600 var(--fs-label)/1.35 var(--font-mono)}
  .step-title{font-size:var(--fs-h2);font-weight:680;line-height:1.3;margin-top:3px}
  .step-copy{color:var(--muted);font-size:var(--fs-sec);line-height:1.4;margin-top:3px}
  .workspace{display:flex;gap:28px;min-height:0;padding:12px 0 10px}
  .window{position:relative;display:flex;flex:1;min-width:0;flex-direction:column;border:1px solid var(--line);border-radius:12px;padding:14px}
  .window-top{height:34px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .window-name{font-size:var(--fs-sec);font-weight:680;line-height:1.4}
  .media{flex:1;min-height:0;border:1px solid rgba(76,201,240,.22)}
  .photo{width:calc(100% - 2px);height:calc(100% - 2px);margin:1px;display:block;object-fit:contain;background:var(--bg)}
  .anno{position:absolute;z-index:3;color:var(--text);font-size:var(--fs-label);line-height:1.35;padding:4px 8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;white-space:nowrap}
  .anno:after{content:"";position:absolute;height:1px;background:var(--evidence);transform-origin:left center}
  .a-disc{left:9%;top:24%}.a-disc:after{width:76px;left:100%;top:50%;transform:rotate(20deg)}
  .a-ring{right:8%;top:22%}.a-ring:after{width:72px;right:100%;top:50%;transform:rotate(160deg);transform-origin:right}
  .a-gap{right:8%;bottom:20%}.a-gap:after{width:84px;right:100%;top:50%;transform:rotate(198deg);transform-origin:right}
  .model-svg{width:100%;height:100%;display:block;background:radial-gradient(circle at 50% 50%,rgba(76,201,240,.06),transparent 62%)}
  .model-label{position:absolute;left:18px;bottom:14px;color:var(--muted);font-size:var(--fs-label);line-height:1.35}
  .control-row{height:122px;flex:none;display:flex;gap:18px;align-items:stretch}
  .control-row .panel{flex:1;padding:14px 18px}
  .readout{width:350px;display:flex;flex-direction:column;justify-content:center}
  .phase{color:var(--sun);font:700 25px/1.3 var(--font-mono)}
  .caution{height:70px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:28px;border-top:1px solid var(--line)}
  .takeaway{font-size:var(--fs-lead);line-height:1.45;margin:0;max-width:1100px}
  .next{color:var(--muted);font-size:var(--fs-sec);line-height:1.4;text-align:right;max-width:330px}
  @media (prefers-reduced-motion:reduce){.intro{opacity:1!important;transform:none!important}}
</style>
</head>
<body data-page="11" data-total="34">
<div id="stage">
  <header class="head" style="height:72px">
    <p class="kicker">EVIDENCE · COMMON ORIGIN</p>
    <h1>盘中的行星起点</h1>
  </header>

  <section class="k-process process-strip" aria-label="从观测到有限推论的过程">
    <div class="axis"></div>
    <div class="step intro" id="s0" aria-current="step"><span class="step-no">01 · 观测事实</span><span class="step-title">观测盘</span><span class="step-copy">年轻恒星周围存在扁平尘埃盘</span></div>
    <div class="arw intro" aria-hidden="true"></div>
    <div class="step intro" id="s1"><span class="step-no">02 · 识别结构</span><span class="step-title">识别环缝</span><span class="step-copy">亮暗分布不是均匀圆饼</span></div>
    <div class="arw intro" aria-hidden="true"></div>
    <div class="step intro" id="s2"><span class="step-no">03 · 有限推论</span><span class="step-title">提出解释</span><span class="step-copy">盘供给物质；环缝约束形成模型</span></div>
  </section>

  <main class="workspace min0" style="flex:1">
    <figure class="window min0 intro" style="margin:0" aria-label="ALMA 对年轻恒星周围原行星盘的真实观测">
      <div class="window-top"><span class="window-name">V883 Orionis 周围的盘</span><span class="tag evidence">真实观测 · ALMA</span></div>
      <div class="cvbox media min0">
        <img class="photo" src="assets/img/protoplanetary-disk-alma.jpg" alt="ALMA 观测到的年轻恒星周围明暗相间的尘埃盘" title="ALMA 观测：年轻恒星 V883 Orionis 周围的行星形成盘">
        <span class="anno a-disc">扁平盘</span><span class="anno a-ring">亮环</span><span class="anno a-gap">暗缝</span>
      </div>
    </figure>

    <section class="window min0 intro" aria-label="盘中物质分布随模型时间变化的示意">
      <div class="window-top"><span class="window-name">物质分布的假想变化</span><span class="tag structure">课堂模型／非按比例</span></div>
      <div class="cvbox media min0">
        <svg class="model-svg" viewBox="0 0 680 420" role="img" aria-labelledby="model-title model-desc">
          <title id="model-title">原行星盘演化课堂模型</title><desc id="model-desc">滑块向后移动时，平滑尘埃盘逐渐显出环状聚集和低亮度缝隙。</desc>
          <defs><radialGradient id="dust"><stop offset="0" stop-color="var(--sun)" stop-opacity=".96"/><stop offset=".08" stop-color="var(--sun)" stop-opacity=".28"/><stop offset=".32" stop-color="var(--orbit)" stop-opacity=".22"/><stop offset="1" stop-color="var(--orbit)" stop-opacity=".02"/></radialGradient></defs>
          <ellipse cx="340" cy="210" rx="285" ry="142" fill="url(#dust)"/>
          <g id="smooth" fill="none" stroke="var(--orbit)" opacity=".23">
            <ellipse cx="340" cy="210" rx="250" ry="124" stroke-width="22"/><ellipse cx="340" cy="210" rx="192" ry="95" stroke-width="26"/><ellipse cx="340" cy="210" rx="126" ry="62" stroke-width="24"/>
          </g>
          <g id="rings" fill="none" stroke="var(--orbit)" opacity="0">
            <ellipse cx="340" cy="210" rx="270" ry="134" stroke-width="9"/><ellipse cx="340" cy="210" rx="222" ry="110" stroke-width="18"/><ellipse cx="340" cy="210" rx="157" ry="78" stroke-width="10"/><ellipse cx="340" cy="210" rx="102" ry="50" stroke-width="14"/>
          </g>
          <g id="gaps" fill="none" stroke="var(--bg)" opacity="0">
            <ellipse cx="340" cy="210" rx="246" ry="122" stroke-width="12"/><ellipse cx="340" cy="210" rx="185" ry="92" stroke-width="18"/><ellipse cx="340" cy="210" rx="128" ry="64" stroke-width="11"/>
          </g>
          <circle cx="340" cy="210" r="10" fill="var(--sun)"/><line x1="36" y1="42" x2="160" y2="42" stroke="var(--sun)" stroke-width="3"/><path d="M160 42l-14-8v16z" fill="var(--sun)"/>
        </svg>
        <span class="anno" style="left:18px;top:14px;color:var(--sun)">恒星来光</span>
        <span class="model-label">环线表示相对聚集，不是实体边界</span>
      </div>
    </section>
  </main>

  <section class="control-row">
    <div class="panel min0">
      <div class="ctl">
        <label for="time">盘演化时间</label>
        <input class="no-pan" id="time" type="range" min="0" max="100" value="0" step="1" aria-describedby="time-hint">
        <output id="pct" for="time">0%</output>
      </div>
      <div class="hint" id="time-hint">拖动并比较右侧物质分布；左侧观测始终不变</div>
      <div class="btns" style="margin-top:8px"><button class="btn" id="reset" type="button">复位</button></div>
    </div>
    <div class="panel readout" aria-live="polite">
      <span class="small">模型阶段</span><strong class="phase" id="phase">早期｜较平滑</strong>
      <span class="small" id="boundary">可能路径，不是所有盘的固定顺序</span>
    </div>
  </section>

  <footer class="caution">
    <p class="takeaway"><strong>盘、环和缝隙确实存在。</strong>但照片不是太阳系童年快照；暗缝也不等于“这里必有一颗行星”。</p>
    <div class="next"><span class="tag attention">下一问</span><br>微小颗粒怎样长成行星胚胎？</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
(function(){
  Deck.init({index:11,total:34});
  var slider=document.getElementById('time'), pct=document.getElementById('pct'), phase=document.getElementById('phase');
  var steps=[document.getElementById('s0'),document.getElementById('s1'),document.getElementById('s2')];
  var model=gsap.timeline({paused:true,defaults:{ease:'none'}})
    .addLabel('early',0)
    .to('#smooth',{opacity:.12,duration:1},0)
    .to('#rings',{opacity:.58,duration:1},0)
    .to('#gaps',{opacity:.38,duration:.55},.45)
    .addLabel('late',1);
  function update(){
    var v=Number(slider.value), idx=v<34?0:(v<67?1:2);
    model.progress(v/100).pause(); pct.value=v+'%';
    phase.textContent=idx===0?'早期｜较平滑':idx===1?'中段｜物质重分布':'后段｜环缝增强';
    steps.forEach(function(el,i){el.toggleAttribute('aria-current',i===idx);el.classList.toggle('done',i<idx);});
    gsap.fromTo(phase,{color:'var(--sun)',opacity:.65},{color:'var(--sun)',opacity:1,duration:.18,overwrite:true});
  }
  slider.addEventListener('input',update);
  document.getElementById('reset').addEventListener('click',function(){slider.value=0;update();slider.focus();});
  update();
  if(!Deck.reduced()){
    gsap.timeline({defaults:{duration:.45,ease:'power2.out'}})
      .from('.window:first-child',{opacity:0,y:10})
      .from('.process-strip .step',{opacity:0,x:-18,stagger:.16},'-=.15')
      .from('.process-strip .arw',{opacity:0,scaleX:0,stagger:.12},'-=.22')
      .from('.window:nth-child(2)',{opacity:0,y:10},'-=.18');
  }
})();
</script>
</body>
</html>
