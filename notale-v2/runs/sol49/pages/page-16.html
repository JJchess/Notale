<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .kicker{color:var(--orbit);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.12em;margin:0 0 5px}
    .hero{display:flex;align-items:center;justify-content:center;gap:54px;min-height:0;position:relative;border:1px solid rgba(76,201,240,.46)}.hero:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed rgba(76,201,240,.32);pointer-events:none}.hero>*{position:relative;z-index:1}
    .plate-note{width:300px;color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
    .plate-note strong{display:block;color:var(--text);font-size:var(--fs-h2);margin-bottom:6px}
    .route{height:1px;background:var(--orbit);opacity:.55;margin:12px 0}
    .planet-reveal{--split:50%;position:relative;width:460px;height:460px;flex:0 0 460px;border-radius:50%;overflow:hidden;isolation:isolate;background:var(--bg);touch-action:none}
    .planet-reveal img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;border-radius:50%;user-select:none;pointer-events:none}
    .planet-reveal .earth{clip-path:inset(0 calc(100% - var(--split)) 0 0)}
    .planet-reveal:after{content:"";position:absolute;top:0;bottom:0;left:var(--split);width:2px;background:var(--sun);box-shadow:0 0 16px var(--sun);transform:translateX(-1px)}
    .handle{position:absolute;z-index:3;left:var(--split);top:50%;width:34px;height:64px;border:2px solid var(--sun);border-radius:18px;background:var(--surface);transform:translate(-50%,-50%);display:grid;place-items:center;color:var(--sun);font-size:18px;pointer-events:none}
    .side-label{position:absolute;z-index:3;top:18px;padding:4px 9px;border:1px solid rgba(185,200,216,.5);border-radius:99px;background:var(--bg);font-size:var(--fs-label)}
    .side-label.v{right:20px}.side-label.e{left:20px}
    .range-overlay{position:absolute;z-index:4;inset:0;width:100%;height:100%;margin:0;border:0;padding:0;appearance:none;background:transparent;opacity:.001;cursor:ew-resize}
    .range-overlay:focus-visible{opacity:1;outline:3px solid var(--focus);outline-offset:-5px}
    .range-overlay::-webkit-slider-thumb{width:36px;height:456px;appearance:none;background:transparent}
    .k-comparison{border:1px solid rgba(76,201,240,.38)}.k-comparison>*:nth-child(3n+2),.k-comparison>*:nth-child(3n+3){border-left:1px solid rgba(76,201,240,.22)}.active-col{transition:opacity .18s,color .18s}.soft{opacity:.54}.hot{color:var(--sun)}
    .metric{display:flex;align-items:baseline;justify-content:center;gap:4px;text-align:center;font-size:var(--fs-sec);line-height:1.4}
    .temp .big{font-size:var(--fs-read-compact)}
    .conclusion{display:flex;align-items:center;justify-content:space-between;gap:24px;border-top:1px solid rgba(76,201,240,.45);padding-top:12px}
    @media (prefers-reduced-motion:reduce){.active-col{transition:none}}
  </style>
</head>
<body data-page="16" data-total="34">
  <div id="stage">
    <header style="height:82px">
      <p class="kicker">E2 · DIVERGENT WORLDS</p>
      <h1>金星与地球：相近大小，不同表面</h1>
    </header>

    <section class="hero min0" style="height:462px" aria-label="同尺度行星揭幕比较">
      <div class="plate-note">
        <strong>同尺度圆盘</strong>
        <span>半径只差约 <span id="radiusPct" class="num"></span></span>
        <div class="route"></div>
        <span>拖动中央揭幕线，比较两颗行星的真实影像。</span>
      </div>

      <div id="reveal" class="planet-reveal cvbox no-pan" style="--split:50%">
        <img src="assets/img/venus-magellan.jpg" alt="金星麦哲伦雷达拼接影像" title="金星麦哲伦雷达拼接影像">
        <img class="earth" src="assets/img/earth-apollo17.jpg" alt="" aria-hidden="true" title="阿波罗17号拍摄的地球">
        <span class="side-label e">地球影像</span>
        <span class="side-label v">金星雷达图</span>
        <span class="handle" aria-hidden="true">↔</span>
        <input id="split" class="range-overlay" type="range" min="0" max="100" value="50" aria-label="地球影像揭开比例">
      </div>

      <div class="plate-note">
        <strong>表面温差</strong>
        <span>相差约 <span id="tempDiff" class="num"></span><span class="unit">°C</span></span>
        <div class="route"></div>
        <span>金星图为雷达拼接影像，并非肉眼自然色照片。</span>
      </div>
    </section>

    <section class="k-comparison min0" style="flex:1;--compare-cols:2" aria-label="金星与地球四项对齐比较">
      <div></div><div id="vh" class="hdr active-col">金星</div><div id="eh" class="hdr active-col">地球</div>
      <div class="dim">平均半径</div><div class="metric active-col vcol"><span id="vr" class="num"></span><span class="unit">km</span></div><div class="metric active-col ecol"><span id="er" class="num"></span><span class="unit">km</span></div>
      <div class="rowline"></div>
      <div class="dim">全球平均表面温度</div><div class="metric temp diff active-col vcol"><span id="vt" class="big sm num"></span><span class="unit">°C</span></div><div class="metric temp diff active-col ecol"><span id="et" class="big sm num"></span><span class="unit">°C</span></div>
      <div class="rowline"></div>
      <div class="dim">近地表大气</div><div class="metric active-col vcol">稠密，CO₂ 主导</div><div class="metric active-col ecol">较稀薄，N₂、O₂ 主导</div>
      <div class="rowline"></div>
      <div class="dim">表面液态水与循环</div><div class="metric active-col vcol">无稳定海洋</div><div class="metric active-col ecol">有全球海洋与活跃水循环</div>
    </section>

    <footer class="conclusion" style="height:64px">
      <p class="lead" style="margin:0">大小相近不是命运相同：大气与水循环历史共同塑造了两种表面。</p>
      <div class="btns"><span class="hint" id="state">两侧各显示 50%</span><button id="reset" class="btn" type="button">复位比较</button></div>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Deck.init({index:16,total:34});
    const V=Lec.K.planets.venus,E=Lec.K.planets.earth;
    const c=k=>Math.round(k-273.15);
    document.querySelector('#vr').textContent=V.meanRadiusKm.toLocaleString('zh-CN',{minimumFractionDigits:1});
    document.querySelector('#er').textContent=E.meanRadiusKm.toLocaleString('zh-CN',{minimumFractionDigits:1});
    document.querySelector('#vt').textContent=c(V.meanSurfaceTemperatureK);
    document.querySelector('#et').textContent=c(E.meanSurfaceTemperatureK);
    document.querySelector('#tempDiff').textContent=Math.abs(c(V.meanSurfaceTemperatureK)-c(E.meanSurfaceTemperatureK));
    document.querySelector('#radiusPct').textContent=Math.round(V.meanRadiusKm/E.meanRadiusKm*100)+'%';
    const range=document.querySelector('#split'), reveal=document.querySelector('#reveal'), state=document.querySelector('#state');
    function update(){
      const n=Number(range.value); reveal.style.setProperty('--split',n+'%');
      state.textContent=`地球 ${n}% · 金星 ${100-n}%`;
      document.querySelectorAll('.ecol').forEach(el=>el.classList.toggle('soft',n<50));
      document.querySelectorAll('.vcol').forEach(el=>el.classList.toggle('soft',n>50));
      document.querySelector('#eh').classList.toggle('hot',n>50); document.querySelector('#vh').classList.toggle('hot',n<50);
    }
    function setFromPointer(e){const p=Deck.pt(reveal,e);range.value=Math.round(Deck.clamp(p.x/reveal.offsetWidth*100,0,100));update()}
    reveal.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons) setFromPointer(e)});
    reveal.addEventListener('pointerdown',e=>{reveal.setPointerCapture(e.pointerId);setFromPointer(e)});
    range.addEventListener('input',update);
    document.querySelector('#reset').addEventListener('click',()=>{range.value=50;update();range.focus()});
    update();
  </script>
</body>
</html>
