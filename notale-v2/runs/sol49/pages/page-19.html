<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .kicker {
      margin: 0 0 8px;
      color: var(--sun);
      font-family: var(--font-mono);
      font-size: var(--fs-label);
      font-weight: 650;
      line-height: 1.35;
      letter-spacing: .16em;
    }
    .page-title { margin: 0; max-width: 980px; }
    .process-wrap { position: relative; display: flex; min-width: 0; align-items: center; }
    .process-wrap::before {
      position: absolute;
      top: 50%;
      right: -56px;
      width: 260px;
      height: 2px;
      background: linear-gradient(90deg, var(--orbit), transparent);
      content: "";
      opacity: .8;
    }
    .process-wrap::after {
      position: absolute;
      z-index: 4;
      top: calc(50% - 5px);
      right: 86px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--orbit);
      box-shadow: 0 0 18px var(--orbit);
      content: "";
      animation: onward 5s linear infinite;
    }
    .k-process { width: 100%; flex: none; height: 500px; align-items: stretch; }
    .k-process > .step { padding: 26px 34px; border-color: var(--line); background: color-mix(in srgb, var(--surface) 72%, transparent); }
    .k-process > .step[aria-current="step"] { background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--sun) 8%, transparent)); }
    .step > :not(.orbit-field) { position: relative; z-index: 2; }
    .orbit-field { position: absolute; z-index: 0; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); color: var(--orbit); opacity: .58; pointer-events: none; }
    .orbit-field > span { position: absolute; top: 50%; left: 50%; border: 1px solid var(--orbit); border-radius: 50%; transform: translate(-50%,-50%) rotate(-8deg); }
    .orbit-field > span:nth-child(1) { width: 88%; height: 58%; }
    .orbit-field > span:nth-child(2) { width: 68%; height: 42%; }
    .orbit-field > span:nth-child(3) { width: 44%; height: 27%; }
    .orbit-field > i { position: absolute; top: 38%; left: 78%; width: 9px; height: 9px; border-radius: 50%; background: var(--orbit); box-shadow: 0 0 14px var(--orbit); }
    .step[aria-current="step"] .orbit-field { opacity: .58; }
    .step[aria-current="step"] .orbit-field > i { background: var(--sun); box-shadow: 0 0 16px var(--sun); }
    .phase-index {
      margin-bottom: 24px;
      color: var(--orbit);
      font-family: var(--font-mono);
      font-size: var(--fs-label);
      line-height: 1.35;
      letter-spacing: .1em;
    }
    .phase-time { margin: 0 0 10px; font-size: 22px; line-height: 1.3; }
    .phase-copy { margin: 0; max-width: 330px; color: var(--text); font-size: var(--fs-body); line-height: 1.5; }
    .phase-key { margin-top: 20px; color: var(--orbit); font-size: var(--fs-sec); line-height: 1.5; }
    .phase-state { margin-top: 8px; color: var(--muted); font-size: var(--fs-sec); line-height: 1.5; }
    .step[aria-current="step"] .phase-time,
    .step[aria-current="step"] .phase-state { color: var(--sun); }
    .closing { display: flex; min-width: 0; align-items: flex-start; justify-content: space-between; gap: 54px; border-top: 1px solid var(--line); padding-top: 22px; }
    .closing-main { margin: 0; max-width: 850px; font-size: var(--fs-lead); line-height: 1.5; }
    .next { margin: 0; max-width: 500px; padding-left: 18px; border-left: 2px solid var(--sun); color: var(--muted); font-size: var(--fs-sec); line-height: 1.5; }
    .sunwash {
      position: absolute;
      z-index: 0;
      top: 0;
      bottom: 0;
      left: 0;
      width: 440px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--sun) 13%, transparent), transparent);
      pointer-events: none;
      animation: light-in 900ms ease-out both;
    }
    .k-process > .step, .k-process > .arw { animation: reveal 650ms ease-out both; }
    .k-process > :nth-child(2) { animation-delay: 260ms; }
    .k-process > :nth-child(3) { animation-delay: 390ms; }
    .k-process > :nth-child(4) { animation-delay: 520ms; }
    .k-process > :nth-child(5) { animation-delay: 650ms; }
    @keyframes reveal { from { opacity: .76; transform: translateX(-18px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes light-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes onward { from { transform: translateX(-110px); opacity: .2; } 45% { opacity: 1; } to { transform: translateX(145px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .sunwash, .k-process > .step, .k-process > .arw, .process-wrap::after { animation: none; }
      .process-wrap::after { right: 28px; opacity: 1; }
    }
  </style>
</head>
<body data-page="19" data-total="34">
  <div id="stage">
    <img class="backdrop" src="assets/img/orbit-rings-bg.png" alt="" title="深空中的轨道环与太阳来光示意" style="opacity:.18">
    <div class="sunwash" aria-hidden="true"></div>

    <header style="height:112px">
      <p class="kicker">FROM ORIGIN TO EVOLUTION</p>
      <h1 class="page-title">太阳系没有冻结在诞生那一天</h1>
    </header>

    <main class="process-wrap min0" style="flex:1" aria-label="太阳系从形成走向持续演化的过程">
      <div class="k-process min0">
        <div class="axis" aria-hidden="true"></div>
        <section class="step done min0">
          <svg class="orbit-field" viewBox="0 0 360 150" aria-hidden="true"><ellipse cx="180" cy="75" rx="158" ry="58" fill="none" stroke="currentColor"/><ellipse cx="180" cy="75" rx="118" ry="42" fill="none" stroke="currentColor"/><ellipse cx="180" cy="75" rx="76" ry="26" fill="none" stroke="currentColor"/><circle cx="305" cy="42" r="6" fill="currentColor"/></svg>
          <div class="phase-index">01 · 起点</div>
          <h2 class="phase-time">形成时</h2>
          <p class="phase-copy">同一原行星盘留下总体结构</p>
          <div class="phase-key">总体结构</div>
          <div class="phase-state">已发生</div>
        </section>
        <div class="arw" aria-hidden="true"></div>
        <section class="step done min0">
          <svg class="orbit-field" viewBox="0 0 360 150" aria-hidden="true"><ellipse cx="180" cy="75" rx="158" ry="58" fill="none" stroke="currentColor"/><ellipse cx="180" cy="75" rx="118" ry="42" fill="none" stroke="currentColor"/><ellipse cx="180" cy="75" rx="76" ry="26" fill="none" stroke="currentColor"/><circle cx="305" cy="42" r="6" fill="currentColor"/></svg>
          <div class="phase-index">02 · 结果</div>
          <h2 class="phase-time">分化后</h2>
          <p class="phase-copy">距离、质量与物质塑造不同世界</p>
          <div class="phase-key">不同世界</div>
          <div class="phase-state">已发生</div>
        </section>
        <div class="arw" aria-hidden="true"></div>
        <section class="step min0" aria-current="step">
          <svg class="orbit-field" viewBox="0 0 360 150" aria-hidden="true"><ellipse cx="180" cy="75" rx="158" ry="58" fill="none" stroke="currentColor"/><ellipse cx="180" cy="75" rx="118" ry="42" fill="none" stroke="currentColor"/><ellipse cx="180" cy="75" rx="76" ry="26" fill="none" stroke="currentColor"/><circle cx="305" cy="42" r="6" fill="currentColor"/></svg>
          <div class="phase-index">03 · 现在</div>
          <h2 class="phase-time">今天</h2>
          <p class="phase-copy">引力仍让整个系统继续变化</p>
          <div class="phase-key">动态系统</div>
          <div class="phase-state">正在发生</div>
          <div class="small" style="margin-top:8px">过程仍在延伸</div>
        </section>
      </div>
    </main>

    <footer class="closing min0" style="height:148px">
      <p class="closing-main">形成解释了总体分区，却没有把太阳系冻结在诞生那一天。变化从未停止，今天的太阳系仍是一套运行中的动态系统。</p>
      <p class="next">接下来：离太阳更远的行星，要用多长时间走完一年？</p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>Deck.init({index:19,total:34});</script>
</body>
</html>
