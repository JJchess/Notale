<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .kicker{color:var(--orbit);font-size:var(--fs-label);font-weight:700;letter-spacing:.08em;line-height:1.35;margin-bottom:6px}
    .chart-shell{position:relative;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    #chart{display:block;width:100%;height:100%}
    #chart text{font-family:var(--font-sans);fill:var(--muted);font-size:14px}
    #chart .tick-number{font-family:var(--font-mono);font-size:13px}
    #chart .domain,#chart .tick line{stroke:var(--line)}
    #chart .grid line{stroke:var(--line);stroke-opacity:.48;stroke-dasharray:3 7}
    #chart .grid .domain{display:none}
    .formula{position:absolute;top:18px;right:22px;padding:8px 12px;border-right:2px solid var(--orbit);color:var(--text);font-size:var(--fs-sec);line-height:1.4;background:var(--bg)}
    .chart-note{position:absolute;left:76px;bottom:10px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
    .control-strip{display:flex;align-items:center;gap:18px}
    .control-strip label{font-size:var(--fs-label);font-weight:650}
    .control-strip input{width:150px;min-height:44px;padding:6px 12px;border:1px solid var(--orbit);border-radius:9px;color:var(--text);background:var(--bg);font:700 22px/1.3 var(--font-mono)}
    .control-strip input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    .readcell{display:flex;align-items:baseline;justify-content:center;color:var(--text);font-size:var(--fs-body);line-height:1.4}
    .current-cell{color:var(--sun)}
    .closing{margin:0;padding:13px 18px;border-left:4px solid var(--sun);font-size:var(--fs-lead);font-weight:650;line-height:1.5}
    .handoff{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.5;text-align:right}
  </style>
</head>
<body data-page="20" data-total="34">
  <div id="stage">
    <header style="height:82px">
      <div class="kicker">III · 今天仍在演化</div>
      <h1 style="margin:0">越远，一年增长得越快</h1>
    </header>

    <main class="min0" style="flex:1;display:flex;flex-direction:column;gap:14px">
      <section class="chart-shell cvbox min0" style="flex:1" aria-label="半长轴与公转周期关系图">
        <svg id="chart" role="img" aria-label="横轴是半长轴，纵轴是公转周期。曲线向上变陡。"></svg>
        <div class="formula"><span class="num">P² = a³</span><br><span style="color:var(--muted)">绕太阳的课堂近似</span></div>
        <div class="chart-note">课堂模型 · 横轴为半长轴</div>
      </section>

      <section class="panel" style="height:82px;display:flex;align-items:center;justify-content:space-between;gap:24px" aria-label="距离输入仪器">
        <div class="control-strip min0">
          <label for="axis-input">输入半长轴 a</label>
          <input id="axis-input" type="number" min="0.4" max="30.2" step="0.1" value="1.0" inputmode="decimal" aria-describedby="input-hint">
          <span class="unit">AU</span>
          <span id="input-hint" class="hint">输入 0.4–30.2，或用上下键微调</span>
        </div>
        <button id="reset" class="btn" type="button">复位到地球</button>
      </section>

      <section class="k-comparison min0" style="--compare-cols:2;height:260px" aria-label="地球、当前输入、木星和海王星的轨道比较">
        <div class="dim">对象</div><div class="hdr">半长轴 a</div><div class="hdr">公转周期 P</div>
        <div class="rowline"></div>
        <div class="dim">地球</div><div class="readcell"><span id="earth-a" class="num"></span><span class="unit">AU</span></div><div class="readcell"><span id="earth-p" class="num"></span><span class="unit">年</span></div>
        <div class="rowline"></div>
        <div class="dim diff">当前输入</div><div class="readcell current-cell"><span id="current-a" class="num"></span><span class="unit">AU</span></div><div class="readcell current-cell"><span id="current-p" class="big sm"></span><span class="unit">年</span></div>
        <div class="rowline"></div>
        <div class="dim">木星</div><div class="readcell"><span id="jupiter-a" class="num"></span><span class="unit">AU</span></div><div class="readcell"><span id="jupiter-p" class="num"></span><span class="unit">年</span></div>
        <div class="rowline"></div>
        <div class="dim">海王星</div><div class="readcell"><span id="neptune-a" class="num"></span><span class="unit">AU</span></div><div class="readcell"><span id="neptune-p" class="num"></span><span class="unit">年</span></div>
      </section>
    </main>

    <footer style="height:82px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px">
      <p class="closing">距离变大时，“一年”增长得比距离本身更快：海王星走完一圈，地球已走约 165 圈。</p>
      <p class="handoff">下一页：一年为何不只取决于跑道有多长？</p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script>
    Deck.init({index:20,total:34});
    const planets=Lec.K.planets;
    const earthA=planets.earth.semimajorAxisAU;
    const jupiterA=planets.jupiter.semimajorAxisAU;
    const neptuneA=planets.neptune.semimajorAxisAU;
    const period=a=>Lec.P.keplerPeriodYearsFromAU(a);
    const byId=id=>document.getElementById(id);
    const fmtP=v=>v>100?v.toFixed(1):v.toFixed(2);
    byId('earth-a').textContent=earthA.toFixed(2);
    byId('earth-p').textContent=period(earthA).toFixed(2);
    byId('jupiter-a').textContent=jupiterA.toFixed(4);
    byId('jupiter-p').textContent=period(jupiterA).toFixed(2);
    byId('neptune-a').textContent=neptuneA.toFixed(4);
    byId('neptune-p').textContent=fmtP(period(neptuneA));

    const svg=d3.select('#chart');
    const W=1488,H=330,margin={top:24,right:54,bottom:58,left:76};
    svg.attr('viewBox',`0 0 ${W} ${H}`);
    const x=d3.scaleLinear().domain([0,30.2]).range([margin.left,W-margin.right]);
    const y=d3.scaleLinear().domain([0,170]).range([H-margin.bottom,margin.top]);
    const xTicks=[1,5,10,20,30], yTicks=[1,10,50,100,165];
    svg.append('g').attr('class','grid').attr('transform',`translate(0,${H-margin.bottom})`).call(d3.axisBottom(x).tickValues(xTicks).tickSize(-(H-margin.top-margin.bottom)).tickFormat(''));
    svg.append('g').attr('class','grid').attr('transform',`translate(${margin.left},0)`).call(d3.axisLeft(y).tickValues(yTicks).tickSize(-(W-margin.left-margin.right)).tickFormat(''));
    const xa=svg.append('g').attr('transform',`translate(0,${H-margin.bottom})`).call(d3.axisBottom(x).tickValues(xTicks).tickFormat(d=>d));
    const ya=svg.append('g').attr('transform',`translate(${margin.left},0)`).call(d3.axisLeft(y).tickValues(yTicks).tickFormat(d=>d));
    xa.selectAll('text').attr('class','tick-number'); ya.selectAll('text').attr('class','tick-number');
    svg.append('text').attr('x',W-margin.right).attr('y',H-15).attr('text-anchor','end').text('半长轴 a（AU）');
    svg.append('text').attr('transform','rotate(-90)').attr('x',-margin.top).attr('y',20).attr('text-anchor','end').text('公转周期 P（年）');
    const data=d3.range(.4,30.21,.08).map(a=>({a,p:period(a)}));
    const curve=svg.append('path').datum(data).attr('fill','none').attr('stroke','var(--orbit)').attr('stroke-width',3).attr('d',d3.line().x(d=>x(d.a)).y(d=>y(d.p)).curve(d3.curveMonotoneX));
    if(!Deck.reduced()){
      const len=curve.node().getTotalLength();
      curve.attr('stroke-dasharray',`${len} ${len}`).attr('stroke-dashoffset',len).transition().duration(700).ease(d3.easeCubicOut).attr('stroke-dashoffset',0);
    }
    const guide=svg.append('line').attr('y1',H-margin.bottom).attr('stroke','var(--sun)').attr('stroke-width',2).attr('stroke-dasharray','5 5');
    const point=svg.append('circle').attr('r',7).attr('fill','var(--sun)').attr('stroke','var(--bg)').attr('stroke-width',3);
    const pointLabel=svg.append('text').attr('fill','var(--sun)').attr('font-weight',700).text('当前输入');
    function update(raw,animate=true){
      const a=Math.max(.4,Math.min(30.2,Number(raw)));
      if(!Number.isFinite(a)) return;
      const p=period(a), duration=animate&&!Deck.reduced()?250:0;
      byId('current-a').textContent=a.toFixed(1);
      byId('current-p').textContent=fmtP(p);
      guide.transition().duration(duration).attr('x1',x(a)).attr('x2',x(a)).attr('y2',y(p));
      point.transition().duration(duration).attr('cx',x(a)).attr('cy',y(p));
      pointLabel.transition().duration(duration).attr('x',x(a)+12).attr('y',Math.max(margin.top+18,y(p)-10));
    }
    const input=byId('axis-input');
    input.addEventListener('input',()=>update(input.value));
    input.addEventListener('change',()=>{let v=Math.max(.4,Math.min(30.2,Number(input.value)||earthA));input.value=v.toFixed(1);update(v)});
    byId('reset').addEventListener('click',()=>{input.value=earthA.toFixed(1);update(earthA);input.focus()});
    update(earthA,false);
  </script>
</body>
</html>
