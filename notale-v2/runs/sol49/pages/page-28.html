<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .kicker{color:var(--orbit);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.12em;margin-bottom:5px}
    evidence-mission-game{display:block;flex:1;min-height:0}
  </style>
</head>
<body data-page="28" data-total="34">
  <div id="stage">
    <header style="height:78px">
      <div class="kicker">EVIDENCE × MISSION</div>
      <h1>把证据贴给合适的任务</h1>
    </header>
    <evidence-mission-game class="min0" aria-label="证据目标与任务形式匹配游戏"></evidence-mission-game>
    <footer style="height:62px;display:flex;align-items:flex-end;justify-content:space-between;gap:28px">
      <p class="lead" style="margin:0">飞越、环绕、着陆和采样返回回答的问题不同，任务形式必须匹配证据目标。</p>
      <p class="small" style="margin:0;white-space:nowrap">下一步：任务选定后，要带什么测量工具？</p>
    </footer>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script src="assets/lib/seedrandom.min.js"></script>
  <script>
  class EvidenceMissionGame extends HTMLElement{
    constructor(){
      super();
      this.items=[
        {id:'europa',target:'flyby',world:'木卫二',img:'assets/img/europa-galileo.jpg',ask:'先快速确认裂纹地貌是否值得回访',detail:'短时近距离经过；适合全局初识与重点区域侦察'},
        {id:'enceladus',target:'orbit',world:'土卫二',img:'assets/img/enceladus-plumes.jpg',ask:'反复追踪喷流何时、何处变化',detail:'长期留在目标系统；适合重复覆盖与变化记录'},
        {id:'mars',target:'land',world:'火星',img:'assets/img/curiosity-selfie.jpg',ask:'直接读取某处岩层与地表环境',detail:'到达表面；得到局地、带地质上下文的证据'},
        {id:'bennu',target:'return',world:'贝努',img:'assets/img/asteroid-bennu.jpg',ask:'把颗粒带回地球继续检验',detail:'返回真实样品；可在实验室反复开展高精度分析'}
      ];
      this.targets=[['flyby','飞越','经过'],['orbit','环绕','留下'],['land','着陆','落下'],['return','采样返回','带回']];
      this.round=0; this.reset(false);
    }
    connectedCallback(){this.render();this.start()}
    fresh(){return {placed:{},selected:null,moves:0,complete:false}}
    start(){this.dispatchEvent(new CustomEvent('game-start',{bubbles:true,composed:true}));}
    reset(emit=true){this.state=this.fresh();this.round++;let rng=new Math.seedrandom('page-28-'+this.round);this.order=this.items.slice().sort(()=>rng()-.5);if(this&&this.innerHTML)this.render();if(emit)this.dispatchEvent(new CustomEvent('game-reset',{bubbles:true,composed:true}));}
    getState(){return JSON.parse(JSON.stringify(this.state))}
    place(id,target){
      if(this.state.placed[id])return;
      this.state.moves++;
      const item=this.items.find(x=>x.id===id);
      if(item.target===target){
        this.state.placed[id]=target;this.state.selected=null;
        this.state.complete=Object.keys(this.state.placed).length===4;
        this.render();
        const detail={state:this.getState(),action:'match',metrics:{matched:Object.keys(this.state.placed).length,moves:this.state.moves}};
        this.dispatchEvent(new CustomEvent('game-progress',{detail,bubbles:true,composed:true}));
        if(this.state.complete)this.dispatchEvent(new CustomEvent('game-complete',{detail:{score:4,metrics:detail.metrics,trace:Object.keys(this.state.placed)},bubbles:true,composed:true}));
      }else{
        const z=this.querySelector('[data-target="'+target+'"]');z.classList.remove('miss');void z.offsetWidth;z.classList.add('miss');
        this.state.selected=null;this.status('这张证据需要另一种任务形式。卡片已回到托盘。');this.updateSelection();
      }
    }
    status(s){this.querySelector('#status').textContent=s}
    updateSelection(){this.querySelectorAll('.e-card').forEach(el=>el.classList.toggle('selected',el.dataset.id===this.state.selected));}
    render(){
      const placed=this.state.placed;
      this.innerHTML=`<style>
        evidence-mission-game{display:block;color:var(--text);font-family:var(--font-sans)}*{box-sizing:border-box}
        .game{height:100%;display:flex;flex-direction:column;min-height:0}.top{height:48px;display:grid;grid-template-columns:1.2fr 1fr auto;align-items:center;gap:18px}.hint{color:var(--muted);font-size:var(--fs-label);line-height:1.45}.hint:before{content:'›';color:var(--sun);margin-right:.55em}.btn{min-height:40px;padding:8px 15px;border:1px solid rgba(76,201,240,.58);border-radius:9px;color:var(--text);background:transparent;font:650 var(--fs-label)/1.4 var(--font-sans);cursor:pointer}.btn:focus-visible,.e-card:focus-visible,.box:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
        .k-classification{display:flex;flex:1;min-height:0;flex-direction:column}.root{height:36px;display:flex;align-items:center;gap:14px;color:var(--orbit);font-size:var(--fs-h2);font-weight:680}.root:after{content:'';height:1px;background:rgba(76,201,240,.55);flex:1}.branches{height:290px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding-top:14px}.box{position:relative;min-width:0;padding:14px 15px;border:1px solid rgba(76,201,240,.48);border-radius:10px;background:transparent;transition:border-color .18s}.box:before,.box:after{content:'';position:absolute;background:rgba(76,201,240,.32)}.box:before{width:24px;height:1px;right:12px;top:12px}.box:after{width:1px;height:24px;right:23px;top:1px}.bt{display:inline-block;margin:-27px 0 8px;padding:0 8px;color:var(--orbit);background:var(--bg);font-size:var(--fs-h2);font-weight:680;line-height:1.3}.verb{float:right;color:var(--muted);font-size:var(--fs-label)}.slot{height:116px;margin-top:6px;border-top:1px solid rgba(76,201,240,.32);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:var(--fs-label)}.ability{margin:7px 0 0;color:var(--muted);font-size:var(--fs-sec);line-height:1.42}.line{height:2px;background:var(--orbit);margin-top:6px}.miss{animation:pulse .34s ease 2;border-color:var(--sun)}@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(255,183,3,.18)}}
        .tray{height:270px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(76,201,240,.4)}.tray-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.tag{display:inline-flex;min-height:28px;padding:3px 10px;align-items:center;border:1px solid currentColor;border-radius:999px;color:var(--evidence);font-size:var(--fs-label);font-weight:650}.count{color:var(--muted);font:var(--fs-label)/1.4 var(--font-mono)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.e-card{height:178px;display:grid;grid-template-columns:112px 1fr;gap:12px;padding:10px;border:1px solid rgba(185,200,216,.42);border-radius:10px;background:transparent;color:var(--text);text-align:left;cursor:grab}.e-card.selected{border-color:var(--sun);box-shadow:inset 0 -3px 0 var(--sun)}.cvbox{min-width:0;min-height:0;overflow:hidden;border-radius:7px}.cvbox img{width:100%;height:100%;object-fit:cover}.world{display:block;font-size:var(--fs-sec);font-weight:700;margin-bottom:5px}.ask{display:block;font-size:var(--fs-sec);line-height:1.42;color:var(--text)}.mini{width:100%;height:100%;object-fit:cover;border-radius:6px}.locked{width:100%;height:100%;display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:center}.locked .ask{font-size:var(--fs-label)}.done{color:var(--sun);font-size:var(--fs-sec);font-weight:680}.status{color:var(--muted);font-size:var(--fs-sec);line-height:1.4;min-height:23px}
        @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
      </style><div class="game">
        <div class="top"><div class="hint">拖动证据卡；键盘可先选卡片，再选任务框</div><div id="status" class="status" aria-live="polite">${this.state.complete?'匹配完成。四种任务对应四种证据能力。':'请选择一张证据卡。'}</div><button class="btn" id="reset">重新匹配</button></div>
        <div class="k-classification"><div class="root">任务形式 <span class="tag">4 种证据能力</span></div><div class="branches">
          ${this.targets.map(t=>{const hit=this.items.find(x=>placed[x.id]===t[0]);return `<section class="box" tabindex="0" role="button" aria-label="${t[1]}任务框" data-target="${t[0]}"><div class="bt">${t[1]}</div><span class="verb">${t[2]}</span><div class="slot">${hit?`<div class="locked"><img class="mini" src="${hit.img}" alt="${hit.world}真实影像"><div><div class="world">${hit.world}</div><div class="ask">${hit.ask}</div></div></div>`:'放入证据目标'}</div>${hit?`<div class="line"></div><p class="ability">${hit.detail}</p>`:''}</section>`}).join('')}
        </div><div class="tray"><div class="tray-head"><span class="tag">待匹配的证据目标</span><span class="count">${Object.keys(placed).length} / 4 已归位</span></div><div class="cards">${this.order.filter(x=>!placed[x.id]).map(x=>`<button class="e-card" draggable="true" data-id="${x.id}" aria-label="${x.world}：${x.ask}"><span class="cvbox"><img src="${x.img}" alt="${x.world}真实影像" title="任务影像证据"></span><span><span class="world">${x.world}</span><span class="ask">${x.ask}</span></span></button>`).join('')}${this.state.complete?'<div class="done">四类证据目标已全部匹配。</div>':''}</div></div></div></div>`;
      this.bind();
    }
    bind(){
      this.querySelector('#reset').onclick=()=>this.reset();
      this.querySelectorAll('.e-card').forEach(c=>{c.onclick=()=>{this.state.selected=c.dataset.id;this.updateSelection();this.status('已选择证据卡，请选择一个任务框。')};c.ondragstart=e=>{e.dataTransfer.setData('text/plain',c.dataset.id);this.state.selected=c.dataset.id}});
      this.querySelectorAll('.box').forEach(b=>{b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();this.place(e.dataTransfer.getData('text/plain'),b.dataset.target)};b.onclick=()=>{if(this.state.selected)this.place(this.state.selected,b.dataset.target)};b.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&this.state.selected){e.preventDefault();this.place(this.state.selected,b.dataset.target)}}});
    }
  }
  customElements.define('evidence-mission-game',EvidenceMissionGame);
  Deck.init({index:28,total:34});
  </script>
</body>
</html>
