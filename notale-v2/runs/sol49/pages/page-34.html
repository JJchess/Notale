<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line)}
  .kicker{margin:0 0 8px;color:var(--orbit);font:650 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.14em}
  .page-head h1{margin:0 0 16px}
  .course-mark{margin:0 0 18px;color:var(--faint);font:var(--fs-label)/1.35 var(--font-mono);letter-spacing:.08em}
  .synthesis{position:relative;padding:22px 42px 0}
  .orbit-field{position:absolute;z-index:-1;inset:18px 2px 6px;pointer-events:none}
  .orbit-ring{position:absolute;left:50%;top:54%;border:1px solid rgba(76,201,240,.20);border-radius:50%;transform:translate(-50%,-50%) rotate(-4deg)}
  .orbit-ring:nth-child(1){width:1080px;height:330px}.orbit-ring:nth-child(2){width:1220px;height:420px}.orbit-ring:nth-child(3){width:1360px;height:500px}
  .planet-arc{position:absolute;left:50%;bottom:-120px;width:1180px;height:430px;border:1px solid rgba(76,201,240,.28);border-radius:50%;background:rgba(16,24,39,.72);transform:translateX(-50%);box-shadow:inset 0 18px 50px rgba(76,201,240,.08)}
  .synthesis>.claim{display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(90deg,transparent,rgba(255,183,3,.08),transparent)}
  .claim-main{color:var(--sun);font-size:26px;font-weight:750}
  .claim-sub{color:var(--text);font-size:var(--fs-lead);font-weight:560}
  .synthesis>.trunk{position:relative}
  .synthesis>.trunk::after{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:1160px;border-top:1px solid rgba(76,201,240,.46);content:""}
  .supports{--support-cols:4}
  .support{display:block;min-height:470px;border-bottom:1px solid rgba(76,201,240,.22);color:var(--muted);font-size:var(--fs-sec);line-height:1.5;background:linear-gradient(180deg,rgba(76,201,240,.16),rgba(16,24,39,.94))}
  .support-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:var(--text);font-size:var(--fs-h2);font-weight:680}
  .support p{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.5}
  .support.e4{outline:1px solid rgba(185,200,216,.24);outline-offset:-5px}
  .reticle{position:absolute;right:14px;top:20px;width:34px;height:34px;border:1px solid var(--evidence);opacity:.48}
  .reticle::before,.reticle::after{position:absolute;background:var(--evidence);content:""}
  .reticle::before{left:16px;top:-7px;width:1px;height:46px}.reticle::after{left:-7px;top:16px;width:46px;height:1px}
  .trunk-words{position:absolute;z-index:2;left:50%;top:50%;display:flex;align-items:center;gap:12px;transform:translate(-50%,-50%);padding:4px 18px;color:var(--orbit);background:var(--bg);font:650 var(--fs-sec)/1.35 var(--font-sans);white-space:nowrap}
  .trunk-words b{color:var(--faint);font-family:var(--font-mono)}
  .closing{display:flex;align-items:flex-end;justify-content:space-between;gap:48px;border-top:1px solid rgba(76,201,240,.24);color:var(--sun);font-size:var(--fs-lead);font-weight:650;line-height:1.5}
  .closing-main{max-width:920px;margin:0 0 6px;color:var(--sun);font-size:var(--fs-lead);font-weight:650;line-height:1.5}
  .closing-question{max-width:470px;margin:0 0 6px;color:var(--evidence);font-size:var(--fs-sec);line-height:1.5;text-align:right}
  .backdrop{opacity:.18;animation:scene-in 1.8s ease-out both}
  .synthesis>.trunk,.supports{animation:line-in 1.2s .45s ease-out both;transform-origin:top center}
  .support{animation:support-in .55s ease-out both}.support:nth-child(1){animation-delay:.7s}.support:nth-child(2){animation-delay:.86s}.support:nth-child(3){animation-delay:1.02s}.support:nth-child(4){animation-delay:1.18s}
  .closing-main{animation:glow-in .8s 1.45s ease-out both}
  @keyframes scene-in{from{opacity:0}to{opacity:.18}}
  @keyframes line-in{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
  @keyframes support-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes glow-in{from{opacity:.2;text-shadow:none}to{opacity:1;text-shadow:0 0 18px rgba(255,183,3,.16)}}
  @media (prefers-reduced-motion:reduce){.backdrop,.synthesis>.trunk,.supports,.support,.closing-main{animation:none}}
</style>
</head>
<body data-page="34" data-total="34">
<div id="stage">
  <img class="backdrop" src="assets/img/planet-horizon-bg.png" alt="" title="AI生成的行星地平线与轨道氛围示意图">

  <header class="page-head" style="height:104px">
    <div>
      <p class="kicker">SYSTEM · HISTORY · EVIDENCE</p>
      <h1>每颗行星，都是历史的结果</h1>
    </div>
    <p class="course-mark">太阳系 · 第二讲 / 结语</p>
  </header>

  <main class="k-generalization synthesis min0" style="flex:1" aria-label="太阳系作为共同历史与证据系统的总结">
    <div class="orbit-field" aria-hidden="true">
      <span class="orbit-ring"></span><span class="orbit-ring"></span><span class="orbit-ring"></span><span class="planet-arc"></span>
    </div>
    <div class="claim">
      <span class="claim-main">太阳系不是天体名单</span>
      <span class="claim-sub">而是一段仍在继续、也能被检验的共同历史。</span>
    </div>
    <div class="trunk" aria-hidden="true">
      <div class="trunk-words">
        <span>共同形成史</span><b>→</b><span>不同世界</span><b>→</b><span>持续演化</span><b>→</b><span>任务检验</span>
      </div>
    </div>
    <div class="supports">
      <section class="support">
        <div class="support-head"><span class="tag structure">E1</span><span>结构</span></div>
        同向、共面与内外分区，显示太阳系不是随机拼盘。
      </section>
      <section class="support">
        <div class="support-head"><span class="tag structure">E2</span><span>分化</span></div>
        共同起源之后，日照、质量、物质与大气塑造不同世界。
      </section>
      <section class="support">
        <div class="support-head"><span class="tag structure">E3</span><span>演化</span></div>
        引力、共振、碰撞与小天体输运，使系统至今仍在变化。
      </section>
      <section class="support e4">
        <span class="reticle" aria-hidden="true"></span>
        <div class="support-head"><span class="tag evidence">E4</span><span>证据</span></div>
        飞越、环绕、着陆与采样返回，让这些解释能够被检验。
      </section>
    </div>
  </main>

  <footer class="closing" style="height:112px">
    离开课堂时，应把每颗行星看成同一系统历史中的一个结果和一份证据。
    <span class="closing-question">再看一颗行星：它为何成为这样？我们凭什么这样判断？</span>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:34,total:34});</script>
</body>
</html>
