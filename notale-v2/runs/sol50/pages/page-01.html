<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .solar-image{left:auto; width:66%; object-fit:contain; object-position:right center; opacity:.18; animation:sun-in .7s ease-out both}
  #stage>.orbit-field{position:absolute; z-index:1; inset:0; width:100%; height:100%; pointer-events:none}
  .orbit-field .orbit-arc{stroke-dasharray:1900; stroke-dashoffset:1900; animation:trace 1s .35s cubic-bezier(.22,.7,.2,1) forwards}
  .opening{display:flex; flex:1; min-width:0; min-height:0; align-items:stretch}
  .copy{position:absolute; top:78px; left:0; display:block; width:670px; min-width:0; min-height:0; box-sizing:border-box}
  .kicker{margin:0 0 26px; color:var(--orbit); font-family:var(--font-mono); font-size:var(--fs-label); font-weight:650; letter-spacing:.14em; line-height:1.35}
  .title{margin:0 0 26px; animation:copy-in .55s .18s ease-out both}
  .k-generalization{width:650px; height:280px; animation:copy-in .55s .28s ease-out both}
  .k-generalization>.claim{font-size:28px; padding-top:12px; padding-bottom:12px}
  .k-generalization>.supports{align-content:start; gap:10px; padding-top:24px}
  .k-generalization>.supports>.support{font-size:var(--fs-lead); color:var(--text); animation:support-in .38s ease-out both}
  .k-generalization>.supports>.support:nth-of-type(2){animation-delay:.9s}
  .k-generalization>.supports>.support:nth-of-type(3){animation-delay:1.08s}
  .support strong{display:inline-block; width:72px; color:var(--orbit); font-weight:720}
  .closing{margin:20px 0 0; max-width:630px; color:var(--muted); font-size:var(--fs-lead); line-height:1.5}
  @keyframes sun-in{from{opacity:0}to{opacity:.18}}
  @keyframes copy-in{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
  @keyframes trace{to{stroke-dashoffset:0}}
  @keyframes support-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.solar-image,.orbit-field .orbit-arc,.title,.k-generalization,.k-generalization>.supports>.support{animation:none}}
</style>
</head>
<body data-page="01" data-total="30">
<div id="stage">
  <img class="backdrop solar-image" src="assets/img/sun-sdo.jpg" alt="" title="Image of Sun From NASA’s Solar Dynamics Observatory (PIA26681).jpg · NASA/GSFC/Solar Dynamics Observatory · Public domain">
  <svg class="orbit-field" style="position:absolute" viewBox="0 0 1600 900" aria-hidden="true">
    <path class="orbit-arc" d="M690 620 C820 230 1360 180 1588 374" opacity=".72"/>
    <path class="orbit-arc" d="M470 730 C700 105 1370 80 1588 246" opacity=".46"/>
    <path class="orbit-arc" d="M250 840 C540 24 1320 18 1588 138" opacity=".24"/>
  </svg>
  <main class="opening min0">
    <section class="copy min0" aria-labelledby="page-title">
      <p class="kicker"><span>LECTURE 02</span><span aria-hidden="true"> · </span><span>SOLAR SYSTEM</span></p>
      <h1 class="title" id="page-title"><span>认识</span><span>太阳系</span></h1>
      <div class="k-generalization">
        <div class="claim"><span>不是名单，</span><span>是系统</span></div>
        <div class="supports">
          <div class="trunk" aria-hidden="true"></div>
          <div class="support"><strong>结构</strong><span>成员彼此</span><span>有关系</span></div>
          <div class="support"><strong>历史</strong><span>今天的排列</span><span>有来处</span></div>
        </div>
      </div>
      <p class="closing"><span>太阳系不是</span><span>八颗球的名单，</span><span>而是一个</span><span>有结构、</span><span>有历史的系统。</span><br><span>这一讲要认识的不是“都有谁”，</span><span>而是“它们为何共同成为今天这个太阳系”。</span></p>
    </section>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
