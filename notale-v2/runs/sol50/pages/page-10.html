<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .kicker{height:24px;color:var(--orbit);font:700 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.14em}
  .titlebar{height:58px;display:flex;align-items:flex-start;justify-content:space-between}
  .titlebar h1{margin:0}.titlebar .small{margin-top:8px}
  .compare-wrap{display:flex;flex:1;min-height:0;gap:18px}
  .k-comparison{--compare-cols:1;grid-template-columns:154px minmax(0,1fr);grid-template-rows:54px 190px 1px minmax(260px,1fr)}
  .k-comparison>.hdr{padding:8px 18px}.k-comparison>.dim{justify-content:flex-start;text-align:left;flex-direction:column;align-items:flex-start;gap:8px}
  .k-comparison>.cell{padding:8px 18px}.k-comparison>.rowline{padding:0}
  .track{position:relative;width:100%;height:100%;background:rgba(82,214,232,.045);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}.axisline{position:absolute;left:2%;right:2%;top:88px;border-top:2px solid var(--orbit);box-shadow:0 0 9px var(--line)}
  .sun{position:absolute;left:2%;top:75px;color:var(--sun);font-size:24px;transform:translateX(-50%)}
  .planet{position:absolute;top:81px;width:16px;height:16px;border:2px solid var(--orbit);border-radius:50%;background:var(--bg);transform:translateX(-50%);z-index:2}
  .planet.active{border-color:var(--sun);background:var(--sun)}
  .pname{position:absolute;top:104px;color:var(--muted);font-size:var(--fs-label);line-height:1.35;transform:translateX(-50%);white-space:nowrap}
  .guide{position:absolute;top:17px;height:64px;border-left:1px solid var(--line);transform:translateX(-50%)}
  .tick{position:absolute;top:148px;color:var(--muted);font:var(--fs-tick)/1.35 var(--font-mono);transform:translateX(-50%);white-space:nowrap}
  .tick:before{content:"";display:block;height:9px;border-left:1px solid var(--line);margin:0 auto 3px}
  .callout{position:absolute;top:8px;padding:5px 9px;color:var(--sun);border:1px solid rgba(255,181,71,.55);border-radius:7px;font-size:var(--fs-label);line-height:1.35;white-space:nowrap}
  .controls{width:310px;display:flex;flex-direction:column;justify-content:space-between}.controls .ctl{display:flex;flex-direction:column;align-items:stretch;gap:10px}.controls .ctl output{color:var(--sun)}
  .readout-name{color:var(--muted);font-size:var(--fs-label)}
  .conclusion{height:62px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line-soft)}
  .conclusion p{margin:0;font-size:var(--fs-lead);font-weight:700}.next{font-size:var(--fs-sec);color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body data-page="10" data-total="30">
<div id="stage">
  <div class="kicker">DISTANCE · AU</div>
  <div class="titlebar"><h1>把行星放回真正的距离</h1><div class="small">顺序相同，间隔真的相同吗？</div></div>
  <div class="compare-wrap min0">
    <section class="k-comparison min0" aria-label="等间距名单与真实距离的逐行比较">
      <div class="hdr">比较维度</div><div class="hdr">同一把横向轨道尺</div>
      <div class="dim"><strong>名单式排列</strong><span>顺序</span><span class="tag rel">固定等间距</span></div>
      <div class="cell cvbox min0"><div class="track" id="evenTrack" aria-label="八颗行星等间距排列"></div></div>
      <div class="rowline"></div>
      <div class="dim diff"><strong>按距离排列</strong><span>距太阳 / AU</span><span class="tag focus">连续展开</span></div>
      <div class="cell cvbox min0"><div class="track" id="realTrack" aria-label="按天文单位展开的八颗行星距离"></div></div>
    </section>
    <aside class="panel controls min0" aria-label="轨道尺控制与读数">
      <div>
        <div class="ctl"><label for="spread">轨道尺展开度</label><input class="no-pan" id="spread" type="range" min="0" max="100" value="0" step="1"><output id="percent" for="spread" class="num">0%</output></div>
        <p class="hint" style="margin-top:14px">拖动滑块，把等间距名单拉回 AU 尺。</p>
      </div>
      <div>
        <div class="readout-name" id="readoutName">水星</div>
        <div><span class="big sm" id="readoutValue">—</span><span class="unit">AU</span></div>
        <p class="small" id="gapText">与前一颗的间隔：—</p>
      </div>
      <div class="btns"><button class="btn" id="reset" type="button">复位</button></div>
      <p class="note">圆点仅表示位置，不表示行星真实大小。</p>
    </aside>
  </div>
  <div class="conclusion"><p>行星间距不是等差队列：外太阳系的空档远大于内太阳系。</p><span class="next">下一问：距离拉开后，“一年”会怎样变化？</span></div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lib/ScrollTrigger.min.js"></script>
<script>
(function(){
  Deck.init({index:10,total:30});
  gsap.registerPlugin(ScrollTrigger);
  var planets=Lec.P.planetsInOrder();
  var max=planets[planets.length-1].semimajorAxisAU;
  var even=document.getElementById('evenTrack'), real=document.getElementById('realTrack');
  function base(track){var cv=document.createElement('canvas');cv.className='cv-fill';cv.setAttribute('aria-hidden','true');track.appendChild(cv);Deck.autofit(cv,function(ctx,w,h){ctx.clearRect(0,0,w,h);ctx.strokeStyle=Deck.rgba('--orbit',.13);ctx.lineWidth=1;for(var y=28;y<h;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}});var line=document.createElement('div');line.className='axisline';track.appendChild(line);var sun=document.createElement('div');sun.className='sun';sun.textContent='☉';sun.title='太阳方向';track.appendChild(sun);}
  base(even);base(real);
  var realDots=[], realNames=[];
  planets.forEach(function(p,i){
    [even,real].forEach(function(track,j){
      var dot=document.createElement('span');dot.className='planet';dot.setAttribute('aria-label',p.nameZh);track.appendChild(dot);
      var name=document.createElement('span');name.className='pname';name.textContent=p.nameZh;track.appendChild(name);
      var x=4+i*(92/7);dot.style.left=x+'%';name.style.left=x+'%';
      if(j){realDots.push(dot);realNames.push(name);}
    });
  });
  [0,5,10,20,30].forEach(function(v){var t=document.createElement('span');t.className='tick';t.textContent=v+' AU';t.style.left=(4+92*v/max)+'%';real.appendChild(t);});
  var inner=document.createElement('span');inner.className='callout';inner.textContent='内四颗都在 '+Lec.P.round(planets[3].semimajorAxisAU,3)+' AU 内';inner.style.left='4%';real.appendChild(inner);
  var outer=document.createElement('span');outer.className='callout';outer.style.right='1%';var outerGap=planets[7].semimajorAxisAU-planets[6].semimajorAxisAU;outer.textContent='天王星—海王星约 '+Lec.P.round(outerGap,2)+' AU';real.appendChild(outer);
  var slider=document.getElementById('spread'), percent=document.getElementById('percent'), rv=document.getElementById('readoutValue'), rn=document.getElementById('readoutName'), gap=document.getElementById('gapText');
  function update(raw){
    var q=Number(raw)/100;percent.textContent=raw+'%';
    planets.forEach(function(p,i){var a=4+i*(92/7),b=4+92*p.semimajorAxisAU/max,x=a+(b-a)*q;gsap.set([realDots[i],realNames[i]],{left:x+'%'});realDots[i].classList.toggle('active',i===Math.min(7,Math.floor(q*8)));});
    var idx=Math.min(7,Math.floor(q*8)), p=planets[idx];rn.textContent=p.nameZh;rv.textContent=Lec.P.round(p.semimajorAxisAU,3);gap.textContent=idx?'与前一颗的间隔：'+Lec.P.round(p.semimajorAxisAU-planets[idx-1].semimajorAxisAU,3)+' AU':'与前一颗的间隔：—';
    inner.style.opacity=q>.82?1:0;outer.style.opacity=q>.82?1:0;
  }
  slider.addEventListener('input',function(){update(this.value)});
  document.getElementById('reset').addEventListener('click',function(){slider.value=0;update(0);slider.focus()});
  update(0);
  if(!Deck.reduced()) gsap.from('.planet',{opacity:0,duration:.35,stagger:.035,ease:'power1.out'});
})();
</script>
</body>
</html>
