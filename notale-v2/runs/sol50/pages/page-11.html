<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .kicker{height:24px;color:var(--orbit);font:700 var(--fs-label)/1.35 var(--font-mono);letter-spacing:.14em}
  .head{height:62px;display:flex;align-items:flex-start;justify-content:space-between}
  .head h1{margin:0}
  .main{display:flex;gap:28px;min-height:0}
  .cause{flex:0 0 530px;display:flex;flex-direction:column;gap:14px}
  .cause .k-process{flex-direction:column}
  .cause .k-process>.step{padding:14px 18px;justify-content:flex-start;border-left:2px solid var(--line);border-top:0}
  .cause .k-process>.step.current{border-left:4px solid var(--sun);border-top:0}
  .cause .k-process>.arw{flex:0 0 26px;transform:rotate(90deg)}
  .cause .k-process>.axis{top:18px;bottom:18px;left:8px;right:auto;width:1px;height:auto;border-top:0;border-left:1px solid var(--orbit)}
  .cause .k-process>.axis::before{top:0;left:-4px}.cause .k-process>.axis::after{top:auto;right:auto;bottom:0;left:-4px}
  .step-title{font-size:var(--fs-sec);font-weight:720;color:var(--text);margin-bottom:3px}
  .step-read{display:flex;align-items:baseline;gap:4px;min-height:35px}
  .step-read .num{font-size:27px;color:var(--sun);font-weight:700}
  .chart-side{flex:1;display:flex;flex-direction:column;gap:12px}
  .chart-head{height:54px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .chart-head .note{margin:0;max-width:430px}
  #chart{width:100%;height:100%}
  .formula{font:700 24px/1.2 var(--font-mono);color:var(--sun)}
  .controls{height:102px;display:flex;align-items:center;gap:18px}
  .controls label{font-size:var(--fs-label);font-weight:700}
  .controls select{min-height:44px;padding:8px 42px 8px 14px;color:var(--text);background:var(--bg);border:1px solid var(--orbit);border-radius:9px;font:650 var(--fs-label)/1.35 var(--font-sans)}
  .footer{height:68px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:14px}
  .footer .lead{margin:0}.handoff{margin:0;text-align:right;max-width:510px}
  svg text{font-family:var(--font-sans);fill:var(--muted);font-size:14px}
  svg .tick text{font-family:var(--font-mono);font-size:13px}
  svg .domain,svg .tick line{stroke:var(--line)}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body data-page="11" data-total="30">
<div id="stage">
  <div class="kicker">ORBITAL CLOCK</div>
  <header class="head"><h1>你要等多久，才过下一次生日？</h1><span class="tag rel">距离 → 周期</span></header>
  <main class="main min0" style="flex:1">
    <section class="cause min0" aria-label="距离影响公转周期的因果过程">
      <div class="panel" style="height:112px">
        <div class="small">当前选择</div>
        <div><span id="planetName" class="big sm">地球</span></div>
        <div id="birthdayLine" class="small">下一次生日：365.26 天后</div>
      </div>
      <div class="k-process min0">
        <div class="axis" aria-hidden="true"></div>
        <div class="step past">
          <div class="step-title">1　离太阳多远？</div>
          <div class="step-read"><span class="num" id="axisRead">1.000</span><span class="unit">AU</span></div>
          <div class="small">轨道半长轴，不是时刻不变的距离</div>
        </div>
        <div class="arw" aria-hidden="true"></div>
        <div class="step past">
          <div class="step-title">2　路程更长，同时平均运动更慢</div>
          <div class="step-read"><span class="num" id="speedRead">29.8</span><span class="unit">km/s</span></div>
          <div class="small">平均轨道速度</div>
        </div>
        <div class="arw" aria-hidden="true"></div>
        <div class="step current">
          <div class="step-title">3　下一次行星生日</div>
          <div class="step-read"><span class="num" id="periodRead">365.26</span><span class="unit" id="periodUnit">天</span></div>
          <div class="formula">P² = a³</div>
        </div>
      </div>
    </section>
    <section class="chart-side min0" aria-label="八颗行星距离与公转周期关系图">
      <div class="chart-head">
        <div><span class="sun-dir">太阳方向</span></div>
        <p class="note">以“年”和“AU”为单位时，绕太阳公转近似满足这条经验关系。</p>
      </div>
      <div class="cvbox min0" style="flex:1"><svg id="chart" role="img" aria-label="横轴为轨道半长轴，纵轴为公转周期的关系图"></svg></div>
      <div class="panel controls">
        <div style="flex:1">
          <label for="planetSelect">选择一颗行星</label>
          <select id="planetSelect" aria-label="选择行星"></select>
        </div>
        <button class="btn" id="resetBtn" type="button">回到地球</button>
        <div class="hint">切换内、外行星，比较距离、速度和等待时间</div>
      </div>
    </section>
  </main>
  <footer class="footer">
    <p class="lead">离太阳越远，轨道越长、运动越慢，一年会迅速变长。</p>
    <p class="small handoff">距离还会改变另一件更直接的事：同一束阳光到了远处，会被摊薄多少？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  Deck.init({index:11,total:30});
  var data=Lec.P.planetsInOrder().map(function(p){return {key:p.key,name:p.nameZh,a:p.semimajorAxisAU,days:p.orbitalPeriodDays,years:Lec.P.orbitalPeriodYears(p),speed:Lec.P.meanOrbitalSpeedKmPerSecond(p)};});
  var selected='earth', reduce=Deck.reduced();
  var select=d3.select('#planetSelect');
  select.selectAll('option').data(data).join('option').attr('value',function(d){return d.key}).text(function(d){return d.name+' · '+d.a.toFixed(3)+' AU'});
  select.property('value',selected).on('change',function(){update(this.value)});
  d3.select('#resetBtn').on('click',function(){select.property('value','earth');update('earth')});

  var svg=d3.select('#chart'), W=860,H=476,m={t:28,r:34,b:64,l:82};
  svg.attr('viewBox','0 0 '+W+' '+H);
  svg.append('title').text('八颗行星的轨道半长轴与公转周期');
  svg.append('desc').text('距离增加时，周期沿开普勒第三定律曲线快速增长。');
  var g=svg.append('g').attr('transform','translate('+m.l+','+m.t+')'), iw=W-m.l-m.r,ih=H-m.t-m.b;
  var x=d3.scaleLinear().domain([0,32]).range([0,iw]);
  var y=d3.scaleSqrt().domain([0,170]).range([ih,0]);
  g.append('g').attr('class','axis').attr('transform','translate(0,'+ih+')').call(d3.axisBottom(x).tickValues([0,1,5,10,20,30]).tickFormat(function(v){return v}));
  g.append('g').attr('class','axis').call(d3.axisLeft(y).tickValues([0,1,10,30,80,165]));
  g.append('text').attr('x',iw/2).attr('y',ih+51).attr('text-anchor','middle').style('font-size','15px').text('轨道半长轴 a（AU）');
  g.append('text').attr('transform','rotate(-90)').attr('x',-ih/2).attr('y',-57).attr('text-anchor','middle').style('font-size','15px').text('公转周期 P（年）');
  var curveData=d3.range(0.05,32.01,.1).map(function(a){return {a:a,p:Lec.P.keplerPeriodYearsFromAU(a)}});
  var line=d3.line().x(function(d){return x(d.a)}).y(function(d){return y(d.p)}).curve(d3.curveMonotoneX);
  var path=g.append('path').datum(curveData).attr('class','orbit-arc').attr('d',line);
  var len=path.node().getTotalLength();
  if(!reduce){path.attr('stroke-dasharray',len+' '+len).attr('stroke-dashoffset',len).transition().duration(1000).attr('stroke-dashoffset',0)}
  var guides=g.append('g');
  var nodes=g.selectAll('.planet-node').data(data).join('g').attr('class','planet-node').attr('transform',function(d){return 'translate('+x(d.a)+','+y(d.years)+')'});
  nodes.append('circle').attr('r',6).attr('fill','var(--orbit)').attr('stroke','var(--bg)').attr('stroke-width',2);
  nodes.append('text').attr('y',function(d,i){return i%2?-12:22}).attr('text-anchor','middle').text(function(d){return d.name});
  if(!reduce){nodes.attr('opacity',0).transition().delay(function(d,i){return 650+i*55}).duration(300).attr('opacity',1)}

  function formatPeriod(d){if(d.days<1000)return {v:d.days.toFixed(d.key==='earth'?2:1),u:'天'};return {v:d.years.toFixed(d.years>=100?1:2),u:'年'};}
  function update(key){
    selected=key;var d=data.filter(function(q){return q.key===key})[0], per=formatPeriod(d),dur=reduce?0:360;
    document.getElementById('planetName').textContent=d.name;
    document.getElementById('birthdayLine').textContent='下一次生日：'+per.v+' '+per.u+'后';
    document.getElementById('axisRead').textContent=d.a.toFixed(3);
    document.getElementById('speedRead').textContent=d.speed.toFixed(1);
    document.getElementById('periodRead').textContent=per.v;
    document.getElementById('periodUnit').textContent=per.u;
    guides.selectAll('*').remove();
    guides.append('line').attr('x1',x(d.a)).attr('x2',x(d.a)).attr('y1',ih).attr('y2',y(d.years)).attr('stroke','var(--sun)').attr('stroke-dasharray','5 5').attr('opacity',.75);
    guides.append('line').attr('x1',0).attr('x2',x(d.a)).attr('y1',y(d.years)).attr('y2',y(d.years)).attr('stroke','var(--sun)').attr('stroke-dasharray','5 5').attr('opacity',.75);
    nodes.select('circle').transition().duration(dur).attr('r',function(q){return q.key===key?11:6}).attr('fill',function(q){return q.key===key?'var(--sun)':'var(--orbit)'});
    nodes.select('text').attr('fill',function(q){return q.key===key?'var(--sun)':'var(--muted)'}).style('font-weight',function(q){return q.key===key?750:500});
  }
  update(selected);
})();
</script>
</body>
</html>
