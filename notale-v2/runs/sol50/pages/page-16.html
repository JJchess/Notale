<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .head{height:92px;display:flex;align-items:flex-end;justify-content:space-between}
  .kicker{margin:0 0 6px;color:var(--orbit);font-size:var(--fs-label);font-weight:700;letter-spacing:.12em}
  .head h1{margin:0}
  .scene{position:relative;flex:1;min-height:0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
  .scene svg{display:block;width:100%;height:100%}
  .status{position:absolute;top:22px;left:24px;max-width:430px}
  .status h2{margin:10px 0 5px}
  .status p{margin:0;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  .snow-note{position:absolute;right:24px;top:22px;width:350px}
  .snow-note p{margin:8px 0 0;font-size:var(--fs-sec);line-height:1.45;color:var(--muted)}
  .scene-label{position:absolute;font-size:var(--fs-sec);line-height:1.4}
  #hotLabel{left:22%;bottom:54px;color:var(--sun)}
  #coldLabel{right:9%;bottom:54px;color:var(--orbit)}
  .au-scale{position:absolute;left:17%;right:8%;bottom:20px;height:27px;display:flex;justify-content:space-between;padding-top:6px}
  .axis-tick{position:relative}
  .axis-tick:before{content:"";position:absolute;top:-7px;left:50%;height:6px;border-left:1px solid var(--line)}
  .timeline-wrap{height:184px;display:flex;gap:18px;align-items:stretch;padding-top:14px}
  .timeline-wrap .k-process{flex:1}
  .k-process>.step{cursor:pointer;justify-content:flex-start;padding:14px 12px 20px;border-top:3px solid transparent}
  .step:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
  .step-no{color:var(--orbit);font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700}
  .step-title{margin-top:7px;font-size:var(--fs-sec);font-weight:700;line-height:1.4}
  .step-detail{margin-top:5px;color:var(--muted);font-size:var(--fs-label);line-height:1.4}
  .controls{width:294px;display:flex;flex-direction:column;justify-content:center;gap:10px}
  .controls .btns{flex-wrap:nowrap}
  .summary{height:62px;display:flex;align-items:center;justify-content:space-between;gap:32px}
  .summary p{margin:0;font-size:var(--fs-lead);line-height:1.45}
  .next-q{color:var(--muted);font-size:var(--fs-sec)!important}
  .particle,.clump,.result,.snow-band,.thermal{opacity:0}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body data-page="16" data-total="30">
<div id="stage">
  <img class="backdrop" src="assets/img/illus-solar-nebula.png" alt="" title="生成插画（非真实照片）" style="opacity:.18">
  <header class="head">
    <div><p class="kicker">CHAPTER II · FORMATION TRACE</p><h1>为什么内侧多岩石，外侧更富挥发物？</h1></div>
    <span class="sun-dir">太阳方向</span>
  </header>

  <main class="scene cvbox min0" aria-label="太阳星云材料分选动态过程图">
    <svg viewBox="0 0 1488 500" role="img" aria-labelledby="svgTitle svgDesc">
      <title id="svgTitle">旋转圆盘中的材料分选</title>
      <desc id="svgDesc">圆盘由中心向外变冷，雪线过渡范围之外更容易保存冰质挥发物，微粒随后吸积。</desc>
      <defs>
        <radialGradient id="diskHeat"><stop offset="0" stop-color="var(--sun)" stop-opacity=".72"/><stop offset=".45" stop-color="var(--orbit)" stop-opacity=".24"/><stop offset="1" stop-color="var(--orbit)" stop-opacity=".02"/></radialGradient>
      </defs>
      <g transform="translate(770 265)">
        <ellipse class="thermal" rx="600" ry="178" fill="url(#diskHeat)"/>
        <ellipse rx="600" ry="178" fill="none" stroke="var(--orbit)" stroke-opacity=".26" stroke-width="2"/>
        <ellipse rx="475" ry="138" fill="none" stroke="var(--orbit)" stroke-opacity=".42" stroke-width="2" stroke-dasharray="12 10"/>
        <ellipse rx="335" ry="96" fill="none" stroke="var(--orbit)" stroke-opacity=".5" stroke-width="2"/>
        <ellipse class="snow-band" rx="390" ry="114" fill="none" stroke="var(--orbit)" stroke-opacity=".38" stroke-width="42" stroke-dasharray="8 8"/>
        <circle class="sun" r="35" fill="var(--sun)"/>
        <circle class="sun" r="55" fill="none" stroke="var(--sun)" stroke-opacity=".3" stroke-width="2"/>
        <g class="particles" fill="var(--text)">
          <circle class="particle" cx="-165" cy="-35" r="5"/><circle class="particle" cx="-235" cy="55" r="4"/><circle class="particle" cx="145" cy="47" r="5"/><circle class="particle" cx="248" cy="-58" r="4"/>
          <circle class="particle" cx="410" cy="72" r="7" fill="var(--orbit)"/><circle class="particle" cx="500" cy="-56" r="8" fill="var(--orbit)"/><circle class="particle" cx="-450" cy="-84" r="7" fill="var(--orbit)"/>
        </g>
        <g class="clumps">
          <circle class="clump" cx="-205" cy="18" r="18" fill="var(--muted)"/><circle class="clump" cx="215" cy="-25" r="21" fill="var(--muted)"/><circle class="clump" cx="475" cy="38" r="29" fill="var(--orbit)"/>
        </g>
      </g>
    </svg>
    <div class="status">
      <span id="stateTag" class="tag focus">第 1 步</span>
      <h2 id="stateTitle">星云收缩并旋转成盘</h2>
      <p id="stateText">中心区域更热，外缘更冷；尘埃与气体散布在同一个圆盘中。</p>
    </div>
    <aside class="snow-note panel q">
      <span class="tag rel">雪线模型范围 <b id="snowRange" style="margin-left:6px"></b></span>
      <p>这是随圆盘温度与时间迁移的过渡范围，不是一堵固定的墙。</p>
    </aside>
    <div id="hotLabel" class="scene-label result">内侧 · 耐高温岩石与金属</div>
    <div id="coldLabel" class="scene-label result">外侧 · 冰质挥发物更易保存</div>
    <div class="au-scale" aria-label="距中心的示意刻度"><span class="axis-tick">0 AU</span><span class="axis-tick">1 AU</span><span class="axis-tick" id="centerTick"></span><span class="axis-tick">5 AU</span></div>
  </main>

  <section class="timeline-wrap min0">
    <div class="k-process min0" id="process" role="list" aria-label="形成过程时间轴">
      <div class="axis"></div>
      <div class="step current" role="button" tabindex="0" data-step="0"><span class="step-no">01</span><span class="step-title">旋转成盘</span><span class="step-detail">内热外冷</span></div><div class="arw"></div>
      <div class="step" role="button" tabindex="0" data-step="1"><span class="step-no">02</span><span class="step-title">材料分选</span><span class="step-detail">凝结条件不同</span></div><div class="arw"></div>
      <div class="step" role="button" tabindex="0" data-step="2"><span class="step-no">03</span><span class="step-title">碰撞吸积</span><span class="step-detail">微粒汇成团块</span></div><div class="arw"></div>
      <div class="step" role="button" tabindex="0" data-step="3"><span class="step-no">04</span><span class="step-title">成员分化</span><span class="step-detail">继承材料差异</span></div>
    </div>
    <div class="controls panel">
      <div class="btns"><button id="prev" class="btn" type="button">后退</button><button id="next" class="btn" type="button">推进一步</button><button id="reset" class="btn" type="button">复位</button></div>
      <div class="hint">用按钮推进，或直接点击轴上步骤</div>
    </div>
  </section>

  <footer class="summary"><p>温度梯度先分选材料，吸积再把差异装进不同成员。</p><p class="next-q">接下来：为什么没有造出八个复制品？</p></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/gsap.min.js"></script>
<script>
(function(){
  Deck.init({index:16,total:30});
  const frost=Lec.K.regions.frostLineAU;
  document.getElementById('snowRange').textContent='约 '+Math.floor(frost)+'–'+Math.ceil(frost)+' AU';
  document.getElementById('centerTick').textContent=frost.toFixed(1)+' AU';
  const info=[
    ['星云收缩并旋转成盘','中心区域更热，外缘更冷；尘埃与气体散布在同一个圆盘中。'],
    ['温度梯度分选材料','内侧保留耐高温岩石、金属；外侧更容易保存冰质挥发物。'],
    ['微粒碰撞、黏结并吸积','小颗粒汇成较大团块，内外两区都在增长。'],
    ['不同材料库形成不同成员','内侧偏岩石质；外侧获得更多固体原料并形成富挥发物成员。']
  ];
  let current=0, motion=!Deck.reduced();
  const steps=[...document.querySelectorAll('.step')];
  const tag=document.getElementById('stateTag'), title=document.getElementById('stateTitle'), text=document.getElementById('stateText');
  function render(n){
    current=Math.max(0,Math.min(3,n));
    steps.forEach((el,i)=>{el.classList.toggle('current',i===current);el.classList.toggle('past',i<current);el.setAttribute('aria-current',i===current?'step':'false')});
    tag.textContent='第 '+(current+1)+' 步'; title.textContent=info[current][0]; text.textContent=info[current][1];
    prev.disabled=current===0; next.disabled=current===3;
    gsap.killTweensOf('.thermal,.snow-band,.particle,.clump,.result');
    const d=motion?.45:0;
    const tl=gsap.timeline({defaults:{duration:d,ease:'power2.out'}}).addLabel('state',0);
    tl.to('.thermal',{opacity:current>=0?1:0},'state')
      .to('.snow-band',{opacity:current>=1?1:0},'state+=.08')
      .to('.particle',{opacity:current>=1?1:0,scale:current>=2?1.35:1,transformOrigin:'center',stagger:motion?.035:0},'state+=.1')
      .to('.clump',{opacity:current>=2?1:0,scale:current>=2?1:0,transformOrigin:'center',stagger:motion?.06:0},'state+=.16')
      .to('.result',{opacity:current>=3?1:0,y:current>=3?0:8},'state+=.2');
  }
  steps.forEach(el=>{const go=()=>render(+el.dataset.step);el.addEventListener('click',go);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
  prev.addEventListener('click',()=>render(current-1)); next.addEventListener('click',()=>render(current+1)); reset.addEventListener('click',()=>render(0));
  if(motion){gsap.timeline({defaults:{ease:'power2.out'}}).from('.sun',{opacity:0,scale:.35,transformOrigin:'center',duration:.55}).from('.thermal',{opacity:0,scaleX:.15,transformOrigin:'center',duration:.75},'-=.2').from('.timeline-wrap .step,.timeline-wrap .arw',{opacity:0,y:10,stagger:.06,duration:.3},'-=.25').add(()=>render(0));}else render(0);
})();
</script>
</body>
</html>
