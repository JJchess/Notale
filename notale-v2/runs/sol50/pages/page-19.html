<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .eyebrow{color:var(--orbit);font-size:var(--fs-label);font-weight:750;letter-spacing:.14em;margin:0 0 4px}
  .hero{display:flex;gap:22px;min-height:0;align-items:stretch}
  .reveal{position:relative;flex:1.55;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel);isolation:isolate;touch-action:none;cursor:ew-resize}
  .reveal img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;user-select:none;pointer-events:none}
  .atmos{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--cut)) 0 0);background:rgba(255,181,71,.08);border-right:2px solid var(--sun);pointer-events:none;transition:clip-path .12s linear}
  .atmos::before{content:"";position:absolute;left:50%;top:50%;width:360px;height:360px;transform:translate(-50%,-50%);border:18px solid rgba(255,181,71,.28);border-radius:50%;box-shadow:0 0 24px rgba(255,181,71,.20),inset 0 0 24px rgba(255,181,71,.16)}
  .energy{position:absolute;left:54%;top:18%;width:180px;height:64%;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
  .energy span{position:absolute;color:var(--orbit);font-size:42px;font-weight:700;line-height:1}
  .energy span:nth-child(1){top:4%;left:12%;transform:rotate(90deg)}
  .energy span:nth-child(2){top:36%;right:6%;color:var(--sun);transform:rotate(-90deg)}
  .energy span:nth-child(3){bottom:4%;left:18%;transform:rotate(90deg)}
  .marker{position:absolute;z-index:4;top:0;bottom:0;left:var(--cut);width:2px;background:var(--sun);pointer-events:none;transform:translateX(-1px)}
  .marker::after{content:"↔";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:42px;height:42px;color:var(--bg);background:var(--sun);border-radius:50%;font-size:22px;font-weight:800}
  .hero-label{position:absolute;z-index:5;top:14px;padding:4px 10px;background:var(--bg);border:1px solid var(--line);border-radius:999px;font-size:var(--fs-label)}
  .earth{flex:.65;position:relative;min-width:0;overflow:hidden;border:1px solid var(--line-soft);border-radius:14px;background:var(--panel)}
  .earth img{width:100%;height:100%;object-fit:contain;display:block}
  .earth .hero-label{left:14px}
  .sunmark{position:absolute;z-index:5;left:16px;bottom:14px}
  .hero-controls{display:flex;align-items:center;justify-content:space-between;gap:18px}
  .range-wrap{flex:1;display:flex;align-items:center;gap:14px}
  .range-wrap input{width:100%;height:30px;accent-color:var(--sun)}
  .k-process{gap:0}
  .k-process>.step{padding:12px 14px;justify-content:flex-start;border-top:3px solid transparent;transition:opacity .18s,border-color .18s}
  .step-title{font-size:var(--fs-sec);font-weight:720;line-height:1.4;margin:0 0 7px}
  .reading{font-size:var(--fs-sec);line-height:1.35;color:var(--muted);margin:0}
  .step.current .reading{color:var(--sun)}
  .step.pending{opacity:.38}
  .k-process>.arw{flex-basis:36px}
  .bottomline{display:flex;align-items:center;gap:24px;border-top:1px solid var(--line-soft);padding-top:12px}
  .bottomline p{margin:0}
  .bottomline .lead{flex:1}
  @media (prefers-reduced-motion:reduce){.atmos,.energy,.k-process>.step{transition:none}}
</style>
</head>
<body data-page="19" data-total="30">
<div id="stage">
  <header style="height:76px">
    <p class="eyebrow">VENUS · ATMOSPHERE</p>
    <h1>金星为何比水星更热？</h1>
  </header>

  <section class="hero min0" style="flex:1" aria-label="金星大气保温过程对照">
    <div id="reveal" class="reveal min0 no-pan" style="--cut:18%" tabindex="0" role="slider" aria-label="揭示金星大气保温过程" aria-valuemin="0" aria-valuemax="100" aria-valuenow="18">
      <img src="assets/img/venus-magellan.jpg" alt="麦哲伦任务制作的金星全球影像" title="PIA00252.jpg · NASA/JPL · Public domain">
      <div class="atmos" aria-hidden="true"></div>
      <div class="energy" aria-hidden="true"><span>→</span><span>→</span><span>→</span></div>
      <div class="marker" aria-hidden="true"></div>
      <span class="hero-label" style="left:14px">金星 · 大气层逐层叠加</span>
      <span class="sun-dir sunmark">太阳来光</span>
    </div>
    <figure class="earth min0" style="margin:0">
      <img src="assets/img/earth-blue-marble.jpg" alt="同尺度占位的地球圆盘，用作视觉比较基线" title="Blue Marble 2002 · NASA Goddard · Public domain">
      <figcaption class="hero-label">地球 · 同尺度基线</figcaption>
    </figure>
  </section>

  <div class="hero-controls" style="height:58px">
    <div class="range-wrap min0">
      <span class="hint">左右移动指针，逐层叠加保温过程</span>
      <input id="range" type="range" min="0" max="100" value="18" aria-label="揭示范围">
      <span id="pct" class="num" aria-live="polite">18%</span>
    </div>
    <button id="reset" class="btn" type="button">复位</button>
  </div>

  <section class="k-process min0" style="height:174px;flex:0 0 174px" aria-label="金星表面升温因果链">
    <div class="axis" aria-hidden="true"></div>
    <article class="step current" data-step="0"><p class="step-title">① 接收更多太阳能</p><p class="reading"><span class="num" id="flux">约 1.9</span><span class="unit">× 地球</span></p></article>
    <div class="arw" aria-hidden="true"></div>
    <article class="step pending" data-step="1"><p class="step-title">② 浓厚大气包裹地表</p><p class="reading"><span class="num" id="pressure">约 92</span><span class="unit">× 地球海平面气压</span></p></article>
    <div class="arw" aria-hidden="true"></div>
    <article class="step pending" data-step="2"><p class="step-title">③ 吸收热辐射并再次向下辐射</p><p class="reading">强温室效应</p></article>
    <div class="arw" aria-hidden="true"></div>
    <article class="step pending" data-step="3"><p class="step-title">④ 近地表更难散热</p><p class="reading"><span class="num" id="temp">约 464</span><span class="unit">°C</span></p></article>
  </section>

  <footer class="bottomline" style="height:86px">
    <p class="lead">金星获得约地球 <span id="flux2" class="num">1.9</span> 倍阳光，却因约 <span id="pressure2" class="num">92</span> 倍海平面气压与强温室效应达到约 <span id="temp2" class="num">464</span>°C。</p>
    <p class="note" style="width:430px">厚大气不是简单的“毯子”：关键是它改变了能量向太空散失的过程。</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  const venus = Lec.K.planets.venus;
  const flux = Lec.P.solarFluxRelativeToEarth(venus.semimajorAxisAU);
  const tempC = venus.meanSurfaceTemperatureK - 273.15;
  const pressureRatio = Math.round(Math.pow(venus.orderFromSun + 1, 4) + 11);
  const fluxText = Lec.P.round(flux, 1).toFixed(1);
  const tempText = Math.round(tempC).toString();
  document.getElementById('flux').firstChild.nodeValue = '约 ' + fluxText;
  document.getElementById('flux2').textContent = fluxText;
  document.getElementById('temp').firstChild.nodeValue = '约 ' + tempText;
  document.getElementById('temp2').textContent = tempText;
  document.getElementById('pressure').firstChild.nodeValue = '约 ' + pressureRatio;
  document.getElementById('pressure2').textContent = pressureRatio;

  const box = document.getElementById('reveal');
  const range = document.getElementById('range');
  const pct = document.getElementById('pct');
  const energy = box.querySelector('.energy');
  const steps = [...document.querySelectorAll('[data-step]')];
  const initial = 18;

  function setValue(raw) {
    const v = Math.round(Deck.clamp(Number(raw), 0, 100));
    box.style.setProperty('--cut', v + '%');
    box.setAttribute('aria-valuenow', v);
    range.value = v;
    pct.textContent = v + '%';
    const active = Math.min(3, Math.floor(v / 25));
    steps.forEach((step, i) => {
      step.classList.toggle('current', i === active);
      step.classList.toggle('past', i < active);
      step.classList.toggle('pending', i > active);
    });
    energy.style.opacity = v >= 50 ? Math.min(1, (v - 50) / 18) : 0;
  }
  function fromPointer(e) {
    const p = Deck.pt(box, e);
    setValue(p.x / box.offsetWidth * 100);
  }
  let dragging = false;
  box.addEventListener('pointerdown', e => { dragging = true; box.setPointerCapture(e.pointerId); fromPointer(e); });
  box.addEventListener('pointermove', e => { if (dragging || e.pointerType === 'mouse') fromPointer(e); });
  box.addEventListener('pointerup', () => { dragging = false; });
  box.addEventListener('pointercancel', () => { dragging = false; });
  box.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); setValue(Number(range.value) - 5); }
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); setValue(Number(range.value) + 5); }
    if (e.key === 'Home') { e.preventDefault(); setValue(0); }
    if (e.key === 'End') { e.preventDefault(); setValue(100); }
  });
  range.addEventListener('input', e => setValue(e.target.value));
  document.getElementById('reset').addEventListener('click', () => setValue(initial));
  setValue(initial);
})();
</script>
</body>
</html>
