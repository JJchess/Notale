<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .kicker{height:22px;color:var(--orbit);font-size:var(--fs-label);font-weight:750;letter-spacing:.14em}
  .sim{position:relative;flex:1;min-height:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line-soft)}
  .sim svg{display:block;width:100%;height:100%}
  .orbit-path{fill:none;stroke:var(--orbit);stroke-width:2;filter:drop-shadow(0 0 4px rgba(82,214,232,.35))}
  .orbit-guide{fill:none;stroke:var(--line-soft);stroke-width:1;stroke-dasharray:7 9}
  .sun{fill:var(--sun)}
  .ion{fill:none;stroke:var(--orbit);stroke-width:10;stroke-linecap:round;opacity:.78}
  .dust{fill:none;stroke:var(--sun);stroke-width:18;stroke-linecap:round;opacity:.5}
  .comet-img{filter:drop-shadow(0 0 10px rgba(238,244,250,.45))}
  .svg-label{font:650 15px var(--font-sans);fill:var(--muted)}
  .svg-label.sunlab{fill:var(--sun)}
  .readouts{position:absolute;top:18px;right:18px;display:flex;gap:12px}
  .readouts .panel{width:198px;padding:12px 16px}
  .readouts .big{font-size:34px}
  .readouts .small{margin:0}
  .bottom{display:flex;height:268px;gap:18px;padding-top:14px}
  .steps-wrap{display:flex;flex:1;min-width:0;flex-direction:column}
  .steps-wrap .k-process{flex:1}
  .steps-wrap .step{padding:12px 14px;justify-content:flex-start}
  .step strong{font-size:var(--fs-sec)}
  .step span{color:var(--muted);font-size:var(--fs-label);line-height:1.4}
  .console{display:flex;width:430px;flex-direction:column;justify-content:space-between}
  .console .ctl{grid-template-columns:92px 1fr 52px}
  .explain{display:flex;align-items:center;gap:30px;height:58px;border-top:1px solid var(--line)}
  .explain p{margin:0;font-size:var(--fs-lead)}
  .explain .next{margin-left:auto;color:var(--muted);font-size:var(--fs-sec)}
  .enter{animation:rise .55s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.enter{animation:none}}
</style>
</head>
<body data-page="27" data-total="30">
<div id="stage">
  <div class="kicker" style="height:22px">COMET · PERIHELION</div>
  <header style="height:58px"><h1>驾驶彗星过近日点</h1></header>

  <section class="sim cvbox min0 no-pan enter" aria-label="彗星绕太阳运行示意图">
    <svg id="scene" viewBox="0 0 1488 430" role="img" aria-labelledby="sceneTitle sceneDesc">
      <title id="sceneTitle">彗星沿椭圆轨道接近并远离太阳</title>
      <desc id="sceneDesc">彗尾随太阳方向改变，不是固定拖在运动方向之后。</desc>
      <defs>
        <marker id="arrowC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="var(--orbit)"/></marker>
      </defs>
      <ellipse class="orbit-guide" cx="690" cy="220" rx="540" ry="160"/>
      <path class="orbit-path" d="M150 220 A540 160 0 0 1 1230 220" marker-end="url(#arrowC)"/>
      <path class="orbit-path" d="M1230 220 A540 160 0 0 1 150 220" marker-end="url(#arrowC)"/>
      <circle class="sun" cx="1040" cy="220" r="54"/>
      <circle cx="1040" cy="220" r="69" fill="none" stroke="var(--sun)" opacity=".28"/>
      <text x="1023" y="224" class="svg-label sunlab">太阳</text>
      <text x="1112" y="208" class="svg-label sunlab">☉ 太阳方向</text>
      <path id="dustTail" class="dust" d=""/>
      <path id="ionTail" class="ion" d=""/>
      <g id="comet">
        <circle id="coma" r="34" fill="rgba(238,244,250,.15)" stroke="var(--orbit)"/>
        <image class="comet-img" href="assets/img/comet-67p.png" x="-29" y="-29" width="58" height="58" preserveAspectRatio="xMidYMid meet" title="3-D Reconstruction of Comet 67P-Churyumov-Gerasimenko's Nucleus · NASA, ESA and Philippe Lamy · Public domain"/>
      </g>
      <g class="au-scale">
        <line x1="86" y1="395" x2="1380" y2="395" stroke="var(--line)"/>
        <line x1="86" y1="388" x2="86" y2="402" stroke="var(--orbit)"/><text x="76" y="424" class="svg-label">5 AU</text>
        <line x1="410" y1="390" x2="410" y2="400" stroke="var(--line)"/><text x="397" y="424" class="svg-label">4</text>
        <line x1="734" y1="390" x2="734" y2="400" stroke="var(--line)"/><text x="721" y="424" class="svg-label">3</text>
        <line x1="1058" y1="390" x2="1058" y2="400" stroke="var(--line)"/><text x="1045" y="424" class="svg-label">2</text>
        <line x1="1380" y1="388" x2="1380" y2="402" stroke="var(--sun)"/><text x="1367" y="424" class="svg-label sunlab">1</text>
      </g>
    </svg>
    <div class="readouts" aria-live="polite">
      <div class="panel"><p class="small">距太阳</p><span id="distance" class="big">5.0</span><span class="unit">AU</span></div>
      <div class="panel"><p class="small">相对受光</p><span id="flux" class="big">0.04</span><span class="unit">× 地球轨道</span></div>
    </div>
  </section>

  <section class="bottom min0">
    <div class="steps-wrap min0">
      <div class="k-process" id="process">
        <div class="axis"></div>
        <div class="step current"><strong>远日段</strong><span>5.0 AU</span><span>活动微弱</span></div><div class="arw"></div>
        <div class="step"><strong>接近太阳</strong><span>2.0 AU</span><span>彗发出现</span></div><div class="arw"></div>
        <div class="step"><strong>近日点</strong><span>1.0 AU</span><span>放气最强</span></div><div class="arw"></div>
        <div class="step"><strong>远离太阳</strong><span>2.0 AU</span><span>活动减弱</span></div>
      </div>
      <p class="small" style="margin:4px 14px 0">靠近太阳时，冰升华并释放气体和尘埃，形成彗发与彗尾。</p>
    </div>
    <aside class="panel console min0">
      <div><span id="activity" class="tag rel">微弱</span><p class="small" style="margin:10px 0 0">离子尾大体背向太阳；尘埃尾受粒子惯性影响而弯曲。</p></div>
      <div class="ctl"><label for="position">轨道位置</label><input id="position" type="range" min="0" max="100" value="0" step="1" aria-label="轨道位置"><output id="pct" class="num">0%</output></div>
      <div class="btns"><button id="reset" class="btn" type="button">复位</button><span class="hint">拖动查看整圈轨道</span></div>
      <p class="small" style="margin:0">示意轨道与活动强度，不对应 67P 的精确轨道参数。</p>
    </aside>
  </section>

  <footer class="explain" style="height:58px">
    <p>越靠近太阳越活跃；彗尾主要背向太阳，而非固定拖在运动方向后方。</p>
    <span class="next">下一问：边界成员如何分类？</span>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:27,total:30});
  const slider=document.getElementById('position'), comet=document.getElementById('comet');
  const coma=document.getElementById('coma'), ion=document.getElementById('ionTail'), dust=document.getElementById('dustTail');
  const distanceEl=document.getElementById('distance'), fluxEl=document.getElementById('flux'), pct=document.getElementById('pct');
  const activity=document.getElementById('activity'), steps=[...document.querySelectorAll('#process .step')];
  const sun={x:1040,y:220};
  function render(){
    const p=Number(slider.value)/100, a=Math.PI+Math.PI*2*p;
    const x=690+540*Math.cos(a), y=220+160*Math.sin(a);
    const distance=1+4*Math.abs(Math.cos(Math.PI*p));
    const flux=Lec.P.solarFluxRelativeToEarth(distance);
    const strength=Deck.clamp((flux-.04)/.96,0,1);
    const dx=x-sun.x,dy=y-sun.y,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;
    const tailLen=45+210*strength, tx=x+ux*tailLen,ty=y+uy*tailLen;
    const tangentX=-uy,tangentY=ux, bend=(p>.5?1:-1)*(24+65*strength);
    ion.setAttribute('d',`M ${x} ${y} L ${tx} ${ty}`);
    dust.setAttribute('d',`M ${x} ${y} Q ${x+ux*tailLen*.45+tangentX*bend} ${y+uy*tailLen*.45+tangentY*bend} ${x+ux*tailLen*.82+tangentX*bend*.8} ${y+uy*tailLen*.82+tangentY*bend*.8}`);
    ion.style.opacity=.12+.72*strength; dust.style.opacity=.08+.48*strength;
    comet.setAttribute('transform',`translate(${x} ${y})`);
    coma.setAttribute('r',String(32+48*strength)); coma.style.opacity=String(.18+.7*strength);
    distanceEl.textContent=Lec.P.round(distance,1).toFixed(1);
    fluxEl.textContent=Lec.P.round(flux,2).toFixed(2); pct.textContent=Math.round(p*100)+'%';
    let idx=p<.25?0:p<.45?1:p<.58?2:3;
    const labels=['微弱','增强','最强','减弱']; activity.textContent=labels[idx];
    activity.className='tag '+(idx===2?'focus':'rel');
    steps.forEach((s,i)=>{s.classList.toggle('current',i===idx);s.classList.toggle('past',i<idx);});
  }
  slider.addEventListener('input',render);
  document.getElementById('reset').addEventListener('click',()=>{slider.value=0;render();slider.focus();});
  render();
})();
</script>
</body>
</html>
