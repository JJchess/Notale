<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .kicker{height:24px;color:var(--orbit);font-size:var(--fs-label);font-weight:750;letter-spacing:.12em}
  .head{height:76px;display:flex;align-items:flex-start;justify-content:space-between;gap:28px}
  .head h1{margin:0}
  .head .lead{max-width:760px;margin:3px 0 0;text-align:right;color:var(--muted)}
  .work{display:flex;gap:24px}
  .tree{position:relative;flex:1.78;display:flex}
  .controls{flex:.72;display:flex;flex-direction:column;justify-content:center;gap:16px}
  .rootbox{height:100%;display:flex;flex-direction:column;padding-top:28px!important}
  .root-rule{display:flex;align-items:center;justify-content:space-between;gap:18px;height:52px;color:var(--muted);font-size:var(--fs-sec)}
  .branches{display:flex;flex:1;gap:18px;padding-top:12px!important}
  .branch{flex:1;display:flex;flex-direction:column;transition:border-color .35s,box-shadow .35s,opacity .35s}
  .branch.active{border-color:var(--sun);box-shadow:inset 0 0 0 1px rgba(255,181,71,.24)}
  .condition{min-height:52px;color:var(--muted);font-size:var(--fs-sec);line-height:1.45}
  .nodes{position:relative;display:flex;flex:1;flex-direction:column;justify-content:center;gap:10px;padding-top:10px}
  .body-node{position:relative;z-index:2;display:flex;min-height:70px;align-items:center;gap:12px;padding:8px 12px;border-top:1px solid var(--line-soft);transition:transform .45s ease,opacity .3s}
  .body-node .cvbox{flex:0 0 54px;height:54px;border:1px solid var(--line)}
  .body-node img{width:100%;height:100%;object-fit:contain}
  .body-node strong{font-size:var(--fs-body)}
  .body-node .small{margin:2px 0 0}
  #links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  .panel.q p{margin:0}
  .status{display:flex;align-items:center;gap:10px;min-height:30px}
  .footer{height:62px;display:flex;align-items:center;justify-content:space-between;gap:28px;border-top:1px solid var(--line)}
  .footer .lead{margin:0}
  .footer .small{max-width:600px;margin:0;text-align:right}
  .au-spine{position:absolute;right:8px;top:78px;bottom:20px;width:36px;border-left:1px solid var(--line);color:var(--faint);font:var(--fs-tick)/1.35 var(--font-mono)}
  .au-spine span{position:absolute;left:7px;white-space:nowrap}
  .au-spine span:first-child{top:12%}.au-spine span:last-child{bottom:7%}
  @media (prefers-reduced-motion:reduce){.body-node,.branch{transition:none}}
</style>
</head>
<body data-page="28" data-total="30">
<div id="stage">
  <div class="kicker">BOUNDARY / 分类</div>
  <header class="head">
    <h1>谁画出了“行星”的边界？</h1>
    <p class="lead">天体本身没有变化；变化的是我们采用的必要条件。</p>
  </header>

  <main class="work min0" style="flex:1">
    <section class="tree k-classification min0" aria-label="可切换的行星分类树">
      <svg id="links" aria-hidden="true"></svg>
      <div class="lv min0" style="flex:1">
        <div class="box rootbox min0">
          <div class="bt">绕太阳、近圆且不是卫星</div>
          <div class="root-rule">
            <span id="rootCondition">再问：是否清除轨道邻域？</span>
            <span class="tag rel">分类入口</span>
          </div>
          <div class="lv branches min0">
            <section class="box branch active min0" id="planetBox">
              <div class="bt">行星</div>
              <div class="condition" id="planetCondition">绕太阳；近圆；清除轨道邻域</div>
              <div class="nodes" id="planetNodes" aria-live="polite"></div>
            </section>
            <section class="box branch min0" id="dwarfBox">
              <div class="bt" id="dwarfTitle">矮行星</div>
              <div class="condition" id="dwarfCondition">绕太阳；近圆；未清除邻域；不是卫星</div>
              <div class="nodes" id="dwarfNodes"></div>
            </section>
          </div>
        </div>
      </div>
      <div class="au-spine au-scale" aria-hidden="true"><span id="ceresAu"></span><span id="plutoAu"></span></div>
    </section>

    <aside class="controls min0">
      <div class="panel">
        <h2>选择一条边界</h2>
        <div class="btns" role="group" aria-label="分类规则">
          <button class="btn" id="iauBtn" aria-pressed="true">IAU 2006</button>
          <button class="btn" id="wideBtn" aria-pressed="false">宽口径替代</button>
          <button class="btn" id="resetBtn">复位</button>
        </div>
        <p class="hint" style="margin:12px 0 0">切换规则，观察三个天体的归属。</p>
      </div>
      <div class="panel q">
        <div class="status"><span class="tag focus" id="ruleTag">现行正式分类</span><strong id="ruleYear">2006 年通过</strong></div>
        <p class="small" id="ruleStatus" style="margin-top:10px">规则可执行，能稳定地区分行星与矮行星。</p>
      </div>
      <div class="panel q">
        <span class="tag rel">为什么会争论？</span>
        <p style="margin-top:10px">三个新旧成员迫使人们把习惯名称改写成可执行规则。</p>
        <p class="small">边界还包含命名目的与学术选择，并非物理学已经终结的问题。</p>
      </div>
    </aside>
  </main>

  <footer class="footer">
    <p class="lead">分类规则帮助我们工作，但自然界并没有预先贴好标签。</p>
    <p class="small">下一页：哪些太阳系证据不会随名称改变？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  var K=Lec.K;
  var facts={
    ceres:{name:K.dwarfPlanets.ceres.nameZh,year:'1801 年发现',history:'曾被称为行星'},
    pluto:{name:K.dwarfPlanets.pluto.nameZh,year:'1930 年发现',history:'曾列为行星',image:'assets/img/pluto-new-horizons.jpg'},
    eris:{name:'阋神星',year:'2005 年发现',history:'加速定义争论'}
  };
  var keys=['ceres','pluto','eris'];
  var planetNodes=document.getElementById('planetNodes'), dwarfNodes=document.getElementById('dwarfNodes');
  keys.forEach(function(key){
    var d=facts[key], node=document.createElement('div');
    node.className='body-node'; node.id='node-'+key; node.dataset.key=key;
    var media=d.image?'<div class="cvbox"><img src="'+d.image+'" alt="新视野号拍摄的冥王星" title="NH-07-10-15-Pluto-FirstGeology-20150709.jpg · NASA · Public domain"></div>':'';
    node.innerHTML=media+'<div><strong>'+d.name+'</strong><p class="small"><span>'+d.year+'</span> · <span>'+d.history+'</span></p></div>';
    dwarfNodes.appendChild(node);
  });
  document.getElementById('ceresAu').textContent=Lec.P.round(K.dwarfPlanets.ceres.semimajorAxisAU,1)+' AU';
  document.getElementById('plutoAu').textContent=Lec.P.round(K.dwarfPlanets.pluto.semimajorAxisAU,1)+' AU';

  function drawLinks(){
    var host=document.querySelector('.tree'), hr=host.getBoundingClientRect(), svg=d3.select('#links');
    svg.attr('viewBox','0 0 '+host.clientWidth+' '+host.clientHeight).selectAll('*').remove();
    keys.forEach(function(key){
      var node=document.getElementById('node-'+key), r=node.getBoundingClientRect(), box=node.parentElement.getBoundingClientRect();
      var x1=(box.left-hr.left)-18, y1=(box.top-hr.top)+22, x2=(r.left-hr.left)+4, y2=(r.top-hr.top)+r.height/2;
      svg.append('path').attr('class','orbit-arc').attr('d','M'+x1+','+y1+' C'+(x1+40)+','+y1+' '+(x2-42)+','+y2+' '+x2+','+y2);
    });
  }
  function setMode(mode){
    var wide=mode==='wide';
    keys.forEach(function(key){(wide?planetNodes:dwarfNodes).appendChild(document.getElementById('node-'+key));});
    document.getElementById('iauBtn').setAttribute('aria-pressed',String(!wide));
    document.getElementById('wideBtn').setAttribute('aria-pressed',String(wide));
    document.getElementById('planetBox').classList.toggle('active',wide);
    document.getElementById('dwarfBox').classList.toggle('active',!wide);
    document.getElementById('rootCondition').textContent=wide?'主要按自身引力塑形成近圆天体':'再问：是否清除轨道邻域？';
    document.getElementById('planetCondition').textContent=wide?'主要按自身引力塑形成近圆天体':'绕太阳；近圆；清除轨道邻域';
    document.getElementById('dwarfCondition').textContent=wide?'此示例不单设矮行星一级':'绕太阳；近圆；未清除邻域；不是卫星';
    document.getElementById('ruleTag').textContent=wide?'非现行正式定义':'现行正式分类';
    document.getElementById('ruleYear').textContent=wide?'示例性替代主张':'2006 年通过';
    document.getElementById('ruleStatus').textContent=wide?'这是一种宽口径示例，并非统一方案或另一套官方标准。':'规则可执行，能稳定地区分行星与矮行星。';
    requestAnimationFrame(drawLinks);
  }
  document.getElementById('iauBtn').addEventListener('click',function(){setMode('iau')});
  document.getElementById('wideBtn').addEventListener('click',function(){setMode('wide')});
  document.getElementById('resetBtn').addEventListener('click',function(){setMode('iau')});
  Deck.onResize(drawLinks); setMode('iau'); Deck.init({index:28,total:30});
})();
</script>
</body>
</html>
