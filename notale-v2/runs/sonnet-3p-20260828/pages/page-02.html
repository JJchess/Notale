<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #judgment { flex: 1; min-height: 0; margin-top: 22px; display: grid; grid-template-columns: minmax(0,1.28fr) minmax(390px,.72fr); gap: 42px; align-items: stretch; }
    #judgment .plot-shell { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    #judgment .plot-head { display:flex; justify-content:space-between; align-items:center; gap:24px; margin-bottom:12px; }
    #judgment .plot-title { font-size:var(--fs-h2); font-weight:750; }
    #judgment .chart { flex:1; min-height:0; background:var(--paper); border:var(--rule) solid var(--line); border-radius:var(--r); box-shadow:0 5px 14px rgba(23,38,43,.08); }
    #judgment svg { width:100%; height:100%; display:block; }
    #judgment .gridline { stroke:var(--line); stroke-width:1; opacity:.42; }
    #judgment .axis { stroke:var(--text); stroke-width:2; }
    #judgment .tick { fill:var(--muted); font:var(--fs-tick) var(--font-num); }
    #judgment .axis-label { fill:var(--text); font:650 var(--fs-label) var(--font-sans); }
    #judgment .point-label { fill:var(--text); font:650 var(--fs-label) var(--font-sans); }
    #judgment .pass { fill:var(--data); stroke:var(--paper); stroke-width:4; }
    #judgment .fail { fill:var(--paper); stroke:var(--muted); stroke-width:4; }
    #judgment .candidate-ring { fill:var(--paper); stroke:var(--attention); stroke-width:5; }
    #judgment .candidate-cross { stroke:var(--attention); stroke-width:3; }
    #judgment .legend { justify-content:flex-end; }
    #judgment .legend .pass-mark { background:var(--data); }
    #judgment .legend .fail-mark { background:var(--paper); border:3px solid var(--muted); }
    #judgment .decision { min-width:0; display:flex; flex-direction:column; justify-content:center; padding:34px 30px; }
    #judgment .question { font:750 30px/1.35 var(--font-display); margin-bottom:26px; }
    #judgment .question .coord { color:var(--attention); font-family:var(--font-num); white-space:nowrap; }
    #judgment .quiz { gap:14px; }
    #judgment .opt { cursor:pointer; min-height:62px; }
    #judgment .fb { min-height:96px; margin-top:22px; padding-top:18px; border-top:var(--rule) solid var(--line); line-height:1.5; }
    #judgment .fb.revealed { color:var(--model); }
    #judgment .prompt-note { margin-top:14px; }
  </style>
</head>
<body data-page="02" data-total="20">
  <div id="stage">
    <header>
      <div class="kicker">热身 · 直觉分类</div>
      <h1>先做一个三秒判断</h1>
    </header>

    <main id="judgment" aria-label="根据学习与睡眠数据做一次直觉判断">
      <section class="plot-shell min0" aria-labelledby="plot-heading">
        <div class="plot-head">
          <h2 id="plot-heading" class="plot-title">四位同学的记录</h2>
          <div class="legend" aria-label="图例">
            <span class="li" style="color:var(--data)"><span class="sw pass-mark"></span>通过</span>
            <span class="li" style="color:var(--muted)"><span class="sw fail-mark"></span>未通过</span>
          </div>
        </div>
        <div class="chart min0">
          <svg viewBox="0 0 900 610" role="img" aria-labelledby="chart-title chart-desc">
            <title id="chart-title">学习小时数与睡眠小时数散点图</title>
            <desc id="chart-desc">四个已知点：一小时学习五小时睡眠未通过；两小时学习六小时睡眠未通过；四小时学习七小时睡眠通过；五小时学习六小时睡眠通过。新同学位于三小时学习、六点五小时睡眠。</desc>
            <g aria-hidden="true">
              <line class="gridline" x1="120" y1="486" x2="820" y2="486"/><line class="gridline" x1="120" y1="374" x2="820" y2="374"/><line class="gridline" x1="120" y1="262" x2="820" y2="262"/><line class="gridline" x1="120" y1="150" x2="820" y2="150"/>
              <line class="gridline" x1="260" y1="70" x2="260" y2="486"/><line class="gridline" x1="400" y1="70" x2="400" y2="486"/><line class="gridline" x1="540" y1="70" x2="540" y2="486"/><line class="gridline" x1="680" y1="70" x2="680" y2="486"/><line class="gridline" x1="820" y1="70" x2="820" y2="486"/>
              <line class="axis" x1="120" y1="486" x2="836" y2="486"/><line class="axis" x1="120" y1="500" x2="120" y2="58"/>
              <text class="tick" x="260" y="516" text-anchor="middle">1</text><text class="tick" x="400" y="516" text-anchor="middle">2</text><text class="tick" x="540" y="516" text-anchor="middle">3</text><text class="tick" x="680" y="516" text-anchor="middle">4</text><text class="tick" x="820" y="516" text-anchor="middle">5</text>
              <text class="tick" x="96" y="491" text-anchor="end">4</text><text class="tick" x="96" y="379" text-anchor="end">5</text><text class="tick" x="96" y="267" text-anchor="end">6</text><text class="tick" x="96" y="155" text-anchor="end">7</text>
              <text class="axis-label" x="470" y="570" text-anchor="middle">学习小时数</text><text class="axis-label" x="32" y="278" text-anchor="middle" transform="rotate(-90 32 278)">睡眠小时数</text>
            </g>
            <g aria-label="已知数据点">
              <circle class="fail" cx="260" cy="374" r="13"/><text class="point-label" x="280" y="361">未通过 (1,5)</text>
              <circle class="fail" cx="400" cy="262" r="13"/><text class="point-label" x="420" y="249">未通过 (2,6)</text>
              <circle class="pass" cx="680" cy="150" r="14"/><text class="point-label" x="700" y="137">通过 (4,7)</text>
              <circle class="pass" cx="820" cy="262" r="14"/><text class="point-label" x="800" y="300" text-anchor="end">通过 (5,6)</text>
            </g>
            <g aria-label="待判断的新同学，坐标三，六点五">
              <circle class="candidate-ring" cx="540" cy="206" r="19"/>
              <line class="candidate-cross" x1="532" y1="206" x2="548" y2="206"/><line class="candidate-cross" x1="540" y1="198" x2="540" y2="214"/>
              <text class="point-label" x="564" y="193" style="fill:var(--attention)">新同学 (3,6.5)</text>
            </g>
          </svg>
        </div>
      </section>

      <aside class="decision panel min0">
        <p class="question">新同学 <span class="coord">(3,6.5)</span><br>会通过吗？</p>
        <div class="quiz" role="group" aria-label="选择你的判断">
          <button class="opt" type="button" data-choice="通过" aria-pressed="false">通过</button>
          <button class="opt" type="button" data-choice="未通过" aria-pressed="false">未通过</button>
          <button class="opt" type="button" data-choice="信息不足" aria-pressed="false">信息不足</button>
        </div>
        <p class="small prompt-note">先按直觉选，不需要计算。</p>
        <div class="fb" aria-live="polite">选择后，保留你的第一反应。</div>
      </aside>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      const root = document.getElementById('judgment');
      const options = [...root.querySelectorAll('.opt')];
      const feedback = root.querySelector('.fb');
      const state = { choice: null };
      function render() {
        options.forEach(btn => {
          const selected = btn.dataset.choice === state.choice;
          btn.classList.toggle('selected', selected);
          btn.setAttribute('aria-pressed', String(selected));
        });
        if (state.choice) {
          feedback.textContent = '你刚才也在做：看输入，给输出；接下来把这件事写成可调的机器';
          feedback.classList.add('revealed');
        }
      }
      options.forEach(btn => btn.addEventListener('click', () => {
        state.choice = btn.dataset.choice;
        render();
      }));
      render();
      Deck.init({ index: 2, total: 20 });
    })();
  </script>
</body>
</html>
