<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/lib/katex.min.css">
  <style>
    .head{flex:0 0 auto}.compare{margin-top:18px;grid-template-rows:minmax(0,1fr);gap:28px}.chart-panel{display:flex;flex-direction:column;min-height:0;padding:18px 22px 16px}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:8px}.panel-head p{margin-top:4px}.formula{font-size:24px;color:var(--model);white-space:nowrap}.plot{flex:1;min-height:0;position:relative}.plot svg{display:block;width:100%;height:100%}.readout{display:flex;align-items:baseline;gap:8px;color:var(--model);white-space:nowrap}.readout .num{font-size:34px}.interpret{margin-top:10px;padding-top:12px;border-top:2px solid var(--line);font-size:var(--fs-sec);font-weight:650}.controls{flex:0 0 auto;margin-top:18px;display:grid;grid-template-columns:170px minmax(0,1fr) 110px;gap:18px;align-items:center;padding:14px 20px}.zvalue{display:flex;align-items:baseline;gap:6px}.zvalue .num{font-size:30px;color:var(--attention)}.axis path,.axis line{stroke:var(--line);stroke-width:2}.axis text{fill:var(--muted);font:13px var(--font-num)}.guide{stroke:var(--attention);stroke-width:2;stroke-dasharray:7 6}.cursor{fill:var(--paper);stroke:var(--attention);stroke-width:4}.curve-hard{fill:none;stroke:var(--text);stroke-width:5;stroke-linejoin:round}.curve-sig{fill:none;stroke:var(--model);stroke-width:5}.threshold{stroke:var(--line);stroke-width:2;stroke-dasharray:4 6}.plot-label{font:700 15px var(--font-sans);fill:var(--muted)}.plot-value{font:750 15px var(--font-num);fill:var(--attention)}
  </style>
</head>
<body data-page="04" data-total="20">
  <div id="stage">
    <header class="head">
      <div class="kicker">激活函数 · 平滑开关</div>
      <h1>把分数压成 0 到 1</h1>
    </header>

    <main class="compare min0" aria-label="硬阈值与 sigmoid 对比">
      <figure class="panel chart-panel min0" aria-labelledby="hard-title">
        <div class="panel-head">
          <div><h2 id="hard-title">硬阈值：突然翻转</h2><p class="small">z&lt;0 输出 0，z≥0 输出 1</p></div>
          <div class="readout" aria-label="硬阈值当前输出"><span class="small">输出</span><span id="hardOut" class="num">1</span></div>
        </div>
        <div class="plot min0"><svg id="hardChart" role="img" aria-labelledby="hard-svg-title hard-svg-desc"><title id="hard-svg-title">硬阈值阶梯图</title><desc id="hard-svg-desc">输入小于零时输出零，输入大于等于零时输出一，游标随滑杆移动。</desc></svg></div>
        <figcaption class="interpret">像开关：跨过 0，输出立刻从 0 跳到 1。</figcaption>
      </figure>

      <figure class="panel chart-panel min0" aria-labelledby="sig-title">
        <div class="panel-head">
          <div><h2 id="sig-title">Sigmoid：平滑过渡</h2><div id="formula" class="formula" aria-label="p 等于 sigma z，等于一除以一加 e 的负 z 次方"></div></div>
          <div class="readout" aria-live="polite"><span>p≈</span><span id="pOut" class="num">0.574</span></div>
        </div>
        <div class="plot min0"><svg id="sigChart" role="img" aria-labelledby="sig-svg-title sig-svg-desc"><title id="sig-svg-title">sigmoid 曲线图</title><desc id="sig-svg-desc">输入从负六到六时，输出平滑地从接近零上升到接近一，游标随滑杆移动。</desc></svg></div>
        <figcaption class="interpret">可读作：模型给出约 <span id="pct">57.4%</span> 的通过倾向，不等于真实概率保证。</figcaption>
      </figure>
    </main>

    <section class="panel controls" aria-label="调整输入分数">
      <div class="zvalue"><span class="lead">输入 z</span><span id="zOut" class="num">0.3</span></div>
      <label class="ctl" for="zSlider"><span>拖动分数，比较“骤变”和“平滑”</span><input id="zSlider" type="range" min="-6" max="6" step="0.1" value="0.3"></label>
      <button id="reset" class="btn" type="button">复位到 0.3</button>
    </section>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lib/d3.min.js"></script>
  <script src="assets/lib/katex.min.js"></script>
  <script>
  (function(){
    Deck.init({index:4,total:20});
    katex.render('p=\\sigma(z)=\\frac{1}{1+e^{-z}}', document.getElementById('formula'), {throwOnError:false});
    var state={z:0.3};
    var slider=document.getElementById('zSlider'), zOut=document.getElementById('zOut'), pOut=document.getElementById('pOut'), hardOut=document.getElementById('hardOut'), pct=document.getElementById('pct');
    function sigmoid(z){return 1/(1+Math.exp(-z));}
    function draw(svgId,kind){
      var node=document.getElementById(svgId), box=node.getBoundingClientRect(), W=Math.max(520,box.width/Deck.s), H=Math.max(260,box.height/Deck.s), m={t:20,r:28,b:42,l:54};
      var svg=d3.select(node).attr('viewBox','0 0 '+W+' '+H); svg.selectAll('*:not(title):not(desc)').remove();
      var x=d3.scaleLinear().domain([-6,6]).range([m.l,W-m.r]), y=d3.scaleLinear().domain([0,1]).range([H-m.b,m.t]);
      svg.append('g').attr('class','axis').attr('transform','translate(0,'+(H-m.b)+')').call(d3.axisBottom(x).tickValues([-6,0,6]).tickSizeOuter(0));
      svg.append('g').attr('class','axis').attr('transform','translate('+m.l+',0)').call(d3.axisLeft(y).tickValues([0,0.5,1]).tickFormat(function(d){return d===0.5?'0.5':String(d);}).tickSizeOuter(0));
      svg.append('text').attr('class','plot-label').attr('x',W-m.r).attr('y',H-8).attr('text-anchor','end').text('输入 z');
      svg.append('text').attr('class','plot-label').attr('x',m.l+8).attr('y',m.t+4).text('输出');
      svg.append('line').attr('class','threshold').attr('x1',x(0)).attr('x2',x(0)).attr('y1',m.t).attr('y2',H-m.b);
      if(kind==='hard'){
        svg.append('path').attr('class','curve-hard').attr('d','M'+x(-6)+','+y(0)+'H'+x(0)+'V'+y(1)+'H'+x(6));
      }else{
        var data=d3.range(-6,6.001,0.05).map(function(z){return [z,sigmoid(z)];});
        svg.append('path').datum(data).attr('class','curve-sig').attr('d',d3.line().x(function(d){return x(d[0]);}).y(function(d){return y(d[1]);}));
      }
      var val=kind==='hard'?(state.z>=0?1:0):sigmoid(state.z);
      svg.append('line').attr('class','guide').attr('x1',x(state.z)).attr('x2',x(state.z)).attr('y1',y(val)).attr('y2',H-m.b);
      svg.append('line').attr('class','guide').attr('x1',m.l).attr('x2',x(state.z)).attr('y1',y(val)).attr('y2',y(val));
      svg.append('circle').attr('class','cursor').attr('cx',x(state.z)).attr('cy',y(val)).attr('r',8);
      svg.append('text').attr('class','plot-value').attr('x',Math.min(W-m.r-4,x(state.z)+12)).attr('y',Math.max(m.t+16,y(val)-12)).text(kind==='hard'?'输出 '+val:'p≈'+val.toFixed(3));
    }
    function render(){
      var p=sigmoid(state.z); zOut.textContent=state.z.toFixed(1); pOut.textContent=p.toFixed(3); hardOut.textContent=state.z>=0?'1':'0'; pct.textContent=(p*100).toFixed(1)+'%'; draw('hardChart','hard');draw('sigChart','sig');
    }
    function setState(patch){Object.assign(state,patch);render();}
    slider.addEventListener('input',function(){setState({z:Number(slider.value)});});
    document.getElementById('reset').addEventListener('click',function(){slider.value='0.3';setState({z:0.3});slider.focus();});
    var ro=new ResizeObserver(render);ro.observe(document.querySelector('.compare'));render();
    window.addEventListener('pagehide',function(){ro.disconnect();d3.selectAll('svg').on('.interaction',null);},{once:true});
  })();
  </script>
</body>
</html>
