<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>权重决定“看重什么”</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #weight-lab{min-height:0}
    #weight-lab .model-stage{display:flex;flex-direction:column;min-height:0;border:var(--rule) solid var(--line);border-radius:var(--r);background:var(--paper);overflow:hidden}
    #weight-lab .plot-wrap{flex:1;min-height:0;padding:12px 18px 0}
    #weight-lab svg{display:block;width:100%;height:100%;min-height:480px}
    #weight-lab .grid{stroke:var(--line);stroke-width:1;opacity:.38}
    #weight-lab .axis{stroke:var(--text);stroke-width:2}
    #weight-lab .tick{font:13px var(--font-num);fill:var(--muted)}
    #weight-lab .axis-label{font:700 17px var(--font-sans);fill:var(--text)}
    #weight-lab .sample-label{font:700 17px var(--font-sans);fill:var(--data)}
    #weight-lab .input-label{font:700 16px var(--font-sans);fill:var(--text)}
    #weight-lab .path-label{font:700 15px var(--font-sans);fill:var(--model)}
    #weight-lab .path-label.neg{fill:var(--attention)}
    #weight-lab .weight-path{fill:none;stroke:var(--model);stroke-linecap:round;transition:stroke-width .12s ease}
    #weight-lab .weight-path.neg{stroke:var(--attention);stroke-dasharray:12 9;stroke-linecap:butt}
    #weight-lab .guide{stroke:var(--data);stroke-width:2;stroke-dasharray:5 7;opacity:.75}
    #weight-lab .point{fill:var(--data);stroke:var(--paper);stroke-width:5}
    #weight-lab .sum-node{fill:var(--paper);stroke:var(--model);stroke-width:4}
    #weight-lab .node-main{font:750 25px var(--font-num);fill:var(--model);text-anchor:middle}
    #weight-lab .node-sub{font:650 14px var(--font-sans);fill:var(--muted);text-anchor:middle}
    #weight-lab .caption{display:flex;justify-content:space-between;gap:22px;padding:13px 20px 16px;border-top:var(--rule) solid var(--line);font-size:var(--fs-sec);color:var(--muted)}
    #weight-lab .caption strong{color:var(--text)}
    #weight-lab .controls{display:flex;flex-direction:column;gap:18px}
    #weight-lab .control-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
    #weight-lab .control-head output{font:750 24px/1 var(--font-num);color:var(--model)}
    #weight-lab .scale{display:flex;justify-content:space-between;font:13px/1 var(--font-num);color:var(--muted)}
    #weight-lab .readout{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:2px}
    #weight-lab .reading{border-top:3px solid var(--model);padding-top:12px}
    #weight-lab .reading .name{font-size:var(--fs-label);color:var(--muted);margin-bottom:7px}
    #weight-lab .formula{padding:14px 0;border-top:var(--rule) solid var(--line);border-bottom:var(--rule) solid var(--line);font:650 16px/1.5 var(--font-num);color:var(--muted)}
    #weight-lab .formula strong{color:var(--text)}
    #weight-lab .rule{display:grid;gap:8px;font-size:var(--fs-sec);line-height:1.4}
    #weight-lab .rule b{color:var(--model)}
    #weight-lab .locked{font-size:var(--fs-label);color:var(--muted)}
    #weight-lab .locked strong{color:var(--text)}
    #weight-lab .reset{align-self:flex-start;margin-top:auto}
  </style>
</head>
<body data-page="05" data-total="20">
  <div id="stage">
    <header>
      <div class="kicker">单个神经元 · 参数实验</div>
      <h1>权重决定“看重什么”</h1>
    </header>

    <main id="weight-lab" class="lab min0" aria-label="权重影响实验">
      <section class="model-stage min0" aria-label="固定输入点与加权连线">
        <div class="plot-wrap min0">
          <svg viewBox="0 0 1020 570" role="img" aria-labelledby="plot-title plot-desc">
            <title id="plot-title">学习三小时、睡眠六点五小时的固定输入</title>
            <desc id="plot-desc">两个输入通过可变粗细和线型的连线进入神经元。权重绝对值越大，线越粗；负权重显示为虚线。</desc>
            <g aria-hidden="true">
              <line class="grid" x1="90" y1="430" x2="650" y2="430"/><line class="grid" x1="90" y1="350" x2="650" y2="350"/><line class="grid" x1="90" y1="270" x2="650" y2="270"/><line class="grid" x1="90" y1="190" x2="650" y2="190"/><line class="grid" x1="90" y1="110" x2="650" y2="110"/>
              <line class="grid" x1="170" y1="510" x2="170" y2="70"/><line class="grid" x1="250" y1="510" x2="250" y2="70"/><line class="grid" x1="330" y1="510" x2="330" y2="70"/><line class="grid" x1="410" y1="510" x2="410" y2="70"/><line class="grid" x1="490" y1="510" x2="490" y2="70"/><line class="grid" x1="570" y1="510" x2="570" y2="70"/><line class="grid" x1="650" y1="510" x2="650" y2="70"/>
              <line class="axis" x1="90" y1="510" x2="675" y2="510"/><line class="axis" x1="90" y1="510" x2="90" y2="48"/>
              <text class="tick" x="84" y="530">0</text><text class="tick" x="244" y="530">2</text><text class="tick" x="404" y="530">4</text><text class="tick" x="564" y="530">6</text>
              <text class="tick" x="62" y="435">2</text><text class="tick" x="62" y="355">4</text><text class="tick" x="62" y="275">6</text><text class="tick" x="62" y="195">8</text><text class="tick" x="55" y="115">10</text>
              <text class="axis-label" x="545" y="560">学习小时数 x₁</text><text class="axis-label" x="96" y="42">睡眠小时数 x₂</text>
              <line class="guide" x1="330" y1="250" x2="330" y2="510"/><line class="guide" x1="90" y1="250" x2="330" y2="250"/>
              <circle class="point" cx="330" cy="250" r="11"/><text class="sample-label" x="350" y="238">固定输入 (3, 6.5)</text>
            </g>
            <g>
              <text class="input-label" x="710" y="150">x₁ = 3</text>
              <text class="input-label" x="710" y="378">x₂ = 6.5</text>
              <line id="path1" class="weight-path" x1="775" y1="144" x2="892" y2="250"/>
              <line id="path2" class="weight-path" x1="775" y1="372" x2="892" y2="276"/>
              <text id="pathLabel1" class="path-label" x="787" y="192">w₁ = 1.0</text>
              <text id="pathLabel2" class="path-label" x="787" y="337">w₂ = 0.2</text>
              <circle class="sum-node" cx="925" cy="263" r="68"/>
              <text class="node-main" x="925" y="258">Σ → σ</text>
              <text class="node-sub" x="925" y="286">加权后输出概率</text>
            </g>
          </svg>
        </div>
        <div class="caption">
          <span><strong>不变：</strong>输入点始终是 (3, 6.5)</span>
          <span>线宽只编码 |w|，用于比较影响幅度。</span>
        </div>
      </section>

      <aside class="panel controls min0" aria-label="权重控制与实时读数">
        <label class="ctl" for="w1">
          <span class="control-head"><span>学习小时权重 w₁</span><output id="w1out" for="w1">1.0</output></span>
          <input id="w1" type="range" min="-2" max="2" step="0.1" value="1" aria-describedby="w1effect">
          <span class="scale"><span>−2</span><span>0</span><span>2</span></span>
          <span id="w1effect" class="hint">正向影响</span>
        </label>
        <label class="ctl" for="w2">
          <span class="control-head"><span>睡眠小时权重 w₂</span><output id="w2out" for="w2">0.2</output></span>
          <input id="w2" type="range" min="-2" max="2" step="0.1" value="0.2" aria-describedby="w2effect">
          <span class="scale"><span>−2</span><span>0</span><span>2</span></span>
          <span id="w2effect" class="hint">正向影响</span>
        </label>

        <div class="formula"><strong>z</strong> = 3w₁ + 6.5w₂ − 4<br><strong>p</strong> = σ(z)</div>
        <div class="readout" aria-live="polite">
          <div class="reading"><div class="name">加权分数 z</div><div id="zout" class="big sm">0.30</div></div>
          <div class="reading"><div class="name">概率 p</div><div id="pout" class="big sm">0.574</div></div>
        </div>
        <div class="rule">
          <div><b>权重大：</b>这个输入对分数影响大</div>
          <div><b>正负号：</b>影响方向</div>
        </div>
        <div class="locked">偏置固定为 <strong class="num">b = −4</strong>，本页不调整；偏置见第 6 页。</div>
        <button id="reset" class="btn reset" type="button">复位权重</button>
      </aside>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      const root = document.getElementById('weight-lab');
      const q = s => root.querySelector(s);
      const els = {
        w1:q('#w1'), w2:q('#w2'), w1out:q('#w1out'), w2out:q('#w2out'),
        z:q('#zout'), p:q('#pout'), path1:q('#path1'), path2:q('#path2'),
        label1:q('#pathLabel1'), label2:q('#pathLabel2'), effect1:q('#w1effect'), effect2:q('#w2effect'), reset:q('#reset')
      };
      let state = {w1:1, w2:.2};
      const fmt = v => (Math.abs(v) < .05 ? 0 : v).toFixed(1);
      function applyPath(path,label,effect,w,name){
        const mag=Math.abs(w);
        path.style.strokeWidth=(2+mag*7).toFixed(1);
        const neg=w<0;
        path.classList.toggle('neg',neg); label.classList.toggle('neg',neg);
        label.textContent=`${name} = ${fmt(w)}${neg?' · 反向影响':''}`;
        effect.textContent=neg?'反向影响':(w===0?'当前无影响':'正向影响');
      }
      function render(){
        els.w1.value=state.w1; els.w2.value=state.w2;
        els.w1out.value=els.w1out.textContent=fmt(state.w1);
        els.w2out.value=els.w2out.textContent=fmt(state.w2);
        const z=3*state.w1+6.5*state.w2-4, p=1/(1+Math.exp(-z));
        els.z.textContent=z.toFixed(2); els.p.textContent=p.toFixed(3);
        applyPath(els.path1,els.label1,els.effect1,state.w1,'w₁');
        applyPath(els.path2,els.label2,els.effect2,state.w2,'w₂');
      }
      function input(){state={w1:Number(els.w1.value),w2:Number(els.w2.value)};render()}
      els.w1.addEventListener('input',input); els.w2.addEventListener('input',input);
      els.reset.addEventListener('click',()=>{state={w1:1,w2:.2};render();els.w1.focus()});
      render();
      Deck.init({index:5,total:20});
    })();
  </script>
</body>
</html>
