<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>偏置像一只整体平移旋钮</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #bias-widget{display:contents}
    #bias-widget .plot-panel{display:flex;flex-direction:column;min-height:0;padding:18px 20px 14px}
    #bias-widget .plot-head{display:flex;justify-content:space-between;align-items:baseline;gap:18px;margin-bottom:8px}
    #bias-widget .plot-head .small{white-space:nowrap}
    #bias-widget svg{width:100%;height:100%;min-height:0;display:block}
    #bias-widget .grid{stroke:var(--line);stroke-width:1;opacity:.42}
    #bias-widget .axis{stroke:var(--text);stroke-width:2}
    #bias-widget .tick{fill:var(--muted);font:13px var(--font-num)}
    #bias-widget .axis-label{fill:var(--text);font:700 17px var(--font-sans)}
    #bias-widget .region{fill:var(--model);opacity:.055}
    #bias-widget .region-label{fill:var(--muted);font:650 16px var(--font-sans)}
    #bias-widget .boundary{stroke:var(--model);stroke-width:5;fill:none;vector-effect:non-scaling-stroke}
    #bias-widget .sample-dot{fill:var(--data);stroke:var(--paper);stroke-width:4;vector-effect:non-scaling-stroke}
    #bias-widget .sample-label{fill:var(--data);font:700 15px var(--font-num);paint-order:stroke;stroke:var(--paper);stroke-width:5;stroke-linejoin:round}
    #bias-widget .control-panel{display:flex;flex-direction:column;justify-content:center;gap:22px;padding:28px}
    #bias-widget .equation{font:750 34px/1.25 var(--font-num);color:var(--text);padding-bottom:20px;border-bottom:2px solid var(--line);white-space:nowrap}
    #bias-widget .equation .bias-term{color:var(--attention)}
    #bias-widget .value-row{display:flex;justify-content:space-between;align-items:baseline;gap:20px}
    #bias-widget .value{color:var(--attention)}
    #bias-widget .range-wrap{position:relative;padding:4px 0 26px}
    #bias-widget .ticks{display:flex;justify-content:space-between;color:var(--muted);font:13px var(--font-num);padding:0 5px}
    #bias-widget .invariant{display:flex;gap:14px;align-items:flex-start;padding-top:18px;border-top:2px solid var(--line)}
    #bias-widget .invariant strong{color:var(--model);font-size:var(--fs-sec);white-space:nowrap}
    #bias-widget .actions{display:flex;align-items:center;justify-content:space-between;gap:16px}
    #bias-widget .conclusion{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:22px;min-height:64px;border-top:2px solid var(--line);font-size:30px;font-weight:800;letter-spacing:.02em}
    #bias-widget .conclusion .weight{color:var(--model)}
    #bias-widget .conclusion .bias{color:var(--attention)}
  </style>
</head>
<body data-page="06" data-total="20">
  <div id="stage">
    <header>
      <div class="kicker">单个神经元 · 参数分工</div>
      <h1>偏置像一只整体平移旋钮</h1>
    </header>

    <main id="bias-widget" aria-label="偏置平移分类直线实验">
      <section class="split min0">
        <div class="panel plot-panel min0">
          <div class="plot-head">
            <h2>分类直线</h2>
            <p class="small">三个样本固定，坐标轴与斜率固定</p>
          </div>
          <svg id="plot" viewBox="0 0 900 610" role="img" aria-labelledby="plot-title plot-desc">
            <title id="plot-title">偏置控制的二维分类直线</title>
            <desc id="plot-desc">直线 x1 减 x2 加 b 等于零。调节偏置时，直线保持斜率不变并平行移动。</desc>
            <defs><clipPath id="bias-plot-clip"><rect x="82" y="28" width="774" height="510"/></clipPath></defs>
            <g id="grid"></g>
            <g clip-path="url(#bias-plot-clip)">
              <polygon id="region" class="region"></polygon>
              <line id="boundary" class="boundary"></line>
            </g>
            <g id="axes"></g>
            <text class="region-label" x="136" y="76">输出偏 0</text>
            <text class="region-label" x="704" y="506">输出偏 1</text>
            <g id="samples"></g>
          </svg>
        </div>

        <aside class="panel control-panel min0">
          <div>
            <p class="note">当前边界方程</p>
            <div class="equation" aria-live="polite">x₁ − x₂ <span id="eqBias" class="bias-term">+ 0.0</span> = 0</div>
          </div>

          <label class="ctl" for="bias">
            <span class="value-row"><span>拖动偏置 b</span><span class="big sm value" id="biasValue">0.0</span></span>
            <span class="range-wrap">
              <input id="bias" type="range" min="-4" max="4" step="0.1" value="0" aria-describedby="biasHint">
              <span class="ticks" aria-hidden="true"><span>−4</span><span>0</span><span>4</span></span>
            </span>
          </label>

          <div class="invariant">
            <strong>保持不变</strong>
            <p class="small">w₁ = 1，w₂ = −1，所以直线斜率始终为 1。</p>
          </div>

          <div class="actions">
            <p class="hint" id="biasHint"><span id="status" aria-live="polite">方向键可按 0.1 精确调节</span></p>
            <button class="btn" id="reset" type="button">复位 b = 0</button>
          </div>
        </aside>
      </section>

      <footer class="conclusion" aria-label="结论">
        <span class="weight">权重转方向</span><span aria-hidden="true">；</span><span class="bias">偏置挪位置</span>
      </footer>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      const root = document.getElementById('bias-widget');
      const svg = root.querySelector('#plot');
      const grid = root.querySelector('#grid');
      const axes = root.querySelector('#axes');
      const samplesG = root.querySelector('#samples');
      const line = root.querySelector('#boundary');
      const region = root.querySelector('#region');
      const slider = root.querySelector('#bias');
      const value = root.querySelector('#biasValue');
      const eqBias = root.querySelector('#eqBias');
      const status = root.querySelector('#status');
      const reset = root.querySelector('#reset');
      const NS = 'http://www.w3.org/2000/svg';
      const box = {x:82,y:28,w:774,h:510};
      const domain = {min:0,max:8};
      let state = {b:0};
      const sx = x => box.x + (x-domain.min)/(domain.max-domain.min)*box.w;
      const sy = y => box.y + box.h - (y-domain.min)/(domain.max-domain.min)*box.h;
      const add = (tag, attrs, parent) => { const el=document.createElementNS(NS,tag); Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v)); parent.appendChild(el); return el; };

      for(let i=0;i<=8;i++){
        add('line',{x1:sx(i),y1:box.y,x2:sx(i),y2:box.y+box.h,class:'grid'},grid);
        add('line',{x1:box.x,y1:sy(i),x2:box.x+box.w,y2:sy(i),class:'grid'},grid);
        const tx=add('text',{x:sx(i),y:box.y+box.h+24,'text-anchor':'middle',class:'tick'},axes); tx.textContent=i;
        const ty=add('text',{x:box.x-14,y:sy(i)+5,'text-anchor':'end',class:'tick'},axes); ty.textContent=i;
      }
      add('line',{x1:box.x,y1:box.y+box.h,x2:box.x+box.w+12,y2:box.y+box.h,class:'axis'},axes);
      add('line',{x1:box.x,y1:box.y+box.h,x2:box.x,y2:box.y-12,class:'axis'},axes);
      const xl=add('text',{x:box.x+box.w+18,y:box.y+box.h+6,class:'axis-label'},axes); xl.textContent='x₁';
      const yl=add('text',{x:box.x-6,y:box.y-14,class:'axis-label'},axes); yl.textContent='x₂';

      [[2,5],[4,3],[6,5]].forEach(([x,y])=>{
        add('circle',{cx:sx(x),cy:sy(y),r:10,class:'sample-dot'},samplesG);
        const t=add('text',{x:sx(x)+14,y:sy(y)-14,class:'sample-label'},samplesG); t.textContent=`(${x},${y})`;
      });

      function segment(b){
        const pts=[];
        const candidates=[[0,b],[8,8+b],[-b,0],[8-b,8]];
        candidates.forEach(([x,y])=>{if(x>=0&&x<=8&&y>=0&&y<=8&&!pts.some(p=>Math.abs(p[0]-x)<.001&&Math.abs(p[1]-y)<.001))pts.push([x,y]);});
        return pts.slice(0,2);
      }
      function render(announce=false){
        const b=state.b;
        const pts=segment(b);
        line.setAttribute('x1',sx(pts[0][0])); line.setAttribute('y1',sy(pts[0][1]));
        line.setAttribute('x2',sx(pts[1][0])); line.setAttribute('y2',sy(pts[1][1]));
        const poly=b>=0?[[0,b],[8-b,8],[0,8]]:[[ -b,0],[8,8+b],[8,8],[0,8],[0,0]];
        region.setAttribute('points',poly.map(p=>`${sx(p[0])},${sy(p[1])}`).join(' '));
        slider.value=b.toFixed(1); value.textContent=b.toFixed(1);
        eqBias.textContent=b>=0?`+ ${b.toFixed(1)}`:`− ${Math.abs(b).toFixed(1)}`;
        if(announce) status.textContent=`偏置 ${b.toFixed(1)}；斜率保持 1，直线平行移动`;
      }
      slider.addEventListener('input',()=>{state={b:Number(slider.value)};render(false)});
      slider.addEventListener('change',()=>render(true));
      reset.addEventListener('click',()=>{state={b:0};render(true);slider.focus()});
      render();
      Deck.init({index:6,total:20});
    })();
  </script>
</body>
</html>
