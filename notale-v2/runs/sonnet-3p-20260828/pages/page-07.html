<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #boundary-widget{display:grid}
    #boundary-widget .diagram{display:flex;flex-direction:column;min-width:0;min-height:0;gap:14px}
    #boundary-widget .formula{display:flex;align-items:center;justify-content:space-between;gap:18px}
    #boundary-widget .eq{font:750 25px/1.2 var(--font-num);font-variant-numeric:tabular-nums;color:var(--text)}
    #boundary-widget .eq .hot{color:var(--attention)}
    #boundary-widget .controls{display:flex;gap:10px;align-items:center}
    #boundary-widget .plot{flex:1;min-height:0;background:var(--paper);border:var(--rule) solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 5px 14px rgba(23,38,43,.08)}
    #boundary-widget svg{display:block;width:100%;height:100%}
    #boundary-widget .grid{stroke:var(--line);stroke-width:1;opacity:.35}
    #boundary-widget .axis{stroke:var(--muted);stroke-width:2}
    #boundary-widget .boundary{stroke:var(--model);stroke-width:6;fill:none;vector-effect:non-scaling-stroke}
    #boundary-widget .normal{stroke:var(--attention);stroke-width:5;fill:none;vector-effect:non-scaling-stroke}
    #boundary-widget .pos{fill:var(--model);opacity:.12}
    #boundary-widget .neg{fill:var(--data);opacity:.10}
    #boundary-widget .plot-label{font:700 18px/1 var(--font-sans);fill:var(--text)}
    #boundary-widget .plot-note{font:650 15px/1 var(--font-sans);fill:var(--muted)}
    #boundary-widget .weight-label{font:750 17px/1 var(--font-num);fill:var(--attention)}
    #boundary-widget .side{display:flex;flex-direction:column;justify-content:center;gap:24px;min-width:0}
    #boundary-widget .side .k-generalization{grid-template-columns:1fr;gap:24px;align-items:start}
    #boundary-widget .side .claim{font-size:30px}
    #boundary-widget .side .supports{border-left:4px solid var(--model)}
    #boundary-widget .state-readout{padding-top:16px;border-top:var(--rule) solid var(--line);min-height:74px}
    #boundary-widget .state-readout strong{color:var(--attention);font-family:var(--font-num)}
    @media (prefers-reduced-motion:reduce){#boundary-widget *{transition:none!important}}
  </style>
</head>
<body data-page="07" data-total="20">
  <div id="stage">
    <header>
      <div class="kicker">从代数式到几何边界</div>
      <h1>一个神经元能画出一条分界线</h1>
    </header>

    <main id="boundary-widget" class="board">
      <section class="diagram min0" aria-label="神经元线性分界交互图">
        <div class="formula">
          <div class="eq" aria-label="w1乘x1加w2乘x2加b等于零"><span id="w-term">w₁x₁+w₂x₂</span>+<span id="b-term">b</span>=0</div>
          <div class="controls" aria-label="改变分界线">
            <button class="btn" id="rotate" type="button" aria-pressed="false">转动 w</button>
            <button class="btn" id="shift" type="button" aria-pressed="false">移动 b</button>
            <button class="btn" id="reset" type="button">恢复</button>
          </div>
        </div>
        <div class="plot min0">
          <svg id="plane" viewBox="0 0 920 590" role="img" aria-labelledby="plane-title plane-desc">
            <title id="plane-title">权重与直线分界</title>
            <desc id="plane-desc">坐标平面被直线分成 z 大于零和 z 小于零两侧，权重向量垂直于直线。</desc>
            <defs>
              <marker id="normal-arrow-07" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="var(--attention)"/></marker>
            </defs>
            <g id="grid"></g>
            <polygon id="neg-region" class="neg"></polygon>
            <polygon id="pos-region" class="pos"></polygon>
            <g aria-hidden="true"><line class="axis" x1="70" y1="295" x2="870" y2="295"/><line class="axis" x1="460" y1="45" x2="460" y2="545"/></g>
            <line id="boundary" class="boundary"/>
            <line id="normal" class="normal" marker-end="url(#normal-arrow-07)"/>
            <text id="normal-label" class="weight-label">(w₁,w₂)</text>
            <text class="plot-note" x="850" y="322">x₁</text><text class="plot-note" x="478" y="62">x₂</text>
            <text id="pos-label" class="plot-label">z &gt; 0</text><text id="neg-label" class="plot-label">z &lt; 0</text>
          </svg>
        </div>
      </section>

      <aside class="side min0">
        <div class="k-generalization">
          <div class="claim">单个神经元只能做线性切分</div>
          <div class="supports">
            <div class="trunk"></div>
            <div class="support">线的一侧 <span class="num">z&gt;0</span></div>
            <div class="support">另一侧 <span class="num">z&lt;0</span></div>
            <div class="support">sigmoid 只把两侧变平滑</div>
          </div>
        </div>
        <p class="state-readout small" id="readout">权重 <strong>(1.0, 1.0)</strong> 决定法向，偏置 <strong>0.0</strong> 决定直线位置。</p>
        <p class="hint">转动权重会转动直线；改变偏置只会平移直线。</p>
      </aside>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
  (()=>{
    const root=document.getElementById('boundary-widget');
    const q=s=>root.querySelector(s);
    const els={svg:q('#plane'),grid:q('#grid'),pos:q('#pos-region'),neg:q('#neg-region'),line:q('#boundary'),normal:q('#normal'),nl:q('#normal-label'),pl:q('#pos-label'),ml:q('#neg-label'),rotate:q('#rotate'),shift:q('#shift'),reset:q('#reset'),readout:q('#readout'),wt:q('#w-term'),bt:q('#b-term')};
    const initial={w1:1,w2:1,b:0,rotated:false,shifted:false,last:'none'};
    let state={...initial}, raf=0, destroyed=false;
    const box={l:70,r:870,t:45,b:545};
    const X=x=>460+x*(400/3), Y=y=>295-y*(250/3);
    function clip(poly,w1,w2,b,keep){const out=[];for(let i=0;i<poly.length;i++){const A=poly[i],B=poly[(i+1)%poly.length],fa=w1*A[0]+w2*A[1]+b,fb=w1*B[0]+w2*B[1]+b,ia=keep?fa>=0:fa<=0,ib=keep?fb>=0:fb<=0;if(ia)out.push(A);if(ia!==ib){const t=fa/(fa-fb);out.push([A[0]+t*(B[0]-A[0]),A[1]+t*(B[1]-A[1])]);}}return out}
    const pts=p=>p.map(v=>`${X(v[0])},${Y(v[1])}`).join(' ');
    function lineEnds(w1,w2,b){const hits=[];for(const x of [-3,3]){const y=(-b-w1*x)/w2;if(y>=-3&&y<=3)hits.push([x,y])}for(const y of [-3,3]){const x=(-b-w2*y)/w1;if(x>=-3&&x<=3)hits.push([x,y])}return [hits[0],hits[1]]}
    function render(s){
      const square=[[-3,-3],[3,-3],[3,3],[-3,3]], positive=clip(square,s.w1,s.w2,s.b,true), negative=clip(square,s.w1,s.w2,s.b,false);
      els.pos.setAttribute('points',pts(positive));els.neg.setAttribute('points',pts(negative));
      const [a,c]=lineEnds(s.w1,s.w2,s.b);els.line.setAttribute('x1',X(a[0]));els.line.setAttribute('y1',Y(a[1]));els.line.setAttribute('x2',X(c[0]));els.line.setAttribute('y2',Y(c[1]));
      const d=s.w1*s.w1+s.w2*s.w2, p=[-s.b*s.w1/d,-s.b*s.w2/d], mag=Math.hypot(s.w1,s.w2), n=[s.w1/mag,s.w2/mag], e=[p[0]+n[0]*1.35,p[1]+n[1]*1.35];
      els.normal.setAttribute('x1',X(p[0]));els.normal.setAttribute('y1',Y(p[1]));els.normal.setAttribute('x2',X(e[0]));els.normal.setAttribute('y2',Y(e[1]));els.nl.setAttribute('x',X(e[0])+12);els.nl.setAttribute('y',Y(e[1])-10);
      const pp=[p[0]+n[0]*2.1,p[1]+n[1]*2.1],np=[p[0]-n[0]*2.0,p[1]-n[1]*2.0];els.pl.setAttribute('x',X(pp[0])-25);els.pl.setAttribute('y',Y(pp[1]));els.ml.setAttribute('x',X(np[0])-25);els.ml.setAttribute('y',Y(np[1]));
      els.rotate.setAttribute('aria-pressed',String(s.rotated));els.shift.setAttribute('aria-pressed',String(s.shifted));els.wt.classList.toggle('hot',s.last==='w');els.bt.classList.toggle('hot',s.last==='b');
      els.readout.innerHTML=`权重 <strong>(${s.w1.toFixed(1)}, ${s.w2.toFixed(1)})</strong> 决定法向，偏置 <strong>${s.b.toFixed(1)}</strong> 决定直线位置。`;
    }
    function commit(next,msg){cancelAnimationFrame(raf);const from={...state},to={...next};state=to;els.readout.setAttribute('aria-label',msg);if(Deck.reduced()){render(state);return}const start=performance.now(),dur=420;const tick=now=>{const t=Math.min(1,(now-start)/dur),e=1-Math.pow(1-t,3);render({...to,w1:from.w1+(to.w1-from.w1)*e,w2:from.w2+(to.w2-from.w2)*e,b:from.b+(to.b-from.b)*e});if(t<1&&!destroyed)raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}
    els.rotate.addEventListener('click',()=>{const on=!state.rotated;commit({...state,w1:on?-.5:1,w2:on?1.2:1,rotated:on,last:'w'},on?'权重已转动，法向和分界线同步旋转。':'权重角度已恢复。')});
    els.shift.addEventListener('click',()=>{const on=!state.shifted;commit({...state,b:on?-1.5:0,shifted:on,last:'b'},on?'偏置已改变，分界线沿法向平移。':'偏置已回到零。')});
    els.reset.addEventListener('click',()=>commit({...initial},'已恢复初始权重和偏置。'));
    for(let i=-2;i<=2;i++){if(i===0)continue;els.grid.insertAdjacentHTML('beforeend',`<line class="grid" x1="${X(i)}" y1="45" x2="${X(i)}" y2="545"/><line class="grid" x1="70" y1="${Y(i)}" x2="870" y2="${Y(i)}"/>`)}
    render(state);Deck.init({index:7,total:20});
    window.addEventListener('pagehide',()=>{destroyed=true;cancelAnimationFrame(raf)},{once:true});
  })();
  </script>
</body>
</html>
