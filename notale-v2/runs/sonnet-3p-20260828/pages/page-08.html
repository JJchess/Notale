<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/lib/katex.min.css">
  <style>
    #loss-widget{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:26px}
    #loss-widget .instrument{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:42px;align-items:center}
    #loss-widget .scale-area{position:relative;height:300px;padding:28px 34px 0}
    #loss-widget .axis{position:absolute;left:52px;right:52px;top:150px;height:10px;background:var(--line);border-radius:5px}
    #loss-widget .axis::before{content:"";position:absolute;left:0;top:0;height:100%;width:var(--p);background:var(--model);border-radius:5px}
    #loss-widget .tick{position:absolute;top:178px;transform:translateX(-50%);font:700 var(--fs-tick)/1 var(--font-num);color:var(--muted)}
    #loss-widget .tick::before{content:"";position:absolute;left:50%;top:-23px;height:14px;border-left:2px solid var(--line)}
    #loss-widget .target{position:absolute;top:55px;left:calc(52px + (100% - 104px)*var(--t));transform:translateX(-50%);color:var(--data);font-weight:800;text-align:center;white-space:nowrap}
    #loss-widget .target svg{display:block;margin:0 auto 5px;width:38px;height:45px}
    #loss-widget .cursor{position:absolute;top:108px;left:calc(52px + (100% - 104px)*var(--pnum));transform:translateX(-50%);color:var(--model);text-align:center;pointer-events:none}
    #loss-widget .cursor .value{font:800 25px/1 var(--font-num);background:var(--paper);padding:5px 8px;border:2px solid var(--model);border-radius:var(--r)}
    #loss-widget .cursor .stem{height:33px;border-left:4px solid var(--model);margin-left:50%}
    #loss-widget input[type=range]{position:absolute;left:52px;right:52px;top:130px;width:calc(100% - 104px);height:52px;opacity:0;cursor:grab;z-index:3}
    #loss-widget input[type=range]:active{cursor:grabbing}
    #loss-widget .drag-label{position:absolute;top:225px;left:0;right:0;text-align:center;color:var(--muted);font-size:var(--fs-label)}
    #loss-widget .readout{align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:26px 28px}
    #loss-widget .formula{font-size:24px;min-height:50px;color:var(--text)}
    #loss-widget .current{border-top:2px solid var(--line);padding-top:18px}
    #loss-widget .current .big{color:var(--attention)}
    #loss-widget .controls{display:flex;align-items:center;justify-content:center;gap:18px}
    #loss-widget .switch{display:flex;align-items:center;gap:10px}
    #loss-widget .conclusion{text-align:center;font-size:var(--fs-lead);font-weight:700;color:var(--text)}
    #loss-widget .conclusion strong{color:var(--attention)}
  </style>
</head>
<body data-page="08" data-total="20">
  <div id="stage">
    <header>
      <div class="kicker">单个样本的损失</div>
      <h1>怎样知道猜得有多差？</h1>
    </header>
    <main class="focus min0">
      <section id="loss-widget" aria-label="二分类交叉熵互动概率尺">
        <div class="instrument min0">
          <div class="scale-area min0" style="--p:20%;--pnum:.20;--t:1">
            <div class="target" aria-hidden="true">
              <svg viewBox="0 0 38 45"><path d="M7 43V3" fill="none" stroke="currentColor" stroke-width="4"/><path d="M9 5h25L27 16l7 11H9z" fill="currentColor"/></svg>
              <span>目标 t = <span id="target-label">1</span></span>
            </div>
            <div class="axis" aria-hidden="true"></div>
            <div class="cursor" aria-hidden="true"><div class="value">p = <span id="p-label">0.20</span></div><div class="stem"></div></div>
            <input id="prob" aria-label="模型预测概率 p" type="range" min="0.01" max="0.99" step="0.01" value="0.20">
            <span class="tick" style="left:52px">0</span><span class="tick" style="left:50%">0.5</span><span class="tick" style="left:calc(100% - 52px)">1</span>
            <div class="drag-label">拖动模型预测游标，也可用方向键微调</div>
          </div>
          <aside class="panel readout" aria-label="当前损失读数" aria-live="polite" aria-atomic="true">
            <h2>二分类交叉熵</h2>
            <div id="formula" class="formula"></div>
            <div class="current">
              <div class="small">当前样本损失</div>
              <div class="big sm">L ≈ <span id="loss">1.609</span></div>
              <div id="substitution" class="small num">−ln(0.20)</div>
            </div>
          </aside>
        </div>
        <div class="controls">
          <div class="switch" role="group" aria-label="目标切换 0 或 1">
            <span class="small">目标切换</span>
            <button class="btn" id="t0" type="button" aria-pressed="false">t = 0</button>
            <button class="btn" id="t1" type="button" aria-pressed="true">t = 1</button>
          </div>
          <button class="btn" id="reset" type="button">复位</button>
        </div>
        <p class="conclusion" id="conclusion">目标为 1 时，越自信地猜 <strong>0</strong>，惩罚越大</p>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lib/katex.min.js"></script>
  <script>
  (()=>{
    const root=document.getElementById('loss-widget');
    const $=s=>root.querySelector(s);
    const els={range:$('#prob'),area:$('.scale-area'),p:$('#p-label'),target:$('#target-label'),loss:$('#loss'),sub:$('#substitution'),formula:$('#formula'),conclusion:$('#conclusion'),t0:$('#t0'),t1:$('#t1'),reset:$('#reset')};
    const initial=()=>({p:.20,t:1}); let state=initial();
    function loss(){return state.t===1?-Math.log(state.p):-Math.log(1-state.p)}
    function render(announce=false){
      const p=state.p.toFixed(2), l=loss().toFixed(3);
      els.area.style.setProperty('--p',(state.p*100)+'%'); els.area.style.setProperty('--pnum',state.p); els.area.style.setProperty('--t',state.t);
      els.range.value=p; els.p.textContent=p; els.target.textContent=state.t; els.loss.textContent=l;
      els.sub.textContent=state.t===1?`−ln(${p})`:`−ln(1 − ${p})`;
      els.t0.setAttribute('aria-pressed',String(state.t===0)); els.t1.setAttribute('aria-pressed',String(state.t===1));
      els.conclusion.innerHTML=state.t===1?'目标为 1 时，越自信地猜 <strong>0</strong>，惩罚越大':'目标为 0 时，越自信地猜 <strong>1</strong>，惩罚越大';
      katex.render('L=-[t\\ln p+(1-t)\\ln(1-p)]',els.formula,{throwOnError:false,displayMode:false});
    }
    els.range.addEventListener('input',e=>{state={...state,p:Number(e.target.value)};render(false)});
    els.range.addEventListener('change',()=>render(true));
    els.t0.addEventListener('click',()=>{state={...state,t:0};render(true)});
    els.t1.addEventListener('click',()=>{state={...state,t:1};render(true)});
    els.reset.addEventListener('click',()=>{state=initial();render(true);els.range.focus()});
    render(); Deck.init({index:8,total:20});
  })();
  </script>
</body>
</html>
