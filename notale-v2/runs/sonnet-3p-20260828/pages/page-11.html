<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #lr-widget{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;margin-top:18px}
    #lr-widget .control-rail{display:flex;align-items:center;gap:12px;min-height:46px}
    #lr-widget .rail-label{font-size:var(--fs-label);font-weight:700;color:var(--muted);margin-right:4px}
    #lr-widget .run{margin-left:auto;background:var(--model);color:#fff}
    #lr-widget .run:hover{background:var(--text)}
    #lr-widget .plots{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
    #lr-widget .plot{min-width:0;min-height:0;display:flex;flex-direction:column;border-top:4px solid var(--line);padding-top:12px}
    #lr-widget .plot.active{border-top-color:var(--attention)}
    #lr-widget .plot-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
    #lr-widget .eta{font:750 var(--fs-body)/1.2 var(--font-num);color:var(--model)}
    #lr-widget .verdict{font-size:var(--fs-sec);font-weight:750;color:var(--text);min-height:25px}
    #lr-widget svg{display:block;width:100%;flex:1;min-height:260px;background:var(--paper);border:2px solid var(--line);border-radius:var(--r)}
    #lr-widget .axis{stroke:var(--line);stroke-width:1.5;vector-effect:non-scaling-stroke}
    #lr-widget .curve{fill:none;stroke:var(--line);stroke-width:2;vector-effect:non-scaling-stroke}
    #lr-widget .track{fill:none;stroke:var(--model);stroke-width:4;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
    #lr-widget .past{fill:var(--paper);stroke:var(--model);stroke-width:2;vector-effect:non-scaling-stroke}
    #lr-widget .current{fill:var(--attention);stroke:var(--paper);stroke-width:3;vector-effect:non-scaling-stroke}
    #lr-widget svg text{font-family:var(--font-sans);font-size:14px;fill:var(--muted)}
    #lr-widget .readout{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-top:10px;font-size:var(--fs-label);color:var(--muted)}
    #lr-widget .value{font-family:var(--font-num);font-size:var(--fs-sec);font-weight:750;color:var(--text)}
    #lr-widget .foot{display:flex;justify-content:space-between;align-items:center;gap:24px;color:var(--muted);font-size:var(--fs-label)}
    #lr-widget .formula{font-family:var(--font-num);color:var(--text)}
  </style>
</head>
<body data-page="11" data-total="20">
  <div id="stage">
    <header>
      <div class="kicker">学习率控制什么</div>
      <h1>步子太小、合适、太大</h1>
    </header>
    <main id="lr-widget" aria-label="比较三种学习率的八步迭代">
      <div class="control-rail" aria-label="学习率选择和运行控制">
        <span class="rail-label">观察一种学习率</span>
        <button class="btn eta-btn" data-i="0" aria-pressed="true">η = 0.05</button>
        <button class="btn eta-btn" data-i="1" aria-pressed="false">η = 0.2</button>
        <button class="btn eta-btn" data-i="2" aria-pressed="false">η = 1.1</button>
        <button class="btn" id="reset">回到起点</button>
        <button class="btn run" id="run">跑 8 步</button>
      </div>
      <div class="plots compare min0">
        <section class="plot active min0" data-i="0"><div class="plot-head"><span class="eta">η = 0.05</span><span class="verdict">等待运行</span></div><svg viewBox="0 0 440 430" role="img" aria-label="学习率0.05的损失曲线和迭代轨迹"></svg><div class="readout"><span>第 <b class="step num">0</b> 步</span><span class="value">w = −1.500　L = 2.250</span></div></section>
        <section class="plot min0" data-i="1"><div class="plot-head"><span class="eta">η = 0.2</span><span class="verdict">等待运行</span></div><svg viewBox="0 0 440 430" role="img" aria-label="学习率0.2的损失曲线和迭代轨迹"></svg><div class="readout"><span>第 <b class="step num">0</b> 步</span><span class="value">w = −1.500　L = 2.250</span></div></section>
        <section class="plot min0" data-i="2"><div class="plot-head"><span class="eta">η = 1.1</span><span class="verdict">等待运行</span></div><svg viewBox="0 0 440 430" role="img" aria-label="学习率1.1的损失曲线和迭代轨迹"></svg><div class="readout"><span>第 <b class="step num">0</b> 步</span><span class="value">w = −1.500　L = 2.250</span></div></section>
      </div>
      <div class="foot"><span class="formula">wₖ₊₁ = wₖ − 2ηwₖ　　相同起点 w₀ = −1.5 · 相同步数 · 相同坐标尺度</span><span>显示值均为四舍五入</span></div>
      <div class="sr-only" id="status" aria-live="polite"></div>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
  (()=>{
    const root=document.getElementById('lr-widget');
    const rates=[.05,.2,1.1], labels=['慢慢靠近','快速靠近','来回越跳越远'];
    const plots=[...root.querySelectorAll('.plot')];
    const state={selected:0,step:0,running:false,timer:0};
    const histories=rates.map(()=>[-1.5]);
    const X0=42,X1=420,Y0=392,Y1=22,xmin=-7,xmax=2,ymax=45;
    const sx=w=>X0+(Math.max(xmin,Math.min(xmax,w))-xmin)/(xmax-xmin)*(X1-X0), sy=l=>Y0-Math.max(0,Math.min(ymax,l))/ymax*(Y0-Y1);
    const fmtW=(v,i,k)=>k===8?(i===0?v.toFixed(3):i===1?v.toFixed(4):v.toFixed(3)):v.toFixed(3);
    const fmtL=(v,i,k)=>k===8?(i===0?v.toFixed(3):i===1?v.toFixed(6):v.toFixed(2)):v.toFixed(3);
    function baseSvg(){
      let curve=''; for(let j=0;j<=120;j++){const w=xmin+(xmax-xmin)*j/120;curve+=(j?'L':'M')+sx(w).toFixed(1)+','+sy(w*w).toFixed(1)}
      return `<line class="axis" x1="${X0}" y1="${Y0}" x2="${X1}" y2="${Y0}"/><line class="axis" x1="${sx(0)}" y1="${Y0}" x2="${sx(0)}" y2="${Y1}"/><path class="curve" d="${curve}"/><text x="${X1-8}" y="${Y0-10}" text-anchor="end">w</text><text x="${sx(0)+10}" y="${Y1+18}">L = w²</text><text x="${X0}" y="${Y0+25}">−7</text><text x="${sx(0)-4}" y="${Y0+25}" text-anchor="middle">0</text><text x="${X1}" y="${Y0+25}" text-anchor="end">2</text><text x="${X0-8}" y="${Y1+5}" text-anchor="end">45</text>`;
    }
    function render(){
      plots.forEach((p,i)=>{
        p.classList.toggle('active',i===state.selected);
        const h=histories[i], pts=h.map(w=>`${sx(w)},${sy(w*w)}`).join(' ');
        const marks=h.map((w,j)=>`<circle class="${j===h.length-1?'current':'past'}" cx="${sx(w)}" cy="${sy(w*w)}" r="${j===h.length-1?7:4}"/>`).join('');
        p.querySelector('svg').innerHTML=baseSvg()+`<polyline class="track" points="${pts}"/>${marks}`;
        p.querySelector('.step').textContent=state.step;
        const w=h[h.length-1];p.querySelector('.value').textContent=`w = ${fmtW(w,i,state.step).replace('-','−')}　L = ${fmtL(w*w,i,state.step)}`;
        p.querySelector('.verdict').textContent=state.step===8?labels[i]:(state.running?'同步迭代中':'等待运行');
      });
      root.querySelectorAll('.eta-btn').forEach((b,i)=>b.setAttribute('aria-pressed',i===state.selected));
      root.querySelector('#run').disabled=state.running;
    }
    function cancel(){clearTimeout(state.timer);state.timer=0;state.running=false}
    function reset(){cancel();state.step=0;histories.forEach(h=>{h.length=1;h[0]=-1.5});render();}
    function advance(){
      if(state.step>=8){reset()}
      state.running=true;
      const tick=()=>{state.step++;rates.forEach((eta,i)=>{const w=histories[i].at(-1);histories[i].push(w-2*eta*w)});render();if(state.step<8&&!Deck.reduced())state.timer=setTimeout(tick,260);else if(state.step<8)tick();else{state.running=false;render();}};tick();
    }
    root.querySelectorAll('.eta-btn').forEach(b=>b.addEventListener('click',()=>{state.selected=+b.dataset.i;render()}));
    root.querySelector('#run').addEventListener('click',advance);root.querySelector('#reset').addEventListener('click',reset);
    render();Deck.init({index:11,total:20});
  })();
  </script>
</body>
</html>
