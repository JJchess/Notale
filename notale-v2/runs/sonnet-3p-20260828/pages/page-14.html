<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{position:relative}
    #feature-widget{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(390px,.72fr);gap:28px;min-height:0}
    #feature-widget .network{position:relative;background:var(--paper);border:var(--rule) solid var(--line);border-radius:var(--r);min-height:0;overflow:hidden}
    #feature-widget svg{display:block;width:100%;height:100%}
    #feature-widget .edge{stroke:var(--line);stroke-width:3;fill:none;transition:stroke .18s,stroke-width .18s}
    #feature-widget .edge.on{stroke:var(--attention);stroke-width:6}
    #feature-widget .n{fill:var(--paper);stroke:var(--model);stroke-width:4}
    #feature-widget .n.input{stroke:var(--data)}
    #feature-widget .n.active{fill:var(--model);stroke:var(--model)}
    #feature-widget .node-label{font:700 22px var(--font-sans);fill:var(--text);text-anchor:middle;dominant-baseline:middle}
    #feature-widget .node-label.inv{fill:#fff}
    #feature-widget .formula{font:600 16px var(--font-num);fill:var(--muted);text-anchor:middle}
    #feature-widget .layer-label{font:700 15px var(--font-sans);fill:var(--muted);text-anchor:middle;letter-spacing:.06em}
    #feature-widget .inspector{display:flex;flex-direction:column;gap:14px;min-height:0}
    #feature-widget .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    #feature-widget .plot{flex:1;min-height:0;background:var(--paper);border:var(--rule) solid var(--line);border-radius:var(--r);position:relative}
    #feature-widget .plot svg{position:absolute;inset:0}
    #feature-widget .grid{stroke:var(--line);stroke-width:1;opacity:.42}
    #feature-widget .axis{stroke:var(--text);stroke-width:2}
    #feature-widget .boundary{stroke:var(--attention);stroke-width:4;fill:none}
    #feature-widget .region-a{fill:var(--model);opacity:.22}
    #feature-widget .region-b{fill:var(--data);opacity:.25}
    #feature-widget .region-both{fill:var(--attention);opacity:.34}
    #feature-widget .plot-label{font:650 15px var(--font-sans);fill:var(--muted)}
    #feature-widget .status{min-height:48px;font-size:var(--fs-sec);color:var(--text);line-height:1.4}
    #feature-widget .status strong{color:var(--attention)}
    .flow .k-process{height:118px;align-items:stretch}
    .flow .k-process .step{position:relative;background:transparent;display:flex;flex-direction:column;justify-content:center}
    .flow .k-process .step b{font-size:var(--fs-body)}
    .flow .k-process .step span{font-size:var(--fs-label);color:var(--muted);margin-top:4px}
    .boundary-note{position:absolute;right:56px;top:30px;color:var(--muted);font-size:var(--fs-label)}
  </style>
</head>
<body data-page="14" data-total="20">
  <div id="stage">
    <header>
      <div class="kicker">表达能力 · 隐藏层</div>
      <h1>隐藏层：先造出中间特征</h1>
      <p class="boundary-note">本页只看能表达什么；权重怎样找到，从第 15 页开始。</p>
    </header>
    <main class="flow min0">
      <section id="feature-widget" class="min0" aria-label="隐藏层组合演示">
        <div class="network min0">
          <svg id="network-svg" viewBox="0 0 940 500" role="img" aria-label="输入经过两个隐藏神经元后组合为输出">
            <g id="edges"></g><g id="nodes"></g>
          </svg>
        </div>
        <aside class="inspector min0">
          <div class="controls" role="group" aria-label="选择查看的中间判断">
            <button class="btn" data-mode="h1" aria-pressed="true">看 h₁</button>
            <button class="btn" data-mode="h2" aria-pressed="false">看 h₂</button>
            <button class="btn" data-mode="both" aria-pressed="false">合起来</button>
            <button class="btn" data-mode="reset">重置</button>
          </div>
          <div class="plot" aria-label="两个隐藏神经元在输入平面上形成的区域">
            <svg id="plot-svg" viewBox="0 0 430 390" role="img"></svg>
          </div>
          <div id="status" class="status" aria-live="polite"></div>
          <p class="note">隐藏：不是人工命名的概念，只是网络内部的数值。</p>
        </aside>
      </section>
      <section class="k-process" aria-label="信号组合过程">
        <div class="step"><b>输入</b><span>x₁、x₂ 提供位置</span></div><div class="arw" aria-hidden="true">→</div>
        <div class="step"><b>两个中间判断</b><span>各自切出一个半平面</span></div><div class="arw" aria-hidden="true">→</div>
        <div class="step"><b>组合输出</b><span>p 使用两者的交叠区域</span></div>
      </section>
    </main>
  </div>
  <script src="assets/base.js"></script>
  <script>
  (()=>{
    const root=document.getElementById('feature-widget');
    const net=root.querySelector('#network-svg'), edges=root.querySelector('#edges'), nodes=root.querySelector('#nodes');
    const plot=root.querySelector('#plot-svg'), status=root.querySelector('#status');
    const specs={
      h1:{w:[1,1],b:-0.2,label:'h₁',formula:'x₁ + x₂ − 0.2 > 0'},
      h2:{w:[1,-1],b:-0.2,label:'h₂',formula:'x₁ − x₂ − 0.2 > 0'}
    };
    let state={mode:'h1'}, destroyed=false;
    const NS='http://www.w3.org/2000/svg';
    const S=(tag,attrs={},text='')=>{const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text)e.textContent=text;return e};
    function drawNetwork(){
      edges.replaceChildren();nodes.replaceChildren();
      const pos={x1:[120,150],x2:[120,350],h1:[480,150],h2:[480,350],p:[820,250]};
      [['x1','h1'],['x1','h2'],['x2','h1'],['x2','h2'],['h1','p'],['h2','p']].forEach(([a,b])=>{
        const active=state.mode==='both'||state.mode===b||state.mode===a;
        edges.append(S('line',{x1:pos[a][0]+42,y1:pos[a][1],x2:pos[b][0]-42,y2:pos[b][1],class:'edge '+(active?'on':'')}));
      });
      [['x1','x₁','input'],['x2','x₂','input'],['h1','h₁',''],['h2','h₂',''],['p','p','']].forEach(([id,label,cl])=>{
        const active=(state.mode===id)||(state.mode==='both'&&['h1','h2','p'].includes(id));
        nodes.append(S('circle',{cx:pos[id][0],cy:pos[id][1],r:42,class:'n '+cl+(active?' active':'')}));
        nodes.append(S('text',{x:pos[id][0],y:pos[id][1],class:'node-label '+(active?'inv':'')},label));
      });
      nodes.append(S('text',{x:120,y:65,class:'layer-label'},'输入'));
      nodes.append(S('text',{x:480,y:65,class:'layer-label'},'隐藏层'));
      nodes.append(S('text',{x:820,y:65,class:'layer-label'},'输出'));
      nodes.append(S('text',{x:480,y:215,class:'formula'},specs.h1.formula));
      nodes.append(S('text',{x:480,y:415,class:'formula'},specs.h2.formula));
    }
    function clip(poly,w,b){const out=[];for(let i=0;i<poly.length;i++){const A=poly[i],B=poly[(i+1)%poly.length],fa=w[0]*A[0]+w[1]*A[1]+b,fb=w[0]*B[0]+w[1]*B[1]+b; if(fa>=0)out.push(A); if((fa>=0)!==(fb>=0)){const t=fa/(fa-fb);out.push([A[0]+t*(B[0]-A[0]),A[1]+t*(B[1]-A[1])]);}}return out}
    const map=([x,y])=>[215+x*150,195-y*150];
    function pts(poly){return poly.map(p=>map(p).join(',')).join(' ')}
    function drawPlot(){
      plot.replaceChildren(); const box=[[-1,-1],[1,-1],[1,1],[-1,1]];
      for(let i=-1;i<=1;i+=.5){let a=map([i,-1]),b=map([i,1]);plot.append(S('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'grid'}));a=map([-1,i]);b=map([1,i]);plot.append(S('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'grid'}));}
      const p1=clip(box,specs.h1.w,specs.h1.b),p2=clip(box,specs.h2.w,specs.h2.b),pb=clip(p1,specs.h2.w,specs.h2.b);
      if(state.mode==='h1') plot.append(S('polygon',{points:pts(p1),class:'region-a'}));
      if(state.mode==='h2') plot.append(S('polygon',{points:pts(p2),class:'region-b'}));
      if(state.mode==='both') plot.append(S('polygon',{points:pts(pb),class:'region-both'}));
      const axisX=map([-1,0]),axisX2=map([1,0]),axisY=map([0,-1]),axisY2=map([0,1]);
      plot.append(S('line',{x1:axisX[0],y1:axisX[1],x2:axisX2[0],y2:axisX2[1],class:'axis'}));plot.append(S('line',{x1:axisY[0],y1:axisY[1],x2:axisY2[0],y2:axisY2[1],class:'axis'}));
      function boundary(sp){const w=sp.w,b=sp.b,arr=[];if(Math.abs(w[1])>.001){for(const x of [-1,1]){const y=-(w[0]*x+b)/w[1];if(y>=-1&&y<=1)arr.push(map([x,y]));}}if(Math.abs(w[0])>.001){for(const y of [-1,1]){const x=-(w[1]*y+b)/w[0];if(x>=-1&&x<=1)arr.push(map([x,y]));}}if(arr.length>=2)plot.append(S('line',{x1:arr[0][0],y1:arr[0][1],x2:arr[1][0],y2:arr[1][1],class:'boundary'}));}
      if(state.mode!=='h2')boundary(specs.h1);if(state.mode!=='h1')boundary(specs.h2);
      plot.append(S('text',{x:374,y:188,class:'plot-label'},'x₁'));plot.append(S('text',{x:224,y:28,class:'plot-label'},'x₂'));
      plot.setAttribute('aria-label',state.mode==='both'?'两个半平面交叠，输出可选出楔形区域':`${specs[state.mode].label} 产生一个半平面`);
    }
    function render(){drawNetwork();drawPlot();root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));
      status.innerHTML=state.mode==='both'?'<strong>组合结果：</strong>两个直线判断的交叠，形成一个神经元做不到的楔形区域。':`<strong>${specs[state.mode].label}：</strong>${specs[state.mode].formula}，先把输入平面切成两半。`;
    }
    root.addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;state={mode:b.dataset.mode==='reset'?'h1':b.dataset.mode};render()});
    render(); Deck.init({index:14,total:20});
    window.addEventListener('pagehide',()=>{destroyed=true},{once:true});
  })();
  </script>
</body>
</html>
