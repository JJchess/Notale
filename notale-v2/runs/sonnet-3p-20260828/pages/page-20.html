<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{overflow:hidden}
    .page-head{flex:0 0 auto}
    .main{flex:1;min-height:0;margin-top:20px;display:grid;grid-template-columns:minmax(0,1.38fr) minmax(430px,.62fr);gap:34px;align-items:stretch}
    .map{min-height:0;display:grid;grid-template-columns:minmax(300px,.72fr) minmax(0,1.28fr);gap:30px;align-items:stretch;padding:22px 0 12px}
    .claim-wrap{display:flex;align-items:center;position:relative;padding-right:26px}
    .claim-wrap::after{content:"";position:absolute;right:0;top:8%;bottom:8%;width:4px;background:var(--model)}
    .claim{font:800 30px/1.34 var(--font-display);color:var(--model)}
    .claim strong{color:var(--attention);font-weight:800}
    .supports{display:grid;grid-template-rows:repeat(5,1fr);gap:0;position:relative;padding-left:30px}
    .supports::before{content:"";position:absolute;left:0;top:10%;bottom:10%;border-left:2px solid var(--line)}
    .support{position:relative;display:flex;align-items:center;border-bottom:2px solid var(--line);padding:10px 8px 10px 18px;font-size:var(--fs-sec);line-height:1.35}
    .support:last-child{border-bottom:0}
    .support::before{content:"";position:absolute;left:-30px;top:50%;width:30px;border-top:2px solid var(--line)}
    .support b{display:inline-block;min-width:112px;color:var(--model);font-size:var(--fs-body)}
    .rail{min-height:0;display:flex;flex-direction:column;justify-content:flex-end}
    .quiz{padding:22px;background:var(--paper);border:2px solid var(--line);border-radius:var(--r);box-shadow:0 5px 14px rgba(23,38,43,.08);gap:10px}
    .quiz h2{margin-bottom:2px}
    .quiz .small{margin-bottom:4px}
    .opt{padding:11px 14px;font-size:var(--fs-sec);cursor:pointer}
    .opt.correct{border:4px double var(--data);padding:9px 12px;text-decoration:none}
    .opt.wrong-pick{border-color:var(--attention);text-decoration:line-through;text-decoration-thickness:2px}
    .quiz-actions{display:flex;align-items:center;gap:14px;margin-top:4px}
    .fb{flex:1;min-height:24px;color:var(--model)}
    .footer-note{flex:0 0 auto;border-top:2px solid var(--line);padding-top:12px;margin-top:12px;font-size:var(--fs-label);line-height:1.4;color:var(--muted)}
  </style>
</head>
<body data-page="20" data-total="20">
  <div id="stage">
    <header class="page-head">
      <div class="kicker">全链回看</div>
      <h1>从一个神经元到反向传播：你已经走完这条链</h1>
    </header>

    <main class="main min0">
      <section class="map k-generalization min0" aria-label="神经网络学习的完整链条">
        <div class="claim-wrap min0">
          <p class="claim">神经网络学习 = 用数据定义误差，用反向传播求每个参数的<strong>调整方向</strong>，再反复更新</p>
        </div>
        <div class="supports min0">
          <div class="support"><span><b>神经元</b>加权和 + 激活</span></div>
          <div class="support"><span><b>隐藏层</b>组合出弯曲边界</span></div>
          <div class="support"><span><b>损失</b>把猜错变成可比较的数</span></div>
          <div class="support"><span><b>梯度下降</b>沿降低损失的方向走</span></div>
          <div class="support"><span><b>验证集</b>检查是否能面对新数据</span></div>
        </div>
      </section>

      <aside class="rail min0">
        <form class="quiz" id="exitQuiz">
          <h2>一分钟出口题</h2>
          <p class="small">如果损失没有下降，你会先检查哪三件事？可多选。</p>
          <button class="opt" type="button" aria-pressed="false" data-correct="true">数据与目标是否对应</button>
          <button class="opt" type="button" aria-pressed="false" data-correct="true">学习率是否合适</button>
          <button class="opt" type="button" aria-pressed="false" data-correct="true">前向与反向公式是否连对</button>
          <button class="opt" type="button" aria-pressed="false" data-correct="false">把网络名字换得更响亮</button>
          <div class="quiz-actions">
            <button class="btn" type="submit">提交选择</button>
            <div class="fb" id="feedback" role="status" aria-live="polite"></div>
          </div>
        </form>
      </aside>
    </main>

    <footer class="footer-note">现实中的大模型规模更大、结构更复杂，但“前向—损失—反向—更新”仍是核心训练循环</footer>
  </div>
  <script src="assets/base.js"></script>
  <script>
    Deck.init({index:20,total:20});
    const quiz=document.getElementById('exitQuiz');
    const options=[...quiz.querySelectorAll('.opt')];
    options.forEach(option=>option.addEventListener('click',()=>{
      const selected=option.getAttribute('aria-pressed')!=='true';
      option.setAttribute('aria-pressed',String(selected));
      option.classList.toggle('selected',selected);
      option.classList.remove('correct','wrong-pick');
      document.getElementById('feedback').textContent='';
    }));
    quiz.addEventListener('submit',event=>{
      event.preventDefault();
      options.forEach(option=>{
        option.classList.remove('selected');
        if(option.dataset.correct==='true') option.classList.add('correct');
        else if(option.getAttribute('aria-pressed')==='true') option.classList.add('wrong-pick');
      });
      document.getElementById('feedback').textContent='先检查数据、步长、计算链';
    });
  </script>
</body>
</html>
