<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage{ display:flex; flex-direction:column; }
    .p01-focus{
      flex:1; min-height:0; display:flex; flex-direction:column;
      align-items:center; justify-content:flex-start;
    }
    .p01-kicker{
      font:600 15px/1.4 var(--font-sans);
      letter-spacing:.14em;
      color:var(--muted);
      margin-bottom:16px;
      opacity:0; animation:p01-rise .4s ease-out .02s forwards;
    }
    .p01-claim{
      margin:0; text-align:center;
      font:700 48px/1.44 var(--font-serif);
      color:var(--text);
      max-width:1320px;
      opacity:0; animation:p01-rise .4s ease-out .1s forwards;
    }
    .p01-trunk-wrap{
      flex:1; min-height:0; width:100%;
      display:flex; align-items:center; justify-content:center;
      margin-top:14px;
    }
    .p01-trunk-svg{ width:1300px; height:auto; max-height:100%; }
    .p01-dot{
      fill:var(--text); opacity:0;
      animation:p01-pop .25s ease-out forwards;
    }
    .p01-dot.o1{ animation-delay:.66s; }
    .p01-dot.o2{ animation-delay:.72s; }
    .p01-dot.o3{ animation-delay:.78s; }
    .p01-caps{
      display:flex; justify-content:center; gap:170px;
      width:100%; max-width:1180px; margin:2px auto 0;
    }
    .p01-cap{
      text-align:center; font:400 16px/1.5 var(--font-sans);
      color:var(--muted); letter-spacing:.02em;
      opacity:0; animation:p01-rise .3s ease-out forwards;
    }
    .p01-cap.c1{ animation-delay:.68s; }
    .p01-cap.c2{ animation-delay:.73s; }
    .p01-cap.c3{ animation-delay:.78s; }
    .p01-stem{
      stroke:var(--line); stroke-width:2.5; fill:none;
      stroke-dasharray:340; stroke-dashoffset:340;
      animation:p01-draw .35s ease-out .18s forwards;
    }
    .p01-drop{
      stroke:var(--line); stroke-width:2.5; fill:none;
      stroke-dasharray:70; stroke-dashoffset:70;
      animation:p01-draw .22s ease-out forwards;
    }
    .p01-drop.d1{ animation-delay:.32s; }
    .p01-drop.d2{ animation-delay:.36s; }
    .p01-drop.d3{ animation-delay:.4s; }
    .p01-arrow{
      stroke:var(--text); stroke-width:5; fill:none;
      stroke-linecap:round; stroke-linejoin:round;
      opacity:0; transform:translateY(6px);
      animation:p01-pop .3s ease-out forwards;
    }
    .p01-arrow.a1{ animation-delay:.48s; }
    .p01-arrow.a2{ animation-delay:.54s; }
    .p01-arrow.a3{ animation-delay:.6s; }
    .p01-lead{
      margin:14px 0 0; text-align:center;
      font:500 20px/1.55 var(--font-sans);
      color:var(--text);
      max-width:1040px;
      opacity:0; animation:p01-rise .4s ease-out .85s forwards;
    }
    .p01-next{
      margin:14px 0 0; text-align:center;
      font:400 16px/1.5 var(--font-sans);
      color:var(--muted);
      opacity:0; animation:p01-rise .4s ease-out .98s forwards;
    }
    .p01-next b{
      color:var(--muted); font-weight:600;
      border:1px solid var(--line); border-radius:5px;
      padding:2px 8px; margin-right:8px; font-size:14px;
      letter-spacing:.02em;
    }
    @keyframes p01-rise{
      from{ opacity:0; transform:translateY(10px); }
      to{ opacity:1; transform:translateY(0); }
    }
    @keyframes p01-draw{ to{ stroke-dashoffset:0; } }
    @keyframes p01-pop{ to{ opacity:1; transform:translateY(0); } }
    @media (prefers-reduced-motion:reduce){
      .p01-kicker,.p01-claim,.p01-lead,.p01-next,.p01-arrow,.p01-cap{
        animation:none !important; opacity:1 !important; transform:none !important;
      }
      .p01-stem,.p01-drop{ animation:none !important; stroke-dashoffset:0 !important; }
    }
  </style>
</head>
<body data-page="1" data-total="18">
  <div id="stage">
    <div class="p01-focus">
      <div class="p01-kicker">HOW&#8288;-&#8288;DOES&#8288;-&#8288;IT&#8288;-&#8288;LEARN</div>
      <h1 class="p01-claim">「学会」不是玄学，是可以拆开看的数学动作</h1>

      <div class="p01-trunk-wrap">
        <svg class="p01-trunk-svg" viewBox="0 0 1180 360" role="img" aria-labelledby="p01-svg-desc">
          <title id="p01-svg-desc">一条主干向下分出三支，每一支末端各有一个指向右下方的箭头并落在一个圆点上，笔触一致，暗示后面要拆开的三个动作还未点名</title>
          <path class="p01-stem" d="M590,4 L590,64"/>
          <path class="p01-stem" d="M195,64 L985,64"/>
          <path class="p01-drop d1" d="M195,64 L195,120"/>
          <path class="p01-drop d2" d="M590,64 L590,120"/>
          <path class="p01-drop d3" d="M985,64 L985,120"/>

          <g class="p01-arrow a1">
            <path d="M150,132 L245,235"/>
            <path d="M245,235 L204,229 M245,235 L232,195"/>
          </g>
          <g class="p01-arrow a2">
            <path d="M545,132 L640,235"/>
            <path d="M640,235 L599,229 M640,235 L627,195"/>
          </g>
          <g class="p01-arrow a3">
            <path d="M940,132 L1035,235"/>
            <path d="M1035,235 L994,229 M1035,235 L1022,195"/>
          </g>

          <circle class="p01-dot o1" cx="245" cy="235" r="7"/>
          <circle class="p01-dot o2" cx="640" cy="235" r="7"/>
          <circle class="p01-dot o3" cx="1035" cy="235" r="7"/>
        </svg>
      </div>
      <div class="p01-caps">
        <p class="p01-cap c1">动作一</p>
        <p class="p01-cap c2">动作二</p>
        <p class="p01-cap c3">动作三</p>
      </div>

      <p class="p01-lead">接下来 30 分钟，我们把「学习」拆成三步算术，一步一步亲手算给你看</p>
      <p class="p01-next"><b>下一问</b>一个神经元长什么样？它怎么把输入变成一个数字？</p>
    </div>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
</body>
</html>
