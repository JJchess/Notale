<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/lib/echarts.min.js"></script>
</head>
<body data-page="03" data-total="18">
<div id="stage">

  <div class="head-stack" style="margin-bottom:18px;">
    <span class="kicker">SAME INPUT, DIFFERENT SHAPE</span>
    <h1>同一个输入，换一种激活函数，输出曲线完全变形</h1>
  </div>

  <div class="split-lr" style="gap:36px;">

    <div class="panel min0" style="flex:0 0 420px;display:flex;flex-direction:column;gap:16px;">
      <div>
        <label for="zSlider" class="small" style="display:block;margin-bottom:8px;">输入 z（拖动滑块，范围 -4 到 4）</label>
        <div class="ctl-row">
          <input type="range" id="zSlider" min="-4" max="4" step="0.1" value="0"
                 aria-valuemin="-4" aria-valuemax="4" aria-valuenow="0" aria-valuetext="z 等于 0.0">
          <span class="ctl-val" id="zVal">0.0</span>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;align-items:baseline;justify-content:space-between;">
          <span class="tag">Sigmoid</span>
          <span class="big sm" id="sigVal">0.500</span>
        </div>
        <div style="display:flex;align-items:baseline;justify-content:space-between;">
          <span class="tag">Tanh</span>
          <span class="big sm" id="tanhVal">0.000</span>
        </div>
        <div style="display:flex;align-items:baseline;justify-content:space-between;">
          <span class="tag">ReLU</span>
          <span class="big sm" id="reluVal">0.000</span>
        </div>
      </div>

      <p class="small" style="margin:0;">三个答案的跨度（最大 − 最小）：<span class="num accent" id="spreadVal">0.500</span></p>

      <ul class="small" style="margin:0;padding-left:18px;line-height:1.5;">
        <li>Sigmoid：压缩在 0~1 之间，两端趋平</li>
        <li>Tanh：压缩在 -1~1 之间，关于原点对称</li>
        <li>ReLU：负数全部归零，正数原样通过，呈折线</li>
      </ul>

    </div>

    <div class="min0" style="flex:1;display:flex;flex-direction:column;min-height:0;">
      <div class="legend" style="flex:0 0 auto;margin-bottom:10px;">
        <span class="li"><span class="sw line ink"></span>曲线本体（同一函数）</span>
        <span class="li"><span class="sw accent"></span>当前输入 z 对应的点</span>
      </div>
      <div class="cvbox" style="flex:1;min-height:0;">
        <div id="chart" class="cv-fill"></div>
      </div>
    </div>

  </div>

  <div style="flex:0 0 auto;margin-top:18px;display:flex;flex-direction:column;gap:6px;">
    <p class="lead" style="margin:0;">激活函数决定了神经元把「加权求和」这个数拧成什么形状的输出。</p>
    <p class="small" style="margin:0;">这个数字算出来了，但它离目标差多少？</p>
  </div>

</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(function () {
  var P = Lec.P;
  var INK = '#2b4c7e', ACCENT = '#d1495b', LINE = '#c9c2b2', GRIDLINE = '#ddd6c5', MUTED = '#6b6558';

  var sigData = [], tanData = [], relData = [];
  for (var i = -40; i <= 40; i++) {
    var z = i / 10;
    sigData.push([z, P.sigmoid(z)]);
    tanData.push([z, P.tanh(z)]);
    relData.push([z, P.relu(z)]);
  }

  var chartDom = document.getElementById('chart');
  var chart = echarts.init(chartDom, null, { renderer: 'svg' });

  function markLineOpt(z) {
    return {
      silent: true, animation: false, symbol: 'none',
      lineStyle: { color: LINE, type: 'dashed', width: 1.5 },
      data: [{ xAxis: z }]
    };
  }
  function markPointOpt(z, val) {
    return {
      silent: true, animation: false, symbol: 'circle', symbolSize: 12,
      itemStyle: { color: ACCENT, borderColor: '#fffdf7', borderWidth: 2 },
      label: { show: false },
      data: [{ coord: [z, val] }]
    };
  }

  function axisNameStyle() { return { fontSize: 14, color: MUTED }; }
  function axisLabelStyle() { return { fontSize: 12, color: MUTED }; }

  chart.setOption({
    animation: false,
    grid: [
      { left: 80, right: 26, top: '2%', height: '26%' },
      { left: 80, right: 26, top: '37%', height: '26%' },
      { left: 80, right: 26, top: '72%', height: '20%' }
    ],
    xAxis: [
      { gridIndex: 0, type: 'value', min: -4, max: 4, axisLabel: { show: false }, splitLine: { show: false }, axisTick: { show: false }, axisLine: { lineStyle: { color: LINE } } },
      { gridIndex: 1, type: 'value', min: -4, max: 4, axisLabel: { show: false }, splitLine: { show: false }, axisTick: { show: false }, axisLine: { lineStyle: { color: LINE } } },
      { gridIndex: 2, type: 'value', min: -4, max: 4, name: '输入 z', nameLocation: 'middle', nameGap: 26, nameTextStyle: axisNameStyle(), axisLabel: axisLabelStyle(), splitLine: { show: false }, axisLine: { lineStyle: { color: LINE } } }
    ],
    yAxis: [
      { gridIndex: 0, type: 'value', min: 0, max: 1, interval: 1, name: 'sigmoid(z)', nameTextStyle: axisNameStyle(), axisLabel: axisLabelStyle(), splitLine: { lineStyle: { color: GRIDLINE } } },
      { gridIndex: 1, type: 'value', min: -1, max: 1, interval: 1, name: 'tanh(z)', nameTextStyle: axisNameStyle(), axisLabel: axisLabelStyle(), splitLine: { lineStyle: { color: GRIDLINE } } },
      { gridIndex: 2, type: 'value', min: 0, max: 4, interval: 2, name: 'relu(z)', nameTextStyle: axisNameStyle(), axisLabel: axisLabelStyle(), splitLine: { lineStyle: { color: GRIDLINE } } }
    ],
    series: [
      { id: 'sig', name: 'Sigmoid', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: sigData, showSymbol: false, lineStyle: { color: INK, width: 2.5 }, markLine: markLineOpt(0), markPoint: markPointOpt(0, 0.5) },
      { id: 'tan', name: 'Tanh', type: 'line', xAxisIndex: 1, yAxisIndex: 1, data: tanData, showSymbol: false, lineStyle: { color: INK, width: 2.5 }, markLine: markLineOpt(0), markPoint: markPointOpt(0, 0) },
      { id: 'rel', name: 'ReLU', type: 'line', xAxisIndex: 2, yAxisIndex: 2, data: relData, showSymbol: false, lineStyle: { color: INK, width: 2.5 }, markLine: markLineOpt(0), markPoint: markPointOpt(0, 0) }
    ]
  });

  var slider = document.getElementById('zSlider');
  var zValEl = document.getElementById('zVal');
  var sigEl = document.getElementById('sigVal');
  var tanEl = document.getElementById('tanhVal');
  var relEl = document.getElementById('reluVal');
  var spreadEl = document.getElementById('spreadVal');

  function update(z) {
    var s = P.sigmoid(z), t = P.tanh(z), r = P.relu(z);
    zValEl.textContent = z.toFixed(1);
    slider.setAttribute('aria-valuenow', z.toFixed(1));
    slider.setAttribute('aria-valuetext', 'z 等于 ' + z.toFixed(1));
    sigEl.textContent = s.toFixed(3);
    tanEl.textContent = t.toFixed(3);
    relEl.textContent = r.toFixed(3);
    var spread = Math.max(s, t, r) - Math.min(s, t, r);
    spreadEl.textContent = spread.toFixed(3);
    chart.setOption({
      series: [
        { id: 'sig', markLine: markLineOpt(z), markPoint: markPointOpt(z, s) },
        { id: 'tan', markLine: markLineOpt(z), markPoint: markPointOpt(z, t) },
        { id: 'rel', markLine: markLineOpt(z), markPoint: markPointOpt(z, r) }
      ]
    });
  }
  update(0);

  slider.addEventListener('input', function () { update(parseFloat(slider.value)); });

  var ro = new ResizeObserver(function () { chart.resize(); });
  ro.observe(chartDom);

  Deck.init({ index: 3, total: 18 });
})();
</script>
</body>
</html>
