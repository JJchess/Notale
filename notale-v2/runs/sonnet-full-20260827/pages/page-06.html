<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p6{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;width:100%;height:100%;}

  .p6-head{flex:0 0 auto;text-align:center;padding-top:0;}
  .p6-head .kicker{
    font:700 17px/1 var(--font-sans);letter-spacing:.18em;color:var(--muted);
    text-transform:uppercase;margin:0 0 6px;
  }
  .p6-head h1{
    margin:0;font:700 37px/1.3 var(--font-serif);color:var(--text);
  }

  .p6-main{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:2px 0;}

  .p6-gen{display:flex;flex-direction:column;align-items:center;width:100%;height:100%;justify-content:space-evenly;}

  .p6-claim{
    font:700 44px/1.4 var(--font-sans);color:var(--ink);
    background:var(--paper);border:2.5px solid var(--line);border-radius:16px;
    padding:42px 0;letter-spacing:.01em;width:1488px;box-sizing:border-box;
    text-align:center;
  }
  .p6-claim .arw{color:var(--muted);margin:0 26px;font-weight:400;}
  .p6-claim .lbl{
    display:block;font:700 17px/1 var(--font-sans);color:var(--muted);
    letter-spacing:.12em;margin-bottom:14px;text-transform:uppercase;
  }

  .p6-trunk{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:0;}
  .p6-stem{width:3px;height:40px;background:var(--line);}
  .p6-bar{height:3px;width:1488px;background:var(--line);}

  .p6-supports{
    display:flex;flex-direction:row;align-items:stretch;justify-content:center;
    gap:0;width:1488px;margin-top:0;
  }

  .p6-support{
    position:relative;background:var(--paper);border:2.5px solid var(--line);
    border-radius:18px;padding:36px 32px 32px;display:flex;flex-direction:column;
    align-items:center;text-align:center;gap:22px;width:484px;height:340px;flex:0 0 484px;
    box-sizing:border-box;justify-content:center;
  }
  .p6-support::before{
    content:"";position:absolute;left:50%;top:-40px;width:3px;height:40px;
    background:var(--line);transform:translateX(-1.5px);
  }
  .p6-support .step-name{font:700 52px/1.2 var(--font-sans);color:var(--ink);position:relative;padding-bottom:12px;}
  .p6-support .step-name::after{
    content:"";position:absolute;left:50%;bottom:0;width:56px;height:3px;
    background:var(--accent);transform:translateX(-28px);
  }
  .p6-support .step-sub{font:400 29px/1.65 var(--font-sans);color:var(--text);max-width:430px;}
  .p6-support .tag{
    margin-top:16px;font-size:20px;padding:10px 22px;border:1.5px solid var(--ink);
    border-radius:20px;color:var(--ink);
  }

  .p6-arrowcol{display:flex;align-items:center;justify-content:center;flex:0 0 70px;width:70px;}
  .p6-arrowcol .glyph{font:400 44px/1 var(--font-sans);color:var(--muted);}

  .p6-loopwrap{position:relative;width:1488px;height:96px;margin-top:16px;}
  .p6-loopwrap svg{position:absolute;inset:0;width:100%;height:100%;}
  .p6-loop-label{
    position:absolute;left:0;right:0;bottom:2px;text-align:center;
    font:400 19px/1.3 var(--font-sans);color:var(--muted);
  }

  .p6-foot{flex:0 0 auto;text-align:center;padding-top:10px;padding-bottom:8px;border-top:1px solid var(--line);}
  .p6-foot .closing{
    font:700 26px/1.4 var(--font-sans);color:var(--text);margin:12px auto 8px;max-width:1260px;
  }
  .p6-foot .closing b{color:var(--ink);}
  .p6-foot .next{
    font:400 20px/1.4 var(--font-sans);color:var(--muted);margin:0;
  }

  /* entrance choreography */
  .reveal{opacity:0;transform:translateY(10px);animation:p6in .45s cubic-bezier(.2,.7,.3,1) forwards;}
  @keyframes p6in{to{opacity:1;transform:translateY(0);}}
  .p6-head .kicker{animation-delay:.02s;}
  .p6-head h1{animation-delay:.08s;}
  .p6-claim{animation-delay:.2s;}
  .p6-trunk-line{opacity:0;animation:p6fade .35s ease forwards;animation-delay:.32s;}
  @keyframes p6fade{to{opacity:1;}}
  .p6-support:nth-child(1){animation-delay:.4s;}
  .p6-support:nth-child(3){animation-delay:.5s;}
  .p6-support:nth-child(5){animation-delay:.6s;}
  .p6-arrowcol{opacity:0;animation:p6fade .3s ease forwards;}
  .p6-arrowcol:nth-child(2){animation-delay:.46s;}
  .p6-arrowcol:nth-child(4){animation-delay:.56s;}
  .p6-loopwrap{opacity:0;animation:p6fade .4s ease forwards;animation-delay:.72s;}
  .p6-foot .closing{animation-delay:.86s;}
  .p6-foot .next{animation-delay:.96s;}

  @media (prefers-reduced-motion: reduce){
    .reveal,.p6-trunk-line,.p6-arrowcol,.p6-loopwrap,.p6-foot .closing,.p6-foot .next{
      animation:none !important;opacity:1 !important;transform:none !important;
    }
  }
</style>
</head>
<body data-page="06" data-total="18">
  <div id="stage">
    <div class="p6">
      <div class="p6-head">
        <div class="kicker reveal">THE LOOP</div>
        <h1 class="reveal">算损失、算方向、挪一步——这就是「学习」</h1>
      </div>

      <div class="p6-main">
        <div class="p6-gen">
          <div class="p6-claim reveal"><span class="lbl">三步循环</span>算损失<span class="arw">→</span>算方向<span class="arw">→</span>挪一步</div>
          <div class="p6-trunk">
            <div class="p6-stem p6-trunk-line"></div>
            <div class="p6-bar p6-trunk-line"></div>
            <div class="p6-supports">
              <div class="p6-support reveal">
                <div class="step-name">算损失</div>
                <div class="step-sub">猜的答案和正确答案差多少</div>
                <span class="tag">来自 p04</span>
              </div>
              <div class="p6-arrowcol"><span class="glyph">→</span></div>
              <div class="p6-support reveal">
                <div class="step-name">算方向</div>
                <div class="step-sub">每个数往哪边调,损失才会变小</div>
                <span class="tag">来自 p05</span>
              </div>
              <div class="p6-arrowcol"><span class="glyph">→</span></div>
              <div class="p6-support reveal">
                <div class="step-name">挪一步</div>
                <div class="step-sub">权重和偏置各按方向挪一点</div>
                <span class="tag">来自 p05</span>
              </div>
            </div>
            <div class="p6-loopwrap">
              <svg viewBox="0 0 1488 96" preserveAspectRatio="none" aria-hidden="true">
                <defs>
                  <marker id="loopArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
                    <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path>
                  </marker>
                </defs>
                <path d="M 1260 6 C 1260 62, 228 62, 228 6" fill="none" stroke="var(--accent)" stroke-width="4.5" marker-end="url(#loopArrow)"></path>
              </svg>
              <div class="p6-loop-label">重复,直到猜得够准</div>
            </div>
          </div>
        </div>
      </div>

      <div class="p6-foot">
        <p class="closing reveal">一个神经元学会 AND,靠的就是这三步反复循环,<b>没有第四个动作</b></p>
        <p class="next reveal">下一问:那步子该走多大?走太快会怎样?</p>
      </div>
    </div>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
</body>
</html>
