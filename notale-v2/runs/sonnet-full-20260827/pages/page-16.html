<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p16{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;}

  .p16 .head{width:100%;text-align:center;flex:0 0 auto;padding-top:0;}
  .p16 .kicker{font-size:var(--fs-label);letter-spacing:.18em;color:var(--muted);
    font-family:var(--font-sans);text-transform:uppercase;margin:0 0 4px;}
  .p16 .claim{font-family:var(--font-serif);font-size:30px;font-weight:700;
    color:var(--text);text-align:center;line-height:1.28;max-width:1080px;margin:0 auto;}

  .p16 .body{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:0 8px;}

  .p16 .trunk{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;}
  .p16 .stem{width:2px;height:12px;background:var(--line);flex:0 0 auto;}
  .p16 .bar{width:1488px;max-width:100%;height:2px;background:var(--line);flex:0 0 auto;}

  .p16 .supports{display:flex;gap:20px;margin-top:0;align-items:stretch;flex:1;
    min-height:0;width:1488px;max-width:100%;padding-top:10px;}
  .p16 .support{flex:1;min-width:0;position:relative;text-align:center;
    display:flex;flex-direction:column;padding:14px 24px;margin-top:10px;
    background:var(--paper);border:1px solid var(--line);border-radius:16px;}
  .p16 .support::before{content:'';position:absolute;top:-10px;left:50%;width:2px;height:10px;
    background:var(--line);transform:translateX(-50%);}
  .p16 .s-label{font-size:var(--fs-label);color:var(--muted);font-weight:700;
    letter-spacing:.06em;margin-bottom:6px;text-transform:uppercase;}
  .p16 .s-body{font-size:var(--fs-sec);color:var(--text);line-height:1.3;margin-bottom:10px;}

  .p16 .loop{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;
    align-items:stretch;justify-content:stretch;gap:8px;}
  .p16 .loop-row{display:flex;align-items:stretch;justify-content:center;gap:0;width:100%;flex:1;min-height:0;}
  .p16 .loop-node{flex:1;background:var(--bg);
    border:2px solid var(--ink);border-radius:12px;padding:6px 8px;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .p16 .loop-node .mt{font-size:14px;color:var(--muted);letter-spacing:.04em;margin-bottom:6px;}
  .p16 .loop-node .mv{font-size:26px;color:var(--ink);font-weight:700;}
  .p16 .loop-arrow{font-size:24px;color:var(--muted);flex:0 0 auto;padding:0 8px;
    align-self:center;display:inline-block;}
  .p16 .loop-arrow.down{transform:rotate(90deg);margin:2px 0;align-self:center;}

  .p16 .repeat{position:relative;flex:1;min-height:0;
    display:flex;flex-direction:column;align-items:stretch;justify-content:stretch;gap:8px;}
  .p16 .rep-row{display:flex;align-items:stretch;justify-content:center;gap:10px;width:100%;flex:1;min-height:0;}
  .p16 .rep-node{flex:1;border-radius:12px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted);
    background:var(--bg);font-weight:600;}
  .p16 .rep-arrow{color:var(--muted);font-size:22px;flex:0 0 auto;align-self:center;}
  .p16 .rep-arrow.down{align-self:center;}
  .p16 .rep-node.final{border-color:var(--accent);border-width:2px;color:var(--accent);font-weight:700;font-size:20px;}
  .p16 .rep-count{font-size:var(--fs-label);color:var(--muted);}

  .p16 .foot{width:100%;max-width:1488px;flex:0 0 auto;padding-top:8px;
    border-top:1px solid var(--line);display:flex;flex-direction:column;
    align-items:center;gap:4px;margin-bottom:0;}
  .p16 .closing{font-size:var(--fs-lead);color:var(--text);text-align:center;
    line-height:1.5;font-weight:600;margin:0;}
  .p16 .next-q{font-size:var(--fs-sec);color:var(--muted);text-align:center;margin:0;}

  @keyframes p16fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .p16 .head,.p16 .trunk,.p16 .foot{animation:p16fade .6s ease-out both;}
  .p16 .head{animation-delay:.02s;}
  .p16 .trunk{animation-delay:.2s;}
  .p16 .foot{animation-delay:.38s;}
  @media (prefers-reduced-motion: reduce){
    .p16 .head,.p16 .trunk,.p16 .foot{animation:none;opacity:1;transform:none;}
  }
</style>
</head>
<body data-page="16" data-total="18">
  <div id="stage">
    <div class="p16">
      <div class="head">
        <p class="kicker">LIVE DEMO AHEAD</p>
        <h1 class="claim">现在，看一个真实的小网络<br>从零学到分开两类点</h1>
      </div>

      <div class="body">
        <div class="trunk">
          <div class="stem"></div>
          <div class="bar"></div>
          <div class="supports">
            <div class="support prev">
              <div class="s-label">已经算过一遍</div>
              <div class="s-body">误差、方向、步子——三步循环</div>
              <div class="loop">
                <div class="loop-row">
                  <div class="loop-node"><div class="mt">算错多少</div><div class="mv">误差</div></div>
                  <div class="loop-arrow">→</div>
                  <div class="loop-node"><div class="mt">算往哪改</div><div class="mv">方向</div></div>
                </div>
                <div class="loop-arrow down">→</div>
                <div class="loop-row">
                  <div class="loop-node"><div class="mt">回到误差</div><div class="mv">再算</div></div>
                  <div class="loop-arrow" style="transform:scaleX(-1)">→</div>
                  <div class="loop-node"><div class="mt">挪一小步</div><div class="mv">步子</div></div>
                </div>
              </div>
            </div>
            <div class="support next">
              <div class="s-label">接下来只变一件事</div>
              <div class="s-body">同样的三步，重复几百次</div>
              <div class="repeat">
                <div class="rep-row">
                  <div class="rep-node">第 1 次</div>
                  <div class="rep-arrow">→</div>
                  <div class="rep-node">第 10 次</div>
                  <div class="rep-arrow">→</div>
                  <div class="rep-node">第 100 次</div>
                </div>
                <div class="rep-arrow down">↓</div>
                <div class="rep-row">
                  <div class="rep-node">乱猜</div>
                  <div class="rep-arrow">→</div>
                  <div class="rep-node">接近</div>
                  <div class="rep-arrow">→</div>
                  <div class="rep-node final">分开</div>
                </div>
                <div class="rep-count">动作不变，次数变多</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="foot">
        <p class="closing">接下来的每一步，都是「算错多少、算往哪改、挪一小步」——没有新动作</p>
        <p class="next-q">这套动作重复几百次，乱猜会变成什么样子？</p>
      </div>
    </div>
  </div>
  <script src="assets/base.js"></script>
  <script src="assets/lec.js"></script>
  <script>
    Deck.init({ index: 16, total: 18 });
  </script>
</body>
</html>
