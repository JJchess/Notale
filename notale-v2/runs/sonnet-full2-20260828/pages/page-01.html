<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .layout-cover .motif {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 8px;
  }
  .layout-cover .motif svg { display: block; }
  .layout-cover .legend { margin-top: 4px; }
</style>
</head>
<body data-page="01" data-total="20">
<div id="stage">
  <div class="layout-cover">
    <span class="kicker">30 分钟走线图</span>
    <h1>神经网络是怎么学会的：从一个神经元到反向传播</h1>
    <p class="lead">从一个加权求和的神经元开始，一路走到让整张网络自己纠错的反向传播。</p>

    <div class="motif">
      <svg width="420" height="120" viewBox="0 0 420 120" aria-hidden="true">
        <!-- forward: solid blue, left to center -->
        <path d="M 20 40 C 120 40, 160 60, 210 60" fill="none" stroke="#2457A6" stroke-width="3" stroke-linecap="round"/>
        <!-- backward: dashed red, center to left (drawn right side to visually mirror) -->
        <path d="M 210 60 C 260 60, 300 80, 400 80" fill="none" stroke="#B23A2E" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>
        <circle cx="210" cy="60" r="7" fill="#1B8A82"/>
      </svg>
    </div>
    <div class="legend">
      <span class="li"><span class="sw"></span>预测</span>
      <span class="li"><span class="sw line"></span>纠错</span>
    </div>
  </div>
</div>
<script src="assets/base.js"></script>
<script>Deck.init({ index: 1, total: 20 });</script>
</body>
</html>
