<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p02-head { flex: 0 0 auto; }
  .p02-body { flex: 1; min-height: 0; }

  .p02-col-a { display: flex; flex-direction: column; gap: 16px; }
  .p02-inputs { display: flex; gap: 24px; }
  .p02-inputs .fixed {
    flex: 1; background: var(--paper); border: var(--hair) solid var(--rule);
    border-radius: var(--radius); padding: 10px 14px; text-align: center;
  }
  .p02-inputs .fixed .fx-label { font-family: var(--font-mono); font-size: var(--fs-label); color: var(--muted); }
  .p02-inputs .fixed .fx-val { font-family: var(--font-mono); font-size: 22px; color: var(--text); font-weight: 600; }

  .p02-readouts { display: flex; gap: 24px; }
  .p02-readouts .ro { flex: 1; text-align: center; }
  .p02-readouts .ro .ro-label { font-family: var(--font-mono); font-size: var(--fs-label); color: var(--muted); margin-bottom: 4px; }

  .p02-svgwrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .p02-svgwrap svg { width: 100%; height: 100%; }

  .diag-node circle { fill: var(--paper); stroke: var(--rule-strong); stroke-width: 1.5; }
  .diag-node.op circle { stroke: var(--forward); }
  .diag-node text.nlabel { font-family: var(--font-mono); font-size: 15px; fill: var(--muted); text-anchor: middle; }
  .diag-node text.nval { font-family: var(--font-mono); font-size: 19px; fill: var(--text); font-weight: 600; text-anchor: middle; }
  .diag-wire { stroke: var(--forward); stroke-width: 2.5; fill: none; }
  .diag-wire-label { font-family: var(--font-mono); font-size: 14px; fill: var(--forward); text-anchor: middle; }
</style>
</head>
<body data-page="02" data-total="20">
<div id="stage">

  <div class="p02-head">
    <span class="kicker">神经元 · 前向计算</span>
    <h1>一个神经元在算什么</h1>
  </div>

  <div class="p02-body layout-split">

    <div class="col-a min0 p02-col-a">
      <p class="lead">一次加权求和，加一次非线性变换 —— 没有更多。</p>

      <div class="p02-inputs">
        <div class="fixed">
          <div class="fx-label">输入 x₁（固定）</div>
          <div class="fx-val">0.80</div>
        </div>
        <div class="fixed">
          <div class="fx-label">输入 x₂（固定）</div>
          <div class="fx-val">−0.30</div>
        </div>
      </div>

      <div class="panel">
        <div class="ctl">
          <div class="ctl-label"><span>权重 w₁</span><span class="num" id="w1out">0.60</span></div>
          <input type="range" class="dial" id="w1" min="-2" max="2" step="0.01" value="0.6">
        </div>
        <div class="ctl" style="margin-top:14px;">
          <div class="ctl-label"><span>权重 w₂</span><span class="num" id="w2out">0.90</span></div>
          <input type="range" class="dial" id="w2" min="-2" max="2" step="0.01" value="0.9">
        </div>
        <div class="ctl" style="margin-top:14px;">
          <div class="ctl-label"><span>偏置 b</span><span class="num" id="bout">0.10</span></div>
          <input type="range" class="dial" id="b" min="-2" max="2" step="0.01" value="0.1">
        </div>
      </div>

      <div class="p02-readouts">
        <div class="ro">
          <div class="ro-label">z = w₁x₁ + w₂x₂ + b</div>
          <div class="big" id="zbig">0.31</div>
        </div>
        <div class="ro">
          <div class="ro-label">y = sigmoid(z)</div>
          <div class="big att" id="ybig">0.577</div>
        </div>
      </div>

      <div class="btns">
        <button class="btn" id="resetBtn">复位到初始值</button>
      </div>
      <div class="hint">拖动任意滑块，右侧走线上的数值同步刷新</div>
    </div>

    <div class="col-b min0">
      <div class="p02-svgwrap">
        <svg viewBox="0 0 1000 560" role="img" aria-label="神经元前向计算走线：输入乘权重、求和、加偏置、经过 sigmoid 得到输出">
          <path class="diag-wire" d="M 106 150 C 220 150, 260 250, 344 268" />
          <path class="diag-wire" d="M 106 410 C 220 410, 260 300, 344 292" />
          <path class="diag-wire" d="M 416 280 L 524 280" />
          <path class="diag-wire" d="M 596 280 L 704 280" />
          <path class="diag-wire" d="M 776 280 L 884 280" />

          <text class="diag-wire-label" id="w1wire" x="230" y="185">×w₁ = 0.48</text>
          <text class="diag-wire-label" id="w2wire" x="230" y="380">×w₂ = −0.27</text>
          <text class="diag-wire-label" id="bwire" x="470" y="260">+ b</text>

          <g class="diag-node" transform="translate(70,150)">
            <circle r="40"/>
            <text class="nlabel" y="-8">x₁</text>
            <text class="nval" y="16">0.80</text>
          </g>
          <g class="diag-node" transform="translate(70,410)">
            <circle r="40"/>
            <text class="nlabel" y="-8">x₂</text>
            <text class="nval" y="16">−0.30</text>
          </g>

          <g class="diag-node op" transform="translate(380,280)">
            <circle r="42"/>
            <text class="nlabel" y="-10">求和 Σ</text>
            <text class="nval" id="sumval" y="18">0.21</text>
          </g>

          <g class="diag-node op" transform="translate(560,280)">
            <circle r="42"/>
            <text class="nlabel" y="-10">z</text>
            <text class="nval" id="zval" y="18">0.31</text>
          </g>

          <g class="diag-node op" transform="translate(740,280)">
            <circle r="42"/>
            <text class="nlabel" y="-10">sigmoid</text>
            <text class="nval" id="sigval" y="18">0.577</text>
          </g>

          <g class="diag-node" transform="translate(920,280)">
            <circle r="38"/>
            <text class="nlabel" y="-8">输出 y</text>
            <text class="nval" id="yval" y="16">0.577</text>
          </g>
        </svg>
      </div>
    </div>

  </div>
</div>
<script src="assets/base.js"></script>
<script>
  const X1 = 0.8, X2 = -0.3;
  const W1_INIT = 0.6, W2_INIT = 0.9, B_INIT = 0.1;

  const w1El = document.getElementById('w1');
  const w2El = document.getElementById('w2');
  const bEl = document.getElementById('b');

  const w1out = document.getElementById('w1out');
  const w2out = document.getElementById('w2out');
  const bout = document.getElementById('bout');
  const zbig = document.getElementById('zbig');
  const ybig = document.getElementById('ybig');

  const w1wire = document.getElementById('w1wire');
  const w2wire = document.getElementById('w2wire');
  const sumval = document.getElementById('sumval');
  const zval = document.getElementById('zval');
  const sigval = document.getElementById('sigval');
  const yval = document.getElementById('yval');

  function sigmoid(z) { return 1 / (1 + Math.exp(-z)); }

  function fmt(v) { return v.toFixed(2); }

  function update() {
    const w1 = parseFloat(w1El.value);
    const w2 = parseFloat(w2El.value);
    const b = parseFloat(bEl.value);

    const p1 = w1 * X1;
    const p2 = w2 * X2;
    const sum = p1 + p2;
    const z = sum + b;
    const y = sigmoid(z);

    w1out.textContent = fmt(w1);
    w2out.textContent = fmt(w2);
    bout.textContent = fmt(b);

    zbig.textContent = fmt(z);
    ybig.textContent = y.toFixed(3);

    w1wire.textContent = '×w₁ = ' + fmt(p1);
    w2wire.textContent = '×w₂ = ' + fmt(p2);
    sumval.textContent = fmt(sum);
    zval.textContent = fmt(z);
    sigval.textContent = y.toFixed(3);
    yval.textContent = y.toFixed(3);
  }

  [w1El, w2El, bEl].forEach(el => el.addEventListener('input', update));

  document.getElementById('resetBtn').addEventListener('click', () => {
    w1El.value = W1_INIT;
    w2El.value = W2_INIT;
    bEl.value = B_INIT;
    update();
  });

  Deck.init({ index: 2, total: 20 });
  update();
</script>
</body>
</html>
