<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lib/d3.min.js"></script>
<style>
  .p05-head{ flex:0 0 auto; display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .p05-legend{ margin-top:2px; }
  .p05-body{ flex:1; display:flex; gap:32px; min-height:0; }
  .p05-panel{ flex:1; display:flex; flex-direction:column; gap:10px; min-width:0; min-height:0; }
  .p05-panel h2{ font-size:var(--fs-h2); }
  .p05-chart{ flex:1; min-height:0; border:var(--hair) solid var(--rule); border-radius:var(--radius); background:var(--paper); overflow:hidden; }
  .p05-chart svg{ width:100%; height:100%; display:block; }
  .p05-verdict{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .p05-verdict .pct{ font-family:var(--font-mono); font-size:28px; font-weight:600; color:var(--text); font-variant-numeric:tabular-nums; }
  .p05-verdict .lab{ font-size:var(--fs-body); color:var(--text); }
  .p05-verdict .tag{ font-size:var(--fs-tick); }
</style>
</head>
<body data-page="05" data-total="20">
<div id="stage">

  <div class="p05-head">
    <div>
      <span class="kicker">决策边界对照</span>
      <h1>一层够不够</h1>
    </div>
    <p class="lead">同一份两类交错的月牙形数据：直线切不开两类，弯曲边界基本能分开。</p>
    <div class="legend p05-legend">
      <span class="li"><span class="sw dot" style="background:var(--text);border-radius:50%;width:10px;height:10px;"></span>类别 A</span>
      <span class="li"><span class="sw" style="background:var(--muted);width:10px;height:10px;border-radius:2px;"></span>类别 B</span>
      <span class="li"><span class="sw" style="background:var(--forward);"></span>决策边界</span>
    </div>
  </div>

  <div class="p05-body">
    <div class="p05-panel">
      <h2>单层网络</h2>
      <div class="p05-chart" id="chartLeft"></div>
      <div class="p05-verdict">
        <span class="pct">≈35%</span>
        <span class="lab">分类错误（示意）</span>
      </div>
    </div>
    <div class="p05-panel">
      <h2>两层网络</h2>
      <div class="p05-chart" id="chartRight"></div>
      <div class="p05-verdict">
        <span class="pct" style="color:var(--attention);">≈3%</span>
        <span class="lab">分类错误（示意）</span>
      </div>
    </div>
  </div>

</div>
<script src="assets/base.js"></script>
<script>
Deck.init({ index: 5, total: 20, keys: false });

(function(){
  // ---- 数据：两条交错月牙形，固定种子，可复现 ----
  Math.seedrandom('page05-moons');
  const n = 55, noise = 0.10;
  const A = [], B = [];
  for (let i = 0; i < n; i++) {
    const t = Math.PI * i / (n - 1);
    let x = Math.cos(t), y = Math.sin(t);
    x += (Math.random() - 0.5) * noise;
    y += (Math.random() - 0.5) * noise;
    A.push([x, y]);
  }
  for (let i = 0; i < n; i++) {
    const t = Math.PI * i / (n - 1);
    let x = 1 - Math.cos(t), y = 1 - Math.sin(t) - 0.5;
    x += (Math.random() - 0.5) * noise;
    y += (Math.random() - 0.5) * noise;
    B.push([x, y]);
  }

  const W = 400, H = 260, mgx = 22, mgy = 22;
  const mapX = x => mgx + (x + 1.3) * ((W - 2 * mgx) / 3.6);
  const mapY = y => (H - mgy) - (y + 0.65) * ((H - 2 * mgy) / 1.8);

  // 单层：一条直线，明显切不干净
  const lineData = [[-1.3, 0.62], [2.3, -0.55]].map(p => [mapX(p[0]), mapY(p[1])]);

  // 两层：沿两条月牙之间的缝隙走的弯曲边界
  const curveAnchors = [
    [-1.4, 0.62], [-0.7, 0.42], [0.0, 0.06], [0.6, -0.16],
    [1.0, 0.02], [1.45, 0.4], [2.3, 0.6]
  ].map(p => [mapX(p[0]), mapY(p[1])]);

  const lineGen = d3.line().curve(d3.curveCatmullRom.alpha(0.6));
  const straightD = d3.line()(lineData);
  const curveD = lineGen(curveAnchors);

  function dotsMarkup() {
    let s = '';
    A.forEach(([x, y]) => {
      s += `<circle cx="${mapX(x).toFixed(1)}" cy="${mapY(y).toFixed(1)}" r="4" fill="var(--text)" opacity="0.85"/>`;
    });
    B.forEach(([x, y]) => {
      const cx = mapX(x), cy = mapY(y), s2 = 7;
      s += `<rect x="${(cx - s2/2).toFixed(1)}" y="${(cy - s2/2).toFixed(1)}" width="${s2}" height="${s2}" rx="1.5" fill="var(--muted)" opacity="0.9"/>`;
    });
    return s;
  }

  function panelSvg(boundaryD, label) {
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${label}">
      <path d="${boundaryD}" fill="none" stroke="var(--forward)" stroke-width="3" stroke-linecap="round"/>
      ${dotsMarkup()}
    </svg>`;
  }

  document.getElementById('chartLeft').innerHTML =
    panelSvg(straightD, '单层网络用一条直线分隔两类月牙形数据，大量点被分错');
  document.getElementById('chartRight').innerHTML =
    panelSvg(curveD, '两层网络用一条弯曲边界分隔两类月牙形数据，基本分开');
})();
</script>
</body>
</html>
