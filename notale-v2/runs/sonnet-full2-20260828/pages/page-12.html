<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .layout-focus.p12 { gap: 14px; }
  .head .kicker { margin-bottom: 4px; }
  .head h1 { font-size: 30px; }

  .steps {
    flex: 1; display: flex; gap: 20px; min-height: 0;
  }
  .steps .step {
    flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px;
    background: var(--paper); border: var(--hair) dashed var(--rule-strong);
    border-radius: var(--radius); padding: 16px 18px; cursor: pointer;
    text-align: left; font-family: var(--font-sans); color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  .steps .step:hover { border-color: var(--backward); }
  .steps .step[aria-pressed=true] {
    border-color: var(--backward); box-shadow: 0 0 0 1px var(--backward) inset;
  }
  .steps .step .st-label {
    font-family: var(--font-mono); font-size: var(--fs-label); color: var(--muted);
    text-transform: uppercase; letter-spacing: .6px;
  }
  .steps .step .st-title { font-size: var(--fs-body); font-weight: 600; color: var(--text); }
  .steps .step .st-eq {
    font-family: var(--font-mono); font-size: var(--fs-h2); font-weight: 600; color: var(--backward);
    font-variant-numeric: tabular-nums;
  }
  .steps .step .st-detail {
    font-family: var(--font-mono); font-size: var(--fs-sec); color: var(--muted);
    line-height: 1.5; max-height: 0; overflow: hidden; opacity: 0;
    transition: max-height .25s ease, opacity .2s ease;
  }
  .steps .step[aria-pressed=true] .st-detail { max-height: 120px; opacity: 1; }
  .steps .step .st-hint {
    margin-top: auto; font-family: var(--font-mono); font-size: var(--fs-tick); color: var(--rule-strong);
  }

  .arwv { flex: 0 0 30px; display: flex; align-items: center; justify-content: center; color: var(--backward); font-size: 20px; }

  .summary {
    flex: 0 0 0px; display: flex; align-items: center; gap: 18px;
    padding: 0 20px; border-radius: var(--radius-lg); border: 0 solid var(--backward);
    background: var(--backward-soft); opacity: 0; overflow: hidden;
    transition: opacity .3s ease, flex-basis .3s ease, padding .3s ease, border-width .3s ease;
  }
  .summary.show { flex: 0 0 84px; opacity: 1; padding: 14px 20px; border-width: var(--wire); }
  .summary .lbl { font-family: var(--font-mono); font-size: var(--fs-label); color: var(--muted); }
  .summary .val { font-family: var(--font-mono); font-size: 34px; font-weight: 600; color: var(--backward); font-variant-numeric: tabular-nums; }
  .summary .say { font-size: var(--fs-sec); color: var(--text); }
</style>
</head>
<body data-page="12" data-total="20">
<div id="stage">
  <div class="layout-focus p12">
    <div class="head">
      <span class="kicker">反向传播 · 第一步</span>
      <h1>输出层的误差信号：δ<sub>output</sub></h1>
    </div>

    <div class="stagearea steps" id="steps" role="group" aria-label="点击每一步查看算式">
      <button class="step" id="s1" aria-pressed="false">
        <span class="st-label">第一步</span>
        <span class="st-title">损失对输出的导数</span>
        <span class="st-eq">dL/dŷ = ŷ − t</span>
        <span class="st-detail">ŷ = 0.549，t = 1（真实标签）<br>0.549 − 1 = <b>−0.451</b><br>输出比目标小 0.451，误差为负，说明要往"增大"的方向调整。</span>
        <span class="st-hint">点击查看算式</span>
      </button>
      <div class="arwv">▸</div>
      <button class="step" id="s2" aria-pressed="false">
        <span class="st-label">第二步</span>
        <span class="st-title">输出对求和值的导数</span>
        <span class="st-eq">dŷ/dz_o = ŷ(1−ŷ)</span>
        <span class="st-detail">ŷ = 0.549，1 − ŷ = 0.451<br>0.549 × 0.451 ≈ <b>0.248</b><br>这是 sigmoid 函数自身的导数，取决于输出值本身离 0.5 有多近。</span>
        <span class="st-hint">点击查看算式</span>
      </button>
      <div class="arwv">▸</div>
      <button class="step" id="s3" aria-pressed="false">
        <span class="st-label">第三步</span>
        <span class="st-title">两个局部导数相乘</span>
        <span class="st-eq">δ_output = dL/dŷ × dŷ/dz_o</span>
        <span class="st-detail">−0.451 × 0.248 ≈ <b>−0.112</b><br>这个数就是要往回传的误差信号，下一页会用它更新权重。</span>
        <span class="st-hint">点击查看算式</span>
      </button>
    </div>

    <div class="summary" id="summary">
      <span class="lbl">δ<sub>output</sub></span>
      <span class="val">≈ −0.112</span>
      <span class="say">这就是链式法则——把两步局部导数乘起来。</span>
    </div>
  </div>
</div>
<script src="assets/base.js"></script>
<script>
  Deck.init({ index: 12, total: 20 });

  const ids = ['s1','s2','s3'];
  const summary = document.getElementById('summary');

  function checkAll() {
    const all = ids.every(id => document.getElementById(id).getAttribute('aria-pressed') === 'true');
    summary.classList.toggle('show', all);
  }

  ids.forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('click', () => {
      const pressed = el.getAttribute('aria-pressed') === 'true';
      el.setAttribute('aria-pressed', String(!pressed));
      checkAll();
    });
  });
</script>
</body>
</html>
