<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .head { display:flex; flex-direction:column; gap:4px; }
  .head h1 { font-size: 30px; }

  .stagearea { position:relative; display:flex; gap:28px; }

  /* 图解区 */
  .diagram-wrap { flex: 1.35; min-width:0; position:relative; }
  .diagram-wrap svg { width:100%; height:100%; display:block; }

  .node {
    fill: var(--paper); stroke: var(--rule-strong); stroke-width: 2;
  }
  .node.output { stroke: var(--backward); }
  .node.hidden { cursor: pointer; transition: stroke .15s, filter .15s; }
  .node.hidden:hover, .node.hidden.is-active { stroke: var(--attention); stroke-width: 3; }
  .node.hidden:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .node-label { font-family: var(--font-mono); font-size: 15px; fill: var(--text); text-anchor: middle; pointer-events:none; }
  .node-sub { font-family: var(--font-mono); font-size: 13px; fill: var(--muted); text-anchor: middle; pointer-events:none; }

  .branch {
    fill: none; stroke: var(--backward); stroke-width: 2.5; stroke-dasharray: 7 6;
  }
  .branch.is-active { stroke-width: 3.5; }

  .weight-label {
    font-family: var(--font-mono); font-size: 15px; fill: var(--backward); text-anchor: middle;
  }
  rect.bg { fill: var(--paper); stroke: var(--rule); stroke-width: 1; }

  .delta-badge {
    font-family: var(--font-mono); font-size: 14px; fill: var(--muted); text-anchor: middle;
  }

  /* 侧面板：算式 */
  .side { flex: 1; min-width:0; display:flex; flex-direction:column; gap:14px; }
  .formula-panel {
    flex: 0 0 auto;
    min-height: 200px;
    display:flex; flex-direction:column; gap:12px; justify-content:center;
  }
  .formula-panel .ph-tag { font-family: var(--font-mono); font-size: var(--fs-label); color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .formula-panel .ph-eq { font-family: var(--font-mono); font-size: 20px; color: var(--text); line-height: 1.7; word-break: break-word; }
  .formula-panel .ph-eq .lhs { color: var(--backward); font-weight: 600; }
  .formula-panel .ph-result { font-family: var(--font-mono); font-size: 34px; color: var(--backward); font-weight: 600; margin-top: 2px; }
  .formula-panel .ph-hint { font-family: var(--font-sans); font-size: var(--fs-sec); color: var(--muted); }

  .claim-line {
    font-size: var(--fs-lead); color: var(--text); font-weight: 500; line-height: 1.5;
  }
  .claim-line b { color: var(--backward); }
</style>
</head>
<body data-page="13" data-total="20">
<div id="stage">
  <div class="layout-focus">
    <div class="head">
      <span class="kicker">反向传播 · 第二步</span>
      <h1>同一个 δ<sub>output</sub>，按不同权重分别传回两个隐藏神经元</h1>
    </div>

    <div class="stagearea">
      <div class="diagram-wrap min0">
        <svg id="diag" viewBox="0 0 760 560" role="img" aria-label="输出神经元的误差信号沿两条支路分别传回隐藏神经元1和隐藏神经元2">
          <!-- 支路 1: output -> hidden1 -->
          <path id="branch1" class="branch" d="M 560,280 C 400,280 320,150 190,140"></path>
          <!-- 支路 2: output -> hidden2 -->
          <path id="branch2" class="branch" d="M 560,280 C 400,280 320,410 190,420"></path>

          <!-- 权重标注 -->
          <g id="wlabel1">
            <rect class="bg" x="330" y="168" width="120" height="30" rx="4"></rect>
            <text class="weight-label" x="390" y="188">W2_1 = 0.7</text>
          </g>
          <g id="wlabel2">
            <rect class="bg" x="330" y="392" width="130" height="30" rx="4"></rect>
            <text class="weight-label" x="395" y="412">W2_2 = −0.5</text>
          </g>

          <!-- 输出神经元 -->
          <circle class="node output" cx="600" cy="280" r="52"></circle>
          <text class="node-label" x="600" y="276">输出</text>
          <text class="node-sub" x="600" y="296">δ = −0.112</text>

          <!-- 隐藏神经元1 -->
          <circle id="h1" class="node hidden" cx="160" cy="140" r="52" tabindex="0" role="button"
            aria-label="隐藏神经元1，点击查看它的误差传回算式" aria-pressed="false"></circle>
          <text class="node-label" x="160" y="136">隐藏 1</text>
          <text class="node-sub" x="160" y="156">a=0.5</text>
          <text id="d1" class="delta-badge" x="160" y="220">δ_h1 = ?</text>

          <!-- 隐藏神经元2 -->
          <circle id="h2" class="node hidden" cx="160" cy="420" r="52" tabindex="0" role="button"
            aria-label="隐藏神经元2，点击查看它的误差传回算式" aria-pressed="false"></circle>
          <text class="node-label" x="160" y="416">隐藏 2</text>
          <text class="node-sub" x="160" y="436">a=0.710</text>
          <text id="d2" class="delta-badge" x="160" y="480">δ_h2 = ?</text>
        </svg>
      </div>

      <div class="side min0">
        <div class="claim-line">同一个 <b>δ_output</b>，被两条支路上各自不同的权重分别加权，才传给两个隐藏神经元 —— 支路上的权重越大，传回的误差信号越强。</div>
        <div class="panel formula-panel" id="fp">
          <div class="ph-tag">点击左侧任一隐藏神经元</div>
          <div class="ph-eq">尚未选择</div>
          <div class="ph-hint">两个隐藏神经元各自只用自己那条支路上的权重来加权同一个 δ_output。</div>
        </div>
        <div class="legend">
          <div class="li"><span class="sw line"></span>反向误差支路（锈红虚线）</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="assets/base.js"></script>
<script>
  var DELTA_OUT = -0.112;
  var data = {
    h1: {
      w: 0.7, a: 0.5,
      eqHtml: '<span class="lhs">δ_h1</span> = δ_output × W2_1 × a_h1(1−a_h1)<br>= −0.112 × 0.7 × 0.5 × 0.5',
      result: '−0.0196'
    },
    h2: {
      w: -0.5, a: 0.710,
      eqHtml: '<span class="lhs">δ_h2</span> = δ_output × W2_2 × a_h2(1−a_h2)<br>= −0.112 × (−0.5) × 0.710 × 0.290',
      result: '0.0115'
    }
  };

  var els = {
    h1: document.getElementById('h1'),
    h2: document.getElementById('h2'),
    branch1: document.getElementById('branch1'),
    branch2: document.getElementById('branch2'),
    d1: document.getElementById('d1'),
    d2: document.getElementById('d2'),
    fp: document.getElementById('fp')
  };

  var active = null;

  function render(key) {
    active = key;
    els.h1.classList.toggle('is-active', key === 'h1');
    els.h2.classList.toggle('is-active', key === 'h2');
    els.branch1.classList.toggle('is-active', key === 'h1');
    els.branch2.classList.toggle('is-active', key === 'h2');
    els.h1.setAttribute('aria-pressed', key === 'h1' ? 'true' : 'false');
    els.h2.setAttribute('aria-pressed', key === 'h2' ? 'true' : 'false');

    var d = data[key];
    els.fp.innerHTML =
      '<div class="ph-tag">' + (key === 'h1' ? '隐藏神经元 1 的传回算式' : '隐藏神经元 2 的传回算式') + '</div>' +
      '<div class="ph-eq">' + d.eqHtml + '</div>' +
      '<div class="ph-result">≈ ' + d.result + '</div>' +
      '<div class="ph-hint">这条支路的权重是 ' + (key === 'h1' ? 'W2_1 = 0.7' : 'W2_2 = −0.5') + '，只影响这一个隐藏神经元收到的信号强度。</div>';

    els.d1.textContent = 'δ_h1 = ' + (key === 'h1' ? '−0.0196' : '?');
    els.d2.textContent = 'δ_h2 = ' + (key === 'h2' ? '0.0115' : '?');
  }

  function bind(el, key) {
    el.addEventListener('click', function () { render(key); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); render(key); }
    });
  }
  bind(els.h1, 'h1');
  bind(els.h2, 'h2');

  Deck.init({ index: 13, total: 20 });
</script>
</body>
</html>
