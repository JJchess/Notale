<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .head { display:flex; flex-direction:column; gap:4px; }

  .stagearea { align-items: center; }

  .diagram-wrap {
    position: relative;
    width: 640px;
    height: 640px;
    flex: 0 0 auto;
  }
  .diagram-wrap svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }

  .node {
    position: absolute;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: var(--paper);
    border: var(--wire) solid var(--rule-strong);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
    padding: 6px 8px;
    text-align: center;
    cursor: pointer;
    font-family: var(--font-sans);
    color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  .node .nlabel { font-size: 16px; font-weight: 600; line-height: 1.25; }
  .node .ntag { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .node:hover { border-color: var(--attention); }
  .node[aria-pressed="true"] {
    border-color: var(--attention);
    box-shadow: 0 0 0 2px var(--attention) inset;
    background: var(--attention-soft);
  }
  .node:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .node.n-top    { left: 260px; top: 20px; }
  .node.n-right  { left: 500px; top: 260px; }
  .node.n-bottom { left: 260px; top: 500px; }
  .node.n-left   { left: 20px;  top: 260px; }

  .loopmark {
    position: absolute;
    left: 300px; top: -6px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    width: 120px;
  }
  .loopmark .g { font-size: 18px; color: var(--attention); display:block; }

  .panel-cap {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .cap-body {
    display: flex; flex-direction: column; gap: 10px;
  }
  .cap-title { display:flex; align-items: baseline; gap: 12px; }
  .cap-title h2 { color: var(--forward); }
  .cap-tag { font-family: var(--font-mono); font-size: var(--fs-label); color: var(--muted); }
  .cap-text { font-size: var(--fs-lead); line-height: 1.55; }

  .legend-row { margin-top: 4px; }
</style>
</head>
<body data-page="15" data-total="20">
<div id="stage">

  <div class="head">
    <span class="kicker">回顾 · 整体结构</span>
    <h1>整个循环:算、比、传、改</h1>
  </div>

  <div class="layout-focus stagearea" style="flex-direction:row; display:flex; gap:48px;">

    <div class="diagram-wrap min0" aria-hidden="false">
      <div class="loopmark"><span class="g">↻</span>循环往复,回到起点</div>

      <svg viewBox="0 0 640 640">
        <defs>
          <marker id="arrow-fwd" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="var(--forward)"></path>
          </marker>
          <marker id="arrow-bwd" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="var(--backward)"></path>
          </marker>
        </defs>
        <path d="M380,88 A240,240 0 0,1 553,261" fill="none" stroke="var(--forward)" stroke-width="3" marker-end="url(#arrow-fwd)"></path>
        <path d="M553,379 A240,240 0 0,1 379,553" fill="none" stroke="var(--forward)" stroke-width="3" marker-end="url(#arrow-fwd)"></path>
        <path d="M261,553 A240,240 0 0,1 87,379" fill="none" stroke="var(--backward)" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-bwd)"></path>
        <path d="M87,261 A240,240 0 0,1 261,87" fill="none" stroke="var(--backward)" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-bwd)"></path>
      </svg>

      <button type="button" class="node n-top" data-key="fwd" aria-pressed="true">
        <span class="nlabel">正向计算</span>
        <span class="ntag">第2·4·10页</span>
      </button>
      <button type="button" class="node n-right" data-key="loss" aria-pressed="false">
        <span class="nlabel">算损失</span>
        <span class="ntag">第6页</span>
      </button>
      <button type="button" class="node n-bottom" data-key="back" aria-pressed="false">
        <span class="nlabel">反向传播</span>
        <span class="ntag">第11·12·13页</span>
      </button>
      <button type="button" class="node n-left" data-key="update" aria-pressed="false">
        <span class="nlabel">更新权重</span>
        <span class="ntag">第8·14页</span>
      </button>
    </div>

    <div class="panel-cap min0">
      <div class="panel cap-body">
        <div class="cap-title">
          <h2 id="cap-title">正向计算</h2>
          <span class="cap-tag" id="cap-tag">第2·4·10页</span>
        </div>
        <p class="cap-text" id="cap-text">输入乘权重、加偏置、过一次非线性——这是神经元和层在做的事。</p>
      </div>

      <div class="legend legend-row">
        <div class="li"><span class="sw"></span>前半圈:正向,算出预测和损失</div>
        <div class="li"><span class="sw line"></span>后半圈:反向,把误差传回去、改权重</div>
      </div>

      <p class="small">点任意一个节点,看它具体在做什么。这一页不引入新数字,只是把前面十三页的步骤重新看成一个会反复转动的循环——下一页开始用它跑一次真实训练。</p>
    </div>

  </div>

</div>
<script src="assets/base.js"></script>
<script>
  const STEPS = {
    fwd:    { title: '正向计算', tag: '第2·4·10页', text: '输入乘权重、加偏置、过一次非线性——这是神经元和层在做的事。' },
    loss:   { title: '算损失',   tag: '第6页',       text: '拿模型输出和真实标签一比,算出一个数衡量差多少。' },
    back:   { title: '反向传播', tag: '第11·12·13页', text: '从损失往回,按链式法则把每一层的梯度算出来。' },
    update: { title: '更新权重', tag: '第8·14页',    text: '沿着梯度反方向挪一小步,挪多大由学习率决定。' }
  };

  const nodes = Array.from(document.querySelectorAll('.node'));
  const capTitle = document.getElementById('cap-title');
  const capTag = document.getElementById('cap-tag');
  const capText = document.getElementById('cap-text');

  function select(key) {
    const s = STEPS[key];
    if (!s) return;
    nodes.forEach(n => n.setAttribute('aria-pressed', String(n.dataset.key === key)));
    capTitle.textContent = s.title;
    capTag.textContent = s.tag;
    capText.textContent = s.text;
  }

  nodes.forEach(n => n.addEventListener('click', () => select(n.dataset.key)));

  Deck.init({ index: 15, total: 20 });
</script>
</body>
</html>
