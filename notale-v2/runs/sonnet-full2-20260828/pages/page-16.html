<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lib/mlp.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<style>
  .p16-desc { margin-top: 10px; }
  .p16-panel { display: flex; flex-direction: column; gap: 16px; margin-top: 18px; }
  .p16-readouts { display: flex; gap: 30px; margin-top: 4px; }
  .p16-readouts .rd { display: flex; flex-direction: column; gap: 2px; }
  .p16-stage { flex: 1; min-height: 0; position: relative; padding: 0; }
  .p16-cvwrap { position: absolute; inset: 16px; border-radius: var(--radius); overflow: hidden; background: var(--paper-2); }
  .p16-legend { position: absolute; left: 16px; bottom: 12px; z-index: 2; background: rgba(248,250,251,.88); padding: 6px 10px; border-radius: var(--radius); }
  .p16-mark0 { display:inline-block; width:11px; height:11px; border-radius:50%; background: var(--text); margin-right:6px; vertical-align:-1px; }
  .p16-mark1 { display:inline-block; width:11px; height:11px; border-radius:50%; border: var(--wire) solid var(--text); margin-right:6px; vertical-align:-1px; }
  .p16-marksw { display:inline-block; width:14px; height:14px; background: var(--forward-soft); border: var(--hair) solid var(--forward); margin-right:6px; vertical-align:-2px; border-radius: 2px; }
  .p16-chartbox { flex: 0 0 260px; display: flex; flex-direction: column; gap: 8px; }
  .p16-chartbox .ctl-label { margin-bottom: 0; }
  #p16-lossChart { flex: 1; min-height: 0; }
  .p16-acc { font-family: var(--font-mono); font-size: var(--fs-label); color: var(--muted); }
  .p16-acc .num { color: var(--text); font-weight: 600; }
</style>
</head>
<body data-page="16" data-total="20">
<div id="stage">
  <div class="layout-split" style="gap:44px;">

    <div class="col-a">
      <span class="kicker">证据 · 完整训练一次</span>
      <h1>真的练一遍</h1>
      <p class="lead p16-desc">二维平面上 40 个点，分两类，排成两条交错的月牙形。</p>
      <p class="small" style="margin-top:6px;">拖动滑块或点击按钮，看同一个网络怎么把这些点分开。</p>

      <div class="panel p16-panel">
        <div class="ctl">
          <div class="ctl-label">
            <span>训练进度</span>
            <span>epoch <span class="num" id="p16-epochLabel">0</span> / 300</span>
          </div>
          <input type="range" class="dial" id="p16-slider" min="0" max="300" step="1" value="0"
                 aria-label="训练进度，epoch 0 到 300">
        </div>

        <div class="btns">
          <button class="btn" id="p16-step1">训练 1 步</button>
          <button class="btn" id="p16-step50">训练 50 步</button>
          <button class="btn" id="p16-reset">重置</button>
        </div>

        <div class="p16-readouts">
          <div class="rd">
            <span class="hint">当前 EPOCH</span>
            <span class="big sm num" id="p16-epochBig">0</span>
          </div>
          <div class="rd">
            <span class="hint">当前损失</span>
            <span class="big sm num" id="p16-lossBig">0.000</span>
          </div>
        </div>
        <div class="p16-acc">分类准确率 <span class="num" id="p16-acc">0%</span></div>
      </div>
    </div>

    <div class="col-b">
      <div class="panel p16-stage">
        <div class="p16-cvwrap">
          <canvas id="p16-cv" class="cv-fill"></canvas>
        </div>
        <div class="legend p16-legend">
          <span class="li"><span class="p16-mark0"></span>类别 A</span>
          <span class="li"><span class="p16-mark1"></span>类别 B</span>
          <span class="li"><span class="p16-marksw"></span>模型判为类别 B 的区域</span>
        </div>
      </div>

      <div class="panel p16-chartbox">
        <div class="ctl-label">
          <span>损失随训练下降</span>
          <span>epoch <span class="num" id="p16-chartEpoch">0</span></span>
        </div>
        <div id="p16-lossChart"></div>
      </div>
    </div>

  </div>
</div>
<script src="assets/base.js"></script>
<script>
(function () {
  'use strict';

  /* ---------- 1. 固定数据集：40 点，两条交错月牙 ---------- */
  Math.seedrandom('page-16-data');
  var N = 40, half = N / 2;
  var data = [];
  for (var i = 0; i < N; i++) {
    var cls = i % 2;
    var k = Math.floor(i / 2);
    var t = Math.PI * (k / (half - 1));
    var px, py;
    if (cls === 0) { px = Math.cos(t); py = Math.sin(t); }
    else { px = 1 - Math.cos(t); py = 1 - Math.sin(t) - 0.5; }
    px += (Math.random() - 0.5) * 0.16;
    py += (Math.random() - 0.5) * 0.16;
    data.push({ x: [px, py], t: cls });
  }

  var xs = data.map(function (p) { return p.x[0]; });
  var ys = data.map(function (p) { return p.x[1]; });
  var domain = {
    x0: Math.min.apply(null, xs) - 0.45, x1: Math.max.apply(null, xs) + 0.45,
    y0: Math.min.apply(null, ys) - 0.45, y1: Math.max.apply(null, ys) + 0.45
  };

  /* ---------- 2. 训练网络，逐 epoch 存快照（权重 + 损失 + 准确率） ---------- */
  var EPOCHS = 300;
  var net = MLP.create({ sizes: [2, 8, 8, 1], act: 'tanh', lr: 0.8, seed: 7 });

  function cloneLayers(n) {
    return n.layers.map(function (ly) { return { W: ly.W.slice(), b: ly.b.slice() }; });
  }
  var snapshots = [];
  function snap() {
    var ev = net.evaluate(data);
    snapshots.push({ layers: cloneLayers(net), loss: ev.loss, acc: ev.acc });
  }
  snap();
  for (var e = 1; e <= EPOCHS; e++) {
    net.step(data, N);
    snap();
  }

  /* 展示用网络：权重每次从快照覆盖，不重新训练 */
  var dispNet = MLP.create({ sizes: [2, 8, 8, 1], act: 'tanh', lr: 0.8, seed: 1 });
  function applySnapshot(idx) {
    var snap = snapshots[idx];
    for (var l = 0; l < dispNet.layers.length; l++) {
      dispNet.layers[l].W.set(snap.layers[l].W);
      dispNet.layers[l].b.set(snap.layers[l].b);
    }
  }

  /* ---------- 3. 决策边界 + 散点 画布 ---------- */
  var GRID = 84;
  var gridCv = document.createElement('canvas');
  gridCv.width = GRID; gridCv.height = GRID;
  var gctx = gridCv.getContext('2d');
  var imgData = gctx.createImageData(GRID, GRID);

  function renderField() {
    var field = dispNet.field(domain.x0, domain.y0, domain.x1, domain.y1, GRID, GRID);
    var side0 = Deck.rgb('--paper-2');   // 类别 A 一侧：中性纸色
    var side1 = Deck.rgb('--forward-soft'); // 类别 B 一侧：前向色的浅底
    var line = Deck.rgb('--forward');
    for (var j = 0; j < GRID; j++) {
      var row = GRID - 1 - j;
      for (var i = 0; i < GRID; i++) {
        var v = field[j * GRID + i];
        // 把 0~1 的概率拉成锐利一些的双色分区，边界附近再叠一条深色描边感
        var w = Math.pow(v, 1);
        var r = side0[0] + (side1[0] - side0[0]) * w;
        var g = side0[1] + (side1[1] - side0[1]) * w;
        var b = side0[2] + (side1[2] - side0[2]) * w;
        var edge = 1 - Math.min(1, Math.abs(v - 0.5) / 0.06);
        if (edge > 0) {
          r = r + (line[0] - r) * edge * 0.55;
          g = g + (line[1] - g) * edge * 0.55;
          b = b + (line[2] - b) * edge * 0.55;
        }
        var o = (row * GRID + i) * 4;
        imgData.data[o] = r; imgData.data[o + 1] = g; imgData.data[o + 2] = b; imgData.data[o + 3] = 255;
      }
    }
    gctx.putImageData(imgData, 0, 0);
  }

  var cv = document.getElementById('p16-cv');
  var textColor = null, dotStroke = null;

  function drawScene(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(gridCv, 0, 0, GRID, GRID, 0, 0, w, h);

    if (!textColor) textColor = Deck.rgba('--text', 1);

    data.forEach(function (p) {
      var px = (p.x[0] - domain.x0) / (domain.x1 - domain.x0) * w;
      var py = h - (p.x[1] - domain.y0) / (domain.y1 - domain.y0) * h;
      ctx.beginPath();
      ctx.arc(px, py, 7, 0, Math.PI * 2);
      if (p.t === 0) {
        ctx.fillStyle = textColor;
        ctx.fill();
      } else {
        ctx.lineWidth = 2.4;
        ctx.strokeStyle = textColor;
        ctx.stroke();
      }
    });
  }

  var fitter = Deck.autofit(cv, drawScene);

  /* ---------- 4. 损失曲线 ---------- */
  var chartDom = document.getElementById('p16-lossChart');
  var chart = echarts.init(chartDom, null, { renderer: 'svg' });
  var muted = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();
  var rule = getComputedStyle(document.documentElement).getPropertyValue('--rule').trim();
  var forward = getComputedStyle(document.documentElement).getPropertyValue('--forward').trim();
  var attention = getComputedStyle(document.documentElement).getPropertyValue('--attention').trim();

  function updateChart(idx) {
    var lossData = [];
    for (var i = 0; i <= idx; i++) lossData.push([i, +snapshots[i].loss.toFixed(4)]);
    chart.setOption({
      textStyle: { fontSize: 16, color: muted, fontFamily: 'IBM Plex Mono, monospace' },
      grid: { left: 54, right: 20, top: 16, bottom: 34 },
      xAxis: {
        type: 'value', min: 0, max: EPOCHS, name: 'epoch', nameLocation: 'middle', nameGap: 24,
        nameTextStyle: { fontSize: 14, color: muted },
        axisLabel: { fontSize: 12, color: muted },
        axisLine: { lineStyle: { color: rule } }, splitLine: { show: false }
      },
      yAxis: {
        type: 'value', name: '损失', nameTextStyle: { fontSize: 14, color: muted },
        axisLabel: { fontSize: 12, color: muted },
        axisLine: { lineStyle: { color: rule } }, splitLine: { lineStyle: { color: rule, opacity: .5 } }
      },
      series: [
        { type: 'line', data: lossData, showSymbol: false, lineStyle: { color: forward, width: 2.4 }, z: 1 },
        { type: 'scatter', data: [[idx, +snapshots[idx].loss.toFixed(4)]], symbolSize: 11, itemStyle: { color: attention }, z: 2 }
      ]
    }, true);
  }

  /* ---------- 5. 状态与控件 ---------- */
  var slider = document.getElementById('p16-slider');
  var epochLabel = document.getElementById('p16-epochLabel');
  var epochBig = document.getElementById('p16-epochBig');
  var lossBig = document.getElementById('p16-lossBig');
  var accEl = document.getElementById('p16-acc');
  var chartEpochEl = document.getElementById('p16-chartEpoch');
  var step1Btn = document.getElementById('p16-step1');
  var step50Btn = document.getElementById('p16-step50');
  var resetBtn = document.getElementById('p16-reset');

  var epoch = 0;
  var rafPending = false, rafTarget = 0;

  function render(idx) {
    epoch = idx;
    applySnapshot(idx);
    renderField();
    fitter.redraw();
    updateChart(idx);

    epochLabel.textContent = idx;
    epochBig.textContent = idx;
    lossBig.textContent = snapshots[idx].loss.toFixed(3);
    accEl.textContent = Math.round(snapshots[idx].acc * 100) + '%';
    chartEpochEl.textContent = idx;
    slider.value = idx;

    step1Btn.disabled = idx >= EPOCHS;
    step50Btn.disabled = idx >= EPOCHS;
  }

  function scheduleRender(idx) {
    rafTarget = Deck.clamp(idx, 0, EPOCHS);
    if (!rafPending) {
      rafPending = true;
      requestAnimationFrame(function () { rafPending = false; render(rafTarget); });
    }
  }

  slider.addEventListener('input', function () { scheduleRender(+slider.value); });
  step1Btn.addEventListener('click', function () { render(Math.min(EPOCHS, epoch + 1)); });
  step50Btn.addEventListener('click', function () { render(Math.min(EPOCHS, epoch + 50)); });
  resetBtn.addEventListener('click', function () { render(0); });

  render(0);

  Deck.init({ index: 16, total: 20 });
})();
</script>
</body>
</html>
