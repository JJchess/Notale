<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
.layout-focus .head { max-width: 1200px; }
.layout-focus > .stagearea { align-items: center; }
.k-generalization { justify-content: center; gap: 36px; }
.k-generalization .claim { font-size: 30px; line-height: 1.5; padding: 22px 26px; }
.k-generalization .trunk { padding-top: 8px; gap: 22px; }
.k-generalization .supports { gap: 22px; }
.k-generalization .support { font-size: 21px; line-height: 1.6; padding-left: 8px; }
.k-generalization .support .ref {
  display: inline-block;
  font-family: var(--font-mono); font-size: var(--fs-label); color: var(--muted);
  margin-left: 10px; border: var(--hair) solid var(--rule); border-radius: var(--radius);
  padding: 2px 8px; vertical-align: middle;
}
</style>
</head>
<body data-page="18" data-total="20">
<div id="stage">
  <div class="layout-focus">
    <div class="head">
      <span class="kicker">收束</span>
      <h1>为什么这套办法能学会复杂的东西</h1>
    </div>
    <div class="stagearea">
      <div class="k-generalization min0" style="width:100%;">
        <div class="claim">
          深度、非线性、和沿梯度的小步迭代，三者配合能让网络逐步逼近任意复杂的映射关系。
        </div>
        <div class="trunk">
          <div class="supports">
            <div class="support">
              每一层的非线性都会把空间弯一次，弯得越多次能表示的形状越复杂
              <span class="ref">呼应第3、5页</span>
            </div>
            <div class="support">
              损失把"错多少"变成一个可以被优化的数字
              <span class="ref">呼应第6页</span>
            </div>
            <div class="support">
              梯度沿链式法则精确告诉每个参数该往哪调、调多大
              <span class="ref">呼应第9、12、13页</span>
            </div>
            <div class="support">
              哪怕每一步都很小，走足够多步也能从任意起点走到低损失区
              <span class="ref">呼应第7、8、16页</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="assets/base.js"></script>
<script>Deck.init({ index: 18, total: 20 });</script>
</body>
</html>
