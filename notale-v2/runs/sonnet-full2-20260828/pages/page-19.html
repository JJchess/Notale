<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .layout-quiz{ gap: 40px; }
  .qgrid{ flex:1; min-height:0; display:flex; gap:64px; }
  .qcol{ flex:1; min-width:0; display:flex; flex-direction:column; gap:26px; }
  .qcol .panel.q{ padding:28px 30px; }
  .qcol .panel.q .qn{
    font-family: var(--font-mono); font-size: var(--fs-label); color: var(--muted);
    margin-bottom: 10px; display:block;
  }
  .qcol .panel.q .qtext{ font-size: 23px; font-weight:500; color: var(--text); line-height:1.5; }
  .qcol .quiz{ display:flex; flex-direction:column; gap:18px; }
  .opt{
    width:100%; font-family: var(--font-sans); background: var(--paper);
    font-size: 19px; padding:22px 24px; line-height:1.45;
  }
  .fb{ min-height: 68px; font-size: 19px; padding:18px 20px; align-items:center; }
  .fb .fb-icon{ font-size: 24px; }
  .fb.placeholder{ visibility:hidden; }
</style>
</head>
<body data-page="19" data-total="20">
<div id="stage">
  <div class="layout-quiz" style="flex:1;">
    <div>
      <span class="kicker">检查点</span>
      <h1>检查点：学习率与反向传播</h1>
    </div>
    <div class="qgrid">

      <div class="qcol" id="q1">
        <div class="panel q">
          <span class="qn">第 1 题</span>
          <span class="qtext">如果把学习率从 0.1 调到 2.0，最可能发生什么？</span>
        </div>
        <div class="quiz" role="group" aria-label="第一题选项">
          <button class="opt" data-q="1" data-key="A" aria-selected="false">A. 收敛得更快更稳</button>
          <button class="opt" data-q="1" data-key="B" aria-selected="false">B. 在最优点附近来回震荡，甚至越走越远</button>
          <button class="opt" data-q="1" data-key="C" aria-selected="false">C. 损失曲线基本不受影响</button>
        </div>
        <div class="fb placeholder" id="fb1" aria-live="polite">
          <span class="fb-icon"></span><span class="fb-text"></span>
        </div>
      </div>

      <div class="qcol" id="q2">
        <div class="panel q">
          <span class="qn">第 2 题</span>
          <span class="qtext">反向传播里，δ_output 要经过什么才能变成 δ_hidden？</span>
        </div>
        <div class="quiz" role="group" aria-label="第二题选项">
          <button class="opt" data-q="2" data-key="A" aria-selected="false">A. 什么都不用，直接照抄</button>
          <button class="opt" data-q="2" data-key="B" aria-selected="false">B. 乘以对应的权重，再乘以隐藏层自身的激活导数</button>
          <button class="opt" data-q="2" data-key="C" aria-selected="false">C. 只和输入 x 有关，与权重无关</button>
        </div>
        <div class="fb placeholder" id="fb2" aria-live="polite">
          <span class="fb-icon"></span><span class="fb-text"></span>
        </div>
      </div>

    </div>
  </div>
</div>
<script src="assets/base.js"></script>
<script>
  Deck.init({ index: 19, total: 20 });

  const ANSWERS = {
    1: { correct: 'B', right: '没错——这正是第8页里 η=1.05 时轨迹震荡放大的原因', wrong: '再想想第8页那条震荡的轨迹' },
    2: { correct: 'B', right: '没错——这正是第13页里 δ 从输出层传回隐藏层的那一步', wrong: '再想想第13页里 δ 是怎么从输出层传回隐藏层的' }
  };

  document.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const q = btn.dataset.q;
      const key = btn.dataset.key;
      const group = document.querySelectorAll(`.opt[data-q="${q}"]`);
      group.forEach(b => {
        b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
        b.disabled = true;
      });

      const info = ANSWERS[q];
      const isRight = key === info.correct;
      const fb = document.getElementById('fb' + q);
      fb.classList.remove('placeholder');
      fb.classList.toggle('is-right', isRight);
      fb.classList.toggle('is-wrong', !isRight);
      fb.querySelector('.fb-text').textContent = isRight ? info.right : info.wrong;
    });
  });
</script>
</body>
</html>
