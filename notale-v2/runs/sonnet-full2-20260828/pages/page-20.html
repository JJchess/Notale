<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage { position: relative; }

  .layout-close.wide { max-width: 1420px; gap: 30px; }

  .chain-process {
    width: 100%;
    gap: 0;
  }
  .chain-process .step {
    padding: 16px 14px;
    gap: 8px;
    text-align: left;
  }
  .chain-process .step .st-label {
    font-weight: 600;
    letter-spacing: .4px;
  }
  .chain-process .step .st-body {
    font-size: var(--fs-sec);
    color: var(--text);
    line-height: 1.4;
  }
  .chain-process .step.backward-step {
    border-color: var(--backward);
    border-style: dashed;
    background: var(--backward-soft);
  }
  .chain-process .arw { flex: 0 0 30px; font-size: 18px; }

  .roadmap-title {
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .layout-close .roadmap {
    justify-content: center;
  }
  .layout-close .roadmap > div {
    max-width: 260px;
    font-family: var(--font-sans);
    font-size: var(--fs-sec);
    color: var(--text);
    text-align: left;
    line-height: 1.4;
  }

  .corner-echo {
    position: absolute;
    top: 22px;
    right: 34px;
    opacity: .55;
    z-index: 1;
  }
</style>
</head>
<body data-page="20" data-total="20">
<div id="stage">

  <svg class="corner-echo" width="150" height="56" viewBox="0 0 150 56" aria-hidden="true">
    <path d="M4 14 C 50 14, 100 14, 144 14" fill="none" stroke="var(--forward)" stroke-width="2"/>
    <path d="M136 8 L144 14 L136 20" fill="none" stroke="var(--forward)" stroke-width="2"/>
    <path d="M144 42 C 100 42, 50 42, 4 42" fill="none" stroke="var(--backward)" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M12 36 L4 42 L12 48" fill="none" stroke="var(--backward)" stroke-width="2" stroke-dasharray="5 4"/>
  </svg>

  <div class="layout-close wide">
    <span class="kicker">课程收束</span>
    <h1>从一个神经元到反向传播</h1>

    <div class="k-process chain-process">
      <div class="step">
        <div class="st-label">神经元</div>
        <div class="st-body">输入加权求和,过一次非线性</div>
      </div>
      <div class="arw"></div>
      <div class="step">
        <div class="st-label">网络</div>
        <div class="st-body">多个神经元并排堆成一层,多层堆叠成网络</div>
      </div>
      <div class="arw"></div>
      <div class="step">
        <div class="st-label">损失</div>
        <div class="st-body">把预测的错误量化成一个数字</div>
      </div>
      <div class="arw"></div>
      <div class="step">
        <div class="st-label">梯度下降</div>
        <div class="st-body">沿着损失下降最快的反方向挪动参数</div>
      </div>
      <div class="arw"></div>
      <div class="step backward-step">
        <div class="st-label">反向传播</div>
        <div class="st-body">用链式法则把误差精确分配给每一层的每一个参数</div>
      </div>
    </div>

    <div class="roadmap">
      <div>更聪明的更新方式<br>(动量、自适应学习率)</div>
      <div>专门处理图像的<br>卷积网络</div>
      <div>处理序列的<br>循环网络</div>
    </div>
  </div>

</div>
<script src="assets/base.js"></script>
</body>
</html>
