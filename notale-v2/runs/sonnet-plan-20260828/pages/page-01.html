<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .cover-wrap{
    flex:1; display:flex; gap:40px; min-height:0; align-items:stretch;
  }
  .cover-text{
    flex: 0 0 420px; display:flex; flex-direction:column; justify-content:center; gap:18px; min-width:0;
  }
  .cover-text h1{ font-size:44px; line-height:1.15; }
  .cover-vis{
    flex:1; min-width:0; display:flex; flex-direction:column; gap:10px;
  }
  .cvbox{ flex:1; min-height:0; position:relative; }
  .cover-vis .hint{ align-self:flex-start; }
</style>
</head>
<body data-page="01" data-total="20">
<div id="stage">
  <div class="cover-wrap">
    <div class="cover-text">
      <div>
        <span class="kicker">神经网络是怎么学会的</span>
        <h1>从一个神经元到反向传播</h1>
      </div>
      <p class="lead">三十分钟，把"学习"拆成能亲手转动的旋钮。</p>
    </div>
    <div class="cover-vis">
      <div class="cvbox">
        <canvas id="cv" class="cv-fill"></canvas>
      </div>
      <span class="hint">翻到最后一页，你会看到这张图变干净。</span>
    </div>
  </div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lib/mlp.js"></script>
<script>
(function(){
  var rng = new Math.seedrandom('page-01');
  // 生成 200 个点，按四象限交替标签（近似 XOR 花纹）
  var data = [];
  for (var i = 0; i < 200; i++) {
    var x = (rng() * 2 - 1) * 1.2;
    var y = (rng() * 2 - 1) * 1.2;
    var t = (x >= 0) === (y >= 0) ? 1 : 0;
    data.push({ x: [x, y], t: t });
  }

  var net = MLP.create({ sizes: [2, 10, 10, 1], act: 'tanh', lr: 0.3, seed: 7 });

  var cv = document.getElementById('cv');

  function draw() {
    var ctx = Deck.fit(cv);
    var w = cv.clientWidth, h = cv.clientHeight;
    var nx = 80, ny = 80;
    var field = net.field(-1.3, -1.3, 1.3, 1.3, nx, ny);

    var img = ctx.createImageData(nx, ny);
    for (var j = 0; j < ny; j++) {
      for (var i2 = 0; i2 < nx; i2++) {
        var v = field[j * nx + i2]; // 0..1
        var idx = (j * nx + i2) * 4;
        // forward 蓝 (低) -> backward 橙 (高)，中性未训练时几乎全灰蓝
        var c0 = [220, 231, 243]; // forward-soft
        var c1 = [251, 230, 214]; // backward-soft
        var r = c0[0] + (c1[0] - c0[0]) * v;
        var g = c0[1] + (c1[1] - c0[1]) * v;
        var b = c0[2] + (c1[2] - c0[2]) * v;
        img.data[idx] = r;
        img.data[idx + 1] = g;
        img.data[idx + 2] = b;
        img.data[idx + 3] = 255;
      }
    }
    // 用离屏 canvas 缩放绘制成平滑热力图
    var off = document.createElement('canvas');
    off.width = nx; off.height = ny;
    off.getContext('2d').putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off, 0, 0, nx, ny, 0, 0, w, h);

    // 叠加散点
    var pad = 6;
    function toPx(px, py) {
      var sx = (px + 1.3) / 2.6 * w;
      var sy = (py + 1.3) / 2.6 * h;
      return [sx, h - sy];
    }
    for (var k = 0; k < data.length; k++) {
      var p = data[k];
      var xy = toPx(p.x[0], p.x[1]);
      ctx.beginPath();
      ctx.arc(xy[0], xy[1], 4, 0, Math.PI * 2);
      ctx.fillStyle = p.t === 1 ? Deck.rgba('--forward', 0.9) : Deck.rgba('--backward', 0.9);
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 1;
      ctx.fill();
      ctx.stroke();
    }
  }

  Deck.autofit(cv, draw);
  Deck.init({ index: 1, total: 20 });
})();
</script>
</body>
</html>
