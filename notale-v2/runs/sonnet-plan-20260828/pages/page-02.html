<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/lib/katex.min.css">
<style>
  #stage { gap: 20px; }
  .head { flex: none; display: flex; flex-direction: column; gap: 4px; }
  .wire {
    fill: none;
    stroke: var(--weight);
    stroke-linecap: round;
    transition: stroke-width .08s linear;
  }
  .arrowhead { fill: var(--weight); }
  .node-circle { fill: var(--paper); stroke: var(--forward); stroke-width: 2.5; }
  .in-circle { fill: var(--forward-soft); stroke: var(--forward); stroke-width: 2; }
  .in-label, .wlabel { font-family: var(--font-mono); fill: var(--text); }
  .in-label { font-size: 17px; }
  .wlabel { font-size: 15px; fill: var(--muted); }
  .node-z-tag { font-family: var(--font-mono); font-size: 13px; fill: var(--muted); }
  .node-z-val { font-family: var(--font-mono); font-size: 26px; font-weight: 600; fill: var(--text); }
  .formula-static { flex: none; display: flex; justify-content: center; padding: 4px 0 0; }
  .formula-static .katex { font-size: 20px !important; }
  .subst-line { flex: none; display: flex; align-items: baseline; justify-content: center; gap: 14px; padding-bottom: 2px; }
  .subst-line .katex { font-size: 20px !important; }
  .side-block { display: flex; flex-direction: column; gap: 6px; }
  .side-block label { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: var(--fs-label); color: var(--text); }
</style>
</head>
<body data-page="02" data-total="20">
<div id="stage">

  <div class="head">
    <span class="kicker">神经元 · 加权求和</span>
    <h1>一个神经元只做一件事:把输入按权重加起来,再加一个偏置</h1>
  </div>

  <div class="layout-focus">

    <div class="stage-main min0">
      <div class="formula-static" id="formulaStatic"></div>

      <div class="cvbox" style="flex:1;">
        <svg id="circuit" viewBox="0 0 700 460" style="width:100%;height:100%;" role="img" aria-label="两个输入端子经加权导线汇入求和节点的电路图">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" class="arrowhead"></path>
            </marker>
          </defs>

          <circle class="in-circle" cx="80" cy="130" r="34"></circle>
          <text class="in-label" x="80" y="136" text-anchor="middle">x₁=1</text>

          <circle class="in-circle" cx="80" cy="340" r="34"></circle>
          <text class="in-label" x="80" y="346" text-anchor="middle">x₂=1</text>

          <path id="wire1" class="wire" d="M114,130 C 280,130 320,190 470,225" marker-end="url(#arrow)"></path>
          <text id="w1Label" class="wlabel" x="230" y="120" text-anchor="middle">w1=0.80</text>

          <path id="wire2" class="wire" d="M114,340 C 280,340 320,270 470,245" marker-end="url(#arrow)"></path>
          <text id="w2Label" class="wlabel" x="230" y="360" text-anchor="middle">w2=-0.50</text>

          <circle class="node-circle" cx="560" cy="235" r="78"></circle>
          <text class="node-z-tag" x="560" y="210" text-anchor="middle">加权和 z</text>
          <text id="nodeZ" class="node-z-val num" x="560" y="248" text-anchor="middle">0.40</text>
        </svg>
      </div>

      <div class="subst-line">
        <span id="substKatex"></span>
        <span id="zReadout" class="big sm num">= 0.40</span>
      </div>
    </div>

    <div class="stage-side">
      <div class="panel side-block">
        <label for="w1Slider">w₁ <span class="num" id="w1val">0.80</span></label>
        <input type="range" id="w1Slider" min="-2" max="2" step="0.05" value="0.8">
        <span class="note">范围 -2 ~ 2,拖动改变第一条导线的粗细</span>
      </div>
      <div class="panel side-block">
        <label for="w2Slider">w₂ <span class="num" id="w2val">-0.50</span></label>
        <input type="range" id="w2Slider" min="-2" max="2" step="0.05" value="-0.5">
        <span class="note">范围 -2 ~ 2,拖动改变第二条导线的粗细</span>
      </div>
      <div class="panel side-block">
        <label for="bSlider">b <span class="num" id="bval">0.10</span></label>
        <input type="range" id="bSlider" min="-2" max="2" step="0.05" value="0.1">
        <span class="note">偏置,不依附任何输入,直接加进 z</span>
      </div>
      <span class="hint">导线越粗,这一路输入对 z 的话越重</span>
    </div>

  </div>
</div>

<script src="assets/base.js"></script>
<script src="assets/lib/katex.min.js"></script>
<script>
  Deck.init({ index: 2, total: 20 });

  var w1Slider = document.getElementById('w1Slider');
  var w2Slider = document.getElementById('w2Slider');
  var bSlider  = document.getElementById('bSlider');

  var w1valEl = document.getElementById('w1val');
  var w2valEl = document.getElementById('w2val');
  var bvalEl  = document.getElementById('bval');

  var wire1 = document.getElementById('wire1');
  var wire2 = document.getElementById('wire2');
  var w1Label = document.getElementById('w1Label');
  var w2Label = document.getElementById('w2Label');
  var nodeZ = document.getElementById('nodeZ');
  var zReadout = document.getElementById('zReadout');
  var substKatexEl = document.getElementById('substKatex');

  katex.render('z = w_1x_1 + w_2x_2 + b', document.getElementById('formulaStatic'), { throwOnError: false });

  function fmtTerm(v) {
    return v < 0 ? '(' + v.toFixed(2) + ')' : v.toFixed(2);
  }

  function update() {
    var w1 = parseFloat(w1Slider.value);
    var w2 = parseFloat(w2Slider.value);
    var b  = parseFloat(bSlider.value);
    var x1 = 1, x2 = 1;
    var z = w1 * x1 + w2 * x2 + b;

    w1valEl.textContent = w1.toFixed(2);
    w2valEl.textContent = w2.toFixed(2);
    bvalEl.textContent  = b.toFixed(2);

    wire1.style.strokeWidth = (2 + Math.abs(w1) * 6).toFixed(2);
    wire2.style.strokeWidth = (2 + Math.abs(w2) * 6).toFixed(2);

    w1Label.textContent = 'w1=' + w1.toFixed(2);
    w2Label.textContent = 'w2=' + w2.toFixed(2);

    nodeZ.textContent = z.toFixed(2);
    zReadout.textContent = '= ' + z.toFixed(2);

    katex.render(
      'z = ' + fmtTerm(w1) + '\\times 1 + ' + fmtTerm(w2) + '\\times 1 + ' + fmtTerm(b),
      substKatexEl,
      { throwOnError: false }
    );
  }

  w1Slider.addEventListener('input', update);
  w2Slider.addEventListener('input', update);
  bSlider.addEventListener('input', update);

  update();
</script>
</body>
</html>
