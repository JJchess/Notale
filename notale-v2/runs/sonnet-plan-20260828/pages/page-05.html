<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .col-text h1 { margin-top: 6px; }
  .xr-panel { display: flex; flex-direction: column; gap: 10px; }
  .xr-row { display: flex; flex-direction: column; gap: 4px; }
  .xr-row .rowhead { display: flex; justify-content: space-between; align-items: baseline; }
  .xr-row .rowhead .lbl { font-size: var(--fs-label); color: var(--muted); }
  .xr-row .rowhead .val { font-family: var(--font-mono); font-size: var(--fs-label); color: var(--text); font-variant-numeric: tabular-nums; }
  .xr-manual-acc { font-size: var(--fs-label); color: var(--muted); }
  .xr-manual-acc .num { color: var(--text); font-weight: 600; }
  .xr-train-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .xr-trace { font-family: var(--font-mono); font-size: var(--fs-tick); color: var(--muted); letter-spacing: 0.02em; }
  .xr-legend { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; font-size: var(--fs-label); color: var(--muted); }
  .xr-legend .li { display: flex; align-items: center; gap: 6px; }
  .xr-legend .mk { display: inline-block; width: 12px; height: 12px; }
  .xr-legend .mk.fill { border-radius: 50%; background: var(--text); }
  .xr-legend .mk.open { border-radius: 50%; border: 2px solid var(--muted); background: transparent; }
  .xr-legend .ln { display: inline-block; width: 20px; height: 0; border-top: 2px dashed var(--weight); }
  .xr-legend .ln.solid { border-top: 3px solid var(--forward); }
  .xr-plotwrap { flex: 1; min-height: 0; display: flex; }
  .xr-plotwrap .cvbox { flex: 1; min-height: 0; }
  #xrSvg { display: block; }
</style>
</head>
<body data-page="05" data-total="20">
<div id="stage">
  <div class="layout-split">
    <div class="col-text min0">
      <div>
        <span class="kicker">局限 · 单层网络</span>
        <h1>棋盘格四簇点，一条直线永远劈不对</h1>
        <p class="lead" style="margin-top:10px;">四象限对角同色：第一、三象限记为 1，第二、四象限记为 0。手动调直线，或者让算法自己训练——都试一次。</p>
      </div>

      <div class="panel xr-panel">
        <div class="xr-row">
          <div class="rowhead"><span class="lbl">w1（横向权重）</span><span class="val num" id="vW1">1.00</span></div>
          <input type="range" id="sW1" min="-3" max="3" step="0.05" value="1">
        </div>
        <div class="xr-row">
          <div class="rowhead"><span class="lbl">w2（纵向权重）</span><span class="val num" id="vW2">1.00</span></div>
          <input type="range" id="sW2" min="-3" max="3" step="0.05" value="1">
        </div>
        <div class="xr-row">
          <div class="rowhead"><span class="lbl">b（偏置）</span><span class="val num" id="vB">0.00</span></div>
          <input type="range" id="sB" min="-3" max="3" step="0.05" value="0">
        </div>
        <div class="xr-manual-acc">手动这条线（虚线）的正确率：<span class="num" id="manualAcc">—</span></div>
      </div>

      <div class="panel xr-panel">
        <div class="xr-train-head">
          <div class="btns">
            <button class="btn primary" id="btnTrain">尝试训练</button>
            <button class="btn" id="btnReset">重置网络</button>
          </div>
        </div>
        <div>
          <span class="big" id="acc">0.50</span><span class="unit">验证集正确率</span>
        </div>
        <div class="xr-trace" id="trace" aria-live="polite">尚未训练</div>
        <div class="hint">一条直线，天生分不开这种棋盘格。</div>
      </div>
    </div>

    <div class="col-vis min0">
      <div class="xr-plotwrap">
        <div class="cvbox">
          <svg id="xrSvg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </div>
      <div class="xr-legend" style="margin-top:10px;">
        <span class="li"><span class="mk fill"></span>标签 1（第一、三象限）</span>
        <span class="li"><span class="mk open"></span>标签 0（第二、四象限）</span>
        <span class="li"><span class="ln"></span>手动直线</span>
        <span class="li"><span class="ln solid"></span>训练出的边界</span>
      </div>
    </div>
  </div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lib/mlp.js"></script>
<script>
(function(){
  "use strict";

  // ---------- data: four-quadrant checkerboard, seeded ----------
  var rng = new Math.seedrandom('page-05');
  function jitter(){ return (rng()*2 - 1) * 0.28; } // stays within [0.32,0.88] of 0.6 center, never crosses axis

  var clusters = [
    { cx: 0.6,  cy: 0.6,  t: 1 },
    { cx: -0.6, cy: 0.6,  t: 0 },
    { cx: -0.6, cy: -0.6, t: 1 },
    { cx: 0.6,  cy: -0.6, t: 0 }
  ];

  var trainSet = [], valSet = [];
  clusters.forEach(function(c){
    for (var i = 0; i < 10; i++){
      trainSet.push({ x: [c.cx + jitter(), c.cy + jitter()], t: c.t });
    }
    for (var j = 0; j < 5; j++){
      valSet.push({ x: [c.cx + jitter(), c.cy + jitter()], t: c.t });
    }
  });
  var allPoints = trainSet.concat(valSet);

  // ---------- network ----------
  var net = MLP.create({ sizes: [2, 1], act: 'sigmoid', lr: 0.3, seed: 5 });
  var trainClicks = 0;
  var accTrace = [];

  // ---------- plot geometry ----------
  var PAD = 40, SZ = 800 - PAD * 2;
  var XMIN = -1.3, XMAX = 1.3, YMIN = -1.3, YMAX = 1.3;
  function toPx(x, y){
    return [
      PAD + (x - XMIN) / (XMAX - XMIN) * SZ,
      PAD + SZ - (y - YMIN) / (YMAX - YMIN) * SZ
    ];
  }

  var svg = document.getElementById('xrSvg');
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // static chrome: axes + quadrant guide lines
  var axesG = el('g', {});
  var o1 = toPx(XMIN, 0), o2 = toPx(XMAX, 0);
  var o3 = toPx(0, YMIN), o4 = toPx(0, YMAX);
  axesG.appendChild(el('line', { x1:o1[0], y1:o1[1], x2:o2[0], y2:o2[1], stroke:'var(--line)', 'stroke-width':1.5 }));
  axesG.appendChild(el('line', { x1:o3[0], y1:o3[1], x2:o4[0], y2:o4[1], stroke:'var(--line)', 'stroke-width':1.5 }));
  var frame = toPx(XMIN,YMIN).concat(toPx(XMAX,YMAX));
  axesG.appendChild(el('rect', { x:frame[0], y:frame[3], width:(frame[2]-frame[0]), height:(frame[1]-frame[3]), fill:'none', stroke:'var(--line-strong)', 'stroke-width':1.5, rx:4 }));
  svg.appendChild(axesG);

  // data points
  var ptsG = el('g', {});
  allPoints.forEach(function(p){
    var px = toPx(p.x[0], p.x[1]);
    if (p.t === 1){
      ptsG.appendChild(el('circle', { cx:px[0], cy:px[1], r:7, fill:'var(--text)' }));
    } else {
      ptsG.appendChild(el('circle', { cx:px[0], cy:px[1], r:7, fill:'var(--paper)', stroke:'var(--muted)', 'stroke-width':2.5 }));
    }
  });
  svg.appendChild(ptsG);

  // manual line + trained line (drawn last so they sit above the frame)
  var manualLine = el('line', { stroke:'var(--weight)', 'stroke-width':3, 'stroke-dasharray':'10 8', 'stroke-linecap':'round' });
  var trainedLine = el('line', { stroke:'var(--forward)', 'stroke-width':3.5, 'stroke-linecap':'round' });
  svg.appendChild(manualLine);
  svg.appendChild(trainedLine);

  function sigmoid(z){ return 1 / (1 + Math.exp(-z)); }

  function lineSegmentInBox(w1, w2, b){
    // find where w1*x + w2*y + b = 0 crosses the plot box edges
    var pts = [];
    function tryX(x){
      if (Math.abs(w2) < 1e-9) return;
      var y = -(w1 * x + b) / w2;
      if (y >= YMIN && y <= YMAX) pts.push([x, y]);
    }
    function tryY(y){
      if (Math.abs(w1) < 1e-9) return;
      var x = -(w2 * y + b) / w1;
      if (x >= XMIN && x <= XMAX) pts.push([x, y]);
    }
    tryX(XMIN); tryX(XMAX); tryY(YMIN); tryY(YMAX);
    // dedupe near-identical points, keep first two distinct
    var out = [];
    for (var i = 0; i < pts.length && out.length < 2; i++){
      var dup = out.some(function(q){ return Math.abs(q[0]-pts[i][0]) < 1e-6 && Math.abs(q[1]-pts[i][1]) < 1e-6; });
      if (!dup) out.push(pts[i]);
    }
    return out.length === 2 ? out : null;
  }

  function setLine(lineEl, w1, w2, b){
    var seg = lineSegmentInBox(w1, w2, b);
    if (!seg){ lineEl.setAttribute('opacity', '0'); return; }
    var a = toPx(seg[0][0], seg[0][1]), c = toPx(seg[1][0], seg[1][1]);
    lineEl.setAttribute('x1', a[0]); lineEl.setAttribute('y1', a[1]);
    lineEl.setAttribute('x2', c[0]); lineEl.setAttribute('y2', c[1]);
    lineEl.setAttribute('opacity', '1');
  }

  function boundaryFromNet(net){
    // single-neuron sigmoid boundary is exactly linear; probe edges of box for the 0.5 crossing
    var steps = 240, cross = [];
    var edges = [
      [XMIN,YMIN, XMAX,YMIN],
      [XMAX,YMIN, XMAX,YMAX],
      [XMAX,YMAX, XMIN,YMAX],
      [XMIN,YMAX, XMIN,YMIN]
    ];
    edges.forEach(function(e){
      var prevP = null, prevX = e[0], prevY = e[1];
      for (var i = 0; i <= steps; i++){
        var t = i / steps;
        var x = e[0] + (e[2]-e[0]) * t, y = e[1] + (e[3]-e[1]) * t;
        var p = net.predict([x, y]);
        if (prevP !== null && (prevP - 0.5) * (p - 0.5) < 0){
          var t2 = (0.5 - prevP) / (p - prevP);
          cross.push([prevX + (x-prevX)*t2, prevY + (y-prevY)*t2]);
        }
        prevP = p; prevX = x; prevY = y;
      }
    });
    return cross.length >= 2 ? [cross[0], cross[1]] : null;
  }

  function setTrainedLineFromNet(){
    var seg = boundaryFromNet(net);
    if (!seg){ trainedLine.setAttribute('opacity','0'); return; }
    var a = toPx(seg[0][0], seg[0][1]), c = toPx(seg[1][0], seg[1][1]);
    trainedLine.setAttribute('x1', a[0]); trainedLine.setAttribute('y1', a[1]);
    trainedLine.setAttribute('x2', c[0]); trainedLine.setAttribute('y2', c[1]);
    trainedLine.setAttribute('opacity', '1');
  }

  // ---------- manual sliders ----------
  var sW1 = document.getElementById('sW1'), sW2 = document.getElementById('sW2'), sB = document.getElementById('sB');
  var vW1 = document.getElementById('vW1'), vW2 = document.getElementById('vW2'), vB = document.getElementById('vB');
  var manualAccEl = document.getElementById('manualAcc');

  function updateManual(){
    var w1 = parseFloat(sW1.value), w2 = parseFloat(sW2.value), b = parseFloat(sB.value);
    vW1.textContent = w1.toFixed(2);
    vW2.textContent = w2.toFixed(2);
    vB.textContent = b.toFixed(2);
    setLine(manualLine, w1, w2, b);
    var correct = 0;
    allPoints.forEach(function(p){
      var pred = sigmoid(w1*p.x[0] + w2*p.x[1] + b) >= 0.5 ? 1 : 0;
      if (pred === p.t) correct++;
    });
    manualAccEl.textContent = (correct / allPoints.length).toFixed(2);
  }
  [sW1, sW2, sB].forEach(function(s){ s.addEventListener('input', updateManual); });

  // ---------- training ----------
  var accEl = document.getElementById('acc');
  var traceEl = document.getElementById('trace');
  var btnTrain = document.getElementById('btnTrain');
  var btnReset = document.getElementById('btnReset');

  function refreshNetView(){
    var res = net.evaluate(valSet);
    accEl.textContent = res.acc.toFixed(2);
    setTrainedLineFromNet();
    return res.acc;
  }

  function pushTrace(acc){
    accTrace.push(acc);
    if (accTrace.length > 6) accTrace.shift();
    traceEl.textContent = trainClicks === 0
      ? '尚未训练'
      : ('已训练 ' + trainClicks + ' 轮 · 正确率轨迹 ' + accTrace.map(function(a){ return a.toFixed(2); }).join(' · '));
  }

  btnTrain.addEventListener('click', function(){
    for (var i = 0; i < 14; i++){
      net.step(trainSet, 16);
      if (net.diverged) break;
    }
    trainClicks++;
    var acc = refreshNetView();
    pushTrace(acc);
  });

  btnReset.addEventListener('click', function(){
    net.reset();
    trainClicks = 0;
    accTrace = [];
    var acc = refreshNetView();
    traceEl.textContent = '尚未训练';
  });

  // ---------- initial paint ----------
  updateManual();
  refreshNetView();
  pushTrace(net.evaluate(valSet).acc);
  traceEl.textContent = '尚未训练';
})();
</script>
</body>
</html>
