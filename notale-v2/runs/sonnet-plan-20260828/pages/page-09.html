<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/lib/echarts.min.js"></script>
<style>
  .page-head{ flex:none; display:flex; flex-direction:column; gap:8px; max-width:1180px; margin-bottom:16px; }
  .formula{
    font-family:var(--font-mono); font-size:16px; color:var(--text);
    background:var(--paper); border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    padding:8px 14px; display:inline-block; margin-top:2px;
  }
  .formula .fixed{ color:var(--muted); }

  .stage-main .cvbox{ flex:1; min-height:0; }
  #heatChart{ width:100%; height:100%; }

  .chart-legend{ flex:none; display:flex; align-items:center; gap:22px; margin-top:10px; }

  .side-readout{ display:flex; flex-direction:column; gap:10px; }
  .row-num{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .row-num .k{ font-size:var(--fs-label); color:var(--muted); }
  .row-num .v{ font-size:24px; }

  .step-note{ font-size:var(--fs-tick); color:var(--muted); font-family:var(--font-mono); }

  #stepBtn[disabled]{ opacity:.45; cursor:not-allowed; }
</style>
</head>
<body data-page="09" data-total="20">
<div id="stage">

  <div class="page-head">
    <span class="kicker">损失曲面 · 梯度下降</span>
    <h1>训练就是让一个球,沿着损失地形最陡的下坡方向,一步步往下滚</h1>
    <p class="lead">固定隐藏层输出 <span class="num">h1=0.645</span>、<span class="num">h2=0.525</span> 和输出偏置 <span class="num">b_out=0.2</span>(第七页算出的值),真实标签 <span class="num">t=1</span>。损失就只随两个输出权重 v1、v2 变化:</p>
    <span class="formula">L(v1,v2) = −ln σ(v1×<span class="fixed">0.645</span> + v2×<span class="fixed">0.525</span> + <span class="fixed">0.2</span>)</span>
  </div>

  <div class="layout-focus">
    <div class="stage-main">
      <figure class="cvbox" style="margin:0;">
        <div id="heatChart" role="img" aria-label="损失地形热力图:横轴 v1、纵轴 v2 取值 -2 到 2,颜色越暖(红)损失越高、越冷(蓝)损失越低,地形在 v1 为正、v2 为负的区域偏低。图上一个深色圆点是第七页实际取值,点击按钮后会沿最陡下降方向移动并留下轨迹。"></div>
      </figure>
      <figcaption class="chart-legend small">
        <span class="legend">
          <span class="li"><span class="sw" style="background:#2457A6;width:18px;height:2px;border-radius:0;"></span>移动轨迹</span>
          <span class="li"><span class="sw" style="background:#17232F;"></span>当前点</span>
          <span class="li"><span class="sw" style="background:#5B6B78;border-radius:0;transform:rotate(45deg);width:10px;height:10px;"></span>起点(第七页取值)</span>
        </span>
      </figcaption>
    </div>

    <div class="stage-side">
      <div class="panel side-readout">
        <div class="row-num"><span class="k">v1</span><span class="v num" id="rv1">0.70</span></div>
        <div class="row-num"><span class="k">v2</span><span class="v num" id="rv2">−0.40</span></div>
        <div class="row-num"><span class="k">损失 L</span><span class="v num" id="rL" style="color:var(--loss);">0.497</span></div>
      </div>

      <div class="btns">
        <button class="btn primary" id="stepBtn" type="button">沿最陡方向挪一步</button>
      </div>

      <div class="step-note" id="stepNote" aria-live="polite">已挪动 0 步</div>

      <p class="note">这一步的方向是怎么算出来的,下一页拆开;这里只看"往损失变小的地方挪"这件事。</p>
    </div>
  </div>
</div>
<script src="assets/base.js"></script>
<script>
(function(){
  Deck.init({ index: 9, total: 20, keys: true });

  // ---- 损失函数与梯度(与第七页数值一致) ----
  var H1 = 0.645, H2 = 0.525, BOUT = 0.2;
  function sigmoid(z){ return 1/(1+Math.exp(-z)); }
  function lossAt(v1, v2){
    var z = v1*H1 + v2*H2 + BOUT;
    return -Math.log(sigmoid(z));
  }
  function gradAt(v1, v2){
    var z = v1*H1 + v2*H2 + BOUT;
    var s = sigmoid(z);
    var dz = s - 1; // t=1
    return [dz*H1, dz*H2];
  }
  function stepMove(v1, v2, size){
    var g = gradAt(v1, v2);
    var norm = Math.hypot(g[0], g[1]);
    if (norm < 1e-6) return [v1, v2];
    var dir = [-g[0]/norm, -g[1]/norm];
    return [v1 + size*dir[0], v2 + size*dir[1]];
  }

  // ---- 网格数据(静态,只算一次) ----
  var N = 27, STEP = 4/(N-1);
  var gridData = [];
  var lmin = Infinity, lmax = -Infinity;
  for (var i=0;i<N;i++){
    for (var j=0;j<N;j++){
      var v1 = -2 + STEP*i, v2 = -2 + STEP*j;
      var l = lossAt(v1, v2);
      gridData.push([v1, v2, l]);
      if (l < lmin) lmin = l;
      if (l > lmax) lmax = l;
    }
  }

  var START = [0.7, -0.4];
  var state = { path: [START.slice()], current: START.slice(), steps: 0 };

  var host = document.getElementById('heatChart');
  var chart = echarts.init(host, null, { renderer: 'svg' });

  var GRID = { left: 60, right: 108, top: 18, bottom: 44 };

  function cellPixelSize(){
    var w = chart.getWidth(), h = chart.getHeight();
    var pxPerUnitX = (w - GRID.left - GRID.right) / 4;
    var pxPerUnitY = (h - GRID.top - GRID.bottom) / 4;
    return [pxPerUnitX*STEP + 1, pxPerUnitY*STEP + 1];
  }

  function render(){
    var sw = cellPixelSize();
    chart.setOption({
      animation: false,
      grid: GRID,
      xAxis: {
        type: 'value', min: -2, max: 2, name: 'v1',
        nameLocation: 'middle', nameGap: 26,
        nameTextStyle: { fontSize: 14, color: '#17232F' },
        axisLabel: { fontSize: 13, color: '#5B6B78' },
        splitLine: { show: false },
        axisLine: { lineStyle: { color: '#8FA0AC' } }
      },
      yAxis: {
        type: 'value', min: -2, max: 2, name: 'v2',
        nameLocation: 'middle', nameGap: 34,
        nameTextStyle: { fontSize: 14, color: '#17232F' },
        axisLabel: { fontSize: 13, color: '#5B6B78' },
        splitLine: { show: false },
        axisLine: { lineStyle: { color: '#8FA0AC' } }
      },
      visualMap: {
        min: lmin, max: lmax, dimension: 2, seriesIndex: 0,
        orient: 'vertical', right: 8, top: 18, itemWidth: 12, itemHeight: 130,
        calculable: false,
        text: ['损失高', '损失低'],
        textStyle: { fontSize: 12, color: '#5B6B78' },
        inRange: { color: ['#2457A6', '#EEF2F5', '#B23A48'] }
      },
      tooltip: { show: false },
      series: [
        {
          name: '损失', type: 'scatter', data: gridData,
          symbol: 'rect', symbolSize: sw, silent: true, z: 1,
          itemStyle: { opacity: 0.96 }
        },
        {
          name: '轨迹', type: 'line', data: state.path,
          showSymbol: false, z: 2,
          lineStyle: { color: '#2457A6', width: 2.5 }
        },
        {
          name: '起点', type: 'scatter', data: [START],
          symbol: 'diamond', symbolSize: 12, z: 3,
          itemStyle: { color: '#5B6B78' }
        },
        {
          name: '当前点', type: 'scatter', data: [state.current],
          symbol: 'circle', symbolSize: 16, z: 4,
          itemStyle: { color: '#17232F', borderColor: '#fff', borderWidth: 2 }
        }
      ]
    }, { notMerge: true });
  }

  function fmt(n){ return (n<0?'−':'') + Math.abs(n).toFixed(2); }

  function updateReadout(){
    document.getElementById('rv1').textContent = fmt(state.current[0]);
    document.getElementById('rv2').textContent = fmt(state.current[1]);
    document.getElementById('rL').textContent = lossAt(state.current[0], state.current[1]).toFixed(3);
    var note = document.getElementById('stepNote');
    note.textContent = '已挪动 ' + state.steps + ' 步 · v1=' + fmt(state.current[0]) +
      ' v2=' + fmt(state.current[1]) + ' L=' + lossAt(state.current[0], state.current[1]).toFixed(3);
  }

  var STEP_SIZE = 0.15, MAX_STEPS = 8;
  var btn = document.getElementById('stepBtn');
  btn.addEventListener('click', function(){
    var g = gradAt(state.current[0], state.current[1]);
    var gnorm = Math.hypot(g[0], g[1]);
    var next = stepMove(state.current[0], state.current[1], STEP_SIZE);
    state.current = next;
    state.path.push(next.slice());
    state.steps++;
    render();
    updateReadout();
    if (state.steps >= MAX_STEPS || gnorm < 0.03){
      btn.disabled = true;
      document.getElementById('stepNote').textContent += ' · 已接近谷底';
    }
  });

  render();
  updateReadout();

  var ro = new ResizeObserver(function(){ chart.resize(); render(); });
  ro.observe(host);
})();
</script>
</body>
</html>
