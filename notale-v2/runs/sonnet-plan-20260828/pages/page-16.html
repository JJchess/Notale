<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .p16-head { flex: none; display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
  .p16-head .lead { max-width: 1100px; }

  .p16-vis { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .p16-stage-box {
    position: relative; width: 500px; height: 500px; flex: none;
    align-self: flex-start;
  }
  .p16-stage-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: var(--radius); }
  .p16-stage-box svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .p16-axislabel { font-family: var(--font-mono); font-size: var(--fs-tick); color: var(--muted); }

  .p16-quad-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .p16-quad-row .btn { font-size: var(--fs-label); padding: 7px 12px; }
  .p16-quad-row .btn.active { border-color: var(--forward); background: var(--forward-soft); }

  .p16-readout { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .p16-readout .num { font-size: 22px; }

  .p16-text { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .p16-chart-panel { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .p16-chart-panel svg { width: 100%; height: 360px; }

  .p16-bar-label { font-family: var(--font-mono); font-size: var(--fs-tick); fill: var(--muted); }
  .p16-bar-val { font-family: var(--font-mono); font-size: var(--fs-tick); fill: var(--text); font-variant-numeric: tabular-nums; }

  .p16-legend-row { display: flex; gap: 18px; align-items: center; }
</style>
</head>
<body data-page="16" data-total="20">
<div id="stage">

  <div class="p16-head">
    <span class="kicker">隐藏层内部 · 训练完成后的快照</span>
    <h1>同一个隐藏层，给不同象限配了不同的特征组合</h1>
    <p class="lead">左边是第十五页训练好的那个网络的决策边界，点里的每一个点，都能在右边看到它经过 10 个隐藏神经元后留下的激活值。换一个象限里的点，好几根条会翻转符号。</p>
  </div>

  <div class="layout-split" style="gap:36px;">

    <div class="col-vis min0 p16-vis" style="flex:1;">
      <div class="p16-stage-box cvbox" id="p16box">
        <canvas id="p16field"></canvas>
        <svg id="p16pts" viewBox="0 0 560 560"></svg>
      </div>
      <div class="p16-quad-row" id="p16quads"></div>
      <div class="p16-readout">
        <span class="small">已选中点 <span class="num" id="p16coord">(0.00, 0.00)</span> · 真实类别 <span class="num" id="p16label">0</span></span>
        <span class="small" id="p16acc"></span>
      </div>
      <div class="legend p16-legend-row">
        <span class="li"><span class="sw" style="background:var(--forward)"></span>类别 1</span>
        <span class="li"><span class="sw" style="background:var(--backward)"></span>类别 0</span>
        <span class="li"><span class="sw" style="background:var(--text); border-radius:50%; width:12px; height:12px;"></span>当前选中</span>
      </div>
    </div>

    <div class="col-text min0 p16-text" style="flex: 0 0 460px;">
      <div class="panel p16-chart-panel" style="flex:1;">
        <h2 style="font-size:18px;">10 个隐藏神经元的激活值</h2>
        <svg id="p16bars"></svg>
        <span class="small">来自 <span class="tag">net.layers[1].a</span>，范围固定在 −1 到 1（tanh 的输出范围）。</span>
      </div>
      <div class="hint">这不是十个神经元各管一块——是十个数字组成的一套编码：象限相近的点，这套编码也相近；换一个象限，其中几个数字会翻转符号。</div>
    </div>

  </div>

</div>

<script src="assets/lib/seedrandom.min.js"></script>
<script src="assets/lib/mlp.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script src="assets/base.js"></script>
<script>
(function () {
  "use strict";

  // ---------- 1. 数据：与第十五页同一套 seed / 同一种“棋盘状” XOR 分布 ----------
  var rng = new Math.seedrandom("page-16");
  var N = 200;
  var data = [];
  var points = []; // {x,y,t} 供画点/坐标读数用；data 是喂给 net 的 {x:[x,y], t}
  for (var i = 0; i < N; i++) {
    var px = rng() * 2 - 1;
    var py = rng() * 2 - 1;
    var t = ((px > 0) !== (py > 0)) ? 1 : 0; // 棋盘状 XOR：不可线性分割
    points.push({ x: px, y: py, t: t });
    data.push({ x: [px, py], t: t });
  }

  // ---------- 2. 训练一次到收敛，之后只做静态快照，不再更新权重 ----------
  var net = MLP.create({ sizes: [2, 10, 10, 1], act: "tanh", lr: 0.3, seed: 7 });
  for (var s = 0; s < 400 && !net.diverged; s++) {
    net.step(data, 16);
  }
  var evalResult = net.evaluate(data);

  // ---------- 3. 决策边界热力场（80x80），只算一次 ----------
  var FIELD_N = 80;
  var field = net.field(-1, -1, 1, 1, FIELD_N, FIELD_N);

  var fwd = Deck.rgb("--forward");
  var bwd = Deck.rgb("--backward");
  function lerpColor(a, b, tt) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * tt),
      Math.round(a[1] + (b[1] - a[1]) * tt),
      Math.round(a[2] + (b[2] - a[2]) * tt)
    ];
  }

  var small = document.createElement("canvas");
  small.width = FIELD_N; small.height = FIELD_N;
  var sctx = small.getContext("2d");
  var img = sctx.createImageData(FIELD_N, FIELD_N);
  for (var r = 0; r < FIELD_N; r++) {
    for (var c = 0; c < FIELD_N; c++) {
      var v = field[r * FIELD_N + c]; // 0..1，越接近 1 越偏类别1
      var col = lerpColor(bwd, fwd, v);
      // data 行 r=0 对应 y=-1（底部），画布上要放在图像下方 -> 翻转行
      var destRow = FIELD_N - 1 - r;
      var idx = (destRow * FIELD_N + c) * 4;
      // 用较淡的强度，避免盖住散点
      var soft = 0.55;
      img.data[idx] = Math.round(255 - (255 - col[0]) * soft);
      img.data[idx + 1] = Math.round(255 - (255 - col[1]) * soft);
      img.data[idx + 2] = Math.round(255 - (255 - col[2]) * soft);
      img.data[idx + 3] = 255;
    }
  }
  sctx.putImageData(img, 0, 0);

  var fieldCanvas = document.getElementById("p16field");
  var fctx = Deck.fit(fieldCanvas);
  function drawField() {
    var w = fieldCanvas.clientWidth, h = fieldCanvas.clientHeight;
    fctx.clearRect(0, 0, w, h);
    fctx.imageSmoothingEnabled = false;
    fctx.drawImage(small, 0, 0, w, h);
  }
  drawField();
  Deck.onResize(function () { fctx = Deck.fit(fieldCanvas); drawField(); });

  // ---------- 4. 散点叠层（SVG） ----------
  var BOX = 560;
  function toPx(x, y) {
    return [ (x + 1) / 2 * BOX, BOX - (y + 1) / 2 * BOX ];
  }

  var svgPts = document.getElementById("p16pts");
  var ns = "http://www.w3.org/2000/svg";

  var circles = [];
  points.forEach(function (d, idx) {
    var p = toPx(d.x, d.y);
    var c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", p[0].toFixed(1));
    c.setAttribute("cy", p[1].toFixed(1));
    c.setAttribute("r", 4.5);
    c.setAttribute("fill", d.t === 1 ? Deck.token("--forward") : Deck.token("--backward"));
    c.setAttribute("stroke", "#ffffff");
    c.setAttribute("stroke-width", "1");
    c.style.cursor = "pointer";
    c.addEventListener("click", function () { selectPoint(idx); });
    svgPts.appendChild(c);
    circles.push(c);
  });

  var ring = document.createElementNS(ns, "circle");
  ring.setAttribute("r", 10);
  ring.setAttribute("fill", "none");
  ring.setAttribute("stroke", Deck.token("--text"));
  ring.setAttribute("stroke-width", "2.5");
  svgPts.appendChild(ring);

  // ---------- 5. 条形图（d3） ----------
  var barSvg = d3.select("#p16bars");
  var BW = 420, BH = 400;
  barSvg.attr("viewBox", "0 0 " + BW + " " + BH);

  var margin = { left: 118, right: 54, top: 6, bottom: 6 };
  var innerW = BW - margin.left - margin.right;
  var xScale = d3.scaleLinear().domain([-1, 1]).range([0, innerW]);
  var yScale = d3.scaleBand().domain(d3.range(10)).range([margin.top, BH - margin.bottom]).padding(0.3);

  var gRoot = barSvg.append("g").attr("transform", "translate(" + margin.left + ",0)");

  gRoot.append("line")
    .attr("x1", xScale(0)).attr("x2", xScale(0))
    .attr("y1", margin.top).attr("y2", BH - margin.bottom)
    .attr("stroke", "var(--line-strong)").attr("stroke-width", 1.5);

  var barRows = gRoot.selectAll("g.row").data(d3.range(10)).enter().append("g").attr("class", "row");

  var barRects = barRows.append("rect")
    .attr("y", function (i) { return yScale(i); })
    .attr("height", yScale.bandwidth())
    .attr("fill", "var(--forward)");

  var barLabels = barRows.append("text")
    .attr("class", "p16-bar-label")
    .attr("x", -40)
    .attr("y", function (i) { return yScale(i) + yScale.bandwidth() / 2; })
    .attr("dy", "0.35em")
    .attr("text-anchor", "end")
    .text(function (i) { return "n" + (i + 1); });

  var barVals = barRows.append("text")
    .attr("class", "p16-bar-val")
    .attr("y", function (i) { return yScale(i) + yScale.bandwidth() / 2; })
    .attr("dy", "0.35em");

  function updateBars(acts) {
    barRects
      .attr("x", function (i) { return acts[i] >= 0 ? xScale(0) : xScale(acts[i]); })
      .attr("width", function (i) { return Math.abs(xScale(acts[i]) - xScale(0)); });
    barVals
      .attr("x", function (i) { return acts[i] >= 0 ? xScale(acts[i]) + 6 : xScale(acts[i]) - 6; })
      .attr("text-anchor", function (i) { return acts[i] >= 0 ? "start" : "end"; })
      .text(function (i) { return acts[i].toFixed(2); });
  }

  // ---------- 6. 选点 -> 前向计算 -> 更新读数 ----------
  var coordEl = document.getElementById("p16coord");
  var labelEl = document.getElementById("p16label");
  var accEl = document.getElementById("p16acc");
  accEl.textContent = "网络训练后的整体准确率 " + (evalResult.acc * 100).toFixed(1) + "%";

  var current = -1;
  function selectPoint(idx) {
    current = idx;
    var d = points[idx];
    net.predict([d.x, d.y]);
    var acts = Array.prototype.slice.call(net.layers[1].a);
    updateBars(acts);

    var p = toPx(d.x, d.y);
    ring.setAttribute("cx", p[0].toFixed(1));
    ring.setAttribute("cy", p[1].toFixed(1));

    circles.forEach(function (c, i) {
      c.setAttribute("stroke-width", i === idx ? "2.5" : "1");
      c.setAttribute("stroke", i === idx ? Deck.token("--text") : "#ffffff");
    });

    coordEl.textContent = "(" + d.x.toFixed(2) + ", " + d.y.toFixed(2) + ")";
    labelEl.textContent = String(d.t);

    quadBtns.forEach(function (b) { b.el.classList.toggle("active", b.idx === idx); });
  }

  // ---------- 7. 象限预设按钮：键盘可达的等价路径 ----------
  var quadDefs = [
    { name: "象限一（x>0, y>0）", test: function (d) { return d.x > 0.35 && d.y > 0.35; } },
    { name: "象限二（x<0, y>0）", test: function (d) { return d.x < -0.35 && d.y > 0.35; } },
    { name: "象限三（x<0, y<0）", test: function (d) { return d.x < -0.35 && d.y < -0.35; } },
    { name: "象限四（x>0, y<0）", test: function (d) { return d.x > 0.35 && d.y < -0.35; } }
  ];
  var quadRow = document.getElementById("p16quads");
  var quadBtns = [];
  var defaultIdx = -1;
  quadDefs.forEach(function (qd) {
    var found = -1;
    for (var i = 0; i < points.length; i++) { if (qd.test(points[i])) { found = i; break; } }
    if (found < 0) found = 0;
    if (defaultIdx < 0 && qd.name.indexOf("象限一") === 0) defaultIdx = found;
    var btn = document.createElement("button");
    btn.className = "btn";
    btn.type = "button";
    btn.textContent = "选取 " + qd.name + " 内一点";
    btn.addEventListener("click", function () { selectPoint(found); });
    quadRow.appendChild(btn);
    quadBtns.push({ el: btn, idx: found });
  });

  selectPoint(defaultIdx >= 0 ? defaultIdx : 0);

  Deck.init({ index: 16, total: 20 });
})();
</script>
</body>
</html>
