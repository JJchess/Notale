<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .bound-head { flex: none; display:flex; flex-direction:column; gap:8px; max-width:1200px; }
  .bound-row { flex:1; min-height:0; display:flex; gap:24px; margin-top:18px; }
  .bound-panel { flex:1; min-width:0; display:flex; flex-direction:column; gap:10px; }
  .bound-fig { flex:1; min-height:0; }
  .bound-note { flex:none; margin-top:18px; }
  .bound-note p { margin:0; font-size:var(--fs-sec); line-height:1.5; color:var(--text); }
  figcaption.small { margin:0; }
</style>
</head>
<body data-page="18" data-total="20">
<div id="stage">

  <div class="bound-head">
    <span class="kicker">工具边界</span>
    <h1>mlp.js 只实现最基础的梯度下降,这是设计边界,不是遗漏</h1>
    <p class="lead">本课所有交互用的 mlp.js,只做最朴素的梯度下降——不做动量、不做 Adam,也不做多分类。下面用同一片山谷形损失地形做对照:同样的起点,普通梯度下降怎么走,加了动量或 Adam 的版本怎么走。</p>
  </div>

  <div class="bound-row">

    <div class="bound-panel panel" style="min-height:0;">
      <h2>普通梯度下降(这套课讲的、mlp.js 实现的)</h2>
      <div class="bound-fig cvbox">
        <svg id="svg-naive" viewBox="0 0 700 500" role="img" aria-label="示意图:在狭长山谷型损失地形中,梯度下降反复在两壁间震荡横跳,缓慢向谷底推进">
          <title>普通梯度下降在狭长山谷地形中的路径</title>
        </svg>
      </div>
      <figcaption class="small">每一步都沿当前梯度直线迈进,山谷窄的方向坡度陡,于是步子在两壁间反复横跳,谷底方向坡度缓,推进很慢——震荡多、下降慢。</figcaption>
    </div>

    <div class="bound-panel panel" style="min-height:0;">
      <h2>加了"动量"或 Adam 的版本(mlp.js 不实现,业界常用)</h2>
      <div class="bound-fig cvbox">
        <svg id="svg-mom" viewBox="0 0 700 500" role="img" aria-label="示意图:同样的山谷型损失地形中,加了动量或Adam的优化器几乎不震荡,平滑地直冲谷底">
          <title>动量/Adam 优化器在同一地形中的路径</title>
        </svg>
      </div>
      <figcaption class="small">动量记住此前的移动方向,抵消掉两壁间的来回分量,只保留朝谷底的净方向;Adam 还会给每个方向单独调步长。路径几乎不震荡,直冲谷底。</figcaption>
    </div>

  </div>

  <div class="bound-note panel q">
    <p>mlp.js 只做最朴素的梯度下降,不做动量、不做 Adam,也不做多分类。这不是遗漏,是这个文件的设计边界。本课到此为止的所有交互,也都诚实地停在这条边界内。</p>
  </div>

</div>
<script src="assets/base.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  // 共享地形:狭长山谷,长轴水平(缓),短轴垂直(陡),谷底/最小值在右侧
  var minX = 480, minY = 250;
  var contourRx = [220, 175, 130, 90, 55, 30];
  var ryRatio = 0.26;

  function drawTerrain(svg){
    var g = svg.append('g').attr('class','terrain');
    contourRx.forEach(function(rx){
      g.append('ellipse')
        .attr('cx', minX).attr('cy', minY)
        .attr('rx', rx).attr('ry', rx*ryRatio)
        .attr('fill', 'none')
        .attr('stroke', 'var(--line)')
        .attr('stroke-width', 1.2);
    });
    // 谷底标记
    svg.append('circle').attr('cx', minX).attr('cy', minY).attr('r', 4)
      .attr('fill', 'var(--muted)');
    svg.append('text').attr('x', minX+12).attr('y', minY-14)
      .attr('font-family','var(--font-mono)').attr('font-size','13')
      .attr('fill','var(--muted)').text('最小值');
  }

  // 朴素梯度下降:在陡峭方向(垂直)反复横跳,缓慢向右推进
  var naivePts = [
    [60,120],[140,370],[210,150],[290,350],
    [355,175],[410,320],[450,205],[475,270],
    [478,232],[480,250]
  ];

  // 动量/Adam:几乎不震荡,平滑冲向谷底
  var momPath = "M60,120 C 200,190 380,255 480,250";

  var svgNaive = d3.select('#svg-naive');
  drawTerrain(svgNaive);
  var lineGen = d3.line().x(function(d){return d[0];}).y(function(d){return d[1];}).curve(d3.curveLinear);
  svgNaive.append('path')
    .attr('d', lineGen(naivePts))
    .attr('fill','none')
    .attr('stroke','var(--weight)')
    .attr('stroke-width', 2.5)
    .attr('stroke-dasharray','1,0');
  svgNaive.selectAll('.pt').data(naivePts).enter().append('circle')
    .attr('class','pt')
    .attr('cx', function(d){return d[0];})
    .attr('cy', function(d){return d[1];})
    .attr('r', 3.5)
    .attr('fill','var(--weight)');
  svgNaive.append('circle').attr('cx',60).attr('cy',120).attr('r',5)
    .attr('fill','var(--paper)').attr('stroke','var(--weight)').attr('stroke-width',2);
  svgNaive.append('text').attr('x',66).attr('y',108)
    .attr('font-family','var(--font-mono)').attr('font-size','13')
    .attr('fill','var(--muted)').text('起点');

  var svgMom = d3.select('#svg-mom');
  drawTerrain(svgMom);
  svgMom.append('path')
    .attr('d', momPath)
    .attr('fill','none')
    .attr('stroke','var(--text)')
    .attr('stroke-width', 3.5);
  svgMom.append('circle').attr('cx',60).attr('cy',120).attr('r',5)
    .attr('fill','var(--paper)').attr('stroke','var(--text)').attr('stroke-width',2);
  svgMom.append('text').attr('x',66).attr('y',108)
    .attr('font-family','var(--font-mono)').attr('font-size','13')
    .attr('fill','var(--muted)').text('起点');
})();
</script>
</body>
</html>
