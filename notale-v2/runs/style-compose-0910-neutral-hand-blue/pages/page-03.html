<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>增长率实验室 · Growth Rate Lab</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: 56px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      color: var(--text);
      font-family: var(--font-sans);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .title-group h1 {
      margin: 0;
      font-size: 40px;
      line-height: 1.2;
      font-weight: 600;
      color: var(--text);
    }
    .title-group h1 span {
      font-family: var(--font-display);
      color: var(--primary-blue);
      margin-left: 12px;
      font-weight: 600;
    }
    .subtitle {
      margin: 6px 0 0 0;
      font-size: 16px;
      color: var(--muted);
    }
    .badge-formula {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--paper-border);
      background: rgba(14, 165, 168, 0.12);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1.5px dashed var(--accent-cyan);
    }
    .workspace {
      display: grid;
      grid-template-columns: 1040px 380px;
      gap: 40px;
      align-items: center;
      margin-top: 20px;
    }
    .chart-area {
      position: relative;
      height: 600px;
      padding: 10px;
    }
    .chart-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .ctrl-col {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .metric-card {
      padding: 24px 28px;
    }
    .metric-label {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .metric-val-row {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .currency-symbol {
      font-size: 28px;
      font-weight: 600;
      color: var(--primary-blue);
    }
    #amount {
      font-size: 54px;
      font-weight: 700;
      line-height: 1;
      color: var(--primary-blue);
      font-variant-numeric: tabular-nums;
    }
    .slider-box {
      padding: 20px 24px;
    }
    .slider-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }
    .rate-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .rate-title span {
      font-family: var(--font-display);
      font-size: 18px;
      color: var(--muted);
      font-weight: normal;
    }
    #rate-disp {
      font-size: 26px;
      font-weight: 700;
      color: var(--accent-cyan);
      font-variant-numeric: tabular-nums;
    }
    input[type=range].nt-slider {
      width: 100%;
      height: 8px;
      accent-color: var(--accent-cyan);
      cursor: pointer;
      margin: 10px 0;
      display: block;
    }
    .slider-ticks {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .btn-reset {
      font-family: var(--font-sans);
      font-size: 15px;
      cursor: pointer;
      padding: 10px 22px;
      font-weight: 500;
    }
    .hint-text {
      font-size: 13px;
      color: var(--muted);
    }
    /* SVG styles */
    .axis-line {
      stroke: var(--paper-border);
      stroke-width: 2;
      stroke-linecap: round;
    }
    .axis-tick-text {
      font-family: var(--font-sans);
      font-size: 13px;
      fill: var(--muted);
      text-anchor: middle;
    }
    .axis-y-text {
      text-anchor: end;
      font-family: var(--font-sans);
      font-size: 13px;
      fill: var(--muted);
    }
    .curve-path {
      fill: none;
      stroke: var(--primary-blue);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .fill-area {
      fill: rgba(29, 99, 216, 0.08);
    }
    .pt-dot {
      fill: #fff;
      stroke: var(--primary-blue);
      stroke-width: 3.5;
      cursor: pointer;
      transition: r 0.15s ease;
    }
    .pt-dot.last {
      fill: var(--accent-cyan);
      stroke: #fff;
      stroke-width: 3.5;
    }
    .pt-label {
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      fill: var(--text);
      text-anchor: middle;
    }
  </style>
</head>
<body data-page="03" data-total="3">
  <div id="stage">
    <header class="header">
      <div class="title-group">
        <h1>增长率实验室 <span>Growth Rate Lab</span></h1>
        <p class="subtitle">拖动增长率体验指数曲率变化 · 本金 100 逐年复利</p>
      </div>
      <div class="badge-formula">A(n) = 100 × (1 + r)ⁿ</div>
    </header>

    <main class="workspace">
      <!-- 曲线图表区 -->
      <div class="chart-area nt-hand-box">
        <svg id="chart" class="chart-svg" viewBox="0 0 1020 580">
          <defs>
            <linearGradient id="curveGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1d63d8" stop-opacity="0.18" />
              <stop offset="100%" stop-color="#1d63d8" stop-opacity="0.01" />
            </linearGradient>
          </defs>

          <!-- 水平网格线与Y刻度 -->
          <g id="grid-y"></g>

          <!-- 坐标轴 -->
          <line class="axis-line" x1="70" y1="510" x2="970" y2="510" />
          <line class="axis-line" x1="70" y1="510" x2="70" y2="40" />

          <!-- X刻度 (Year 0..5) -->
          <g id="grid-x"></g>

          <!-- 动态曲线与面积 -->
          <path id="curve-area" fill="url(#curveGrad)" d="" />
          <path id="curve-line" class="curve-path" d="" />

          <!-- 数据节点 -->
          <g id="curve-nodes"></g>
        </svg>
      </div>

      <!-- 控制与数值展示区 -->
      <aside class="ctrl-col">
        <div class="metric-card nt-hand-box">
          <div class="metric-label">
            <span>第 5 年期末金额</span>
            <span class="nt-label" style="color:var(--muted)">Year 5 Value</span>
          </div>
          <div class="metric-val-row">
            <span class="currency-symbol">¥</span>
            <span id="amount">248.83</span>
          </div>
        </div>

        <div class="slider-box nt-hand-box">
          <div class="slider-head">
            <label for="rate" class="rate-title">年增长率 <span>Rate (r)</span></label>
            <span id="rate-disp">20%</span>
          </div>
          <input type="range" id="rate" class="nt-slider" min="0" max="50" value="20" step="1" aria-label="年增长率">
          <div class="slider-ticks">
            <span>0% (直线)</span>
            <span>25%</span>
            <span>50% (极陡)</span>
          </div>
        </div>

        <div class="actions">
          <button id="reset" class="nt-hand-btn btn-reset">重置为 20%</button>
          <span class="hint-text">默认: 248.83 | 最大: 759.38</span>
        </div>
      </aside>
    </main>
  </div>

  <aside class="notes" hidden>
    这里是互动实验室。调节年增长率，可以直观观察指数曲线的陡峭变化。当增长率为 0% 时，资产保持 100 不变；而当增长率达到 50% 时，第 5 年金额将爆发式增长到 759.38，展现复利效应的巨大威力。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (function() {
      const rateInput = document.getElementById('rate');
      const amountEl = document.getElementById('amount');
      const rateDisp = document.getElementById('rate-disp');
      const resetBtn = document.getElementById('reset');

      const gridYG = document.getElementById('grid-y');
      const gridXG = document.getElementById('grid-x');
      const curveLine = document.getElementById('curve-line');
      const curveArea = document.getElementById('curve-area');
      const curveNodes = document.getElementById('curve-nodes');

      // 绘图区域几何配置
      const X_START = 80;
      const X_END = 950;
      const Y_BASE = 510;
      const Y_TOP = 50;
      const MAX_VAL = 800; // 容纳 r=50% 时 759.38

      function getX(year) {
        return X_START + (year / 5) * (X_END - X_START);
      }

      function getY(val) {
        return Y_BASE - (val / MAX_VAL) * (Y_BASE - Y_TOP);
      }

      // 初始化固定网格
      function initGrid() {
        // Y 轴刻度 0, 200, 400, 600, 800
        const yVals = [0, 200, 400, 600, 800];
        let yHtml = '';
        yVals.forEach(v => {
          const y = getY(v);
          yHtml += `<line class="nt-grid-line" x1="${X_START}" y1="${y}" x2="${X_END}" y2="${y}" stroke="#d5e2e8" stroke-dasharray="4,4" />`;
          yHtml += `<text class="axis-y-text" x="${X_START - 14}" y="${y + 4}">${v}</text>`;
        });
        gridYG.innerHTML = yHtml;

        // X 轴刻度 Year 0..5
        let xHtml = '';
        for (let i = 0; i <= 5; i++) {
          const x = getX(i);
          xHtml += `<line x1="${x}" y1="${Y_BASE}" x2="${x}" y2="${Y_BASE + 6}" stroke="var(--paper-border)" stroke-width="2" />`;
          xHtml += `<text class="axis-tick-text" x="${x}" y="${Y_BASE + 24}">第 ${i} 年</text>`;
          xHtml += `<text class="axis-tick-text" x="${x}" y="${Y_BASE + 40}" style="font-size:11px;fill:var(--muted)">Yr ${i}</text>`;
        }
        gridXG.innerHTML = xHtml;
      }

      function update(rateVal) {
        const r = rateVal / 100;
        rateDisp.textContent = rateVal + '%';

        const pts = [];
        for (let n = 0; n <= 5; n++) {
          const val = 100 * Math.pow(1 + r, n);
          pts.push({ n, val, x: getX(n), y: getY(val) });
        }

        // 第5年纯数字金额 (保留两位小数)
        const yr5Val = pts[5].val;
        const formatted = (Math.round(yr5Val * 100) / 100).toFixed(2);
        amountEl.textContent = formatted;

        // 绘制高密度指数曲线采样以保证单调平滑递增
        const samples = 60;
        let pathD = '';
        for (let s = 0; s <= samples; s++) {
          const sampleN = (s / samples) * 5;
          const sampleVal = 100 * Math.pow(1 + r, sampleN);
          const sx = getX(sampleN);
          const sy = getY(sampleVal);
          pathD += (s === 0 ? `M ${sx} ${sy}` : ` L ${sx} ${sy}`);
        }
        curveLine.setAttribute('d', pathD);

        // 填充渐变闭合区域
        const areaD = pathD + ` L ${getX(5)} ${Y_BASE} L ${getX(0)} ${Y_BASE} Z`;
        curveArea.setAttribute('d', areaD);

        // 节点与数值标签
        let nodesHtml = '';
        pts.forEach((pt, idx) => {
          const isLast = idx === 5;
          const valText = (Math.round(pt.val * 100) / 100).toFixed(2);
          const rSize = isLast ? 7.5 : 5.5;
          const offsetSign = pt.y > 100 ? -12 : 22;
          nodesHtml += `
            <circle class="pt-dot ${isLast ? 'last' : ''}" cx="${pt.x}" cy="${pt.y}" r="${rSize}" />
            <text class="pt-label" x="${pt.x}" y="${pt.y + offsetSign}">${valText}</text>
          `;
        });
        curveNodes.innerHTML = nodesHtml;
      }

      initGrid();
      update(parseInt(rateInput.value, 10));

      rateInput.addEventListener('input', function(e) {
        update(parseInt(e.target.value, 10));
      });

      resetBtn.addEventListener('click', function() {
        rateInput.value = 20;
        update(20);
      });

      Deck.init({ index: 3, total: 3 });
    })();
  </script>
</body>
</html>
