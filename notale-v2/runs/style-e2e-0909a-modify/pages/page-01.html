<!doctype html>
<html lang="zh" data-variant="opening">
<head>
<meta charset="utf-8">
<title>指数增长 Exponential Growth</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="01" data-total="3">
<div id="stage">

  <svg class="nt-growth-chart cv-fill" viewBox="0 0 1600 900" role="img"
       aria-labelledby="chart-title chart-desc">
    <title id="chart-title">本金 100 在固定增加与按比例增长下五年内的分叉</title>
    <desc id="chart-desc">
      横轴为第 0 到第 5 年，纵轴为金额。固定线每年增加 20，
      第 5 年到 200；复利线每年乘 1.2，第 5 年到 248.832。
      两条线在第 1 年重合，此后差距逐年拉大。
    </desc>

    <!-- grid -->
    <g class="grid">
      <line x1="790" y1="770" x2="1500" y2="770"/>
      <line x1="790" y1="662.31" x2="1500" y2="662.31"/>
      <line x1="790" y1="554.62" x2="1500" y2="554.62"/>
      <line x1="790" y1="446.92" x2="1500" y2="446.92"/>
      <line x1="790" y1="339.23" x2="1500" y2="339.23"/>
      <line x1="790" y1="231.54" x2="1500" y2="231.54"/>
      <line x1="790" y1="210" x2="790" y2="770"/>
      <line x1="932" y1="210" x2="932" y2="770"/>
      <line x1="1074" y1="210" x2="1074" y2="770"/>
      <line x1="1216" y1="210" x2="1216" y2="770"/>
      <line x1="1358" y1="210" x2="1358" y2="770"/>
      <line x1="1500" y1="210" x2="1500" y2="770"/>
    </g>

    <!-- axis -->
    <g class="axis">
      <line x1="790" y1="210" x2="790" y2="770"/>
      <line x1="790" y1="770" x2="1500" y2="770"/>
    </g>

    <!-- tick numbers -->
    <g class="tick" text-anchor="end">
      <text x="775" y="774">0</text>
      <text x="775" y="666.31">50</text>
      <text x="775" y="558.62">100</text>
      <text x="775" y="450.92">150</text>
      <text x="775" y="343.23">200</text>
      <text x="775" y="235.54">250</text>
    </g>
    <g class="tick" text-anchor="middle">
      <text x="790" y="794">0</text>
      <text x="932" y="794">1</text>
      <text x="1074" y="794">2</text>
      <text x="1216" y="794">3</text>
      <text x="1358" y="794">4</text>
      <text x="1500" y="794">5</text>
    </g>

    <!-- axis titles -->
    <text class="label" x="790" y="199" text-anchor="start">金额 Amount</text>
    <text class="label" x="1500" y="818" text-anchor="end">年 Year</text>

    <!-- legend -->
    <rect x="800" y="132" width="28" height="10" style="fill:var(--compound);"/>
    <text class="label" x="838" y="141" text-anchor="start">复利 Compound · ×1.2 / 年</text>
    <rect x="800" y="162" width="28" height="10" style="fill:var(--fixed);"/>
    <text class="label" x="838" y="171" text-anchor="start">固定 Fixed · +20 / 年</text>

    <!-- data lines -->
    <path class="fixed" d="M790,554.62 L932,511.54 L1074,468.46 L1216,425.38 L1358,382.31 L1500,339.23"/>
    <path class="compound" d="M790,554.62 L932,511.54 L1074,459.85 L1216,397.68 L1358,323.34 L1500,233.98"/>

    <g class="point fixed">
      <circle cx="790" cy="554.62" r="7"/>
      <circle cx="932" cy="511.54" r="7"/>
      <circle cx="1074" cy="468.46" r="7"/>
      <circle cx="1216" cy="425.38" r="7"/>
      <circle cx="1358" cy="382.31" r="7"/>
      <circle cx="1500" cy="339.23" r="7"/>
    </g>
    <g class="point">
      <circle cx="790" cy="554.62" r="7"/>
      <circle cx="932" cy="511.54" r="7"/>
      <circle cx="1074" cy="459.85" r="7"/>
      <circle cx="1216" cy="397.68" r="7"/>
      <circle cx="1358" cy="323.34" r="7"/>
      <circle cx="1500" cy="233.98" r="7"/>
    </g>

    <!-- year-1 coincidence -->
    <text class="tick" x="932" y="545" text-anchor="middle">首年增量相同：均 +20</text>

    <!-- late-segment increment contrast -->
    <text class="label" x="1429" y="404" text-anchor="middle" style="fill:var(--fixed);">此后固定 +20</text>
    <text class="label" x="1429" y="255" text-anchor="middle" style="fill:var(--compound);">末年已达 +41.47</text>

    <!-- endpoint values -->
    <text class="label" x="1500" y="365" text-anchor="middle" style="fill:var(--fixed);">200</text>
    <text class="label" x="1500" y="216" text-anchor="middle" style="fill:var(--compound);">248.832</text>

    <!-- gap bracket -->
    <g class="axis">
      <line x1="1520" y1="233.98" x2="1520" y2="339.23"/>
      <line x1="1512" y1="233.98" x2="1520" y2="233.98"/>
      <line x1="1512" y1="339.23" x2="1520" y2="339.23"/>
    </g>
    <text class="label" x="1530" y="291" text-anchor="start" style="fill:var(--accent);">+48.83</text>
  </svg>

  <div style="position:absolute;left:100px;top:118px;width:560px;">
    <p class="nt-kicker">同一笔钱，两条路 · Same $100, Two Paths</p>
    <h1 class="nt-title" style="margin-top:26px;">
      <span lang="zh" style="display:block;">指数增长</span>
    </h1>
    <p class="nt-lead" lang="en" style="margin-top:22px;text-transform:uppercase;letter-spacing:0.02em;">Exponential Growth</p>
    <p class="nt-lead" style="margin-top:30px;">为什么每年新增的钱，一年比一年多？</p>
    <p class="nt-note" style="margin-top:12px;">Why does the yearly increase keep growing?</p>
    <p class="nt-note" style="margin-top:28px;">本金 100，年增长率 20%；对照组每年固定增加 20。</p>
  </div>

</div>
<script src="assets/base.js"></script>
</body>
</html>
