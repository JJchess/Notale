<!doctype html>
<html lang="zh" data-variant="practice">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{position:relative;overflow:hidden}
.lab-head{position:absolute;left:64px;top:46px;width:1472px;display:flex;flex-direction:column;gap:12px}
.lab-lead{max-width:1000px}
.lab-main{position:absolute;left:64px;top:280px;width:1472px;display:flex;gap:40px;align-items:flex-start}
.chart-panel{flex:0 0 900px;display:flex;flex-direction:column;gap:14px}
.chart-frame{width:900px;height:500px}
.chart-frame svg{width:100%;height:100%;display:block;overflow:visible}
.controls-panel.nt-controls{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px;padding:26px 34px}
.rate-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.amount-block{display:flex;flex-direction:column;gap:6px}
.amount-value-row{display:flex;align-items:baseline;gap:10px}
.amount-unit{color:var(--muted);font-size:var(--fs-label);font-weight:650}
#reset{align-self:flex-start}
.base-guide{stroke:var(--muted);stroke-width:2.5;stroke-dasharray:7 7;fill:none;opacity:.85}
.base-label{fill:var(--muted);font-family:var(--font-numeric);font-size:14px;font-weight:700}
</style>
</head>
<body data-page="03" data-total="3">
<div id="stage">

  <div class="lab-head">
    <p class="nt-kicker">增长率实验 <span class="nt-en">RATE EXPERIMENT</span></p>
    <h1 class="nt-title nt-title--compact">增长率实验室<span class="nt-title-en nt-title-mark">Growth Rate Lab</span></h1>
    <p class="nt-lead lab-lead">本金 100，按 A(n) = 100×(1+r)ⁿ 计算。拖动滑块改变 r，绿色曲线随之变化；灰色虚线固定在 20%，作为参照。</p>
  </div>

  <div class="lab-main">
    <section class="chart-panel">
      <div class="chart-frame">
        <svg class="nt-growth-chart" viewBox="0 0 900 500" role="img" aria-label="第 0 到第 5 年金额随增长率变化的曲线图">
          <!-- horizontal grid -->
          <line class="grid" x1="70" y1="430" x2="870" y2="430"/>
          <line class="grid" x1="70" y1="330" x2="870" y2="330"/>
          <line class="grid" x1="70" y1="230" x2="870" y2="230"/>
          <line class="grid" x1="70" y1="130" x2="870" y2="130"/>
          <line class="grid" x1="70" y1="30" x2="870" y2="30"/>
          <!-- vertical grid -->
          <line class="grid" x1="70" y1="30" x2="70" y2="430"/>
          <line class="grid" x1="230" y1="30" x2="230" y2="430"/>
          <line class="grid" x1="390" y1="30" x2="390" y2="430"/>
          <line class="grid" x1="550" y1="30" x2="550" y2="430"/>
          <line class="grid" x1="710" y1="30" x2="710" y2="430"/>
          <line class="grid" x1="870" y1="30" x2="870" y2="430"/>
          <!-- axes -->
          <line class="axis" x1="70" y1="430" x2="870" y2="430"/>
          <line class="axis" x1="70" y1="30" x2="70" y2="430"/>
          <!-- y tick labels -->
          <text class="tick" x="58" y="434" text-anchor="end">0</text>
          <text class="tick" x="58" y="334" text-anchor="end">200</text>
          <text class="tick" x="58" y="234" text-anchor="end">400</text>
          <text class="tick" x="58" y="134" text-anchor="end">600</text>
          <text class="tick" x="58" y="34" text-anchor="end">800</text>
          <!-- x tick labels -->
          <text class="tick" x="70" y="454" text-anchor="middle">0</text>
          <text class="tick" x="230" y="454" text-anchor="middle">1</text>
          <text class="tick" x="390" y="454" text-anchor="middle">2</text>
          <text class="tick" x="550" y="454" text-anchor="middle">3</text>
          <text class="tick" x="710" y="454" text-anchor="middle">4</text>
          <text class="tick" x="870" y="454" text-anchor="middle">5</text>
          <text class="axis-label" x="470" y="478" text-anchor="middle">第 n 年 Year</text>
          <text class="axis-label" x="0" y="0" text-anchor="middle" transform="translate(24,230) rotate(-90)">金额（元）Amount</text>
          <!-- reference curve r=20%, drawn once from JS -->
          <path id="baseCurve" class="base-guide"></path>
          <text id="baseLabel" class="base-label"></text>
          <!-- live curve, redrawn on input -->
          <path id="curCurve" data-series="compound"></path>
          <g id="curPoints"></g>
          <text id="curLabel" class="value-label" data-state="active" text-anchor="start"></text>
        </svg>
      </div>
      <p class="nt-caption">灰色虚线固定在 20%，作为参照；绿色曲线随滑块实时变化，两者共用同一坐标尺度。</p>
    </section>

    <section class="controls-panel nt-controls">
      <div>
        <div class="rate-row">
          <label class="nt-control-label" for="rate">增长率 r · Growth rate</label>
          <span class="nt-rate-readout" id="rateReadout">20%</span>
        </div>
        <input type="range" id="rate" min="0" max="50" step="1" value="20" aria-describedby="rateHelp">
        <div class="nt-range-scale" aria-hidden="true"><span>0%</span><span>50%</span></div>
        <p class="nt-control-help" id="rateHelp">Home 到 0%，End 到 50%。</p>
      </div>

      <hr class="nt-divider" aria-hidden="true">

      <p class="nt-formula" id="formula">A(n) = 100 × (1+0.20)ⁿ</p>

      <div class="amount-block" aria-live="polite">
        <p class="nt-amount-label">第 5 年金额 · Year-5 amount</p>
        <div class="amount-value-row">
          <span id="amount" class="nt-amount">248.83</span>
          <span class="amount-unit">元</span>
        </div>
      </div>

      <p class="nt-year-sequence" id="sequence"></p>
      <p class="nt-caption" id="incCaption"></p>

      <button id="reset" type="button">重置 Reset</button>
    </section>
  </div>

</div>
<script src="assets/base.js"></script>
<script>
(function(){
  var PRINCIPAL = 100, YEARS = 5;
  var X_LEFT = 70, X_RIGHT = 870, Y_TOP = 30, Y_BOTTOM = 430, Y_DOMAIN_MAX = 800;
  var stepX = (X_RIGHT - X_LEFT) / YEARS;
  var scaleY = (Y_BOTTOM - Y_TOP) / Y_DOMAIN_MAX;

  var rateInput = document.getElementById('rate');
  var rateReadout = document.getElementById('rateReadout');
  var formulaEl = document.getElementById('formula');
  var amountEl = document.getElementById('amount');
  var sequenceEl = document.getElementById('sequence');
  var incCaptionEl = document.getElementById('incCaption');
  var curCurve = document.getElementById('curCurve');
  var curPoints = document.getElementById('curPoints');
  var curLabel = document.getElementById('curLabel');
  var baseCurve = document.getElementById('baseCurve');
  var baseLabel = document.getElementById('baseLabel');
  var resetBtn = document.getElementById('reset');

  function seriesFor(ratePercent){
    var r = ratePercent / 100;
    var values = [];
    for (var n = 0; n <= YEARS; n++) values.push(PRINCIPAL * Math.pow(1 + r, n));
    return values;
  }
  function xAt(n){ return X_LEFT + n * stepX; }
  function yAt(v){ return Y_BOTTOM - v * scaleY; }
  function pathFor(values){
    return values.map(function(v, n){ return (n === 0 ? 'M' : 'L') + xAt(n) + ',' + yAt(v).toFixed(2); }).join(' ');
  }

  function drawBaseline(){
    var values = seriesFor(20);
    baseCurve.setAttribute('d', pathFor(values));
    var lastX = xAt(YEARS), lastY = yAt(values[YEARS]);
    baseLabel.setAttribute('x', lastX - 14);
    baseLabel.setAttribute('y', lastY - 14);
    baseLabel.setAttribute('text-anchor', 'end');
    baseLabel.textContent = '20% 参照';
  }

  function render(){
    var rate = +rateInput.value;
    var dec = rate / 100;
    var values = seriesFor(rate);

    rateReadout.textContent = rate + '%';
    formulaEl.innerHTML = 'A(n) = 100 × (1+<strong>' + dec.toFixed(2) + '</strong>)ⁿ';
    amountEl.textContent = values[YEARS].toFixed(2);

    sequenceEl.innerHTML = values.map(function(v, n){
      var text = v.toFixed(2);
      return n === YEARS ? '<strong>' + text + '</strong>' : text;
    }).join(' → ');

    var increment = values[YEARS] - values[YEARS - 1];
    incCaptionEl.textContent = '第5年比第4年多 ' + increment.toFixed(2) + ' 元。';

    curCurve.setAttribute('d', pathFor(values));
    curPoints.innerHTML = values.map(function(v, n){
      return '<circle data-point="compound" cx="' + xAt(n) + '" cy="' + yAt(v).toFixed(2) + '" r="7"></circle>';
    }).join('');
    var lastX = xAt(YEARS), lastY = yAt(values[YEARS]);
    curLabel.setAttribute('x', lastX + 12);
    curLabel.setAttribute('y', lastY + 20);
    curLabel.textContent = values[YEARS].toFixed(2);
  }

  rateInput.addEventListener('input', render);
  resetBtn.addEventListener('click', function(){
    rateInput.value = 20;
    render();
  });

  drawBaseline();
  render();

  if (window.Deck && Deck.init) Deck.init({ index: 2, total: 3 });
})();
</script>
</body>
</html>
