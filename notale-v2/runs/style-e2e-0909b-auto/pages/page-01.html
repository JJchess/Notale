<!doctype html>
<html lang="zh" data-variant="opening">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{ overflow:hidden; }

  .content-veil{
    position:absolute; inset:0; z-index:1;
    background:linear-gradient(180deg, rgba(255,255,255,.94) 0%, rgba(255,255,255,.9) 62%, rgba(255,255,255,.82) 100%);
  }

  /* ---- 柱列：主对象 ---- */
  .bars{
    position:absolute; left:120px; right:180px; bottom:150px; top:420px;
    z-index:2;
  }
  .bar-col{
    position:absolute; bottom:0;
    display:flex; flex-direction:column; align-items:center;
  }
  .bar-rect{
    width:100%;
    background:var(--compound);
    border-radius:3px 3px 0 0;
  }
  .bar-rect.n0{ background:var(--muted); opacity:.55; }
  .bar-gap{
    position:absolute;
    left:50%;
    width:2px;
    background:var(--accent);
    opacity:.9;
  }
  .bar-year{
    position:absolute; bottom:-34px; left:0; right:0; text-align:center;
    font-family:var(--font-numeric); color:var(--muted);
  }
  .bar-value{
    position:absolute; left:0; right:0; text-align:center;
    font-family:var(--font-numeric); color:var(--text);
    white-space:nowrap;
  }
  .delta-tag{
    position:absolute; left:50%; transform:translateX(-50%);
    text-align:center; white-space:nowrap;
    font-family:var(--font-numeric); color:var(--accent);
    font-weight:600;
  }
  .delta-tag .plus{ opacity:.75; margin-right:2px; }

  /* ---- 标题区 ---- */
  .titlefield{
    position:absolute; left:120px; top:96px; width:1200px;
    z-index:2;
  }
  .kicker{
    font-family:var(--font-numeric); letter-spacing:.14em;
    color:var(--muted); text-transform:uppercase;
  }
  .nt-title{ margin:14px 0 0; line-height:1.06; }
  .nt-title .en{ display:block; font-family:var(--font-display); }
  .nt-title .zh{ display:block; font-family:var(--font-display); margin-top:6px; }

  .question{
    position:absolute; left:120px; top:318px; width:900px;
    z-index:2;
  }
  .question .zh{ display:block; }
  .question .en{ display:block; color:var(--muted); margin-top:6px; }

  .legend-row{
    position:absolute; left:120px; bottom:64px; z-index:2;
    display:flex; align-items:center; gap:28px;
  }
  .legend-item{ display:flex; align-items:center; gap:10px; }
  .legend-swatch{ width:16px; height:16px; border-radius:3px; }
  .legend-swatch.compound{ background:var(--compound); }
  .legend-swatch.n0{ background:var(--muted); opacity:.55; }
  .legend-text{ font-family:var(--font-sans); color:var(--muted); }
</style>
</head>
<body data-page="01" data-total="3">
<div id="stage">
  <div class="content-veil"></div>

  <div class="titlefield">
    <div class="kicker nt-label">Exponential Growth · 复利增长</div>
    <h1 class="nt-title">
      <span class="en" lang="en" style="font-size:64px;">Why Does the Increase Grow Each Year?</span>
      <span class="zh" lang="zh" style="font-size:40px; color:var(--muted);">"每年都增长20%"，为什么新增额一年比一年大？</span>
    </h1>
  </div>

  <div class="question">
    <p class="nt-lead" style="margin:0;">
      <span class="zh" style="font-size:20px;">同样是 20%，第 1 年只多赚 20，第 5 年却多赚超过 41。差距藏在"基数也在变大"里。</span>
      <span class="en" lang="en" style="font-size:16px;">Same 20% rate, but each year's gain is added on a larger base than the last.</span>
    </p>
  </div>

  <div class="bars" id="bars"></div>

  <div class="legend-row">
    <div class="legend-item">
      <span class="legend-swatch n0"></span>
      <span class="legend-text nt-note" style="font-size:14px;">本金 Principal</span>
    </div>
    <div class="legend-item">
      <span class="legend-swatch compound"></span>
      <span class="legend-text nt-note" style="font-size:14px;">A(n) = 100 × (1+20%)ⁿ</span>
    </div>
    <div class="legend-item">
      <span class="legend-text nt-note" style="font-size:14px; color:var(--accent);">竖线标出逐年新增额，越靠右越长</span>
    </div>
  </div>

</div>
<script src="assets/base.js"></script>
<script>
  // A(n) = 100 * 1.2^n, n = 0..5 — 确定性事实，与 brief 一致
  const values = [100, 120, 144, 172.8, 207.36, 248.832];
  const deltas = values.map((v, i) => i === 0 ? 0 : +(v - values[i-1]).toFixed(3));

  const bars = document.getElementById('bars');
  const n = values.length;
  const colW = 1300 / n;
  const barW = colW * 0.42;
  const maxV = values[n-1];
  const areaH = 420; // px, matches .bars height

  values.forEach((v, i) => {
    const h = (v / maxV) * areaH;
    const col = document.createElement('div');
    col.className = 'bar-col';
    col.style.left = (i * colW + (colW - barW) / 2) + 'px';
    col.style.width = barW + 'px';
    col.style.height = areaH + 'px';

    const rect = document.createElement('div');
    rect.className = 'bar-rect' + (i === 0 ? ' n0' : '');
    rect.style.height = h + 'px';
    rect.style.position = 'absolute';
    rect.style.bottom = '0';
    rect.style.width = '100%';
    col.appendChild(rect);

    const val = document.createElement('div');
    val.className = 'bar-value';
    val.style.bottom = (h + 8) + 'px';
    val.style.fontSize = '17px';
    val.textContent = v.toFixed(v % 1 === 0 ? 0 : 2);
    col.appendChild(val);

    const year = document.createElement('div');
    year.className = 'bar-year';
    year.style.fontSize = '14px';
    year.textContent = 'n=' + i;
    col.appendChild(year);

    bars.appendChild(col);

    if (i > 0) {
      const prevH = (values[i-1] / maxV) * areaH;
      const gap = document.createElement('div');
      gap.className = 'bar-gap';
      gap.style.left = (i * colW - (colW - barW) / 2 - barW * 0.02) + 'px';
      gap.style.bottom = prevH + 'px';
      gap.style.height = (h - prevH) + 'px';
      bars.appendChild(gap);

      const tag = document.createElement('div');
      tag.className = 'delta-tag';
      tag.style.left = (i * colW - colW/2 + barW*0.5 + 6) + 'px';
      tag.style.bottom = (h + 30) + 'px';
      tag.style.fontSize = '15px';
      tag.innerHTML = '<span class="plus">+</span>' + deltas[i].toFixed(2);
      bars.appendChild(tag);
    }
  });

  Deck.init({ index: 1, total: 3 });
</script>
</body>
</html>
