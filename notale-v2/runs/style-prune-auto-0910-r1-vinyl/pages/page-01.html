<!doctype html>
<html lang="zh" data-variant="opening">
<head>
  <meta charset="utf-8">
  <title>黑胶唱片发声之谜</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      overflow: hidden;
      display: grid;
      grid-template-columns: 820px 1fr;
      align-items: center;
      padding: 60px 80px;
      box-sizing: border-box;
      gap: 60px;
    }

    /* 左侧：黑胶唱机实木底盘拟物主角 */
    .turntable-deck {
      position: relative;
      width: 740px;
      height: 740px;
      background: radial-gradient(circle at 48% 48%, #e8e0d2 0%, #d4c7b2 65%, #baab95 100%);
      border-radius: 36px;
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,0.8),
        inset 0 -3px 6px rgba(0,0,0,0.18),
        0 28px 56px -12px rgba(0,0,0,0.6),
        0 8px 20px rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 唱机沉槽与黑胶唱片 */
    .well-recess {
      position: relative;
      width: 650px;
      height: 650px;
      border-radius: 50%;
      background: radial-gradient(circle, #181513 0%, #0d0b0a 100%);
      box-shadow:
        inset 0 10px 24px rgba(0,0,0,0.85),
        inset 0 2px 6px rgba(0,0,0,0.9),
        0 2px 4px rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    /* 机械唱臂 */
    .tonearm {
      position: absolute;
      top: 50px;
      right: 46px;
      width: 220px;
      height: 480px;
      pointer-events: none;
      z-index: 5;
    }

    /* 转速与实体铭牌 */
    .deck-badge {
      position: absolute;
      bottom: 36px;
      left: 44px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(180deg, #eae3d7, #cfc4b2);
      padding: 8px 16px;
      border-radius: 8px;
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.8),
        0 2px 5px rgba(0,0,0,0.15);
      border: 1px solid #baa992;
      color: #3e3427;
      font-size: 13px;
      font-family: var(--font-sans);
      letter-spacing: 0.05em;
    }

    .strobe-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c2410c;
      box-shadow: 0 0 6px #ea580c;
    }

    /* 右侧：题签、设问与微观沟槽放大 */
    .intro-column {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 32px;
      z-index: 2;
    }

    .series-tag {
      font-size: 14px;
      font-family: var(--font-sans);
      letter-spacing: 0.12em;
      color: #d1c7b7;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .series-tag::before {
      content: "";
      display: inline-block;
      width: 24px;
      height: 1.5px;
      background: #c2410c;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: 52px;
      line-height: 1.22;
      font-weight: 600;
      color: #f7f3ee;
      margin: 0;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }

    .hero-lead {
      font-family: var(--font-sans);
      font-size: 20px;
      line-height: 1.55;
      color: #dfd7cb;
      margin: 0;
    }

    /* 微观沟槽显微图解卡片 */
    .groove-card {
      background: #25211e;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.1),
        0 12px 28px -4px rgba(0,0,0,0.5);
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .micro-scope-svg {
      width: 140px;
      height: 90px;
      flex-shrink: 0;
      background: #151311;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
    }

    .groove-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .groove-title {
      font-size: 16px;
      font-weight: 600;
      color: #fdfaf6;
      font-family: var(--font-sans);
    }

    .groove-desc {
      font-size: 14px;
      line-height: 1.5;
      color: #c4b9a9;
      margin: 0;
      font-family: var(--font-sans);
    }

    .cue-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #fdba74;
      background: rgba(194, 65, 12, 0.2);
      border: 1px solid rgba(234, 88, 12, 0.4);
      border-radius: 6px;
      padding: 3px 8px;
      width: fit-content;
      margin-top: 2px;
    }
  </style>
</head>
<body data-page="01" data-total="3">
  <div id="stage">
    <!-- 主角：黑胶唱机实木拉丝转盘 -->
    <div class="turntable-deck min0">
      <div class="well-recess">
        <canvas id="vinyl-disc" class="vinyl-canvas" width="650" height="650"></canvas>
      </div>

      <!-- 唱臂结构 (拉丝金属平衡锤 + 唱臂 + 唱头) -->
      <svg class="tonearm" viewBox="0 0 220 480" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- 基座旋转轴与平衡锤 -->
        <circle cx="160" cy="80" r="42" fill="url(#metal-base)" stroke="#9a8c78" stroke-width="2"/>
        <circle cx="160" cy="80" r="28" fill="#443c32" stroke="#2b2620" stroke-width="2"/>
        <rect x="148" y="24" width="24" height="24" rx="4" fill="url(#counter-weight)" stroke="#807260"/>
        
        <!-- 弯曲唱臂杆 -->
        <path d="M160 80 Q130 240 85 360 L75 390" stroke="url(#arm-tube)" stroke-width="7" stroke-linecap="round"/>
        <path d="M160 80 Q130 240 85 360 L75 390" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

        <!-- 唱头匣与唱针定位点 -->
        <g transform="translate(48, 380) rotate(-22)">
          <rect x="0" y="0" width="34" height="60" rx="4" fill="#221e1a" stroke="#685b4b" stroke-width="1.5"/>
          <rect x="4" y="8" width="26" height="12" rx="2" fill="#c2410c"/>
          <!-- 唱针尖端指示点 -->
          <circle cx="17" cy="56" r="3" fill="#fbbf24"/>
          <line x1="17" y1="56" x2="17" y2="64" stroke="#d97706" stroke-width="2"/>
        </g>

        <!-- 渐变定义 -->
        <defs>
          <radialGradient id="metal-base" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#f5ede2"/>
            <stop offset="60%" stop-color="#b8a892"/>
            <stop offset="100%" stop-color="#80725e"/>
          </radialGradient>
          <linearGradient id="counter-weight" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#736655"/>
            <stop offset="50%" stop-color="#ded3c3"/>
            <stop offset="100%" stop-color="#54483a"/>
          </linearGradient>
          <linearGradient id="arm-tube" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8c7d6b"/>
            <stop offset="40%" stop-color="#ded4c6"/>
            <stop offset="70%" stop-color="#fff"/>
            <stop offset="100%" stop-color="#706250"/>
          </linearGradient>
        </defs>
      </svg>

      <!-- 转速铭牌 -->
      <div class="deck-badge">
        <span class="strobe-dot"></span>
        <span>33⅓ RPM · 模拟直刻立体声</span>
      </div>
    </div>

    <!-- 右侧：题签、设问与微观图解 -->
    <div class="intro-column min0">
      <div class="series-tag">声学物理与现代机械录音</div>
      
      <h1 class="hero-title">黑胶唱片发声之谜</h1>
      
      <p class="hero-lead">塑料圆盘上的微观波纹，如何变成耳畔跳动的真实音乐？</p>

      <!-- 放大微观沟槽透视卡片 -->
      <div class="groove-card">
        <svg class="micro-scope-svg" viewBox="0 0 140 90" fill="none">
          <!-- 沟槽几何横截面与起伏波纹 -->
          <path d="M10 25 Q35 15 70 25 T130 25" stroke="#44403c" stroke-width="2" fill="none"/>
          <!-- V型槽与声波刻蚀 -->
          <path d="M25 35 Q40 45 55 35 T85 35 T115 35" stroke="#78716c" stroke-width="1.5" fill="none"/>
          <path d="M35 55 L70 76 L105 55" stroke="#ea580c" stroke-width="2" fill="none"/>
          <!-- 唱针嵌入点 -->
          <path d="M70 45 L70 72" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
          <circle cx="70" cy="72" r="3" fill="#fef08a"/>
          <!-- 左右声道壁标注点 -->
          <circle cx="53" cy="65" r="2" fill="#38bdf8"/>
          <circle cx="87" cy="65" r="2" fill="#4ade80"/>
        </svg>

        <div class="groove-meta">
          <div class="groove-title">微米级物理凹槽（Groove）</div>
          <p class="groove-desc">唱针尖端随着盘面两侧45°槽壁的起伏产生高频机械颤动。</p>
          <span class="cue-pill">下一页：声电链条全景拆解</span>
        </div>
      </div>
    </div>
  </div>

  <aside class="notes" hidden>
    大家好，欢迎来到本期声学机械探索展。当我们把黑胶唱片放在转盘上，一根细小的唱针轻轻落下，动人的乐声便流淌而出。这一过程没有数字芯片，也没有激光扫描，一张看似普通的黑色塑料圆盘，究竟凭借什么原理保存并还原了交响乐的丰富层次？在接下来的两节内容中，我们将由表及里，从微米级的机械起伏，一步步追踪到电磁感应与扬声器振膜的完整声电链条。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (function() {
      Deck.init({ index: 1, total: 3 });

      var canvas = document.getElementById('vinyl-disc');
      if (!canvas) return;
      var ctx = Deck.fit(canvas);

      var cx = 325;
      var cy = 325;
      var rVinyl = 310;
      var rLabel = 105;

      var angle = 0;
      var reduced = Deck.reduced();

      function drawDisc(rot) {
        ctx.clearRect(0, 0, 650, 650);

        // 1. 黑胶基底
        var bgGrad = ctx.createRadialGradient(cx, cy, 80, cx, cy, rVinyl);
        bgGrad.addColorStop(0, '#1c1917');
        bgGrad.addColorStop(0.85, '#0c0a09');
        bgGrad.addColorStop(1, '#050404');
        ctx.fillStyle = bgGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, rVinyl, 0, Math.PI * 2);
        ctx.fill();

        // 2. 黑胶密集的微观同心音轨刻纹
        ctx.save();
        ctx.lineWidth = 0.8;
        for (var r = rLabel + 15; r < rVinyl - 12; r += 3.2) {
          var alpha = 0.08 + 0.14 * Math.sin(r * 0.45);
          ctx.strokeStyle = 'rgba(255, 255, 255, ' + alpha.toFixed(3) + ')';
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.stroke();
        }

        // 3. 黑胶表面拟物动态双向高光夹角（反映唱片反射光）
        var numFlares = 2;
        for (var i = 0; i < numFlares; i++) {
          var flareAngle = rot + (i * Math.PI);
          var flareGrad = ctx.createRadialGradient(cx, cy, rLabel, cx, cy, rVinyl);
          flareGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
          flareGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.07)');
          flareGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(flareAngle);
          ctx.fillStyle = flareGrad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, rVinyl, -Math.PI / 6, Math.PI / 6);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        // 4. 中心复古暖纸质感标签纸
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rot);

        var labelGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, rLabel);
        labelGrad.addColorStop(0, '#e86a38');
        labelGrad.addColorStop(0.7, '#c2410c');
        labelGrad.addColorStop(1, '#9a3412');
        ctx.fillStyle = labelGrad;
        ctx.beginPath();
        ctx.arc(0, 0, rLabel, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(254, 215, 170, 0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, rLabel - 6, 0, Math.PI * 2);
        ctx.stroke();

        // 标签文字细节
        ctx.fillStyle = '#ffedd5';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '600 13px system-ui, sans-serif';
        ctx.fillText('ANALOG HIGH-FIDELITY', 0, -52);

        ctx.font = '700 20px serif';
        ctx.fillText('SIDE A', 0, -22);

        ctx.font = '500 11px system-ui, sans-serif';
        ctx.fillStyle = '#fed7aa';
        ctx.fillText('ACOUSTIC MASTER', 0, 26);
        ctx.fillText('MICRO-GROOVE · 33 RPM', 0, 44);

        // 中心转轴金属孔
        ctx.fillStyle = '#0c0a09';
        ctx.beginPath();
        ctx.arc(0, 0, 15, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#e2e8f0';
        ctx.beginPath();
        ctx.arc(0, 0, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.restore();
        ctx.restore();
      }

      // 静止画面初绘制
      drawDisc(0);

      // 低开销平滑旋转微动效（符合黑胶慢速运转氛围）
      if (!reduced) {
        Deck.loop(function(dt) {
          angle += 0.006;
          drawDisc(angle);
        });
      }
    })();
  </script>
</body>
</html>
