<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{ overflow:hidden; }

  .col-left{
    position:absolute; left:80px; top:44px; width:660px;
    display:flex; flex-direction:column;
  }
  .title{ margin-top:20px; width:620px; line-height:1.14; }
  .lead{ margin-top:26px; width:640px; }

  .eq{ margin-top:30px; width:640px; }
  .eq__head{ margin:0 0 8px; font-size:var(--fs-sec); color:var(--muted); font-weight:600; }
  .eq__live{ font-family:var(--font-mono); font-size:var(--fs-lead); font-weight:700; letter-spacing:-0.02em; font-variant-numeric:lining-nums tabular-nums; }
  .eq__live .op{ color:var(--muted); font-weight:500; }
  .eq__live #eqRate{ color:var(--accent); }
  .eq__live #eqResult{ color:var(--growth); }

  .callout{ margin-top:26px; width:640px; }
  .callout .lines{ display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  .callout .amt-label{ font-size:var(--fs-sec); font-weight:600; color:var(--muted); }
  .amt-unit{ font-size:var(--fs-lead); font-weight:700; margin-left:6px; }

  .controls-wrap{ margin-top:28px; width:660px; }
  .rate-row{ display:flex; align-items:center; gap:18px; margin-bottom:16px; }
  .rate-row label{ font-size:var(--fs-label); font-weight:700; color:var(--muted); white-space:nowrap; }
  #rate{ width:320px; }
  .rate-readout{ font-family:var(--font-mono); font-size:var(--fs-lead); font-weight:700; color:var(--text); min-width:3.6em; font-variant-numeric:tabular-nums; }
  .btn-row{ display:flex; gap:12px; }

  /* --- chart --- */
  .chart-wrap{
    position:absolute; left:800px; top:74px; width:720px; height:760px;
  }
  .chart-title{ margin:0 0 4px; font-size:var(--fs-lead) !important; }
  .legend-row{ display:flex; gap:28px; margin:10px 0 8px; flex-wrap:wrap; }
  .legend-item{ display:flex; align-items:center; gap:8px; font-size:var(--fs-label); color:var(--text); }
  .swatch{ width:26px; height:0; border-top:5px solid var(--accent); }
  .swatch.base{ border-top:3px dashed var(--line); }
  .chart-svg-box{ width:720px; height:600px; }
  .chart-note{ margin-top:14px; max-width:66ch; }
  .chart-note strong{ font-variant-numeric:tabular-nums; }
</style>
</head>
<body data-page="03" data-total="3">
<div id="stage">

  <div class="col-left">
    <span class="nt-kicker kicker">03 · 交互</span>

    <h1 class="nt-title title">r 越大，曲线越快甩开基准</h1>

    <p class="nt-lead lead">本金 100 元，每年乘以 (1+r)。拖动 r，比较你的曲线和 r=20% 基准曲线在第 5 年差多少。</p>

    <div class="eq">
      <p class="eq__head">n = 5 时：</p>
      <p class="eq__live">
        100 <span class="op">×</span> (1 + <span id="eqRate">0.20</span>)<sup>5</sup>
        <span class="op">=</span> <span id="eqResult">248.83</span>
      </p>
    </div>

    <div class="nt-callout nt-callout--growth callout">
      <div class="lines">
        <span class="amt-label">第 5 年金额</span>
        <span class="nt-amount nt-amount--hero" id="amount">248.83</span>
        <span class="amt-unit">元</span>
      </div>
      <small>是基准（r=20% 时 248.83 元）的 <strong id="ratio">1.00</strong> 倍。</small>
    </div>

    <div class="controls-wrap">
      <div class="rate-row">
        <label for="rate">增长率 r</label>
        <input id="rate" class="no-pan" type="range" min="0" max="50" step="1" value="20"
               aria-valuemin="0" aria-valuemax="50" aria-valuenow="20" aria-valuetext="20%">
        <span class="rate-readout" id="rateOut">20%</span>
      </div>
      <div class="btn-row nt-controls">
        <button id="reset" class="nt-button" type="button">重置为 20%</button>
      </div>
    </div>

    <p class="sr-only" id="srLive" aria-live="polite"></p>
  </div>

  <div class="chart-wrap">
    <h2 class="nt-heading chart-title" style="font-size:28px;">A(n) = 100 × (1+r)ⁿ，n = 0..5</h2>
    <div class="legend-row nt-legend">
      <span class="legend-item"><span class="swatch"></span>当前 r</span>
      <span class="legend-item"><span class="swatch base"></span>基准 r = 20%</span>
    </div>

    <div class="chart-svg-box nt-chart">
      <svg viewBox="0 0 660 600" width="100%" height="100%" role="img" aria-labelledby="chartDesc">
        <desc id="chartDesc">复利曲线：横轴年数 0 到 5，纵轴金额 0 到 800 元。虚线为增长率 20% 的基准曲线，实线随滑块的增长率变化。</desc>

        <!-- gridlines -->
        <g class="nt-grid">
          <line x1="70" y1="600" x2="640" y2="600"></line>
          <line x1="70" y1="457.5" x2="640" y2="457.5"></line>
          <line x1="70" y1="315" x2="640" y2="315"></line>
          <line x1="70" y1="172.5" x2="640" y2="172.5"></line>
          <line x1="70" y1="30" x2="640" y2="30"></line>
        </g>

        <!-- y tick labels -->
        <g class="nt-tick" text-anchor="end">
          <text x="60" y="604">0</text>
          <text x="60" y="461.5">200</text>
          <text x="60" y="319">400</text>
          <text x="60" y="176.5">600</text>
          <text x="60" y="34">800</text>
        </g>
        <text class="nt-tick" x="24" y="315" transform="rotate(-90 24 315)" text-anchor="middle">金额（元）</text>

        <!-- axes -->
        <g class="nt-axis">
          <line x1="70" y1="30" x2="70" y2="600"></line>
          <line x1="70" y1="600" x2="640" y2="600"></line>
        </g>

        <!-- x tick labels -->
        <g class="nt-tick" text-anchor="middle" id="xTicks">
          <text x="70" y="628">0年</text>
          <text x="184" y="628">1年</text>
          <text x="298" y="628">2年</text>
          <text x="412" y="628">3年</text>
          <text x="526" y="628">4年</text>
          <text x="640" y="628">5年</text>
        </g>

        <!-- baseline curve (fixed r=20%) -->
        <path id="baseLine" class="nt-series" style="stroke:var(--line); stroke-width:3; stroke-dasharray:9 7;" fill="none"></path>

        <!-- current curve -->
        <path id="curLine" class="nt-series" fill="none"></path>

        <!-- guide line for final amount -->
        <line id="guideH" x1="70" y1="0" x2="0" y2="0" stroke="var(--growth)" stroke-width="2" stroke-dasharray="4 5"></line>

        <g id="curPoints"></g>
      </svg>
    </div>

    <p class="nt-note chart-note">虚线是不动的参照：r = 20% 时，第 5 年是 248.83 元。实线随你调节的 r 移动——r 越大，末端抬升得越快，不再是每年多加一样多。</p>
  </div>

</div>
<script src="assets/base.js"></script>
<script>
  const PRINCIPAL = 100;
  const N = 5;

  function compute(ratePct){
    const r = ratePct / 100;
    const vals = [];
    for (let n = 0; n <= N; n++) vals.push(PRINCIPAL * Math.pow(1 + r, n));
    return vals;
  }

  const BASELINE = compute(20);

  const PLOT_X0 = 70, PLOT_X1 = 640, PLOT_Y0 = 30, PLOT_Y1 = 600;
  const Y_MAX = 800;
  const xFor = n => PLOT_X0 + (n / N) * (PLOT_X1 - PLOT_X0);
  const yFor = v => PLOT_Y1 - Math.min(v, Y_MAX) / Y_MAX * (PLOT_Y1 - PLOT_Y0);

  function pathFor(vals){
    return vals.map((v, i) => (i === 0 ? 'M' : 'L') + xFor(i).toFixed(1) + ' ' + yFor(v).toFixed(1)).join(' ');
  }

  const baseLineEl = document.getElementById('baseLine');
  const curLineEl = document.getElementById('curLine');
  const curPointsEl = document.getElementById('curPoints');
  const guideH = document.getElementById('guideH');
  const rateInput = document.getElementById('rate');
  const rateOut = document.getElementById('rateOut');
  const amountEl = document.getElementById('amount');
  const ratioEl = document.getElementById('ratio');
  const eqRateEl = document.getElementById('eqRate');
  const eqResultEl = document.getElementById('eqResult');
  const srLive = document.getElementById('srLive');
  const resetBtn = document.getElementById('reset');

  baseLineEl.setAttribute('d', pathFor(BASELINE));

  function render(ratePct){
    const vals = compute(ratePct);
    const final = vals[N];

    curLineEl.setAttribute('d', pathFor(vals));

    curPointsEl.innerHTML = vals.map((v, i) => {
      const x = xFor(i), y = yFor(v);
      const isLast = i === N;
      const r = isLast ? 8 : 5.5;
      const fill = isLast ? 'var(--growth)' : 'var(--bg)';
      const stroke = isLast ? 'var(--text)' : 'var(--accent)';
      const sw = isLast ? 4 : 3;
      const labelY = y - (isLast ? 16 : 12);
      return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r +
        '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + sw + '"></circle>' +
        '<text x="' + x.toFixed(1) + '" y="' + labelY.toFixed(1) + '" text-anchor="middle" class="nt-tick"' +
        (isLast ? ' font-weight="700" fill="var(--growth)"' : '') + '>' + v.toFixed(isLast ? 2 : 0) + '</text>';
    }).join('');

    const gy = yFor(final);
    guideH.setAttribute('x1', PLOT_X0);
    guideH.setAttribute('y1', gy.toFixed(1));
    guideH.setAttribute('x2', xFor(N).toFixed(1));
    guideH.setAttribute('y2', gy.toFixed(1));

    amountEl.textContent = final.toFixed(2);
    ratioEl.textContent = (final / BASELINE[N]).toFixed(2);
    eqRateEl.textContent = (ratePct / 100).toFixed(2);
    eqResultEl.textContent = final.toFixed(2);
    rateOut.textContent = ratePct + '%';
    rateInput.setAttribute('aria-valuenow', ratePct);
    rateInput.setAttribute('aria-valuetext', ratePct + '%');

    srLive.textContent = '增长率 ' + ratePct + '%。第 0 到 5 年金额：' +
      vals.map((v, i) => '第' + i + '年 ' + v.toFixed(2) + '元').join('，') + '。';
  }

  rateInput.addEventListener('input', e => render(+e.target.value));
  resetBtn.addEventListener('click', () => {
    rateInput.value = 20;
    render(20);
    rateInput.focus();
  });

  render(20);

  Deck.init({ index: 2, total: 3 });
</script>
</body>
</html>
