<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .head{position:absolute;left:80px;top:40px;width:1440px}
  .head .nt-kicker{margin:0 0 8px}
  .head h1{margin:0 0 8px;white-space:nowrap}
  .head p.nt-lead{margin:0;max-width:1020px}

  .layout{position:absolute;left:80px;top:196px;width:1440px;height:668px;display:flex;gap:var(--sp-3,24px)}

  .chart-panel{flex:0 0 820px;height:100%;box-sizing:border-box;padding:24px;display:flex;flex-direction:column;gap:12px;min-width:0}
  .control-panel{flex:1;height:100%;box-sizing:border-box;padding:24px;display:flex;flex-direction:column;gap:var(--sp-3,20px);min-width:0}

  .panel-title{font-size:var(--fs-sec);color:var(--text);margin:0;font-weight:600}

  .nt-legend{display:flex;gap:24px;font-size:var(--fs-label);color:var(--muted)}
  .legend-item{display:inline-flex;align-items:center;gap:8px}
  .swatch{width:14px;height:0;border-top:3px solid var(--growth);display:inline-block}
  .swatch.baseline{border-top:3px dashed var(--principal)}

  .chart-wrap{flex:1;min-height:0}
  .chart-wrap svg{width:100%;height:100%;display:block}

  .axis-label,.grid-label,.pt-value{font-family:var(--font-sans);fill:var(--muted);font-size:var(--fs-tick)}
  .grid-line{stroke:var(--muted);stroke-opacity:.22;stroke-width:1}
  .axis-line{stroke:var(--muted);stroke-opacity:.5;stroke-width:1.5}
  .curve-baseline{fill:none;stroke:var(--principal);stroke-width:3;stroke-dasharray:7 6;opacity:.85}
  .curve-current{fill:none;stroke:var(--growth);stroke-width:4}
  .pt-current{fill:var(--growth);stroke:var(--bg);stroke-width:2}
  .last-value{font-size:var(--fs-label);font-weight:700;fill:var(--growth)}

  .chart-note{margin:0;font-size:var(--fs-label)}

  .rate-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
  .slider-row{display:flex;align-items:center;gap:16px}
  #rate{flex:1;height:32px;cursor:pointer;accent-color:var(--growth)}
  #rate:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
  .rate-value{font-size:var(--fs-h2);font-weight:700;color:var(--growth);min-width:76px;text-align:right;font-variant-numeric:tabular-nums}
  .range-scale{display:flex;justify-content:space-between;font-size:var(--fs-tick);color:var(--muted);padding:0 2px}

  .amount-block{display:flex;flex-direction:column;gap:4px}
  .amount-row{display:flex;align-items:baseline;gap:10px}
  .amount-value{font-size:var(--fs-h1);font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  .amount-row .unit{font-size:var(--fs-body);color:var(--muted)}

  .seq-title{font-size:var(--fs-label);color:var(--muted);margin:0 0 8px}
  .nt-sequence{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
  .nt-term{padding:6px 10px;display:flex;flex-direction:column;gap:2px;min-width:78px}
  .n-label{font-size:var(--fs-tick);color:var(--muted)}
  .n-value{font-size:var(--fs-label);font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
</style>
</head>
<body data-page="03" data-total="3">
<div id="stage">

  <div class="head">
    <p class="nt-kicker">交互实验</p>
    <h1 class="nt-title">拖动增长率滑块，重新算出第5年金额</h1>
    <p class="nt-lead">本金100元不变，年增长率r从0%调到50%，公式A(n)=100×(1+r)ⁿ随之算出n=0..5各年金额。</p>
  </div>

  <div class="layout">

    <section class="chart-panel nt-glass">
      <div class="rate-row">
        <p class="panel-title">金额曲线（n = 0..5）</p>
        <div class="nt-legend">
          <span class="legend-item"><i class="swatch"></i>当前 r = <span id="legendRate">20</span>%</span>
          <span class="legend-item"><i class="swatch baseline"></i>基准 r = 20%</span>
        </div>
      </div>
      <div class="chart-wrap min0">
        <svg viewBox="0 0 836 470" role="img" aria-labelledby="chartDesc">
          <desc id="chartDesc">本金100元按年增长率r复利增长，n从0到5年的金额曲线</desc>
          <!-- gridlines -->
          <g>
            <line class="grid-line" x1="70" y1="420" x2="816" y2="420"></line>
            <line class="grid-line" x1="70" y1="320" x2="816" y2="320"></line>
            <line class="grid-line" x1="70" y1="220" x2="816" y2="220"></line>
            <line class="grid-line" x1="70" y1="120" x2="816" y2="120"></line>
            <line class="grid-line" x1="70" y1="20" x2="816" y2="20"></line>
            <text class="grid-label" x="60" y="424" text-anchor="end">0</text>
            <text class="grid-label" x="60" y="324" text-anchor="end">200</text>
            <text class="grid-label" x="60" y="224" text-anchor="end">400</text>
            <text class="grid-label" x="60" y="124" text-anchor="end">600</text>
            <text class="grid-label" x="60" y="24" text-anchor="end">800</text>
            <text class="axis-label" x="16" y="14">金额（元）</text>
          </g>
          <!-- axes -->
          <line class="axis-line" x1="70" y1="20" x2="70" y2="420"></line>
          <line class="axis-line" x1="70" y1="420" x2="816" y2="420"></line>
          <!-- x ticks -->
          <g>
            <text class="grid-label" x="70" y="446" text-anchor="middle">n=0</text>
            <text class="grid-label" x="219.2" y="446" text-anchor="middle">n=1</text>
            <text class="grid-label" x="368.4" y="446" text-anchor="middle">n=2</text>
            <text class="grid-label" x="517.6" y="446" text-anchor="middle">n=3</text>
            <text class="grid-label" x="666.8" y="446" text-anchor="middle">n=4</text>
            <text class="grid-label" x="816" y="446" text-anchor="middle">n=5</text>
            <text class="axis-label" x="443" y="464" text-anchor="middle">第 n 年</text>
          </g>
          <!-- baseline curve (fixed r=20%) -->
          <path id="curveBaseline" class="curve-baseline"></path>
          <!-- current curve -->
          <path id="curveCurrent" class="curve-current"></path>
          <g id="pointsCurrent"></g>
          <text id="lastLabelCurrent" class="last-value"></text>
        </svg>
      </div>
      <p class="chart-note nt-note">虚线为默认 20% 的基准曲线，用来对比增长速度快慢。</p>
    </section>

    <section class="control-panel nt-glass-soft">
      <div>
        <div class="rate-row">
          <label for="rate" class="nt-chip">年增长率 r</label>
          <button id="reset" class="nt-btn" type="button">重置为 20%</button>
        </div>
        <div class="slider-row">
          <input type="range" id="rate" min="0" max="50" step="1" value="20"
                 aria-label="年增长率，百分之0到50"
                 aria-valuemin="0" aria-valuemax="50" aria-valuenow="20" aria-valuetext="20%">
          <span class="rate-value"><span id="rateDisplay">20</span>%</span>
        </div>
        <div class="range-scale nt-axis"><span>0%</span><span>25%</span><span>50%</span></div>
      </div>

      <div class="nt-formula">
        A(n) = 100 × (1 + <span class="nt-formula-part" id="rFormula">0.20</span>)<sup>n</sup>
      </div>

      <div class="amount-block">
        <p class="nt-note">第 5 年金额（n = 5）</p>
        <div class="amount-row"><span id="amount" class="amount-value">248.83</span><span class="unit">元</span></div>
        <p class="nt-note" id="deltaNote">比本金增长 148.83 元</p>
      </div>

      <div>
        <p class="seq-title">n = 0..5 各年金额（元）</p>
        <ol class="nt-sequence" id="sequenceList"></ol>
      </div>
    </section>

  </div>

</div>
<script src="assets/base.js"></script>
<script>
  Deck.init({ index: 2, total: 3, keys: false });

  (function(){
    const rateInput   = document.getElementById('rate');
    const rateDisplay  = document.getElementById('rateDisplay');
    const legendRate   = document.getElementById('legendRate');
    const rFormula     = document.getElementById('rFormula');
    const amountEl      = document.getElementById('amount');
    const deltaNote     = document.getElementById('deltaNote');
    const resetBtn       = document.getElementById('reset');
    const curveCurrent  = document.getElementById('curveCurrent');
    const curveBaseline = document.getElementById('curveBaseline');
    const pointsGroup    = document.getElementById('pointsCurrent');
    const lastLabel      = document.getElementById('lastLabelCurrent');
    const sequenceList   = document.getElementById('sequenceList');

    const DEFAULT_RATE = 20;
    const N = [0, 1, 2, 3, 4, 5];

    // plot mapping: fixed domain so curves stay comparable across rates
    const plot = { x0: 70, x1: 816, y0: 20, y1: 420, yMax: 800 };
    function xPix(n) { return plot.x0 + (n / 5) * (plot.x1 - plot.x0); }
    function yPix(v) { return plot.y1 - (Math.min(v, plot.yMax) / plot.yMax) * (plot.y1 - plot.y0); }

    function seriesFor(ratePercent) {
      const r = ratePercent / 100;
      return N.map(n => 100 * Math.pow(1 + r, n));
    }

    function pathFor(series) {
      return series.map((v, i) => (i === 0 ? 'M' : 'L') + xPix(i).toFixed(1) + ',' + yPix(v).toFixed(1)).join(' ');
    }

    // baseline never changes: draw once
    curveBaseline.setAttribute('d', pathFor(seriesFor(DEFAULT_RATE)));

    function render(ratePercent) {
      const series = seriesFor(ratePercent);

      curveCurrent.setAttribute('d', pathFor(series));

      pointsGroup.innerHTML = '';
      series.forEach((v, i) => {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', xPix(i).toFixed(1));
        c.setAttribute('cy', yPix(v).toFixed(1));
        c.setAttribute('r', 5.5);
        c.setAttribute('class', 'pt-current');
        pointsGroup.appendChild(c);
      });

      const amount = series[5];
      amountEl.textContent = amount.toFixed(2);

      const lx = xPix(5) - 8, ly = yPix(amount) - 14;
      lastLabel.setAttribute('x', lx.toFixed(1));
      lastLabel.setAttribute('y', ly.toFixed(1));
      lastLabel.setAttribute('text-anchor', 'end');
      lastLabel.textContent = amount.toFixed(2);

      deltaNote.textContent = '比本金增长 ' + (amount - 100).toFixed(2) + ' 元';

      rateDisplay.textContent = ratePercent;
      legendRate.textContent = ratePercent;
      rFormula.textContent = (ratePercent / 100).toFixed(2);
      rateInput.setAttribute('aria-valuenow', ratePercent);
      rateInput.setAttribute('aria-valuetext', ratePercent + '%');

      let html = '';
      series.forEach((v, i) => {
        html += '<li class="nt-term"><span class="n-label">n=' + i + '</span><span class="n-value">' + v.toFixed(2) + '</span></li>';
      });
      sequenceList.innerHTML = html;
    }

    rateInput.addEventListener('input', e => render(+e.target.value));
    resetBtn.addEventListener('click', () => {
      rateInput.value = DEFAULT_RATE;
      render(DEFAULT_RATE);
      rateInput.focus();
    });

    render(DEFAULT_RATE);
  })();
</script>
</body>
</html>
