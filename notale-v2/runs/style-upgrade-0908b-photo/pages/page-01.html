<!doctype html>
<html lang="zh" data-variant="opening">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>指数增长：每一步都乘以 1.2</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .cover-left{
      position:absolute; left:110px; top:88px; width:600px;
      display:flex; flex-direction:column; gap:var(--sp-4);
    }
    .cover-left > *{ margin:0; }
    .relation-figure{ display:flex; flex-direction:column; gap:var(--sp-2); }
    .relation-chart{ width:100%; aspect-ratio:620/260; display:block; }
    .relation-chart .nt-axis-label{
      fill:var(--muted); font-family:var(--font-sans); font-size:14px;
    }
    .relation-chart .callout{ font-family:var(--font-mono); font-weight:700; font-size:var(--fs-label); }
  </style>
</head>
<body data-page="01" data-total="3">
  <div id="stage">
    <div class="cover-left">
      <p class="nt-kicker">本金 100 · 年增长率 20%</p>

      <h1 class="nt-title">指数增长<br><strong>每步乘以 1.2</strong></h1>

      <p class="nt-formula" aria-label="A(n) 等于 100 乘以 1.2 的 n 次方">
        <span>A(n) = </span><span class="nt-principal">100</span><span> × </span><span class="nt-growth">1.2</span><span>ⁿ</span>
      </p>

      <figure class="relation-figure">
        <svg class="relation-chart nt-growth-chart" viewBox="0 0 620 260" role="img"
             aria-label="折线图：n 从 0 到 5，金额依次为 100、120、144、172.8、207.36、248.832，逐年增量变大">
          <line class="nt-axis" x1="60" y1="210" x2="600" y2="210"></line>
          <line class="nt-axis" x1="60" y1="34" x2="60" y2="210"></line>

          <path class="nt-area" d="M60,210 L168,186.34 L276,157.94 L384,123.89 L492,83.03 L600,34 L600,210 L60,210 Z"></path>
          <path class="nt-line" d="M60,210 L168,186.34 L276,157.94 L384,123.89 L492,83.03 L600,34"></path>

          <circle class="nt-point" cx="60" cy="210" r="6"></circle>
          <circle class="nt-point" cx="168" cy="186.34" r="6"></circle>
          <circle class="nt-point" cx="276" cy="157.94" r="6"></circle>
          <circle class="nt-point" cx="384" cy="123.89" r="6"></circle>
          <circle class="nt-point" cx="492" cy="83.03" r="6"></circle>
          <circle class="nt-point is-current" cx="600" cy="34" r="7"></circle>

          <text class="nt-tick" x="60" y="232" text-anchor="middle">0</text>
          <text class="nt-tick" x="168" y="232" text-anchor="middle">1</text>
          <text class="nt-tick" x="276" y="232" text-anchor="middle">2</text>
          <text class="nt-tick" x="384" y="232" text-anchor="middle">3</text>
          <text class="nt-tick" x="492" y="232" text-anchor="middle">4</text>
          <text class="nt-tick" x="600" y="232" text-anchor="middle">5</text>
          <text class="nt-axis-label" x="330" y="252" text-anchor="middle">n（年）</text>

          <text class="callout" x="70" y="202" style="fill:var(--principal)">100</text>
          <text class="callout" x="596" y="20" text-anchor="end" style="fill:var(--current)">248.832</text>
        </svg>
        <figcaption class="nt-caption">每一步乘以 1.2，增量逐年变大，不是每年加同一个数。</figcaption>
      </figure>

      <p class="nt-lead">第 5 年，账户会变成本金的多少倍？</p>
    </div>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({ index: 1, total: 3 });</script>
</body>
</html>
