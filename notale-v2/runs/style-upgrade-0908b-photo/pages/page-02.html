<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>复利公式：新增额本身在增长</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{ overflow:hidden; }

  .page-head{
    position:absolute;
    left:70px;
    right:70px;
    top:52px;
  }
  .page-head .nt-lead{ margin-top:10px; max-width:none; font-size:var(--fs-body); }

  .composition{
    position:absolute;
    left:70px;
    right:70px;
    top:222px;
    bottom:52px;
    display:grid;
    grid-template-columns: 512px minmax(0,1fr);
    gap:46px;
  }

  .explain{
    display:flex;
    flex-direction:column;
    gap:var(--sp-3);
    min-height:0;
  }

  .explain .nt-formula{
    padding-bottom:var(--sp-2);
    border-bottom:1px solid var(--rule);
  }

  .delta-rule{
    padding-inline-start:var(--sp-3);
    border-inline-start:5px solid var(--principal);
    color:var(--text);
    font-size:var(--fs-sec);
    line-height:1.5;
  }

  .delta-rule .nt-number{ font-size:1em; }

  .explain table{ width:100%; }

  .explain .nt-data-table th:nth-child(2),
  .explain .nt-data-table td:nth-child(2),
  .explain .nt-data-table th:nth-child(3),
  .explain .nt-data-table td:nth-child(3){
    font-family:var(--font-mono);
  }

  .explain .nt-data-table td:nth-child(3){
    color:var(--growth);
    font-weight:700;
  }

  .explain .nt-data-table tr.is-current td:nth-child(3){
    color:#7f3d12;
  }

  .chart-figure{
    position:relative;
    display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;
    min-height:0;
    border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
  }

  .figure-head{
    padding:0 4px var(--sp-2) 0;
  }

  .reader-question{
    max-width:44em;
    color:var(--text);
    font-size:var(--fs-sec);
    line-height:1.4;
  }

  .reader-question strong{ color:var(--current); }

  .plot-host{
    position:relative;
    min-height:0;
  }

  #chart{ position:absolute; inset:0; }

  .fallback{
    position:absolute;
    inset:12px;
    display:none;
    align-items:center;
    justify-content:center;
    padding:var(--sp-4);
    border:1px solid var(--rule);
    background:var(--paper);
    color:var(--text);
    font-size:var(--fs-sec);
    line-height:1.55;
    text-align:center;
  }

  .figure-note{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:var(--sp-3);
    padding:var(--sp-2) 4px var(--sp-1) 0;
  }
</style>
</head>
<body data-page="02" data-total="3">
  <div id="stage">
    <header class="page-head">
      <p class="nt-kicker">复利公式</p>
      <h1 class="nt-section-title">每年多赚的钱，一年比一年多</h1>
      <p class="nt-lead">本金100，年增长率20%：增量按<strong style="color:var(--principal)">上一年金额</strong>的20%算，不是固定20元。</p>
    </header>

    <section class="composition" aria-label="复利公式的推导与逐年增量">
      <div class="explain min0">
        <p class="nt-formula">
          <span class="nt-current">A(n)</span> = <span class="nt-principal">100</span> × (1 + <span class="nt-growth">20%</span>)<sup>n</sup>
        </p>
        <p class="delta-rule">第 n 年比第 n−1 年多出的部分：<br><span class="nt-number nt-principal">Δ(n)</span> = <span class="nt-number">A(n−1)</span> × <span class="nt-number nt-growth">20%</span></p>

        <table class="nt-data-table" aria-label="0至5年的金额与逐年增量">
          <thead>
            <tr><th scope="col">年 n</th><th scope="col">金额 A(n)</th><th scope="col">增量 Δ(n)</th></tr>
          </thead>
          <tbody id="deltaTableBody"></tbody>
        </table>

      </div>

      <figure class="chart-figure min0" aria-labelledby="chartQuestion">
        <div class="figure-head">
          <p class="reader-question" id="chartQuestion"><strong>柱子逐年变高，不是持平。</strong>上图是金额本身，下图是每年新增的那一截，虚线是“固定加20元”的参照。</p>
        </div>
        <div class="plot-host">
          <div id="chart" role="img" aria-label="上方折线图显示第0到第5年金额100、120、144、172.8、207.36、248.832；下方柱形图显示对应的五次年度增量20、24、28.8、34.56、41.472，均高于固定20元的虚线参照，且逐年升高。"></div>
          <div class="fallback" id="fallback">图表渲染器未启动。关键数值：0–5年金额依次为100、120、144、172.8、207.36、248.832；对应的五次年度增量依次为20、24、28.8、34.56、41.472元，均高于固定20元。</div>
        </div>
        <div class="figure-note">
          <p class="nt-caption">单位：元。虚线为“每年固定加本金的20%＝20元”的参照，柱高逐年超出虚线越多。</p>
        </div>
      </figure>
    </section>
  </div>

  <script src="assets/lib/echarts.min.js"></script>
  <script src="assets/base.js"></script>
  <script>
  (function () {
    'use strict';

    var principal = 100;
    var rate = 0.2;
    var years = [0, 1, 2, 3, 4, 5];
    var amounts = years.map(function (n) { return principal * Math.pow(1 + rate, n); });
    var deltas = years.slice(1).map(function (n) { return amounts[n] - amounts[n - 1]; });
    var flatDelta = principal * rate;

    function fmt(value) {
      var rounded = Math.round(value * 1000) / 1000;
      return rounded % 1 === 0 ? String(rounded) : String(rounded);
    }

    function buildTable() {
      var body = document.getElementById('deltaTableBody');
      var fragment = document.createDocumentFragment();
      years.forEach(function (n) {
        var row = document.createElement('tr');
        if (n === 5) row.className = 'is-current';
        var deltaText = n === 0 ? '—' : fmt(deltas[n - 1]);
        [String(n), fmt(amounts[n]), deltaText].forEach(function (text) {
          var cell = document.createElement('td');
          cell.textContent = text;
          row.appendChild(cell);
        });
        fragment.appendChild(row);
      });
      body.appendChild(fragment);
    }

    function colorFor(name) {
      var value = Deck.token(name);
      return value || '#2f6b4f';
    }

    function makeOption() {
      var growth = colorFor('--growth');
      var current = colorFor('--current');
      var principalColor = colorFor('--principal');
      var muted = colorFor('--muted');
      var rule = colorFor('--rule');
      var ruleStrong = colorFor('--rule-strong');
      var text = colorFor('--text');
      var reduced = Deck.reduced();

      var barColors = deltas.map(function (value, index) {
        return index === deltas.length - 1 ? current : growth;
      });

      return {
        animation: !reduced,
        animationDuration: reduced ? 0 : 600,
        backgroundColor: 'transparent',
        textStyle: { color: text, fontFamily: 'inherit', fontSize: 15 },
        aria: {
          enabled: true,
          description: '第0到第5年金额100、120、144、172.8、207.36、248.832；对应的五次年度增量20、24、28.8、34.56、41.472，均高于固定20元的参照并逐年升高。'
        },
        grid: [
          { left: 60, right: 24, top: 34, height: '42%' },
          { left: 60, right: 24, top: '64%', height: '26%' }
        ],
        xAxis: [
          {
            gridIndex: 0, type: 'category',
            data: years.map(function (n) { return n + '年'; }),
            axisLine: { lineStyle: { color: ruleStrong } },
            axisTick: { show: false },
            axisLabel: { color: muted, fontSize: 14 },
            splitLine: { show: false }
          },
          {
            gridIndex: 1, type: 'category',
            data: years.slice(1).map(function (n) { return '第' + n + '年'; }),
            axisLine: { lineStyle: { color: ruleStrong } },
            axisTick: { show: false },
            axisLabel: { color: muted, fontSize: 14 },
            splitLine: { show: false }
          }
        ],
        yAxis: [
          {
            gridIndex: 0, type: 'value', name: '金额（元）',
            nameTextStyle: { color: muted, fontSize: 13 },
            min: 0, max: 260,
            axisLine: { show: false }, axisTick: { show: false },
            axisLabel: { color: muted, fontSize: 13 },
            splitLine: { lineStyle: { color: rule, type: [3, 7] } }
          },
          {
            gridIndex: 1, type: 'value', name: '增量（元）',
            nameTextStyle: { color: muted, fontSize: 13 },
            min: 0, max: 48,
            axisLine: { show: false }, axisTick: { show: false },
            axisLabel: { color: muted, fontSize: 13 },
            splitLine: { lineStyle: { color: rule, type: [3, 7] } }
          }
        ],
        series: [
          {
            id: 'amount', name: '金额 A(n)', type: 'line',
            xAxisIndex: 0, yAxisIndex: 0,
            data: amounts, symbol: 'circle', symbolSize: 9,
            lineStyle: { color: principalColor, width: 4 },
            itemStyle: { color: principalColor, borderColor: '#fbfcf8', borderWidth: 2 },
            label: {
              show: true, position: 'top', color: text, fontSize: 14, fontWeight: 700,
              formatter: function (p) { return fmt(p.value); }
            },
            markPoint: {
              symbol: 'circle', symbolSize: 14, silent: true,
              itemStyle: { color: current, borderColor: '#fbfcf8', borderWidth: 2 },
              label: { show: false },
              data: [{ coord: ['5年', amounts[5]] }]
            }
          },
          {
            id: 'delta', name: '年度增量 Δ(n)', type: 'bar',
            xAxisIndex: 1, yAxisIndex: 1,
            data: deltas.map(function (value, index) {
              return { value: value, itemStyle: { color: barColors[index] } };
            }),
            barWidth: '46%',
            label: {
              show: true, position: 'top', color: text, fontSize: 14, fontWeight: 700,
              formatter: function (p) { return fmt(p.value); }
            },
            markLine: {
              symbol: 'none', silent: true,
              lineStyle: { color: ruleStrong, type: 'dashed', width: 2 },
              label: { color: muted, fontSize: 13, formatter: '固定20元参照', position: 'insideEndTop' },
              data: [{ yAxis: flatDelta }]
            }
          }
        ]
      };
    }

    buildTable();
    Deck.init({ index: 2, total: 3 });

    var chartHost = document.getElementById('chart');
    var fallback = document.getElementById('fallback');
    var chart = null;
    var resizeObserver = null;

    function scheduleResize() {
      if (chart && !chart.isDisposed()) chart.resize({ animation: { duration: 0 } });
    }

    try {
      if (!window.echarts) throw new Error('ECharts unavailable');
      chart = echarts.init(chartHost, null, { renderer: 'svg' });
      chart.setOption(makeOption(), { notMerge: true });
      if (window.ResizeObserver) {
        resizeObserver = new ResizeObserver(scheduleResize);
        resizeObserver.observe(chartHost.parentElement);
      }
      Deck.onResize(scheduleResize);
    } catch (error) {
      chartHost.hidden = true;
      fallback.style.display = 'flex';
    }
  })();
  </script>
</body>
</html>
