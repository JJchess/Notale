<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{position:relative;overflow:hidden}
  .panel-left{position:absolute;left:90px;top:76px;width:560px}
  .panel-left .nt-kicker{margin:0 0 var(--sp-2)}
  .panel-left .nt-title{margin:0 0 var(--sp-3)}
  .panel-left .nt-lead{margin:0 0 var(--sp-4)}
  .formula-row{margin:0 0 var(--sp-5)}
  .formula-row .nt-formula{display:inline-block}
  .controls-block{margin:0 0 var(--sp-4)}
  .controls-block label{display:block;font-size:var(--fs-label);color:var(--muted);margin-bottom:var(--sp-2)}
  .rate-row{display:flex;align-items:center;gap:var(--sp-3)}
  .rate-row input[type=range]{flex:1;accent-color:var(--current);height:28px;cursor:pointer}
  #rateLabel{font-size:var(--fs-sec);font-weight:600;color:var(--current);min-width:3.4em;text-align:right;font-variant-numeric:tabular-nums}
  #reset{margin-top:var(--sp-3);font:inherit;font-size:var(--fs-label);padding:8px 16px;border:1px solid var(--muted);border-radius:6px;background:transparent;color:var(--text);cursor:pointer}
  #reset:hover{border-color:var(--text)}
  .amount-block{margin:0 0 var(--sp-3);padding-top:var(--sp-2);border-top:1px solid color-mix(in srgb, var(--muted) 35%, transparent)}
  .amount-block .nt-note{margin:0 0 4px}
  .amount-block .nt-number{margin:0;color:var(--growth)}
  #explain{margin:0;min-height:2.7em}
  .panel-right{position:absolute;left:720px;top:76px;width:790px;height:760px}
  .panel-right .nt-note.chart-title{position:absolute;left:0;top:0;margin:0}
  .legend{position:absolute;right:0;top:0;display:flex;gap:var(--sp-4);font-size:var(--fs-label);color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:20px;height:0;border-top:3px solid}
  .swatch.cur{border-color:var(--current)}
  .swatch.ref{border-top-style:dashed;border-color:var(--principal)}
  #chart{position:absolute;left:0;top:34px;width:100%;height:calc(100% - 34px)}
</style>
</head>
<body data-page="03" data-total="3">
<div id="stage">

  <section class="panel-left">
    <p class="nt-kicker">交互探索</p>
    <h1 class="nt-title">拖动增长率，看曲线怎么被拉高</h1>
    <p class="nt-lead">本金 100，年份 n=0..5。调整年增长率 r，公式立即重新计算每年金额，曲线随之改变形状。</p>

    <div class="formula-row">
      <div class="nt-formula" id="formulaLive">A(n) = 100 × (1 + <span id="rateInFormula">0.20</span>)<sup>n</sup></div>
    </div>

    <div class="controls-block nt-controls">
      <label for="rate">年增长率 r（0%–50%）</label>
      <div class="rate-row">
        <input type="range" id="rate" min="0" max="50" step="1" value="20" aria-describedby="rateLabel">
        <span id="rateLabel" aria-live="polite">20%</span>
      </div>
      <button id="reset" type="button">重置为 20%</button>
    </div>

    <div class="amount-block">
      <p class="nt-note">第 5 年金额（A(5)）</p>
      <p class="nt-number" id="amount">248.83</p>
    </div>

    <p class="nt-note" id="explain" aria-live="polite"></p>

  <div class="sr-only" id="srTable" aria-live="polite" style="top:0;left:0"></div>
  </section>

  <section class="panel-right nt-growth-chart">
    <p class="nt-note chart-title">A(n) 随 n 的曲线 · 虚线为默认 r=20% 基准</p>
    <div class="legend">
      <span><i class="swatch cur"></i>当前 r</span>
      <span><i class="swatch ref"></i>默认 20%</span>
    </div>
    <svg id="chart" viewBox="0 0 790 726" role="img" aria-label="金额随年份增长的曲线图">
      <g id="gridGroup"></g>
      <g id="axisGroup"></g>
      <path id="ghostPath" fill="none" stroke-width="3" stroke-dasharray="7 7" opacity="0.6"></path>
      <g id="ghostPoints"></g>
      <path id="currentPath" fill="none" stroke-width="4"></path>
      <g id="currentPoints"></g>
    </svg>
  </section>

</div>
<script src="assets/base.js"></script>
<script>
(function(){
  var PRINCIPAL = 100;
  var DEFAULT_RATE = 20;
  var N_MAX = 5;

  function series(ratePct){
    var r = ratePct/100;
    var out = [];
    for (var n=0; n<=N_MAX; n++) out.push({n:n, v: PRINCIPAL*Math.pow(1+r, n)});
    return out;
  }

  var GHOST = series(DEFAULT_RATE);
  var GHOST_LAST = GHOST[N_MAX].v;

  // plot geometry (viewBox 0 0 790 726)
  var M = {l:64, r:26, t:16, b:64};
  var VBW = 790, VBH = 726;
  var plotW = VBW - M.l - M.r;
  var plotH = VBH - M.t - M.b;

  function xFor(n){ return M.l + (n/N_MAX)*plotW; }
  function yFor(v, yMax){ return M.t + (1 - v/yMax)*plotH; }
  function fmt(v){ return v.toFixed(2); }

  var svgNS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    var e = document.createElementNS(svgNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }

  var gridGroup = document.getElementById('gridGroup');
  var axisGroup = document.getElementById('axisGroup');
  var ghostPath = document.getElementById('ghostPath');
  var ghostPoints = document.getElementById('ghostPoints');
  var currentPath = document.getElementById('currentPath');
  var currentPoints = document.getElementById('currentPoints');

  function pathFor(pts, yMax){
    return pts.map(function(p, i){
      return (i===0?'M':'L') + xFor(p.n).toFixed(2) + ',' + yFor(p.v, yMax).toFixed(2);
    }).join(' ');
  }

  function computedColor(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function render(ratePct){
    var data = series(ratePct);
    var curLast = data[N_MAX].v;
    var yMax = Math.max(curLast, GHOST_LAST) * 1.15;

    // grid + axis
    clear(gridGroup);
    clear(axisGroup);
    var muted = computedColor('--muted');
    var textCol = computedColor('--text');
    var TICKS = 5;
    for (var i=0;i<=TICKS;i++){
      var frac = i/TICKS;
      var yy = M.t + (1-frac)*plotH;
      gridGroup.appendChild(el('line', {
        x1:M.l, x2:VBW-M.r, y1:yy, y2:yy,
        stroke: muted, opacity: i===0? 0.5 : 0.22, 'stroke-width': i===0?2:1
      }));
      var lbl = el('text', {x:M.l-10, y:yy+4, 'text-anchor':'end', 'font-size':14, fill:muted});
      lbl.textContent = Math.round(frac*yMax);
      axisGroup.appendChild(lbl);
    }
    for (var n=0;n<=N_MAX;n++){
      var xx = xFor(n);
      var xl = el('text', {x:xx, y:VBH-M.b+26, 'text-anchor':'middle', 'font-size':14, fill:textCol});
      xl.textContent = n;
      axisGroup.appendChild(xl);
    }
    var xCap = el('text', {x:(M.l+VBW-M.r)/2, y:VBH-M.b+50, 'text-anchor':'middle', 'font-size':14, fill:muted});
    xCap.textContent = '年份 n';
    axisGroup.appendChild(xCap);

    // ghost (fixed r=20% reference)
    var principalCol = computedColor('--principal');
    ghostPath.setAttribute('stroke', principalCol);
    ghostPath.setAttribute('d', pathFor(GHOST, yMax));
    clear(ghostPoints);
    GHOST.forEach(function(p){
      ghostPoints.appendChild(el('circle', {cx:xFor(p.n), cy:yFor(p.v, yMax), r:4, fill:principalCol, opacity:0.6}));
    });

    // current curve
    var currentCol = computedColor('--current');
    var growthCol = computedColor('--growth');
    currentPath.setAttribute('stroke', currentCol);
    currentPath.setAttribute('d', pathFor(data, yMax));
    clear(currentPoints);
    data.forEach(function(p, i){
      var cx = xFor(p.n), cy = yFor(p.v, yMax);
      currentPoints.appendChild(el('circle', {cx:cx, cy:cy, r:6, fill:currentCol}));
      var above = (i % 2 === 0);
      var ly = above ? cy-14 : cy+22;
      var t = el('text', {x:cx, y:ly, 'text-anchor':'middle', 'font-size':14, fill:growthCol, 'font-weight':600});
      t.textContent = fmt(p.v);
      currentPoints.appendChild(t);
    });

    // readouts
    document.getElementById('rateLabel').textContent = ratePct + '%';
    document.getElementById('rateInFormula').textContent = (ratePct/100).toFixed(2);
    document.getElementById('amount').textContent = fmt(curLast);

    // explanation
    var diff = curLast - GHOST_LAST;
    var msg;
    if (ratePct === DEFAULT_RATE){
      msg = '当前与默认 20% 一致，两条曲线完全重合。';
    } else if (ratePct === 0){
      msg = 'r=0% 时金额不再增长，五年后仍是本金 100，曲线是一条水平线。';
    } else if (diff > 0){
      msg = 'r 提高到 ' + ratePct + '%，第 5 年金额比默认 20% 多 ' + fmt(diff) + '，曲线更陡。';
    } else {
      msg = 'r 降到 ' + ratePct + '%，第 5 年金额比默认 20% 少 ' + fmt(-diff) + '，曲线更平。';
    }
    document.getElementById('explain').textContent = msg;

    var srParts = data.map(function(p){ return 'n=' + p.n + '：' + fmt(p.v); });
    document.getElementById('srTable').textContent = '年增长率 ' + ratePct + '% 下各年金额：' + srParts.join('，');
  }

  var rateInput = document.getElementById('rate');
  var resetBtn = document.getElementById('reset');

  rateInput.addEventListener('input', function(){
    render(parseFloat(rateInput.value));
  });
  resetBtn.addEventListener('click', function(){
    rateInput.value = DEFAULT_RATE;
    render(DEFAULT_RATE);
    rateInput.focus();
  });

  render(DEFAULT_RATE);

  if (window.Deck && Deck.init) Deck.init({index:3, total:3});
})();
</script>
</body>
</html>
