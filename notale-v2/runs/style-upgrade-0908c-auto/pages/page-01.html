<!doctype html>
<html lang="zh" data-variant="opening">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      position: relative;
      overflow: hidden;
      color: var(--text);
      font-family: var(--font-sans);
    }
    .copy {
      position: absolute;
      z-index: 3;
      left: 92px;
      top: 92px;
      width: 690px;
    }
    .copy .nt-kicker { margin: 0 0 24px; }
    h1.nt-title {
      margin: 0;
      max-width: 650px;
      font-size: var(--fs-h1);
      line-height: .94;
      letter-spacing: -.055em;
    }
    .relation {
      position: absolute;
      z-index: 4;
      left: 92px;
      top: 420px;
      display: flex;
      align-items: baseline;
      gap: 22px;
      margin: 0;
      white-space: nowrap;
    }
    .relation__lead {
      font-size: var(--fs-lead);
      font-weight: 700;
      letter-spacing: -.025em;
    }
    .relation__factor {
      color: var(--growth);
      font-size: var(--fs-h1);
      font-weight: 900;
      line-height: .9;
      letter-spacing: -.06em;
    }
    .question {
      position: absolute;
      z-index: 4;
      left: 96px;
      bottom: 82px;
      width: 560px;
      margin: 0;
      padding-top: 18px;
      border-top: 4px solid currentColor;
      font-size: var(--fs-lead);
      font-weight: 700;
      line-height: 1.35;
    }
    .growth-figure {
      position: absolute;
      z-index: 2;
      inset: 0;
      margin: 0;
      pointer-events: none;
    }
    .bars {
      position: absolute;
      right: 70px;
      bottom: 70px;
      width: 790px;
      height: 700px;
      overflow: visible;
    }
    .bar { fill: var(--accent); }
    .bar.final { fill: var(--growth); }
    .guide {
      fill: none;
      stroke: var(--text);
      stroke-width: 3;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
    .year, .amount, .axis-label { font-family: var(--font-sans); fill: var(--text); }
    .year { font-size: var(--fs-label); font-weight: 700; }
    .amount { font-size: var(--fs-label); font-weight: 800; }
    .axis-label { font-size: var(--fs-label); fill: var(--muted); }
    .multiplier {
      font-family: var(--font-sans);
      font-size: var(--fs-body);
      font-weight: 900;
      fill: var(--growth);
    }
    .signature {
      position: absolute;
      z-index: 5;
      right: 82px;
      top: 92px;
      margin: 0;
      font-size: var(--fs-body);
      font-weight: 800;
      text-align: right;
      line-height: 1.35;
    }
    .signature strong { color: var(--growth); }
  </style>
</head>
<body data-page="01" data-total="3">
  <div id="stage" aria-labelledby="title" aria-describedby="question growth-desc">
    <header class="copy">
      <p class="nt-kicker">本金 100 · 年增长率 20%</p>
      <h1 class="nt-title" id="title">指数<br>增长</h1>
    </header>

    <p class="relation" aria-label="每一年都把上一年的金额乘以一点二">
      <span class="relation__lead">每一步都乘以</span>
      <strong class="relation__factor">1.2</strong>
    </p>

    <p class="signature"><span>A(n) = 100 × (1 + r)<sup>n</sup></span><br><strong>r = 20%</strong></p>

    <figure class="growth-figure" aria-labelledby="growth-desc">
      <svg class="bars" viewBox="0 0 790 700" role="img">
        <title id="growth-desc">从第0年到第5年，金额依次为100、120、144、172.8、207.36和248.832；每一年都是上一年的1.2倍。</title>
        <path class="guide" d="M40 590 H770 M40 590 V62" opacity=".55"/>

        <g>
          <rect class="bar" x="62" y="390" width="84" height="200"/>
          <text class="amount" x="104" y="372" text-anchor="middle">100</text>
          <text class="year" x="104" y="628" text-anchor="middle">0年</text>
        </g>
        <g>
          <rect class="bar" x="184" y="350" width="84" height="240"/>
          <text class="amount" x="226" y="332" text-anchor="middle">120</text>
          <text class="year" x="226" y="628" text-anchor="middle">1年</text>
        </g>
        <g>
          <rect class="bar" x="306" y="302" width="84" height="288"/>
          <text class="amount" x="348" y="284" text-anchor="middle">144</text>
          <text class="year" x="348" y="628" text-anchor="middle">2年</text>
        </g>
        <g>
          <rect class="bar" x="428" y="244.4" width="84" height="345.6"/>
          <text class="amount" x="470" y="226" text-anchor="middle">172.8</text>
          <text class="year" x="470" y="628" text-anchor="middle">3年</text>
        </g>
        <g>
          <rect class="bar" x="550" y="175.28" width="84" height="414.72"/>
          <text class="amount" x="592" y="157" text-anchor="middle">207.36</text>
          <text class="year" x="592" y="628" text-anchor="middle">4年</text>
        </g>
        <g>
          <rect class="bar final" x="672" y="92.336" width="84" height="497.664"/>
          <text class="amount" x="714" y="74" text-anchor="middle">248.832</text>
          <text class="year" x="714" y="628" text-anchor="middle">5年</text>
        </g>

        <path class="guide" d="M104 372 L226 332 L348 284 L470 226 L592 157 L714 74"/>
        <text class="multiplier" x="155" y="322">×1.2</text>
        <text class="multiplier" x="641" y="102">×1.2</text>
      </svg>
    </figure>

    <p class="question" id="question">同样是 20%，为什么每年增加的钱越来越多？</p>
  </div>
  <script src="assets/base.js"></script>
  <script>Deck.init({ index: 1, total: 3, title: "指数增长" });</script>
</body>
</html>
