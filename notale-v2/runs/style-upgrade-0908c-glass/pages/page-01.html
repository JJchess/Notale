<!doctype html>
<html lang="zh" data-variant="opening">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage { color: var(--text); overflow: hidden; }
    .growth-field { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .copy { position: absolute; z-index: 4; left: 108px; top: 92px; width: 780px; }
    .copy .nt-kicker { margin: 0 0 var(--sp-3); }
    h1.nt-title { margin: 0; max-width: 760px; font-size: var(--fs-h1); line-height: 1.02; letter-spacing: -.045em; }
    .lead { margin: var(--sp-4) 0 0; max-width: 610px; font-size: var(--fs-lead); line-height: 1.48; color: var(--muted); }
    .lead strong { color: var(--text); font-weight: 650; }
    .formula-wrap { position: absolute; z-index: 5; left: 108px; top: 563px; display: flex; align-items: center; gap: var(--sp-3); }
    .formula-wrap .nt-formula { margin: 0; padding: 20px 28px; white-space: nowrap; font-size: var(--fs-h2); }
    .formula-note { max-width: 220px; color: var(--muted); font-size: var(--fs-body); line-height: 1.45; }
    .plot { position: absolute; z-index: 3; left: 760px; top: 150px; width: 748px; height: 560px; margin: 0; }
    .plot svg { width: 100%; height: 100%; overflow: visible; }
    .curve-shadow { fill: none; stroke: var(--growth); stroke-width: 20; opacity: .12; filter: blur(10px); }
    .curve { fill: none; stroke: var(--growth); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .guide { fill: none; stroke: color-mix(in srgb, var(--text) 16%, transparent); stroke-width: 1; stroke-dasharray: 5 9; }
    .stem { stroke: color-mix(in srgb, var(--text) 24%, transparent); stroke-width: 1; }
    .dot-halo { fill: var(--growth); opacity: .18; }
    .dot { fill: var(--growth); stroke: color-mix(in srgb, var(--text) 88%, transparent); stroke-width: 2; }
    .year { fill: var(--muted); font: 600 var(--fs-label)/1 var(--font-sans); }
    .value { fill: var(--text); font: 650 var(--fs-body)/1 var(--font-sans); }
    .ratio { fill: var(--growth); font: 700 var(--fs-label)/1 var(--font-sans); letter-spacing: .02em; }
    .plot figcaption { position: absolute; left: 52px; bottom: -22px; color: var(--muted); font-size: var(--fs-label); line-height: 1.4; }
    .question { position: absolute; z-index: 5; left: 108px; bottom: 72px; margin: 0; width: 1220px; padding-top: 22px; border-top: 1px solid color-mix(in srgb, var(--text) 18%, transparent); font-size: var(--fs-h2); line-height: 1.32; letter-spacing: -.02em; }
    .question span { color: var(--growth); }
  </style>
</head>
<body data-page="01" data-total="3">
  <div id="stage">
    <canvas id="field" class="growth-field cv-fill" aria-hidden="true"></canvas>

    <header class="copy">
      <p class="nt-kicker">本金 100 · 年增长率 20%</p>
      <h1 class="nt-title" id="page-title">指数增长：<br>每一步都乘以 1.2</h1>
      <p class="lead">下一年的金额，不是固定加 20；而是把<strong>上一年的金额</strong>再乘一次 1.2。</p>
    </header>

    <div class="formula-wrap" aria-label="增长关系">
      <div class="nt-formula"><span class="nt-formula-part">A(n+1)</span> = A(n) × 1.2</div>
      <div class="formula-note">同一个倍率，作用在不断变大的金额上。</div>
    </div>

    <figure class="plot" aria-labelledby="plot-caption">
      <svg id="growth-svg" viewBox="0 0 748 560" role="img" aria-label="从第0年100增长到第5年248.832的指数增长轨迹"></svg>
      <figcaption id="plot-caption">n = 0…5，每一段都执行同一次乘法</figcaption>
    </figure>

    <p class="question">如果倍率始终相同，为什么曲线会<span>越来越陡</span>？</p>
  </div>
  <script src="assets/base.js"></script>
  <script>
    (() => {
      'use strict';
      Deck.init({ index: 1, total: 3 });

      const principal = 100;
      const rate = 0.20;
      const values = Array.from({ length: 6 }, (_, n) => principal * Math.pow(1 + rate, n));
      const labels = values.map((value, n) => n < 3 ? value.toFixed(0) : String(Number(value.toFixed(3))));
      const svg = document.getElementById('growth-svg');
      const NS = 'http://www.w3.org/2000/svg';
      const xs = [60, 178, 296, 414, 532, 650];
      const baseline = 468;
      const top = 62;
      const min = principal;
      const max = values[5];
      const ys = values.map(value => baseline - (value - min) / (max - min) * (baseline - top));
      const make = (tag, attrs, text) => {
        const el = document.createElementNS(NS, tag);
        Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
        if (text !== undefined) el.textContent = text;
        return el;
      };
      const pathData = xs.map((x, i) => `${i ? 'L' : 'M'} ${x} ${ys[i]}`).join(' ');
      svg.append(make('path', { d: `M 40 ${baseline} H 682`, class: 'guide' }));
      svg.append(make('path', { d: pathData, class: 'curve-shadow' }));
      svg.append(make('path', { d: pathData, class: 'curve' }));
      values.forEach((value, i) => {
        if (i > 0) {
          svg.append(make('text', {
            x: (xs[i - 1] + xs[i]) / 2,
            y: (ys[i - 1] + ys[i]) / 2 - 18,
            class: 'ratio',
            'text-anchor': 'middle'
          }, '×1.2'));
        }
        svg.append(make('line', { x1: xs[i], y1: ys[i] + 10, x2: xs[i], y2: baseline + 12, class: 'stem' }));
        svg.append(make('circle', { cx: xs[i], cy: ys[i], r: 18, class: 'dot-halo' }));
        svg.append(make('circle', { cx: xs[i], cy: ys[i], r: 7, class: 'dot' }));
        const labelY = i === 5 ? ys[i] - 28 : ys[i] - 24;
        svg.append(make('text', { x: xs[i], y: labelY, class: 'value', 'text-anchor': 'middle' }, labels[i]));
        svg.append(make('text', { x: xs[i], y: baseline + 42, class: 'year', 'text-anchor': 'middle' }, `第${i}年`));
      });

      const canvas = document.getElementById('field');
      function draw() {
        const ctx = Deck.fit(canvas);
        const growth = Deck.rgb('growth');
        const text = Deck.rgb('text');
        ctx.clearRect(0, 0, Deck.W, Deck.H);
        const origin = { x: 1025, y: 640 };
        for (let i = 0; i < 34; i += 1) {
          const phase = i / 33;
          const startX = 675 + phase * 620;
          const startY = 810 - Math.pow(phase, 1.7) * 660;
          ctx.beginPath();
          ctx.moveTo(startX, 900);
          ctx.bezierCurveTo(startX + 20, 730, origin.x + phase * 300, startY + 130, 1540, startY);
          ctx.strokeStyle = `rgba(${growth.join(',')},${0.018 + phase * 0.025})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        for (let i = 0; i < 24; i += 1) {
          const t = i / 23;
          const x = 900 + t * 610;
          const y = 720 - Math.pow(t, 1.8) * 620;
          ctx.fillStyle = `rgba(${text.join(',')},${0.035 + t * 0.04})`;
          ctx.beginPath();
          ctx.arc(x, y, 1.5 + t * 1.4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      Deck.autofit(canvas, draw);
    })();
  </script>
</body>
</html>
