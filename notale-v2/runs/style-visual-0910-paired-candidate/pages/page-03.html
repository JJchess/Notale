<!doctype html>
<html lang="zh" data-variant="practice">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    #stage {
      padding: 60px 80px 50px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .nt-title {
      margin: 0;
      font-size: 38px;
      line-height: 1.15;
    }

    .nt-title-en {
      display: block;
      font-size: 20px;
      opacity: 0.65;
      margin-top: 4px;
      font-weight: normal;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    .formula-badge {
      font-family: var(--font-sans);
      font-size: 18px;
      background: rgba(0, 0, 0, 0.04);
      border: 1.5px dashed currentColor;
      border-radius: 8px;
      padding: 6px 14px;
      letter-spacing: 0.5px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1040px 360px;
      gap: 40px;
      height: 600px;
      align-items: stretch;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    svg.nt-growth-chart {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .axis-line {
      stroke: var(--text);
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .grid-line {
      stroke: rgba(0, 0, 0, 0.1);
      stroke-dasharray: 4 4;
      stroke-width: 1;
    }

    .chart-curve {
      fill: none;
      stroke: #1677ff;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: d 0.08s ease-out;
    }

    .chart-dot {
      fill: #fff;
      stroke: #1677ff;
      stroke-width: 3.5;
      transition: cx 0.08s ease-out, cy 0.08s ease-out;
    }

    .chart-dot-final {
      fill: #1677ff;
      stroke: #fff;
      stroke-width: 2.5;
    }

    .label-year {
      font-size: 14px;
      text-anchor: middle;
      fill: var(--text);
    }

    .label-val {
      font-size: 13px;
      text-anchor: middle;
      fill: var(--text);
      font-weight: bold;
    }

    .label-axis {
      font-size: 14px;
      fill: var(--text);
      opacity: 0.7;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .result-card {
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid var(--text);
      border-radius: 12px;
      padding: 24px;
      position: relative;
      box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.08);
    }

    .result-label {
      font-size: 15px;
      color: var(--text);
      opacity: 0.8;
      margin-bottom: 8px;
    }

    .result-value-wrap {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .curr-sym {
      font-size: 26px;
      font-weight: bold;
    }

    #amount {
      font-size: 52px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: #1677ff;
    }

    .result-diff {
      margin-top: 12px;
      font-size: 15px;
      line-height: 1.4;
    }

    .nt-controls {
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid var(--text);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .slider-title {
      font-size: 16px;
      font-weight: bold;
    }

    .slider-val-tag {
      font-size: 24px;
      font-weight: bold;
      color: #1677ff;
    }

    input[type=range] {
      width: 100%;
      height: 10px;
      cursor: pointer;
      accent-color: #1677ff;
      margin: 4px 0;
    }

    .range-limits {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      opacity: 0.6;
    }

    button#reset {
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      padding: 10px 16px;
      background: #fff;
      border: 2px solid var(--text);
      border-radius: 8px;
      transition: background 0.15s, transform 0.05s;
    }

    button#reset:hover {
      background: #f0f0f0;
    }

    button#reset:active {
      transform: translate(1px, 1px);
    }

    .hint-note {
      font-size: 15px;
      line-height: 1.5;
      padding: 14px;
      border-left: 3px solid #1677ff;
      background: rgba(22, 119, 255, 0.06);
      border-radius: 0 8px 8px 0;
    }
  </style>
</head>
<body data-page="03" data-total="3">
  <div id="stage">
    <header>
      <div>
        <h1 class="nt-title">增长率实验室 <span class="nt-title-en">Growth Rate Lab</span></h1>
      </div>
      <div class="header-right">
        <div class="formula-badge">A(n) = 100 × (1 + r)ⁿ</div>
      </div>
    </header>

    <main class="main-grid">
      <div class="chart-container">
        <svg class="nt-growth-chart" viewBox="0 0 1040 580" id="chartSvg">
          <!-- Axes and grid rendered by JS -->
          <g id="gridLayer"></g>
          <path id="curvePath" class="chart-curve"></path>
          <g id="pointsLayer"></g>
          <g id="labelsLayer"></g>
        </svg>
      </div>

      <aside class="sidebar">
        <div class="result-card">
          <div class="result-label">第 5 年金额 (Year 5 Amount)</div>
          <div class="result-value-wrap">
            <span class="curr-sym">¥</span>
            <span id="amount">248.83</span>
          </div>
          <div class="result-diff" id="resultDesc">
            净增 148.83 (+148.8%)
          </div>
        </div>

        <div class="hint-note">
          基数持续滚入下一年，微调增长率即可引发终点大幅跃升。
        </div>

        <div class="nt-controls">
          <div class="slider-header">
            <label for="rate" class="slider-title">增长率 (Rate r)</label>
            <span id="rateDisplay" class="slider-val-tag">20%</span>
          </div>
          <input type="range" id="rate" min="0" max="50" value="20" step="1">
          <div class="range-limits">
            <span>0% (Home)</span>
            <span>50% (End)</span>
          </div>

          <button id="reset" type="button">重置为 20% (Reset)</button>
        </div>
      </aside>
    </main>
  </div>

  <aside class="notes" hidden>
    在这一页，学生可以亲自拖动滑块体验增长率对复利曲线的放大效应。
    当 r=0% 时，资产恒定为 100；当 r=20% 时，第 5 年达到 248.83；
    而一旦把增长率提高到 50%，第 5 年将急剧膨胀至 759.38。
  </aside>

  <script src="assets/base.js"></script>
  <script>
    (function() {
      Deck.init({ index: 3, total: 3 });

      const rateSlider = document.getElementById('rate');
      const rateDisplay = document.getElementById('rateDisplay');
      const amountDisplay = document.getElementById('amount');
      const resultDesc = document.getElementById('resultDesc');
      const resetBtn = document.getElementById('reset');

      const gridLayer = document.getElementById('gridLayer');
      const curvePath = document.getElementById('curvePath');
      const pointsLayer = document.getElementById('pointsLayer');
      const labelsLayer = document.getElementById('labelsLayer');

      // Coordinate mapping
      const W = 1040, H = 580;
      const padLeft = 70, padRight = 80, padTop = 40, padBottom = 60;
      const plotW = W - padLeft - padRight;
      const plotH = H - padTop - padBottom;
      const maxVal = 800; // fixed max domain to show dramatic curve change up to 759.38

      function xCoord(n) {
        return padLeft + (n / 5) * plotW;
      }

      function yCoord(val) {
        return padTop + plotH - (val / maxVal) * plotH;
      }

      // Draw static grid & axes
      function initGrid() {
        let gridHtml = '';
        // Y-axis grid & labels
        const yTicks = [0, 200, 400, 600, 800];
        yTicks.forEach(val => {
          const y = yCoord(val);
          gridHtml += `<line class="grid-line" x1="${padLeft}" y1="${y}" x2="${padLeft + plotW}" y2="${y}" />`;
          gridHtml += `<text class="label-axis" x="${padLeft - 15}" y="${y + 5}" text-anchor="end">${val}</text>`;
        });

        // X-axis ticks
        for (let n = 0; n <= 5; n++) {
          const x = xCoord(n);
          gridHtml += `<line class="grid-line" x1="${x}" y1="${padTop}" x2="${x}" y2="${padTop + plotH}" />`;
          gridHtml += `<text class="label-year" x="${x}" y="${padTop + plotH + 28}">第 ${n} 年</text>`;
          gridHtml += `<text class="label-axis" x="${x}" y="${padTop + plotH + 46}" text-anchor="middle" style="font-size:11px;">Y${n}</text>`;
        }

        // Main axis lines
        gridHtml += `<line class="axis-line" x1="${padLeft}" y1="${padTop + plotH}" x2="${padLeft + plotW + 20}" y2="${padTop + plotH}" />`;
        gridHtml += `<line class="axis-line" x1="${padLeft}" y1="${padTop + plotH}" x2="${padLeft}" y2="${padTop - 15}" />`;

        gridLayer.innerHTML = gridHtml;
      }

      function computeValues(r) {
        const values = [];
        for (let n = 0; n <= 5; n++) {
          values.push(100 * Math.pow(1 + r, n));
        }
        return values;
      }

      function update(rateVal) {
        const r = rateVal / 100;
        const values = computeValues(r);
        const y5 = values[5];

        // Format y5: pure number string with 2 decimals
        const formattedAmount = y5.toFixed(2);
        amountDisplay.textContent = formattedAmount;
        rateDisplay.textContent = rateVal + '%';

        const totalGrowth = ((y5 - 100)).toFixed(2);
        resultDesc.textContent = `净增 ${totalGrowth} (+${((y5 - 100)).toFixed(1)}%)`;

        // Update path
        let pathD = '';
        values.forEach((v, n) => {
          const x = xCoord(n);
          const y = yCoord(v);
          if (n === 0) {
            pathD += `M ${x} ${y}`;
          } else {
            // Smooth bezier control points
            const prevX = xCoord(n - 1);
            const prevY = yCoord(values[n - 1]);
            const cp1X = prevX + (x - prevX) * 0.45;
            const cp1Y = prevY;
            const cp2X = prevX + (x - prevX) * 0.55;
            const cp2Y = y;
            pathD += ` C ${cp1X} ${cp1Y}, ${cp2X} ${cp2Y}, ${x} ${y}`;
          }
        });
        curvePath.setAttribute('d', pathD);

        // Update dots and value labels
        let pointsHtml = '';
        let labelsHtml = '';
        values.forEach((v, n) => {
          const x = xCoord(n);
          const y = yCoord(v);
          const isFinal = n === 5;
          const rSize = isFinal ? 8 : 5.5;
          pointsHtml += `<circle class="chart-dot ${isFinal ? 'chart-dot-final' : ''}" cx="${x}" cy="${y}" r="${rSize}" />`;

          // Label placement: slightly above the point
          const labelY = y - 12;
          labelsHtml += `<text class="label-val" x="${x}" y="${labelY}">${v.toFixed(1)}</text>`;
        });

        pointsLayer.innerHTML = pointsHtml;
        labelsLayer.innerHTML = labelsHtml;
      }

      initGrid();
      update(20);

      rateSlider.addEventListener('input', function(e) {
        update(parseInt(e.target.value, 10));
      });

      resetBtn.addEventListener('click', function() {
        rateSlider.value = 20;
        update(20);
      });

      // Keyboard handling: Home -> 0%, End -> 50%
      rateSlider.addEventListener('keydown', function(e) {
        if (e.key === 'Home') {
          e.preventDefault();
          rateSlider.value = 0;
          update(0);
        } else if (e.key === 'End') {
          e.preventDefault();
          rateSlider.value = 50;
          update(50);
        }
      });
    })();
  </script>
</body>
</html>
