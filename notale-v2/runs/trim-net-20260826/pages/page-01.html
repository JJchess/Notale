<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="01" data-total="21">
<div id="stage">
  <style>
    #stage .opening{
      flex:1;
      min-height:0;
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:transparent;
    }
    #stage .kicker{
      margin:0 0 22px;
      color:var(--muted);
      font:600 var(--fs-label)/1.35 var(--font-sans);
      letter-spacing:.16em;
    }
    #stage h1{
      margin:0;
      max-width:1120px;
      font:700 var(--fs-h1)/1.2 var(--font-sans);
      letter-spacing:.01em;
    }
    #stage .trunk{
      position:relative;
      width:1260px;
      margin-top:28px;
      padding:44px 42px 38px;
      background:var(--panel-bg);
      border-top:2px solid var(--line);
      border-bottom:2px solid var(--line);
    }
    #stage .trunk::before{
      content:"";
      position:absolute;
      left:50%;
      top:0;
      bottom:0;
      border-left:2px solid var(--line-soft);
      transform:translateX(-1px);
      z-index:0;
    }
    #stage .change-row{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
      white-space:nowrap;
    }
    #stage .pairs{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
    }
    #stage .change-pair{
      display:grid;
      grid-template-columns:150px 54px 150px;
      grid-template-rows:48px 164px;
      position:relative !important;
      inset:auto !important;
      transform:none !important;
      margin:0 !important;
      align-self:center !important;
      align-items:center;
      justify-items:center;
      gap:10px 10px;
      padding:24px 18px 28px;
      background:var(--bg);
      border:2px solid var(--line-soft);
      border-bottom:4px solid var(--line);
    }
    #stage .change-pair:nth-child(2){
      top:0 !important;
      bottom:auto !important;
      margin-top:0 !important;
      transform:none !important;
    }
    #stage .change-pair::before{
      content:"";
      position:absolute;
      left:20px;
      right:20px;
      bottom:28px;
      height:150px;
      background:var(--line-soft);
      clip-path:polygon(0 20%,82% 20%,82% 0,100% 50%,82% 100%,82% 80%,0 80%);
      z-index:0;
    }
    #stage .change-pair > *{
      position:relative;
      z-index:1;
      transform:none !important;
    }
    #stage .state-label{
      color:var(--muted);
      width:150px;
      height:48px;
      display:flex;
      align-items:center;
      justify-content:center;
      font:500 var(--fs-label)/1.35 var(--font-sans);
      letter-spacing:.08em;
    }
    #stage .state-label.after-label{ color:var(--model); }
    #stage .arrow-label{
      color:var(--muted);
      font:500 var(--fs-label)/1.35 var(--font-sans);
    }
    #stage .tag{
      width:150px;
      height:150px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:14px 10px;
      font:600 var(--fs-h1)/1.2 var(--font-mono);
      font-variant-numeric:tabular-nums;
    }
    #stage .before{ color:var(--muted); }
    #stage .after{
      color:var(--model);
      border-color:var(--model);
    }
    #stage .arrow{
      color:var(--line);
      font:400 28px/1 var(--font-sans);
    }
    #stage .conclusion{
      position:relative;
      z-index:1;
      margin:18px auto 0;
      padding:14px 30px 17px;
      max-width:980px;
      background:var(--bg);
      font:600 30px/1.4 var(--font-serif);
    }
    #stage .next{
      position:relative;
      z-index:1;
      margin:12px 0 0;
      padding:12px 24px;
      background:var(--bg);
      color:var(--muted);
      font:500 var(--fs-lead)/1.4 var(--font-sans);
    }
    #stage .next::before{
      content:"";
      display:block;
      width:10px;
      height:10px;
      margin:0 auto 15px;
      border:2px solid var(--line);
      border-radius:50%;
      background:var(--bg);
    }
  </style>
  <main class="opening focus k-generalization min0" aria-labelledby="page-title">
    <p class="kicker">CHAPTER I · 看见学习</p>
    <h1 id="page-title">神经网络的“学会”，不是魔法</h1>
    <div class="trunk" aria-label="模型内部三组数字从改前到改后的变化">
      <div class="change-row">
        <div class="pairs">
        <div class="change-pair"><span class="state-label">改前</span><span class="arrow-label">改变</span><span class="state-label after-label">改后</span><span class="tag before">0.00</span><span class="arrow" aria-hidden="true">→</span><span class="tag after">0.18</span></div>
        <div class="change-pair"><span class="state-label">改前</span><span class="arrow-label">改变</span><span class="state-label after-label">改后</span><span class="tag before">0.00</span><span class="arrow" aria-hidden="true">→</span><span class="tag after">-0.07</span></div>
        <div class="change-pair"><span class="state-label">改前</span><span class="arrow-label">改变</span><span class="state-label after-label">改后</span><span class="tag before">0.00</span><span class="arrow" aria-hidden="true">→</span><span class="tag after">0.11</span></div>
        </div>
      </div>
      <p class="conclusion">它可以被看成：模型里一串数字有方向地改变。</p>
      <p class="next">训练时，究竟是哪些东西会变？</p>
    </div>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
