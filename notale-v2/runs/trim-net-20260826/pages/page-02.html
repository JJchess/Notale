<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="02" data-total="21">
<div id="stage">
  <style>
    #change-sort{display:flex;flex:1;min-height:0;flex-direction:column;gap:18px}
    #change-sort .cs-head{flex:0 0 auto}
    #change-sort .cs-kicker{margin:0 0 5px;color:var(--muted);font:600 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.11em}
    #change-sort h1{margin:0;font:700 var(--fs-h1)/1.18 var(--font-sans);color:var(--text)}
    #change-sort .cs-task{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:48px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
    #change-sort .cs-task p{margin:0;font:600 var(--fs-body)/1.35 var(--font-sans)}
    #change-sort .cs-count{color:var(--muted);font:var(--fs-label)/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
    #change-sort .cs-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;flex:0 0 356px}
    #change-sort .cs-card{position:relative;display:flex;min-width:0;flex-direction:column;align-items:flex-start;text-align:left;padding:20px 20px 17px;border:2px solid var(--line-soft);border-radius:12px;background:var(--panel-bg);color:var(--text);font-family:var(--font-sans);cursor:pointer;transition:border-color .14s,box-shadow .14s,transform .14s}
    #change-sort .cs-card:hover{border-color:var(--line)}
    #change-sort .cs-card:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
    #change-sort .cs-card[aria-pressed="true"]{border:4px solid var(--focus);padding:18px 18px 15px;box-shadow:inset 0 0 0 2px var(--paper)}
    #change-sort .cs-type{height:102px;display:flex;align-items:center;margin-bottom:16px}
    #change-sort .sample{width:48px;height:48px;font:700 var(--fs-h2)/44px var(--font-mono);text-align:center}
    #change-sort .param{font:700 var(--fs-h2)/1 var(--font-mono);padding:11px 19px}
    #change-sort .cs-title{font:700 var(--fs-h2)/1.15 var(--font-sans)}
    #change-sort .cs-desc{margin-top:9px;color:var(--muted);font:var(--fs-sec)/1.42 var(--font-sans)}
    #change-sort .cs-facts{display:grid;gap:5px;width:100%;margin-top:18px;color:var(--muted);font:var(--fs-label)/1.3 var(--font-sans)}
    #change-sort .cs-facts span{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line-soft);padding-bottom:4px}
    #change-sort .cs-facts b{color:var(--text);font-weight:600}
    #change-sort .cs-selected{position:absolute;top:17px;right:17px;color:var(--focus);font:700 var(--fs-label)/1 var(--font-sans);opacity:0}
    #change-sort .cs-card[aria-pressed="true"] .cs-selected{opacity:1}
    #change-sort .cs-feedback{margin-top:auto;min-height:45px;padding-top:12px;border-top:1px solid var(--line-soft);color:var(--text);font:var(--fs-label)/1.35 var(--font-sans)}
    #change-sort .cs-feedback .cs-after{display:none}
    #change-sort .cs-origin{display:flex;align-items:center;gap:9px;color:var(--muted);font-weight:600}
    #change-sort .cs-origin:before{content:'→';display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid var(--line);border-radius:50%;color:var(--text);font-family:var(--font-mono)}
    #change-sort[data-checked="true"] .cs-feedback .cs-origin{display:none}
    #change-sort[data-checked="true"] .cs-feedback .cs-after{display:block}
    #change-sort .cs-classify{position:relative;flex:0 0 174px;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:80px;padding-top:54px}
    #change-sort .cs-await{position:absolute;inset:24px 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;color:var(--muted);font:var(--fs-label)/1.3 var(--font-sans);text-align:center}
    #change-sort .cs-await span{padding:8px 10px;border-bottom:2px dotted var(--line-soft)}
    #change-sort .cs-await small{display:block;margin-top:4px;color:var(--text);font:600 var(--fs-label)/1.2 var(--font-sans)}
    #change-sort[data-checked="true"] .cs-await{display:none}
    #change-sort .cs-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;opacity:0}
    #change-sort[data-checked="true"] .cs-lines{opacity:1}
    #change-sort .cs-wire{fill:none;stroke:var(--line);stroke-width:2.5;vector-effect:non-scaling-stroke}
    #change-sort .cs-wire.dashed{stroke-dasharray:7 6}
    #change-sort .cs-bucket{position:relative;z-index:1;align-self:end;min-height:132px;padding:17px 22px;border:2px solid var(--line);border-radius:12px;background:var(--panel-bg)}
    #change-sort .cs-bucket:last-child{border-width:3px}
    #change-sort .cs-bucket-title{display:flex;align-items:center;gap:10px;font:700 var(--fs-h2)/1.2 var(--font-sans)}
    #change-sort .cs-mark{width:24px;height:24px;border:2px solid var(--line);display:inline-grid;place-items:center;font:700 var(--fs-label)/1 var(--font-mono)}
    #change-sort .cs-bucket:last-child .cs-mark{border-radius:50%}
    #change-sort .cs-bucket p{margin:7px 0 0;color:var(--muted);font:var(--fs-sec)/1.35 var(--font-sans)}
    #change-sort .cs-slot{display:block;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line-soft);color:var(--muted);font:var(--fs-label)/1.2 var(--font-sans)}
    #change-sort .cs-actions{display:flex;align-items:center;gap:12px;min-height:48px}
    #change-sort .cs-actions .btn:first-child{font-weight:700}
    #change-sort .cs-result{flex:1;min-height:28px;margin:0 8px;font:600 var(--fs-sec)/1.4 var(--font-sans)}
    #change-sort .cs-result[data-kind="ok"]{font-family:var(--font-serif);font-size:var(--fs-body)}
    #change-sort .cs-foot{display:flex;align-items:baseline;justify-content:space-between;gap:32px;border-top:1px solid var(--line-soft);padding-top:14px}
    #change-sort .cs-conclusion{margin:0;font:600 var(--fs-lead)/1.35 var(--font-serif)}
    #change-sort .cs-next{margin:0;color:var(--muted);font:var(--fs-sec)/1.35 var(--font-sans);white-space:nowrap}
    @media (prefers-reduced-motion:reduce){#change-sort .cs-card{transition:none}}
  </style>

  <main id="change-sort" class="k-classification min0" data-checked="false" aria-labelledby="cs-title">
    <header class="cs-head">
      <p class="cs-kicker">CHAPTER I · WHAT CHANGES?</p>
      <h1 id="cs-title">训练不是改题目，而是改模型里的数值</h1>
    </header>

    <div class="cs-task">
      <p>点选所有训练时会变化的对象</p>
      <span class="cs-count" aria-hidden="true">已选 <b data-count>0</b> / 4</span>
    </div>

    <section class="cs-cards stage-cards min0" aria-label="待分类的四个对象">
      <button class="cs-card" type="button" data-key="x" aria-pressed="false">
        <span class="cs-selected">已选</span><span class="cs-type"><span class="sample">x</span></span>
        <span class="cs-title">输入样本 <code>x</code></span><span class="cs-desc">这次拿给模型看的信息</span><span class="cs-facts"><span>所在位置 <b>模型外部</b></span><span>开始训练时 <b>已经给定</b></span></span>
        <span class="cs-feedback"><span class="cs-origin">从题目进入模型</span><span class="cs-after">题目不能被模型偷偷改掉</span></span>
      </button>
      <button class="cs-card" type="button" data-key="t" aria-pressed="false">
        <span class="cs-selected">已选</span><span class="cs-type"><span class="sample">t</span></span>
        <span class="cs-title">正确答案 <code>t</code></span><span class="cs-desc">用来判断预测对不对的参照</span><span class="cs-facts"><span>所在位置 <b>模型外部</b></span><span>开始训练时 <b>已经给定</b></span></span>
        <span class="cs-feedback"><span class="cs-origin">从题目进入模型</span><span class="cs-after">答案要留下来充当参照</span></span>
      </button>
      <button class="cs-card" type="button" data-key="w" aria-pressed="false">
        <span class="cs-selected">已选</span><span class="cs-type"><span class="param">w</span></span>
        <span class="cs-title">权重 <code>w</code></span><span class="cs-desc">模型内部的连接影响力</span><span class="cs-facts"><span>所在位置 <b>模型内部</b></span><span>开始训练时 <b>带着初值</b></span></span>
        <span class="cs-feedback"><span class="cs-origin">存放在模型内部</span><span class="cs-after">会变：它是模型参数</span></span>
      </button>
      <button class="cs-card" type="button" data-key="b" aria-pressed="false">
        <span class="cs-selected">已选</span><span class="cs-type"><span class="param">b</span></span>
        <span class="cs-title">偏置 <code>b</code></span><span class="cs-desc">模型内部的默认倾向</span><span class="cs-facts"><span>所在位置 <b>模型内部</b></span><span>开始训练时 <b>带着初值</b></span></span>
        <span class="cs-feedback"><span class="cs-origin">存放在模型内部</span><span class="cs-after">会变：它也是模型参数</span></span>
      </button>
    </section>

    <section class="cs-classify min0" aria-label="检查后显示分类归属">
      <div class="cs-await" aria-hidden="true"><span>输入样本 x 的归属？<small>等待检查</small></span><span>正确答案 t 的归属？<small>等待检查</small></span><span>权重 w 的归属？<small>等待检查</small></span><span>偏置 b 的归属？<small>等待检查</small></span></div>
      <svg class="cs-lines" viewBox="0 0 1488 210" preserveAspectRatio="none" aria-hidden="true">
        <path class="cs-wire dashed" d="M177 0 V30 H352 V68"/><path class="cs-wire dashed" d="M558 0 V30 H352"/>
        <path class="cs-wire" d="M930 0 V30 H1136 V68"/><path class="cs-wire" d="M1311 0 V30 H1136"/>
      </svg>
      <div class="cs-bucket"><div class="cs-bucket-title"><span class="cs-mark">=</span>训练中保持给定</div><p>用同一道题和同一个答案检验模型</p><span class="cs-slot">归属位置：外部给定对象</span></div>
      <div class="cs-bucket"><div class="cs-bucket-title"><span class="cs-mark">↻</span>训练中可以改变</div><p>这些内部数字合称“参数”</p><span class="cs-slot">归属位置：模型内部参数</span></div>
    </section>

    <div class="cs-actions">
      <button class="btn" type="button" data-check>检查选择</button>
      <button class="btn" type="button" data-reset>重置本页</button>
      <p class="cs-result" data-result aria-live="polite"></p>
    </div>
    <footer class="cs-foot">
      <p class="cs-conclusion">训练时改变的是权重和偏置，不是输入样本或正确答案。</p>
      <p class="cs-next">下一问：这些参数要经过哪三步，才算完成一次学习？</p>
    </footer>
  </main>

  <script>
  (()=>{
    const root=document.getElementById('change-sort');
    const cards=[...root.querySelectorAll('.cs-card')];
    const count=root.querySelector('[data-count]');
    const result=root.querySelector('[data-result]');
    const check=root.querySelector('[data-check]');
    const reset=root.querySelector('[data-reset]');
    const initial=()=>({selected:new Set(),checked:false});
    let state=initial(),destroyed=false;
    function render(){
      root.dataset.checked=String(state.checked);
      cards.forEach(card=>card.setAttribute('aria-pressed',String(state.selected.has(card.dataset.key))));
      count.textContent=state.selected.size;
      if(!state.checked){result.textContent='';result.dataset.kind='';return}
      const extra=['x','t'].filter(k=>state.selected.has(k));
      const missing=['w','b'].filter(k=>!state.selected.has(k));
      if(!extra.length&&!missing.length){result.textContent='对：题目和答案留下来作参照，模型改的是 w 和 b。';result.dataset.kind='ok'}
      else if(extra.length){const names=extra.map(k=>k==='x'?'输入样本 x':'正确答案 t').join('、');result.textContent=`${names}必须保持给定。`;result.dataset.kind='fix'}
      else{result.textContent='还有模型内部的参数没有选中。';result.dataset.kind='fix'}
    }
    function toggle(card){const next=new Set(state.selected);next.has(card.dataset.key)?next.delete(card.dataset.key):next.add(card.dataset.key);state={selected:next,checked:false};render()}
    const handlers=cards.map(card=>{const fn=()=>toggle(card);card.addEventListener('click',fn);return [card,fn]});
    const onCheck=()=>{state={selected:new Set(state.selected),checked:true};render()};
    const onReset=()=>{state=initial();render()};
    check.addEventListener('click',onCheck);reset.addEventListener('click',onReset);render();
    root.destroyChangeSort=()=>{if(destroyed)return;destroyed=true;handlers.forEach(([el,fn])=>el.removeEventListener('click',fn));check.removeEventListener('click',onCheck);reset.removeEventListener('click',onReset);delete root.destroyChangeSort};
  })();
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
