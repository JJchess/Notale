<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="03" data-total="21">
<div id="stage">
<style>
  .p03-head{height:104px;flex:0 0 104px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid var(--line);}
  .p03-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.16em;color:var(--muted);margin-bottom:13px;}
  .p03-head h1{margin:0;font:700 var(--fs-h1)/1.15 var(--font-sans);letter-spacing:-.02em;}
  .p03-headnote{align-self:center;font:500 var(--fs-sec)/1.4 var(--font-sans);color:var(--muted);padding-left:34px;border-left:2px solid var(--line-soft);}
  .p03-main{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:34px;}
  .p03-flow{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:72px;padding:0 8px;}
  .p03-flow::before{content:"";position:absolute;left:84px;right:84px;top:304px;border-top:3px solid var(--line);z-index:0;}
  .p03-step{position:relative;z-index:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);}
  .p03-step::after{content:"";position:absolute;left:0;right:0;top:106px;height:12px;background:var(--bg);z-index:-1;}
  .p03-stephead{height:112px;border-top:6px solid var(--line);padding-top:16px;display:grid;grid-template-columns:68px 1fr;column-gap:16px;align-items:start;}
  .p03-no{font:700 34px/1 var(--font-mono);color:var(--model);}
  .p03-step h2{margin:0 0 7px;font:700 var(--fs-h2)/1.1 var(--font-sans);}
  .p03-step p{margin:0;font:400 var(--fs-body)/1.4 var(--font-sans);color:var(--muted);}
  .p03-scene{height:268px;display:flex;align-items:center;justify-content:center;position:relative;border:3px solid var(--line);border-left-width:2px;border-right-width:2px;background:var(--panel-bg);padding-top:42px;}
  .p03-rolebar{position:absolute;left:18px;right:18px;top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:center;}
  .p03-rolebar span{font:700 var(--fs-label)/1.2 var(--font-sans);color:var(--muted);text-align:center;padding-bottom:8px;border-bottom:2px solid var(--line-soft);}
  .p03-rolebar span+span{border-left:1px solid var(--line-soft);}
  .p03-foot{font:700 var(--fs-lead)/1.35 var(--font-serif);padding-top:19px;}
  .p03-arrow{position:absolute;right:-62px;top:285px;width:52px;height:38px;z-index:4;background:var(--bg);}
  .p03-arrow::before{content:"";position:absolute;left:0;right:8px;top:18px;border-top:3px solid var(--line);}
  .p03-arrow::after{content:"";position:absolute;right:4px;top:12px;width:11px;height:11px;border-top:3px solid var(--line);border-right:3px solid var(--line);transform:rotate(45deg);}
  .p03-arrow span{position:absolute;white-space:nowrap;right:-4px;bottom:29px;font:600 var(--fs-label)/1 var(--font-sans);color:var(--muted);}
  .sample.p03-sample{width:82px;height:82px;display:grid;place-items:center;font:700 var(--fs-body)/1 var(--font-sans);border:3px solid var(--line);background:var(--panel-bg);}
  .p03-miniarr{width:58px;height:3px;background:var(--model);position:relative;margin:0 14px;}
  .p03-miniarr::after{content:"";position:absolute;right:-1px;top:-6px;border-left:12px solid var(--model);border-top:7px solid transparent;border-bottom:7px solid transparent;}
  .neuron.p03-neuron{display:grid;place-items:center;border:4px solid var(--model);background:var(--bg);font:700 var(--fs-sec)/1 var(--font-sans);}
  .p03-output{min-width:94px;padding:14px 12px;text-align:center;border:3px solid var(--model);border-radius:8px;font:700 var(--fs-body)/1 var(--font-sans);color:var(--model);}
  .p03-compare{width:300px;height:224px;position:relative;display:grid;grid-template-columns:1fr 68px;grid-template-rows:1fr 1fr;align-items:center;column-gap:22px;}
  .p03-value{border:3px solid var(--line);border-radius:8px;padding:12px 16px;font:700 var(--fs-body)/1 var(--font-sans);}
  .p03-value.model{border-color:var(--model);color:var(--model);}
  .gap-ruler.p03-ruler{grid-column:2;grid-row:1/3;width:52px;height:190px;position:relative;border-left:3px solid var(--line);background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(32,32,32,.18) 7px 10px);}
  .p03-ruler::before,.p03-ruler::after{content:"";position:absolute;left:-3px;width:23px;border-top:3px solid var(--line);}
  .p03-ruler::before{top:0}.p03-ruler::after{bottom:0}
  .p03-ruler span{position:absolute;left:17px;top:82px;white-space:nowrap;font:700 var(--fs-label)/1 var(--font-sans);transform:rotate(-90deg);}
  .p03-params{width:330px;display:flex;flex-direction:column;gap:23px;align-items:center;}
  .p03-tags{display:flex;gap:18px;}
  .param.p03-param{min-width:108px;padding:13px 18px;border:3px solid var(--line);border-radius:8px;text-align:center;font:700 22px/1 var(--font-mono);background:var(--panel-bg);}
  .change-row.p03-change{width:100%;padding:17px 20px;border-top:3px solid var(--line);border-bottom:3px solid var(--line);font:700 20px/1.2 var(--font-mono);text-align:center;}
  .p03-change b{color:var(--model);font-weight:800;}
  .p03-close{height:116px;flex:0 0 116px;border-top:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:44px;}
  .p03-claim{font:700 25px/1.35 var(--font-serif);}
  .p03-next{max-width:560px;font:600 var(--fs-body)/1.4 var(--font-sans);text-align:right;color:var(--muted);}
  .p03-next span{font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.08em;color:var(--text);margin-right:12px;}
</style>
<header class="p03-head">
  <div><div class="p03-kicker">THREE-STEP MAP</div><h1>把“学习”盯成三个可复查的动作</h1></div>
  <div class="p03-headnote">同一条线，反复走<br>每一步都留下可见对象</div>
</header>
<main class="p03-main min0">
  <section class="triptych k-process p03-flow min0" aria-label="学习的三个连续动作">
    <svg aria-hidden="true" viewBox="0 0 1488 500" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:500px;pointer-events:none;z-index:0">
      <defs><marker id="p03-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--line)"/></marker></defs>
      <path d="M42 304 H1446" fill="none" stroke="var(--line)" stroke-width="3" marker-end="url(#p03-tip)"/>
      <path d="M238 289 V319 M744 289 V319 M1250 289 V319" fill="none" stroke="var(--line)" stroke-width="3"/>
    </svg>
    <article class="p03-step min0">
      <div class="p03-stephead"><div class="p03-no">01</div><div><h2>做预测</h2><p>模型先给出一个预测</p></div></div>
      <div class="p03-scene" aria-label="输入经过神经元，得到预测">
        <div class="p03-rolebar"><span>输入对象</span><span>模型动作</span><span>当前读数</span></div>
        <div class="sample p03-sample">输入</div><div class="p03-miniarr"></div><div class="neuron p03-neuron">神经元</div><div class="p03-miniarr"></div><div class="p03-output">预测</div>
      </div>
      <div class="p03-foot">现在押什么？</div>
      <div class="path p03-arrow" aria-hidden="true"><span>得到读数</span></div>
    </article>
    <article class="p03-step min0">
      <div class="p03-stephead"><div class="p03-no">02</div><div><h2>量误差</h2><p>把预测与正确答案放在一起比较</p></div></div>
      <div class="p03-scene">
        <div class="p03-rolebar"><span>当前预测</span><span>对照答案</span><span>误差读数</span></div>
        <div class="p03-compare" aria-label="预测与答案之间的差距尺">
          <div class="p03-value model">预测</div><div class="p03-value">答案</div>
          <div class="gap-ruler p03-ruler"><span>差距</span></div>
        </div>
      </div>
      <div class="p03-foot">离答案多远？</div>
      <div class="path p03-arrow" aria-hidden="true"><span>留下改动</span></div>
    </article>
    <article class="p03-step min0">
      <div class="p03-stephead"><div class="p03-no">03</div><div><h2>改参数</h2><p>根据误差，改动模型内部的数字</p></div></div>
      <div class="p03-scene">
        <div class="p03-rolebar"><span>误差依据</span><span>内部数字</span><span>改动记录</span></div>
        <div class="p03-params" aria-label="参数和改动记录">
          <div class="p03-tags"><div class="param p03-param">w</div><div class="param p03-param">b</div></div>
          <div class="change-row p03-change">改前 <b>→</b> 改后</div>
        </div>
      </div>
      <div class="p03-foot">用新参数再来一轮</div>
    </article>
  </section>
</main>
<footer class="p03-close">
  <div class="p03-claim">全课只追踪三步：做预测、量误差、改参数。</div>
  <div class="p03-next"><span>下一问</span>第一步里，一个神经元怎样把输入变成预测？</div>
</footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
