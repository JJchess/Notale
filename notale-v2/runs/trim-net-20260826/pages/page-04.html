<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}
.p04-head{height:98px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:16px}
.p04-kicker{font-size:var(--fs-label);letter-spacing:.12em;color:var(--muted);font-weight:700;margin:0 0 8px}
.p04-head h1{font-size:var(--fs-h1);line-height:1.12;margin:0;font-weight:750}
.p04-reset{align-self:flex-end}
.p04-widget{flex:1;min-height:0;display:grid;grid-template-columns:410px minmax(0,1fr);gap:48px}
.p04-widget .pick{display:flex;flex-direction:column;justify-content:center;padding:28px;border:1px solid var(--line-soft);border-radius:18px;background:var(--panel-bg);position:relative;overflow:hidden}
.p04-widget .pick-tree{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);pointer-events:none;z-index:0}
.p04-widget .pick-tree path{fill:none;stroke:var(--line-soft);stroke-width:1.4;stroke-dasharray:6 7;vector-effect:non-scaling-stroke}
.p04-widget .pick>*:not(.pick-tree){position:relative;z-index:1}
.p04-widget h2{font-size:var(--fs-h2);margin:0 0 12px}
.p04-widget .hint{margin:0 0 24px}
.p04-widget .group-label{font-size:var(--fs-label);color:var(--muted);margin:0 0 10px}
.p04-widget .samples{display:grid;grid-template-columns:repeat(5,62px);gap:9px}
.p04-widget .sample{appearance:none;width:62px;height:64px;padding:0;border:2px solid var(--line);background:var(--bg);color:var(--text);font:600 var(--fs-body)/1 var(--font-mono);cursor:pointer;position:relative}
.p04-widget .sample[aria-checked="true"]{border:4px solid var(--focus);background:var(--panel-bg)}
.p04-widget .sample[aria-checked="true"]:after{content:"送入";position:absolute;left:50%;top:72px;transform:translateX(-50%);font:600 var(--fs-label)/1 var(--font-sans);color:var(--text);white-space:nowrap}
.p04-widget .classify{margin-top:62px;border-top:1px solid var(--line-soft);padding-top:18px;display:grid;grid-template-columns:82px 1fr;gap:14px 16px;align-items:center}
.p04-widget .cat{font-size:var(--fs-label);color:var(--muted)}
.p04-widget .params{display:flex;gap:10px;flex-wrap:wrap}
.p04-widget .param{font-family:var(--font-mono);font-size:var(--fs-sec);background:var(--panel-bg)}
.p04-widget .calc{position:relative;min-width:0;display:flex;align-items:center}
.p04-widget .machine{width:100%;height:470px;border:2px solid var(--line);border-radius:20px;background:var(--panel-bg);position:relative;display:grid;grid-template-columns:190px 80px 210px 80px 230px;align-items:center;justify-content:center;padding:28px 26px;overflow:hidden}
.p04-widget .flow-key{position:absolute;left:34px;right:34px;top:54px;display:grid;grid-template-columns:repeat(5,1fr);font:600 var(--fs-label)/1.2 var(--font-mono);color:var(--muted);text-align:center}
.p04-widget .flow-key span:after{content:"↓";display:block;margin-top:4px;color:var(--line)}
.p04-widget .structure{position:absolute;inset:58px 18px 64px;width:calc(100% - 36px);height:calc(100% - 122px);pointer-events:none}
.p04-widget .structure path{fill:none;stroke:var(--line-soft);stroke-width:1.5;stroke-dasharray:7 7;vector-effect:non-scaling-stroke}
.p04-widget .machine:before{content:"神经元内部";position:absolute;left:28px;top:22px;font-size:var(--fs-label);font-weight:700;color:var(--muted);letter-spacing:.08em}
.p04-widget .step{height:210px;border:2px solid var(--line);border-radius:14px;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;position:relative;z-index:2}
.p04-widget .step-title{font-size:var(--fs-body);font-weight:700}
.p04-widget .step-sub{font-size:var(--fs-label);color:var(--muted);margin-top:-8px}
.p04-widget .formula{font:700 27px/1.25 var(--font-mono)}
.p04-widget .result{height:250px;border:5px solid var(--model);border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative;z-index:2;text-align:center}
.p04-widget .result .label{font-size:var(--fs-sec);color:var(--muted)}
.p04-widget .result .z{font:750 34px/1 var(--font-mono);color:var(--model)}
.p04-widget .arrow{height:4px;background:var(--model);position:relative;z-index:1}
.p04-widget .arrow:after{content:"";position:absolute;right:-2px;top:-8px;border-left:14px solid var(--model);border-top:10px solid transparent;border-bottom:10px solid transparent}
.p04-widget[data-phase="one"] .a1,.p04-widget[data-phase="two"] .a2{height:6px;background:var(--focus)}
.p04-widget[data-phase="one"] .a1:after,.p04-widget[data-phase="two"] .a2:after{border-left-color:var(--focus)}
.p04-widget[data-phase="one"] .multiply,.p04-widget[data-phase="two"] .add{outline:4px solid var(--focus);outline-offset:3px}
.p04-widget .note{position:absolute;left:28px;right:28px;bottom:20px;margin:0;font-size:var(--fs-sec);line-height:1.4;color:var(--muted);text-align:center}
.p04-widget .pulse{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--focus);top:226px;left:20px;opacity:0;z-index:5;pointer-events:none}
.p04-widget[data-anim="run"] .pulse{animation:p04pulse 640ms ease-in-out forwards}
@keyframes p04pulse{0%{opacity:1;transform:translateX(0)}38%{opacity:1;transform:translateX(245px)}62%{opacity:1;transform:translateX(245px)}100%{opacity:0;transform:translateX(620px)}}
.p04-foot{height:92px;border-top:1px solid var(--line-soft);padding-top:15px;display:flex;position:relative;align-items:flex-start;justify-content:space-between;gap:50px}
.p04-foot .bridge{position:absolute;right:0;top:8px;width:580px;height:66px;pointer-events:none}
.p04-foot .bridge path{fill:none;stroke:var(--line-soft);stroke-width:1.5;stroke-dasharray:8 8;vector-effect:non-scaling-stroke}
.p04-conclusion{font:600 var(--fs-lead)/1.45 var(--font-serif);margin:0;max-width:720px}
.p04-next{font-size:var(--fs-sec);line-height:1.4;color:var(--muted);margin:2px 0 0;text-align:right;max-width:560px}
.p04-widget button:focus-visible{outline:4px solid var(--focus);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.p04-widget .pulse{display:none}}
</style>
</head>
<body data-page="04" data-total="21">
<div id="stage">
  <header class="p04-head">
    <div><p class="p04-kicker">ONE NEURON · 第一步</p><h1>一个神经元先乘权重，再加偏置</h1></div>
    <button class="btn p04-reset" type="button" data-reset>重置本页</button>
  </header>

  <main class="p04-widget k-classification min0" data-widget data-phase="done">
    <section class="pick min0" aria-labelledby="p04-pick-title">
      <svg class="pick-tree" viewBox="0 0 380 500" aria-hidden="true" preserveAspectRatio="none">
        <path d="M8 10 H372 V490 H8 Z"/>
        <path d="M24 112 H356 V245 H24 Z M24 285 H356 V454 H24 Z"/>
        <path d="M12 250 H368"/>
      </svg>
      <h2 id="p04-pick-title">选一个输入</h2>
      <p class="hint">点一个输入，送进神经元</p>
      <p class="group-label">输入</p>
      <div class="samples" role="radiogroup" aria-label="选择输入 x">
        <button class="sample" type="button" role="radio" aria-checked="false" data-x="-2">x=−2</button>
        <button class="sample" type="button" role="radio" aria-checked="false" data-x="-1">x=−1</button>
        <button class="sample" type="button" role="radio" aria-checked="false" data-x="0">x=0</button>
        <button class="sample" type="button" role="radio" aria-checked="false" data-x="1">x=1</button>
        <button class="sample" type="button" role="radio" aria-checked="true" data-x="2">x=2</button>
      </div>
      <div class="classify">
        <span class="cat">输入</span><span class="sample" aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;font-family:var(--font-mono)">x</span>
        <span class="cat">参数</span><div class="params"><span class="param">权重 w = 0.7</span><span class="param">偏置 b = −0.4</span></div>
      </div>
    </section>

    <section class="calc min0" aria-label="神经元内部两步算术">
      <div class="machine">
        <svg class="structure" viewBox="0 0 900 330" aria-hidden="true" preserveAspectRatio="none">
          <path d="M15 165 H885 M15 35 V295 M885 35 V295 M15 35 H885 M15 295 H885"/>
          <path d="M30 72 H870 M30 258 H870"/>
          <path d="M210 35 V295 M450 35 V295 M675 35 V295"/>
        </svg>
        <div class="flow-key" aria-hidden="true"><span>输入 x</span><span>权重 w</span><span>乘积</span><span>偏置 b</span><span>总分 z</span></div>
        <div class="pulse" aria-hidden="true"></div>
        <div class="step multiply"><span class="step-title">先乘权重</span><span class="step-sub">计算输入的影响</span><span class="formula" data-product-formula>2 × 0.7</span><strong class="num" data-product>= 1.4</strong></div>
        <div class="arrow a1" aria-hidden="true"></div>
        <div class="step add"><span class="step-title">再加偏置</span><span class="step-sub">把总分整体挪动</span><span class="formula" data-sum-formula>1.4 + (−0.4)</span><strong class="num" data-sum>= 1.0</strong></div>
        <div class="arrow a2" aria-hidden="true"></div>
        <div class="result"><span class="label">内部总分 z</span><strong class="z" data-z>z = 1.0</strong></div>
        <p class="note">w 决定输入被放大、缩小或反向；b 给总分整体挪一点。</p>
      </div>
    </section>
  </main>

  <footer class="p04-foot">
    <svg class="bridge" viewBox="0 0 580 66" aria-hidden="true"><path d="M2 33 H28 M18 25 l10 8 -10 8 M30 2 H578 V64 H30 Z"/></svg>
    <p class="p04-conclusion">神经元的内部总分，就是 <span style="font-family:var(--font-mono)">输入 × 权重 + 偏置</span>。</p>
    <p class="p04-next">下一问：总分可以大于 1 或小于 0，怎样把它变成 0–1 的数？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  const root = document.querySelector('[data-widget]');
  if (!root) return;
  const buttons = [...root.querySelectorAll('[data-x]')];
  const reset = document.querySelector('[data-reset]');
  const status = root.querySelector('[data-z]');
  status.setAttribute('aria-live', 'polite');
  const els = {
    pf: root.querySelector('[data-product-formula]'), p: root.querySelector('[data-product]'),
    sf: root.querySelector('[data-sum-formula]'), s: root.querySelector('[data-sum]'), z: root.querySelector('[data-z]')
  };
  const initial = 2, w = 0.7, b = -0.4;
  let state = { x: initial };
  let timers = [];
  let destroyed = false;
  const fmt = v => (Math.abs(v) < .05 ? 0 : v).toFixed(1).replace('-', '−');
  const clearWork = () => { timers.forEach(clearTimeout); timers = []; root.dataset.anim = ''; };
  function render() {
    const product = state.x * w, total = product + b;
    buttons.forEach(btn => { const on = Number(btn.dataset.x) === state.x; btn.setAttribute('aria-checked', String(on)); btn.tabIndex = on ? 0 : -1; });
    els.pf.textContent = `${state.x < 0 ? '−' + Math.abs(state.x) : state.x} × 0.7`;
    els.p.textContent = `= ${fmt(product)}`;
    els.sf.textContent = `${fmt(product)} + (−0.4)`;
    els.s.textContent = `= ${fmt(total)}`;
    els.z.textContent = `z = ${fmt(total)}`;
  }
  function choose(x, announce = true) {
    if (destroyed) return;
    clearWork(); state = { x }; render();
    if (Deck.reduced()) {
      root.dataset.phase = 'one';
      timers.push(setTimeout(() => { root.dataset.phase = 'two'; }, 160));
      timers.push(setTimeout(() => { root.dataset.phase = 'done'; }, 320));
    } else {
      root.dataset.anim = 'run'; root.dataset.phase = 'one';
      timers.push(setTimeout(() => { root.dataset.phase = 'two'; }, 400));
      timers.push(setTimeout(() => { root.dataset.phase = 'done'; root.dataset.anim = ''; }, 640));
    }
    if (announce) status.setAttribute('aria-label', `输入 x 等于 ${x}，乘积 ${fmt(x*w)}，内部总分 z 等于 ${fmt(x*w+b)}`);
  }
  function onClick(e){ choose(Number(e.currentTarget.dataset.x)); }
  function onKey(e){
    const i = buttons.indexOf(e.currentTarget);
    let next = i;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (i + buttons.length - 1) % buttons.length;
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (i + 1) % buttons.length;
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); choose(Number(e.currentTarget.dataset.x)); return; }
    else return;
    e.preventDefault(); e.stopPropagation(); buttons[next].focus(); choose(Number(buttons[next].dataset.x));
  }
  buttons.forEach(btn => { btn.addEventListener('click', onClick); btn.addEventListener('keydown', onKey); });
  function onReset(){ clearWork(); state = {x: initial}; root.dataset.phase = 'done'; render(); status.setAttribute('aria-label', '已重置：输入 x 等于 2，内部总分 z 等于 1.0'); }
  reset.addEventListener('click', onReset);
  render();
  root.destroyWidget = () => { if (destroyed) return; destroyed = true; clearWork(); buttons.forEach(btn => { btn.removeEventListener('click', onClick); btn.removeEventListener('keydown', onKey); }); reset.removeEventListener('click', onReset); };
  Deck.init({index:4,total:21});
})();
</script>
</body>
</html>
