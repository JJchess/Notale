<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/lib/katex.min.css">
<style>
#stage{gap:18px}
#stage .p05-head{flex:0 0 94px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:16px}
#stage .p05-kicker{font-size:var(--fs-label);letter-spacing:.14em;color:var(--muted);font-weight:700;margin-bottom:7px}
#stage h1{font-size:var(--fs-h1);line-height:1.1;margin:0;font-weight:750}
#stage .p05-formula{font-size:24px;min-width:280px;text-align:right;color:var(--text)}
#stage .p05-widget{flex:0 0 616px;display:grid;grid-template-columns:minmax(0,1fr) 342px;gap:28px;min-height:0}
#stage .p05-model{display:flex;flex-direction:column;min-height:0;gap:10px}
#stage .p05-chart-wrap{position:relative;flex:0 0 558px;min-height:0;border:1px solid var(--line-soft);border-radius:12px;background:rgba(255,255,255,.2);overflow:hidden}
#stage .p05-chart{position:absolute;inset:0}
#stage .p05-edge{position:absolute;top:24px;font-size:var(--fs-label);color:var(--muted);pointer-events:none}
#stage .p05-edge.left{left:28px} #stage .p05-edge.right{right:28px}
#stage .p05-slider-row{display:grid;grid-template-columns:76px minmax(0,1fr) 88px;align-items:center;gap:14px;min-height:46px}
#stage .p05-slider-row label{font-size:var(--fs-label);font-weight:700}
#stage .p05-slider-row input{width:100%;accent-color:var(--accent)}
#stage .p05-zout{font:700 20px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
#stage .p05-rail{display:flex;flex-direction:column;gap:16px;min-height:0}
#stage .p05-readout{padding:24px 24px 22px;position:relative}
#stage .p05-readout h2{font-size:var(--fs-label);color:var(--muted);margin:0 0 12px;font-weight:650}
#stage .p05-p{font:750 52px var(--font-mono);color:var(--model);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#stage .p05-spoken{font-size:var(--fs-body);line-height:1.55;margin:17px 0 0;min-height:56px}
#stage .p05-chain{display:flex;align-items:center;justify-content:center;gap:8px;border-top:1px solid var(--line-soft);margin-top:18px;padding-top:16px;font:700 18px var(--font-mono)}
#stage .p05-chain .arr{color:var(--accent);font-family:var(--font-sans);font-size:24px}
#stage .p05-notes{padding:18px 22px;display:flex;flex-direction:column;gap:11px}
#stage .p05-notes p{margin:0;font-size:var(--fs-sec);line-height:1.4}
#stage .p05-const{font:15px var(--font-mono);color:var(--muted)}
#stage .p05-zero{padding:15px 20px;border-left:5px solid transparent;font:700 20px var(--font-mono);transition:border-color .15s,background .15s}
#stage .p05-zero.on{border-color:var(--accent);background:rgba(245,158,11,.1)}
#stage .p05-reset{margin-top:auto;align-self:flex-end}
#stage .p05-foot{flex:0 0 98px;border-top:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:38px}
#stage .p05-conclusion{font:600 21px/1.45 var(--font-serif);max-width:880px}
#stage .p05-next{font-size:var(--fs-sec);color:var(--muted);text-align:right;max-width:420px;line-height:1.45}
#stage .p05-next b{color:var(--text)}
</style>
</head>
<body data-page="05" data-total="21">
<div id="stage">
  <header class="p05-head">
    <div><div class="p05-kicker">ACTIVATION · 激活</div><h1>任意总分，都能被压进 0–1</h1></div>
    <div id="p05-formula" class="p05-formula" aria-label="p 等于 1 除以 1 加 e 的负 z 次方"></div>
  </header>
  <main class="p05-widget k-process" data-p05-widget>
    <section class="p05-model min0" aria-label="S 形激活曲线探针">
      <div class="p05-chart-wrap min0">
        <div id="p05-chart" class="p05-chart"></div>
        <span class="p05-edge left">总分越负，输出越接近 0</span>
        <span class="p05-edge right">总分越正，输出越接近 1</span>
      </div>
      <div class="p05-slider-row">
        <label for="p05-z">拖动总分</label>
        <input id="p05-z" type="range" min="-8" max="8" step="0.1" value="0" aria-label="内部总分 z；左右方向键每次调整 0.1">
        <output class="p05-zout" id="p05-zout">z = 0.0</output>
      </div>
    </section>
    <aside class="p05-rail min0">
      <section class="panel p05-readout" aria-live="polite">
        <h2>激活后的输出概率</h2>
        <div class="p05-p" id="p05-p">p = 0.500</div>
        <p class="p05-spoken" id="p05-spoken">100 次相似情况中，模型会押“是”约 50 次</p>
        <div class="p05-chain"><span>总分 z</span><span class="arr">→</span><span>S 形激活</span><span class="arr">→</span><span>概率 p</span></div>
      </section>
      <section class="panel p05-notes">
        <p><b>0 点最陡：</b>局部变化率 0.25 / 总分</p>
        <p class="p05-const">SIGMOID_VALUE_AT_ZERO = <span id="p05-c0">0.5</span></p>
        <p class="p05-const">SIGMOID_MAX_SLOPE = <span id="p05-cs">0.25</span></p>
      </section>
      <div class="panel p05-zero on" id="p05-zero">0 → 0.5</div>
      <button type="button" class="btn p05-reset" id="p05-reset">重置本页</button>
    </aside>
  </main>
  <footer class="p05-foot">
    <div class="p05-conclusion">S 形激活把任意总分压到 0–1；总分为 0 时，输出正好是 0.5。</div>
    <div class="p05-next"><b>下一问</b><br>同一组参数遇到不同输入，会得到怎样不同的概率？</div>
  </footer>
</div>
<script src="assets/lib/echarts.min.js"></script>
<script src="assets/lib/katex.min.js"></script>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  const root=document.querySelector('[data-p05-widget]'); if(!root)return;
  const el=root.querySelector('#p05-chart'), range=root.querySelector('#p05-z'), zout=root.querySelector('#p05-zout');
  const pout=root.querySelector('#p05-p'), spoken=root.querySelector('#p05-spoken'), zero=root.querySelector('#p05-zero'), reset=root.querySelector('#p05-reset');
  const initial=0, c0=Number(Lec.K.SIGMOID_VALUE_AT_ZERO), cs=Number(Lec.K.SIGMOID_MAX_SLOPE);
  root.querySelector('#p05-c0').textContent=c0.toFixed(1); root.querySelector('#p05-cs').textContent=cs.toFixed(2);
  katex.render('p=\\frac{1}{1+e^{-z}}',document.getElementById('p05-formula'),{throwOnError:false});
  const chart=echarts.init(el,null,{renderer:'svg'}); let state={z:initial}; let zeroTimer=0; let destroyed=false;
  const sigmoid=z=>1/(1+Math.exp(-z));
  const curve=[]; for(let z=-8;z<=8.0001;z+=.08)curve.push([+z.toFixed(2),sigmoid(z)]);
  function option(){const p=sigmoid(state.z);const probePos=[86+(state.z+8)/16*Math.max(1,el.clientWidth-128),Math.max(74,el.clientHeight-68)];return {animation:false,textStyle:{fontSize:16,fontFamily:'sans-serif',color:'#202020'},grid:{left:86,right:42,top:74,bottom:68},xAxis:{type:'value',min:-8,max:8,interval:4,name:'内部总分 z',nameLocation:'middle',nameGap:42,nameTextStyle:{fontSize:16,fontWeight:600},axisLabel:{fontSize:13,formatter:v=>v<0?'−'+Math.abs(v):String(v)},axisLine:{lineStyle:{color:'#4B4A46'}},splitLine:{show:false}},yAxis:{type:'value',min:0,max:1,interval:.5,name:'输出概率 p',nameGap:48,nameLocation:'middle',nameTextStyle:{fontSize:16,fontWeight:600},axisLabel:{fontSize:13,formatter:v=>v===.5?'0.5':String(v)},axisLine:{show:true,lineStyle:{color:'#4B4A46'}},splitLine:{lineStyle:{color:'#AAA69D',type:'dashed'}}},series:[{type:'line',data:curve,showSymbol:false,lineStyle:{width:5,color:'#176B87'},silent:true},{type:'line',data:[[state.z,0],[state.z,p]],showSymbol:false,lineStyle:{width:2,color:'#4B4A46',type:'dashed'},silent:true},{type:'line',data:[[-8,p],[state.z,p]],showSymbol:false,lineStyle:{width:2,color:'#4B4A46',type:'dashed'},silent:true},{type:'scatter',data:[[state.z,p]],symbolSize:18,itemStyle:{color:'#176B87',borderColor:'#F4F1E8',borderWidth:4},silent:true}],graphic:[{type:'circle',id:'probe',position:probePos,shape:{r:13},style:{fill:'#F59E0B',stroke:'#202020',lineWidth:2},draggable:true,cursor:'ew-resize',ondrag:function(){const v=chart.convertFromPixel({xAxisIndex:0},this.position)[0];setZ(v,'drag');},ondragend:function(){announce();}}]};}
  function render(){if(destroyed)return;const p=sigmoid(state.z);range.value=state.z;zout.textContent=`z = ${state.z.toFixed(1)}`;pout.textContent=`p = ${p.toFixed(3)}`;spoken.textContent=`100 次相似情况中，模型会押“是”约 ${Math.round(p*100)} 次`;chart.setOption(option(),true);}
  function setZ(v,source){const prev=state.z;state.z=Math.max(-8,Math.min(8,Math.round(Number(v)*10)/10));render();if(Math.abs(state.z)<.05&&Math.abs(prev)>=.05){zero.classList.add('on');clearTimeout(zeroTimer);zeroTimer=setTimeout(()=>zero.classList.remove('on'),650);}else if(Math.abs(state.z)>=.05){zero.classList.remove('on');}}
  function announce(){spoken.setAttribute('aria-label',`${zout.textContent}，${pout.textContent}`)}
  range.addEventListener('input',e=>setZ(e.target.value,'range')); range.addEventListener('change',announce);
  reset.addEventListener('click',()=>{clearTimeout(zeroTimer);state={z:initial};zero.classList.add('on');render();range.focus();announce();});
  const offResize=Deck.onResize(()=>chart.resize());
  render();
  root.destroyP05=()=>{if(destroyed)return;destroyed=true;clearTimeout(zeroTimer);offResize();chart.dispose();};
  Deck.init({index:5,total:21});
})();
</script>
</body>
</html>
