<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="06" data-total="21">
<div id="stage">
  <style>
    #sample-ledger{display:flex;flex-direction:column;flex:1;min-height:0;gap:16px}
    #sample-ledger .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;flex:0 0 auto}
    #sample-ledger .kicker{font-size:var(--fs-label);letter-spacing:.16em;color:var(--muted);font-weight:700;margin-bottom:7px}
    #sample-ledger h1{font-size:var(--fs-h1);line-height:1.16;margin:0;font-weight:750}
    #sample-ledger .invariant{display:flex;align-items:center;gap:12px;font-size:var(--fs-body);white-space:nowrap;padding-bottom:5px}
    #sample-ledger .ledger-body{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;flex:1;min-height:0}
    #sample-ledger .operation{display:flex;align-items:center;justify-content:space-between;gap:24px}
    #sample-ledger .hint{margin:0}
    #sample-ledger .btns{flex-wrap:nowrap}
    #sample-ledger .calc-table{display:grid;grid-template-rows:54px repeat(4,minmax(80px,1fr));gap:7px;min-height:0}
    #sample-ledger .calc-head,#sample-ledger .calc-row{display:grid;grid-template-columns:1.08fr 1.45fr 1.45fr 1.2fr 1.08fr;column-gap:34px;align-items:stretch;position:relative}
    #sample-ledger .calc-head{align-items:center;padding:0 20px;color:var(--muted);font-size:var(--fs-label);font-weight:650;text-align:center}
    #sample-ledger .calc-head>div:first-child{text-align:left}
    #sample-ledger .calc-row{width:100%;border:2px solid var(--line-soft);border-radius:12px;background:transparent;padding:10px 18px;color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:border-color 140ms ease,background 140ms ease}
    #sample-ledger .calc-row:hover{background:rgba(233,230,221,.55)}
    #sample-ledger .calc-row:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
    #sample-ledger .calc-row.current{border:5px solid var(--model);padding:7px 15px;background:rgba(233,230,221,.72)}
    #sample-ledger .cell{display:flex;align-items:center;justify-content:center;position:relative;min-width:0;font-family:var(--font-mono);font-size:var(--fs-body);font-variant-numeric:tabular-nums;white-space:nowrap}
    #sample-ledger .cell:not(:last-child)::after{content:"→";position:absolute;right:-28px;color:var(--line);font-family:var(--font-sans);font-size:24px;font-weight:700}
    #sample-ledger .sample-cell{justify-content:flex-start;gap:13px;font-family:var(--font-sans)}
    #sample-ledger .sample{width:48px;height:48px;display:grid;place-items:center;flex:0 0 48px;font-family:var(--font-mono);font-weight:700}
    #sample-ledger .sample-meta{display:grid;gap:2px;font-size:var(--fs-label);color:var(--muted)}
    #sample-ledger .sample-meta strong{font-size:var(--fs-body);color:var(--text)}
    #sample-ledger .prediction{color:var(--model);font-weight:800;font-size:21px}
    #sample-ledger .seen::before{content:"已查看";position:absolute;top:7px;right:9px;font:13px var(--font-sans);color:var(--muted)}
    #sample-ledger .pulse{color:var(--focus)!important}
    #sample-ledger .pulse::after{color:var(--focus)!important}
    #sample-ledger .readout{display:grid;grid-template-columns:1fr auto;align-items:center;gap:28px;padding:14px 20px}
    #sample-ledger .reading{display:flex;align-items:baseline;gap:14px;min-width:0}
    #sample-ledger .reading .big{color:var(--model);font-size:32px}
    #sample-ledger .reading-detail{font-size:var(--fs-body);font-family:var(--font-mono)}
    #sample-ledger .completion{font-size:var(--fs-sec);color:var(--muted);min-height:24px;text-align:right}
    #sample-ledger .completion.revealed{color:var(--text);font-weight:650}
    #sample-ledger .footer-line{display:flex;align-items:baseline;justify-content:space-between;gap:36px;flex:0 0 auto;border-top:2px solid var(--line-soft);padding-top:13px}
    #sample-ledger .takeaway{font-family:var(--font-serif);font-size:var(--fs-lead);margin:0}
    #sample-ledger .next{font-size:var(--fs-sec);color:var(--muted);margin:0;white-space:nowrap}
    @media (prefers-reduced-motion:reduce){#sample-ledger .calc-row{transition:none}}
  </style>

  <main id="sample-ledger" aria-labelledby="p06-title">
    <header class="page-head">
      <div><div class="kicker">SAME RULE · NEW SAMPLE</div><h1 id="p06-title">四条样本，都走同一条计算路</h1></div>
      <div class="invariant" aria-label="共享参数：w 等于 0，b 等于 0"><strong>共享参数</strong><span class="param">w = 0</span><span class="param">b = 0</span></div>
    </header>

    <section class="ledger-body min0" data-widget aria-label="逐行计算账本">
      <div class="operation">
        <p class="hint">点选一条样本，沿同一条路查看计算。</p>
        <div class="btns" aria-label="样本切换">
          <button class="btn" type="button" data-prev>上一条</button>
          <button class="btn" type="button" data-next>下一条</button>
          <button class="btn" type="button" data-reset>重置本页</button>
        </div>
      </div>

      <div class="calc-table min0">
        <div class="calc-head" aria-hidden="true"><div>输入</div><div>乘权重 <span class="param">w = 0</span></div><div>加偏置 <span class="param">b = 0</span></div><div>激活</div><div>预测</div></div>
        <button class="calc-row" type="button" data-index="0"><span class="cell sample-cell"><span class="sample">−2</span><span class="sample-meta"><strong>样本 1</strong><span>已知答案 t = 0</span></span></span><span class="cell">−2 × 0 = 0</span><span class="cell">0 + 0 = 0</span><span class="cell">总分 0 → 0.5</span><span class="cell prediction">0.500</span></button>
        <button class="calc-row" type="button" data-index="1"><span class="cell sample-cell"><span class="sample">−1</span><span class="sample-meta"><strong>样本 2</strong><span>已知答案 t = 0</span></span></span><span class="cell">−1 × 0 = 0</span><span class="cell">0 + 0 = 0</span><span class="cell">总分 0 → 0.5</span><span class="cell prediction">0.500</span></button>
        <button class="calc-row" type="button" data-index="2"><span class="cell sample-cell"><span class="sample">1</span><span class="sample-meta"><strong>样本 3</strong><span>已知答案 t = 1</span></span></span><span class="cell">1 × 0 = 0</span><span class="cell">0 + 0 = 0</span><span class="cell">总分 0 → 0.5</span><span class="cell prediction">0.500</span></button>
        <button class="calc-row" type="button" data-index="3"><span class="cell sample-cell"><span class="sample">2</span><span class="sample-meta"><strong>样本 4</strong><span>已知答案 t = 1</span></span></span><span class="cell">2 × 0 = 0</span><span class="cell">0 + 0 = 0</span><span class="cell">总分 0 → 0.5</span><span class="cell prediction">0.500</span></button>
      </div>

      <div class="panel readout" aria-live="polite">
        <div class="reading"><span>当前读数</span><span class="big" data-prediction>0.500</span><span class="reading-detail" data-detail>样本 1：总分 0 → 预测 0.5</span></div>
        <div class="completion" data-completion>已查看 1 / 4 条</div>
      </div>
    </section>

    <footer class="footer-line"><p class="takeaway">换的是输入；<code>w=0</code>、<code>b=0</code> 和计算步骤始终不变。</p><p class="next">四次预测都是 <code>0.5</code>，怎样判断它们做得有多差？</p></footer>
  </main>

  <script>
  window.addEventListener('DOMContentLoaded', () => {
    const root = document.querySelector('#sample-ledger [data-widget]');
    const rows = [...root.querySelectorAll('[data-index]')];
    const prev = root.querySelector('[data-prev]');
    const next = root.querySelector('[data-next]');
    const reset = root.querySelector('[data-reset]');
    const detail = root.querySelector('[data-detail]');
    const prediction = root.querySelector('[data-prediction]');
    const completion = root.querySelector('[data-completion]');
    const xs = [-2,-1,1,2];
    const sigmoidAtZero = Number(Lec.K.SIGMOID_VALUE_AT_ZERO);
    let state = { current:0, seen:new Set([0]) };
    let timers = [];
    let destroyed = false;

    function cancelWork(){ timers.forEach(clearTimeout); timers=[]; rows.forEach(r=>[...r.children].forEach(c=>c.classList.remove('pulse'))); }
    function render(animate){
      cancelWork();
      rows.forEach((row,i)=>{
        row.classList.toggle('current',i===state.current);
        row.classList.toggle('seen',state.seen.has(i)&&i!==state.current);
        row.setAttribute('aria-pressed',String(i===state.current));
      });
      const x=xs[state.current];
      prediction.textContent=sigmoidAtZero.toFixed(3);
      detail.textContent=`样本 ${state.current+1}：总分 0 → 预测 ${sigmoidAtZero.toFixed(1)}`;
      if(state.seen.size===4){ completion.textContent='4 条输入不同，4 次规则相同，预测都是 0.500。'; completion.classList.add('revealed'); }
      else { completion.textContent=`已查看 ${state.seen.size} / 4 条`; completion.classList.remove('revealed'); }
      if(animate){
        const cells=[...rows[state.current].children];
        if(Deck.reduced()){ cells.forEach(c=>c.classList.add('pulse')); timers.push(setTimeout(()=>cells.forEach(c=>c.classList.remove('pulse')),220)); }
        else cells.forEach((cell,i)=>{ timers.push(setTimeout(()=>cell.classList.add('pulse'),i*90)); timers.push(setTimeout(()=>cell.classList.remove('pulse'),i*90+140)); });
      }
    }
    function select(index,focus=false){
      if(destroyed)return;
      const i=(index+rows.length)%rows.length;
      state={current:i,seen:new Set([...state.seen,i])};
      render(true);
      if(focus) rows[i].focus();
    }
    rows.forEach((row,i)=>row.addEventListener('click',()=>select(i)));
    prev.addEventListener('click',()=>select(state.current-1,true));
    next.addEventListener('click',()=>select(state.current+1,true));
    reset.addEventListener('click',()=>{state={current:0,seen:new Set([0])};render(false);rows[0].focus();});
    root.addEventListener('keydown',e=>{
      if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();e.stopPropagation();select(state.current-1,true);}
      else if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();e.stopPropagation();select(state.current+1,true);}
    });
    render(false);
    root.destroySampleLedger=()=>{if(destroyed)return;destroyed=true;cancelWork();};
  }, {once:true});
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
