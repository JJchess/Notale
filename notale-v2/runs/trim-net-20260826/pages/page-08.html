<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}.p08-head{height:90px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:14px}.p08-kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--muted)}.p08-head h1{margin:8px 0 0;font:700 var(--fs-h1)/1.15 var(--font-sans)}.p08-widget{flex:1;display:grid;grid-template-columns:270px 1fr 390px;gap:42px;position:relative}.p08-card{min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px;padding:18px 16px;position:relative;background-color:var(--panel-bg);background-image:linear-gradient(rgba(75,74,70,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(75,74,70,.09) 1px,transparent 1px);background-size:28px 28px;border-top:3px solid var(--line);border-radius:0 0 12px 12px}.p08-card:not(:last-child)::after{content:"→";position:absolute;right:-32px;top:49%;font:500 30px var(--font-sans);color:var(--line-soft)}.p08-step{display:flex;align-items:baseline;gap:10px}.p08-step b{font:700 var(--fs-h2)/1 var(--font-mono)}.p08-step span{font:600 var(--fs-h2)/1.2 var(--font-sans)}.p08-samples{display:grid;gap:12px;margin-top:12px}.p08-sample{display:grid;grid-template-columns:66px 1fr 58px;align-items:center;height:74px;border-top:1px solid var(--line-soft)}.p08-x{font:600 var(--fs-body) var(--font-mono)}.p08-target{justify-self:end;width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--line);font:700 var(--fs-body) var(--font-mono);background:var(--bg)}.p08-label{font:var(--fs-label)/1.3 var(--font-sans);color:var(--muted)}.p08-middle{display:grid;grid-template-rows:auto 112px minmax(280px,1fr);gap:12px}.p08-controls{display:grid;grid-template-columns:1fr 1fr;gap:18px}.p08-knob{background:var(--panel-bg);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center}.p08-knob label{font:700 24px var(--font-mono);color:var(--focus)}.p08-knob output{grid-column:1/-1;text-align:center;font:700 25px var(--font-mono)}.p08-knob input{grid-column:1/-1;width:100%;accent-color:var(--focus)}.p08-knob button{width:34px;height:30px;border:1px solid var(--line);background:var(--bg);border-radius:7px;font:700 19px var(--font-mono);cursor:pointer}.p08-knob button:focus-visible,.p08-reset:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.p08-chart{min-height:0}.p08-side{gap:10px}.p08-error{display:grid;grid-template-columns:1fr 88px;gap:14px;align-items:center;background:var(--panel-bg);border-radius:12px;padding:14px}.p08-current{font:700 34px/1 var(--font-mono);color:var(--model);font-variant-numeric:tabular-nums}.p08-delta{margin-top:8px;font:600 var(--fs-sec) var(--font-mono)}.p08-ruler{height:132px;position:relative;border-left:2px solid var(--line);background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(32,32,32,.14) 6px 9px);clip-path:inset(var(--gap-top,82%) 0 0 0)}.p08-ruler::before{content:"4";position:absolute;top:-4px;left:-24px;font:var(--fs-tick) var(--font-mono)}.p08-ruler::after{content:"0";position:absolute;bottom:-4px;left:-24px;font:var(--fs-tick) var(--font-mono)}.p08-record{border-top:1px solid var(--line-soft);padding-top:9px}.p08-row{display:grid;grid-template-columns:72px 1fr;gap:8px;margin:4px 0;font:var(--fs-sec)/1.35 var(--font-mono)}.p08-history{height:165px;min-height:0}.p08-actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.p08-reset{border:1px solid var(--line);background:transparent;border-radius:9px;padding:8px 14px;font:600 var(--fs-label) var(--font-sans);cursor:pointer}.p08-hint{font:var(--fs-label)/1.35 var(--font-sans);color:var(--muted)}.p08-foot{height:92px;display:flex;align-items:center;justify-content:space-between;gap:36px;border-top:1px solid var(--line-soft)}.p08-conclusion{max-width:930px;font:600 var(--fs-lead)/1.4 var(--font-serif)}.p08-next{font:600 var(--fs-body)/1.35 var(--font-sans);white-space:nowrap}.p08-widget button:hover{border-color:var(--focus)}
</style>
</head>
<body data-page="08" data-total="21">
<div id="stage">
  <header class="p08-head"><div><div class="p08-kicker">LAB 08 · HAND TUNING</div><h1>转动两个参数，平均误差真的会下降</h1></div></header>
  <main class="p08-widget k-process stage-cards min0" data-widget>
    <section class="p08-card min0"><div class="p08-step"><b>①</b><span>固定样本</span></div><div class="p08-label">答案不动</div><div class="p08-samples">
      <div class="p08-sample"><span class="p08-x">x = −2</span><span></span><span class="p08-target">t 0</span></div><div class="p08-sample"><span class="p08-x">x = −1</span><span></span><span class="p08-target">t 0</span></div><div class="p08-sample"><span class="p08-x">x = 1</span><span></span><span class="p08-target">t 1</span></div><div class="p08-sample"><span class="p08-x">x = 2</span><span></span><span class="p08-target">t 1</span></div>
    </div></section>
    <section class="p08-card p08-middle min0"><div><div class="p08-step"><b>②</b><span>手调参数</span></div><div class="p08-label">只转这两个旋钮</div></div>
      <div class="p08-controls"><div class="p08-knob"><label for="p08-w">w</label><button type="button" data-adjust="w:-0.1" aria-label="减小 w">−</button><button type="button" data-adjust="w:0.1" aria-label="增大 w">＋</button><output data-value="w">0.0</output><input id="p08-w" type="range" min="-2" max="2" step="0.1" value="0" aria-label="参数 w"></div><div class="p08-knob"><label for="p08-b">b</label><button type="button" data-adjust="b:-0.1" aria-label="减小 b">−</button><button type="button" data-adjust="b:0.1" aria-label="增大 b">＋</button><output data-value="b">0.0</output><input id="p08-b" type="range" min="-2" max="2" step="0.1" value="0" aria-label="参数 b"></div></div>
      <div class="p08-chart" data-pred role="img" aria-label="四条样本的答案与模型预测"></div>
    </section>
    <section class="p08-card p08-side min0"><div class="p08-step"><b>③</b><span>比较误差</span></div><div class="p08-label">四条样本的平均误差</div><div class="p08-error"><div><div class="p08-current" data-loss>0.693</div><div class="p08-delta" data-delta>本次变化 +0.000</div></div><div class="p08-ruler" data-ruler></div></div>
      <div class="p08-record"><div class="p08-label">改前 → 改后</div><div class="p08-row"><span>w</span><span data-row="w">0.0 → 0.0</span></div><div class="p08-row"><span>b</span><span data-row="b">0.0 → 0.0</span></div><div class="p08-row"><span>误差</span><span data-row="loss">0.693 → 0.693</span></div></div>
      <div class="p08-label">每次停手后的误差</div><div class="p08-history" data-history role="img" aria-label="每次停手后的误差历史"></div><div class="p08-actions"><button class="p08-reset" type="button" data-reset>重置本页</button><span class="p08-hint">试着让误差低于起点；也可以故意转错方向。</span></div><div class="sr-only" aria-live="polite" data-status></div>
    </section>
  </main>
  <footer class="p08-foot"><div class="p08-conclusion"><code>w</code> 和 <code>b</code> 的确能把误差调低；但只靠盲试，下一步往哪边转并不稳定。</div><div class="p08-next">能不能先判断哪一边是下坡，再动手？</div></footer>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script><script src="assets/lib/echarts.min.js"></script>
<script>
(() => {
 const root=document.querySelector('[data-widget]'); if(!root)return;
 const xs=[-2,-1,1,2], ts=[0,0,1,1], initial=.6931471805599453;
 const els={w:root.querySelector('#p08-w'),b:root.querySelector('#p08-b'),loss:root.querySelector('[data-loss]'),delta:root.querySelector('[data-delta]'),ruler:root.querySelector('[data-ruler]'),status:root.querySelector('[data-status]')};
 let state={w:0,b:0,history:[initial],last:initial}, destroyed=false;
 const predChart=echarts.init(root.querySelector('[data-pred]'),null,{renderer:'svg'}), histChart=echarts.init(root.querySelector('[data-history]'),null,{renderer:'svg'});
 const sigmoid=z=>1/(1+Math.exp(-z));
 function compute(){const ps=xs.map(x=>sigmoid(state.w*x+state.b));const e=ps.reduce((s,p,i)=>{const q=Math.max(1e-12,Math.min(1-1e-12,p));return s-(ts[i]*Math.log(q)+(1-ts[i])*Math.log(1-q));},0)/4;return{ps,e}}
 function render(){const {ps,e}=compute();['w','b'].forEach(k=>{els[k].value=state[k].toFixed(1);root.querySelector('[data-value="'+k+'"]').textContent=state[k].toFixed(1);root.querySelector('[data-row="'+k+'"]').textContent='0.0 → '+state[k].toFixed(1)});els.loss.textContent=e.toFixed(3);const d=e-initial;els.delta.textContent='本次变化 '+(d>=0?'+':'−')+Math.abs(d).toFixed(3);els.ruler.style.setProperty('--gap-top',(100-Math.min(100,e/4*100))+'%');root.querySelector('[data-row="loss"]').textContent='0.693 → '+e.toFixed(3);
 predChart.setOption({animation:false,title:{text:'模型押给类别 1 的概率',left:8,textStyle:{fontSize:16,fontWeight:500,color:'#66645F'}},grid:{left:52,right:18,top:48,bottom:42},xAxis:{type:'category',data:xs.map(x=>'x = '+x),axisLabel:{fontSize:14,color:'#66645F'},axisLine:{lineStyle:{color:'#4B4A46'}}},yAxis:{type:'value',min:0,max:1,interval:.25,axisLabel:{fontSize:12,color:'#66645F'},splitLine:{lineStyle:{color:'#AAA69D',opacity:.45}}},series:[{type:'scatter',data:ts,symbol:'rect',symbolSize:[26,4],itemStyle:{color:'#202020'},name:'答案'},{type:'scatter',data:ps,symbolSize:16,itemStyle:{color:'#176B87',borderColor:'#F4F1E8',borderWidth:2},name:'预测'}],tooltip:{show:false}});
 histChart.setOption({animation:false,grid:{left:42,right:10,top:8,bottom:34},xAxis:{type:'category',name:'调节次数',nameTextStyle:{fontSize:14,color:'#66645F'},data:state.history.map((_,i)=>i),axisLabel:{fontSize:12,color:'#66645F'},axisLine:{lineStyle:{color:'#4B4A46'}}},yAxis:{type:'value',min:0,max:4,interval:1,axisLabel:{fontSize:12,color:'#66645F'},splitLine:{lineStyle:{color:'#AAA69D',opacity:.35}}},series:[{type:'line',data:state.history,showSymbol:true,symbolSize:7,lineStyle:{color:'#202020',width:2},itemStyle:{color:'#202020'}}],tooltip:{show:false}});return e}
 function set(k,v,commit){state[k]=Math.max(-2,Math.min(2,Math.round(v*10)/10));const e=render();if(commit){state.history.push(e);state.last=e;render();els.status.setAttribute('aria-label',`参数 ${k} 为 ${state[k].toFixed(1)}，平均误差 ${e.toFixed(3)}`)}}
 ['w','b'].forEach(k=>{els[k].addEventListener('input',()=>set(k,+els[k].value,false));els[k].addEventListener('change',()=>set(k,+els[k].value,true))});root.querySelectorAll('[data-adjust]').forEach(btn=>btn.addEventListener('click',()=>{const [k,d]=btn.dataset.adjust.split(':');set(k,state[k]+ +d,true)}));root.querySelector('[data-reset]').addEventListener('click',()=>{state={w:0,b:0,history:[initial],last:initial};render();els.status.setAttribute('aria-label','已重置：w 与 b 均为 0.0，平均误差 0.693')});
 const resize=()=>{predChart.resize();histChart.resize()};const off=Deck.onResize(resize);render();requestAnimationFrame(resize);Deck.init({index:8,total:21});root.destroy=()=>{if(destroyed)return;destroyed=true;off();predChart.dispose();histChart.dispose()};
})();
</script>
</body></html>
