<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{display:flex;flex-direction:column;gap:18px}
.p09-head{height:112px;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:1px solid var(--line-soft);padding-bottom:18px}
.p09-kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--muted)}
.p09-head h1{font:700 var(--fs-h1)/1.18 var(--font-sans);margin:12px 0 0}
.p09-widget{flex:1;display:grid;grid-template-columns:520px minmax(0,1fr);gap:44px;min-height:0}
.p09-left{display:flex;flex-direction:column;gap:18px;padding-top:10px}
.p09-question{font:600 var(--fs-h2)/1.35 var(--font-sans);margin:0}
.p09-fixed{font:var(--fs-sec)/1.5 var(--font-sans);color:var(--muted)}
.p09-fixed code,.p09-step,.p09-param,.p09-loss,.p09-equation{font-family:var(--font-mono)}
.p09-trackbox{position:relative;height:210px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:28px 18px}
.p09-baseline{position:absolute;left:56px;right:56px;top:108px;border-top:3px solid var(--line)}
.p09-tick{position:absolute;top:99px;width:2px;height:20px;background:var(--line);transform:translateX(-50%)}
.p09-pos{position:absolute;top:66px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:48px;font:var(--fs-label)/1.25 var(--font-sans);color:var(--muted)}
.p09-pos strong{font-family:var(--font-mono);color:var(--text)}
.p09-param{position:absolute;left:50%;top:87px;transform:translate(-50%,-50%);min-width:126px;text-align:center;background:var(--panel-bg);border:2px solid var(--line);border-radius:8px;padding:11px 14px;font-size:var(--fs-body);font-weight:700;transition:left .16s ease,border-color .16s ease,background .16s ease}
.p09-param.active{border-color:var(--focus);background:#fff5dc}
.p09-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.p09-actions .btn{min-height:48px}
.p09-actions .btn[aria-pressed="true"]{outline:3px solid var(--focus);outline-offset:1px}
.p09-record{min-height:82px;padding:14px 16px;background:var(--panel-bg);border-left:5px solid var(--model);font:var(--fs-sec)/1.5 var(--font-sans)}
.p09-record b{font-family:var(--font-mono);font-size:var(--fs-body)}
.p09-reset{align-self:flex-start}
.p09-right{display:grid;grid-template-rows:minmax(0,1fr) 126px;gap:16px;min-height:0;padding-top:10px}
.p09-chartbox{position:relative;border:1px solid var(--line-soft);background:rgba(255,255,255,.22);min-height:0}
#p09-chart{position:absolute;inset:0}
.p09-scale-note{position:absolute;right:18px;top:14px;font:var(--fs-label)/1.3 var(--font-sans);color:var(--muted);background:var(--paper);padding:4px 7px;z-index:2}
.p09-result{display:grid;grid-template-columns:1fr 210px;align-items:center;gap:20px;border-top:2px solid var(--line);padding-top:14px}
.p09-math{font:var(--fs-sec)/1.55 var(--font-sans);color:var(--muted)}
.p09-math strong{display:block;color:var(--text);font-family:var(--font-mono);font-size:var(--fs-body)}
.p09-verdict{font:700 var(--fs-h2)/1.25 var(--font-serif);text-align:center;opacity:.25}
.p09-verdict.revealed{opacity:1}
.p09-verdict .arrow{display:block;font:700 38px/1 var(--font-sans);color:var(--model)}
.p09-foot{height:76px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line-soft)}
.p09-conclusion{font:600 var(--fs-lead)/1.35 var(--font-serif)}
.p09-next{font:var(--fs-sec)/1.35 var(--font-sans);color:var(--muted);text-align:right}
@media(prefers-reduced-motion:reduce){.p09-param{transition:none}}
</style>
</head>
<body data-page="09" data-total="21">
<div id="stage">
  <header class="p09-head"><div class="p09-kicker">STEP 03 · TEST BOTH SIDES</div><h1>同一个参数，往哪边轻推会让误差下降？</h1></header>
  <main class="p09-widget" data-p09-widget>
    <section class="p09-left min0" aria-label="轻推参数">
      <h2 class="p09-question">把 <span class="param">w</span> 从中心向两边各推 <span class="p09-step">0.0001</span></h2>
      <div class="p09-fixed">固定样本：<code>x=(-2,-1,1,2)</code>，<code>t=(0,0,1,1)</code>；<code>b=0</code>，四条样本等权。</div>
      <div class="p09-trackbox">
        <div class="p09-baseline"></div>
        <div class="p09-tick" style="left:18%"></div><div class="p09-tick" style="left:50%"></div><div class="p09-tick" style="left:82%"></div>
        <div class="p09-pos" style="left:18%"><span>左推</span><strong>−0.0001</strong></div>
        <div class="p09-pos" style="left:50%"><span>中心</span><strong>0</strong></div>
        <div class="p09-pos" style="left:82%"><span>右推</span><strong>+0.0001</strong></div>
        <div class="p09-param active" data-param>w = 0</div>
      </div>
      <div class="p09-actions" role="group" aria-label="选择参数位置">
        <button class="btn" type="button" data-move="left">向左轻推</button><button class="btn" type="button" data-move="center" aria-pressed="true">回到中心</button><button class="btn" type="button" data-move="right">向右轻推</button>
      </div>
      <div class="p09-record" data-record aria-live="polite">出发点：<b>w = 0</b><br>四样本平均误差 <b>0.693147</b></div>
      <button class="btn p09-reset" type="button" data-reset>重置本页</button>
    </section>
    <section class="p09-right min0" aria-label="三点误差比较">
      <div class="p09-chartbox min0"><div class="p09-scale-note">放大读数，纵轴不从 0 开始</div><div id="p09-chart" role="img" aria-label="左推、中心和右推三个位置的平均误差放大图"></div></div>
      <div class="p09-result">
        <div class="p09-math" data-math>先访问左右两侧，比较同一误差尺度。</div>
        <div class="p09-verdict" data-verdict><span class="arrow">→</span>下坡向右</div>
      </div>
    </section>
  </main>
  <footer class="p09-foot"><div class="p09-conclusion">把参数向左右各轻推一点，误差较低的那边就是下坡方向。</div><div class="p09-next">已经知道下坡方向，参数接下来该迈多大一步？</div></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/echarts.min.js"></script>
<script>
(() => {
 const root=document.querySelector('[data-p09-widget]'); if(!root)return;
 const xs=[-2,-1,1,2], ts=[0,0,1,1], step=.0001;
 const calc=w=>{const eps=Lec.K.BCE_CLIP_EPSILON;return xs.reduce((s,x,i)=>{const p=1/(1+Math.exp(-(w*x)));const q=Math.max(eps,Math.min(1-eps,p));return s-(ts[i]*Math.log(q)+(1-ts[i])*Math.log(1-q));},0)/xs.length};
 const loss={left:calc(-step),center:calc(0),right:calc(step)};
 const initial=()=>({pos:'center',seenLeft:false,seenRight:false}); let state=initial(),destroyed=false;
 const el={param:root.querySelector('[data-param]'),record:root.querySelector('[data-record]'),math:root.querySelector('[data-math]'),verdict:root.querySelector('[data-verdict]'),buttons:[...root.querySelectorAll('[data-move]')]};
 const chart=echarts.init(root.querySelector('#p09-chart'),null,{renderer:'svg'});
 function render(){const idx={left:0,center:1,right:2}[state.pos],w=[-step,0,step][idx];el.param.style.left=['18%','50%','82%'][idx];el.param.textContent=`w = ${w===0?'0':(w>0?'+':'−')+Math.abs(w).toFixed(4)}`;el.param.classList.toggle('active',state.pos!=='center');el.buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.move===state.pos)));
 const names={left:'左边：误差更高',center:'出发点',right:'右边：误差更低'};el.record.innerHTML=`${names[state.pos]}：<b>w = ${w===0?'0':(w>0?'+':'−')+Math.abs(w).toFixed(4)}</b><br>四样本平均误差 <b>${loss[state.pos].toFixed(6)}</b>`;
 const values=[state.seenLeft?loss.left:null,loss.center,state.seenRight?loss.right:null];chart.setOption({animation:false,textStyle:{fontFamily:'var(--font-sans)',fontSize:16,color:'#202020'},grid:{left:105,right:44,top:58,bottom:70},xAxis:{type:'category',data:['−0.0001','0','+0.0001'],name:'参数 w',nameLocation:'middle',nameGap:46,nameTextStyle:{fontSize:16},axisLabel:{fontSize:14},axisLine:{lineStyle:{color:'#4B4A46'}}},yAxis:{type:'value',min:0.69305,max:0.69324,name:'平均误差',nameTextStyle:{fontSize:16,padding:[0,0,8,0]},axisLabel:{fontSize:13,formatter:v=>v.toFixed(5)},splitLine:{lineStyle:{color:'#AAA69D',type:'dashed'}}},series:[{type:'line',data:values,connectNulls:false,symbol:'circle',symbolSize:18,lineStyle:{width:3,color:'#176B87'},itemStyle:{color:'#F4F1E8',borderColor:'#176B87',borderWidth:4},label:{show:true,position:'top',distance:12,fontSize:15,fontFamily:'monospace',color:'#202020',formatter:p=>p.value==null?'':Number(p.value).toFixed(6)},markLine:state.seenLeft&&state.seenRight?{silent:true,symbol:['none','arrow'],symbolSize:13,lineStyle:{color:'#176B87',width:4,type:'solid'},label:{show:false},data:[[{coord:[0,loss.left]},{coord:[2,loss.right]}]]}:undefined}]},true);
 const done=state.seenLeft&&state.seenRight;el.verdict.classList.toggle('revealed',done);el.math.innerHTML=done?`右边误差 − 左边误差 <strong>= ${(loss.right-loss.left).toFixed(6)}</strong>每 1 单位 <code>w</code> 的坡度读数 <strong>≈ ${((loss.right-loss.left)/(2*step)).toFixed(2)}</strong>负号 → 增大 <code>w</code> 是下坡`:'先访问左右两侧，比较同一误差尺度。';}
 function move(pos,announce=true){if(destroyed)return;state={...state,pos,seenLeft:state.seenLeft||pos==='left',seenRight:state.seenRight||pos==='right'};render()}
 const clicks=[];el.buttons.forEach(b=>{const fn=()=>move(b.dataset.move);b.addEventListener('click',fn);clicks.push([b,fn])});
 const reset=root.querySelector('[data-reset]');const onReset=()=>{state=initial();render()};reset.addEventListener('click',onReset);
 const onKey=e=>{if(!root.contains(document.activeElement))return;let pos=null;if(e.key==='ArrowLeft')pos='left';else if(e.key==='ArrowRight')pos='right';else if(e.key==='0')pos='center';if(pos){e.preventDefault();e.stopPropagation();move(pos)}};root.addEventListener('keydown',onKey);
 const offResize=Deck.onResize(()=>chart.resize());render();
 root.destroyP09=()=>{if(destroyed)return;destroyed=true;clicks.forEach(([b,f])=>b.removeEventListener('click',f));reset.removeEventListener('click',onReset);root.removeEventListener('keydown',onKey);offResize();chart.dispose()};
 Deck.init({index:9,total:21});
})();
</script>
</body>
</html>
