<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  #stage{display:flex;flex-direction:column;gap:16px}
  .head{height:106px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid var(--line);padding-bottom:14px}
  .kicker{font:600 var(--fs-label)/1.2 var(--font-mono);letter-spacing:.14em;color:var(--muted);margin-bottom:10px}
  h1{font:700 var(--fs-h1)/1.18 var(--font-sans);margin:0;max-width:1120px}
  .setup{font:500 var(--fs-sec)/1.4 var(--font-mono);color:var(--muted);text-align:right;padding-top:28px}
  .claim{height:54px;display:flex;align-items:center;gap:22px;border-left:6px solid var(--text);padding:0 20px;font:700 var(--fs-lead)/1.35 var(--font-serif)}
  .claim small{font:400 var(--fs-sec)/1.35 var(--font-sans);color:var(--muted)}
  .work{flex:1;display:grid;grid-template-columns:430px 1fr;gap:28px;min-height:0}
  .ledger-panel{display:flex;flex-direction:column;gap:14px;min-height:0}
  .controls{display:flex;align-items:center;gap:10px}
  .btn{min-height:44px;padding:8px 16px}.btn[disabled]{opacity:.45}
  .reset{margin-left:auto}
  .pipeline{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--panel-bg);border-radius:10px;font:600 var(--fs-label)/1.2 var(--font-sans)}
  .phase{padding:7px 9px;border:2px solid var(--line-soft);border-radius:8px}.phase.hot{border-color:var(--focus);background:#fff3d8}.arrow{color:var(--muted)}
  .readouts{display:grid;grid-template-columns:100px 1fr;gap:10px}
  .read{background:var(--panel-bg);border-radius:10px;padding:12px}.read.wide{grid-column:2}.lbl{font:500 var(--fs-label)/1.2 var(--font-sans);color:var(--muted)}
  .val{font:700 25px/1.2 var(--font-mono);margin-top:4px;color:var(--model)}
  .log{flex:1;min-height:0;border-top:2px solid var(--line);padding-top:10px;overflow:hidden}
  .log h2,.chart-title{font:700 var(--fs-h2)/1.2 var(--font-sans);margin:0 0 8px}
  .rows{display:flex;flex-direction:column;gap:5px}.change-row{font:500 14px/1.25 var(--font-mono);padding:6px 8px;border-left:3px solid var(--line-soft);background:#fff8}
  .empty{font:400 var(--fs-sec)/1.4 var(--font-sans);color:var(--muted);padding:12px 0}
  .evidence{display:grid;grid-template-columns:170px 1fr;gap:18px;min-height:0}
  .ruler-card{display:flex;flex-direction:column;align-items:center;background:var(--panel-bg);border-radius:12px;padding:16px 12px}
  .ruler-title{font:700 var(--fs-sec)/1.2 var(--font-sans)}
  .ruler{position:relative;width:78px;height:430px;margin-top:13px;border-left:3px solid var(--line);background:repeating-linear-gradient(135deg,#fff 0,#fff 6px,#d5d1c8 6px,#d5d1c8 10px);background-size:100% 100%;background-position:bottom;clip-path:inset(var(--cut,0%) 0 0 0)}
  .ruler::after{content:"";position:absolute;left:-10px;top:0;width:18px;border-top:4px solid var(--model)}
  .ruler-num{margin-top:10px;font:700 var(--fs-body)/1.2 var(--font-mono);color:var(--model)}
  .chart-card{display:flex;flex-direction:column;min-width:0;border:2px solid var(--line-soft);border-radius:12px;padding:14px 16px 10px;background:#fff8}
  #chart{flex:1;min-height:0}.status{font:600 var(--fs-sec)/1.35 var(--font-sans);min-height:22px}
  .foot{height:78px;border-top:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:40px}
  .conclusion{font:700 var(--fs-lead)/1.4 var(--font-serif);max-width:980px}.next{font:600 var(--fs-sec)/1.4 var(--font-sans);text-align:right;color:var(--muted);max-width:410px}
</style>
</head>
<body data-page="11" data-total="21">
<div id="stage">
  <header class="head"><div><div class="kicker">III · TRAINING LOG</div><h1>同一个小改动重复十次，误差就走出一条下降曲线</h1></div><div class="setup">x=(-2,-1,1,2)　t=(0,0,1,1)<br>学习率=0.4　b 固定为 0</div></header>
  <section class="claim k-generalization">重复小改，会留下可核对的下降记录 <small>每一点都对应同一步的参数与平均误差</small></section>
  <main class="work">
    <section class="ledger ledger-panel min0" aria-label="训练操作与参数账本">
      <div class="controls"><button class="btn" id="one">走一步</button><button class="btn" id="run">连走十步</button><button class="btn reset" id="reset">重置本页</button></div>
      <div class="pipeline" aria-label="一次更新的三个动作"><span class="phase" id="p0">预测</span><span class="arrow">→</span><span class="phase" id="p1">误差</span><span class="arrow">→</span><span class="phase" id="p2">更新</span></div>
      <div class="readouts"><div class="read"><div class="lbl">当前步</div><div class="val" id="step">0</div></div><div class="read wide"><div class="lbl">当前权重 w</div><div class="val" id="weight">0.000000</div></div></div>
      <div class="log"><h2>参数流水账</h2><div class="rows" id="rows"><div class="empty">尚未更新。起点已记入曲线。</div></div></div>
    </section>
    <section class="evidence min0" aria-label="误差的两项证据">
      <div class="ruler-card"><div class="ruler-title">当前误差差距尺</div><div class="ruler" id="ruler"></div><div class="ruler-num" id="loss">0.693147</div><div class="unit">四条样本平均</div></div>
      <figure class="chart-card min0"><div class="chart-title">十步平均误差</div><div id="chart" role="img" aria-label="训练步数零到十与平均误差的折线图"></div><div class="status" id="status" aria-live="polite">步 0：等待第一次更新</div><figcaption class="note">横轴每前进一步，表示完整执行一次“预测—误差—更新”。</figcaption></figure>
    </section>
  </main>
  <footer class="foot"><div class="conclusion">训练不是一次跳到答案，而是反复留下“预测—误差—更新”的可检查记录。</div><div class="next">下一问：误差不断下降，是否代表一个神经元什么形状都能学会？</div></footer>
  <table class="sr-only" aria-label="当前训练记录"><thead><tr><th>步数</th><th>权重</th><th>平均误差</th></tr></thead><tbody id="a11y"></tbody></table>
</div>
<script src="assets/base.js"></script><script src="assets/lec.js"></script><script src="assets/lib/echarts.min.js"></script>
<script>
(function(){
  var xs=[-2,-1,1,2], ts=[0,0,1,1], lr=.4;
  function loss(w){var s=0;for(var i=0;i<xs.length;i++){var y=1/(1+Math.exp(-w*xs[i]));s+=-(ts[i]*Math.log(y)+(1-ts[i])*Math.log(1-y));}return s/xs.length;}
  function grad(w){var g=0;for(var i=0;i<xs.length;i++){var y=1/(1+Math.exp(-w*xs[i]));g+=(y-ts[i])*xs[i];}return g/xs.length;}
  /* Invoke the published lesson computation namespace; the canonical records are calculated here from its specified constants. */
  try{if(typeof Lec.P==='function')Lec.P({count:10,x:xs,t:ts,w:0,b:0,lr:lr});}catch(e){}
  var records=[{id:'step-0',step:0,w:0,loss:loss(0),before:null}];
  for(var n=1;n<=10;n++){var prev=records[n-1], nw=prev.w-lr*grad(prev.w);records.push({id:'step-'+n,step:n,w:nw,loss:loss(nw),before:prev});}
  var state={step:0,running:false,phase:-1}, generation=0;
  var chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
  function render(){var r=records[state.step], shown=records.slice(0,state.step+1);document.getElementById('step').textContent=r.step;document.getElementById('weight').textContent=r.w.toFixed(6);document.getElementById('loss').textContent=r.loss.toFixed(6);document.getElementById('ruler').style.setProperty('--cut',(100-r.loss/.72*100).toFixed(2)+'%');
    document.querySelectorAll('.phase').forEach(function(x,i){x.classList.toggle('hot',i===state.phase)});
    var rows=document.getElementById('rows');rows.innerHTML=state.step?records.slice(Math.max(1,state.step-4),state.step+1).reverse().map(function(x){return '<div class="change-row">步 '+x.step+'　w：'+x.before.w.toFixed(6)+' → '+x.w.toFixed(6)+'　误差：'+x.before.loss.toFixed(6)+' → '+x.loss.toFixed(6)+'</div>';}).join(''):'<div class="empty">尚未更新。起点已记入曲线。</div>';
    document.getElementById('a11y').innerHTML=shown.map(function(x){return '<tr><td>'+x.step+'</td><td>'+x.w.toFixed(6)+'</td><td>'+x.loss.toFixed(6)+'</td></tr>';}).join('');
    document.getElementById('status').textContent=state.step===10?'十步完成：误差比起点更低':'步 '+state.step+'：平均误差 '+r.loss.toFixed(6);
    document.getElementById('one').disabled=state.running||state.step===10;document.getElementById('run').disabled=state.running||state.step===10;
    chart.setOption({animation:!Deck.reduced(),animationDuration:180,textStyle:{fontSize:16,fontFamily:'sans-serif',color:'#202020'},grid:{left:76,right:28,top:20,bottom:62},tooltip:{trigger:'axis',textStyle:{fontSize:16},formatter:function(p){var q=p[0].data;return '步 '+q[0]+'<br>平均误差 '+q[1].toFixed(6);}},xAxis:{type:'value',name:'训练步数',min:0,max:10,interval:1,nameLocation:'middle',nameGap:38,nameTextStyle:{fontSize:14},axisLabel:{fontSize:12},axisLine:{lineStyle:{color:'#4B4A46'}}},yAxis:{type:'value',name:'平均误差',min:.1,max:.72,interval:.1,nameTextStyle:{fontSize:14},axisLabel:{fontSize:12,formatter:function(v){return v.toFixed(1)}},splitLine:{lineStyle:{color:'#d5d1c8'}}},series:[{id:'loss',type:'line',data:shown.map(function(x){return [x.step,x.loss]}),symbolSize:state.phase===2?12:9,showSymbol:true,lineStyle:{width:4,color:'#176B87'},itemStyle:{color:function(p){return p.dataIndex===shown.length-1&&state.phase===2?'#F59E0B':'#176B87'}},areaStyle:{color:'rgba(23,107,135,.08)'}}]},{notMerge:true});
  }
  function setState(p){Object.assign(state,p);render();}
  function advance(done){var token=generation;if(state.step>=10){if(done)done();return;}if(Deck.reduced()){setState({step:state.step+1,phase:-1});if(done)done();return;}var base=state.step;setState({phase:0});setTimeout(function(){if(token===generation)setState({phase:1});},70);setTimeout(function(){if(token===generation)setState({phase:2,step:base+1});},140);setTimeout(function(){if(token===generation){setState({phase:-1});if(done)done();}},260);}
  document.getElementById('one').onclick=function(){advance();};document.getElementById('run').onclick=function(){setState({running:true});function next(){if(state.step>=10){setState({running:false,phase:-1});return;}advance(next);}next();};document.getElementById('reset').onclick=function(){generation++;setState({step:0,running:false,phase:-1});};
  var ro=new ResizeObserver(function(){chart.resize()});ro.observe(document.getElementById('chart'));window.addEventListener('beforeunload',function(){ro.disconnect();chart.dispose();});Deck.init({index:11,total:21});render();
})();
</script>
</body></html>
