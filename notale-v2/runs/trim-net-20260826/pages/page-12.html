<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="12" data-total="21">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;}
    .p12-head{height:104px;flex:none;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:18px;gap:32px;}
    .p12-kicker{font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.14em;color:var(--muted);margin-bottom:8px;}
    .p12-head h1{font-size:var(--fs-h1);line-height:1.16;margin:0;font-weight:650;letter-spacing:-.02em;}
    .p12-status{font-size:var(--fs-sec);color:var(--muted);white-space:nowrap;padding-bottom:5px;}
    .p12-main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;}
    .p12-map{position:relative;width:1240px;flex:1;min-height:0;margin-top:18px;}
    .p12-lines{position:absolute;inset:0;width:100%;height:100%;z-index:0;overflow:visible;}
    .p12-parent{position:absolute;z-index:2;left:50%;top:24px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;}
    .p12-parent .neuron{width:116px;height:116px;border-width:3px;background:var(--paper);font-size:var(--fs-body);font-weight:650;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;}
    .p12-params{display:flex;gap:12px;margin-top:12px;align-items:center;}
    .p12-params .param{font-family:var(--font-mono);font-size:var(--fs-body);min-width:56px;text-align:center;padding:7px 16px;background:var(--panel-bg);}
    .p12-cap{font-size:var(--fs-label);color:var(--muted);margin-top:8px;}
    .p12-choices{position:absolute;z-index:2;left:0;right:0;bottom:58px;display:grid;grid-template-columns:repeat(3,1fr);gap:72px;}
    .p12-choice{min-width:0;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}
    .p12-shape{width:270px;height:122px;display:block;}
    .p12-choice-label{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:var(--fs-h2);font-weight:600;}
    .p12-index{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--muted);letter-spacing:.08em;margin-top:8px;}
    .p12-q{width:28px;height:28px;border:2px solid var(--line);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:20px;font-weight:700;}
    .p12-branch-label{position:absolute;left:50%;top:218px;transform:translateX(-50%);z-index:2;background:var(--paper);padding:0 14px;font-size:var(--fs-label);color:var(--muted);letter-spacing:.05em;}
    .p12-bottom{height:122px;flex:none;border-top:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:48px;}
    .p12-conclusion{font-family:var(--font-serif);font-size:var(--fs-lead);line-height:1.4;max-width:570px;}
    .p12-next{font-size:var(--fs-lead);line-height:1.4;font-weight:600;text-align:right;max-width:720px;}
    .p12-next span{display:block;font-family:var(--font-mono);font-size:var(--fs-label);font-weight:400;letter-spacing:.1em;color:var(--muted);margin-bottom:5px;}
  </style>

  <header class="p12-head">
    <div class="min0">
      <div class="p12-kicker">LEARNING → CAPACITY</div>
      <h1>一个神经元已经会学；它能学会什么形状？</h1>
    </div>
    <div class="p12-status">机制已知　／　能力待检验</div>
  </header>

  <main class="p12-main min0 focus k-classification" aria-label="一个神经元与三种待检验的分界形状">
    <div class="p12-map min0">
      <svg class="p12-lines" viewBox="0 0 1240 580" aria-hidden="true" preserveAspectRatio="none">
        <path d="M620 178 V238 M620 238 H202 V330 M620 238 V330 M620 238 H1038 V330" fill="none" stroke="var(--line)" stroke-width="3"/>
        <circle cx="620" cy="238" r="6" fill="var(--paper)" stroke="var(--line)" stroke-width="3"/>
        <path d="M192 320 l10 10 10-10 M610 320 l10 10 10-10 M1028 320 l10 10 10-10" fill="none" stroke="var(--line)" stroke-width="3"/>
      </svg>

      <section class="p12-parent" aria-label="上位对象：一个会学习的神经元，参数是 w 和 b">
        <div class="neuron">会学习</div>
        <div class="p12-params"><span class="param">w</span><span class="param">b</span></div>
        <div class="p12-cap">两个可改的数字</div>
      </section>

      <div class="p12-branch-label">哪些形状，一个神经元真的能做到？</div>

      <div class="p12-choices">
        <section class="p12-choice">
          <svg class="p12-shape" viewBox="0 0 270 122" role="img" aria-label="一条斜直线轮廓">
            <rect x="1" y="1" width="268" height="120" fill="none" stroke="var(--line-soft)" stroke-width="2"/>
            <path d="M38 96 L232 27" fill="none" stroke="var(--line)" stroke-width="4" stroke-dasharray="10 9"/>
          </svg>
          <div class="p12-choice-label">直线？ <span class="p12-q" aria-hidden="true">?</span></div>
          <div class="p12-index">候选形状 01</div>
        </section>
        <section class="p12-choice">
          <svg class="p12-shape" viewBox="0 0 270 122" role="img" aria-label="一条平滑弯线轮廓">
            <rect x="1" y="1" width="268" height="120" fill="none" stroke="var(--line-soft)" stroke-width="2"/>
            <path d="M27 93 C78 18 172 18 243 87" fill="none" stroke="var(--line)" stroke-width="4" stroke-dasharray="10 9"/>
          </svg>
          <div class="p12-choice-label">弯线？ <span class="p12-q" aria-hidden="true">?</span></div>
          <div class="p12-index">候选形状 02</div>
        </section>
        <section class="p12-choice">
          <svg class="p12-shape" viewBox="0 0 270 122" role="img" aria-label="两块彼此分离的封闭轮廓">
            <rect x="1" y="1" width="268" height="120" fill="none" stroke="var(--line-soft)" stroke-width="2"/>
            <path d="M28 69 C28 37 57 24 91 30 C119 35 126 70 105 91 C80 113 29 100 28 69 Z M159 57 C166 25 207 18 233 38 C260 59 241 96 210 101 C176 106 152 87 159 57 Z" fill="none" stroke="var(--line)" stroke-width="4" stroke-dasharray="10 9"/>
          </svg>
          <div class="p12-choice-label">分开的区域？ <span class="p12-q" aria-hidden="true">?</span></div>
          <div class="p12-index">候选形状 03</div>
        </section>
      </div>
    </div>
  </main>

  <footer class="p12-bottom">
    <div class="p12-conclusion">学习方法已经成立，能力边界还没有回答。</div>
    <div class="p12-next"><span>NEXT QUESTION</span>如果输入变成平面上的两个数，它画出的分界会是什么样？</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
