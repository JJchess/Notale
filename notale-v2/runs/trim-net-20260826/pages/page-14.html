<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="14" data-total="21">
<div id="stage">
  <style>
    #layer-builder{flex:1;display:flex;flex-direction:column;min-height:0;gap:18px}
    #layer-builder .head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
    #layer-builder .kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.16em;color:var(--muted);margin:0 0 10px}
    #layer-builder h1{font:700 var(--fs-h1)/1.22 var(--font-sans);margin:0;max-width:1120px;color:var(--text)}
    #layer-builder .controls{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:58px}
    #layer-builder .btns{display:flex;gap:12px}
    #layer-builder .btn{min-width:176px}
    #layer-builder .btn[aria-current="step"]{outline:3px solid var(--focus);outline-offset:3px}
    #layer-builder .btn[disabled]{opacity:.52;cursor:not-allowed}
    #layer-builder .btn.done{border-style:double}
    #layer-builder .statusline{font:var(--fs-label)/1.4 var(--font-sans);color:var(--muted);white-space:nowrap}
    #layer-builder .statusline b{color:var(--text);font-family:var(--font-mono)}
    #layer-builder .network{display:block;position:relative;flex:1;min-height:0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:16px 38px 14px}
    #layer-builder .paths{position:absolute;inset:16px 38px 14px;width:calc(100% - 76px);height:calc(100% - 30px);overflow:visible;pointer-events:none}
    #layer-builder .path{fill:none;stroke:var(--line);stroke-width:3;marker-end:url(#lb-arrow);opacity:0}
    #layer-builder .path.show{opacity:1}
    #layer-builder .path.fresh{stroke:var(--focus)}
    #layer-builder .cols{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:90px}
    #layer-builder .layer{display:grid;grid-template-rows:52px 1fr 58px;min-width:0;text-align:center}
    #layer-builder .layer-head{display:flex;justify-content:center;align-items:center;gap:12px}
    #layer-builder .count{font:700 30px/1 var(--font-mono);color:var(--text)}
    #layer-builder .nodes{display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;min-height:0}
    #layer-builder .sample{width:108px;height:68px;display:grid;place-items:center;font-size:var(--fs-label)}
    #layer-builder .neuron{display:grid;place-items:center;text-align:center;font-size:14px;line-height:1.15;padding:7px}
    #layer-builder .pending{opacity:0;transform:translateX(-12px);pointer-events:none}
    #layer-builder .pending.show{opacity:1;transform:none}
    #layer-builder .pending.fresh{border-color:var(--focus);color:var(--focus)}
    #layer-builder .explain{margin:7px auto 0;max-width:330px;min-height:46px;font:var(--fs-sec)/1.4 var(--font-sans);color:var(--muted);opacity:0}
    #layer-builder .explain.show{opacity:1}
    #layer-builder .summary{height:70px;display:flex;align-items:center;justify-content:space-between;gap:32px}
    #layer-builder .structure{font:700 30px/1 var(--font-mono);letter-spacing:.08em;min-width:200px;opacity:0}
    #layer-builder .conclusion{font:var(--fs-lead)/1.4 var(--font-serif);margin:0;flex:1;opacity:0}
    #layer-builder .reveal{opacity:1}
    #layer-builder .next{margin:0;font:var(--fs-sec)/1.4 var(--font-sans);color:var(--muted);text-align:right;max-width:480px}
    @media (prefers-reduced-motion:no-preference){
      #layer-builder .pending{transition:opacity 180ms ease,transform 180ms cubic-bezier(.2,.9,.35,1.3),border-color 250ms,color 250ms}
      #layer-builder .explain,#layer-builder .structure,#layer-builder .conclusion{transition:opacity 220ms ease}
      #layer-builder .path{transition:stroke 250ms,opacity 120ms}
    }
  </style>

  <section id="layer-builder" aria-labelledby="lb-title">
    <header class="head">
      <div><p class="kicker">LAYER BY LAYER</p><h1 id="lb-title">多层网络没有换算法，只是把神经元接成下一层的输入</h1></div>
    </header>

    <div class="controls">
      <div class="btns" role="group" aria-label="按顺序搭接网络">
        <button class="btn" id="add-hidden" type="button" aria-current="step">搭上隐藏层</button>
        <button class="btn" id="add-output" type="button" disabled>搭上输出层</button>
        <button class="btn" id="reset-layer" type="button">重置本页</button>
      </div>
      <div class="statusline" aria-live="polite">隐藏层：<b id="hidden-status">未搭接</b>　输出层：<b id="output-status">未搭接</b></div>
    </div>

    <div class="network triptych k-classification min0" aria-label="三层神经网络搭接区">
      <svg class="paths" viewBox="0 0 1400 480" preserveAspectRatio="none" aria-hidden="true">
        <defs><marker id="lb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
        <g id="hidden-paths">
          <path class="path"/><path class="path"/><path class="path"/>
          <path class="path"/><path class="path"/><path class="path"/>
        </g>
        <g id="output-paths"><path class="path"/><path class="path"/><path class="path"/></g>
      </svg>
      <div class="cols">
        <section class="layer"><div class="layer-head"><span class="tag">输入层</span><span class="count">2</span></div><div class="nodes"><div class="sample" data-input>输入 1</div><div class="sample" data-input>输入 2</div></div><p class="explain show">两个数值进入网络</p></section>
        <section class="layer"><div class="layer-head"><span class="tag">隐藏层</span><span class="count pending" data-hidden>3</span></div><div class="nodes"><div class="neuron pending" data-hidden>神经元 A</div><div class="neuron pending" data-hidden>神经元 B</div><div class="neuron pending" data-hidden>神经元 C</div></div><p class="explain" id="hidden-note">每个神经元接收上一层的输出</p></section>
        <section class="layer"><div class="layer-head"><span class="tag">输出层</span><span class="count pending" data-output>1</span></div><div class="nodes"><div class="neuron pending" data-output>输出<br>神经元</div></div><p class="explain" id="output-note">再把隐藏层的三个输出合在一起</p></section>
      </div>
    </div>

    <footer class="summary">
      <div class="structure" id="structure">2 → 3 → 1</div>
      <p class="conclusion" id="conclusion">每个神经元仍做熟悉的计算；“多层”只表示它的输出还会被后面的神经元继续使用。</p>
      <p class="next">神经元变多、层数变深，真的能解决一条直线解决不了的问题吗？</p>
    </footer>
  </section>

  <script>
  (()=>{
    const root=document.getElementById('layer-builder');
    const hiddenBtn=root.querySelector('#add-hidden'), outputBtn=root.querySelector('#add-output'), resetBtn=root.querySelector('#reset-layer');
    const hiddenNodes=[...root.querySelectorAll('[data-hidden]')], outputNodes=[...root.querySelectorAll('[data-output]')];
    const hiddenPaths=[...root.querySelectorAll('#hidden-paths .path')], outputPaths=[...root.querySelectorAll('#output-paths .path')];
    const hiddenNote=root.querySelector('#hidden-note'), outputNote=root.querySelector('#output-note');
    const hiddenStatus=root.querySelector('#hidden-status'), outputStatus=root.querySelector('#output-status');
    const structure=root.querySelector('#structure'), conclusion=root.querySelector('#conclusion');
    const svg=root.querySelector('.paths'), inputs=[...root.querySelectorAll('[data-input]')];
    let state={step:0}, timers=[]; const resizeObserver=new ResizeObserver(geometry);
    const later=(fn,ms)=>{const id=setTimeout(fn,ms);timers.push(id);};
    const clearWork=()=>{timers.forEach(clearTimeout);timers=[];};
    function settle(items){items.forEach(x=>x.classList.remove('fresh'));}
    function anchor(el,side){const r=el.getBoundingClientRect(),s=svg.getBoundingClientRect();return {x:(side==='right'?r.right:r.left)-s.left,y:r.top+r.height/2-s.top};}
    function setLine(path,a,b){const s=svg.getBoundingClientRect(),sx=1400/s.width,sy=480/s.height;path.setAttribute('d',`M${a.x*sx} ${a.y*sy} L${b.x*sx} ${b.y*sy}`);}
    function geometry(){
      const hs=hiddenNodes.filter(n=>n.classList.contains('neuron')), out=outputNodes.find(n=>n.classList.contains('neuron'));
      let i=0; inputs.forEach(a=>hs.forEach(b=>setLine(hiddenPaths[i++],anchor(a,'right'),anchor(b,'left'))));
      hs.forEach((a,j)=>setLine(outputPaths[j],anchor(a,'right'),anchor(out,'left')));
    }
    function reveal(nodes,paths,note){
      nodes.forEach(n=>n.classList.add('show','fresh'));
      geometry();
      if(Deck.reduced()){paths.forEach(p=>p.classList.add('show','fresh'));settle([...nodes,...paths]);return;}
      paths.forEach((p,i)=>later(()=>{p.classList.add('show','fresh');p.style.strokeDasharray='1';p.style.strokeDashoffset='1';p.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{duration:220,delay:0,fill:'both'});},180+i*35));
      later(()=>settle([...nodes,...paths]),180+paths.length*35+450);
    }
    function render(){
      const h=state.step>=1,o=state.step>=2;
      hiddenStatus.textContent=h?'已搭接':'未搭接'; outputStatus.textContent=o?'已搭接':'未搭接';
      hiddenBtn.disabled=h; hiddenBtn.classList.toggle('done',h); hiddenBtn.toggleAttribute('aria-current',!h);
      outputBtn.disabled=!h||o; outputBtn.classList.toggle('done',o); outputBtn.toggleAttribute('aria-current',h&&!o);
      hiddenNote.classList.toggle('show',h); outputNote.classList.toggle('show',o);
      structure.classList.toggle('reveal',o); conclusion.classList.toggle('reveal',o);
    }
    function addHidden(){if(state.step!==0)return;clearWork();state={step:1};render();reveal(hiddenNodes,hiddenPaths,hiddenNote);}
    function addOutput(){if(state.step!==1)return;clearWork();state={step:2};render();reveal(outputNodes,outputPaths,outputNote);}
    function reset(){clearWork();state={step:0};[...hiddenNodes,...outputNodes].forEach(n=>n.classList.remove('show','fresh'));[...hiddenPaths,...outputPaths].forEach(p=>{p.classList.remove('show','fresh');p.getAnimations().forEach(a=>a.cancel());p.style.strokeDasharray='';p.style.strokeDashoffset='';});render();}
    hiddenBtn.addEventListener('click',addHidden);outputBtn.addEventListener('click',addOutput);resetBtn.addEventListener('click',reset);render();geometry();resizeObserver.observe(svg);
    root.destroyLayerBuilder=()=>{clearWork();resizeObserver.disconnect();hiddenBtn.removeEventListener('click',addHidden);outputBtn.removeEventListener('click',addOutput);resetBtn.removeEventListener('click',reset);};
  })();
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
