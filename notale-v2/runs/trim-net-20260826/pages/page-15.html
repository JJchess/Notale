<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
#stage{gap:18px}
.p15-head{height:94px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:14px}
.p15-kicker{font-size:var(--fs-label);color:var(--muted);letter-spacing:.12em;margin-bottom:8px}.p15-head h1{font-size:var(--fs-h1);line-height:1.12;margin:0;font-weight:650}.p15-head .lead{width:380px;margin:0 0 3px;color:var(--muted)}
#xor-widget{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}.p15-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,2.55fr) minmax(360px,1fr);gap:28px}
.p15-plot{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--paper);min-height:0}.p15-konva{position:absolute;inset:0}.p15-overlay{position:absolute;inset:0;pointer-events:none}
.p15-axis-label,.p15-region{position:absolute;font-size:var(--fs-label);color:var(--muted);transform:translate(-50%,-50%);white-space:nowrap}.p15-region{font-size:var(--fs-body);font-weight:650;padding:5px 9px;background:rgba(244,241,232,.82);border:1px solid var(--line-soft);border-radius:8px}.p15-point{position:absolute;width:46px;height:46px;transform:translate(-50%,-50%);display:grid;place-items:center;font:700 18px var(--font-mono);border:3px solid var(--text);box-sizing:border-box;pointer-events:none}.p15-point[data-y="1"]{background:var(--text);color:var(--paper)}.p15-point[data-y="0"]{background:var(--paper);color:var(--text)}.p15-point.wrong{outline:5px double var(--line);outline-offset:5px}.p15-point-label{position:absolute;transform:translate(-50%,-50%);font:600 var(--fs-label) var(--font-sans);color:var(--muted)}
.p15-hit{position:absolute;width:38px;height:38px;transform:translate(-50%,-50%);pointer-events:auto;border:0;background:transparent;border-radius:50%;cursor:grab}.p15-hit.line{width:92px;height:46px;border-radius:8px}.p15-hit:focus-visible{outline:4px solid var(--focus);background:rgba(245,158,11,.14)}
.p15-side{display:flex;flex-direction:column;gap:14px}.p15-score{display:flex;gap:10px;flex-wrap:wrap}.p15-score .tag{font-family:var(--font-mono);font-size:var(--fs-body);padding:9px 12px}.p15-table{flex:1;padding:14px 16px}.p15-table h2{font-size:var(--fs-h2);margin:0 0 10px}.p15-table table{width:100%;border-collapse:collapse;font-size:var(--fs-sec)}.p15-table th{color:var(--muted);font-weight:500;text-align:center;border-bottom:1px solid var(--line-soft);padding:8px 5px}.p15-table th:first-child,.p15-table td:first-child{text-align:left}.p15-table td{padding:12px 5px;border-bottom:1px solid var(--line-soft);text-align:center;font-family:var(--font-mono)}.p15-table tr.bad td:last-child{font-weight:750;text-decoration:underline;text-decoration-style:double}.p15-feedback{min-height:55px;padding:12px 14px;border-left:5px solid var(--line);font-size:var(--fs-sec);line-height:1.45;background:var(--panel-bg)}
.p15-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:12px;align-items:end}.p15-controls .ctl{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 6px;align-items:center}.p15-controls input{width:100%;min-width:0;grid-column:1 / 3}.p15-controls output{font-family:var(--font-mono);width:54px;min-width:0;display:block;text-align:right}.p15-footer{height:70px;display:flex;align-items:center;justify-content:space-between;gap:30px;border-top:1px solid var(--line-soft);padding-top:12px}.p15-conclusion{font:600 var(--fs-lead) var(--font-serif);margin:0;max-width:850px}.p15-next{font-size:var(--fs-sec);color:var(--muted);margin:0;text-align:right;max-width:500px}
</style>
</head>
<body data-page="15" data-total="21">
<div id="stage">
  <header class="p15-head">
    <div><div class="p15-kicker">IV · 能力边界</div><h1>一条直线，分不开对角同类的四个点</h1></div>
    <p class="lead">固定四个点，只移动这一条直线。</p>
  </header>
  <section id="xor-widget" class="canvas-full" aria-label="单条直线分类挑战">
    <div class="p15-main">
      <div class="p15-plot cvbox min0 no-pan" data-plot>
        <div class="p15-konva" data-konva aria-hidden="true"></div>
        <div class="p15-overlay" data-overlay>
          <span class="p15-region" data-r0>预测 0</span><span class="p15-region" data-r1>预测 1</span>
          <button class="p15-hit line" data-line-hit type="button" aria-label="分类直线。方向键平移直线，每次 0.05"></button>
          <button class="p15-hit" data-handle="a" type="button" role="slider" aria-label="左端旋转手柄。方向键旋转直线" aria-valuemin="-180" aria-valuemax="180"></button>
          <button class="p15-hit" data-handle="b" type="button" role="slider" aria-label="右端旋转手柄。方向键旋转直线" aria-valuemin="-180" aria-valuemax="180"></button>
        </div>
      </div>
      <aside class="p15-side min0">
        <div class="p15-score"><span class="tag" data-current>当前分对：2 / 4</span><span class="tag" data-best>本轮最好：2 / 4</span></div>
        <div class="panel p15-table k-comparison">
          <h2>同一条线下的结果</h2>
          <table><thead><tr><th>样本</th><th>正确类别</th><th>当前预测</th><th>结果</th></tr></thead><tbody data-rows></tbody></table>
        </div>
        <div class="p15-feedback" data-feedback aria-live="polite">拖动直线或两端手柄，试着分对全部四点。</div>
        <div class="p15-controls">
          <label class="ctl">直线角度 <output data-angle-out>90°</output><input data-angle type="range" min="-180" max="180" step="2" value="90"></label>
          <label class="ctl">沿法线位置 <output data-offset-out>0.00</output><input data-offset type="range" min="-2.2" max="2.2" step="0.05" value="0"></label>
          <button class="btn" data-reset type="button">重置本页</button>
        </div>
      </aside>
    </div>
    <footer class="p15-footer"><p class="p15-conclusion" data-conclusion>无论怎样移动直线，单个神经元最多分对 3 个，至少错 1 个。</p><p class="p15-next">如果让多个神经元先各自判断一部分区域，会发生什么？</p></footer>
  </section>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script>
(() => {
  const root=document.getElementById('xor-widget'); if(!root||!window.Konva)return;
  const q=s=>root.querySelector(s), plot=q('[data-plot]'), host=q('[data-konva]'), overlay=q('[data-overlay]');
  const samples=[{id:'A',x:-1,y:-1,t:1},{id:'B',x:-1,y:1,t:0},{id:'C',x:1,y:-1,t:0},{id:'D',x:1,y:1,t:1}];
  let state={theta:0,d:0,best:2,reached:false,firstWrong:'',revealed:false}; let destroyed=false,drag=null;
  const stage=new Konva.Stage({container:host,width:100,height:100}), layer=new Konva.Layer(); stage.add(layer);
  const region=new Konva.Line({closed:true,fill:'rgba(23,107,135,.18)',stroke:'rgba(23,107,135,.55)',strokeWidth:1});
  const hatch=new Konva.Shape({sceneFunc:(ctx,shape)=>{const poly=predictionPolygon();if(poly.length<3)return;ctx.beginPath();ctx.moveTo(poly[0].x,poly[0].y);poly.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.closePath();ctx.clip();ctx.strokeStyle='rgba(23,107,135,.32)';ctx.lineWidth=1;for(let x=-600;x<1600;x+=22){ctx.beginPath();ctx.moveTo(x,650);ctx.lineTo(x+700,-50);ctx.stroke();}ctx.fillStrokeShape(shape);}});
  const grid=new Konva.Shape({sceneFunc:ctx=>{const {w,h,pad,sx,sy}=geom();ctx.strokeStyle='#AAA69D';ctx.lineWidth=1;[-1,0,1].forEach(v=>{ctx.beginPath();ctx.moveTo(sx(v),pad);ctx.lineTo(sx(v),h-pad);ctx.stroke();ctx.beginPath();ctx.moveTo(pad,sy(v));ctx.lineTo(w-pad,sy(v));ctx.stroke();});ctx.strokeStyle='#4B4A46';ctx.lineWidth=2;ctx.strokeRect(pad,pad,w-2*pad,h-2*pad);}});
  const line=new Konva.Line({stroke:'#202020',strokeWidth:5,lineCap:'round',hitStrokeWidth:26,draggable:false});
  const ha=new Konva.Circle({radius:14,fill:'#F4F1E8',stroke:'#F59E0B',strokeWidth:5,draggable:false}); const hb=ha.clone();
  layer.add(region,hatch,grid,line,ha,hb);
  const pointEls=samples.map(s=>{const e=document.createElement('div');e.className='p15-point sample';e.dataset.y=s.t;e.textContent=s.t;e.setAttribute('aria-hidden','true');overlay.appendChild(e);const lab=document.createElement('span');lab.className='p15-point-label';lab.textContent=s.id;overlay.appendChild(lab);return {e,lab};});
  const rows=q('[data-rows]'); rows.innerHTML=samples.map(s=>`<tr data-row="${s.id}"><td>${s.id}</td><td>${s.t}</td><td data-pred></td><td data-ok></td></tr>`).join('');
  function geom(){const w=plot.clientWidth,h=plot.clientHeight,pad=62;return {w,h,pad,sx:x=>pad+(x+1.6)/3.2*(w-2*pad),sy:y=>h-pad-(y+1.6)/3.2*(h-2*pad),ix:px=>(px-pad)/(w-2*pad)*3.2-1.6,iy:py=>(h-pad-py)/(h-2*pad)*3.2-1.6};}
  function val(s){return s.x*Math.cos(state.theta)+s.y*Math.sin(state.theta)-state.d}
  function pred(s){return val(s)>=0?1:0}
  function clipPoly(poly,a,b,c){const out=[];for(let i=0;i<poly.length;i++){const P=poly[i],Q=poly[(i+1)%poly.length],fp=a*P.x+b*P.y-c,fq=a*Q.x+b*Q.y-c;if(fp>=0)out.push(P);if((fp>=0)!=(fq>=0)){const t=fp/(fp-fq);out.push({x:P.x+t*(Q.x-P.x),y:P.y+t*(Q.y-P.y)});}}return out;}
  function predictionPolygon(){const g=geom(), poly=clipPoly([{x:-1.6,y:-1.6},{x:1.6,y:-1.6},{x:1.6,y:1.6},{x:-1.6,y:1.6}],Math.cos(state.theta),Math.sin(state.theta),state.d);return poly.map(p=>({x:g.sx(p.x),y:g.sy(p.y)}));}
  function endpoints(){const n={x:Math.cos(state.theta),y:Math.sin(state.theta)},v={x:-n.y,y:n.x},c={x:n.x*state.d,y:n.y*state.d};let ts=[];if(Math.abs(v.x)>1e-8){ts.push((-1.6-c.x)/v.x,(1.6-c.x)/v.x)}if(Math.abs(v.y)>1e-8){ts.push((-1.6-c.y)/v.y,(1.6-c.y)/v.y)}const pts=ts.map(t=>({x:c.x+v.x*t,y:c.y+v.y*t})).filter(p=>p.x>=-1.601&&p.x<=1.601&&p.y>=-1.601&&p.y<=1.601);return [pts[0]||c,pts[pts.length-1]||c]}
  function commit(next,announce=false){state={...state,...next};const results=samples.map(s=>pred(s)),score=results.filter((p,i)=>p===samples[i].t).length;const wrong=samples.filter((s,i)=>results[i]!==s.t).map(s=>s.id).join(',');state.best=Math.max(state.best,score);if(score===3&&!state.reached){state.reached=true;state.firstWrong=wrong}else if(score===3&&state.reached&&wrong!==state.firstWrong)state.revealed=true;render(results,score,wrong);if(announce)q('[data-feedback]').setAttribute('aria-label',`当前分对 ${score} 个，直线角度 ${Math.round((state.theta*180/Math.PI+90+360)%360)} 度。${q('[data-feedback]').textContent}`)}
  function render(results,score){const g=geom();stage.size({width:g.w,height:g.h});const poly=predictionPolygon();region.points(poly.flatMap(p=>[p.x,p.y]));const ep=endpoints(),a={x:g.sx(ep[0].x),y:g.sy(ep[0].y)},b={x:g.sx(ep[1].x),y:g.sy(ep[1].y)};line.points([a.x,a.y,b.x,b.y]);ha.position(a);hb.position(b);hatch.clearCache();
    pointEls.forEach((o,i)=>{const s=samples[i],x=g.sx(s.x),y=g.sy(s.y);o.e.style.left=x+'px';o.e.style.top=y+'px';o.e.classList.toggle('wrong',results[i]!==s.t);o.lab.style.left=(x+34)+'px';o.lab.style.top=(y-31)+'px';const tr=rows.querySelector(`[data-row="${s.id}"]`);tr.querySelector('[data-pred]').textContent=results[i];tr.querySelector('[data-ok]').textContent=results[i]===s.t?'对':'错';tr.classList.toggle('bad',results[i]!==s.t)});
    const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};q('[data-line-hit]').style.left=mid.x+'px';q('[data-line-hit]').style.top=mid.y+'px';[['a',a],['b',b]].forEach(([id,p])=>{const el=q(`[data-handle="${id}"]`);el.style.left=p.x+'px';el.style.top=p.y+'px';el.setAttribute('aria-valuenow',Math.round(state.theta*180/Math.PI))});
    const n={x:Math.cos(state.theta),y:Math.sin(state.theta)},rp0={x:g.sx(-n.x*.92+state.d*n.x),y:g.sy(-n.y*.92+state.d*n.y)},rp1={x:g.sx(n.x*.92+state.d*n.x),y:g.sy(n.y*.92+state.d*n.y)};q('[data-r0]').style.left=rp0.x+'px';q('[data-r0]').style.top=rp0.y+'px';q('[data-r1]').style.left=rp1.x+'px';q('[data-r1]').style.top=rp1.y+'px';
    q('[data-current]').textContent=`当前分对：${score} / 4`;q('[data-best]').textContent=`本轮最好：${state.best} / 4`;q('[data-angle]').value=Math.round(state.theta*180/Math.PI);q('[data-angle-out]').textContent=Math.round((state.theta*180/Math.PI+90+360)%360)+'°';q('[data-offset]').value=state.d;q('[data-offset-out]').textContent=state.d.toFixed(2);
    q('[data-feedback]').textContent=state.revealed?'错点换了，但仍至少有一个。 这四点的一条直线分类上限是 3 / 4。':state.reached?'3 / 4：只剩一个错点。你能让它也正确吗？':'拖动直线或两端手柄，试着分对全部四点。';layer.batchDraw();}
  function pointerDomain(){const p=stage.getPointerPosition(),g=geom();return p?{x:g.ix(p.x),y:g.iy(p.y)}:{x:0,y:0}}
  line.on('pointerdown',()=>{drag={kind:'line',start:pointerDomain(),d:state.d};stage.container().style.cursor='grabbing'});[ha,hb].forEach(h=>h.on('pointerdown',()=>{drag={kind:'rotate'};stage.container().style.cursor='grabbing'}));stage.on('pointermove',()=>{if(!drag)return;const p=pointerDomain();if(drag.kind==='line'){const n={x:Math.cos(state.theta),y:Math.sin(state.theta)};commit({d:Math.max(-2.2,Math.min(2.2,drag.d+(p.x-drag.start.x)*n.x+(p.y-drag.start.y)*n.y))})}else commit({theta:Math.atan2(p.y-state.d*Math.sin(state.theta),p.x-state.d*Math.cos(state.theta))+Math.PI/2})});
  function end(){if(drag){drag=null;stage.container().style.cursor='default';commit({},true)}}stage.on('pointerup pointercancel pointerleave',end);
  q('[data-line-hit]').addEventListener('keydown',e=>{let dd=0;if(e.key==='ArrowLeft'||e.key==='ArrowDown')dd=-.05;if(e.key==='ArrowRight'||e.key==='ArrowUp')dd=.05;if(dd){e.preventDefault();e.stopPropagation();commit({d:Math.max(-2.2,Math.min(2.2,state.d+dd))},true)}});
  root.querySelectorAll('[data-handle]').forEach(el=>el.addEventListener('keydown',e=>{let da=0;if(e.key==='ArrowLeft'||e.key==='ArrowDown')da=-2;if(e.key==='ArrowRight'||e.key==='ArrowUp')da=2;if(da){e.preventDefault();e.stopPropagation();commit({theta:state.theta+da*Math.PI/180},true)}}));
  q('[data-angle]').addEventListener('input',e=>commit({theta:Number(e.target.value)*Math.PI/180}));q('[data-angle]').addEventListener('change',()=>commit({},true));q('[data-offset]').addEventListener('input',e=>commit({d:Number(e.target.value)}));q('[data-offset]').addEventListener('change',()=>commit({},true));q('[data-reset]').addEventListener('click',()=>{state={theta:0,d:0,best:2,reached:false,firstWrong:'',revealed:false};commit({},true)});
  const offResize=Deck.onResize(()=>commit({}));commit({});Deck.init({index:15,total:21});
  root.destroy=()=>{if(destroyed)return;destroyed=true;offResize();stage.destroy();};
})();
</script>
</body>
</html>
