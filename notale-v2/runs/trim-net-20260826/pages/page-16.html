<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
    #stage{display:flex;flex-direction:column;gap:18px}
    .head{height:104px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--line-soft);padding-bottom:16px}
    .kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.16em;color:var(--muted);margin-bottom:10px}
    h1{margin:0;font:700 var(--fs-h1)/1.12 var(--font-sans);color:var(--text)}
    .rule{font:600 var(--fs-body)/1.35 var(--font-sans);padding:11px 18px;border:2px solid var(--line);border-radius:8px;background:var(--panel-bg)}
    .main{height:570px;flex:0 0 570px;display:grid;grid-template-columns:760px 1fr;gap:44px;min-height:0;align-items:stretch!important}
    .board,.network{position:relative;height:auto!important;align-self:stretch!important;border:2px solid var(--line-soft);border-radius:12px;background:rgba(255,255,255,.22);overflow:hidden}
    .section-title{position:absolute;left:22px;top:18px;margin:0;font:700 var(--fs-h2)/1.2 var(--font-sans)}
    .board svg,.network svg{position:absolute;inset:62px 18px 18px;width:calc(100% - 36px);height:calc(100% - 80px)}
    .axis{stroke:var(--line);stroke-width:2}.gridline{stroke:var(--line-soft);stroke-width:1;stroke-dasharray:5 6}
    .region{fill:var(--model);opacity:0;transition:opacity 180ms ease 80ms}.region.on{opacity:.18}
    .sample-dot{fill:var(--paper);stroke:var(--text);stroke-width:3}.sample-dot.one{stroke-width:5}
    .pred{font:700 17px var(--font-mono);fill:var(--text)}.coord{font:15px var(--font-mono);fill:var(--muted)}
    .gate{position:absolute;width:190px;min-height:106px;padding:14px 14px 12px;border:3px solid var(--line);border-radius:10px;background:var(--paper);text-align:left;cursor:grab;transition:transform 220ms ease,border-color 160ms ease,background 160ms ease;z-index:3;color:var(--text)}
    .gate strong{display:block;font:700 var(--fs-body)/1.2 var(--font-sans);margin-bottom:8px}.gate span{font:var(--fs-label)/1.35 var(--font-mono)}
    .gate[aria-pressed="true"]{border-color:var(--model);background:#fff;transform:translateX(34px)}
    .gate.dragging{border-color:var(--focus);cursor:grabbing;transition:none}.gate-a{left:30px;top:105px}.gate-b{left:30px;top:315px}
    .slot{position:absolute;left:254px;width:202px;height:118px;border:2px dashed var(--line-soft);border-radius:12px;display:flex;align-items:flex-end;justify-content:center;padding:8px;font:var(--fs-label)/1 var(--font-sans);color:var(--muted)}
    .slot-a{top:99px}.slot-b{top:309px}.slot.on{border-style:solid;border-color:var(--model)}
    .out{position:absolute;right:45px;top:230px;display:flex;align-items:center;justify-content:center;font:700 var(--fs-body)/1.1 var(--font-sans);background:var(--paper);border:3px solid var(--line)}
    .netline{fill:none;stroke:var(--line-soft);stroke-width:2}.netline.on{stroke:var(--model);stroke-width:5;stroke-dasharray:500;animation:draw .18s ease both}
    @keyframes draw{from{stroke-dashoffset:500}to{stroke-dashoffset:0}}
    .readout{position:absolute;right:28px;bottom:24px;width:235px;padding:16px;border-left:5px solid var(--model);background:var(--panel-bg)}
    .readout .big{display:block;margin-bottom:4px}.readout small{font:var(--fs-label)/1.3 var(--font-sans);color:var(--muted)}
    .foot{height:116px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:30px;border-top:2px solid var(--line-soft)}
    .feedback{font:var(--fs-body)/1.4 var(--font-sans)}.feedback strong{font-family:var(--font-serif);font-size:var(--fs-lead)}
    .next{display:block;margin-top:7px;color:var(--muted);font-size:var(--fs-sec)}
    .btn{min-width:132px}
    @media (prefers-reduced-motion:reduce){.gate,.region{transition:none}.netline.on{animation:none}}
</style>
</head>
<body data-page="16" data-total="21">
<div id="stage">
  <header class="head">
    <div><div class="kicker">HIDDEN FEATURES</div><h1>两个隐藏神经元，各守一块局部区域</h1></div>
    <div class="rule">输出规则：任一门打开 → 输出 <span class="num">1</span></div>
  </header>
  <main class="main split-lr k-process">
    <section class="board min0" aria-labelledby="map-title">
      <h2 class="section-title" id="map-title">分类现场｜预测随接入同步改变</h2>
      <svg viewBox="0 0 720 500" role="img" aria-label="异或四点坐标。左上和右下是目标一，另外两点目标零。">
        <rect id="regionA" class="region" x="70" y="35" width="285" height="205" rx="8"/>
        <rect id="regionB" class="region" x="365" y="250" width="285" height="205" rx="8"/>
        <line class="gridline" x1="70" y1="240" x2="650" y2="240"/><line class="gridline" x1="355" y1="35" x2="355" y2="455"/>
        <line class="axis" x1="70" y1="245" x2="665" y2="245"/><path d="M665 245l-12-7v14z" fill="var(--line)"/>
        <line class="axis" x1="360" y1="455" x2="360" y2="22"/><path d="M360 22l-7 12h14z" fill="var(--line)"/>
        <text x="672" y="250" class="pred">x₁</text><text x="368" y="24" class="pred">x₂</text>
        <g transform="translate(210 365)"><circle r="24" class="sample-dot"/><text text-anchor="middle" y="6" class="pred" id="pLL">预测 0</text><text text-anchor="middle" y="48" class="coord">(-1,-1) · 目标 0</text></g>
        <g transform="translate(210 135)"><circle r="24" class="sample-dot one"/><text text-anchor="middle" y="6" class="pred" id="pA">预测 0</text><text text-anchor="middle" y="48" class="coord">(-1,1) · 目标 1</text></g>
        <g transform="translate(510 365)"><circle r="24" class="sample-dot one"/><text text-anchor="middle" y="6" class="pred" id="pB">预测 0</text><text text-anchor="middle" y="48" class="coord">(1,-1) · 目标 1</text></g>
        <g transform="translate(510 135)"><circle r="24" class="sample-dot"/><text text-anchor="middle" y="6" class="pred" id="pRR">预测 0</text><text text-anchor="middle" y="48" class="coord">(1,1) · 目标 0</text></g>
      </svg>
    </section>
    <section class="network min0" id="network" aria-labelledby="net-title">
      <h2 class="section-title" id="net-title">把两道门接入输出层</h2>
      <svg viewBox="0 0 650 500" aria-hidden="true"><path id="lineA" class="netline" d="M205 105 C390 105 400 250 545 250"/><path id="lineB" class="netline" d="M205 335 C390 335 400 250 545 250"/></svg>
      <div id="slotA" class="slot slot-a">插槽 A</div><div id="slotB" class="slot slot-b">插槽 B</div>
      <button class="gate gate-a" id="gateA" aria-pressed="false"><strong>左上门</strong><span>x₁ &lt; 0 且 x₂ &gt; 0</span></button>
      <button class="gate gate-b" id="gateB" aria-pressed="false"><strong>右下门</strong><span>x₁ &gt; 0 且 x₂ &lt; 0</span></button>
      <div class="neuron out" aria-label="输出神经元">输出</div>
      <div class="readout"><span class="big num" id="score">已分对 2/4</span><small id="stateNote">两道门尚未接入</small></div>
    </section>
  </main>
  <footer class="foot">
    <div class="feedback" id="feedback" aria-live="polite">拖动门到插槽，或聚焦门后按 <span class="num">Enter</span>。接入顺序由你决定。<span class="next">一条新样本进入后，会怎样一站一站走到最终概率？</span></div>
    <button class="btn" id="reset">重置本页</button>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
  (()=>{
    const stage=document.getElementById('stage');
    const els={A:document.getElementById('gateA'),B:document.getElementById('gateB')};
    let drag=null, state;
    const makeInitialState=()=>({phase:'ready',turn:0,connected:{A:false,B:false},feedback:'拖动门到插槽，或聚焦门后按 Enter。接入顺序由你决定。'});
    function transition(s,a){
      if(a.type==='reset') return makeInitialState();
      if(a.type!=='toggle'||!['A','B'].includes(a.gate)) return {...s,feedback:'请选择一道门。'};
      const connected={...s.connected,[a.gate]:!s.connected[a.gate]};
      const count=Number(connected.A)+Number(connected.B);
      return {phase:count===2?'complete':'playing',turn:s.turn+1,connected,feedback:count===2?'两块分开的区域，被“任一门打开就算 1”合在了一起。':connected[a.gate]?`${a.gate==='A'?'左上':'右下'}区域已点亮；再接入另一道门。`:`${a.gate==='A'?'左上':'右下'}区域已关闭；可重新接入。`};
    }
    function render(action){
      const n=Number(state.connected.A)+Number(state.connected.B);
      ['A','B'].forEach(k=>{els[k].setAttribute('aria-pressed',state.connected[k]);document.getElementById('slot'+k).classList.toggle('on',state.connected[k]);document.getElementById('line'+k).classList.toggle('on',state.connected[k]);document.getElementById('region'+k).classList.toggle('on',state.connected[k])});
      document.getElementById('pA').textContent='预测 '+(state.connected.A?1:0);document.getElementById('pB').textContent='预测 '+(state.connected.B?1:0);
      document.getElementById('score').textContent=`已分对 ${2+n}/4`;document.getElementById('stateNote').textContent=n===0?'两道门尚未接入':n===1?'一道门已接入':'两道门共同接入';
      document.getElementById('feedback').innerHTML=(state.phase==='complete'?'<strong>输出层把两道门合并，就能得到一条直线无法圈出的分类区域。</strong><br>':'')+state.feedback+'<span class="next">一条新样本进入后，会怎样一站一站走到最终概率？</span>';
      stage.dispatchEvent(new CustomEvent('notale:learning-state',{bubbles:true,composed:true,detail:{action,phase:state.phase,turn:state.turn,complete:state.phase==='complete'}}));
    }
    function act(a){state=transition(state,a);render(a.type)}
    const ac=new AbortController(), sig={signal:ac.signal};
    Object.entries(els).forEach(([k,el])=>{
      el.addEventListener('click',e=>{if(!drag)act({type:'toggle',gate:k})},sig);
      el.addEventListener('pointerdown',e=>{drag={k,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};el.setPointerCapture(e.pointerId);el.classList.add('dragging')},sig);
      el.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=(e.clientX-drag.x)/Deck.s,dy=(e.clientY-drag.y)/Deck.s;drag.moved ||= Math.hypot(dx,dy)>5;el.style.translate=`${dx}px ${dy}px`},sig);
      el.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;el.classList.remove('dragging');el.style.translate='';const moved=drag.moved;drag=null;if(moved)act({type:'toggle',gate:k})},sig);
      el.addEventListener('pointercancel',()=>{el.classList.remove('dragging');el.style.translate='';drag=null},sig);
    });
    document.getElementById('reset').addEventListener('click',()=>{state=transition(state,{type:'reset'});render('reset');els.A.focus()},sig);
    function destroy(){drag=null;ac.abort()} window.addEventListener('pagehide',destroy,{once:true});
    state=makeInitialState();render('init');Deck.init({index:16,total:21});
  })();
</script>
</body>
</html>
