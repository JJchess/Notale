<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="18" data-total="21">
<div id="stage">
  <style>
    #stage{gap:14px}
    #stage .p18-head{height:102px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding-bottom:14px}
    #stage .p18-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.14em;color:var(--muted);margin-bottom:12px}
    #stage h1{font:700 var(--fs-h1)/1.18 var(--font-sans);margin:0;max-width:1130px}
    #p18-widget{flex:1;min-height:0;display:grid;grid-template-rows:400px minmax(0,1fr);gap:16px}
    #p18-widget .net{position:relative;background:rgba(255,255,255,.2);border-bottom:1px solid var(--line-soft);overflow:hidden}
    #p18-widget svg{display:block;width:100%;height:100%}
    #p18-widget .edge{fill:none;stroke:var(--line-soft);stroke-width:2}
    #p18-widget .edge.done{stroke:var(--model);stroke-width:3}
    #p18-widget .edge.active{stroke:var(--focus);stroke-width:5;stroke-dasharray:12 8;animation:p18flow .42s linear both}
    @keyframes p18flow{from{stroke-dashoffset:-80}to{stroke-dashoffset:0}}
    #p18-widget .node{fill:var(--paper);stroke:var(--line);stroke-width:2}
    #p18-widget .node.model{stroke:var(--model);stroke-width:4}
    #p18-widget .node.error{fill:url(#p18-stripe);stroke:var(--text);stroke-width:3}
    #p18-widget .nlabel{font:600 18px var(--font-sans);fill:var(--text);text-anchor:middle;dominant-baseline:middle}
    #p18-widget .nvalue{font:15px var(--font-mono);fill:var(--model);text-anchor:middle}
    #p18-widget .station{font:600 15px var(--font-sans);fill:var(--muted);text-anchor:middle}
    #p18-widget .snapshot{position:absolute;left:18px;top:14px;font:16px var(--font-sans);color:var(--muted)}
    #p18-widget .receipt{cursor:pointer;outline:none}
    #p18-widget .receipt rect.bg{fill:var(--panel-bg);stroke:var(--line-soft)}
    #p18-widget .receipt rect.bar{fill:var(--model);transform-box:fill-box;transform-origin:right center;animation:p18bar .28s ease-out both}
    #p18-widget .receipt.current rect.bg{stroke:var(--focus);stroke-width:4}
    #p18-widget .receipt text{font:700 14px var(--font-mono);fill:var(--text);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
    @keyframes p18bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    #p18-widget .lower{display:grid;grid-template-columns:310px minmax(0,1fr) 330px;gap:18px;min-height:0}
    #p18-widget .controls,#p18-widget .detail,#p18-widget .meaning{min-width:0;padding:20px 22px}
    #p18-widget .controls{display:flex;flex-direction:column;justify-content:center;gap:14px}
    #p18-widget .btn{width:100%;min-height:48px}
    #p18-widget .progress{font:600 16px var(--font-mono);color:var(--muted)}
    #p18-widget .status{min-height:20px;font:14px/1.35 var(--font-sans);color:var(--muted)}
    #p18-widget .detail{border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;justify-content:center}
    #p18-widget .eyebrow{font:600 var(--fs-label) var(--font-sans);color:var(--muted);margin-bottom:10px}
    #p18-widget .receipt-line{display:grid;grid-template-columns:180px 1fr 150px;align-items:center;gap:18px}
    #p18-widget .rname{font:700 23px var(--font-mono)}
    #p18-widget .meter{height:24px;background:var(--panel-bg);border:1px solid var(--line-soft);position:relative}
    #p18-widget .meter>i{display:block;height:100%;background:var(--model);width:100%}
    #p18-widget .rvalue{font:700 22px var(--font-mono)}
    #p18-widget .change-row{margin-top:14px}
    #p18-widget .meaning{display:flex;flex-direction:column;justify-content:center;font:18px/1.5 var(--font-serif)}
    #stage .p18-foot{height:78px;display:flex;align-items:center;justify-content:space-between;gap:40px;border-top:1px solid var(--line-soft)}
    #stage .take{font:600 19px/1.4 var(--font-serif);max-width:990px}
    #stage .next{font:16px/1.4 var(--font-sans);color:var(--muted);max-width:390px;text-align:right}
    @media(prefers-reduced-motion:reduce){#p18-widget .edge.active,#p18-widget .receipt rect.bar{animation:none}}
  </style>
  <header class="p18-head"><div><div class="p18-kicker">BACKWARD PASS</div><h1>误差从终点出发，把改动责任逐层送回每个参数</h1></div></header>
  <main id="p18-widget" class="split-tb min0" aria-label="反向传播责任追踪器">
    <section class="net min0"><div class="snapshot">这是同一次预测的回传快照　正确答案 <b>t = 0</b></div><svg viewBox="0 0 1488 400" role="img" aria-label="从误差端逐层向左回传责任的网络"><defs><pattern id="p18-stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="#202020"/><rect x="4" width="4" height="8" fill="#F4F1E8"/></pattern><marker id="p18-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="context-stroke"/></marker></defs><g data-layer="edges"></g><g data-layer="nodes"></g><g data-layer="receipts"></g></svg></section>
    <section class="lower min0"><div class="controls panel"><div class="progress" data-progress>站 1 / 4 · 输出端</div><button class="btn" data-next type="button">回传下一站</button><button class="btn" data-reset type="button">重置本页</button><div class="status" aria-live="polite" data-status>准备从误差端回传</div></div><div class="detail"><div class="eyebrow">参数责任收据 · 统一满尺度 0.800</div><div class="receipt-line"><span class="rname" data-name>当前误差</span><span class="meter"><i data-meter></i></span><span class="rvalue" data-value>1.609</span></div><div class="change-row" data-direction>收到责任 1.609 → 开始回传</div></div><div class="meaning"><div data-explain>点击“回传下一站”，沿原连接向左追踪。</div></div></section>
  </main>
  <footer class="p18-foot"><div class="take">反向传播不是把答案倒着播放，而是计算每个参数对当前误差影响多大、该增还是该减。</div><div class="next">下一问：当所有参数都收到建议并反复更新，分类边界会怎样变化？</div></footer>
  <script src="assets/lib/d3.min.js"></script>
  <script>
  (()=>{
    const root=document.querySelector('#p18-widget'); if(!root||!window.d3)return;
    const svg=d3.select(root).select('svg'), edges=svg.select('[data-layer="edges"]'), nodes=svg.select('[data-layer="nodes"]'), receipts=svg.select('[data-layer="receipts"]');
    const stations=['输出端','输出层参数','隐藏层','输入侧参数'];
    const data=[
      {id:'err',name:'当前误差',v:1.609,dir:'开始回传',step:0,x:1310,y:205},
      {id:'bout',name:'b_out',v:.8,dir:'建议减小',step:1,x:1080,y:64},{id:'v1',name:'v₁: h₁→ŷ',v:.64,dir:'建议减小',step:1,x:1075,y:276},{id:'v2',name:'v₂: h₂→ŷ',v:.16,dir:'建议减小',step:1,x:1075,y:336},
      {id:'h1r',name:'h₁ 收到的责任',v:.192,dir:'继续向左分配',step:2,x:650,y:64},{id:'h2r',name:'h₂ 收到的责任',v:.064,dir:'继续向左分配',step:2,x:650,y:336},
      {id:'w11',name:'w₁₁ / w₂₁',v:.192,sub:.096,dir:'建议减小',step:3,x:240,y:64},{id:'w12',name:'w₁₂ / w₂₂',v:.064,sub:.032,dir:'建议减小',step:3,x:240,y:336}
    ];
    const N=[{id:'x1',l:'x₁',v:'1.00',x:170,y:155},{id:'x2',l:'x₂',v:'0.50',x:170,y:285},{id:'h1',l:'h₁',v:'0.80',x:650,y:155},{id:'h2',l:'h₂',v:'0.20',x:650,y:285},{id:'y',l:'ŷ',v:'0.80',x:1030,y:220},{id:'e',l:'误差',v:'1.609',x:1310,y:220,error:true}];
    const E=[['x1','h1',3],['x2','h1',3],['x1','h2',3],['x2','h2',3],['h1','y',2],['h2','y',2],['y','e',1]];
    let state={step:0,selected:'err'},destroyed=false;
    const byId=id=>N.find(n=>n.id===id);
    nodes.selectAll('g').data(N).join('g').attr('transform',d=>`translate(${d.x},${d.y})`).each(function(d){const g=d3.select(this);g.append('circle').attr('r',36).attr('class',`node ${d.id==='y'?'model':''} ${d.error?'error':''}`);g.append('text').attr('class','nlabel').text(d.l);g.append('text').attr('class','nvalue').attr('y',58).text(d.v)});
    nodes.selectAll('.station').data([{x:170,t:'输入'},{x:650,t:'隐藏层'},{x:1030,t:'输出'},{x:1310,t:'误差端'}]).join('text').attr('class','station').attr('x',d=>d.x).attr('y',390).text(d=>d.t);
    function edgePath(a,b){const A=byId(a),B=byId(b);return `M${A.x+38},${A.y} L${B.x-40},${B.y}`}
    function select(id,announce=true){state.selected=id;render();const d=data.find(x=>x.id===id);if(announce)root.querySelector('[data-status]').textContent=`${d.name}，责任 ${d.sub?d.v.toFixed(3)+' 和 '+d.sub.toFixed(3):d.v.toFixed(3)}，${d.dir}`}
    function render(){
      edges.selectAll('path').data(E).join('path').attr('d',d=>edgePath(d[0],d[1])).attr('marker-end','url(#p18-arrow)').attr('class',d=>`edge ${state.step>d[2]?'done':state.step===d[2]?'active':''}`);
      const shown=data.filter(d=>d.step<=state.step);
      const r=receipts.selectAll('g').data(shown,d=>d.id).join(enter=>{const g=enter.append('g').attr('class','receipt').attr('tabindex',0).attr('role','button');g.append('rect').attr('class','bg').attr('x',-116).attr('y',-18).attr('width',232).attr('height',36).attr('rx',8);g.append('rect').attr('class','bar').attr('y',8).attr('height',6);g.append('text');return g});
      r.attr('transform',d=>`translate(${d.x},${d.y})`).attr('aria-label',d=>`${d.name}，责任 ${d.v.toFixed(3)}`).classed('current',d=>d.id===state.selected).on('click',(_,d)=>select(d.id)).on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();select(d.id)}});
      r.select('rect.bar').attr('x',d=>110-Math.max(8.8,220*Math.min(d.v,.8)/.8)).attr('width',d=>Math.max(8.8,220*Math.min(d.v,.8)/.8));r.select('text').text(d=>d.sub?`${d.name}  ${d.v.toFixed(3)} / ${d.sub.toFixed(3)}`:`${d.name}  ${d.v.toFixed(3)}`);
      const d=data.find(x=>x.id===state.selected)||data[0];root.querySelector('[data-name]').textContent=d.name;root.querySelector('[data-value]').textContent=d.sub?`${d.v.toFixed(3)} / ${d.sub.toFixed(3)}`:d.v.toFixed(3);root.querySelector('[data-meter]').style.width=`${Math.max(4,Math.min(100,d.v/.8*100))}%`;root.querySelector('[data-direction]').textContent=`收到责任 ${d.sub?d.v.toFixed(3)+' / '+d.sub.toFixed(3):d.v.toFixed(3)} → ${d.dir}`;root.querySelector('[data-explain]').textContent=state.step===0?'点击“回传下一站”，沿原连接向左追踪。':'责任越大，表示这个旋钮轻转一点，对当前误差的影响越强。';root.querySelector('[data-progress]').textContent=`站 ${state.step+1} / 4 · ${stations[state.step]}`;root.querySelector('[data-next]').textContent=state.step===3?'再看一次':'回传下一站';
    }
    function next(){if(state.step===3){state={step:0,selected:'err'}}else{state.step++;state.selected=data.find(d=>d.step===state.step).id}render();root.querySelector('[data-status]').textContent=`已到${stations[state.step]}`}
    function reset(){state={step:0,selected:'err'};render();root.querySelector('[data-status]').textContent='已重置到输出端误差'}
    const nextBtn=root.querySelector('[data-next]'),resetBtn=root.querySelector('[data-reset]');nextBtn.addEventListener('click',next);resetBtn.addEventListener('click',reset);render();
    root.destroyP18=()=>{if(destroyed)return;destroyed=true;nextBtn.removeEventListener('click',next);resetBtn.removeEventListener('click',reset);receipts.selectAll('*').on('.click',null).on('.keydown',null)};
  })();
  </script>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:18,total:21});</script>
</body>
</html>
