<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="20" data-total="21">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:18px;overflow:hidden}
    .p20-head{height:94px;flex:0 0 94px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--line);padding-bottom:15px}
    .p20-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.14em;color:var(--muted);margin-bottom:10px}
    .p20-head h1{font:700 var(--fs-h1)/1.15 var(--font-sans);margin:0;max-width:1050px}
    .p20-mark{font:700 var(--fs-label)/1 var(--font-mono);color:var(--muted);padding-bottom:6px}
    .p20-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
    .p20-question{height:84px;flex:0 0 84px;display:flex;align-items:center;justify-content:center;font:700 var(--fs-h2)/1.35 var(--font-sans);letter-spacing:.01em;border-left:5px solid var(--line);position:relative}
    .p20-question::after{content:"问题";position:absolute;left:22px;top:50%;transform:translateY(-50%);font:700 var(--fs-label)/1 var(--font-mono);color:var(--muted);letter-spacing:.12em}
    .p20-relationship{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;padding:22px 72px 0;background:var(--panel-bg);border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
    .p20-guides{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
    .p20-supports{height:215px;display:grid;grid-template-columns:repeat(3,1fr);gap:42px;position:relative;z-index:2}
    .p20-support{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--line);border-top-width:5px;border-radius:8px;background:var(--paper);position:relative}
    .p20-support strong{font:700 var(--fs-h2)/1.2 var(--font-sans);margin-bottom:14px}
    .p20-support span{font:500 var(--fs-body)/1.35 var(--font-sans);color:var(--muted)}
    .p20-mech{width:78%;height:54px;margin:12px 0 10px;position:relative;color:var(--line)}
    .p20-dir::before{content:"";position:absolute;left:8%;right:8%;top:25px;border-top:3px solid var(--line)}
    .p20-dir::after{content:"◀        ●        ▶";position:absolute;inset:10px 0 0;text-align:center;font:700 24px/1 var(--font-mono);letter-spacing:6px}
    .p20-step{display:flex;align-items:center;justify-content:center;gap:10px;font:700 var(--fs-body)/1 var(--font-mono)}
    .p20-step i{display:block;width:22px;height:22px;border-left:3px solid var(--line);border-right:3px solid var(--line)}
    .p20-resp::before{content:"输出";position:absolute;left:0;top:14px;font:700 var(--fs-label)/1 var(--font-mono)}
    .p20-resp::after{content:"←──┬──← 参数\A　　 └──← 参数";white-space:pre;position:absolute;left:58px;top:2px;font:700 var(--fs-label)/1.6 var(--font-mono)}
    .p20-support .num{position:absolute;top:16px;left:18px;font:700 var(--fs-label)/1 var(--font-mono);color:var(--muted)}
    .p20-support.back{border-top-style:dashed}
    .p20-support.back::before{content:"输出端 → 各参数";position:absolute;right:16px;top:15px;font:600 var(--fs-label)/1 var(--font-mono);color:var(--muted)}
    .p20-flow{position:absolute;left:72px;right:72px;top:212px;height:145px;width:calc(100% - 144px);z-index:1;overflow:visible}
    .p20-merge{height:76px;flex:0 0 76px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;font:700 var(--fs-lead)/1.2 var(--font-sans)}
    .p20-merge span{background:var(--paper);padding:0 18px}
    .p20-readout{height:118px;flex:0 0 118px;display:flex;align-items:center;justify-content:center;background:var(--paper);border:2px solid var(--line);border-radius:8px;position:relative}
    .p20-readout::before{content:"读数";position:absolute;left:24px;top:18px;font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--muted)}
    .p20-change{display:flex;align-items:center;gap:22px;font:700 28px/1 var(--font-mono)}
    .p20-change .all{font-family:var(--font-sans);font-size:var(--fs-h2)}
    .p20-change .before,.p20-change .after{padding:13px 24px;border:2px solid var(--line);border-radius:8px;background:var(--paper)}
    .p20-change .arrow{font-size:34px;color:var(--model)}
    .p20-next-step{height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:center;font:500 var(--fs-body)/1.35 var(--font-sans);color:var(--muted)}
    .p20-foot{height:86px;flex:0 0 86px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:48px;border-top:2px solid var(--line);padding-top:12px}
    .p20-claim{font:700 var(--fs-lead)/1.4 var(--font-serif)}
    .p20-next{font:600 var(--fs-sec)/1.35 var(--font-sans);color:var(--muted);white-space:nowrap}
  </style>

  <header class="p20-head">
    <div>
      <div class="p20-kicker">FULL TRAINING LOOP</div>
      <h1>一次完整学习，要把三种改动建议合到一起</h1>
    </div>
    <div class="p20-mark">学习动作合账</div>
  </header>

  <main class="p20-main min0 k-generalization ledger" aria-label="完整学习动作关系图">
    <section class="panel q p20-question">一次完整学习，怎样决定每个参数怎么改？</section>

    <section class="p20-relationship min0" aria-label="三项机制共同汇入一次更新">
      <svg class="p20-guides" viewBox="0 0 1488 500" preserveAspectRatio="none" aria-hidden="true">
        <g fill="none" stroke="#AAA69D" stroke-width="1" stroke-dasharray="3 10" opacity=".62">
          <path d="M0 55H1488 M0 110H1488 M0 165H1488 M0 220H1488 M0 275H1488 M0 330H1488 M0 385H1488 M0 440H1488"/>
          <path d="M372 0V500 M744 0V500 M1116 0V500"/>
        </g>
      </svg>
      <div class="p20-supports">
        <div class="p20-support min0"><b class="num">01</b><strong>误差给方向</strong><div class="p20-mech p20-dir" aria-hidden="true"></div><span>往哪边改</span></div>
        <div class="p20-support min0"><b class="num">02</b><strong>学习率定步长</strong><div class="p20-mech p20-step" aria-hidden="true"><i></i><b>一步</b><i></i></div><span>一次改多少</span></div>
        <div class="p20-support back min0"><b class="num">03</b><strong>反向传播分责任</strong><div class="p20-mech p20-resp" aria-hidden="true"></div><span>每个参数各改多少</span></div>
      </div>

      <svg class="p20-flow" viewBox="0 0 1344 145" aria-hidden="true">
        <defs><marker id="p20-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B4A46"/></marker></defs>
        <path d="M210 0 V68 H672" fill="none" stroke="#4B4A46" stroke-width="3"/>
        <path d="M672 0 V68" fill="none" stroke="#4B4A46" stroke-width="3"/>
        <path d="M1134 0 V68 H672 V130" fill="none" stroke="#4B4A46" stroke-width="3" marker-end="url(#p20-arrow)"/>
        <circle cx="672" cy="68" r="7" fill="#F4F1E8" stroke="#4B4A46" stroke-width="3"/>
      </svg>

      <div class="p20-merge"><span>三条建议合成一次更新</span></div>
      <div class="p20-readout">
        <div class="change-row p20-change"><span class="all">每个参数</span><span class="before">改前</span><span class="arrow">→</span><span class="after">改后</span></div>
      </div>
      <div class="p20-next-step">用新参数再预测，再量误差，再小改一步</div>
    </section>
  </main>

  <footer class="p20-foot">
    <div class="p20-claim">误差给方向，学习率定步长，反向传播把责任送到每个参数。</div>
    <div class="p20-next">下一问　当别人说“AI 学会了”，你还该追问什么？</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
