<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E4572E}
*{box-sizing:border-box}
#stage{position:relative;display:flex;flex-direction:column;overflow:hidden;padding:28px 56px;color:var(--text)}
.page{position:relative;isolation:isolate;flex:1;min-height:0;overflow:hidden;border:2px solid rgba(38,48,51,.62);border-radius:6px;background:#263033}
.backdrop{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:62% 50%;display:block}
.shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(12,24,27,.64) 0%,rgba(12,24,27,.40) 39%,rgba(12,24,27,.06) 62%,rgba(12,24,27,.12) 100%)}
.focus{height:100%;display:flex;align-items:flex-start;padding:76px 72px 64px}
.k-generalization{width:752px;display:flex;flex-direction:column;align-items:stretch;color:#f5f3ed}
#stage .k-generalization .supports{display:flex;flex-direction:row;gap:22px;position:relative}
#stage .k-generalization .support{width:calc(50% - 11px);flex:0 0 calc(50% - 11px)}
.claim{padding:32px 34px 30px;border-radius:6px;background:rgba(28,38,39,.86);box-shadow:0 0 0 1px rgba(246,244,238,.26)}
.kicker{margin:0 0 16px;color:#e0e4df;font-family:var(--font-mono);font-size:var(--fs-label);font-weight:700;letter-spacing:.12em;line-height:1.35}
h1{margin:0;color:#fffdf7;font-family:var(--font-serif);font-size:var(--fs-h1);font-weight:600;line-height:1.28;letter-spacing:.01em}
.trunk{width:2px;height:48px;margin:0 auto;background:rgba(245,243,237,.86);position:relative}
.trunk::after{content:"";position:absolute;left:-185px;bottom:0;width:372px;height:2px;background:rgba(245,243,237,.86)}
.supports{display:flex;gap:22px;position:relative}
.support{width:calc(50% - 11px);min-height:140px;padding:20px 22px 19px;border:2px solid rgba(245,243,237,.85);border-radius:6px;background:rgba(28,38,39,.83);display:flex;flex-direction:column;justify-content:center}
.support-label{margin:0 0 11px;color:#d9ded9;font-size:var(--fs-label);font-weight:700;letter-spacing:.08em;line-height:1.35}
.support-text{margin:0;color:#fffdf7;font-size:var(--fs-lead);font-weight:600;line-height:1.42}
.support-text span{white-space:nowrap}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
.concept{display:inline-block;padding:3px 7px;border:1px solid rgba(245,243,237,.52);border-radius:6px;color:#e4e8e3;font-size:var(--fs-label);line-height:1.35}
.path .concept{border-color:rgba(128,206,216,.72);color:#d1f0f2}
.trunk-label{position:absolute;left:13px;top:13px;white-space:nowrap;color:#e2e6e0;font-size:var(--fs-label);line-height:1.35}
.path .support-label{color:#c8edf1}
.inline-arrow{display:inline-block;vertical-align:middle;margin:0 7px 3px 5px;width:38px;height:12px;position:relative}
.inline-arrow::before{content:"";position:absolute;left:0;top:5px;width:31px;height:2px;background:var(--env)}
.inline-arrow::after{content:"";position:absolute;right:0;top:1px;width:9px;height:9px;border-top:2px solid var(--env);border-right:2px solid var(--env);transform:rotate(45deg)}
.closing{margin:25px 4px 0;color:#f8f6ef;font-size:var(--fs-body);font-weight:600;line-height:1.45;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.next{margin:13px 4px 0;color:#e3e6e0;font-size:var(--fs-sec);line-height:1.45}
.backdrop-note{position:absolute;right:20px;bottom:16px;margin:0;color:rgba(255,255,255,.84);font-size:var(--fs-label);line-height:1.35;text-shadow:0 1px 2px #111;letter-spacing:.02em}
</style>
</head>
<body data-page="01" data-total="21">
<div id="stage">
  <main class="page min0" aria-labelledby="page-title">
    <img class="backdrop" src="assets/img/typhoon-himawari-satellite.jpg" title="Himawari-9 2026-07-05 0230z RGB.png · This image was produced by the Japan Meteorological Agency. The legal notice stated, unless otherwise noted, images publ · CC BY 4.0" alt="向右侧海面延展的台风卫星云图，台风眼与螺旋云带清晰可见。">
    <div class="shade" aria-hidden="true"></div>
    <section class="focus min0" aria-label="核心判断">
      <div class="k-generalization min0">
        <header class="claim">
          <p class="kicker">OPENING QUESTION</p>
          <h1 id="page-title"><span>暖海面给台风能量，</span><br><span>变化的气流让它转弯</span></h1>
        </header>
        <div class="trunk" aria-hidden="true"><span class="trunk-label">两种判断</span></div>
        <div class="supports min0">
          <article class="support">
            <p class="support-label">强弱看什么？</p>
            <div class="tags" aria-label="能量条件关键词"><span class="concept">暖海面</span><span class="concept">能量</span><span class="concept">强弱</span></div>
            <p class="support-text"><span>暖海面</span> → <span>提供能量条件</span></p>
          </article>
          <article class="support path">
            <p class="support-label">路径看什么？</p>
            <div class="tags" aria-label="路径方向关键词"><span class="concept">大尺度</span><span class="concept">气流</span><span class="concept">路径</span></div>
            <p class="support-text"><span>气流变化</span><span class="inline-arrow" aria-hidden="true"></span><span>改变路径</span></p>
          </article>
        </div>
        <p class="closing">强弱看能量条件，路径看大尺度气流。</p>
        <p class="next">如果只知道台风的出发点，你会把未来路径画向哪里？</p>
      </div>
    </section>
    <p class="backdrop-note">Himawari-9 · JMA · 2026-07-05 02:30 UTC</p>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>Deck.init({index:1,total:21});</script>
</body>
</html>
