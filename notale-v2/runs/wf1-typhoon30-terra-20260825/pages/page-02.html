<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E4572E;--env:#176B78;--line:#7A8280;--panel:#E8E6DE;--muted:#626967}
*{box-sizing:border-box} body{margin:0;background:var(--bg)}
#stage{height:900px;padding:28px 56px;display:flex;flex-direction:column;gap:0;color:var(--text);font-family:var(--font-sans);overflow:hidden}
.top{height:144px;display:flex;align-items:flex-start;border-bottom:2px solid var(--text);padding:3px 0 18px;gap:34px;flex:none}
.kicker{font:700 15px/1.2 var(--font-mono,monospace);letter-spacing:1.6px;color:var(--env);padding-top:9px;min-width:180px}.title-wrap{min-width:0}.title-wrap h1{margin:0;font-family:var(--font-serif,serif);font-size:34px;line-height:1.2;font-weight:700;letter-spacing:.01em}.title-wrap p{margin:11px 0 0;font-size:18px;line-height:1.42;color:var(--muted)}
.compare{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:20px}.compare-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:20px}.compare-top h2{font-size:22px;line-height:1.2;margin:0;font-weight:700}.hint{margin:0;font-size:15px;line-height:1.35;color:var(--muted)}.hint b{color:var(--accent);font-weight:700}
.k-comparison{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:18px;position:relative}.k-comparison:before{content:"同一出发点 · 北向朝上 · 同一尺度";position:absolute;left:0;top:5px;font:600 13px/1 var(--font-mono,monospace);letter-spacing:.5px;color:var(--muted);z-index:2}
.path-cell{min-width:0;min-height:0;height:100%;padding-top:39px;display:flex;flex-direction:column;border-top:1px solid var(--line)}.hdr{height:32px;display:flex;align-items:flex-start;gap:9px;font-size:18px;line-height:1.3;font-weight:700}.cell-num{font:600 13px/22px var(--font-mono,monospace);color:var(--muted);border:1px solid var(--line);border-radius:12px;width:23px;text-align:center;flex:none}.path-cell.you .cell-num{border-color:var(--accent);color:var(--accent)}
.cvbox{position:relative;overflow:hidden;border:2px solid var(--line);border-radius:6px;background:#eeece4;flex:1;min-height:0}.path-cell.you .cvbox{border-color:var(--accent);box-shadow:inset 0 0 0 1px rgba(228,87,46,.1)}.cvbox:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.north{position:absolute;z-index:3;top:11px;left:14px;font:700 15px/1 var(--font-mono,monospace);color:var(--text);pointer-events:none}.north span{font-size:22px;vertical-align:-2px;margin-left:2px}.origin-label{position:absolute;z-index:3;bottom:13px;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;text-align:center;background:rgba(243,241,234,.93);padding:5px 8px;border-radius:3px;font-size:15px;line-height:1.25;color:var(--muted);pointer-events:none}.you .origin-label{color:var(--accent);font-weight:700}.path-note{min-height:47px;margin:10px 0 0;padding:0 4px;font-size:16px;line-height:1.38;color:var(--muted)}.path-note strong{color:var(--env);font-weight:700}.is-hidden{visibility:hidden}
.bottom{height:126px;border-top:2px solid var(--text);padding-top:17px;display:flex;align-items:flex-start;gap:28px;flex:none}.conclusion{flex:1;min-width:0}.conclusion p{margin:0;font-size:20px;line-height:1.4;font-weight:700}.conclusion .next{margin-top:8px;font-size:16px;font-weight:400;color:var(--muted)}.feedback{width:420px;min-height:70px;background:var(--panel);border-left:5px solid var(--accent);padding:10px 14px;font-size:16px;line-height:1.38;color:var(--text)}.feedback .state{font:700 13px/1.1 var(--font-mono,monospace);letter-spacing:.8px;color:var(--accent);display:block;margin-bottom:5px}.btn{border:2px solid var(--text);border-radius:5px;background:transparent;color:var(--text);font:700 16px/1 var(--font-sans);padding:12px 17px;cursor:pointer;white-space:nowrap}.btn:hover{background:var(--panel)}.btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.btn[disabled]{opacity:.45;cursor:not-allowed}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body data-page="02" data-total="21">
<div id="stage">
  <header class="top">
    <div class="kicker">PREDICT FIRST</div>
    <div class="title-wrap"><h1>从同一点出发，你会把台风画向哪里？</h1><p>先凭直觉画一笔。四张草图会从相同的台风中心出发，方便只比较<strong>方向</strong>。</p></div>
  </header>
  <main class="compare min0" aria-labelledby="compare-title">
    <div class="compare-top"><h2 id="compare-title">把路径画在第一格</h2><p class="hint"><b>拖动</b> 台风中心开始画；或聚焦第一格，用方向键 / 数字小键盘逐段延长。</p></div>
    <section class="k-comparison" aria-label="四种同起点的台风路径草图">
      <article class="path-cell you min0"><div class="hdr"><span class="cell-num">01</span><span>你的预判</span></div><div id="drawbox" class="cvbox no-pan" tabindex="0" role="application" aria-label="你的预判路径画布。从台风中心拖动画线；也可用方向键或数字小键盘画线，退格撤销一段，回车完成。"><span class="north">北 <span>↑</span></span><span id="originPrompt" class="origin-label">从台风中心开始画</span></div><p class="path-note" id="yourNote">尚未画出方向</p></article>
      <article class="path-cell min0"><div class="hdr"><span class="cell-num">02</span><span>直行</span></div><div id="ref1" class="cvbox" aria-label="直行路径示意"><span class="north">北 <span>↑</span></span></div><p class="path-note is-hidden" id="note1"><strong>方向基本不变</strong></p></article>
      <article class="path-cell min0"><div class="hdr"><span class="cell-num">03</span><span>西偏</span></div><div id="ref2" class="cvbox" aria-label="西偏路径示意"><span class="north">北 <span>↑</span></span></div><p class="path-note is-hidden" id="note2"><strong>持续偏向西侧</strong></p></article>
      <article class="path-cell min0"><div class="hdr"><span class="cell-num">04</span><span>转弯</span></div><div id="ref3" class="cvbox" aria-label="转弯路径示意"><span class="north">北 <span>↑</span></span></div><p class="path-note is-hidden" id="note3"><strong>先偏西，随后转向</strong></p></article>
    </section>
  </main>
  <footer class="bottom">
    <div class="conclusion"><p id="conclusion">同一个起点可以画出完全不同的路径——我们还没有说明“谁在掌舵”。</p><p class="next">要解释一条台风路径，哪些问题必须先分开？</p></div>
    <div id="feedback" class="feedback" aria-live="polite"><span class="state">等待你的第一笔</span>从橙色台风中心开始。画完第一笔，三种不同预判会同时出现。</div>
    <button id="resetBtn" class="btn" type="button" disabled>撤销重画</button>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script>
(function(){
  'use strict';
  Deck.init({index:2,total:21});
  const els={draw:document.getElementById('drawbox'), prompt:document.getElementById('originPrompt'), yourNote:document.getElementById('yourNote'), reset:document.getElementById('resetBtn'), feedback:document.getElementById('feedback'), notes:[document.getElementById('note1'),document.getElementById('note2'),document.getElementById('note3')]};
  const refs=[{id:'ref1',pts:[[50,82],[50,68],[50,54],[50,40],[50,26]]},{id:'ref2',pts:[[50,82],[45,69],[39,57],[32,46],[24,37]]},{id:'ref3',pts:[[50,82],[45,69],[43,56],[47,44],[57,34],[70,28]]}];
  const state=()=>({points:[],revealed:false,drawing:false,keyboard:false});
  let model=state(), scenes=[], resizeObs=null;
  const colors={accent:Deck.token('--accent'),env:Deck.token('--env'),line:Deck.token('--line'),text:Deck.token('--text')};
  function pointXY(p,w,h){return [p[0]*w/100,p[1]*h/100]}
  function flat(points,w,h){return points.flatMap(p=>pointXY(p,w,h))}
  function spiral(cx,cy,r){let a=[];for(let t=0;t<=Math.PI*4.2;t+=.22){let q=r*(1-t/(Math.PI*5.1));a.push(cx+Math.cos(t)*q,cy+Math.sin(t)*q)}return a}
  function makeScene(el, kind, preset){
    const stage=new Konva.Stage({container:el,width:Math.max(1,el.clientWidth),height:Math.max(1,el.clientHeight)});
    const layer=new Konva.Layer();stage.add(layer);
    const grid=new Konva.Group(), paths=new Konva.Group();layer.add(grid);layer.add(paths);
    const scene={stage,layer,grid,paths,kind,preset,line:null}; scenes.push(scene); return scene;
  }
  function drawScene(sc){
    const w=sc.stage.width(),h=sc.stage.height(), x=w*.5,y=h*.82;
    sc.grid.destroyChildren();sc.paths.destroyChildren();
    [25,50,75].forEach(v=>{sc.grid.add(new Konva.Line({points:[v*w/100,14,v*w/100,h-14],stroke:colors.line,strokeWidth:1,opacity:.14,dash:[3,7]}));});
    [28,55].forEach(v=>{sc.grid.add(new Konva.Line({points:[14,v*h/100,w-14,v*h/100],stroke:colors.line,strokeWidth:1,opacity:.14,dash:[3,7]}));});
    sc.grid.add(new Konva.Circle({x,y,radius:18,stroke:colors.text,strokeWidth:1.5,opacity:.8}));
    sc.grid.add(new Konva.Line({points:spiral(x,y,13),stroke:colors.text,strokeWidth:2,lineCap:'round',lineJoin:'round'}));
    if(sc.kind==='user' && model.points.length){sc.line=new Konva.Line({points:flat(model.points,w,h),stroke:colors.accent,strokeWidth:5,lineCap:'round',lineJoin:'round',tension:.16});sc.paths.add(sc.line)}
    if(sc.kind==='ref' && model.revealed){sc.paths.add(new Konva.Line({points:flat(sc.preset,w,h),stroke:colors.env,strokeWidth:5,lineCap:'round',lineJoin:'round',tension:.18}));}
    sc.layer.batchDraw();
  }
  function render(){
    scenes.forEach(drawScene);
    const active=model.points.length>0;
    els.prompt.classList.toggle('is-hidden',active); els.reset.disabled=!active;
    els.yourNote.textContent=active ? (model.keyboard?'键盘逐段绘制中':'已画出一条预判路径') : '尚未画出方向';
    els.notes.forEach(n=>n.classList.toggle('is-hidden',!model.revealed));
    if(!active){els.feedback.innerHTML='<span class="state">等待你的第一笔</span>从橙色台风中心开始。画完第一笔，三种不同预判会同时出现。';}
    else if(model.keyboard){els.feedback.innerHTML='<span class="state">键盘绘制</span>方向键画四向；数字小键盘 1–9（除 5）画斜向。退格撤销一段，回车完成。';}
    else {els.feedback.innerHTML='<span class="state">对照已出现</span>相同起点，路径却能直行、西偏或转弯。这里还不能从一笔画判断原因。';}
  }
  function reveal(){if(!model.revealed)model.revealed=true;}
  function startAt(pt,keyboard){model.points=[pt];model.keyboard=!!keyboard;model.drawing=!keyboard;reveal();render();}
  function addPoint(pt){if(!model.points.length)return;const last=model.points[model.points.length-1];if(Math.hypot(pt[0]-last[0],pt[1]-last[1])<4)return;if(model.points.length>=120)return;model.points.push(pt);render();}
  function pointerPoint(){const sc=scenes[0], p=sc.stage.getPointerPosition();if(!p)return null;return [p.x/sc.stage.width()*100,p.y/sc.stage.height()*100]}
  function beginPointer(){const p=pointerPoint();if(!p)return;if(Math.hypot(p[0]-50,p[1]-82)>(24/scenes[0].stage.width()*100)){els.feedback.innerHTML='<span class="state">从中心开始</span>请从台风螺旋中心 24 px 范围内落笔。';return;}startAt(p,false);}
  function endPointer(){if(model.drawing){model.drawing=false;render();}}
  function keydown(e){const keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],'7':[-1,-1],'8':[0,-1],'9':[1,-1],'4':[-1,0],'6':[1,0],'1':[-1,1],'2':[0,1],'3':[1,1]};
    if(e.key==='Backspace'){if(model.points.length){e.preventDefault();e.stopPropagation();model.points.pop();if(!model.points.length)model=state();render();}return;}
    if(e.key==='Enter'&&model.points.length){e.preventDefault();e.stopPropagation();model.keyboard=false;render();return;}
    if(!keys[e.key])return;e.preventDefault();e.stopPropagation();
    if(!model.points.length){startAt([50,82],true);return;}
    const d=keys[e.key],last=model.points[model.points.length-1], next=[Math.max(4,Math.min(96,last[0]+d[0]*5)),Math.max(4,Math.min(96,last[1]+d[1]*5))];model.keyboard=true;addPoint(next);
  }
  function reset(){model=state();render();els.draw.focus();els.feedback.innerHTML='<span class="state">已重画</span>回到相同起点；从台风中心开始画一笔。';}
  function setup(){
    scenes=[];const user=makeScene(els.draw,'user');refs.forEach(r=>makeScene(document.getElementById(r.id),'ref',r.pts));
    user.stage.on('pointerdown',beginPointer);user.stage.on('pointermove',()=>{if(model.drawing){const p=pointerPoint();if(p)addPoint(p);}});user.stage.on('pointerup pointerleave pointercancel',endPointer);
    els.draw.addEventListener('keydown',keydown);els.reset.addEventListener('click',reset);
    resizeObs=new ResizeObserver(()=>{scenes.forEach(sc=>{const el=sc.stage.container(),w=Math.max(1,el.clientWidth),h=Math.max(1,el.clientHeight);if(sc.stage.width()!==w||sc.stage.height()!==h){sc.stage.size({width:w,height:h});}});render();});
    [els.draw,...refs.map(r=>document.getElementById(r.id))].forEach(el=>resizeObs.observe(el));render();
  }
  setup();
  window.addEventListener('pagehide',()=>{if(resizeObs)resizeObs.disconnect();scenes.forEach(s=>s.stage.destroy());scenes=[];},{once:true});
}());
</script>
</body>
</html>
