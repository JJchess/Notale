<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E4572E;}
*{box-sizing:border-box} body{margin:0} #stage{height:900px;padding:28px 56px;display:flex;flex-direction:column;overflow:hidden}
.page{height:100%;display:flex;flex-direction:column;gap:16px}.mast{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--text);padding-bottom:14px}.kicker{font:700 var(--fs-label) var(--font-mono);letter-spacing:.13em;color:var(--env)}h1{font:700 var(--fs-h1) var(--font-serif);line-height:1.2;margin:5px 0 0}.progress-note{font:var(--fs-label) var(--font-sans);color:var(--muted);max-width:295px;line-height:1.45;text-align:right}
.workspace{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}.instruction{display:flex;align-items:center;justify-content:space-between;gap:22px}.lead{margin:0;max-width:860px;font:var(--fs-lead) var(--font-sans);line-height:1.42}.hint{font:var(--fs-label) var(--font-sans);color:var(--muted);padding:8px 12px;border-left:3px solid var(--env);background:rgba(23,107,120,.07);white-space:nowrap}
.pool-row{display:flex;align-items:flex-start;gap:18px;border-top:1px solid var(--line);padding:12px;border-radius:6px;background:var(--panel)}.pool-label{width:112px;flex:0 0 112px;padding-top:11px;font:700 var(--fs-label) var(--font-sans)}.pool{min-height:70px;flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;padding:2px;border:1px dashed transparent;border-radius:6px}.pool.is-over{border-color:var(--env);background:rgba(23,107,120,.08)}
.bt{appearance:none;background:var(--panel);border:2px solid var(--text);border-radius:6px;color:var(--text);font:700 var(--fs-body) var(--font-sans);line-height:1.25;text-align:left;padding:10px 14px;cursor:grab;min-height:52px;touch-action:none;transition:transform 160ms ease,border-color 160ms ease,background 160ms ease}.bt:focus-visible,.cat-btn:focus-visible,.reset:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.bt.is-selected{border-color:var(--focus);box-shadow:inset 0 0 0 2px var(--focus)}.bt.is-dragging{opacity:.82;cursor:grabbing;z-index:3;transition:none}.bt.is-placed{font-size:var(--fs-sec);width:100%;padding:9px 11px}.bt .card-state{display:block;margin-top:5px;font:var(--fs-label) var(--font-sans);color:var(--muted)}.bt.error{border-color:var(--focus);animation:shake 220ms linear 1}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.triptych{flex:1;min-height:0;display:flex;gap:18px;align-items:stretch}.column{flex:1;min-width:0;display:flex;flex-direction:column;border-top:5px solid var(--text);padding-top:10px}.lv{font:700 var(--fs-h2) var(--font-sans);line-height:1.2}.column:nth-child(3){border-top-style:dashed}.box{flex:1;min-height:196px;margin-top:10px;padding:12px;border:2px solid var(--line);border-radius:6px;display:flex;flex-direction:column;gap:9px;background:var(--panel);transition:border-color 160ms ease,background 160ms ease}.box.is-over{border-color:var(--env);background:rgba(23,107,120,.08)}.box.complete-empty{border-color:var(--focus);border-style:solid}.zone-guide{border-bottom:1px solid var(--line);padding-bottom:9px}.guide-label{font:700 var(--fs-label) var(--font-sans);letter-spacing:.08em;color:var(--env)}.guide-question{margin:4px 0 0;font:var(--fs-sec) var(--font-sans);line-height:1.4}.criterion{display:flex;gap:8px;padding:6px 0;border-top:1px solid rgba(122,130,128,.45);font:var(--fs-label) var(--font-sans);line-height:1.35}.criterion span{width:58px;flex:0 0 58px;color:var(--muted)}.criterion b{font-weight:700}.slots{display:flex;gap:8px;padding-top:4px;min-height:92px}.slot{flex:1;min-height:88px;border:1px dashed var(--line);border-radius:4px;padding:11px;color:var(--muted);background:rgba(243,241,234,.72);font:var(--fs-label) var(--font-sans);line-height:1.35}.slot b{display:block;color:var(--text);font-weight:700}.box:has(.is-placed) .slots,.box:has(.is-placed) .guide-question,.box:has(.is-placed) .criterion{display:none}.cause{display:block;margin-top:4px;font:var(--fs-label) var(--font-sans);line-height:1.35;color:var(--muted)}.column-footer{min-height:48px;padding-top:9px;font:var(--fs-sec) var(--font-sans);line-height:1.4}.column-footer strong{color:var(--text)}
.controls{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:10px 12px;border-radius:6px;background:var(--panel)}.controls-label{font:700 var(--fs-label) var(--font-sans);margin-right:4px}.cat-btn,.reset{appearance:none;border:2px solid var(--text);border-radius:6px;background:transparent;color:var(--text);font:700 var(--fs-label) var(--font-sans);padding:9px 14px;cursor:pointer;min-height:40px}.cat-btn:hover{border-color:var(--env);color:var(--env)}.reset{margin-left:auto;border-color:var(--focus);color:var(--focus)}.reset[hidden]{display:none}.feedback{min-height:25px;font:var(--fs-sec) var(--font-sans);line-height:1.4;color:var(--muted)}.feedback strong{color:var(--focus)}.completion{display:none;border-left:4px solid var(--focus);padding:7px 14px;font:var(--fs-body) var(--font-sans);line-height:1.4}.completion.show{display:block}.next{font:var(--fs-sec) var(--font-sans);color:var(--muted);text-align:right}.next b{color:var(--text)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body data-page="08" data-total="21">
<div id="stage">
<main class="page" aria-labelledby="title">
  <header class="mast"><div><div class="kicker">CAUSE SORT</div><h1 id="title">暖海能供能，却不能替台风决定方向</h1></div><div class="progress-note">把条件放进它真正影响的那一栏。<br>注意：有一栏会保持空置。</div></header>
  <section class="workspace" aria-label="条件分类器">
    <div class="instruction"><p class="lead">把四张条件卡归类。它们影响台风<strong>能否维持结构</strong>，还是直接决定<strong>往哪里走</strong>？</p><div class="hint">拖入栏位；或先选卡，再按类别按钮</div></div>
    <div class="pool-row"><div class="pool-label">待分类的条件</div><div id="pool" class="pool" aria-label="待分类卡池" role="list"></div></div>
    <div class="triptych k-classification" aria-label="三个归属区">
      <section class="column min0"><div class="lv">能量条件</div><div class="box" data-zone="energy" role="list" aria-label="能量条件归属区"></div><div id="foot-energy" class="column-footer">帮助维持或增强</div></section>
      <section class="column min0"><div class="lv">限制条件</div><div class="box" data-zone="limit" role="list" aria-label="限制条件归属区"></div><div id="foot-limit" class="column-footer">妨碍能量组织成台风结构</div></section>
      <section class="column min0"><div class="lv">路径方向</div><div class="box" data-zone="direction" role="list" aria-label="路径方向归属区"></div><div id="foot-direction" class="column-footer">直接决定往哪里走？</div></section>
    </div>
    <div class="controls" aria-label="键盘分类按钮"><span class="controls-label">选中卡后放入：</span><button class="cat-btn" data-target="energy">能量条件</button><button class="cat-btn" data-target="limit">限制条件</button><button class="cat-btn" data-target="direction">路径方向</button><button id="reset" class="reset" hidden>重新分类</button></div>
    <div id="feedback" class="feedback" aria-live="polite">先选一张卡，或把它拖到你认为合适的栏位。</div>
    <div id="completion" class="completion">暖海、深暖层是能量条件；强风切变、登陆是限制条件；它们都不直接等于路径方向。</div>
    <div class="next"><b>下一问：</b>那么，真正推动台风中心移动的量是什么？</div>
  </section>
</main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(()=>{
  Deck.init({index:8,total:21});
  const cards=[
    {id:'warm',label:'较暖海面',target:'energy',cause:'可增大海气能量与水汽交换潜力'},
    {id:'deep',label:'较深暖水层',target:'energy',cause:'搅拌后较不易迅速抽出冷水'},
    {id:'shear',label:'较强垂直风切变',target:'limit',cause:'使台风上下结构较难保持对齐'},
    {id:'land',label:'台风中心进入陆地',target:'limit',cause:'海洋供能中断，地表摩擦增大'}
  ];
  const initial=()=>({placed:{},selected:null,feedback:'先选一张卡，或把它拖到你认为合适的栏位。',error:null,complete:false});
  let state=initial(), drag=null, timers=[];
  const $=s=>document.querySelector(s), pool=$('#pool'), feedback=$('#feedback'), completion=$('#completion'), reset=$('#reset');
  const zoneEl=t=>document.querySelector('[data-zone="'+t+'"]');
  const clearTimers=()=>{timers.forEach(clearTimeout);timers=[]};
  function placedIn(t){return cards.filter(c=>state.placed[c.id]===t)}
  function updateFooters(){
    $('#foot-energy').textContent=placedIn('energy').length===2?'2 张：提供或保存海洋能量':'帮助维持或增强';
    $('#foot-limit').textContent=placedIn('limit').length===2?'2 张：削弱供能或破坏结构':'妨碍能量组织成台风结构';
    $('#foot-direction').textContent=state.complete?'0 张：本页四项都不是方向盘':'直接决定往哪里走？';
  }
  function makeCard(c,where){
    const b=document.createElement('button'); b.type='button';b.className='bt'+(where?' is-placed':'')+(state.selected===c.id?' is-selected':'');b.dataset.id=c.id;b.setAttribute('role','listitem');
    b.innerHTML=where?c.label+'<span class="cause">'+c.cause+'</span><span class="card-state">已归类 · 点击取回</span>':c.label;
    b.setAttribute('aria-label',where?c.label+'，已归类为'+(where==='energy'?'能量条件':'限制条件')+'，点击取回卡池':c.label+'，点击选中后可用类别按钮归类');
    b.addEventListener('click',()=>{ if(drag&&drag.moved)return; if(where){takeBack(c.id);return} state.selected=state.selected===c.id?null:c.id; state.feedback=state.selected?'已选中“'+c.label+'”。现在选择一个类别。':'已取消选择。';render(); });
    b.addEventListener('pointerdown',e=>beginDrag(e,c.id)); return b;
  }
  function render(){
    pool.innerHTML=''; ['energy','limit','direction'].forEach(t=>{const z=zoneEl(t);z.innerHTML='';const guide=document.createElement('div');guide.className='zone-guide';const prompts={energy:['供能线索','它会不会增加或保存海洋提供的热量与水汽？'],limit:['限制线索','它会不会削弱供能，或让台风结构难以对齐？'],direction:['方向线索','它是否直接回答：中心应该往哪一个方向走？']}[t];const lenses={energy:[['观察','海面与上层海水'],['判断','能量能否补给'],['归入','利于维持或增强']],limit:[['观察','结构与下垫面'],['判断','供能或组织会否受阻'],['归入','不利于维持']],direction:[['观察','台风中心'],['判断','会向哪里平移'],['归入','只收直接方向条件']]}[t];guide.innerHTML='<div class="guide-label">'+prompts[0]+'</div><p class="guide-question">'+prompts[1]+'</p>'+lenses.map(x=>'<div class="criterion"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'<div class="slots"><div class="slot"><b>归属位 01</b>等待条件卡</div><div class="slot"><b>归属位 02</b>等待条件卡</div></div>';z.appendChild(guide)});
    cards.forEach(c=>{const where=state.placed[c.id];(where?zoneEl(where):pool).appendChild(makeCard(c,where));});
    feedback.innerHTML=state.feedback; completion.classList.toggle('show',state.complete); reset.hidden=!state.complete; zoneEl('direction').classList.toggle('complete-empty',state.complete); updateFooters();
  }
  function takeBack(id){clearTimers();delete state.placed[id];state.selected=id;state.complete=false;state.feedback='“'+cards.find(c=>c.id===id).label+'”已回到卡池，可重新归类。';render()}
  function place(id,target){
    const c=cards.find(x=>x.id===id);if(!c)return;
    if(target!==c.target){state.error=id;state.selected=null;state.feedback='<strong>再想想：</strong>它影响的是供能或结构，不是这一类。';render();
      const b=document.querySelector('[data-id="'+id+'"]');if(b)b.classList.add('error');
      timers.push(setTimeout(()=>{state.error=null;state.feedback='卡片已回到卡池。换一个归属区试试。';render()},500));return;
    }
    state.placed[id]=target;state.selected=null;const n=Object.keys(state.placed).length;state.complete=n===cards.length;state.feedback='✓ “'+c.label+'”归入'+(target==='energy'?'能量条件':'限制条件')+'：'+c.cause+'。';render();
  }
  function beginDrag(e,id){if(e.button!==undefined&&e.button!==0)return;clearTimers();const card=e.currentTarget;drag={id,card,startX:e.clientX,startY:e.clientY,moved:false};card.setPointerCapture(e.pointerId);card.classList.add('is-dragging');
    const move=ev=>{if(!drag)return;const dx=ev.clientX-drag.startX,dy=ev.clientY-drag.startY;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;card.style.transform='translate('+dx+'px,'+dy+'px)';document.querySelectorAll('.box,.pool').forEach(z=>z.classList.remove('is-over'));const hit=document.elementFromPoint(ev.clientX,ev.clientY);const z=hit&&hit.closest('[data-zone],#pool');if(z)z.classList.add('is-over')};
    const end=ev=>{if(!drag)return;document.querySelectorAll('.box,.pool').forEach(z=>z.classList.remove('is-over'));card.classList.remove('is-dragging');card.style.transform='';const hit=document.elementFromPoint(ev.clientX,ev.clientY);const z=hit&&hit.closest('[data-zone],#pool');const was=drag;drag=null;if(!was.moved)return;if(z&&z.id==='pool'){takeBack(id)}else if(z&&z.dataset.zone){place(id,z.dataset.zone)}else{state.feedback='把卡拖进一个归属区，或拖回卡池。';render()}};
    card.addEventListener('pointermove',move,{once:false});card.addEventListener('pointerup',end,{once:true});card.addEventListener('pointercancel',end,{once:true});
  }
  document.querySelectorAll('.cat-btn').forEach(b=>b.addEventListener('click',()=>{if(!state.selected){state.feedback='请先从卡池选中一张卡。';render();return}place(state.selected,b.dataset.target)}));
  reset.addEventListener('click',()=>{clearTimers();state=initial();state.feedback='已恢复固定初始卡序。先选一张卡，或把它拖到栏位。';render();pool.querySelector('button')?.focus()});
  const cleanup=()=>{clearTimers();drag=null};window.addEventListener('pagehide',cleanup,{once:true});render();
})();
</script>
</body>
</html>
