<html lang="zh">
<head>
<meta charset="utf-8">

<body data-page="09" data-total="21">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;overflow:hidden}
    .p09-head{flex:0 0 112px;border-bottom:2px solid var(--line);display:flex;align-items:flex-end;padding:0 0 20px;gap:28px}
    .p09-kicker{font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.13em;color:var(--accent);padding-bottom:5px;white-space:nowrap}
    .p09-head h1{margin:0;font:500 var(--fs-h1)/1.2 var(--font-serif);letter-spacing:.01em;color:var(--text)}
    .p09-main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:30px 0 20px}
    .p09-focus{width:1160px;height:100%;max-height:610px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative}
    .focus.k-generalization .p09-claim{flex:0 0 205px}
    .focus.k-generalization .p09-trunk{flex:0 0 112px!important;height:112px!important}
    .focus.k-generalization .p09-supports{flex:0 0 158px!important;height:158px!important}
    .focus.k-generalization .p09-support{flex:0 0 158px!important;height:158px!important}
    .p09-claim{width:950px;min-height:205px;box-sizing:border-box;border:2px solid var(--text);border-radius:6px;display:flex;align-items:center;gap:34px;padding:25px 42px;background:var(--panel);position:relative}
    .p09-symbol{width:270px;height:126px;flex:0 0 270px;border-right:1px solid var(--line);padding-right:26px}
    .p09-claim-copy{min-width:0}
    .p09-eyebrow{font:600 var(--fs-label)/1 var(--font-sans);letter-spacing:.12em;color:var(--accent);margin-bottom:12px}
    .p09-claim strong{display:block;font:500 var(--fs-h2)/1.36 var(--font-serif);color:var(--text)}
    .p09-trunk{height:112px;width:660px;position:relative;flex:0 0 112px}
    .p09-trunk .stem{position:absolute;left:50%;top:0;height:51px;border-left:2px solid var(--line)}
    .p09-trunk .bar{position:absolute;left:0;right:0;top:50px;border-top:2px solid var(--line)}
    .p09-trunk .branch{position:absolute;top:50px;height:62px;border-left:2px solid var(--line)}
    .p09-trunk .branch.left{left:0}.p09-trunk .branch.right{right:0}
    .p09-supports{width:1100px;height:158px;display:block;position:relative}
    .p09-support{width:490px!important;height:158px!important;min-height:158px;box-sizing:border-box;border-top:4px solid var(--line);padding:18px 24px 12px;position:absolute!important;top:0;background:var(--panel)}
    .p09-support:first-child{left:0}.p09-support:last-child{right:0}
    .p09-support .tag{display:inline-block;margin:0 0 11px;font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.08em;color:var(--muted);background:transparent;padding:0}
    .p09-support h2{margin:0;font:500 var(--fs-h2)/1.25 var(--font-serif);color:var(--text)}
    .p09-support p{margin:9px 0 0;font:var(--fs-sec)/1.4 var(--font-sans);color:var(--muted)}
    .p09-foot{flex:0 0 102px;border-top:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:40px}
    .p09-close{margin:0;max-width:820px;font:var(--fs-lead)/1.4 var(--font-sans);color:var(--text)}
    .p09-next{margin:0;text-align:right;font:600 var(--fs-sec)/1.4 var(--font-sans);color:var(--accent)}
    .p09-next span{display:block;font:var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--muted);margin-bottom:7px}
    .p09-symbol .spiral{fill:none;stroke:var(--text);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .p09-symbol .route{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .p09-symbol .move{stroke:var(--line);stroke-width:2.5;fill:none;stroke-linecap:round}
    .p09-symbol .dot{fill:var(--line)}.p09-symbol .dot.now{fill:var(--accent)}
    .p09-symbol .arrowhead{fill:var(--line)}
  </style>
  <header class="p09-head" aria-label="章节标题">
    <div class="p09-kicker">CHAPTER III · PATH</div>
    <h1>从这一页起，只追问台风中心为什么会移动和转弯</h1>
  </header>
  <main class="p09-main min0">
    <section class="focus k-generalization p09-focus min0" aria-label="路径问题的总览">
      <div class="p09-claim">
        <svg class="p09-symbol" viewBox="0 0 170 126" role="img" aria-label="台风自身闭合旋转、中心位置沿弯曲路径移动和独立的平移箭头">
          <path class="spiral" d="M57 66c-19 0-27-18-17-31 12-16 41-11 46 10 5 21-15 38-35 34-22-4-31-29-17-46 16-20 51-14 61 11"/>
          <path class="route" d="M91 94 C110 86,125 90,139 78 S157 61,163 45"/>
          <circle class="dot" cx="101" cy="90" r="4"/><circle class="dot now" cx="132" cy="82" r="5"/><circle class="dot" cx="157" cy="58" r="4"/>
          <path class="move" d="M101 108H151"/><path class="arrowhead" d="M159 108l-11-6v12z"/>
        </svg>
        <div class="p09-claim-copy">
          <div class="p09-eyebrow">QUESTION SCOPE</div>
          <strong>先把“能否变强”放在一边：<br>此刻只看中心位置怎样随时间改变。</strong>
        </div>
      </div>
      <div class="p09-trunk" aria-hidden="true"><i class="stem"></i><i class="bar"></i><i class="branch left"></i><i class="branch right"></i></div>
      <div class="p09-supports">
        <article class="p09-support">
          <span class="tag">QUESTION 01</span>
          <h2>中心为何移动？</h2>
          <p>旋转还在原地；要找的是让中心平移的方向。</p>
        </article>
        <article class="p09-support">
          <span class="tag">QUESTION 02</span>
          <h2>路径为何转弯？</h2>
          <p>弯曲的不是风暴形状，而是中心前进的轨迹。</p>
        </article>
      </div>
    </section>
  </main>
  <footer class="p09-foot">
    <p class="p09-close">先放下“能否变强”，把注意力转向中心位置随时间的改变。</p>
    <p class="p09-next"><span>NEXT QUESTION</span>台风移动时，究竟在跟随哪一层的风？</p>
  </footer>
</div>
