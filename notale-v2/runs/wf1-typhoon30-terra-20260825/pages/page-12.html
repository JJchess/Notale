<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif;--paper:#F3F1EA;--env:#176B78;--accent:#E4572E;--line:#7A8280;--muted:#626967;--panel:#E8E6DE}
*{box-sizing:border-box}
#stage{display:flex;flex-direction:column;gap:0;overflow:hidden}
.page-head{height:126px;flex:none;border-bottom:2px solid var(--text);padding:5px 0 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
.kicker{font-size:var(--fs-label);letter-spacing:.13em;font-weight:700;color:var(--env);margin-bottom:10px}
h1{font-family:var(--font-serif);font-size:var(--fs-h1);line-height:1.2;letter-spacing:.01em;margin:0;font-weight:700;color:var(--text)}
.head-mark{align-self:flex-start;margin-top:5px;font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.main.split-lr{flex:1;min-height:0;display:grid;grid-template-columns:37% 63%;padding-top:27px}
.left,.right{min-width:0;min-height:0;position:relative}
.left{padding-right:40px;border-right:2px solid var(--line)}
.right{padding-left:46px;display:flex;flex-direction:column}
.region-label{font-size:var(--fs-label);font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
.claim{font-family:var(--font-serif);font-size:var(--fs-h2);line-height:1.35;font-weight:700;max-width:420px;margin:0 0 18px;color:var(--text)}
.air-figure{height:384px;position:relative;border-top:2px solid var(--line);border-bottom:2px solid var(--line);margin-top:4px}
.air-figure svg{width:100%;height:100%;display:block;overflow:visible}
.direction-note{border-left:4px solid var(--env);padding:11px 0 10px 16px;margin-top:20px;color:var(--text);font-size:var(--fs-sec);line-height:1.55}
.direction-note strong{font-weight:700}
.right .claim{max-width:none;margin-bottom:9px}
.chain-stage{flex:1;min-height:0;position:relative;margin-top:2px}
.chain-stage > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;background:var(--paper);padding:8px 12px;font-size:var(--fs-body);line-height:1.25;font-weight:700;color:var(--text);white-space:nowrap}
.node.small{font-size:var(--fs-sec);font-weight:600}
.node.coriolis{left:1%;top:17%;border:2px solid var(--env);border-radius:6px}
.node.pressure{left:1%;top:48%;border:2px solid var(--line);border-radius:6px}
.node.wind{left:38%;top:32%;border:2px solid var(--env);border-radius:6px}
.node.steer{left:62%;top:32%;border-bottom:3px solid var(--env);padding-left:10px;padding-right:10px}
.path-end{position:absolute;right:1%;top:31%;display:flex;align-items:center;gap:9px;background:var(--paper);padding:7px 0 7px 10px;font-size:var(--fs-body);font-weight:700;white-space:nowrap}
.typhoon{width:43px;height:43px;flex:none}
.boundary{position:absolute;left:1%;top:76%;font-size:var(--fs-sec);line-height:1.4;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:12px}
.slashes{display:flex;gap:5px;align-items:center;height:23px}.slashes i{display:block;width:4px;height:26px;background:var(--accent);transform:rotate(36deg)}
.right-note{flex:none;border-top:2px solid var(--env);padding:13px 0 9px;font-size:var(--fs-lead);line-height:1.35;font-family:var(--font-serif);color:var(--text)}
.page-foot{height:90px;flex:none;border-top:2px solid var(--text);display:flex;align-items:center;justify-content:space-between;gap:32px;padding-top:14px}
.takeaway{max-width:1050px;font-size:var(--fs-sec);line-height:1.42;color:var(--text)}
.takeaway b{color:var(--env)}
.next{font-family:var(--font-serif);font-size:var(--fs-h2);line-height:1.25;text-align:right;color:var(--text);max-width:370px}
svg text{font-family:var(--font-sans);fill:var(--text);font-size:15px}svg .env{stroke:var(--env)}svg .neutral{stroke:var(--line)}svg .accent{stroke:var(--accent)}svg .wire{fill:none;stroke-width:3;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}svg .dash{stroke-dasharray:7 8}.arrowhead{fill:var(--env)}
</style>
</head>
<body data-page="12" data-total="21">
<div id="stage">
  <header class="page-head">
    <div><div class="kicker">方向机制 · 作用边界</div><h1>地球自转塑造风场，却不替每次转弯下命令</h1></div>
    <div class="head-mark">12 / 21</div>
  </header>

  <main class="main split-lr min0 k-generalization" aria-label="科里奥利效应的作用边界">
    <section class="left min0" aria-labelledby="air-title">
      <div class="region-label">作用规则</div>
      <h2 id="air-title" class="claim">科里奥利效应<br>作用于运动空气</h2>
      <div class="air-figure" aria-label="运动空气与侧向偏转作用的示意">
        <svg viewBox="0 0 500 384" role="img" aria-label="空气原有运动向前，科里奥利偏转作用指向侧面">
          <defs><marker id="leftArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path class="arrowhead" d="M0,0 L10,5 L0,10z"/></marker></defs>
          <path class="env wire" d="M67 215 L389 215" marker-end="url(#leftArrow)"/>
          <text x="66" y="190" fill="#176B78" font-weight="700">空气原有运动</text>
          <circle cx="219" cy="215" r="8" fill="#263033"/>
          <path class="accent wire" d="M219 207 L219 92" marker-end="url(#leftArrow)"/>
          <text x="239" y="111" fill="#E4572E" font-weight="700">科里奥利</text><text x="239" y="133" fill="#E4572E" font-weight="700">偏转作用</text>
          <path class="neutral wire" d="M49 298 L453 298"/>
          <text x="50" y="332" fill="#626967">先有空气在运动，才谈偏转作用</text>
        </svg>
      </div>
      <div class="direction-note"><strong>北半球：</strong>偏向运动方向的右侧<br><strong>南半球：</strong>偏向运动方向的左侧</div>
    </section>

    <section class="right min0" aria-labelledby="chain-title">
      <div class="region-label">解释边界</div>
      <h2 id="chain-title" class="claim">偏转作用要先参与组织风场，<br>才会进入路径的解释。</h2>
      <div class="chain-stage min0" aria-label="从地球自转到台风路径的正确因果链">
        <svg viewBox="0 0 880 390" preserveAspectRatio="none" aria-hidden="true">
          <defs><marker id="chainArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path class="arrowhead" d="M0,0 L10,5 L0,10z"/></marker></defs>
          <path class="env wire" d="M156 92 L306 92 L355 176" marker-end="url(#chainArrow)"/>
          <path class="neutral wire" d="M142 216 L306 216 L355 176" marker-end="url(#chainArrow)"/>
          <path class="env wire" d="M477 176 L545 176" marker-end="url(#chainArrow)"/>
          <path class="env wire" d="M690 176 L710 176" marker-end="url(#chainArrow)"/>
          <path class="accent wire dash" d="M154 102 C370 23, 650 25, 812 139"/>
          <path class="accent wire" d="M479 46 L495 66 M495 46 L511 66 M511 46 L527 66"/>
          <text x="238" y="30" fill="#E4572E" font-size="14">不可跳过风场</text>
          <text x="333" y="159" fill="#176B78" font-size="14">汇合</text>
        </svg>
        <div class="node coriolis">科里奥利效应</div>
        <div class="node pressure small">气压梯度等</div>
        <div class="node wind">大尺度风场</div>
        <div class="node steer">综合引导</div>
        <div class="path-end"><svg class="typhoon" viewBox="0 0 50 50" aria-hidden="true"><path d="M25 6c12 0 19 10 16 20-3 10-16 14-23 7-7-7-3-19 7-19 7 0 10 8 6 13-4 5-11 1-9-4" fill="none" stroke="#263033" stroke-width="3" stroke-linecap="round"/><path d="M34 41h13" stroke="#176B78" stroke-width="3"/><path d="M45 36l5 5-5 5" fill="none" stroke="#176B78" stroke-width="3"/></svg><span>台风路径</span></div>
        <div class="boundary"><span class="slashes" aria-hidden="true"><i></i><i></i><i></i></span><span>不能跳过风场，直接推出某一次转弯</span></div>
      </div>
      <div class="right-note">它是方向机制的一部分，不是单独的路径预报器。</div>
    </section>
  </main>

  <footer class="page-foot">
    <div class="takeaway"><b>收束：</b>科里奥利效应作用于运动空气，并与气压梯度等共同组织大尺度风场；具体路径仍取决于台风所处的引导气流。</div>
    <div class="next">纬度改变时，<br>这种偏转作用会相差多少？</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>

</body>
</html>
