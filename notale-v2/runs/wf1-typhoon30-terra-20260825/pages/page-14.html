<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="14" data-total="21">
<div id="stage">
  <style>
    #stage{display:flex;flex-direction:column;gap:0;padding:28px 56px;background:var(--bg);color:var(--text);overflow:hidden}
    .p14-head{height:116px;flex:0 0 116px;border-bottom:2px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;padding-top:3px;box-sizing:border-box}
    .p14-kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:2px;color:var(--env);margin:3px 0 12px}
    .p14-head h1{font:700 var(--fs-h1)/1.16 var(--font-serif);margin:0;letter-spacing:.02em}
    .p14-stage-note{font:var(--fs-label)/1.35 var(--font-sans);color:var(--muted);text-align:right;margin-top:5px;max-width:250px}
    .p14-main{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:17px}
    .p14-figure{flex:1;min-height:0;margin:0;position:relative}
    .p14-figure svg{width:100%;height:100%;display:block}
    .p14-foot{height:119px;flex:0 0 119px;border-top:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:48px;box-sizing:border-box}
    .p14-take{font:var(--fs-lead)/1.45 var(--font-sans);max-width:950px;margin:0}
    .p14-q{font:600 var(--fs-sec)/1.4 var(--font-sans);color:var(--env);max-width:350px;border-left:3px solid var(--accent);padding-left:16px;margin:0}
    .p14-figure text{font-family:var(--font-sans);fill:var(--text)}
    .p14-figure .tiny{font-size:15px;fill:var(--muted)}
    .p14-figure .label{font-size:16px;font-weight:600}
    .p14-figure .small-label{font-size:15px;font-weight:600}
    .p14-figure .tagbox{fill:var(--panel);stroke:var(--line);stroke-width:1.5px}
    .p14-figure .accent-tag{fill:var(--bg);stroke:var(--accent);stroke-width:2px}
    .p14-figure .pressure{fill:none;stroke:var(--line);stroke-width:2px}
    .p14-figure .wind{fill:none;stroke:var(--env);stroke-width:4px;stroke-linecap:round}
    .p14-figure .route{fill:none;stroke:var(--env);stroke-width:6px;stroke-linecap:round;stroke-linejoin:round}
    .p14-figure .route-guide{fill:none;stroke:var(--line);stroke-width:2px;stroke-dasharray:7 7}
    .p14-figure .storm{fill:none;stroke:var(--text);stroke-width:2.4px;stroke-linecap:round}
    .p14-figure .center{fill:var(--env);stroke:var(--bg);stroke-width:3px}
    .p14-figure .center-hot{fill:var(--accent);stroke:var(--bg);stroke-width:3px}
    .p14-figure .leader{fill:none;stroke:var(--line);stroke-width:1.5px}
    .p14-figure .north{stroke:var(--text);stroke-width:2.5px;fill:none}
  </style>

  <header class="p14-head">
    <div>
      <div class="p14-kicker">STEERING FLOW</div>
      <h1>转弯发生在引导气流换向的地方</h1>
    </div>
    <div class="p14-stage-note">同一张天气图 · 同一条连续路径<br>箭头方向 = 此处的引导气流</div>
  </header>

  <main class="p14-main min0">
    <figure class="p14-figure focus" aria-label="副热带高压边缘与中纬度西风共同引导台风连续转弯的示意天气图">
      <svg viewBox="0 0 1488 590" role="img" aria-labelledby="map-title map-desc" preserveAspectRatio="xMidYMid meet">
        <title id="map-title">台风路径沿副热带高压边缘转向并接入西风带</title>
        <desc id="map-desc">三个台风中心位于同一条深青蓝连续曲线上，环境风由西北转向北再转向东北。中间的转向点以橙红色突出。</desc>
        <defs>
          <marker id="envArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#176B78"/></marker>
          <marker id="accentArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#E4572E"/></marker>
          <marker id="greyArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7A8280"/></marker>
        </defs>

        <!-- quiet map boundary and north -->
        <rect x="25" y="18" width="1438" height="533" rx="6" fill="none" stroke="#7A8280" stroke-width="2"/>
        <path class="north" d="M1395 88 L1395 43 M1386 55 L1395 43 L1404 55"/>
        <text x="1395" y="34" text-anchor="middle" class="small-label">北</text>

        <!-- midlatitude westerlies: straight, parallel, southwest to northeast -->
        <text x="175" y="83" class="label" fill="#176B78">中纬度西风</text>
        <path class="wind" d="M112 121 L342 47" marker-end="url(#envArrow)"/>
        <path class="wind" d="M314 142 L544 68" marker-end="url(#envArrow)"/>
        <path class="wind" d="M516 163 L746 89" marker-end="url(#envArrow)"/>
        <path d="M84 183 H814" stroke="#7A8280" stroke-width="2"/>
        <text x="84" y="207" class="tiny">中纬度环流带</text>
        <text x="84" y="232" class="tiny">直线箭头：环境气流的来向</text>

        <!-- subtropical high, three closed isobars -->
        <path class="pressure" d="M885 184 C1108 126 1302 222 1321 372 C1344 536 1112 551 924 482 C770 426 728 256 885 184 Z"/>
        <path class="pressure" d="M919 225 C1080 178 1247 245 1262 366 C1278 477 1097 501 958 448 C842 405 825 280 919 225 Z"/>
        <path class="pressure" d="M958 267 C1060 234 1190 282 1200 366 C1209 438 1085 453 987 416 C908 385 898 308 958 267 Z"/>
        <text x="1052" y="335" text-anchor="middle" style="font-size:25px;font-weight:700">副热带高压 H</text>
        <rect class="tagbox" x="1014" y="352" width="78" height="29" rx="6"/>
        <text x="1053" y="372" text-anchor="middle" class="tiny">闭合等压线</text>

        <!-- continuous route, shown first so all other evidence attaches -->
        <path class="route-guide" d="M206 499 C282 448 354 415 440 374 C523 334 590 312 674 278 C738 253 767 216 780 173"/>
        <path class="route" d="M206 499 C282 448 354 415 440 374 C523 334 590 312 674 278 C738 253 767 216 780 173" marker-end="url(#envArrow)"/>

        <!-- phase 1 local environment arrow, separate from spiral -->
        <path class="wind" d="M231 474 L330 400" marker-end="url(#envArrow)"/>
        <circle class="center" cx="282" cy="448" r="11"/>
        <path class="storm" d="M270 438 C292 420 311 444 298 461 C284 480 251 465 260 442 C270 418 310 425 318 454 C328 490 281 505 251 480"/>
        <path class="leader" d="M268 467 L185 493"/>
        <rect class="tagbox" x="72" y="479" width="171" height="31" rx="6"/>
        <text x="87" y="500" class="small-label">① 沿高压边缘</text>
        <text x="72" y="535" class="tiny">引导风：偏西北</text>

        <!-- phase 2 -->
        <path d="M655 299 L655 193" fill="none" stroke="#E4572E" stroke-width="4" stroke-linecap="round" marker-end="url(#accentArrow)"/>
        <circle class="center-hot" cx="655" cy="299" r="12"/>
        <path class="storm" d="M642 289 C664 272 685 296 671 314 C656 333 623 316 634 293 C646 270 686 278 694 307 C704 344 656 358 627 332"/>
        <path d="M667 281 L765 246" class="leader" stroke="#E4572E"/>
        <rect class="accent-tag" x="772" y="225" width="152" height="34" rx="6"/>
        <text x="787" y="248" class="small-label" fill="#E4572E">② 引导风转向</text>
        <text x="772" y="282" class="tiny">引导风：偏北</text>

        <!-- phase 3 near westerlies -->
        <path class="wind" d="M743 203 L822 126" marker-end="url(#envArrow)"/>
        <circle class="center" cx="771" cy="189" r="11"/>
        <path class="storm" d="M758 179 C780 161 800 186 786 204 C771 222 740 206 750 183 C761 160 802 168 810 197 C820 233 771 247 742 221"/>
        <path class="leader" d="M785 183 L877 146"/>
        <rect class="tagbox" x="882" y="126" width="153" height="31" rx="6"/>
        <text x="897" y="147" class="small-label">③ 转入西风带</text>
        <text x="882" y="181" class="tiny">引导风：偏东北</text>

        <!-- reading key and note -->
        <g transform="translate(1060 479)">
          <circle class="center" cx="8" cy="8" r="7"/>
          <path class="route" d="M23 8 H75" stroke-width="4"/>
          <text x="91" y="13" class="tiny">路径中心与移动方向</text>
          <path class="storm" d="M10 38 C25 25 42 42 30 55 C17 68 -2 51 8 37 C18 23 44 32 47 51"/>
          <text x="91" y="49" class="tiny">闭合螺旋：自身环流</text>
        </g>
        <text x="54" y="554" class="tiny">三个时刻落在同一条连续路径上</text>
        <text x="54" y="573" class="tiny">示意图：实际转弯位置随大尺度环流配置而变</text>
      </svg>
    </figure>
  </main>

  <footer class="p14-foot">
    <p class="p14-take">台风沿副热带高压边缘移动，接近中纬度西风后，路径常由偏西北转向偏北或东北。</p>
    <p class="p14-q">如果高压和西风带换个位置，转弯点会跟着移动吗？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
