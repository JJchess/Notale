<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E4572E;--env:#176B78;--line:#7A8280;--muted:#626967;--panel:#E8E6DE}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text)}
#stage{height:900px;padding:28px 56px;display:flex;flex-direction:column;gap:14px;overflow:hidden;font-family:var(--font-sans)}
.top{height:112px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid var(--line);padding-bottom:15px}.kicker{font:700 15px/1 var(--font-mono,monospace);letter-spacing:2px;color:var(--env);margin-bottom:10px}.top h1{font:600 var(--fs-h1,34px)/1.18 var(--font-serif,serif);letter-spacing:.01em;margin:0}.top .takeaway{width:420px;font-size:16px;line-height:1.45;margin:26px 0 0;color:var(--muted);border-left:4px solid var(--accent,#E4572E);padding-left:14px}
.k-generalization{position:relative;display:flex;flex:1 1 0;min-height:0;flex-direction:column}.k-generalization>.claim{height:43px;flex:none;display:flex;align-items:center;justify-content:center;gap:12px;font-size:20px;line-height:1.3;font-weight:650}.claim .claim-line{display:block;height:2px;width:140px;background:var(--env)}.k-generalization>.bridge{height:20px;flex:0 0 20px;width:2px;background:var(--env);margin:0 auto}.k-generalization>.main-row{display:flex!important;flex:1 1 0!important;min-height:0!important;height:auto!important;gap:20px}.support{width:170px;border-top:3px solid var(--env);padding-top:11px;flex:0 0 170px}.support h2{font-size:18px;line-height:1.3;margin:0 0 7px}.support p{font-size:16px;line-height:1.45;margin:0;color:var(--muted)}.support .swatch{display:inline-block;width:16px;height:10px;border:2px solid var(--line);border-radius:6px;margin-right:6px;vertical-align:middle}.support .westerly{height:4px;background:var(--env);border:0;border-radius:0}
.figure-wrap{position:relative;flex:1;min-width:0;min-height:0;border:2px solid var(--line);border-radius:6px;background:#F8F7F2;overflow:hidden}.figure-wrap svg{display:block;width:100%;height:100%}.map-note{position:absolute;left:16px;bottom:12px;font-size:14px;line-height:1.35;color:var(--muted);background:rgba(248,247,242,.9);padding:4px 7px;border-radius:4px}.readout{position:absolute;right:14px;top:12px;width:205px;background:rgba(232,230,222,.94);border-left:4px solid var(--env);padding:9px 10px;font:14px/1.45 var(--font-mono,monospace)}.readout b{font-family:var(--font-sans);font-size:15px}.instruction{position:absolute;left:15px;top:11px;background:rgba(243,241,234,.94);font-size:15px;line-height:1.35;padding:6px 9px;border-radius:4px;border:1px solid rgba(122,130,128,.5)}
.bottom{height:118px;display:flex;gap:18px;align-items:stretch}.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px}.legend{width:388px;display:flex;flex-direction:column;justify-content:space-between}.legend-title,.ctl label{font-weight:700;font-size:15px}.legend-lines{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;line-height:1.35}.li{white-space:nowrap}.arrow-sample{color:var(--env);font-size:22px;vertical-align:-2px;margin-right:4px}.spiral{font-size:22px;line-height:10px;display:inline-block;color:var(--text);vertical-align:-2px;margin-right:4px}.dot-sample{display:inline-block;border-top:3px solid var(--env);width:30px;margin:0 5px 4px 0;position:relative}.dot-sample:after{content:"";position:absolute;width:8px;height:8px;background:var(--env);border-radius:50%;left:10px;top:-5px}.controls{flex:1;display:flex;gap:16px;align-items:center}.ctl{flex:1;min-width:0}.ctl label{display:flex;justify-content:space-between;margin-bottom:8px}.value{font-family:var(--font-mono,monospace);font-size:15px;color:var(--env)}input[type=range]{width:100%}.btn{font-family:var(--font-sans);font-size:15px;line-height:1;border:2px solid var(--text);background:var(--bg);color:var(--text);border-radius:6px;padding:11px 15px;white-space:nowrap;cursor:pointer}.btn:hover,.btn:focus-visible{border-color:var(--focus);outline:2px solid var(--focus);outline-offset:2px}.next{width:280px;display:flex;align-items:center;padding:12px 15px;border-left:3px solid var(--focus);font-size:16px;line-height:1.4}.status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg text{font-family:var(--font-sans);fill:var(--text)}.grid{stroke:#bcc0bb;stroke-width:1}.grid.major{stroke:#a4aaa5;stroke-width:1.3}.contour{fill:none;stroke:var(--line);stroke-width:2}.wind{stroke:var(--env);stroke-width:2.1;fill:none}.belt{fill:rgba(23,107,120,.09);stroke:var(--env);stroke-width:2}.belt-handle{fill:var(--env);cursor:ns-resize}.h-handle{cursor:move}.path-now{fill:none;stroke:var(--env);stroke-width:4}.path-old{fill:none;stroke:var(--line);stroke-width:2.5;stroke-dasharray:7 6;opacity:.75}.path-dot{fill:var(--env);stroke:#F8F7F2;stroke-width:2}.storm-spiral{fill:none;stroke:var(--text);stroke-width:2}.time-label{font-family:var(--font-mono,monospace);font-size:13px;fill:var(--muted)}.map-label{font-size:15px;font-weight:650}.small-svg{font-size:14px;fill:var(--muted)}.path-label{font-size:15px;font-weight:650;paint-order:stroke;stroke:#F8F7F2;stroke-width:5;stroke-linejoin:round}.focus-ring:focus{outline:none}.focus-ring:focus-visible{stroke:var(--focus);stroke-width:4}
</style>
</head>
<body data-page="15" data-total="21">
<div id="stage">
  <header class="top">
    <div><div class="kicker">STEERING FIELD</div><h1>台风转弯，是因为沿途的引导风变了方向</h1></div>
    <p class="takeaway">高压位置与西风带配置改变，台风经过的环境风便可能从偏西北转为偏北、再转向东北。</p>
  </header>
  <section class="k-generalization" aria-label="高压边缘与西风带共同塑造台风路径">
    <div class="claim"><span class="claim-line"></span><span>同一张经纬网里，两个风场共同决定每一步的移动方向</span><span class="claim-line"></span></div>
    <div class="bridge"></div>
    <div class="main-row min0">
      <aside class="support min0"><h2>副热带高压边缘</h2><p>围绕 <b>H</b> 的顺时针切向风，给路径一段偏西北的引导。</p><p class="small" style="margin-top:12px"><span class="swatch"></span>边缘风：5 m/s</p></aside>
      <figure class="figure-wrap min0 no-pan" id="mapbox" aria-label="可拖动的高压和西风带引导风场图">
        <svg id="map" role="img" aria-label="10至42度北纬、115至150度东经的示意风场与120小时台风路径"></svg>
        <div class="instruction">拖动 <b>H</b> 或深青色带；键盘聚焦后按方向键微调</div>
        <div class="readout" id="readout" aria-live="polite"></div>
        <div class="map-note">示意经纬网 · 每一步 6 h · 位置推进由当前环境风计算</div>
      </figure>
      <aside class="support min0"><h2>中纬度西风带</h2><p>向东的分量随纬度增加；接近带内时，路径便会向东偏转。</p><p class="small" style="margin-top:12px"><span class="swatch westerly"></span>0–8 m/s →</p></aside>
    </div>
  </section>
  <footer class="bottom">
    <section class="panel legend" aria-label="图例"><div class="legend-title">读图：一条直箭头只表示一处环境风</div><div class="legend-lines"><span class="li"><i class="arrow-sample">→</i>直箭头：环境风</span><span class="li"><i class="spiral">∿</i>螺旋：台风环流</span><span class="li"><i class="dot-sample"></i>圆点线：中心路径</span></div></section>
    <section class="panel controls" aria-label="风场控制">
      <div class="ctl"><label for="hLon">高压 H 经度 <span class="value" id="hLonVal"></span></label><input id="hLon" type="range" min="132" max="148" step="1" value="140"></div>
      <div class="ctl"><label for="hLat">高压 H 纬度 <span class="value" id="hLatVal"></span></label><input id="hLat" type="range" min="22" max="30" step="1" value="25"></div>
      <div class="ctl"><label for="beltLat">西风带中心 <span class="value" id="beltVal"></span></label><input id="beltLat" type="range" min="28" max="38" step="1" value="30"></div>
      <button class="btn" id="reset" type="button">恢复默认</button>
    </section>
    <aside class="next">即使知道“方向盘”在哪里，为什么未来路径仍不只有一条？</aside>
  </footer>
  <div class="status" id="status" aria-live="polite"></div>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(() => {
  Deck.init({index:15,total:21,keys:false});
  const svg=d3.select('#map'), mapbox=document.getElementById('mapbox');
  const W=1060,H=520, margin={l:58,r:28,t:35,b:42};
  svg.attr('viewBox',`0 0 ${W} ${H}`).attr('preserveAspectRatio','none');
  const x=d3.scaleLinear().domain([115,150]).range([margin.l,W-margin.r]);
  const y=d3.scaleLinear().domain([10,42]).range([H-margin.b,margin.t]);
  const state={hLat:25,hLon:140,belt:30, previous:null, path:[], timer:null};
  const defaults={hLat:25,hLon:140,belt:30};
  const root=svg.append('g'), defs=svg.append('defs');
  defs.append('marker').attr('id','arrowhead').attr('viewBox','0 -5 10 10').attr('refX',8).attr('refY',0).attr('markerWidth',5).attr('markerHeight',5).attr('orient','auto').append('path').attr('d','M0,-5L10,0L0,5').attr('fill','#176B78');
  const grid=root.append('g'), field=root.append('g'), model=root.append('g'), traces=root.append('g'), labels=root.append('g');
  function cleanResult(r, old){
    if(Array.isArray(r)) return {lat:r[0],lon:r[1]};
    return {lat:r.latitudeDeg ?? r.latitude ?? r.lat ?? r.y ?? old.lat, lon:r.longitudeDeg ?? r.longitude ?? r.lon ?? r.x ?? old.lon};
  }
  function windAt(lat,lon){
    const dx=(lon-state.hLon)*Math.cos(lat*Math.PI/180), dy=lat-state.hLat;
    const d=Math.hypot(dx,dy); let east=0,north=0;
    if(d>.001){east=5*dy/d; north=5*(-dx)/d;}
    const west=8*Math.max(0,Math.min(1,(lat-(state.belt-4))/8));
    return {east:east+west,north,west};
  }
  function integrate(){
    let p={lat:15,lon:125}; const out=[{...p,h:0,wind:windAt(p.lat,p.lon)}];
    for(let h=6;h<=120;h+=6){const w=windAt(p.lat,p.lon); const r=Lec.P.advancePosition(p.lat,p.lon,w.east,w.north,6); p=cleanResult(r,p); out.push({...p,h,wind:windAt(p.lat,p.lon)});}
    return out;
  }
  function direction(a,b){const e=b.lon-a.lon,n=b.lat-a.lat; if(Math.abs(e)<.07) return n>=0?'偏北':'偏南'; if(Math.abs(n)<.07)return e>=0?'偏东':'偏西';return (n>=0?'偏北':'偏南')+(e>=0?'东':'西');}
  function drawGrid(){
    const lon=d3.range(115,151,5), lat=d3.range(10,43,4);
    grid.selectAll('*').remove();
    grid.selectAll('.v').data(lon).join('line').attr('class',d=>d%10===0?'grid major':'grid').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',margin.t).attr('y2',H-margin.b);
    grid.selectAll('.h').data(lat).join('line').attr('class',d=>d%8===2?'grid major':'grid').attr('x1',margin.l).attr('x2',W-margin.r).attr('y1',d=>y(d)).attr('y2',d=>y(d));
    grid.selectAll('.lon').data(lon).join('text').attr('class','time-label').attr('text-anchor','middle').attr('x',d=>x(d)).attr('y',H-15).text(d=>d+'°E');
    grid.selectAll('.lat').data(lat).join('text').attr('class','time-label').attr('text-anchor','end').attr('x',margin.l-9).attr('y',d=>y(d)+4).text(d=>d+'°N');
  }
  function drawModel(){
    model.selectAll('*').remove();
    const bandTop=Math.min(42,state.belt+4),bandBottom=Math.max(10,state.belt-4);
    model.append('rect').attr('class','belt').attr('x',margin.l).attr('width',W-margin.l-margin.r).attr('y',y(bandTop)).attr('height',y(bandBottom)-y(bandTop));
    model.append('line').attr('class','belt-handle focus-ring').attr('tabindex',0).attr('role','slider').attr('aria-label','拖动西风带中心纬度').attr('aria-valuemin',28).attr('aria-valuemax',38).attr('aria-valuenow',state.belt).attr('x1',W-margin.r-3).attr('x2',W-margin.r+14).attr('y1',y(state.belt)).attr('y2',y(state.belt));
    model.append('text').attr('class','map-label').attr('x',margin.l+12).attr('y',y(bandTop)+22).attr('fill','#176B78').text('西风带：东向分量 0 → 8 m/s');
    const pts=[]; for(let a=0;a<Math.PI*2;a+=Math.PI/18)pts.push([x(state.hLon)+Math.cos(a)*75,y(state.hLat)+Math.sin(a)*52]);
    model.append('path').attr('class','contour').attr('d',d3.line().curve(d3.curveCardinalClosed.tension(.55))(pts));
    const hg=model.append('g').attr('class','h-handle').attr('tabindex',0).attr('role','slider').attr('aria-label','拖动副热带高压 H').attr('aria-valuetext',`${state.hLat}°N, ${state.hLon}°E`);
    hg.append('circle').attr('class','focus-ring').attr('r',19).attr('fill','#F8F7F2').attr('stroke','#E4572E').attr('stroke-width',3).attr('cx',x(state.hLon)).attr('cy',y(state.hLat));
    hg.append('text').attr('x',x(state.hLon)).attr('y',y(state.hLat)+6).attr('text-anchor','middle').attr('font-size',19).attr('font-weight',800).attr('fill','#E4572E').text('H');
    hg.append('text').attr('class','small-svg').attr('x',x(state.hLon)+24).attr('y',y(state.hLat)-16).text('拖动高压');
    hg.call(d3.drag().on('drag',(ev)=>{const p=d3.pointer(ev,svg.node()); setState({hLon:Math.round(Math.max(132,Math.min(148,x.invert(p[0])))),hLat:Math.round(Math.max(22,Math.min(30,y.invert(p[1]))))},true);}));
    model.select('.belt-handle').call(d3.drag().on('drag',(ev)=>{const p=d3.pointer(ev,svg.node()); setState({belt:Math.round(Math.max(28,Math.min(38,y.invert(p[1]))))},true);}));
    model.selectAll('.focus-ring,.h-handle,.belt-handle').on('keydown',(ev)=>keyMove(ev));
  }
  function drawField(){
    field.selectAll('*').remove(); const samples=[];
    for(let lat=13;lat<=40;lat+=5) for(let lon=119;lon<=147;lon+=5){const w=windAt(lat,lon), mag=Math.hypot(w.east,w.north);if(mag>.1)samples.push({lat,lon,w,mag});}
    field.selectAll('line').data(samples).join('line').attr('class','wind').attr('marker-end','url(#arrowhead)').attr('x1',d=>x(d.lon)).attr('y1',d=>y(d.lat)).attr('x2',d=>x(d.lon)+d.w.east/d.mag*(12+d.mag*3.2)).attr('y2',d=>y(d.lat)-d.w.north/d.mag*(12+d.mag*3.2));
  }
  function drawTraces(animate){
    const p=state.path, line=d3.line().x(d=>x(d.lon)).y(d=>y(d.lat));
    traces.selectAll('*').remove(); labels.selectAll('*').remove();
    if(state.previous) traces.append('path').attr('class','path-old').attr('d',line(state.previous));
    const now=traces.append('path').attr('class','path-now').attr('d',line(p));
    const dots=traces.selectAll('.path-dot').data(p).join('circle').attr('class','path-dot').attr('r',4.4).attr('cx',d=>x(d.lon)).attr('cy',d=>y(d.lat));
    if(animate&&!Deck.reduced()) {const len=now.node().getTotalLength();now.attr('stroke-dasharray',`${len} ${len}`).attr('stroke-dashoffset',len).transition().duration(700).attr('stroke-dashoffset',0);dots.style('opacity',0).transition().delay((d,i)=>i*35).duration(170).style('opacity',1);setTimeout(()=>{state.previous=null;traces.selectAll('.path-old').remove()},740)}
    const stamp=p.filter(d=>d.h%24===0); traces.selectAll('.time').data(stamp).join('text').attr('class','time-label').attr('x',d=>x(d.lon)+7).attr('y',d=>y(d.lat)-9).text(d=>d.h+' h');
    const s1=direction(p[0],p[4]);let turn=8,max=0;for(let i=5;i<p.length-4;i++){let a=Math.atan2(p[i].lat-p[i-4].lat,(p[i].lon-p[i-4].lon)*Math.cos(p[i].lat*Math.PI/180)),b=Math.atan2(p[i+4].lat-p[i].lat,(p[i+4].lon-p[i].lon)*Math.cos(p[i].lat*Math.PI/180));if(Math.abs(b-a)>max){max=Math.abs(b-a);turn=i;}}
    const entered=p.findIndex(d=>d.lat>=state.belt-1); const endIdx=entered>0?Math.min(p.length-1,entered+3):p.length-1; const s3=direction(p[Math.max(0,endIdx-3)],p[endIdx]);
    const labs=[{i:4,t:s1},{i:turn,t:'转向段'},{i:endIdx,t:(entered>0?'进入西风后':'仍在高压边缘')+s3}];
    labels.selectAll('text').data(labs).join('text').attr('class','path-label').attr('x',d=>x(p[d.i].lon)+11).attr('y',(d,i)=>y(p[d.i].lat)+(i===1?20:-13)).text(d=>d.t);
    const last=p[p.length-1], firstWind=windAt(15,125); document.getElementById('readout').innerHTML=`<b>当前位置的首步引导风</b><br>东向 ${firstWind.east.toFixed(2)} m/s<br>北向 ${firstWind.north.toFixed(2)} m/s<br><br><b>120 h 终点</b><br>${last.lat.toFixed(1)}°N, ${last.lon.toFixed(1)}°E`;
  }
  function syncControls(){['hLon','hLat','beltLat'].forEach(id=>document.getElementById(id).value=id==='hLon'?state.hLon:id==='hLat'?state.hLat:state.belt);document.getElementById('hLonVal').textContent=state.hLon+'°E';document.getElementById('hLatVal').textContent=state.hLat+'°N';document.getElementById('beltVal').textContent=state.belt+'°N';}
  function render(animate=false){drawGrid();drawField();drawModel();drawTraces(animate);syncControls();}
  function setState(update, animate){state.previous=state.path.map(d=>({...d}));Object.assign(state,update);state.path=integrate();render(animate);}
  function keyMove(ev){let delta=ev.shiftKey?2:1, u={};if(ev.currentTarget.classList.contains('belt-handle')){if(ev.key==='ArrowUp')u.belt=state.belt+delta;if(ev.key==='ArrowDown')u.belt=state.belt-delta;}else{if(ev.key==='ArrowUp')u.hLat=state.hLat+delta;if(ev.key==='ArrowDown')u.hLat=state.hLat-delta;if(ev.key==='ArrowRight')u.hLon=state.hLon+delta;if(ev.key==='ArrowLeft')u.hLon=state.hLon-delta;}if(Object.keys(u).length){ev.preventDefault();if(u.hLat)u.hLat=Math.max(22,Math.min(30,u.hLat));if(u.hLon)u.hLon=Math.max(132,Math.min(148,u.hLon));if(u.belt)u.belt=Math.max(28,Math.min(38,u.belt));setState(u,true);}}
  document.getElementById('hLon').addEventListener('input',e=>setState({hLon:+e.target.value},true));document.getElementById('hLat').addEventListener('input',e=>setState({hLat:+e.target.value},true));document.getElementById('beltLat').addEventListener('input',e=>setState({belt:+e.target.value},true));
  document.getElementById('reset').addEventListener('click',()=>setState({...defaults},true));
  state.path=integrate();render(false);
})();
</script>
</body>
</html>
