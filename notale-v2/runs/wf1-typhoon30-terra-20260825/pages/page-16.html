<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="16" data-total="21">
<div id="stage">
  <style>
    #stage{padding:28px 56px; gap:0; overflow:hidden; background:var(--bg); color:var(--text)}
    .p16-head{height:112px; flex:0 0 112px; border-bottom:2px solid var(--line); display:flex; align-items:flex-start; justify-content:space-between; padding-top:5px}
    .p16-kicker{font:700 var(--fs-label)/1.2 var(--font-mono); letter-spacing:.14em; color:var(--env); margin:4px 0 10px}
    .p16-title{font:700 var(--fs-h1)/1.18 var(--font-serif); margin:0; letter-spacing:.01em}
    .p16-chapter{font:400 var(--fs-label)/1.4 var(--font-mono); color:var(--muted); margin-top:9px; white-space:nowrap}
    .p16-hero{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:27px 0 18px}
    .p16-focus{width:1320px; height:100%; min-height:0; display:flex; flex-direction:column; align-items:center}
    .p16-super{width:100%; height:88px; flex:0 0 88px; background:var(--panel); border:2px solid var(--text); border-radius:6px 6px 0 0; border-bottom:0; position:relative; display:flex; align-items:center; padding:0 38px; box-sizing:border-box}
    .p16-super:after{content:""; position:absolute; left:50%; top:100%; height:25px; border-left:2px solid var(--text)}
    .p16-super-label{font:700 var(--fs-h2)/1 var(--font-sans); letter-spacing:.08em; color:var(--text)}
    .p16-super-note{font:400 var(--fs-sec)/1.4 var(--font-sans); color:var(--muted); margin-left:25px; padding-left:25px; border-left:1px solid var(--line)}
    .p16-super-question{margin-left:auto; display:flex; align-items:center; gap:12px; font:700 var(--fs-sec)/1.25 var(--font-sans); color:var(--env); white-space:nowrap}\n    .p16-super-flow{width:270px; height:0; border-top:3px solid var(--env); position:relative}\n    .p16-super-flow:after{content:""; position:absolute; right:-1px; top:-6px; width:11px; height:11px; border-top:3px solid var(--env); border-right:3px solid var(--env); transform:rotate(45deg)}
    .p16-question{font:600 var(--fs-sec)/1.35 var(--font-sans); color:var(--env); margin:0 0 7px; padding-left:12px; border-left:4px solid var(--env)}
    .p16-classify{width:100%; flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; position:relative; border:2px solid var(--text); border-radius:0 0 6px 6px}
    .p16-classify:before{content:""; position:absolute; left:50%; top:0; bottom:0; border-left:2px solid var(--line)}\n    .p16-classify:after{content:""; position:absolute; left:25%; right:25%; top:25px; border-top:2px solid var(--line); pointer-events:none}
    .p16-box{position:relative; min-width:0; min-height:0; display:flex; flex-direction:column; background:var(--panel); padding:51px 35px 24px; box-sizing:border-box}
    .p16-bt{position:absolute; left:28px; top:-17px; padding:7px 14px 6px; border-radius:4px; background:var(--bg); border:2px solid var(--text); font:700 var(--fs-label)/1 var(--font-sans); letter-spacing:.08em}
    .p16-box.right{background:var(--bg); border:2px dashed var(--line); border-radius:0 0 5px 0; margin:-2px -2px -2px 0; padding-left:38px}
    .p16-box.right .p16-bt{border-style:dashed}
    .p16-copy{font:700 var(--fs-lead)/1.35 var(--font-sans); margin:0 0 12px}
    .p16-detail{font:400 var(--fs-sec)/1.4 var(--font-sans); color:var(--muted); margin:0}
    .p16-diagram{flex:1; min-height:0; width:100%; margin-top:8px}
    .p16-time{height:49px; flex:0 0 49px; width:100%; display:flex; align-items:flex-end; position:relative}
    .p16-time-line{height:18px; width:100%; border-bottom:2px solid var(--text); position:relative}
    .p16-time-line:after{content:""; position:absolute; right:-1px; bottom:-6px; width:10px; height:10px; border-top:2px solid var(--text); border-right:2px solid var(--text); transform:rotate(45deg)}
    .p16-time-label{position:absolute; left:50%; bottom:0; transform:translateX(-50%); padding:0 17px; background:var(--bg); white-space:nowrap; font:600 var(--fs-label)/1.2 var(--font-mono); color:var(--muted)}
    .p16-foot{height:62px; flex:0 0 62px; display:flex; align-items:flex-end; justify-content:space-between; border-top:1px solid var(--line); padding:11px 0 0; box-sizing:border-box}
    .p16-close{font:400 var(--fs-lead)/1.35 var(--font-serif); margin:0; max-width:850px}
    .p16-next{font:600 var(--fs-sec)/1.35 var(--font-sans); color:var(--env); margin:0; text-align:right; max-width:430px}
    .p16-next span{font-family:var(--font-mono); font-weight:700; letter-spacing:.08em; font-size:var(--fs-label); margin-right:8px}
    .p16-svgtext{font-family:var(--font-sans); fill:var(--text)}
    .p16-svgsmall{font-family:var(--font-mono); fill:var(--muted); font-size:15px}
  </style>

  <header class="p16-head">
    <div>
      <div class="p16-kicker">ACT IV · FORECAST</div>
      <h1 class="p16-title">知道方向盘是谁，还不等于能画出唯一正确的未来路径</h1>
    </div>
    <div class="p16-chapter">机制 → 预报</div>
  </header>

  <main class="p16-hero min0" aria-label="路径预报的分类关系">
    <section class="focus k-classification p16-focus min0" aria-labelledby="forecast-label">
      <div class="p16-super">
        <div id="forecast-label" class="p16-super-label">路径预报</div>
        <div class="p16-super-note">从现在，推向未来</div>
        <div class="p16-super-question"><span>机制</span><i class="p16-super-flow"></i><span>预报</span></div>
      </div>

      <div class="p16-classify min0">
        <section class="box p16-box min0" aria-labelledby="known-label">
          <div id="known-label" class="bt p16-bt">已经知道</div>
          <p class="p16-question">移动方向受谁控制？</p>
          <p class="p16-copy">大尺度气流掌舵</p>
          <p class="p16-detail">环境中的引导气流，给出移动的大致方向。</p>
          <p class="p16-detail">它回答“往哪里走”，不是唯一的终点。</p>
          <svg class="p16-diagram" viewBox="0 0 570 230" role="img" aria-label="台风环流旁有一支向东北的环境风直线箭头">
            <defs>
              <marker id="env-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#176B78"/></marker>
            </defs>
            <line x1="32" y1="218" x2="538" y2="8" stroke="#176B78" stroke-width="13" stroke-linecap="round" marker-end="url(#env-arrow)"/>
            <text x="372" y="28" class="p16-svgtext" font-size="17" font-weight="700" fill="#176B78">环境气流</text>
            <text x="372" y="52" class="p16-svgsmall">直线箭头表示方向</text>
            <g transform="translate(174 154) scale(1.48)" fill="none" stroke="#263033" stroke-width="6" stroke-linecap="round">
              <path d="M-58 8 C-69-43 -4-70 38-44 C82-17 58 50 13 54 C-30 58 -50 17 -28-10 C-7-37 33-24 32 9 C31 35 -6 39 -17 17 C-28-5 -2-21 12-6 C23 5 14 22 2 21"/>
            </g>
            <text x="88" y="226" class="p16-svgtext" font-size="16" font-weight="700">台风自身环流</text>
          </svg>
        </section>

        <section class="box p16-box right min0" aria-labelledby="future-label">
          <div id="future-label" class="bt p16-bt">仍需表达</div>
          <p class="p16-question">未来会不会只有一条？</p>
          <p class="p16-copy">未来不只一条可能路径</p>
          <p class="p16-detail">同一处“现在”，会向不同的未来展开。</p>
          <p class="p16-detail">图中三条线，来自同一个台风中心。</p>
          <svg class="p16-diagram" viewBox="0 0 570 230" role="img" aria-label="从一个共同起点向右展开的三条虚线路径">
            <defs>
              <marker id="future-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#176B78"/></marker>
            </defs>
            <line x1="45" y1="192" x2="526" y2="192" stroke="#7A8280" stroke-width="3" opacity=".55"/>
            <text x="35" y="225" class="p16-svgsmall">现在 · 共同起点</text>
            <circle cx="70" cy="192" r="10" fill="#E4572E"/>
            <path d="M70 192 C165 190 230 163 318 112 S445 45 505 8" fill="none" stroke="#176B78" stroke-width="10" stroke-linecap="round" stroke-dasharray="10 10" marker-end="url(#future-arrow)"/>
            <path d="M70 192 C180 192 315 183 510 169" fill="none" stroke="#176B78" stroke-width="10" stroke-linecap="round" stroke-dasharray="10 10" marker-end="url(#future-arrow)"/>
            <path d="M70 192 C145 186 225 138 291 76 S420 12 510 3" fill="none" stroke="#176B78" stroke-width="10" stroke-linecap="round" stroke-dasharray="10 10" marker-end="url(#future-arrow)"/>
            <text x="392" y="225" class="p16-svgsmall">未来仍未封闭</text>
          </svg>
        </section>
      </div>

      <div class="p16-time" aria-label="时间从现在指向未来">
        <div class="p16-time-line"></div>
        <div class="p16-time-label">现在　→　未来　·　终点尚未封闭</div>
      </div>
    </section>
  </main>

  <footer class="p16-foot">
    <p class="p16-close">机制告诉我们路径受什么控制；预报还必须面对不止一种可能。</p>
    <p class="p16-next"><span>NEXT</span>为什么几乎相同的起点，几天后会走出不同路径？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
