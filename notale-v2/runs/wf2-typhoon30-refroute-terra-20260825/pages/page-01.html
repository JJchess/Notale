<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="01" data-total="21">
<div id="stage">
  <style>
    :root { --bg:#F3F1EA; --text:#263033; --font-sans:"Noto Sans SC",system-ui,sans-serif; --focus:#E4572E; }
    #stage { position:relative; display:flex; flex-direction:column; overflow:hidden; isolation:isolate; padding:28px 56px; }
    .satellite { position:absolute; inset:0; z-index:-2; width:100%; height:100%; object-fit:cover; object-position:61% 48%; }
    .shade { position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,rgba(16,25,28,.30) 0%,rgba(16,25,28,.13) 43%,rgba(16,25,28,.02) 68%,rgba(16,25,28,.08) 100%); }
    .opening { width:1280px; margin:78px 0 0 34px; color:#f6f4ed; }
    .kicker { margin:0 0 14px; font:600 var(--fs-label)/1.2 var(--font-mono); letter-spacing:.16em; color:#d6dcda; }
    .k-generalization { position:relative; display:flex; flex-direction:column; align-items:center; }
    .claim { width:100%; box-sizing:border-box; padding:48px 70px 45px; background:rgba(34,42,43,.83); border:1px solid rgba(239,240,234,.48); border-radius:6px; box-shadow:0 12px 30px rgba(0,0,0,.16); text-align:center; }
    h1 { margin:0; color:#fffdf5; font:600 var(--fs-h1)/1.3 var(--font-serif); letter-spacing:.01em; }
    .trunk { width:2px; height:54px; background:rgba(245,244,237,.84); }
    .trunk::after { content:""; display:block; position:relative; top:52px; left:-546px; width:1094px; border-top:2px solid rgba(245,244,237,.84); }
    .supports { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:48px; padding-top:31px; }
    .support { min-height:210px; box-sizing:border-box; padding:28px 34px 22px; background:rgba(31,40,41,.78); border:2px solid rgba(244,244,237,.83); border-radius:6px; text-align:left; }
    .support .kind { display:block; margin-bottom:10px; color:#d9dedb; font:600 var(--fs-label)/1.2 var(--font-mono); letter-spacing:.08em; }
    .support strong { display:block; color:#fffdf5; font:600 var(--fs-h2)/1.35 var(--font-sans); }
    .path-support { border-color:rgba(188,222,225,.94); }
    .path-line { display:flex; align-items:center; gap:12px; white-space:normal; }
    .wind-arrow { display:inline-block; position:relative; width:45px; height:2px; flex:0 0 45px; background:var(--env); }
    .wind-arrow::after { content:""; position:absolute; right:-1px; top:-5px; width:10px; height:10px; border-top:2px solid var(--env); border-right:2px solid var(--env); transform:rotate(45deg); }
    .path-support strong em { color:#d6fbfb; font-style:normal; }
    .energy-mark { position:relative; height:72px; margin-top:26px; overflow:hidden; border-bottom:2px solid rgba(244,244,237,.72); }
    .energy-mark i { position:absolute; bottom:0; display:block; width:115px; border-top:2px solid rgba(244,244,237,.76); transform:skewX(-35deg); }
    .energy-mark i:nth-child(1){ left:15px; bottom:19px; } .energy-mark i:nth-child(2){ left:144px; bottom:39px; } .energy-mark i:nth-child(3){ left:273px; bottom:12px; }
    .flow-mark { position:relative; height:72px; margin-top:26px; overflow:hidden; border-bottom:2px solid rgba(188,222,225,.9); }
    .flow-mark i { position:absolute; left:15px; width:360px; border-top:3px solid var(--env); }
    .flow-mark i::after { content:""; position:absolute; right:-1px; top:-6px; width:12px; height:12px; border-top:3px solid var(--env); border-right:3px solid var(--env); transform:rotate(45deg); }
    .flow-mark i:nth-child(1){ top:11px; } .flow-mark i:nth-child(2){ top:34px; left:45px; width:330px; } .flow-mark i:nth-child(3){ top:57px; left:75px; width:300px; }
    .micro-labels { display:flex; justify-content:space-between; margin-top:13px; color:#d9dedb; font:600 var(--fs-tick)/1.2 var(--font-mono); letter-spacing:.11em; }
    .closing { width:1280px; margin:24px 0 0 34px; padding:22px 32px 22px; box-sizing:border-box; border-left:4px solid rgba(245,244,237,.87); background:rgba(31,40,41,.72); color:#fffdf5; font:500 var(--fs-lead)/1.45 var(--font-sans); }
    .next { width:920px; margin:22px 0 0 48px; color:#f2f2ea; font:400 var(--fs-sec)/1.45 var(--font-sans); text-shadow:0 1px 2px rgba(0,0,0,.58); }
    .next b { margin-right:11px; color:#d9dfdd; font:600 var(--fs-label)/1.2 var(--font-mono); letter-spacing:.08em; }
    .backdrop-note { position:absolute; right:56px; bottom:28px; margin:0; color:rgba(246,246,239,.86); font:400 var(--fs-tick)/1.25 var(--font-mono); text-shadow:0 1px 2px rgba(0,0,0,.75); }
  </style>
  <img class="backdrop satellite" src="assets/img/typhoon-himawari-satellite.jpg" alt="向右侧海面延展的台风眼与螺旋云系卫星图" title="Himawari-9 2026-07-05 0230z RGB.png · This image was produced by the Japan Meteorological Agency. The legal notice stated, unless otherwise noted, images publ · CC BY 4.0">
  <div class="shade" aria-hidden="true"></div>
  <main class="opening min0" aria-labelledby="page-title">
    <p class="kicker">OPENING QUESTION</p>
    <section class="k-generalization focus" aria-label="台风强弱和路径的两个条件">
      <div class="claim">
        <h1 id="page-title">暖海面给台风能量，变化的气流让它转弯</h1>
      </div>
      <div class="trunk" aria-hidden="true"></div>
      <div class="supports min0">
        <article class="support">
          <span class="kind">ENERGY CONDITION</span>
          <strong>暖海面 → 提供能量条件</strong><div class="energy-mark" aria-hidden="true"><i></i><i></i><i></i></div>
        </article>
        <article class="support path-support">
          <span class="kind">PATH DIRECTION</span>
          <strong class="path-line"><span>大尺度气流变化</span><span class="wind-arrow" aria-hidden="true"></span><em>改变路径</em></strong><div class="flow-mark" aria-hidden="true"><i></i><i></i><i></i></div>
        </article>
      </div>
    </section>
  </main>
  <p class="closing">强弱看能量条件，路径看大尺度气流。</p>
  <p class="next"><b>NEXT</b>如果只知道台风的出发点，你会把未来路径画向哪里？</p>

</div>
