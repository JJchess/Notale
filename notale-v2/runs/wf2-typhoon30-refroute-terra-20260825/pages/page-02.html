<!doctype html>

<body data-page="02" data-total="21">
<div id="stage">
  <style>
    :root{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E4572E}
    #stage{box-sizing:border-box;padding:28px 56px;gap:0;overflow:hidden;background:var(--bg);color:var(--text)}
    *{box-sizing:border-box}.topline{height:138px;border-bottom:2px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;padding-top:3px}.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.15em;color:var(--env);margin:4px 0 14px}.topline h1{font:700 var(--fs-h1)/1.18 var(--font-serif);margin:0;letter-spacing:.01em}.north-note{display:flex;align-items:center;gap:10px;margin-top:20px;font-size:var(--fs-label);color:var(--muted)}.north-arrow{font:700 25px/1 var(--font-sans);color:var(--env)}
    .main{height:574px;flex:none;min-height:0;display:flex;flex-direction:column;padding-top:24px}.instruction-row{height:50px;display:flex;align-items:flex-start;justify-content:space-between;gap:28px}.hint{margin:0;font-size:var(--fs-body);line-height:1.4;color:var(--text)}.hint b{color:var(--accent)}.status{max-width:520px;text-align:right;font-size:var(--fs-sec);line-height:1.4;color:var(--muted)}
    .k-comparison{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);align-items:stretch;gap:20px;padding-top:12px}.path-cell{height:100%;min-width:0;min-height:0;display:flex;flex-direction:column;border-left:2px solid var(--line);padding-left:13px}.hdr{height:35px;display:flex;align-items:baseline;gap:9px;font-size:var(--fs-h2);font-weight:700}.ordinal{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--muted)}.cvbox{position:relative;flex:1;min-height:0;border:2px solid var(--line);border-radius:6px;background:#eeece5;overflow:hidden}.path-cell:first-child .cvbox{border-color:var(--accent)}.konva-host{position:absolute;inset:0}.axis-north{position:absolute;z-index:2;left:15px;top:13px;display:flex;gap:4px;align-items:center;font:700 var(--fs-label)/1 var(--font-sans);color:var(--text);pointer-events:none}.axis-north span{font-size:20px;color:var(--env);line-height:.8}.start-label{position:absolute;z-index:2;left:50%;top:83%;width:170px;transform:translate(-50%,12px);text-align:center;font-size:var(--fs-label);line-height:1.35;color:var(--muted);pointer-events:none}.start-label strong{color:var(--accent);font-weight:700}.compare-caption{height:48px;margin:10px 2px 0;font-size:var(--fs-sec);line-height:1.35;color:var(--muted);opacity:0;transition:opacity .18s ease}.path-cell.revealed .compare-caption{opacity:1}.path-cell.revealed .cvbox{border-color:var(--env)}
    .bottom{height:132px;border-top:2px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:32px}.takeaway{font:700 var(--fs-lead)/1.4 var(--font-serif);max-width:1060px;margin:0}.takeaway[hidden]{display:none}.next{font-size:var(--fs-sec);line-height:1.4;color:var(--muted);text-align:right}.next b{display:block;color:var(--text);font-size:var(--fs-body);margin-top:3px}.btn{min-width:128px;font-size:var(--fs-label);padding:10px 16px;border:2px solid var(--text);border-radius:6px;background:transparent;color:var(--text);font-weight:700}.btn:hover{background:var(--panel)}.btn:focus-visible,.cvbox:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.cvbox.keyboard-target{cursor:crosshair}.cvbox.keyboard-target:focus-visible{border-color:var(--focus)}
    @media (prefers-reduced-motion:reduce){.compare-caption{transition:none}}
  </style>
  <header class="topline">
    <div><p class="kicker">PREDICT FIRST</p><h1>从同一点出发，你会把台风画向哪里？</h1></div>
    <div class="north-note"><span class="north-arrow">↑</span><span>四格共享北向朝上<br>与同一坐标尺度</span></div>
  </header>
  <main class="main min0">
    <div class="instruction-row">
      <p class="hint"><b>从橙色台风中心开始画。</b> 拖出一笔你预判的路径；也可聚焦起点后按方向键逐段延长。</p>
      <div id="status" class="status" aria-live="polite">尚未落笔：其余三种预判暂不显示。</div>
    </div>
    <section class="k-comparison" aria-label="四种从相同起点出发的台风路径预判">
      <article class="path-cell" aria-labelledby="your-title"><div class="hdr" id="your-title"><span class="ordinal">01</span>你的预判</div><div id="user-box" class="cvbox no-pan keyboard-target" tabindex="0" role="application" aria-label="你的路径画布。先从台风中心开始拖动；键盘使用八方向键延长路径，Backspace 撤销上一段，Enter 完成。"><div id="user-canvas" class="konva-host"></div><div class="axis-north">北 <span>↑</span></div><div id="start-label" class="start-label"><strong>●</strong> 从台风中心开始画</div></div><p class="compare-caption" aria-hidden="true">你的预判</p></article>
      <article class="path-cell preset" id="preset-1"><div class="hdr"><span class="ordinal">02</span>直行</div><div class="cvbox"><div id="straight-canvas" class="konva-host"></div><div class="axis-north">北 <span>↑</span></div></div><p class="compare-caption">方向基本不变</p></article>
      <article class="path-cell preset" id="preset-2"><div class="hdr"><span class="ordinal">03</span>西偏</div><div class="cvbox"><div id="west-canvas" class="konva-host"></div><div class="axis-north">北 <span>↑</span></div></div><p class="compare-caption">持续偏向西侧</p></article>
      <article class="path-cell preset" id="preset-3"><div class="hdr"><span class="ordinal">04</span>转弯</div><div class="cvbox"><div id="turn-canvas" class="konva-host"></div><div class="axis-north">北 <span>↑</span></div></div><p class="compare-caption">先偏西，随后转向</p></article>
    </section>
  </main>
  <footer class="bottom">
    <p id="takeaway" class="takeaway" hidden>同一个起点可以画出完全不同的路径——我们还没有说明“谁在掌舵”。</p>
    <div id="next" class="next">先保留这个分歧。<b>要解释一条台风路径，哪些问题必须先分开？</b></div>
    <button id="reset" class="btn" type="button">撤销重画</button>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script src="assets/lib/konva.min.js"></script>
<script>
(() => {
  Deck.init({index:2,total:21});
  const START={x:50,y:82};
  const presets=[[[50,82],[50,68],[50,54],[50,40],[50,26]],[[50,82],[45,69],[39,57],[32,46],[24,37]],[[50,82],[45,69],[43,56],[47,44],[57,34],[70,28]]];
  const hosts=['user-canvas','straight-canvas','west-canvas','turn-canvas'].map(id=>document.getElementById(id));
  const userBox=document.getElementById('user-box'), startLabel=document.getElementById('start-label');
  const status=document.getElementById('status'), takeaway=document.getElementById('takeaway'), resetBtn=document.getElementById('reset');
  const presetCells=[...document.querySelectorAll('.preset')];
  const events=new AbortController(); let destroyed=false, activePointer=null, stages=[];
  function initialState(){return {points:[],mode:'ready'};}
  let state=initialState();
  function transition(current,action){
    if(action.type==='reset') return initialState();
    if(action.type==='begin'){
      if(current.mode!=='ready') return current;
      const dx=action.point.x-START.x,dy=action.point.y-START.y;
      if(Math.hypot(dx,dy)>6) return current;
      return {points:[{...START}],mode:'drawing'};
    }
    if(action.type==='add'){
      if(current.mode!=='drawing') return current;
      const last=current.points[current.points.length-1];
      if(Math.hypot(action.point.x-last.x,action.point.y-last.y)<1.15 || current.points.length>=120) return current;
      return {points:[...current.points,action.point],mode:'compared'};
    }
    if(action.type==='nudge'){
      const base=current.points.length?current.points[current.points.length-1]:START;
      const p={x:Math.max(4,Math.min(96,base.x+action.dx)),y:Math.max(4,Math.min(96,base.y+action.dy))};
      if(!current.points.length) return {points:[{...START},p],mode:'compared'};
      return current.points.length>=120?current:{points:[...current.points,p],mode:'compared'};
    }
    if(action.type==='back'){
      if(!current.points.length) return current;
      const points=current.points.slice(0,-1); return {points,mode:points.length?'drawing':'ready'};
    }
    if(action.type==='commit') return current.points.length>1?{...current,mode:'compared'}:current;
    return current;
  }
  function toPixels(point,stage){return [point.x/100*stage.width(),point.y/100*stage.height()];}
  function spiral(layer,x,y,color){
    const pts=[]; for(let a=0;a<Math.PI*4.2;a+=.22){const r=12-a*.78;pts.push(x+Math.cos(a)*Math.max(1.8,r),y+Math.sin(a)*Math.max(1.8,r));}
    layer.add(new Konva.Line({points:pts,stroke:color,strokeWidth:2.4,lineCap:'round',lineJoin:'round'}));
    layer.add(new Konva.Circle({x,y,radius:3.5,fill:color}));
  }
  function buildStage(host,index){
    const stage=new Konva.Stage({container:host,width:host.clientWidth,height:host.clientHeight}); const layer=new Konva.Layer(); stage.add(layer);
    const line=new Konva.Line({stroke:index===0?'#E4572E':'#176B78',strokeWidth:5,lineCap:'round',lineJoin:'round',points:[],visible:false}); layer.add(line);
    const p=toPixels(START,stage); spiral(layer,p[0],p[1],index===0?'#E4572E':'#176B78');
    stages[index]={stage,layer,line}; return stages[index];
  }
  function render(){
    const revealed=state.points.length>1;
    startLabel.hidden=state.points.length>0;
    presetCells.forEach(cell=>cell.classList.toggle('revealed',revealed)); takeaway.hidden=!revealed;
    if(state.mode==='ready') status.textContent='尚未落笔：其余三种预判暂不显示。';
    else if(revealed) status.textContent='已同时展开三种路径：同一个起点，并不自动推出同一种走向。';
    else status.textContent='已从中心起笔；再延长一段，展开三种对照。';
    stages.forEach((item,index)=>{
      const data=index===0?state.points:presets[index-1]; const visible=index===0?data.length>0:revealed;
      item.line.points(data.flatMap(p=>toPixels(p,item.stage))); item.line.visible(visible); item.layer.batchDraw();
    });
  }
  function dispatch(action){const next=transition(state,action);if(next===state)return;state=next;render();}
  function getPoint(e){const p=Deck.pt(userBox,e);return {x:p.x/userBox.offsetWidth*100,y:p.y/userBox.offsetHeight*100};}
  function onDown(e){if(activePointer!==null)return;const point=getPoint(e);const dx=(point.x-START.x)*stages[0].stage.width()/100,dy=(point.y-START.y)*stages[0].stage.height()/100;if(Math.hypot(dx,dy)>24){status.textContent='请从橙色台风中心的 24 px 范围内开始。';return;} dispatch({type:'begin',point}); if(state.mode==='drawing'){activePointer=e.pointerId; try{userBox.setPointerCapture(activePointer);}catch(_){/* synthetic pointer events have no active browser capture */}}}
  function onMove(e){if(activePointer===null)return;dispatch({type:'add',point:getPoint(e)});}
  function endPointer(e){if(e.pointerId!==activePointer)return;activePointer=null;dispatch({type:'commit'});}
  function resize(){stages.forEach((item,index)=>{const host=hosts[index];item.stage.size({width:host.clientWidth,height:host.clientHeight});item.layer.destroyChildren();const line=new Konva.Line({stroke:index===0?'#E4572E':'#176B78',strokeWidth:5,lineCap:'round',lineJoin:'round',points:[],visible:false});item.layer.add(line);item.line=line;const p=toPixels(START,item.stage);spiral(item.layer,p[0],p[1],index===0?'#E4572E':'#176B78');});render();}
  function onKey(e){const keys={ArrowUp:[0,-7],ArrowDown:[0,7],ArrowLeft:[-7,0],ArrowRight:[7,0],Home:[-5,-5],PageUp:[5,-5],End:[-5,5],PageDown:[5,5]};if(keys[e.key]){e.preventDefault();e.stopPropagation();dispatch({type:'nudge',dx:keys[e.key][0],dy:keys[e.key][1]});}else if(e.key==='Backspace'){e.preventDefault();e.stopPropagation();dispatch({type:'back'});}else if(e.key==='Enter'){e.preventDefault();e.stopPropagation();dispatch({type:'commit'});}}
  hosts.forEach((host,index)=>buildStage(host,index));
  userBox.addEventListener('pointerdown',onDown,{signal:events.signal}); userBox.addEventListener('pointermove',onMove,{signal:events.signal}); userBox.addEventListener('pointerup',endPointer,{signal:events.signal}); userBox.addEventListener('pointercancel',endPointer,{signal:events.signal});
  userBox.addEventListener('keydown',onKey,{signal:events.signal}); resetBtn.addEventListener('click',()=>{activePointer=null;dispatch({type:'reset'});userBox.focus();status.textContent='已清除路径。请从橙色台风中心重新开始。';},{signal:events.signal});
  const offResize=Deck.onResize(resize);
  function destroy(){if(destroyed)return;destroyed=true;events.abort();offResize();activePointer=null;stages.forEach(item=>item.stage.destroy());stages=[];}
  window.addEventListener('pagehide',destroy,{once:true}); render();
})();
</script>
</body>
</html>
