<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body data-page="08" data-total="21">
<div id="stage">
<style>
:root{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E4572E;--env:#176B78;--line:#7A8280;--panel:#E8E6DE;--muted:#626967}
*{box-sizing:border-box} #stage{padding:28px 56px;display:flex;flex-direction:column;gap:16px;overflow:hidden;background:var(--bg);color:var(--text)}
.header{height:126px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid var(--text);padding-bottom:15px}.kicker{font:700 15px/1 var(--font-mono);letter-spacing:.14em;color:var(--env);margin-bottom:10px}.header h1{font:700 34px/1.16 var(--font-serif);margin:0}.page-note{font:16px/1.45 var(--font-sans);color:var(--muted);text-align:right;max-width:270px;margin-top:12px}
.workspace{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}.instruction{display:flex;align-items:center;gap:16px;min-height:50px}.instruction strong{font:700 20px/1.35 var(--font-sans)}.hint{font:16px/1.4 var(--font-sans);color:var(--muted);border-left:3px solid var(--env);padding-left:13px}.pool{min-height:176px;border:2px dashed var(--line);border-radius:6px;padding:13px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#D5D7D0}.pool-title{font:700 15px/1.2 var(--font-mono);letter-spacing:.08em;color:var(--muted);width:100%;margin-bottom:-3px}
.triptych{flex:1;min-height:278px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:stretch}.col{min-width:0;display:flex;flex-direction:column;border-top:5px solid var(--text);padding-top:12px;position:relative}.col-title{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;padding:9px 10px;background:var(--text);min-height:46px}.lv{font:700 15px/1 var(--font-mono);letter-spacing:.08em;color:#B9E0E3}.col h2{font:700 22px/1.2 var(--font-sans);margin:0;color:var(--bg)}.box{flex:1;min-height:180px;border:2px solid var(--line);border-radius:6px;padding:14px;background:#B9C0BD;display:flex;flex-direction:column;gap:9px;transition:border-color .16s,background .16s}.criterion{margin:auto 0;color:var(--muted);font:16px/1.45 var(--font-sans);border-left:3px solid var(--env);padding-left:11px}.criterion b{display:block;color:var(--text);font:700 16px/1.35 var(--font-sans);margin-bottom:7px}.criterion span{display:block;padding:7px 0;border-top:1px solid rgba(38,48,51,.28)}.criterion span:first-of-type{border-top:0}.criterion em{font-style:normal;color:var(--text);font-weight:700}.box.is-over{border-color:var(--focus);background:rgba(228,87,46,.08)}.col.path .box{border-style:dashed}.col.path.done .box{border-style:solid;border-color:var(--focus);background:rgba(228,87,46,.07)}.empty{font:16px/1.45 var(--font-sans);color:var(--muted);margin:auto 0}.bt{border:2px solid var(--text);border-radius:6px;background:var(--text);padding:17px 16px;min-height:78px;font:700 18px/1.25 var(--font-sans);text-align:left;color:var(--bg);cursor:grab;box-shadow:3px 3px 0 rgba(38,48,51,.16);touch-action:none;transition:transform .16s,border-color .16s,background .16s}.bt:hover{border-color:var(--env);color:var(--bg)}.bt:focus-visible,.cat:focus-visible,.reset:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.bt.selected{border-color:var(--focus);background:#fff6f1;color:var(--text);box-shadow:4px 4px 0 rgba(228,87,46,.24)}.card-question{display:block;font:15px/1.35 var(--font-sans);font-weight:400;opacity:.86;margin-top:5px}.bt.is-dragging{opacity:.72;cursor:grabbing;transform:scale(1.03);z-index:3}.bt.error{border-color:var(--focus);animation:shake .22s linear 2}.box .bt{min-height:44px;padding:8px 10px}.box .card-question{display:none}.reason{font:16px/1.4 var(--font-sans);color:var(--muted);padding:0 3px 4px}.footer{min-height:92px;display:grid;grid-template-columns:1fr auto;gap:22px;align-items:end;border-top:2px solid var(--text);padding-top:13px}.feedback{font:18px/1.4 var(--font-sans);min-height:49px}.feedback b{color:var(--focus)}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}.ctl-label{font:700 15px/1.2 var(--font-mono);color:var(--muted);margin-right:3px}.cat,.reset{border:2px solid var(--text);border-radius:5px;background:transparent;padding:9px 12px;font:700 15px/1.2 var(--font-sans);color:var(--text);cursor:pointer}.cat:hover,.reset:hover{border-color:var(--env);color:var(--env)}.reset{border-color:var(--focus);color:var(--focus);display:none}.complete .reset{display:inline-block}.conclusion{display:none;font:20px/1.4 var(--font-sans);max-width:950px}.complete .conclusion{display:block}.next{font:16px/1.4 var(--font-sans);color:var(--muted);text-align:right}.status-icon{font-family:var(--font-mono);margin-right:6px;color:var(--env)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0s!important;transition-duration:0s!important}}
</style>
<header class="header"><div><div class="kicker">CAUSE SORT</div><h1>暖海能供能，却不能替台风决定方向</h1></div><p class="page-note">把条件放进它真正影响的那一类。</p></header>
<main class="workspace min0" aria-label="台风条件分类练习">
 <div class="instruction"><strong>把四张卡分类。</strong><span class="hint">拖入一栏；或先点选卡片，再点类别按钮。已放置的卡可拖回卡池。</span></div>
 <section class="pool no-pan" id="pool" aria-label="待分类卡池"><div class="pool-title">待分类的条件</div></section>
 <section class="triptych k-classification" id="board" aria-label="三类归属区">
  <article class="col energy min0"><div class="col-title"><span class="lv">01</span><h2>能量条件</h2></div><div class="box" data-zone="energy" role="list" aria-label="能量条件归属区"></div><p class="empty" id="energy-note">帮助维持或增强</p></article>
  <article class="col limit min0"><div class="col-title"><span class="lv">02</span><h2>限制条件</h2></div><div class="box" data-zone="limit" role="list" aria-label="限制条件归属区"></div><p class="empty" id="limit-note">妨碍能量组织成台风结构</p></article>
  <article class="col path min0" id="path-col"><div class="col-title"><span class="lv">03</span><h2>路径方向</h2></div><div class="box" data-zone="path" role="list" aria-label="路径方向归属区"></div><p class="empty" id="path-note">直接决定往哪里走？</p></article>
 </section>
</main>
<footer class="footer"><div><div class="feedback" id="feedback" aria-live="polite"><span class="status-icon">→</span>从卡池挑一张，观察它影响的是能量、结构，还是方向。</div><div class="conclusion" id="conclusion"><b>这里故意是空的。</b> 暖海、深暖层是能量条件；强风切变、登陆是限制条件；它们都不直接等于路径方向。</div></div><div><div class="controls" aria-label="选中卡片后选择类别"><span class="ctl-label">放入：</span><button class="cat" data-zone="energy" type="button">能量条件</button><button class="cat" data-zone="limit" type="button">限制条件</button><button class="cat" data-zone="path" type="button">路径方向</button><button class="reset" id="reset" type="button">重新分类</button></div><div class="next">那么，真正推动台风中心移动的量是什么？</div></div></footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:8,total:21});
  const cards=[
    {id:'warm',label:'较暖海面',zone:'energy',reason:'可增大海气能量与水汽交换潜力'},
    {id:'deep',label:'较深暖水层',zone:'energy',reason:'搅拌后较不易迅速抽出冷水'},
    {id:'shear',label:'较强垂直风切变',zone:'limit',reason:'使台风上下结构较难保持对齐'},
    {id:'land',label:'台风中心进入陆地',zone:'limit',reason:'海洋供能中断，地表摩擦增大'}
  ];
  const pool=document.getElementById('pool'), board=document.getElementById('board'), feedback=document.getElementById('feedback'), resetButton=document.getElementById('reset'), pathCol=document.getElementById('path-col');
  const zones={pool,energy:document.querySelector('[data-zone="energy"]'),limit:document.querySelector('[data-zone="limit"]'),path:document.querySelector('[data-zone="path"]')};
  const notes={energy:document.getElementById('energy-note'),limit:document.getElementById('limit-note'),path:document.getElementById('path-note')};
  const events=new AbortController(); let timer=0, active=null;
  function initialState(){return {places:Object.fromEntries(cards.map(c=>[c.id,'pool'])),selected:null,message:'从卡池挑一张，观察它影响的是能量、结构，还是方向。',error:null};}
  let state=initialState();
  function complete(s){return cards.every(c=>s.places[c.id]===c.zone)}
  function transition(s,a){
    if(a.type==='select') return {...s,selected:s.selected===a.id?null:a.id,message:s.selected===a.id?'已取消选择。':`已选中「${cards.find(c=>c.id===a.id).label}」；现在选择类别。`,error:null};
    if(a.type==='return') return {...s,places:{...s.places,[a.id]:'pool'},selected:null,message:'卡片已回到卡池，可以重新分类。',error:null};
    if(a.type==='place'){
      const c=cards.find(x=>x.id===a.id); if(!c) return s;
      if(a.zone===c.zone) return {...s,places:{...s.places,[a.id]:a.zone},selected:null,message:`「${c.label}」：${c.reason}。`,error:null};
      return {...s,selected:null,message:'它影响的是供能或结构，不是这一类。',error:a.id};
    }
    if(a.type==='reset') return initialState(); return s;
  }
  function cancelWork(){clearTimeout(timer);timer=0;active=null;document.querySelectorAll('.is-over').forEach(x=>x.classList.remove('is-over'));}
  function dispatch(a){cancelWork(); state=transition(state,a);render(); if(state.error){timer=setTimeout(()=>{state={...state,error:null,message:'这张卡回到卡池；再试一次。'};render()},Deck.reduced()?0:500)}}
  function render(){
    Object.values(zones).forEach(z=>{if(z!==pool)z.innerHTML=''}); pool.querySelectorAll('.bt').forEach(x=>x.remove());
    const criteria={energy:'<b>归类判据</b><span><em>问：</em>它是否让海气交换更容易维持？</span><span><em>看：</em>热量、水汽能否继续补给。</span><span><em>归入：</em>帮助维持或增强的条件。</span><span><em>线索：</em>海面温暖、水汽充足、暖水较深。</span><span><em>共同点：</em>都关系到可用的海洋能量。</span>',limit:'<b>归类判据</b><span><em>问：</em>它是否削弱供能或破坏结构？</span><span><em>看：</em>上下结构能否保持对齐。</span><span><em>归入：</em>妨碍维持或增强的条件。</span><span><em>线索：</em>上下风差变大，或离开海面。</span><span><em>共同点：</em>供能受限，或结构难以维持。</span>',path:'<b>归类判据</b><span><em>问：</em>它是否直接回答“往哪里走”？</span><span><em>看：</em>本页四项都只影响强弱。</span><span><em>结果：</em>这一栏应当保持空置。</span><span><em>提醒：</em>“影响强弱”不等于“决定方向”。</span><span><em>检验：</em>留空也是一种分类结果。</span>'};Object.keys(criteria).forEach(zone=>{if(!cards.some(c=>state.places[c.id]===zone)){const q=document.createElement('div');q.className='criterion';q.innerHTML=criteria[zone];zones[zone].appendChild(q)}});
    cards.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='bt'+(state.selected===c.id?' selected':'')+(state.error===c.id?' error':'');b.dataset.id=c.id;b.setAttribute('aria-label',`${c.label}，${state.places[c.id]==='pool'?'待分类':'已放入分类区，可拖回卡池'}`);const prompts={warm:'它改变哪一种交换？',deep:'它保住了什么条件？',shear:'上下结构会怎样？',land:'海洋供能在哪里中断？'};b.innerHTML=c.label+'<span class="card-question">'+prompts[c.id]+'</span>'; const target=zones[state.places[c.id]];target.appendChild(b);if(state.places[c.id]!=='pool'){const r=document.createElement('div');r.className='reason';r.textContent=c.reason;target.appendChild(r)}});
    const ec=cards.filter(c=>state.places[c.id]==='energy').length,lc=cards.filter(c=>state.places[c.id]==='limit').length;
    notes.energy.textContent=ec===2?'2 张：提供或保存海洋能量':'帮助维持或增强';notes.limit.textContent=lc===2?'2 张：削弱供能或破坏结构':'妨碍能量组织成台风结构';notes.path.textContent=complete(state)?'0 张：本页四项都不是方向盘':'直接决定往哪里走？';
    const done=complete(state);document.getElementById('stage').classList.toggle('complete',done);pathCol.classList.toggle('done',done);feedback.innerHTML=done?'<span class="status-icon">✓</span><b>四张都归位了。</b> 看右栏：没有一张卡应该留在那里。':`<span class="status-icon">→</span>${state.message}`;
  }
  function cardFrom(e){return e.target.closest('.bt')}
  board.addEventListener('click',e=>{const b=cardFrom(e);if(b)dispatch({type:'select',id:b.dataset.id})},{signal:events.signal});pool.addEventListener('click',e=>{const b=cardFrom(e);if(b)dispatch({type:'select',id:b.dataset.id})},{signal:events.signal});
  document.querySelectorAll('.cat').forEach(btn=>btn.addEventListener('click',()=>{if(state.selected)dispatch({type:'place',id:state.selected,zone:btn.dataset.zone});else {state={...state,message:'先选中一张卡，再选择类别。'};render()}},{signal:events.signal}));
  resetButton.addEventListener('click',()=>{cancelWork();state=initialState();render();pool.querySelector('.bt').focus();feedback.textContent='已恢复固定卡序。重新开始分类。'},{signal:events.signal});
  function pointerDown(e){const b=cardFrom(e);if(!b||active)return;active={id:b.dataset.id,pointer:e.pointerId,origin:state.places[b.dataset.id],x:e.clientX,y:e.clientY,el:b};board.setPointerCapture(e.pointerId);b.classList.add('is-dragging');}
  function pointerMove(e){if(!active||e.pointerId!==active.pointer)return;Deck.pt(board,e);const el=document.elementFromPoint(e.clientX,e.clientY);document.querySelectorAll('.box,.pool').forEach(x=>x.classList.toggle('is-over',x===el?.closest('.box,.pool')));active.el.style.transform=`translate(${(e.clientX-active.x)/Deck.s}px, ${(e.clientY-active.y)/Deck.s}px) scale(1.03)`;}
  function pointerEnd(e){if(!active||e.pointerId!==active.pointer)return;const a=active;active=null;a.el.classList.remove('is-dragging');a.el.style.transform='';document.querySelectorAll('.is-over').forEach(x=>x.classList.remove('is-over'));const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.box,.pool');if(target===pool&&a.origin!=='pool')dispatch({type:'return',id:a.id});else if(target?.dataset.zone)dispatch({type:'place',id:a.id,zone:target.dataset.zone});}
  [board,pool].forEach(surface=>{surface.addEventListener('pointerdown',pointerDown,{signal:events.signal});surface.addEventListener('pointermove',pointerMove,{signal:events.signal});surface.addEventListener('pointerup',pointerEnd,{signal:events.signal});surface.addEventListener('pointercancel',pointerEnd,{signal:events.signal})});
  function destroy(){cancelWork();events.abort()}window.addEventListener('pagehide',destroy,{once:true});render();
})();
</script>
</body>
</html>
