<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E4572E;--stage-w:1600;--stage-h:900}
*{box-sizing:border-box} body{margin:0;overflow:hidden} #stage{height:900px;padding:28px 56px;display:flex;flex-direction:column;color:var(--text);background:var(--bg)}
.ledger{height:100%;display:flex;flex-direction:column}.titlebar{height:142px;border-bottom:2px solid var(--text);display:flex;align-items:flex-start;justify-content:space-between;padding:2px 0 18px}.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--env);margin:4px 0 13px}.titlebar h1{margin:0;max-width:1090px;font:500 var(--fs-h1)/1.22 var(--font-serif);letter-spacing:.01em}.title-mark{margin-top:18px;display:flex;gap:8px;align-items:center;font:var(--fs-label)/1 var(--font-mono);color:var(--muted)}.title-mark i{display:block;width:36px;height:9px;background:var(--env)}
.record{flex:1;min-height:0;display:flex;gap:34px;padding:24px 0 18px}.model{flex:1.65;min-width:0;display:flex;flex-direction:column}.side{width:420px;min-width:0;display:flex;flex-direction:column;gap:16px}.region-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px}.region-title h2{font:600 var(--fs-h2)/1.1 var(--font-sans);margin:0}.scale{font:var(--fs-tick)/1 var(--font-mono);color:var(--muted)}
.svg-wrap{flex:1;min-height:0;border:2px solid var(--text);border-radius:6px;background:rgba(255,255,255,.18);padding:8px}.wind-svg{width:100%;height:100%;display:block}.wind-svg text{font-family:var(--font-sans);fill:var(--text)}.wind-svg .mono{font-family:var(--font-mono)}.wind-svg .outer{fill:none;stroke:var(--text);stroke-width:2}.wind-svg .band{fill:rgba(23,107,120,.035);stroke:var(--line);stroke-width:1.5}.wind-svg .layername{font-size:17px;font-weight:700}.wind-svg .pressure{font-size:14px;fill:var(--muted)}.wind-svg .axis{stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 5}.wind-svg .wind{stroke:var(--env);stroke-width:5;stroke-linecap:round}.wind-svg .wind.off{stroke:var(--line);stroke-width:3;stroke-dasharray:7 6;opacity:.7}.wind-svg .wind.flash{stroke:var(--accent);stroke-width:7}.wind-svg .vector-label{font-size:15px;fill:var(--env)}.wind-svg .off-label{fill:var(--muted)}.wind-svg .join{fill:none;stroke:var(--line);stroke-width:2}.wind-svg .join.off{stroke-dasharray:5 5;opacity:.55}.wind-svg .resultbox{fill:var(--panel);stroke:var(--text);stroke-width:2}.wind-svg .result-head{font-size:16px;font-weight:700}.wind-svg .result-value{font-size:19px;font-family:var(--font-mono);font-weight:700}.wind-svg .result-arrow{stroke:var(--env);stroke-width:6;stroke-linecap:round}.wind-svg .result-arrow.flash{stroke:var(--accent)}.wind-svg .spiral{fill:none;stroke:var(--text);stroke-width:2}.wind-svg .smallnote{font-size:13px;fill:var(--muted)}
.panel{border:2px solid var(--text);border-radius:6px;background:var(--panel);padding:20px 22px}.control-panel h2{font:600 var(--fs-h2)/1.15 var(--font-sans);margin:0 0 7px}.hint{margin:0 0 17px;font:var(--fs-sec)/1.42 var(--font-sans);color:var(--muted)}.layers{border-top:1px solid var(--line)}.layer-control{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;min-height:61px;border-bottom:1px solid var(--line);cursor:pointer}.layer-control input{width:20px;height:20px;accent-color:var(--env);cursor:pointer}.layer-control strong{font:600 var(--fs-body)/1.2 var(--font-sans)}.layer-control span{font:var(--fs-label)/1 var(--font-mono);color:var(--muted);white-space:nowrap}.layer-control:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:-3px}.readout{margin-top:16px;border-left:6px solid var(--env);padding:11px 0 10px 15px}.readout-label{font:600 var(--fs-label)/1.2 var(--font-sans);margin-bottom:7px}.readout-value{font:700 var(--fs-sec)/1.45 var(--font-mono);white-space:nowrap}.readout-value b{font-size:22px;color:var(--env)}.status{min-height:22px;margin:12px 0 0;font:var(--fs-label)/1.35 var(--font-sans);color:var(--accent)}.btns{display:flex;align-items:center;justify-content:space-between;margin-top:3px}.btn{appearance:none;background:transparent;border:2px solid var(--text);border-radius:5px;padding:9px 13px;font:600 var(--fs-label)/1 var(--font-sans);color:var(--text);cursor:pointer}.btn:hover{background:rgba(38,48,51,.07)}.btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.selected-count{font:var(--fs-label)/1 var(--font-mono);color:var(--muted)}.note-panel{padding:15px 20px;background:transparent}.note-panel p{margin:0;font:var(--fs-sec)/1.45 var(--font-sans);color:var(--muted)}.note-panel b{color:var(--text)}
.footer{height:88px;border-top:2px solid var(--text);display:flex;align-items:center;justify-content:space-between;gap:40px}.takeaway{margin:0;max-width:940px;font:500 var(--fs-lead)/1.35 var(--font-serif)}.takeaway b{color:var(--env);font-family:var(--font-sans);font-size:var(--fs-label);letter-spacing:.06em;margin-right:12px}.next{margin:0;max-width:400px;text-align:right;font:var(--fs-sec)/1.35 var(--font-sans);color:var(--muted)}.next b{color:var(--text)}
</style>
</head>
<body data-page="10" data-total="21">
<div id="stage">
  <main class="ledger" aria-labelledby="page-title">
    <header class="titlebar">
      <div><p class="kicker">E2 · STEERING WIND</p><h1 id="page-title">台风不是听从某一层风，而是随多层环境风的加权结果移动</h1></div>
      <div class="title-mark" aria-label="环境气流图例"><i></i>环境风</div>
    </header>
    <section class="record min0" aria-label="三层环境风合成">
      <section class="model min0" aria-labelledby="model-heading">
        <div class="region-title"><h2 id="model-heading">同一大气柱内的三层环境风</h2><span class="scale">箭头尺度：1 m/s = 24 px　↑ 北 / → 东</span></div>
        <div class="svg-wrap min0">
          <svg class="wind-svg" viewBox="0 0 920 540" role="img" aria-labelledby="svg-title svg-desc">
            <title id="svg-title">三层环境风汇入综合引导风</title><desc id="svg-desc">高、中、低三层环境风都从相同原点出发，选中的风按权重汇入综合引导风；左下独立的螺旋是台风自身环流，不参与合成。</desc>
            <defs><marker id="arrow-env" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#176B78" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path fill="#7A8280" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path fill="#E4572E" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
            <rect class="outer" x="36" y="30" width="600" height="408" rx="5"/><text x="58" y="56" class="smallnote">大气柱：按高度嵌套</text>
            <g id="layers-svg"></g>
            <g id="joins-svg"></g>
            <g id="result-svg"></g>
            <g transform="translate(706 396)"><path class="spiral" d="M0,14 C-24,14 -25,-18 0,-24 C31,-30 40,11 19,29 C-9,52 -49,33 -47,-6 C-45,-48 7,-59 39,-33 C74,-4 53,48 12,58"/><circle cx="0" cy="14" r="3" fill="#263033"/><text x="-2" y="83" text-anchor="middle" class="smallnote">台风自身环流</text><text x="-2" y="101" text-anchor="middle" class="smallnote">（不参与合成）</text></g>
          </svg>
        </div>
      </section>
      <aside class="side min0" aria-label="气层选择与读数">
        <section class="panel control-panel">
          <h2>选择参与引导的气层</h2><p class="hint">勾选或取消一层，观察综合箭头怎样改变。至少保留一层。</p>
          <div class="layers" id="layer-controls"></div>
          <div class="readout" aria-live="polite" aria-atomic="true"><div class="readout-label">综合引导风</div><div class="readout-value" id="readout">东向 <b>4.0</b> m/s，北向 <b>3.0</b> m/s</div></div>
          <p class="status" id="status" aria-live="polite"></p>
          <div class="btns"><button class="btn" id="reset" type="button">恢复三层</button><span class="selected-count" id="selected-count">已选 3 / 3 层</span></div>
        </section>
        <section class="panel note-panel"><p><b>教学风场。</b>这是用于理解“多层加权”的教学风场；真实权重会随台风结构和环境改变。</p></section>
      </aside>
    </section>
    <footer class="footer"><p class="takeaway"><b>带走一句</b>低、中、高层风共同形成综合引导；台风自身的旋转不等于中心的平移。</p><p class="next"><b>下一问：</b>如果这支综合箭头保持 24 小时，路径点会落到多远之外？</p></footer>
  </main>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  Deck.init({index:10,total:21});
  const layers = [
    {id:'high', name:'高层环境风', pressure:'200 hPa', east:4, north:7, weight:.25, y:126},
    {id:'mid', name:'中层环境风', pressure:'500 hPa', east:5, north:2, weight:.50, y:246},
    {id:'low', name:'低层环境风', pressure:'850 hPa', east:2, north:1, weight:.25, y:366}
  ];
  const layerBox = document.getElementById('layer-controls'), readout = document.getElementById('readout'), status = document.getElementById('status'), resetBtn = document.getElementById('reset'), count = document.getElementById('selected-count');
  const layerSVG = document.getElementById('layers-svg'), joinsSVG = document.getElementById('joins-svg'), resultSVG = document.getElementById('result-svg');
  const events = new AbortController(); let raf=0, flashTimer=0, destroyed=false;
  function initialState(){return {selected:{high:true,mid:true,low:true}, flash:null, previous:{east:4,north:3}, started:0, message:''};}
  let state=initialState();
  function activeLayers(selected){const picked=layers.filter(l=>selected[l.id]); const sum=picked.reduce((n,l)=>n+l.weight,0); return layers.map(l=>({eastMps:l.east,northMps:l.north,weight:selected[l.id]?l.weight/sum:0}));}
  function vector(selected){const result=Lec.P.steeringWind(activeLayers(selected)); return {east:Number(result.eastMps),north:Number(result.northMps)};}
  function transition(current, action){
    if(action.type==='reset') return initialState();
    if(action.type==='toggle'){
      const selected={...current.selected}; const num=Object.values(selected).filter(Boolean).length;
      if(selected[action.id] && num===1) return {...current,message:'至少选择一个气层'};
      selected[action.id]=!selected[action.id]; const next=vector(selected);
      return {...current,selected,flash:action.id,previous:vector(current.selected),started:performance.now(),message:''};
    }
    return current;
  }
  function fmt(n){return Number(n).toFixed(2).replace(/\.00$/,'.0');}
  function line(x1,y1,x2,y2,cls,marker){return `<line class="${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#${marker})"/>`;}
  function render(now=performance.now()){
    const target=vector(state.selected); const reduce=Deck.reduced(); const t=state.started&&!reduce?Math.min(1,(now-state.started)/260):1; const ease=1-Math.pow(1-t,3); const shown={east:state.previous.east+(target.east-state.previous.east)*ease,north:state.previous.north+(target.north-state.previous.north)*ease};
    layerBox.innerHTML=layers.map(l=>`<label class="layer-control"><input type="checkbox" data-id="${l.id}" ${state.selected[l.id]?'checked':''}><strong>${l.name}</strong><span>${l.pressure}</span></label>`).join('');
    layerSVG.innerHTML=layers.map(l=>{const on=state.selected[l.id], x=315,y=l.y, ex=x+l.east*24,ey=y-l.north*24, flash=state.flash===l.id&&t<1?' flash':''; return `<rect class="band" x="48" y="${y-51}" width="576" height="102"/><text class="layername" x="69" y="${y-12}">${l.name}</text><text class="pressure mono" x="69" y="${y+13}">${l.pressure}</text><line class="axis" x1="${x}" y1="${y}" x2="${x+170}" y2="${y}"/><line class="axis" x1="${x}" y1="${y}" x2="${x}" y2="${y-66}"/>${line(x,y,ex,ey,'wind '+(!on?'off':'')+flash,on?'arrow-'+(flash?'accent':'env'):'arrow-gray')}<circle cx="${x}" cy="${y}" r="5" fill="#263033"/><text class="vector-label mono ${on?'':'off-label'}" x="438" y="${y+30}">${on?`东 ${l.east} · 北 ${l.north} m/s`:'未纳入'}</text>`;}).join('');
    joinsSVG.innerHTML=layers.map(l=>{const y=l.y; return `<path class="join ${state.selected[l.id]?'':'off'}" d="M636 ${y} H674 V282 H704"/>`;}).join('');
    const rx=780,ry=282,rex=rx+shown.east*24,rey=ry-shown.north*24, isFlash=state.flash&&t<1;
    resultSVG.innerHTML=`<rect class="resultbox" x="682" y="176" width="214" height="212" rx="5"/><text class="result-head" x="700" y="207">综合引导风</text><line class="axis" x1="${rx}" y1="${ry}" x2="875" y2="${ry}"/><line class="axis" x1="${rx}" y1="${ry}" x2="${rx}" y2="210"/>${line(rx,ry,rex,rey,'result-arrow '+(isFlash?'flash':''),'arrow-'+(isFlash?'accent':'env'))}<circle cx="${rx}" cy="${ry}" r="5" fill="#263033"/><text class="result-value" x="700" y="350">东 ${fmt(shown.east)}　北 ${fmt(shown.north)}</text><text class="smallnote" x="700" y="371">m/s · 权重已归一化</text>`;
    readout.innerHTML=`东向 <b>${fmt(target.east)}</b> m/s，北向 <b>${fmt(target.north)}</b> m/s`;
    status.textContent=state.message; count.textContent=`已选 ${Object.values(state.selected).filter(Boolean).length} / 3 层`;
    if(t<1){raf=requestAnimationFrame(render);} else if(state.flash){clearTimeout(flashTimer);flashTimer=setTimeout(()=>{state={...state,flash:null,started:0,previous:target};render();},Math.max(0,400-(reduce?400:260)));}
  }
  function dispatch(action){cancelAnimationFrame(raf);clearTimeout(flashTimer);const next=transition(state,action);state=next;render();}
  layerBox.addEventListener('change',e=>{if(e.target.matches('input[type=checkbox]')) dispatch({type:'toggle',id:e.target.dataset.id});},{signal:events.signal});
  resetBtn.addEventListener('click',()=>{cancelAnimationFrame(raf);clearTimeout(flashTimer);state=initialState();render();resetBtn.focus();status.textContent='已恢复三层环境风';},{signal:events.signal});
  function destroy(){if(destroyed)return;destroyed=true;events.abort();cancelAnimationFrame(raf);clearTimeout(flashTimer);} window.addEventListener('pagehide',destroy,{once:true});
  render();
})();
</script>
</body>
</html>
