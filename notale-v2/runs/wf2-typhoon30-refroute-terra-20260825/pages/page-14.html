<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E4572E;}
*{box-sizing:border-box}
#stage{display:flex;flex-direction:column;padding:28px 56px;color:var(--text);background:var(--bg);overflow:hidden}
.page-head{height:102px;flex:0 0 102px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid var(--text);padding:4px 0 16px}
.kicker{font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.14em;color:var(--env);font-weight:700;margin:2px 0 8px}
h1{font-family:var(--font-serif);font-size:var(--fs-h1);line-height:1.12;letter-spacing:.015em;margin:0;font-weight:700}
.head-note{font-size:var(--fs-label);color:var(--muted);margin-top:26px;white-space:nowrap}
.focus{flex:1;min-height:0;display:flex;align-items:stretch;padding:18px 0 12px}
.weather-map{width:100%;height:100%;min-height:0;display:block}
.page-foot{height:111px;flex:0 0 111px;border-top:2px solid var(--text);display:grid;grid-template-columns:1.45fr .9fr;gap:44px;padding-top:13px;align-items:start}
.takeaway{font-family:var(--font-serif);font-size:var(--fs-lead);line-height:1.42;font-weight:700;margin:0}
.next{font-size:var(--fs-sec);line-height:1.42;color:var(--muted);margin:4px 0 0;border-left:3px solid var(--env);padding-left:14px}
.next b{color:var(--text);font-weight:700}
.weather-map .system{fill:none;stroke:var(--line);stroke-width:2.4}
.weather-map .band{fill:none;stroke:var(--line);stroke-width:2}
.weather-map .path{fill:none;stroke:var(--env);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.weather-map .wind{fill:none;stroke:var(--env);stroke-width:4;stroke-linecap:round;marker-end:url(#arrowEnv)}
.weather-map .wind.current{stroke:var(--accent);marker-end:url(#arrowFocus);stroke-width:5}
.weather-map .center{fill:var(--env);stroke:var(--bg);stroke-width:4}
.weather-map .center.current{fill:var(--accent)}
.weather-map .spiral{fill:none;stroke:var(--text);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.weather-map .guide{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:5 6}
.weather-map text{font-family:var(--font-sans);fill:var(--text)}
.weather-map .map-label{font-size:18px;font-weight:700}
.weather-map .small-label{font-size:15px;fill:var(--muted)}
.weather-map .tagbox{fill:var(--bg);stroke:var(--line);stroke-width:1.8}
.weather-map .tagbox.current{stroke:var(--accent);stroke-width:2.5}
.weather-map .tagtext{font-size:16px;font-weight:700}
.weather-map .tagtext.current{fill:var(--accent)}
.weather-map .stage-num{font-family:var(--font-mono);font-size:16px;font-weight:700;fill:var(--bg)}
.weather-map .note{font-size:15px;fill:var(--muted)}
</style>
</head>
<body data-page="14" data-total="21">
<div id="stage">
  <header class="page-head">
    <div><div class="kicker">STEERING FLOW</div><h1>转弯发生在引导气流换向的地方</h1></div>
    <div class="head-note">同一张天气图 · 同一条连续路径</div>
  </header>

  <main class="focus min0" aria-label="副热带高压边缘与中纬度西风引导台风转弯的示意天气图">
    <svg class="weather-map" viewBox="0 0 1488 620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="map-title map-desc">
      <title id="map-title">台风随引导气流转向的连续路径</title>
      <desc id="map-desc">台风沿副热带高压的南侧和西侧移动，接近中纬度西风后由偏西北转向偏北，再转向偏东北。</desc>
      <defs>
        <marker id="arrowEnv" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#176B78"/></marker>
        <marker id="arrowFocus" markerWidth="11" markerHeight="11" refX="8.5" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#E4572E"/></marker>
      </defs>

      <!-- map boundary and latitude bands -->
      <path class="band" d="M74 126 H1414"/>
      <path class="band" d="M74 493 H1414"/>
      <text x="76" y="111" class="small-label">中纬度</text>
      <text x="76" y="518" class="small-label">低纬度</text>
      <text x="1414" y="111" class="small-label" text-anchor="end">西风带</text>

      <!-- westerly band: all straight environmental-flow arrows -->
      <g aria-label="中纬度西风">
        <path class="wind" d="M335 104 L500 54"/>
        <path class="wind" d="M626 104 L791 54"/>
        <path class="wind" d="M917 104 L1082 54"/>
        <text x="808" y="36" class="map-label" text-anchor="middle" fill="#176B78">中纬度西风</text>
      </g>

      <!-- subtropical high: three closed contours -->
      <g aria-label="副热带高压">
        <path class="system" d="M702 210 C830 133 1107 144 1253 274 C1385 391 1310 530 1134 555 C943 581 710 507 648 390 C615 329 635 253 702 210 Z"/>
        <path class="system" d="M748 248 C866 187 1076 191 1180 287 C1277 377 1219 485 1086 503 C929 525 757 469 713 375 C683 318 698 277 748 248 Z"/>
        <path class="system" d="M798 286 C891 240 1043 247 1117 310 C1183 366 1138 440 1038 454 C923 469 799 425 771 358 C757 324 766 305 798 286 Z"/>
        <text x="1014" y="356" class="map-label" text-anchor="middle">副热带高压 H</text>
        <text x="1014" y="383" class="small-label" text-anchor="middle">高压边缘引导路径</text>
      </g>

      <!-- north arrow -->
      <g transform="translate(1360 174)">
        <path d="M0 42 V0" stroke="#263033" stroke-width="2.5" marker-end="url(#arrowEnv)"/>
        <text x="0" y="62" class="tagtext" text-anchor="middle">北</text>
      </g>

      <!-- continuous route -->
      <g class="k-process" aria-label="偏西北到偏北再到偏东北的连续路径">
        <path class="path" d="M324 474 C432 454 530 411 598 344 C645 298 655 230 702 177 C763 108 858 88 946 77"/>
        <!-- subtle tangent guide at turning point -->
        <path class="guide" d="M598 344 V260"/>

        <!-- stage 1 wind, point, cyclone -->
        <path class="wind" d="M284 466 L347 410"/>
        <circle class="center" cx="324" cy="474" r="12"/>
        <text x="324" y="480" class="stage-num" text-anchor="middle">1</text>
        <path class="spiral" d="M305 499 C282 481 293 451 319 450 C346 448 356 477 337 491 C321 503 303 487 311 470 C319 453 342 463 338 478 C334 490 318 489 318 477"/>
        <g transform="translate(126 505)"><rect class="tagbox" width="190" height="38" rx="6"/><text x="95" y="25" class="tagtext" text-anchor="middle">① 沿高压边缘</text></g>

        <!-- stage 2 wind, point, cyclone -->
        <path class="wind current" d="M598 333 L598 250"/>
        <circle class="center current" cx="598" cy="344" r="13"/>
        <text x="598" y="350" class="stage-num" text-anchor="middle">2</text>
        <path class="spiral" d="M576 371 C553 350 565 319 593 320 C622 321 630 351 609 364 C590 375 575 357 584 340 C594 322 617 335 611 351 C606 364 590 360 592 347"/>
        <g transform="translate(452 376)"><rect class="tagbox current" width="190" height="38" rx="6"/><text x="95" y="25" class="tagtext current" text-anchor="middle">② 引导风转向</text></g>

        <!-- stage 3 wind, point, cyclone -->
        <path class="wind" d="M675 205 L742 139"/>
        <circle class="center" cx="702" cy="177" r="12"/>
        <text x="702" y="183" class="stage-num" text-anchor="middle">3</text>
        <path class="spiral" d="M680 204 C657 184 668 153 695 153 C723 153 733 182 713 196 C695 208 678 191 687 174 C696 157 719 169 714 185 C710 198 694 195 695 182"/>
        <g transform="translate(735 174)"><rect class="tagbox" width="172" height="38" rx="6"/><text x="86" y="25" class="tagtext" text-anchor="middle">③ 转入西风带</text></g>
      </g>

      <!-- legend / reading key -->
      <g transform="translate(82 572)">
        <path class="path" d="M0 0 H54"/><circle class="center" cx="27" cy="0" r="7"/>
        <text x="70" y="6" class="note">路径中心</text>
        <path class="wind" d="M203 0 L250 0"/>
        <text x="266" y="6" class="note">环境引导风</text>
        <path class="spiral" d="M447 8 C429 -8 451 -17 460 -2 C466 10 448 14 445 2"/>
        <text x="477" y="6" class="note">台风自身环流</text>
      </g>
      <text x="1406" y="578" class="note" text-anchor="end">示意图：实际转弯位置随大尺度环流配置而变</text>
    </svg>
  </main>

  <footer class="page-foot">
    <p class="takeaway">台风沿副热带高压边缘移动，接近中纬度西风后，路径常由偏西北转向偏北或东北。</p>
    <p class="next"><b>下一问</b>　如果高压和西风带换个位置，转弯点会跟着移动吗？</p>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
</body>
</html>
