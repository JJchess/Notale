<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E4572E}
*{box-sizing:border-box}
#stage{display:flex;flex-direction:column;gap:0;padding:28px 56px 24px;overflow:hidden}
.page-head{height:78px;flex:0 0 78px;border-bottom:2px solid var(--text);display:flex;align-items:flex-start;justify-content:space-between;padding:3px 0 16px;gap:36px}
.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.13em;color:var(--env);margin:3px 0 12px}
h1{font:700 var(--fs-h1)/1.22 var(--font-serif);letter-spacing:.01em;margin:0;color:var(--text);max-width:1040px}
.head-mark{font:600 var(--fs-label)/1.35 var(--font-mono);color:var(--muted);padding-top:7px;white-space:nowrap}
.main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 0 6px}
.focus{width:100%;max-width:none;height:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.k-classification{width:100%;height:100%;max-height:740px;min-height:520px;position:relative;display:flex;flex-direction:column;border:2px solid var(--text);border-radius:6px;padding:0 36px 26px;background:rgba(232,230,222,.24)}
.parent{height:92px;flex:0 0 92px;display:flex;align-items:center;gap:22px;border-bottom:2px solid var(--line);padding:18px 4px 14px}
.parent-tag{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.12em;color:var(--env);border:1.5px solid var(--env);border-radius:6px;padding:8px 10px;white-space:nowrap}
.parent-title{font:700 var(--fs-h2)/1.1 var(--font-sans);color:var(--text)}
.parent-sub{font:400 var(--fs-sec)/1.4 var(--font-sans);color:var(--muted);padding-top:3px}.parent-map{margin-left:auto;display:flex;align-items:center;gap:10px;font:700 var(--fs-label)/1 var(--font-sans);white-space:nowrap}.map-known{padding:10px 12px;border:2px solid var(--text);border-radius:6px;color:var(--text)}.map-arrow{width:42px;height:2px;background:var(--line);position:relative}.map-arrow:after{content:"";position:absolute;right:-1px;top:-4px;width:9px;height:9px;border-top:2px solid var(--line);border-right:2px solid var(--line);transform:rotate(45deg)}.map-future{padding:10px 12px;border:2px dashed var(--line);border-radius:6px;color:var(--env)}
.supports{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;position:relative;padding-top:25px}
.support{min-width:0;min-height:0;position:relative;display:flex;flex-direction:column;padding:0 34px 54px}
.support:first-child{border-right:2px solid var(--line)}
.bt{align-self:flex-start;font:700 var(--fs-label)/1 var(--font-sans);letter-spacing:.08em;padding:7px 11px 8px;border-radius:6px;margin-bottom:17px;background:var(--text);color:var(--bg)}
.support:last-child .bt{background:var(--panel);color:var(--text);border:1.5px dashed var(--line)}
.box{flex:1;min-height:0;border:2px solid var(--text);border-radius:6px;position:relative;overflow:hidden;background:rgba(243,241,234,.62)}
.box.predict{border-style:dashed;border-color:var(--line)}
.box-caption{position:absolute;left:22px;top:18px;font:700 var(--fs-lead)/1.25 var(--font-sans);color:var(--text);z-index:2}
.box-caption small{display:block;margin-top:5px;font:400 var(--fs-sec)/1.35 var(--font-sans);color:var(--muted)}.art-key{position:absolute;right:16px;bottom:13px;padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);font:600 var(--fs-label)/1 var(--font-sans);color:var(--muted);z-index:3}.predict .art-key{border-style:dashed;color:var(--env)}
.known-art,.future-art{position:absolute;inset:0;width:100%;height:100%}
.axis{position:absolute;bottom:0;left:0;width:100%;height:43px;display:flex;align-items:center;gap:13px;font:600 var(--fs-label)/1 var(--font-mono);letter-spacing:.06em;color:var(--muted);background:var(--panel);border-top:2px solid var(--line);padding:0 12px}
.axis-line{height:2px;flex:1;background:var(--line);position:relative}.axis-line:after{content:"";position:absolute;right:-1px;top:-5px;width:11px;height:11px;border-top:2px solid var(--line);border-right:2px solid var(--line);transform:rotate(45deg)}
.foot{height:48px;flex:0 0 48px;border-top:2px solid var(--text);display:flex;align-items:center;justify-content:space-between;gap:42px;padding-top:14px}
.takeaway{font:500 var(--fs-body)/1.4 var(--font-sans);max-width:850px;color:var(--text)}
.next{font:400 var(--fs-sec)/1.4 var(--font-sans);text-align:right;max-width:450px;color:var(--muted)}
.next b{color:var(--env);font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.08em}
</style>
</head>
<body data-page="16" data-total="21">
<div id="stage">
  <header class="page-head">
    <div class="min0"><div class="kicker">ACT IV · FORECAST</div><h1>知道方向盘是谁，还不等于能画出唯一正确的未来路径</h1></div>
    <div class="head-mark">16 / 21</div>
  </header>
  <main class="main min0">
    <section class="focus min0" aria-label="路径预报的分类关系">
      <div class="k-classification min0">
        <div class="parent">
          <span class="parent-tag">路径预报</span>
          <div><div class="parent-title">从现在，推向未来</div><div class="parent-sub">同一个台风的未来，需要同时放进两类信息。</div></div><div class="parent-map" aria-label="路径预报由已知机制推向尚未封闭的未来"><span class="map-known">已知：如何掌舵</span><i class="map-arrow"></i><span class="map-future">仍需：如何表达未来</span></div>
        </div>
        <div class="supports min0">
          <section class="support min0" aria-labelledby="known-label">
            <div class="bt" id="known-label">已经知道</div>
            <div class="box min0">
              <div class="box-caption">大尺度气流掌舵<small>环境风决定主要移动方向</small></div>
              <svg class="known-art" viewBox="0 0 610 310" role="img" aria-label="台风环流符号和一支指向右上的环境风箭头">
                <defs><marker id="arrowKnown" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#176B78" stroke-width="1.8"/></marker></defs>
                <path d="M118 237c-55-11-58-83-10-109 48-27 108 13 91 64-13 40-74 42-85 5-8-27 27-48 48-29 20 19-3 47-24 34-15-10-3-29 10-23" fill="none" stroke="#263033" stroke-width="4" stroke-linecap="round"/>
                <circle cx="139" cy="211" r="5" fill="#263033"/>
                <rect x="190" y="48" width="365" height="235" rx="6" fill="none" stroke="#176B78" stroke-width="2" stroke-dasharray="8 8" opacity=".55"/>
                <path d="M194 274 L544 84" fill="none" stroke="#176B78" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowKnown)"/>
                <path d="M188 292 L549 131" fill="none" stroke="#176B78" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowKnown)" opacity=".68"/>
                <path d="M203 207 L525 42" fill="none" stroke="#176B78" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowKnown)" opacity=".68"/>
                <rect x="302" y="185" width="92" height="31" rx="5" fill="#F3F1EA" stroke="#176B78" stroke-width="2"/>
                <text x="316" y="207" fill="#176B78" font-family="system-ui,sans-serif" font-size="18" font-weight="700">环境风</text>
                <text x="105" y="286" fill="#626967" font-family="system-ui,sans-serif" font-size="16">台风自身环流</text>
                <text x="355" y="285" fill="#176B78" font-family="system-ui,sans-serif" font-size="16" font-weight="700">主要移动方向</text>
              </svg><div class="art-key">直线箭头：环境风</div>
            </div>
          </section>
          <section class="support min0" aria-labelledby="future-label">
            <div class="bt" id="future-label">仍需表达</div>
            <div class="box predict min0">
              <div class="box-caption">未来不只一条可能路径<small>从同一个现在，向尚未封闭的未来展开</small></div>
              <svg class="future-art" viewBox="0 0 610 310" role="img" aria-label="从同一出发点向右展开的三条虚线路径">
                <defs><marker id="arrowFuture" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#176B78" stroke-width="1.8"/></marker></defs>
                <path d="M105 235 C195 234 238 222 300 184 S440 100 574 55" fill="none" stroke="#176B78" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round" marker-end="url(#arrowFuture)"/>
                <path d="M105 235 C204 234 286 227 375 207 S466 173 578 148" fill="none" stroke="#176B78" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round" marker-end="url(#arrowFuture)"/>
                <path d="M105 235 C204 233 278 203 329 151 S436 65 548 30" fill="none" stroke="#176B78" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round" marker-end="url(#arrowFuture)"/>
                <circle cx="105" cy="235" r="10" fill="#E4572E" stroke="#F3F1EA" stroke-width="3"/>
                <path d="M105 252 L105 284" stroke="#7A8280" stroke-width="2"/>
                <rect x="43" y="252" width="98" height="34" rx="5" fill="#F3F1EA" stroke="#E4572E" stroke-width="2"/>
                <text x="57" y="275" fill="#E4572E" font-family="system-ui,sans-serif" font-size="16" font-weight="700">同一现在</text>
                <text x="430" y="285" fill="#626967" font-family="system-ui,sans-serif" font-size="16">未来尚未封闭</text>
              </svg><div class="art-key">虚线路径 · 共同起点</div>
            </div>
          </section>
          <div class="axis"><span>现在</span><div class="axis-line"></div><span>未来</span></div>
        </div>
      </div>
    </section>
  </main>
  <footer class="foot">
    <div class="takeaway">机制告诉我们路径受什么控制；预报还必须面对不止一种可能。</div>
    <div class="next"><b>下一问</b><br>为什么几乎相同的起点，几天后会走出不同路径？</div>
  </footer>
</div>

</html>
