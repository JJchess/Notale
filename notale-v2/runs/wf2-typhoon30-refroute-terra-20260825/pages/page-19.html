<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root{--bg:#F3F1EA;--text:#263033;--font-sans:"Noto Sans SC",system-ui,sans-serif;--focus:#E4572E;--env:#176B78;}
*{box-sizing:border-box} body{margin:0;overflow:hidden} #stage{height:900px;padding:28px 56px;display:flex;flex-direction:column;gap:14px;background:var(--bg);color:var(--text)}
header{height:82px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--text);padding-bottom:13px;flex:none}.kicker{font:700 var(--fs-label)/1 var(--font-mono);letter-spacing:.14em;color:var(--env);margin-bottom:9px}.title{margin:0;font:700 var(--fs-h1)/1.1 var(--font-serif);letter-spacing:.01em}.header-side{max-width:382px;text-align:right;font-size:var(--fs-sec);line-height:1.4;color:var(--muted)}
.rules{height:138px;display:flex;gap:24px;padding:15px 18px;border:2px solid var(--line);border-radius:6px;background:rgba(232,230,222,.58);flex:none}.rule-copy{width:470px;border-right:1px solid var(--line);padding-right:22px}.rule-copy h2{margin:0 0 8px;font-size:var(--fs-h2);line-height:1}.rule-copy p{margin:0;font-size:var(--fs-sec);line-height:1.42}.scenario-area{flex:1;display:flex;align-items:center;gap:18px}.scenario-label{font-size:var(--fs-label);font-weight:700;white-space:nowrap}.scenario-tabs{display:flex;gap:8px}.scenario-tab,.choice,.reset{font:700 var(--fs-label)/1 var(--font-sans);border:2px solid var(--text);border-radius:5px;background:transparent;color:var(--text);min-height:36px;padding:0 13px;cursor:pointer}.scenario-tab[aria-pressed="true"]{background:var(--env);border-color:var(--env);color:white}.scenario-numbers{margin-left:auto;display:flex;gap:15px;align-items:center;font:var(--fs-label)/1.3 var(--font-mono);white-space:nowrap}.scenario-numbers b{font-weight:700;color:var(--env)}
.game{min-height:0;flex:1;display:flex;flex-direction:column}.comparison-head{height:33px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:none}.comparison-head div{font-size:var(--fs-label);font-weight:700;padding-left:16px;color:var(--muted)}.stage-cards{min-height:0;flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.decision-card{min-width:0;display:grid;grid-template-rows:62px 42px 47px 62px 62px 1fr;border:2px solid var(--line);border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden}.decision-card.done{border-color:var(--env)}.prob-row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--line)}.prob{font:700 30px/1 var(--font-mono);color:var(--env)}.prob-note{font-size:var(--fs-label);color:var(--muted)}.question{display:flex;align-items:center;padding:0 16px;font-size:var(--fs-sec);border-bottom:1px solid var(--line)}.choice-row{display:flex;gap:8px;align-items:center;padding:6px 16px;border-bottom:1px solid var(--line)}.choice{flex:1;padding:0 8px;min-height:34px;font-size:var(--fs-label)}.choice.selected{border-color:var(--focus);background:rgba(228,87,46,.11);color:var(--text)}.cost-row{padding:8px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:3px;transition:opacity 160ms ease}.cost-row.low{outline:2px solid var(--focus);outline-offset:-4px;background:rgba(228,87,46,.06)}.cost-name{font-size:var(--fs-label);color:var(--muted)}.cost-value{font:700 var(--fs-sec)/1.15 var(--font-mono)}.cost-row:not(.revealed){opacity:.36}.feedback{padding:10px 16px;font-size:var(--fs-sec);line-height:1.4;display:flex;align-items:center}.feedback strong{color:var(--env)}
.footer{height:74px;display:flex;align-items:center;gap:20px;border-top:2px solid var(--text);padding-top:12px;flex:none}.round-result{min-width:0;flex:1;font-size:var(--fs-sec);line-height:1.42}.round-result strong{font-size:var(--fs-body);color:var(--env)}.round-result.complete strong{color:var(--focus)}.reset{background:var(--panel);white-space:nowrap}.next{width:405px;text-align:right;font:700 var(--fs-sec)/1.4 var(--font-serif)}
button:hover{border-color:var(--env)}button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}@media (prefers-reduced-motion:reduce){.cost-row{transition:none}}
</style>
</head>
<body data-page="19" data-total="21">
<div id="stage">
  <header>
    <div><div class="kicker">RISK DECISION</div><h1 class="title">概率不是行动命令：代价不同，阈值就不同</h1></div>
    <div class="header-side">把同一组影响概率放进不同代价结构，比较“现在行动”和“继续等待”的期望代价。</div>
  </header>
  <section class="rules panel" aria-labelledby="rules-title">
    <div class="rule-copy min0"><h2 id="rules-title">本局规则</h2><p>每张卡代表同样可能发生影响的一次判断。选一项后，系统按本局代价点计算两种期望代价；较低者就是这张卡的较优方案。代价点不对应真实金额或统一行动标准。</p></div>
    <div class="scenario-area min0">
      <span class="scenario-label">切换风险情境</span>
      <div class="scenario-tabs" role="group" aria-label="风险情境">
        <button class="scenario-tab" data-scenario="base" aria-pressed="true">基准局</button>
        <button class="scenario-tab" data-scenario="highLoss" aria-pressed="false">高后果局</button>
        <button class="scenario-tab" data-scenario="highCost" aria-pressed="false">高成本局</button>
      </div>
      <div class="scenario-numbers" aria-label="当前局的代价规则"><span>C <b id="cVal">3</b> 点</span><span>L <b id="lVal">10</b> 点</span><span>R <b id="rVal">2</b> 点</span><span>阈值 <b id="threshold">37.5%</b></span></div>
    </div>
  </section>
  <main class="game min0" aria-label="期望代价决策局">
    <div class="comparison-head k-comparison" aria-hidden="true"><div>影响概率</div><div>影响概率</div><div>影响概率</div></div>
    <div class="stage-cards" id="cards"></div>
  </main>
  <footer class="footer">
    <div id="roundResult" class="round-result" aria-live="polite"><strong>先从任意一张概率卡开始。</strong> 选完三张卡，查看本轮额外代价。</div>
    <button id="reset" class="reset">重开本局</button>
    <div class="next">能否用三句话，把供能、掌舵和预报不确定性连起来？</div>
  </footer>
</div>
<script src="assets/base.js"></script>
<script src="assets/lec.js"></script>
<script>
(() => {
  'use strict';
  Deck.init({index:19,total:21});
  const scenarios={
    base:{name:'基准局',C:3,L:10,R:2},
    highLoss:{name:'高后果局',C:3,L:30,R:2},
    highCost:{name:'高成本局',C:8,L:10,R:2}
  };
  const probs=[.2,.5,.8], cards=document.getElementById('cards'), result=document.getElementById('roundResult');
  const stage=document.getElementById('stage');
  const initial=()=>({scenario:'base',choices:{},phase:'playing',turn:0,trace:[]});
  let state=initial();
  function values(p){const s=scenarios[state.scenario];return {act:s.C+p*s.R,wait:p*s.L};}
  function bestFor(p){const v=values(p);return v.act<=v.wait?'act':'wait';}
  function transition(old,action){
    if(action.type==='scenario') return {...old,scenario:action.scenario,choices:{},phase:'playing',turn:old.turn+1,trace:[...old.trace,`切换至${scenarios[action.scenario].name}`].slice(-12)};
    if(action.type==='reset') return {...old,choices:{},phase:'playing',turn:old.turn+1,trace:[...old.trace,'重开本局'].slice(-12)};
    if(action.type==='choose'){
      if(!(action.index in old.choices)===false) return {...old,feedback:'这张卡已经选择；可切换情境或重开本局。'};
      const choices={...old.choices,[action.index]:action.choice};
      const complete=Object.keys(choices).length===probs.length;
      return {...old,choices,phase:complete?'complete':'playing',turn:old.turn+1,trace:[...old.trace,`${Math.round(probs[action.index]*100)}%：${action.choice}`].slice(-12)};
    }
    return old;
  }
  function money(v){return v.toFixed(1)+' 点';}
  function formula(kind,p){const s=scenarios[state.scenario]; return kind==='act' ? `${s.C} + ${p.toFixed(1)}×${s.R} = ${money(values(p).act)}` : `${p.toFixed(1)}×${s.L} = ${money(values(p).wait)}`;}
  function render(){
    const s=scenarios[state.scenario], threshold=(s.C/(s.L-s.R)*100).toFixed(1)+'%';
    document.getElementById('cVal').textContent=s.C; document.getElementById('lVal').textContent=s.L;document.getElementById('rVal').textContent=s.R;document.getElementById('threshold').textContent=threshold;
    document.querySelectorAll('.scenario-tab').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scenario===state.scenario)));
    cards.innerHTML=probs.map((p,i)=>{
      const chosen=state.choices[i], best=bestFor(p), v=values(p), isDone=chosen!==undefined;
      const label=best==='act'?'现在行动':'继续等待';
      return `<article class="decision-card ${isDone?'done':''}" aria-label="影响概率 ${Math.round(p*100)}%">
        <div class="prob-row"><span class="prob">${Math.round(p*100)}%</span><span class="prob-note">影响概率固定</span></div>
        <div class="question">现在行动，还是继续等待？</div>
        <div class="choice-row" role="group" aria-label="${Math.round(p*100)}%时的选择">
          <button class="choice ${chosen==='act'?'selected':''}" data-index="${i}" data-choice="act" ${isDone?'disabled':''}>现在行动</button>
          <button class="choice ${chosen==='wait'?'selected':''}" data-index="${i}" data-choice="wait" ${isDone?'disabled':''}>继续等待</button>
        </div>
        <div class="cost-row ${isDone?'revealed':''} ${isDone&&best==='act'?'low':''}"><span class="cost-name">行动期望代价 C + p × R</span><span class="cost-value">${isDone?formula('act',p):'选择后展开计算'}</span></div>
        <div class="cost-row ${isDone?'revealed':''} ${isDone&&best==='wait'?'low':''}"><span class="cost-name">等待期望代价 p × L</span><span class="cost-value">${isDone?formula('wait',p):'选择后展开计算'}</span></div>
        <div class="feedback">${isDone?`你选了“${chosen==='act'?'现在行动':'继续等待'}”。按本局规则，<strong>${label}</strong>的期望代价较低。`:'先选择一项；两种计算会同时出现。'}</div>
      </article>`;
    }).join('');
    if(state.phase==='complete'){
      const extra=probs.reduce((sum,p,i)=>{const v=values(p);return sum+(state.choices[i]==='act'?v.act:v.wait)-Math.min(v.act,v.wait)},0);
      result.className='round-result complete'; result.innerHTML=`<strong>本轮完成：额外代价 ${money(extra)}。</strong> 这是所选方案相对每张卡较低期望代价的差额之和。换一局，观察阈值如何移动。`;
    }else{
      const left=probs.length-Object.keys(state.choices).length;
      result.className='round-result'; result.innerHTML=`<strong>${left===3?'先从任意一张概率卡开始。':`还差 ${left} 张卡。`}</strong> 选择会改变本轮已完成的判断；同一局中，每张卡只能作一次选择。`;
    }
    stage.dispatchEvent(new CustomEvent('notale:learning-state',{bubbles:true,composed:true,detail:{action:'render',phase:state.phase,turn:state.turn,complete:state.phase==='complete'}}));
  }
  function act(action){state=transition(state,action);render();}
  cards.addEventListener('click',e=>{const b=e.target.closest('.choice');if(b)act({type:'choose',index:+b.dataset.index,choice:b.dataset.choice});});
  cards.addEventListener('keydown',e=>{
    const b=e.target.closest('.choice');if(!b)return;
    const index=+b.dataset.index, choice=b.dataset.choice;
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();e.stopPropagation();b.parentElement.querySelector(`[data-choice="${choice==='act'?'wait':'act'}"]`).focus();}
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();e.stopPropagation();const next=Math.max(0,Math.min(probs.length-1,index+(e.key==='ArrowUp'?-1:1)));const target=cards.querySelector(`.choice[data-index="${next}"][data-choice="${choice}"]:not(:disabled)`);if(target)target.focus();}
  });
  document.querySelector('.scenario-tabs').addEventListener('click',e=>{const b=e.target.closest('.scenario-tab');if(b&&b.dataset.scenario!==state.scenario)act({type:'scenario',scenario:b.dataset.scenario});});
  document.getElementById('reset').addEventListener('click',()=>{act({type:'reset'});const first=cards.querySelector('.choice');if(first)first.focus();});
  window.addEventListener('pagehide',()=>{cards.replaceWith(cards.cloneNode(false));},{once:true});
  render();
})();
</script>
</body>
</html>
