model:
  base_url: "https://openrouter.ai/api/v1"
  name: "anthropic/claude-sonnet-5"
  api_key_env: "OPENROUTER_API_KEY"
  http_timeout_sec: 600
  max_output_tokens: 128000
  reasoning_effort: "medium"

agents:
  planner:
    max_turns: 64
    max_duration_sec: 3600
  builder:
    max_turns: 64
    max_duration_sec: 3600

pipeline:
  page_concurrency: 25
  run_timeout_sec: 21600
  fallback_title_max_chars: 40

tools:
  page_read_default_chars: 12000
  page_read_max_chars: 30000
  inline_js_check_timeout_sec: 15
  inline_js_error_max_chars: 1200
  block_reason_max_chars: 1000
  run_js_timeout_sec: 10
  run_js_max_source_chars: 20000
  run_js_max_output_chars: 4000
  run_js_max_calls: 4

media:
  wikimedia_api_url: "https://commons.wikimedia.org/w/api.php"
  wikimedia_user_agent: "Notale/0.1 (offline lecture asset acquisition)"
  search_results: 5
  thumbnail_width_px: 1600
  request_timeout_sec: 60
  maximum_download_bytes: 20971520
  minimum_image_bytes: 1024
  generation_endpoint: "https://llmapi.paratera.com/v1/images/generations"
  generation_api_key_env: "PARATERA_API_KEY"
  generation_model: "Doubao-Seedream-4.0"
  maximum_find_per_page: 4
  maximum_make_per_page: 2
  maximum_find_per_run: 20
  maximum_make_per_run: 8

preview:
  host: "0.0.0.0"
  port: 3002
