model:
  base_url: "https://api.999555999.com"
  name: "gpt-5.6-sol"
  api_key_env: "API_KEY"
  wire_api: "responses"
  http_timeout_sec: 600
  max_output_tokens: 128000
  reasoning_effort: "medium"

agents:
  planner:
    max_turns: 64
    max_duration_sec: 3600
  builder:
    max_turns: 64
    max_duration_sec: 3600

pipeline:
  page_concurrency: 4
  run_timeout_sec: 21600
  fallback_title_max_chars: 40

tools:
  page_read_default_chars: 12000
  page_read_max_chars: 30000
  inline_js_check_timeout_sec: 15
  inline_js_error_max_chars: 1200
  block_reason_max_chars: 1000
  run_js_timeout_sec: 10
  run_js_max_source_chars: 20000
  run_js_max_output_chars: 4000
  run_js_max_calls: 4
  node_process_concurrency: 4
  node_timeout_retries: 1

media:
  wikimedia_api_url: "https://commons.wikimedia.org/w/api.php"
  wikimedia_user_agent: "Notale/0.1 (offline lecture asset acquisition)"
  search_results: 5
  thumbnail_width_px: 1600
  request_timeout_sec: 60
  maximum_download_bytes: 20971520
  minimum_image_bytes: 1024
  generation_endpoint: "https://llmapi.paratera.com/v1/images/generations"
  generation_api_key_env: "PARATERA_API_KEY"
  generation_model: "Doubao-Seedream-4.0"
  # Image backend for make_image / make_backplate. See tools/media_backends.py.
  backend: "seedream"
  maximum_find_per_page: 4
  maximum_make_per_page: 2
  maximum_find_per_run: 20
  maximum_make_per_run: 8

components:
  min_width_px: 480
  max_width_px: 1180
  min_height_px: 280
  max_height_px: 560
  max_output_tokens: 16000
  validation_timeout_sec: 8
  validation_error_max_chars: 1600
  maximum_repair_calls: 1

inspection:
  browser_concurrency: 4
  browser_timeout_sec: 45
  render_settle_ms: 500
  browser_path_env: "NOTALE_BROWSER_PATH"
  maximum_revisions: 4

preview:
  host: "0.0.0.0"
  port: 3002

style:
  # Parent pack a generated run forks from, and the fallback when no --style-pack
  # is given. Any published pack id or alias from `notale style list`.
  default_pack: "notale-default"
  # Set false to require an explicit --style-pack and never spend a model call
  # inventing a style.
  allow_generation: true
  # Representative pages rendered as visual baselines when a pack is published.
  exemplar_pages: 2
