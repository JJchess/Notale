schema_version: 10

versions:
  agent_protocol: "8"
  logging_schema: "6"

model:
  base_url: "https://llmapi.paratera.com/v1"
  name: "Claude-Sonnet-5"
  api_key_env: "PARATERA_API_KEY"
  http_timeout_sec: 600

model_capabilities:
  context_window_tokens: 1000000
  max_output_tokens: 128000

governance:
  progress:
    no_progress_turns: 8
    repeated_tool_error_limit: 3
    repeated_validation_error_limit: 3
    prose_only_turns: 3
  emergency_limits:
    provider_timeout_sec: 600
    provider_max_attempts: 2
    query_max_turns: 32
    query_max_duration_sec: 1800
    worker_max_turns: 128
    worker_max_duration_sec: 3600
    worker_max_total_tokens: 8000000
    run_max_duration_sec: 21600
    run_max_total_tokens: 250000000

agents:
  defaults:
    auto_compact_threshold_tokens: 160000

  roles:
    intake:
      auto_compact_threshold_tokens: 64000

    research:
      auto_compact_threshold_tokens: 160000

    planner:
      auto_compact_threshold_tokens: 240000

    builder:
      auto_compact_threshold_tokens: 160000

  planner_deck_design:
    enabled: true
    skill: frontend-slides
    entrypoint: planner-contract

  builder_page_design:
    enabled: true
    skill: frontend-slides
    entrypoint: notale-page

  builder_skills:
    - page-builder-core
    - frontend-slides
    - create-sim
    - create-code-runtime
    - aframe-webxr
    - animejs
    - babylonjs-engine
    - barba-js
    - canvas-design
    - d3-viz

runtime:
  context_token_safety_factor: 1.34
  minimum_message_compact_threshold_tokens: 512
  tool_receipt_preview_chars: 200
  parsing_error_preview_chars: 200
  agent_failure_reason_max_chars: 300
  cli_message_preview_chars: 50
  run_id_suffix_chars: 6

pipeline:
  page_concurrency: 8
  default_duration_min: 45
  maximum_page_count: 80
  default_page_time_budget_sec: 90
  fallback_title_max_chars: 40

research:
  enabled: true
  branches:
    - id: r1
      enabled: true
      focus: 教学序列
      skills: [research-evidence, web-access]
      tools: [web_search, fetch_web]
    - id: r2
      enabled: true
      focus: 例题与反例
      skills: [research-evidence, web-access]
      tools: [web_search, fetch_web]
    - id: r3
      enabled: true
      focus: 常见误解
      skills: [research-evidence, web-access]
      tools: [web_search, fetch_web]
    - id: r4
      enabled: true
      focus: 素材史料数据
      skills: [research-evidence, web-access]
      tools: [web_search, fetch_web]
  web_search_max_requests_per_branch: 2
  fetch_max_requests_per_branch: 4
  max_notes_per_branch: 3
  max_records_per_branch: 4
  max_pedagogy_per_branch: 3
  fetch_excerpt_chars: 8000

tools:
  chunk_max_chars: 12000
  skill_chunk_default_chars: 12000
  skill_chunk_min_chars: 256
  artifact_chunk_default_chars: 12000
  context_chunk_default_chars: 12000
  context_chunk_min_chars: 256
  page_read_default_chars: 6000
  search_default_results: 20
  search_max_results: 100
  web_search_default_results: 5
  web_search_max_results: 8
  inline_js_check_timeout_sec: 15
  inline_js_error_max_chars: 1200
  fetch_error_max_chars: 300
  blocker_reason_max_chars: 1000
  blocker_evidence_max_chars: 2000
  retriever_timeout_sec: 30
  retriever_max_chars: 20000
  retriever_max_redirects: 5
  retriever_html_detection_prefix_chars: 2000
  fetch_query_term_min_chars: 2
  fetch_excerpt_lead_divisor: 4

media:
  wikimedia_api_url: "https://commons.wikimedia.org/w/api.php"
  wikimedia_user_agent: "Notale/0.1 (offline lecture asset acquisition)"
  search_results: 5
  thumbnail_width_px: 1600
  request_timeout_sec: 60
  maximum_download_bytes: 20971520
  minimum_image_bytes: 1024
  generation_endpoint: "https://llmapi.paratera.com/v1/images/generations"
  generation_api_key_env: "PARATERA_API_KEY"
  generation_model: "Doubao-Seedream-4.0"
  maximum_acquisitions_per_page: 4
  maximum_generations_per_page: 2
  maximum_acquisitions_per_run: 20
  maximum_generations_per_run: 8

duration_model:
  page_count_minimum: 3
  page_count_low_per_minute: 0.5
  page_count_high_per_minute: 0.65
  chapter_count_minimum: 2
  chapter_count_maximum: 10
  pages_per_chapter: 5
  seconds_per_minute: 60
  page_type_minutes:
    section-break: 0.5
    narrative-scene: 1.5
    worked-example: 2.0
    formula-derivation: 2.0
    code-runnable: 2.5
    quiz-check: 1.5
    sim-explorable: 3.5

deck:
  duplicate_similarity_threshold: 0.6
  duplicate_shingle_size: 5

preview:
  host: "0.0.0.0"
  port: 3002
