examples:
  - family: playful-system
    topic: graph algorithms
    concept: "A transit garden where paths illuminate as the learner searches the network."
    motif: glowing path
    palette_logic: "dark field + lime active path + coral reader trace"
    motion: [trace, pulse, replay]

  - family: illustrated-journey
    topic: human development
    concept: "A continuous illustrated path through rooms that represent life stages."
    motif: doorway
    palette_logic: "warm neutral scenes with one emotional accent per chapter"
    motion: [enter, pan, reveal]

  - family: scrapbook-pop
    topic: history of pop culture
    concept: "A fan scrapbook whose artifacts accumulate across eras."
    motif: tape strip
    palette_logic: "era accent shifts on a stable paper field"
    motion: [stack, peel, snap]

  - family: archival-object
    topic: primary-source history
    concept: "A reading table where documents are examined, cropped, and compared."
    motif: catalog number
    palette_logic: "warm paper, ink, one red annotation accent"
    motion: [crop, zoom, return]

  - family: cartographic-field
    topic: urban migration
    concept: "The city itself is the page; paths accumulate until neighborhoods emerge."
    motif: contour/path
    palette_logic: "quiet map base + one origin color + one destination color"
    motion: [trace, flood, zoom]

  - family: sonic-timeline
    topic: recurring musical themes
    concept: "A horizontal score where motifs keep their identity as they recur."
    motif: colored motif capsule
    palette_logic: "near-monochrome score + fixed semantic motif colors"
    motion: [playhead, highlight, accumulate]

  - family: graphic-editorial
    topic: social-science claim
    concept: "A bold editorial argument in which one chart is treated like a poster object."
    motif: rule line
    palette_logic: "paper + ink + one signal accent"
    motion: [isolate, compare, reveal]

  - family: technical-world
    topic: cell respiration
    concept: "A cutaway mitochondrion whose pathways illuminate as energy moves through it."
    motif: energy packet
    palette_logic: "neutral structure + semantic pathway colors"
    motion: [trace, accumulate, recompose]
