visual_world:
  id: signal-garden
  metaphor: "learning as routing a signal through a living network"
  hero_model: "node-link signal garden"
  persistent_geometry: "10 named nodes with stable coordinates"

interaction:
  enabled: true
  grammar: navigate
  reader_goal: "route the signal from START to RECEIVER"
  captured_events: [move, timestamp, previous_state]
  derived_metrics: [path_length, backtracks, longest_pause, route_efficiency]
  personalized_reveal: "replay the reader's exact route, annotate longest pause, then place efficiency into a population field"

art_direction:
  family: playful-system
  concept: "A nocturnal signal garden whose paths glow as the reader moves through it."
  emotional_register: curious
  shape_language:
    primitives: [node, path, orbit]
    corner_behavior: round
    stroke_behavior: chunky
  material_language:
    surface: matte
    texture: dotted-night-field
    depth: flat-with-glow
  palette:
    base: deep-aubergine
    accent_primary: acid-lime
    accent_secondary: coral
    target: violet
  typography_roles:
    display: expressive-serif
    body: quiet-sans
    numeric: large-serif
  media_treatment:
    crop: none
    mask: none
  motion_verbs: [trace, pulse, replay, flood, return]
  recurring_motif: glowing-path
  forbidden_visual_vocabulary: [cards, dashboard, blue-purple-gradient, generic-icons]

rhythm:
  section_arc: [hook, play, personal-reveal, focus, zoom-out, rupture, breath, echo]

slides:
  - claim: "Enter the world before explanation."
    state: establish
    grammar: visual-world
    beat: hook
    density: sparse
    scale: monumental
    motion: guided
    participation: observe
    color_energy: normal
    text_load: short
    transition_verb: enter

  - claim: "The reader creates a route."
    state: trace
    grammar: hero-simulation
    beat: play
    density: medium
    scale: normal
    motion: active
    participation: manipulate
    color_energy: normal
    text_load: phrase
    transition_verb: trace

  - claim: "The article can reflect the reader's own behavior."
    state: replay-reader
    grammar: annotated-model
    beat: personal-reveal
    density: medium
    scale: normal
    motion: still
    participation: reveal-self
    color_energy: normal
    text_load: short
    transition_verb: replay

implementation:
  primary_backend: svg
  secondary_backend: html
  reader_trace_storage: memory
