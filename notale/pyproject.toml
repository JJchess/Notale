[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "notale"
version = "0.1.0"
description = "Harness-driven pipeline for generating Reveal.js HTML-native lecture decks."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "websockets>=14.0",
    # Transport only; the model/tool loop lives in notale.agents.loop.
    "openai>=2.53,<3",
]

[project.scripts]
notale = "notale.cli.main:main"

[dependency-groups]
dev = [
    "brotli==1.1.0",
    "fonttools[woff]==4.59.1",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
package-dir = {notale = "."}
packages = [
    "notale",
    "notale.agents",
    "notale.cli",
    "notale.core",
    "notale.core.stages",
    "notale.roles",
    "notale.style_studio",
    "notale.style_studio.build",
    "notale.tools",
    "notale.tools.create_code_runtime",
    "notale.tools.create_widget",
    "notale.utils",
    "notale.web",
]
include-package-data = true

[tool.setuptools.package-data]
notale = ["config.yaml", "LICENSES/*", "roles/*.md", "skills/**/*", "styles/lab/*.json", "styles/packs/registry.json", "styles/packs/schema/*.json", "styles/packs/presets/**/*", "tools/create_code_runtime/assets/*", "tools/create_widget/assets/**/*", "web/fonts/**/*", "web/runtime/*", "web/vendor/reveal/reveal.*", "web/vendor/reveal/plugin/notes.*"]
