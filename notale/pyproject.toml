[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "notale"
version = "0.1.0"
description = "Harness-driven pipeline for generating Reveal.js HTML-native lecture decks."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    # agent 运行时底座（spike GO）。注意：它会拉入 discord/slack/lark/telegram 等
    # channel/TUI 硬依赖（磁盘死重，import 不加载），详见 docs/openharness-spike.md 坑清单。
    "openharness-ai>=0.1.9",
]

[project.scripts]
notale = "notale.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
package-dir = {notale = "."}
packages = [
    "notale",
    "notale.agents",
    "notale.cli",
    "notale.core",
    "notale.core.stages",
    "notale.roles",
    "notale.tools",
    "notale.utils",
    "notale.web",
]
include-package-data = true

[tool.setuptools.package-data]
notale = ["skills/**/*", "web/runtime/*", "web/vendor/reveal/*", "web/vendor/reveal/plugin/*"]
