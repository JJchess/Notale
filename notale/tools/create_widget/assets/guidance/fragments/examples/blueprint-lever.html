<style>
  .bp { background-color: #F4F7FB;
        background-image: linear-gradient(rgba(30,77,140,.07) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(30,77,140,.07) 1px, transparent 1px);
        background-size: 24px 24px; border: 1px solid #C7D6EA; border-radius: 8px; padding: 20px;
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; color: #1E4D8C; }
  .fig { font-size: 12px; letter-spacing: .14em; margin-bottom: 8px; }
  .bp svg { display: block; width: 100%; height: auto; }
  .pivot { transition: transform .2s linear; }
  .ctl { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .ctl label { font-size: 12px; letter-spacing: .05em; }
  .bp input[type=range] { flex: 1; min-width: 160px; height: 3px; background: #C7D6EA;
                          border-radius: 0; }
  .bp input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px;
        background: #D97706; border: 1px solid #1E4D8C; border-radius: 2px; cursor: pointer; }
  .out { display: flex; gap: 20px; margin-top: 10px; font-size: 13px;
         font-variant-numeric: tabular-nums; flex-wrap: wrap; }
  .out b { color: #D97706; font-weight: 500; }
</style>
<div class="bp">
  <div class="fig">FIG. 1 &mdash; LEVER BALANCE &middot; F1·d1 = F2·d2</div>
  <svg viewBox="0 0 680 250">
    <line x1="60" y1="120" x2="620" y2="120" stroke="#1E4D8C" stroke-width="4" stroke-linecap="round"/>
    <g id="pivot" class="pivot">
      <path d="M0 122 L-22 168 L22 168 Z" fill="#D97706" stroke="#1E4D8C" stroke-width="1.5"/>
      <line x1="0" y1="40" x2="0" y2="120" stroke="#1E4D8C" stroke-width="1" stroke-dasharray="6 4"/>
    </g>
    <g>
      <rect x="78" y="78" width="44" height="40" fill="none" stroke="#1E4D8C" stroke-width="1.5"/>
      <text x="100" y="103" text-anchor="middle" font-size="13" fill="#1E4D8C">10kg</text>
      <line x1="100" y1="60" x2="100" y2="76" stroke="#1E4D8C" stroke-width="1" stroke-dasharray="6 4"/>
    </g>
    <g id="rweight">
      <rect x="558" y="78" width="44" height="40" fill="none" stroke="#1E4D8C" stroke-width="1.5"/>
      <text id="rlabel" x="580" y="103" text-anchor="middle" font-size="13" fill="#1E4D8C">?</text>
      <line x1="580" y1="60" x2="580" y2="76" stroke="#1E4D8C" stroke-width="1" stroke-dasharray="6 4"/>
    </g>
    <g id="dims" stroke="#1E4D8C" stroke-width="1">
      <line id="dim1" x1="100" y1="196" x2="340" y2="196"/>
      <line x1="100" y1="190" x2="100" y2="202"/>
      <line id="dim1t" x1="340" y1="190" x2="340" y2="202"/>
      <line id="dim2" x1="340" y1="196" x2="580" y2="196"/>
      <line x1="580" y1="190" x2="580" y2="202"/>
    </g>
    <text id="d1txt" x="220" y="216" text-anchor="middle" font-size="12" fill="#1E4D8C">d1 = 2.4 m</text>
    <text id="d2txt" x="460" y="216" text-anchor="middle" font-size="12" fill="#1E4D8C">d2 = 2.4 m</text>
  </svg>
  <div class="ctl">
    <label for="ful">FULCRUM POSITION</label>
    <input type="range" id="ful" min="180" max="500" step="4" value="340">
    <span id="bal">F2 = <b>10.0 kg</b></span>
  </div>
  <div class="out">
    <span>Lever span: 4.8 m</span>
    <span>Mechanical advantage: <b id="ma">1.00</b></span>
  </div>
</div>
<script>
  const M_PER_PX = 4.8 / 480;
  const ful = document.getElementById('ful');
  function update() {
    const x = parseInt(ful.value, 10);
    document.getElementById('pivot').style.transform = `translate(${x}px, 0)`;
    const d1px = x - 100, d2px = 580 - x;
    const d1 = d1px * M_PER_PX, d2 = d2px * M_PER_PX;
    const f2 = 10 * d1 / d2;
    document.getElementById('dim1').setAttribute('x2', x);
    document.getElementById('dim1t').setAttribute('x1', x);
    document.getElementById('dim1t').setAttribute('x2', x);
    document.getElementById('dim2').setAttribute('x1', x);
    const t1 = document.getElementById('d1txt'), t2 = document.getElementById('d2txt');
    t1.setAttribute('x', 100 + d1px / 2);
    t2.setAttribute('x', x + d2px / 2);
    t1.textContent = `d1 = ${d1.toFixed(1)} m`;
    t2.textContent = `d2 = ${d2.toFixed(1)} m`;
    document.getElementById('rlabel').textContent = f2 >= 100 ? '!!' : f2.toFixed(1) + 'kg';
    document.getElementById('bal').innerHTML = `F2 = <b>${f2.toFixed(1)} kg</b>`;
    document.getElementById('ma').textContent = (d1 / d2).toFixed(2);
  }
  ful.addEventListener('input', update);
  update();
</script>
