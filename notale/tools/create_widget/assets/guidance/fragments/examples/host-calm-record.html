<div style="font-family: var(--font-sans); color: var(--color-text-primary);">
  <div style="display: flex; gap: 8px; margin-bottom: 16px;" id="chips">
    <button data-f="all" style="border-radius: 999px; font-size: 13px; padding: 5px 14px;">All</button>
    <button data-f="active" style="border-radius: 999px; font-size: 13px; padding: 5px 14px;">Active</button>
    <button data-f="paused" style="border-radius: 999px; font-size: 13px; padding: 5px 14px;">Paused</button>
  </div>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px;">
    <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem;">
      <div style="font-size: 13px; color: var(--color-text-secondary);">Monthly spend</div>
      <div style="font-size: 24px; font-weight: 500; margin-top: 4px;">$1,284</div>
    </div>
    <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem;">
      <div style="font-size: 13px; color: var(--color-text-secondary);">Active projects</div>
      <div style="font-size: 24px; font-weight: 500; margin-top: 4px;" id="activeCount">3</div>
    </div>
  </div>
  <div style="background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden;">
    <div class="row" data-s="active" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 0.5px solid var(--color-border-tertiary); transition: background .15s;">
      <span style="font-size: 14px;">Atlas pipeline</span>
      <span style="font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--color-background-success); color: var(--color-text-success);">Active</span>
    </div>
    <div class="row" data-s="active" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 0.5px solid var(--color-border-tertiary); transition: background .15s;">
      <span style="font-size: 14px;">Billing service</span>
      <span style="font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--color-background-success); color: var(--color-text-success);">Active</span>
    </div>
    <div class="row" data-s="paused" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 0.5px solid var(--color-border-tertiary); transition: background .15s;">
      <span style="font-size: 14px;">Legacy importer</span>
      <span style="font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--color-background-warning); color: var(--color-text-warning);">Paused</span>
    </div>
    <div class="row" data-s="active" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; transition: background .15s;">
      <span style="font-size: 14px;">Docs site</span>
      <span style="font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--color-background-success); color: var(--color-text-success);">Active</span>
    </div>
  </div>
</div>
<script>
  const chips = document.querySelectorAll('#chips button');
  const rows = document.querySelectorAll('.row');
  rows.forEach(r => {
    r.addEventListener('mouseenter', () => { r.style.background = 'var(--color-background-secondary)'; });
    r.addEventListener('mouseleave', () => { r.style.background = 'transparent'; });
  });
  function applyFilter(f) {
    chips.forEach(c => {
      const on = c.dataset.f === f;
      c.style.background = on ? 'var(--color-background-info)' : 'transparent';
      c.style.color = on ? 'var(--color-text-info)' : 'var(--color-text-primary)';
      c.style.borderColor = on ? 'var(--color-border-info)' : 'var(--color-border-secondary)';
    });
    let visible = 0;
    rows.forEach(r => {
      const show = f === 'all' || r.dataset.s === f;
      r.style.display = show ? 'flex' : 'none';
      if (show && r.dataset.s === 'active') visible += 1;
    });
  }
  chips.forEach(c => c.addEventListener('click', () => applyFilter(c.dataset.f)));
  applyFilter('all');
</script>
