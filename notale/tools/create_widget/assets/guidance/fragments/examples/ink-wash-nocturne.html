<style>
  .scroll { background: #F5F1E8; border-radius: 6px; padding: 24px;
            font-family: Georgia, 'Times New Roman', 'Noto Serif SC', serif; color: #2A2D30;
            max-width: 720px; margin: 0 auto; }
  .scroll canvas { display: block; width: 100%; height: auto; }
  .colophon { display: flex; justify-content: space-between; align-items: flex-end;
              gap: 16px; margin-top: 14px; flex-wrap: wrap; }
  .verse { font-size: 17px; letter-spacing: .32em; line-height: 2; transition: opacity .8s ease; }
  .verse.inkin { opacity: 0; }
  .side { display: flex; align-items: flex-end; gap: 14px; }
  .brush { background: transparent; border: 1px solid #2A2D30; color: #2A2D30; border-radius: 2px;
           padding: 6px 16px; font-family: inherit; font-size: 13px; letter-spacing: .2em;
           cursor: pointer; transition: background .25s, color .25s; }
  .brush:hover { background: #2A2D30; color: #F5F1E8; }
  .brush:active { transform: translateY(1px); }
  .seal { writing-mode: vertical-rl; font-size: 12px; color: #F5F1E8; background: #9E2B22;
          padding: 7px 4px; border-radius: 2px; letter-spacing: 3px; transform: rotate(-3deg);
          user-select: none; }
</style>
<div class="scroll">
  <canvas id="ink" width="680" height="380"></canvas>
  <div class="colophon">
    <div class="verse" id="verse">床前明月光，疑是地上霜。</div>
    <div class="side">
      <button class="brush" id="again">另作一幅</button>
      <div class="seal">靜夜思</div>
    </div>
  </div>
</div>
<script>
  const cv = document.getElementById('ink'), ctx = cv.getContext('2d');
  function noise1d(n) {
    const a = Array.from({ length: n + 1 }, Math.random);
    return (x) => {
      const i = Math.min(Math.floor(x * n), n - 1), f = x * n - i;
      const u = (1 - Math.cos(f * Math.PI)) / 2;
      return a[i] * (1 - u) + a[i + 1] * u;
    };
  }
  function ridge(baseY, amp, detail, alpha) {
    const f1 = noise1d(detail), f2 = noise1d(detail * 3);
    ctx.beginPath();
    ctx.moveTo(-10, 380);
    for (let x = -10; x <= 690; x += 4) {
      const t = (x + 10) / 700;
      ctx.lineTo(x, baseY - f1(t) * amp - f2(t) * amp * 0.25);
    }
    ctx.lineTo(690, 380);
    ctx.closePath();
    ctx.fillStyle = `rgba(42, 45, 48, ${alpha})`;
    ctx.fill();
  }
  function paint() {
    ctx.clearRect(0, 0, 680, 380);
    const mx = 130 + Math.random() * 420, my = 64 + Math.random() * 44;
    const glow = ctx.createRadialGradient(mx, my, 6, mx, my, 64);
    glow.addColorStop(0, 'rgba(229, 193, 88, .5)');
    glow.addColorStop(1, 'rgba(229, 193, 88, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(mx - 70, my - 70, 140, 140);
    ctx.beginPath();
    ctx.arc(mx, my, 21, 0, Math.PI * 2);
    ctx.fillStyle = '#E9D9A8';
    ctx.fill();
    ridge(322, 150 + Math.random() * 40, 5, 0.16);
    ridge(348, 110 + Math.random() * 30, 7, 0.30);
    ctx.fillStyle = 'rgba(245, 241, 232, .14)';
    for (let i = 0; i < 16; i++) {
      const w = 300 + Math.random() * 380;
      ctx.fillRect(Math.random() * (680 - w), 238 + Math.random() * 64, w, 3 + Math.random() * 5);
    }
    ridge(374, 80 + Math.random() * 24, 10, 0.52);
    ctx.fillStyle = 'rgba(42, 45, 48, .035)';
    for (let i = 0; i < 320; i++) {
      ctx.fillRect(Math.random() * 680, Math.random() * 380, 1.3, 1.3);
    }
  }
  const verse = document.getElementById('verse');
  document.getElementById('again').addEventListener('click', () => {
    verse.classList.add('inkin');
    paint();
    setTimeout(() => verse.classList.remove('inkin'), 120);
  });
  paint();
</script>
