<style>
  .page { background: #FAF6EE; color: #272420; border-radius: 14px; padding: 36px 32px 24px;
          font-family: Georgia, 'Times New Roman', serif; max-width: 620px; margin: 0 auto; }
  .mark { font-size: 64px; line-height: .6; color: #C2410C; display: block; height: 34px; }
  .page h2 { font-size: 28px; font-weight: 400; margin: 0 0 4px; }
  .by { font-family: var(--font-sans); font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
        color: #8A8273; margin-bottom: 18px; }
  .rule { border: 0; border-top: 1px solid #D6CDBD; margin: 16px 0; }
  .stanza { font-size: 17px; line-height: 1.85; min-height: 165px; white-space: pre-line;
            transition: opacity .45s ease; }
  .stanza.fading { opacity: 0; }
  .nav { display: flex; align-items: center; justify-content: space-between;
         font-family: var(--font-sans); }
  .pos { font-size: 12px; color: #8A8273; letter-spacing: .1em; }
  .page button { background: transparent; border: 1px solid #C2410C; color: #C2410C; border-radius: 4px;
                 padding: 6px 18px; font-family: Georgia, serif; font-size: 14px; font-style: italic;
                 cursor: pointer; transition: background .2s, color .2s; }
  .page button:hover { background: #C2410C; color: #FAF6EE; }
  .page button:active { transform: translateY(1px); }
  @media (prefers-color-scheme: dark) {
    .page { background: #221E18; color: #E8E2D6; }
    .rule { border-top-color: #4A4338; }
    .by, .pos { color: #9A917F; }
  }
</style>
<div class="page">
  <span class="mark">&ldquo;</span>
  <h2>The Road Not Taken</h2>
  <div class="by">Robert Frost &middot; 1916</div>
  <hr class="rule">
  <div class="stanza" id="stanza"></div>
  <hr class="rule">
  <div class="nav">
    <span class="pos" id="pos">I / IV</span>
    <button id="next">Next stanza &rarr;</button>
  </div>
</div>
<script>
  const stanzas = [
    "Two roads diverged in a yellow wood,\nAnd sorry I could not travel both\nAnd be one traveler, long I stood\nAnd looked down one as far as I could\nTo where it bent in the undergrowth;",
    "Then took the other, as just as fair,\nAnd having perhaps the better claim,\nBecause it was grassy and wanted wear;\nThough as for that the passing there\nHad worn them really about the same,",
    "And both that morning equally lay\nIn leaves no step had trodden black.\nOh, I kept the first for another day!\nYet knowing how way leads on to way,\nI doubted if I should ever come back.",
    "I shall be telling this with a sigh\nSomewhere ages and ages hence:\nTwo roads diverged in a wood, and I,\nI took the one less traveled by,\nAnd that has made all the difference."
  ];
  const roman = ['I', 'II', 'III', 'IV'];
  let i = 0;
  const el = document.getElementById('stanza');
  const pos = document.getElementById('pos');
  function show() { el.textContent = stanzas[i]; pos.textContent = roman[i] + ' / IV'; }
  document.getElementById('next').addEventListener('click', () => {
    el.classList.add('fading');
    setTimeout(() => { i = (i + 1) % stanzas.length; show(); el.classList.remove('fading'); }, 450);
  });
  show();
</script>
