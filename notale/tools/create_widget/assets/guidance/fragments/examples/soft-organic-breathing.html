<style>
  .field { background: #FBF9F4; border-radius: 24px; padding: 28px 24px; text-align: center;
           font-family: var(--font-sans); color: #3A5A50; }
  .field h2 { font-size: 19px; font-weight: 500; margin: 0 0 6px; }
  .hint { font-size: 13px; color: #7C8A77; margin-bottom: 12px; }
  .pond { position: relative; height: 250px; display: flex; align-items: center; justify-content: center; }
  .halo, .blob { position: absolute; left: 50%; top: 50%; }
  .halo { width: 210px; height: 210px; background: rgba(132,169,140,.18);
          border-radius: 52% 48% 47% 53% / 55% 46% 54% 45%;
          transform: translate(-50%, -50%) scale(1); transition: transform 5s ease-in-out; }
  .halo.h2 { width: 250px; height: 250px; background: rgba(132,169,140,.10);
             border-radius: 47% 53% 56% 44% / 46% 55% 45% 54%; transition-duration: 6s; }
  .blob { width: 150px; height: 150px; background: #84A98C;
          border-radius: 58% 42% 55% 45% / 48% 55% 45% 52%;
          transform: translate(-50%, -50%) scale(1); transition: transform 4s ease-in-out;
          display: flex; align-items: center; justify-content: center; }
  .count { color: #FBF9F4; font-size: 30px; font-weight: 500;
           font-variant-numeric: tabular-nums; }
  .phase { font-size: 17px; min-height: 24px; margin: 6px 0 14px; transition: color .5s; }
  .phase.in { color: #3A5A50; }
  .phase.out { color: #E07A5F; }
  .go { border: 0; border-radius: 999px; background: #84A98C; color: #FFFFFF; font-size: 15px;
        padding: 10px 32px; cursor: pointer; transition: transform .3s ease-in-out, background .3s; }
  .go:hover { transform: scale(1.04); background: #6E927A; }
  .go:active { transform: scale(.98); }
  @media (prefers-reduced-motion: reduce) { .blob, .halo { transition: none; } }
  @media (prefers-color-scheme: dark) {
    .field { background: #1F231F; color: #D9E2D6; }
    .hint { color: #93A38E; }
  }
</style>
<div class="field">
  <h2>4 &middot; 4 &middot; 6 breathing</h2>
  <div class="hint">Follow the circle &mdash; in through the nose, out through the mouth</div>
  <div class="pond">
    <div class="halo h2" id="h2"></div>
    <div class="halo" id="h1"></div>
    <div class="blob" id="blob"><span class="count" id="count">4</span></div>
  </div>
  <div class="phase in" id="phase">Ready when you are</div>
  <button class="go" id="go">Begin</button>
</div>
<script>
  const PHASES = [
    { name: 'Breathe in', secs: 4, scale: 1.45, cls: 'in' },
    { name: 'Hold', secs: 4, scale: 1.45, cls: 'in' },
    { name: 'Breathe out', secs: 6, scale: 1, cls: 'out' }
  ];
  const blob = document.getElementById('blob'), h1 = document.getElementById('h1'),
        h2 = document.getElementById('h2'), phaseEl = document.getElementById('phase'),
        countEl = document.getElementById('count'), go = document.getElementById('go');
  let running = false, pi = 0, left = 0, timer = null;
  function setScale(s, secs) {
    [blob, h1, h2].forEach(el => {
      el.style.transitionDuration = secs + 's';
      el.style.transform = `translate(-50%, -50%) scale(${s})`;
    });
  }
  function enter(i) {
    pi = i;
    const p = PHASES[i];
    left = p.secs;
    phaseEl.textContent = p.name;
    phaseEl.className = 'phase ' + p.cls;
    countEl.textContent = left;
    setScale(p.scale, p.secs);
  }
  function tick() {
    left -= 1;
    if (left <= 0) enter((pi + 1) % PHASES.length);
    else countEl.textContent = left;
  }
  go.addEventListener('click', () => {
    running = !running;
    go.textContent = running ? 'Pause' : 'Resume';
    if (running) { enter(0); timer = setInterval(tick, 1000); }
    else { clearInterval(timer); phaseEl.textContent = 'Paused'; }
  });
</script>
