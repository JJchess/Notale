<style>
  .pop { background: #FFFFFF; border: 3px solid #18181B; border-radius: 16px; padding: 24px;
         font-family: var(--font-sans); color: #18181B; max-width: 560px; margin: 0 auto;
         position: relative; }
  .pop h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 18px; }
  .badge { position: absolute; top: -14px; right: 20px; width: 48px; height: 48px; border-radius: 50%;
           background: #FDE047; border: 3px solid #18181B; display: flex; align-items: center;
           justify-content: center; font-weight: 700; font-size: 12px; transform: rotate(8deg); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .lbl { font-weight: 700; font-size: 13px; min-width: 56px; }
  .sw { width: 44px; height: 44px; border: 3px solid #18181B; border-radius: 50%; cursor: pointer;
        box-shadow: 3px 3px 0 #18181B; transition: transform .16s ease-out, box-shadow .16s ease-out; }
  .sw:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 #18181B; }
  .sw:active { transform: translate(0, 0); box-shadow: 2px 2px 0 #18181B; }
  .sw.sel { outline: 3px dashed #18181B; outline-offset: 3px; }
  .mix { margin-top: 20px; border: 3px solid #18181B; border-radius: 16px;
         box-shadow: 6px 6px 0 #18181B; padding: 30px 20px; text-align: center;
         transition: background .3s ease-out, color .3s ease-out; }
  .hex { font-size: 40px; font-weight: 700; letter-spacing: -.02em;
         font-variant-numeric: tabular-nums; }
  .sub { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
         opacity: .75; margin-top: 4px; }
</style>
<div class="pop">
  <div class="badge">MIX</div>
  <h2>Color mixer</h2>
  <div class="row"><span class="lbl">Color A</span><span id="rowA"></span></div>
  <div class="row"><span class="lbl">Color B</span><span id="rowB"></span></div>
  <div class="mix" id="mix">
    <div class="hex" id="hex"></div>
    <div class="sub">A + B blend</div>
  </div>
</div>
<script>
  const PALETTE = ['#7C3AED', '#FDE047', '#FB7185', '#5EEAD4'];
  const state = { A: 0, B: 2 };
  function swatches(rowId, key) {
    const row = document.getElementById(rowId);
    row.style.display = 'inline-flex';
    row.style.gap = '14px';
    PALETTE.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'sw' + (state[key] === i ? ' sel' : '');
      b.style.background = c;
      b.setAttribute('aria-label', key + ' ' + c);
      b.addEventListener('click', () => {
        state[key] = i;
        row.querySelectorAll('.sw').forEach((n, j) => n.classList.toggle('sel', j === i));
        blend();
      });
      row.appendChild(b);
    });
  }
  function blend() {
    const a = PALETTE[state.A], b = PALETTE[state.B];
    const ch = (h, i) => parseInt(h.slice(i, i + 2), 16);
    const mixed = [1, 3, 5].map(i => Math.round((ch(a, i) + ch(b, i)) / 2));
    const hex = '#' + mixed.map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
    const lum = 0.299 * mixed[0] + 0.587 * mixed[1] + 0.114 * mixed[2];
    const box = document.getElementById('mix');
    box.style.background = hex;
    box.style.color = lum > 150 ? '#18181B' : '#FFFFFF';
    document.getElementById('hex').textContent = hex;
  }
  swatches('rowA', 'A');
  swatches('rowB', 'B');
  blend();
</script>
