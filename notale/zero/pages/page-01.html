<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>火箭与轨道 —— 开场与路线图</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* --- 第 1 页专属样式：三问 + 路线图 + 回答面板 ------------------------ */

  .p1-lead{
    position:absolute; left:var(--sp-6); top:74px; right:var(--sp-6);
    font:600 var(--fs-label)/1.3 var(--font-sans); color:var(--text-faint);
    letter-spacing:.02em;
  }

  .p1-questions{
    position:absolute; left:var(--sp-6); right:var(--sp-6); top:100px; height:80px;
    display:flex; gap:var(--sp-4);
  }
  .p1-q{
    flex:1 1 0; min-width:0;
    display:flex; align-items:center; gap:14px;
    transition:border-color .2s, background .2s;
  }
  .p1-q-num{
    flex:0 0 auto; width:32px; text-align:center;
    font:700 22px/1 var(--font-mono); color:var(--accent-2); opacity:.55;
    transition:opacity .2s, color .2s;
  }
  .p1-q-text{
    font:500 var(--fs-body)/1.35 var(--font-sans); color:var(--text-dim);
    transition:color .2s;
  }
  .p1-q.active{ border-color:var(--accent-2); background:rgba(71,224,255,.10); }
  .p1-q.active .p1-q-num{ opacity:1; }
  .p1-q.active .p1-q-text{ color:var(--text); }

  .p1-map{
    position:absolute; left:var(--sp-6); top:198px; width:1496px; height:410px;
  }
  .p1-map-tag{
    position:absolute; left:2px; top:2px;
    font:600 var(--fs-label)/1 var(--font-mono); color:var(--text-faint);
    letter-spacing:.08em; text-transform:uppercase;
  }
  .p1-node{
    position:absolute; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer; z-index:2; padding:8px; margin:-8px;
  }
  .p1-dot{
    width:18px; height:18px; border-radius:50%;
    background:var(--bg3); border:2px solid var(--accent-2);
    box-shadow:0 0 0 4px rgba(71,224,255,.12);
    transition:background .18s, box-shadow .18s, transform .18s;
  }
  .p1-node:hover .p1-dot, .p1-node.active .p1-dot{
    background:var(--accent-2); transform:scale(1.2);
    box-shadow:0 0 0 8px rgba(71,224,255,.28), 0 0 20px rgba(71,224,255,.65);
  }
  .p1-node-label{
    font:600 var(--fs-label)/1.2 var(--font-sans); color:var(--text-dim);
    white-space:nowrap; transition:color .18s;
  }
  .p1-node:hover .p1-node-label, .p1-node.active .p1-node-label{ color:var(--accent-2); }

  .p1-answer{
    position:absolute; left:var(--sp-6); right:var(--sp-6); top:626px; height:140px;
    display:flex; flex-direction:column; justify-content:center; gap:10px;
  }
  .p1-answer-row{ display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap; }
  .p1-answer-q{ font:600 var(--fs-label)/1.3 var(--font-sans); color:var(--accent-3); }
  .p1-answer-detail{ font:400 var(--fs-body)/1.5 var(--font-sans); color:var(--text-dim); }
  .p1-answer-detail b{ color:var(--text); font-weight:600; }
  .p1-answer-go{ font:500 var(--fs-label)/1 var(--font-mono); color:var(--text-faint); }
</style>
</head>
<body data-page="01" data-total="14">
<div id="stage">
  <div class="starfield"></div>

  <div class="pg-head">
    <div>
      <span class="pg-kicker">MODULE 1 · 推进</span>
      <span class="pg-title">火箭与轨道——把东西送上太空，并让它待在那儿</span>
    </div>
    <div class="pg-index">1 / 14</div>
  </div>

  <div class="p1-lead">接下来 90 分钟，我们要依次回答这三个问题：</div>

  <div class="p1-questions">
    <div class="p1-q panel panel-tight" id="q0"><span class="p1-q-num">①</span><span class="p1-q-text">怎么才能离开地面？</span></div>
    <div class="p1-q panel panel-tight" id="q1"><span class="p1-q-num">②</span><span class="p1-q-text">飞起来之后，为什么不会掉下来？</span></div>
    <div class="p1-q panel panel-tight" id="q2"><span class="p1-q-num">③</span><span class="p1-q-text">到了天上，还能去别的地方、还能待多久？</span></div>
  </div>

  <div class="p1-map panel">
    <span class="p1-map-tag">旅程路线图</span>
    <canvas class="cv-fill no-pan" id="mapCanvas"></canvas>
    <!-- 节点由 JS 按弧线坐标定位 -->
  </div>

  <div class="p1-answer panel">
    <div class="p1-answer-row">
      <span class="chip" id="ansChip">选一个节点看看</span>
      <span class="p1-answer-q" id="ansQ"></span>
    </div>
    <div class="p1-answer-detail" id="ansDetail">
      把鼠标移到上面路线图的节点上，看看这堂课准备在哪一步、怎么回答对应的问题——
      <b>点一下节点</b>可以直接翻到那一段。
    </div>
  </div>

  <div class="pg-hint">💡 <b>怎么玩</b>：把鼠标移到路线图的 5 个节点上，预告这堂课会在哪一步回答哪个问题；点一下节点可以直接跳过去。</div>
</div>

<script src="assets/base.js"></script>
<script>
(function(){
  'use strict';

  // --- 路线弧线的几何：地面 → 升起 → 轨道高处 → 再降回地面 -----------------
  var MAP_W = 1496, MAP_H = 410, PAD_X = 40, GROUND = 370, PEAK = 50;

  function hillX(t){ return PAD_X + t * (MAP_W - 2 * PAD_X); }
  function hillY(t){ return GROUND - (GROUND - PEAK) * Math.sin(Math.PI * t); }

  var NODES = [
    { t:0,    label:'发射台', q:0, module:'MODULE 1 · 推进',      href:'page-02.html',
      detail:'先解决<b>怎么产生一个能把自己抬离地面的力</b>——牛顿第三定律、火箭方程、多级火箭。' },
    { t:0.25, label:'入轨',   q:1, module:'MODULE 2 · 入轨',      href:'page-06.html',
      detail:'入轨的关键不是飞得高，是飞得<b>够快、方向够水平</b>——重力转向 + 牛顿大炮思想实验。' },
    { t:0.5,  label:'变轨',   q:2, module:'MODULE 3 · 轨道',      href:'page-08.html',
      detail:'轨道有高度、形状、家族之分，也可以<b>用两次燃烧从一个轨道换到另一个</b>——霍曼转移。' },
    { t:0.75, label:'驻留',   q:2, module:'MODULE 4 · 机动与归来', href:'page-12.html',
      detail:'留在轨道上不是一劳永逸——稀薄大气仍在<b>悄悄蹭掉速度</b>，需要不时抬升维持。' },
    { t:1,    label:'归来',   q:2, module:'MODULE 4 · 机动与归来', href:'page-13.html',
      detail:'回家要找到一扇很窄的门——<b>再入走廊</b>，角度太浅弹开、太陡烧穿。' }
  ];
  NODES.forEach(function(n){ n.x = hillX(n.t); n.y = hillY(n.t); });

  // --- 用 HTML 节点承载交互，canvas 只画弧线背景 + 循环上升的火箭剪影 -----
  var mapEl = document.querySelector('.p1-map');
  var qEls = [document.getElementById('q0'), document.getElementById('q1'), document.getElementById('q2')];
  var ansChip = document.getElementById('ansChip');
  var ansQ = document.getElementById('ansQ');
  var ansDetail = document.getElementById('ansDetail');
  var DEFAULT_DETAIL = ansDetail.innerHTML;

  var QUESTION_TEXT = [
    '① 怎么才能离开地面？',
    '② 飞起来之后，为什么不会掉下来？',
    '③ 到了天上，还能去别的地方、还能待多久？'
  ];

  function setActive(node){
    qEls.forEach(function(el, i){ el.classList.toggle('active', node && node.q === i); });
    NODES.forEach(function(n){ n.el.classList.toggle('active', n === node); });
    if(node){
      ansChip.textContent = node.module;
      ansChip.classList.add('on');
      ansQ.textContent = QUESTION_TEXT[node.q];
      ansDetail.innerHTML = node.detail;
    } else {
      ansChip.textContent = '选一个节点看看';
      ansChip.classList.remove('on');
      ansQ.textContent = '';
      ansDetail.innerHTML = DEFAULT_DETAIL;
    }
  }

  NODES.forEach(function(n){
    var el = document.createElement('div');
    el.className = 'p1-node';
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    el.innerHTML = '<span class="p1-dot"></span><span class="p1-node-label">' + n.label + '</span>';
    el.addEventListener('pointerenter', function(){ setActive(n); });
    el.addEventListener('pointerleave', function(){ setActive(null); });
    el.addEventListener('click', function(){ location.href = n.href; });
    mapEl.appendChild(el);
    n.el = el;
  });

  // --- canvas：弧线 + 一枚缓慢往返、循环上升下降的火箭剪影（装饰性） -------
  var cv = document.getElementById('mapCanvas');
  var gctx = null, gw = 0, gh = 0;

  function drawPath(ctx){
    ctx.save();
    ctx.strokeStyle = Deck.rgba('text-faint', .28);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, GROUND + 14);
    ctx.lineTo(MAP_W, GROUND + 14);
    ctx.restore();
    ctx.stroke();

    ctx.beginPath();
    ctx.setLineDash([2, 7]);
    ctx.lineCap = 'round';
    ctx.strokeStyle = Deck.rgba('accent-2', .4);
    ctx.lineWidth = 2;
    for(var i = 0; i <= 60; i++){
      var t = i / 60, x = hillX(t), y = hillY(t);
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawRocket(ctx, t){
    var e = 0.012;
    var t0 = Math.max(0, t - e), t1 = Math.min(1, t + e);
    var x = hillX(t), y = hillY(t);
    var dx = hillX(t1) - hillX(t0), dy = hillY(t1) - hillY(t0);
    var ang = Math.atan2(dy, dx);

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang + Math.PI / 2);

    // 尾焰
    ctx.beginPath();
    ctx.moveTo(-4, 8);
    ctx.lineTo(0, 8 + 10 + 4 * Math.sin(t * 40));
    ctx.lineTo(4, 8);
    ctx.closePath();
    ctx.fillStyle = Deck.rgba('accent-3', .85);
    ctx.fill();

    // 机身
    ctx.beginPath();
    ctx.moveTo(0, -12);
    ctx.lineTo(6, 8);
    ctx.lineTo(-6, 8);
    ctx.closePath();
    ctx.fillStyle = Deck.rgba('accent', 1);
    ctx.fill();

    ctx.restore();
  }

  function render(t){
    if(!gctx) return;
    gctx.clearRect(0, 0, gw, gh);
    drawPath(gctx);
    drawRocket(gctx, t);
  }

  Deck.autofit(cv, function(ctx, w, h){ gctx = ctx; gw = w; gh = h; render(0.12); });

  Deck.loop(function(elapsed){
    var phase = (Math.sin(elapsed * 0.00035) + 1) / 2; // 0..1 缓慢往返
    render(phase);
  }, { still: 900 });

  Deck.init({ index: 1, total: 14, title: '火箭与轨道 · 开场与路线图' });
})();
</script>
</body>
</html>
