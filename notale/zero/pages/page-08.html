<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>轨道速度与高度的权衡</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .pg-body{
    position:absolute; left:var(--sp-6); right:var(--sp-6); top:100px; height:660px;
    z-index:2; display:flex; gap:var(--sp-4);
  }

  /* ---------- 左：控制面板 ---------- */
  .v-panel{
    width:520px; flex:none; display:flex; flex-direction:column; gap:var(--sp-3);
  }
  .v-formula{
    font:700 var(--fs-h3)/1.2 var(--font-mono); color:var(--accent-2);
    text-align:center; padding:var(--sp-2) 0;
  }
  .v-formula sub{ font-size:.65em; }
  .slider-label-row{
    display:flex; justify-content:space-between; align-items:baseline;
    font:600 var(--fs-label)/1.3 var(--font-sans); color:var(--text-dim);
  }
  .slider-label-row .num-lg{ font-size:32px; }
  .v-readouts{
    display:flex; gap:var(--sp-3); margin-top:var(--sp-2);
  }
  .readout{
    flex:1; background:var(--bg3); border:1px solid var(--line); border-radius:8px;
    padding:var(--sp-2) var(--sp-3); text-align:center;
  }
  .readout .label{ display:block; margin-bottom:4px; }
  .readout .num-lg{ color:var(--accent-2); font-size:26px; }
  .readout .unit{ font:600 var(--fs-num)/1 var(--font-mono); color:var(--text-faint); margin-left:4px; }

  .chip-row{ display:flex; gap:var(--sp-2); margin-top:var(--sp-1); }
  .chip-btn{
    flex:1; cursor:pointer; text-align:left; font:600 var(--fs-label)/1.3 var(--font-sans);
    background:var(--bg3); border:1px solid var(--line); border-radius:8px;
    padding:var(--sp-2) var(--sp-3); color:var(--text-dim);
    transition:border-color .15s, background .15s;
  }
  .chip-btn b{ display:block; font:700 18px/1.2 var(--font-mono); color:var(--text); margin-bottom:2px; }
  .chip-btn.leo:hover, .chip-btn.leo.active{ border-color:var(--accent-2); background:rgba(71,224,255,.10); }
  .chip-btn.geo:hover, .chip-btn.geo.active{ border-color:var(--accent-3); background:rgba(255,209,102,.10); }
  .chip-btn.leo b{ color:var(--accent-2); }
  .chip-btn.geo b{ color:var(--accent-3); }

  .v-note{ margin-top:auto; }

  /* ---------- 右：曲线 ---------- */
  .v-chart-wrap{
    flex:1; min-width:0; min-height:0; position:relative;
  }
  .v-chart-wrap svg{ position:absolute; left:0; right:0; bottom:0; top:34px; width:100%; height:calc(100% - 34px); overflow:visible; }
  .axis path, .axis line{ stroke:var(--line); }
  .axis text{ font:600 var(--fs-num)/1 var(--font-mono); fill:var(--text-faint); }
  .grid line{ stroke:var(--line-soft); }
  .grid path{ display:none; }
  .curve{ fill:none; stroke:var(--accent-2); stroke-width:3; }
  .guide{ stroke:var(--text-faint); stroke-dasharray:4 4; stroke-width:1; opacity:.6; }
  .dot-live{ fill:#fff; stroke:var(--accent); stroke-width:3; }
  .ref-dot{ stroke:var(--bg); stroke-width:2; }
  .ref-label{ font:700 var(--fs-label)/1.3 var(--font-sans); }
  .ref-label .sub{ font:600 var(--fs-num)/1.2 var(--font-mono); }
  .chart-title{ font:600 var(--fs-label)/1.3 var(--font-sans); color:var(--text-dim); }
</style>
</head>
<body data-page="08" data-total="14">
<div id="stage">
  <div class="starfield"></div>

  <div class="pg-head">
    <div><span class="pg-kicker">MODULE 3 · 轨道</span><span class="pg-title">飞得越高，反而飞得越慢</span></div>
    <div class="pg-index">8 / 14</div>
  </div>

  <div class="pg-body">

    <div class="v-panel">
      <div class="v-formula">v = √(μ / r) &nbsp;&nbsp;·&nbsp;&nbsp; μ⊕ = 398600 km³/s²</div>

      <div class="panel" style="flex:none;">
        <div class="slider-label-row">
          <span>轨道高度 h</span>
          <span><span class="num-lg" id="hVal">400</span> <span class="unit">km</span></span>
        </div>
        <div class="ctrl-row" style="margin-top:8px;">
          <input type="range" id="hSlider" min="0" max="1000" step="1" value="131" class="no-pan">
        </div>
        <div class="slider-label-row" style="margin-top:2px; color:var(--text-faint); font-weight:500;">
          <span>200 km</span><span>对数刻度，跨度很大</span><span>40000 km</span>
        </div>

        <div class="v-readouts">
          <div class="readout">
            <span class="label">轨道速度</span>
            <span class="num-lg" id="vVal">7.66</span><span class="unit">km/s</span>
          </div>
          <div class="readout">
            <span class="label">绕行周期</span>
            <span class="num-lg" id="tVal" style="font-size:20px;">92.7 分钟</span>
          </div>
        </div>

        <div class="chip-row">
          <button class="chip-btn leo active" id="btnLEO"><b>LEO · 400 km</b>国际空间站高度</button>
          <button class="chip-btn geo" id="btnGEO"><b>GEO · 35786 km</b>地球同步高度</button>
        </div>
      </div>

      <div class="callout cool v-note" style="font-size:16px; line-height:1.5;">
        💡 GEO 的周期恰好等于地球自转一天（≈24h），所以从地面看，挂在那儿的卫星
        像"不动"一样——这是通信/气象卫星偏爱它的原因。
      </div>
    </div>

    <div class="v-chart-wrap">
      <div class="panel" style="position:absolute; inset:0; padding:var(--sp-3) var(--sp-4) var(--sp-4) var(--sp-2);">
        <div class="chart-title" style="padding-left:var(--sp-3);">轨道速度 v 随高度 h 变化（横轴对数刻度）</div>
        <svg id="chart"></svg>
      </div>
    </div>

  </div>

  <div class="pg-hint">💡 <b>怎么玩</b>：拖动左侧高度滑块，或点击 LEO / GEO 按钮跳转——观察曲线上的点如何随高度升高而下滑，越高反而越慢。</div>
</div>

<script src="assets/base.js"></script>
<script src="assets/lib/d3.min.js"></script>
<script>
(function(){
  'use strict';

  var MU = 398600;       // km^3/s^2
  var R_EARTH = 6371;     // km
  var H_MIN = 200, H_MAX = 40000;
  var LOG_MIN = Math.log10(H_MIN), LOG_MAX = Math.log10(H_MAX);

  var LEO_H = 400, GEO_H = 35786;

  function vOf(h){ return Math.sqrt(MU / (R_EARTH + h)); }
  function periodOf(h){ // seconds
    var r = R_EARTH + h;
    return 2 * Math.PI * Math.sqrt(r*r*r / MU);
  }
  function fmtPeriod(sec){
    var min = sec / 60;
    if (min < 180) return min.toFixed(1) + ' 分钟';
    var h = Math.floor(sec / 3600);
    var m = Math.round((sec % 3600) / 60);
    if (m === 60){ h += 1; m = 0; }
    return h + ' 小时 ' + m + ' 分';
  }
  function sliderToH(t){ return Math.pow(10, LOG_MIN + t * (LOG_MAX - LOG_MIN)); }
  function hToSlider(h){ return (Math.log10(h) - LOG_MIN) / (LOG_MAX - LOG_MIN); }

  var slider = document.getElementById('hSlider');
  var hValEl = document.getElementById('hVal');
  var vValEl = document.getElementById('vVal');
  var tValEl = document.getElementById('tVal');
  var btnLEO = document.getElementById('btnLEO');
  var btnGEO = document.getElementById('btnGEO');

  var svg = d3.select('#chart');
  var gRoot = svg.append('g');
  var gGrid = gRoot.append('g').attr('class','grid');
  var gAxisX = gRoot.append('g').attr('class','axis axis-x');
  var gAxisY = gRoot.append('g').attr('class','axis axis-y');
  var gCurve = gRoot.append('g');
  var gRefs = gRoot.append('g');
  var gLive = gRoot.append('g');

  var pathCurve = gCurve.append('path').attr('class','curve');
  var guideV = gLive.append('line').attr('class','guide');
  var guideH = gLive.append('line').attr('class','guide');
  var liveDot = gLive.append('circle').attr('class','dot-live').attr('r',7);

  var xScale, yScale, W, H, M;

  function layout(){
    var box = svg.node().getBoundingClientRect();
    W = box.width; H = box.height;
    M = { l: 66, r: 24, t: 30, b: 44 };
    var iw = Math.max(10, W - M.l - M.r);
    var ih = Math.max(10, H - M.t - M.b);

    xScale = d3.scaleLog().domain([R_EARTH + H_MIN, R_EARTH + H_MAX]).range([0, iw]);
    yScale = d3.scaleLinear().domain([0, 8.3]).range([ih, 0]);

    gRoot.attr('transform', 'translate(' + M.l + ',' + M.t + ')');

    var xAxis = d3.axisBottom(xScale)
      .tickValues([R_EARTH+200, R_EARTH+1000, R_EARTH+5000, R_EARTH+10000, R_EARTH+20000, R_EARTH+40000])
      .tickFormat(function(r){ return Math.round(r - R_EARTH); })
      .tickSizeOuter(0);
    var yAxis = d3.axisLeft(yScale).ticks(5).tickSizeOuter(0);
    var yGrid = d3.axisLeft(yScale).ticks(5).tickSize(-iw).tickFormat('');

    gAxisX.attr('transform', 'translate(0,' + ih + ')').call(xAxis);
    gAxisY.call(yAxis);
    gGrid.call(yGrid);

    gAxisX.append('text')
      .attr('x', iw/2).attr('y', 36).attr('fill','var(--text-faint)')
      .attr('font-family','var(--font-sans)').attr('font-weight',600).attr('font-size',14)
      .attr('text-anchor','middle').text('轨道高度 h (km，对数刻度)');
    gAxisY.append('text')
      .attr('transform','rotate(-90)')
      .attr('x', -ih/2).attr('y', -50).attr('fill','var(--text-faint)')
      .attr('font-family','var(--font-sans)').attr('font-weight',600).attr('font-size',14)
      .attr('text-anchor','middle').text('轨道速度 v (km/s)');

    // 曲线：对高度做对数采样
    var N = 120, pts = [];
    for (var i = 0; i <= N; i++){
      var h = sliderToH(i / N);
      pts.push([R_EARTH + h, vOf(h)]);
    }
    var line = d3.line().x(function(d){ return xScale(d[0]); }).y(function(d){ return yScale(d[1]); });
    pathCurve.attr('d', line(pts));

    // 参考点：LEO / GEO
    gRefs.selectAll('*').remove();
    [ {h: LEO_H, v: 7.66, name: 'LEO', sub: '400 km · 7.66 km/s · 92.7 分钟', color: 'var(--accent-2)'},
      {h: GEO_H, v: 3.07, name: 'GEO', sub: '35786 km · 3.07 km/s · ≈24 小时', color: 'var(--accent-3)'}
    ].forEach(function(d){
      var cx = xScale(R_EARTH + d.h), cy = yScale(d.v);
      gRefs.append('line').attr('class','guide')
        .attr('x1',cx).attr('x2',cx).attr('y1',ih).attr('y2',cy);
      gRefs.append('circle').attr('class','ref-dot')
        .attr('cx',cx).attr('cy',cy).attr('r',7).attr('fill',d.color);
      var above = cy > 46;
      var anchor = cx > iw - 100 ? 'end' : (cx < 100 ? 'start' : 'middle');
      var dx = anchor === 'start' ? 14 : (anchor === 'end' ? -14 : 0);
      var g = gRefs.append('g').attr('transform','translate(' + (cx+dx) + ',' + (above ? cy - 16 : cy + 28) + ')');
      g.append('text').attr('class','ref-label').attr('text-anchor', anchor)
        .attr('fill', d.color).text(d.name);
      g.append('text').attr('class','ref-label sub').attr('y',16)
        .attr('text-anchor', anchor)
        .attr('fill','var(--text-dim)').text(d.sub);
    });

    updateLive(+slider.value, false);
  }

  function updateLive(sliderVal, animate){
    var t = sliderVal / 1000;
    var h = sliderToH(t);
    var v = vOf(h);
    var per = periodOf(h);

    hValEl.textContent = h < 1000 ? Math.round(h) : Math.round(h);
    vValEl.textContent = v.toFixed(2);
    tValEl.textContent = fmtPeriod(per);
    tValEl.style.fontSize = (fmtPeriod(per).length > 8 ? '17px' : '20px');

    if (!xScale) return;
    var ih = yScale.range()[0];
    var cx = xScale(R_EARTH + h), cy = yScale(v);
    guideV.attr('x1',cx).attr('x2',cx).attr('y1',ih).attr('y2',cy);
    guideH.attr('x1',0).attr('x2',cx).attr('y1',cy).attr('y2',cy);
    liveDot.attr('cx',cx).attr('cy',cy);

    btnLEO.classList.toggle('active', Math.abs(h - LEO_H) < 5);
    btnGEO.classList.toggle('active', Math.abs(h - GEO_H) < 5);
  }

  slider.addEventListener('input', function(){ updateLive(+slider.value, false); });
  btnLEO.addEventListener('click', function(){ slider.value = Math.round(hToSlider(LEO_H)*1000); updateLive(+slider.value); });
  btnGEO.addEventListener('click', function(){ slider.value = Math.round(hToSlider(GEO_H)*1000); updateLive(+slider.value); });

  Deck.onResize(layout);
  layout();

  Deck.init({ index: 8, total: 14 });
})();
</script>
</body>
</html>
