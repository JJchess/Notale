<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>再入走廊——回家的窄门</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .pg-body{
    position:absolute; left:var(--sp-6); right:var(--sp-6); top:96px; bottom:76px;
    z-index:2; display:grid; grid-template-columns:1.55fr 1fr; gap:var(--sp-4);
  }

  /* ---- 左：canvas 侧视图面板 ---- */
  .stage-panel{ position:relative; overflow:hidden; }
  .stage-panel canvas{ position:absolute; inset:0; }
  .status-badge{
    position:absolute; top:var(--sp-3); left:var(--sp-3); z-index:3;
    font:700 var(--fs-h3)/1.2 var(--font-sans);
    padding:8px 16px; border-radius:6px;
    background:rgba(11,15,30,.82); border:1px solid var(--line);
    transition:color .15s, border-color .15s;
  }
  .status-badge.ok{ color:var(--good); border-color:rgba(74,222,128,.5); }
  .status-badge.bounce{ color:var(--accent-3); border-color:rgba(255,209,102,.5); }
  .status-badge.burn{ color:var(--bad); border-color:rgba(255,84,112,.5); }
  .status-badge.flying{ color:var(--text-dim); }

  .readout{
    position:absolute; top:var(--sp-3); right:var(--sp-3); z-index:3;
    display:flex; flex-direction:column; gap:4px; align-items:flex-end;
    font:600 var(--fs-num)/1.3 var(--font-mono); color:var(--text-dim);
    background:rgba(11,15,30,.7); border:1px solid var(--line-soft);
    border-radius:6px; padding:8px 12px;
  }
  .readout .row{ display:flex; gap:8px; align-items:baseline; }
  .readout .v{ color:var(--text); font-size:14px; }
  .readout .v.hot{ color:var(--accent-3); }
  .readout .v.crit{ color:var(--bad); }

  /* ---- 右：控制与走廊刻度 ---- */
  .side{ display:flex; flex-direction:column; gap:var(--sp-3); min-width:0; }
  .side .panel{ flex:none; }

  .angle-value{
    font:700 var(--fs-h1)/1 var(--font-mono); color:var(--accent-2);
    font-variant-numeric:tabular-nums;
  }
  .angle-value .u{ font-size:var(--fs-h3); color:var(--text-dim); margin-left:6px; }

  .corridor{
    position:relative; height:56px; margin-top:var(--sp-3);
    border-radius:6px; overflow:hidden;
    background:linear-gradient(90deg,
      rgba(255,84,112,.35) 0%, rgba(255,84,112,.35) 30%,
      rgba(74,222,128,.42) 30%, rgba(74,222,128,.42) 70%,
      rgba(255,209,102,.32) 70%, rgba(255,209,102,.32) 100%);
    border:1px solid var(--line);
  }
  .corridor .tick{
    position:absolute; top:0; bottom:0; width:1px; background:var(--line-soft);
  }
  .corridor .zone-label{
    position:absolute; top:4px; font:600 var(--fs-num)/1 var(--font-mono);
    color:var(--bg); background:rgba(238,243,251,.85); padding:1px 5px; border-radius:3px;
  }
  .corridor .marker{
    position:absolute; top:0; width:3px; height:100%;
    background:var(--text); border-radius:2px;
    box-shadow:0 0 8px rgba(238,243,251,.7);
    transition:left .05s linear;
  }

  .zone-note{
    display:flex; justify-content:space-between; margin-top:6px;
    font:600 var(--fs-num)/1.2 var(--font-mono);
  }
  .zone-note span:nth-child(1){ color:var(--bad); }
  .zone-note span:nth-child(2){ color:var(--good); }
  .zone-note span:nth-child(3){ color:var(--accent-3); }

  .result-callout{ min-height:78px; display:flex; align-items:center; }
  .result-callout .rt{ display:block; margin-bottom:2px; font-weight:700; }

  .legend{ display:flex; flex-wrap:wrap; gap:var(--sp-3); margin-top:var(--sp-2); }
  .legend .li{ display:flex; align-items:center; gap:6px; font:500 var(--fs-num)/1.2 var(--font-sans); color:var(--text-dim); }
  .legend .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
</style>
</head>
<body data-page="13" data-total="14">
<div id="stage">
  <div class="starfield"></div>

  <div class="pg-head">
    <div>
      <span class="pg-kicker">MODULE 4 · 机动与归来</span>
      <span class="pg-title">再入走廊——角度不对，弹开或烧穿</span>
    </div>
    <div class="pg-index">13 / 14</div>
  </div>

  <div class="pg-body">
    <div class="panel stage-panel">
      <div id="badge" class="status-badge flying">再入中…</div>
      <div class="readout">
        <div class="row"><span class="label">高度</span><span class="v" id="rdAlt">120 km</span></div>
        <div class="row"><span class="label">速度</span><span class="v" id="rdSpd">7.8 km/s</span></div>
        <div class="row"><span class="label">过载指标</span><span class="v" id="rdLoad">— </span></div>
      </div>
      <canvas id="cv" class="cv-fill no-pan"></canvas>
    </div>

    <div class="side min0">
      <div class="panel">
        <div class="label">再入角度（相对当地水平面）</div>
        <div class="ctrl-row" style="margin-top:8px;">
          <span class="angle-value" id="angleVal">-6.5<span class="u">°</span></span>
        </div>
        <input id="angle" type="range" min="-10" max="-3" step="0.1" value="-6.5" style="margin-top:10px;">
        <div class="corridor" id="corridor">
          <div class="marker" id="marker"></div>
        </div>
        <div class="zone-note">
          <span>-10°</span><span>安全区 -8°~-5°</span><span>-3°</span>
        </div>
        <div class="legend">
          <span class="li"><span class="dot" style="background:var(--bad)"></span>太陡：过载/烧毁</span>
          <span class="li"><span class="dot" style="background:var(--good)"></span>安全走廊</span>
          <span class="li"><span class="dot" style="background:var(--accent-3)"></span>太浅：打水漂弹开</span>
        </div>
      </div>

      <div class="panel">
        <button class="btn primary" id="btnFly" style="width:100%;">🚀 开始再入</button>
      </div>

      <div class="panel callout" id="resultBox">
        <span class="rt">拖动左侧角度滑块，然后点击"开始再入"。</span>
        <span id="resultBody">安全走廊很窄——比理论上更精确的数字更重要的是：这条门缝真的很窄，早一点晚一点都会失败。</span>
      </div>
    </div>
  </div>

  <div class="pg-hint">💡 <b>怎么玩</b>：拖动"再入角度"滑块选一个角度，点击开始再入——角度太浅会像打水漂一样被大气弹回太空，太陡会因减速过载过大而烧毁，只有中间一段窄窄的安全走廊能平稳降落。</div>
</div>

<script src="assets/base.js"></script>
<script>
(function(){
  'use strict';

  // ---------------------------------------------------------------------
  // 走廊定义（角度：度，负值=向下）。教学简化模型，非精确气动方程。
  //   安全区：-8° ~ -5°
  //   浅于 -5°（更接近 0）：弹开
  //   陡于 -8°（更接近 -10 甚至更负）：烧毁
  // ---------------------------------------------------------------------
  var SAFE_HI = -5;   // 浅边界
  var SAFE_LO = -8;   // 陡边界
  var MIN_A = -10, MAX_A = -3;

  var angleInput = document.getElementById('angle');
  var angleVal   = document.getElementById('angleVal');
  var marker     = document.getElementById('marker');
  var badge      = document.getElementById('badge');
  var resultBox  = document.getElementById('resultBox');
  var resultRt   = document.querySelector('#resultBox .rt');
  var resultBody = document.getElementById('resultBody');
  var btnFly     = document.getElementById('btnFly');
  var rdAlt = document.getElementById('rdAlt');
  var rdSpd = document.getElementById('rdSpd');
  var rdLoad = document.getElementById('rdLoad');

  function zoneOf(a){
    if (a > SAFE_HI) return 'bounce';   // 太浅（角度更接近0，绝对值更小）
    if (a < SAFE_LO) return 'burn';     // 太陡
    return 'ok';
  }

  function pctFromAngle(a){
    return (a - MIN_A) / (MAX_A - MIN_A) * 100;
  }

  function updateMarker(){
    var a = parseFloat(angleInput.value);
    angleVal.firstChild.nodeValue = a.toFixed(1);
    var pct = pctFromAngle(a);
    marker.style.left = 'calc(' + pct + '% - 1.5px)';
  }
  angleInput.addEventListener('input', updateMarker);
  updateMarker();

  // ---------------------------------------------------------------------
  // canvas 侧视再入模拟：地面在下方，飞船从右上方进入大气层。
  // 简化规则（方向正确，非精确工程模型）：
  //  - 角度越陡（|a|越大），下降越快、"减速烈度"指标越高。
  //  - 太浅时轨迹在到达一定深度前就被"弹回"，高度回升离开大气。
  //  - 判定阈值使用上面的 SAFE_HI / SAFE_LO。
  // ---------------------------------------------------------------------
  var cv = document.getElementById('cv');
  var W=0, H=0;
  var GROUND_Y_FRAC = 0.86;   // 地面在画布高度的位置（占比）
  var ATMO_TOP_FRAC = 0.10;   // 大气层顶（可见）在画布高度的位置

  var flying = false;
  var stopLoop = null;
  var sim = null;

  function resetSimState(a){
    return {
      angleDeg: a,
      t: 0,
      x: 0.78,      // 归一化水平位置 0~1（从右往左飞）
      alt: 1.0,     // 归一化高度 0(地面)~1(大气层顶之上一点)
      vx: -0.09,    // 水平速度分量（归一化/秒）
      spd: 7.8,     // km/s 展示值
      done: false,
      outcome: null, // 'ok' | 'bounce' | 'burn'
      shakeT: 0,
      bounceApex: null
    };
  }

  function easeLoad(a){
    // 角度越陡（越负），减速烈度越高；纯用于展示的相对指标
    var steep = Deck.clamp((-a - 4) / 8, 0, 1.4);
    return steep;
  }

  function stepSim(s, dtSec){
    if (s.done) return;
    s.t += dtSec;
    var zone = zoneOf(s.angleDeg);
    var steepness = Deck.clamp((-s.angleDeg) / 10, 0.2, 1.2); // 越陡越大

    // 水平推进
    s.x += s.vx * dtSec;

    if (zone === 'burn'){
      // 太陡：迅速扎入大气，减速烈度飙升，很快判定烧毁
      s.alt -= (0.55 + steepness * 0.9) * dtSec;
      s.spd = Math.max(2.0, s.spd - 5.5 * dtSec);
      if (s.alt <= 0.30 || s.t > 1.6){
        s.done = true; s.outcome = 'burn'; s.alt = Math.max(s.alt, 0.24);
      }
    } else if (zone === 'bounce'){
      // 太浅：下降到一定深度后被"弹"回去，高度回升离开大气
      if (!s.bounceApex){
        s.alt -= 0.32 * dtSec;
        if (s.alt < 0.55){
          s.bounceApex = true;
        }
      } else {
        s.alt += 0.30 * dtSec;
        s.spd = Math.max(6.5, s.spd - 0.3 * dtSec);
      }
      if (s.bounceApex && s.alt > 1.05){
        s.done = true; s.outcome = 'bounce';
      }
      if (s.t > 3.2 && !s.done){ s.done = true; s.outcome = 'bounce'; }
    } else {
      // 安全走廊：平稳减速下降
      s.alt -= (0.20 + steepness * 0.10) * dtSec;
      s.spd = Math.max(0.4, s.spd - 2.6 * dtSec);
      if (s.alt <= 0.18){
        s.done = true; s.outcome = 'ok'; s.alt = 0.18;
      }
    }
  }

  function draw(ctx, w, h){
    W = w; H = h;
    ctx.clearRect(0,0,w,h);

    var groundY = h * GROUND_Y_FRAC;
    var atmoY = h * ATMO_TOP_FRAC;

    // 天空渐变
    var sky = ctx.createLinearGradient(0,0,0,groundY);
    sky.addColorStop(0, 'rgba(6,8,18,1)');
    sky.addColorStop(1, 'rgba(20,28,48,1)');
    ctx.fillStyle = sky;
    ctx.fillRect(0,0,w,groundY);

    // 大气层带（半透明，随高度变浓）
    var atmo = ctx.createLinearGradient(0, atmoY, 0, groundY);
    atmo.addColorStop(0, 'rgba(71,224,255,0.03)');
    atmo.addColorStop(1, 'rgba(255,122,69,0.10)');
    ctx.fillStyle = atmo;
    ctx.fillRect(0, atmoY, w, groundY - atmoY);

    // 大气层顶部虚线
    ctx.strokeStyle = 'rgba(71,224,255,.35)';
    ctx.setLineDash([6,6]);
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, atmoY); ctx.lineTo(w, atmoY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(147,166,199,.9)';
    ctx.font = '600 12px ' + getComputedStyle(document.documentElement).getPropertyValue('--font-mono');
    ctx.fillText('大气层顶（约 120 km）', 10, atmoY - 6);

    // 地面
    var groundGrad = ctx.createLinearGradient(0, groundY, 0, h);
    groundGrad.addColorStop(0, 'rgba(16,24,44,1)');
    groundGrad.addColorStop(1, 'rgba(6,8,18,1)');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, groundY, w, h - groundY);
    ctx.strokeStyle = 'rgba(150,175,220,.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(w, groundY); ctx.stroke();
    ctx.fillStyle = 'rgba(147,166,199,.9)';
    ctx.fillText('地面', 10, groundY + 18);

    // 轨迹 + 飞船
    if (sim){
      var px = sim.x * w;
      var altSpan = groundY - atmoY * 0.15; // 高度1对应的y接近略高于atmoY，高度0对应groundY附近
      var py = (groundY) - sim.alt * (groundY - atmoY*0.4);
      py = Deck.clamp(py, atmoY*0.3, groundY - 6);

      // 尾迹
      ctx.strokeStyle = sim.outcome === 'burn' ? Deck.rgba('bad', .8)
                        : sim.outcome === 'bounce' ? Deck.rgba('accent-3', .8)
                        : Deck.rgba('good', .8);
      if (!sim.trail) sim.trail = [];
      sim.trail.push([px, py]);
      if (sim.trail.length > 240) sim.trail.shift();
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (var i=0;i<sim.trail.length;i++){
        var p = sim.trail[i];
        if (i===0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
      }
      ctx.stroke();

      // 烧毁时的光晕闪烁
      var shipColor = '#eef3fb';
      var glow = null;
      if (sim.outcome === 'burn'){
        var pulse = 0.5 + 0.5*Math.sin(sim.t*30);
        glow = 'rgba(255,84,112,' + (0.5+0.4*pulse) + ')';
      } else if (sim.done && sim.outcome === 'ok'){
        glow = Deck.rgba('good', .7);
      }

      ctx.save();
      ctx.translate(px, py);
      var ang = Math.atan2(-sim.vx*4, sim.vx===0?-1:sim.vx) ; // 简化朝向：朝向运动方向偏下
      var faceAngle = Math.PI - 0.35; // 略朝下偏左飞行的姿态（固定示意角）
      ctx.rotate(faceAngle);
      if (glow){
        ctx.shadowColor = glow; ctx.shadowBlur = 18;
      }
      ctx.fillStyle = shipColor;
      ctx.beginPath();
      ctx.moveTo(10,0); ctx.lineTo(-8,-6); ctx.lineTo(-4,0); ctx.lineTo(-8,6);
      ctx.closePath(); ctx.fill();
      ctx.restore();

      // 再入热焰（安全/陡峭时显示橙色尾焰）
      if (!sim.done || sim.outcome==='burn'){
        var heat = zoneOf(sim.angleDeg) !== 'bounce';
        if (heat){
          ctx.save();
          ctx.globalAlpha = 0.55;
          var flameLen = 14 + easeLoad(sim.angleDeg)*22;
          var grad = ctx.createLinearGradient(px, py, px+flameLen, py+flameLen*0.5);
          grad.addColorStop(0, Deck.rgba('accent-3', .9));
          grad.addColorStop(1, 'rgba(255,122,69,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px+flameLen, py+flameLen*0.35);
          ctx.lineTo(px+flameLen*0.7, py+flameLen*0.7);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }
    }
  }

  var autofit = Deck.autofit(cv, draw);

  function fmtNum(v, d){ return v.toFixed(d===undefined?1:d); }

  function setBadge(state, text){
    badge.className = 'status-badge ' + state;
    badge.textContent = text;
  }

  function finish(outcome){
    flying = false;
    btnFly.disabled = false;
    btnFly.textContent = '🚀 再试一次';
    if (outcome === 'ok'){
      setBadge('ok', '✅ 平稳再入');
      resultRt.textContent = '成功——落在了安全走廊里。';
      resultRt.style.color = 'var(--good)';
      resultBody.textContent = '角度落在约 -8°~-5° 之间，大气逐渐、可控地把速度蹭掉，没有被弹回太空，也没有过载超限。';
    } else if (outcome === 'bounce'){
      setBadge('bounce', '⤴ 打水漂弹开');
      resultRt.textContent = '太浅——被大气弹回了太空。';
      resultRt.style.color = 'var(--accent-3)';
      resultBody.textContent = '角度浅于约 -5° 时，飞船像打水漂的石子一样，还没能稳定扎入大气就被弹回高层大气，重新飞向太空，需要再找机会重新再入。';
    } else {
      setBadge('burn', '🔥 过载超限 / 烧毁');
      resultRt.textContent = '太陡——减速太快，烧穿了。';
      resultRt.style.color = 'var(--bad)';
      resultBody.textContent = '角度陡于约 -8° 时，飞船扎入大气层太快，减速烈度和气动加热远超结构/乘员承受极限。';
    }
  }

  function startFlight(){
    if (flying) return;
    flying = true;
    btnFly.disabled = true;
    btnFly.textContent = '再入中…';
    var a = parseFloat(angleInput.value);
    sim = resetSimState(a);
    setBadge('flying', '再入中…');

    if (stopLoop) stopLoop();
    stopLoop = Deck.loop(function(t, dt){
      var dtSec = Math.min(dt, 50) / 1000 * 2.4; // 时间压缩，几秒内看到结果
      if (!sim.done){
        stepSim(sim, dtSec);
      }
      rdAlt.textContent = Math.round(30 + sim.alt*370) + ' km';
      rdSpd.textContent = sim.spd.toFixed(1) + ' km/s';
      var load = easeLoad(sim.angleDeg);
      rdLoad.textContent = load < 0.55 ? (load*10).toFixed(1) : (load*10).toFixed(1);
      rdLoad.className = 'v' + (load > 0.9 ? ' crit' : load > 0.6 ? ' hot' : '');
      autofit.redraw();
      if (sim.done && flying){
        finish(sim.outcome);
      }
    });
  }

  btnFly.addEventListener('click', startFlight);

  // 初始静态帧
  sim = resetSimState(parseFloat(angleInput.value));
  autofit.redraw();

  Deck.init({ index: 13, total: 14 });
})();
</script>
</body>
</html>
