<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<style>
  *{box-sizing:border-box}html,body{margin:0;width:2560px;height:1440px;overflow:hidden;font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;color:#08254b;background:#f6fbff}
  body{position:relative;background:linear-gradient(135deg,#fff 0%,#f5fbff 58%,#eaf5ff 100%)}
  body:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(20,100,180,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(20,100,180,.04) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
  .chapter{position:absolute;left:56px;top:50px;width:170px;height:170px;border-radius:24px;background:#d81e06;color:#fff;font-size:86px;font-weight:800;display:grid;place-items:center;box-shadow:0 18px 38px rgba(216,30,6,.18)}
  h1{position:absolute;left:282px;top:48px;margin:0;font-size:76px;line-height:1.12;letter-spacing:-2px;color:#071e3d}
  .rule{position:absolute;left:282px;top:160px;width:1270px;height:6px;background:linear-gradient(90deg,#d81e06 0 150px,#1464b4 150px)}
  .subtitle{position:absolute;left:282px;top:186px;font-size:36px;color:#27496d}
  .rail{position:absolute;top:310px;border:2px solid #b9d7ef;border-radius:26px;background:rgba(255,255,255,.88);box-shadow:0 18px 60px rgba(14,68,120,.09)}
  .left{left:56px;width:430px;height:900px;padding:54px 46px}
  .concept{height:188px;padding:22px 10px 0 74px;border-bottom:2px dashed #b8dcf4;position:relative;font-size:32px;font-weight:700}
  .concept:last-child{border:0}
  .concept:before{content:"";position:absolute;left:9px;top:25px;width:34px;height:34px;border:8px solid #1464b4;border-radius:50%;background:#fff}
  .center{position:absolute;left:530px;top:300px;width:1380px;height:910px}
  .tree-label{position:absolute;left:48px;top:18px;color:#d81e06;font-size:24px;font-weight:800;letter-spacing:4px}
  svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .edge{stroke:#08254b;stroke-width:12;fill:none;stroke-linecap:round}
  .node{position:absolute;width:150px;height:150px;border-radius:50%;background:#08254b;border:10px solid #5bb8ef;color:#fff;display:grid;place-items:center;font-size:68px;font-weight:800;box-shadow:0 16px 30px rgba(8,37,75,.18)}
  .a{left:615px;top:85px}.b{left:355px;top:360px}.c{left:875px;top:360px}.d{left:180px;top:675px}.e{left:530px;top:675px}.f{left:875px;top:675px}
  .right{right:56px;width:510px;height:900px;overflow:hidden}
  .right h2{margin:0;padding:28px 38px;background:#08254b;color:#fff;font-size:38px;text-align:center}
  .kpi{height:242px;margin:28px;border:2px solid #b8d1e5;border-radius:20px;padding:48px 34px 36px 150px;position:relative;background:#fff;font-size:32px;font-weight:700}
  .kpi b{display:block;font-size:72px;line-height:.8;color:#d81e06}.kpi:nth-of-type(3) b{color:#1464b4}.kpi:nth-of-type(4) b{color:#d9a928}
  .kpi:before{content:"";position:absolute;left:34px;top:56px;width:90px;height:90px;border-radius:50%;background:#eaf5ff;border:10px solid currentColor}
  .banner{position:absolute;left:530px;bottom:56px;width:1380px;height:150px;border-radius:24px;background:#08254b;border:5px solid #d9a928;color:#fff;display:grid;place-items:center;font-size:48px;font-weight:800;box-shadow:0 18px 45px rgba(8,37,75,.2)}
</style>
<body>
  <div class="chapter">01</div>
  <h1>树不是一堆节点，而是一组层级关系</h1>
  <div class="rule"></div>
  <div class="subtitle">节点、边与三项结构指标，共同定义一棵树。</div>
  <section class="rail left">
    <div class="concept">唯一根节点</div><div class="concept">单一父节点</div><div class="concept">叶子节点</div><div class="concept">递归同构</div>
  </section>
  <main class="center">
    <svg viewBox="0 0 1380 910" aria-hidden="true">
      <path class="edge" d="M690 235 L430 360"/><path class="edge" d="M690 235 L950 360"/>
      <path class="edge" d="M430 510 L255 675"/><path class="edge" d="M430 510 L605 675"/><path class="edge" d="M950 510 L950 675"/>
    </svg>
    <div class="node a">A</div><div class="node b">B</div><div class="node c">C</div>
    <div class="node d">D</div><div class="node e">E</div><div class="node f">F</div>
  </main>
  <section class="rail right">
    <h2>结构指标</h2>
    <div class="kpi"><b>6</b>节点</div><div class="kpi"><b>3</b>层</div><div class="kpi"><b>2</b>最大度</div>
  </section>
  <div class="banner">先序遍历：A → B → D → E → C → F</div>
</body>
</html>
