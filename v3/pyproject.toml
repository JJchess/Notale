[project]
name = "v3-line"
version = "0.1.0"
description = "独立新线：按 methodology/ 的 HARNESS/PREP/VERIFY-EXEC 设计从零搭建的内循环。与 lecture-agent 无代码依赖（仅移植了 LLM 调用基础设施）。"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    # agent 运行时底座（spike GO）。注意：它会拉入 discord/slack/lark/telegram 等
    # channel/TUI 硬依赖（磁盘死重，import 不加载），详见 docs/openharness-spike.md 坑清单。
    "openharness-ai>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
