<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>能力覆盖热力图 · LectureDoc</title>
<script src="vendor/plot/d3.min.js"></script>
<script src="vendor/plot/plot.umd.min.js"></script>
<style>
  :root {
    --bg: #0e1116; --panel: #171b22; --panel2: #1e242e; --line: #2a313c;
    --fg: #e6edf3; --dim: #9aa7b4; --accent: #4c8dff; --ok: #3fb950; --bad: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header a { color: var(--dim); text-decoration: none; font-size: 12px; }
  header a:hover { color: var(--accent); }
  .spacer { flex: 1; }
  #meta-line { font-size: 12px; color: var(--dim); }
  main { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 20px; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
  .card h2 { margin: 0 0 10px; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .toolbar select { font-size: 12px; padding: 4px 8px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 5px; }
  .toolbar label { font-size: 12px; color: var(--dim); }

  /* 覆盖网格 */
  .grid-groups { display: flex; flex-direction: column; gap: 10px; }
  .grp-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grp-label { width: 66px; flex-shrink: 0; font-size: 11px; color: var(--dim); text-transform: uppercase; }
  .cell { min-width: 74px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
    font-size: 11px; text-align: center; cursor: default; position: relative; }
  .cell .k { display: block; font-size: 10.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .n { display: block; font-weight: 700; font-size: 13px; margin-top: 2px; }
  .cell.cold { background: var(--panel); border-color: var(--bad); }
  .cell.cold .n { color: var(--bad); }
  .cell.unreachable { background: repeating-linear-gradient(45deg, var(--panel), var(--panel) 6px, #262b33 6px, #262b33 12px);
    border-style: dashed; opacity: .7; }
  .cell.hot .n { color: var(--ok); }
  .legend { font-size: 11px; color: var(--dim); display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
  .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

  /* 版本对比 */
  #codeDiff table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #codeDiff th, #codeDiff td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  #codeDiff td.n { text-align: right; font-variant-numeric: tabular-nums; }
  #codeDiff .up { color: var(--ok); } #codeDiff .down { color: var(--bad); }

  #condPlot { overflow-x: auto; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🌡️ 能力覆盖热力图</h1>
    <a href="console.html">← 实验操作台</a>
    <div class="spacer"></div>
    <div id="meta-line">加载中…</div>
  </header>
  <main>
    <div class="card">
      <h2>覆盖网格 —— 全部能力 × 是否被触发</h2>
      <div id="grid" class="grid-groups"></div>
      <div class="legend">
        <span><span class="sw" style="background:var(--panel);border:1px solid var(--bad)"></span>冷（从未触发）</span>
        <span><span class="sw" style="background:var(--panel2);border:1px solid var(--line)"></span>已触发</span>
        <span><span class="sw" style="background:var(--ok);opacity:.5"></span>热（触发次数多）</span>
        <span><span class="sw" style="background:repeating-linear-gradient(45deg,#171b22,#171b22 3px,#262b33 3px,#262b33 6px);border:1px dashed var(--line)"></span>结构合法但规划器不会自动产出</span>
      </div>
    </div>

    <div class="card">
      <h2>条件热力图 —— 能力 × 模型/主题/题材</h2>
      <div class="toolbar">
        <label>维度</label>
        <select id="dimSel">
          <option value="model">model</option>
          <option value="theme">theme</option>
          <option value="topic">topic</option>
        </select>
      </div>
      <div id="condPlot"></div>
    </div>

    <div class="card">
      <h2>代码版本对比 —— 排查哪些能力因哪次改动变冷/变热</h2>
      <div class="toolbar">
        <label>版本 A</label><select id="codeA"></select>
        <label>版本 B</label><select id="codeB"></select>
      </div>
      <div id="codeDiff"></div>
    </div>
  </main>
</div>

<script type="module">
import { CAPABILITIES } from './schema/enums.mjs';

const POLL_MS = 3000;
let data = null;

async function poll() {
  try {
    const r = await fetch('telemetry/coverage.json', { cache: 'no-store' });
    data = await r.json();
    renderAll();
  } catch (e) {
    document.getElementById('meta-line').textContent = '无法加载 telemetry/coverage.json —— 先跑 python viewer/build_coverage.py';
  }
}

function renderAll() {
  document.getElementById('meta-line').textContent =
    `${data.total_runs} 条实验记录 · 生成于 ${new Date(data.generated_at).toLocaleString()}`;
  renderGrid();
  renderCondition();
  renderCodeSelectors();
}

// ---- 覆盖网格 ----
const GROUP_LABEL = { block: '内容块', variant: '变体', layout: '版式', animation: '动效', media: '媒体' };

function renderGrid() {
  const box = document.getElementById('grid');
  const byGroup = {};
  for (const cap of CAPABILITIES) (byGroup[cap.group] ||= []).push(cap);

  const maxCount = Math.max(1, ...Object.values(data.coverage).map(v => v.total_count));
  box.innerHTML = Object.entries(byGroup).map(([group, caps]) => {
    const cells = caps.map(cap => cellHTML(cap, maxCount)).join('');
    return `<div class="grp-row"><div class="grp-label">${GROUP_LABEL[group] || group}</div>${cells}</div>`;
  }).join('');
}

function cellHTML(cap, maxCount) {
  const cov = data.coverage[cap.key];
  const count = cov ? cov.total_count : 0;
  const runs = cov ? cov.runs_used : 0;
  let cls = 'cell';
  if (!cap.reachable) cls += ' unreachable';
  else if (count === 0) cls += ' cold';
  else if (count / maxCount > 0.3) cls += ' hot';
  const title = cap.reachable ? `${runs} 次实验中出现，共 ${count} 次` : '结构合法但当前规划器/技能注册表不会自动产出（需人工/freeform）';
  return `<div class="${cls}" title="${title}"><span class="k">${cap.key}</span><span class="n">${count}</span></div>`;
}

// ---- 条件热力图（Plot.cell） ----
function renderCondition() {
  const dim = document.getElementById('dimSel').value;
  const bucket = data.conditions[dim] || {};
  const dimValues = Object.keys(bucket);
  const reachableKeys = CAPABILITIES.filter(c => c.reachable).map(c => c.key);

  const rows = [];
  for (const dv of dimValues) {
    for (const key of reachableKeys) {
      rows.push({ dim: dv, capability: key, count: (bucket[dv] || {})[key] || 0 });
    }
  }

  const plotBox = document.getElementById('condPlot');
  plotBox.innerHTML = '';
  if (!rows.length || !window.Plot) return;
  const plot = Plot.plot({
    marginLeft: 130,
    marginBottom: 90,
    width: Math.max(500, dimValues.length * 60 + 140),
    height: reachableKeys.length * 14 + 100,
    padding: 0,
    x: { label: dim, domain: dimValues, tickRotate: -35 },
    y: { label: null, domain: reachableKeys },
    color: { type: 'sqrt', scheme: 'blues', label: '次数' },
    marks: [
      Plot.cell(rows, { x: 'dim', y: 'capability', fill: 'count', inset: 0.5 }),
      Plot.text(rows.filter(r => r.count > 0), { x: 'dim', y: 'capability', text: (d) => d.count, fontSize: 9 }),
    ],
  });
  plotBox.appendChild(plot);
}
document.getElementById('dimSel').onchange = renderCondition;

// ---- 代码版本对比 ----
function renderCodeSelectors() {
  const keys = Object.keys(data.by_code || {});
  for (const id of ['codeA', 'codeB']) {
    const sel = document.getElementById(id);
    const prev = sel.value;
    sel.innerHTML = keys.map(k => `<option value="${k}">${k}（${data.by_code[k].runs} 次）</option>`).join('');
    if (keys.includes(prev)) sel.value = prev;
  }
  if (keys.length >= 2 && document.getElementById('codeA').value === document.getElementById('codeB').value) {
    document.getElementById('codeB').selectedIndex = 1;
  }
  renderCodeDiff();
}

function renderCodeDiff() {
  const a = document.getElementById('codeA').value;
  const b = document.getElementById('codeB').value;
  const box = document.getElementById('codeDiff');
  if (!a || !b || !data.by_code[a] || !data.by_code[b]) { box.innerHTML = '<p style="color:var(--dim);font-size:12px">需要至少 2 个代码版本才能对比。</p>'; return; }
  const ca = data.by_code[a].coverage, cb = data.by_code[b].coverage;
  const keys = [...new Set([...Object.keys(ca), ...Object.keys(cb)])].sort();
  const rows = keys.map(k => {
    const va = ca[k] || 0, vb = cb[k] || 0;
    return { k, va, vb, delta: vb - va };
  }).filter(r => r.delta !== 0).sort((x, y) => Math.abs(y.delta) - Math.abs(x.delta));

  if (!rows.length) { box.innerHTML = '<p style="color:var(--dim);font-size:12px">这两个版本之间的能力使用没有差异。</p>'; return; }
  box.innerHTML = `<table><tr><th>能力</th><th class="n">A: ${a}</th><th class="n">B: ${b}</th><th class="n">变化</th></tr>
    ${rows.map(r => `<tr><td>${r.k}</td><td class="n">${r.va}</td><td class="n">${r.vb}</td>
      <td class="n ${r.delta > 0 ? 'up' : 'down'}">${r.delta > 0 ? '+' : ''}${r.delta}</td></tr>`).join('')}
  </table>`;
}
document.getElementById('codeA').onchange = renderCodeDiff;
document.getElementById('codeB').onchange = renderCodeDiff;

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
