<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>讲义</title>
<link rel="stylesheet" href="vendor/reveal/reveal.css">
<link rel="stylesheet" href="vendor/reveal/monokai.css">
<link rel="stylesheet" href="vendor/codemirror/lib/codemirror.css">
<link rel="stylesheet" href="vendor/codemirror/theme/eclipse.css">

<style>
  /* ===================== Cartesian 设计系统（运行时壳） ======================
     内容不在本文件——一切内容来自 course.lecture.json（LectureDoc v1，
     见 schema/SPEC.md），由 doc-to-deck.js 渲染。本文件只负责视觉与静态 chrome。
     暖沙米色画布 + Playfair Display(仅 400 字重)衬线标题 + Inter 正文。
     五色克制调色板，没有任何强调色——层级靠字号对比、1px 细线、留白构建。
     参考: refs/frontend-slides/bold-template-pack/templates/cartesian/design.md */
  /* ===== 主题 token 层 =====
     一份讲义的所有视觉都从"一套选定主题的 token"流出（doc.theme → <html data-theme>）。
     加一套主题 = 加一个 token 块（+ 可选主题作用域装饰规则），渲染器零改动。
     结构性 CSS 只消费 token，绝不写死色值/字体。 */
  :root, :root[data-theme="cartesian"]{
    /* Cartesian —— 暖沙米色 + Playfair 衬线，克制留白 */
    --bg:#EDE8E0; --bg2:#E2DBD1; --ink:#1A1A1A; --text2:#5A5A5A; --accent:#8A8178; --line:#B8B0A4;
    --card:var(--bg2);
    --serif:'Playfair Display','Noto Serif SC',Georgia,serif;
    --sans:'Inter','Noto Serif SC',sans-serif;
    --mono:'DM Mono',ui-monospace,Consolas,monospace; /* 仅用于真实代码/公式，不用于界面文案 */
    --radius:0px;
    --sel:rgba(138,129,120,.25);
    --page-bg-image:none;      /* 页面底纹（Cartesian 无） */
    --cover-bg:var(--bg);      /* 封面底色（Cartesian 与内页同色） */
    /* —— 设计 token 基础层（DESIGN_RESEARCH）—— 字阶按主题参数化以拉开个性；间距/行宽主题不变 —— */
    /* Cartesian：editorial 衬线，比率 ~1.333（保持现有观感） */
    --fs-caption:14px; --fs-body:20px; --fs-lead:21px; --fs-h2:42px; --fs-h1:56px; --fs-hero:74px;
    /* 模数间距刻度（8px 基线）+ gutter + 节奏间距（非均匀：休息 vs 组内） */
    --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-5:48px; --sp-6:64px;
    --sp-gutter:24px; --sp-rest:40px; --sp-tight:12px;
    --measure:36em;            /* 正文/抽句最大行宽（中文 ~36 字，控制 CPL） */
  }
  :root[data-theme="cobalt-grid"]{
    /* Cobalt Grid —— 电钴蓝双色 risograph 研究公报：暖米纸 + 方格坐标纸 + 封面反相 */
    --bg:#F0EBDE; --bg2:#E6E0CE; --ink:#1F2BE0; --text2:#5560E5; --accent:#5560E5; --line:rgba(31,43,224,.28);
    --card:var(--bg2);
    --serif:'Newsreader','Noto Serif SC',Georgia,serif;
    --sans:'Hanken Grotesk','Noto Serif SC',sans-serif;
    --mono:'DM Mono',ui-monospace,Consolas,monospace;
    --radius:0px;
    --sel:rgba(31,43,224,.18);
    --page-bg-image:linear-gradient(to right, rgba(31,43,224,.09) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(31,43,224,.09) 1px, transparent 1px);
    --cover-bg:#1F2BE0;        /* 封面反相为整版钴蓝 */
    /* Cobalt：研究公报，比率 ~1.25（标题略收、更报纸感） */
    --fs-caption:13px; --fs-body:20px; --fs-lead:20px; --fs-h2:39px; --fs-h1:50px; --fs-hero:66px;
  }
  /* 封面文字在反相底上需翻成纸色——仅在 cover 作用域内覆盖这几个 token，内页不受影响 */
  :root[data-theme="cobalt-grid"] section.cover{
    --ink:#F0EBDE; --text2:rgba(240,235,222,.78); --accent:rgba(240,235,222,.72); --line:rgba(240,235,222,.4);
  }
  :root[data-theme="lab"]{
    /* Lab —— precision instrument（示波器/仪表台，借鉴 GenUI lab-dark）：暗磷光舞台 + 单一 phosphor accent，
       专给物理/化学/算法仿真：canvas 的活迹在暗底上最醒目。全套结构 CSS 只消费 token，故整份讲义随之变仪表感。 */
    --bg:#131028; --bg2:#0F0C20; --ink:#E8E0F0; --text2:#A89BBE; --accent:#22D3EE; --line:rgba(168,155,190,.20);
    --card:#1B1740;
    --serif:'Inter','Noto Serif SC',sans-serif;   /* 仪表台不用衬线展示体，标题走干净无衬线 */
    --sans:'Inter','Noto Serif SC',sans-serif;
    --mono:'DM Mono',ui-monospace,Consolas,monospace;
    --radius:6px;
    --sel:rgba(34,211,238,.24);
    --page-bg-image:linear-gradient(to right, rgba(168,155,190,.06) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(168,155,190,.06) 1px, transparent 1px);
    --cover-bg:#0F0C20;
    /* Lab：仪表台，比率 ~1.18（更平、更技术、字号整体收敛） */
    --fs-caption:13px; --fs-body:19px; --fs-lead:18px; --fs-h2:34px; --fs-h1:44px; --fs-hero:56px;
  }
  :root[data-theme="slate"]{
    /* Slate —— 冷灰绘图纸 + Newsreader 衬线 + 单一琥珀强调：冷静克制的编辑/工程气质，
       与暖沙 cartesian、钴蓝 cobalt、暗仪表 lab 拉开。无底纹，层级靠留白 + 发丝线 + 单一暖强调色。 */
    --bg:#E7E9EB; --bg2:#DEE1E4; --ink:#1C2126; --text2:#586069; --accent:#A6692A; --accent-ink:#805016; --line:#C4CACE;
    --card:var(--bg2);
    --serif:'Newsreader','Noto Serif SC',Georgia,serif;
    --sans:'Inter','Noto Serif SC',sans-serif;
    --mono:'DM Mono',ui-monospace,Consolas,monospace;
    --radius:0px;
    --sel:rgba(166,105,42,.20);
    --page-bg-image:none;      /* 无底纹（与 cobalt/lab 方格拉开） */
    --cover-bg:var(--bg);      /* 浅色封面（同 cartesian，避免反相复杂度） */
    /* Slate：editorial 衬线，比率 ~1.28（比 cartesian 略收） */
    --fs-caption:13px; --fs-body:19px; --fs-lead:20px; --fs-h2:40px; --fs-h1:54px; --fs-hero:70px;
  }
  /* ============ 扩展主题库（移植自 bold-template-pack，token 化，渲染器零改） ============ */

    --radius:4px; --sel:rgba(15,26,92,.16); --page-bg-image:none; --cover-bg:#0F1A5C;

  :root[data-theme="emerald-editorial"] section.cover{ --ink:#F1E9D6; --text2:rgba(241,233,214,.78); --accent:#3CD896; --line:rgba(241,233,214,.4); }

  :root[data-theme="coral"]{

    --card:#242422;
    --serif:'Bebas Neue','Noto Serif SC',Georgia,serif;
    --sans:'Inter','Noto Serif SC',sans-serif;
    --mono:'DM Mono',ui-monospace,Consolas,monospace;
    --radius:4px; --sel:rgba(232,93,93,.28); --page-bg-image:none; --cover-bg:#1A1A1A;
    --fs-caption:13px; --fs-body:20px; --fs-lead:22px; --fs-h2:48px; --fs-h1:66px; --fs-hero:92px;
  }
  :root[data-theme="studio"]{
    /* 高压工作室——近黑底 + 暖骨白字 + 电黄强调 + Hanken Grotesk，最响 */
    --bg:#1C1C1C; --bg2:#242422; --ink:#EDE6D0; --text2:rgba(237,230,208,.6); --accent:#F5D200; --line:#2E2E2C;
    --card:#242422;
    --serif:'Hanken Grotesk','Noto Serif SC',sans-serif;
    --sans:'Hanken Grotesk','Noto Serif SC',sans-serif;
    --mono:'DM Mono',ui-monospace,Consolas,monospace;
    --radius:2px; --sel:rgba(245,210,0,.26); --page-bg-image:none; --cover-bg:#1C1C1C;
    --fs-caption:13px; --fs-body:19px; --fs-lead:20px; --fs-h2:42px; --fs-h1:56px; --fs-hero:74px;

  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--bg); }
  /* ---------- base ---------- */
  .reveal{ font-family:var(--sans); font-size:26px; color:var(--ink); }
  .reveal-viewport{ background-color:var(--bg); background-image:var(--page-bg-image); background-size:32px 32px; }
  .reveal .slides section{ text-align:left; top:0!important; height:100%; padding:0; }
  .reveal h1,.reveal h2,.reveal h3{ color:var(--ink); font-family:var(--serif); font-weight:400;
    text-transform:none; letter-spacing:-.005em; text-shadow:none; line-height:1.1; margin:0; }
  .reveal p{ line-height:1.65; } .reveal strong{ color:var(--ink); font-weight:600; }
  .reveal em{ color:var(--ink); font-style:italic; font-weight:400; font-family:var(--serif); }
  .reveal b{ color:var(--ink); font-family:var(--serif); font-weight:400; font-style:italic; }
  .reveal a{ color:var(--ink); }
  .reveal .slide-number{ background:transparent; color:var(--accent); font-family:var(--sans); font-size:12px;
    font-weight:500; letter-spacing:.06em; right:44px; bottom:28px; }
  .reveal .progress{ color:var(--accent); height:1px; background:var(--line); }
  .reveal ::selection{ background:var(--sel); }

  /* 圆规作图式装饰环——纯氛围，不承载信息 */
  .geo-ring{ position:absolute; border:1px solid var(--line); border-radius:50%; opacity:.4; pointer-events:none; z-index:0; }
  .geo-ring::before{ content:''; position:absolute; inset:13%; border:1px dashed var(--line); border-radius:50%; opacity:.7; }
  .h-accent{ width:170px; height:1px; background:var(--ink); }

  /* content slide scaffold */
  .reveal .pad, .reveal .pad *{ box-sizing:border-box; }
  .pad{ padding:64px 90px 66px; height:100%; display:flex; flex-direction:column; position:relative; z-index:1; }
  .eyebrow{ font-family:var(--sans); font-size:var(--fs-caption); font-weight:500; color:var(--accent); margin-bottom:16px; letter-spacing:.04em; }
  .reveal h2.headline{ font-size:var(--fs-h2); margin-bottom:10px; }
  .lead{ color:var(--text2); font-family:var(--sans); font-size:var(--fs-lead); margin:6px 0 22px; max-width:var(--measure); line-height:1.55; }
  .body{ flex:1; min-height:0; }

  /* bullets — 序数用 Playfair 衬线数字 */
  ul.pts{ list-style:none; margin:0; padding:0; counter-reset:pts; }
  ul.pts li{ counter-increment:pts; position:relative; padding:15px 0 15px 44px; font-size:var(--fs-body); line-height:1.5;
    border-bottom:1px solid var(--line); color:var(--text2); font-family:var(--sans); }
  ul.pts li:last-child{ border-bottom:none; }
  ul.pts li::before{ content:counter(pts); position:absolute; left:0; top:12px;
    font-family:var(--serif); font-size:20px; color:var(--accent); }
  ul.pts li b, ul.pts li strong{ color:var(--ink); font-family:var(--serif); font-weight:400; font-style:italic; }
  ul.pts li .sub{ color:var(--accent); font-size:16px; }

  /* two column（仅用于内容天然对称的场景，如代码前后对照） */
  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:5vw; align-items:start; }
  .cols > *{ min-width:0; }   /* 防列内宽内容（长公式/宽表）撑破 1fr 网格，同 .grid-block */
  .compare-caption{ font-family:var(--sans); font-size:13px; color:var(--accent); font-weight:600; margin-bottom:6px; }

  /* 通用网格容器（grid block）——列数/gap 由渲染器内联；min-width:0 防子项撑破网格 */
  .grid-block{ display:grid; align-items:start; }
  .grid-block > *{ min-width:0; }

  /* ===== per-scene 版式：index（片内分节）与 split（锚定分栏）。颜色全走 token，不写死 ===== */
  /* index：左目录轨 + 右 stage（每子节一绝对定位 panel，仅 .show 可见，进入时上画切入） */
  .layout-index{ display:grid; grid-template-columns:230px 1fr; gap:44px; height:100%; min-height:0; }
  .scene-index{ display:flex; flex-direction:column; gap:4px; border-right:1px solid var(--line);
    padding-right:22px; align-self:center; }
  .scene-index .index-item{ display:flex; align-items:baseline; gap:10px; padding:9px 10px; border-radius:var(--radius,8px);
    cursor:pointer; color:var(--text2); font-family:var(--sans); font-size:16px; line-height:1.35;
    transition:background .15s, color .15s; }
  .scene-index .index-item .n{ font-family:var(--mono,monospace); font-size:12px; color:var(--line);
    border:1px solid var(--line); border-radius:5px; min-width:22px; height:22px; display:inline-grid; place-items:center; flex:none;
    transition:border-color .15s, color .15s; }
  .scene-index .index-item.done{ color:var(--text2); }
  .scene-index .index-item.done .n{ color:var(--accent); border-color:var(--accent); }
  .scene-index .index-item.on{ background:var(--panel,rgba(127,127,127,.08)); color:var(--ink); }
  .scene-index .index-item.on .n{ color:var(--accent-ink,var(--bg)); background:var(--accent); border-color:var(--accent); }
  .scene-index .index-item:hover{ color:var(--ink); }
  .step-stage{ position:relative; min-width:0; min-height:0; }
  .step-panel{ position:absolute; inset:0; display:flex; flex-direction:column; gap:16px; justify-content:center;
    opacity:0; visibility:hidden; transform:translateY(16px); transition:opacity .32s ease, transform .32s ease;
    pointer-events:none; }
  .step-panel.show{ opacity:1; visibility:visible; transform:none; pointer-events:auto; }
  .step-frags{ position:absolute; width:0; height:0; overflow:hidden; }
  .step-frags .step-frag{ display:block; }   /* 隐形 fragment 哨兵：仅用于驱动 reveal 步进 */

  /* split：左锚常驻 + 右主栏；中缝分割线（token 色）+ 轻阴影分隔 */
  .layout-split{ align-items:stretch; height:100%; min-height:0; }
  .layout-split .split-col{ min-width:0; }
  .split-anchor{ display:flex; flex-direction:column; gap:14px; justify-content:center;
    padding-right:38px; border-right:1px solid var(--line);
    box-shadow:12px 0 22px -20px var(--line); }   /* 阴影走 token：暗主题上黑影不可见，用 --line 使各主题皆有恰当的分栏分离感 */
  .split-main{ display:flex; flex-direction:column; gap:16px; justify-content:center; padding-left:4px; }

  /* ===== compose 中间层：12 列区域图 + role 语义样式（freeform 与固定版式之间） ===== */
  .layout-compose{ height:100%; min-height:0; align-content:center; }
  .layout-compose .compose-area{ min-width:0; display:flex; flex-direction:column; gap:var(--sp-2); }
  /* role-aside 旁注：退后半级——窄栏 + 发丝分隔线 + 低对比小字，顶对齐 */
  .layout-compose .role-aside{ font-size:var(--fs-caption); color:var(--text2); border-left:1px solid var(--line);
    padding-left:var(--sp-3); align-self:start; }
  .layout-compose .role-caption{ font-size:var(--fs-caption); color:var(--text2); }
  .layout-compose .role-feature{ align-self:center; }

  /* 无障碍：尊重系统“减少动态效果”——关掉切入动画（避免眩晕） */
  @media (prefers-reduced-motion: reduce){
    .step-panel{ transition:none; transform:none; }
    .scene-index .index-item, .scene-index .index-item .n{ transition:none; }
  }

  /* callout — 顶部 1px 细线 + 无底色 */
  .callout{ border-top:1px solid var(--line); background:transparent; border-radius:0;
    padding:16px 0 2px; font-size:19px; line-height:1.55; color:var(--text2); font-family:var(--sans); }
  .callout .k{ font-family:var(--sans); font-size:12px; letter-spacing:.02em; color:var(--accent);
    font-weight:600; display:block; margin-bottom:8px; }
  .callout b{ color:var(--ink); font-family:var(--serif); font-weight:400; font-style:italic; }

  /* agenda-row — 单列等高列表 */
  .agenda{ display:flex; flex-direction:column; }
  .agenda-row{ display:grid; grid-template-columns:56px 1fr; gap:18px; padding:16px 0; border-bottom:1px solid var(--line); align-items:baseline; }
  .agenda-row:last-child{ border-bottom:none; }
  .agenda-row .num{ font-family:var(--serif); font-size:24px; color:var(--accent); }
  .agenda-row .k{ font-family:var(--sans); font-size:13px; font-weight:600; color:var(--accent); display:block; margin-bottom:5px; }
  .agenda-row .v{ font-family:var(--sans); font-size:18px; color:var(--text2); line-height:1.5; }
  .agenda-row .v b{ color:var(--ink); font-family:var(--serif); font-weight:400; font-style:italic; }

  /* freeform 逃生舱 — 有意做得显眼，绝不悄悄融入正常排版（见 schema/SPEC.md §3.3） */
  .freeform{ border:1.5px dashed var(--accent); border-radius:0; padding:16px 18px; }
  .freeform-flag{ font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.02em;
    color:var(--accent); margin-bottom:12px; }
  .freeform-body{ font-family:var(--sans); font-size:18px; color:var(--text2); line-height:1.5; }
  .freeform-rationale{ margin-top:12px; padding-top:10px; border-top:1px dashed var(--line);
    font-family:var(--sans); font-size:13px; color:var(--accent); font-style:italic; }

  /* table — ledger 风格 */
  table.tbl{ border-collapse:collapse; width:100%; font-size:18px; background:transparent; border-radius:0; box-shadow:none; font-family:var(--sans); }
  table.tbl th{ background:transparent; color:var(--accent); font-family:var(--sans); font-size:13px; font-weight:600;
    text-align:left; padding:10px 14px; border-bottom:1.5px solid var(--line); }
  table.tbl td{ padding:12px 14px; border-bottom:1px solid var(--line); color:var(--text2); vertical-align:top; line-height:1.42; }
  table.tbl tr:last-child td{ border-bottom:none; }
  table.tbl td:first-child{ color:var(--ink); font-family:var(--serif); font-weight:400; font-size:1.05em; }
  table.tbl .hi{ color:var(--ink); font-weight:600; }

  /* chart */
  .chart-block .plotwrap{ background:transparent; border:1px solid var(--line); border-radius:0; padding:12px;
    max-width:100%; overflow-x:auto; }   /* 与 .mblock/.tbl 同款扁平编辑风；横向自滚动防溢出 */
  .chart-block .cite{ margin-top:8px; }

  /* math */
  .mi{ font-family:var(--mono); font-style:italic; color:var(--ink); background:transparent; padding:0 2px; }
  .mblock{ text-align:center; font-family:var(--mono); font-size:27px; color:var(--ink); background:transparent;
    border:1px solid var(--line); border-radius:0; padding:18px; margin:4px 0;
    max-width:100%; overflow-x:auto; }   /* 超长公式横向自滚动，绝不撑破页面（红线：逐页 0 横向溢出） */
  .mblock .katex-display{ margin:0; }

  /* block 渲染失败的降级占位（红线兜底：一个坏块不拖垮整份讲义，见 doc-to-deck renderBlock） */
  .block-error{ border:1px dashed var(--line); border-radius:0; padding:14px 16px; margin:4px 0;
    font-family:var(--sans); background:transparent; }
  .block-error-t{ font-size:14px; font-weight:600; color:var(--accent); margin-bottom:4px; }
  .block-error-m{ font-size:12px; color:var(--text2); font-family:var(--mono); line-height:1.5; word-break:break-word; }

  /* diagram flow */
  .flow{ display:flex; align-items:center; justify-content:center; gap:0; flex-wrap:wrap; margin:6px 0; }
  .node{ padding:14px 22px; border-radius:0; border:1px solid var(--line); background:transparent; font-weight:400;
    font-family:var(--serif); font-size:21px; color:var(--ink); text-align:center; box-shadow:none; }
  .node .t{ font-family:var(--sans); font-size:12px; color:var(--accent); font-weight:500; display:block; margin-top:4px; }
  .node.on{ border-color:var(--ink); border-width:1.5px; }
  .node.q{ border-style:dashed; opacity:.6; }
  .arrow{ color:var(--line); font-size:20px; margin:0 14px; }
  .loop-note{ margin-left:14px; color:var(--accent); font-family:var(--sans); font-size:15px; }

  /* code card — 浅石色面板 */
  .codecard{ background:var(--bg2); border:1px solid var(--line); border-radius:0; overflow:hidden; box-shadow:none; }
  .codecard .bar{ display:flex; align-items:center; gap:7px; padding:9px 16px; border-bottom:1px solid var(--line); }
  .codecard .bar .d{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .codecard .bar .lbl{ margin-left:8px; font-family:var(--sans); font-size:12px; color:var(--accent); }
  .reveal .codecard pre{ margin:0; box-shadow:none; width:100%; background:transparent; }
  .reveal .codecard code{ font-family:var(--mono); font-size:15px; line-height:1.6; background:transparent; padding:16px 18px; }
  .codecard code, .codecard code *{ color:var(--ink) !important; background:transparent !important; font-style:normal !important; font-family:var(--mono) !important; font-weight:400 !important; }
  .codecard code .hljs-comment{ color:var(--text2) !important; }

  /* cover — 底色由 --cover-bg 决定（Cartesian 同内页 / Cobalt 反相钴蓝）；文字走 token，反相由 cover 作用域 token 覆盖处理 */
  section.cover{ background:var(--cover-bg); }
  .cover .inner{ position:relative; color:var(--ink); padding:0 96px; z-index:2; }
  .cover .pad{ justify-content:center; }
  .cover .tag{ font-family:var(--sans); font-size:14px; font-weight:500; color:var(--accent); margin-bottom:22px; }
  .reveal .cover h1{ color:var(--ink); font-size:var(--fs-hero); line-height:1.12; letter-spacing:-.008em; max-width:19ch; }
  .cover .sub{ font-family:var(--sans); font-size:19px; color:var(--text2); margin-top:20px; max-width:42ch; line-height:1.6; }
  .cover .facts{ margin-top:28px; font-family:var(--sans); font-size:14px; color:var(--accent); }
  .cover .h-accent{ margin:26px 0 0; }
  .cover .hint{ margin-top:36px; font-size:13px; font-family:var(--sans); color:var(--line); }

  /* big idea / statement —— 金句页：大号衬线 pull-quote，纵向居中，一道强调短杠作锚点，撑满画面 */
  section.bigidea .pad{ justify-content:center; }
  section.bigidea .body{ display:flex; flex-direction:column; justify-content:center; }
  .bigidea .q{ font-family:var(--serif); font-size:54px; font-weight:400; line-height:1.24; color:var(--ink); max-width:24ch; position:relative; }
  .bigidea .q::before{ content:""; display:block; width:60px; height:4px; background:var(--accent); border-radius:2px; margin-bottom:30px; }
  .bigidea .q em{ color:var(--accent); font-style:italic; }   /* 强调=主色高亮,不再是同色随机斜体(去 AI 味) */
  .q-sub{ display:block; margin-top:18px; font-size:24px; color:var(--text2); font-weight:400; font-family:var(--sans); line-height:1.5; }
  .bigidea .cite{ margin-top:24px; color:var(--accent); font-family:var(--sans); font-size:15px; }

  /* section divider —— 章节分隔页：巨号序号 + 章节名 + 一句主旨，给讲义打节拍(书籍 part-title 式) */
  section.divider .pad{ justify-content:center; }
  .section-num{ font-family:var(--serif); font-size:112px; font-weight:400; line-height:.9; color:var(--accent); letter-spacing:-.02em; }
  .section-num + .eyebrow{ margin-top:20px; }
  .divider .section-title{ font-family:var(--serif); font-size:50px; font-weight:400; line-height:1.18; color:var(--ink); margin-top:6px; max-width:22ch; }
  .divider .section-title em{ color:var(--accent); font-style:italic; }
  .section-dek{ font-family:var(--sans); font-size:20px; font-weight:400; color:var(--text2); margin-top:18px; max-width:44ch; line-height:1.55; padding-top:18px; border-top:2px solid var(--line); display:inline-block; }

  /* pullquote —— 编辑级抽句：左竖条 + 斜体衬线大字旁置，正文流中的呼吸点（DESIGN_RESEARCH T12） */
  .pullquote{ border-left:4px solid var(--accent); padding-left:var(--sp-3); margin:var(--sp-rest) 0; max-width:var(--measure); }
  .pullquote-text{ font-family:var(--serif); font-style:italic; font-weight:400; font-size:var(--fs-h2); line-height:1.28; color:var(--ink); }
  .pullquote-text em{ font-style:normal; color:var(--accent); }   /* 抽句内强调反转为正体主色，避免整句斜体里再斜体 */
  .pullquote-cite{ margin-top:var(--sp-2); font-family:var(--sans); font-style:normal; font-size:var(--fs-caption); font-weight:500; letter-spacing:.02em; color:var(--accent); }
  .pullquote-cite::before{ content:"— "; }
  .cite{ color:var(--accent); font-family:var(--sans); font-size:15px; }

  /* quiz */
  .quiz-context{ font-family:var(--mono); color:var(--text2); margin-bottom:16px; }
  .quiz .choice{ display:flex; align-items:center; gap:16px; padding:15px 4px; border:none; border-bottom:1px solid var(--line);
    border-radius:0; margin-bottom:0; cursor:pointer; background:transparent; transition:.12s; font-size:19px; font-family:var(--sans); color:var(--text2); }
  .quiz .choice:hover{ background:var(--panel, rgba(127,127,127,.08)); }   /* 走 token：原硬编码 cartesian 沙色在钴蓝/暗仪表/石板上是错主题色 */
  .quiz .choice .k{ font-family:var(--serif); font-weight:400; color:var(--accent); width:22px; font-size:19px; }
  .quiz .choice.correct{ border-bottom:1.5px solid var(--ink); color:var(--ink); font-weight:500; }
  .quiz .choice.correct .k{ color:var(--ink); }
  .quiz .choice.wrong{ color:var(--line); text-decoration:line-through; }
  .quiz .choice.wrong .k{ color:var(--line); }
  .quiz .explain{ display:none; margin-top:14px; padding:16px 0 2px; border-radius:0; font-size:18px; line-height:1.58;
    background:transparent; border-top:1px solid var(--line); color:var(--text2); font-family:var(--sans); }
  .quiz .explain.show{ display:block; } .quiz .explain b{ color:var(--ink); font-family:var(--serif); font-style:italic; font-weight:400; }

  /* ---------- interactive lab (Observable Plot · Quarto/OJS 技术方案) ---------- */
  .labbar{ display:flex; align-items:center; gap:24px; margin-bottom:16px; flex-wrap:wrap; }
  .labbar .ctl{ display:flex; align-items:center; gap:12px; }
  .labbar label, .lab .ctl label{ font-size:15px; color:var(--ink); font-family:var(--sans); font-weight:500; white-space:nowrap; }
  .labbar label .v{ font-family:var(--mono); color:var(--ink); font-weight:500; }
  .labbar input[type=range]{ width:200px; accent-color:var(--ink); }
  .labbar .legend{ margin-left:auto; font-size:13px; color:var(--accent); font-family:var(--sans); }
  .btn{ background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:0; padding:8px 16px; font-size:13px;
    font-weight:500; cursor:pointer; font-family:var(--sans); }
  .btn:hover{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .charts{ display:flex; gap:20px; justify-content:center; }
  .mini{ background:transparent; border:1px solid var(--line); border-radius:0; padding:10px 12px 4px; }
  .mini.win{ border-color:var(--ink); border-width:1.5px; }
  .mini .mtitle{ display:flex; justify-content:space-between; align-items:baseline; font-size:14px; font-weight:500; font-family:var(--sans);
    color:var(--ink); margin-bottom:2px; padding:0 4px; }
  .mini .mtitle b{ font-family:var(--mono); font-weight:500; color:var(--text2); font-style:normal; }
  /* timeline：竖向时间线（左侧发丝线 + 节点圆点，全部走 token） */
  .timeline{ display:flex; flex-direction:column; border-left:1.5px solid var(--line); margin-left:6px; }
  .tl-item{ position:relative; padding:6px 0 16px 24px; }
  .tl-item::before{ content:''; position:absolute; left:-6px; top:11px; width:9px; height:9px; border-radius:50%; background:var(--accent); }
  .tl-item:last-child{ padding-bottom:2px; }
  .tl-time{ font-family:var(--mono); font-size:14px; color:var(--accent); letter-spacing:.02em; }
  .tl-title{ font-family:var(--serif); font-size:22px; color:var(--ink); line-height:1.2; margin-top:1px; }
  .tl-desc{ font-family:var(--sans); font-size:17px; color:var(--text2); line-height:1.5; margin-top:3px; }
  .mini svg, .plotwrap svg{ display:block; }
  /* widget 引擎：sandbox iframe 填满 sim body 区（单 sim 页时 root 会被加 .body → flex:1） */
  .widlab{ display:flex; flex-direction:column; gap:12px; }
  .widframe{ flex:1; min-height:0; width:100%; border:1px solid var(--line); border-radius:0; background:transparent; display:block; }
  .widcap{ font-family:var(--sans); font-size:14px; color:var(--text2); }

  .lab{ display:grid; grid-template-columns:280px 1fr; gap:5vw; align-items:stretch; }
  .lab .panel{ background:transparent; border:1px solid var(--line); border-radius:0; padding:20px;
    display:flex; flex-direction:column; gap:16px; }
  .lab .ctl label{ display:block; margin-bottom:10px; }
  .lab .ctl label .v{ float:right; font-family:var(--mono); color:var(--ink); }
  .lab .ctl input[type=range]{ width:100%; accent-color:var(--ink); }
  .lab .badge{ border-radius:0; padding:14px 0 4px; font-size:14px; line-height:1.5; border-top:1px solid var(--line); font-family:var(--sans); color:var(--text2); }
  .lab .badge .rt{ font-weight:400; font-family:var(--serif); font-style:italic; font-size:19px; display:block; margin-bottom:6px; color:var(--ink); }
  .lab .codecard .bar{ padding:8px 12px; } .lab .codecard code{ font-size:13.5px; padding:12px 14px; line-height:1.5; }
  .lab .plotwrap{ background:transparent; border:1px solid var(--line); border-radius:0; padding:12px;
    display:flex; align-items:center; justify-content:center; }
  .sim-note{ font-family:var(--sans); font-size:14px; color:var(--text2); text-align:center; max-width:32ch; line-height:1.5; }

  /* doc 加载失败的诚实错误面板（iter75）：不静默白屏；token 化、居中、指向定位方法 */
  .doc-error{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:var(--sp-2); background:var(--bg); color:var(--ink); font-family:var(--sans); z-index:99; padding:var(--sp-5); text-align:center; }
  .doc-error-title{ font-family:var(--serif); font-size:var(--fs-h2); }
  .doc-error-file{ font-family:var(--mono); font-size:var(--fs-body); color:var(--accent); }
  .doc-error-msg{ font-family:var(--mono); font-size:var(--fs-caption); color:var(--text2); max-width:64ch; }
  .doc-error-hint{ font-size:var(--fs-caption); color:var(--text2); border-top:1px solid var(--line); padding-top:var(--sp-2); margin-top:var(--sp-2); max-width:52ch; }

  /* video 一等视频块：本地视频播放，视觉走 token；居中、限高不撑破内容盒 */
  .video-block{ display:flex; flex-direction:column; align-items:center; gap:var(--sp-2); max-width:var(--measure); margin:0 auto; }
  .video-block video{ width:100%; max-height:60vh; background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius); display:block; }
  .video-note{ font-family:var(--sans); font-size:var(--fs-caption); color:var(--text2); border:1px dashed var(--line); border-radius:var(--radius); padding:var(--sp-4) var(--sp-5); text-align:center; }
  .video-cap{ font-family:var(--sans); font-size:var(--fs-caption); color:var(--text2); line-height:1.5; align-self:flex-start; }
  .video-cap em{ color:var(--accent); }

  /* ---------- runnable code cell (Quarto/quarto-live 技术方案: Pyodide + CodeMirror) ---------- */
  .runlab{ display:grid; grid-template-columns:1fr 1fr; gap:4vw; align-items:stretch; }
  .editor-col{ display:flex; flex-direction:column; min-height:0; }
  .rc-tabs{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .rc-tabs [data-lang]{ font-family:var(--mono); font-size:12px; padding:7px 16px; border:1px solid var(--line);
    background:transparent; color:var(--text2); border-radius:0; cursor:pointer; }
  .rc-tabs [data-lang].on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .rc-run{ margin-left:auto; background:var(--ink); color:var(--bg); border:1px solid var(--ink); border-radius:0; padding:7px 20px;
    font-weight:500; font-size:14px; cursor:pointer; font-family:var(--sans); }
  .rc-run:hover{ background:transparent; color:var(--ink); }
  .rc-run:disabled{ opacity:.5; cursor:default; }
  .rc-reset{ background:transparent; border:1px solid var(--line); color:var(--accent); border-radius:0;
    padding:7px 12px; font-size:13px; cursor:pointer; font-family:var(--sans); }
  .rc-editor-anchor{ flex:1; min-height:0; visibility:hidden; }
  .rc-editor-portal{ position:fixed; z-index:45; display:none; border:1px solid var(--line); border-radius:0;
    overflow:hidden; background:var(--bg2); box-shadow:none; }
  .rc-editor-portal .CodeMirror{ height:100%; font-family:var(--mono); font-size:14px; line-height:1.5;
    background:var(--bg2) !important; color:var(--ink) !important; }
  .rc-editor-portal .CodeMirror-gutters{ background:var(--bg2) !important; border-right:1px solid var(--line) !important; }
  .rc-editor-portal .CodeMirror-linenumber{ color:var(--accent) !important; font-family:var(--mono); }
  .rc-editor-portal .CodeMirror-cursor{ border-left-color:var(--ink) !important; }
  .rc-editor-portal .CodeMirror-selected{ background:rgba(26,26,26,.1) !important; }
  .rc-editor-portal .CodeMirror .cm-comment{ color:var(--text2) !important; }
  .rc-editor-portal .CodeMirror .cm-keyword,.rc-editor-portal .CodeMirror .cm-string,
  .rc-editor-portal .CodeMirror .cm-number,.rc-editor-portal .CodeMirror .cm-def,
  .rc-editor-portal .CodeMirror .cm-variable,.rc-editor-portal .CodeMirror .cm-variable-2,
  .rc-editor-portal .CodeMirror .cm-operator,.rc-editor-portal .CodeMirror .cm-property,
  .rc-editor-portal .CodeMirror .cm-atom{ color:var(--ink) !important; }
  .out-col{ display:flex; flex-direction:column; gap:12px; min-height:0; }
  .rc-plot{ background:transparent; border:1px solid var(--line); border-radius:0; padding:10px;
    display:flex; align-items:center; justify-content:center; height:308px; flex:none; }
  .rc-plot svg{ display:block; }
  .rc-console{ background:var(--bg2); color:var(--ink); border:1px solid var(--line); border-radius:0; padding:12px 15px; font-family:var(--mono);
    font-size:13px; line-height:1.55; white-space:pre-wrap; flex:1; overflow:auto; min-height:0; }
  .rc-console .err{ color:var(--ink); text-decoration:underline wavy; }
  .rc-console .k{ color:var(--text2); }
  .rc-hint{ color:var(--accent); font-size:14px; text-align:center; font-family:var(--sans); }

  /* fixed chrome — 底部左下角工具条，方形按钮 1px 细线 */
  .ppt-bar{ position:fixed; left:24px; bottom:24px; z-index:60; display:flex; align-items:center; gap:0;
    border-radius:0; background:var(--bg); border:1px solid var(--line); box-shadow:none; padding:0; }
  .ppt-bar button{ width:40px; height:40px; border-radius:0; border:none; border-right:1px solid var(--line); background:transparent;
    color:var(--ink); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .12s,color .12s; }
  .ppt-bar button:last-child{ border-right:none; }
  .ppt-bar button:hover{ background:var(--ink); color:var(--bg); }
  .ppt-bar button.on{ background:var(--ink); color:var(--bg); }
  .ppt-bar .sep{ width:1px; height:22px; background:var(--line); margin:0; }

  /* notes overlay */
  .notes-ov{ position:fixed; left:0; right:0; bottom:0; z-index:55; background:var(--bg); border-top:1px solid var(--line);
    padding:18px 32px; font-size:15px; color:var(--text2); line-height:1.7; display:none; max-height:34vh; overflow-y:auto; box-shadow:none; font-family:var(--sans); }
  .notes-ov.show{ display:block; }
  .notes-ov .lbl{ font-family:var(--sans); font-size:12px; color:var(--accent); font-weight:600; margin-bottom:8px; }
  .notes-ov b{ color:var(--ink); font-family:var(--serif); font-style:italic; font-weight:400; }

  /* tutor */
  .tutor-panel{ position:fixed; top:0; right:-400px; width:380px; height:100%; z-index:70; background:var(--bg);
    border-left:1px solid var(--line); display:flex; flex-direction:column; transition:right .25s ease; box-shadow:none; }
  .tutor-panel.open{ right:0; }
  .tp-head{ display:flex; align-items:center; gap:10px; padding:20px 22px; border-bottom:1px solid var(--line); }
  .tp-head .ic{ font-size:15px; color:var(--accent); } .tp-head .h{ font-weight:400; font-family:var(--serif); font-style:italic; color:var(--ink); font-size:19px; }
  .tp-head .x{ margin-left:auto; cursor:pointer; color:var(--accent); font-size:20px; }
  .tp-ctx{ padding:12px 22px; border-bottom:1px solid var(--line); font-size:12px; color:var(--accent); background:transparent; font-family:var(--sans); }
  .tp-ctx b{ color:var(--ink); font-family:var(--sans); font-weight:600; font-style:normal; }
  .tp-body{ flex:1; overflow-y:auto; padding:20px 22px; display:flex; flex-direction:column; gap:16px; }
  .msg{ font-size:14px; line-height:1.65; font-family:var(--sans); }
  .msg.u{ align-self:flex-end; background:var(--ink); color:var(--bg); padding:10px 14px; border-radius:0; max-width:86%; }
  .msg.a{ background:transparent; border:1px solid var(--line); color:var(--text2); padding:12px 15px; border-radius:0; max-width:92%; }
  .msg.a .who{ font-family:var(--sans); font-size:11px; color:var(--accent); margin-bottom:6px; font-weight:600; }
  .tp-sugg{ padding:0 22px 14px; display:flex; flex-wrap:wrap; gap:8px; }
  .tp-sugg button{ font-size:12px; background:transparent; border:1px solid var(--line); color:var(--accent); border-radius:0; padding:6px 12px; cursor:pointer; font-family:var(--sans); }
  .tp-sugg button:hover{ border-color:var(--ink); color:var(--ink); }
  .tp-input{ padding:18px 22px; border-top:1px solid var(--line); display:flex; gap:8px; }
  .tp-input input{ flex:1; background:transparent; border:1px solid var(--line); border-radius:0; padding:11px 13px; color:var(--ink); font-size:14px; outline:none; font-family:var(--sans); }
  .tp-input input:focus{ border-color:var(--ink); }
  .tp-input button{ background:var(--ink); color:var(--bg); border:none; border-radius:0; padding:0 18px; font-weight:500; cursor:pointer; font-family:var(--sans); font-size:13px; }

  ::-webkit-scrollbar{ width:8px; height:8px; } ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:0; }
</style>
</head>
<body>
  <div class="ppt-bar">
    <button id="btnPrev" title="上一页 (←)">◀</button>
    <button id="btnNext" title="下一页 (→)">▶</button>
    <span class="sep"></span>
    <button id="btnNotes" title="演讲者备注 (N)">✎</button>
    <button id="btnOverview" title="总览 (O)">▦</button>
    <button id="btnTutor" title="AI 助教 (A)">✦</button>
  </div>

  <div class="reveal"><div class="slides" id="slides"><!-- 由 doc-to-deck.js 从 course.lecture.json 渲染 --></div></div>

    <div class="tp-ctx" id="tutorCtx"></div>
    <div class="tp-body" id="tutorBody"></div>
    <div class="tp-sugg" id="tutorSugg"></div>
    <div class="tp-input"><input id="tutorInput" placeholder="就当前这一页提问…"><button id="tutorSend">发送</button></div>
