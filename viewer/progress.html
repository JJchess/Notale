<!DOCTYPE html>
<html lang="zh-CN" data-theme="cartesian">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>讲义生成 · 进度动画（开发台）</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
  /* ===== 主题 token（与 live.html:17-53 对齐）===== */
  :root, :root[data-theme="cartesian"]{
    --bg:#EDE8E0; --bg2:#E2DBD1; --ink:#1A1A1A; --text2:#5A5A5A; --accent:#8A8178; --line:#B8B0A4;
    --serif:'Playfair Display','Noto Serif SC',Georgia,serif;
    --sans:'Inter','Noto Serif SC',sans-serif;
    --mono:'DM Mono',ui-monospace,Consolas,monospace;
    --radius:0px; --page-bg-image:none;
  }
  :root[data-theme="cobalt-grid"]{
    --bg:#F0EBDE; --bg2:#E6E0CE; --ink:#1F2BE0; --text2:#5560E5; --accent:#5560E5; --line:rgba(31,43,224,.28);
    --serif:'Newsreader','Noto Serif SC',Georgia,serif;
    --sans:'Hanken Grotesk','Noto Serif SC',sans-serif;
    --mono:'DM Mono',ui-monospace,Consolas,monospace;
    --radius:0px;
    --page-bg-image:linear-gradient(to right, rgba(31,43,224,.09) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(31,43,224,.09) 1px, transparent 1px);
  }
  :root[data-theme="lab"]{
    --bg:#131028; --bg2:#0F0C20; --ink:#E8E0F0; --text2:#A89BBE; --accent:#22D3EE; --line:rgba(168,155,190,.20);
    --serif:'Inter','Noto Serif SC',sans-serif;
    --sans:'Inter','Noto Serif SC',sans-serif;
    --mono:'DM Mono',ui-monospace,Consolas,monospace;
    --radius:6px;
    --page-bg-image:linear-gradient(to right, rgba(168,155,190,.06) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(168,155,190,.06) 1px, transparent 1px);
  }

  html,body{ margin:0; height:100%; }
  body{ background:var(--bg); background-image:var(--page-bg-image); background-size:32px 32px;
    color:var(--ink); font-family:var(--sans); display:flex; flex-direction:column; height:100vh; overflow:hidden; }

  /* 进度区（progress-view 挂这里）*/
  #view{ flex:1; min-height:0; overflow:auto; }

  /* ===== 开发控制台 ===== */
  .console{ flex:none; border-top:1px solid var(--line); background:var(--bg2);
    padding:10px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    font-family:var(--mono); font-size:12.5px; color:var(--text2); }
  .console .grp{ display:flex; align-items:center; gap:8px; }
  .console .sep{ width:1px; height:22px; background:var(--line); }
  .console .tag{ font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); }
  .console button{ font-family:var(--sans); font-size:12.5px; padding:5px 12px; cursor:pointer;
    background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:5px;
    transition:background .12s, color .12s; }
  .console button:hover{ background:color-mix(in srgb, var(--ink) 8%, transparent); }
  .console button.primary{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .console button.warn{ color:var(--ink); border-color:color-mix(in srgb, #CA4B2E 60%, var(--line)); }
  .console select{ font-family:var(--mono); font-size:12px; padding:4px 6px; background:var(--bg);
    color:var(--ink); border:1px solid var(--line); border-radius:5px; }
  .console label.chk{ display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
  .console .scrub{ flex:1; min-width:180px; display:flex; align-items:center; gap:10px; }
  .console input[type=range]{ flex:1; accent-color:var(--accent); cursor:pointer; }
  .console .clock{ white-space:nowrap; color:var(--ink); }

  /* reduced-motion 开发开关：镜像 progress-view 的 @media 规则 */
  html.reduce-motion .pv-group, html.reduce-motion .pv-cell, html.reduce-motion .pv-feed .li{ animation:none !important; opacity:1; transform:none; }
  html.reduce-motion .pv-cell.active{ box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); animation:none !important; }
  html.reduce-motion .pv-cell.rework{ box-shadow:0 0 0 2px color-mix(in srgb, #C98A2E 45%, transparent); animation:none !important; }
  html.reduce-motion .pv-step.active .dot{ animation:none; }
  html.reduce-motion .pv-bar > i{ transition:none; }
</style>
</head>
<body>
  <main id="view"></main>

  <div class="console">
    <div class="grp">
      <button id="btnPlay" class="primary">▶ 播放</button>
      <button id="btnRestart">↻ 重启</button>
      <button id="btnEnd">⏭ 末尾</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <span class="tag">速度</span>
      <select id="selSpeed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="scrub">
      <span class="tag">进度</span>
      <input id="scrub" type="range" min="0" max="1000" value="0" step="1">
      <span class="clock" id="clock">0s / 0s</span>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button id="btnFail" class="warn">✎ 注入精修</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <span class="tag">主题</span>
      <select id="selTheme">
        <option value="cartesian">cartesian</option>
        <option value="cobalt-grid">cobalt-grid</option>
        <option value="lab">lab</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <label class="chk"><input type="checkbox" id="chkReduce"> reduced-motion</label>
      <label class="chk"><input type="checkbox" id="chkPlanOnly"> plan-only</label>
    </div>
  </div>

<script type="module">
import { createProgressView } from './progress-view.js';
import { buildMockRun, nextPendingBlockIndex, Player } from './progress-mock.js';

const $ = id => document.getElementById(id);
const fmt = ms => { const s = Math.round(ms/1000); const m = Math.floor(s/60); return m ? `${m}:${String(s%60).padStart(2,'0')}` : `${s}s`; };

const view = createProgressView($('view'));

// ---- 载入真实样例 doc 作为 mock 数据来源 ----
let doc = null;
try {
  doc = await (await fetch('course.lecture.json', { cache: 'no-store' })).json();
} catch (e) {
  $('view').innerHTML = '<p style="padding:30px;color:#CA4B2E;font-family:monospace">无法加载 course.lecture.json —— 请用 <b>python viewer/serve.py</b> 或 http.server 在 viewer/ 目录下服务本页。<br>'+e+'</p>';
  throw e;
}

// ---- run 由 (seed, failIndices, planOnly) 完全决定，可确定性重建 ----
const state = { seed: 7, failIndices: new Set([5, 14]), planOnly: false };
function buildRun() { return buildMockRun(doc, state); }

let run = buildRun();
const player = new Player(view, run.events, { speed: 1, onTick });

let scrubbing = false;
function onTick({ pos, duration, playing }) {
  $('btnPlay').textContent = playing ? '⏸ 暂停' : (pos >= duration && duration ? '↻ 重播' : '▶ 播放');
  if (!scrubbing) $('scrub').value = duration ? Math.round(pos / duration * 1000) : 0;
  $('clock').textContent = `${fmt(pos)} / ${fmt(duration)}`;
}

// 重建 run（注入失败 / plan-only 切换后），并保持当前进度位置
function reloadRun() {
  const wasPlaying = player.playing;
  player.pause();
  run = buildRun();
  player.load(run.events);
  if (wasPlaying) player.play();
}

// ---- 控件 ----
$('btnPlay').onclick = () => player.toggle();
$('btnRestart').onclick = () => player.restart();
$('btnEnd').onclick = () => player.instant();
$('selSpeed').onchange = e => player.setSpeed(parseFloat(e.target.value));

$('scrub').addEventListener('pointerdown', () => { scrubbing = true; player.pause(); });
$('scrub').addEventListener('input', e => { player.seek(e.target.value / 1000 * player.duration); });
window.addEventListener('pointerup', () => { scrubbing = false; });

$('btnFail').onclick = () => {
  const idx = nextPendingBlockIndex(doc, player.pos, run);
  if (idx < 0) { alert('已没有可注入失败的待生成 block（试试先重启或后退进度）'); return; }
  state.failIndices.add(idx);
  reloadRun();
};

$('selTheme').onchange = e => view.setTheme(e.target.value);

$('chkReduce').onchange = e => document.documentElement.classList.toggle('reduce-motion', e.target.checked);

$('chkPlanOnly').onchange = e => { state.planOnly = e.target.checked; player.pause(); player.seek(0); run = buildRun(); player.load(run.events); };

// 键盘：空格播放/暂停，← → 步进 2s
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); player.toggle(); }
  else if (e.code === 'ArrowRight') player.seek(player.pos + 2000);
  else if (e.code === 'ArrowLeft') player.seek(player.pos - 2000);
});

// 自动开播
onTick({ pos: 0, duration: run.duration, playing: false });
player.play();
</script>
</body>
</html>
